                questions.push({
                    id: "10",
                    section: "31",
                    question_en: "<p>10.<span style=\"font-family: Cambria Math;\"> The first bar of MS-Word is_______ .</span></p>\n",
                    question_hi: "<p>10.<span style=\"font-family: Cambria Math;\"> MS-Word </span><span style=\"font-family: Cambria Math;\">&#2325;&#2366; &#2346;&#2361;&#2354;&#2366; &#2348;&#2366;&#2352; </span><span style=\"font-family: Cambria Math;\">(bar) _____ </span><span style=\"font-family: Cambria Math;\">&#2361;&#2376;&#2404;</span></p>\n",
                    options_en: ["<p>title bar</p>\n", "<p>menu bar</p>\n", 
                                "<p>status bar</p>\n", "<p>formatting toolbar</p>\n"],
                    options_hi: ["<p><span style=\"font-weight: 400;\">&#2335;&#2366;&#2311;&#2335;&#2354; &#2348;&#2366;&#2352; (title bar)</span></p>\n", "<p><span style=\"font-weight: 400;\">&#2350;&#2375;&#2344;&#2381;&#2351;&#2370; &#2348;&#2366;&#2352; (menu bar)</span></p>\n",
                                "<p><span style=\"font-weight: 400;\">&#2360;&#2381;&#2335;&#2375;&#2335;&#2360; &#2348;&#2366;&#2352; (status bar)</span></p>\n", "<p><span style=\"font-weight: 400;\">&#2347;&#2364;&#2377;&#2352;&#2381;&#2350;&#2375;&#2335;&#2367;&#2306;&#2327; &#2335;&#2370;&#2354;&#2348;&#2366;&#2352; (formatting toolbar)</span></p>\n"],
                    solution_en: "<p>10.(a)<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">A </span><strong><span style=\"font-family: Cambria Math;\">Title bar</span></strong><span style=\"font-family: Cambria Math;\"> represents the name of the word document that you are working on or opened on the display screen.</span></p>\r\n<p><span style=\"font-family: Cambria Math;\">The <strong>menu bar</strong></span><span style=\"font-family: Cambria Math;\"> is the part of a browser or application window, typically at the top left side, that houses drop-down menus that allow the user to interact with the content or application in various ways.</span></p>\r\n<p><span style=\"font-family: Cambria Math;\">The <strong>status bar</strong> is </span><span style=\"font-family: Cambria Math;\">the area at the bottom of the Word window</span><span style=\"font-family: Cambria Math;\">. It indicates information about the current document.</span></p>\r\n<p><span style=\"font-family: Cambria Math;\">The <strong>formatting toolbar</strong></span><span style=\"font-family: Cambria Math;\"> provides access to several text formatting functions such as font size and color, text alignment, lists, and the like. </span></p>\n",
                    solution_hi: "<p>10.(a)<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2319;&#2325; </span><span style=\"font-family: Cambria Math;\"><strong>&#2335;&#2366;&#2311;&#2335;&#2354; &#2348;&#2366;&#2352;</strong> </span><span style=\"font-family: Cambria Math;\">&#2313;&#2360; &#2357;&#2352;&#2381;&#2337; &#2337;&#2377;&#2325;&#2381;&#2351;&#2370;&#2350;&#2375;&#2306;&#2335; &#2325;&#2375; &#2344;&#2366;&#2350; &#2325;&#2366; &#2346;&#2381;&#2352;&#2340;&#2367;&#2344;&#2367;&#2343;&#2367;&#2340;&#2381;&#2357; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376; &#2332;&#2367;&#2360; &#2346;&#2352; &#2310;&#2346; &#2325;&#2366;&#2350; &#2325;&#2352; &#2352;&#2361;&#2375; &#2361;&#2376;&#2306; &#2351;&#2366; &#2337;&#2367;&#2360;&#2381;&#2346;&#2381;&#2354;&#2375; &#2360;&#2381;&#2325;&#2381;&#2352;&#2368;&#2344; </span><span style=\"font-family: Cambria Math;\">(display screen) </span><span style=\"font-family: Cambria Math;\">&#2346;&#2352; &#2326;&#2379;&#2354;&#2375; &#2327;&#2319; &#2361;&#2376;&#2306;&#2404;</span></p>\r\n<p><strong><span style=\"font-family: Cambria Math;\">&#2350;&#2375;&#2344;&#2381;&#2351;&#2370; &#2348;&#2366;&#2352;</span></strong><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2319;&#2325; &#2348;&#2381;&#2352;&#2366;&#2313;&#2332;&#2364;&#2352; &#2351;&#2366; &#2319;&#2346;&#2381;&#2354;&#2367;&#2325;&#2375;&#2358;&#2344; &#2357;&#2367;&#2306;&#2337;&#2379; </span><span style=\"font-family: Cambria Math;\">(browser or application window) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2366; &#2361;&#2367;&#2360;&#2381;&#2360;&#2366; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2310;&#2350;&#2340;&#2380;&#2352; &#2346;&#2352; &#2335;&#2377;&#2346; &#2354;&#2375;&#2347;&#2381;&#2335; &#2360;&#2366;&#2311;&#2337; </span><span style=\"font-family: Cambria Math;\">(top left side), </span><span style=\"font-family: Cambria Math;\">&#2332;&#2367;&#2360;&#2350;&#2375;&#2306; &#2337;&#2381;&#2352;&#2377;&#2346;</span><span style=\"font-family: Cambria Math;\">-</span><span style=\"font-family: Cambria Math;\">&#2337;&#2366;&#2313;&#2344; &#2350;&#2375;&#2344;&#2370; </span><span style=\"font-family: Cambria Math;\">(drop-down menu) </span><span style=\"font-family: Cambria Math;\">&#2361;&#2379;&#2340;&#2375; &#2361;&#2376;&#2306; &#2332;&#2379; &#2313;&#2346;&#2351;&#2379;&#2327;&#2325;&#2352;&#2381;&#2340;&#2366; &#2325;&#2379; &#2325;&#2306;&#2335;&#2375;&#2306;&#2335; &#2351;&#2366; &#2319;&#2346;&#2381;&#2354;&#2367;&#2325;&#2375;&#2358;&#2344; </span><span style=\"font-family: Cambria Math;\">(content or application) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2375; &#2360;&#2366;&#2341; &#2357;&#2367;&#2349;&#2367;&#2344;&#2381;&#2344; &#2340;&#2352;&#2368;&#2325;&#2379;&#2306; &#2360;&#2375; &#2311;&#2306;&#2335;&#2352;&#2376;&#2325;&#2381;&#2335; </span><span style=\"font-family: Cambria Math;\">(interact) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2352;&#2344;&#2375; &#2325;&#2368; &#2309;&#2344;&#2369;&#2350;&#2340;&#2367; &#2342;&#2375;&#2340;&#2375; &#2361;&#2376;&#2306;&#2404;</span></p>\r\n<p><span style=\"font-family: Cambria Math;\"><strong>&#2360;&#2381;&#2335;&#2375;&#2335;&#2360; &#2348;&#2366;&#2352;</strong> </span><span style=\"font-family: Cambria Math;\">&#2357;&#2352;&#2381;&#2337; &#2357;&#2367;&#2306;&#2337;&#2379; </span><span style=\"font-family: Cambria Math;\">(word window) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2375; &#2344;&#2368;&#2330;&#2375; &#2325;&#2366; &#2319;&#2352;&#2367;&#2351;&#2366; </span><span style=\"font-family: Cambria Math;\">(area) </span><span style=\"font-family: Cambria Math;\">&#2361;&#2376;&#2404; &#2351;&#2361; &#2325;&#2352;&#2306;&#2335; &#2337;&#2377;&#2325;&#2381;&#2351;&#2370;&#2350;&#2375;&#2306;&#2335; </span><span style=\"font-family: Cambria Math;\">(current document) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2375; &#2348;&#2366;&#2352;&#2375; &#2350;&#2375;&#2306; &#2311;&#2344;&#2347;&#2366;&#2352;&#2381;&#2350;&#2375;&#2358;&#2344; &#2311;&#2306;&#2327;&#2367;&#2340; </span><span style=\"font-family: Cambria Math;\">(indicates information) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2352;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\r\n<p><span style=\"font-family: Cambria Math;\"><strong>&#2347;&#2364;&#2377;&#2352;&#2381;&#2350;&#2375;&#2335;&#2367;&#2306;&#2327; &#2335;&#2370;&#2354;&#2348;&#2366;&#2352;</strong> </span><span style=\"font-family: Cambria Math;\">&#2325;&#2312; &#2335;&#2375;&#2325;&#2381;&#2360;&#2381;&#2335; &#2347;&#2364;&#2377;&#2352;&#2381;&#2350;&#2375;&#2335;&#2367;&#2306;&#2327; &#2347;&#2364;&#2306;&#2325;&#2381;&#2358;&#2306;&#2360; </span><span style=\"font-family: Cambria Math;\">(text formatting functions) </span><span style=\"font-family: Cambria Math;\">&#2332;&#2376;&#2360;&#2375; &#2325;&#2367; &#2347;&#2364;&#2377;&#2344;&#2381;&#2335; &#2360;&#2366;&#2311;&#2332; </span><span style=\"font-family: Cambria Math;\">(font size) </span><span style=\"font-family: Cambria Math;\">&#2324;&#2352; &#2325;&#2354;&#2352; </span><span style=\"font-family: Cambria Math;\">(colour), </span><span style=\"font-family: Cambria Math;\">&#2335;&#2375;&#2325;&#2381;&#2360;&#2381;&#2335; &#2309;&#2354;&#2366;&#2311;&#2344;&#2350;&#2375;&#2306;&#2335; </span><span style=\"font-family: Cambria Math;\">(text alignment), </span><span style=\"font-family: Cambria Math;\">&#2354;&#2367;&#2360;&#2381;&#2335; </span><span style=\"font-family: Cambria Math;\">(list) </span><span style=\"font-family: Cambria Math;\">&#2324;&#2352; &#2311;&#2360;&#2368; &#2340;&#2352;&#2361; &#2325;&#2368; &#2319;&#2325;&#2381;&#2360;&#2375;&#2360; </span><span style=\"font-family: Cambria Math;\">(access) </span><span style=\"font-family: Cambria Math;\">&#2346;&#2381;&#2352;&#2342;&#2366;&#2344; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376;&#2404; </span></p>\n",
                    correct: "a",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
                questions.push({
                    id: "11",
                    section: "31",
                    question_en: "<p>11.<span style=\"font-family: Cambria Math;\"> The smallest unit of information about a record in a database is called a_________ .</span></p>\n",
                    question_hi: "<p>11.<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2337;&#2375;&#2335;&#2366;&#2348;&#2375;&#2360; &#2350;&#2375;&#2306; &#2352;&#2367;&#2325;&#2377;&#2352;&#2381;&#2337; &#2325;&#2375; &#2348;&#2366;&#2352;&#2375; &#2350;&#2375;&#2306; &#2360;&#2370;&#2330;&#2344;&#2366; &#2325;&#2368; &#2360;&#2348;&#2360;&#2375; &#2331;&#2379;&#2335;&#2368; &#2311;&#2325;&#2366;&#2312; &#2325;&#2361;&#2354;&#2366;&#2340;&#2368; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">________</span></p>\n",
                    options_en: ["<p>cell</p>\n", "<p>field</p>\n", 
                                "<p>record</p>\n", "<p>query</p>\n"],
                    options_hi: ["<p><span style=\"font-weight: 400;\">&#2360;&#2375;&#2354; (cell)</span></p>\n", "<p><span style=\"font-family: Cambria Math;\">&#2347;&#2368;&#2354;&#2381;&#2337;</span><span style=\"font-family: Cambria Math;\">(field) </span></p>\n",
                                "<p><span style=\"font-weight: 400;\">&#2352;&#2367;&#2325;&#2377;&#2352;&#2381;&#2337;(record)</span></p>\n", "<p><span style=\"font-family: Cambria Math;\">&#2325;&#2381;&#2357;&#2375;&#2352;&#2368;</span><span style=\"font-family: Cambria Math;\">(query) </span></p>\n"],
                    solution_en: "<p>11.(b)<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">In a database table, a <strong>field</strong> is </span><span style=\"font-family: Cambria Math;\">a data structure for a single piece of data</span><span style=\"font-family: Cambria Math;\">. <strong>Fields</strong> are organized into records, which contain all the information within the table relevant to a specific entity.</span></p>\n",
                    solution_hi: "<p>11.(b) <span style=\"font-family: Cambria Math;\">&#2337;&#2375;&#2335;&#2366;&#2348;&#2375;&#2360; &#2335;&#2375;&#2348;&#2354; &#2350;&#2375;&#2306;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2319;&#2325; <strong>&#2347;&#2364;&#2368;&#2354;&#2381;&#2337;</strong> &#2337;&#2375;&#2335;&#2366; &#2325;&#2375; &#2319;&#2325; &#2335;&#2369;&#2325;&#2337;&#2364;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2319;&#2325; &#2337;&#2375;&#2335;&#2366; &#2360;&#2306;&#2352;&#2330;&#2344;&#2366; &#2361;&#2376;&#2404; <strong>&#2347;&#2364;&#2368;&#2354;&#2381;&#2337;&#2381;&#2360;</strong> &#2325;&#2379; &#2352;&#2367;&#2325;&#2377;&#2352;&#2381;&#2337; &#2350;&#2375;&#2306; &#2357;&#2381;&#2351;&#2357;&#2360;&#2381;&#2341;&#2367;&#2340; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2332;&#2367;&#2360;&#2350;&#2375;&#2306; &#2325;&#2367;&#2360;&#2368; &#2357;&#2367;&#2358;&#2367;&#2359;&#2381;&#2335; &#2311;&#2325;&#2366;&#2312; &#2360;&#2375; &#2360;&#2306;&#2348;&#2306;&#2343;&#2367;&#2340; &#2340;&#2366;&#2354;&#2367;&#2325;&#2366; &#2325;&#2375; &#2349;&#2368;&#2340;&#2352; &#2360;&#2349;&#2368; &#2332;&#2366;&#2344;&#2325;&#2366;&#2352;&#2368; &#2361;&#2379;&#2340;&#2368; &#2361;&#2376;&#2404;</span></p>\n",
                    correct: "b",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
                questions.push({
                    id: "12",
                    section: "31",
                    question_en: "<p>12.<span style=\"font-family: Cambria Math;\"> Which of the following is not a property of fiber optic cabling? </span></p>\n",
                    question_hi: "<p>12.<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2344;&#2367;&#2350;&#2381;&#2344;&#2354;&#2367;&#2326;&#2367;&#2340; &#2350;&#2375;&#2306; &#2360;&#2375; &#2325;&#2380;&#2344;</span><span style=\"font-family: Cambria Math;\">-</span><span style=\"font-family: Cambria Math;\">&#2360;&#2366; &#2347;&#2366;&#2311;&#2348;&#2352; &#2321;&#2346;&#2381;&#2335;&#2367;&#2325; &#2325;&#2375;&#2348;&#2354;&#2367;&#2306;&#2327;</span><span style=\"font-family: Cambria Math;\">(fibre optic cabling) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2366; &#2327;&#2369;&#2339; &#2344;&#2361;&#2368;&#2306; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">?</span></p>\n",
                    options_en: ["<p>Transmits at faster speeds than copper cabling</p>\n", "<p>Easier to capture a signal from the copper cabling</p>\n", 
                                "<p>Very resistant to interference</p>\n", "<p>Carries signals as light waves</p>\n"],
                    options_hi: ["<p><span style=\"font-family: Cambria Math;\">&#2325;&#2377;&#2346;&#2352; &#2325;&#2375;&#2348;&#2354;&#2367;&#2306;&#2327; &#2325;&#2368; &#2340;&#2369;&#2354;&#2344;&#2366; &#2350;&#2375;&#2306; &#2340;&#2375;&#2332; &#2327;&#2340;&#2367; &#2360;&#2375; &#2360;&#2306;&#2330;&#2366;&#2352;&#2367;&#2340; &#2361;&#2379;&#2340;&#2366; &#2361;&#2376;</span></p>\n", "<p><span style=\"font-family: Cambria Math;\">&#2325;&#2377;&#2346;&#2352; &#2325;&#2375;&#2348;&#2354;&#2367;&#2306;&#2327; &#2360;&#2375; &#2360;&#2367;&#2327;&#2381;&#2344;&#2354; &#2325;&#2376;&#2346;&#2381;&#2330;&#2352; &#2325;&#2352;&#2344;&#2366; &#2310;&#2360;&#2366;&#2344;</span></p>\n",
                                "<p><span style=\"font-family: Cambria Math;\">&#2361;&#2360;&#2381;&#2340;&#2325;&#2381;&#2359;&#2375;&#2346; &#2325;&#2375; &#2354;&#2367;&#2319; &#2348;&#2361;&#2369;&#2340; &#2346;&#2381;&#2352;&#2340;&#2367;&#2352;&#2379;&#2343;&#2368;</span></p>\n", "<p><span style=\"font-family: Cambria Math;\">&#2360;&#2306;&#2325;&#2375;&#2340;&#2379;&#2306; &#2325;&#2379; &#2346;&#2381;&#2352;&#2325;&#2366;&#2358; &#2340;&#2352;&#2306;&#2327;&#2379;&#2306; &#2325;&#2375; &#2352;&#2370;&#2346; &#2350;&#2375;&#2306; &#2357;&#2361;&#2344; &#2325;&#2352;&#2340;&#2368; &#2361;&#2376;</span></p>\n"],
                    solution_en: "<p>12.(c)<span style=\"font-family: Cambria Math;\"> Advantage of using fiber optic nerve is </span><span style=\"font-family: Cambria Math;\">: faster speed with </span><span style=\"font-family: Cambria Math;\">less attenuation</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">less impervious to electromagnetic interference</span><span style=\"font-family: Cambria Math;\"> (EMI), smaller size and greater information carrying capacity.</span></p>\n",
                    solution_hi: "<p>12.(c) <span style=\"font-family: Cambria Math;\">&#2347;&#2366;&#2311;&#2348;&#2352; &#2321;&#2346;&#2381;&#2335;&#2367;&#2325; &#2340;&#2306;&#2340;&#2381;&#2352;&#2367;&#2325;&#2366;</span><span style=\"font-family: Cambria Math;\">(fibre optic nerve) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2366; &#2313;&#2346;&#2351;&#2379;&#2327; &#2325;&#2352;&#2344;&#2375; &#2325;&#2366; &#2354;&#2366;&#2349; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">: </span><span style=\"font-family: Cambria Math;\">&#2325;&#2350; &#2325;&#2381;&#2359;&#2368;&#2339;&#2344;</span><span style=\"font-family: Cambria Math;\">(less attenuation) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2375; &#2360;&#2366;&#2341; &#2340;&#2375;&#2332; &#2327;&#2340;&#2367;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2357;&#2367;&#2342;&#2381;&#2351;&#2369;&#2340; &#2330;&#2369;&#2350;&#2381;&#2348;&#2325;&#2368;&#2351; &#2361;&#2360;&#2381;&#2340;&#2325;&#2381;&#2359;&#2375;&#2346;</span><span style=\"font-family: Cambria Math;\">(</span><span style=\"font-family: Cambria Math;\">electromagnetic interference</span><span style=\"font-family: Cambria Math;\">) (EMI) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2375; &#2354;&#2367;&#2319; &#2325;&#2350; &#2309;&#2349;&#2375;&#2342;&#2381;&#2351;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2331;&#2379;&#2335;&#2375; &#2310;&#2325;&#2366;&#2352; &#2324;&#2352; &#2309;&#2343;&#2367;&#2325; &#2332;&#2366;&#2344;&#2325;&#2366;&#2352;&#2368; &#2352;&#2326;&#2344;&#2375; &#2325;&#2368; &#2325;&#2381;&#2359;&#2350;&#2340;&#2366;&#2404;</span></p>\n",
                    correct: "c",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
                questions.push({
                    id: "13",
                    section: "31",
                    question_en: "<p>13.<span style=\"font-family: Cambria Math;\"> Documents converted to ......... can be published to the Web. </span></p>\n",
                    question_hi: "<p>13.<span style=\"font-family: Cambria Math;\"> ......... </span><span style=\"font-family: Cambria Math;\">&#2350;&#2375;&#2306; &#2325;&#2344;&#2357;&#2352;&#2381;&#2335; &#2325;&#2367;&#2319; &#2327;&#2319; &#2342;&#2360;&#2381;&#2340;&#2366;&#2357;&#2375;&#2332;&#2364;&#2379;&#2306; &#2325;&#2379; &#2357;&#2375;&#2348; &#2346;&#2352; &#2346;&#2381;&#2352;&#2325;&#2366;&#2358;&#2367;&#2340; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366; &#2360;&#2325;&#2340;&#2366; &#2361;&#2376;&#2404; </span></p>\n",
                    options_en: ["<p>a doc file</p>\n", "<p>http</p>\n", 
                                "<p>Other than those given as options</p>\n", "<p>HTML</p>\n"],
                    options_hi: ["<p><span style=\"font-family: Cambria Math;\">&#2319;&#2325; &#2342;&#2360;&#2381;&#2340;&#2366;&#2357;&#2375;&#2332;&#2364; &#2347;&#2364;&#2366;&#2311;&#2354;</span></p>\n", "<p>http</p>\n",
                                "<p><span style=\"font-family: Cambria Math;\">&#2342;&#2367;&#2319; &#2327;&#2319; &#2357;&#2367;&#2325;&#2354;&#2381;&#2346;&#2379;&#2306; &#2325;&#2379; &#2331;&#2379;&#2337;&#2364;&#2325;&#2352; &#2309;&#2344;&#2381;&#2351;</span></p>\n", "<p>HTML</p>\n"],
                    solution_en: "<p>13.(d)<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">HTML</span><span style=\"font-family: Cambria Math;\">(Hypertext Markup Language)</span><span style=\"font-family: Cambria Math;\"> is </span><span style=\"font-family: Cambria Math;\">the language for describing the structure of Web pages</span><span style=\"font-family: Cambria Math;\">. HTML gives authors the means to: Publish online documents with headings, text, tables, lists, photos, etc.</span></p>\n",

                questions.push({
                    id: "14",
                    section: "31",
                    question_en: "<p>14.<span style=\"font-family: Cambria Math;\"> Which of the following refers to dangerous programs that can be &lsquo;caught&rsquo; by opening Email attachments and downloading software from the Internet?</span></p>\n",

                                "<p><span style=\"font-weight: 400;\">&#2361;&#2344;&#2368; &#2346;&#2377;&#2335;(honey pot)</span></p>\n", "<p><span style=\"font-weight: 400;\">&#2360;&#2381;&#2346;&#2376;&#2350;(spam)</span></p>\n"],
                    solution_en: "<p>14.(b)<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">A </span><strong><span style=\"font-family: Cambria Math;\">Trojan horse/virus</span></strong><span style=\"font-family: Cambria Math;\"><strong> </strong>can be a program that purports to do one action when, in fact, it is performing a malicious action on your computer. Trojan horses can be included in software that you download for free or as attachments in email messages.</span><span style=\"font-family: Cambria Math;\"><strong>Spam</strong> </span><span style=\"font-family: Cambria Math;\">&rarr; </span><span style=\"font-family: Cambria Math;\">Spam is any kind of unwanted, unsolicited digital communication that gets sent out in bulk. Often spam is sent via email, but it can also be distributed via text messages, phone calls, or social media.</span></p>\n",
                    solution_hi: "<p>14.(b) <span style=\"font-family: Cambria Math;\">&#2319;&#2325; <strong>&#2335;&#2381;&#2352;&#2379;&#2332;&#2344; &#2361;&#2377;&#2352;&#2381;&#2360;</strong></span><strong><span style=\"font-family: Cambria Math;\">/</span></strong><span style=\"font-family: Cambria Math;\"><strong>&#2357;&#2366;&#2351;&#2352;&#2360;</strong> &#2319;&#2325; &#2320;&#2360;&#2366; &#2346;&#2381;&#2352;&#2379;&#2327;&#2381;&#2352;&#2366;&#2350; &#2361;&#2379; &#2360;&#2325;&#2340;&#2366; &#2361;&#2376; &#2332;&#2379; &#2319;&#2325; &#2325;&#2366;&#2352;&#2381;&#2351; &#2325;&#2352;&#2344;&#2375; &#2325;&#2366; &#2342;&#2366;&#2357;&#2366; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2332;&#2348;&#2325;&#2367; &#2357;&#2366;&#2360;&#2381;&#2340;&#2357; &#2350;&#2375;&#2306;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2351;&#2361; &#2310;&#2346;&#2325;&#2375; &#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; &#2346;&#2352; &#2319;&#2325; &#2350;&#2376;&#2354;&#2367;&#2360;&#2367;&#2351;&#2360; &#2325;&#2366;&#2352;&#2381;&#2351;</span><span style=\"font-family: Cambria Math;\">(malicious action) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2352; &#2352;&#2361;&#2366; &#2361;&#2376;&#2404; &#2335;&#2381;&#2352;&#2379;&#2332;&#2344; &#2361;&#2377;&#2352;&#2381;&#2360; &#2325;&#2379; &#2360;&#2377;&#2347;&#2381;&#2335;&#2357;&#2375;&#2351;&#2352; &#2350;&#2375;&#2306; &#2358;&#2366;&#2350;&#2367;&#2354; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366; &#2360;&#2325;&#2340;&#2366; &#2361;&#2376; &#2332;&#2367;&#2360;&#2375; &#2310;&#2346; &#2350;&#2369;&#2347;&#2381;&#2340; &#2350;&#2375;&#2306; &#2351;&#2366; &#2312;&#2350;&#2375;&#2354; &#2360;&#2306;&#2342;&#2375;&#2358;&#2379;&#2306; &#2350;&#2375;&#2306; &#2360;&#2306;&#2354;&#2327;&#2381;&#2344;&#2325; &#2325;&#2375; &#235                     solution_en: "<p>18.(a)<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">Press <strong>Ctrl+H</strong> or choose </span><span style=\"font-family: Cambria Math;\">Edit | Find | Replace</span><span style=\"font-family: Cambria Math;\"> from the main menu.</span></p>\r\n<p><span style=\"font-family: Cambria Math;\">The</span><span style=\"font-family: Cambria Math;\"> <strong>Insert tab</strong></span><span style=\"font-family: Cambria Math;\"><strong> </strong>helps to add pictures, shapes, SmartArt graphics, tables, and more to take your document to the next level.</span></p>\r\n<p><span style=\"font-family: Cambria Math;\">The <strong>File tab</strong> </span><span style=\"font-family: Cambria Math;\">provides access to common file actions, such as New, Open, and Save</span><span style=\"font-family: Cambria Math;\">. It also allows you to manage files using more advanced tools, such as Export and Publish.</span></p>\r\n<p><span style=\"font-family: Cambria Math;\">The <strong>view menu</strong> lets you look at the same document in more than one way.</span></p>\n",
                    solution_hi: "<p>18.(a)<span style=\"font-family: Cambria Math;\"> <strong>Ctrl + H </strong></span><span style=\"font-family: Cambria Math;\">&#2342;&#2348;&#2366;&#2319;&#2306; &#2351;&#2366; </span><span style=\"font-family: Cambria Math;\">&#2319;&#2337;&#2367;&#2335;</span><span style=\"font-family: Cambria Math;\">/</span><span style=\"font-family: Cambria Math;\">&#2347;&#2366;&#2311;&#2306;&#2337;</span><span style=\"font-family: Cambria Math;\">/</span><span style=\"font-family: Cambria Math;\">&#2352;&#2367;&#2346;&#2381;&#2354;&#2375;&#2360; </span><span style=\"font-family: Cambria Math;\">(edit/find/replace) </span><span style=\"font-family: Cambria Math;\">&#2350;&#2375;&#2344; &#2350;&#2375;&#2344;&#2370; </span><span style=\"font-family: Cambria Math;\">(main menu) </span><span style=\"font-family: Cambria Math;\">&#2360;&#2375; &#2330;&#2369;&#2344;&#2375; &#2404;</span></p>\r\n<p><span style=\"font-family: Cambria Math;\"><strong>&#2311;&#2344;&#2381;&#2360;&#2352;&#2381;&#2335; &#2335;&#2376;&#2348;</strong> </span><span style=\"font-family: Cambria Math;\">&#2337;&#2377;&#2325;&#2381;&#2351;&#2370;&#2350;&#2375;&#2306;&#2335; &#2325;&#2379; &#2309;&#2327;&#2354;&#2375; &#2354;&#2375;&#2357;&#2354; &#2346;&#2352; &#2354;&#2375; &#2332;&#2366;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2346;&#2367;&#2325;&#2381;&#2330;&#2352; </span><span style=\"font-family: Cambria Math;\">(picture), </span><span style=\"font-family: Cambria Math;\">&#2358;&#2375;&#2346; </span><span style=\"font-family: Cambria Math;\">(shape), </span><span style=\"font-family: Cambria Math;\">&#2360;&#2381;&#2350;&#2366;&#2352;&#2381;&#2335;&#2310;&#2352;&#2381;&#2335; &#2327;&#2381;&#2352;&#2366;&#2347;&#2364;&#2367;&#2325;&#2381;&#2360; </span><span style=\"font-family: Cambria Math;\">(SmartArt graphics), </span><span style=\"font-family: Cambria Math;\">&#2335;&#2375;&#2348;&#2354; </span><span style=\"font-family: Cambria Math;\">(table), </span><span style=\"font-family: Cambria Math;\">&#2324;&#2352; &#2348;&#2361;&#2369;&#2340; &#2325;&#2369;&#2331; &#2332;&#2379;&#2337;&#2364;&#2344;&#2375; &#2350;&#2375;&#2306; &#2350;&#2342;&#2342; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\r\n<p><strong><span style=\"font-family: Cambria Math;\">&#2347;&#2364;&#2366;&#2311;&#2354; &#2335;&#2376;&#2348;</span><span style=\"font-family: Cambria Math;\"> </span></strong><span style=\"font-family: Cambria Math;\">&#2325;&#2377;&#2350;&#2344; &#2347;&#2366;&#2311;&#2354; &#2319;&#2325;&#2381;&#2360;&#2335;&#2375;&#2306;&#2358;&#2344; </span><span style=\"font-family: Cambria Math;\">(common file extension) </span><span style=\"font-family: Cambria Math;\">&#2340;&#2325; &#2319;&#2325;&#2381;&#2360;&#2375;&#2360; </span><span style=\"font-family: Cambria Math;\">(access) </span><span style=\"font-family: Cambria Math;\">&#2346;&#2381;&#2352;&#2342;&#2366;&#2344; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2332;&#2376;&#2360;&#2375; </span><span style=\"font-family: Cambria Math;\">New, Open, </span><span style=\"font-family: Cambria Math;\">&#2324;&#2352; </span><span style=\"font-family: Cambria Math;\">Save </span><span style=\"font-family: Cambria Math;\">&#2404; &#2351;&#2361; &#2310;&#2346;&#2325;&#2379; &#2319;&#2325;&#2381;&#2360;&#2346;&#2379;&#2352;&#2381;&#2335; &#2324;&#2352; &#2346;&#2348;&#2381;&#2354;&#2367;&#2358; </span><span style=\"font-family: Cambria Math;\">(export and publish) </span><span style=\"font-family: Cambria Math;\">&#2332;&#2376;&#2360;&#2375; &#2309;&#2343;&#2367;&#2325; &#2313;&#2344;&#2381;&#2344;&#2340; &#2335;&#2370;&#2354; &#2325;&#2366; &#2313;&#2346;&#2351;&#2379;&#2327; &#2325;&#2352;&#2325;&#2375; &#2347;&#2364;&#2366;&#2311;&#2354;&#2379;&#2306; &#2325;&#2379; &#2350;&#2376;&#2344;&#2375;&#2332; </span><span style=\"font-family: Cambria Math;\">(manage) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2352;&#2344;&#2375; &#2325;&#2368; &#2349;&#2368; &#2309;&#2344;&#2369;&#2350;&#2340;&#2367; &#2342;&#2375;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\r\n<p><span style=\"font-family: Cambria Math;\"><strong>&#2357;&#2381;&#2351;&#2370; &#2350;&#2375;&#2344;&#2370;</strong> </span><span style=\"font-family: Cambria Math;\">&#2319;&#2325; &#2361;&#2368; &#2337;&#2377;&#2325;&#2381;&#2351;&#2370;&#2350;&#2375;&#2306;&#2335; &#2325;&#2379; &#2319;&#2325; &#2360;&#2375; &#2309;&#2343;&#2367;&#2325; &#2340;&#2352;&#2368;&#2325;&#2379;&#2306; &#2360;&#2375; &#2342;&#2375;&#2326;&#2344;&#2375; &#2342;&#2375;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\n",
                    correct: "a",

                questions.push({
                    id: "19",
                    section: "31",
                    question_en: " <p>19. </span><span style=\"font-family:Cambria Math\">Which of the following can be used to select the entire document?</span></p>",
                    question_hi: "<p>19.<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2344;&#2367;&#2350;&#2381;&#2344; &#2350;&#2375;&#2306; &#2360;&#2375; &#2325;&#2367;&#2360;&#2325;&#2366; &#2313;&#2346;&#2351;&#2379;&#2327; &#2346;&#2370;&#2352;&#2375; &#2337;&#2377;&#2325;&#2381;&#2351;&#2370;&#2350;&#2375;&#2306;&#2335; &#2325;&#2379; &#2360;&#2375;&#2354;&#2375;&#2325;&#2381;&#2335; </span><span style=\"font-family: Cambria Math;\">(select) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2352;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366; &#2360;&#2325;&#2340;&#2366; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">?</span></p>\n",
                    options_en: [" <p> Ctrl + A </span></p>", " <p> Alt + F5</span></p>", 
                                " <p> Shift + A </span></p>", " <p> Ctrl + K</span></p>"],
                    options_hi: ["<p>Ctrl + A</p>\n", "<p>Alt + F5</p>\n",
                                "<p>Shift + A</p>\n", "<p>Ctrl + K</p>\n"],
                    solution_en: " <p>19.(a)</span><span style=\"font-family:Cambria Math\"> Ctrl + A used to select the entire text.</span></p> <p><span style=\"font-family:Cambria Math\">Alt + F5 is used to restore.</span></p> <p><span style=\"font-family:Cambria Math\">Pressing Ctrl + K inserts a hyperlink at the text cursor\'s current location.</span></p>",
                    solution_hi: "<p>19.(a)<span style=\"font-family: Cambria Math;\"> <strong>Ctrl + A</strong> </span><span style=\"font-family: Cambria Math;\">&#2346;&#2370;&#2352;&#2375; &#2335;&#2375;&#2325;&#2381;&#2360;&#2381;&#2335; &#2325;&#2379; &#2360;&#2375;&#2354;&#2375;&#2325;&#2381;&#2335; &#2325;&#2352;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2346;&#2381;&#2352;&#2351;&#2379;&#2327; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\r\n<p><span style=\"font-family: Cambria Math;\"><strong>Alt + F5</strong> </span><span style=\"font-family: Cambria Math;\">&#2325;&#2366; &#2311;&#2360;&#2381;&#2340;&#2375;&#2350;&#2366;&#2354; &#2352;&#2367;&#2360;&#2381;&#2335;&#2379;&#2352; </span><span style=\"font-family: Cambria Math;\">(restore) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2352;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\r\n<p><span style=\"font-family: Cambria Math;\"><strong>Ctrl + K</strong> </span><span style=\"font-family: Cambria Math;\">&#2342;&#2348;&#2366;&#2344;&#2375; &#2360;&#2375; &#2335;&#2375;&#2325;&#2381;&#2360;&#2381;&#2335; &#2325;&#2352;&#2381;&#2360;&#2352; </span><span style=\"font-family: Cambria Math;\">(text cursor) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2375; &#2357;&#2352;&#2381;&#2340;&#2350;&#2366;&#2344; &#2354;&#2379;&#2325;&#2375;&#2358;&#2344; </span><span style=\"font-family: Cambria Math;\">(current location) </span><span style=\"font-family: Cambria Math;\">&#2346;&#2352; &#2361;&#2366;&#2311;&#2346;&#2352;&#2354;&#2367;&#2306;&#2325; </span><span style=\"font-family: Cambria Math;\">(hyperlink) </span><span style=\"font-family: Cambria Math;\">&#2311;&#2344;&#2381;&#2360;&#2352;&#2381;&#2335; </span><span style=\"font-family: Cambria Math;\">(insert) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2352;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\n",
                    correct: "a",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
                questions.push({
                    id: "20",
                    section: "misc",
                    question_en: "<p>20.<span style=\"font-family: Cambria Math;\"> A combination of hardware and software that allows communication and electronic </span><span style=\"font-family: Cambria Math;\">transfer of information between computers is a__________.</span></p>\n",
                    question_hi: "<p>20.<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2361;&#2366;&#2352;&#2381;&#2337;&#2357;&#2375;&#2351;&#2352; &#2324;&#2352; &#2360;&#2377;&#2347;&#2381;&#2335;&#2357;&#2375;&#2351;&#2352; &#2325;&#2366; &#2360;&#2306;&#2351;&#2379;&#2332;&#2344; &#2332;&#2379; &#2325;&#2350;&#2381;&#2346;&#2370;&#2335;&#2352;&#2379; &#2325;&#2375; &#2348;&#2368;&#2330; &#2360;&#2306;&#2330;&#2366;&#2352; &#2324;&#2352; &#2311;&#2354;&#2375;&#2325;&#2381;&#2335;&#2381;&#2352;&#2377;&#2344;&#2367;&#2325; &#2360;&#2370;&#2330;&#2344;&#2366; &#2325;&#2366; &#2360;&#2381;&#2341;&#2366;&#2344;&#2366;&#2306;&#2340;&#2352;&#2339; &#2325;&#2368; &#2309;&#2344;&#2369;&#2350;&#2340;&#2367; &#2342;&#2375;&#2340;&#2366; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">___________</span></p>\n",
                    options_en: ["<p>network</p>\n", "<p>backup system</p>\n", 
                                "<p>server</p>\n", "<p>peripheral</p>\n"],
                    options_hi: ["<p><span style=\"font-weight: 400;\">&#2344;&#2375;&#2335;&#2357;&#2352;&#2381;&#2325;(network)</span></p>\n", "<p><span style=\"font-weight: 400;\">&#2348;&#2376;&#2325;&#2309;&#2346; &#2360;&#2367;&#2360;&#2381;&#2335;&#2350;(backup system)</span></p>\n",
                                "<p><span style=\"font-weight: 400;\">&#2360;&#2352;&#2381;&#2357;&#2352;(server)</span></p>\n", "<p><span style=\"font-weight: 400;\">&#2346;&#2352;&#2367;&#2346;&#2375;&#2352;&#2361;&#2354;(peripheral)</span></p>\n"],
                    solution_en: "<p>20.(a)<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\"><strong>Computer networking</strong> refers to interconnected computing devices that can exchange data and share resources with each other. </span></p>\n",
                    solution_hi: "<p>20.(a) <span style=\"font-family: Cambria Math;\"><strong>&#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; &#2344;&#2375;&#2335;&#2357;&#2352;&#2381;&#2325;&#2367;&#2306;&#2327;</strong> &#2311;&#2306;&#2335;&#2352;&#2325;&#2344;&#2375;&#2325;&#2381;&#2335;&#2375;&#2337; &#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2367;&#2306;&#2327; &#2337;&#2367;&#2357;&#2366;&#2311;&#2360; &#2325;&#2379; &#2360;&#2306;&#2342;&#2352;&#2381;&#2349;&#2367;&#2340; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376; &#2332;&#2379; &#2337;&#2375;&#2335;&#2366; &#2325;&#2366; &#2310;&#2342;&#2366;&#2344;</span><span style=\"font-family: Cambria Math;\">-</span><span style=\"font-family: Cambria Math;\">&#2346;&#2381;&#2352;&#2342;&#2366;&#2344; &#2325;&#2352; &#2360;&#2325;&#2340;&#2375; &#2361;&#2376;&#2306; &#2324;&#2352; &#2360;&#2306;&#2360;&#2366;&#2343;&#2344;&#2379;&#2306; &#2325;&#2379; &#2319;&#2325; &#2342;&#2370;&#2360;&#2352;&#2375; &#2325;&#2375; &#2360;&#2366;&#2341; &#2360;&#2366;&#2333;&#2366; &#2325;&#2352; &#2360;&#2325;&#2340;&#2375; &#2361;&#2376;&#2306;&#2404;</span></p>\n",
                    correct: "a",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
            
            // Generate question boxes
            const boxesContainer = document.getElementById('question-boxes');
            questions.forEach((q, index) => {
                const box = document.createElement('div');
                box.className = 'q-box';
                box.textContent = index + 1;
                box.onclick = () => showQuestion(index);
                box.id = `box-${index}`;
                boxesContainer.appendChild(box);
            });
            
            // Show first question
            showQuestion(0);
            updateProgress();
        }
        
        // Show a specific question
        
        function formatContent(text) {
            if (!text) return '';
            return text.replace(/<img/g, '<img style="max-width:100%;height:auto;"');
        }
        
        function showQuestion(index) {
            if (index < 0 || index >= questions.length) return;
            
            currentQuestion = index;
            const question = questions[index];
            
            // Update question counter
            document.getElementById('question-counter').textContent = `Question ${index + 1} of ${questions.length}`;
            
            // Update question boxes
            document.querySelectorAll('.q-box').forEach(box => box.classList.remove('current'));
            document.getElementById(`box-${index}`).classList.add('current');
            
            // Generate question HTML
            let html = `
                <div class="question-card">
                    <div class="question-text">
                        <div class="en">${formatContent(question.question_en)}</div>
                        <div class="hi" style="display:none">${formatContent(question.question_hi)} </div>
                    </div>
                    <div class="options" id="options-container">`;
            
            // Add options
            ['a', 'b', 'c', 'd'].forEach((opt, i) => {
                let optionClass = '';
                let isCorrectAnswer = opt === question.correct;
                let isUserAnswer = answers[question.id] === opt;
                
                // When reviewing, add appropriate classes
                if (submitted) {
                    if (isCorrectAnswer) {
                        optionClass += ' correct-answer';
                    } else if (isUserAnswer && !isCorrectAnswer) {
                        optionClass += ' incorrect';
                    }
                }
                
                html += `
                    <div class="option-item">
                        <input class="option-input" type="radio" name="q${index}" 
                            id="opt-${index}-${opt}" value="${opt}" 
                            ${isUserAnswer ? 'checked' : ''}
                            onclick="selectAnswer('${question.id}', '${opt}')">
                       <label class="option-label${optionClass}" for="opt-${index}-${opt}">
                            <div class="en">${question.options_en[i]}</div>
                            <div class="hi" style="display:none">${question.options_hi[i]}</div>
                        </label>
                    </div>`;
            });
            
            // Add solution if submitted
            if (submitted) {
                const isCorrect = answers[question.id] === question.correct;
                const resultText = answers[question.id] ? (isCorrect ? 'Correct!' : 'Incorrect!') : 'Not attempted';
                
                html += `
                    <div class="solution-container">
                        <div class="solution-title">${resultText}</div>
                        <div class="solution-text">
                            <div class="en">${question.solution_en}</div>
                            <div class="hi" style="display:none">${question.solution_hi}</div>
                        </div>
                    </div>`;
            }
            
            html += `</div></div>`;
            
            document.getElementById('questions-container').innerHTML = html;
            
            // Apply language settings
            applyLanguage();
            
            // If in mobile view, close the menu
            if (window.innerWidth < 992) {
                toggleNav(false);
            }
            
            // Add review mode class if submitted
            if (submitted) {
                document.getElementById('options-container').classList.add('review-mode');
            }
        }
        
        // Apply current language
        function applyLanguage() {
            document.querySelectorAll(`.${currentLang}`).forEach(el => el.style.display = 'block');
            document.querySelectorAll(`.${currentLang === 'en' ? 'hi' : 'en'}`).forEach(el => el.style.display = 'none');
            
            // Update language button text
            document.getElementById('lang-text').textContent = currentLang === 'en' ? 'Hi' : 'En';
        }
        
        // Select an answer
        function selectAnswer(qId, option) {
            if (submitted) return;
            
            answers[qId] = option;
            updateProgress();
            
            // Mark question as attempted in the navigation
            const index = questions.findIndex(q => q.id === qId);
            if (index >= 0) {
                const box = document.getElementById(`box-${index}`);
                box.classList.add('attempted');
                box.classList.remove('unattempted');
            }
        }
        
        // Navigate to previous/next question
        function prevQuestion() { 
            if (currentQuestion > 0) showQuestion(currentQuestion - 1); 
        }
        
        function nextQuestion() { 
            if (currentQuestion < questions.length - 1) showQuestion(currentQuestion + 1); 
        }
        
        // Switch section
        function switchSection(sectionId) {
            if (sectionId === 'all') {
                showQuestion(0);
                return;
            }
            
            const section = sections[sectionId];
            if (section) showQuestion(section.start);
        }
        
        // Toggle language
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            applyLanguage();
        }
        
        // Toggle navigation sidebar
        function toggleNav(show) {
            const nav = document.getElementById('question-nav');
            const overlay = document.getElementById('nav-overlay');
            
            if (show === undefined) {
                show = !nav.classList.contains('show');
            }
            
            if (show) {
                nav.classList.add('show');
                overlay.classList.add('show');
                document.body.style.overflow = 'hidden';
            } else {
                nav.classList.remove('show');
                overlay.classList.remove('show');
                document.body.style.overflow = '';
            }
        }
        
        // Update progress
        function updateProgress() {
            const attempted = Object.keys(answers).length;
            document.getElementById('attempted-count').textContent = attempted;
        }
        
        // Start timer
        function startTimer() {
            const timerDisplay = document.getElementById('timer-display');
            let timeLeft = totalTime;
            
            const timerInterval = setInterval(() => {
                if (timeLeft <= 0 || submitted) {
                    clearInterval(timerInterval);
                    if (!submitted) submitTest();
                    return;
                }
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                timeLeft--;
            }, 1000);
        }
        
        // Confirm before submitting
        function confirmSubmit() {
            if (submitted) return;
            
            const attempted = Object.keys(answers).length;
            const remaining = questions.length - attempted;
            
            // Create a more modern confirmation dialog
            const confirmHtml = `
                <div style="text-align: center; padding: 20px;">
                    <h4 style="margin-bottom: 16px; color: var(--dark);">Confirm Submission</h4>
                    <p style="margin-bottom: 24px; color: var(--gray);">
                        You have attempted ${attempted} of ${questions.length} questions.<br>
                        ${remaining} questions are unattempted.
                    </p>
                    <div style="display: flex; justify-content: center; gap: 12px;">
                        <button onclick="this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; border: 1px solid var(--light-gray); background: white; border-radius: 8px; cursor: pointer;">
                            Cancel
                        </button>
                        <button onclick="submitTest(); this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer;">
                            Submit Test
                        </button>
                    </div>
                </div>`;
            
            // Create modal element
            const modal = document.createElement('div');
            modal.className = 'results-modal show';
            modal.innerHTML = `
                <div class="results-card" style="max-width: 400px;">
                    <button class="cancel-btn" style="position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--gray);" onclick="this.closest('.results-modal').remove()">
                        ×
                    </button>
                    ${confirmHtml}
                </div>`;
            
            document.body.appendChild(modal);
        }
        
        // Submit test
        function submitTest() {
            if (submitted) return;
            
            submitted = true;
            
            let score = 0;
            let correctCount = 0;
            let incorrectCount = 0;
            let unattemptedCount = 0;
            
            questions.forEach((q, index) => {
                const userAns = answers[q.id];
                const box = document.getElementById(`box-${index}`);
                
                box.classList.remove('attempted');
                
                if (!userAns) {
                    unattemptedCount++;
                    box.classList.add('unattempted');
                } else if (userAns === q.correct) {
                    correctCount++;
                    score += q.pos_marks;
                    box.classList.add('correct');
                } else {
                    incorrectCount++;
                    score -= q.neg_marks;
                    box.classList.add('incorrect');
                }
            });
            
            // Update result values
            document.getElementById('score-value').textContent = score.toFixed(2);
            document.getElementById('correct-value').textContent = correctCount;
            document.getElementById('incorrect-value').textContent = incorrectCount;
            document.getElementById('unattempted-value').textContent = unattemptedCount;
            
            // Show the results modal
            document.getElementById('results-modal').classList.add('show');
            
            // Disable submit button
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-check"></i>';
            submitBtn.style.backgroundColor = 'var(--success)';
            
            // Refresh current question view to show solution
            showQuestion(currentQuestion);
        }
        
        // Review test
        function reviewTest() {
            document.getElementById('results-modal').classList.remove('show');
            showQuestion(0);
        }
        
        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('results-modal')) {
                document.getElementById('results-modal').classList.remove('show');
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === 'ArrowRight') nextQuestion();
        });
    </script>
</body>
