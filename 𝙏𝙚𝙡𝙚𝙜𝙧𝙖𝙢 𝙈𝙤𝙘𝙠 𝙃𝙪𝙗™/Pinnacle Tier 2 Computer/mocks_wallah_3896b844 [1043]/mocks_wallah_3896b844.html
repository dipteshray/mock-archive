                questions.push({
                    id: "16",
                    section: "31",
                    question_en: "<p>16.<span style=\"font-family: Cambria Math;\"> The Internet service that provides a multimedia interface to available resources is called_______.</span></p>\n",
                    question_hi: "<p>16.<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2311;&#2306;&#2335;&#2352;&#2344;&#2375;&#2335; &#2360;&#2375;&#2357;&#2366; &#2332;&#2379; &#2313;&#2346;&#2354;&#2348;&#2381;&#2343; &#2360;&#2306;&#2360;&#2366;&#2343;&#2344;&#2379;&#2306; &#2325;&#2379; &#2350;&#2354;&#2381;&#2335;&#2368;&#2350;&#2368;&#2337;&#2367;&#2351;&#2366; &#2311;&#2306;&#2335;&#2352;&#2347;&#2364;&#2375;&#2360; &#2346;&#2381;&#2352;&#2342;&#2366;&#2344; &#2325;&#2352;&#2340;&#2368; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2325;&#2361;&#2354;&#2366;&#2340;&#2368; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">_______</span><span style=\"font-family: Cambria Math;\">&#2404;</span></p>\n",
                    options_en: ["<p>FTP</p>\n", "<p>gopher</p>\n", 
                                "<p>telnet</p>\n", "<p>world wide web</p>\n"],
                    options_hi: ["<p><span style=\"font-weight: 400;\">&#2319;&#2347;&#2364;&#2335;&#2368;&#2346;&#2368;(FTP)</span></p>\n", "<p><span style=\"font-weight: 400;\">&#2327;&#2379;&#2347;&#2352;(gopher)</span></p>\n",
                                "<p><span style=\"font-weight: 400;\">&#2335;&#2375;&#2354;&#2344;&#2375;&#2335;(telnet)</span></p>\n", "<p><span style=\"font-weight: 400;\">&#2357;&#2352;&#2381;&#2354;&#2381;&#2337; &#2357;&#2366;&#2311;&#2337; &#2357;&#2375;&#2348;(world wide web)</span></p>\n"],
                    solution_en: "<p>16.(d)<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">The <strong>web</strong></span><span style=\"font-family: Cambria Math;\"><strong> provides the interface of multimedia to the resources that are available on the internet</strong>.</span><strong><span style=\"font-family: Cambria Math;\">FTP (File Transfer Protocol)</span></strong><span style=\"font-family: Cambria Math;\"> is a network protocol for transmitting files between computers over Transmission Control Protocol/Internet Protocol (</span><span style=\"font-family: Cambria Math;\">TCP/IP</span><span style=\"font-family: Cambria Math;\">) connections.</span><span style=\"font-family: Cambria Math;\"><strong>Telnet</strong> </span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">provides a command line interface for communication with a remote device or server, sometimes employed for remote management but also for initial device setup like network hardware.</span></p>\n",
                    solution_hi: "<p>16.(d)<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2357;&#2375;&#2348;</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2313;&#2344; &#2360;&#2306;&#2360;&#2366;&#2343;&#2344;&#2379;&#2306; &#2325;&#2379; <strong>&#2350;&#2354;&#2381;&#2335;&#2368;&#2350;&#2368;&#2337;&#2367;&#2351;&#2366; &#2325;&#2366; &#2311;&#2306;&#2335;&#2352;&#2347;&#2364;&#2375;&#2360; &#2346;&#2381;&#2352;&#2342;&#2366;&#2344; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376; &#2332;&#2379; &#2311;&#2306;&#2335;&#2352;&#2344;&#2375;&#2335; &#2346;&#2352; &#2313;&#2346;&#2354;&#2348;&#2381;&#2343; &#2361;&#2376;&#2306;</strong>&#2404; <strong>&#2319;&#2347;&#2364;&#2335;&#2368;&#2346;&#2368;</strong></span><strong><span style=\"font-family: Cambria Math;\">(FTP)(</span><span style=\"font-family: Cambria Math;\">&#2347;&#2366;&#2311;&#2354; &#2335;&#2381;&#2352;&#2366;&#2306;&#2360;&#2347;&#2352; &#2346;&#2381;&#2352;&#2379;&#2335;&#2379;&#2325;&#2377;&#2354;</span></strong><span style=\"font-family: Cambria Math;\"><strong>)</strong> </span><span style=\"font-family: Cambria Math;\">&#2335;&#2381;&#2352;&#2366;&#2306;&#2360;&#2350;&#2367;&#2358;&#2344; &#2325;&#2306;&#2335;&#2381;&#2352;&#2379;&#2354; &#2346;&#2381;&#2352;&#2379;&#2335;&#2379;&#2325;&#2377;&#2354;</span><span style=\"font-family: Cambria Math;\">/</span><span style=\"font-family: Cambria Math;\">&#2311;&#2306;&#2335;&#2352;&#2344;&#2375;&#2335; &#2346;&#2381;&#2352;&#2379;&#2335;&#2379;&#2325;&#2377;&#2354; </span><span style=\"font-family: Cambria Math;\">(</span><span style=\"font-family: Cambria Math;\">&#2335;&#2368;&#2360;&#2368;&#2346;&#2368;</span><span style=\"font-family: Cambria Math;\">/</span><span style=\"font-family: Cambria Math;\">&#2310;&#2312;&#2346;&#2368;</span><span style=\"font-family: Cambria Math;\">)(TCP/IP)) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2344;&#2375;&#2325;&#2381;&#2358;&#2344; &#2346;&#2352; &#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; &#2325;&#2375; &#2348;&#2368;&#2330; &#2347;&#2364;&#2366;&#2311;&#2354;&#2379;&#2306; &#2325;&#2379; &#2346;&#2381;&#2352;&#2360;&#2366;&#2352;&#2367;&#2340; &#2325;&#2352;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2319;&#2325; &#2344;&#2375;&#2335;&#2357;&#2352;&#2381;&#2325; &#2346;&#2381;&#2352;&#2379;&#2335;&#2379;&#2325;&#2377;&#2354; &#2361;&#2376;&#2404; <strong>&#2335;&#2375;&#2354;&#2344;&#2375;&#2335;</strong> &#2319;&#2325; &#2325;&#2350;&#2366;&#2306;&#2337; &#2354;&#2366;&#2311;&#2344; &#2311;&#2306;&#2335;&#2352;&#2347;&#2364;&#2375;&#2360; &#2352;&#2367;&#2350;&#2379;&#2335; &#2337;&#2367;&#2357;&#2366;&#2311;&#2360; &#2351;&#2366; &#2360;&#2352;&#2381;&#2357;&#2352; &#2325;&#2375; &#2360;&#2366;&#2341; &#2360;&#2306;&#2330;&#2366;&#2352; &#2325;&#2375; &#2354;&#2367;&#2319; &#2346;&#2381;&#2352;&#2342;&#2366;&#2344; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2325;&#2349;&#2368;</span><span style=\"font-family: Cambria Math;\">-</span><span style=\"font-family: Cambria Math;\">&#2325;&#2349;&#2368; &#2342;&#2370;&#2352;&#2360;&#2381;&#2341; &#2346;&#2381;&#2352;&#2348;&#2306;&#2343;&#2344; &#2325;&#2375; &#2354;&#2367;&#2319; &#2354;&#2375;&#2325;&#2367;&#2344; &#2344;&#2375;&#2335;&#2357;&#2352;&#2381;&#2325; &#2361;&#2366;&#2352;&#2381;&#2337;&#2357;&#2375;&#2351;&#2352; &#2332;&#2376;&#2360;&#2375; &#2346;&#2381;&#2352;&#2366;&#2352;&#2306;&#2349;&#2367;&#2325; &#2337;&#2367;&#2357;&#2366;&#2311;&#2360; &#2360;&#2375;&#2335;&#2309;&#2346; &#2325;&#2375; &#2354;&#2367;&#2319; &#2349;&#2368; &#2344;&#2367;&#2351;&#2379;&#2332;&#2367;&#2340; &#2361;&#2379;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\n",
                    correct: "d",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
                questions.push({
                    id: "17",
                    section: "31",
                    question_en: "<p>17. <span style=\"font-family: Cambria Math;\">The main purpose of time-sharing techniques used in computers is to make the best use of the_____________ .</span></p>\n",
                    question_hi: "<p>17. <span style=\"font-family: Cambria Math;\">&#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; &#2350;&#2375;&#2306; &#2313;&#2346;&#2351;&#2379;&#2327; &#2325;&#2368; &#2332;&#2366;&#2344;&#2375; &#2357;&#2366;&#2354;&#2368; &#2335;&#2366;&#2311;&#2350;</span><span style=\"font-family: Cambria Math;\">-</span><span style=\"font-family: Cambria Math;\">&#2358;&#2375;&#2351;&#2352;&#2367;&#2306;&#2327; &#2340;&#2325;&#2344;&#2368;&#2325;&#2379;&#2306; </span><span style=\"font-family: Cambria Math;\">(time-sharing techniques) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2366; &#2350;&#2369;&#2326;&#2381;&#2351; &#2313;&#2342;&#2381;&#2342;&#2375;&#2358;&#2381;&#2351; </span><span style=\"font-family: Cambria Math;\">____ </span><span style=\"font-family: Cambria Math;\">&#2325;&#2366; &#2360;&#2352;&#2381;&#2357;&#2379;&#2340;&#2381;&#2340;&#2350; &#2313;&#2346;&#2351;&#2379;&#2327; &#2325;&#2352;&#2344;&#2366; &#2361;&#2376;&#2404;</span></p>\n",
                    options_en: ["<p>peripherals</p>\n", "<p>secondary storage</p>\n", 
                                "<p>floppy discs</p>\n", "<p>CPU</p>\n"],
                    options_hi: ["<p><span style=\"font-weight: 400;\">&#2346;&#2375;&#2352;&#2367;&#2347;&#2375;&#2352;&#2354;&#2381;&#2360; (peripherals)</span></p>\n", "<p><span style=\"font-weight: 400;\">&#2360;&#2375;&#2325;&#2375;&#2306;&#2337;&#2352;&#2368; &#2360;&#2381;&#2335;&#2379;&#2352;&#2375;&#2332; (secondary storage)</span></p>\n",
                                "<p><span style=\"font-weight: 400;\">&#2347;&#2381;&#2354;&#2377;&#2346;&#2368; &#2337;&#2367;&#2360;&#2381;&#2325; (floppy disk)</span></p>\n", "<p>CPU</p>\n"],
                    solution_en: "<p>17.(d) <span style=\"font-family: Cambria Math;\">The main purpose of time sharing techniques used in computers <strong>is to make the best use of the CPU</strong>. Timesharing allows a central computer to be shared by a large number of users sitting at terminals.</span></p>\n",
                    solution_hi: "<p>17.(d) <span style=\"font-family: Cambria Math;\">&#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; &#2350;&#2375;&#2306; &#2313;&#2346;&#2351;&#2379;&#2327; &#2325;&#2368; &#2332;&#2366;&#2344;&#2375; &#2357;&#2366;&#2354;&#2368; &#2335;&#2366;&#2311;&#2350; &#2358;&#2375;&#2351;&#2352;&#2367;&#2306;&#2327; &#2340;&#2325;&#2344;&#2368;&#2325;&#2379;&#2306; &#2325;&#2366; <strong>&#2350;&#2369;&#2326;&#2381;&#2351; &#2313;&#2342;&#2381;&#2342;&#2375;&#2358;&#2381;&#2351; </strong></span><strong><span style=\"font-family: Cambria Math;\">CPU </span></strong><span style=\"font-family: Cambria Math;\"><strong>&#2325;&#2366; &#2360;&#2352;&#2381;&#2357;&#2379;&#2340;&#2381;&#2340;&#2350; &#2313;&#2346;&#2351;&#2379;&#2327; &#2325;&#2352;&#2344;&#2366; &#2361;&#2376;</strong>&#2404; &#2335;&#2366;&#2311;&#2350;&#2358;&#2375;&#2351;&#2352;&#2367;&#2306;&#2327; &#2319;&#2325; &#2360;&#2375;&#2306;&#2335;&#2381;&#2352;&#2354; &#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; &#2325;&#2379; &#2348;&#2337;&#2364;&#2368; &#2360;&#2306;&#2326;&#2381;&#2351;&#2366; &#2350;&#2375;&#2306; &#2335;&#2352;&#2381;&#2350;&#2367;&#2344;&#2354;&#2379;&#2306; </span><span style=\"font-family: Cambria Math;\">(terminals) </span><span style=\"font-family: Cambria Math;\">&#2346;&#2352; &#2348;&#2376;&#2336;&#2375; &#2313;&#2346;&#2351;&#2379;&#2327;&#2325;&#2352;&#2381;&#2340;&#2366;&#2323;&#2306; &#2342;&#2381;&#2357;&#2366;&#2352;&#2366; &#2360;&#2366;&#2333;&#2366; &#2325;&#2352;&#2344;&#2375; &#2325;&#2368; &#2309;&#2344;&#2369;&#2350;&#2340;&#2367; &#2342;&#2375;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\n",
                    correct: "d",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
                questions.push({
                    id: "18",
                    section: "31",
                    question_en: "<p>18.<span style=\"font-family: Cambria Math;\"> Which of the following is the type of software that has self-replicating software </span><span style=\"font-family: Cambria Math;\">that causes damage to files and systems?</span></p>\n",
                    question_hi: "<p>18. <span style=\"font-family: Cambria Math;\">&#2344;&#2367;&#2350;&#2381;&#2344;&#2354;&#2367;&#2326;&#2367;&#2340; &#2350;&#2375;&#2306; &#2360;&#2375; &#2325;&#2380;&#2344; &#2360;&#2366; &#2360;&#2377;&#2347;&#2381;&#2335;&#2357;&#2375;&#2351;&#2352; &#2325;&#2366; &#2346;&#2381;&#2352;&#2325;&#2366;&#2352; &#2361;&#2376; &#2332;&#2367;&#2360;&#2350;&#2375;&#2306; &#2360;&#2381;&#2357;</span><span style=\"font-family: Cambria Math;\">-</span><span style=\"font-family: Cambria Math;\">&#2346;&#2381;&#2352;&#2340;&#2367;&#2325;&#2371;&#2340;&#2367; &#2360;&#2377;&#2347;&#2381;&#2335;&#2357;&#2375;&#2351;&#2352; &#2361;&#2376; &#2332;&#2379; &#2347;&#2366;&#2311;&#2354;&#2379;&#2306; &#2324;&#2352; &#2360;&#2367;&#2360;&#2381;&#2335;&#2350; &#2325;&#2379; &#2344;&#2369;&#2325;&#2360;&#2366;&#2344; &#2346;&#2361;&#2369;&#2306;&#2330;&#2366;&#2340;&#2366; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">?</span></p>\n",
                    options_en: ["<p>Worms</p>\n", "<p>Viruses</p>\n", 
                                "<p>Trojan horses</p>\n", "<p>Bots</p>\n"],
                    options_hi: ["<p><span style=\"font-weight: 400;\">&#2357;&#2352;&#2381;&#2350;&#2381;&#2360; (Worms)</span></p>\n", "<p><span style=\"font-weight: 400;\">&#2357;&#2366;&#2351;&#2352;&#2360; (Viruses)</span></p>\n",
                                "<p><span style=\"font-weight: 400;\">&#2335;&#2381;&#2352;&#2379;&#2332;&#2344; &#2361;&#2377;&#2352;&#2381;&#2360; (Trojan horses)</span></p>\n", "<p><span style=\"font-weight: 400;\">&#2348;&#2377;&#2335;&#2381;&#2360; (Bots)</span></p>\n"],
                    solution_en: "<p>18.(a)<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">A</span><span style=\"font-family: Cambria Math;\"> computer <strong>worm</strong> </span><span style=\"font-family: Cambria Math;\">is a type of malware whose primary function is to self-replicate and infect other computers while remaining active on infected systems.</span><span style=\"font-family: Cambria Math;\"> <strong>Computer virus</strong></span><span style=\"font-family: Cambria Math;\">&rarr;</span><span style=\"font-family: Cambria Math;\">It </span><span style=\"font-family: Cambria Math;\">is a malicious piece of computer code designed to spread from device to device.</span><strong><span style=\"font-family: Cambria Math;\">Trojan horse/virus</span></strong><span style=\"font-family: Cambria Math;\">&rarr;</span><span style=\"font-family: Cambria Math;\">It </span><span style=\"font-family: Cambria Math;\">can be a program that purports to do one action when, in fact, it is performing a malicious action on your computer. </span><strong><span style=\"font-family: Cambria Math;\">Bots</span></strong><span style=\"font-family: Cambria Math;\">&rarr;</span><span style=\"font-family: Cambria Math;\">A bot is a software program that performs automated, repetitive, predefined tasks. Bots typically imitate or replace human user behavior. Because they are automated, they operate much faster than human users.</span></p>\n",
                    solution_hi: "<p>18.(a)<strong><span style=\"font-family: Cambria Math;\"> </span></strong><span style=\"font-family: Cambria Math;\"><strong>&#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; &#2357;&#2352;&#2381;&#2350;</strong> &#2319;&#2325; &#2346;&#2381;&#2352;&#2325;&#2366;&#2352; &#2325;&#2366; &#2350;&#2376;&#2354;&#2357;&#2375;&#2351;&#2352; &#2361;&#2376; &#2332;&#2367;&#2360;&#2325;&#2366; &#2346;&#2381;&#2352;&#2366;&#2341;&#2350;&#2367;&#2325; &#2325;&#2366;&#2352;&#2381;&#2351; &#2360;&#2306;&#2325;&#2381;&#2352;&#2350;&#2367;&#2340; &#2360;&#2367;&#2360;&#2381;&#2335;&#2350; &#2346;&#2352; &#2360;&#2325;&#2381;&#2352;&#2367;&#2351; &#2352;&#2361;&#2340;&#2375; &#2361;&#2369;&#2319; &#2309;&#2344;&#2381;&#2351; &#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352;&#2379;&#2306; &#2325;&#2379; &#2360;&#2381;&#2357;</span><span style=\"font-family: Cambria Math;\">-</span><span style=\"font-family: Cambria Math;\">&#2342;&#2379;&#2361;&#2352;&#2366;&#2344;&#2366; &#2324;&#2352; &#2360;&#2306;&#2325;&#2381;&#2352;&#2350;&#2367;&#2340; &#2325;&#2352;&#2344;&#2366; &#2361;&#2376;&#2404; </span></p>\r\n<p><strong><span style=\"font-family: Cambria Math;\">&#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; &#2357;&#2366;&#2351;&#2352;&#2360;</span><span style=\"font-family: Cambria Math;\">(computer virus)</span></strong><span style=\"font-family: Cambria Math;\"> &rarr; </span><span style=\"font-family: Cambria Math;\">&#2351;&#2361; &#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; &#2325;&#2379;&#2337; &#2325;&#2366; &#2319;&#2325; &#2342;&#2369;&#2352;&#2381;&#2349;&#2366;&#2357;&#2344;&#2366;&#2346;&#2370;&#2352;&#2381;&#2339; &#2335;&#2369;&#2325;&#2337;&#2364;&#2366;</span><span style=\"font-family: Cambria Math;\">(</span><span style=\"font-family: Cambria Math;\">malicious piece</span><span style=\"font-family: Cambria Math;\">) </span><span style=\"font-family: Cambria Math;\">&#2361;&#2376; &#2332;&#2367;&#2360;&#2375; &#2337;&#2367;&#2357;&#2366;&#2311;&#2360; &#2360;&#2375; &#2337;&#2367;&#2357;&#2366;&#2311;&#2360; &#2350;&#2375;&#2306; &#2347;&#2376;&#2354;&#2366;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2337;&#2367;&#2332;&#2364;&#2366;&#2311;&#2344; &#2325;&#2367;&#2351;&#2366; &#2327;&#2351;&#2366; &#2361;&#2376;&#2404; </span></p>\r\n<p><strong><span style=\"font-family: Cambria Math;\">&#2335;&#2381;&#2352;&#2379;&#2332;&#2344;&#2361;&#2377;&#2352;&#2381;&#2360;</span><span style=\"font-family: Cambria Math;\">/</span><span style=\"font-family: Cambria Math;\">&#2357;&#2366;&#2351;&#2352;&#2360;</span><span style=\"font-family: Cambria Math;\">(Trojan horse)</span></strong><span style=\"font-family: Cambria Math;\"> &rarr; </span><span style=\"font-family: Cambria Math;\">&#2351;&#2361; &#2319;&#2325; &#2320;&#2360;&#2366; &#2346;&#2381;&#2352;&#2379;&#2327;&#2381;&#2352;&#2366;&#2350; &#2361;&#2379; &#2360;&#2325;&#2340;&#2366; &#2361;&#2376; &#2332;&#2379; &#2319;&#2325; &#2325;&#2366;&#2352;&#2381;&#2351; &#2325;&#2352;&#2344;&#2375; &#2325;&#2366; &#2342;&#2366;&#2357;&#2366; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2357;&#2366;&#2360;&#2381;&#2340;&#2357; &#2350;&#2375;&#2306;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2351;&#2361; &#2310;&#2346;&#2325;&#2375; &#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; &#2346;&#2352; &#2319;&#2325; &#2342;&#2369;&#2352;&#2381;&#2349;&#2366;&#2357;&#2344;&#2366;&#2346;&#2370;&#2352;&#2381;&#2339; &#2325;&#2366;&#2352;&#2381;&#2351;</span><span style=\"font-family: Cambria Math;\">(</span><span style=\"font-family: Cambria Math;\">malicious action</span><span style=\"font-family: Cambria Math;\">) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2352; &#2352;&#2361;&#2366; &#2361;&#2376;&#2404;</span><span style=\"font-family: Cambria Math;\"> </span><strong><span style=\"font-family: Cambria Math;\">&#2348;&#2377;&#2335;&#2381;&#2360;</span><span style=\"font-family: Cambria Math;\">(Bots)</span></strong><span style=\"font-family: Cambria Math;\"> &rarr; </span><span style=\"font-family: Cambria Math;\">&#2348;&#2377;&#2335; &#2319;&#2325; &#2360;&#2377;&#2347;&#2381;&#2335;&#2357;&#2375;&#2351;&#2352; &#2346;&#2381;&#2352;&#2379;&#2327;&#2381;&#2352;&#2366;&#2350; &#2361;&#2376; &#2332;&#2379; &#2360;&#2381;&#2357;&#2330;&#2366;&#2354;&#2367;&#2340;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2342;&#2379;&#2361;&#2352;&#2366;&#2319; &#2332;&#2366;&#2344;&#2375; &#2357;&#2366;&#2354;&#2375;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2346;&#2370;&#2352;&#2381;&#2357;&#2344;&#2367;&#2352;&#2381;&#2343;&#2366;&#2352;&#2367;&#2340; &#2325;&#2366;&#2352;&#2381;&#2351;&#2379;&#2306; &#2325;&#2379; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376;&#2404; &#2348;&#2377;&#2335; &#2310;&#2350;&#2340;&#2380;&#2352; &#2346;&#2352; &#2350;&#2366;&#2344;&#2357; &#2313;&#2346;&#2351;&#2379;&#2327;&#2325;&#2352;&#2381;&#2340;&#2366; &#2357;&#2381;&#2351;&#2357;&#2361;&#2366;&#2352; &#2325;&#2368; &#2344;&#2325;&#2354; &#2325;&#2352;&#2340;&#2375; &#2361;&#2376;&#2306; &#2351;&#2366; &#2313;&#2360;&#2375; &#2348;&#2342;&#2354; &#2342;&#2375;&#2340;&#2375; &#2361;&#2376;&#2306;&#2404; &#2325;&#2381;&#2351;&#2379;&#2306;&#2325;&#2367; &#2357;&#2375; &#2360;&#2381;&#2357;&#2330;&#2366;&#2354;&#2367;&#2340; &#2361;&#2376;&#2306;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2357;&#2375; &#2350;&#2366;&#2344;&#2357; &#2313;&#2346;&#2351;&#2379;&#2327;&#2325;&#2352;&#2381;&#2340;&#2366;&#2323;&#2306; &#2325;&#2368; &#2340;&#2369;&#2354;&#2344;&#2366; &#2350;&#2375;&#2306; &#2348;&#2361;&#2369;&#2340; &#2340;&#2375;&#2332;&#2368; &#2360;&#2                     solution_hi: "<p>19.(a) <span style=\"font-family: Cambria Math;\">&#2350;&#2376;&#2327;&#2381;&#2344;&#2367;&#2347;&#2366;&#2351;&#2352; &#2348;&#2335;&#2344;</span><span style=\"font-family: Cambria Math;\">(Magnifier button) </span><span style=\"font-family: Cambria Math;\"><strong>&#2346;&#2381;&#2352;&#2367;&#2306;&#2335; &#2346;&#2381;&#2352;&#2368;&#2357;&#2381;&#2351;&#2370; &#2335;&#2370;&#2354;&#2348;&#2366;&#2352; </strong>&#2346;&#2352; &#2313;&#2346;&#2354;&#2348;&#2381;&#2343; &#2361;&#2376;&#2404; &#2346;&#2381;&#2352;&#2367;&#2306;&#2335; &#2346;&#2381;&#2352;&#2368;&#2357;&#2381;&#2351;&#2370; &#2335;&#2370;&#2354;&#2348;&#2366;&#2352; &#2310;&#2346;&#2325;&#2379; &#2309;&#2346;&#2344;&#2375; &#2337;&#2377;&#2325;&#2381;&#2351;&#2370;&#2350;&#2375;&#2306;&#2335; &#2325;&#2375; &#2357;&#2381;&#2351;&#2370;</span><span style=\"font-family: Cambria Math;\">(view) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2379; &#2348;&#2338;&#2364;&#2366;&#2344;&#2375; &#2351;&#2366; &#2328;&#2335;&#2366;&#2344;&#2375; &#2325;&#2368; &#2309;&#2344;&#2369;&#2350;&#2340;&#2367; &#2342;&#2375;&#2340;&#2366; &#2361;&#2376;&#2404; &#2310;&#2346; &#2335;&#2375;&#2325;&#2381;&#2360;&#2381;&#2335; &#2348;&#2377;&#2325;&#2381;&#2360; &#2350;&#2375;&#2306; &#2346;&#2381;&#2352;&#2340;&#2367;&#2358;&#2340;</span><span style=\"font-family: Cambria Math;\">(percentage) </span><span style=\"font-family: Cambria Math;\">&#2335;&#2366;&#2311;&#2346; &#2325;&#2352; &#2360;&#2325;&#2340;&#2375; &#2361;&#2376;&#2306;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2351;&#2366; &#2319;&#2352;&#2379;</span><span style=\"font-family: Cambria Math;\">(arrow) </span><span style=\"font-family: Cambria Math;\">&#2346;&#2352; &#2325;&#2381;&#2354;&#2367;&#2325; &#2325;&#2352;&#2325;&#2375; &#2346;&#2381;&#2352;&#2340;&#2367;&#2358;&#2340;</span><span style=\"font-family: Cambria Math;\">(percentage) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2366; &#2330;&#2351;&#2344; &#2325;&#2352; &#2360;&#2325;&#2340;&#2375; &#2361;&#2376;&#2306;&#2404;</span></p>\n",

                questions.push({
                    id: "20",
                    section: "misc",
                    question_en: "<p>20.<span style=\"font-family: Cambria Math;\"> An operating system is said to be multiuser, if_______.</span></p>\n",
                    question_hi: "<p>20.<span style=\"font-family: Cambria Math;\">&#2319;&#2325; &#2321;&#2346;&#2352;&#2375;&#2335;&#2367;&#2306;&#2327; &#2360;&#2367;&#2360;&#2381;&#2335;&#2350; &#2325;&#2379; &#2350;&#2354;&#2381;&#2335;&#2368;&#2351;&#2370;&#2395;&#2352;</span><span style=\"font-family: Cambria Math;\">(multi user) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2361;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2351;&#2342;&#2367;</span><span style=\"font-family: Cambria Math;\">_______</span></p>\n",
                    options_en: ["<p>more than one users can work simultaneously</p>\n", "<p>more than one programs can run simultaneously</p>\n", 
                                "<p>Either &lsquo;a&rsquo; or &lsquo;b&rsquo;</p>\n", "<p>None of the above</p>\n"],
                    options_hi: ["<p><span style=\"font-family: Cambria Math;\">&#2319;&#2325; &#2360;&#2375; &#2309;&#2343;&#2367;&#2325; &#2351;&#2370;&#2332;&#2352; &#2319;&#2325; &#2360;&#2366;&#2341; &#2325;&#2366;&#2350; &#2325;&#2352; &#2360;&#2325;&#2340;&#2375; &#2361;&#2376;&#2306;</span></p>\n", "<p><span style=\"font-family: Cambria Math;\">&#2319;&#2325; &#2360;&#2375; &#2309;&#2343;&#2367;&#2325; &#2346;&#2381;&#2352;&#2379;&#2327;&#2381;&#2352;&#2366;&#2350; &#2319;&#2325; &#2360;&#2366;&#2341; &#2330;&#2354; &#2360;&#2325;&#2340;&#2375; &#2361;&#2376;&#2306;</span></p>\n",
                                "<p><span style=\"font-family: Cambria Math;\">&#2351;&#2366; &#2340;&#2379; </span><span style=\"font-family: Cambria Math;\">\'a\' </span><span style=\"font-family: Cambria Math;\">&#2351;&#2366; </span><span style=\"font-family: Cambria Math;\">\'b\'</span></p>\n", "<p><span style=\"font-family: Cambria Math;\">&#2313;&#2346;&#2352;&#2379;&#2325;&#2381;&#2340; &#2350;&#2375;&#2306; &#2360;&#2375; &#2325;&#2379;&#2312; &#2344;&#2361;&#2368;&#2306;</span></p>\n"],
                    solution_en: "<p>20.(a)<span style=\"font-family: Cambria Math;\"> The OS allows multiple users to access a computer system concurrently. It is used in </span><span style=\"font-family: Cambria Math;\">computer networks that allows same data and applications to be accessed by multiple users </span><span style=\"font-family: Cambria Math;\">at the same time. e.g. VMS.</span></p>\n",
                    solution_hi: "<p>20.(a)<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2323;&#2319;&#2360;</span><span style=\"font-family: Cambria Math;\">(OS) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2312; &#2313;&#2346;&#2351;&#2379;&#2327;&#2325;&#2352;&#2381;&#2340;&#2366;&nbsp;&#2325;&#2379; &#2360;&#2350;&#2357;&#2352;&#2381;&#2340;&#2368;</span><span style=\"font-family: Cambria Math;\">(concurrently) </span><span style=\"font-family: Cambria Math;\">&#2352;&#2370;&#2346; &#2360;&#2375; &#2319;&#2325; &#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; &#2360;&#2367;&#2360;&#2381;&#2335;&#2350; &#2325;&#2366; &#2313;&#2346;&#2351;&#2379;&#2327; &#2325;&#2352;&#2344;&#2375; &#2325;&#2368; &#2309;&#2344;&#2369;&#2350;&#2340;&#2367; &#2342;&#2375;&#2340;&#2366; &#2361;&#2376;&#2404; &#2351;&#2375; &#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; &#2344;&#2375;&#2335;&#2357;&#2352;&#2381;&#2325; &#2350;&#2375;&#2306; &#2346;&#2381;&#2352;&#2351;&#2379;&#2327; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376; &#2332;&#2379; &#2319;&#2325; &#2361;&#2368; &#2337;&#2375;&#2335;&#2366; &#2324;&#2352; &#2319;&#2346;&#2381;&#2354;&#2367;&#2325;&#2375;&#2358;&#2344;</span><span style=\"font-family: Cambria Math;\">(application) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2379; &#2319;&#2325; &#2361;&#2368; &#2360;&#2350;&#2351; &#2350;&#2375;&#2306; &#2325;&#2312; &#2351;&#2370;&#2395;&#2352;&#2381;&#2360; &#2342;&#2381;&#2357;&#2366;&#2352;&#2366; &#2319;&#2325;&#2381;&#2360;&#2375;&#2360;</span><span style=\"font-family: Cambria Math;\">(access) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2352;&#2344;&#2375; &#2325;&#2368; &#2309;&#2344;&#2369;&#2350;&#2340;&#2367; &#2342;&#2375;&#2340;&#2366; &#2361;&#2376; &#2313;&#2342;&#2366;</span><span style=\"font-family: Cambria Math;\">. VMS.</span><span style=\"font-family: Cambria Math;\">&#2404;</span></p>\n",
                    correct: "a",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
            
            // Generate question boxes
            const boxesContainer = document.getElementById('question-boxes');
            questions.forEach((q, index) => {
                const box = document.createElement('div');
                box.className = 'q-box';
                box.textContent = index + 1;
                box.onclick = () => showQuestion(index);
                box.id = `box-${index}`;
                boxesContainer.appendChild(box);
            });
            
            // Show first question
            showQuestion(0);
            updateProgress();
        }
        
        // Show a specific question
        
        function formatContent(text) {
            if (!text) return '';
            return text.replace(/<img/g, '<img style="max-width:100%;height:auto;"');
        }
        
        function showQuestion(index) {
            if (index < 0 || index >= questions.length) return;
            
            currentQuestion = index;
            const question = questions[index];
            
            // Update question counter
            document.getElementById('question-counter').textContent = `Question ${index + 1} of ${questions.length}`;
            
            // Update question boxes
            document.querySelectorAll('.q-box').forEach(box => box.classList.remove('current'));
            document.getElementById(`box-${index}`).classList.add('current');
            
            // Generate question HTML
            let html = `
                <div class="question-card">
                    <div class="question-text">
                        <div class="en">${formatContent(question.question_en)}</div>
                        <div class="hi" style="display:none">${formatContent(question.question_hi)} </div>
                    </div>
                    <div class="options" id="options-container">`;
            
            // Add options
            ['a', 'b', 'c', 'd'].forEach((opt, i) => {
                let optionClass = '';
                let isCorrectAnswer = opt === question.correct;
                let isUserAnswer = answers[question.id] === opt;
                
                // When reviewing, add appropriate classes
                if (submitted) {
                    if (isCorrectAnswer) {
                        optionClass += ' correct-answer';
                    } else if (isUserAnswer && !isCorrectAnswer) {
                        optionClass += ' incorrect';
                    }
                }
                
                html += `
                    <div class="option-item">
                        <input class="option-input" type="radio" name="q${index}" 
                            id="opt-${index}-${opt}" value="${opt}" 
                            ${isUserAnswer ? 'checked' : ''}
                            onclick="selectAnswer('${question.id}', '${opt}')">
                       <label class="option-label${optionClass}" for="opt-${index}-${opt}">
                            <div class="en">${question.options_en[i]}</div>
                            <div class="hi" style="display:none">${question.options_hi[i]}</div>
                        </label>
                    </div>`;
            });
            
            // Add solution if submitted
            if (submitted) {
                const isCorrect = answers[question.id] === question.correct;
                const resultText = answers[question.id] ? (isCorrect ? 'Correct!' : 'Incorrect!') : 'Not attempted';
                
                html += `
                    <div class="solution-container">
                        <div class="solution-title">${resultText}</div>
                        <div class="solution-text">
                            <div class="en">${question.solution_en}</div>
                            <div class="hi" style="display:none">${question.solution_hi}</div>
                        </div>
                    </div>`;
            }
            
            html += `</div></div>`;
            
            document.getElementById('questions-container').innerHTML = html;
            
            // Apply language settings
            applyLanguage();
            
            // If in mobile view, close the menu
            if (window.innerWidth < 992) {
                toggleNav(false);
            }
            
            // Add review mode class if submitted
            if (submitted) {
                document.getElementById('options-container').classList.add('review-mode');
            }
        }
        
        // Apply current language
        function applyLanguage() {
            document.querySelectorAll(`.${currentLang}`).forEach(el => el.style.display = 'block');
            document.querySelectorAll(`.${currentLang === 'en' ? 'hi' : 'en'}`).forEach(el => el.style.display = 'none');
            
            // Update language button text
            document.getElementById('lang-text').textContent = currentLang === 'en' ? 'Hi' : 'En';
        }
        
        // Select an answer
        function selectAnswer(qId, option) {
            if (submitted) return;
            
            answers[qId] = option;
            updateProgress();
            
            // Mark question as attempted in the navigation
            const index = questions.findIndex(q => q.id === qId);
            if (index >= 0) {
                const box = document.getElementById(`box-${index}`);
                box.classList.add('attempted');
                box.classList.remove('unattempted');
            }
        }
        
        // Navigate to previous/next question
        function prevQuestion() { 
            if (currentQuestion > 0) showQuestion(currentQuestion - 1); 
        }
        
        function nextQuestion() { 
            if (currentQuestion < questions.length - 1) showQuestion(currentQuestion + 1); 
        }
        
        // Switch section
        function switchSection(sectionId) {
            if (sectionId === 'all') {
                showQuestion(0);
                return;
            }
            
            const section = sections[sectionId];
            if (section) showQuestion(section.start);
        }
        
        // Toggle language
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            applyLanguage();
        }
        
        // Toggle navigation sidebar
        function toggleNav(show) {
            const nav = document.getElementById('question-nav');
            const overlay = document.getElementById('nav-overlay');
            
            if (show === undefined) {
                show = !nav.classList.contains('show');
            }
            
            if (show) {
                nav.classList.add('show');
                overlay.classList.add('show');
                document.body.style.overflow = 'hidden';
            } else {
                nav.classList.remove('show');
                overlay.classList.remove('show');
                document.body.style.overflow = '';
            }
        }
        
        // Update progress
        function updateProgress() {
            const attempted = Object.keys(answers).length;
            document.getElementById('attempted-count').textContent = attempted;
        }
        
        // Start timer
        function startTimer() {
            const timerDisplay = document.getElementById('timer-display');
            let timeLeft = totalTime;
            
            const timerInterval = setInterval(() => {
                if (timeLeft <= 0 || submitted) {
                    clearInterval(timerInterval);
                    if (!submitted) submitTest();
                    return;
                }
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                timeLeft--;
            }, 1000);
        }
        
        // Confirm before submitting
        function confirmSubmit() {
            if (submitted) return;
            
            const attempted = Object.keys(answers).length;
            const remaining = questions.length - attempted;
            
            // Create a more modern confirmation dialog
            const confirmHtml = `
                <div style="text-align: center; padding: 20px;">
                    <h4 style="margin-bottom: 16px; color: var(--dark);">Confirm Submission</h4>
                    <p style="margin-bottom: 24px; color: var(--gray);">
                        You have attempted ${attempted} of ${questions.length} questions.<br>
                        ${remaining} questions are unattempted.
                    </p>
                    <div style="display: flex; justify-content: center; gap: 12px;">
                        <button onclick="this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; border: 1px solid var(--light-gray); background: white; border-radius: 8px; cursor: pointer;">
                            Cancel
                        </button>
                        <button onclick="submitTest(); this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer;">
                            Submit Test
                        </button>
                    </div>
                </div>`;
            
            // Create modal element
            const modal = document.createElement('div');
            modal.className = 'results-modal show';
            modal.innerHTML = `
                <div class="results-card" style="max-width: 400px;">
                    <button class="cancel-btn" style="position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--gray);" onclick="this.closest('.results-modal').remove()">
                        ×
                    </button>
                    ${confirmHtml}
                </div>`;
            
            document.body.appendChild(modal);
        }
        
        // Submit test
        function submitTest() {
            if (submitted) return;
            
            submitted = true;
            
            let score = 0;
            let correctCount = 0;
            let incorrectCount = 0;
            let unattemptedCount = 0;
            
            questions.forEach((q, index) => {
                const userAns = answers[q.id];
                const box = document.getElementById(`box-${index}`);
                
                box.classList.remove('attempted');
                
                if (!userAns) {
                    unattemptedCount++;
                    box.classList.add('unattempted');
                } else if (userAns === q.correct) {
                    correctCount++;
                    score += q.pos_marks;
                    box.classList.add('correct');
                } else {
                    incorrectCount++;
                    score -= q.neg_marks;
                    box.classList.add('incorrect');
                }
            });
            
            // Update result values
            document.getElementById('score-value').textContent = score.toFixed(2);
            document.getElementById('correct-value').textContent = correctCount;
            document.getElementById('incorrect-value').textContent = incorrectCount;
            document.getElementById('unattempted-value').textContent = unattemptedCount;
            
            // Show the results modal
            document.getElementById('results-modal').classList.add('show');
            
            // Disable submit button
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-check"></i>';
            submitBtn.style.backgroundColor = 'var(--success)';
            
            // Refresh current question view to show solution
            showQuestion(currentQuestion);
        }
        
        // Review test
        function reviewTest() {
            document.getElementById('results-modal').classList.remove('show');
            showQuestion(0);
        }
        
        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('results-modal')) {
                document.getElementById('results-modal').classList.remove('show');
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === 'ArrowRight') nextQuestion();
        });
    </script>
</body>
</html>
