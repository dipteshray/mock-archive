                    options_en: ["<p>Online processing</p>\n", "<p>File processing</p>\n", 
                                "<p>Data processing</p>\n", "<p>Batch processing</p>\n"],
                    options_hi: ["<p><span style=\"font-weight: 400;\">&#2321;&#2344;&#2354;&#2366;&#2311;&#2344; &#2346;&#2381;&#2352;&#2379;&#2360;&#2375;&#2360;&#2367;&#2306;&#2327; (Online processing)</span></p>\n", "<p><span style=\"font-weight: 400;\">&#2347;&#2366;&#2311;&#2354; &#2346;&#2381;&#2352;&#2379;&#2360;&#2375;&#2360;&#2367;&#2306;&#2327; (File processing)</span></p>\n",
                                "<p><span style=\"font-weight: 400;\">&#2337;&#2366;&#2335;&#2366; &#2346;&#2381;&#2352;&#2379;&#2360;&#2375;&#2360;&#2367;&#2306;&#2327; (Data processing)</span></p>\n", "<p><span style=\"font-weight: 400;\">&#2348;&#2376;&#2330; &#2346;&#2381;&#2352;&#2379;&#2360;&#2375;&#2360;&#2367;&#2306;&#2327; (Batch processing)</span></p>\n"],
                    solution_en: "<p>15.(d)<span style=\"font-family: Cambria Math;\"> </span><strong><span style=\"font-family: Cambria Math;\">Batch processing</span></strong><span style=\"font-family: Cambria Math;\"> is a technique for automating and processing multiple transactions as a single group for e.g.</span><span style=\"font-family: Cambria Math;\">Unix.</span></p>\n",
                    solution_hi: "<p>15.(d)<span style=\"font-family: Cambria Math;\"> </span><strong><span style=\"font-family: Cambria Math;\">&#2348;&#2376;&#2330; &#2346;&#2381;&#2352;&#2379;&#2360;&#2375;&#2360;&#2367;&#2306;&#2327;</span></strong><span style=\"font-family: Cambria Math;\"><strong>(Batch processing)</strong>, </span><span style=\"font-family: Cambria Math;\">&#2319;&#2325; &#2360;&#2350;&#2370;&#2361; &#2325;&#2375; &#2352;&#2370;&#2346; &#2350;&#2375;&#2306; &#2325;&#2312; &#2354;&#2375;&#2344;</span><span style=\"font-family: Cambria Math;\">-</span><span style=\"font-family: Cambria Math;\">&#2342;&#2375;&#2344;</span><span style=\"font-family: Cambria Math;\">(</span><span style=\"font-family: Cambria Math;\">transactions</span><span style=\"font-family: Cambria Math;\">) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2379; &#2321;&#2335;&#2379;&#2350;&#2373;&#2335;&#2367;&#2306;&#2327; &#2324;&#2352; &#2346;&#2381;&#2352;&#2379;&#2360;&#2375;&#2360;&#2367;&#2306;&#2327; &#2325;&#2352;&#2344;&#2375; &#2325;&#2368; &#2319;&#2325; &#2340;&#2325;&#2344;&#2368;&#2325; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2313;&#2342;&#2366;&#2361;&#2352;&#2339; &#2325;&#2375; &#2354;&#2367;&#2319; &#2351;&#2370;&#2344;&#2367;&#2325;&#2381;&#2360;</span><span style=\"font-family: Cambria Math;\">(unix)</span><span style=\"font-family: Cambria Math;\">&#2404;</span></p>\n",
                    correct: "d",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
                questions.push({
                    id: "16",
                    section: "31",
                    question_en: "<p>16. <span style=\"font-family: Cambria Math;\">The period of the second generation computers was_______.</span></p>\n",
                    question_hi: "<p>16.<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2342;&#2370;&#2360;&#2352;&#2368; &#2346;&#2368;&#2338;&#2364;&#2368; &#2325;&#2375; &#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352;&#2379;&#2306; &#2325;&#2368; &#2360;&#2350;&#2351; </span><span style=\"font-family: Cambria Math;\">________ </span><span style=\"font-family: Cambria Math;\">&#2341;&#2368;&#2404;</span></p>\n",
                    options_en: ["<p>1959-65</p>\n", "<p>1946-1958</p>\n", 
                                "<p>1940-1960</p>\n", "<p>1957-1964</p>\n"],
                    options_hi: ["<p>1959-65</p>\n", "<p>1946-1958</p>\n",
                                "<p>1940-1960</p>\n", "<p>1957-1964</p>\n"],
                    solution_en: "<p>16.(a) <span style=\"font-family: Cambria Math;\">The second generation computers were used during </span><strong><span style=\"font-family: Cambria Math;\">1959-65</span></strong><span style=\"font-family: Cambria Math;\">. They are also known as transistor computers. </span></p>\n",
                    solution_hi: "<p>16.(a) <span style=\"font-family: Cambria Math;\">&#2342;&#2370;&#2360;&#2352;&#2368; &#2346;&#2368;&#2338;&#2364;&#2368; &#2325;&#2375; &#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352;&#2379;&#2306; &#2325;&#2366; &#2346;&#2381;&#2352;&#2351;&#2379;&#2327; </span><span style=\"font-family: Cambria Math;\"><strong>1959-65</strong> </span><span style=\"font-family: Cambria Math;\">&#2325;&#2375; &#2342;&#2380;&#2352;&#2366;&#2344; &#2325;&#2367;&#2351;&#2366; &#2327;&#2351;&#2366; &#2341;&#2366;&#2404; &#2313;&#2344;&#2381;&#2361;&#2375;&#2306; &#2335;&#2381;&#2352;&#2366;&#2306;&#2332;&#2367;&#2360;&#2381;&#2335;&#2352; </span><span style=\"font-family: Cambria Math;\">(transistor) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; &#2325;&#2375; &#2352;&#2370;&#2346; &#2350;&#2375;&#2306; &#2349;&#2368; &#2332;&#2366;&#2344;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\n",
                    correct: "a",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
                questions.push({
                    id: "17",
                    section: "31",
                    question_en: "<p><span style=\"font-family: Cambria Math;\">17. </span><span style=\"font-family: Cambria Math;\">What is the brain of the computer?</span></p>\n",
                    question_hi: "<p>17.<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; &#2325;&#2366; &#2350;&#2360;&#2381;&#2340;&#2367;&#2359;&#2381;&#2325; </span><span style=\"font-family: Cambria Math;\">(brain) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2367;&#2360;&#2375; &#2325;&#2361;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">?</span></p>\n",
                    options_en: ["<p>CPU</p>\n", "<p>Keyboard</p>\n", 
                                "<p>Mouse</p>\n", "<p>Printer</p>\n"],
                    options_hi: ["<p>CPU</p>\n", "<p><span style=\"font-weight: 400;\">&#2325;&#2368;&#2348;&#2379;&#2352;&#2381;&#2337; (Keyboard)</span></p>\n",
                                "<p><span style=\"font-weight: 400;\">&#2350;&#2366;&#2313;&#2360; (Mouse)</span></p>\n", "<p><span style=\"font-weight: 400;\">&#2346;&#2381;&#2352;&#2367;&#2306;&#2335;&#2352; (Printer)</span></p>\n"],
                    solution_en: "<p>17.(a)<span style=\"font-family: Cambria Math;\"> The <strong>Central Processing Unit</strong> is often called the brain of a computer. A CPU controls all the internal and external devices and performs arithmetic and logic Operations.</span></p>\n",
                    solution_hi: "<p>17.(a)<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\"><strong>&#2360;&#2375;&#2306;&#2335;&#2381;&#2352;&#2354; &#2346;&#2381;&#2352;&#2379;&#2360;&#2375;&#2360;&#2367;&#2306;&#2327; &#2351;&#2370;&#2344;&#2367;&#2335;</strong> &#2325;&#2379; &#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; &#2325;&#2366; &#2350;&#2360;&#2381;&#2340;&#2367;&#2359;&#2381;&#2325; &#2325;&#2361;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404; &#2319;&#2325; </span><span style=\"font-family: Cambria Math;\">CPU </span><span style=\"font-family: Cambria Math;\">&#2360;&#2349;&#2368; &#2311;&#2306;&#2335;&#2352;&#2344;&#2354; &#2324;&#2352; &#2319;&#2325;&#2381;&#2360;&#2335;&#2352;&#2381;&#2344;&#2354; &#2337;&#2367;&#2357;&#2366;&#2311;&#2360; </span><span style=\"font-family: Cambria Math;\">(internal or external device) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2379; &#2325;&#2306;&#2335;&#2381;&#2352;&#2379;&#2354; </span><span style=\"font-family: Cambria Math;\">(control) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2352;&#2340;&#2366; &#2361;&#2376; &#2324;&#2352; &#2309;&#2352;&#2367;&#2341;&#2350;&#2375;&#2335;&#2367;&#2325; &#2324;&#2352; &#2354;&#2377;&#2332;&#2367;&#2325; </span><span style=\"font-family: Cambria Math;\">(arithmetic and logic) </span><span style=\"font-family: Cambria Math;\">&#2360;&#2306;&#2330;&#2366;&#2354;&#2344; </span><span style=\"font-family: Cambria Math;\">(operations) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2352;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\n",
                    correct: "a",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
                questions.push({
                    id: "18",
                    section: "31",
                    question_en: "<p>18.<span style=\"font-family: Cambria Math;\"> What is the value of the binary number 101?</span></p>\n",
                    question_hi: "<p>18.<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2348;&#2366;&#2311;&#2344;&#2352;&#2368; &#2360;&#2306;&#2326;&#2381;&#2351;&#2366; </span><span style=\"font-family: Cambria Math;\">101 </span><span style=\"font-family: Cambria Math;\">&#2325;&#2366; &#2350;&#2366;&#2344; &#2325;&#2381;&#2351;&#2366; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">?</span></p>\n",
                    options_en: ["<p>5</p>\n", "<p>3</p>\n", 
                                "<p>6</p>\n", "<p>101</p>\n"],
                    options_hi: ["<p>5</p>\n", "<p>3</p>\n",
                                "<p>6</p>\n", "<p>101</p>\n"],
                    solution_en: "<p>18(a)<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">Step 1</span><span style=\"font-family: Cambria Math;\">: Write down the binary number:</span></p>\r\n<p><span style=\"font-family: Cambria Math;\">101</span></p>\r\n<p><span style=\"font-family: Cambria Math;\">Step 2</span><span style=\"font-family: Cambria Math;\">: Multiply each digit of the binary number by the corresponding power of two:</span></p>\r\n<p><span style=\"font-family: Cambria Math;\">1x</span><span style=\"font-family: Cambria Math;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>2</mn><mn>2</mn></msup></math></span><span style=\"font-family: Cambria Math;\"> + 0x</span><span style=\"font-family: Cambria Math;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>2</mn><mn>1</mn></msup></math></span><span style=\"font-family: Cambria Math;\"> + 1x</span><span style=\"font-family: Cambria Math;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>2</mn><mn>0</mn></msup></math></span></p>\r\n<p><span style=\"font-family: Cambria Math;\">Step 3:</span><span style=\"font-family: Cambria Math;\"> Solve the powers:</span></p>\r\n<p><span style=\"font-family: Cambria Math;\">1x4 + 0x2 + 1x1 = 4 + 0 + 1</span></p>\r\n<p><span style=\"font-family: Cambria Math;\">Step 4</span><span style=\"font-family: Cambria Math;\">: Add up the numbers written above:</span></p>\r\n<p><span style=\"font-family: Cambria Math;\">4 + 0 + 1 = 5.</span></p>\r\n<p><span style=\"font-family: Cambria Math;\">So, 5 is the decimal equivalent of the binary number 101.</span></p>\n",
                    solution_hi: "<p>18.(a) <span style=\"font-family: Cambria Math;\">&#2360;&#2381;&#2335;&#2375;&#2346; </span><span style=\"font-family: Cambria Math;\">1</span><span style=\"font-family: Cambria Math;\">: </span><span style=\"font-family: Cambria Math;\">&#2348;&#2366;&#2311;&#2344;&#2352;&#2368; &#2344;&#2306;&#2348;&#2352; &#2354;&#2367;&#2326;&#2375;&#2306;</span><span style=\"font-family: Cambria Math;\">:</span></p>\r\n<p><span style=\"font-family: Cambria Math;\">101</span></p>\r\n<p><span style=\"font-family: Cambria Math;\">&#2360;&#2381;&#2335;&#2375;&#2346; </span><span style=\"font-family: Cambria Math;\">2: </span><span style=\"font-family: Cambria Math;\">&#2348;&#2366;&#2311;&#2344;&#2352;&#2368; &#2344;&#2306;&#2348;&#2352; &#2325;&#2375; &#2346;&#2381;&#2352;&#2340;&#2381;&#2351;&#2375;&#2325; &#2309;&#2306;&#2325; &#2325;&#2379; &#2342;&#2379; &#2325;&#2368; &#2325;&#2379;&#2352;&#2381;&#2352;&#2375;&#2360;&#2346;&#2379;&#2306;&#2337;&#2367;&#2306;&#2327; &#2346;&#2366;&#2357;&#2352; </span><span style=\"font-family: Cambria Math;\">(corresponding power) </span><span style=\"font-family: Cambria Math;\">&#2360;&#2375; &#2327;&#2369;&#2339;&#2366; &#2325;&#2352;&#2375;&#2306;</span><span style=\"font-family: Cambria Math;\">:</span></p>\r\n<p><span style=\"font-family: Cambria Math;\">1x</span><span style=\"font-family: Cambria Math;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>2</mn><mn>2</mn></msup></math></span><span style=\"font-family: Cambria Math;\"> + 0x</span><span style=\"font-family: Cambria Math;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>2</mn><mn>1</mn></msup></math></span><span style=\"font-family: Cambria Math;\"> + 1x</span><span style=\"font-family: Cambria Math;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>2</mn><mn>0</mn></msup></math></span></p>\r\n<p><span style=\"font-family: Cambria Math;\">&#2360;&#2381;&#2335;&#2375;&#2346; </span><span style=\"font-family: Cambria Math;\">3</span><span style=\"font-family: Cambria Math;\">:</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2328;&#2366;&#2340;&#2379;&#2306; &#2325;&#2379; &#2361;&#2354; &#2325;&#2368;&#2332;&#2367;&#2319;</span><span style=\"font-family: Cambria Math;\">:</span></p>\r\n<p><span style=\"font-family: Cambria Math;\">1x4 + 0x2 + 1x1 = 4 + 0 + 1</span></p>\r\n<p><span style=\"font-family: Cambria Math;\">&#2360;&#2381;&#2335;&#2375;&#2346; </span><span style=\"font-family: Cambria Math;\">4</span><span style=\"font-family: Cambria Math;\">:</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2314;&#2346;&#2352; &#2354;&#2367;&#2326;&#2368; &#2360;&#2306;&#2326;&#2381;&#2351;&#2366;&#2323;&#2306; &#2325;&#2379; &#2332;&#2379;&#2337;&#2364;&#2375;&#2306;</span><span style=\"font-family: Cambria Math;\">:</span></p>\r\n<p><span style=\"font-family: Cambria Math;\">4 + 0 + 1 = 5.</span></p>\r\n<p><span style=\"font-family: Cambria Math;\">&#2309;&#2340;&#2307; </span><span style=\"font-family: Cambria Math;\">5 </span><span style=\"font-family: Cambria Math;\">&#2348;&#2366;&#2311;&#2344;&#2352;&#2368; &#2344;&#2306;&#2348;&#2352; </span><span style=\"font-family: Cambria Math;\">101 </span><span style=\"font-family: Cambria Math;\">&#2325;&#2366; &#2337;&#2375;&#2360;&#2368;&#2350;&#2354; &#2311;&#2325;&#2381;&#2357;&#2367;&#2357;&#2376;&#2354;&#2375;&#2344;&#2381;&#2335; &#2361;&#2376;&#2404;</span></p>\n",
                    correct: "a",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
                questions.push({
                    id: "19",
                    section: "31",
                    question_en: "<p>19.<span style=\"font-family: Cambria Math;\"> What is the shortcut key for centering the text selected by the user in Word?</span></p>\n",
                    question_hi: "<p>19.<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2357;&#2352;&#2381;&#2337; &#2350;&#2375;&#2306; &#2351;&#2370;&#2332;&#2352; </span><span style=\"font-family: Cambria Math;\">(user) </span><span style=\"font-family: Cambria Math;\">&#2342;&#2381;&#2357;&#2366;&#2352;&#2366; &#2330;&#2369;&#2344;&#2375; &#2327;&#2319; &#2335;&#2375;&#2325;&#2381;&#2360;&#2381;&#2335; &#2325;&#2379; &#2360;&#2375;&#2306;&#2335;&#2352; </span><span style=\"font-family: Cambria Math;\">(centre) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2352;&#2344;&#2375; &#2325;&#2368; &#2358;&#2377;&#2352;&#2381;&#2335;&#2325;&#2335; &#2325;&#2369;&#2306;&#2332;&#2368; </span><span style=\"font-family: Cambria Math;\">(key) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2381;&#2351;&#2366; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">?</span></p>\n",
                    options_en: ["<p>Ctrl + A</p>\n", "<p>Ctrl + B</p>\n", 
                                "<p>Ctrl + C</p>\n", "<p>Ctrl + E</p>\n"],
                    options_hi: ["<p>Ctrl + A</p>\n", "<p>Ctrl + B</p>\n",
                                "<p>Ctrl + C</p>\n", "<p>Ctrl + E</p>\n"],
                    solution_en: "<p>19.(d)<span style=\"font-family: Cambria Math;\"> </span><strong><span style=\"font-family: Cambria Math;\">Ctrl + E</span></strong><span style=\"font-family: Cambria Math;\"> is used to center the text.</span></p>\r\n<p><span style=\"font-family: Cambria Math;\"> </span><strong><span style=\"font-family: Cambria Math;\">Ctrl + A</span></strong><span style=\"font-family: Cambria Math;\"><strong> </strong>used to select the entire text.</span></p>\r\n<p><span style=\"font-family: Cambria Math;\">Pressing </span><strong><span style=\"font-family: Cambria Math;\">Ctrl + C</span></strong><span style=\"font-family: Cambria Math;\"> lets us copy the entire text.</span></p>\r\n<p><strong><span style=\"font-family: Cambria Math;\">Ctrl + B</span></strong><span style=\"font-family: Cambria Math;\"> helps us to bold the text.</span></p>\n",
                    solution_hi: "<p>19.(d) <span style=\"font-family: Cambria Math;\">&#2335;&#2375;&#2325;&#2381;&#2360;&#2381;&#2335; &#2325;&#2379; &#2360;&#2375;&#2306;&#2335;&#2352; </span><span style=\"font-family: Cambria Math;\">(centre) </span><span style=\"font-family: Cambria Math;\">&#2350;&#2375;&#2306; &#2354;&#2366;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; </span><strong><span style=\"font-family: Cambria Math;\">Ctrl + E</span></strong><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2325;&#2366; &#2346;&#2381;&#2352;&#2351;&#2379;&#2327; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\r\n<p><span style=\"font-family: Cambria Math;\"><strong>Ctrl + A</strong> = </span><span style=\"font-family: Cambria Math;\">&#2346;&#2370;&#2352;&#2375; &#2335;&#2375;&#2325;&#2381;&#2360;&#2381;&#2335; &#2325;&#2379; &#2360;&#2375;&#2354;&#2375;&#2325;&#2381;&#2335; </span><span style=\"font-family: Cambria Math;\">(select) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2352;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2346;&#2381;&#2352;&#2351;&#2379;&#2327; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\r\n<p><span style=\"font-family: Cambria Math;\"><strong>Ctrl + C</strong> = </span><span style=\"font-family: Cambria Math;\">&#2342;&#2348;&#2366;&#2344;&#2375; &#2360;&#2375; &#2361;&#2350; &#2346;&#2370;&#2352;&#2375; &#2335;&#2375;&#2325;&#2381;&#2360;&#2381;&#2335; &#2325;&#2379; &#2325;&#2377;&#2346;&#2368; </span><span style=\"font-family: Cambria Math;\">(copy) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2352; &#2360;&#2325;&#2340;&#2375; &#2361;&#2376;&#2306;&#2404;</span></p>\r\n<p><span style=\"font-family: Cambria Math;\"><strong>Ctrl + B</strong> = </span><span style=\"font-family: Cambria Math;\">&#2335;&#2375;&#2325;&#2381;&#2360;&#2381;&#2335; &#2325;&#2379; &#2348;&#2379;&#2354;&#2381;&#2337; </span><span style=\"font-family: Cambria Math;\">(bold) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2352;&#2344;&#2375; &#2350;&#2375;&#2306; &#2361;&#2350;&#2366;&#2352;&#2368; &#2350;&#2342;&#2342; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\n",
                    correct: "d",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
                questions.push({
                    id: "20",
                    section: "misc",
                    question_en: "<p>20.<span style=\"font-family: Cambria Math;\"> What does ALU in computing denote?</span></p>\n",
                    question_hi: "<p>20.<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2367;&#2306;&#2327; &#2350;&#2375;&#2306; </span><span style=\"font-family: Cambria Math;\">ALU </span><span style=\"font-family: Cambria Math;\">&#2325;&#2381;&#2351;&#2366; &#2342;&#2352;&#2381;&#2358;&#2366;&#2340;&#2366; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">?</span></p>\n",
                    options_en: ["<p>Application and Logic Unit</p>\n", "<p>Algorithm Logic Unit</p>\n", 
                                "<p>Arithmetic Layered Unit</p>\n", "<p>Arithmetic Logic Unit</p>\n"],
                    options_hi: ["<p><span style=\"font-weight: 400;\">&#2319;&#2346;&#2381;&#2354;&#2368;&#2325;&#2375;&#2358;&#2344; &#2319;&#2306;&#2337; &#2354;&#2377;&#2332;&#2367;&#2325; &#2351;&#2370;&#2344;&#2367;&#2335; (Application and Logic Unit)</span></p>\n", "<p><span style=\"font-weight: 400;\">&#2319;&#2354;&#2381;&#2327;&#2379;&#2352;&#2367;&#2341;&#2350; &#2354;&#2377;&#2332;&#2367;&#2325; &#2351;&#2370;&#2344;&#2367;&#2335; (Algorithm Logic Unit)</span></p>\n",
                                "<p><span style=\"font-weight: 400;\">&#2309;&#2352;&#2367;&#2341;&#2350;&#2375;&#2335;&#2367;&#2325; &#2354;&#2375;&#2351;&#2375;&#2352;&#2337; &#2351;&#2370;&#2344;&#2367;&#2335; (Arithmetic Layered Unit)</span></p>\n", "<p><span style=\"font-weight: 400;\">&#2309;&#2352;&#2367;&#2341;&#2350;&#2375;&#2335;&#2367;&#2325; &#2354;&#2377;&#2332;&#2367;&#2325; &#2351;&#2370;&#2344;&#2367;&#2335; (Arithmetic Logic Unit)</span></p>\n"],
                    solution_en: "<p>20.(d)<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\"><strong>ALU</strong>:- </span><span style=\"font-family: Cambria Math;\"> ALU is a main component of the central processing unit, which stands for arithmetic logic unit and performs arithmetic and logic operations.</span></p>\n",
                    solution_hi: "<p>20.(d)<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\"><strong>ALU</strong>:- </span><span style=\"font-family: Cambria Math;\"> ALU </span><span style=\"font-family: Cambria Math;\">&#2325;&#2375;&#2306;&#2342;&#2381;&#2352;&#2368;&#2351; &#2346;&#2381;&#2352;&#2360;&#2306;&#2360;&#2381;&#2325;&#2352;&#2339; &#2311;&#2325;&#2366;&#2312; &#2325;&#2366; &#2319;&#2325; &#2350;&#2369;&#2326;&#2381;&#2351; &#2328;&#2335;&#2325; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2332;&#2367;&#2360;&#2325;&#2366; &#2309;&#2352;&#2381;&#2341; &#2309;&#2306;&#2325;&#2327;&#2339;&#2367;&#2340;&#2368;&#2351; &#2340;&#2352;&#2381;&#2325; &#2311;&#2325;&#2366;&#2312;</span><span style=\"font-family: Cambria Math;\">(arithmetic logic unit) </span><span style=\"font-family: Cambria Math;\">&#2361;&#2376; &#2324;&#2352; &#2309;&#2306;&#2325;&#2327;&#2339;&#2367;&#2340;&#2368;&#2351; &#2324;&#2352; &#2340;&#2352;&#2381;&#2325; &#2360;&#2306;&#2330;&#2366;&#2354;&#2344; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\n",
                    correct: "d",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
            
            // Generate question boxes
            const boxesContainer = document.getElementById('question-boxes');
            questions.forEach((q, index) => {
                const box = document.createElement('div');
                box.className = 'q-box';
                box.textContent = index + 1;
                box.onclick = () => showQuestion(index);
                box.id = `box-${index}`;
                boxesContainer.appendChild(box);
            });
            
            // Show first question
            showQuestion(0);
            updateProgress();
        }
        
        // Show a specific question
        
        function formatContent(text) {
            if (!text) return '';
            return text.replace(/<img/g, '<img style="max-width:100%;height:auto;"');
        }
        
        function showQuestion(index) {
            if (index < 0 || index >= questions.length) return;
            
            currentQuestion = index;
            const question = questions[index];
            
            // Update question counter
            document.getElementById('question-counter').textContent = `Question ${index + 1} of ${questions.length}`;
            
            // Update question boxes
            document.querySelectorAll('.q-box').forEach(box => box.classList.remove('current'));
            document.getElementById(`box-${index}`).classList.add('current');
            
            // Generate question HTML
            let html = `
                <div class="question-card">
                    <div class="question-text">
                        <div class="en">${formatContent(question.question_en)}</div>
                        <div class="hi" style="display:none">${formatContent(question.question_hi)} </div>
                    </div>
                    <div class="options" id="options-container">`;
            
            // Add options
            ['a', 'b', 'c', 'd'].forEach((opt, i) => {
                let optionClass = '';
                let isCorrectAnswer = opt === question.correct;
                let isUserAnswer = answers[question.id] === opt;
                
                // When reviewing, add appropriate classes
                if (submitted) {
                    if (isCorrectAnswer) {
                        optionClass += ' correct-answer';
                    } else if (isUserAnswer && !isCorrectAnswer) {
                        optionClass += ' incorrect';
                    }
                }
                
                html += `
                    <div class="option-item">
                        <input class="option-input" type="radio" name="q${index}" 
                            id="opt-${index}-${opt}" value="${opt}" 
                            ${isUserAnswer ? 'checked' : ''}
                            onclick="selectAnswer('${question.id}', '${opt}')">
                       <label class="option-label${optionClass}" for="opt-${index}-${opt}">
                            <div class="en">${question.options_en[i]}</div>
                            <div class="hi" style="display:none">${question.options_hi[i]}</div>
                        </label>
                    </div>`;
            });
            
            // Add solution if submitted
            if (submitted) {
                const isCorrect = answers[question.id] === question.correct;
                const resultText = answers[question.id] ? (isCorrect ? 'Correct!' : 'Incorrect!') : 'Not attempted';
                
                html += `
                    <div class="solution-container">
                        <div class="solution-title">${resultText}</div>
                        <div class="solution-text">
                            <div class="en">${question.solution_en}</div>
                            <div class="hi" style="display:none">${question.solution_hi}</div>
                        </div>
                    </div>`;
            }
            
            html += `</div></div>`;
            
            document.getElementById('questions-container').innerHTML = html;
            
            // Apply language settings
            applyLanguage();
            
            // If in mobile view, close the menu
            if (window.innerWidth < 992) {
                toggleNav(false);
            }
            
            // Add review mode class if submitted
            if (submitted) {
                document.getElementById('options-container').classList.add('review-mode');
            }
        }
        
        // Apply current language
        function applyLanguage() {
            document.querySelectorAll(`.${currentLang}`).forEach(el => el.style.display = 'block');
            document.querySelectorAll(`.${currentLang === 'en' ? 'hi' : 'en'}`).forEach(el => el.style.display = 'none');
            
            // Update language button text
            document.getElementById('lang-text').textContent = currentLang === 'en' ? 'Hi' : 'En';
        }
        
        // Select an answer
        function selectAnswer(qId, option) {
            if (submitted) return;
            
            answers[qId] = option;
            updateProgress();
            
            // Mark question as attempted in the navigation
            const index = questions.findIndex(q => q.id === qId);
            if (index >= 0) {
                const box = document.getElementById(`box-${index}`);
                box.classList.add('attempted');
                box.classList.remove('unattempted');
            }
        }
        
        // Navigate to previous/next question
        function prevQuestion() { 
            if (currentQuestion > 0) showQuestion(currentQuestion - 1); 
        }
        
        function nextQuestion() { 
            if (currentQuestion < questions.length - 1) showQuestion(currentQuestion + 1); 
        }
        
        // Switch section
        function switchSection(sectionId) {
            if (sectionId === 'all') {
                showQuestion(0);
                return;
            }
            
            const section = sections[sectionId];
            if (section) showQuestion(section.start);
        }
        
        // Toggle language
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            applyLanguage();
        }
        
        // Toggle navigation sidebar
        function toggleNav(show) {
            const nav = document.getElementById('question-nav');
            const overlay = document.getElementById('nav-overlay');
            
            if (show === undefined) {
                show = !nav.classList.contains('show');
            }
            
            if (show) {
                nav.classList.add('show');
                overlay.classList.add('show');
                document.body.style.overflow = 'hidden';
            } else {
                nav.classList.remove('show');
                overlay.classList.remove('show');
                document.body.style.overflow = '';
            }
        }
        
        // Update progress
        function updateProgress() {
            const attempted = Object.keys(answers).length;
            document.getElementById('attempted-count').textContent = attempted;
        }
        
        // Start timer
        function startTimer() {
            const timerDisplay = document.getElementById('timer-display');
            let timeLeft = totalTime;
            
            const timerInterval = setInterval(() => {
                if (timeLeft <= 0 || submitted) {
                    clearInterval(timerInterval);
                    if (!submitted) submitTest();
                    return;
                }
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                timeLeft--;
            }, 1000);
        }
        
        // Confirm before submitting
        function confirmSubmit() {
            if (submitted) return;
            
            const attempted = Object.keys(answers).length;
            const remaining = questions.length - attempted;
            
            // Create a more modern confirmation dialog
            const confirmHtml = `
                <div style="text-align: center; padding: 20px;">
                    <h4 style="margin-bottom: 16px; color: var(--dark);">Confirm Submission</h4>
                    <p style="margin-bottom: 24px; color: var(--gray);">
                        You have attempted ${attempted} of ${questions.length} questions.<br>
                        ${remaining} questions are unattempted.
                    </p>
                    <div style="display: flex; justify-content: center; gap: 12px;">
                        <button onclick="this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; border: 1px solid var(--light-gray); background: white; border-radius: 8px; cursor: pointer;">
                            Cancel
                        </button>
                        <button onclick="submitTest(); this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer;">
                            Submit Test
                        </button>
                    </div>
                </div>`;
            
            // Create modal element
            const modal = document.createElement('div');
            modal.className = 'results-modal show';
            modal.innerHTML = `
                <div class="results-card" style="max-width: 400px;">
                    <button class="cancel-btn" style="position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--gray);" onclick="this.closest('.results-modal').remove()">
                        ×
                    </button>
                    ${confirmHtml}
                </div>`;
            
            document.body.appendChild(modal);
        }
        
        // Submit test
        function submitTest() {
            if (submitted) return;
            
            submitted = true;
            
            let score = 0;
            let correctCount = 0;
            let incorrectCount = 0;
            let unattemptedCount = 0;
            
            questions.forEach((q, index) => {
                const userAns = answers[q.id];
                const box = document.getElementById(`box-${index}`);
                
                box.classList.remove('attempted');
                
                if (!userAns) {
                    unattemptedCount++;
                    box.classList.add('unattempted');
                } else if (userAns === q.correct) {
                    correctCount++;
                    score += q.pos_marks;
                    box.classList.add('correct');
                } else {
                    incorrectCount++;
                    score -= q.neg_marks;
                    box.classList.add('incorrect');
                }
            });
            
            // Update result values
            document.getElementById('score-value').textContent = score.toFixed(2);
            document.getElementById('correct-value').textContent = correctCount;
            document.getElementById('incorrect-value').textContent = incorrectCount;
            document.getElementById('unattempted-value').textContent = unattemptedCount;
            
            // Show the results modal
            document.getElementById('results-modal').classList.add('show');
            
            // Disable submit button
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-check"></i>';
            submitBtn.style.backgroundColor = 'var(--success)';
            
            // Refresh current question view to show solution
            showQuestion(currentQuestion);
        }
        
        // Review test
        function reviewTest() {
            document.getElementById('results-modal').classList.remove('show');
            showQuestion(0);
        }
        
        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('results-modal')) {
                document.getElementById('results-modal').classList.remove('show');
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === 'ArrowRight') nextQuestion();
        });
    </script>
</body>
</html>
