                questions.push({
                    id: "16",
                    section: "31",
                    question_en: "<p>16.<span style=\"font-family: Cambria Math;\"> Information stored in RAM need to be___________ .</span></p>\n",
                    question_hi: "<p>16.<span style=\"font-family: Cambria Math;\"> RAM </span><span style=\"font-family: Cambria Math;\">&#2350;&#2375;&#2306; &#2360;&#2306;&#2327;&#2381;&#2352;&#2361;&#2368;&#2340; &#2332;&#2366;&#2344;&#2325;&#2366;&#2352;&#2368; &#2325;&#2379; </span><span style=\"font-family: Cambria Math;\">_____ </span><span style=\"font-family: Cambria Math;\">&#2330;&#2366;&#2361;&#2367;&#2319;&#2404;</span></p>\n",
                    options_en: ["<p>check</p>\n", "<p>refresh periodically</p>\n", 
                                "<p>modify</p>\n", "<p>detecting errors</p>\n"],
                    options_hi: ["<p><span style=\"font-family: Cambria Math;\">&#2332;&#2366;&#2305;&#2330; &#2325;&#2352;&#2344;&#2366; </span></p>\n", "<p><span style=\"font-family: Cambria Math;\">&#2360;&#2350;&#2351;</span><span style=\"font-family: Cambria Math;\">-</span><span style=\"font-family: Cambria Math;\">&#2360;&#2350;&#2351; &#2346;&#2352; &#2352;&#2367;&#2347;&#2381;&#2352;&#2375;&#2358; &#2325;&#2352;&#2344;&#2366;</span></p>\n",
                                "<p><span style=\"font-family: Cambria Math;\">&#2360;&#2306;&#2358;&#2379;&#2343;&#2367;&#2340; &#2325;&#2352;&#2344;&#2366;</span></p>\n", "<p><span style=\"font-family: Cambria Math;\">&#2319;&#2352;&#2352; &#2325;&#2366; &#2346;&#2340;&#2366; &#2354;&#2327;&#2366;&#2344;&#2366;</span></p>\n"],
                    solution_en: "<p>16.(b)<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">As time passes, the charges in the memory cells leak away, so without being <strong>refreshed</strong> the stored data would eventually be lost. To prevent this, external circuitry periodically reads each cell and rewrites it, restoring the charge on the capacitor to its original level.</span></p>\n",
                    solution_hi: "<p>16.(b)<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2332;&#2376;&#2360;&#2375;</span><span style=\"font-family: Cambria Math;\">-</span><span style=\"font-family: Cambria Math;\">&#2332;&#2376;&#2360;&#2375; &#2360;&#2350;&#2351; &#2348;&#2368;&#2340;&#2340;&#2366; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2350;&#2375;&#2350;&#2379;&#2352;&#2368; &#2360;&#2375;&#2354;&#2381;&#2360; &#2350;&#2375;&#2306; &#2330;&#2366;&#2352;&#2381;&#2332; &#2354;&#2368;&#2325; &#2361;&#2379; &#2332;&#2366;&#2340;&#2375; &#2361;&#2376;&#2306;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2311;&#2360;&#2354;&#2367;&#2319; <strong>&#2352;&#2367;&#2347;&#2381;&#2352;&#2375;&#2358;</strong> &#2325;&#2367;&#2319; &#2348;&#2367;&#2344;&#2366; &#2360;&#2381;&#2335;&#2379;&#2352;&#2381;&#2337; &#2337;&#2375;&#2335;&#2366; &#2309;&#2306;&#2340;&#2340;&#2307; &#2326;&#2379; &#2332;&#2366;&#2319;&#2327;&#2366;&#2404; &#2311;&#2360;&#2375; &#2352;&#2379;&#2325;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2319;&#2325;&#2381;&#2360;&#2335;&#2352;&#2381;&#2344;&#2354; &#2360;&#2352;&#2381;&#2325;&#2367;&#2335;&#2352;&#2368; &#2360;&#2350;&#2351;</span><span style=\"font-family: Cambria Math;\">-</span><span style=\"font-family: Cambria Math;\">&#2360;&#2350;&#2351; &#2346;&#2352; &#2346;&#2381;&#2352;&#2340;&#2381;&#2351;&#2375;&#2325; &#2360;&#2375;&#2354; &#2325;&#2379; &#2346;&#2338;&#2364;&#2340;&#2366; &#2361;&#2376; &#2324;&#2352; &#2311;&#2360;&#2375; &#2347;&#2367;&#2352; &#2360;&#2375; &#2354;&#2367;&#2326;&#2340;&#2366; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2325;&#2376;&#2346;&#2375;&#2360;&#2367;&#2335;&#2352; &#2346;&#2352; &#2330;&#2366;&#2352;&#2381;&#2332; &#2325;&#2379; &#2313;&#2360;&#2325;&#2375; &#2350;&#2370;&#2354; &#2360;&#2381;&#2340;&#2352; &#2346;&#2352; &#2352;&#2367;&#2360;&#2381;&#2335;&#2379;&#2352; </span><span style=\"font-family: Cambria Math;\">(restore) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2352;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\n",
                    correct: "b",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
                questions.push({
                    id: "17",
                    section: "31",
                    question_en: "<p>17.<span style=\"font-family: Cambria Math;\"> Which shortcut key moves </span><span style=\"font-family: Cambria Math;\">the cursor to the top of the next page?</span></p>\n",
                    question_hi: "<p>17.<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2325;&#2380;&#2344; &#2360;&#2368; &#2358;&#2377;&#2352;&#2381;&#2335;&#2325;&#2335; &#2325;&#2369;&#2306;&#2332;&#2368;</span><span style=\"font-family: Cambria Math;\">(shortcut key) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2352;&#2381;&#2360;&#2352; &#2325;&#2379; &#2309;&#2327;&#2354;&#2375; &#2346;&#2371;&#2359;&#2381;&#2336; &#2325;&#2375; &#2358;&#2368;&#2352;&#2381;&#2359; &#2346;&#2352; &#2354;&#2375; &#2332;&#2366;&#2340;&#2368; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">?</span></p>\n",
                    options_en: ["<p>Ctrl+Page down</p>\n", "<p>Ctrl+Page up</p>\n", 
                                "<p>Ctrl+End</p>\n", "<p>Shift+F5</p>\n"],
                    options_hi: ["<p>Ctrl+Page down</p>\n", "<p>Ctrl+Page up</p>\n",
                                "<p>Ctrl+End</p>\n", "<p>Shift+F5</p>\n"],
                    solution_en: "<p>17.(a)<span style=\"font-family: Cambria Math;\"> </span><strong><span style=\"font-family: Cambria Math;\">Ctrl+Page down</span></strong><span style=\"font-family: Cambria Math;\"> is the shortcut key which moves the cursor to the top of the next page.</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\"><strong>Ctrl+Page up</strong> </span><span style=\"font-family: Cambria Math;\">is used to move the cursor to the top of the previous page. </span><span style=\"font-family: Cambria Math;\"><strong>Ctrl+End</strong> </span><span style=\"font-family: Cambria Math;\">is used to move the cursor to the end of the document.</span><span style=\"font-family: Cambria Math;\"><strong>Shift+F5</strong> </span><span style=\"font-family: Cambria Math;\">is used</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">to move the cursor to the location of the previous revision.</span></p>\n",
                    solution_hi: "<p>17.(a) <strong>Ctrl+Page down</strong><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2357;&#2361; &#2358;&#2377;&#2352;&#2381;&#2335;&#2325;&#2335; &#2325;&#2369;&#2306;&#2332;&#2368;</span><span style=\"font-family: Cambria Math;\">(shortcut key) </span><span style=\"font-family: Cambria Math;\">&#2361;&#2376; &#2332;&#2379; &#2325;&#2352;&#2381;&#2360;&#2352; &#2325;&#2379; &#2309;&#2327;&#2354;&#2375; &#2346;&#2371;&#2359;&#2381;&#2336; &#2325;&#2375; &#2358;&#2368;&#2352;&#2381;&#2359; &#2346;&#2352; &#2354;&#2375; &#2332;&#2366;&#2340;&#2368; &#2361;&#2376;&#2404; </span><span style=\"font-family: Cambria Math;\">&#2325;&#2352;&#2381;&#2360;&#2352; &#2325;&#2379; &#2346;&#2367;&#2331;&#2354;&#2375; &#2346;&#2375;&#2332; &#2325;&#2375; &#2358;&#2368;&#2352;&#2381;&#2359; &#2346;&#2352; &#2354;&#2375; &#2332;&#2366;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; </span><strong><span style=\"font-family: Cambria Math;\">Ctrl+Page up</span></strong><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2325;&#2366; &#2313;&#2346;&#2351;&#2379;&#2327; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404; </span><strong><span style=\"font-family: Cambria Math;\">Ctrl+End</span></strong><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2325;&#2366; &#2313;&#2346;&#2351;&#2379;&#2327; &#2325;&#2352;&#2381;&#2360;&#2352; &#2325;&#2379; &#2342;&#2360;&#2381;&#2340;&#2366;&#2357;&#2375;&#2332;&#2364; &#2325;&#2375; &#2309;&#2306;&#2340; &#2350;&#2375;&#2306; &#2354;&#2375; &#2332;&#2366;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404; </span><strong><span style=\"font-family: Cambria Math;\">Shift+F5</span></strong><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2325;&#2366; &#2313;&#2346;&#2351;&#2379;&#2327; &#2325;&#2352;&#2381;&#2360;&#2352; &#2325;&#2379; &#2346;&#2367;&#2331;&#2354;&#2375; &#2360;&#2306;&#2358;&#2379;&#2343;&#2344; &#2325;&#2375; &#2360;&#2381;&#2341;&#2366;&#2344; &#2346;&#2352; &#2354;&#2375; &#2332;&#2366;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\n",
                    correct: "a",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
                questions.push({
                    id: "18",
                    section: "31",
                    question_en: "<p>18.<span style=\"font-family: Cambria Math;\"> What does an electronic spreadsheet consist of?</span></p>\n",
                    question_hi: "<p>18.<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2311;&#2354;&#2375;&#2325;&#2381;&#2335;&#2381;&#2352;&#2377;&#2344;&#2367;&#2325; &#2360;&#2381;&#2346;&#2381;&#2352;&#2375;&#2337;&#2358;&#2368;&#2335; &#2350;&#2375;&#2306; &#2325;&#2381;&#2351;&#2366; &#2361;&#2379;&#2340;&#2366; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">? </span></p>\n",
                    options_en: ["<p>Rows</p>\n", "<p>Columns</p>\n", 
                                "<p>Cells</p>\n", "<p>All of these</p>\n"],
                    options_hi: ["<p><span style=\"font-weight: 400;\">&#2352;&#2379;&#2360; (Rows)</span></p>\n", "<p><span style=\"font-weight: 400;\">&#2325;&#2377;&#2354;&#2350; (Columns)</span></p>\n",
                                "<p><span style=\"font-weight: 400;\">&#2360;&#2375;&#2354;&#2381;&#2360; (Cells)</span></p>\n", "<p><span style=\"font-weight: 400;\">&#2351;&#2375; &#2360;&#2348; (All of these)</span></p>\n"],
                    solution_en: "<p>18.(d)<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">A spreadsheet consists of </span><strong><span style=\"font-family: Cambria Math;\">rows and columns</span></strong><span style=\"font-family: Cambria Math;\">. Usually the columns have labels and represent a certain type of data. Each row represents a new set of data. The individual elements are called </span><span style=\"font-family: Cambria Math;\"><strong>cells</strong>.</span></p>\n",
                    solution_hi: "<p>18.(d) <span style=\"font-family: Cambria Math;\">&#2319;&#2325; &#2360;&#2381;&#2346;&#2381;&#2352;&#2375;&#2337;&#2358;&#2368;&#2335; &#2350;&#2375;&#2306; <strong>&#2352;&#2379;&#2360;</strong></span><strong><span style=\"font-family: Cambria Math;\">(rows) </span><span style=\"font-family: Cambria Math;\">&#2324;&#2352; &#2325;&#2354;&#2369;&#2350;&#2306;&#2360;</span><span style=\"font-family: Cambria Math;\">(columns) </span></strong><span style=\"font-family: Cambria Math;\">&#2361;&#2379;&#2340;&#2375; &#2361;&#2376;&#2306;&#2404; &#2310;&#2350;&#2340;&#2380;&#2352; &#2346;&#2352; &#2325;&#2377;&#2354;&#2350; &#2350;&#2375;&#2306; &#2354;&#2375;&#2348;&#2354; &#2361;&#2379;&#2340;&#2375; &#2361;&#2376;&#2306; &#2324;&#2352; &#2319;&#2325; &#2344;&#2367;&#2358;&#2381;&#2330;&#2367;&#2340; &#2346;&#2381;&#2352;&#2325;&#2366;&#2352; &#2325;&#2375; &#2337;&#2375;&#2335;&#2366; &#2325;&#2366; &#2346;&#2381;&#2352;&#2340;&#2367;&#2344;&#2367;&#2343;&#2367;&#2340;&#2381;&#2357;</span><span style=\"font-family: Cambria Math;\">(represent) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2352;&#2340;&#2375; &#2361;&#2376;&#2306;&#2404; &#2346;&#2381;&#2352;&#2340;&#2381;&#2351;&#2375;&#2325; &#2352;&#2379;</span><span style=\"font-family: Cambria Math;\">(row) </span><span style=\"font-family: Cambria Math;\">&#2337;&#2375;&#2335;&#2366; &#2325;&#2375; &#2319;&#2325; &#2344;&#2319; &#2360;&#2375;&#2335; &#2325;&#2366; &#2346;&#2381;&#2352;&#2340;&#2367;&#2344;&#2367;&#2343;&#2367;&#2340;&#2381;&#2357; &#2325;&#2352;&#2340;&#2368; &#2361;&#2376;&#2404; &#2357;&#2381;&#2351;&#2325;&#2381;&#2340;&#2367;&#2327;&#2340;</span><span style=\"font-family: Cambria Math;\">(individual) </span><span style=\"font-family: Cambria Math;\">&#2319;&#2354;&#2367;&#2350;&#2375;&#2306;&#2335;&#2381;&#2360;</span><span style=\"font-family: Cambria Math;\">(elements) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2379; <strong>&#2360;&#2375;&#2354;</strong></span><strong><span style=\"font-family: Cambria Math;\">(cell) </span></strong><span style=\"font-family: Cambria Math;\">&#2325;&#2361;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\n",
                    correct: "d",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
                questions.push({
                    id: "19",
                    section: "31",
                    question_en: "<p>19.<span style=\"font-family: Cambria Math;\"> Which keyboard key moves the cursor to the beginning of the current line?</span></p>\n",
                    question_hi: "<p>19.<span style=\"font-family: Cambria Math;\">&#2325;&#2380;&#2344; &#2360;&#2368; &#2325;&#2368;&#2348;&#2379;&#2352;&#2381;&#2337; &#2325;&#2369;&#2306;&#2332;&#2368;</span><span style=\"font-family: Cambria Math;\">(key) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2352;&#2381;&#2360;&#2352; &#2325;&#2379; &#2357;&#2352;&#2381;&#2340;&#2350;&#2366;&#2344; &#2354;&#2366;&#2311;&#2344; &#2325;&#2368; &#2358;&#2369;&#2352;&#2369;&#2310;&#2340; &#2350;&#2375;&#2306; &#2354;&#2375; &#2332;&#2366;&#2340;&#2368; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">?</span></p>\n",
                    options_en: ["<p>Home</p>\n", "<p>End</p>\n", 
                                "<p>Ctrl+Down arrow key</p>\n", "<p>Page up</p>\n"],
                    options_hi: ["<p>Home</p>\n", "<p>End</p>\n",
                                "<p>Ctrl+Down arrow key</p>\n", "<p>Page up</p>\n"],
                    solution_en: "<p>19.(a)<span style=\"font-family: Cambria Math;\"> </span><strong><span style=\"font-family: Cambria Math;\">Home</span></strong><span style=\"font-family: Cambria Math;\"><strong> key</strong> is the keyboard key which moves the cursor to the beginning of the current line.</span><span style=\"font-family: Cambria Math;\"><strong>End</strong>&rarr; </span><span style=\"font-family: Cambria Math;\">It is used to move the cursor to the end of the current line. </span><span style=\"font-family: Cambria Math;\"><strong>Ctrl+Down arrow key</strong>&rarr; </span><span style=\"font-family: Cambria Math;\">It is used to move the cursor down by one paragraph. </span><span style=\"font-family: Cambria Math;\"><strong>Page up</strong> &rarr; </span><span style=\"font-family: Cambria Math;\">It is used to move the cursor by scrolling the document view up by one screen.</span></p>\n",
                    solution_hi: "<p>19.(a)<span style=\"font-family: Cambria Math;\"> </span><strong><span style=\"font-family: Cambria Math;\">&#2361;&#2379;&#2350; &#2325;&#2368;</span></strong><span style=\"font-family: Cambria Math;\"><strong>(home key)</strong> </span><span style=\"font-family: Cambria Math;\">&#2325;&#2368;&#2348;&#2379;&#2352;&#2381;&#2337; &#2325;&#2369;&#2306;&#2332;&#2368; &#2361;&#2376; &#2332;&#2379; &#2325;&#2352;&#2381;&#2360;&#2352; &#2325;&#2379; &#2357;&#2352;&#2381;&#2340;&#2350;&#2366;&#2344; &#2354;&#2366;&#2311;&#2344; &#2325;&#2368; &#2358;&#2369;&#2352;&#2369;&#2310;&#2340; &#2350;&#2375;&#2306; &#2354;&#2375; &#2332;&#2366;&#2340;&#2368; &#2361;&#2376;&#2404; </span><strong><span style=\"font-family: Cambria Math;\">End</span></strong><span style=\"font-family: Cambria Math;\">&rarr; </span><span style=\"font-family: Cambria Math;\">&#2311;&#2360;&#2325;&#2366; &#2313;&#2346;&#2351;&#2379;&#2327; &#2325;&#2352;&#2381;&#2360;&#2352; &#2325;&#2379; &#2357;&#2352;&#2381;&#2340;&#2350;&#2366;&#2344; &#2354;&#2366;&#2311;&#2344; &#2325;&#2375; &#2309;&#2306;&#2340; &#2350;&#2375;&#2306; &#2354;&#2375; &#2332;&#2366;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404; </span><strong><span style=\"font-family: Cambria Math;\">Ctrl+Down Arrow Key</span></strong><span style=\"font-family: Cambria Math;\">&rarr; </span><span style=\"font-family: Cambria Math;\">&#2311;&#2360;&#2325;&#2366; &#2346;&#2381;&#2352;&#2351;&#2379;&#2327; &#2325;&#2352;&#2381;&#2360;&#2352; &#2325;&#2379; &#2319;&#2325; &#2346;&#2376;&#2352;&#2366;&#2327;&#2381;&#2352;&#2366;&#2347; &#2344;&#2368;&#2330;&#2375; &#2354;&#2375; &#2332;&#2366;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404; <strong>&#2346;&#2375;&#2332; &#2309;&#2346;</strong></span><strong><span style=\"font-family: Cambria Math;\">(</span><span style=\"font-family: Cambria Math;\">Page up</span></strong><span style=\"font-family: Cambria Math;\"><strong>)</strong> &rarr; </span><span style=\"font-family: Cambria Math;\">&#2311;&#2360;&#2325;&#2366; &#2313;&#2346;&#2351;&#2379;&#2327; &#2337;&#2377;&#2325;&#2381;&#2351;&#2370;&#2350;&#2375;&#2306;&#2335; &#2357;&#2381;&#2351;&#2370; &#2325;&#2379; &#2319;&#2325; &#2360;&#2381;&#2325;&#2381;&#2352;&#2368;&#2344; &#2360;&#2375; &#2314;&#2346;&#2352; &#2360;&#2381;&#2325;&#2381;&#2352;&#2377;&#2354; &#2325;&#2352;&#2325;&#2375; &#2325;&#2352;&#2381;&#2360;&#2352; &#2325;&#2379; &#2354;&#2375; &#2332;&#2366;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\n",
                    correct: "a",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
                questions.push({
                    id: "20",
                    section: "misc",
                    question_en: "<p>20.<span style=\"font-family: Cambria Math;\"> Which of the following is not a usual file extension in DOS?</span></p>\n",
                    question_hi: "<p>20.<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2344;&#2367;&#2350;&#2381;&#2344;&#2354;&#2367;&#2326;&#2367;&#2340; &#2350;&#2375;&#2306; &#2360;&#2375; &#2325;&#2380;&#2344; &#2360;&#2366; &#2337;&#2377;&#2360; &#2350;&#2375;&#2306; &#2360;&#2366;&#2350;&#2366;&#2344;&#2381;&#2351; &#2347;&#2364;&#2366;&#2311;&#2354; &#2319;&#2325;&#2381;&#2360;&#2335;&#2375;&#2306;&#2358;&#2344; &#2344;&#2361;&#2368;&#2306; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">?</span></p>\n",
                    options_en: ["<p>.exe</p>\n", "<p>.bat</p>\n", 
                                "<p>.0</p>\n", "<p>.com</p>\n"],
                    options_hi: ["<p>.exe</p>\n", "<p>.bat</p>\n",
                                "<p>.0</p>\n", "<p>.com</p>\n"],
                    solution_en: "<p>20.(c)<span style=\"font-family: Cambria Math;\"> </span><strong><span style=\"font-family: Cambria Math;\">.0</span></strong><span style=\"font-family: Cambria Math;\"> is not the file extension in DOS. </span><strong><span style=\"font-family: Cambria Math;\">.exe</span></strong><span style=\"font-family: Cambria Math;\"> is a common filename extension denoting an executable file. A </span><strong><span style=\"font-family: Cambria Math;\">BAT</span></strong><span style=\"font-family: Cambria Math;\"> file is a DOS batch file used to execute commands with the Windows Command Prompt. The</span><span style=\"font-family: Cambria Math;\"> <strong>COM</strong></span><span style=\"font-family: Cambria Math;\"> file extension is used for programs that can be executed by running MS-DOS on a Microsoft Windows machine.</span></p>\n",
                    solution_hi: "<p>20.(c) <strong>.0</strong><span style=\"font-family: Cambria Math;\"> DOS </span><span style=\"font-family: Cambria Math;\">&#2350;&#2375;&#2306; &#2347;&#2364;&#2366;&#2311;&#2354; &#2319;&#2325;&#2381;&#2360;&#2335;&#2375;&#2306;&#2358;&#2344; &#2344;&#2361;&#2368;&#2306; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">. </span><span style=\"font-family: Cambria Math;\"><strong>.exe</strong> </span><span style=\"font-family: Cambria Math;\">&#2319;&#2325; &#2319;&#2325;&#2381;&#2360;&#2375;&#2325;&#2381;&#2351;&#2370;&#2335;&#2375;&#2348;&#2354;</span><span style=\"font-family: Cambria Math;\">(executable) </span><span style=\"font-family: Cambria Math;\">&#2347;&#2364;&#2366;&#2311;&#2354; &#2325;&#2379; &#2342;&#2352;&#2381;&#2358;&#2366;&#2344;&#2375; &#2357;&#2366;&#2354;&#2366; &#2319;&#2325; &#2325;&#2377;&#2350;&#2344; &#2347;&#2364;&#2366;&#2311;&#2354; &#2344;&#2375;&#2350; &#2319;&#2325;&#2381;&#2360;&#2335;&#2375;&#2306;&#2358;&#2344;</span><span style=\"font-family: Cambria Math;\">(extension) </span><span style=\"font-family: Cambria Math;\">&#2361;&#2376;&#2404; </span><strong><span style=\"font-family: Cambria Math;\">BAT</span><span style=\"font-family: Cambria Math;\"> </span></strong><span style=\"font-family: Cambria Math;\">&#2347;&#2366;&#2311;&#2354; &#2319;&#2325; </span><span style=\"font-family: Cambria Math;\">DOS </span><span style=\"font-family: Cambria Math;\">&#2348;&#2376;&#2330; &#2347;&#2366;&#2311;&#2354; &#2361;&#2376; &#2332;&#2367;&#2360;&#2325;&#2366; &#2313;&#2346;&#2351;&#2379;&#2327; &#2357;&#2367;&#2306;&#2337;&#2379;&#2332; &#2325;&#2350;&#2366;&#2306;&#2337; &#2346;&#2381;&#2352;&#2377;&#2350;&#2381;&#2346;&#2381;&#2335;</span><span style=\"font-family: Cambria Math;\">(Windows Command Prompt) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2375; &#2360;&#2366;&#2341; &#2325;&#2350;&#2366;&#2306;&#2337; &#2319;&#2325;&#2381;&#2360;&#2375;&#2325;&#2381;&#2351;&#2370;&#2335;</span><span style=\"font-family: Cambria Math;\">(execute) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2352;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404; </span><span style=\"font-family: Cambria Math;\"><strong>COM</strong> </span><span style=\"font-family: Cambria Math;\">&#2347;&#2364;&#2366;&#2311;&#2354; &#2319;&#2325;&#2381;&#2360;&#2335;&#2375;&#2306;&#2358;&#2344; &#2325;&#2366; &#2313;&#2346;&#2351;&#2379;&#2327; &#2313;&#2344; &#2346;&#2381;&#2352;&#2379;&#2327;&#2381;&#2352;&#2366;&#2350;&#2379;&#2306; &#2325;&#2375; &#2354;&#2367;&#2319; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376; &#2332;&#2367;&#2344;&#2381;&#2361;&#2375;&#2306; </span><span style=\"font-family: Cambria Math;\">Microsoft Windows </span><span style=\"font-family: Cambria Math;\">&#2350;&#2358;&#2368;&#2344; &#2346;&#2352; </span><span style=\"font-family: Cambria Math;\">MS-DOS </span><span style=\"font-family: Cambria Math;\">&#2330;&#2354;&#2366;&#2325;&#2352; &#2319;&#2325;&#2381;&#2360;&#2375;&#2325;&#2381;&#2351;&#2370;&#2335;</span><span style=\"font-family: Cambria Math;\">(execute) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2367;&#2351;&#2366; &#2332;&#2366; &#2360;&#2325;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\n",
                    correct: "c",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
            
            // Generate question boxes
            const boxesContainer = document.getElementById('question-boxes');
            questions.forEach((q, index) => {
                const box = document.createElement('div');
                box.className = 'q-box';
                box.textContent = index + 1;
                box.onclick = () => showQuestion(index);
                box.id = `box-${index}`;
                boxesContainer.appendChild(box);
            });
            
            // Show first question
            showQuestion(0);
            updateProgress();
        }
        
        // Show a specific question
        
        function formatContent(text) {
            if (!text) return '';
            return text.replace(/<img/g, '<img style="max-width:100%;height:auto;"');
        }
        
        function showQuestion(index) {
            if (index < 0 || index >= questions.length) return;
            
            currentQuestion = index;
            const question = questions[index];
            
            // Update question counter
            document.getElementById('question-counter').textContent = `Question ${index + 1} of ${questions.length}`;
            
            // Update question boxes
            document.querySelectorAll('.q-box').forEach(box => box.classList.remove('current'));
            document.getElementById(`box-${index}`).classList.add('current');
            
            // Generate question HTML
            let html = `
                <div class="question-card">
                    <div class="question-text">
                        <div class="en">${formatContent(question.question_en)}</div>
                        <div class="hi" style="display:none">${formatContent(question.question_hi)} </div>
                    </div>
                    <div class="options" id="options-container">`;
            
            // Add options
            ['a', 'b', 'c', 'd'].forEach((opt, i) => {
                let optionClass = '';
                let isCorrectAnswer = opt === question.correct;
                let isUserAnswer = answers[question.id] === opt;
                
                // When reviewing, add appropriate classes
                if (submitted) {
                    if (isCorrectAnswer) {
                        optionClass += ' correct-answer';
                    } else if (isUserAnswer && !isCorrectAnswer) {
                        optionClass += ' incorrect';
                    }
                }
                
                html += `
                    <div class="option-item">
                        <input class="option-input" type="radio" name="q${index}" 
                            id="opt-${index}-${opt}" value="${opt}" 
                            ${isUserAnswer ? 'checked' : ''}
                            onclick="selectAnswer('${question.id}', '${opt}')">
                       <label class="option-label${optionClass}" for="opt-${index}-${opt}">
                            <div class="en">${question.options_en[i]}</div>
                            <div class="hi" style="display:none">${question.options_hi[i]}</div>
                        </label>
                    </div>`;
            });
            
            // Add solution if submitted
            if (submitted) {
                const isCorrect = answers[question.id] === question.correct;
                const resultText = answers[question.id] ? (isCorrect ? 'Correct!' : 'Incorrect!') : 'Not attempted';
                
                html += `
                    <div class="solution-container">
                        <div class="solution-title">${resultText}</div>
                        <div class="solution-text">
                            <div class="en">${question.solution_en}</div>
                            <div class="hi" style="display:none">${question.solution_hi}</div>
                        </div>
                    </div>`;
            }
            
            html += `</div></div>`;
            
            document.getElementById('questions-container').innerHTML = html;
            
            // Apply language settings
            applyLanguage();
            
            // If in mobile view, close the menu
            if (window.innerWidth < 992) {
                toggleNav(false);
            }
            
            // Add review mode class if submitted
            if (submitted) {
                document.getElementById('options-container').classList.add('review-mode');
            }
        }
        
        // Apply current language
        function applyLanguage() {
            document.querySelectorAll(`.${currentLang}`).forEach(el => el.style.display = 'block');
            document.querySelectorAll(`.${currentLang === 'en' ? 'hi' : 'en'}`).forEach(el => el.style.display = 'none');
            
            // Update language button text
            document.getElementById('lang-text').textContent = currentLang === 'en' ? 'Hi' : 'En';
        }
        
        // Select an answer
        function selectAnswer(qId, option) {
            if (submitted) return;
            
            answers[qId] = option;
            updateProgress();
            
            // Mark question as attempted in the navigation
            const index = questions.findIndex(q => q.id === qId);
            if (index >= 0) {
                const box = document.getElementById(`box-${index}`);
                box.classList.add('attempted');
                box.classList.remove('unattempted');
            }
        }
        
        // Navigate to previous/next question
        function prevQuestion() { 
            if (currentQuestion > 0) showQuestion(currentQuestion - 1); 
        }
        
        function nextQuestion() { 
            if (currentQuestion < questions.length - 1) showQuestion(currentQuestion + 1); 
        }
        
        // Switch section
        function switchSection(sectionId) {
            if (sectionId === 'all') {
                showQuestion(0);
                return;
            }
            
            const section = sections[sectionId];
            if (section) showQuestion(section.start);
        }
        
        // Toggle language
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            applyLanguage();
        }
        
        // Toggle navigation sidebar
        function toggleNav(show) {
            const nav = document.getElementById('question-nav');
            const overlay = document.getElementById('nav-overlay');
            
            if (show === undefined) {
                show = !nav.classList.contains('show');
            }
            
            if (show) {
                nav.classList.add('show');
                overlay.classList.add('show');
                document.body.style.overflow = 'hidden';
            } else {
                nav.classList.remove('show');
                overlay.classList.remove('show');
                document.body.style.overflow = '';
            }
        }
        
        // Update progress
        function updateProgress() {
            const attempted = Object.keys(answers).length;
            document.getElementById('attempted-count').textContent = attempted;
        }
        
        // Start timer
        function startTimer() {
            const timerDisplay = document.getElementById('timer-display');
            let timeLeft = totalTime;
            
            const timerInterval = setInterval(() => {
                if (timeLeft <= 0 || submitted) {
                    clearInterval(timerInterval);
                    if (!submitted) submitTest();
                    return;
                }
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                timeLeft--;
            }, 1000);
        }
        
        // Confirm before submitting
        function confirmSubmit() {
            if (submitted) return;
            
            const attempted = Object.keys(answers).length;
            const remaining = questions.length - attempted;
            
            // Create a more modern confirmation dialog
            const confirmHtml = `
                <div style="text-align: center; padding: 20px;">
                    <h4 style="margin-bottom: 16px; color: var(--dark);">Confirm Submission</h4>
                    <p style="margin-bottom: 24px; color: var(--gray);">
                        You have attempted ${attempted} of ${questions.length} questions.<br>
                        ${remaining} questions are unattempted.
                    </p>
                    <div style="display: flex; justify-content: center; gap: 12px;">
                        <button onclick="this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; border: 1px solid var(--light-gray); background: white; border-radius: 8px; cursor: pointer;">
                            Cancel
                        </button>
                        <button onclick="submitTest(); this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer;">
                            Submit Test
                        </button>
                    </div>
                </div>`;
            
            // Create modal element
            const modal = document.createElement('div');
            modal.className = 'results-modal show';
            modal.innerHTML = `
                <div class="results-card" style="max-width: 400px;">
                    <button class="cancel-btn" style="position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--gray);" onclick="this.closest('.results-modal').remove()">
                        ×
                    </button>
                    ${confirmHtml}
                </div>`;
            
            document.body.appendChild(modal);
        }
        
        // Submit test
        function submitTest() {
            if (submitted) return;
            
            submitted = true;
            
            let score = 0;
            let correctCount = 0;
            let incorrectCount = 0;
            let unattemptedCount = 0;
            
            questions.forEach((q, index) => {
                const userAns = answers[q.id];
                const box = document.getElementById(`box-${index}`);
                
                box.classList.remove('attempted');
                
                if (!userAns) {
                    unattemptedCount++;
                    box.classList.add('unattempted');
                } else if (userAns === q.correct) {
                    correctCount++;
                    score += q.pos_marks;
                    box.classList.add('correct');
                } else {
                    incorrectCount++;
                    score -= q.neg_marks;
                    box.classList.add('incorrect');
                }
            });
            
            // Update result values
            document.getElementById('score-value').textContent = score.toFixed(2);
            document.getElementById('correct-value').textContent = correctCount;
            document.getElementById('incorrect-value').textContent = incorrectCount;
            document.getElementById('unattempted-value').textContent = unattemptedCount;
            
            // Show the results modal
            document.getElementById('results-modal').classList.add('show');
            
            // Disable submit button
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-check"></i>';
            submitBtn.style.backgroundColor = 'var(--success)';
            
            // Refresh current question view to show solution
            showQuestion(currentQuestion);
        }
        
        // Review test
        function reviewTest() {
            document.getElementById('results-modal').classList.remove('show');
            showQuestion(0);
        }
        
        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('results-modal')) {
                document.getElementById('results-modal').classList.remove('show');
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === 'ArrowRight') nextQuestion();
        });
    </script>
</body>
</html>
