                questions.push({
                    id: "14",
                    section: "31",
                    question_en: "<p>14.<span style=\"font-family: Cambria Math;\"> In which, the database can be restored up to the last consistent state after the system failure?</span></p>\n",
                    question_hi: "<p>14. <span style=\"font-family: Cambria Math;\">&#2325;&#2367;&#2360;&#2350;&#2375;&#2306;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2360;&#2367;&#2360;&#2381;&#2335;&#2350; &#2357;&#2367;&#2347;&#2354;&#2340;&#2366; &#2325;&#2375; &#2348;&#2366;&#2342; &#2337;&#2375;&#2335;&#2366;&#2348;&#2375;&#2360; &#2325;&#2379; &#2309;&#2306;&#2340;&#2367;&#2350; &#2360;&#2369;&#2360;&#2306;&#2327;&#2340; &#2360;&#2381;&#2341;&#2367;&#2340;&#2367;</span><span style=\"font-family: Cambria Math;\">(consist state) </span><span style=\"font-family: Cambria Math;\">&#2340;&#2325; &#2346;&#2369;&#2344;&#2352;&#2381;&#2360;&#2381;&#2341;&#2366;&#2346;&#2367;&#2340;</span><span style=\"font-family: Cambria Math;\">(restored) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2367;&#2351;&#2366; &#2332;&#2366; &#2360;&#2325;&#2340;&#2366; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">?</span></p>\n",
                    options_en: ["<p>Recovery</p>\n", "<p>Backup</p>\n", 
                                "<p>Redundancy</p>\n", "<p>Security</p>\n"],
                    options_hi: ["<p><span style=\"font-weight: 400;\">&nbsp;&#2352;&#2367;&#2325;&#2357;&#2352;&#2368; (Recovery)</span></p>\n", "<p><span style=\"font-weight: 400;\">&#2348;&#2376;&#2325;&#2309;&#2346; (Backup)</span></p>\n",
                                "<p><span style=\"font-weight: 400;\">&#2352;&#2375;&#2337;&#2370;&#2339;&#2381;</span><span style=\"font-weight: 400;\">&#2337;&#2344;&#2381;&zwnj;&#2360;&#2367; (</span><span style=\"font-weight: 400;\">Redundancy</span><span style=\"font-weight: 400;\">)</span></p>\n", "<p><span style=\"font-weight: 400;\">&#2360;&#2367;&#2325;&#2381;&#2351;&#2379;&#2352;&#2367;&#2335;&#2368; (Security)</span></p>\n"],
                    solution_en: "<p>14.(a) <strong><span style=\"font-family: Cambria Math;\">Recovery</span></strong><span style=\"font-family: Cambria Math;\"><strong> is the rebuilding</strong> of a database or table space after a problem such as media or storage failure, power interruption, or application failure.A<strong> </strong></span><strong><span style=\"font-family: Cambria Math;\">backup</span></strong><span style=\"font-family: Cambria Math;\"> is a copy of data from your database that can be used to reconstruct that data.</span><strong><span style=\"font-family: Cambria Math;\">Data redundancy</span></strong><span style=\"font-family: Cambria Math;\"> is a condition created within a database or data storage technology in which the same piece of data is held in two separate places.</span><strong><span style=\"font-family: Cambria Math;\">Security of databases</span></strong><span style=\"font-family: Cambria Math;\"> refers to the array of controls, tools, and procedures designed to ensure and safeguard confidentiality, integrity, and accessibility.</span></p>\n",
                    solution_hi: "<p>14.(a)<span style=\"font-family: Cambria Math;\"> </span><strong><span style=\"font-family: Cambria Math;\">&#2352;&#2367;&#2325;&#2357;&#2352;&#2368;</span><span style=\"font-family: Cambria Math;\"> </span></strong><span style=\"font-family: Cambria Math;\">&#2350;&#2368;&#2337;&#2367;&#2351;&#2366; &#2351;&#2366; &#2349;&#2306;&#2337;&#2366;&#2352;&#2339; &#2357;&#2367;&#2347;&#2354;&#2340;&#2366;</span><span style=\"font-family: Cambria Math;\">(storage failure), </span><span style=\"font-family: Cambria Math;\">&#2348;&#2367;&#2332;&#2354;&#2368; &#2352;&#2369;&#2325;&#2366;&#2357;&#2335;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2351;&#2366; &#2309;&#2344;&#2369;&#2346;&#2381;&#2352;&#2351;&#2379;&#2327; &#2357;&#2367;&#2347;&#2354;&#2340;&#2366; &#2332;&#2376;&#2360;&#2368; &#2325;&#2367;&#2360;&#2368; &#2360;&#2350;&#2360;&#2381;&#2351;&#2366; &#2325;&#2375; &#2348;&#2366;&#2342; &#2337;&#2375;&#2335;&#2366;&#2348;&#2375;&#2360; &#2351;&#2366; &#2340;&#2366;&#2354;&#2367;&#2325;&#2366; &#2360;&#2381;&#2341;&#2366;&#2344;</span><span style=\"font-family: Cambria Math;\">(table space) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2366; &#2346;&#2369;&#2344;&#2352;&#2381;&#2344;&#2367;&#2352;&#2381;&#2350;&#2366;&#2339;</span><span style=\"font-family: Cambria Math;\">(rebuildung) </span><span style=\"font-family: Cambria Math;\">&#2361;&#2376;&#2404; </span><strong><span style=\"font-family: Cambria Math;\">&#2348;&#2376;&#2325;&#2309;&#2346;</span></strong><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2310;&#2346;&#2325;&#2375; &#2337;&#2375;&#2335;&#2366;&#2348;&#2375;&#2360; &#2360;&#2375; &#2337;&#2375;&#2335;&#2366; &#2325;&#2368; &#2319;&#2325; &#2346;&#2381;&#2352;&#2340;&#2367; &#2361;&#2376; &#2332;&#2367;&#2360;&#2325;&#2366; &#2313;&#2346;&#2351;&#2379;&#2327; &#2313;&#2360; &#2337;&#2375;&#2335;&#2366; &#2325;&#2379; &#2347;&#2367;&#2352; &#2360;&#2375; &#2348;&#2344;&#2366;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366; &#2360;&#2325;&#2340;&#2366; &#2361;&#2376;&#2404; </span><strong><span style=\"font-family: Cambria Math;\">&#2337;&#2375;&#2335;&#2366; &#2352;&#2375;&#2337;&#2370;&#2339;&#2381;</span><span style=\"font-family: Cambria Math;\">&#2337;&#2344;&#2381;</span><span style=\"font-family: Cambria Math;\">&zwnj;</span><span style=\"font-family: Cambria Math;\">&#2360;&#2367;</span></strong><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2319;&#2325; &#2337;&#2375;&#2335;&#2366;&#2348;&#2375;&#2360; &#2351;&#2366; &#2337;&#2375;&#2335;&#2366; &#2360;&#2381;&#2335;&#2379;&#2352;&#2375;&#2332; &#2340;&#2325;&#2344;&#2368;&#2325; &#2325;&#2375; &#2349;&#2368;&#2340;&#2352; &#2348;&#2344;&#2366;&#2312; &#2327;&#2312; &#2360;&#2381;&#2341;&#2367;&#2340;&#2367; &#2361;&#2376; &#2332;&#2367;&#2360;&#2350;&#2375;&#2306; &#2337;&#2375;&#2335;&#2366; &#2325;&#2366; &#2319;&#2325; &#2361;&#2368; &#2335;&#2369;&#2325;&#2337;&#2364;&#2366; &#2342;&#2379; &#2309;&#2354;&#2327;</span><span style=\"font-family: Cambria Math;\">-</span><span style=\"font-family: Cambria Math;\">&#2309;&#2354;&#2327; &#2360;&#2381;&#2341;&#2366;&#2344;&#2379;&#2306; &#2350;&#2375;&#2306; &#2352;&#2326;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404; </span><strong><span style=\"font-family: Cambria Math;\">&#2337;&#2375;&#2335;&#2366;&#2348;&#2375;&#2360; &#2325;&#2368; &#2360;&#2369;&#2352;&#2325;&#2381;&#2359;&#2366;</span><span style=\"font-family: Cambria Math;\">(security of database) </span></strong><span style=\"font-family: Cambria Math;\">&#2327;&#2379;&#2346;&#2344;&#2368;&#2351;&#2340;&#2366;</span><span style=\"font-family: Cambria Math;\">(</span><span style=\"font-family: Cambria Math;\">confidentiality</span><span style=\"font-family: Cambria Math;\">), </span><span style=\"font-family: Cambria Math;\">&#2309;&#2326;&#2306;&#2337;&#2340;&#2366;</span><span style=\"font-family: Cambria Math;\">(</span><span style=\"font-family: Cambria Math;\">integrity</span><span style=\"font-family: Cambria Math;\">) </span><span style=\"font-family: Cambria Math;\">&#2324;&#2352; &#2346;&#2361;&#2369;&#2306;&#2330;</span><span style=\"font-family: Cambria Math;\">(</span><span style=\"font-family: Cambria Math;\">accessibility</span><span style=\"font-family: Cambria Math;\">) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2379; &#2360;&#2369;&#2344;&#2367;&#2358;&#2381;&#2330;&#2367;&#2340; &#2325;&#2352;&#2344;&#2375; &#2324;&#2352; &#2360;&#2369;&#2352;&#2325;&#2381;&#2359;&#2367;&#2340; &#2352;&#2326;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2337;&#2367;&#2332;&#2364;&#2366;&#2311;&#2344; &#2325;&#2367;&#2319; &#2327;&#2319; &#2344;&#2367;&#2351;&#2306;&#2340;&#2381;&#2352;&#2339;&#2379;&#2306;</span><span style=\"font-family: Cambria Math;\">(controls), </span><span style=\"font-family: Cambria Math;\">&#2313;&#2346;&#2325;&#2352;&#2339;&#2379;&#2306;</span><span style=\"font-family: Cambria Math;\">(array of tools) </span><span style=\"font-family: Cambria Math;\">&#2324;&#2352; &#2346;&#2381;&#2352;&#2325;&#2381;&#2352;&#2367;&#2351;&#2366;&#2323;&#2306;</span><span style=\"font-family: Cambria Math;\">(procedures) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2368; &#2360;&#2352;&#2339;&#2368; &#2325;&#2379; &#2360;&#2306;&#2342;&#2352;&#2381;&#2349;&#2367;&#2340; &#2325;&#2352;&#2340;&#2368; &#2361;&#2376;&#2404;</span></p>\n",
                    correct: "a",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
                questions.push({
                    id: "15",
                    section: "31",
                    question_en: "<p>15.<span style=\"font-family: Cambria Math;\"> Which of the following refers to a small, single-site network?</span></p>\n",
                    question_hi: "<p>15.<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2344;&#2367;&#2350;&#2381;&#2344; &#2350;&#2375;&#2306; &#2360;&#2375; &#2325;&#2380;&#2344; &#2360;&#2366; &#2319;&#2325; &#2331;&#2379;&#2335;&#2375;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2360;&#2381;&#2350;&#2366;&#2354; </span><span style=\"font-family: Cambria Math;\">-</span><span style=\"font-family: Cambria Math;\">&#2360;&#2366;&#2311;&#2335; &#2344;&#2375;&#2335;&#2357;&#2352;&#2381;&#2325; &#2325;&#2379; &#2360;&#2306;&#2342;&#2352;&#2381;&#2349;&#2367;&#2340; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">?</span></p>\n",
                    options_en: ["<p>DSL</p>\n", "<p>RAM</p>\n", 
                                "<p>USB</p>\n", "<p>PAN</p>\n"],
                    options_hi: ["<p><span style=\"font-weight: 400;\">&#2337;&#2368;&#2319;&#2360;&#2319;&#2354;(DSL)</span></p>\n", "<p><span style=\"font-family: Cambria Math;\">&#2352;&#2376;&#2350; </span><span style=\"font-family: Cambria Math;\">(RAM) </span></p>\n",
                                "<p><span style=\"font-weight: 400;\">&#2351;&#2370;&#2319;&#2360;&#2348;&#2368; (USB)</span></p>\n", "<p><span style=\"font-weight: 400;\">&#2346;&#2376;&#2344;(PAN)</span></p>\n"],
                    solution_en: "<p>15.(d)<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">A </span><strong><span style=\"font-family: Cambria Math;\">personal area network</span><span style=\"font-family: Cambria Math;\">, or </span><span style=\"font-family: Cambria Math;\">PAN</span></strong><span style=\"font-family: Cambria Math;\">, is a computer network organized around an individual person within a single building. It is called a small</span><span style=\"font-family: Cambria Math;\">, single-site network.</span><strong><span style=\"font-family: Cambria Math;\">Universal Serial Bus</span><span style=\"font-family: Cambria Math;\"> (</span><span style=\"font-family: Cambria Math;\">USB</span></strong><span style=\"font-family: Cambria Math;\"><strong>)</strong> is an </span><span style=\"font-family: Cambria Math;\">industry standard</span><span style=\"font-family: Cambria Math;\"> that establishes specifications for cables, connectors and </span><span style=\"font-family: Cambria Math;\">protocols</span><span style=\"font-family: Cambria Math;\"> for connection, communication and power supply (</span><span style=\"font-family: Cambria Math;\">interfacing</span><span style=\"font-family: Cambria Math;\">) between computers, </span><span style=\"font-family: Cambria Math;\">peripherals</span><span style=\"font-family: Cambria Math;\"> and other computers.</span></p>\r\n<p><strong><span style=\"font-family: Cambria Math;\">DSL (Digital Subscriber Line)</span></strong><span style=\"font-family: Cambria Math;\"> is a modem technology that uses existing telephone lines to transport high-bandwidth data, such as multimedia and video, to service subscribers.</span></p>\n",
                    solution_hi: "<p>15.(d)<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2319;&#2325; <strong>&#2357;&#2381;&#2351;&#2325;&#2381;&#2340;&#2367;&#2327;&#2340; &#2325;&#2381;&#2359;&#2375;&#2340;&#2381;&#2352; &#2344;&#2375;&#2335;&#2357;&#2352;&#2381;&#2325;</strong></span><strong><span style=\"font-family: Cambria Math;\">(personal area network), </span><span style=\"font-family: Cambria Math;\">&#2351;&#2366; &#2346;&#2376;&#2344;</span></strong><span style=\"font-family: Cambria Math;\"><strong>(PAN)</strong>, </span><span style=\"font-family: Cambria Math;\">&#2319;&#2325; &#2319;&#2325;&#2354; &#2349;&#2357;&#2344;</span><span style=\"font-family: Cambria Math;\">(single building) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2375; &#2349;&#2368;&#2340;&#2352; &#2319;&#2325; &#2357;&#2381;&#2351;&#2325;&#2381;&#2340;&#2367; &#2325;&#2375; &#2330;&#2366;&#2352;&#2379;&#2306; &#2323;&#2352; &#2357;&#2381;&#2351;&#2357;&#2360;&#2381;&#2341;&#2367;&#2340; &#2319;&#2325; &#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; &#2344;&#2375;&#2335;&#2357;&#2352;&#2381;&#2325; &#2361;&#2376;&#2404; &#2311;&#2360;&#2375; &#2319;&#2325; &#2331;&#2379;&#2335;&#2366;</span><span style=\"font-family: Cambria Math;\">,</span><span style=\"font-family: Cambria Math;\">&#2360;&#2367;&#2306;&#2327;&#2354; </span><span style=\"font-family: Cambria Math;\">-</span><span style=\"font-family: Cambria Math;\">&#2360;&#2366;&#2311;&#2335; &#2344;&#2375;&#2335;&#2357;&#2352;&#2381;&#2325; &#2325;&#2361;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404;</span><span style=\"font-family: Cambria Math;\"> </span><strong><span style=\"font-family: Cambria Math;\">&#2351;&#2370;&#2344;&#2367;&#2357;&#2352;&#2381;&#2360;&#2354; &#2360;&#2368;&#2352;&#2367;&#2351;&#2354; &#2348;&#2360;</span></strong><span style=\"font-family: Cambria Math;\"><strong> (USB)(universal serial bus)</strong> </span><span style=\"font-family: Cambria Math;\">&#2319;&#2325; &#2313;&#2342;&#2381;&#2351;&#2379;&#2327; &#2350;&#2366;&#2344;&#2325; &#2361;&#2376; &#2332;&#2379; &#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2348;&#2366;&#2361;&#2381;&#2351; &#2313;&#2346;&#2325;&#2352;&#2339;&#2379;&#2306; &#2324;&#2352; &#2309;&#2344;&#2381;&#2351; &#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352;&#2379;&#2306; &#2325;&#2375; &#2348;&#2368;&#2330; &#2325;&#2344;&#2375;&#2325;&#2381;&#2358;&#2344;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2360;&#2306;&#2330;&#2366;&#2352; &#2324;&#2352; &#2348;&#2367;&#2332;&#2354;&#2368; &#2310;&#2346;&#2370;&#2352;&#2381;&#2340;&#2367; </span><span style=\"font-family: Cambria Math;\">(</span><span style=\"font-family: Cambria Math;\">&#2311;&#2306;&#2335;&#2352;&#2347;&#2375;&#2360;&#2367;&#2306;&#2327;</span><span style=\"font-family: Cambria Math;\">) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2375; &#2354;&#2367;&#2319; &#2325;&#2375;&#2348;&#2354;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2325;&#2344;&#2375;&#2325;&#2381;&#2335;&#2352; &#2324;&#2352; &#2346;&#2381;&#2352;&#2379;&#2335;&#2379;&#2325;&#2377;&#2354; &#2325;&#2375; &#2354;&#2367;&#2319; &#2357;&#2367;&#2344;&#2367;&#2352;&#2381;&#2342;&#2375;&#2358; &#2360;&#2381;&#2341;&#2366;&#2346;&#2367;&#2340; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\r\n<p><strong><span style=\"font-family: Cambria Math;\">&#2337;&#2368;&#2319;&#2360;&#2319;&#2354; </span><span style=\"font-family: Cambria Math;\">(</span><span style=\"font-family: Cambria Math;\">&#2337;&#2367;&#2332;&#2367;&#2335;&#2354; &#2360;&#2348;&#2381;&#2360;&#2325;&#2381;&#2352;&#2366;&#2311;&#2348;&#2352; &#2354;&#2366;&#2311;&#2344;</span><span style=\"font-family: Cambria Math;\">)</span></strong><span style=\"font-family: Cambria Math;\"><strong>(digital subscriber line)</strong> </span><span style=\"font-family: Cambria Math;\">&#2319;&#2325; &#2310;&#2343;&#2369;&#2344;&#2367;&#2325; &#2340;&#2325;&#2344;&#2368;&#2325; &#2361;&#2376; &#2332;&#2379; &#2327;&#2381;&#2352;&#2366;&#2361;&#2325;&#2379;&#2306; &#2325;&#2379; &#2360;&#2375;&#2357;&#2366; &#2342;&#2375;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2350;&#2354;&#2381;&#2335;&#2368;&#2350;&#2368;&#2337;&#2367;&#2351;&#2366; &#2324;&#2352; &#2357;&#2368;&#2337;&#2367;&#2351;&#2379; &#2332;&#2376;&#2360;&#2375; &#2313;&#2330;&#2381;&#2330;</span><span style=\"font-family: Cambria Math;\">-</span><span style=\"font-family: Cambria Math;\">&#2348;&#2376;&#2306;&#2337;&#2357;&#2367;&#2337;&#2381;&#2341; &#2337;&#2375;&#2335;&#2366; &#2325;&#2375; &#2346;&#2352;&#2367;&#2357;&#2361;&#2344; &#2325;&#2375; &#2354;&#2367;&#2319; &#2350;&#2380;&#2332;&#2370;&#2342;&#2366; &#2335;&#2375;&#2354;&#2368;&#2347;&#2379;&#2344; &#2354;&#2366;&#2311;&#2344;&#2379;&#2306; &#2325;&#2366; &#2313;&#2346;&#2351;&#2379;&#2327; &#2325;&#2352;&#2340;&#2368; &#2361;&#2376;&#2404;</span></p>\n",
                    correct: "d",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
                questions.push({
                    id: "16",
                    section: "31",
                    question_en: "<p><span style=\"font-family: Cambria Math;\">16.</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">The ......... service allows a group of Internet users to exchange their views on some </span><span style=\"font-family: Cambria Math;\">common topic.</span></p>\n",
                    question_hi: "<p>16.<span style=\"font-family: Cambria Math;\"> _________</span><span style=\"font-family: Cambria Math;\">&#2360;&#2375;&#2357;&#2366; &#2311;&#2306;&#2335;&#2352;&#2344;&#2375;&#2335; &#2313;&#2346;&#2351;&#2379;&#2327;&#2325;&#2352;&#2381;&#2340;&#2366;&#2323;&#2306; &#2325;&#2375; &#2319;&#2325; &#2360;&#2350;&#2370;&#2361; &#2325;&#2379; &#2325;&#2369;&#2331; &#2346;&#2352; &#2309;&#2346;&#2344;&#2375; &#2357;&#2367;&#2330;&#2366;&#2352;&#2379;&#2306; &#2325;&#2366; &#2310;&#2342;&#2366;&#2344;</span><span style=\"font-family: Cambria Math;\">-</span><span style=\"font-family: Cambria Math;\">&#2346;&#2381;&#2352;&#2342;&#2366;&#2344; &#2325;&#2352;&#2344;&#2375; &#2325;&#2368; &#2309;&#2344;&#2369;&#2350;&#2340;&#2367; &#2342;&#2375;&#2340;&#2368; &#2361;&#2376; &#2360;&#2366;&#2350;&#2366;&#2344;&#2381;&#2351; &#2357;&#2367;&#2359;&#2351;&#2404;</span></p>\n",
                    options_en: ["<p>telnet</p>\n", "<p>nicnet</p>\n", 
                                "<p>milnet</p>\n", "<p>usenet</p>\n"],
                    options_hi: ["<p><span style=\"font-weight: 400;\">&#2335;&#2375;&#2354;&#2344;&#2375;&#2335;(telnet)</span></p>\n", "<p><span style=\"font-weight: 400;\">&#2344;&#2367;&#2325;&#2344;&#2375;&#2335;(nicnet)</span></p>\n",
                                "<p><span style=\"font-weight: 400;\">&#2350;&#2367;&#2354;&#2344;&#2375;&#2335;(milnet)</span></p>\n", "<p><span style=\"font-weight: 400;\">&#2351;&#2370;&#2332;&#2364;&#2344;&#2375;&#2335;(usenet)</span></p>\n"],
                    solution_en: "<p>16.(d)<span style=\"font-family: Cambria Math;\"> </span><strong><span style=\"font-family: Cambria Math;\">Usenet service</span></strong><span style=\"font-family: Cambria Math;\"> enables a group of Internet users to exchange their views/ideas/information on some common topic of interest with all members belonging to the group.</span></p>\n",
                    solution_hi: "<p>16.(d)<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\"><strong>&#2351;&#2370;&#2332;&#2364;&#2344;&#2375;&#2335;</strong> &#2360;&#2375;&#2357;&#2366; &#2311;&#2306;&#2335;&#2352;&#2344;&#2375;&#2335;</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2313;&#2346;&#2351;&#2379;&#2327;&#2325;&#2352;&#2381;&#2340;&#2366;&#2323;&#2306; &#2325;&#2375; &#2319;&#2325; &#2360;&#2350;&#2370;&#2361; &#2325;&#2379; &#2360;&#2350;&#2370;&#2361; &#2360;&#2375; &#2360;&#2306;&#2348;&#2306;&#2343;&#2367;&#2340; &#2360;&#2349;&#2368; &#2360;&#2342;&#2360;&#2381;&#2351;&#2379;&#2306; &#2325;&#2375; &#2360;&#2366;&#2341; &#2352;&#2369;&#2330;&#2367; &#2325;&#2375; &#2325;&#2369;&#2331; &#2360;&#2366;&#2350;&#2366;&#2344;&#2381;&#2351; &#2357;&#2367;&#2359;&#2351; &#2346;&#2352; &#2309;&#2346;&#2344;&#2375; &#2357;&#2367;&#2330;&#2366;&#2352;&#2379;&#2306;</span><span style=\"font-family: Cambria Math;\">/</span><span style=\"font-family: Cambria Math;\">&#2357;&#2367;&#2330;&#2366;&#2352;&#2379;&#2306;</span><span style=\"font-family: Cambria Math;\">/</span><span style=\"font-family: Cambria Math;\">&#2360;&#2370;&#2330;&#2344;&#2366;&#2323;&#2306; &#2325;&#2366; &#2310;&#2342;&#2366;&#2344;</span><span style=\"font-family: Cambria Math;\">-</span><span style=\"font-family: Cambria Math;\">&#2346;&#2381;&#2352;&#2342;&#2366;&#2344; &#2325;&#2352;&#2344;&#2375; &#2350;&#2375;&#2306; &#2360;&#2325;&#2381;&#2359;&#2350; &#2348;&#2344;&#2366;&#2340;&#2368; &#2361;&#2376;&#2404;</span></p>\n",
                    correct: "d",

                questions.push({
                    id: "17",
                    section: "31",
                    question_en: "<p><span style=\"font-family: Cambria Math;\">17.</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">It takes advantage of basic hardware and software security characteristics.</span></p>\n",
                    question_hi: "<p>17. <span style=\"font-family: Cambria Math;\">&#2351;&#2361; &#2348;&#2369;&#2344;&#2367;&#2351;&#2366;&#2342;&#2368; &#2361;&#2366;&#2352;&#2381;&#2337;&#2357;&#2375;&#2351;&#2352;</span><span style=\"font-family: Cambria Math;\">(basic hardware) </span><span style=\"font-family: Cambria Math;\">&#2324;&#2352; &#2360;&#2377;&#2347;&#2381;&#2335;&#2357;&#2375;&#2351;&#2352; &#2360;&#2369;&#2352;&#2325;&#2381;&#2359;&#2366; &#2357;&#2367;&#2358;&#2375;&#2359;&#2340;&#2366;&#2323;&#2306; &#2325;&#2366; &#2354;&#2366;&#2349; &#2313;&#2336;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\n",
                    options_en: ["<p>System design</p>\n", "<p>Data access control</p>\n", 
                                "<p>System access control</p>\n", "<p>None of these</p>\n"],

                    solution_en: "<p>17.(a)<span style=\"font-family: Cambria Math;\"> </span><strong><span style=\"font-family: Cambria Math;\">Systems design</span></strong><span style=\"font-family: Cambria Math;\"> is the process of defining elements of a system like modules, architecture, components and their interfaces and data for a system based on the specified requirements.</span></p>\n",
                    solution_hi: "<p>17.(a)<span style=\"font-family: Cambria Math;\"> </span><strong><span style=\"font-family: Cambria Math;\">&#2360;&#2367;&#2360;&#2381;&#2335;&#2350; &#2337;&#2367;&#2332;&#2364;&#2366;&#2311;&#2344;</span><span style=\"font-family: Cambria Math;\"> </span></strong><span style=\"font-family: Cambria Math;\">&#2344;&#2367;&#2352;&#2381;&#2342;&#2367;&#2359;&#2381;&#2335; &#2310;&#2357;&#2358;&#2381;&#2351;&#2325;&#2340;&#2366;&#2323;&#2306; &#2325;&#2375; &#2310;&#2343;&#2366;&#2352; &#2346;&#2352; &#2360;&#2367;&#2360;&#2381;&#2335;&#2350; &#2325;&#2375; &#2354;&#2367;&#2319; &#2350;&#2377;&#2337;&#2381;&#2351;&#2370;&#2354;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2310;&#2352;&#2381;&#2325;&#2367;&#2335;&#2375;&#2325;&#2381;&#2330;&#2352;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2328;&#2335;&#2325;&#2379;&#2306; &#2324;&#2352; &#2313;&#2344;&#2325;&#2375; &#2311;&#2306;&#2335;&#2352;&#2347;&#2375;&#2360; &#2324;&#2352; &#2337;&#2375;&#2335;&#2366; &#2332;&#2376;&#2360;&#2375; &#2360;&#2367;&#2360;&#2381;&#2335;&#2350; &#2325;&#2375; &#2340;&#2340;&#2381;&#2357;&#2379;&#2306; &#2325;&#2379; &#2346;&#2352;&#2367;&#2349;&#2366;&#2359;&#2367;&#2340; &#2325;&#2352;&#2344;&#2375; &#2325;&#2368; &#2346;&#2381;&#2352;&#2325;&#2381;&#2352;&#2367;&#2351;&#2366; &#2361;&#2376;&#2404;</span></p>\n",

                questions.push({
                    id: "18",
                    section: "31",
                    question_en: "<p><span style=\"font-family: Cambria Math;\">18.</span><span style=\"font-family: Cambria Math;\"> To undo the last work, we have to use which of the following Windows shortcut key? </span></p>\n",
                    question_hi: "<p><span style=\"font-family: Cambria Math;\">18.</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2346;&#2367;&#2331;&#2354;&#2375; &#2325;&#2366;&#2352;&#2381;&#2351; &#2325;&#2379; &#2346;&#2370;&#2352;&#2381;&#2357;&#2357;&#2340; </span><span style=\"font-family: Cambria Math;\">(undo) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2352;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2361;&#2350;&#2375;&#2306; &#2344;&#2367;&#2350;&#2381;&#2344; &#2350;&#2375;&#2306; &#2360;&#2375; &#2325;&#2367;&#2360; &#2357;&#2367;&#2306;&#2337;&#2379;&#2332; &#2358;&#2377;&#2352;&#2381;&#2335;&#2325;&#2335; &#2325;&#2369;&#2306;&#2332;&#2368; </span><span style=\"font-family: Cambria Math;\">(Windows shortcut key) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2366; &#2313;&#2346;&#2351;&#2379;&#2327; &#2325;&#2352;&#2344;&#2366; &#2361;&#2379;&#2327;&#2366;</span><span style=\"font-family: Cambria Math;\">?</span></p>\n",
                    options_en: ["<p>Ctrl + P</p>\n", "<p>Ctrl + U</p>\n", 
                                "<p>Ctrl + A</p>\n", "<p>Ctrl + Z</p>\n"],
                    options_hi: ["<p>Ctrl + P</p>\n", "<p>Ctrl + U</p>\n",
                                "<p>Ctrl + A</p>\n", "<p>Ctrl + Z</p>\n"],
                    solution_en: "<p>18.(d)<span style=\"font-family: Cambria Math;\"> To undo the last action press </span><strong><span style=\"font-family: Cambria Math;\">Ctrl + Z</span><span style=\"font-family: Cambria Math;\">.</span></strong></p>\r\n<p><span style=\"font-family: Cambria Math;\">To print the document press </span><strong><span style=\"font-family: Cambria Math;\">Ctrl + P</span></strong><span style=\"font-family: Cambria Math;\">.</span></p>\r\n<p><span style=\"font-family: Cambria Math;\">To underline the document press </span><strong><span style=\"font-family: Cambria Math;\">Ctrl + U</span><span style=\"font-family: Cambria Math;\">.</span></strong></p>\r\n<p><strong><span style=\"font-family: Cambria Math;\">Ctrl + A</span></strong><span style=\"font-family: Cambria Math;\"> used to select the entire text.</span></p>\n",
                    solution_hi: "<p>18.(d)<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2346;&#2367;&#2331;&#2354;&#2368; &#2325;&#2381;&#2352;&#2367;&#2351;&#2366; &#2325;&#2379; &#2346;&#2370;&#2352;&#2381;&#2357;&#2357;&#2340; </span><span style=\"font-family: Cambria Math;\">(undo) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2352;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; </span><span style=\"font-family: Cambria Math;\"><strong>Ctrl + Z</strong> </span><span style=\"font-family: Cambria Math;\">&#2342;&#2348;&#2366;&#2319;&#2306;&#2404;</span></p>\r\n<p><span style=\"font-family: Cambria Math;\">&#2337;&#2377;&#2325;&#2381;&#2351;&#2370;&#2350;&#2375;&#2306;&#2335; &#2325;&#2379; &#2346;&#2381;&#2352;&#2367;&#2306;&#2335; </span><span style=\"font-family: Cambria Math;\">(print) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2352;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; </span><span style=\"font-family: Cambria Math;\"><strong>Ctrl + P</strong> </span><span style=\"font-family: Cambria Math;\">&#2342;&#2348;&#2366;&#2319;&#2306;&#2404;</span></p>\r\n<p><span style=\"font-family: Cambria Math;\">&#2337;&#2377;&#2325;&#2381;&#2351;&#2370;&#2350;&#2375;&#2306;&#2335; &#2325;&#2379; &#2309;&#2306;&#2337;&#2352;&#2354;&#2366;&#2311;&#2344; </span><span style=\"font-family: Cambria Math;\">(underline) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2352;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; </span><span style=\"font-family: Cambria Math;\"><strong>Ctrl + U</strong> </span><span style=\"font-family: Cambria Math;\">&#2342;&#2348;&#2366;&#2319;&#2306;&#2404;</span></p>\r\n<p><span style=\"font-family: Cambria Math;\"><strong>Ctrl + A</strong> </span><span style=\"font-family: Cambria Math;\">&#2346;&#2370;&#2352;&#2375; &#2335;&#2375;&#2325;&#2381;&#2360;&#2381;&#2335; &#2325;&#2379; &#2360;&#2375;&#2354;&#2375;&#2325;&#2381;&#2335; </span><span style=\"font-family: Cambria Math;\">(select) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2352;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2346;&#2381;&#2352;&#2351;&#2379;&#2327; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\n",
                    correct: "d",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
                questions.push({
                    id: "19",
                    section: "31",
                    question_en: "<p>19.<span style=\"font-family: Cambria Math;\"> Integrated Circuit (IC) or chips used in computers are made with </span></p>\n",
                    question_hi: "<p>19.<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; &#2350;&#2375;&#2306; &#2346;&#2381;&#2352;&#2351;&#2369;&#2325;&#2381;&#2340; &#2311;&#2306;&#2335;&#2368;&#2327;&#2381;&#2352;&#2375;&#2335;&#2375;&#2337; &#2360;&#2352;&#2381;&#2325;&#2367;&#2335; </span><span style=\"font-family: Cambria Math;\">(IC) </span><span style=\"font-family: Cambria Math;\">&#2351;&#2366; &#2330;&#2367;&#2346;&#2381;&#2360; </span><span style=\"font-family: Cambria Math;\">(chips) _____ </span><span style=\"font-family: Cambria Math;\">&#2360;&#2375; &#2348;&#2344;&#2375; &#2361;&#2379;&#2340;&#2375; &#2361;&#2376;&#2306;&#2404;</span></p>\n",
                    options_en: ["<p>copper</p>\n", "<p>aluminum</p>\n", 
                                "<p>gold</p>\n", "<p>silicon</p>\n"],
                    options_hi: ["<p><span style=\"font-family: Cambria Math;\">&#2325;&#2377;&#2346;&#2352; </span><span style=\"font-family: Cambria Math;\">(copper) </span></p>\n", "<p><span style=\"font-weight: 400;\">&#2319;&#2354;&#2381;&#2351;&#2369;&#2350;&#2367;&#2344;&#2367;&#2351;&#2350; (aluminium)</span></p>\n",
                                "<p><span style=\"font-weight: 400;\">&#2327;&#2379;&#2354;&#2381;&#2337; (gold)</span></p>\n", "<p><span style=\"font-weight: 400;\">&#2360;&#2367;&#2354;&#2367;&#2325;&#2377;&#2344; (silicon)</span></p>\n"],
                    solution_en: "<p>19.(d) <span style=\"font-family: Cambria Math;\">Integrated circuits are <strong>made up of </strong></span><span style=\"font-family: Cambria Math;\"><strong>silicons</strong>.</span></p>\n",
                    solution_hi: "<p>19.(d) <span style=\"font-family: Cambria Math;\">&#2311;&#2306;&#2335;&#2368;&#2327;&#2381;&#2352;&#2375;&#2335;&#2375;&#2337; &#2360;&#2352;&#2381;&#2325;&#2367;&#2335; <strong>&#2360;&#2367;&#2354;&#2367;&#2325;&#2377;&#2344;</strong> &#2360;&#2375; &#2348;&#2344;&#2375; &#2361;&#2379;&#2340;&#2375; &#2361;&#2376;&#2306;&#2404;</span></p>\n",
                    correct: "d",

                });
                questions.push({
                    id: "20",
                    section: "misc",
                    question_en: "<p>20.<span style=\"font-family: Cambria Math;\"> Which of the following is a hexadecimal number equal to 3431 octal number?</span></p>\n",
                    question_hi: "<p>20.<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2344;&#2367;&#2350;&#2381;&#2344; &#2350;&#2375;&#2306; &#2360;&#2375; &#2325;&#2380;&#2344; &#2360;&#2366; &#2361;&#2375;&#2325;&#2381;&#2360;&#2366;&#2337;&#2375;&#2360;&#2367;&#2350;&#2354; &#2344;&#2306;&#2348;&#2352; </span><span style=\"font-family: Cambria Math;\">3431 </span><span style=\"font-family: Cambria Math;\">&#2321;&#2325;&#2381;&#2335;&#2354; &#2344;&#2306;&#2348;&#2352; &#2325;&#2375; &#2348;&#2352;&#2366;&#2348;&#2352; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">?</span></p>\n",
                    options_en: ["<p>719</p>\n", "<p>197</p>\n", 
                                "<p>917</p>\n", "<p>791</p>\n"],
                    options_hi: ["<p>719</p>\n", "<p>197</p>\n",
                                "<p>917</p>\n", "<p>791</p>\n"],
                    solution_en: "<p>20.(a)<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">Step 1</span><span style=\"font-family: Cambria Math;\">: Look up each octal digit to obtain the equivalent group of three binary digits. You can use the table below to make these conversions.</span></p>\r\n<p><span style=\"font-family: Cambria Math;\">Octal to Binary Conversion Table</span></p>\r\n<p><img src=\"https://ssccglpinnacle.com/images/mceu_48230315411671613354530.png\"></p>\r\n<p><span style=\"font-weight: 400;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mrow><mo>(</mo><mn>3</mn><mo>)</mo></mrow><mn>8</mn></msub></math></span><span style=\"font-weight: 400;\"> =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mrow><mo>(</mo><mn>011</mn><mo>)</mo></mrow><mn>2</mn></msub></math></span></p>\r\n<p><span style=\"font-weight: 400;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mrow><mo>(</mo><mn>4</mn><mo>)</mo></mrow><mn>8</mn></msub></math></span><span style=\"font-weight: 400;\"> =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mrow><mo>(</mo><mn>100</mn><mo>)</mo></mrow><mn>2</mn></msub></math></span></p>\r\n<p><span style=\"font-weight: 400;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mrow><mo>(</mo><mn>3</mn><mo>)</mo></mrow><mn>8</mn></msub></math></span><span style=\"font-weight: 400;\"> =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mrow><mo>(</mo><mn>011</mn><mo>)</mo></mrow><mn>2</mn></msub></math></span></p>\r\n<p><span style=\"font-weight: 400;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mrow><mo>(</mo><mn>1</mn><mo>)</mo></mrow><mn>8</mn></msub></math></span><span style=\"font-weight: 400;\"> =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mrow><mo>(</mo><mn>001</mn><mo>)</mo></mrow><mn>2</mn></msub></math></span></p>\r\n<p><strong>Step 2</strong><span style=\"font-weight: 400;\">: Group each value of step 1 to make a binary number.</span></p>\r\n<p><span style=\"font-weight: 400;\">011 100 011 001</span></p>\r\n<p><span style=\"font-weight: 400;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mrow><mo>(</mo><mn>3431</mn><mo>)</mo></mrow><mn>8</mn></msub></math></span><span style=\"font-weight: 400;\"> = </span><span style=\"font-weight: 400;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mrow><mo>(</mo><mn>11100011001</mn><mo>)</mo></mrow><mn>2</mn></msub></math></span></p>\r\n<p><strong>Step 3</strong><span style=\"font-weight: 400;\">: Now convert the binary number from step 2 to hexa by grouping all the digits of the binary in sets of four starting from the LSB (far right).</span></p>\r\n<p><span style=\"font-weight: 400;\">0111 0001 1001</span></p>\r\n<p><span style=\"font-weight: 400;\">Note: add zeros to the left of the last digit if there aren\'t enough digits to make a set of four.</span></p>\r\n<p><strong>Step 4</strong><span style=\"font-weight: 400;\">: Convert each group of four to the corresponding hexadecimal (use the table below),</span></p>\r\n<p><span style=\"font-weight: 400;\">0111=7, 0001=1, 1001=9.</span></p>\r\n<p><span style=\"font-weight: 400;\">So, the octal 3431 is equivalent to 719 in hexadecimal.</span></p>\r\n<p><span style=\"font-weight: 400;\">To convert from binary to hexadecimal use the following table:</span></p>\r\n<p><span style=\"font-weight: 400;\"><img src=\"https://ssccglpinnacle.com/images/mceu_80945416021671613737246.png\"></span></p>\n",
                    solution_hi: "<p>20.(a)<span style=\"font-family: Cambria Math;\"> </span><strong><span style=\"font-family: Cambria Math;\">&#2360;&#2381;&#2335;&#2375;&#2346; </span></strong><span style=\"font-family: Cambria Math;\"><strong>1</strong>:</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2340;&#2368;&#2344; &#2348;&#2366;&#2311;&#2344;&#2352;&#2368; &#2337;&#2367;&#2332;&#2367;&#2335; &#2325;&#2375; &#2311;&#2325;&#2381;&#2357;&#2367;&#2357;&#2376;&#2354;&#2375;&#2306;&#2335; &#2327;&#2381;&#2352;&#2369;&#2346; </span><span style=\"font-family: Cambria Math;\">(equivalent group) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2379; &#2346;&#2381;&#2352;&#2366;&#2346;&#2381;&#2340; &#2325;&#2352;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2346;&#2381;&#2352;&#2340;&#2381;&#2351;&#2375;&#2325; &#2321;&#2325;&#2381;&#2335;&#2354; &#2337;&#2367;&#2332;&#2367;&#2335; </span><span style=\"font-family: Cambria Math;\">(octal digit) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2379; &#2342;&#2375;&#2326;&#2375;&#2306;&#2404; &#2311;&#2344; &#2352;&#2370;&#2346;&#2366;&#2306;&#2340;&#2352;&#2339;&#2379;&#2306; &#2325;&#2379; &#2325;&#2352;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2310;&#2346; &#2344;&#2368;&#2330;&#2375; &#2342;&#2368; &#2327;&#2312; &#2340;&#2366;&#2354;&#2367;&#2325;&#2366; &#2325;&#2366; &#2313;&#2346;&#2351;&#2379;&#2327; &#2325;&#2352; &#2360;&#2325;&#2340;&#2375; &#2361;&#2376;&#2306;&#2404;</span></p>\r\n<p><span style=\"font-family: Cambria Math;\">&#2321;&#2325;&#2381;&#2335;&#2354; &#2360;&#2375; &#2348;&#2366;&#2311;&#2344;&#2352;&#2368; &#2352;&#2370;&#2346;&#2366;&#2306;&#2340;&#2352;&#2339; &#2340;&#2366;&#2354;&#2367;&#2325;&#2366;</span><span style=\"font-family: Cambria Math;\"> </span></p>\r\n<p><img src=\"https://ssccglpinnacle.com/images/mceu_15433309611671613827213.png\"></p>\r\n<p><span style=\"font-weight: 400;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mrow><mo>(</mo><mn>3</mn><mo>)</mo></mrow><mn>8</mn></msub></math></span><span style=\"font-weight: 400;\"> =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mrow><mo>(</mo><mn>011</mn><mo>)</mo></mrow><mn>2</mn></msub></math></span></p>\r\n<p><span style=\"font-weight: 400;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mrow><mo>(</mo><mn>4</mn><mo>)</mo></mrow><mn>8</mn></msub></math></span><span style=\"font-weight: 400;\"> =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mrow><mo>(</mo><mn>100</mn><mo>)</mo></mrow><mn>2</mn></msub></math></span></p>\r\n<p><span style=\"font-weight: 400;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mrow><mo>(</mo><mn>3</mn><mo>)</mo></mrow><mn>8</mn></msub></math></span><span style=\"font-weight: 400;\"> =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mrow><mo>(</mo><mn>011</mn><mo>)</mo></mrow><mn>2</mn></msub></math></span></p>\r\n<p><span style=\"font-weight: 400;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mrow><mo>(</mo><mn>1</mn><mo>)</mo></mrow><mn>8</mn></msub></math> =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mrow><mo>(</mo><mn>001</mn><mo>)</mo></mrow><mn>2</mn></msub></math></span></p>\r\n<p><strong>&#2360;&#2381;&#2335;&#2375;&#2346; 2:</strong><span style=\"font-weight: 400;\"> &#2348;&#2366;&#2311;&#2344;&#2352;&#2368; &#2344;&#2306;&#2348;&#2352; &#2348;&#2344;&#2366;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2360;&#2381;&#2335;&#2375;&#2346; 1 &#2325;&#2375; &#2346;&#2381;&#2352;&#2340;&#2381;&#2351;&#2375;&#2325; &#2350;&#2366;&#2344; &#2325;&#2379; &#2360;&#2350;&#2370;&#2361;&#2368;&#2325;&#2371;&#2340; &#2325;&#2352;&#2375;&#2306;&#2404;&nbsp;</span></p>\r\n<p><span style=\"font-weight: 400;\">011 100 011 001</span></p>\r\n<p><span style=\"font-weight: 400;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mrow><mo>(</mo><mn>3431</mn><mo>)</mo></mrow><mn>8</mn></msub></math></span><span style=\"font-weight: 400;\"> = </span><span style=\"font-weight: 400;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mrow><mo>(</mo><mn>11100011001</mn><mo>)</mo></mrow><mn>2</mn></msub></math></span></p>\r\n<p><strong>&#2360;&#2381;&#2335;&#2375;&#2346; 3:</strong><span style=\"font-weight: 400;\"> &#2309;&#2348; &#2348;&#2366;&#2311;&#2344;&#2352;&#2368; &#2344;&#2306;&#2348;&#2352; &#2325;&#2379; &#2360;&#2381;&#2335;&#2375;&#2346; 2 &#2360;&#2375; &#2361;&#2375;&#2325;&#2381;&#2360;&#2366; &#2350;&#2375;&#2306; &#2346;&#2352;&#2367;&#2357;&#2352;&#2381;&#2340;&#2367;&#2340; &#2325;&#2352;&#2375;&#2306;, &#2348;&#2366;&#2311;&#2344;&#2352;&#2368; &#2325;&#2375; &#2360;&#2349;&#2368; &#2337;&#2367;&#2332;&#2367;&#2335; &#2325;&#2379; LSB &#2360;&#2375; &#2358;&#2369;&#2352;&#2370; &#2325;&#2352;&#2340;&#2375; &#2361;&#2369;&#2319; &#2330;&#2366;&#2352; &#2325;&#2375; &#2360;&#2375;&#2335; &#2350;&#2375;&#2306; &#2360;&#2350;&#2370;&#2361;&#2367;&#2340; &#2325;&#2352;&#2375;&#2306; (&#2342;&#2366;&#2312;&#2306; &#2323;&#2352;)&#2404;</span></p>\r\n<p><span style=\"font-weight: 400;\">0111 0001 1001</span></p>\r\n<p><strong>&#2344;&#2379;&#2335;:</strong><span style=\"font-weight: 400;\"> &#2351;&#2342;&#2367; &#2330;&#2366;&#2352; &#2325;&#2366; &#2319;&#2325; &#2360;&#2375;&#2335; &#2348;&#2344;&#2366;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2346;&#2352;&#2381;&#2351;&#2366;&#2346;&#2381;&#2340; &#2309;&#2306;&#2325; &#2344;&#2361;&#2368;&#2306; &#2361;&#2376;&#2306; &#2340;&#2379; &#2309;&#2306;&#2340;&#2367;&#2350; &#2309;&#2306;&#2325; &#2325;&#2375; &#2348;&#2366;&#2312;&#2306; &#2323;&#2352; &#2358;&#2370;&#2344;&#2381;&#2351; &#2332;&#2379;&#2337;&#2364;&#2375;&#2306;&#2404;</span></p>\r\n<p><strong>&#2360;&#2381;&#2335;&#2375;&#2346; 4:</strong><span style=\"font-weight: 400;\"> &#2330;&#2366;&#2352; &#2325;&#2375; &#2346;&#2381;&#2352;&#2340;&#2381;&#2351;&#2375;&#2325; &#2360;&#2350;&#2370;&#2361; &#2325;&#2379; &#2360;&#2306;&#2348;&#2306;&#2343;&#2367;&#2340; &#2361;&#2375;&#2325;&#2381;&#2360;&#2366;&#2337;&#2375;&#2360;&#2367;&#2350;&#2354; &#2350;&#2375;&#2306; &#2348;&#2342;&#2354;&#2375;&#2306; (&#2344;&#2368;&#2330;&#2375; &#2342;&#2368; &#2327;&#2312; &#2340;&#2366;&#2354;&#2367;&#2325;&#2366; &#2325;&#2366; &#2313;&#2346;&#2351;&#2379;&#2327; &#2325;&#2352;&#2375;&#2306;),</span></p>\r\n<p><span style=\"font-weight: 400;\">0111=7, 0001=1, 1001=9&nbsp;</span></p>\r\n<p><span style=\"font-weight: 400;\">&#2309;&#2340;&#2307; &#2321;&#2325;&#2381;&#2335;&#2354; 3431 &#2361;&#2375;&#2325;&#2381;&#2360;&#2366;&#2337;&#2375;&#2360;&#2367;&#2350;&#2354; &#2350;&#2375;&#2306; 719 &#2325;&#2375; &#2348;&#2352;&#2366;&#2348;&#2352; &#2361;&#2376;&#2404;</span></p>\r\n<p>&nbsp;</p>\r\n<p><span style=\"font-weight: 400;\"><img src=\"https://ssccglpinnacle.com/images/mceu_18049056821671614233169.png\"></span></p>\r\n<p>&nbsp;</p>\n",
                    correct: "a",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
            
            // Generate question boxes
            const boxesContainer = document.getElementById('question-boxes');
            questions.forEach((q, index) => {
                const box = document.createElement('div');
                box.className = 'q-box';
                box.textContent = index + 1;
                box.onclick = () => showQuestion(index);
                box.id = `box-${index}`;
                boxesContainer.appendChild(box);
            });
            
            // Show first question
            showQuestion(0);
            updateProgress();
        }
        
        // Show a specific question
        
        function formatContent(text) {
            if (!text) return '';
            return text.replace(/<img/g, '<img style="max-width:100%;height:auto;"');
        }
        
        function showQuestion(index) {
            if (index < 0 || index >= questions.length) return;
            
            currentQuestion = index;
            const question = questions[index];
            
            // Update question counter
            document.getElementById('question-counter').textContent = `Question ${index + 1} of ${questions.length}`;
            
            // Update question boxes
            document.querySelectorAll('.q-box').forEach(box => box.classList.remove('current'));
            document.getElementById(`box-${index}`).classList.add('current');
            
            // Generate question HTML
            let html = `
                <div class="question-card">
                    <div class="question-text">
                        <div class="en">${formatContent(question.question_en)}</div>
                        <div class="hi" style="display:none">${formatContent(question.question_hi)} </div>
                    </div>
                    <div class="options" id="options-container">`;
            
            // Add options
            ['a', 'b', 'c', 'd'].forEach((opt, i) => {
                let optionClass = '';
                let isCorrectAnswer = opt === question.correct;
                let isUserAnswer = answers[question.id] === opt;
                
                // When reviewing, add appropriate classes
                if (submitted) {
                    if (isCorrectAnswer) {
                        optionClass += ' correct-answer';
                    } else if (isUserAnswer && !isCorrectAnswer) {
                        optionClass += ' incorrect';
                    }
                }
                
                html += `
                    <div class="option-item">
                        <input class="option-input" type="radio" name="q${index}" 
                            id="opt-${index}-${opt}" value="${opt}" 
                            ${isUserAnswer ? 'checked' : ''}
                            onclick="selectAnswer('${question.id}', '${opt}')">
                       <label class="option-label${optionClass}" for="opt-${index}-${opt}">
                            <div class="en">${question.options_en[i]}</div>
                            <div class="hi" style="display:none">${question.options_hi[i]}</div>
                        </label>
                    </div>`;
            });
            
            // Add solution if submitted
            if (submitted) {
                const isCorrect = answers[question.id] === question.correct;
                const resultText = answers[question.id] ? (isCorrect ? 'Correct!' : 'Incorrect!') : 'Not attempted';
                
                html += `
                    <div class="solution-container">
                        <div class="solution-title">${resultText}</div>
                        <div class="solution-text">
                            <div class="en">${question.solution_en}</div>
                            <div class="hi" style="display:none">${question.solution_hi}</div>
                        </div>
                    </div>`;
            }
            
            html += `</div></div>`;
            
            document.getElementById('questions-container').innerHTML = html;
            
            // Apply language settings
            applyLanguage();
            
            // If in mobile view, close the menu
            if (window.innerWidth < 992) {
                toggleNav(false);
            }
            
            // Add review mode class if submitted
            if (submitted) {
                document.getElementById('options-container').classList.add('review-mode');
            }
        }
        
        // Apply current language
        function applyLanguage() {
            document.querySelectorAll(`.${currentLang}`).forEach(el => el.style.display = 'block');
            document.querySelectorAll(`.${currentLang === 'en' ? 'hi' : 'en'}`).forEach(el => el.style.display = 'none');
            
            // Update language button text
            document.getElementById('lang-text').textContent = currentLang === 'en' ? 'Hi' : 'En';
        }
        
        // Select an answer
        function selectAnswer(qId, option) {
            if (submitted) return;
            
            answers[qId] = option;
            updateProgress();
            
            // Mark question as attempted in the navigation
            const index = questions.findIndex(q => q.id === qId);
            if (index >= 0) {
                const box = document.getElementById(`box-${index}`);
                box.classList.add('attempted');
                box.classList.remove('unattempted');
            }
        }
        
        // Navigate to previous/next question
        function prevQuestion() { 
            if (currentQuestion > 0) showQuestion(currentQuestion - 1); 
        }
        
        function nextQuestion() { 
            if (currentQuestion < questions.length - 1) showQuestion(currentQuestion + 1); 
        }
        
        // Switch section
        function switchSection(sectionId) {
            if (sectionId === 'all') {
                showQuestion(0);
                return;
            }
            
            const section = sections[sectionId];
            if (section) showQuestion(section.start);
        }
        
        // Toggle language
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            applyLanguage();
        }
        
        // Toggle navigation sidebar
        function toggleNav(show) {
            const nav = document.getElementById('question-nav');
            const overlay = document.getElementById('nav-overlay');
            
            if (show === undefined) {
                show = !nav.classList.contains('show');
            }
            
            if (show) {
                nav.classList.add('show');
                overlay.classList.add('show');
                document.body.style.overflow = 'hidden';
            } else {
                nav.classList.remove('show');
                overlay.classList.remove('show');
                document.body.style.overflow = '';
            }
        }
        
        // Update progress
        function updateProgress() {
            const attempted = Object.keys(answers).length;
            document.getElementById('attempted-count').textContent = attempted;
        }
        
        // Start timer
        function startTimer() {
            const timerDisplay = document.getElementById('timer-display');
            let timeLeft = totalTime;
            
            const timerInterval = setInterval(() => {
                if (timeLeft <= 0 || submitted) {
                    clearInterval(timerInterval);
                    if (!submitted) submitTest();
                    return;
                }
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                timeLeft--;
            }, 1000);
        }
        
        // Confirm before submitting
        function confirmSubmit() {
            if (submitted) return;
            
            const attempted = Object.keys(answers).length;
            const remaining = questions.length - attempted;
            
            // Create a more modern confirmation dialog
            const confirmHtml = `
                <div style="text-align: center; padding: 20px;">
                    <h4 style="margin-bottom: 16px; color: var(--dark);">Confirm Submission</h4>
                    <p style="margin-bottom: 24px; color: var(--gray);">
                        You have attempted ${attempted} of ${questions.length} questions.<br>
                        ${remaining} questions are unattempted.
                    </p>
                    <div style="display: flex; justify-content: center; gap: 12px;">
                        <button onclick="this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; border: 1px solid var(--light-gray); background: white; border-radius: 8px; cursor: pointer;">
                            Cancel
                        </button>
                        <button onclick="submitTest(); this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer;">
                            Submit Test
                        </button>
                    </div>
                </div>`;
            
            // Create modal element
            const modal = document.createElement('div');
            modal.className = 'results-modal show';
            modal.innerHTML = `
                <div class="results-card" style="max-width: 400px;">
                    <button class="cancel-btn" style="position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--gray);" onclick="this.closest('.results-modal').remove()">
                        ×
                    </button>
                    ${confirmHtml}
                </div>`;
            
            document.body.appendChild(modal);
        }
        
        // Submit test
        function submitTest() {
            if (submitted) return;
            
            submitted = true;
            
            let score = 0;
            let correctCount = 0;
            let incorrectCount = 0;
            let unattemptedCount = 0;
            
            questions.forEach((q, index) => {
                const userAns = answers[q.id];
                const box = document.getElementById(`box-${index}`);
                
                box.classList.remove('attempted');
                
                if (!userAns) {
                    unattemptedCount++;
                    box.classList.add('unattempted');
                } else if (userAns === q.correct) {
                    correctCount++;
                    score += q.pos_marks;
                    box.classList.add('correct');
                } else {
                    incorrectCount++;
                    score -= q.neg_marks;
                    box.classList.add('incorrect');
                }
            });
            
            // Update result values
            document.getElementById('score-value').textContent = score.toFixed(2);
            document.getElementById('correct-value').textContent = correctCount;
            document.getElementById('incorrect-value').textContent = incorrectCount;
            document.getElementById('unattempted-value').textContent = unattemptedCount;
            
            // Show the results modal
            document.getElementById('results-modal').classList.add('show');
            
            // Disable submit button
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-check"></i>';
            submitBtn.style.backgroundColor = 'var(--success)';
            
            // Refresh current question view to show solution
            showQuestion(currentQuestion);
        }
        
        // Review test
        function reviewTest() {
            document.getElementById('results-modal').classList.remove('show');
            showQuestion(0);
        }
        
        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('results-modal')) {
                document.getElementById('results-modal').classList.remove('show');
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === 'ArrowRight') nextQuestion();
        });
    </script>
</body>
</html>
