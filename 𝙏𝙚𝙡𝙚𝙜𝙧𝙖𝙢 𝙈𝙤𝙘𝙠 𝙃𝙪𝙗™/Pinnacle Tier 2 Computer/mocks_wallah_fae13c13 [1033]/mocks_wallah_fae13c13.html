                questions.push({
                    id: "12",
                    section: "31",
                    question_en: "<p>12.<span style=\"font-family: Cambria Math;\"> Which of the following is not a property of twisted pair cabling?</span></p>\n",
                    question_hi: "<p>12.<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2344;&#2367;&#2350;&#2381;&#2344;&#2354;&#2367;&#2326;&#2367;&#2340; &#2350;&#2375;&#2306; &#2360;&#2375; &#2325;&#2380;&#2344; &#2360;&#2366; &#2335;&#2381;&#2357;&#2367;&#2360;&#2381;&#2335;&#2375;&#2337; &#2346;&#2375;&#2351;&#2352; &#2325;&#2375;&#2348;&#2354;&#2367;&#2306;&#2327;</span><span style=\"font-family: Cambria Math;\">(twisted pair cabling) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2366; &#2327;&#2369;&#2339; &#2344;&#2361;&#2368;&#2306; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">?</span></p>\n",
                    options_en: ["<p>Twisted pair cable carries signals as light waves</p>\n", "<p>Twisted pair cabling is a relatively low speed transmission</p>\n", 
                                "<p>The wires can be shielded</p>\n", "<p>The wires can be unshielded</p>\n"],
                    options_hi: ["<p><span style=\"font-family: Cambria Math;\">&#2335;&#2381;&#2357;&#2367;&#2360;&#2381;&#2335;&#2375;&#2337; &#2346;&#2375;&#2309;&#2352; &#2325;&#2375;&#2348;&#2354; &#2346;&#2381;&#2352;&#2325;&#2366;&#2358; &#2340;&#2352;&#2306;&#2327;&#2379;&#2306; &#2325;&#2375; &#2352;&#2370;&#2346; &#2350;&#2375;&#2306; &#2360;&#2306;&#2325;&#2375;&#2340;&#2379;&#2306; &#2325;&#2379; &#2357;&#2361;&#2344; &#2325;&#2352;&#2340;&#2368; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">I</span></p>\n", "<p><span style=\"font-family: Cambria Math;\">&#2335;&#2381;&#2357;&#2367;&#2360;&#2381;&#2335;&#2375;&#2337; &#2346;&#2375;&#2309;&#2352; &#2325;&#2375;&#2348;&#2354;&#2367;&#2306;&#2327; &#2309;&#2346;&#2375;&#2325;&#2381;&#2359;&#2366;&#2325;&#2371;&#2340;</span><span style=\"font-family: Cambria Math;\">(relatively) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2350; &#2327;&#2340;&#2367; &#2325;&#2366; &#2360;&#2306;&#2330;&#2352;&#2339; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">I</span></p>\n",
                                "<p><span style=\"font-family: Cambria Math;\">&#2340;&#2366;&#2352;&#2379;&#2306; &#2325;&#2379; &#2346;&#2352;&#2367;&#2352;&#2325;&#2381;&#2359;&#2367;&#2340;</span><span style=\"font-family: Cambria Math;\">(shielded) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2367;&#2351;&#2366; &#2332;&#2366; &#2360;&#2325;&#2340;&#2366; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">I</span></p>\n", "<p><span style=\"font-family: Cambria Math;\">&#2340;&#2366;&#2352;&#2379;&#2306; &#2325;&#2379; &#2309;&#2358;&#2367;&#2325;&#2381;&#2359;&#2367;&#2340;</span><span style=\"font-family: Cambria Math;\">(unshielded) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2367;&#2351;&#2366; &#2332;&#2366; &#2360;&#2325;&#2340;&#2366; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">I</span></p>\n"],
                    solution_en: "<p>12.(a) <strong><span style=\"font-family: Cambria Math;\">Twisted pair cables</span></strong><span style=\"font-family: Cambria Math;\"> have two conductors that are generally made up of copper and each conductor has insulation..These two conductors are twisted together, thus giving the name twisted pair cables.It results in signal distortion in a very effective manner. There are two types of twisted pair : </span><span style=\"font-family: Cambria Math;\">shielded twisted pair (STP)</span><span style=\"font-family: Cambria Math;\"> and </span><span style=\"font-family: Cambria Math;\">unshielded twisted pair (UTP).</span><span style=\"font-family: Cambria Math;\">The </span><strong><span style=\"font-family: Cambria Math;\">optical fiber cable</span></strong><span style=\"font-family: Cambria Math;\"> carries data as light, which travels inside a thin fiber of glass.It results in signal distortion in a very effective manner. </span></p>\n",
                    solution_hi: "<p>12.(a)<span style=\"font-family: Cambria Math;\"> </span><strong><span style=\"font-family: Cambria Math;\">&#2335;&#2381;&#2357;&#2367;&#2360;&#2381;&#2335;&#2375;&#2337; &#2346;&#2375;&#2351;&#2352; &#2325;&#2375;&#2348;&#2354;&#2381;&#2360;</span><span style=\"font-family: Cambria Math;\">(Twisted pair cables)</span></strong><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2350;&#2375;&#2306; &#2342;&#2379; &#2325;&#2306;&#2337;&#2325;&#2381;&#2335;&#2352; &#2361;&#2379;&#2340;&#2375; &#2361;&#2376;&#2306; &#2332;&#2379; &#2310;&#2350; &#2340;&#2380;&#2352; &#2346;&#2352; &#2340;&#2366;&#2306;&#2348;&#2375; &#2360;&#2375; &#2348;&#2344;&#2375; &#2361;&#2379;&#2340;&#2375; &#2361;&#2376;&#2306; &#2324;&#2352; &#2346;&#2381;&#2352;&#2340;&#2381;&#2351;&#2375;&#2325; &#2325;&#2306;&#2337;&#2325;&#2381;&#2335;&#2352; &#2350;&#2375;&#2306; &#2311;&#2344;&#2381;&#2360;&#2369;&#2354;&#2375;&#2358;&#2344; &#2361;&#2379;&#2340;&#2366; &#2361;&#2376;&#2404; &#2311;&#2344; &#2342;&#2379; &#2325;&#2306;&#2337;&#2325;&#2381;&#2335;&#2352;&#2379;&#2306; &#2325;&#2379; &#2319;&#2325; &#2360;&#2366;&#2341; &#2328;&#2369;&#2350;&#2366;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2311;&#2360; &#2346;&#2381;&#2352;&#2325;&#2366;&#2352; &#2335;&#2381;&#2357;&#2367;&#2360;&#2381;&#2335;&#2375;&#2337; &#2346;&#2375;&#2351;&#2352; &#2325;&#2375;&#2348;&#2354;&#2381;&#2360; &#2325;&#2366; &#2344;&#2366;&#2350; &#2342;&#2367;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404; &#2311;&#2360;&#2325;&#2375; &#2346;&#2352;&#2367;&#2339;&#2366;&#2350;&#2360;&#2381;&#2357;&#2352;&#2370;&#2346; &#2348;&#2361;&#2369;&#2340; &#2346;&#2381;&#2352;&#2349;&#2366;&#2357;&#2368; &#2340;&#2352;&#2368;&#2325;&#2375; &#2360;&#2375; &#2360;&#2367;&#2327;&#2381;&#2344;&#2354; &#2357;&#2367;&#2352;&#2370;&#2346;&#2339; &#2361;&#2379;&#2340;&#2366; &#2361;&#2376;&#2404; &#2335;&#2381;&#2357;&#2367;&#2360;&#2381;&#2335;&#2375;&#2337; &#2346;&#2375;&#2351;&#2352; &#2342;&#2379; &#2346;&#2381;&#2352;&#2325;&#2366;&#2352; &#2325;&#2375; &#2361;&#2379;&#2340;&#2375; &#2361;&#2376;&#2306;</span><span style=\"font-family: Cambria Math;\">: </span><span style=\"font-family: Cambria Math;\">&#2358;&#2368;&#2354;&#2381;&#2337;&#2375;&#2337; &#2335;&#2381;&#2357;&#2367;&#2360;&#2381;&#2335;&#2375;&#2337; &#2346;&#2375;&#2351;&#2352; </span><span style=\"font-family: Cambria Math;\">(STP) </span><span style=\"font-family: Cambria Math;\">&#2324;&#2352; &#2309;&#2344;&#2358;&#2368;&#2361;&#2368;&#2354;&#2381;&#2337;&#2375;&#2337; &#2335;&#2381;&#2357;&#2367;&#2360;&#2381;&#2335;&#2375;&#2337; &#2346;&#2375;&#2351;&#2352; </span><span style=\"font-family: Cambria Math;\">(UTP)</span><span style=\"font-family: Cambria Math;\">&#2404; </span><strong><span style=\"font-family: Cambria Math;\">&#2321;&#2346;&#2381;&#2335;&#2367;&#2325;&#2354; &#2347;&#2366;&#2311;&#2348;&#2352; &#2325;&#2375;&#2348;&#2354;</span><span style=\"font-family: Cambria Math;\">(optical fibre cable</span><span style=\"font-family: Cambria Math;\">) </span></strong><span style=\"font-family: Cambria Math;\">&#2337;&#2375;&#2335;&#2366; &#2325;&#2379; &#2346;&#2381;&#2352;&#2325;&#2366;&#2358; &#2325;&#2375; &#2352;&#2370;&#2346; &#2350;&#2375;&#2306; &#2357;&#2361;&#2344; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2332;&#2379; &#2325;&#2366;&#2306;&#2330; &#2325;&#2375; &#2346;&#2340;&#2354;&#2375; &#2347;&#2366;&#2311;&#2348;&#2352; &#2325;&#2375; &#2309;&#2306;&#2342;&#2352; &#2351;&#2366;&#2340;&#2381;&#2352;&#2366; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376;&#2404; &#2311;&#2360;&#2325;&#2375; &#2346;&#2352;&#2367;&#2339;&#2366;&#2350;&#2360;&#2381;&#2357;&#2352;&#2370;&#2346; &#2348;&#2361;&#2369;&#2340; &#2346;&#2381;&#2352;&#2349;&#2366;&#2357;&#2368; &#2340;&#2352;&#2368;&#2325;&#2375; &#2360;&#2375; &#2360;&#2367;&#2327;&#2381;&#2344;&#2354; &#2357;&#2367;&#2352;&#2370;&#2346;&#2339; &#2361;&#2379;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\n",
                    correct: "a",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
                questions.push({
                    id: "13",
                    section: "31",
                    question_en: "<p>13.<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">Which of the following is not a type of broadband Internet connection?</span></p>\n",
                    question_hi: "<p>13.<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2344;&#2367;&#2350;&#2381;&#2344;&#2354;&#2367;&#2326;&#2367;&#2340; &#2350;&#2375;&#2306; &#2360;&#2375; &#2325;&#2380;&#2344; &#2360;&#2366; &#2348;&#2381;&#2352;&#2377;&#2337;&#2348;&#2376;&#2306;&#2337; &#2311;&#2306;&#2335;&#2352;&#2344;&#2375;&#2335; &#2325;&#2344;&#2375;&#2325;&#2381;&#2358;&#2344; &#2325;&#2366; &#2346;&#2381;&#2352;&#2325;&#2366;&#2352; &#2344;&#2361;&#2368;&#2306; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">?</span></p>\n",
                    options_en: ["<p>Dial-up</p>\n", "<p>Cable</p>\n", 
                                "<p>DSL</p>\n", "<p>BPL</p>\n"],
                    options_hi: ["<p><span style=\"font-weight: 400;\">&#2337;&#2366;&#2351;&#2354;-&#2309;&#2346;(Dial-up)</span></p>\n", "<p><span style=\"font-weight: 400;\">&#2325;&#2375;&#2348;&#2354;(cable)</span></p>\n",
                                "<p><span style=\"font-weight: 400;\">&#2337;&#2368;&#2319;&#2360;&#2319;&#2354;(DSL)</span></p>\n", "<p><span style=\"font-weight: 400;\">&#2348;&#2368;&#2346;&#2368;&#2319;&#2354;(BPL)</span></p>\n"],
                    solution_en: "<p>13.(a)<span style=\"font-family: Cambria Math;\"> </span><strong><span style=\"font-family: Cambria Math;\">Dial-up</span></strong><span style=\"font-family: Cambria Math;\"> is NOT a type of broadband Internet connection. The term broadband commonly refers to high-speed Internet access that is always on and faster than the traditional dial-up access.</span></p>\n",
                    solution_hi: "<p>13.(a)<span style=\"font-family: Cambria Math;\"> </span><strong><span style=\"font-family: Cambria Math;\">&#2337;&#2366;&#2351;&#2354;</span><span style=\"font-family: Cambria Math;\">-</span><span style=\"font-family: Cambria Math;\">&#2309;&#2346;</span><span style=\"font-family: Cambria Math;\">(Dial-up)</span></strong><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2319;&#2325; &#2346;&#2381;&#2352;&#2325;&#2366;&#2352; &#2325;&#2366; &#2348;&#2381;&#2352;&#2377;&#2337;&#2348;&#2376;&#2306;&#2337; &#2311;&#2306;&#2335;&#2352;&#2344;&#2375;&#2335; &#2325;&#2344;&#2375;&#2325;&#2381;&#2358;&#2344; &#2344;&#2361;&#2368;&#2306; &#2361;&#2376;&#2404; &#2348;&#2381;&#2352;&#2377;&#2337;&#2348;&#2376;&#2306;&#2337; &#2358;&#2348;&#2381;&#2342; &#2310;&#2350;&#2340;&#2380;&#2352; &#2346;&#2352; &#2361;&#2366;&#2312;</span><span style=\"font-family: Cambria Math;\">-</span><span style=\"font-family: Cambria Math;\">&#2360;&#2381;&#2346;&#2368;&#2337; &#2311;&#2306;&#2335;&#2352;&#2344;&#2375;&#2335; &#2319;&#2325;&#2381;&#2360;&#2375;&#2360; &#2325;&#2379; &#2360;&#2306;&#2342;&#2352;&#2381;&#2349;&#2367;&#2340; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376; &#2332;&#2379; &#2346;&#2366;&#2352;&#2306;&#2346;&#2352;&#2367;&#2325; &#2337;&#2366;&#2351;&#2354;</span><span style=\"font-family: Cambria Math;\">-</span><span style=\"font-family: Cambria Math;\">&#2309;&#2346; &#2319;&#2325;&#2381;&#2360;&#2375;&#2360; &#2325;&#2368; &#2340;&#2369;&#2354;&#2344;&#2366; &#2350;&#2375;&#2306; &#2361;&#2350;&#2375;&#2358;&#2366; &#2330;&#2366;&#2354;&#2370; &#2324;&#2352; &#2340;&#2375;&#2332;&#2364; &#2361;&#2379;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\n",
                    correct: "a",
                    pos_marks: 3.0,
                    neg_marks: 1.0

                questions.push({
                    id: "14",
                    section: "31",
                    question_en: "<p>14.<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">Which among the following is related to the internet and mail?</span></p>\n",
                    question_hi: "<p>14.<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2344;&#2367;&#2350;&#2381;&#2344;&#2354;&#2367;&#2326;&#2367;&#2340; &#2350;&#2375;&#2306; &#2360;&#2375; &#2325;&#2380;&#2344; &#2360;&#2366; &#2311;&#2306;&#2335;&#2352;&#2344;&#2375;&#2335; &#2324;&#2352; &#2350;&#2375;&#2354; &#2360;&#2375; &#2360;&#2306;&#2348;&#2306;&#2343;&#2367;&#2340; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">?</span></p>\n",
                    options_en: ["<p>Virus</p>\n", "<p>Boot-UP</p>\n", 
                                "<p>Magnetic Tapes</p>\n", "<p>Applications Software</p>\n"],
                    options_hi: ["<p><span style=\"font-family: Cambria Math;\">&#2357;&#2366;&#2351;&#2352;&#2360; </span><span style=\"font-family: Cambria Math;\">(Virus) </span></p>\n", "<p><span style=\"font-weight: 400;\">&#2348;&#2370;&#2335;-&#2309;&#2346; (Boot-UP)</span></p>\n",
                                "<p><span style=\"font-weight: 400;\">&#2330;&#2369;&#2306;&#2348;&#2325;&#2368;&#2351; &#2335;&#2375;&#2346; (Magnetic Tapes)</span></p>\n", "<p><span style=\"font-weight: 400;\">&#2319;&#2346;&#2381;&#2354;&#2368;&#2325;&#2375;&#2358;&#2344; &#2360;&#2377;&#2347;&#2381;&#2335;&#2357;&#2375;&#2351;&#2352; (Applications Software)</span></p>\n"],
                    solution_en: "<p>14.(a)<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">A computer <strong>virus</strong> is a malicious piece of computer code designed to spread from device to device. A subset of malware, these self-copying threats are usually designed to damage a device or steal data. This malicious code can be activated in numerous ways:<strong>&nbsp;</strong>when the email recipient clicks on an infected link within the message, opens an infected attachment or interacts with the message in some other way.</span></p>\n",
                    solution_hi: "<p>14.(a)<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; &#2357;&#2366;&#2351;&#2352;&#2360; &#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; &#2325;&#2379;&#2337; &#2325;&#2366; &#2319;&#2325; &#2342;&#2369;&#2352;&#2381;&#2349;&#2366;&#2357;&#2344;&#2366;&#2346;&#2370;&#2352;&#2381;&#2339; &#2335;&#2369;&#2325;&#2337;&#2364;&#2366;</span><span style=\"font-family: Cambria Math;\">(</span><span style=\"font-family: Cambria Math;\">malicious piece</span><span style=\"font-family: Cambria Math;\">) </span><span style=\"font-family: Cambria Math;\">&#2361;&#2376; &#2332;&#2367;&#2360;&#2375; &#2337;&#2367;&#2357;&#2366;&#2311;&#2360; &#2360;&#2375; &#2337;&#2367;&#2357;&#2366;&#2311;&#2360; &#2350;&#2375;&#2306; &#2347;&#2376;&#2354;&#2366;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2337;&#2367;&#2332;&#2364;&#2366;&#2311;&#2344; &#2325;&#2367;&#2351;&#2366; &#2327;&#2351;&#2366; &#2361;&#2376;&#2404; &#2350;&#2376;&#2354;&#2357;&#2375;&#2351;&#2352;</span><span style=\"font-family: Cambria Math;\">(malware) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2366; &#2319;&#2325; &#2360;&#2348;&#2360;&#2375;&#2335;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2351;&#2375; &#2360;&#2375;&#2354;&#2381;&#2347;</span><span style=\"font-family: Cambria Math;\">-</span><span style=\"font-family: Cambria Math;\">&#2325;&#2377;&#2346;&#2368; &#2325;&#2352;&#2344;&#2375; &#2357;&#2366;&#2354;&#2375; &#2326;&#2340;&#2352;&#2375; &#2310;&#2350;&#2340;&#2380;&#2352; &#2346;&#2352; &#2325;&#2367;&#2360;&#2368; &#2337;&#2367;&#2357;&#2366;&#2311;&#2360; &#2325;&#2379; &#2344;&#2369;&#2325;&#2360;&#2366;&#2344; &#2346;&#2361;&#2369;&#2306;&#2330;&#2366;&#2344;&#2375; &#2351;&#2366; &#2337;&#2375;&#2335;&#2366; &#2330;&#2379;&#2352;&#2368; &#2325;&#2352;&#2344;&#2375; #2349;&#2367;&#2344;&#2381;&#2344; &#2330;&#2368;&#2332;&#2375;&#2306; &#2342;&#2367;&#2326;&#2366;&#2340;&#2368; &#2361;&#2376; &#2332;&#2379; &#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; &#2325;&#2352; &#2360;&#2325;&#2340;&#2366; &#2361;&#2376;&#2404; </span><strong><span style=\"font-family: Cambria Math;\">&#2335;&#2366;&#2360;&#2381;&#2325;&#2348;&#2366;&#2352;</span><span style=\"font-family: Cambria Math;\">(taskbar)</span></strong><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2337;&#2375;&#2360;&#2381;&#2325;&#2335;&#2377;&#2346; &#2346;&#2352; &#2346;&#2381;&#2352;&#2342;&#2352;&#2381;&#2358;&#2367;&#2340; &#2346;&#2381;&#2352;&#2379;&#2327;&#2381;&#2352;&#2366;&#2350;&#2379;&#2306; &#2325;&#2375; &#2354;&#2367;&#2319; &#2319;&#2325;&#2381;&#2360;&#2375;&#2360; &#2346;&#2381;&#2357;&#2366;&#2311;&#2306;&#2335; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2349;&#2354;&#2375; &#2361;&#2368; &#2346;&#2381;&#2352;&#2379;&#2327;&#2381;&#2352;&#2366;&#2350; &#2331;&#2379;&#2335;&#2366; &#2361;&#2379;&#2404;</span></p>\n",

                                "<p><span style=\"font-family: Cambria Math;\">&#2311;&#2360;&#2325;&#2366; &#2346;&#2381;&#2352;&#2351;&#2379;&#2327; &#2348;&#2366;&#2312;&#2306; &#2323;&#2352; &#2325;&#2375; &#2358;&#2348;&#2381;&#2342; &#2325;&#2379; &#2330;&#2369;&#2344;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\n", "<p><span style=\"font-family: Cambria Math;\">&#2311;&#2360;&#2325;&#2366; &#2346;&#2381;&#2352;&#2351;&#2379;&#2327; &#2342;&#2366;&#2351;&#2368;&#2306; &#2323;&#2352; &#2325;&#2375; &#2358;&#2348;&#2381;&#2342; &#2325;&#2379; &#2330;&#2369;&#2344;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\n"],
                    solution_en: "<p>19.(b)<span style=\"font-family: Cambria Math;\"> <strong>Shift+Page up</strong> key is used to select from the current position to the top of the screen.</span></p>\n",
                    solution_hi: "<p>19.(b)<span style=\"font-family: Cambria Math;\"> <strong>Shift+Page up key</strong> </span><span style=\"font-family: Cambria Math;\">&#2325;&#2366; &#2313;&#2346;&#2351;&#2379;&#2327; &#2357;&#2352;&#2381;&#2340;&#2350;&#2366;&#2344; &#2360;&#2381;&#2341;&#2367;&#2340;&#2367; &#2360;&#2375; &#2360;&#2381;&#2325;&#2381;&#2352;&#2368;&#2344; &#2325;&#2375; &#2358;&#2368;&#2352;&#2381;&#2359; &#2340;&#2325; &#2330;&#2351;&#2344; &#2325;&#2352;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\n",
                    correct: "b",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
                questions.push({
                    id: "20",
                    section: "misc",
                    question_en: "<p>20.<span style=\"font-family: Cambria Math;\"> Microsoft Office was developed by _________in ________ .</span></p>\n",
                    question_hi: "<p>20.<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2350;&#2366;&#2311;&#2325;&#2381;&#2352;&#2379;&#2360;&#2377;&#2347;&#2381;&#2335; &#2321;&#2347;&#2367;&#2360; </span><span style=\"font-family: Cambria Math;\">(Microsoft Office) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2379; </span><span style=\"font-family: Cambria Math;\">_____ </span><span style=\"font-family: Cambria Math;\">&#2342;&#2381;&#2357;&#2366;&#2352;&#2366; </span><span style=\"font-family: Cambria Math;\">_____ </span><span style=\"font-family: Cambria Math;\">&#2350;&#2375;&#2306; &#2357;&#2367;&#2325;&#2360;&#2367;&#2340; &#2325;&#2367;&#2351;&#2366; &#2327;&#2351;&#2366; &#2341;&#2366;&#2404;</span></p>\n",
                    options_en: ["<p>Microsoft Inc, 1970s</p>\n", "<p>Sun Microsoft Inc, 1970s</p>\n", 
                                "<p>Sun Microsoft, 1980s</p>\n", "<p>Microsoft Inc, 1980s</p>\n"],
                    options_hi: ["<p><span style=\"font-family: Cambria Math;\">&#2350;&#2366;&#2311;&#2325;&#2381;&#2352;&#2379;&#2360;&#2377;&#2347;&#2381;&#2335; &#2311;&#2306;&#2325;</span><span style=\"font-family: Cambria Math;\">, 1970 </span></p>\n", "<p><span style=\"font-family: Cambria Math;\">&#2360;&#2344; &#2350;&#2366;&#2311;&#2325;&#2381;&#2352;&#2379;&#2360;&#2377;&#2347;&#2381;&#2335; &#2311;&#2306;&#2325;</span><span style=\"font-family: Cambria Math;\">, 1970</span></p>\n",
                                "<p><span style=\"font-family: Cambria Math;\">&#2360;&#2344; &#2350;&#2366;&#2311;&#2325;&#2381;&#2352;&#2379;&#2360;&#2377;&#2347;&#2381;&#2335;</span><span style=\"font-family: Cambria Math;\">, 1980</span></p>\n", "<p><span style=\"font-family: Cambria Math;\">&#2350;&#2366;&#2311;&#2325;&#2381;&#2352;&#2379;&#2360;&#2377;&#2347;&#2381;&#2335; &#2311;&#2306;&#2325;</span><span style=\"font-family: Cambria Math;\">, 1980</span></p>\n"],
                    solution_en: "<p>20.(d)<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">Microsoft Office is a software which was developed by </span><strong><span style=\"font-family: Cambria Math;\">Microsoft in 1988</span></strong><span style=\"font-family: Cambria Math;\">.</span></p>\n",
                    solution_hi: "<p>20.(d)<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2350;&#2366;&#2311;&#2325;&#2381;&#2352;&#2379;&#2360;&#2377;&#2347;&#2381;&#2335; &#2321;&#2347;&#2367;&#2360; &#2319;&#2325; &#2360;&#2377;&#2347;&#2381;&#2335;&#2357;&#2375;&#2351;&#2352; &#2361;&#2376; &#2332;&#2367;&#2360;&#2375; </span><strong><span style=\"font-family: Cambria Math;\">1988 </span><span style=\"font-family: Cambria Math;\">&#2350;&#2375;&#2306; &#2350;&#2366;&#2311;&#2325;&#2381;&#2352;&#2379;&#2360;&#2377;&#2347;&#2381;&#2335;</span></strong><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2342;&#2381;&#2357;&#2366;&#2352;&#2366; &#2357;&#2367;&#2325;&#2360;&#2367;&#2340; &#2325;&#2367;&#2351;&#2366; &#2327;&#2351;&#2366; &#2341;&#2366;&#2404;</span></p>\n",
                    correct: "d",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
            
            // Generate question boxes
            const boxesContainer = document.getElementById('question-boxes');
            questions.forEach((q, index) => {
                const box = document.createElement('div');
                box.className = 'q-box';
                box.textContent = index + 1;
                box.onclick = () => showQuestion(index);
                box.id = `box-${index}`;
                boxesContainer.appendChild(box);
            });
            
            // Show first question
            showQuestion(0);
            updateProgress();
        }
        
        // Show a specific question
        
        function formatContent(text) {
            if (!text) return '';
            return text.replace(/<img/g, '<img style="max-width:100%;height:auto;"');
        }
        
        function showQuestion(index) {
            if (index < 0 || index >= questions.length) return;
            
            currentQuestion = index;
            const question = questions[index];
            
            // Update question counter
            document.getElementById('question-counter').textContent = `Question ${index + 1} of ${questions.length}`;
            
            // Update question boxes
            document.querySelectorAll('.q-box').forEach(box => box.classList.remove('current'));
            document.getElementById(`box-${index}`).classList.add('current');
            
            // Generate question HTML
            let html = `
                <div class="question-card">
                    <div class="question-text">
                        <div class="en">${formatContent(question.question_en)}</div>
                        <div class="hi" style="display:none">${formatContent(question.question_hi)} </div>
                    </div>
                    <div class="options" id="options-container">`;
            
            // Add options
            ['a', 'b', 'c', 'd'].forEach((opt, i) => {
                let optionClass = '';
                let isCorrectAnswer = opt === question.correct;
                let isUserAnswer = answers[question.id] === opt;
                
                // When reviewing, add appropriate classes
                if (submitted) {
                    if (isCorrectAnswer) {
                        optionClass += ' correct-answer';
                    } else if (isUserAnswer && !isCorrectAnswer) {
                        optionClass += ' incorrect';
                    }
                }
                
                html += `
                    <div class="option-item">
                        <input class="option-input" type="radio" name="q${index}" 
                            id="opt-${index}-${opt}" value="${opt}" 
                            ${isUserAnswer ? 'checked' : ''}
                            onclick="selectAnswer('${question.id}', '${opt}')">
                       <label class="option-label${optionClass}" for="opt-${index}-${opt}">
                            <div class="en">${question.options_en[i]}</div>
                            <div class="hi" style="display:none">${question.options_hi[i]}</div>
                        </label>
                    </div>`;
            });
            
            // Add solution if submitted
            if (submitted) {
                const isCorrect = answers[question.id] === question.correct;
                const resultText = answers[question.id] ? (isCorrect ? 'Correct!' : 'Incorrect!') : 'Not attempted';
                
                html += `
                    <div class="solution-container">
                        <div class="solution-title">${resultText}</div>
                        <div class="solution-text">
                            <div class="en">${question.solution_en}</div>
                            <div class="hi" style="display:none">${question.solution_hi}</div>
                        </div>
                    </div>`;
            }
            
            html += `</div></div>`;
            
            document.getElementById('questions-container').innerHTML = html;
            
            // Apply language settings
            applyLanguage();
            
            // If in mobile view, close the menu
            if (window.innerWidth < 992) {
                toggleNav(false);
            }
            
            // Add review mode class if submitted
            if (submitted) {
                document.getElementById('options-container').classList.add('review-mode');
            }
        }
        
        // Apply current language
        function applyLanguage() {
            document.querySelectorAll(`.${currentLang}`).forEach(el => el.style.display = 'block');
            document.querySelectorAll(`.${currentLang === 'en' ? 'hi' : 'en'}`).forEach(el => el.style.display = 'none');
            
            // Update language button text
            document.getElementById('lang-text').textContent = currentLang === 'en' ? 'Hi' : 'En';
        }
        
        // Select an answer
        function selectAnswer(qId, option) {
            if (submitted) return;
            
            answers[qId] = option;
            updateProgress();
            
            // Mark question as attempted in the navigation
            const index = questions.findIndex(q => q.id === qId);
            if (index >= 0) {
                const box = document.getElementById(`box-${index}`);
                box.classList.add('attempted');
                box.classList.remove('unattempted');
            }
        }
        
        // Navigate to previous/next question
        function prevQuestion() { 
            if (currentQuestion > 0) showQuestion(currentQuestion - 1); 
        }
        
        function nextQuestion() { 
            if (currentQuestion < questions.length - 1) showQuestion(currentQuestion + 1); 
        }
        
        // Switch section
        function switchSection(sectionId) {
            if (sectionId === 'all') {
                showQuestion(0);
                return;
            }
            
            const section = sections[sectionId];
            if (section) showQuestion(section.start);
        }
        
        // Toggle language
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            applyLanguage();
        }
        
        // Toggle navigation sidebar
        function toggleNav(show) {
            const nav = document.getElementById('question-nav');
            const overlay = document.getElementById('nav-overlay');
            
            if (show === undefined) {
                show = !nav.classList.contains('show');
            }
            
            if (show) {
                nav.classList.add('show');
                overlay.classList.add('show');
                document.body.style.overflow = 'hidden';
            } else {
                nav.classList.remove('show');
                overlay.classList.remove('show');
                document.body.style.overflow = '';
            }
        }
        
        // Update progress
        function updateProgress() {
            const attempted = Object.keys(answers).length;
            document.getElementById('attempted-count').textContent = attempted;
        }
        
        // Start timer
        function startTimer() {
            const timerDisplay = document.getElementById('timer-display');
            let timeLeft = totalTime;
            
            const timerInterval = setInterval(() => {
                if (timeLeft <= 0 || submitted) {
                    clearInterval(timerInterval);
                    if (!submitted) submitTest();
                    return;
                }
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                timeLeft--;
            }, 1000);
        }
        
        // Confirm before submitting
        function confirmSubmit() {
            if (submitted) return;
            
            const attempted = Object.keys(answers).length;
            const remaining = questions.length - attempted;
            
            // Create a more modern confirmation dialog
            const confirmHtml = `
                <div style="text-align: center; padding: 20px;">
                    <h4 style="margin-bottom: 16px; color: var(--dark);">Confirm Submission</h4>
                    <p style="margin-bottom: 24px; color: var(--gray);">
                        You have attempted ${attempted} of ${questions.length} questions.<br>
                        ${remaining} questions are unattempted.
                    </p>
                    <div style="display: flex; justify-content: center; gap: 12px;">
                        <button onclick="this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; border: 1px solid var(--light-gray); background: white; border-radius: 8px; cursor: pointer;">
                            Cancel
                        </button>
                        <button onclick="submitTest(); this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer;">
                            Submit Test
                        </button>
                    </div>
                </div>`;
            
            // Create modal element
            const modal = document.createElement('div');
            modal.className = 'results-modal show';
            modal.innerHTML = `
                <div class="results-card" style="max-width: 400px;">
                    <button class="cancel-btn" style="position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--gray);" onclick="this.closest('.results-modal').remove()">
                        ×
                    </button>
                    ${confirmHtml}
                </div>`;
            
            document.body.appendChild(modal);
        }
        
        // Submit test
        function submitTest() {
            if (submitted) return;
            
            submitted = true;
            
            let score = 0;
            let correctCount = 0;
            let incorrectCount = 0;
            let unattemptedCount = 0;
            
            questions.forEach((q, index) => {
                const userAns = answers[q.id];
                const box = document.getElementById(`box-${index}`);
                
                box.classList.remove('attempted');
                
                if (!userAns) {
                    unattemptedCount++;
                    box.classList.add('unattempted');
                } else if (userAns === q.correct) {
                    correctCount++;
                    score += q.pos_marks;
                    box.classList.add('correct');
                } else {
                    incorrectCount++;
                    score -= q.neg_marks;
                    box.classList.add('incorrect');
                }
            });
            
            // Update result values
            document.getElementById('score-value').textContent = score.toFixed(2);
            document.getElementById('correct-value').textContent = correctCount;
            document.getElementById('incorrect-value').textContent = incorrectCount;
            document.getElementById('unattempted-value').textContent = unattemptedCount;
            
            // Show the results modal
            document.getElementById('results-modal').classList.add('show');
            
            // Disable submit button
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-check"></i>';
            submitBtn.style.backgroundColor = 'var(--success)';
            
            // Refresh current question view to show solution
            showQuestion(currentQuestion);
        }
        
        // Review test
        function reviewTest() {
            document.getElementById('results-modal').classList.remove('show');
            showQuestion(0);
        }
        
        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('results-modal')) {
                document.getElementById('results-modal').classList.remove('show');
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === 'ArrowRight') nextQuestion();
        });
    </script>
</body>
</html>
