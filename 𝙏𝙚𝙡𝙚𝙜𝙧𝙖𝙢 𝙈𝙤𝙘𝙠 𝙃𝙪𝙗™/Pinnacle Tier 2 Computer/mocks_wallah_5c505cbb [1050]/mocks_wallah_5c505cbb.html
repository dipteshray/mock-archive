                    question_hi: "<p>10. <span style=\"font-family: Cambria Math;\">&#2310;&#2346; &#2337;&#2375;&#2335;&#2366; &#2325;&#2379; &#2325;&#2361;&#2366;&#2305; &#2360;&#2375;&#2357; &#2325;&#2352;&#2340;&#2375; &#2361;&#2376;&#2306; &#2325;&#2367; &#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; &#2348;&#2306;&#2342; &#2361;&#2379;&#2344;&#2375; &#2346;&#2352; &#2349;&#2368; &#2310;&#2346;&#2325;&#2366; &#2337;&#2375;&#2335;&#2366; &#2360;&#2375;&#2357; &#2352;&#2361;&#2375;</span><span style=\"font-family: Cambria Math;\">?</span></p>\n",
                    options_en: ["<p>Secondary storage device</p>\n", "<p>RAM</p>\n", 
                                "<p>Motherboard</p>\n", "<p>Primary storage device</p>\n"],
                    options_hi: ["<p><span style=\"font-weight: 400;\">&#2360;&#2375;&#2325;&#2375;&#2306;&#2337;&#2352;&#2368; &#2360;&#2381;&#2335;&#2379;&#2352;&#2375;&#2332; &#2337;&#2367;&#2357;&#2366;&#2311;&#2360; (Secondary storage device)</span></p>\n", "<p>RAM</p>\n",
                                "<p><span style=\"font-weight: 400;\">&#2350;&#2342;&#2352;&#2348;&#2379;&#2352;&#2381;&#2337; (Motherboard)</span></p>\n", "<p><span style=\"font-weight: 400;\">&#2346;&#2381;&#2352;&#2366;&#2311;&#2350;&#2352;&#2368; &#2360;&#2381;&#2335;&#2379;&#2352;&#2375;&#2332; &#2337;&#2367;&#2357;&#2366;&#2311;&#2360; (Primary storage device)</span></p>\n"],
                    solution_en: "<p>10.(a) <span style=\"font-family: Cambria Math;\">Secondary storage is used to<strong> store data and programs when they are not being processed</strong>. It is also non-volatile in nature. Due to this, the data remains in the secondary storage even after power is OFF. It is a <strong>permanent storage.</strong></span></p>\n",
                    solution_hi: "<p>10.(a) <span style=\"font-family: Cambria Math;\">&#2360;&#2375;&#2325;&#2375;&#2306;&#2337;&#2352;&#2368; &#2360;&#2381;&#2335;&#2379;&#2352;&#2375;&#2332; &#2325;&#2366; &#2313;&#2346;&#2351;&#2379;&#2327; &#2337;&#2375;&#2335;&#2366; &#2324;&#2352; <strong>&#2346;&#2381;&#2352;&#2379;&#2327;&#2381;&#2352;&#2366;&#2350; &#2325;&#2379; &#2360;&#2381;&#2335;&#2379;&#2352; &#2325;&#2352;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376; &#2332;&#2348; &#2313;&#2344;&#2381;&#2361;&#2375;&#2306; &#2346;&#2381;&#2352;&#2379;&#2360;&#2375;&#2360; &#2344;&#2361;&#2368;&#2306; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366; &#2352;&#2361;&#2366; &#2361;&#2379;&#2340;&#2366; &#2361;&#2376;</strong>&#2404; &#2351;&#2361; &#2344;&#2375;&#2330;&#2352; &#2350;&#2375;&#2306; &#2344;&#2377;&#2344;</span><span style=\"font-family: Cambria Math;\">-</span><span style=\"font-family: Cambria Math;\">&#2357;&#2379;&#2354;&#2375;&#2335;&#2366;&#2311;&#2354; &#2349;&#2368; &#2361;&#2376;&#2404; &#2311;&#2360;&#2325;&#2375; &#2325;&#2366;&#2352;&#2339;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2348;&#2367;&#2332;&#2354;&#2368; &#2348;&#2306;&#2342; &#2361;&#2379;&#2344;&#2375; &#2325;&#2375; &#2348;&#2366;&#2342; &#2349;&#2368; &#2337;&#2375;&#2335;&#2366; &#2360;&#2375;&#2325;&#2375;&#2306;&#2337;&#2352;&#2368; &#2360;&#2381;&#2335;&#2379;&#2352;&#2375;&#2332; &#2350;&#2375;&#2306; &#2352;&#2361;&#2340;&#2366; &#2361;&#2376;&#2404; &#2351;&#2361; <strong>&#2319;&#2325; &#2360;&#2381;&#2341;&#2366;&#2351;&#2368; &#2360;&#2381;&#2335;&#2379;&#2352;&#2375;&#2332; &#2361;&#2376;</strong>&#2404;</span></p>\n",
                    correct: "a",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
                questions.push({
                    id: "11",
                    section: "31",
                    question_en: "<p>11. <span style=\"font-family: Cambria Math;\">Which among the following is the smallest unit in an image on a computer screen?</span></p>\n",
                    question_hi: "<p>11.<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2344;&#2367;&#2350;&#2381;&#2344; &#2350;&#2375;&#2306; &#2360;&#2375; &#2325;&#2380;&#2344; &#2360;&#2368; &#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; &#2360;&#2381;&#2325;&#2381;&#2352;&#2368;&#2344; &#2346;&#2352; &#2311;&#2350;&#2375;&#2332; &#2325;&#2368; &#2360;&#2348;&#2360;&#2375; &#2331;&#2379;&#2335;&#2368; &#2351;&#2370;&#2344;&#2367;&#2335; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">?</span></p>\n",
                    options_en: ["<p>Unit</p>\n", "<p>Pixel</p>\n", 
                                "<p>Array</p>\n", "<p>Resolution</p>\n"],
                    options_hi: ["<p><span style=\"font-weight: 400;\">&#2351;&#2370;&#2344;&#2367;&#2335; (Unit)</span></p>\n", "<p><span style=\"font-weight: 400;\">&#2346;&#2367;&#2325;&#2381;&#2360;&#2354; (Pixel)</span></p>\n",
                                "<p><span style=\"font-weight: 400;\">&#2320;&#2352;&#2375; (Array)</span></p>\n", "<p><span style=\"font-family: Cambria Math;\">&#2352;&#2375;&#2332;&#2379;&#2354;&#2369;&#2358;&#2344; </span><span style=\"font-family: Cambria Math;\">(Resolution) </span></p>\n"],
                    solution_en: "<p>11.(b) <span style=\"font-family: Cambria Math;\">Pixels</span><span style=\"font-family: Cambria Math;\"> are the<strong> smallest unit in a digital display</strong>. Up to millions of pixels make up an image or video on a device\'s screen.</span></p>\r\n<p><span style=\"font-family: Cambria Math;\"><strong>Unit</strong> &rarr; </span><span style=\"font-family: Cambria Math;\">A system unit is the part of a computer that houses the primary devices that perform operations and produce results for complex calculations.</span></p>\r\n<p><span style=\"font-family: Cambria Math;\"><strong>Array</strong> &rarr; </span><span style=\"font-family: Cambria Math;\">An array is a collection of similar types of data.</span></p>\r\n<p><span style=\"font-family: Cambria Math;\"><strong>Resolution</strong> &rarr; </span><span style=\"font-family: Cambria Math;\">In general, screen resolution is the number of pixels a screen can show horizontally and vertically.</span></p>\n",
                    solution_hi: "<p>11.(b) <span style=\"font-family: Cambria Math;\">&#2337;&#2367;&#2332;&#2367;&#2335;&#2354; &#2337;&#2367;&#2360;&#2381;&#2346;&#2381;&#2354;&#2375; &#2350;&#2375;&#2306; </span><strong><span style=\"font-family: Cambria Math;\">&#2346;&#2367;&#2325;&#2381;&#2360;&#2354; </span></strong><span style=\"font-family: Cambria Math;\"><strong>&#2360;&#2348;&#2360;&#2375; &#2331;&#2379;&#2335;&#2368; &#2351;&#2370;&#2344;&#2367;&#2335;</strong> &#2361;&#2379;&#2340;&#2368; &#2361;&#2376;&#2404; &#2337;&#2367;&#2357;&#2366;&#2311;&#2360; &#2325;&#2368; &#2360;&#2381;&#2325;&#2381;&#2352;&#2368;&#2344; &#2346;&#2352; &#2354;&#2366;&#2326;&#2379;&#2306; &#2346;&#2367;&#2325;&#2381;&#2360;&#2354; &#2319;&#2325; &#2311;&#2350;&#2375;&#2332; &#2351;&#2366; &#2357;&#2368;&#2337;&#2367;&#2351;&#2379; &#2348;&#2344;&#2366;&#2340;&#2375; &#2361;&#2376;&#2306;&#2404;</span></p>\r\n<p><strong><span style=\"font-family: Cambria Math;\">&#2351;&#2370;&#2344;&#2367;&#2335;</span></strong><span style=\"font-family: Cambria Math;\"> &rarr; </span><span style=\"font-family: Cambria Math;\">&#2319;&#2325; &#2360;&#2367;&#2360;&#2381;&#2335;&#2350; &#2351;&#2370;&#2344;&#2367;&#2335; &#2319;&#2325; &#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; &#2325;&#2366; &#2357;&#2361; &#2361;&#2367;&#2360;&#2381;&#2360;&#2366; &#2361;&#2376; &#2332;&#2367;&#2360;&#2350;&#2375;&#2306; &#2346;&#2381;&#2352;&#2366;&#2311;&#2350;&#2352;&#2368; &#2337;&#2367;&#2357;&#2366;&#2311;&#2360; &#2361;&#2379;&#2340;&#2375; &#2361;&#2376;&#2306; &#2332;&#2379; &#2360;&#2306;&#2330;&#2366;&#2354;&#2344; </span><span style=\"font-family: Cambria Math;\">(operation) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2352;&#2340;&#2375; &#2361;&#2376;&#2306; &#2324;&#2352; &#2325;&#2366;&#2350;&#2381;&#2346;&#2381;&#2354;&#2375;&#2325;&#2381;&#2360; &#2325;&#2376;&#2354;&#2325;&#2369;&#2354;&#2375;&#2358;&#2344; </span><span style=\"font-family: Cambria Math;\">(complex calculation) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2375; &#2354;&#2367;&#2319; &#2352;&#2367;&#2332;&#2354;&#2381;&#2335; &#2342;&#2375;&#2340;&#2375; &#2361;&#2376;&#2306;&#2404;</span></p>\r\n<p><strong><span style=\"font-family: Cambria Math;\">&#2320;&#2352;&#2375;</span></strong><span style=\"font-family: Cambria Math;\"> &rarr; </span><span style=\"font-family: Cambria Math;\">&#2320;&#2352;&#2375; &#2360;&#2350;&#2366;&#2344; &#2346;&#2381;&#2352;&#2325;&#2366;&#2352; &#2325;&#2375; &#2337;&#2375;&#2335;&#2366; &#2325;&#2366; &#2325;&#2354;&#2375;&#2325;&#2381;&#2358;&#2344; </span><span style=\"font-family: Cambria Math;\">(collection) </span><span style=\"font-family: Cambria Math;\">&#2361;&#2376;&#2404;</span></p>\r\n<p><span style=\"font-family: Cambria Math;\"><strong>&#2352;&#2367;&#2332;&#2364;&#2377;&#2354;&#2381;&#2351;&#2370;&#2358;&#2344;</strong> </span><span style=\"font-family: Cambria Math;\">&rarr; </span><span style=\"font-family: Cambria Math;\">&#2360;&#2366;&#2350;&#2366;&#2344;&#2381;&#2351; &#2340;&#2380;&#2352; &#2346;&#2352;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2360;&#2381;&#2325;&#2381;&#2352;&#2368;&#2344; &#2352;&#2367;&#2332;&#2364;&#2377;&#2354;&#2381;&#2351;&#2370;&#2358;&#2344; &#2346;&#2367;&#2325;&#2381;&#2360;&#2354; &#2325;&#2368; &#2360;&#2306;&#2326;&#2381;&#2351;&#2366; &#2361;&#2376; &#2332;&#2379; &#2319;&#2325; &#2360;&#2381;&#2325;&#2381;&#2352;&#2368;&#2344; &#2325;&#2381;&#2359;&#2376;&#2340;&#2367;&#2332; &#2324;&#2352; &#2354;&#2306;&#2348;&#2357;&#2340; </span><span style=\"font-family: Cambria Math;\">(horizontally and vertically) </span><span style=\"font-family: Cambria Math;\">&#2352;&#2370;&#2346; &#2360;&#2375; &#2342;&#2367;&#2326;&#2366; &#2360;&#2325;&#2340;&#2368; &#2361;&#2376;&#2404;</span></p>\n",
                    correct: "b",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
                questions.push({
                    id: "12",
                    section: "31",
                    question_en: "<p>12.<span style=\"font-family: Cambria Math;\"> Which among the following is an important circuitry in a computer system that directs the operation of the processor?</span></p>\n",
                    question_hi: "<p>12.<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2344;&#2367;&#2350;&#2381;&#2344;&#2354;&#2367;&#2326;&#2367;&#2340; &#2350;&#2375;&#2306; &#2360;&#2375; &#2325;&#2380;&#2344; &#2360;&#2366; &#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; &#2360;&#2367;&#2360;&#2381;&#2335;&#2350; &#2350;&#2375;&#2306; &#2319;&#2325; &#2350;&#2361;&#2340;&#2381;&#2357;&#2346;&#2370;&#2352;&#2381;&#2339; &#2360;&#2352;&#2381;&#2325;&#2367;&#2335;&#2381;&#2352;&#2368; </span><span style=\"font-family: Cambria Math;\">(circuitry) </span><span style=\"font-family: Cambria Math;\">&#2361;&#2376; &#2332;&#2379; &#2346;&#2381;&#2352;&#2379;&#2360;&#2375;&#2360;&#2352; &#2325;&#2375; &#2360;&#2306;&#2330;&#2366;&#2354;&#2344; </span><span style=\"font-family: Cambria Math;\">(operations) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2379; &#2344;&#2367;&#2352;&#2381;&#2342;&#2375;&#2358;&#2367;&#2340; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">? </span></p>\n",
                    options_en: ["<p>Control unit</p>\n", "<p>Memory</p>\n", 
                                "<p>Address Bus</p>\n", "<p>Accumulator</p>\n"],
                    options_hi: ["<p><span style=\"font-weight: 400;\">&#2325;&#2306;&#2335;&#2381;&#2352;&#2379;&#2354; &#2351;&#2370;&#2344;&#2367;&#2335; (control unit)</span></p>\n", "<p><span style=\"font-weight: 400;\">&#2350;&#2375;&#2350;&#2379;&#2352;&#2368; (memory)</span></p>\n",
                                "<p><span style=\"font-weight: 400;\">&#2319;&#2337;&#2381;&#2352;&#2375;&#2360; &#2348;&#2360; (address bus)</span></p>\n", "<p><span style=\"font-weight: 400;\">&#2319;&#2325;&#2381;&#2351;&#2369;&#2350;&#2369;&#2354;&#2375;&#2335;&#2352; (accumulator)</span></p>\n"],
                    solution_en: "<p>12.(a)<span style=\"font-family: Cambria Math;\"> </span><strong><span style=\"font-family: Cambria Math;\">CU(Control Unit)</span></strong><span style=\"font-family: Cambria Math;\"> coordinates with the input and output devices of a computer. It directs the computer to carry out stored program instructions by communicating with the ALU and the registers. It organizes the processing of data and instructions.</span></p>\r\n<p><span style=\"font-family: Cambria Math;\">The</span><span style=\"font-family: Cambria Math;\"> <strong>address bus</strong></span><span style=\"font-family: Cambria Math;\"> is used by the CPU or a direct memory access (DMA) enabled device to locate the physical address to communicate read/write commands.</span></p>\r\n<p><span style=\"font-family: Cambria Math;\">An <strong>accumulator</strong></span><span style=\"font-family: Cambria Math;\"><strong> is a type of register</strong> for short-term, intermediate storage of arithmetic and logic data in a computer\'s central processing unit (CPU).</span></p>\n",
                    solution_hi: "<p>12.(a)<span style=\"font-family: Cambria Math;\"> </span><strong><span style=\"font-family: Cambria Math;\">CU (</span><span style=\"font-family: Cambria Math;\">&#2325;&#2306;&#2335;&#2381;&#2352;&#2379;&#2354; &#2351;&#2370;&#2344;&#2367;&#2335;</span></strong><span style=\"font-family: Cambria Math;\"><strong>)</strong> </span><span style=\"font-family: Cambria Math;\">&#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; &#2325;&#2375; &#2311;&#2344;&#2346;&#2369;&#2335; &#2324;&#2352; &#2310;&#2313;&#2335;&#2346;&#2369;&#2335; &#2337;&#2367;&#2357;&#2366;&#2311;&#2360; &#2325;&#2375; &#2360;&#2366;&#2341; &#2360;&#2350;&#2344;&#2381;&#2357;&#2351; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376;&#2404; &#2351;&#2361; </span><span style=\"font-family: Cambria Math;\">ALU </span><span style=\"font-family: Cambria Math;\">&#2324;&#2352; &#2352;&#2332;&#2367;&#2360;&#2381;&#2335;&#2352; &#2325;&#2375; &#2360;&#2366;&#2341; &#2360;&#2306;&#2330;&#2366;&#2352; &#2325;&#2352;&#2325;&#2375; &#2360;&#2381;&#2335;&#2379;&#2352;&#2381;&#2337; &#2346;&#2381;&#2352;&#2379;&#2327;&#2381;&#2352;&#2366;&#2350; &#2311;&#2306;&#2360;&#2381;&#2335;&#2381;&#2352;&#2325;&#2381;&#2358;&#2306;&#2360; &#2325;&#2379; &#2346;&#2370;&#2352;&#2366; &#2325;&#2352;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; &#2325;&#2379; &#2344;&#2367;&#2352;&#2381;&#2342;&#2375;&#2358;&#2367;&#2340; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376;&#2404; &#2351;&#2361; &#2337;&#2375;&#2335;&#2366; &#2324;&#2352; &#2344;&#2367;&#2352;&#2381;&#2342;&#2375;&#2358;&#2379;&#2306; &#2325;&#2375; &#2346;&#2381;&#2352;&#2360;&#2306;&#2360;&#2381;&#2325;&#2352;&#2339; &#2325;&#2379; &#2357;&#2381;&#2351;&#2357;&#2360;&#2381;&#2341;&#2367;&#2340; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\r\n<p><strong><span style=\"font-family: Cambria Math;\">&#2319;&#2337;&#2381;&#2352;&#2375;&#2360; &#2348;&#2360;(address bus)</span></strong><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2325;&#2366; &#2313;&#2346;&#2351;&#2379;&#2327; </span><span style=\"font-family: Cambria Math;\">CPU </span><span style=\"font-family: Cambria Math;\">&#2351;&#2366; &#2337;&#2366;&#2351;&#2352;&#2375;&#2325;&#2381;&#2335; &#2350;&#2375;&#2350;&#2379;&#2352;&#2368; &#2319;&#2325;&#2381;&#2360;&#2375;&#2360; </span><span style=\"font-family: Cambria Math;\">(DMA) </span><span style=\"font-family: Cambria Math;\">&#2311;&#2344;&#2375;&#2348;&#2354;&#2381;&#2337; &#2337;&#2367;&#2357;&#2366;&#2311;&#2360; &#2342;&#2381;&#2357;&#2366;&#2352;&#2366; &#2346;&#2338;&#2364;&#2344;&#2375;</span><span style=\"font-family: Cambria Math;\">/</span><span style=\"font-family: Cambria Math;\">&#2354;&#2367;&#2326;&#2344;&#2375; &#2325;&#2375; &#2325;&#2350;&#2366;&#2306;&#2337; </span><span style=\"font-family: Cambria Math;\">(command) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2379; &#2360;&#2306;&#2346;&#2381;&#2352;&#2375;&#2359;&#2367;&#2340; &#2325;&#2352;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2347;&#2367;&#2332;&#2367;&#2325;&#2354; &#2319;&#2337;&#2381;&#2352;&#2375;&#2360; &#2325;&#2366; &#2346;&#2340;&#2366; &#2354;&#2327;&#2366;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\r\n<p><span style=\"font-family: Cambria Math;\"><strong>&#2319;&#2325;&#2381;&#2351;&#2369;&#2350;&#2369;&#2354;&#2375;&#2335;&#2352;(accumulator)</strong> </span><span style=\"font-family: Cambria Math;\">&#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; &#2325;&#2368; &#2360;&#2375;&#2306;&#2335;&#2381;&#2352;&#2354; &#2346;&#2381;&#2352;&#2379;&#2360;&#2375;&#2360;&#2367;&#2306;&#2327; &#2351;&#2370;&#2344;&#2367;&#2335; </span><span style=\"font-family: Cambria Math;\">(CPU) </span><span style=\"font-family: Cambria Math;\">&#2350;&#2375;&#2306; &#2309;&#2352;&#2367;&#2341;&#2350;&#2375;&#2335;&#2367;&#2325; &#2324;&#2352; &#2354;&#2377;&#2332;&#2367;&#2325; &#2337;&#2375;&#2335;&#2366; &#2325;&#2375; &#2311;&#2306;&#2335;&#2352;&#2350;&#2368;&#2337;&#2367;&#2319;&#2335; </span><span style=\"font-family: Cambria Math;\">(intermediate), </span><span style=\"font-family: Cambria Math;\">&#2358;&#2377;&#2352;&#2381;&#2335;</span><span style=\"font-family: Cambria Math;\">-</span><span style=\"font-family: Cambria Math;\">&#2335;&#2352;&#2381;&#2350; &#2360;&#2381;&#2335;&#2379;&#2352;&#2375;&#2332; </span><span style=\"font-family: Cambria Math;\">(short term storage) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2375; &#2354;&#2367;&#2319; &#2319;&#2325; &#2346;&#2381;&#2352;&#2325;&#2366;&#2352; &#2325;&#2366; &#2352;&#2332;&#2367;&#2360;&#2381;&#2335;&#2352; </span><span style=\"font-family: Cambria Math;\">(register) </span><span style=\"font-family: Cambria Math;\">&#2361;&#2376;&#2404;</span></p>\n",
                    correct: "a",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
                questions.push({
                    id: "13",
                    section: "31",
                    question_en: "<p>13. <span style=\"font-family: Cambria Math;\">First computer developed in India is________ .</span></p>\n",
                    question_hi: "<p>13.<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2349;&#2366;&#2352;&#2340; &#2350;&#2375;&#2306; &#2357;&#2367;&#2325;&#2360;&#2367;&#2340; &#2346;&#2381;&#2352;&#2341;&#2350; &#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; </span><span style=\"font-family: Cambria Math;\">____ </span><span style=\"font-family: Cambria Math;\">&#2361;&#2376;&#2404; </span></p>\n",
                    options_en: ["<p>PARAM</p>\n", "<p>IBM-370</p>\n", 
                                "<p>CRAY-1</p>\n", "<p>Siddhartha</p>\n"],
                    options_hi: ["<p>PARAM</p>\n", "<p>IBM-370</p>\n",
                                "<p>CRAY-1</p>\n", "<p>Siddhartha</p>\n"],
                    solution_en: "<p>13.(d) <span style=\"font-family: Cambria Math;\"><strong>Siddhartha</strong> was the first computer developed in India.</span></p>\r\n<p><strong><span style=\"font-family: Cambria Math;\">Param</span></strong><span style=\"font-family: Cambria Math;\">&rarr; </span><span style=\"font-family: Cambria Math;\">PARAM</span><span style=\"font-family: Cambria Math;\"> is a series of </span><span style=\"font-family: Cambria Math;\">supercomputers</span><span style=\"font-family: Cambria Math;\"> designed and assembled by the </span><span style=\"font-family: Cambria Math;\">Centre for Development of Advanced Computing</span><span style=\"font-family: Cambria Math;\"> (C-DAC). Some of the PARAM supercomputers are PARAM 8000,PARAM 8600, PARAM 9000 PARAM 10000.</span></p>\r\n<p><span style=\"font-family: Cambria Math;\"><strong>IBM-370</strong> </span><span style=\"font-family: Cambria Math;\">&rarr; IBM-370 uses </span><span style=\"font-family: Cambria Math;\">highly reliable monolithic integrated circuits for arithmetic and logic functions.</span></p>\r\n<p><strong><span style=\"font-family: Cambria Math;\">CRAY-1</span></strong><span style=\"font-family: Cambria Math;\">&rarr;</span><span style=\"font-family: Cambria Math;\"> It was used for large-scale scientific applications, such as simulating complex physical phenomena</span></p>\n",
                    solution_hi: "<p>13.(d)<span style=\"font-family: Cambria Math;\"> </span><strong><span style=\"font-family: Cambria Math;\">&#2360;&#2367;&#2342;&#2381;&#2343;&#2366;&#2352;&#2381;&#2341; </span></strong><span style=\"font-family: Cambria Math;\"><strong>(Siddhartha)</strong> </span><span style=\"font-family: Cambria Math;\">&#2349;&#2366;&#2352;&#2340; &#2350;&#2375;&#2306; &#2357;&#2367;&#2325;&#2360;&#2367;&#2340; &#2346;&#2361;&#2354;&#2366; &#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; &#2341;&#2366;&#2404;</span></p>\r\n<p><strong><span style=\"font-family: Cambria Math;\">PARAM</span></strong><span style=\"font-family: Cambria Math;\"> &rarr; PARAM </span><span style=\"font-family: Cambria Math;\">&#2360;&#2375;&#2306;&#2335;&#2352; &#2347;&#2377;&#2352; &#2337;&#2375;&#2357;&#2354;&#2346;&#2350;&#2375;&#2306;&#2335; &#2321;&#2398; &#2319;&#2337;&#2357;&#2366;&#2306;&#2360;&#2381;&#2337; &#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2367;&#2306;&#2327; </span><span style=\"font-family: Cambria Math;\">(C-DAC) </span><span style=\"font-family: Cambria Math;\">&#2342;&#2381;&#2357;&#2366;&#2352;&#2366; &#2337;&#2367;&#2332;&#2366;&#2311;&#2344; &#2324;&#2352; &#2360;&#2306;&#2325;&#2354;&#2367;&#2340; &#2325;&#2367;&#2319; &#2327;&#2319; &#2360;&#2369;&#2346;&#2352; &#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352;&#2379;&#2306; &#2325;&#2368; &#2319;&#2325; &#2360;&#2368;&#2352;&#2368;&#2332; </span><span style=\"font-family: Cambria Math;\">(series) </span><span style=\"font-family: Cambria Math;\">&#2361;&#2376;&#2404; </span><span style=\"font-family: Cambria Math;\">PARAM </span><span style=\"font-family: Cambria Math;\">&#2360;&#2369;&#2346;&#2352; &#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352;&#2379;&#2306; &#2350;&#2375;&#2306; &#2360;&#2375; &#2325;&#2369;&#2331; </span><span style=\"font-family: Cambria Math;\">PARAM 8000, PARAM 8600, PARAM 9000 PARAM 10000 </span><span style=\"font-family: Cambria Math;\">&#2361;&#2376;&#2306;&#2404;</span></p>\r\n<p><strong><span style=\"font-family: Cambria Math;\">IBM-370</span></strong><span style=\"font-family: Cambria Math;\"> &rarr; IBM-370 </span><span style=\"font-family: Cambria Math;\">&#2309;&#2306;&#2325;&#2327;&#2339;&#2367;&#2340; &#2324;&#2352; &#2340;&#2352;&#2381;&#2325; &#2325;&#2366;&#2352;&#2381;&#2351;&#2379;&#2306; </span><span style=\"font-family: Cambria Math;\">(arithmetic and logic functions) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2375; &#2354;&#2367;&#2319; &#2309;&#2340;&#2381;&#2351;&#2343;&#2367;&#2325; &#2357;&#2367;&#2358;&#2381;&#2357;&#2360;&#2344;&#2368;&#2351; &#2350;&#2379;&#2344;&#2379;&#2354;&#2367;&#2341;&#2367;&#2325; &#2311;&#2306;&#2335;&#2368;&#2327;&#2381;&#2352;&#2375;&#2335;&#2375;&#2337; &#2360;&#2352;&#2381;&#2325;&#2367;&#2335; </span><span style=\"font-family: Cambria Math;\">(</span><span style=\"font-family: Cambria Math;\">monolithic integrated circuits) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2366; &#2313;&#2346;&#2351;&#2379;&#2327; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\r\n<p><span style=\"font-family: Cambria Math;\"><strong>CRAY-1</strong> </span><span style=\"font-family: Cambria Math;\">&rarr; </span><span style=\"font-family: Cambria Math;\">&#2311;&#2360;&#2325;&#2366; &#2313;&#2346;&#2351;&#2379;&#2327; &#2348;&#2337;&#2364;&#2375; &#2346;&#2376;&#2350;&#2366;&#2344;&#2375; &#2346;&#2352; &#2357;&#2376;&#2332;&#2381;&#2334;&#2366;&#2344;&#2367;&#2325; &#2317;&#2346;&#2381;&#2354;&#2367;&#2325;&#2375;&#2358;&#2344;&#2381;&#2360; </span><span style=\"font-family: Cambria Math;\">(application) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2375; &#2354;&#2367;&#2319; &#2325;&#2367;&#2351;&#2366; &#2327;&#2351;&#2366; &#2341;&#2366;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2332;&#2376;&#2360;&#2375; &#2325;&#2367; &#2325;&#2366;&#2350;&#2381;&#2346;&#2381;&#2354;&#2375;&#2325;&#2381;&#2360; &#2347;&#2367;&#2332;&#2367;&#2325;&#2354; &#2347;&#2375;&#2344;&#2379;&#2350;&#2375;&#2344;&#2366; </span><span style=\"font-family: Cambria Math;\">(complex physical phenomena) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2366; &#2309;&#2344;&#2369;&#2325;&#2352;&#2339;&#2404; </span></p>\n",
                    correct: "d",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
                questions.push({
                    id: "14",
                    section: "31",
                    question_en: "<p>14.<span style=\"font-family: Cambria Math;\"> Which of these is not a part of the UNIX operating system?</span></p>\n",
                    question_hi: "<p>14.<span style=\"font-family: Cambria Math;\">&#2311;&#2344;&#2350;&#2375;&#2306; &#2360;&#2375; &#2325;&#2380;&#2344; &#2360;&#2366; </span><span style=\"font-family: Cambria Math;\">UNIX </span><span style=\"font-family: Cambria Math;\">&#2321;&#2346;&#2352;&#2375;&#2335;&#2367;&#2306;&#2327; &#2360;&#2367;&#2360;&#2381;&#2335;&#2350; &#2325;&#2366; &#2361;&#2367;&#2360;&#2381;&#2360;&#2366; &#2344;&#2361;&#2368;&#2306; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">?</span></p>\n",
                    options_en: ["<p>Linux</p>\n", "<p>Kernel</p>\n", 
                                "<p>Shell</p>\n", "<p>Programs</p>\n"],
                    options_hi: ["<p><span style=\"font-weight: 400;\">&#2354;&#2367;&#2344;&#2325;&#2381;&#2360; (Linux)</span></p>\n", "<p><span style=\"font-weight: 400;\">&#2325;&#2352;&#2381;&#2344;&#2375;&#2354; (Kernel)</span></p>\n",
                                "<p><span style=\"font-weight: 400;\">&#2358;&#2375;&#2354;</span><span style=\"font-weight: 400;\"> (Shell)</span></p>\n", "<p><span style=\"font-weight: 400;\">&#2346;&#2381;&#2352;&#2379;&#2327;&#2381;&#2352;&#2366;&#2350;&#2381;&#2360; (Programs)</span></p>\n"],
                    solution_en: "<p>14.(a)<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">The</span><span style=\"font-family: Cambria Math;\"> <strong>UNIX operating system</strong></span><span style=\"font-family: Cambria Math;\"> is made up of three parts; the kernel, the shell and the programs.</span><strong><span style=\"font-family: Cambria Math;\">Kernel</span></strong><span style=\"font-family: Cambria Math;\"> is the core of the operating system that supports the process by providing a path to the peripheral devices. </span><span style=\"font-family: Cambria Math;\">Shell</span><span style=\"font-family: Cambria Math;\"> is the program which interprets commands given by the user.</span><span style=\"font-family: Cambria Math;\"><strong>Linux</strong> </span><span style=\"font-family: Cambria Math;\">is a Unix clone,behaves like Unix but doesn\'t contain its code. Unix contains a completely different coding . Linux is just the kernel. <strong>Unix </strong>is a complete package of Operating systems.</span></p>\n",
                    solution_hi: "<p><span style=\"font-family: Cambria Math;\">14.(a)</span><span style=\"font-family: Cambria Math;\"> <strong>UNIX </strong></span><strong><span style=\"font-family: Cambria Math;\">&#2321;&#2346;&#2352;&#2375;&#2335;&#2367;&#2306;&#2327; &#2360;&#2367;&#2360;&#2381;&#2335;&#2350;</span></strong><span style=\"font-family: Cambria Math;\"><strong>(operating system)</strong> </span><span style=\"font-family: Cambria Math;\">&#2340;&#2368;&#2344; &#2349;&#2366;&#2327;&#2379;&#2306; &#2360;&#2375; &#2348;&#2344;&#2366; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">; </span><span style=\"font-family: Cambria Math;\">&#2325;&#2352;&#2381;&#2344;&#2375;&#2354;</span><span style=\"font-family: Cambria Math;\">(</span><span style=\"font-family: Cambria Math;\">Kernel</span><span style=\"font-family: Cambria Math;\">), </span><span style=\"font-family: Cambria Math;\">&#2358;&#2375;&#2354;</span><span style=\"font-family: Cambria Math;\">(shell) </span><span style=\"font-family: Cambria Math;\">&#2324;&#2352; &#2346;&#2381;&#2352;&#2379;&#2327;&#2381;&#2352;&#2366;&#2350;</span><span style=\"font-family: Cambria Math;\">(program)</span><span style=\"font-family: Cambria Math;\">&#2404; </span><strong><span style=\"font-family: Cambria Math;\">&#2325;&#2352;&#2381;&#2344;&#2375;&#2354;</span><span style=\"font-family: Cambria Math;\">(kernel)</span><span style=\"font-family: Cambria Math;\"> </span></strong><span style=\"font-family: Cambria Math;\"><strong>&#2321;&#2346;&#2352;&#2375;&#2335;&#2367;&#2306;&#2327; &#2360;&#2367;&#2360;&#2381;&#2335;&#2350;</strong> &#2325;&#2366; &#2350;&#2370;&#2354; &#2361;&#2376; &#2332;&#2379; &#2346;&#2375;&#2352;&#2368;&#2347;&#2375;&#2352;&#2354; &#2337;&#2367;&#2357;&#2366;&#2311;&#2360;&#2375;&#2360;</span><span style=\"font-family: Cambria Math;\">( peripheral devices) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2379; &#2346;&#2341;</span><span style=\"font-family: Cambria Math;\">(path) </span><span style=\"font-family: Cambria Math;\">&#2346;&#2381;&#2352;&#2342;&#2366;&#2344; &#2325;&#2352;&#2325;&#2375; &#2346;&#2381;&#2352;&#2325;&#2381;&#2352;&#2367;&#2351;&#2366; &#2325;&#2366; &#2360;&#2350;&#2352;&#2381;&#2341;&#2344; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376;&#2404; </span><strong><span style=\"font-family: Cambria Math;\">&#2358;&#2375;&#2354;</span><span style=\"font-family: Cambria Math;\">(shell)</span></strong><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2357;&#2361; &#2346;&#2381;&#2352;&#2379;&#2327;&#2381;&#2352;&#2366;&#2350; &#2361;&#2376; &#2332;&#2379; &#2313;&#2346;&#2351;&#2379;&#2327;&#2325;&#2352;&#2381;&#2340;&#2366; &#2342;&#2381;&#2357;&#2366;&#2352;&#2366; &#2342;&#2367;&#2319; &#2327;&#2319; &#2325;&#2350;&#2366;&#2306;&#2337;</span><span style=\"font-family: Cambria Math;\">(command) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2368; &#2357;&#2381;&#2351;&#2366;&#2326;&#2381;&#2351;&#2366; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376;&#2404; </span><span style=\"font-family: Cambria Math;\">&#2354;&#2367;&#2344;&#2325;&#2381;&#2360;</span><span style=\"font-family: Cambria Math;\">(linux)</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2319;&#2325; &#2351;&#2370;&#2344;&#2367;&#2325;&#2381;&#2360; &#2325;&#2381;&#2354;&#2379;&#2344; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2351;&#2370;&#2344;&#2367;&#2325;&#2381;&#2360;</span><span style=\"font-family: Cambria Math;\">(unix) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2368; &#2340;&#2352;&#2361; &#2357;&#2381;&#2351;&#2357;&#2361;&#2366;&#2352; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376; &#2354;&#2375;&#2325;&#2367;&#2344; &#2311;&#2360;&#2350;&#2375;&#2306; &#2311;&#2360;&#2325;&#2366; &#2325;&#2379;&#2337; &#2344;&#2361;&#2368;&#2306; &#2361;&#2379;&#2340;&#2366; &#2361;&#2376;&#2404; &#2351;&#2370;&#2344;&#2367;&#2325;&#2381;&#2360;</span><span style=\"font-family: Cambria Math;\">(unix) </span><span style=\"font-family: Cambria Math;\">&#2350;&#2375;&#2306; &#2319;&#2325; &#2346;&#2370;&#2352;&#2368; &#2340;&#2352;&#2361; &#2360;&#2375; &#2309;&#2354;&#2327; &#2325;&#2379;&#2337;&#2367;&#2306;&#2327; &#2361;&#2376;&#2404; <strong>&#2354;&#2367;&#2344;&#2325;&#2381;&#2360;</strong></span><strong><span style=\"font-family: Cambria Math;\">(linux) </span></strong><span style=\"font-family: Cambria Math;\">&#2360;&#2367;&#2352;&#2381;&#2347; &#2325;&#2352;&#2381;&#2344;&#2375;&#2354;</span><span style=\"font-family: Cambria Math;\">(kernel) </span><span style=\"font-family: Cambria Math;\">&#2361;&#2376;&#2404; &#2351;&#2370;&#2344;&#2367;&#2325;&#2381;&#2360;</span><span style=\"font-family: Cambria Math;\">(unix) </span><span style=\"font-family: Cambria Math;\">&#2321;&#2346;&#2352;&#2375;&#2335;&#2367;&#2306;&#2327; &#2360;&#2367;&#2360;&#2381;&#2335;&#2350; &#2325;&#2366; &#2319;&#2325; &#2346;&#2370;&#2352;&#2366; &#2346;&#2376;&#2325;&#2375;&#2332;</span><span style=\"font-family: Cambria Math;\">(package) </span><span style=\"font-family: Cambria Math;\">&#2361;&#2376;&#2404;</span></p>\n",
                    correct: "a",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
                questions.push({
                    id: "15",
                    section: "31",
                    question_en: "<p>15.<span style=\"font-family: Cambria Math;\"> The most widely used code that represents each character as a unique 8-bit code is_______</span></p>\n",
                    question_hi: "<p>15.<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2360;&#2348;&#2360;&#2375; &#2357;&#2381;&#2351;&#2366;&#2346;&#2325; &#2352;&#2370;&#2346; &#2360;&#2375; &#2313;&#2346;&#2351;&#2379;&#2327; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2344;&#2375; &#2357;&#2366;&#2354;&#2366; &#2325;&#2379;&#2337; &#2332;&#2379; &#2346;&#2381;&#2352;&#2340;&#2381;&#2351;&#2375;&#2325; &#2325;&#2352;&#2376;&#2325;&#2381;&#2335;&#2352; &#2325;&#2379; &#2319;&#2325; &#2351;&#2370;&#2344;&#2367;&#2325; </span><span style=\"font-family: Cambria Math;\">8-</span><span style=\"font-family: Cambria Math;\">&#2348;&#2367;&#2335; </span><span style=\"font-family: Cambria Math;\">(unique 8-bit) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2379;&#2337; &#2325;&#2375; &#2352;&#2370;&#2346; &#2350;&#2375;&#2306; &#2342;&#2352;&#2381;&#2358;&#2366;&#2340;&#2366; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2357;&#2361; </span><span style=\"font-family: Cambria Math;\">_____ </span><span style=\"font-family: Cambria Math;\">&#2361;&#2376;&#2404;</span></p>\n",
                    options_en: ["<p>ASCII</p>\n", "<p>UNICODE</p>\n", 
                                "<p>BCD</p>\n", "<p>EBCDIC</p>\n"],
                    options_hi: ["<p>ASCII</p>\n", "<p>UNICODE</p>\n",
                                "<p>BCD</p>\n", "<p>EBCDIC</p>\n"],
                    solution_en: "<p>15.(a) <strong><span style=\"font-family: Cambria Math;\">ASCII </span></strong><span style=\"font-family: Cambria Math;\">&rarr;</span><span style=\"font-family: Cambria Math;\"> It is an 8-bit code. That is, it uses </span><span style=\"font-family: Cambria Math;\">eight bits</span><span style=\"font-family: Cambria Math;\"> to represent a letter or a punctuation mark. <strong>Eight bits</strong> are called a byte. A binary code with eight digits, such as 1101 10112, can be stored in one byte of computer memory.</span></p>\r\n<p><span style=\"font-family: Cambria Math;\"><strong>UNICODE</strong> &rarr;</span><span style=\"font-family: Cambria Math;\"> The Unicode Standard is an information technology standard for the consistent encoding, representation, and handling of text expressed in most of the world\'s writing systems.</span></p>\r\n<p><span style=\"font-family: Cambria Math;\"><strong>BCD</strong> &rarr; </span><span style=\"font-family: Cambria Math;\">It is a family</span><span style=\"font-family: Cambria Math;\"> of representations of numerals, uppercase Latin letters, and some special and control characters as six-bit character codes.</span></p>\n",
                    solution_hi: "<p>15.(a) <span style=\"font-family: Cambria Math;\"><strong>ASCII</strong> </span><span style=\"font-family: Cambria Math;\">&rarr; </span><span style=\"font-family: Cambria Math;\">&#2351;&#2361; &#2319;&#2325; </span><span style=\"font-family: Cambria Math;\">8-</span><span style=\"font-family: Cambria Math;\">&#2348;&#2367;&#2335; &#2325;&#2379;&#2337; &#2361;&#2376;&#2404; &#2309;&#2352;&#2381;&#2341;&#2366;&#2340;&#2381;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2351;&#2361; &#2319;&#2325; &#2309;&#2325;&#2381;&#2359;&#2352; &#2351;&#2366; &#2357;&#2367;&#2352;&#2366;&#2350; &#2330;&#2367;&#2361;&#2381;&#2344; &#2325;&#2366; &#2346;&#2381;&#2352;&#2340;&#2367;&#2344;&#2367;&#2343;&#2367;&#2340;&#2381;&#2357; &#2325;&#2352;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; </span><span style=\"font-family: Cambria Math;\">&#2310;&#2336; &#2348;&#2367;&#2335;&#2381;&#2360;</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2325;&#2366; &#2313;&#2346;&#2351;&#2379;&#2327; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376;&#2404; &#2310;&#2336; &#2348;&#2367;&#2335; &#2325;&#2379; <strong>&#2319;&#2325; &#2348;&#2366;&#2311;&#2335; &#2325;&#2361;&#2340;&#2375; &#2361;&#2376;&#2306;</strong>&#2404; &#2310;&#2336; &#2337;&#2367;&#2332;&#2367;&#2335; &#2357;&#2366;&#2354;&#2366; &#2319;&#2325; &#2348;&#2366;&#2311;&#2344;&#2352;&#2368; &#2325;&#2379;&#2337;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2332;&#2376;&#2360;&#2375; </span><span style=\"font-family: Cambria Math;\">1101 10112, </span><span style=\"font-family: Cambria Math;\">&#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; &#2350;&#2375;&#2350;&#2379;&#2352;&#2368; &#2325;&#2375; &#2319;&#2325; &#2348;&#2366;&#2311;&#2335; &#2350;&#2375;&#2306; &#2360;&#2381;&#2335;&#2379;&#2352; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366; &#2360;&#2325;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\r\n<p><strong><span style=\"font-family: Cambria Math;\">UNICODE</span></strong><span style=\"font-family: Cambria Math;\"> &rarr; </span><span style=\"font-family: Cambria Math;\">&#2351;&#2370;&#2344;&#2367;&#2325;&#2379;&#2337; &#2360;&#2381;&#2335;&#2376;&#2306;&#2337;&#2352;&#2381;&#2337; &#2357;&#2352;&#2381;&#2354;&#2381;&#2337;</span><span style=\"font-family: Cambria Math;\">\'</span><span style=\"font-family: Cambria Math;\">&#2360; &#2352;&#2366;&#2311;&#2335;&#2367;&#2306;&#2327; &#2360;&#2367;&#2360;&#2381;&#2335;&#2350; &#2350;&#2375;&#2306; &#2357;&#2381;&#2351;&#2325;&#2381;&#2340; &#2325;&#2367;&#2319; &#2327;&#2319; &#2335;&#2375;&#2325;&#2381;&#2360;&#2381;&#2335; &#2325;&#2375; &#2325;&#2306;&#2360;&#2367;&#2360;&#2381;&#2335;&#2375;&#2306;&#2335; &#2319;&#2344;&#2381;&#2325;&#2379;&#2337;&#2367;&#2306;&#2327; </span><span style=\"font-family: Cambria Math;\">(consistent encoding), </span><span style=\"font-family: Cambria Math;\">&#2352;&#2367;&#2346;&#2381;&#2352;&#2332;&#2375;&#2306;&#2335;&#2375;&#2358;&#2344; </span><span style=\"font-family: Cambria Math;\">(representation) </span><span style=\"font-family: Cambria Math;\">&#2324;&#2352; &#2361;&#2376;&#2306;&#2337;&#2354;&#2367;&#2306;&#2327; </span><span style=\"font-family: Cambria Math;\">(handling) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2375; &#2354;&#2367;&#2319; &#2319;&#2325; &#2311;&#2344;&#2347;&#2366;&#2352;&#2381;&#2350;&#2375;&#2358;&#2344; &#2335;&#2375;&#2325;&#2381;&#2344;&#2379;&#2354;&#2377;&#2332;&#2368; &#2360;&#2381;&#2335;&#2376;&#2306;&#2337;&#2352;&#2381;&#2337; &#2361;&#2376;&#2404;</span></p>\r\n<p><span style=\"font-family: Cambria Math;\"><strong>BCD</strong> </span><span style=\"font-family: Cambria Math;\">&rarr; </span><span style=\"font-family: Cambria Math;\">&#2351;&#2361; &#2337;&#2367;&#2332;&#2367;&#2335;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2309;&#2346;&#2352;&#2325;&#2375;&#2360; &#2354;&#2376;&#2335;&#2367;&#2344; &#2309;&#2325;&#2381;&#2359;&#2352;&#2379;&#2306; </span><span style=\"font-family: Cambria Math;\">(uppercase Latin letter) </span><span style=\"font-family: Cambria Math;\">&#2324;&#2352; &#2325;&#2369;&#2331; &#2360;&#2381;&#2346;&#2375;&#2358;&#2354; &#2324;&#2352; &#2325;&#2306;&#2335;&#2381;&#2352;&#2379;&#2354; &#2325;&#2352;&#2376;&#2325;&#2381;&#2335;&#2352; </span><span style=\"font-family: Cambria Math;\">(special and control character) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2375; &#2331;&#2361;</span><span style=\"font-family: Cambria Math;\">-</span><span style=\"font-family: Cambria Math;\">&#2348;&#2367;&#2335; &#2325;&#2352;&#2376;&#2325;&#2381;&#2335;&#2352; &#2325;&#2379;&#2337; &#2325;&#2375; &#2352;&#2367;&#2346;&#2381;&#2352;&#2332;&#2375;&#2306;&#2335;&#2375;&#2358;&#2344; &#2325;&#2366; &#2319;&#2325; &#2347;&#2375;&#2350;&#2367;&#2354;&#2368; </span><span style=\"font-family: Cambria Math;\">(family) </span><span style=\"font-family: Cambria Math;\">&#2361;&#2376;&#2404;</span></p>\n",
                    correct: "a",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
                questions.push({
                    id: "16",
                    section: "31",
                    question_en: "<p>16.<span style=\"font-family: Cambria Math;\"> Why do we use Ctrl+Alt+C ?</span></p>\n",
                    question_hi: "<p>16.<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2361;&#2350; </span><span style=\"font-family: Cambria Math;\">Ctrl+Alt+C </span><span style=\"font-family: Cambria Math;\">&#2325;&#2366; &#2313;&#2346;&#2351;&#2379;&#2327; &#2325;&#2381;&#2351;&#2379;&#2306; &#2325;&#2352;&#2340;&#2375; &#2361;&#2376;&#2306;</span><span style=\"font-family: Cambria Math;\">?</span></p>\n",

                questions.push({
                    id: "20",
                    section: "misc",
                    question_en: "<p>20.<span style=\"font-family: Cambria Math;\"> The part of a computer that coordinates all its functions, is called its______</span></p>\n",
                    question_hi: "<p>20.<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; &#2325;&#2366; &#2357;&#2361; &#2349;&#2366;&#2327; &#2332;&#2379; &#2313;&#2360;&#2325;&#2375; &#2360;&#2349;&#2368; &#2325;&#2366;&#2352;&#2381;&#2351;&#2379;&#2306; &#2325;&#2366; &#2360;&#2350;&#2344;&#2381;&#2357;&#2351; </span><span style=\"font-family: Cambria Math;\">(coordinates) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2352;&#2340;&#2366; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2313;&#2360;&#2375; &#2325;&#2381;&#2351;&#2366; &#2325;&#2375;&#2361;&#2340;&#2375; &#2361;&#2376;&#2404;</span></p>\n",
                    options_en: ["<p>ROM program</p>\n", "<p>System board</p>\n", 
                                "<p>Arithmetic logic unit</p>\n", "<p>Control unit</p>\n"],
                    options_hi: ["<p><span style=\"font-weight: 400;\">&#2352;&#2379;&#2350; &#2346;&#2381;&#2352;&#2379;&#2327;&#2381;&#2352;&#2366;&#2350; (ROM program)</span></p>\n", "<p><span style=\"font-weight: 400;\">&#2360;&#2367;&#2360;&#2381;&#2335;&#2350; &#2348;&#2379;&#2352;&#2381;&#2337; (System board)</span></p>\n",
                                "<p><span style=\"font-weight: 400;\">&#2309;&#2352;&#2367;&#2341;&#2350;&#2375;&#2335;&#2367;&#2325; &#2354;&#2377;&#2332;&#2367;&#2325; &#2351;&#2370;&#2344;&#2367;&#2335; (Arithmetic logic unit)</span></p>\n", "<p><span style=\"font-weight: 400;\">&#2325;&#2306;&#2335;&#2381;&#2352;&#2379;&#2354; &#2351;&#2370;&#2344;&#2367;&#2335; (Control unit)</span></p>\n"],
                    solution_en: "<p>20.(d)<span style=\"font-family: Cambria Math;\"> </span><strong><span style=\"font-family: Cambria Math;\">CU(Control Unit) </span></strong><span style=\"font-family: Cambria Math;\"><strong>coordinates with the input and output devices of a computer</strong>. It directs the computer to carry out stored program instructions by communicating with the ALU and the registers. It organizes the processing of data and instructions.</span></p>\r\n<p><span style=\"font-family: Cambria Math;\">An <strong>arithmetic logic unit (ALU)</strong></span><span style=\"font-family: Cambria Math;\"> is a digital circuit used to perform arithmetic and logic operations.</span></p>\n",
                    solution_hi: "<p>20.(d)<span style=\"font-family: Cambria Math;\"> </span><strong><span style=\"font-family: Cambria Math;\">CU (</span><span style=\"font-family: Cambria Math;\">&#2325;&#2306;&#2335;&#2381;&#2352;&#2379;&#2354; &#2351;&#2370;&#2344;&#2367;&#2335;</span><span style=\"font-family: Cambria Math;\">) </span></strong><span style=\"font-family: Cambria Math;\"><strong>&#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; &#2325;&#2375; &#2311;&#2344;&#2346;&#2369;&#2335; &#2324;&#2352; &#2310;&#2313;&#2335;&#2346;&#2369;&#2335; &#2337;&#2367;&#2357;&#2366;&#2311;&#2360; &#2325;&#2375; &#2360;&#2366;&#2341; &#2360;&#2350;&#2344;&#2381;&#2357;&#2351; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376;</strong>&#2404; &#2351;&#2361; </span><span style=\"font-family: Cambria Math;\">ALU </span><span style=\"font-family: Cambria Math;\">&#2324;&#2352; &#2352;&#2332;&#2367;&#2360;&#2381;&#2335;&#2352; &#2325;&#2375; &#2360;&#2366;&#2341; &#2360;&#2306;&#2330;&#2366;&#2352; &#2325;&#2352;&#2325;&#2375; &#2360;&#2381;&#2335;&#2379;&#2352;&#2381;&#2337; &#2346;&#2381;&#2352;&#2379;&#2327;&#2381;&#2352;&#2366;&#2350; &#2311;&#2306;&#2360;&#2381;&#2335;&#2381;&#2352;&#2325;&#2381;&#2358;&#2306;&#2360; &#2325;&#2379; &#2346;&#2370;&#2352;&#2366; &#2325;&#2352;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; &#2325;&#2379; &#2344;&#2367;&#2352;&#2381;&#2342;&#2375;&#2358;&#2367;&#2340; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376;&#2404; &#2351;&#2361; &#2337;&#2375;&#2335;&#2366; &#2324;&#2352; &#2311;&#2306;&#2360;&#2381;&#2335;&#2381;&#2352;&#2325;&#2381;&#2358;&#2306;&#2360; &#2325;&#2375; &#2346;&#2381;&#2352;&#2379;&#2360;&#2375;&#2360;&#2367;&#2306;&#2327; &#2325;&#2379; &#2357;&#2381;&#2351;&#2357;&#2360;&#2381;&#2341;&#2367;&#2340; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\r\n<p><span style=\"font-family: Cambria Math;\">&#2319;&#2325; <strong>&#2309;&#2352;&#2367;&#2341;&#2350;&#2375;&#2335;&#2367;&#2325; &#2354;&#2377;&#2332;&#2367;&#2325; &#2351;&#2370;&#2344;&#2367;&#2335; </strong></span><strong><span style=\"font-family: Cambria Math;\">(ALU)</span><span style=\"font-family: Cambria Math;\"> </span></strong><span style=\"font-family: Cambria Math;\">&#2309;&#2352;&#2367;&#2341;&#2350;&#2375;&#2335;&#2367;&#2325; &#2324;&#2352; &#2354;&#2377;&#2332;&#2367;&#2325; &#2321;&#2346;&#2352;&#2375;&#2358;&#2344;&#2381;&#2360; &#2325;&#2352;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2313;&#2346;&#2351;&#2379;&#2327; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2344;&#2375; &#2357;&#2366;&#2354;&#2366; &#2319;&#2325; &#2337;&#2367;&#2332;&#2367;&#2335;&#2354; &#2360;&#2352;&#2381;&#2325;&#2367;&#2335; &#2361;&#2376;&#2404;</span></p>\n",
                    correct: "d",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
            
            // Generate question boxes
            const boxesContainer = document.getElementById('question-boxes');
            questions.forEach((q, index) => {
                const box = document.createElement('div');
                box.className = 'q-box';
                box.textContent = index + 1;
                box.onclick = () => showQuestion(index);
                box.id = `box-${index}`;
                boxesContainer.appendChild(box);
            });
            
            // Show first question
            showQuestion(0);
            updateProgress();
        }
        
        // Show a specific question
        
        function formatContent(text) {
            if (!text) return '';
            return text.replace(/<img/g, '<img style="max-width:100%;height:auto;"');
        }
        
        function showQuestion(index) {
            if (index < 0 || index >= questions.length) return;
            
            currentQuestion = index;
            const question = questions[index];
            
            // Update question counter
            document.getElementById('question-counter').textContent = `Question ${index + 1} of ${questions.length}`;
            
            // Update question boxes
            document.querySelectorAll('.q-box').forEach(box => box.classList.remove('current'));
            document.getElementById(`box-${index}`).classList.add('current');
            
            // Generate question HTML
            let html = `
                <div class="question-card">
                    <div class="question-text">
                        <div class="en">${formatContent(question.question_en)}</div>
                        <div class="hi" style="display:none">${formatContent(question.question_hi)} </div>
                    </div>
                    <div class="options" id="options-container">`;
            
            // Add options
            ['a', 'b', 'c', 'd'].forEach((opt, i) => {
                let optionClass = '';
                let isCorrectAnswer = opt === question.correct;
                let isUserAnswer = answers[question.id] === opt;
                
                // When reviewing, add appropriate classes
                if (submitted) {
                    if (isCorrectAnswer) {
                        optionClass += ' correct-answer';
                    } else if (isUserAnswer && !isCorrectAnswer) {
                        optionClass += ' incorrect';
                    }
                }
                
                html += `
                    <div class="option-item">
                        <input class="option-input" type="radio" name="q${index}" 
                            id="opt-${index}-${opt}" value="${opt}" 
                            ${isUserAnswer ? 'checked' : ''}
                            onclick="selectAnswer('${question.id}', '${opt}')">
                       <label class="option-label${optionClass}" for="opt-${index}-${opt}">
                            <div class="en">${question.options_en[i]}</div>
                            <div class="hi" style="display:none">${question.options_hi[i]}</div>
                        </label>
                    </div>`;
            });
            
            // Add solution if submitted
            if (submitted) {
                const isCorrect = answers[question.id] === question.correct;
                const resultText = answers[question.id] ? (isCorrect ? 'Correct!' : 'Incorrect!') : 'Not attempted';
                
                html += `
                    <div class="solution-container">
                        <div class="solution-title">${resultText}</div>
                        <div class="solution-text">
                            <div class="en">${question.solution_en}</div>
                            <div class="hi" style="display:none">${question.solution_hi}</div>
                        </div>
                    </div>`;
            }
            
            html += `</div></div>`;
            
            document.getElementById('questions-container').innerHTML = html;
            
            // Apply language settings
            applyLanguage();
            
            // If in mobile view, close the menu
            if (window.innerWidth < 992) {
                toggleNav(false);
            }
            
            // Add review mode class if submitted
            if (submitted) {
                document.getElementById('options-container').classList.add('review-mode');
            }
        }
        
        // Apply current language
        function applyLanguage() {
            document.querySelectorAll(`.${currentLang}`).forEach(el => el.style.display = 'block');
            document.querySelectorAll(`.${currentLang === 'en' ? 'hi' : 'en'}`).forEach(el => el.style.display = 'none');
            
            // Update language button text
            document.getElementById('lang-text').textContent = currentLang === 'en' ? 'Hi' : 'En';
        }
        
        // Select an answer
        function selectAnswer(qId, option) {
            if (submitted) return;
            
            answers[qId] = option;
            updateProgress();
            
            // Mark question as attempted in the navigation
            const index = questions.findIndex(q => q.id === qId);
            if (index >= 0) {
                const box = document.getElementById(`box-${index}`);
                box.classList.add('attempted');
                box.classList.remove('unattempted');
            }
        }
        
        // Navigate to previous/next question
        function prevQuestion() { 
            if (currentQuestion > 0) showQuestion(currentQuestion - 1); 
        }
        
        function nextQuestion() { 
            if (currentQuestion < questions.length - 1) showQuestion(currentQuestion + 1); 
        }
        
        // Switch section
        function switchSection(sectionId) {
            if (sectionId === 'all') {
                showQuestion(0);
                return;
            }
            
            const section = sections[sectionId];
            if (section) showQuestion(section.start);
        }
        
        // Toggle language
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            applyLanguage();
        }
        
        // Toggle navigation sidebar
        function toggleNav(show) {
            const nav = document.getElementById('question-nav');
            const overlay = document.getElementById('nav-overlay');
            
            if (show === undefined) {
                show = !nav.classList.contains('show');
            }
            
            if (show) {
                nav.classList.add('show');
                overlay.classList.add('show');
                document.body.style.overflow = 'hidden';
            } else {
                nav.classList.remove('show');
                overlay.classList.remove('show');
                document.body.style.overflow = '';
            }
        }
        
        // Update progress
        function updateProgress() {
            const attempted = Object.keys(answers).length;
            document.getElementById('attempted-count').textContent = attempted;
        }
        
        // Start timer
        function startTimer() {
            const timerDisplay = document.getElementById('timer-display');
            let timeLeft = totalTime;
            
            const timerInterval = setInterval(() => {
                if (timeLeft <= 0 || submitted) {
                    clearInterval(timerInterval);
                    if (!submitted) submitTest();
                    return;
                }
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                timeLeft--;
            }, 1000);
        }
        
        // Confirm before submitting
        function confirmSubmit() {
            if (submitted) return;
            
            const attempted = Object.keys(answers).length;
            const remaining = questions.length - attempted;
            
            // Create a more modern confirmation dialog
            const confirmHtml = `
                <div style="text-align: center; padding: 20px;">
                    <h4 style="margin-bottom: 16px; color: var(--dark);">Confirm Submission</h4>
                    <p style="margin-bottom: 24px; color: var(--gray);">
                        You have attempted ${attempted} of ${questions.length} questions.<br>
                        ${remaining} questions are unattempted.
                    </p>
                    <div style="display: flex; justify-content: center; gap: 12px;">
                        <button onclick="this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; border: 1px solid var(--light-gray); background: white; border-radius: 8px; cursor: pointer;">
                            Cancel
                        </button>
                        <button onclick="submitTest(); this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer;">
                            Submit Test
                        </button>
                    </div>
                </div>`;
            
            // Create modal element
            const modal = document.createElement('div');
            modal.className = 'results-modal show';
            modal.innerHTML = `
                <div class="results-card" style="max-width: 400px;">
                    <button class="cancel-btn" style="position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--gray);" onclick="this.closest('.results-modal').remove()">
                        ×
                    </button>
                    ${confirmHtml}
                </div>`;
            
            document.body.appendChild(modal);
        }
        
        // Submit test
        function submitTest() {
            if (submitted) return;
            
            submitted = true;
            
            let score = 0;
            let correctCount = 0;
            let incorrectCount = 0;
            let unattemptedCount = 0;
            
            questions.forEach((q, index) => {
                const userAns = answers[q.id];
                const box = document.getElementById(`box-${index}`);
                
                box.classList.remove('attempted');
                
                if (!userAns) {
                    unattemptedCount++;
                    box.classList.add('unattempted');
                } else if (userAns === q.correct) {
                    correctCount++;
                    score += q.pos_marks;
                    box.classList.add('correct');
                } else {
                    incorrectCount++;
                    score -= q.neg_marks;
                    box.classList.add('incorrect');
                }
            });
            
            // Update result values
            document.getElementById('score-value').textContent = score.toFixed(2);
            document.getElementById('correct-value').textContent = correctCount;
            document.getElementById('incorrect-value').textContent = incorrectCount;
            document.getElementById('unattempted-value').textContent = unattemptedCount;
            
            // Show the results modal
            document.getElementById('results-modal').classList.add('show');
            
            // Disable submit button
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-check"></i>';
            submitBtn.style.backgroundColor = 'var(--success)';
            
            // Refresh current question view to show solution
            showQuestion(currentQuestion);
        }
        
        // Review test
        function reviewTest() {
            document.getElementById('results-modal').classList.remove('show');
            showQuestion(0);
        }
        
        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('results-modal')) {
                document.getElementById('results-modal').classList.remove('show');
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === 'ArrowRight') nextQuestion();
        });
    </script>
</body>
</html>
