                questions.push({
                    id: "14",
                    section: "31",
                    question_en: "<p><span style=\"font-family: Roboto;\">14.</span><span style=\"font-family: Roboto;\"> ______ tab in MS-Excel 2010 ribbon bar contains tools for inserting functions, defining </span><span style=\"font-family: Roboto;\">names and controlling the calculation options.</span></p>\n",
                    question_hi: "<p><span style=\"font-family: Palanquin;\">14. &#2319;&#2350;&#2319;&#2360;-&#2319;&#2325;&#2381;&#2360;&#2375;&#2354; 2010 &#2352;&#2367;&#2348;&#2344; &#2348;&#2366;&#2352; &#2350;&#2375;&#2306; _____&#2335;&#2376;&#2348; &#2350;&#2375;&#2306; &#2347;&#2306;&#2325;&#2381;&#2358;&#2344; &#2337;&#2366;&#2354;&#2344;&#2375;, &#2344;&#2366;&#2350; &#2346;&#2352;&#2367;&#2349;&#2366;&#2359;&#2367;&#2340; &#2325;&#2352;&#2344;&#2375; &#2324;&#2352; &#2327;&#2339;&#2344;&#2366; - &#2360;&#2350;&#2381;&#2348;&#2344;&#2381;&#2343;&#2368; &#2357;&#2367;&#2325;&#2354;&#2381;&#2346;&#2379;&#2306; &#2325;&#2379; &#2344;&#2367;&#2351;&#2306;&#2340;&#2381;&#2352;&#2367;&#2340; &#2325;&#2352;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2335;&#2370;&#2354; &#2361;&#2379;&#2340;&#2375; &#2361;&#2376;&#2404; </span></p>\n",
                    options_en: ["<p>PAGE Layout</p>\n", "<p>REVIEW</p>\n", 
                                "<p>FORMULA</p>\n", "<p>FILE</p>\n"],
                    options_hi: ["<p>PAGE Layout</p>\n", "<p>REVIEW</p>\n",
                                "<p>FORMULA</p>\n", "<p>FILE</p>\n"],
                    solution_en: "<p>14.(c)<span style=\"font-family: Roboto;\"> </span><strong><span style=\"font-family: Roboto;\">Formula</span></strong><span style=\"font-family: Roboto;\"> </span><span style=\"font-family: Arial Unicode MS;\">&rarr;</span><span style=\"font-family: Arial Unicode MS;\">In Microsoft Excel, a formula is an expression that operates on values in a range of </span><span style=\"font-family: Arial Unicode MS;\">cells. </span><strong><span style=\"font-family: Arial Unicode MS;\">Review Tab</span></strong><span style=\"font-family: Arial Unicode MS;\">&rarr;</span><span style=\"font-family: Arial Unicode MS;\">The Review tab provides icons for document review-related commands, such as spelling check, translation, track changes, apply changes, comments and so on. </span><span style=\"font-family: Arial Unicode MS;\"><strong>File</strong> </span><span style=\"font-family: Arial Unicode MS;\">&rarr;</span><span style=\"font-family: Arial Unicode MS;\">The File ribbon items enable you to perform file management functions, including open, save, close, and print. </span><strong><span style=\"font-family: Arial Unicode MS;\">PAGE Layout</span></strong><span style=\"font-family: Arial Unicode MS;\"> </span><span style=\"font-family: Arial Unicode MS;\">&rarr;</span><span style=\"font-family: Arial Unicode MS;\">The Page Layout Tab holds all the options that allow you to arrange your document pages just the way you want them.</span></p>\n",
                    solution_hi: "<p>14.(c)<span style=\"font-family: Arial Unicode MS;\"> </span><strong><span style=\"font-family: Arial Unicode MS;\">Formula</span></strong><span style=\"font-family: Arial Unicode MS;\"> &rarr; &#2350;&#2366;&#2311;&#2325;&#2381;&#2352;&#2379;&#2360;&#2377;&#2347;&#2381;&#2335; &#2319;&#2325;&#2381;&#2360;&#2375;&#2354; &#2350;&#2375;&#2306;, &#2347;&#2377;&#2352;&#2381;&#2350;&#2370;&#2354;&#2366; &#2319;&#2325; &#2319;&#2325;&#2381;&#2360;&#2346;&#2381;&#2352;&#2375;&#2358;&#2344; &#2361;&#2379;&#2340;&#2366; &#2361;&#2376;, &#2332;&#2379; &#2360;&#2375;&#2354; &#2325;&#2368; &#2352;&#2375;&#2306;&#2332; &#2350;&#2375;&#2306; &#2357;&#2376;&#2354;&#2381;&#2351;&#2370; &#2346;&#2352; &#2321;&#2346;&#2352;&#2375;&#2335; &#2361;&#2379;&#2340;&#2366; &#2361;&#2376;&#2404;<strong> Review Tab</strong>&rarr; &#2352;&#2367;&#2357;&#2381;&#2351;&#2369; &#2335;&#2376;&#2348; &#2342;&#2360;&#2381;&#2340;&#2366;&#2357;&#2375;&#2332;&#2364; &#2360;&#2350;&#2368;&#2325;&#2381;&#2359;&#2366; (review ) &#2360;&#2375; &#2360;&#2306;&#2348;&#2306;&#2343;&#2367;&#2340; &#2310;&#2342;&#2375;&#2358;&#2379;&#2306; &#2325;&#2375; &#2354;&#2367;&#2319; &#2310;&#2311;&#2325;&#2344; &#2346;&#2381;&#2352;&#2342;&#2366;&#2344; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376;, &#2332;&#2376;&#2360;&#2375; &#2357;&#2352;&#2381;&#2340;&#2344;&#2368; &#2332;&#2366;&#2306;&#2330;, &#2309;&#2344;&#2369;&#2357;&#2366;&#2342;, &#2335;&#2381;&#2352;&#2376;&#2325; &#2330;&#2375;&#2306;&#2332; , &#2309;&#2346;&#2381;&#2354;&#2366;&#2312; &#2330;&#2375;&#2306;&#2332; , &#2325;&#2350;&#2376;&#2306;&#2335;&#2381;&#2360; &#2310;&#2342;&#2367;&#2404; </span><span style=\"font-family: Arial Unicode MS;\"><strong>File</strong> </span><span style=\"font-family: Arial Unicode MS;\">&rarr; </span><span style=\"font-family: Palanquin Dark;\">&#2347;&#2364;&#2366;&#2311;&#2354; &#2352;&#2367;&#2348;&#2344; &#2310;&#2311;&#2335;&#2350; &#2310;&#2346;&#2325;&#2379; &#2347;&#2364;&#2366;&#2311;&#2354; &#2346;&#2381;&#2352;&#2348;&#2306;&#2343;&#2344; &#2347;&#2306;&#2325;&#2381;&#2358;&#2344; &#2325;&#2352;&#2344;&#2375; &#2350;&#2375;&#2306; &#2360;&#2325;&#2381;&#2359;&#2350; &#2348;&#2344;&#2366;&#2340;&#2366; &#2361;&#2376;, &#2332;&#2367;&#2360;&#2350;&#2375;&#2306; &#2323;&#2346;&#2344; , &#2360;&#2375;&#2357; ,&#2325;&#2381;&#2354;&#2379;&#2332; &#2324;&#2352; &#2346;&#2381;&#2352;&#2367;&#2306;&#2335; &#2325;&#2352;&#2344;&#2366; &#2358;&#2366;&#2350;&#2367;&#2354; &#2361;&#2376;&#2404; </span><strong><span style=\"font-family: Palanquin Dark;\">PAGE Layout</span><span style=\"font-family: Palanquin Dark;\"> </span></strong><span style=\"font-family: Arial Unicode MS;\">&rarr; </span><span style=\"font-family: Palanquin Dark;\">&#2346;&#2375;&#2332; &#2354;&#2375;&#2310;&#2313;&#2335; &#2335;&#2376;&#2348; &#2350;&#2375;&#2306; &#2357;&#2375; &#2360;&#2349;&#2368; &#2357;&#2367;&#2325;&#2354;&#2381;&#2346; &#2361;&#2379;&#2340;&#2375; &#2361;&#2376;&#2306; &#2332;&#2379; &#2310;&#2346;&#2325;&#2379; &#2309;&#2346;&#2344;&#2375; &#2342;&#2360;&#2381;&#2340;&#2366;&#2357;&#2375;&#2332;&#2364; &#2346;&#2371;&#2359;&#2381;&#2336;&#2379;&#2306; (document pages) &#2325;&#2379; &#2357;&#2376;&#2360;&#2375; &#2361;&#2368; &#2357;&#2381;&#2351;&#2357;&#2360;&#2381;&#2341;&#2367;&#2340; &#2325;&#2352;&#2344;&#2375; &#2325;&#2368; &#2309;&#2344;&#2369;&#2350;&#2340;&#2367; &#2342;&#2375;&#2340;&#2375; &#2361;&#2376;&#2306; &#2332;&#2376;&#2360;&#2375; &#2310;&#2346; &#2313;&#2344;&#2381;&#2361;&#2375;&#2306; &#2330;&#2366;&#2361;&#2340;&#2375; &#2361;&#2376;&#2306;&#2404;</span></p>\n",
                    correct: "c",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
                questions.push({
                    id: "15",
                    section: "31",
                    question_en: "<p><span style=\"font-family: Roboto;\">15.</span><span style=\"font-family: Roboto;\"> ______ shortcut key is used in MS-Excel 2010 to select a column.</span></p>\n",
                    question_hi: "<p><span style=\"font-family: Roboto;\">15.</span><span style=\"font-family: Palanquin;\"> &#2319;&#2350;&#2319;&#2360;-&#2319;&#2325;&#2381;&#2360;&#2375;&#2354; 2010 &#2350;&#2375;&#2306; &#2325;&#2377;&#2354;&#2350; &#2360;&#2375;&#2354;&#2375;&#2325;&#2381;&#2335; &#2325;&#2352;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319;_____&#2358;&#2377;&#2352;&#2381;&#2335;&#2325;&#2335; &#2325;&#2369;&#2306;&#2332;&#2368; (key) &#2325;&#2366; &#2313;&#2346;&#2351;&#2379;&#2327; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376; </span></p>\n",
                    options_en: ["<p>Ctrl + Spacebar</p>\n", "<p>Shift + Spacebar</p>\n", 
                                "<p>Ctrl + Enter</p>\n", "<p>Alt + Enter</p>\n"],
                    options_hi: ["<p>Ctrl + Spacebar</p>\n", "<p>Shift + Spacebar</p>\n",
                                "<p>Ctrl + Enter</p>\n", "<p>Alt + Enter</p>\n"],
                    solution_en: "<p>15.(a)<span style=\"font-family: Roboto;\"> </span><strong><span style=\"font-family: Roboto;\">Ctrl + Spacebar</span></strong><span style=\"font-family: Arial Unicode MS;\">&rarr; It is used to </span><span style=\"font-family: Arial Unicode MS;\">select an entire column in a worksheet. </span><strong><span style=\"font-family: Arial Unicode MS;\">Shift + Spacebar</span></strong><span style=\"font-family: Arial Unicode MS;\">&rarr; </span><span style=\"font-family: Arial Unicode MS;\">It is used to select an entire row in a worksheet. </span><strong><span style=\"font-family: Arial Unicode MS;\">ALT + Enter</span></strong><span style=\"font-family: Arial Unicode MS;\">&rarr; It is </span><span style=\"font-family: Arial Unicode MS;\">used to move to the next line allowing for multiple lines of text in one cell.</span><strong><span style=\"font-family: Arial Unicode MS;\">Ctrl + Enter</span></strong><span style=\"font-family: Arial Unicode MS;\">&rarr; It is </span><span style=\"font-family: Arial Unicode MS;\">used to fill all selected cells with the same data or formula.</span></p>\n",
                    solution_hi: "<p>15.(a)<span style=\"font-family: Arial Unicode MS;\"> </span><strong><span style=\"font-family: Arial Unicode MS;\">Ctrl + Spacebar</span></strong><span style=\"font-family: Arial Unicode MS;\">&rarr; &#2311;&#2360;&#2325;&#2366; &#2313;&#2346;&#2351;&#2379;&#2327; &#2357;&#2352;&#2381;&#2325;&#2358;&#2368;&#2335; &#2350;&#2375;&#2306; &#2319;&#2325; &#2346;&#2370;&#2352;&#2375; &#2325;&#2377;&#2354;&#2350; &#2325;&#2379; &#2360;&#2375;&#2354;&#2375;&#2325;&#2381;&#2335; &#2325;&#2352;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404; </span><strong><span style=\"font-family: Arial Unicode MS;\">Shift + Spacebar</span></strong><span style=\"font-family: Arial Unicode MS;\">&rarr; &#2311;&#2360;&#2325;&#2366; &#2313;&#2346;&#2351;&#2379;&#2327; &#2357;&#2352;&#2381;&#2325;&#2358;&#2368;&#2335; &#2350;&#2375;&#2306; &#2319;&#2325; &#2346;&#2370;&#2352;&#2368; &#2352;&#2379; &#2325;&#2366; &#2330;&#2351;&#2344; &#2325;&#2352;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404; </span><strong><span style=\"font-family: Arial Unicode MS;\">ALT + Enter</span></strong><span style=\"font-family: Arial Unicode MS;\"><strong> </strong>&rarr; &#2311;&#2360;&#2325;&#2366; &#2313;&#2346;&#2351;&#2379;&#2327; &#2319;&#2325; &#2360;&#2375;&#2354; &#2350;&#2375;&#2306; &#2335;&#2375;&#2325;&#2381;&#2360;&#2381;&#2335; &#2325;&#2368; &#2325;&#2312; &#2346;&#2306;&#2325;&#2381;&#2340;&#2367;&#2351;&#2379;&#2306; &#2325;&#2368; &#2309;&#2344;&#2369;&#2350;&#2340;&#2367; &#2342;&#2375;&#2344;&#2375; &#2357;&#2366;&#2354;&#2368; &#2309;&#2327;&#2354;&#2368; &#2346;&#2306;&#2325;&#2381;&#2340;&#2367; &#2350;&#2375;&#2306; &#2332;&#2366;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404;<strong> </strong></span><strong><span style=\"font-family: Arial Unicode MS;\">Ctrl + Enter</span></strong><span style=\"font-family: Arial Unicode MS;\">&rarr; &#2311;&#2360;&#2325;&#2366; &#2313;&#2346;&#2351;&#2379;&#2327; &#2360;&#2349;&#2368; &#2330;&#2351;&#2344;&#2367;&#2340; &#2360;&#2375;&#2354; &#2325;&#2379; &#2319;&#2325; &#2361;&#2368; &#2337;&#2375;&#2335;&#2366; &#2351;&#2366; &#2347;&#2366;&#2352;&#2381;&#2350;&#2370;&#2354;&#2366; &#2360;&#2375; &#2347;&#2367;&#2354; &#2325;&#2352;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376; &#2404;</span></p>\n",
                    correct: "a",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
                questions.push({
                    id: "16",
                    section: "31",
                    question_en: "<p><span style=\"font-family: Roboto;\">16. </span><span style=\"font-family: Roboto;\">In MS-Excel 2010, ______ are used to make a graphical representation of any set of </span><span style=\"font-family: Roboto;\">data.</span></p>\n",
                    question_hi: "<p><span style=\"font-family: Roboto;\">16.</span><span style=\"font-family: Palanquin;\"> &#2319;&#2350;&#2319;&#2360;-&#2319;&#2325;&#2381;&#2360;&#2375;&#2354; 2010 () &#2350;&#2375;&#2306;, _____&#2325;&#2366; &#2313;&#2346;&#2351;&#2379;&#2327; &#2337;&#2375;&#2335;&#2366; &#2325;&#2375; &#2325;&#2367;&#2360;&#2368; &#2349;&#2368; &#2360;&#2375;&#2335; &#2325;&#2366; &#2310;&#2354;&#2375;&#2326;&#2368; &#2344;&#2367;&#2352;&#2370;&#2346;&#2339; &#2325;&#2352;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2404;</span></p>\n",
                    options_en: ["<p>Rows</p>\n", "<p>Table</p>\n", 
                                "<p>Charts</p>\n", "<p>Columns</p>\n"],
                    options_hi: ["<p><span style=\"font-weight: 400;\">&nbsp;&#2352;&#2379;&#2395; (Rows)</span></p>\n", "<p>&#2335;&#2375;&#2348;&#2354; (Table)</p>\n",
                                "<p>&#2330;&#2366;&#2352;&#2381;&#2335;&#2381;&#2360; (Charts)</p>\n", "<p><span style=\"font-weight: 400;\">&#2325;&#2377;&#2354;&#2350;&#2381;&#2360;(Columns)</span></p>\n"],
                    solution_en: "<p>16.(c)<span style=\"font-family: Palanquin;\"> </span><strong><span style=\"font-family: Palanquin;\">CHART</span></strong><span style=\"font-family: Arial Unicode MS;\"><strong>&rarr;</strong> </span><span style=\"font-family: Arial Unicode MS;\">A chart is a tool you can use in Excel to communicate data graphically. Charts allow your audience to see the meaning behind the numbers, and they make showing comparisons and trends much easier. </span><strong><span style=\"font-family: Arial Unicode MS;\">TABLE</span><span style=\"font-family: Arial Unicode MS;\">&rarr;</span></strong><span style=\"font-family: Arial Unicode MS;\"><strong>The</strong> purpose of an Excel table is not so much to calculate new values but rather to store lots of information in a consistent manner, making it easier to format, sort, and filter worksheet data. </span><strong><span style=\"font-family: Arial Unicode MS;\">Column</span></strong><span style=\"font-family: Arial Unicode MS;\"><strong>&rarr;</strong> </span><span style=\"font-family: Arial Unicode MS;\">Columns are denoted and identified by a unique alphabetical header letter, which is located at the top of the worksheet. </span><strong><span style=\"font-family: Arial Unicode MS;\">Row</span><span style=\"font-family: Arial Unicode MS;\">&rarr;</span></strong><span style=\"font-family: Arial Unicode MS;\">Each row is denoted and identified by a unique numeric value that you\'ll see on the left hand side. The row numbers are arranged vertically on the worksheet, ranging from 1-1,048,576.</span></p>\n",
                    solution_hi: "<p>16.(c)<span style=\"font-family: Arial Unicode MS;\"> </span><span style=\"font-family: Arial Unicode MS;\"><strong>CHART&rarr;</strong> </span><span style=\"font-family: Palanquin Dark;\">&#2330;&#2366;&#2352;&#2381;&#2335; &#2319;&#2325; &#2335;&#2370;&#2354; &#2361;&#2376; &#2332;&#2367;&#2360;&#2375; &#2310;&#2346; &#2319;&#2325;&#2381;&#2360;&#2375;&#2354; &#2350;&#2375;&#2306; &#2327;&#2381;&#2352;&#2366;&#2347;&#2367;&#2325; &#2352;&#2370;&#2346; &#2360;&#2375; &#2337;&#2375;&#2335;&#2366; &#2360;&#2306;&#2330;&#2366;&#2352; &#2325;&#2352;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2313;&#2346;&#2351;&#2379;&#2327; &#2325;&#2352; &#2360;&#2325;&#2340;&#2375; &#2361;&#2376;&#2306;&#2404; &#2330;&#2366;&#2352;&#2381;&#2335; &#2310;&#2346;&#2325;&#2375; &#2342;&#2352;&#2381;&#2358;&#2325;&#2379;&#2306; &#2325;&#2379; &#2360;&#2306;&#2326;&#2381;&#2351;&#2366;&#2323;&#2306; &#2325;&#2375; &#2346;&#2368;&#2331;&#2375; &#2325;&#2366; &#2309;&#2352;&#2381;&#2341; &#2342;&#2375;&#2326;&#2344;&#2375; &#2325;&#2368; &#2309;&#2344;&#2369;&#2350;&#2340;&#2367; &#2342;&#2375;&#2340;&#2375; &#2361;&#2376;&#2306;, &#2324;&#2352; &#2357;&#2375; &#2340;&#2369;&#2354;&#2344;&#2366;&#2323;&#2306; (comparisons) &#2324;&#2352; &#2346;&#2381;&#2352;&#2357;&#2371;&#2340;&#2381;&#2340;&#2367;&#2351;&#2379;&#2306; (trends) &#2325;&#2379; &#2342;&#2367;&#2326;&#2366;&#2344;&#2366; &#2348;&#2361;&#2369;&#2340; &#2310;&#2360;&#2366;&#2344; &#2348;&#2344;&#2366;&#2340;&#2375; &#2361;&#2376;&#2306;&#2404; </span><span style=\"font-family: Palanquin Dark;\"><strong>Table</strong> </span><span style=\"font-family: Arial Unicode MS;\">&rarr; &#2319;&#2325;&#2381;&#2360;&#2375;&#2354; &#2335;&#2375;&#2348;&#2354; &#2325;&#2366; &#2313;&#2342;&#2381;&#2342;&#2375;&#2358;&#2381;&#2351; &#2344;&#2319; &#2350;&#2370;&#2354;&#2381;&#2351;&#2379;&#2306; &#2325;&#2368; &#2327;&#2339;&#2344;&#2366; &#2325;&#2352;&#2344;&#2366; &#2344;&#2361;&#2368;&#2306; &#2361;&#2376;, &#2348;&#2354;&#2381;&#2325;&#2367; &#2348;&#2361;&#2369;&#2340; &#2360;&#2366;&#2352;&#2368; &#2360;&#2370;&#2330;&#2344;&#2366;&#2323;&#2306; &#2325;&#2379; &#2319;&#2325; &#2360;&#2369;&#2360;&#2306;&#2327;&#2340; (consistent ) &#2340;&#2352;&#2368;&#2325;&#2375; &#2360;&#2375; &#2360;&#2306;&#2327;&#2381;&#2352;&#2361;&#2368;&#2340; (store) &#2325;&#2352;&#2344;&#2366; &#2361;&#2376;, &#2332;&#2367;&#2360;&#2360;&#2375; &#2357;&#2352;&#2381;&#2325;&#2358;&#2368;&#2335; &#2337;&#2375;&#2335;&#2366; &#2325;&#2379; &#2347;&#2377;&#2352;&#2381;&#2350;&#2375;&#2335; &#2325;&#2352;&#2344;&#2366;, &#2325;&#2381;&#2352;&#2350;&#2348;&#2342;&#2381;&#2343; &#2325;&#2352;&#2344;&#2366; &#2324;&#2352; &#2347;&#2364;&#2367;&#2354;&#2381;&#2335;&#2352; &#2325;&#2352;&#2344;&#2366; &#2310;&#2360;&#2366;&#2344; &#2361;&#2379; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404; </span><span style=\"font-family: Arial Unicode MS;\"><strong>Column&rarr;</strong> </span><span style=\"font-family: Palanquin Dark;\">&#2325;&#2377;&#2354;&#2350; &#2325;&#2379; &#2319;&#2325; &#2309;&#2342;&#2381;&#2357;&#2367;&#2340;&#2368;&#2351; &#2309;&#2354;&#2381;&#2347;&#2366;&#2348;&#2375;&#2335;&#2367;&#2325;&#2354; &#2361;&#2376;&#2337;&#2352; &#2354;&#2375;&#2335;&#2352; &#2342;&#2381;&#2357;&#2366;&#2352;&#2366; &#2342;&#2352;&#2381;&#2358;&#2366;&#2351;&#2366; &#2324;&#2352; &#2346;&#2361;&#2330;&#2366;&#2344;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;, &#2332;&#2379; &#2357;&#2352;&#2381;&#2325;&#2358;&#2368;&#2335; &#2325;&#2375; &#2358;&#2368;&#2352;&#2381;&#2359; &#2346;&#2352; &#2360;&#2381;&#2341;&#2367;&#2340; &#2361;&#2379;&#2340;&#2366; &#2361;&#2376;&#2404; </span><span style=\"font-family: Arial Unicode MS;\"><strong>Row&rarr;</strong> </span><span style=\"font-family: Palanquin Dark;\">&#2346;&#2381;&#2352;&#2340;&#2381;&#2351;&#2375;&#2325; &#2352;&#2379; &#2325;&#2379; &#2319;&#2325; &#2309;&#2342;&#2381;&#2357;&#2367;&#2340;&#2368;&#2351; &#2360;&#2306;&#2326;&#2381;&#2351;&#2366;&#2340;&#2381;&#2350;&#2325; &#2350;&#2366;&#2344; &#2342;&#2381;&#2357;&#2366;&#2352;&#2366; &#2342;&#2352;&#2381;&#2358;&#2366;&#2351;&#2366; &#2324;&#2352; &#2346;&#2361;&#2330;&#2366;&#2344;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376; &#2332;&#2367;&#2360;&#2375; &#2310;&#2346; &#2348;&#2366;&#2312;&#2306; &#2323;&#2352; &#2342;&#2375;&#2326;&#2375;&#2306;&#2327;&#2375;&#2404; &#2352;&#2379; &#2360;&#2306;&#2326;&#2381;&#2351;&#2366;&#2323;&#2306; &#2325;&#2379; &#2357;&#2352;&#2381;&#2325;&#2358;&#2368;&#2335; &#2346;&#2352; &#2354;&#2306;&#2348;&#2357;&#2340; (vertical) &#2352;&#2370;&#2346; &#2360;&#2375; &#2357;&#2381;&#2351;&#2357;&#2360;&#2381;&#2341;&#2367;&#2340; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;, &#2332;&#2379; 1-1,048,576 &#2360;&#2375; &#2354;&#2375;&#2325;&#2352; &#2361;&#2379;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\n",
                    correct: "c",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
                questions.push({
                    id: "17",
                    section: "31",
                    question_en: "<p><span style=\"font-family: Roboto;\">17.</span><span style=\"font-family: Roboto;\"> Secure communication is required when two parties are communicating through </span><span style=\"font-family: Roboto;\">internet, and they do not want any third party to intercept between them. Which of the </span><span style=\"font-family: Roboto;\">following is a property of secure communication?</span></p>\r\n<p><span style=\"font-family: Roboto;\">P: Confidentiality</span></p>\r\n<p><span style=\"font-family: Roboto;\">Q: Accuracy</span></p>\n",
                    question_hi: "<p><span style=\"font-family: Roboto;\">17.</span><span style=\"font-family: Palanquin;\"> &#2360;&#2369;&#2352;&#2325;&#2381;&#2359;&#2367;&#2340; &#2360;&#2306;&#2330;&#2366;&#2352; &#2325;&#2368; &#2310;&#2357;&#2358;&#2381;&#2351;&#2325;&#2340;&#2366; &#2340;&#2348; &#2361;&#2379;&#2340;&#2368; &#2361;&#2376; &#2332;&#2348; &#2342;&#2379; &#2346;&#2325;&#2381;&#2359; &#2311;&#2306;&#2335;&#2352;&#2344;&#2375;&#2335; &#2325;&#2375; &#2350;&#2366;&#2343;&#2381;&#2351;&#2350; &#2360;&#2375; &#2360;&#2306;&#2330;&#2366;&#2352; &#2325;&#2352; &#2352;&#2361;&#2375; &#2361;&#2379;&#2306;, &#2324;&#2352; &#2357;&#2375; &#2344;&#2361;&#2368;&#2306; &#2330;&#2366;&#2361;&#2340;&#2375; &#2325;&#2368; &#2325;&#2379;&#2312; &#2340;&#2368;&#2360;&#2352;&#2366; &#2346;&#2325;&#2381;&#2359; &#2313;&#2344;&#2325;&#2375; &#2348;&#2368;&#2330; &#2309;&#2357;&#2352;&#2379;&#2343; &#2313;&#2340;&#2381;&#2346;&#2344;&#2381;&#2344; &#2325;&#2352;&#2375;&#2404; &#2344;&#2367;&#2350;&#2381;&#2344;&#2354;&#2367;&#2326;&#2367;&#2340; &#2350;&#2375;&#2306; &#2360;&#2375; &#2325;&#2380;&#2344;-&#2360;&#2368; &#2319;&#2325; &#2360;&#2369;&#2352;&#2325;&#2381;&#2359;&#2367;&#2340; &#2360;&#2306;&#2330;&#2366;&#2352; &#2325;&#2368; &#2357;&#2367;&#2358;&#2375;&#2359;&#2340;&#2366; &#2361;&#2376; ?</span></p>\r\n<p><span style=\"font-family: Roboto;\">P: (Confidentiality)</span></p>\r\n<p><span style=\"font-family: Roboto;\">Q: (Accuracy)</span></p>\n",
                    options_en: ["<p>Neither P nor Q</p>\n", "<p>Only Q</p>\n", 
                                "<p>Both P and Q</p>\n", "<p>Only P</p>\n"],
                    options_hi: ["<p>&#2344; &#2340;&#2379; P &#2324;&#2352; &#2344; &#2361;&#2368; Q</p>\n", "<p>&#2325;&#2375;&#2357;&#2354; Q</p>\n",
                                "<p>&#2342;&#2379;&#2344;&#2379;&#2306; P &#2324;&#2352; Q</p>\n", "<p>&#2325;&#2375;&#2357;&#2354; P</p>\n"],
                    solution_en: "<p>17.(d)<span style=\"font-family: Roboto;\"> </span><span style=\"font-family: Roboto;\"><strong>Data confidentiality</strong> indicates the guarantee that data can be accessed and modified only by authorized entities. Not only users, but authorized entities may also access information, which requires an access control approach and authentication process for the device.</span></p>\n",
                    solution_hi: "<p><span style=\"font-family: Roboto;\">17.(d)</span><span style=\"font-family: Roboto;\"> </span><strong><span style=\"font-family: Palanquin Dark;\">&#2337;&#2375;&#2335;&#2366; &#2325;&#2377;&#2344;&#2381;&#2347;&#2367;&#2337;&#2375;&#2306;&#2335;&#2367;&#2310;&#2354;&#2368;</span></strong><span style=\"font-family: Palanquin Dark;\">(Data confidentiality) &#2311;&#2360; &#2327;&#2366;&#2352;&#2306;&#2335;&#2368; &#2325;&#2379; &#2311;&#2306;&#2327;&#2367;&#2340; &#2325;&#2352;&#2340;&#2368; &#2361;&#2376; &#2325;&#2367; &#2337;&#2375;&#2335;&#2366; &#2325;&#2379; &#2325;&#2375;&#2357;&#2354; &#2309;&#2343;&#2367;&#2325;&#2371;&#2340; &#2360;&#2306;&#2360;&#2381;&#2341;&#2366;&#2323;&#2306; &#2342;&#2381;&#2357;&#2366;&#2352;&#2366; &#2361;&#2368; &#2319;&#2325;&#2381;&#2360;&#2375;&#2360; &#2324;&#2352; &#2360;&#2306;&#2358;&#2379;&#2343;&#2367;&#2340; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366; &#2360;&#2325;&#2340;&#2366; &#2361;&#2376;&#2404; &#2344; &#2325;&#2375;&#2357;&#2354; &#2313;&#2346;&#2351;&#2379;&#2327;&#2325;&#2352;&#2381;&#2340;&#2366;, &#2348;&#2354;&#2381;&#2325;&#2367; &#2309;&#2343;&#2367;&#2325;&#2371;&#2340; &#2360;&#2306;&#2360;&#2381;&#2341;&#2366;&#2323;&#2306; &#2349;&#2368; &#2332;&#2366;&#2344;&#2325;&#2366;&#2352;&#2368; &#2340;&#2325; &#2346;&#2361;&#2369;&#2306;&#2330; &#2360;&#2325;&#2340;&#2368; &#2361;&#2376;&#2306;, &#2332;&#2367;&#2360;&#2325;&#2375; &#2354;&#2367;&#2319; &#2337;&#2367;&#2357;&#2366;&#2311;&#2360; &#2325;&#2375; &#2354;&#2367;&#2319; &#2319;&#2325;&#2381;&#2360;&#2375;&#2360; &#2325;&#2306;&#2335;&#2381;&#2352;&#2379;&#2354; &#2342;&#2371;&#2359;&#2381;&#2335;&#2367;&#2325;&#2379;&#2339; &#2324;&#2352; &#2346;&#2381;&#2352;&#2350;&#2366;&#2339;&#2368;&#2325;&#2352;&#2339; &#2346;&#2381;&#2352;&#2325;&#2381;&#2352;&#2367;&#2351;&#2366; &#2325;&#2368; &#2310;&#2357;&#2358;&#2381;&#2351;&#2325;&#2340;&#2366; &#2361;&#2379;&#2340;&#2368; &#2361;&#2376;&#2404;</span></p>\n",
                    correct: "d",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
                questions.push({
                    id: "18",
                    section: "31",
                    question_en: "<p><span style=\"font-family: Roboto;\">18. </span><span style=\"font-family: Roboto;\"> 8 Which of the following shortcut key is used to increase the font size to the next larger </span><span style=\"font-family: Roboto;\">point size available in the Font Size list box of MS-Word 2010?</span></p>\n",
                    question_hi: "<p><span style=\"font-family: Roboto;\">18.</span><span style=\"font-family: Palanquin;\"> MS - word 2010 &#2325;&#2375; &#2398;&#2377;&#2344;&#2381;&#2335; &#2360;&#2366;&#2311;&#2395; &#2354;&#2367;&#2360;&#2381;&#2335; &#2348;&#2377;&#2325;&#2381;&#2360; &#2350;&#2375;&#2306; &#2313;&#2346;&#2354;&#2348;&#2381;&#2343; &#2309;&#2327;&#2354;&#2375; &#2348;&#2396;&#2375; &#2346;&#2377;&#2311;&#2306;&#2335; &#2360;&#2366;&#2311;&#2395; &#2340;&#2325; &#2398;&#2377;&#2344;&#2381;&#2335; &#2360;&#2366;&#2311;&#2395; &#2325;&#2379; &#2348;&#2396;&#2366; &#2325;&#2352;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2344;&#2367;&#2350;&#2381;&#2344;&#2354;&#2367;&#2326;&#2367;&#2340; &#2350;&#2375;&#2306; &#2360;&#2375; &#2325;&#2367;&#2360; &#2358;&#2377;&#2352;&#2381;&#2335;&#2325;&#2335; &#2325;&#2368; (Key) &#2325;&#2366; &#2313;&#2346;&#2351;&#2379;&#2327; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376; ?</span></p>\n",
                    options_en: ["<p>Ctrl + Shift + &lt;</p>\n", "<p>Ctrl + Shift + F3</p>\n", 
                                "<p>Ctrl + Shift + &gt;</p>\n", "<p>Ctrl + Shift + F4</p>\n"],
                    options_hi: ["<p>Ctrl + Shift + &lt;</p>\n", "<p>Ctrl + Shift + F3</p>\n",
                                "<p>Ctrl + Shift + &gt;</p>\n", "<p>Ctrl + Shift + F4</p>\n"],
                    solution_en: "<p>18.(c)<span style=\"font-family: Roboto;\"> </span><strong><span style=\"font-family: Roboto;\">Ctrl + Shift + &gt;</span></strong><span style=\"font-family: Arial Unicode MS;\">&rarr; It is used to increase the font size.</span><strong><span style=\"font-family: Arial Unicode MS;\">Ctrl + Shift + &lt;</span></strong><span style=\"font-family: Arial Unicode MS;\">&rarr; It is used to decrease the font size.</span><strong><span style=\"font-family: Arial Unicode MS;\"> Ctrl Shift + F3</span></strong><span style=\"font-family: Arial Unicode MS;\">&rarr;The Microsoft docs tell us that once you get to the final dialog after the last boot during the Windows install process, one can </span><strong><span style=\"font-family: Arial Unicode MS;\">enter Audit mode</span></strong><span style=\"font-family: Arial Unicode MS;\"> using Ctrl + Shift + F3 keys. </span><strong><span style=\"font-family: Arial Unicode MS;\">Ctrl + Shift + F4</span></strong><span style=\"font-family: Arial Unicode MS;\">&rarr; </span><span style=\"font-family: Arial Unicode MS;\"> This shortcut commands will make the \'find go\' in reverse to locate the previous cell.</span></p>\n",
                    solution_hi: "<p>18.(c)<strong><span style=\"font-family: Arial Unicode MS;\"> </span><span style=\"font-family: Arial Unicode MS;\">Ctrl + Shift + &gt;</span></strong><span style=\"font-family: Arial Unicode MS;\">&rarr; &#2311;&#2360;&#2325;&#2366; &#2313;&#2346;&#2351;&#2379;&#2327; &#2347;&#2377;&#2344;&#2381;&#2335; &#2360;&#2366;&#2311;&#2332; &#2325;&#2379; &#2348;&#2338;&#2364;&#2366;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404; </span></p>\r\n<p><strong><span style=\"font-family: Arial Unicode MS;\">Ctrl + Shift + &lt;</span></strong><span style=\"font-family: Arial Unicode MS;\">&rarr; &#2311;&#2360;&#2325;&#2366; &#2313;&#2346;&#2351;&#2379;&#2327; &#2347;&#2377;&#2344;&#2381;&#2335; &#2360;&#2366;&#2311;&#2332; &#2325;&#2379; &#2325;&#2350; &#2325;&#2352;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404; </span><strong><span style=\"font-family: Arial Unicode MS;\">Ctrl + Shift + F3</span></strong><span style=\"font-family: Arial Unicode MS;\"><strong> &rarr;</strong> Microsoft &#2337;&#2377;&#2325;&#2381;&#2360; &#2361;&#2350;&#2375;&#2306; &#2348;&#2340;&#2366;&#2340;&#2366; &#2361;&#2376; &#2325;&#2367; &#2319;&#2325; &#2348;&#2366;&#2352; &#2332;&#2348; &#2310;&#2346; &#2357;&#2367;&#2306;&#2337;&#2379;&#2332; &#2311;&#2306;&#2360;&#2381;&#2335;&#2366;&#2354; &#2346;&#2381;&#2352;&#2325;&#2381;&#2352;&#2367;&#2351;&#2366; &#2325;&#2375; &#2342;&#2380;&#2352;&#2366;&#2344; &#2309;&#2306;&#2340;&#2367;&#2350; &#2348;&#2370;&#2335; &#2325;&#2375; &#2348;&#2366;&#2342; &#2309;&#2306;&#2340;&#2367;&#2350; &#2337;&#2366;&#2351;&#2354;&#2377;&#2327; &#2346;&#2352; &#2346;&#2361;&#2369;&#2306;&#2330; &#2332;&#2366;&#2340;&#2375; &#2361;&#2376;&#2306;, &#2340;&#2379; &#2325;&#2379;&#2312; &#2357;&#2381;&#2351;&#2325;&#2381;&#2340;&#2367; Ctrl + Shift + F3 &#2325;&#2368;&#2395; &#2325;&#2366; &#2313;&#2346;&#2351;&#2379;&#2327; &#2325;&#2352;&#2325;&#2375; &#2321;&#2337;&#2367;&#2335; &#2350;&#2379;&#2337; &#2350;&#2375;&#2306; &#2346;&#2381;&#2352;&#2357;&#2375;&#2358; &#2325;&#2352; &#2360;&#2325;&#2340;&#2366; &#2361;&#2376;&#2404;<strong> </strong></span><strong><span style=\"font-family: Arial Unicode MS;\">Ctrl + Shift + F4</span></strong><span style=\"font-family: Arial Unicode MS;\"><strong> </strong>&rarr; &#2351;&#2361; &#2358;&#2377;&#2352;&#2381;&#2335;&#2325;&#2335; &#2325;&#2350;&#2366;&#2306;&#2337; &#2346;&#2367;&#2331;&#2354;&#2375; &#2360;&#2375;&#2354; &#2325;&#2366; &#2346;&#2340;&#2366; &#2354;&#2327;&#2366;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; \'&#2347;&#2366;&#2311;&#2306;&#2337; &#2327;&#2379;(Find Go)\' &#2325;&#2379; &#2352;&#2367;&#2357;&#2352;&#2381;&#2360; (Reverse) &#2325;&#2352; &#2342;&#2375;&#2327;&#2366;&#2404; </span></p>\n",
                    correct: "c",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
                questions.push({
                    id: "19",
                    section: "31",
                    question_en: "<p><span style=\"font-family: Roboto;\">19.</span><span style=\"font-family: Roboto;\"> Consider the following word written in a MS-Word 2010 document:</span></p>\r\n<p><span style=\"font-family: Roboto;\"> </span><span style=\"font-family: Roboto;\">Prestige </span></p>\r\n<p><span style=\"font-family: Roboto;\">Which of the following is correct regarding the given word?</span></p>\n",
                    question_hi: "<p><span style=\"font-family: Roboto;\">19. </span><span style=\"font-family: Palanquin;\">&#2319;&#2350;&#2319;&#2360;-&#2357;&#2352;&#2381;&#2337; 2010 &#2337;&#2377;&#2325;&#2381;&#2351;&#2370;&#2350;&#2375;&#2306;&#2335; &#2350;&#2375;&#2306; &#2354;&#2367;&#2326;&#2375; &#2327;&#2319; &#2344;&#2367;&#2350;&#2381;&#2344;&#2354;&#2367;&#2326;&#2367;&#2340; &#2358;&#2348;&#2381;&#2342; &#2346;&#2352; &#2357;&#2367;&#2330;&#2366;&#2352; &#2325;&#2352;&#2375;&#2306;: </span></p>\r\n<p><span style=\"font-family: Roboto;\">Prestige </span></p>\r\n<p><span style=\"font-family: Palanquin;\">&#2342;&#2367;&#2319; &#2327;&#2319; &#2358;&#2348;&#2381;&#2342; &#2325;&#2375; &#2360;&#2350;&#2381;&#2348;&#2344;&#2381;&#2343; &#2350;&#2375;&#2306; &#2344;&#2367;&#2350;&#2381;&#2344;&#2354;&#2367;&#2326;&#2367;&#2340; &#2350;&#2375;&#2306; &#2360;&#2375; &#2325;&#2380;&#2344; &#2360;&#2366; &#2325;&#2341;&#2344; &#2360;&#2361;&#2368; &#2361;&#2376;?</span></p>\n",
                    options_en: ["<p>The word is bold as well as italic</p>\n", "<p>The word is italic and has a strike through.</p>\n", 
                                "<p>The word is italic.</p>\n", "<p>The word has a strikethrough</p>\n"],
                    options_hi: ["<p>&#2351;&#2361; &#2358;&#2348;&#2381;&#2342; &#2348;&#2379;&#2354;&#2381;&#2337; &#2361;&#2379;&#2344;&#2375; &#2325;&#2375; &#2360;&#2366;&#2341;-&#2360;&#2366;&#2341; &#2311;&#2335;&#2366;&#2354;&#2367;&#2325; &#2349;&#2368; &#2361;&#2376;</p>\n", "<p>&#2358;&#2348;&#2381;&#2342; &#2311;&#2335;&#2376;&#2354;&#2367;&#2325; &#2361;&#2376; &#2324;&#2352; &#2311;&#2360;&#2350;&#2375;&#2306; &#2360;&#2381;&#2335;&#2381;&#2352;&#2367;&#2325;&#2341;&#2381;&#2352;&#2370; &#2361;&#2376;</p>\n",
                                "<p>&#2358;&#2348;&#2381;&#2342; &#2311;&#2335;&#2376;&#2354;&#2367;&#2325; &#2361;&#2376;</p>\n", "<p>&#2358;&#2348;&#2381;&#2342; &#2350;&#2375;&#2306; &#2319;&#2325; &#2360;&#2381;&#2335;&#2381;&#2352;&#2367;&#2325;&#2341;&#2381;&#2352;&#2370; &#2361;&#2376;</p>\n"],
                    solution_en: "<p>19.(d) <span style=\"font-family: Palanquin;\">The word strikethrough is the correct answer.</span></p>\n",
                    solution_hi: "<p>19.(d)<span style=\"font-family: Palanquin Dark;\"> &#2360;&#2381;&#2335;&#2381;&#2352;&#2366;&#2311;&#2325;&#2341;&#2381;&#2352;&#2370; &#2358;&#2348;&#2381;&#2342; &#2360;&#2361;&#2368; &#2313;&#2340;&#2381;&#2340;&#2352; &#2361;&#2376;&#2404;</span></p>\n",
                    correct: "d",
                    pos_marks: 3.0,

                questions.push({
                    id: "20",
                    section: "misc",
                    question_en: "<p><span style=\"font-family: Roboto;\">20. </span><span style=\"font-family: Roboto;\">Which of the following refers to a huge database of Internet resources such as </span><span style=\"font-family: Roboto;\">webpages, newsgroups, programs, images etc. and helps to locate information on </span><span style=\"font-family: Roboto;\">World Wide Web?</span></p>\n",
                    question_hi: "<p><span style=\"font-family: Roboto;\">20.</span><span style=\"font-family: Palanquin;\"> &#2344;&#2367;&#2350;&#2381;&#2344;&#2354;&#2367;&#2326;&#2367;&#2340; &#2350;&#2375;&#2306; &#2360;&#2375; &#2325;&#2380;&#2344;-&#2360;&#2366; &#2357;&#2367;&#2325;&#2354;&#2381;&#2346; &#2311;&#2306;&#2335;&#2352;&#2344;&#2375;&#2335; &#2360;&#2306;&#2360;&#2366;&#2343;&#2344;&#2379;&#2306; &#2332;&#2376;&#2360;&#2375; &#2357;&#2375;&#2348;&#2346;&#2375;&#2332;&#2379;&#2306;, &#2360;&#2350;&#2366;&#2330;&#2366;&#2352;, &#2360;&#2350;&#2370;&#2361;&#2379;&#2306;, &#2346;&#2381;&#2352;&#2379;&#2327;&#2381;&#2352;&#2366;&#2350;&#2379;, &#2331;&#2357;&#2367;&#2351;&#2379;&#2306;, &#2310;&#2342;&#2367; &#2325;&#2375; &#2357;&#2367;&#2358;&#2366;&#2354; &#2337;&#2375;&#2335;&#2366;&#2348;&#2375;&#2360; &#2325;&#2379; &#2360;&#2306;&#2342;&#2352;&#2381;&#2349;&#2367;&#2340; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376; &#2324;&#2352; &#2357;&#2352;&#2381;&#2354;&#2381;&#2337; &#2357;&#2366;&#2311;&#2337; &#2357;&#2375;&#2348; &#2346;&#2352; &#2332;&#2366;&#2344;&#2325;&#2366;&#2352;&#2368; &#2326;&#2379;&#2332;&#2344;&#2375; &#2350;&#2375;&#2306; &#2350;&#2342;&#2342; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376; ?</span></p>\n",
                    options_en: ["<p>Protocols</p>\n", "<p>Web server</p>\n", 
                                "<p>Search engine</p>\n", "<p>Domain</p>\n"],
                    options_hi: ["<p><span style=\"font-weight: 400;\">&#2346;&#2381;&#2352;&#2379;&#2335;&#2379;&#2325;&#2377;&#2354;&nbsp; (Protocols)</span></p>\n", "<p><span style=\"font-weight: 400;\">&#2357;&#2375;&#2348; &#2360;&#2352;&#2381;&#2357;&#2352; (Web server)</span></p>\n",
                                "<p><span style=\"font-weight: 400;\">&#2360;&#2352;&#2381;&#2330; &#2311;&#2306;&#2332;&#2344; (Search engine)</span></p>\n", "<p><span style=\"font-weight: 400;\">&#2337;&#2379;&#2350;&#2375;&#2344; (Domain)</span></p>\n"],
                    solution_en: "<p>20.(c)<span style=\"font-family: Roboto;\"> A<strong> </strong></span><strong><span style=\"font-family: Roboto;\">search engine</span></strong><span style=\"font-family: Roboto;\"><strong> </strong>is a web-based tool that enables users to locate information on the World Wide Web. Popular examples of search engines are Google, Yahoo!, and MSN Search. </span><strong><span style=\"font-family: Roboto;\">Protocols</span></strong><span style=\"font-family: Arial Unicode MS;\"><strong>&rarr;</strong> A network protocol is </span><span style=\"font-family: Arial Unicode MS;\">an established set of rules that determine how data is transmitted between different devices in the same network. </span><strong><span style=\"font-family: Arial Unicode MS;\">Web server</span></strong><span style=\"font-family: Arial Unicode MS;\">&rarr; </span><span style=\"font-family: Arial Unicode MS;\">A web server connects to the Internet and supports physical data interchange with other devices connected to the web. </span><strong><span style=\"font-family: Arial Unicode MS;\">Domain</span></strong><span style=\"font-family: Arial Unicode MS;\"><strong>&rarr;</strong> </span><span style=\"font-family: Arial Unicode MS;\">A domain is one part of a complete web address, or URL. A URL typically consists of a protocol, domain name, and path. For example, </span><strong><span style=\"font-family: Arial Unicode MS;\">blog.hubspot.com.</span></strong></p>\n",
                    solution_hi: "<p>20.(c)<span style=\"font-family: Arial Unicode MS;\"> </span><strong><span style=\"font-family: Palanquin Dark;\">&#2360;&#2352;&#2381;&#2330; &#2311;&#2306;&#2332;&#2344;</span></strong><span style=\"font-family: Palanquin Dark;\"> (Search engine) &#2319;&#2325; &#2357;&#2375;&#2348;-&#2310;&#2343;&#2366;&#2352;&#2367;&#2340; &#2335;&#2370;&#2354; &#2361;&#2376; &#2332;&#2379; &#2313;&#2346;&#2351;&#2379;&#2327;&#2325;&#2352;&#2381;&#2340;&#2366;&#2323;&#2306; &#2325;&#2379; &#2357;&#2352;&#2381;&#2354;&#2381;&#2337; &#2357;&#2366;&#2311;&#2337; &#2357;&#2375;&#2348; &#2346;&#2352; &#2332;&#2366;&#2344;&#2325;&#2366;&#2352;&#2368; &#2325;&#2366; &#2346;&#2340;&#2366; &#2354;&#2327;&#2366;&#2344;&#2375; &#2350;&#2375;&#2306; &#2360;&#2325;&#2381;&#2359;&#2350; &#2348;&#2344;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404; &#2327;&#2370;&#2327;&#2354;, &#2351;&#2366;&#2361;&#2370;!, &#2324;&#2352; msn search &#2360;&#2352;&#2381;&#2330; &#2311;&#2306;&#2332;&#2344; &#2325;&#2375; &#2354;&#2379;&#2325;&#2346;&#2381;&#2352;&#2367;&#2351; &#2313;&#2342;&#2366;&#2361;&#2352;&#2339; &#2361;&#2376;&#2306;&#2404; </span><span style=\"font-family: Palanquin Dark;\"><strong>&#2346;&#2381;&#2352;&#2379;&#2335;&#2379;&#2325;&#2377;&#2354;</strong> </span><span style=\"font-family: Arial Unicode MS;\">(Protocol) &rarr; &#2319;&#2325; &#2344;&#2375;&#2335;&#2357;&#2352;&#2381;&#2325; &#2346;&#2381;&#2352;&#2379;&#2335;&#2379;&#2325;&#2377;&#2354; &#2344;&#2367;&#2351;&#2350;&#2379;&#2306; &#2325;&#2366; &#2319;&#2325; &#2360;&#2381;&#2341;&#2366;&#2346;&#2367;&#2340; &#2360;&#2375;&#2335; &#2361;&#2376; &#2332;&#2379; &#2351;&#2361; &#2344;&#2367;&#2352;&#2381;&#2343;&#2366;&#2352;&#2367;&#2340; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376; &#2325;&#2367; &#2319;&#2325; &#2361;&#2368; &#2344;&#2375;&#2335;&#2357;&#2352;&#2381;&#2325; &#2350;&#2375;&#2306; &#2357;&#2367;&#2349;&#2367;&#2344;&#2381;&#2344; &#2337;&#2367;&#2357;&#2366;&#2311;&#2360; &#2325;&#2375; &#2348;&#2368;&#2330; &#2337;&#2375;&#2335;&#2366; &#2325;&#2376;&#2360;&#2375; &#2346;&#2381;&#2352;&#2360;&#2366;&#2352;&#2367;&#2340; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404; </span><span style=\"font-family: Palanquin Dark;\"><strong>&#2357;&#2375;&#2348; &#2360;&#2352;&#2381;&#2357;&#2352;</strong> </span><span style=\"font-family: Arial Unicode MS;\">&rarr; &#2319;&#2325; &#2357;&#2375;&#2348; &#2360;&#2352;&#2381;&#2357;&#2352; &#2311;&#2306;&#2335;&#2352;&#2344;&#2375;&#2335; &#2360;&#2375; &#2325;&#2344;&#2375;&#2325;&#2381;&#2335;&#2375;&#2337; &#2361;&#2376; &#2324;&#2352; &#2357;&#2375;&#2348; &#2360;&#2375; &#2332;&#2369;&#2337;&#2364;&#2375; &#2309;&#2344;&#2381;&#2351; &#2313;&#2346;&#2325;&#2352;&#2339;&#2379;&#2306; &#2325;&#2375; &#2360;&#2366;&#2341; &#2349;&#2380;&#2340;&#2367;&#2325; &#2337;&#2375;&#2335;&#2366; &#2311;&#2306;&#2335;&#2352;&#2330;&#2375;&#2306;&#2332; &#2325;&#2366; &#2360;&#2350;&#2352;&#2381;&#2341;&#2344; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376;&#2404; </span><span style=\"font-family: Palanquin Dark;\"><strong>&#2337;&#2379;&#2350;&#2375;&#2344;</strong> </span><span style=\"font-family: Arial Unicode MS;\">&rarr; &#2319;&#2325; &#2337;&#2379;&#2350;&#2375;&#2344; &#2319;&#2325; &#2360;&#2306;&#2346;&#2370;&#2352;&#2381;&#2339; &#2357;&#2375;&#2348; &#2319;&#2337;&#2381;&#2352;&#2375;&#2360; &#2351;&#2366; URL&#2325;&#2366; &#2319;&#2325; &#2361;&#2367;&#2360;&#2381;&#2360;&#2366; &#2361;&#2376;&#2404; URL &#2350;&#2375;&#2306; &#2310;&#2350;&#2340;&#2380;&#2352; &#2346;&#2352; &#2319;&#2325; &#2346;&#2381;&#2352;&#2379;&#2335;&#2379;&#2325;&#2377;&#2354;, &#2337;&#2379;&#2350;&#2375;&#2344; &#2344;&#2366;&#2350; &#2324;&#2352; &#2346;&#2366;&#2341; (path) &#2361;&#2379;&#2340;&#2366; &#2361;&#2376;&#2404; &#2313;&#2342;&#2366;&#2361;&#2352;&#2339; &#2325;&#2375; &#2354;&#2367;&#2319;, <strong>blog.hubspot.com</strong>&#2404;</span></p>\n",
                    correct: "c",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
            
            // Generate question boxes
            const boxesContainer = document.getElementById('question-boxes');
            questions.forEach((q, index) => {
                const box = document.createElement('div');
                box.className = 'q-box';
                box.textContent = index + 1;
                box.onclick = () => showQuestion(index);
                box.id = `box-${index}`;
                boxesContainer.appendChild(box);
            });
            
            // Show first question
            showQuestion(0);
            updateProgress();
        }
        
        // Show a specific question
        
        function formatContent(text) {
            if (!text) return '';
            return text.replace(/<img/g, '<img style="max-width:100%;height:auto;"');
        }
        
        function showQuestion(index) {
            if (index < 0 || index >= questions.length) return;
            
            currentQuestion = index;
            const question = questions[index];
            
            // Update question counter
            document.getElementById('question-counter').textContent = `Question ${index + 1} of ${questions.length}`;
            
            // Update question boxes
            document.querySelectorAll('.q-box').forEach(box => box.classList.remove('current'));
            document.getElementById(`box-${index}`).classList.add('current');
            
            // Generate question HTML
            let html = `
                <div class="question-card">
                    <div class="question-text">
                        <div class="en">${formatContent(question.question_en)}</div>
                        <div class="hi" style="display:none">${formatContent(question.question_hi)} </div>
                    </div>
                    <div class="options" id="options-container">`;
            
            // Add options
            ['a', 'b', 'c', 'd'].forEach((opt, i) => {
                let optionClass = '';
                let isCorrectAnswer = opt === question.correct;
                let isUserAnswer = answers[question.id] === opt;
                
                // When reviewing, add appropriate classes
                if (submitted) {
                    if (isCorrectAnswer) {
                        optionClass += ' correct-answer';
                    } else if (isUserAnswer && !isCorrectAnswer) {
                        optionClass += ' incorrect';
                    }
                }
                
                html += `
                    <div class="option-item">
                        <input class="option-input" type="radio" name="q${index}" 
                            id="opt-${index}-${opt}" value="${opt}" 
                            ${isUserAnswer ? 'checked' : ''}
                            onclick="selectAnswer('${question.id}', '${opt}')">
                       <label class="option-label${optionClass}" for="opt-${index}-${opt}">
                            <div class="en">${question.options_en[i]}</div>
                            <div class="hi" style="display:none">${question.options_hi[i]}</div>
                        </label>
                    </div>`;
            });
            
            // Add solution if submitted
            if (submitted) {
                const isCorrect = answers[question.id] === question.correct;
                const resultText = answers[question.id] ? (isCorrect ? 'Correct!' : 'Incorrect!') : 'Not attempted';
                
                html += `
                    <div class="solution-container">
                        <div class="solution-title">${resultText}</div>
                        <div class="solution-text">
                            <div class="en">${question.solution_en}</div>
                            <div class="hi" style="display:none">${question.solution_hi}</div>
                        </div>
                    </div>`;
            }
            
            html += `</div></div>`;
            
            document.getElementById('questions-container').innerHTML = html;
            
            // Apply language settings
            applyLanguage();
            
            // If in mobile view, close the menu
            if (window.innerWidth < 992) {
                toggleNav(false);
            }
            
            // Add review mode class if submitted
            if (submitted) {
                document.getElementById('options-container').classList.add('review-mode');
            }
        }
        
        // Apply current language
        function applyLanguage() {
            document.querySelectorAll(`.${currentLang}`).forEach(el => el.style.display = 'block');
            document.querySelectorAll(`.${currentLang === 'en' ? 'hi' : 'en'}`).forEach(el => el.style.display = 'none');
            
            // Update language button text
            document.getElementById('lang-text').textContent = currentLang === 'en' ? 'Hi' : 'En';
        }
        
        // Select an answer
        function selectAnswer(qId, option) {
            if (submitted) return;
            
            answers[qId] = option;
            updateProgress();
            
            // Mark question as attempted in the navigation
            const index = questions.findIndex(q => q.id === qId);
            if (index >= 0) {
                const box = document.getElementById(`box-${index}`);
                box.classList.add('attempted');
                box.classList.remove('unattempted');
            }
        }
        
        // Navigate to previous/next question
        function prevQuestion() { 
            if (currentQuestion > 0) showQuestion(currentQuestion - 1); 
        }
        
        function nextQuestion() { 
            if (currentQuestion < questions.length - 1) showQuestion(currentQuestion + 1); 
        }
        
        // Switch section
        function switchSection(sectionId) {
            if (sectionId === 'all') {
                showQuestion(0);
                return;
            }
            
            const section = sections[sectionId];
            if (section) showQuestion(section.start);
        }
        
        // Toggle language
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            applyLanguage();
        }
        
        // Toggle navigation sidebar
        function toggleNav(show) {
            const nav = document.getElementById('question-nav');
            const overlay = document.getElementById('nav-overlay');
            
            if (show === undefined) {
                show = !nav.classList.contains('show');
            }
            
            if (show) {
                nav.classList.add('show');
                overlay.classList.add('show');
                document.body.style.overflow = 'hidden';
            } else {
                nav.classList.remove('show');
                overlay.classList.remove('show');
                document.body.style.overflow = '';
            }
        }
        
        // Update progress
        function updateProgress() {
            const attempted = Object.keys(answers).length;
            document.getElementById('attempted-count').textContent = attempted;
        }
        
        // Start timer
        function startTimer() {
            const timerDisplay = document.getElementById('timer-display');
            let timeLeft = totalTime;
            
            const timerInterval = setInterval(() => {
                if (timeLeft <= 0 || submitted) {
                    clearInterval(timerInterval);
                    if (!submitted) submitTest();
                    return;
                }
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                timeLeft--;
            }, 1000);
        }
        
        // Confirm before submitting
        function confirmSubmit() {
            if (submitted) return;
            
            const attempted = Object.keys(answers).length;
            const remaining = questions.length - attempted;
            
            // Create a more modern confirmation dialog
            const confirmHtml = `
                <div style="text-align: center; padding: 20px;">
                    <h4 style="margin-bottom: 16px; color: var(--dark);">Confirm Submission</h4>
                    <p style="margin-bottom: 24px; color: var(--gray);">
                        You have attempted ${attempted} of ${questions.length} questions.<br>
                        ${remaining} questions are unattempted.
                    </p>
                    <div style="display: flex; justify-content: center; gap: 12px;">
                        <button onclick="this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; border: 1px solid var(--light-gray); background: white; border-radius: 8px; cursor: pointer;">
                            Cancel
                        </button>
                        <button onclick="submitTest(); this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer;">
                            Submit Test
                        </button>
                    </div>
                </div>`;
            
            // Create modal element
            const modal = document.createElement('div');
            modal.className = 'results-modal show';
            modal.innerHTML = `
                <div class="results-card" style="max-width: 400px;">
                    <button class="cancel-btn" style="position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--gray);" onclick="this.closest('.results-modal').remove()">
                        ×
                    </button>
                    ${confirmHtml}
                </div>`;
            
            document.body.appendChild(modal);
        }
        
        // Submit test
        function submitTest() {
            if (submitted) return;
            
            submitted = true;
            
            let score = 0;
            let correctCount = 0;
            let incorrectCount = 0;
            let unattemptedCount = 0;
            
            questions.forEach((q, index) => {
                const userAns = answers[q.id];
                const box = document.getElementById(`box-${index}`);
                
                box.classList.remove('attempted');
                
                if (!userAns) {
                    unattemptedCount++;
                    box.classList.add('unattempted');
                } else if (userAns === q.correct) {
                    correctCount++;
                    score += q.pos_marks;
                    box.classList.add('correct');
                } else {
                    incorrectCount++;
                    score -= q.neg_marks;
                    box.classList.add('incorrect');
                }
            });
            
            // Update result values
            document.getElementById('score-value').textContent = score.toFixed(2);
            document.getElementById('correct-value').textContent = correctCount;
            document.getElementById('incorrect-value').textContent = incorrectCount;
            document.getElementById('unattempted-value').textContent = unattemptedCount;
            
            // Show the results modal
            document.getElementById('results-modal').classList.add('show');
            
            // Disable submit button
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-check"></i>';
            submitBtn.style.backgroundColor = 'var(--success)';
            
            // Refresh current question view to show solution
            showQuestion(currentQuestion);
        }
        
        // Review test
        function reviewTest() {
            document.getElementById('results-modal').classList.remove('show');
            showQuestion(0);
        }
        
        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('results-modal')) {
                document.getElementById('results-modal').classList.remove('show');
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === 'ArrowRight') nextQuestion();
        });
    </script>
</body>
</html>
