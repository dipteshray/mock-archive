                                "<p>&nbsp;<span style=\"font-weight: 400;\">&#2360;&#2369;&#2346;&#2352; &#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; (Supercomputer)</span></p>\r\n<p>&nbsp;</p>\r\n<p>&nbsp;</p>\n", "<p><span style=\"font-weight: 400;\">&nbsp;</span><span style=\"font-weight: 400;\"> &#2350;&#2366;&#2311;&#2325;&#2381;&#2352;&#2379; &#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; (Microcomputer)</span></p>\r\n<p>&nbsp;</p>\n"],
                    solution_en: "<p>16.(a) <strong>Special purpose</strong><span style=\"font-family: Cambria Math;\"> computer is used in automatic aircraft landing</span><span style=\"font-family: Cambria Math;\">.</span></p>\n",
                    solution_hi: "<p>16.(a) <span style=\"font-family: Cambria Math;\">&#2321;&#2335;&#2379;&#2350;&#2375;&#2335;&#2367;&#2325; &#2319;&#2351;&#2352;&#2325;&#2381;&#2352;&#2366;&#2347;&#2381;&#2335; &#2354;&#2376;&#2306;&#2337;&#2367;&#2306;&#2327; &#2350;&#2375;&#2306; </span><strong><span style=\"font-family: Cambria Math;\">&#2360;&#2381;&#2346;&#2375;&#2358;&#2354; &#2346;&#2352;&#2381;&#2346;&#2360;</span><span style=\"font-family: Cambria Math;\"> </span></strong><span style=\"font-family: Cambria Math;\">&#2325;&#2375; &#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; &#2325;&#2366; &#2313;&#2346;&#2351;&#2379;&#2327; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\n",
                    correct: "a",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
                questions.push({
                    id: "17",
                    section: "31",
                    question_en: "<p>17. <span style=\"font-family: Cambria Math;\">Which of the following connected components inside the Motherboard like CPU and system memory.</span></p>\n",
                    question_hi: "<p>17.<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2344;&#2367;&#2350;&#2381;&#2344;&#2354;&#2367;&#2326;&#2367;&#2340; &#2350;&#2375;&#2306; &#2360;&#2375; &#2325;&#2380;&#2344; &#2360;&#2375; &#2325;&#2306;&#2346;&#2379;&#2344;&#2375;&#2306;&#2335;&#2381;&#2360; &#2350;&#2342;&#2352;&#2348;&#2379;&#2352;&#2381;&#2337; &#2325;&#2375; &#2309;&#2306;&#2342;&#2352; </span><span style=\"font-family: Cambria Math;\">CPU </span><span style=\"font-family: Cambria Math;\">&#2324;&#2352; &#2360;&#2367;&#2360;&#2381;&#2335;&#2350; &#2350;&#2375;&#2350;&#2379;&#2352;&#2368; &#2332;&#2376;&#2360;&#2375; &#2332;&#2369;&#2337;&#2364;&#2375; &#2361;&#2369;&#2319; &#2361;&#2376;&#2306;&#2404;</span></p>\n",
                    options_en: ["<p>Internal bus</p>\n", "<p>Data bus</p>\n", 
                                "<p>Address bus</p>\n", "<p>External bus</p>\n"],
                    options_hi: ["<p><span style=\"font-weight: 400;\">&nbsp;&#2311;&#2306;&#2335;&#2352;&#2344;&#2354; &#2348;&#2360; (Internal bus)</span></p>\r\n<p>&nbsp;</p>\n", "<p>&nbsp;</p>\r\n<p><span style=\"font-weight: 400;\">&nbsp;&#2337;&#2375;&#2335;&#2366; &#2348;&#2360; (Data bus)</span></p>\r\n<p>&nbsp;</p>\r\n<p>&nbsp;</p>\n",
                                "<p><span style=\"font-weight: 400;\">&#2319;&#2337;&#2381;&#2352;&#2375;&#2360; &#2348;&#2360; (Address bus)</span><span style=\"font-weight: 400;\">)</span></p>\n", "<p><span style=\"font-weight: 400;\">&#2319;&#2325;&#2381;&#2360;&#2335;&#2352;&#2381;&#2344;&#2354; &#2348;&#2360; (External bus)</span></p>\n"],
                    solution_en: "<p>17.(a)<strong><span style=\"font-family: Cambria Math;\"> The </span><span style=\"font-family: Cambria Math;\">internal bus</span></strong><span style=\"font-family: Cambria Math;\"><strong> </strong>connects components inside the motherboard likeCPU and system memory. It is also called the</span><span style=\"font-family: Cambria Math;\"> <strong>system bus.</strong></span></p>\r\n<p><span style=\"font-family: Cambria Math;\">Data bus &rarr; </span><span style=\"font-family: Cambria Math;\">The data to be transferred is carried by the data bus.</span></p>\r\n<p><span style=\"font-family: Cambria Math;\"><strong> Address bus</strong> &rarr; </span><span style=\"font-family: Cambria Math;\">The address of I/O devices or memory is carried by the address bus.</span></p>\r\n<p><span style=\"font-family: Cambria Math;\"><strong>External Bus</strong> &rarr; </span><span style=\"font-family: Cambria Math;\">It connects the different external devices; peripherals, expansion slots, I/O ports and drive connections to the rest of the computer. It is also referred to as the expansion bus.</span></p>\n",
                    solution_hi: "<p>17.(a)<span style=\"font-family: Cambria Math;\"> </span><strong><span style=\"font-family: Cambria Math;\">&#2311;&#2306;&#2335;&#2352;&#2344;&#2354; &#2348;&#2360;</span></strong><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2350;&#2342;&#2352;&#2348;&#2379;&#2352;&#2381;&#2337; &#2325;&#2375; &#2309;&#2306;&#2342;&#2352; </span><span style=\"font-family: Cambria Math;\">CPU </span><span style=\"font-family: Cambria Math;\">&#2324;&#2352; &#2360;&#2367;&#2360;&#2381;&#2335;&#2350; &#2350;&#2375;&#2350;&#2379;&#2352;&#2368; &#2332;&#2376;&#2360;&#2375; &#2325;&#2306;&#2346;&#2379;&#2344;&#2375;&#2306;&#2335;&#2381;&#2360; &#2325;&#2379; &#2332;&#2379;&#2337;&#2364;&#2340;&#2368; &#2361;&#2376;&#2404; &#2311;&#2360;&#2375;</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2360;&#2367;&#2360;&#2381;&#2335;&#2350; &#2348;&#2360; </span><span style=\"font-family: Cambria Math;\">&#2349;&#2368; &#2325;&#2361;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\r\n<p><strong><span style=\"font-family: Cambria Math;\">&#2337;&#2375;&#2335;&#2366; &#2348;&#2360; </span></strong><span style=\"font-family: Cambria Math;\">&rarr; </span><span style=\"font-family: Cambria Math;\">&#2335;&#2381;&#2352;&#2366;&#2306;&#2360;&#2347;&#2352; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2344;&#2375; &#2357;&#2366;&#2354;&#2366; &#2337;&#2375;&#2335;&#2366; &#2337;&#2375;&#2335;&#2366; &#2348;&#2360; &#2342;&#2381;&#2357;&#2366;&#2352;&#2366; &#2354;&#2375; &#2332;&#2366;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\r\n<p><strong><span style=\"font-family: Cambria Math;\">&#2319;&#2337;&#2381;&#2352;&#2375;&#2360; &#2348;&#2360;</span></strong><span style=\"font-family: Cambria Math;\"><strong> </strong>&rarr; I/O </span><span style=\"font-family: Cambria Math;\">&#2337;&#2367;&#2357;&#2366;&#2311;&#2360; &#2351;&#2366; &#2350;&#2375;&#2350;&#2379;&#2352;&#2368; &#2325;&#2366; &#2319;&#2337;&#2381;&#2352;&#2375;&#2360; &#2319;&#2337;&#2381;&#2352;&#2375;&#2360; &#2348;&#2360; &#2342;&#2381;&#2357;&#2366;&#2352;&#2366; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\r\n<p><span style=\"font-family: Cambria Math;\"><strong>&#2319;&#2325;&#2381;&#2360;&#2335;&#2352;&#2381;&#2344;&#2354; &#2348;&#2360;</strong> </span><span style=\"font-family: Cambria Math;\">&rarr; </span><span style=\"font-family: Cambria Math;\">&#2351;&#2361; &#2357;&#2367;&#2349;&#2367;&#2344;&#2381;&#2344; &#2319;&#2325;&#2381;&#2360;&#2335;&#2352;&#2381;&#2344;&#2354; &#2337;&#2367;&#2357;&#2366;&#2311;&#2360; &#2325;&#2379; &#2332;&#2379;&#2337;&#2364;&#2340;&#2366; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">; </span><span style=\"font-family: Cambria Math;\">&#2346;&#2375;&#2352;&#2367;&#2347;&#2375;&#2352;&#2354;&#2381;&#2360;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2319;&#2325;&#2381;&#2360;&#2346;&#2375;&#2306;&#2358;&#2344; &#2360;&#2381;&#2354;&#2377;&#2335;&#2381;&#2360;</span><span style=\"font-family: Cambria Math;\">, I/O </span><span style=\"font-family: Cambria Math;\">&#2346;&#2379;&#2352;&#2381;&#2335;&#2381;&#2360; &#2324;&#2352; &#2348;&#2366;&#2325;&#2368; &#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; &#2360;&#2375; &#2337;&#2381;&#2352;&#2366;&#2311;&#2357; &#2325;&#2344;&#2375;&#2325;&#2381;&#2358;&#2344;&#2404; &#2311;&#2360;&#2375; &#2319;&#2325;&#2381;&#2360;&#2346;&#2375;&#2306;&#2358;&#2344; &#2348;&#2360; </span><span style=\"font-family: Cambria Math;\">(expansion bus) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2375; &#2352;&#2370;&#2346; &#2350;&#2375;&#2306; &#2349;&#2368; &#2332;&#2366;&#2344;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404;</span><span style=\"font-family: Cambria Math;\"> </span></p>\n",
                    correct: "a",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
                questions.push({
                    id: "18",
                    section: "31",
                    question_en: "<p>18. <span style=\"font-family: Cambria Math;\">In OSI network architecture, the routing is performed by__________ </span></p>\n",
                    question_hi: "<p><span style=\"font-family: Cambria Math;\">18. OSI </span><span style=\"font-family: Cambria Math;\">&#2344;&#2375;&#2335;&#2357;&#2352;&#2381;&#2325; &#2310;&#2352;&#2381;&#2325;&#2367;&#2335;&#2375;&#2325;&#2381;&#2330;&#2352; &#2350;&#2375;&#2306;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2352;&#2370;&#2335;&#2367;&#2306;&#2327;</span><span style=\"font-family: Cambria Math;\">__________ </span><span style=\"font-family: Cambria Math;\">&#2342;&#2381;&#2357;&#2366;&#2352;&#2366; &#2325;&#2368; &#2332;&#2366;&#2340;&#2368; &#2361;&#2376; </span><span style=\"font-family: Cambria Math;\">I[</span></p>\n",
                    options_en: ["<p>Network layer</p>\n", "<p>Data link layer</p>\n", 
                                "<p>Transport layer</p>\n", "<p>Session layer</p>\n"],
                    options_hi: ["<p><span style=\"font-weight: 400;\">&#2344;&#2375;&#2335;&#2357;&#2352;&#2381;&#2325;&nbsp; &#2354;&#2375;&#2351;&#2352;(Network layer)</span></p>\r\n<p>&nbsp;</p>\n", "<p><span style=\"font-weight: 400;\"> &#2337;&#2375;&#2335;&#2366; &#2354;&#2367;&#2306;&#2325; &#2354;&#2375;&#2351;&#2352;(data link layer)</span></p>\r\n<p>&nbsp;</p>\n",
                                "<p><span style=\"font-weight: 400;\"> &#2335;&#2381;&#2352;&#2366;&#2306;&#2360;&#2346;&#2379;&#2352;&#2381;&#2335; &#2354;&#2375;&#2351;&#2352; &#2346;&#2352;&#2340;(transport layer)</span></p>\r\n<p>&nbsp;</p>\n", "<p><span style=\"font-weight: 400;\"> &#2360;&#2375;&#2358;&#2344; &#2354;&#2375;&#2351;&#2352;(session layer)</span></p>\n"],
                    solution_en: "<p>18.(a)<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">In OSI network architecture, the routing is performed by the </span><strong><span style=\"font-family: Cambria Math;\">network layer</span></strong><span style=\"font-family: Cambria Math;\"> which is layer number 3 with the help of intermediate routers.</span><strong><span style=\"font-family: Cambria Math;\">Data Link Layer</span></strong><span style=\"font-family: Cambria Math;\"> protocols are generally responsible to simply ensure and confirm that the bits and bytes that are received are identical to the bits and bytes being transferred. </span><strong><span style=\"font-family: Cambria Math;\">Session Layer</span></strong><span style=\"font-family: Cambria Math;\"><strong> </strong>is the layer of the ISO Open Systems Interconnection (OSI) model that controls the dialogues (connections) between computers. The network layer is considered<strong> </strong></span><strong><span style=\"font-family: Cambria Math;\">the backbone of the OSI Model</span></strong><span style=\"font-family: Cambria Math;\">. It selects and manages the best logical path (virtual circuit) for data transfer between nodes by assigning destination and source IP addresses to each data segment.</span></p>\n",
                    solution_hi: "<p>18.(a)<span style=\"font-family: Cambria Math;\"> OSI </span><span style=\"font-family: Cambria Math;\">&#2344;&#2375;&#2335;&#2357;&#2352;&#2381;&#2325; &#2310;&#2352;&#2381;&#2325;&#2367;&#2335;&#2375;&#2325;&#2381;&#2330;&#2352; &#2350;&#2375;&#2306;</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Cambria Math;\">&#2352;&#2370;&#2335;&#2367;&#2306;&#2327; </span><span style=\"font-family: Cambria Math;\">&#2344;&#2375;&#2335;&#2357;&#2352;&#2381;&#2325; &#2354;&#2375;&#2351;&#2352;</span><span style=\"font-family: Cambria Math;\">(network layer)</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2342;&#2381;&#2357;&#2366;&#2352;&#2366; &#2325;&#2368; &#2332;&#2366;&#2340;&#2368; &#2361;&#2376; &#2332;&#2379; &#2311;&#2306;&#2335;&#2352;&#2350;&#2368;&#2337;&#2367;&#2319;&#2335; &#2352;&#2366;&#2313;&#2335;&#2352;&#2381;&#2360; &#2325;&#2368; &#2350;&#2342;&#2342; &#2360;&#2375; &#2354;&#2375;&#2351;&#2352; &#2344;&#2306;&#2348;&#2352; </span><span style=\"font-family: Cambria Math;\">3 </span><span style=\"font-family: Cambria Math;\">&#2361;&#2376;&#2404; </span><span style=\"font-family: Cambria Math;\">&#2337;&#2375;&#2335;&#2366; &#2354;&#2367;&#2306;&#2325; &#2354;&#2375;&#2351;&#2352;</span><span style=\"font-family: Cambria Math;\">(data link layer)</span><span style=\"font-family: Cambria Math;\">) </span><span style=\"font-family: Cambria Math;\">&#2346;&#2381;&#2352;&#2379;&#2335;&#2379;&#2325;&#2377;&#2354; &#2310;&#2350;&#2340;&#2380;&#2352; &#2346;&#2352; &#2325;&#2375;&#2357;&#2354; &#2351;&#2361; &#2360;&#2369;&#2344;&#2367;&#2358;&#2381;&#2330;&#2367;&#2340; &#2325;&#2352;&#2344;&#2375; &#2324;&#2352; &#2346;&#2369;&#2359;&#2381;&#2335;&#2367; &#2325;&#2352;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2332;&#2367;&#2350;&#2381;&#2350;&#2375;&#2342;&#2366;&#2352; &#2361;&#2379;&#2340;&#2375; &#2361;&#2376;&#2306; &#2325;&#2367; &#2346;&#2381;&#2352;&#2366;&#2346;&#2381;&#2340; &#2348;&#2367;&#2335;&#2381;&#2360; &#2324;&#2352; &#2348;&#2366;&#2311;&#2335;&#2381;&#2360; &#2348;&#2367;&#2335;&#2381;&#2360; &#2325;&#2375; &#2360;&#2350;&#2366;&#2344; &#2361;&#2376;&#2306;&#2404; &#2324;&#2352; &#2348;&#2366;&#2311;&#2335; &#2360;&#2381;&#2341;&#2366;&#2344;&#2366;&#2306;&#2340;&#2352;&#2367;&#2340; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366; &#2352;&#2361;&#2366; &#2361;&#2376;&#2404; &#2360;&#2340;&#2381;&#2352; &#2346;&#2352;&#2340; &#2310;&#2312;&#2319;&#2360;&#2323; &#2323;&#2346;&#2344; &#2360;&#2367;&#2360;&#2381;&#2335;&#2350;&#2381;&#2360; &#2311;&#2306;&#2335;&#2352;&#2325;&#2344;&#2375;&#2325;&#2381;&#2358;&#2344;</span><span style=\"font-family: Cambria Math;\">(</span><span style=\"font-family: Cambria Math;\">Open Systems Interconnection</span><span style=\"font-family: Cambria Math;\">) (</span><span style=\"font-family: Cambria Math;\">&#2323;&#2319;&#2360;&#2310;&#2312;</span><span style=\"font-family: Cambria Math;\">) </span><span style=\"font-family: Cambria Math;\">&#2350;&#2377;&#2337;&#2354; &#2325;&#2368; &#2346;&#2352;&#2340; &#2361;&#2376; &#2332;&#2379; &#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352;&#2379;&#2306; &#2325;&#2375; &#2348;&#2368;&#2330; &#2360;&#2306;&#2357;&#2366;&#2342; </span><span style=\"font-family: Cambria Math;\">(</span><span style=\"font-family: Cambria Math;\">&#2325;&#2344;&#2375;&#2325;&#2381;&#2358;&#2344;</span><span style=\"font-family: Cambria Math;\">) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2379; &#2344;&#2367;&#2351;&#2306;&#2340;&#2381;&#2352;&#2367;&#2340; &#2325;&#2352;&#2340;&#2368; &#2361;&#2376;&#2404; </span><span style=\"font-family: Cambria Math;\">&#2344;&#2375;&#2335;&#2357;&#2352;&#2381;&#2325; &#2354;&#2375;&#2351;&#2352;</span><span style=\"font-family: Cambria Math;\">(network layer)</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2325;&#2379; </span><span style=\"font-family: Cambria Math;\">OSI </span><span style=\"font-family: Cambria Math;\">&#2350;&#2377;&#2337;&#2354; &#2325;&#2368; &#2352;&#2368;&#2338;&#2364; &#2350;&#2366;&#2344;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404; &#2351;&#2361; &#2346;&#2381;&#2352;&#2340;&#2381;&#2351;&#2375;&#2325; &#2337;&#2375;&#2335;&#2366; &#2360;&#2375;&#2327;&#2350;&#2375;&#2306;&#2335; &#2325;&#2379; &#2327;&#2306;&#2340;&#2357;&#2381;&#2351; &#2324;&#2352; &#2360;&#2381;&#2352;&#2379;&#2340; &#2310;&#2312;&#2346;&#2368; &#2346;&#2340;&#2375; &#2344;&#2367;&#2352;&#2381;&#2342;&#2367;&#2359;&#2381;&#2335; &#2325;&#2352;&#2325;&#2375; &#2344;&#2379;&#2337;&#2381;&#2360; &#2325;&#2375; &#2348;&#2368;&#2330; &#2337;&#2375;&#2335;&#2366; &#2335;&#2381;&#2352;&#2366;&#2306;&#2360;&#2347;&#2352; &#2325;&#2375; &#2354;&#2367;&#2319; &#2360;&#2352;&#2381;&#2357;&#2358;&#2381;&#2352;&#2375;&#2359;&#2381;&#2336; &#2340;&#2366;&#2352;&#2381;&#2325;&#2367;&#2325; &#2346;&#2341; </span><span style=\"font-family: Cambria Math;\">(</span><span style=\"font-family: Cambria Math;\">&#2357;&#2352;&#2381;&#2330;&#2369;&#2309;&#2354; &#2360;&#2352;&#2381;&#2325;&#2367;&#2335;</span><span style=\"font-family: Cambria Math;\">) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2366; &#2330;&#2351;&#2344; &#2324;&#2352; &#2346;&#2381;&#2352;&#2348;&#2306;&#2343;&#2344; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\n",
                    correct: "a",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
                questions.push({

                                "<p><span style=\"font-weight: 400;\">&#2361;&#2366;&#2311;&#2335; &#2319;&#2306;&#2337; &#2357;&#2367;&#2337;&#2381;&#2341; (Height and width)</span></p>\r\n<p>&nbsp;</p>\r\n<p>&nbsp;</p>\n", "<p><span style=\"font-weight: 400;\">&#2352;&#2379;&#2360; &#2319;&#2306;&#2337; &#2325;&#2354;&#2369;&#2350;&#2306;&#2360; (Rows and columns)</span></p>\n"],

                questions.push({
                    id: "20",
                    section: "misc",
                    question_en: "<p>20.<span style=\"font-family: Cambria Math;\"> Which computer is used for Computer Aided Design (CAD) calculations?</span></p>\n",
                    question_hi: "<p>20.<span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; &#2319;&#2337;&#2375;&#2337; &#2337;&#2367;&#2332;&#2364;&#2366;&#2311;&#2344; </span><span style=\"font-family: Cambria Math;\">(CAD) </span><span style=\"font-family: Cambria Math;\">&#2327;&#2339;&#2344;&#2366;&#2323;&#2306; </span><span style=\"font-family: Cambria Math;\">(calculations) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2375; &#2354;&#2367;&#2319; &#2325;&#2367;&#2360; &#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; &#2325;&#2366; &#2313;&#2346;&#2351;&#2379;&#2327; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;</span><span style=\"font-family: Cambria Math;\">?</span></p>\n",
                    options_en: ["<p>Mainframe computer</p>\n", "<p>Supercomputer</p>\n", 
                                "<p>Microcomputer</p>\n", "<p>Minicomputer</p>\n"],
                    options_hi: ["<p><span style=\"font-weight: 400;\">&nbsp;&#2350;&#2375;&#2344;&#2347;&#2381;&#2352;&#2375;&#2350; &#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; (Mainframe computer)</span></p>\r\n<p>&nbsp;</p>\r\n<p><br><br></p>\n", "<p><span style=\"font-weight: 400;\">&#2360;&#2369;&#2346;&#2352; &#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; (Supercomputer)</span></p>\n",
                                "<p><span style=\"font-weight: 400;\">&#2350;&#2366;&#2311;&#2325;&#2381;&#2352;&#2379; &#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; (Microcomputer)</span></p>\n", "<p><span style=\"font-weight: 400;\">&#2350;&#2367;&#2344;&#2368; &#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; (Minicomputer)</span></p>\n"],
                    solution_en: "<p>20<span style=\"font-family: Cambria Math;\">.</span><span style=\"font-family: Cambria Math;\">(d)</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">High-end, single-user workstations</span><span style=\"font-family: Cambria Math;\">,</span><span style=\"font-family: Cambria Math;\"> which are typically used for</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">computer-aided design (CAD),are</span><span style=\"font-family: Cambria Math;\"> called</span><strong><span style=\"font-family: Cambria Math;\"> minicomputers.</span></strong></p>\r\n<p><strong><span style=\"font-family: Cambria Math;\"> Mainframe computers</span></strong><span style=\"font-family: Cambria Math;\"><strong> </strong>are used in E-commerce, banks etc.</span></p>\r\n<p><strong><span style=\"font-family: Cambria Math;\">Supercomputers </span></strong><span style=\"font-family: Cambria Math;\">are used in weather forecasting, nuclear designing, cryptography etc</span><span style=\"font-family: Cambria Math;\">.</span></p>\r\n<p><span style=\"font-family: Cambria Math;\"><strong> Microcomputers</strong> </span><span style=\"font-family: Cambria Math;\">are used in </span><span style=\"font-family: Cambria Math;\">personal computers, digital watches.</span></p>\n",
                    solution_hi: "<p>20<span style=\"font-family: Cambria Math;\">.</span><span style=\"font-family: Cambria Math;\">(d)</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\">&#2361;&#2366;&#2312;</span><span style=\"font-family: Cambria Math;\">-</span><span style=\"font-family: Cambria Math;\">&#2319;&#2306;&#2337; </span><span style=\"font-family: Cambria Math;\">(high-end), </span><span style=\"font-family: Cambria Math;\">&#2360;&#2367;&#2306;&#2327;&#2354;</span><span style=\"font-family: Cambria Math;\">-</span><span style=\"font-family: Cambria Math;\">&#2351;&#2370;&#2332;&#2364;&#2352; &#2357;&#2352;&#2381;&#2325;&#2360;&#2381;&#2335;&#2375;&#2358;&#2344; </span><span style=\"font-family: Cambria Math;\">(single-user workstations), </span><span style=\"font-family: Cambria Math;\">&#2332;&#2379; &#2310;&#2350;&#2340;&#2380;&#2352; &#2346;&#2352; &#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; &#2319;&#2337;&#2375;&#2337; &#2337;&#2367;&#2332;&#2364;&#2366;&#2311;&#2344; </span><span style=\"font-family: Cambria Math;\">(CAD) </span><span style=\"font-family: Cambria Math;\">&#2325;&#2375; &#2354;&#2367;&#2319; &#2313;&#2346;&#2351;&#2379;&#2327; &#2325;&#2367;&#2319; &#2332;&#2366;&#2340;&#2375; &#2361;&#2376;&#2306;</span><span style=\"font-family: Cambria Math;\">, </span><strong><span style=\"font-family: Cambria Math;\">&#2350;&#2367;&#2344;&#2368; &#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352;</span><span style=\"font-family: Cambria Math;\"> </span></strong><span style=\"font-family: Cambria Math;\"><strong>&#2325;&#2361;&#2354;&#2366;&#2340;&#2375; </strong>&#2361;&#2376;&#2306;&#2404;</span></p>\r\n<p><span style=\"font-family: Cambria Math;\"><strong>&#2350;&#2375;&#2344;&#2347;&#2381;&#2352;&#2375;&#2350; </strong>&#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; </span><span style=\"font-family: Cambria Math;\">&#2325;&#2366; &#2313;&#2346;&#2351;&#2379;&#2327; &#2312;</span><span style=\"font-family: Cambria Math;\">-</span><span style=\"font-family: Cambria Math;\">&#2325;&#2377;&#2350;&#2352;&#2381;&#2360; </span><span style=\"font-family: Cambria Math;\">E-commerce), </span><span style=\"font-family: Cambria Math;\">&#2348;&#2376;&#2306;&#2325; </span><span style=\"font-family: Cambria Math;\">(bank) </span><span style=\"font-family: Cambria Math;\">&#2310;&#2342;&#2367; &#2350;&#2375;&#2306; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\r\n<p><strong><span style=\"font-family: Cambria Math;\">&#2360;&#2369;&#2346;&#2352; &#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352;</span><span style=\"font-family: Cambria Math;\"> </span></strong><span style=\"font-family: Cambria Math;\">&#2325;&#2366; &#2313;&#2346;&#2351;&#2379;&#2327; &#2350;&#2380;&#2360;&#2350; &#2325;&#2368; &#2349;&#2357;&#2367;&#2359;&#2381;&#2351;&#2357;&#2366;&#2339;&#2368; </span><span style=\"font-family: Cambria Math;\">(forecasting), </span><span style=\"font-family: Cambria Math;\">&#2346;&#2352;&#2350;&#2366;&#2339;&#2369; &#2337;&#2367;&#2332;&#2366;&#2311;&#2344;&#2367;&#2306;&#2327; </span><span style=\"font-family: Cambria Math;\">(nuclear designing), </span><span style=\"font-family: Cambria Math;\">&#2325;&#2381;&#2352;&#2367;&#2346;&#2381;&#2335;&#2379;&#2327;&#2381;&#2352;&#2366;&#2347;&#2368; </span><span style=\"font-family: Cambria Math;\">(cryptography) </span><span style=\"font-family: Cambria Math;\">&#2310;&#2342;&#2367; &#2350;&#2375;&#2306; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\r\n<p><strong><span style=\"font-family: Cambria Math;\">&#2350;&#2366;&#2311;&#2325;&#2381;&#2352;&#2379; &#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352;</span><span style=\"font-family: Cambria Math;\"> </span></strong><span style=\"font-family: Cambria Math;\">&#2325;&#2366; &#2313;&#2346;&#2351;&#2379;&#2327; &#2346;&#2352;&#2381;&#2360;&#2344;&#2354; &#2325;&#2306;&#2346;&#2381;&#2351;&#2370;&#2335;&#2352; </span><span style=\"font-family: Cambria Math;\">(personal computer), </span><span style=\"font-family: Cambria Math;\">&#2337;&#2367;&#2332;&#2367;&#2335;&#2354; &#2328;&#2337;&#2364;&#2367;&#2351;&#2379;&#2306; </span><span style=\"font-family: Cambria Math;\">(digital watches) </span><span style=\"font-family: Cambria Math;\">&#2350;&#2375;&#2306; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\n",
                    correct: "d",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
            
            // Generate question boxes
            const boxesContainer = document.getElementById('question-boxes');
            questions.forEach((q, index) => {
                const box = document.createElement('div');
                box.className = 'q-box';
                box.textContent = index + 1;
                box.onclick = () => showQuestion(index);
                box.id = `box-${index}`;
                boxesContainer.appendChild(box);
            });
            
            // Show first question
            showQuestion(0);
            updateProgress();
        }
        
        // Show a specific question
        
        function formatContent(text) {
            if (!text) return '';
            return text.replace(/<img/g, '<img style="max-width:100%;height:auto;"');
        }
        
        function showQuestion(index) {
            if (index < 0 || index >= questions.length) return;
            
            currentQuestion = index;
            const question = questions[index];
            
            // Update question counter
            document.getElementById('question-counter').textContent = `Question ${index + 1} of ${questions.length}`;
            
            // Update question boxes
            document.querySelectorAll('.q-box').forEach(box => box.classList.remove('current'));
            document.getElementById(`box-${index}`).classList.add('current');
            
            // Generate question HTML
            let html = `
                <div class="question-card">
                    <div class="question-text">
                        <div class="en">${formatContent(question.question_en)}</div>
                        <div class="hi" style="display:none">${formatContent(question.question_hi)} </div>
                    </div>
                    <div class="options" id="options-container">`;
            
            // Add options
            ['a', 'b', 'c', 'd'].forEach((opt, i) => {
                let optionClass = '';
                let isCorrectAnswer = opt === question.correct;
                let isUserAnswer = answers[question.id] === opt;
                
                // When reviewing, add appropriate classes
                if (submitted) {
                    if (isCorrectAnswer) {
                        optionClass += ' correct-answer';
                    } else if (isUserAnswer && !isCorrectAnswer) {
                        optionClass += ' incorrect';
                    }
                }
                
                html += `
                    <div class="option-item">
                        <input class="option-input" type="radio" name="q${index}" 
                            id="opt-${index}-${opt}" value="${opt}" 
                            ${isUserAnswer ? 'checked' : ''}
                            onclick="selectAnswer('${question.id}', '${opt}')">
                       <label class="option-label${optionClass}" for="opt-${index}-${opt}">
                            <div class="en">${question.options_en[i]}</div>
                            <div class="hi" style="display:none">${question.options_hi[i]}</div>
                        </label>
                    </div>`;
            });
            
            // Add solution if submitted
            if (submitted) {
                const isCorrect = answers[question.id] === question.correct;
                const resultText = answers[question.id] ? (isCorrect ? 'Correct!' : 'Incorrect!') : 'Not attempted';
                
                html += `
                    <div class="solution-container">
                        <div class="solution-title">${resultText}</div>
                        <div class="solution-text">
                            <div class="en">${question.solution_en}</div>
                            <div class="hi" style="display:none">${question.solution_hi}</div>
                        </div>
                    </div>`;
            }
            
            html += `</div></div>`;
            
            document.getElementById('questions-container').innerHTML = html;
            
            // Apply language settings
            applyLanguage();
            
            // If in mobile view, close the menu
            if (window.innerWidth < 992) {
                toggleNav(false);
            }
            
            // Add review mode class if submitted
            if (submitted) {
                document.getElementById('options-container').classList.add('review-mode');
            }
        }
        
        // Apply current language
        function applyLanguage() {
            document.querySelectorAll(`.${currentLang}`).forEach(el => el.style.display = 'block');
            document.querySelectorAll(`.${currentLang === 'en' ? 'hi' : 'en'}`).forEach(el => el.style.display = 'none');
            
            // Update language button text
            document.getElementById('lang-text').textContent = currentLang === 'en' ? 'Hi' : 'En';
        }
        
        // Select an answer
        function selectAnswer(qId, option) {
            if (submitted) return;
            
            answers[qId] = option;
            updateProgress();
            
            // Mark question as attempted in the navigation
            const index = questions.findIndex(q => q.id === qId);
            if (index >= 0) {
                const box = document.getElementById(`box-${index}`);
                box.classList.add('attempted');
                box.classList.remove('unattempted');
            }
        }
        
        // Navigate to previous/next question
        function prevQuestion() { 
            if (currentQuestion > 0) showQuestion(currentQuestion - 1); 
        }
        
        function nextQuestion() { 
            if (currentQuestion < questions.length - 1) showQuestion(currentQuestion + 1); 
        }
        
        // Switch section
        function switchSection(sectionId) {
            if (sectionId === 'all') {
                showQuestion(0);
                return;
            }
            
            const section = sections[sectionId];
            if (section) showQuestion(section.start);
        }
        
        // Toggle language
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            applyLanguage();
        }
        
        // Toggle navigation sidebar
        function toggleNav(show) {
            const nav = document.getElementById('question-nav');
            const overlay = document.getElementById('nav-overlay');
            
            if (show === undefined) {
                show = !nav.classList.contains('show');
            }
            
            if (show) {
                nav.classList.add('show');
                overlay.classList.add('show');
                document.body.style.overflow = 'hidden';
            } else {
                nav.classList.remove('show');
                overlay.classList.remove('show');
                document.body.style.overflow = '';
            }
        }
        
        // Update progress
        function updateProgress() {
            const attempted = Object.keys(answers).length;
            document.getElementById('attempted-count').textContent = attempted;
        }
        
        // Start timer
        function startTimer() {
            const timerDisplay = document.getElementById('timer-display');
            let timeLeft = totalTime;
            
            const timerInterval = setInterval(() => {
                if (timeLeft <= 0 || submitted) {
                    clearInterval(timerInterval);
                    if (!submitted) submitTest();
                    return;
                }
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                timeLeft--;
            }, 1000);
        }
        
        // Confirm before submitting
        function confirmSubmit() {
            if (submitted) return;
            
            const attempted = Object.keys(answers).length;
            const remaining = questions.length - attempted;
            
            // Create a more modern confirmation dialog
            const confirmHtml = `
                <div style="text-align: center; padding: 20px;">
                    <h4 style="margin-bottom: 16px; color: var(--dark);">Confirm Submission</h4>
                    <p style="margin-bottom: 24px; color: var(--gray);">
                        You have attempted ${attempted} of ${questions.length} questions.<br>
                        ${remaining} questions are unattempted.
                    </p>
                    <div style="display: flex; justify-content: center; gap: 12px;">
                        <button onclick="this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; border: 1px solid var(--light-gray); background: white; border-radius: 8px; cursor: pointer;">
                            Cancel
                        </button>
                        <button onclick="submitTest(); this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer;">
                            Submit Test
                        </button>
                    </div>
                </div>`;
            
            // Create modal element
            const modal = document.createElement('div');
            modal.className = 'results-modal show';
            modal.innerHTML = `
                <div class="results-card" style="max-width: 400px;">
                    <button class="cancel-btn" style="position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--gray);" onclick="this.closest('.results-modal').remove()">
                        ×
                    </button>
                    ${confirmHtml}
                </div>`;
            
            document.body.appendChild(modal);
        }
        
        // Submit test
        function submitTest() {
            if (submitted) return;
            
            submitted = true;
            
            let score = 0;
            let correctCount = 0;
            let incorrectCount = 0;
            let unattemptedCount = 0;
            
            questions.forEach((q, index) => {
                const userAns = answers[q.id];
                const box = document.getElementById(`box-${index}`);
                
                box.classList.remove('attempted');
                
                if (!userAns) {
                    unattemptedCount++;
                    box.classList.add('unattempted');
                } else if (userAns === q.correct) {
                    correctCount++;
                    score += q.pos_marks;
                    box.classList.add('correct');
                } else {
                    incorrectCount++;
                    score -= q.neg_marks;
                    box.classList.add('incorrect');
                }
            });
            
            // Update result values
            document.getElementById('score-value').textContent = score.toFixed(2);
            document.getElementById('correct-value').textContent = correctCount;
            document.getElementById('incorrect-value').textContent = incorrectCount;
            document.getElementById('unattempted-value').textContent = unattemptedCount;
            
            // Show the results modal
            document.getElementById('results-modal').classList.add('show');
            
            // Disable submit button
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-check"></i>';
            submitBtn.style.backgroundColor = 'var(--success)';
            
            // Refresh current question view to show solution
            showQuestion(currentQuestion);
        }
        
        // Review test
        function reviewTest() {
            document.getElementById('results-modal').classList.remove('show');
            showQuestion(0);
        }
        
        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('results-modal')) {
                document.getElementById('results-modal').classList.remove('show');
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === 'ArrowRight') nextQuestion();
        });
    </script>
</body>
</html>
