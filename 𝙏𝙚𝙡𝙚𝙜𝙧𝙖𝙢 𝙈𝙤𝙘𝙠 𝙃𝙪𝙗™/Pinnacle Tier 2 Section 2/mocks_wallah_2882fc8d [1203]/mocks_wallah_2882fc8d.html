                    solution_en: "<p>63.(b)&nbsp;<strong>Brazil</strong><span style=\"font-weight: 400;\">. The second is </span><strong>Vietnam</strong><span style=\"font-weight: 400;\">. Karnataka is the largest coffee producing state in India. GI Tags (Coorg Arabica from Karnataka, Wayanad, Robusta from Kerala, Chikmagalur Arabica from Karnataka, Araku Valley Arabica from Andhra Pradesh, Baba Budangiri Arabica from Karnataka). </span><strong>Argentina </strong><span style=\"font-weight: 400;\">is the world\'s largest food producer and exporter India </span><strong>India </strong><span style=\"font-weight: 400;\">is the largest pulse in the world Producing country. Karnataka is the major producer of pulses in India.&nbsp; </span><strong>Peru </strong><span style=\"font-weight: 400;\">is the largest producer of cocaine.</span></p>\\n",
                    solution_hi: "<p>63.(b)<span style=\"font-family: Roboto;\">&nbsp;</span><strong>&#2348;&#2381;&#2352;&#2366;&#2332;&#2368;&#2354; </strong><span style=\"font-weight: 400;\">&#2404; &#2342;&#2370;&#2360;&#2352;&#2366;</span><strong> &#2357;&#2367;&#2351;&#2340;&#2344;&#2366;&#2350;</strong><span style=\"font-weight: 400;\"> &#2361;&#2376;&#2404; &#2349;&#2366;&#2352;&#2340; &#2350;&#2375;&#2306; &#2325;&#2352;&#2381;&#2344;&#2366;&#2335;&#2325;</span><strong> </strong><span style=\"font-weight: 400;\">&#2360;&#2348;&#2360;&#2375; &#2348;&#2337;&#2364;&#2366; &#2325;&#2377;&#2347;&#2368; &#2313;&#2340;&#2381;&#2346;&#2366;&#2342;&#2325; &#2352;&#2366;&#2332;&#2381;&#2351; &#2361;&#2376;&#2404; GI &#2335;&#2376;&#2327; (&#2325;&#2352;&#2381;&#2344;&#2366;&#2335;&#2325; &#2325;&#2366; &#2325;&#2369;&#2352;&#2381;&#2327; &#2309;&#2352;&#2375;&#2348;&#2367;&#2325;&#2366;, &#2357;&#2366;&#2351;&#2344;&#2366;&#2337;, &#2325;&#2375;&#2352;&#2354; &#2325;&#2366; &#2352;&#2379;&#2348;&#2360;&#2381;&#2335;&#2366;, &#2325;&#2352;&#2381;&#2344;&#2366;&#2335;&#2325; &#2325;&#2366; &#2330;&#2367;&#2325;&#2350;&#2327;&#2354;&#2370;&#2352; &#2309;&#2352;&#2375;&#2348;&#2367;&#2325;&#2366;, &#2310;&#2306;&#2343;&#2381;&#2352; &#2346;&#2381;&#2352;&#2342;&#2375;&#2358; &#2325;&#2366; &#2309;&#2352;&#2366;&#2325;&#2370; &#2357;&#2376;&#2354;&#2368; &#2309;&#2352;&#2375;&#2348;&#2367;&#2325;&#2366;, &#2325;&#2352;&#2381;&#2344;&#2366;&#2335;&#2325; &#2325;&#2366; &#2348;&#2366;&#2348;&#2366; &#2348;&#2369;&#2342;&#2344;&#2327;&#2367;&#2352;&#2368; &#2309;&#2352;&#2375;&#2348;&#2367;&#2325;&#2366;)</span><strong>&#2404;&#2309;&#2352;&#2381;&#2332;&#2375;&#2306;&#2335;&#2368;&#2344;&#2366;</strong><span style=\"font-weight: 400;\"> &#2342;&#2369;&#2344;&#2367;&#2351;&#2366; &#2325;&#2366; &#2360;&#2348;&#2360;&#2375; &#2348;&#2337;&#2364;&#2366; &#2326;&#2366;&#2342;&#2381;&#2351; &#2313;&#2340;&#2381;&#2346;&#2366;&#2342;&#2325; &#2324;&#2352; &#2344;&#2367;&#2352;&#2                 questions.push({

                questions.push({
                    id: "65",
                    section: "18",
                    question_en: " <p>65.</span><span style=\"font-family:Roboto\"> When is International Day to Protect Education from attack observed?</span></p>",
                    question_hi: " <p>65. </span><span style=\"font-family:Palanquin\">शिक्षा को हमले से बचाने के लिए अंतर्राष्ट्रीय दिवस कब मनाया जाता है?</span></p>",

                    options_hi: [" <p> सितंबर 9 </span></p>", " <p> सितंबर 10</span></p>",
                                " <p> सितंबर 11 </span></p>", " <p> सितंबर 8</span></p>"],
                    solution_en: " <p>65.(a)</span><span style=\"font-family:Roboto\"> 9th September . The United Nations observed the International Day to Protect Education from Attack on September 9, 2022. On September 9, 2020, the \'International Day to Protect Education from Attack\' was observed for the first time by the United Nations.</span></p>",
                    solution_hi: " <p>65.(a)</span><span style=\"font-family:Palanquin\"> 9 सितंबर। संयुक्त राष्ट्र ने 9 सितंबर, 2022 को शिक्षा को हमले से बचाने के लिए अंतर्राष्ट्रीय दिवस मनाया। 9 सितंबर, 2020 को संयुक्त राष्ट्र द्वारा पहली बार \'शिक्षा को हमले से बचाने के लिए अंतर्राष्ट्रीय दिवस\' मनाया गया था ।</span></p>",
                    correct: "a",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
                questions.push({
                    id: "66",
                    section: "18",
                    question_en: "<p>66.<span style=\"font-family: Roboto;\"> The Khalji of Khilji dynasty, founded by Jalal-ud-din Firuz Khalji ruled large parts of the Indian subcontinent between_____.</span></p>\\n",
                    question_hi: "<p>66. <span style=\"font-family: Palanquin;\">&#2332;&#2354;&#2366;&#2354;&#2369;&#2342;&#2381;&#2342;&#2368;&#2344; &#2398;&#2367;&#2352;&#2379;&#2395; </span><span style=\"font-family: Palanquin;\">&#2326;&#2367;&#2354;&#2332;&#2368;</span><span style=\"font-family: Palanquin;\"> &#2325;&#2375; &#2342;&#2381;&#2357;&#2366;&#2352;&#2366; &#2360;&#2381;&#2341;&#2366;&#2346;&#2367;&#2340; </span><span style=\"font-family: Palanquin;\">&#2326;&#2367;&#2354;&#2332;&#2368;</span><span style=\"font-family: Roboto;\"> </span><span style=\"font-family: Palanquin;\">&#2357;&#2306;&#2358;</span><span style=\"font-family: Palanquin;\"> &#2325;&#2366; &#2349;&#2366;&#2352;&#2340;&#2368;&#2351; &#2313;&#2346;&#2350;&#2361;&#2366;&#2342;&#2381;&#2357;&#2368;&#2346; &#2325;&#2375; &#2348;&#2396;&#2375; &#2349;&#2366;&#2327;&#2379;&#2306; &#2346;&#2352; _______ &#2325;&#2375; &#2342;&#2380;&#2352;&#2366;&#2344; &#2358;&#2366;&#2360;&#2344; &#2352;&#2361;&#2366; &#2404; </span></p>\\n",
                    options_en: ["<p>1320 and 1377</p>\\n", "<p>1190 and 1220</p>\\n", 
                                "<p>1290 and 1320</p>\\n", "<p>1220 and 1290</p>\\n"],
                    options_hi: ["<p>1320 &#2324;&#2352; 1377</p>\\n", "<p>1190 &#2324;&#2352; 1220</p>\\n",
                                "<p>1290 &#2324;&#2352; 1320</p>\\n", "<p>1220 &#2324;&#2352; 1290</p>\\n"],
                    solution_en: "<p>66.(c)<span style=\"font-family: Roboto;\">&nbsp;</span><span style=\"font-weight: 400;\">1290 and 1320. It was founded by</span><strong> Jalaluddin Firoz Khilji</strong><span style=\"font-weight: 400;\"> and became the second dynasty to rule the Delhi Sultanate of India. Ghulam Dynasty (1206-1290) &rarr; Khilji Dynasty (1290-1320) &rarr; Tughlaq Dynasty (1320 -1414 ) &rarr; Sayyid Dynasty (1414 - 1451) &rarr; Lodi Dynasty (1451 - 1526).</span></p>\\n",
                    solution_hi: "<p>66.(c)&nbsp;<span style=\"font-weight: 400;\">1290 &#2324;&#2352; 1320 &#2404; &#2311;&#2360;&#2325;&#2368; &#2360;&#2381;&#2341;&#2366;&#2346;&#2344;&#2366; </span><strong>&#2332;&#2354;&#2366;&#2354;&#2369;&#2342;&#2381;&#2342;&#2368;&#2344; &#2347;&#2367;&#2352;&#2379;&#2332; &#2326;&#2367;&#2354;&#2332;&#2368; </strong><span style=\"font-weight: 400;\">&#2344;&#2375; &#2325;&#2368; &#2341;&#2368; &#2324;&#2352; &#2351;&#2361; &#2349;&#2366;&#2352;&#2340; &#2325;&#2375; &#2342;&#2367;&#2354;&#2381;&#2354;&#2368; &#2360;&#2354;&#2381;&#2340;&#2344;&#2340; &#2346;&#2352; &#2358;&#2366;&#2360;&#2344; &#2325;&#2352;&#2344;&#2375; &#2357;&#2366;&#2354;&#2366; &#2342;&#2370;&#2360;&#2352;&#2366; &#2352;&#2366;&#2332;&#2357;&#2306;&#2358; &#2348;&#2344; &#2327;&#2351;&#2366;&#2404; &#2327;&#2364;&#2369;&#2354;&#2366;&#2350; &#2357;&#2306;&#2358;&rarr; (1206-1290), &#2326;&#2364;&#2367;&#2354;&#2332;&#2368; &#2357;&#2306;&#2358; &rarr; (1290-1320), &#2340;&#2369;&#2327;&#2364;&#2354;&#2325;&#2364; &#2357;&#2306;&#2358; &rarr; (1320 -1414 ), &#2360;&#2376;&#2351;&#2342; &#2357;&#2306;&#2358; &rarr; (1414 - 1451), &#2354;&#2379;&#2342;&#2368; &#2357;&#2306;&#2358; &rarr;(1451 - 1526)&#2404;&nbsp;</span></p>\\n",
                    correct: "c",
                    pos_marks: 3.0,
                    neg_marks: 1.0

                questions.push({
                    id: "68",
                    section: "18",
                    question_en: "<p>68. <span style=\"font-family: Roboto;\">What is the theme of the 36th </span><span style=\"font-family: Roboto;\">International Geological Congress?</span></p>\\n",
                    question_hi: "<p>68. <span style=\"font-family: Palanquin;\">36&#2357;&#2368;&#2306; &#2309;&#2306;&#2340;&#2352;&#2381;&#2352;&#2366;&#2359;&#2381;&#2335;&#2381;&#2352;&#2368;&#2351; &#2349;&#2370;&#2357;&#2376;&#2332;&#2381;&#2334;&#2366;&#2344;&#2367;&#2325; &#2325;&#2366;&#2306;&#2327;&#2381;&#2352;&#2375;&#2360; &#2325;&#2368; &#2341;&#2368;&#2350; &#2325;&#2381;&#2351;&#2366; &#2361;&#2376;?</span></p>\\n",
                    options_en: ["<p>Geoscience and Digital World</p>\\n", "<p>Geoscience and the Great Travelers</p>\\n", 
                                "<p>Geosciences: The Basic Science for a Sustainable Future</p>\\n", "<p>Voyages to the Unifying Earth</p>\\n"],
                    options_hi: ["<p>Geoscience and Digital World</p>\\n", "<p>Geoscience and the Great Travelers</p>\\n",
                                "<p>Geosciences: The Basic Science for a Sustainable Future</p>\\n", "<p>Voyages to the Unifying Earth</p>\\n"],
                    solution_en: "<p>68.(c)<span style=\"font-family: Roboto;\">&nbsp;</span><strong>Geosciences: The Basic Science for a Sustainable Future.</strong><span style=\"font-weight: 400;\"> The36th International Geological Congress was held virtually from March 20-22, 2022. The 36th IGC is a joint effort of the Ministry of Mines, the Ministry of Earth Sciences, the Indian National Science Academy and the science academies of Bangladesh, Nepal and Sri Lanka.</span></p>\\n",
                    solution_hi: "<p>68.(c)&nbsp;<strong>Geosciences: The Basic Science for a Sustainable Future</strong><span style=\"font-weight: 400;\">&#2404;&nbsp; 36&#2357;&#2368;&#2306; &#2309;&#2306;&#2340;&#2352;&#2381;&#2352;&#2366;&#2359;&#2381;&#2335;&#2381;&#2352;&#2368;&#2351; &#2349;&#2370;&#2357;&#2376;&#2332;&#2381;&#2334;&#2366;&#2344;&#2367;&#2325; &#2325;&#2366;&#2306;&#2327;&#2381;&#2352;&#2375;&#2360; &#2357;&#2360;&#2381;&#2340;&#2369;&#2340;&#2307; 20-22 &#2350;&#2366;&#2352;&#2381;&#2330;, 2022 &#2340;&#2325; &#2310;&#2351;&#2379;&#2332;&#2367;&#2340; &#2325;&#2368; &#2327;&#2312; &#2404;&nbsp; 36&#2357;&#2366;&#2306; IGC &#2326;&#2366;&#2344; &#2350;&#2306;&#2340;&#2381;&#2352;&#2366;&#2354;&#2351;, &#2346;&#2371;&#2341;&#2381;&#2357;&#2368; &#2357;&#2367;&#2332;&#2381;&#2334;&#2366;&#2344; &#2350;&#2306;&#2340;&#2381;&#2352;&#2366;&#2354;&#2351;, &#2349;&#2366;&#2352;&#2340;&#2368;&#2351; &#2352;&#2366;&#2359;&#2381;&#2335;&#2381;&#2352;&#2368;&#2351; &#2357;&#2367;&#2332;&#2381;&#2334;&#2366;&#2344; &#2309;&#2325;&#2366;&#2342;&#2350;&#2368; &#2324;&#2352; &#2348;&#2366;&#2306;&#2327;&#2381;&#2354;&#2366;&#2342;&#2375;&#2358;, &#2344;&#2375;&#2346;&#2366;&#2354; &#2324;&#2352; &#2358;&#2381;&#2352;&#2368;&#2354;&#2306;&#2325;&#2366; &#2325;&#2368; &#2357;&#2367;&#2332;&#2381;&#2334;&#2366;&#2344; &#2309;&#2325;&#2366;&#2342;&#2350;&#2367;&#2351;&#2379;&#2306; &#2325;&#2366; &#2319;&#2325; &#2360;&#2306;&#2351;&#2369;&#2325;&#2381;&#2340; &#2346;&#2381;&#2352;&#2351;&#2366;&#2360; &#2361;&#2376;&#2404;</span></p>\\n",
                    correct: "c",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
                questions.push({
                    id: "69",
                    section: "18",
                    question_en: " <p>69. </span><span style=\"font-family:Roboto\">Rani ki Vav\' or \'Queen\'s Stepwell\', is a UNESCO (UNESCO) World Heritage Site located on the banks of the __________ River.</span></p>",
                    question_hi: " <p>69. </span><span style=\"font-family:Palanquin\">रानी की वाव\' या \'क्वीन्स स्टेपवेल\', __________ नदी के तट पर स्थित एक यूनेस्को (यूनेस्को) विश्व धरोहर स्थल है।</span></p>",
                    options_en: [" <p> Saraswati</span></p>", " <p> Kaveri</span></p>", 
                                " <p> Mahanadi</span></p>", " <p> Jhelum</span></p>"],
                    options_hi: [" <p> सरस्वती </span></p>", " <p> कावेरी</span></p>",
                                " <p> महानदी </span></p>", " <p> झेलम</span></p>"],
                    solution_en: " <p>69.(a) </span><span style=\"font-family:Roboto\">Rani-ki-Vav is an 11th-century-stepwell situated in the town of Patan in Gujarat, India, on the banks of the Saraswati River. It has been listed as one of UNESCO\'s World Heritage Sites since 2014. It was constructed during the rule of the Chalukya dynasty. Since July 2018, the ₹100 banknote of Mahatma Gandhi New Series, features Rani Ki Vav on the rear side.</span></p>",
                    solution_hi: " <p>69.(a) </span><span style=\"font-family:Palanquin\">रानी-की-वाव सरस्वती नदी के तट पर, गुजरात, भारत के पाटन शहर में स्थित 11वीं शताब्दी का एक बावड़ी है। इसे 2014 से यूनेस्को की विश्व धरोहर स्थलों में से एक के रूप में सूचीबद्ध किया गया है। इसका निर्माण चालुक्य वंश के शासन के दौरान किया गया था। जुलाई 2018 से, महात्मा गांधी नई श्रृंखला के ₹100 के बैंकनोट में पीछे की तरफ रानी की वाव है।</span></p>",
                    correct: "a",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
                questions.push({
                    id: "70",
                    section: "misc",
                    question_en: "<p>70. <span style=\"font-family: Roboto;\">Which of the following elements found in water is responsible for cancer? </span></p>\\n",
                    question_hi: "<p>70. <span style=\"font-family: Palanquin;\">&#2346;&#2366;&#2344;&#2368; &#2350;&#2375;&#2306; &#2346;&#2366;&#2351;&#2366; &#2332;&#2366;&#2344;&#2375; &#2357;&#2366;&#2354;&#2366; &#2325;&#2380;&#2344; &#2360;&#2366; &#2340;&#2340;&#2381;&#2357; &#2325;&#2376;&#2306;&#2360;&#2352; &#2325;&#2375; &#2354;&#2367;&#2319; &#2395;&#2367;&#2350;&#2381;&#2350;&#2375;&#2342;&#2366;&#2352; &#2361;&#2376; ? </span></p>\\n",
                    options_en: ["<p>Arsenic</p>\\n", "<p>Iron</p>\\n", 
                                "<p>Chlorine</p>\\n", "<p>Fluorine</p>\\n"],
                    options_hi: ["<p>&#2310;&#2352;&#2381;&#2360;&#2375;&#2344;&#2367;&#2325;</p>\\n", "<p>&#2354;&#2379;&#2361;&#2366;</p>\\n",
                                "<p>&#2325;&#2381;&#2354;&#2379;&#2352;&#2367;&#2344;</p>\\n", "<p>&#2398;&#2381;&#2354;&#2379;&#2352;&#2367;&#2344;</p>\\n"],
                    solution_en: "<p>70.(a)<span style=\"font-family: Roboto;\">&nbsp;</span><strong>Arsenic.</strong><span style=\"font-weight: 400;\"> Drinking water contaminated with arsenic has been linked to skin cancer and many internal cancers such as lung, bladder and kidney cancer, as well as heart disease and other diseases. </span><strong>Iron </strong><span style=\"font-weight: 400;\">is necessary for the formation of hemoglobin. Iron deficiency anemia occurs due to low levels of hemoglobin. People who drink </span><strong>chlorinated </strong><span style=\"font-weight: 400;\">water may have cancer of the esophagus, rectum, chest, and throat. </span><strong>Fluorine </strong><span style=\"font-weight: 400;\">is a chemical element atomic number &rarr; 9 atomic weight &rarr; 19</span></p>\\n",
                    solution_hi: "<p>70.(a)&nbsp;<strong>&#2310;&#2352;&#2381;&#2360;&#2375;&#2344;&#2367;&#2325;</strong><span style=\"font-weight: 400;\"> &#2404; &#2310;&#2352;&#2381;&#2360;&#2375;&#2344;&#2367;&#2325; &#2360;&#2375; &#2342;&#2370;&#2359;&#2367;&#2340; &#2346;&#2366;&#2344;&#2368; &#2346;&#2368;&#2344;&#2375; &#2360;&#2375; &#2340;&#2381;&#2357;&#2330;&#2366; &#2325;&#2376;&#2306;&#2360;&#2352; &#2324;&#2352; &#2325;&#2312; &#2310;&#2306;&#2340;&#2352;&#2367;&#2325; &#2325;&#2376;&#2306;&#2360;&#2352; &#2332;&#2376;&#2360;&#2375; &#2347;&#2375;&#2347;&#2337;&#2364;&#2375;, &#2350;&#2370;&#2340;&#2381;&#2352;&#2366;&#2358;&#2351; &#2324;&#2352; &#2327;&#2369;&#2352;&#2381;&#2342;&#2375; &#2325;&#2366; &#2325;&#2376;&#2306;&#2360;&#2352;, &#2360;&#2366;&#2341; &#2361;&#2368; &#2361;&#2371;&#2342;&#2351; &#2352;&#2379;&#2327; &#2324;&#2352; &#2309;&#2344;&#2381;&#2351; &#2352;&#2379;&#2327; &#2361;&#2379;&#2340;&#2375; &#2361;&#2376;&#2306;&#2404; </span><strong>&#2310;&#2351;&#2352;&#2344; </strong><span style=\"font-weight: 400;\">&#2361;&#2368;&#2350;&#2379;&#2327;&#2381;&#2354;&#2379;&#2348;&#2367;&#2344; &#2325;&#2375; &#2344;&#2367;&#2352;&#2381;&#2350;&#2366;&#2339; &#2325;&#2375; &#2354;&#2367;&#2319; &#2310;&#2357;&#2358;&#2381;&#2351;&#2325; &#2361;&#2376;&#2404; &#2310;&#2351;&#2352;&#2344; &#2325;&#2368; &#2325;&#2350;&#2368; &#2360;&#2375; &#2319;&#2344;&#2368;&#2350;&#2367;&#2351;&#2366; &#2361;&#2368;&#2350;&#2379;&#2327;&#2381;&#2354;&#2379;&#2348;&#2367;&#2344; &#2325;&#2375; &#2344;&#2367;&#2350;&#2381;&#2344; &#2360;&#2381;&#2340;&#2352; &#2325;&#2375; &#2325;&#2366;&#2352;&#2339; &#2361;&#2379;&#2340;&#2366; &#2361;&#2376;&#2404; </span><strong>&#2325;&#2381;&#2354;&#2379;&#2352;&#2368;&#2344;&#2368;&#2325;&#2371;&#2340; </strong><span style=\"font-weight: 400;\">&#2332;&#2354; &#2346;&#2368;&#2344;&#2375; &#2357;&#2366;&#2354;&#2379;&#2306; &#2350;&#2375;&#2306; &#2349;&#2379;&#2332;&#2344; &#2344;&#2354;&#2368;, &#2350;&#2354;&#2366;&#2358;&#2351;, &#2360;&#2368;&#2344;&#2375; &#2324;&#2352; &#2327;&#2354;&#2375; &#2325;&#2375; &#2325;&#2376;&#2306;&#2360;&#2352; &#2325;&#2368; &#2360;&#2350;&#2360;&#2381;&#2351;&#2366; &#2361;&#2379; &#2360;&#2325;&#2340;&#2368; &#2361;&#2376;&#2404; </span><strong>&#2347;&#2381;&#2354;&#2379;&#2352;&#2368;&#2344;</strong><span style=\"font-weight: 400;\"> &#2319;&#2325; &#2352;&#2366;&#2360;&#2366;&#2351;&#2344;&#2367;&#2325; &#2340;&#2340;&#2381;&#2357; &#2361;&#2376; &#2346;&#2352;&#2350;&#2366;&#2339;&#2369; &#2360;&#2306;&#2326;&#2381;&#2351;&#2366; &rarr; 9 &#2346;&#2352;&#2350;&#2366;&#2339;&#2369; &#2349;&#2366;&#2352; &rarr; 19 &#2404;</span></p>\\n",
                    correct: "a",
                    pos_marks: 3.0,
                    neg_marks: 1.0
                });
            
            // Generate question boxes
            const boxesContainer = document.getElementById('question-boxes');
            questions.forEach((q, index) => {
                const box = document.createElement('div');
                box.className = 'q-box';
                box.textContent = index + 1;
                box.onclick = () => showQuestion(index);
                box.id = `box-${index}`;
                boxesContainer.appendChild(box);
            });
            
            // Show first question
            showQuestion(0);
            updateProgress();
        }
        
        // Show a specific question
        
        function formatContent(text) {
            if (!text) return '';
            return text.replace(/<img/g, '<img style="max-width:100%;height:auto;"');
        }
        
        function showQuestion(index) {
            if (index < 0 || index >= questions.length) return;
            
            currentQuestion = index;
            const question = questions[index];
            
            // Update question counter
            document.getElementById('question-counter').textContent = `Question ${index + 1} of ${questions.length}`;
            
            // Update question boxes
            document.querySelectorAll('.q-box').forEach(box => box.classList.remove('current'));
            document.getElementById(`box-${index}`).classList.add('current');
            
            // Generate question HTML
            let html = `
                <div class="question-card">
                    <div class="question-text">
                        <div class="en">${formatContent(question.question_en)}</div>
                        <div class="hi" style="display:none">${formatContent(question.question_hi)} </div>
                    </div>
                    <div class="options" id="options-container">`;
            
            // Add options
            ['a', 'b', 'c', 'd'].forEach((opt, i) => {
                let optionClass = '';
                let isCorrectAnswer = opt === question.correct;
                let isUserAnswer = answers[question.id] === opt;
                
                // When reviewing, add appropriate classes
                if (submitted) {
                    if (isCorrectAnswer) {
                        optionClass += ' correct-answer';
                    } else if (isUserAnswer && !isCorrectAnswer) {
                        optionClass += ' incorrect';
                    }
                }
                
                html += `
                    <div class="option-item">
                        <input class="option-input" type="radio" name="q${index}" 
                            id="opt-${index}-${opt}" value="${opt}" 
                            ${isUserAnswer ? 'checked' : ''}
                            onclick="selectAnswer('${question.id}', '${opt}')">
                       <label class="option-label${optionClass}" for="opt-${index}-${opt}">
                            <div class="en">${question.options_en[i]}</div>
                            <div class="hi" style="display:none">${question.options_hi[i]}</div>
                        </label>
                    </div>`;
            });
            
            // Add solution if submitted
            if (submitted) {
                const isCorrect = answers[question.id] === question.correct;
                const resultText = answers[question.id] ? (isCorrect ? 'Correct!' : 'Incorrect!') : 'Not attempted';
                
                html += `
                    <div class="solution-container">
                        <div class="solution-title">${resultText}</div>
                        <div class="solution-text">
                            <div class="en">${question.solution_en}</div>
                            <div class="hi" style="display:none">${question.solution_hi}</div>
                        </div>
                    </div>`;
            }
            
            html += `</div></div>`;
            
            document.getElementById('questions-container').innerHTML = html;
            
            // Apply language settings
            applyLanguage();
            
            // If in mobile view, close the menu
            if (window.innerWidth < 992) {
                toggleNav(false);
            }
            
            // Add review mode class if submitted
            if (submitted) {
                document.getElementById('options-container').classList.add('review-mode');
            }
        }
        
        // Apply current language
        function applyLanguage() {
            document.querySelectorAll(`.${currentLang}`).forEach(el => el.style.display = 'block');
            document.querySelectorAll(`.${currentLang === 'en' ? 'hi' : 'en'}`).forEach(el => el.style.display = 'none');
            
            // Update language button text
            document.getElementById('lang-text').textContent = currentLang === 'en' ? 'Hi' : 'En';
        }
        
        // Select an answer
        function selectAnswer(qId, option) {
            if (submitted) return;
            
            answers[qId] = option;
            updateProgress();
            
            // Mark question as attempted in the navigation
            const index = questions.findIndex(q => q.id === qId);
            if (index >= 0) {
                const box = document.getElementById(`box-${index}`);
                box.classList.add('attempted');
                box.classList.remove('unattempted');
            }
        }
        
        // Navigate to previous/next question
        function prevQuestion() { 
            if (currentQuestion > 0) showQuestion(currentQuestion - 1); 
        }
        
        function nextQuestion() { 
            if (currentQuestion < questions.length - 1) showQuestion(currentQuestion + 1); 
        }
        
        // Switch section
        function switchSection(sectionId) {
            if (sectionId === 'all') {
                showQuestion(0);
                return;
            }
            
            const section = sections[sectionId];
            if (section) showQuestion(section.start);
        }
        
        // Toggle language
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            applyLanguage();
        }
        
        // Toggle navigation sidebar
        function toggleNav(show) {
            const nav = document.getElementById('question-nav');
            const overlay = document.getElementById('nav-overlay');
            
            if (show === undefined) {
                show = !nav.classList.contains('show');
            }
            
            if (show) {
                nav.classList.add('show');
                overlay.classList.add('show');
                document.body.style.overflow = 'hidden';
            } else {
                nav.classList.remove('show');
                overlay.classList.remove('show');
                document.body.style.overflow = '';
            }
        }
        
        // Update progress
        function updateProgress() {
            const attempted = Object.keys(answers).length;
            document.getElementById('attempted-count').textContent = attempted;
        }
        
        // Start timer
        function startTimer() {
            const timerDisplay = document.getElementById('timer-display');
            let timeLeft = totalTime;
            
            const timerInterval = setInterval(() => {
                if (timeLeft <= 0 || submitted) {
                    clearInterval(timerInterval);
                    if (!submitted) submitTest();
                    return;
                }
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                timeLeft--;
            }, 1000);
        }
        
        // Confirm before submitting
        function confirmSubmit() {
            if (submitted) return;
            
            const attempted = Object.keys(answers).length;
            const remaining = questions.length - attempted;
            
            // Create a more modern confirmation dialog
            const confirmHtml = `
                <div style="text-align: center; padding: 20px;">
                    <h4 style="margin-bottom: 16px; color: var(--dark);">Confirm Submission</h4>
                    <p style="margin-bottom: 24px; color: var(--gray);">
                        You have attempted ${attempted} of ${questions.length} questions.<br>
                        ${remaining} questions are unattempted.
                    </p>
                    <div style="display: flex; justify-content: center; gap: 12px;">
                        <button onclick="this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; border: 1px solid var(--light-gray); background: white; border-radius: 8px; cursor: pointer;">
                            Cancel
                        </button>
                        <button onclick="submitTest(); this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer;">
                            Submit Test
                        </button>
                    </div>
                </div>`;
            
            // Create modal element
            const modal = document.createElement('div');
            modal.className = 'results-modal show';
            modal.innerHTML = `
                <div class="results-card" style="max-width: 400px;">
                    <button class="cancel-btn" style="position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--gray);" onclick="this.closest('.results-modal').remove()">
                        ×
                    </button>
                    ${confirmHtml}
                </div>`;
            
            document.body.appendChild(modal);
        }
        
        // Submit test
        function submitTest() {
            if (submitted) return;
            
            submitted = true;
            
            let score = 0;
            let correctCount = 0;
            let incorrectCount = 0;
            let unattemptedCount = 0;
            
            questions.forEach((q, index) => {
                const userAns = answers[q.id];
                const box = document.getElementById(`box-${index}`);
                
                box.classList.remove('attempted');
                
                if (!userAns) {
                    unattemptedCount++;
                    box.classList.add('unattempted');
                } else if (userAns === q.correct) {
                    correctCount++;
                    score += q.pos_marks;
                    box.classList.add('correct');
                } else {
                    incorrectCount++;
                    score -= q.neg_marks;
                    box.classList.add('incorrect');
                }
            });
            
            // Update result values
            document.getElementById('score-value').textContent = score.toFixed(2);
            document.getElementById('correct-value').textContent = correctCount;
            document.getElementById('incorrect-value').textContent = incorrectCount;
            document.getElementById('unattempted-value').textContent = unattemptedCount;
            
            // Show the results modal
            document.getElementById('results-modal').classList.add('show');
            
            // Disable submit button
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-check"></i>';
            submitBtn.style.backgroundColor = 'var(--success)';
            
            // Refresh current question view to show solution
            showQuestion(currentQuestion);
        }
        
        // Review test
        function reviewTest() {
            document.getElementById('results-modal').classList.remove('show');
            showQuestion(0);
        }
        
        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('results-modal')) {
                document.getElementById('results-modal').classList.remove('show');
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === 'ArrowRight') nextQuestion();
        });
    </script>
</body>
</html>
