                questions.push({
                    id: "13",
                    section: "18",
                    question_en: "<p><span style=\"font-family: Roboto;\">13. </span><span style=\"font-family: Roboto;\">Identify the function of lipase in the process of digestion.</span></p>\n",
                    question_hi: "<p><span style=\"font-family: Roboto;\">13. </span><span style=\"font-family: Palanquin Dark;\">&#2346;&#2366;&#2330;&#2344; &#2325;&#2368; &#2346;&#2381;&#2352;&#2325;&#2381;&#2352;&#2367;&#2351;&#2366; &#2350;&#2375;&#2306; &#2354;&#2366;&#2311;&#2346;&#2375;&#2332; &#2325;&#2375; &#2325;&#2366;&#2352;&#2381;&#2351; &#2325;&#2368; &#2346;&#2361;&#2330;&#2366;&#2344; &#2325;&#2352;&#2375;&#2306;&#2404;</span></p>\n",
                    options_en: ["<p>Breaking down roughage</p>\n", "<p>Breaking down emulsified fats</p>\n", 
                                "<p>Secreting intestinal fluids</p>\n", "<p>Digesting proteins</p>\n"],
                    options_hi: ["<p>&#2352;&#2369;&#2325;&#2381;&#2359;&#2309;&#2306;&#2358; &#2325;&#2366; &#2357;&#2367;&#2328;&#2335;&#2344; &#2325;&#2352;&#2344;&#2366;</p>\n", "<p>&#2346;&#2366;&#2351;&#2360;&#2368;&#2325;&#2371;&#2340; &#2357;&#2360;&#2366; &#2325;&#2366; &#2357;&#2367;&#2328;&#2335;&#2344; &#2325;&#2352;&#2344;&#2366;</p>\n",
                                "<p>&#2310;&#2306;&#2340;&#2381;&#2352; &#2340;&#2352;&#2354; &#2360;&#2381;&#2352;&#2366;&#2357;&#2367;&#2340; &#2325;&#2352;&#2344;&#2366;</p>\n", "<p>&#2346;&#2381;&#2352;&#2379;&#2335;&#2368;&#2344; &#2325;&#2366; &#2346;&#2366;&#2330;&#2344; &#2325;&#2352;&#2344;&#2366;</p>\n"],
                    solution_en: "<p><span style=\"font-family: Roboto;\">13</span><span style=\"font-family: Roboto;\">.(b)<strong> Breaking Down Emulsified Fats. Lipase</strong> </span><span style=\"font-family: Roboto;\">is the enzyme that breaks down the lipids present in the form of emulsified fat and converts them into fatty acids and glycerol. Roughage is broken down by gut bacteria in Large intestine. Digestion of protein is done by several enzymes such as Pepsin, Trypsin, Chymotrypsin. </span></p>\n",
                    solution_hi: "<p><span style=\"font-family: Roboto;\">13</span><span style=\"font-family: Palanquin;\">.(b) <strong>&#2346;&#2366;&#2351;&#2360;&#2368;&#2325;&#2371;&#2340; &#2357;&#2360;&#2366; &#2325;&#2366; &#2357;&#2367;&#2328;&#2335;&#2344; &#2325;&#2352;&#2344;&#2366;&#2404; &#2354;&#2366;&#2311;&#2346;&#2375;&#2332; </strong></span><span style=\"font-family: Palanquin;\">&#2357;&#2361; &#2319;&#2306;&#2332;&#2366;&#2311;&#2350; &#2361;&#2376; &#2332;&#2379; &#2311;&#2350;&#2354;&#2381;&#2360;&#2368;&#2347;&#2366;&#2311;&#2337; &#2357;&#2360;&#2366; &#2325;&#2375; &#2352;&#2370;&#2346; &#2350;&#2375;&#2306; &#2350;&#2380;&#2332;&#2370;&#2342; &#2354;&#2367;&#2346;&#2367;&#2337; &#2325;&#2379; &#2340;&#2379;&#2337;&#2364;&#2340;&#2366; &#2361;&#2376; &#2324;&#2352; &#2313;&#2344;&#2381;&#2361;&#2375;&#2306; &#2347;&#2376;&#2335;&#2368; &#2319;&#2360;&#2367;&#2337; &#2324;&#2352; &#2327;&#2381;&#2354;&#2367;&#2360;&#2352;&#2377;&#2354; &#2350;&#2375;&#2306; &#2346;&#2352;&#2367;&#2357;&#2352;&#2381;&#2340;&#2367;&#2340; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376;&#2404; &#2348;&#2337;&#2364;&#2368; &#2310;&#2306;&#2340; &#2350;&#2375;&#2306; &#2310;&#2306;&#2340; &#2325;&#2375; &#2332;&#2368;&#2357;&#2366;&#2339;&#2369;&#2323;&#2306; &#2342;&#2381;&#2357;&#2366;&#2352;&#2366; &#2352;&#2366;&#2347;&#2375;&#2332; &#2325;&#2379; &#2340;&#2379;&#2337;&#2364; &#2342;&#2367;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404; &#2346;&#2381;&#2352;&#2379;&#2335;&#2368;&#2344; &#2325;&#2366; &#2346;&#2366;&#2330;&#2344; &#2346;&#2375;&#2346;&#2381;&#2360;&#2367;&#2344;, &#2335;&#2381;&#2352;&#2367;&#2346;&#2381;&#2360;&#2367;&#2344;, &#2325;&#2366;&#2311;&#2350;&#2379;&#2335;&#2381;&#2352;&#2367;&#2346;&#2381;&#2360;&#2367;&#2344; &#2332;&#2376;&#2360;&#2375; &#2325;&#2312; &#2319;&#2306;&#2332;&#2366;&#2311;&#2350;&#2379;&#2306; &#2342;&#2381;&#2357;&#2366;&#2352;&#2366; &#2361;&#2379;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\n",
                    correct: "b",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "14",
                    section: "18",
                    question_en: "<p><span style=\"font-family: Roboto;\">14. </span><span style=\"font-family: Roboto;\">Which of the following is the correct match of the column-A with column-B ?</span></p>\r\n<p><img src=\"https://ssccglpinnacle.com/images/mceu_62250559111698050065909.png\" width=\"412\" height=\"108\"></p>\n",

                                "<p>i-c, ii-d, iii-a, iv-b</p>\n", "<p>i-c, ii-d, iii-b, iv-a</p>\n"],
                    solution_en: "<p><span style=\"font-family: Roboto;\">14</span><span style=\"font-family: Roboto;\">.(d)&nbsp; </span><strong>i-c, ii-d, iii-b, iv-a. Alzheimer\'s disease:</strong><span style=\"font-weight: 400;\"> A brain disorder disease that slowly destroys memory and the ability to think. </span><strong>Diphtheria </strong><span style=\"font-weight: 400;\">is an infectious bacterial disease caused by a bacterium called Corynebacterium diphtheriae that produces toxins that can cause breathing difficulties, heart rhythm problems, and even death. </span><strong>Gonorrhea</strong><span style=\"font-weight: 400;\"> is a sexually transmitted infection disease. It most commonly affects the urethra, rectum or throat.</span><strong> Mumps</strong><span style=\"font-weight: 400;\"> is an infectious disease caused by a virus. This can cause painful inflammation of our parotid salivary glands (parotitis).</span></p>\r\n<p><span style=\"font-family: Roboto;\"> </span></p>\n",
                    solution_hi: "<p><span style=\"font-family: Roboto;\">14</span><span style=\"font-family: Palanquin;\">.(d)&nbsp;</span><strong>&nbsp;i-c, ii-d, iii-b, iv-a. &#2309;&#2354;&#2381;&#2332;&#2366;&#2311;&#2350;&#2352; &#2352;&#2379;&#2327;:</strong><span style=\"font-weight: 400;\">&nbsp; &#2351;&#2361; &#2319;&#2325; &#2350;&#2360;&#2381;&#2340;&#2367;&#2359;&#2381;&#2325; &#2357;&#2367;&#2325;&#2366;&#2352; &#2352;&#2379;&#2327;&nbsp; &#2332;&#2379; &#2343;&#2368;&#2352;&#2375;-&#2343;&#2368;&#2352;&#2375; &#2360;&#2381;&#2350;&#2371;&#2340;&#2367; &#2324;&#2352; &#2360;&#2379;&#2330;&#2344;&#2375; &#2325;&#2368; &#2325;&#2381;&#2359;&#2350;&#2340;&#2366; &#2325;&#2379; &#2344;&#2359;&#2381;&#2335; &#2325;&#2352; &#2342;&#2375;&#2340;&#2366; &#2361;&#2376;&#2404; &#2337;&#2367;&#2346;&#2381;&#2341;&#2368;&#2352;&#2367;&#2351;&#2366; &#2319;&#2325; &#2360;&#2306;&#2325;&#2381;&#2352;&#2366;&#2350;&#2325; &#2332;&#2368;&#2357;&#2366;&#2339;&#2369; &#2352;&#2379;&#2327; &#2361;&#2376; &#2332;&#2379; &#2325;&#2377;&#2352;&#2367;&#2344;&#2375;&#2348;&#2376;&#2325;&#2381;&#2335;&#2368;&#2352;&#2367;&#2351;&#2350; &#2337;&#2367;&#2346;&#2381;&#2341;&#2368;&#2352;&#2367;&#2351;&#2366; &#2344;&#2366;&#2350;&#2325; &#2348;&#2376;&#2325;&#2381;&#2335;&#2368;&#2352;&#2367;&#2351;&#2366; &#2325;&#2375; &#2325;&#2366;&#2352;&#2339; &#2361;&#2379;&#2340;&#2366; &#2361;&#2376; &#2332;&#2379; &#2357;&#2367;&#2359;&#2366;&#2325;&#2381;&#2340; &#2346;&#2342;&#2366;&#2352;&#2381;&#2341;&#2379;&#2306; &#2325;&#2366; &#2313;&#2340;&#2381;&#2346;&#2366;&#2342;&#2344; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376; &#2311;&#2360;&#2360;&#2375; &#2360;&#2366;&#2306;&#2360; &#2354;&#2375;&#2344;&#2375; &#2350;&#2375;&#2306; &#2325;&#2336;&#2367;&#2344;&#2366;&#2312;, &#2361;&#2371;&#2342;&#2351; &#2343;&#2396;&#2325;&#2344;&#2375;&nbsp; &#2325;&#2368; &#2360;&#2350;&#2360;&#2381;&#2351;&#2366;&#2319;&#2306; &#2324;&#2352; &#2351;&#2361;&#2366;&#2306; &#2340;&#2325; &#2325;&#2367; &#2350;&#2371;&#2340;&#2381;&#2351;&#2369; &#2349;&#2368; &#2361;&#2379; &#2360;&#2325;&#2340;&#2368; &#2361;&#2376;&#2404;</span><strong> &#2327;&#2379;&#2344;&#2379;&#2352;&#2367;&#2351;&#2366;</strong><span style=\"font-weight: 400;\"> &#2319;&#2325; &#2351;&#2380;&#2344; &#2360;&#2306;&#2330;&#2366;&#2352;&#2367;&#2340; &#2360;&#2306;&#2325;&#2381;&#2352;&#2350;&#2339; &#2352;&#2379;&#2327;&nbsp; &#2361;&#2376;&#2404; &#2351;&#2361; &#2350;&#2370;&#2340;&#2381;&#2352;&#2350;&#2366;&#2352;&#2381;&#2327;, &#2350;&#2354;&#2366;&#2358;&#2351; &#2351;&#2366; &#2327;&#2354;&#2375; &#2325;&#2379; &#2360;&#2348;&#2360;&#2375; &#2309;&#2343;&#2367;&#2325; &#2346;&#2381;&#2352;&#2349;&#2366;&#2357;&#2367;&#2340; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376;&#2404;</span><strong> &#2325;&#2339;&#2381;&#2336;&#2350;&#2366;&#2354;&#2366; </strong><span style=\"font-weight: 400;\">&#2319;&#2325; &#2360;&#2306;&#2325;&#2381;&#2352;&#2366;&#2350;&#2325; &#2352;&#2379;&#2327; &#2361;&#2376; &#2332;&#2379; &#2319;&#2325; &#2357;&#2366;&#2351;&#2352;&#2360; &#2325;&#2375; &#2325;&#2366;&#2352;&#2339; &#2361;&#2379;&#2340;&#2366; &#2361;&#2376;&#2404; &#2351;&#2361; &#2361;&#2350;&#2366;&#2352;&#2368; &#2346;&#2376;&#2352;&#2379;&#2335;&#2367;&#2337; &#2354;&#2366;&#2352; &#2327;&#2381;&#2352;&#2306;&#2341;&#2367;&#2351;&#2379;&#2306; (&#2346;&#2376;&#2352;&#2379;&#2335;&#2366;&#2311;&#2335;&#2367;&#2360;) &#2350;&#2375;&#2306; &#2342;&#2352;&#2381;&#2342;&#2344;&#2366;&#2325; &#2360;&#2370;&#2332;&#2344; &#2346;&#2376;&#2342;&#2366; &#2325;&#2352; &#2360;&#2325;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\n",

                    section: "misc",
                    question_en: "<p><span style=\"font-family: Roboto;\">15. </span><span style=\"font-family: Roboto;\">Creaming fat and sugar, whipping egg whites, or whipping heavy cream are examples of what type of leavening?</span></p>\n",
                    question_hi: "<p><span style=\"font-family: Roboto;\">15. </span><span style=\"font-family: Palanquin;\">&#2357;&#2360;&#2366; &#2324;&#2352; &#2330;&#2368;&#2344;&#2368; &#2325;&#2366; &#2325;&#2381;&#2352;&#2368;&#2350;&#2368;&#2325;&#2352;&#2339;, &#2309;&#2306;&#2337;&#2375; &#2325;&#2368; &#2360;&#2347;&#2375;&#2342;&#2368; &#2325;&#2379; &#2347;&#2375;&#2306;&#2335;&#2344;&#2366;, &#2351;&#2366; &#2349;&#2366;&#2352;&#2368; &#2325;&#2381;&#2352;&#2368;&#2350; &#2325;&#2379; &#2347;&#2375;&#2306;&#2335;&#2344;&#2366; &#2325;&#2367;&#2360; &#2346;&#2381;&#2352;&#2325;&#2366;&#2352; &#2325;&#2375; &#2325;&#2367;&#2339;&#2381;&#2357;&#2344; &#2325;&#2375; &#2313;&#2342;&#2366;&#2361;&#2352;&#2339; &#2361;&#2376;&#2306;?</span></p>\n",
                    options_en: ["<p>Organic leavening</p>\n", "<p>Physical leavening</p>\n", 
                                "<p>Mechanical leavening</p>\n", "<p>Chemical leavening</p>\n"],
                    options_hi: ["<p><span style=\"font-family: Palanquin;\">&#2332;&#2376;&#2357;&#2367;&#2325; &#2325;&#2367;&#2339;&#2381;&#2357;&#2344;</span></p>\n", "<p><span style=\"font-family: Palanquin;\">&#2349;&#2380;&#2340;&#2367;&#2325; &#2325;&#2367;&#2339;&#2381;&#2357;&#2344;</span></p>\n",
                                "<p><span style=\"font-family: Palanquin;\">&#2351;&#2366;&#2306;&#2340;&#2381;&#2352;&#2367;&#2325; &#2325;&#2367;&#2339;&#2381;&#2357;&#2344;</span></p>\n", "<p><span style=\"font-family: Palanquin;\">&#2352;&#2366;&#2360;&#2366;&#2351;&#2344;&#2367;&#2325; &#2325;&#2367;&#2339;&#2381;&#2357;&#2344;</span></p>\n"],
                    solution_en: "<p><span style=\"font-family: Roboto;\">15</span><span style=\"font-family: Roboto;\">.(c)&nbsp; </span><strong>Mechanical leavening. Organic Leavening</strong><span style=\"font-weight: 400;\"> : A unicellular microorganism that reproduces by feeding on sugar, minerals, nitrogen compounds and oxygen. The primary agent used in organic leavening is yeast. </span><strong>Chemical Leavening </strong><span style=\"font-weight: 400;\">: It works by reacting with water, salts, acids to produce carbon dioxide, which causes pastry and bread dough to rise. Example - Baking soda and Baking powder.</span></p>\n",
                    solution_hi: "<p><span style=\"font-family: Roboto;\">15</span><span style=\"font-family: Palanquin;\">.(c)&nbsp; </span><strong>&#2351;&#2366;&#2306;&#2340;&#2381;&#2352;&#2367;&#2325; &#2325;&#2367;&#2339;&#2381;&#2357;&#2344;</strong><span style=\"font-weight: 400;\">&#2404;</span><strong> &#2332;&#2376;&#2357;&#2367;&#2325; &#2325;&#2367;&#2339;&#2381;&#2357;&#2344;:</strong><span style=\"font-weight: 400;\"> &#2319;&#2325;&#2325;&#2379;&#2358;&#2367;&#2325;&#2368;&#2351; &#2360;&#2370;&#2325;&#2381;&#2359;&#2381;&#2350;&#2332;&#2368;&#2357; &#2332;&#2379; &#2330;&#2368;&#2344;&#2368;, &#2326;&#2344;&#2367;&#2332;, &#2344;&#2366;&#2311;&#2335;&#2381;&#2352;&#2379;&#2332;&#2344; &#2351;&#2380;&#2327;&#2367;&#2325;&#2379;&#2306; &#2324;&#2352; &#2321;&#2325;&#2381;&#2360;&#2368;&#2332;&#2344; &#2346;&#2352; &#2349;&#2379;&#2332;&#2344; &#2325;&#2352;&#2325;&#2375; &#2346;&#2381;&#2352;&#2332;&#2344;&#2344; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376;&#2404; &#2332;&#2376;&#2357;&#2367;&#2325; &#2325;&#2367;&#2339;&#2381;&#2357;&#2344; &#2350;&#2375;&#2306; &#2346;&#2381;&#2352;&#2351;&#2369;&#2325;&#2381;&#2340; &#2346;&#2381;&#2352;&#2366;&#2341;&#2350;&#2367;&#2325; &#2319;&#2332;&#2375;&#2306;&#2335; &#2325;&#2367;&#2339;&#2381;&#2357; &#2361;&#2376;&#2404; </span><strong>&#2352;&#2366;&#2360;&#2366;&#2351;&#2344;&#2367;&#2325; &#2325;&#2367;&#2339;&#2381;&#2357;&#2344;:</strong><span style=\"font-weight: 400;\"> &#2351;&#2361; &#2332;&#2354;, &#2354;&#2357;&#2339;, &#2309;&#2350;&#2381;&#2354; &#2325;&#2375; &#2360;&#2366;&#2341; &#2309;&#2349;&#2367;&#2325;&#2381;&#2352;&#2367;&#2351;&#2366;</span><span style=\"font-weight: 400;\"> </span><span style=\"font-weight: 400;\">&#2325;&#2352;&#2325;&#2375; &#2325;&#2366;&#2352;&#2381;&#2348;&#2344; &#2337;&#2366;&#2311;&#2321;&#2325;&#2381;&#2360;&#2366;&#2311;&#2337; &#2325;&#2366; &#2313;&#2340;&#2381;&#2346;&#2366;&#2342;&#2344; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376;, &#2332;&#2367;&#2360;&#2360;&#2375; &#2346;&#2375;&#2360;&#2381;&#2335;&#2381;&#2352;&#2368; &#2324;&#2352; &#2348;&#2381;&#2352;&#2375;&#2337; &#2325;&#2366; &#2310;&#2335;&#2366; &#2347;&#2370;&#2354; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404; &#2313;&#2342;&#2366;&#2361;&#2352;&#2339; - &#2348;&#2375;&#2325;&#2367;&#2306;&#2327; &#2360;&#2379;&#2337;&#2366; &#2324;&#2352; &#2348;&#2375;&#2325;&#2367;&#2306;&#2327; &#2346;&#2366;&#2313;&#2337;&#2352;&#2404;</span></p>\n",
                    correct: "c",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
            
            // Generate question boxes
            const boxesContainer = document.getElementById('question-boxes');
            questions.forEach((q, index) => {
                const box = document.createElement('div');
                box.className = 'q-box';
                box.textContent = index + 1;
                box.onclick = () => showQuestion(index);
                box.id = `box-${index}`;
                boxesContainer.appendChild(box);
            });
            
            // Show first question
            showQuestion(0);
            updateProgress();
        }
        
        // Show a specific question
        
        function formatContent(text) {
            if (!text) return '';
            return text.replace(/<img/g, '<img style="max-width:100%;height:auto;"');
        }
        
        function showQuestion(index) {
            if (index < 0 || index >= questions.length) return;
            
            currentQuestion = index;
            const question = questions[index];
            
            // Update question counter
            document.getElementById('question-counter').textContent = `Question ${index + 1} of ${questions.length}`;
            
            // Update question boxes
            document.querySelectorAll('.q-box').forEach(box => box.classList.remove('current'));
            document.getElementById(`box-${index}`).classList.add('current');
            
            // Generate question HTML
            let html = `
                <div class="question-card">
                    <div class="question-text">
                        <div class="en">${formatContent(question.question_en)}</div>
                        <div class="hi" style="display:none">${formatContent(question.question_hi)} </div>
                    </div>
                    <div class="options" id="options-container">`;
            
            // Add options
            ['a', 'b', 'c', 'd'].forEach((opt, i) => {
                let optionClass = '';
                let isCorrectAnswer = opt === question.correct;
                let isUserAnswer = answers[question.id] === opt;
                
                // When reviewing, add appropriate classes
                if (submitted) {
                    if (isCorrectAnswer) {
                        optionClass += ' correct-answer';
                    } else if (isUserAnswer && !isCorrectAnswer) {
                        optionClass += ' incorrect';
                    }
                }
                
                html += `
                    <div class="option-item">
                        <input class="option-input" type="radio" name="q${index}" 
                            id="opt-${index}-${opt}" value="${opt}" 
                            ${isUserAnswer ? 'checked' : ''}
                            onclick="selectAnswer('${question.id}', '${opt}')">
                       <label class="option-label${optionClass}" for="opt-${index}-${opt}">
                            <div class="en">${question.options_en[i]}</div>
                            <div class="hi" style="display:none">${question.options_hi[i]}</div>
                        </label>
                    </div>`;
            });
            
            // Add solution if submitted
            if (submitted) {
                const isCorrect = answers[question.id] === question.correct;
                const resultText = answers[question.id] ? (isCorrect ? 'Correct!' : 'Incorrect!') : 'Not attempted';
                
                html += `
                    <div class="solution-container">
                        <div class="solution-title">${resultText}</div>
                        <div class="solution-text">
                            <div class="en">${question.solution_en}</div>
                            <div class="hi" style="display:none">${question.solution_hi}</div>
                        </div>
                    </div>`;
            }
            
            html += `</div></div>`;
            
            document.getElementById('questions-container').innerHTML = html;
            
            // Apply language settings
            applyLanguage();
            
            // If in mobile view, close the menu
            if (window.innerWidth < 992) {
                toggleNav(false);
            }
            
            // Add review mode class if submitted
            if (submitted) {
                document.getElementById('options-container').classList.add('review-mode');
            }
        }
        
        // Apply current language
        function applyLanguage() {
            document.querySelectorAll(`.${currentLang}`).forEach(el => el.style.display = 'block');
            document.querySelectorAll(`.${currentLang === 'en' ? 'hi' : 'en'}`).forEach(el => el.style.display = 'none');
            
            // Update language button text
            document.getElementById('lang-text').textContent = currentLang === 'en' ? 'Hi' : 'En';
        }
        
        // Select an answer
        function selectAnswer(qId, option) {
            if (submitted) return;
            
            answers[qId] = option;
            updateProgress();
            
            // Mark question as attempted in the navigation
            const index = questions.findIndex(q => q.id === qId);
            if (index >= 0) {
                const box = document.getElementById(`box-${index}`);
                box.classList.add('attempted');
                box.classList.remove('unattempted');
            }
        }
        
        // Navigate to previous/next question
        function prevQuestion() { 
            if (currentQuestion > 0) showQuestion(currentQuestion - 1); 
        }
        
        function nextQuestion() { 
            if (currentQuestion < questions.length - 1) showQuestion(currentQuestion + 1); 
        }
        
        // Switch section
        function switchSection(sectionId) {
            if (sectionId === 'all') {
                showQuestion(0);
                return;
            }
            
            const section = sections[sectionId];
            if (section) showQuestion(section.start);
        }
        
        // Toggle language
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            applyLanguage();
        }
        
        // Toggle navigation sidebar
        function toggleNav(show) {
            const nav = document.getElementById('question-nav');
            const overlay = document.getElementById('nav-overlay');
            
            if (show === undefined) {
                show = !nav.classList.contains('show');
            }
            
            if (show) {
                nav.classList.add('show');
                overlay.classList.add('show');
                document.body.style.overflow = 'hidden';
            } else {
                nav.classList.remove('show');
                overlay.classList.remove('show');
                document.body.style.overflow = '';
            }
        }
        
        // Update progress
        function updateProgress() {
            const attempted = Object.keys(answers).length;
            document.getElementById('attempted-count').textContent = attempted;
        }
        
        // Start timer
        function startTimer() {
            const timerDisplay = document.getElementById('timer-display');
            let timeLeft = totalTime;
            
            const timerInterval = setInterval(() => {
                if (timeLeft <= 0 || submitted) {
                    clearInterval(timerInterval);
                    if (!submitted) submitTest();
                    return;
                }
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                timeLeft--;
            }, 1000);
        }
        
        // Confirm before submitting
        function confirmSubmit() {
            if (submitted) return;
            
            const attempted = Object.keys(answers).length;
            const remaining = questions.length - attempted;
            
            // Create a more modern confirmation dialog
            const confirmHtml = `
                <div style="text-align: center; padding: 20px;">
                    <h4 style="margin-bottom: 16px; color: var(--dark);">Confirm Submission</h4>
                    <p style="margin-bottom: 24px; color: var(--gray);">
                        You have attempted ${attempted} of ${questions.length} questions.<br>
                        ${remaining} questions are unattempted.
                    </p>
                    <div style="display: flex; justify-content: center; gap: 12px;">
                        <button onclick="this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; border: 1px solid var(--light-gray); background: white; border-radius: 8px; cursor: pointer;">
                            Cancel
                        </button>
                        <button onclick="submitTest(); this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer;">
                            Submit Test
                        </button>
                    </div>
                </div>`;
            
            // Create modal element
            const modal = document.createElement('div');
            modal.className = 'results-modal show';
            modal.innerHTML = `
                <div class="results-card" style="max-width: 400px;">
                    <button class="cancel-btn" style="position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--gray);" onclick="this.closest('.results-modal').remove()">
                        ×
                    </button>
                    ${confirmHtml}
                </div>`;
            
            document.body.appendChild(modal);
        }
        
        // Submit test
        function submitTest() {
            if (submitted) return;
            
            submitted = true;
            
            let score = 0;
            let correctCount = 0;
            let incorrectCount = 0;
            let unattemptedCount = 0;
            
            questions.forEach((q, index) => {
                const userAns = answers[q.id];
                const box = document.getElementById(`box-${index}`);
                
                box.classList.remove('attempted');
                
                if (!userAns) {
                    unattemptedCount++;
                    box.classList.add('unattempted');
                } else if (userAns === q.correct) {
                    correctCount++;
                    score += q.pos_marks;
                    box.classList.add('correct');
                } else {
                    incorrectCount++;
                    score -= q.neg_marks;
                    box.classList.add('incorrect');
                }
            });
            
            // Update result values
            document.getElementById('score-value').textContent = score.toFixed(2);
            document.getElementById('correct-value').textContent = correctCount;
            document.getElementById('incorrect-value').textContent = incorrectCount;
            document.getElementById('unattempted-value').textContent = unattemptedCount;
            
            // Show the results modal
            document.getElementById('results-modal').classList.add('show');
            
            // Disable submit button
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-check"></i>';
            submitBtn.style.backgroundColor = 'var(--success)';
            
            // Refresh current question view to show solution
            showQuestion(currentQuestion);
        }
        
        // Review test
        function reviewTest() {
            document.getElementById('results-modal').classList.remove('show');
            showQuestion(0);
        }
        
        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('results-modal')) {
                document.getElementById('results-modal').classList.remove('show');
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === 'ArrowRight') nextQuestion();
        });
    </script>
</body>
</html>
