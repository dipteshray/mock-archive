                    neg_marks: 0.5
                });
                questions.push({
                    id: "9",
                    section: "18",
                    question_en: "<p><span style=\"font-family: Roboto;\">9.</span><span style=\"font-family: Roboto;\">Who among the following Mauryan rulers conquered Kalinga?</span></p>\n",
                    question_hi: "<p><span style=\"font-family: Roboto;\">9.</span><span style=\"font-family: Palanquin;\"> &#2344;&#2367;&#2350;&#2381;&#2344;&#2354;&#2367;&#2326;&#2367;&#2340; &#2350;&#2375;&#2306; &#2360;&#2375; &#2325;&#2367;&#2360; &#2350;&#2380;&#2352;&#2381;&#2351; &#2358;&#2366;&#2360;&#2325; &#2344;&#2375; &#2325;&#2354;&#2367;&#2306;&#2327; &#2346;&#2352; &#2357;&#2367;&#2332;&#2351; &#2346;&#2381;&#2352;&#2366;&#2346;&#2381;&#2340; &#2325;&#2368; &#2341;&#2368;?</span></p>\n",
                    options_en: ["<p>Ashoka</p>\n", "<p>Bindusara</p>\n", 
                                "<p>Brihadratha</p>\n", "<p>Chandragupta Maurya</p>\n"],
                    options_hi: ["<p>&#2309;&#2358;&#2379;&#2325;</p>\n", "<p>&#2348;&#2367;&#2344;&#2381;&#2342;&#2369;&#2360;&#2366;&#2352;</p>\n",
                                "<p>&#2348;&#2371;&#2361;&#2342;&#2381;&#2352;&#2341;</p>\n", "<p>&#2330;&#2306;&#2342;&#2381;&#2352;&#2327;&#2369;&#2346;&#2381;&#2340; &#2350;&#2380;&#2352;&#2381;&#2351;</p>\n"],
                    solution_en: "<p><span style=\"font-family: Roboto;\">9</span><span style=\"font-family: Roboto;\">.</span><span style=\"font-family: Roboto;\">(a)</span><span style=\"font-family: Roboto;\"> <strong>Ashoka </strong></span><span style=\"font-family: Roboto;\">waged a massive war against Kalinga and conquered it in 261 BCE. Chandragupta Maurya - founder of the Mauryan dynasty and the first emperor to unify most of India under one administration. Bindusara (Amitraghata) - Son of Chandragupta and the father of Ashoka. Brihadratha - The 9th and last Emperor of the Mauryan Empire. </span></p>\n",
                    solution_hi: "<p><span style=\"font-family: Roboto;\">9</span><span style=\"font-family: Palanquin;\">.(a) <strong>&#2309;&#2358;&#2379;&#2325; </strong></span><span style=\"font-family: Palanquin;\">&#2344;&#2375; &#2325;&#2354;&#2367;&#2306;&#2327; &#2325;&#2375; &#2326;&#2367;&#2354;&#2366;&#2347; &#2348;&#2337;&#2364;&#2375; &#2346;&#2376;&#2350;&#2366;&#2344;&#2375; &#2346;&#2352; &#2351;&#2369;&#2342;&#2381;&#2343; &#2331;&#2375;&#2337;&#2364;&#2366; &#2324;&#2352; 261 &#2312;&#2360;&#2366; &#2346;&#2370;&#2352;&#2381;&#2357; &#2350;&#2375;&#2306; &#2311;&#2360;&#2375; &#2332;&#2368;&#2340; &#2354;&#2367;&#2351;&#2366;&#2404; &#2330;&#2306;&#2342;&#2381;&#2352;&#2327;&#2369;&#2346;&#2381;&#2340; &#2350;&#2380;&#2352;&#2381;&#2351; - &#2350;&#2380;&#2352;&#2381;&#2351; &#2357;&#2306;&#2358; &#2325;&#2375; &#2360;&#2306;&#2360;&#2381;&#2341;&#2366;&#2346;&#2325; &#2324;&#2352; &#2349;&#2366;&#2352;&#2340; &#2325;&#2375; &#2309;&#2343;&#2367;&#2325;&#2366;&#2306;&#2358; &#2361;&#2367;&#2360;&#2381;&#2360;&#2379;&#2306; &#2325;&#2379; &#2319;&#2325; &#2346;&#2381;&#2352;&#2358;&#2366;&#2360;&#2344; &#2325;&#2375; &#2340;&#2361;&#2340; &#2319;&#2325;&#2332;&#2369;&#2335; &#2325;&#2352;&#2344;&#2375; &#2357;&#2366;&#2354;&#2375; &#2346;&#2361;&#2354;&#2375; &#2360;&#2350;&#2381;&#2352;&#2366;&#2335;&#2404; &#2348;&#2367;&#2306;&#2342;&#2369;&#2360;&#2366;&#2352; (&#2309;&#2350;&#2367;&#2340;&#2381;&#2352;&#2328;&#2366;&#2340;) - &#2330;&#2306;&#2342;&#2381;&#2352;&#2327;&#2369;&#2346;&#2381;&#2340; &#2325;&#2366; &#2346;&#2369;&#2340;&#2381;&#2352; &#2324;&#2352; &#2309;&#2358;&#2379;&#2325; &#2325;&#2366; &#2346;&#2367;&#2340;&#2366;&#2404; &#2348;&#2371;&#2361;&#2342;&#2381;&#2352;&#2341; - &#2350;&#2380;&#2352;&#2381;&#2351; &#2360;&#2366;&#2350;&#2381;&#2352;&#2366;&#2332;&#2381;&#2351; &#2325;&#2375; 9&#2357;&#2375;&#2306; &#2324;&#2352; &#2309;&#2306;&#2340;&#2367;&#2350; &#2360;&#2350;&#2381;&#2352;&#2366;&#2335;&#2404;</span></p>\n",
                    correct: "a",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "10",
                    section: "18",
                    question_en: "<p><span style=\"font-family: Roboto;\">10.</span><span style=\"font-family: Roboto;\"> When and at which place did the Jallianwala Bagh massacre take place?</span></p>\n",
                    question_hi: "<p><span style=\"font-family: Roboto;\">10. </span><span style=\"font-family: Palanquin;\">&#2332;&#2354;&#2367;&#2351;&#2366;&#2306;&#2357;&#2366;&#2354;&#2366; &#2348;&#2366;&#2327; &#2361;&#2340;&#2381;&#2351;&#2366;&#2325;&#2366;&#2306;&#2337; &#2325;&#2348; &#2324;&#2352; &#2325;&#2367;&#2360; &#2360;&#2381;&#2341;&#2366;&#2344; &#2346;&#2352; &#2361;&#2369;&#2310; &#2341;&#2366;?</span></p>\n",
                    options_en: ["<p>On 13 April 1919, at Amritsar</p>\n", "<p>On 12 April 1919, at Chauri Chaura</p>\n", 
                                "<p>On 13 May 1918, at Amritsar</p>\n", "<p>On 14 March 1919, at Amritsar</p>\n"],
                    options_hi: ["<p>13 &#2309;&#2346;&#2381;&#2352;&#2376;&#2354; 1919, &#2309;&#2350;&#2371;&#2340;&#2360;&#2352;</p>\n", "<p>12 &#2309;&#2346;&#2381;&#2352;&#2376;&#2354; 1919, &#2330;&#2380;&#2352;&#2368; &#2330;&#2380;&#2352;&#2366;</p>\n",
                                "<p>13 &#2350;&#2312; 1918, &#2309;&#2350;&#2371;&#2340;&#2360;&#2352;</p>\n", "<p>14 &#2350;&#2366;&#2352;&#2381;&#2330; 1919, &#2309;&#2350;&#2371;&#2340;&#2360;&#2352;</p>\n"],
                    solution_en: "<p><span style=\"font-family: Roboto;\">10</span><span style=\"font-family: Roboto;\">.(a) <strong>On 13 April 1919, at Amritsar </strong></span><span style=\"font-family: Roboto;\">(occasion of Baisakhi). Rabindranath Tagore and Mahatma Gandhi gave up their knighthood and &lsquo;Kaiser-e-hind&rsquo; title respectively, given to them by the British. The Hunter Commission was set up to inquire into the massacre in 1920. The person responsible for the massacre was General Dyer (he ordered troops to fire). Udham Singh killed Michael O\'Dwyer (Punjab\'s Lieutenant Governor in 1919) in 1940 .</span></p>\n",
                    solution_hi: "<p><span style=\"font-family: Roboto;\">10</span><span style=\"font-family: Palanquin;\">.(a) <strong>13 &#2309;&#2346;&#2381;&#2352;&#2376;&#2354; 1919 &#2325;&#2379;</strong> &#2404; </span><span style=\"font-family: Palanquin;\">&#2309;&#2350;&#2371;&#2340;&#2360;&#2352; &#2350;&#2375;&#2306; &#2361;&#2369;&#2319; &#2361;&#2340;&#2381;&#2351;&#2366;&#2325;&#2366;&#2306;&#2337; &#2325;&#2375; &#2325;&#2366;&#2352;&#2339; (&#2348;&#2376;&#2360;&#2366;&#2326;&#2368; &#2325;&#2375; &#2309;&#2357;&#2360;&#2352; &#2346;&#2352;) &#2352;&#2357;&#2368;&#2306;&#2342;&#2381;&#2352;&#2344;&#2366;&#2341; &#2335;&#2376;&#2327;&#2379;&#2352; &#2324;&#2352; &#2350;&#2361;&#2366;&#2340;&#2381;&#2350;&#2366; &#2327;&#2366;&#2306;&#2343;&#2368; &#2344;&#2375; &#2309;&#2306;&#2327;&#2381;&#2352;&#2375;&#2332;&#2379;&#2306; &#2342;&#2381;&#2357;&#2366;&#2352;&#2366; &#2342;&#2368; &#2327;&#2312; &#2313;&#2346;&#2366;&#2343;&#2367; &#2325;&#2381;&#2352;&#2350;&#2358;&#2307; &#2309;&#2346;&#2344;&#2368; &#2344;&#2366;&#2311;&#2335;&#2361;&#2369;&#2337; &#2324;&#2352; \'&#2325;&#2376;&#2360;&#2352;-&#2319;-&#2361;&#2367;&#2306;&#2342;\' &#2325;&#2379; &#2357;&#2366;&#2346;&#2360; &#2354;&#2380;&#2335;&#2366; &#2342;&#2367;&#2351;&#2366;&#2404; 1919 &#2350;&#2375;&#2306; &#2361;&#2369;&#2319; &#2332;&#2354;&#2367;&#2351;&#2366;&#2306;&#2357;&#2366;&#2354;&#2366; &#2348;&#2366;&#2327; &#2361;&#2340;&#2381;&#2351;&#2366;&#2325;&#2366;&#2306;&#2337; &#2325;&#2368; &#2332;&#2366;&#2306;&#2330; &#2325;&#2375; &#2354;&#2367;&#2319; &#2361;&#2306;&#2335;&#2352; &#2325;&#2350;&#2368;&#2358;&#2344; &#2325;&#2366; &#2327;&#2336;&#2344; &#2325;&#2367;&#2351;&#2366; &#2327;&#2351;&#2366; &#2341;&#2366;&#2404; &#2311;&#2360; &#2344;&#2352;&#2360;&#2306;&#2361;&#2366;&#2352; &#2325;&#2375; &#2354;&#2367;&#2319; &#2332;&#2367;&#2350;&#2381;&#2350;&#2375;&#2342;&#2366;&#2352; &#2357;&#2381;&#2351;&#2325;&#2381;&#2340;&#2367; &#2332;&#2344;&#2352;&#2354; &#2337;&#2366;&#2351;&#2352; &#2341;&#2366; (&#2313;&#2360;&#2344;&#2375; &#2360;&#2376;&#2344;&#2367;&#2325;&#2379;&#2306; &#2325;&#2379; &#2327;&#2379;&#2354;&#2368; &#2330;&#2354;&#2366;&#2344;&#2375; &#2325;&#2366; &#2310;&#2342;&#2375;&#2358; &#2342;&#2367;&#2351;&#2366; &#2341;&#2366;)&#2404; &#2313;&#2343;&#2350; &#2360;&#2367;&#2306;&#2361; &#2344;&#2375; 1940 &#2350;&#2375;&#2306; &#2350;&#2366;&#2311;&#2325;&#2354; &#2323;\'&#2337;&#2366;&#2351;&#2352; (1919 &#2350;&#2375;&#2306; &#2346;&#2306;&#2332;&#2366;&#2348; &#2325;&#2375; &#2354;&#2375;&#2347;&#2381;&#2335;&#2367;&#2344;&#2375;&#2306;&#2335; &#2327;&#2357;&#2352;&#2381;&#2344;&#2352;) &#2325;&#2368; &#2361;&#2340;&#2381;&#2351;&#2366; &#2325;&#2352; &#2342;&#2368;&#2404;</span></p>\n",
                    correct: "a",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "11",
                    section: "18",
                    question_en: "<p><span style=\"font-family: Roboto;\">11</span><span style=\"font-family: Roboto;\">. Who designed the administrative code to separate revenue administration from judicial administration?</span></p>\n",
                    question_hi: "<p><span style=\"font-family: Roboto;\">11</span><span style=\"font-family: Palanquin;\">. &#2352;&#2366;&#2332;&#2360;&#2381;&#2357; &#2346;&#2381;&#2352;&#2358;&#2366;&#2360;&#2344; &#2325;&#2379; &#2344;&#2381;&#2351;&#2366;&#2351;&#2367;&#2325; &#2346;&#2381;&#2352;&#2358;&#2366;&#2360;&#2344; &#2360;&#2375; &#2309;&#2354;&#2327; &#2325;&#2352;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2346;&#2381;&#2352;&#2358;&#2366;&#2360;&#2344;&#2367;&#2325; &#2360;&#2306;&#2361;&#2367;&#2340;&#2366; &#2325;&#2379; &#2325;&#2367;&#2360;&#2344;&#2375; &#2337;&#2367;&#2332;&#2366;&#2311;&#2344; &#2325;&#2367;&#2351;&#2366; &#2341;&#2366;?</span></p>\n",
                    options_en: ["<p>Lord Lytton</p>\n", "<p>Lord Cornwallis</p>\n", 
                                "<p>Lord Auckland</p>\n", "<p>Warren Hastings</p>\n"],
                    options_hi: ["<p><span style=\"font-weight: 400;\">&nbsp;&#2354;&#2377;&#2352;&#2381;&#2337; &#2354;&#2367;&#2335;&#2344; (Lord Lytton)</span></p>\n", "<p><span style=\"font-weight: 400;\">&nbsp;&#2354;&#2377;&#2352;&#2381;&#2337; &#2325;&#2377;&#2352;&#2381;&#2344;&#2357;&#2366;&#2354;&#2367;&#2360; (Lord Cornwallis)</span></p>\n",
                                "<p><span style=\"font-weight: 400;\">&#2354;&#2377;&#2352;&#2381;&#2337; &#2321;&#2325;&#2354;&#2376;&#2306;&#2337; (Lord Auckland)</span></p>\n", "<p><span style=\"font-weight: 400;\">&#2357;&#2366;&#2352;&#2375;&#2344; &#2361;&#2375;&#2360;&#2381;&#2335;&#2367;&#2306;&#2327;&#2381;&#2360; (Warren Hastings)</span></p>\n"],
                    solution_en: "<p><span style=\"font-family: Roboto;\">11</span><span style=\"font-family: Roboto;\">.(b) <strong>Lord Cornwallis</strong>. </span><span style=\"font-family: Roboto;\">He introduced Permanent settlement in 1793 in Bengal. He is known as \'the Father of civil service in India\', Governor general of Bengal (1786-93). Warren Hastings - first Governor General of Bengal (1774-85), played a key role in the abolishment of the Dual System that had been established by Sir Robert Clive. Lord Auckland - Governor-General of India (1836 - 1842). Lord Lytton - Viceroy of India (1876 - 1880), he passed the Arms Act in 1878. </span></p>\r\n<p><span style=\"font-family: Roboto;\"> </span></p>\n",
                    solution_hi: "<p><span style=\"font-family: Roboto;\">11</span><span style=\"font-family: Palanquin;\">.(b) <strong>&nbsp;&#2354;&#2377;&#2352;&#2381;&#2337; &#2325;&#2377;&#2352;&#2381;&#2344;&#2357;&#2377;&#2354;&#2367;&#2360; &#2404;&nbsp;</strong></span><span style=\"font-family: Palanquin;\">&#2313;&#2344;&#2381;&#2361;&#2379;&#2306;&#2344;&#2375; 1793 &#2350;&#2375;&#2306; &#2348;&#2306;&#2327;&#2366;&#2354; &#2350;&#2375;&#2306; &#2360;&#2381;&#2341;&#2366;&#2351;&#2368; &#2348;&#2306;&#2342;&#2379;&#2348;&#2360;&#2381;&#2340; &#2325;&#2368; &#2360;&#2381;&#2341;&#2366;&#2346;&#2344;&#2366; &#2325;&#2368;&#2404; &#2340;&#2341;&#2366; &#2313;&#2344;&#2381;&#2361;&#2375;&#2306; \'&#2349;&#2366;&#2352;&#2340; &#2350;&#2375;&#2306; &#2360;&#2367;&#2357;&#2367;&#2354; &#2360;&#2375;&#2357;&#2366; &#2325;&#2375; &#2332;&#2344;&#2325;&rsquo; &#2325;&#2375; &#2352;&#2370;&#2346; &#2350;&#2375;&#2306; &#2349;&#2368; &#2332;&#2366;&#2344;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;, &#2357;&#2375; &#2348;&#2306;&#2327;&#2366;&#2354; &#2325;&#2375; &#2327;&#2357;&#2352;&#2381;&#2344;&#2352; &#2332;&#2344;&#2352;&#2354; (1786-93) &#2341;&#2375;&#2404; &#2357;&#2377;&#2352;&#2375;&#2344; &#2361;&#2375;&#2360;&#2381;&#2335;&#2367;&#2306;&#2327;&#2381;&#2360; - &#2348;&#2306;&#2327;&#2366;&#2354; &#2325;&#2375; &#2346;&#2381;&#2352;&#2341;&#2350; &#2327;&#2357;&#2352;&#2381;&#2344;&#2352; &#2332;&#2344;&#2352;&#2354; (1774-85) &#2341;&#2375;, &#2360;&#2352; &#2352;&#2377;&#2348;&#2352;&#2381;&#2335; &#2325;&#2381;&#2354;&#2366;&#2311;&#2357; &#2342;&#2381;&#2357;&#2366;&#2352;&#2366; &#2360;&#2381;&#2341;&#2366;&#2346;&#2367;&#2340; &#2342;&#2379;&#2361;&#2352;&#2368; &#2357;&#2381;&#2351;&#2357;&#2360;&#2381;&#2341;&#2366; (dual system) &#2325;&#2375; &#2313;&#2344;&#2381;&#2350;&#2370;&#2354;&#2344; &#2350;&#2375;&#2306; &#2350;&#2361;&#2340;&#2381;&#2357;&#2346;&#2370;&#2352;&#2381;&#2339; &#2349;&#2370;&#2350;&#2367;&#2325;&#2366; &#2344;&#2367;&#2349;&#2366;&#2312;&#2404;&#2404; &#2354;&#2377;&#2352;&#2381;&#2337; &#2321;&#2325;&#2354;&#2376;&#2306;&#2337; - &#2349;&#2366;&#2352;&#2340; &#2325;&#2375; &#2327;&#2357;&#2352;&#2381;&#2344;&#2352; &#2332;&#2344;&#2352;&#2354; (1836-1842) &#2404; &#2354;&#2377;&#2352;&#2381;&#2337; &#2354;&#2367;&#2335;&#2344; - &#2349;&#2366;&#2352;&#2340; &#2325;&#2375; &#2357;&#2366;&#2351;&#2360;&#2352;&#2366;&#2351; (1876-1880) &#2341;&#2375;, &#2313;&#2344;&#2381;&#2361;&#2379;&#2306;&#2344;&#2375; 1878 &#2350;&#2375;&#2306; &#2310;&#2352;&#2381;&#2350;&#2381;&#2360; &#2319;&#2325;&#2381;&#2335; &#2346;&#2366;&#2352;&#2367;&#2340; &#2325;&#2367;&#2351;&#2366;&#2404;</span></p>\n",
                    correct: "b",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "12",
                    section: "18",
                    question_en: "<p><span style=\"font-family: Roboto;\">12</span><span style=\"font-family: Roboto;\">. Chandragupta Maurya overthrew the Nanda Dynasty of Magadha with the help of__________.</span></p>\n",
                    question_hi: "<p><span style=\"font-family: Roboto;\">12</span><span style=\"font-family: Palanquin;\">. &#2330;&#2306;&#2342;&#2381;&#2352;&#2327;&#2369;&#2346;&#2381;&#2340; &#2350;&#2380;&#2352;&#2381;&#2351; &#2344;&#2375; ________ &#2325;&#2368; &#2360;&#2361;&#2366;&#2351;&#2340;&#2366; &#2360;&#2375; &#2350;&#2327;&#2343; &#2325;&#2375; &#2344;&#2306;&#2342; &#2357;&#2306;&#2358; &#2325;&#2379; &#2313;&#2326;&#2366;&#2337;&#2364; &#2347;&#2375;&#2306;&#2325;&#2366;&#2404;</span></p>\n",
                    options_en: ["<p>Skandagupta</p>\n", "<p>Chandragupta II</p>\n", 
                                "<p>Vishnugupta</p>\n", "<p>Samudragupta</p>\n"],
                    options_hi: ["<p>&#2360;&#2381;&#2325;&#2344;&#2381;&#2342;&#2327;&#2369;&#2346;&#2381;&#2340;</p>\n", "<p>&#2330;&#2306;&#2342;&#2381;&#2352;&#2327;&#2369;&#2346;&#2381;&#2340; &#2405;</p>\n",
                                "<p>&#2357;&#2367;&#2359;&#2381;&#2339;&#2369;&#2327;&#2369;&#2346;&#2381;&#2340;</p>\n", "<p>&#2360;&#2350;&#2369;&#2342;&#2381;&#2352;&#2327;&#2369;&#2346;&#2381;&#2340;</p>\n"],
                    solution_en: "<p><span style=\"font-family: Roboto;\">12</span><span style=\"font-family: Roboto;\">.(c)&nbsp; </span><strong>Vishnugupta</strong><span style=\"font-weight: 400;\"> (Kautilya). Chandragupta Maurya - Founder of Maurya dynasty (321&ndash;185 BCE). The Nanda dynasty&nbsp; (343 BCE to 321 BCE) - founded by Mahapadma Nanda. Magadha was ruled by the Haryanka dynasty, the Shishunaga dynasty, the Nanda dynasty, the Mauryan dynasty, the Shunga dynasty and the Kanva dynasty</span><strong>.&nbsp; Samudragupta -</strong><span style=\"font-weight: 400;\"> Known as the &ldquo;Indian Napoleon&rdquo;.</span></p>\n",

                                "<p>&#2309;&#2344;&#2370;&#2346; &#2357;&#2367;&#2354;&#2366;&#2360;</p>\n", "<p>&#2352;&#2366;&#2327; &#2340;&#2352;&#2306;&#2327;&#2367;&#2339;&#2368;</p>\n"],
                    solution_en: "<p><span style=\"font-family: Roboto;\">15</span><span style=\"font-family: Roboto;\">.(d) <strong>Raag Tarangini </strong>- </span><span style=\"font-family: Roboto;\"> Initiated an alternative system of the division of rags, \'the Thaat system\'. Lochan Kavi (Lochan Pan&#7693;it) belonged to the Mithila region (Bihar). &ldquo;Sangeet Darpan&rdquo; was written by Damodar Pandit. &ldquo;Anup Rag Vilas&rdquo; is written by Kumar Gandharva. </span></p>\n",
                    solution_hi: "<p><span style=\"font-family: Roboto;\">15</span><span style=\"font-family: Palanquin;\">.(d) <strong>&#2352;&#2366;&#2327; &#2340;&#2352;&#2306;&#2327;&#2367;&#2339;&#2368; -</strong></span><span style=\"font-family: Palanquin;\"> &#2352;&#2366;&#2327;&#2379;&#2306; &#2325;&#2375; &#2357;&#2367;&#2349;&#2366;&#2332;&#2344; &#2325;&#2368; &#2319;&#2325; &#2357;&#2376;&#2325;&#2354;&#2381;&#2346;&#2367;&#2325; &#2346;&#2381;&#2352;&#2339;&#2366;&#2354;&#2368;, &lsquo;&#2341;&#2366;&#2335; &#2346;&#2381;&#2352;&#2339;&#2366;&#2354;&#2368;\' &#2325;&#2368; &#2358;&#2369;&#2352;&#2369;&#2310;&#2340; &#2325;&#2368;&#2404; &#2354;&#2379;&#2330;&#2344; &#2325;&#2357;&#2367; (&#2354;&#2379;&#2330;&#2344; &#2346;&#2306;&#2337;&#2367;&#2340;) &#2350;&#2367;&#2341;&#2367;&#2354;&#2366; &#2325;&#2381;&#2359;&#2375;&#2340;&#2381;&#2352; (&#2348;&#2367;&#2361;&#2366;&#2352;) &#2325;&#2375; &#2341;&#2375;&#2404; \"&#2360;&#2306;&#2327;&#2368;&#2340; &#2342;&#2352;&#2381;&#2346;&#2339;\" &#2342;&#2366;&#2350;&#2379;&#2342;&#2352; &#2346;&#2306;&#2337;&#2367;&#2340; &#2342;&#2381;&#2357;&#2366;&#2352;&#2366; &#2354;&#2367;&#2326;&#2366; &#2327;&#2351;&#2366; &#2404; \"&#2309;&#2344;&#2370;&#2346; &#2352;&#2366;&#2327; &#2357;&#2367;&#2354;&#2366;&#2360;\" &#2325;&#2369;&#2350;&#2366;&#2352; &#2327;&#2306;&#2343;&#2352;&#2381;&#2357; &#2342;&#2381;&#2357;&#2366;&#2352;&#2366; &#2354;&#2367;&#2326;&#2366; &#2327;&#2351;&#2366;&#2404;</span></p>\n",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
            
            // Generate question boxes
            const boxesContainer = document.getElementById('question-boxes');
            questions.forEach((q, index) => {
                const box = document.createElement('div');
                box.className = 'q-box';
                box.textContent = index + 1;
                box.onclick = () => showQuestion(index);
                box.id = `box-${index}`;
                boxesContainer.appendChild(box);
            });
            
            // Show first question
            showQuestion(0);
            updateProgress();
        }
        
        // Show a specific question
        
        function formatContent(text) {
            if (!text) return '';
            return text.replace(/<img/g, '<img style="max-width:100%;height:auto;"');
        }
        
        function showQuestion(index) {
            if (index < 0 || index >= questions.length) return;
            
            currentQuestion = index;
            const question = questions[index];
            
            // Update question counter
            document.getElementById('question-counter').textContent = `Question ${index + 1} of ${questions.length}`;
            
            // Update question boxes
            document.querySelectorAll('.q-box').forEach(box => box.classList.remove('current'));
            document.getElementById(`box-${index}`).classList.add('current');
            
            // Generate question HTML
            let html = `
                <div class="question-card">
                    <div class="question-text">
                        <div class="en">${formatContent(question.question_en)}</div>
                        <div class="hi" style="display:none">${formatContent(question.question_hi)} </div>
                    </div>
                    <div class="options" id="options-container">`;
            
            // Add options
            ['a', 'b', 'c', 'd'].forEach((opt, i) => {
                let optionClass = '';
                let isCorrectAnswer = opt === question.correct;
                let isUserAnswer = answers[question.id] === opt;
                
                // When reviewing, add appropriate classes
                if (submitted) {
                    if (isCorrectAnswer) {
                        optionClass += ' correct-answer';
                    } else if (isUserAnswer && !isCorrectAnswer) {
                        optionClass += ' incorrect';
                    }
                }
                
                html += `
                    <div class="option-item">
                        <input class="option-input" type="radio" name="q${index}" 
                            id="opt-${index}-${opt}" value="${opt}" 
                            ${isUserAnswer ? 'checked' : ''}
                            onclick="selectAnswer('${question.id}', '${opt}')">
                       <label class="option-label${optionClass}" for="opt-${index}-${opt}">
                            <div class="en">${question.options_en[i]}</div>
                            <div class="hi" style="display:none">${question.options_hi[i]}</div>
                        </label>
                    </div>`;
            });
            
            // Add solution if submitted
            if (submitted) {
                const isCorrect = answers[question.id] === question.correct;
                const resultText = answers[question.id] ? (isCorrect ? 'Correct!' : 'Incorrect!') : 'Not attempted';
                
                html += `
                    <div class="solution-container">
                        <div class="solution-title">${resultText}</div>
                        <div class="solution-text">
                            <div class="en">${question.solution_en}</div>
                            <div class="hi" style="display:none">${question.solution_hi}</div>
                        </div>
                    </div>`;
            }
            
            html += `</div></div>`;
            
            document.getElementById('questions-container').innerHTML = html;
            
            // Apply language settings
            applyLanguage();
            
            // If in mobile view, close the menu
            if (window.innerWidth < 992) {
                toggleNav(false);
            }
            
            // Add review mode class if submitted
            if (submitted) {
                document.getElementById('options-container').classList.add('review-mode');
            }
        }
        
        // Apply current language
        function applyLanguage() {
            document.querySelectorAll(`.${currentLang}`).forEach(el => el.style.display = 'block');
            document.querySelectorAll(`.${currentLang === 'en' ? 'hi' : 'en'}`).forEach(el => el.style.display = 'none');
            
            // Update language button text
            document.getElementById('lang-text').textContent = currentLang === 'en' ? 'Hi' : 'En';
        }
        
        // Select an answer
        function selectAnswer(qId, option) {
            if (submitted) return;
            
            answers[qId] = option;
            updateProgress();
            
            // Mark question as attempted in the navigation
            const index = questions.findIndex(q => q.id === qId);
            if (index >= 0) {
                const box = document.getElementById(`box-${index}`);
                box.classList.add('attempted');
                box.classList.remove('unattempted');
            }
        }
        
        // Navigate to previous/next question
        function prevQuestion() { 
            if (currentQuestion > 0) showQuestion(currentQuestion - 1); 
        }
        
        function nextQuestion() { 
            if (currentQuestion < questions.length - 1) showQuestion(currentQuestion + 1); 
        }
        
        // Switch section
        function switchSection(sectionId) {
            if (sectionId === 'all') {
                showQuestion(0);
                return;
            }
            
            const section = sections[sectionId];
            if (section) showQuestion(section.start);
        }
        
        // Toggle language
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            applyLanguage();
        }
        
        // Toggle navigation sidebar
        function toggleNav(show) {
            const nav = document.getElementById('question-nav');
            const overlay = document.getElementById('nav-overlay');
            
            if (show === undefined) {
                show = !nav.classList.contains('show');
            }
            
            if (show) {
                nav.classList.add('show');
                overlay.classList.add('show');
                document.body.style.overflow = 'hidden';
            } else {
                nav.classList.remove('show');
                overlay.classList.remove('show');
                document.body.style.overflow = '';
            }
        }
        
        // Update progress
        function updateProgress() {
            const attempted = Object.keys(answers).length;
            document.getElementById('attempted-count').textContent = attempted;
        }
        
        // Start timer
        function startTimer() {
            const timerDisplay = document.getElementById('timer-display');
            let timeLeft = totalTime;
            
            const timerInterval = setInterval(() => {
                if (timeLeft <= 0 || submitted) {
                    clearInterval(timerInterval);
                    if (!submitted) submitTest();
                    return;
                }
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                timeLeft--;
            }, 1000);
        }
        
        // Confirm before submitting
        function confirmSubmit() {
            if (submitted) return;
            
            const attempted = Object.keys(answers).length;
            const remaining = questions.length - attempted;
            
            // Create a more modern confirmation dialog
            const confirmHtml = `
                <div style="text-align: center; padding: 20px;">
                    <h4 style="margin-bottom: 16px; color: var(--dark);">Confirm Submission</h4>
                    <p style="margin-bottom: 24px; color: var(--gray);">
                        You have attempted ${attempted} of ${questions.length} questions.<br>
                        ${remaining} questions are unattempted.
                    </p>
                    <div style="display: flex; justify-content: center; gap: 12px;">
                        <button onclick="this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; border: 1px solid var(--light-gray); background: white; border-radius: 8px; cursor: pointer;">
                            Cancel
                        </button>
                        <button onclick="submitTest(); this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer;">
                            Submit Test
                        </button>
                    </div>
                </div>`;
            
            // Create modal element
            const modal = document.createElement('div');
            modal.className = 'results-modal show';
            modal.innerHTML = `
                <div class="results-card" style="max-width: 400px;">
                    <button class="cancel-btn" style="position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--gray);" onclick="this.closest('.results-modal').remove()">
                        ×
                    </button>
                    ${confirmHtml}
                </div>`;
            
            document.body.appendChild(modal);
        }
        
        // Submit test
        function submitTest() {
            if (submitted) return;
            
            submitted = true;
            
            let score = 0;
            let correctCount = 0;
            let incorrectCount = 0;
            let unattemptedCount = 0;
            
            questions.forEach((q, index) => {
                const userAns = answers[q.id];
                const box = document.getElementById(`box-${index}`);
                
                box.classList.remove('attempted');
                
                if (!userAns) {
                    unattemptedCount++;
                    box.classList.add('unattempted');
                } else if (userAns === q.correct) {
                    correctCount++;
                    score += q.pos_marks;
                    box.classList.add('correct');
                } else {
                    incorrectCount++;
                    score -= q.neg_marks;
                    box.classList.add('incorrect');
                }
            });
            
            // Update result values
            document.getElementById('score-value').textContent = score.toFixed(2);
            document.getElementById('correct-value').textContent = correctCount;
            document.getElementById('incorrect-value').textContent = incorrectCount;
            document.getElementById('unattempted-value').textContent = unattemptedCount;
            
            // Show the results modal
            document.getElementById('results-modal').classList.add('show');
            
            // Disable submit button
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-check"></i>';
            submitBtn.style.backgroundColor = 'var(--success)';
            
            // Refresh current question view to show solution
            showQuestion(currentQuestion);
        }
        
        // Review test
        function reviewTest() {
            document.getElementById('results-modal').classList.remove('show');
            showQuestion(0);
        }
        
        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('results-modal')) {
                document.getElementById('results-modal').classList.remove('show');
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === 'ArrowRight') nextQuestion();
        });
    </script>
</body>
</html>
