2325;&#2381;&#2359;&#2375;&#2340;&#2381;&#2352;, &#2349;&#2366;&#2327;-XIV A (&#2309;&#2344;&#2369;&#2330;&#2381;&#2331;&#2375;&#2342; 323A-323B): &#2344;&#2381;&#2351;&#2366;&#2351;&#2366;&#2343;&#2367;&#2325;&#2352;&#2339;, &#2349;&#2366;&#2327;-XV (&#2309;&#2344;&#2369;&#2330;&#2381;&#2331;&#2375;&#2342; 324-329A): &#2330;&#2369;&#2344;&#2366;&#2357;, &#2349;&#2366;&#2327;-XVII (&#2309;&#2344;&#2369;&#2330;&#2381;&#2331;&#2375;&#2342; 343-351): &#2352;&#2366;&#2332;&#2349;&#2366;&#2359;&#2366;&#2319;&#2305;, &#2349;&#2366;&#2327;-XVIII (&#2309;&#2344;&#2369;&#2330;&#2381;&#2331;&#2375;&#2342; 352-360): &#2310;&#2346;&#2366;&#2340;&#2325;&#2366;&#2354;&#2368;&#2344; &#2346;&#2381;&#2352;&#2366;&#2357;&#2343;&#2366;&#2344; , &#2349;&#2366;&#2327;-XX (&#2309;&#2344;&#2369;&#2330;&#2381;&#2331;&#2375;&#2342; 368): &#2360;&#2306;&#2357;&#2367;&#2343;&#2366;&#2344; &#2325;&#2366; &#2360;&#2306;&#2358;&#2379;&#2343;&#2344;&#2404; 7&#2357;&#2375;&#2306; &#2360;&#2306;&#2358;&#2379;&#2343;&#2344; &#2309;&#2343;&#2367;&#2344;&#2367;&#2351;&#2350;, 1956 &#2342;&#2381;&#2357;&#2366;&#2352;&#2366; &#2349;&#2366;&#2327;-VII &#2325;&#2379; &#2344;&#2367;&#2352;&#2360;&#2381;&#2340; &#2325;&#2352; &#2342;&#2367;&#2351;&#2366; &#2327;&#2351;&#2366;&#2404;</span></p>\n",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "12",
                    section: "18",
                    question_en: "<p><span style=\"font-family: Roboto;\">12.</span><span style=\"font-family: Roboto;\"> The finance commission of India is required to make recommendations to the_________.</span></p>\n",
                    question_hi: "<p><span style=\"font-family: Roboto;\">12.</span><span style=\"font-family: Palanquin;\"> &#2349;&#2366;&#2352;&#2340; &#2325;&#2375; &#2357;&#2367;&#2340;&#2381;&#2340; &#2310;&#2351;&#2379;&#2327; &#2325;&#2379;_______ &#2360;&#2375; &#2360;&#2367;&#2347;&#2366;&#2352;&#2367;&#2358;&#2375;&#2306; &#2325;&#2352;&#2344;&#2375; &#2325;&#2368; &#2310;&#2357;&#2358;&#2381;&#2351;&#2325;&#2340;&#2366; &#2361;&#2379;&#2340;&#2368; &#2361;&#2376;&#2404;</span></p>\n",
                    options_en: ["<p>President of India</p>\n", "<p>Ministry of Finance</p>\n", 
                                "<p>Parliament</p>\n", "<p>Central Cabinet</p>\n"],
                    options_hi: ["<p>&#2349;&#2366;&#2352;&#2340; &#2325;&#2375; &#2352;&#2366;&#2359;&#2381;&#2335;&#2381;&#2352;&#2346;&#2340;&#2367;</p>\n", "<p>&#2357;&#2367;&#2340;&#2381;&#2340; &#2350;&#2306;&#2340;&#2381;&#2352;&#2366;&#2354;&#2351;</p>\n",
                                "<p>&#2360;&#2306;&#2360;&#2342;</p>\n", "<p>&#2325;&#2375;&#2306;&#2342;&#2381;&#2352;&#2368;&#2351; &#2350;&#2306;&#2340;&#2381;&#2352;&#2367;&#2350;&#2306;&#2337;&#2354;</p>\n"],
                    solution_en: "<p>12.(a) <strong>President of India.</strong> <span style=\"font-family: Roboto;\">The Finance Commission is appointed by the President under Article 280 of the Constitution to define the financial relations between the central government and the individual state governments. It is appointed every five years. Chairman of First Finance Commission -<strong> </strong></span><strong><span style=\"font-family: Roboto;\">K.C. Neogy</span></strong><span style=\"font-family: Roboto;\"><strong>.</strong> First Finance Minister of independent India - R. K. Shanmukham Chetty. </span></p>\n",
                    solution_hi: "<p>12.(a)&nbsp;<strong>&#2349;&#2366;&#2352;&#2340; &#2325;&#2375; &#2352;&#2366;&#2359;&#2381;&#2335;&#2381;&#2352;&#2346;&#2340;&#2367;</strong><span style=\"font-weight: 400;\">&#2404; &#2325;&#2375;&#2306;&#2342;&#2381;&#2352; &#2360;&#2352;&#2325;&#2366;&#2352; &#2324;&#2352; &#2357;&#2381;&#2351;&#2325;&#2381;&#2340;&#2367;&#2327;&#2340; &#2352;&#2366;&#2332;&#2381;&#2351; &#2360;&#2352;&#2325;&#2366;&#2352;&#2379;&#2306; &#2325;&#2375; &#2348;&#2368;&#2330; &#2357;&#2367;&#2340;&#2381;&#2340;&#2368;&#2351; &#2360;&#2306;&#2348;&#2306;&#2343;&#2379;&#2306; &#2325;&#2379; &#2346;&#2352;&#2367;&#2349;&#2366;&#2359;&#2367;&#2340; &#2325;&#2352;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2360;&#2306;&#2357;&#2367;&#2343;&#2366;&#2344; &#2325;&#2375; &#2309;&#2344;&#2369;&#2330;&#2381;&#2331;&#2375;&#2342; 280 &#2325;&#2375; &#2340;&#2361;&#2340; &#2352;&#2366;&#2359;&#2381;&#2335;&#2381;&#2352;&#2346;&#2340;&#2367; &#2342;&#2381;&#2357;&#2366;&#2352;&#2366; &#2357;&#2367;&#2340;&#2381;&#2340; &#2310;&#2351;&#2379;&#2327; &#2325;&#2368; &#2344;&#2367;&#2351;&#2369;&#2325;&#2381;&#2340;&#2367; &#2325;&#2368; &#2332;&#2366;&#2340;&#2368; &#2361;&#2376;&#2404; &#2311;&#2360;&#2325;&#2368; &#2344;&#2367;&#2351;&#2369;&#2325;&#2381;&#2340;&#2367; &#2361;&#2352; &#2346;&#2366;&#2306;&#2330; &#2357;&#2352;&#2381;&#2359; &#2350;&#2375;&#2306; &#2325;&#2368; &#2332;&#2366;&#2340;&#2368; &#2361;&#2376;&#2404; &#2346;&#2381;&#2352;&#2341;&#2350; &#2357;&#2367;&#2340;&#2381;&#2340; &#2310;&#2351;&#2379;&#2327; &#2325;&#2375; &#2309;&#2343;&#2381;&#2351;&#2325;&#2381;&#2359; - </span><strong>&#2325;&#2375;.&#2360;&#2368;. &#2344;&#2367;&#2351;&#2379;&#2327;&#2368;</strong><span style=\"font-weight: 400;\">&#2404; &#2360;&#2381;&#2357;&#2340;&#2306;&#2340;&#2381;&#2352; &#2349;&#2366;&#2352;&#2340; &#2325;&#2375; &#2346;&#2361;&#2354;&#2375; &#2357;&#2367;&#2340;&#2381;&#2340; &#2350;&#2306;&#2340;&#2381;&#2352;&#2368; - &#2310;&#2352;. &#2325;&#2375;. &#2358;&#2344;&#2350;&#2369;&#2326;&#2350; &#2330;&#2375;&#2335;&#2381;&#2335;&#2368;&#2404;</span></p>\n",

                    neg_marks: 0.5

                questions.push({
                    id: "13",
                    section: "18",
                    question_en: "<p>13. <span style=\"font-family: Roboto;\">Which Article of the Indian Constitution stipulates that the law declared by the Supreme Court shall be binding on all courts within the territory of India?</span></p>\n",
                    question_hi: "<p>13. <span style=\"font-family: Palanquin;\">&#2349;&#2366;&#2352;&#2340;&#2368;&#2351; &#2360;&#2306;&#2357;&#2367;&#2343;&#2366;&#2344; &#2325;&#2366; &#2325;&#2380;&#2344;-&#2360;&#2366; &#2309;&#2344;&#2369;&#2330;&#2381;&#2331;&#2375;&#2342; &#2351;&#2361; &#2344;&#2367;&#2352;&#2381;&#2343;&#2366;&#2352;&#2367;&#2340; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376; &#2325;&#2367; &#2360;&#2352;&#2381;&#2357;&#2379;&#2330;&#2381;&#2330; &#2344;&#2381;&#2351;&#2366;&#2351;&#2366;&#2354;&#2351; &#2342;&#2381;&#2357;&#2366;&#2352;&#2366; &#2328;&#2379;&#2359;&#2367;&#2340; &#2325;&#2366;&#2344;&#2370;&#2344; &#2349;&#2366;&#2352;&#2340; &#2325;&#2375; &#2325;&#2381;&#2359;&#2375;&#2340;&#2381;&#2352; &#2325;&#2375; &#2349;&#2368;&#2340;&#2352; &#2360;&#2349;&#2368; &#2309;&#2342;&#2366;&#2354;&#2340;&#2379;&#2306; &#2346;&#2352; &#2348;&#2366;&#2343;&#2381;&#2351;&#2325;&#2366;&#2352;&#2368; &#2361;&#2379;&#2327;&#2366;?</span></p>\n",
                    options_en: ["<p>Article 141</p>\n", "<p>Article 140</p>\n", 
                                "<p>Article 142</p>\n", "<p>Article 145</p>\n"],
                    options_hi: ["<p>&#2309;&#2344;&#2369;&#2330;&#2381;&#2331;&#2375;&#2342; 141</p>\n", "<p>&#2309;&#2344;&#2369;&#2330;&#2381;&#2331;&#2375;&#2342; 140</p>\n",
                                "<p>&#2309;&#2344;&#2369;&#2330;&#2381;&#2331;&#2375;&#2342; 142</p>\n", "<p>&#2309;&#2344;&#2369;&#2330;&#2381;&#2331;&#2375;&#2342; 145</p>\n"],
                    solution_en: "<p>13.(a) <strong>Article 141</strong>. <span style=\"font-family: Roboto;\">Article 140 - Ancillary powers of the Supreme Court. Article 142 - Provides power to the Supreme Court, to do &lsquo;complete justice&rsquo; between the parties, where, at times, the law or statute may not provide a remedy. Article 145 - Talks about how the Supreme Court can make rules and laws regarding the persons appointed to the Supreme Court. </span></p>\n",
                    solution_hi: "<p>13.(a) <strong>&#2309;&#2344;&#2369;&#2330;&#2381;&#2331;&#2375;&#2342; 141&#2404;&nbsp;</strong>&nbsp;<span style=\"font-family: Palanquin;\">&#2309;&#2344;&#2369;&#2330;&#2381;&#2331;&#2375;&#2342; 140 - &#2360;&#2352;&#2381;&#2357;&#2379;&#2330;&#2381;&#2330; &#2344;&#2381;&#2351;&#2366;&#2351;&#2366;&#2354;&#2351; &#2325;&#2368; &#2360;&#2361;&#2366;&#2351;&#2325; &#2358;&#2325;&#2381;&#2340;&#2367;&#2351;&#2366;&#2305;&#2404; &#2309;&#2344;&#2369;&#2330;&#2381;&#2331;&#2375;&#2342; 142 - &#2313;&#2330;&#2381;&#2330;&#2340;&#2350; &#2344;&#2381;&#2351;&#2366;&#2351;&#2366;&#2354;&#2351; &#2325;&#2379; &#2346;&#2325;&#2381;&#2359;&#2379;&#2306; &#2325;&#2375; &#2348;&#2368;&#2330; \"&#2346;&#2370;&#2352;&#2381;&#2339; &#2344;&#2381;&#2351;&#2366;&#2351;\" &#2325;&#2352;&#2344;&#2375; &#2325;&#2368; &#2319;&#2325; &#2309;&#2342;&#2381;&#2357;&#2367;&#2340;&#2368;&#2351; &#2358;&#2325;&#2381;&#2340;&#2367; &#2346;&#2381;&#2352;&#2342;&#2366;&#2344; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376;, &#2332;&#2361;&#2366;&#2306;, &#2325;&#2349;&#2368;-&#2325;&#2349;&#2368;, &#2325;&#2366;&#2344;&#2370;&#2344; &#2351;&#2366; &#2357;&#2367;&#2343;&#2366;&#2344; &#2319;&#2325; &#2313;&#2346;&#2366;&#2351; &#2346;&#2381;&#2352;&#2342;&#2366;&#2344; &#2344;&#2361;&#2368;&#2306; &#2325;&#2352; &#2360;&#2325;&#2340;&#2366; &#2361;&#2376;&#2404; &#2309;&#2344;&#2369;&#2330;&#2381;&#2331;&#2375;&#2342; 145 - &#2360;&#2352;&#2381;&#2357;&#2379;&#2330;&#2381;&#2330; &#2344;&#2381;&#2351;&#2366;&#2351;&#2366;&#2354;&#2351; &#2350;&#2375;&#2306; &#2344;&#2367;&#2351;&#2369;&#2325;&#2381;&#2340; &#2357;&#2381;&#2351;&#2325;&#2381;&#2340;&#2367;&#2351;&#2379;&#2306; &#2325;&#2375; &#2360;&#2306;&#2348;&#2306;&#2343; &#2350;&#2375;&#2306; &#2360;&#2352;&#2381;&#2357;&#2379;&#2330;&#2381;&#2330; &#2344;&#2381;&#2351;&#2366;&#2351;&#2366;&#2354;&#2351; &#2325;&#2376;&#2360;&#2375; &#2344;&#2367;&#2351;&#2350; &#2324;&#2352; &#2325;&#2366;&#2344;&#2370;&#                 questions.push({
                    id: "14",
                    section: "18",
                    question_en: "<p><span style=\"font-family: Roboto;\">14.</span><span style=\"font-family: Roboto;\"> Which of the following rights is guaranteed by Article 25 of the Indian Constitution?</span></p>\n",
                    question_hi: "<p><span style=\"font-family: Roboto;\">14.</span><span style=\"font-family: Palanquin;\"> &#2344;&#2367;&#2350;&#2381;&#2344;&#2354;&#2367;&#2326;&#2367;&#2340; &#2350;&#2375;&#2306; &#2360;&#2375; &#2325;&#2380;&#2344;-&#2360;&#2366; &#2309;&#2343;&#2367;&#2325;&#2366;&#2352; &#2349;&#2366;&#2352;&#2340;&#2368;&#2351; &#2360;&#2306;&#2357;&#2367;&#2343;&#2366;&#2344; &#2325;&#2375; &#2309;&#2344;&#2369;&#2330;&#2381;&#2331;&#2375;&#2342; 25 &#2342;&#2381;&#2357;&#2366;&#2352;&#2366; &#2327;&#2366;&#2352;&#2306;&#2335;&#2368;&#2325;&#2371;&#2340; &#2361;&#2376;?</span></p>\n",
                    options_en: ["<p>Right to freedom of religion</p>\n", "<p>Cultural and educational rights</p>\n", 
                                "<p>Right to equality</p>\n", "<p>Right to constitutional remedies</p>\n"],
                    options_hi: ["<p>&#2343;&#2366;&#2352;&#2381;&#2350;&#2367;&#2325; &#2360;&#2381;&#2357;&#2340;&#2306;&#2340;&#2381;&#2352;&#2340;&#2366; &#2325;&#2366; &#2309;&#2343;&#2367;&#2325;&#2366;&#2352;</p>\n", "<p>&#2360;&#2366;&#2306;&#2360;&#2381;&#2325;&#2371;&#2340;&#2367;&#2325; &#2324;&#2352; &#2358;&#2376;&#2325;&#2381;&#2359;&#2367;&#2325; &#2309;&#2343;&#2367;&#2325;&#2366;&#2352;</p>\n",
                                "<p>&#2360;&#2350;&#2366;&#2344;&#2340;&#2366; &#2325;&#2366; &#2309;&#2343;&#2367;&#2325;&#2366;&#2352;</p>\n", "<p>&#2360;&#2306;&#2357;&#2376;&#2343;&#2366;&#2344;&#2367;&#2325; &#2313;&#2346;&#2330;&#2366;&#2352;&#2379;&#2306; &#2325;&#2366; &#2309;&#2343;&#2367;&#2325;&#2366;&#2352;</p>\n"],
                    solution_en: "<p>14.(a) <strong>Right to freedom of religion. </strong><span style=\"font-family: Roboto;\">Article 21: Protection of Life and Personal Liberty. Article 26 : Freedom to manage religious affairs. Article 27: Freedom as to payment of taxes for promotion of any particular religion. Article 28 : Freedom as to attendance at religious instruction.</span></p>\n",
                    solution_hi: "<p>14.(a) <strong><span style=\"font-family: Palanquin;\">&#2343;&#2366;&#2352;&#2381;&#2350;&#2367;&#2325; &#2360;&#2381;&#2357;&#2340;&#2306;&#2340;&#2381;&#2352;&#2340;&#2366; &#2325;&#2366; &#2309;&#2343;&#2367;&#2325;&#2366;&#2352;</span></strong><span style=\"font-family: Roboto;\"><strong>&nbsp;&#2404;&nbsp;</strong>&nbsp;</span><span style=\"font-family: Palanquin;\">&#2309;&#2344;&#2369;&#2330;&#2381;&#2331;&#2375;&#2342; 21: &#2332;&#2368;&#2357;&#2344; &#2324;&#2352; &#2357;&#2381;&#2351;&#2325;&#2381;&#2340;&#2367;&#2327;&#2340; &#2360;&#2381;&#2357;&#2340;&#2306;&#2340;&#2381;&#2352;&#2340;&#2366; &#2325;&#2366; &#2360;&#2306;&#2352;&#2325;&#2381;&#2359;&#2339;&#2404; &#2309;&#2344;&#2369;&#2330;&#2381;&#2331;&#2375;&#2342; 26: &#2343;&#2366;&#2352;&#2381;&#2350;&#2367;&#2325; &#2350;&#2366;&#2350;&#2354;&#2379;&#2306; &#2325;&#2366; &#2346;&#2381;&#2352;&#2348;&#2306;&#2343;&#2344; &#2325;&#2352;&#2344;&#2375; &#2325;&#2368; &#2360;&#2381;&#2357;&#2340;&#2306;&#2340;&#2381;&#2352;&#2340;&#2366;&#2404; &#2309;&#2344;&#2369;&#2330;&#2381;&#2331;&#2375;&#2342; 27: &#2325;&#2367;&#2360;&#2368; &#2357;&#2367;&#2358;&#2375;&#2359; &#2343;&#2352;&#2381;&#2350; &#2325;&#2375; &#2346;&#2381;&#2352;&#2330;&#2366;&#2352; &#2325;&#2375; &#2354;&#2367;&#2319; &#2325;&#2352;&#2379;&#2306; &#2325;&#2375; &#2349;&#2369;&#2327;&#2340;&#2366;&#2344; &#2325;&#2375; &#2360;&#2306;&#2348;&#2306;&#2343; &#2350;&#2375;&#2306; &#2360;&#2381;&#2357;&#2340;&#2306;&#2340;&#2381;&#2352;&#2340;&#2366;&#2404; &#2309;&#2344;&#2369;&#2330;&#2381;&#2331;&#2375;&#2342; 28: &#2343;&#2366;&#2352;&#2381;&#2350;&#2367;&#2325; &#2358;&#2367;&#2325;&#2381;&#2359;&#2366; &#2350;&#2375;&#2306; &#2313;&#2346;&#2360;&#2381;&#2341;&#2367;&#2340; &#2361;&#2379;&#2344;&#2375; &#2325;&#2375; &#2360;&#2306;&#2348;&#2306;&#2343; &#2350;&#2375;&#2306; &#2360;&#2381;&#2357;&#2340;&#2306;&#2340;&#2381;&#2352;&#2340;&#2366;&#2404;</span></p>\n",
                    correct: "a",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "15",
                    section: "misc",
                    question_en: "<p><span style=\"font-family: Roboto;\">15. </span><span style=\"font-family: Roboto;\">Which of the following Articles of the Constitution of India enshrines to value and preserve the rich heritage of our composite culture?</span></p>\n",
                    question_hi: "<p><span style=\"font-family: Roboto;\">15. </span><span style=\"font-family: Palanquin;\">&#2349;&#2366;&#2352;&#2340;&#2368;&#2351; &#2360;&#2306;&#2357;&#2367;&#2343;&#2366;&#2344; &#2325;&#2366; &#2344;&#2367;&#2350;&#2381;&#2344;&#2354;&#2367;&#2326;&#2367;&#2340; &#2350;&#2375;&#2306; &#2360;&#2375; &#2325;&#2380;&#2344;-&#2360;&#2366; &#2309;&#2344;&#2369;&#2330;&#2381;&#2331;&#2375;&#2342; &#2361;&#2350;&#2366;&#2352;&#2368; &#2360;&#2366;&#2350;&#2366;&#2360;&#2367;&#2325; &#2360;&#2306;&#2360;&#2381;&#2325;&#2371;&#2340;&#2367; &#2325;&#2368; &#2360;&#2350;&#2371;&#2342;&#2381;&#2343; &#2357;&#2367;&#2352;&#2366;&#2360;&#2340; &#2325;&#2379; &#2350;&#2361;&#2340;&#2381;&#2357; &#2342;&#2375;&#2344;&#2375; &#2324;&#2352; &#2346;&#2352;&#2367;&#2352;&#2325;&#2381;&#2359;&#2367;&#2340; &#2325;&#2352;&#2344;&#2375; &#2325;&#2379; &#2346;&#2381;&#2352;&#2340;&#2367;&#2359;&#2381;&#2336;&#2366;&#2346;&#2367;&#2340; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376;? </span></p>\n",
                    options_en: ["<p>Article 51 (A)</p>\n", "<p>Article 43 (A)</p>\n", 
                                "<p>Article 48 (A)</p>\n", "\n"],
                    options_hi: ["<p>&#2309;&#2344;&#2369;&#2330;&#2381;&#2331;&#2375;&#2342; 51 (A)</p>\n", "<p>&#2309;&#2344;&#2369;&#2330;&#2381;&#2331;&#2375;&#2342; 43 (A)</p>\n",
                                "<p>&#2309;&#2344;&#2369;&#2330;&#2381;&#2331;&#2375;&#2342; 48 (A)</p>\n", "<p>&#2309;&#2344;&#2369;&#2330;&#2381;&#2331;&#2375;&#2342; 124 (A)</p>\n"],
                    solution_en: "<p>15.(a)&nbsp;<strong>Article 51 (A).</strong><span style=\"font-weight: 400;\"> Article 51 A (F) - Value and preserve the rich heritage of our composite culture. 10 Fundamental Duties (Article 51A, Part IV-A) added by the 42nd Amendment Act (1976) on the recommendation of Sardar Swaran Singh committee. </span><strong>&nbsp;11th Fundamental Duty </strong><span style=\"font-weight: 400;\">added by 86th Amendment Act, 2002. Article 43(A) - Participation of workers in management of industries. Article 48(A) - To protect and improve the environment and to safeguard the forests and wildlife of the country.&nbsp;</span></p>\n",
                    solution_hi: "<p>15.(a)<span style=\"font-family: Roboto;\"> </span><strong><span style=\"font-family: Palanquin;\">&#2309;&#2344;&#2369;&#2330;&#2381;&#2331;&#2375;&#2342; 51(A)&#2404;</span></strong><span style=\"font-family: Palanquin;\"><strong> </strong>&#2309;&#2344;&#2369;&#2330;&#2381;&#2331;&#2375;&#2342; 51A(F) - &#2361;&#2350;&#2366;&#2352;&#2368; </span><span style=\"font-family: Palanquin;\">&#2360;&#2366;&#2350;&#2366;&#2360;&#2367;&#2325; </span><span style=\"font-family: Palanquin;\">&#2360;&#2306;&#2360;&#2381;&#2325;&#2371;&#2340;&#2367; &#2325;&#2368; &#2360;&#2350;&#2371;&#2342;&#2381;&#2343; &#2357;&#2367;&#2352;&#2366;&#2360;&#2340; &#2325;&#2379; &#2350;&#2361;&#2340;&#2381;&#2357; &#2342;&#2375;&#2306; &#2324;&#2352; &#2360;&#2306;&#2352;&#2325;&#2381;&#2359;&#2367;&#2340; &#2325;&#2352;&#2375;&#2306;&#2404; &#2360;&#2352;&#2342;&#2366;&#2352; &#2360;&#2381;&#2357;&#2352;&#2381;&#2339; &#2360;&#2367;&#2306;&#2361; &#2360;&#2350;&#2367;&#2340;&#2367; &#2325;&#2368; &#2360;&#2367;&#2347;&#2366;&#2352;&#2367;&#2358; &#2346;&#2352; 42&#2357;&#2375;&#2306; &#2360;&#2306;&#2358;&#2379;&#2343;&#2344; &#2309;&#2343;&#2367;&#2344;&#2367;&#2351;&#2350; (1976) &#2342;&#2381;&#2357;&#2366;&#2352;&#2366; 10 &#2350;&#2380;&#2354;&#2367;&#2325; &#2325;&#2352;&#2381;&#2340;&#2357;&#2381;&#2351; (&#2309;&#2344;&#2369;&#2330;&#2381;&#2331;&#2375;&#2342; 51&#2319;, &#2349;&#2366;&#2327; IV-&#2319;) &#2332;&#2379;&#2337;&#2364;&#2375; &#2327;&#2319;&#2404; 86&#2357;&#2375;&#2306; &#2360;&#2306;&#2358;&#2379;&#2343;&#2344; &#2309;&#2343;&#2367;&#2344;&#2367;&#2351;&#2350;, 2002 &#2342;&#2381;&#2357;&#2366;&#2352;&#2366; 11&#2357;&#2366;&#2306; &#2350;&#2380;&#2354;&#2367;&#2325; &#2325;&#2352;&#2381;&#2340;&#2357;&#2381;&#2351; &#2332;&#2379;&#2337;&#2364;&#2366; &#2327;&#2351;&#2366;&#2404; &#2309;&#2344;&#2369;&#2330;&#2381;&#2331;&#2375;&#2342; 43(A) - &#2313;&#2342;&#2381;&#2351;&#2379;&#2327;&#2379;&#2306; &#2325;&#2375; &#2346;&#2381;&#2352;&#2348;&#2306;&#2343;&#2344; &#2350;&#2375;&#2306; &#2358;&#2381;&#2352;&#2350;&#2367;&#2325;&#2379;&#2306; &#2325;&#2368; &#2349;&#2366;&#2327;&#2368;&#2342;&#2366;&#2352;&#2368;&#2404; &#2309;&#2344;&#2369;&#2330;&#2381;&#2331;&#2375;&#2342; 48(A) - &#2346;&#2352;&#2381;&#2351;&#2366;&#2357;&#2352;&#2339; &#2325;&#2368; &#2352;&#2325;&#2381;&#2359;&#2366; &#2324;&#2352; &#2360;&#2369;&#2343;&#2366;&#2352; &#2325;&#2352;&#2344;&#2366; &#2340;&#2341;&#2366; &#2342;&#2375;&#2358; &#2325;&#2375; &#2357;&#2344;&#2379;&#2306; &#2324;&#2352; &#2357;&#2344;&#2381;&#2351;&#2332;&#2368;&#2357;&#2379;&#2306; &#2325;&#2368; &#2360;&#2369;&#2352;&#2325;&#2381;&#2359;&#2366; &#2325;&#2352;&#2344;&#2366;&#2404;</span></p>\n",
                    correct: "a",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
            
            // Generate question boxes
            const boxesContainer = document.getElementById('question-boxes');
            questions.forEach((q, index) => {
                const box = document.createElement('div');
                box.className = 'q-box';
                box.textContent = index + 1;
                box.onclick = () => showQuestion(index);
                box.id = `box-${index}`;
                boxesContainer.appendChild(box);
            });
            
            // Show first question
            showQuestion(0);
            updateProgress();
        }
        
        // Show a specific question
        
        function formatContent(text) {
            if (!text) return '';
            return text.replace(/<img/g, '<img style="max-width:100%;height:auto;"');
        }
        
        function showQuestion(index) {
            if (index < 0 || index >= questions.length) return;
            
            currentQuestion = index;
            const question = questions[index];
            
            // Update question counter
            document.getElementById('question-counter').textContent = `Question ${index + 1} of ${questions.length}`;
            
            // Update question boxes
            document.querySelectorAll('.q-box').forEach(box => box.classList.remove('current'));
            document.getElementById(`box-${index}`).classList.add('current');
            
            // Generate question HTML
            let html = `
                <div class="question-card">
                    <div class="question-text">
                        <div class="en">${formatContent(question.question_en)}</div>
                        <div class="hi" style="display:none">${formatContent(question.question_hi)} </div>
                    </div>
                    <div class="options" id="options-container">`;
            
            // Add options
            ['a', 'b', 'c', 'd'].forEach((opt, i) => {
                let optionClass = '';
                let isCorrectAnswer = opt === question.correct;
                let isUserAnswer = answers[question.id] === opt;
                
                // When reviewing, add appropriate classes
                if (submitted) {
                    if (isCorrectAnswer) {
                        optionClass += ' correct-answer';
                    } else if (isUserAnswer && !isCorrectAnswer) {
                        optionClass += ' incorrect';
                    }
                }
                
                html += `
                    <div class="option-item">
                        <input class="option-input" type="radio" name="q${index}" 
                            id="opt-${index}-${opt}" value="${opt}" 
                            ${isUserAnswer ? 'checked' : ''}
                            onclick="selectAnswer('${question.id}', '${opt}')">
                       <label class="option-label${optionClass}" for="opt-${index}-${opt}">
                            <div class="en">${question.options_en[i]}</div>
                            <div class="hi" style="display:none">${question.options_hi[i]}</div>
                        </label>
                    </div>`;
            });
            
            // Add solution if submitted
            if (submitted) {
                const isCorrect = answers[question.id] === question.correct;
                const resultText = answers[question.id] ? (isCorrect ? 'Correct!' : 'Incorrect!') : 'Not attempted';
                
                html += `
                    <div class="solution-container">
                        <div class="solution-title">${resultText}</div>
                        <div class="solution-text">
                            <div class="en">${question.solution_en}</div>
                            <div class="hi" style="display:none">${question.solution_hi}</div>
                        </div>
                    </div>`;
            }
            
            html += `</div></div>`;
            
            document.getElementById('questions-container').innerHTML = html;
            
            // Apply language settings
            applyLanguage();
            
            // If in mobile view, close the menu
            if (window.innerWidth < 992) {
                toggleNav(false);
            }
            
            // Add review mode class if submitted
            if (submitted) {
                document.getElementById('options-container').classList.add('review-mode');
            }
        }
        
        // Apply current language
        function applyLanguage() {
            document.querySelectorAll(`.${currentLang}`).forEach(el => el.style.display = 'block');
            document.querySelectorAll(`.${currentLang === 'en' ? 'hi' : 'en'}`).forEach(el => el.style.display = 'none');
            
            // Update language button text
            document.getElementById('lang-text').textContent = currentLang === 'en' ? 'Hi' : 'En';
        }
        
        // Select an answer
        function selectAnswer(qId, option) {
            if (submitted) return;
            
            answers[qId] = option;
            updateProgress();
            
            // Mark question as attempted in the navigation
            const index = questions.findIndex(q => q.id === qId);
            if (index >= 0) {
                const box = document.getElementById(`box-${index}`);
                box.classList.add('attempted');
                box.classList.remove('unattempted');
            }
        }
        
        // Navigate to previous/next question
        function prevQuestion() { 
            if (currentQuestion > 0) showQuestion(currentQuestion - 1); 
        }
        
        function nextQuestion() { 
            if (currentQuestion < questions.length - 1) showQuestion(currentQuestion + 1); 
        }
        
        // Switch section
        function switchSection(sectionId) {
            if (sectionId === 'all') {
                showQuestion(0);
                return;
            }
            
            const section = sections[sectionId];
            if (section) showQuestion(section.start);
        }
        
        // Toggle language
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            applyLanguage();
        }
        
        // Toggle navigation sidebar
        function toggleNav(show) {
            const nav = document.getElementById('question-nav');
            const overlay = document.getElementById('nav-overlay');
            
            if (show === undefined) {
                show = !nav.classList.contains('show');
            }
            
            if (show) {
                nav.classList.add('show');
                overlay.classList.add('show');
                document.body.style.overflow = 'hidden';
            } else {
                nav.classList.remove('show');
                overlay.classList.remove('show');
                document.body.style.overflow = '';
            }
        }
        
        // Update progress
        function updateProgress() {
            const attempted = Object.keys(answers).length;
            document.getElementById('attempted-count').textContent = attempted;
        }
        
        // Start timer
        function startTimer() {
            const timerDisplay = document.getElementById('timer-display');
            let timeLeft = totalTime;
            
            const timerInterval = setInterval(() => {
                if (timeLeft <= 0 || submitted) {
                    clearInterval(timerInterval);
                    if (!submitted) submitTest();
                    return;
                }
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                timeLeft--;
            }, 1000);
        }
        
        // Confirm before submitting
        function confirmSubmit() {
            if (submitted) return;
            
            const attempted = Object.keys(answers).length;
            const remaining = questions.length - attempted;
            
            // Create a more modern confirmation dialog
            const confirmHtml = `
                <div style="text-align: center; padding: 20px;">
                    <h4 style="margin-bottom: 16px; color: var(--dark);">Confirm Submission</h4>
                    <p style="margin-bottom: 24px; color: var(--gray);">
                        You have attempted ${attempted} of ${questions.length} questions.<br>
                        ${remaining} questions are unattempted.
                    </p>
                    <div style="display: flex; justify-content: center; gap: 12px;">
                        <button onclick="this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; border: 1px solid var(--light-gray); background: white; border-radius: 8px; cursor: pointer;">
                            Cancel
                        </button>
                        <button onclick="submitTest(); this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer;">
                            Submit Test
                        </button>
                    </div>
                </div>`;
            
            // Create modal element
            const modal = document.createElement('div');
            modal.className = 'results-modal show';
            modal.innerHTML = `
                <div class="results-card" style="max-width: 400px;">
                    <button class="cancel-btn" style="position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--gray);" onclick="this.closest('.results-modal').remove()">
                        ×
                    </button>
                    ${confirmHtml}
                </div>`;
            
            document.body.appendChild(modal);
        }
        
        // Submit test
        function submitTest() {
            if (submitted) return;
            
            submitted = true;
            
            let score = 0;
            let correctCount = 0;
            let incorrectCount = 0;
            let unattemptedCount = 0;
            
            questions.forEach((q, index) => {
                const userAns = answers[q.id];
                const box = document.getElementById(`box-${index}`);
                
                box.classList.remove('attempted');
                
                if (!userAns) {
                    unattemptedCount++;
                    box.classList.add('unattempted');
                } else if (userAns === q.correct) {
                    correctCount++;
                    score += q.pos_marks;
                    box.classList.add('correct');
                } else {
                    incorrectCount++;
                    score -= q.neg_marks;
                    box.classList.add('incorrect');
                }
            });
            
            // Update result values
            document.getElementById('score-value').textContent = score.toFixed(2);
            document.getElementById('correct-value').textContent = correctCount;
            document.getElementById('incorrect-value').textContent = incorrectCount;
            document.getElementById('unattempted-value').textContent = unattemptedCount;
            
            // Show the results modal
            document.getElementById('results-modal').classList.add('show');
            
            // Disable submit button
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-check"></i>';
            submitBtn.style.backgroundColor = 'var(--success)';
            
            // Refresh current question view to show solution
            showQuestion(currentQuestion);
        }
        
        // Review test
        function reviewTest() {
            document.getElementById('results-modal').classList.remove('show');
            showQuestion(0);
        }
        
        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('results-modal')) {
                document.getElementById('results-modal').classList.remove('show');
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === 'ArrowRight') nextQuestion();
        });
    </script>
</body>
</html>
