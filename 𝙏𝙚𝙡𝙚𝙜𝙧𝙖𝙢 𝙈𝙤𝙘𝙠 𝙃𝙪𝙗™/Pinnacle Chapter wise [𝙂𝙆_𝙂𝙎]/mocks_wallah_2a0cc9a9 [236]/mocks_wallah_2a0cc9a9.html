                    solution_en: "<p>11.(c) <strong>Malegam Committee. </strong><span style=\"font-weight: 400;\">The Sub-Committee was under the chairmanship of Y.H. Malegam. </span><strong>Ghosh Committee </strong><span style=\"font-weight: 400;\">(1991)</span><strong> - </strong><span style=\"font-weight: 400;\">It inquired into the various aspects of frauds and malpractices in the bank and to make recommendations to reduce such instances. </span><strong>Sivaraman Committee </strong><span style=\"font-weight: 400;\">(1979)</span><strong> -</strong><span style=\"font-weight: 400;\"> Recommended the establishment of NABARD. </span><strong>Khan Committee </strong><span style=\"font-weight: 400;\">(1997) </span><strong>-</strong><span style=\"font-weight: 400;\"> Examined the financial system\'s effectiveness for the small-scale sector and the role of primary dealers.</span></p>\n",
                    solution_hi: "<p>11.(c)&nbsp;<strong>&#2350;&#2366;&#2354;&#2375;&#2327;&#2366;&#2350; &#2360;&#2350;&#2367;&#2340;&#2367;</strong><span style=\"font-weight: 400;\">&#2404;</span><span style=\"font-weight: 400;\"> &#2313;&#2346;-&#2360;&#2350;&#2367;&#2340;&#2367; &#2357;&#2366;&#2312;.&#2319;&#2330;. &#2350;&#2366;&#2354;&#2375;&#2327;&#2366;&#2350; &#2325;&#2368; &#2309;&#2343;&#2381;&#2351;&#2325;&#2381;&#2359;&#2340;&#2366; &#2350;&#2375;&#2306; &#2341;&#2368;&#2404; </span><strong>&#2328;&#2379;&#2359; &#2360;&#2350;&#2367;&#2340;&#2367;</strong><span style=\"font-weight: 400;\"> (1991) - &#2348;&#2376;&#2306;&#2325; &#2350;&#2375;&#2306; &#2343;&#2379;&#2326;&#2366;&#2343;&#2337;&#2364;&#2368; &#2324;&#2352; &#2325;&#2342;&#2366;&#2330;&#2366;&#2352; &#2325;&#2375; &#2357;&#2367;&#2349;&#2367;&#2344;&#2381;&#2344; &#2346;&#2361;&#2354;&#2369;&#2323;&#2306; &#2325;&#2368; &#2332;&#2366;&#2306;&#2330; &#2325;&#2352;&#2344;&#2375; &#2324;&#2352; &#2320;&#2360;&#2375; &#2350;&#2366;&#2350;&#2354;&#2379;&#2306; &#2325;&#2379; &#2325;&#2350; &#2325;&#2352;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2360;&#2367;&#2347;&#2366;&#2352;&#2367;&#2358; &#2325;&#2368;&#2404; </span><strong>&#2358;&#2367;&#2357;&#2352;&#2366;&#2350;&#2344; &#2360;&#2350;&#2367;&#2340;&#2367;</strong><span style=\"font-weight: 400;\"> (1979) - &#2344;&#2366;&#2348;&#2366;&#2352;&#2381;&#2337; (NABARD) &#2325;&#2368; &#2360;&#2381;&#2341;&#2366;&#2346;&#2344;&#2366; &#2325;&#2368; &#2360;&#2367;&#2347;&#2366;&#2352;&#2367;&#2358; &#2325;&#2368;&#2404; </span><strong>&#2326;&#2366;&#2344; &#2360;&#2350;&#2367;&#2340;&#2367;</strong><span style=\"font-weight: 400;\"> (1997) - &#2354;&#2328;&#2369; &#2313;&#2342;&#2381;&#2351;&#2379;&#2327; &#2325;&#2381;&#2359;&#2375;&#2340;&#2381;&#2352; &#2325;&#2375; &#2354;&#2367;&#2319; &#2357;&#2367;&#2340;&#2381;&#2340;&#2368;&#2351; &#2346;&#2381;&#2352;&#2339;&#2366;&#2354;&#2368; &#2325;&#2368; &#2346;&#2381;&#2352;&#2349;                 questions.push({
                    id: "12",
                    section: "18",
                    question_en: "<p><span style=\"font-family: Roboto;\">12. </span><span style=\"font-family: Roboto;\">Non-Tax revenue is part of __________.</span></p>\n",
                    question_hi: "<p>12. <span style=\"font-family: Palanquin;\">&#2327;&#2376;&#2352; - &#2325;&#2352; &#2352;&#2366;&#2332;&#2360;&#2381;&#2357; ________ &#2325;&#2366; &#2361;&#2367;&#2360;&#2381;&#2360;&#2366; &#2361;&#2379;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\n",

                                "<p>Capital Expenditure</p>\n", "<p>Capital Receipts</p>\n"],
                    options_hi: ["<p>&#2352;&#2366;&#2332;&#2360;&#2381;&#2357; &#2357;&#2381;&#2351;&#2351;</p>\n", "<p>&#2352;&#2366;&#2332;&#2360;&#2381;&#2357; &#2346;&#2381;&#2352;&#2366;&#2346;&#2381;&#2340;&#2367;&#2351;&#2379;&#2306;</p>\n",
                                "<p>&#2346;&#2370;&#2306;&#2332;&#2368;&#2327;&#2340; &#2357;&#2381;&#2351;&#2351;</p>\n", "<p>&#2346;&#2370;&#2306;&#2332;&#2368;&#2327;&#2340; &#2346;&#2381;&#2352;&#2366;&#2346;&#2381;&#2340;&#2367;&#2351;&#2379;&#2306;</p>\n"],
                    solution_en: "<p>12.(b) <strong>Revenue Receipts - </strong><span style=\"font-weight: 400;\">Do not have a direct impact on the assets and liabilities. Example -&nbsp; Money earned through tax (excise duty, income tax) and non-tax sources (dividend income, profits, interest receipts). </span><strong>Revenue Expenditure</strong><span style=\"font-weight: 400;\"> - Does not impact its assets or liabilities. Example - Salaries, interest payments, Pension. </span><strong>Capital expenditure</strong><span style=\"font-weight: 400;\"> - Create assets or to reduce liabilities. Example -&nbsp; construction of roads and hospitals, Loans to states, Repayment of its borrowings. </span><strong>Capital Receipts</strong><span style=\"font-weight: 400;\"> - Decrease in assets or an increase in liabilities. Example - Disinvestment, Borrowings or repayment of loans by states.</span></p>\n",
                    solution_hi: "<p>12.(b)&nbsp;<strong>&#2352;&#2366;&#2332;&#2360;&#2381;&#2357; </strong><strong>&#2346;&#2381;&#2352;&#2366;&#2346;&#2381;&#2340;&#2367;&#2351;&#2379;&#2306;</strong><span style=\"font-weight: 400;\"> - &#2360;&#2306;&#2346;&#2340;&#2381;&#2340;&#2367;&#2351;&#2379;&#2306; &#2324;&#2352; &#2342;&#2375;&#2344;&#2342;&#2366;&#2352;&#2367;&#2351;&#2379;&#2306; &#2346;&#2352; &#2360;&#2368;&#2343;&#2366; &#2346;&#2381;&#2352;&#2349;&#2366;&#2357; &#2344;&#2361;&#2368;&#2306; &#2346;&#2337;&#2364;&#2340;&#2366; &#2361;&#2376;&#2404; &#2313;&#2342;&#2366;&#2361;&#2352;&#2339; - &#2325;&#2352; (&#2313;&#2340;&#2381;&#2346;&#2366;&#2342; &#2358;&#2369;&#2354;&#2381;&#2325;, &#2310;&#2351;&#2325;&#2352;) &#2324;&#2352; &#2327;&#2376;&#2352;-&#2325;&#2352; &#2360;&#2381;&#2352;&#2379;&#2340;&#2379;&#2306; (&#2354;&#2366;&#2349;&#2366;&#2306;&#2358; &#2310;&#2351;, &#2354;&#2366;&#2349;, &#2348;&#2381;&#2351;&#2366;&#2332; &#2346;&#2381;&#2352;&#2366;&#2346;&#2381;&#2340;&#2367;&#2351;&#2366;&#2306;) &#2325;&#2375; &#2350;&#2366;&#2343;&#2381;&#2351;&#2350; &#2360;&#2375; &#2309;&#2352;&#2381;&#2332;&#2367;&#2340; &#2343;&#2344;&#2404;</span><strong> &#2352;&#2366;&#2332;&#2360;&#2381;&#2357; &#2357;&#2381;&#2351;&#2351; </strong><span style=\"font-weight: 400;\">- &#2311;&#2360;&#2325;&#2368; &#2360;&#2306;&#2346;&#2340;&#2381;&#2340;&#2367;&#2351;&#2379;&#2306; &#2351;&#2366; &#2342;&#2375;&#2344;&#2342;&#2366;&#2352;&#2367;&#2351;&#2379;&#2306; &#2346;&#2352; &#2325;&#2379;&#2312; &#2346;&#2381;&#2352;&#2349;&#2366;&#2357; &#2344;&#2361;&#2368;&#2306; &#2346;&#2337;&#2364;&#2340;&#2366; &#2361;&#2376;&#2404; &#2313;&#2342;&#2366;&#2361;&#2352;&#2339; - &#2357;&#2375;&#2340;&#2344;, &#2348;&#2381;&#2351;&#2366;&#2332; &#2349;&#2369;&#2327;&#2340;&#2366;&#2344;, &#2346;&#2375;&#2306;&#2358;&#2344;&#2404;</span><strong> &#2346;&#2370;&#2306;&#2332;&#2368;&#2327;&#2340; &#2357;&#2381;&#2351;&#2351;</strong><span style=\"font-weight: 400;\"> - &#2360;&#2306;&#2346;&#2340;&#2381;&#2340;&#2367; &#2348;&#2344;&#2366;&#2344;&#2366; &#2351;&#2366; &#2342;&#2375;&#2344;&#2342;&#2366;&#2352;&#2367;&#2351;&#2366;&#2306; &#2325;&#2350; &#2325;&#2352;&#2344;&#2366;&#2404; &#2313;&#2342;&#2366;&#2361;&#2352;&#2339; - &#2360;&#2337;&#2364;&#2325;&#2379;&#2306; &#2324;&#2352; &#2309;&#2360;&#2381;&#2346;&#2340;&#2366;&#2354;&#2379;&#2306; &#2325;&#2366; &#2344;&#2367;&#2352;&#2381;&#2350;&#2366;&#2339;, &#2352;&#2366;&#2332;&#2381;&#2351;&#2379;&#2306; &#2325;&#2379; &#2315;&#2339;, &#2313;&#2360;&#2325;&#2368; &#2313;&#2343;&#2366;&#2352;&#2368; &#2325;&#2366; &#2346;&#2369;&#2344;&#2352;&#2381;&#2349;&#2369;&#2327;&#2340;&#2366;&#2344;&#2404; </span><strong>&#2346;&#2370;&#2306;&#2332;&#2368;&#2327;&#2340; &#2346;&#2381;&#2352;&#2366;&#2346;&#2381;&#2340;&#2367;&#2351;&#2366;&#2306;</strong><span style=\"font-weight: 400;\"> - &#2360;&#2306;&#2346;&#2340;&#2381;&#2340;&#2367; &#2350;&#2375;&#2306; &#2325;&#2350;&#2368; &#2351;&#2366; &#2342;&#2375;&#2344;&#2342;&#2366;&#2352;&#2367;&#2351;&#2379;&#2306; &#2350;&#2375;&#2306; &#2357;&#2371;&#2342;&#2381;&#2343;&#2367;&#2404; &#2313;&#2342;&#2366;&#2361;&#2352;&#2339; - &#2357;&#2367;&#2344;&#2367;&#2357;&#2375;&#2358;, &#2352;&#2366;&#2332;&#2381;&#2351;&#2379;&#2306; &#2342;&#2381;&#2357;&#2366;&#2352;&#2366; &#2315;&#2339; &#2354;&#2375;&#2344;&#2366; &#2351;&#2366; &#2330;&#2369;&#2325;&#2366;&#2344;&#2366;&#2404;</span></p>\n",

                    question_en: "<p><span style=\"font-family: Roboto;\">13.</span><span style=\"font-family: Roboto;\"> The term of trade refers to _____________.</span></p>\n",

                    options_en: ["<p>the excess of import expenditures over export earnings</p>\n", "<p>the trade agreements</p>\n",

                    options_hi: ["<p>&#2344;&#2367;&#2352;&#2381;&#2351;&#2366;&#2340; &#2310;&#2351; &#2346;&#2352; &#2310;&#2351;&#2366;&#2340; &#2357;&#2381;&#2351;&#2351; &#2325;&#2368; &#2309;&#2343;&#2367;&#2325;&#2340;&#2366;</p>\n", "<p>&#2357;&#2381;&#2351;&#2366;&#2346;&#2366;&#2352; &#2360;&#2350;&#2333;&#2380;&#2340;&#2375;</p>\n",
                                "<p>&#2357;&#2375; &#2344;&#2367;&#2351;&#2350; &#2324;&#2352; &#2358;&#2352;&#2381;&#2340;&#2375;&#2306; &#2332;&#2367;&#2344; &#2346;&#2352; &#2325;&#2367;&#2360;&#2368; &#2342;&#2375;&#2358; &#2325;&#2379; &#2315;&#2339; &#2342;&#2375;&#2344;&#2375; &#2325;&#2368; &#2346;&#2375;&#2358;&#2325;&#2358; &#2325;&#2368; &#2332;&#2366;&#2340;&#2368; &#2361;&#2376;&#2404;</p>\n", "<p>&#2344;&#2367;&#2352;&#2381;&#2351;&#2366;&#2340; &#2325;&#2368;&#2350;&#2340;&#2379;&#2306; &#2324;&#2352; &#2310;&#2351;&#2366;&#2340; &#2325;&#2368;&#2350;&#2340;&#2379;&#2306; &#2325;&#2375; &#2348;&#2368;&#2330; &#2309;&#2344;&#2369;&#2346;&#2366;&#2340;</p>\n"],
                    solution_en: "<p>13.(d) <span style=\"font-family: Roboto;\">The Net Barter terms of trade - Ratio between export prices and import prices. </span><strong><span style=\"font-family: Roboto;\">Balance of trade </span></strong><span style=\"font-family: Roboto;\"><strong>- </strong>Difference in value between the country\'s imports and exports of goods and services over time. Trade deficit - When a country\'s imports exceed its exports during a given time period.</span></p>\n",
                    solution_hi: "<p>13.(d) <span style=\"font-family: Palanquin;\">&#2357;&#2381;&#2351;&#2366;&#2346;&#2366;&#2352; &#2325;&#2368; &#2358;&#2369;&#2342;&#2381;&#2343; &#2357;&#2360;&#2381;&#2340;&#2369; &#2357;&#2367;&#2344;&#2367;&#2350;&#2351; &#2358;&#2352;&#2381;&#2340;&#2375;&#2306; - &#2344;&#2367;&#2352;&#2381;&#2351;&#2366;&#2340; &#2325;&#2368;&#2350;&#2340;&#2379;&#2306; &#2324;&#2352; &#2310;&#2351;&#2366;&#2340; &#2325;&#2368;&#2350;&#2340;&#2379;&#2306; &#2325;&#2375; &#2348;&#2368;&#2330; &#2325;&#2366; &#2309;&#2344;&#2369;&#2346;&#2366;&#2340;&#2404; </span><strong><span style=\"font-family: Palanquin;\">&#2357;&#2381;&#2351;&#2366;&#2346;&#2366;&#2352; &#2360;&#2306;&#2340;&#2369;&#2354;&#2344;</span></strong><span style=\"font-family: Palanquin;\"><strong> </strong>- &#2360;&#2350;&#2351; &#2325;&#2375; &#2360;&#2366;&#2341; &#2342;&#2375;&#2358; &#2325;&#2375; &#2310;&#2351;&#2366;&#2340; &#2324;&#2352; &#2357;&#2360;&#2381;&#2340;&#2369;&#2323;&#2306; &#2324;&#2352; &#2360;&#2375;&#2357;&#2366;&#2323;&#2306; &#2325;&#2375; &#2344;&#2367;&#2352;&#2381;&#2351;&#2366;&#2340; &#2325;&#2375; &#2348;&#2368;&#2330; &#2350;&#2370;&#2354;&#2381;&#2351; &#2350;&#2375;&#2306; &#2309;&#2306;&#2340;&#2352;&#2404; &#2357;&#2381;&#2351;&#2366;&#2346;&#2366;&#2352; &#2328;&#2366;&#2335;&#2366; - &#2332;&#2348; &#2325;&#2367;&#2360;&#2368; &#2342;&#2375;&#2358; &#2325;&#2366; &#2310;&#2351;&#2366;&#2340; &#2319;&#2325; &#2344;&#2367;&#2358;&#2381;&#2330;&#2367;&#2340; &#2360;&#2350;&#2351; &#2309;&#2357;&#2343;&#2367; &#2325;&#2375; &#2342;&#2380;&#2352;&#2366;&#2344; &#2313;&#2360;&#2325;&#2375; &#2344;&#2367;&#2352;&#2381;&#2351;&#2366;&#2340; &#2360;&#2375; &#2309;&#2343;&#2367;&#2325; &#2361;&#2379; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\n",

                questions.push({
                    id: "14",
                    section: "18",
                    question_en: "<p><span style=\"font-family: Roboto;\">14.</span><span style=\"font-family: Roboto;\"> What was the prime target of the first five - year plan of India?</span></p>\n",
                    question_hi: "<p><span style=\"font-family: Roboto;\">14.</span><span style=\"font-family: Palanquin;\"> &#2349;&#2366;&#2352;&#2340; &#2325;&#2368; &#2346;&#2381;&#2352;&#2341;&#2350; &#2346;&#2306;&#2330;&#2357;&#2352;&#2381;&#2359;&#2368;&#2351; &#2351;&#2379;&#2332;&#2344;&#2366; &#2325;&#2366; &#2346;&#2381;&#2352;&#2350;&#2369;&#2326; &#2354;&#2325;&#2381;&#2359;&#2381;&#2351; &#2325;&#2381;&#2351;&#2366; &#2341;&#2366;?</span></p>\n",
                    options_en: ["<p>Development of agriculture</p>\n", "<p>Development of industries</p>\n", 
                                "<p>Development of ports</p>\n", "<p>Development of infrastructure</p>\n"],
                    options_hi: ["<p><span style=\"font-family: Palanquin;\">&#2325;&#2371;&#2359;&#2367; &#2325;&#2366; &#2357;&#2367;&#2325;&#2366;&#2360;</span><span style=\"font-family: Roboto;\"> </span></p>\n", "<p><span style=\"font-family: Palanquin;\">&#2313;&#2342;&#2381;&#2351;&#2379;&#2327;&#2379;&#2306; &#2325;&#2366; &#2357;&#2367;&#2325;&#2366;&#2360;</span></p>\n",
                                "<p><span style=\"font-family: Palanquin;\">&#2348;&#2306;&#2342;&#2352;&#2327;&#2366;&#2361;&#2379;&#2306; &#2325;&#2366; &#2357;&#2367;&#2325;&#2366;&#2360;</span></p>\n", "<p><span style=\"font-family: Palanquin;\">&#2348;&#2369;&#2344;&#2367;&#2351;&#2366;&#2342;&#2368; &#2338;&#2366;&#2306;&#2330;&#2375; &#2325;&#2366; &#2357;&#2367;&#2325;&#2366;&#2360;</span></p>\n"],
                    solution_en: "<p>14.(a) <strong>Development of agriculture. </strong><span style=\"font-family: Roboto;\">First Five year Plan (1951- 1956): IITs were set up. The target growth rate was 2.1% and the achieved growth rate was 3.6%. It was based on the Harrod Domar Model. Second Five year Plan (1956-1961) : Mahalanobis model was adopted. Aim - Rapid industrialisation. Third Five year Plan (1961-1966) : Aim - establishment of a self-reliant and self-generating economy. Fourth five year Plan (1969-74) : Aim - growth with stability and progressive achievement of self-reliance. During this plan, the government nationalized 14 major Indian Banks and the Green Revolution boosted agriculture.</span></p>\n",
                    solution_hi: "<p>14.(a) <strong>&#2325;&#2371;&#2359;&#2367; &#2325;&#2366; &#2357;&#2367;&#2325;&#2366;&#2360; </strong>&#2404;<span style=\"font-family: Palanquin;\"> &#2346;&#2381;&#2352;&#2341;&#2350; &#2346;&#2306;&#2330;&#2357;&#2352;&#2381;&#2359;&#2368;&#2351; &#2351;&#2379;&#2332;&#2344;&#2366; (1951-1956): IIT &#2325;&#2368; &#2360;&#2381;&#2341;&#2366;&#2346;&#2344;&#2366; &#2325;&#2368; &#2327;&#2312;&#2404; &#2354;&#2325;&#2381;&#2359;&#2381;&#2351; &#2357;&#2371;&#2342;&#2381;&#2343;&#2367; &#2342;&#2352; 2.1% &#2341;&#2368; &#2324;&#2352; &#2346;&#2381;&#2352;&#2366;&#2346;&#2381;&#2340; &#2357;&#2371;&#2342;&#2381;&#2343;&#2367; &#2342;&#2352; 3.6% &#2341;&#2368;&#2404; &#2351;&#2361; &#2361;&#2376;&#2352;&#2379;&#2337; &#2337;&#2379;&#2350;&#2352; &#2350;&#2377;&#2337;&#2354; &#2346;&#2352; &#2310;&#2343;&#2366;&#2352;&#2367;&#2340; &#2341;&#2366;&#2404; &#2342;&#2381;&#2357;&#2367;&#2340;&#2368;&#2351; &#2346;&#2306;&#2330;&#2357;&#2352;&#2381;&#2359;&#2368;&#2351; &#2351;&#2379;&#2332;&#2344;&#2366; (1956-1961): &#2350;&#2361;&#2366;&#2354;&#2344;&#2379;&#2348;&#2367;&#2360; &#2350;&#2377;&#2337;&#2354; &#2309;&#2346;&#2344;&#2366;&#2351;&#2366; &#2327;&#2351;&#2366;&#2404; &#2313;&#2342;&#2381;&#2342;&#2375;&#2358;&#2381;&#2351;- &#2340;&#2368;&#2357;&#2381;&#2352; &#2324;&#2342;&#2381;&#2351;&#2379;&#2327;&#2368;&#2325;&#2352;&#2339;&#2404; &#2340;&#2368;&#2360;&#2352;&#2368; &#2346;&#2306;&#2330;&#2357;&#2352;&#2381;&#2359;&#2368;&#2351; &#2351;&#2379;&#2332;&#2344;&#2366; (1961-1966) : &#2313;&#2342;&#2381;&#2342;&#2375;&#2358;&#2381;&#2351; - &#2310;&#2340;&#2381;&#2350;&#2344;&#2367;&#2352;&#2381;&#2349;&#2352; &#2319;&#2357;&#2306; &#2360;&#2381;&#2357;-&#2313;&#2340;&#2381;&#2346;&#2366;&#2342;&#2325; &#2309;&#2352;&#2381;&#2341;&#2357;&#2381;&#2351;&#2357;&#2360;&#2381;&#2341;&#2366; &#2325;&#2368; &#2360;&#2381;&#2341;&#2366;&#2346;&#2344;&#2366;&#2404; &#2330;&#2380;&#2341;&#2368; &#2346;&#2306;&#2330;&#2357;&#2352;&#2381;&#2359;&#2368;&#2351; &#2351;&#2379;&#2332;&#2344;&#2366; (1969-74): &#2313;&#2342;&#2381;&#2342;&#2375;&#2358;&#2381;&#2351; - &#2360;&#2381;&#2341;&#2367;&#2352;&#2340;&#2366; &#2325;&#2375; &#2360;&#2366;&#2341; &#2357;&#2367;&#2325;&#2366;&#2360; &#2324;&#2352; &#2310;&#2340;&#2381;&#2350;&#2344;&#2367;&#2352;&#2381;&#2349;&#2352;&#2340;&#2366; &#2325;&#2368; &#2346;&#2381;&#2352;&#2327;&#2340;&#2367;&#2358;&#2368;&#2354; &#2313;&#2346;&#2354;&#2348;&#2381;&#2343;&#2367;&#2404; &#2311;&#2360; &#2351;&#2379;&#2332;&#2344;&#2366; &#2325;&#2375; &#2342;&#2380;&#2352;&#2366;&#2344;, &#2360;&#2352;&#2325;&#2366;&#2352; &#2344;&#2375; 14 &#2346;&#2381;&#2352;&#2350;&#2369;&#2326; &#2349;&#2366;&#2352;&#2340;&#2368;&#2351; &#2348;&#2376;&#2306;&#2325;&#2379;&#2306; &#2325;&#2366; &#2352;&#2366;&#2359;&#2381;&#2335;&#2381;&#2352;&#2368;&#2351;&#2325;&#2352;&#2339; &#2325;&#2367;&#2351;&#2366; &#2324;&#2352; &#2361;&#2352;&#2367;&#2340; &#2325;&#2381;&#2352;&#2366;&#2306;&#2340;&#2367; &#2344;&#2375; &#2325;&#2371;&#2359;&#2367; &#2325;&#2379; &#2348;&#2338;&#2364;&#2366;&#2357;&#2366; &#2342;&#2367;&#2351;&#2366;&#2404;</span></p>\n",
                    correct: "a",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });

                                "<p>Indian Overseas Bank</p>\n", "<p>Bandhan Bank</p>\n"],
                    options_hi: ["<p>&#2325;&#2375;&#2344;&#2352;&#2366; &#2348;&#2376;&#2306;&#2325;</p>\n", "<p>&#2351;&#2370;&#2325;&#2379; &#2348;&#2376;&#2306;&#2325;</p>\n",
                                "<p>&#2311;&#2306;&#2337;&#2367;&#2351;&#2344; &#2323;&#2357;&#2352;&#2360;&#2368;&#2332; &#2348;&#2376;&#2306;&#2325;</p>\n", "<p>&#2348;&#2306;&#2343;&#2344; &#2348;&#2376;&#2306;&#2325;</p>\n"],
                    solution_en: "<p>15.(d) <strong>Bandhan Bank</strong>. <span style=\"font-family: Roboto;\">The 12 public sector banks are - State Bank of India, Punjab National Bank, Bank of Baroda, Bank of India, Central Bank of India, Canara Bank, Union Bank of India, Indian Overseas Bank, Punjab and Sind Bank, Indian Bank, UCO Bank, and Bank of Maharashtra.</span></p>\n",
                    solution_hi: "<p>15.(d) <strong>&#2348;&#2306;&#2343;&#2344; &#2348;&#2376;&#2306;&#2325;</strong>&#2404;<span style=\"font-family: Palanquin;\"> 12 &#2360;&#2366;&#2352;&#2381;&#2357;&#2332;&#2344;&#2367;&#2325; &#2325;&#2381;&#2359;&#2375;&#2340;&#2381;&#2352; &#2325;&#2375; &#2348;&#2376;&#2306;&#2325; &#2361;&#2376;&#2306; - &#2360;&#2381;&#2335;&#2375;&#2335; &#2348;&#2376;&#2306;&#2325; &#2321;&#2347; &#2311;&#2306;&#2337;&#2367;&#2351;&#2366;, &#2346;&#2306;&#2332;&#2366;&#2348; &#2344;&#2375;&#2358;&#2344;&#2354; &#2348;&#2376;&#2306;&#2325;, &#2348;&#2376;&#2306;&#2325; &#2321;&#2347; &#2348;&#2337;&#2364;&#2380;&#2342;&#2366;, &#2348;&#2376;&#2306;&#2325; &#2321;&#2347; &#2311;&#2306;&#2337;&#2367;&#2351;&#2366;, &#2360;&#2375;&#2306;&#2335;&#2381;&#2352;&#2354; &#2348;&#2376;&#2306;&#2325; &#2321;&#2347; &#2311;&#2306;&#2337;&#2367;&#2351;&#2366;, &#2325;&#2375;&#2344;&#2352;&#2366; &#2348;&#2376;&#2306;&#2325;, &#2351;&#2370;&#2344;&#2367;&#2351;&#2344; &#2348;&#2376;&#2306;&#2325; &#2321;&#2347; &#2311;&#2306;&#2337;&#2367;&#2351;&#2366;, &#2311;&#2306;&#2337;&#2367;&#2351;&#2344; &#2323;&#2357;&#2352;&#2360;&#2368;&#2332; &#2348;&#2376;&#2306;&#2325;, &#2346;&#2306;&#2332;&#2366;&#2348; &#2319;&#2306;&#2337; &#2360;&#2367;&#2306;&#2343; &#2348;&#2376;&#2306;&#2325;, &#2311;&#2306;&#2337;&#2367;&#2351;&#2344; &#2348;&#2376;&#2306;&#2325;, UCO &#2348;&#2376;&#2306;&#2325;, &#2324;&#2352; &#2348;&#2376;&#2306;&#2325; &#2321;&#2347; &#2350;&#2361;&#2366;&#2352;&#2366;&#2359;&#2381;&#2335;&#2381;&#2352;&#2404;</span></p>\n",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
            
            // Generate question boxes
            const boxesContainer = document.getElementById('question-boxes');
            questions.forEach((q, index) => {
                const box = document.createElement('div');
                box.className = 'q-box';
                box.textContent = index + 1;
                box.onclick = () => showQuestion(index);
                box.id = `box-${index}`;
                boxesContainer.appendChild(box);
            });
            
            // Show first question
            showQuestion(0);
            updateProgress();
        }
        
        // Show a specific question
        
        function formatContent(text) {
            if (!text) return '';
            return text.replace(/<img/g, '<img style="max-width:100%;height:auto;"');
        }
        
        function showQuestion(index) {
            if (index < 0 || index >= questions.length) return;
            
            currentQuestion = index;
            const question = questions[index];
            
            // Update question counter
            document.getElementById('question-counter').textContent = `Question ${index + 1} of ${questions.length}`;
            
            // Update question boxes
            document.querySelectorAll('.q-box').forEach(box => box.classList.remove('current'));
            document.getElementById(`box-${index}`).classList.add('current');
            
            // Generate question HTML
            let html = `
                <div class="question-card">
                    <div class="question-text">
                        <div class="en">${formatContent(question.question_en)}</div>
                        <div class="hi" style="display:none">${formatContent(question.question_hi)} </div>
                    </div>
                    <div class="options" id="options-container">`;
            
            // Add options
            ['a', 'b', 'c', 'd'].forEach((opt, i) => {
                let optionClass = '';
                let isCorrectAnswer = opt === question.correct;
                let isUserAnswer = answers[question.id] === opt;
                
                // When reviewing, add appropriate classes
                if (submitted) {
                    if (isCorrectAnswer) {
                        optionClass += ' correct-answer';
                    } else if (isUserAnswer && !isCorrectAnswer) {
                        optionClass += ' incorrect';
                    }
                }
                
                html += `
                    <div class="option-item">
                        <input class="option-input" type="radio" name="q${index}" 
                            id="opt-${index}-${opt}" value="${opt}" 
                            ${isUserAnswer ? 'checked' : ''}
                            onclick="selectAnswer('${question.id}', '${opt}')">
                       <label class="option-label${optionClass}" for="opt-${index}-${opt}">
                            <div class="en">${question.options_en[i]}</div>
                            <div class="hi" style="display:none">${question.options_hi[i]}</div>
                        </label>
                    </div>`;
            });
            
            // Add solution if submitted
            if (submitted) {
                const isCorrect = answers[question.id] === question.correct;
                const resultText = answers[question.id] ? (isCorrect ? 'Correct!' : 'Incorrect!') : 'Not attempted';
                
                html += `
                    <div class="solution-container">
                        <div class="solution-title">${resultText}</div>
                        <div class="solution-text">
                            <div class="en">${question.solution_en}</div>
                            <div class="hi" style="display:none">${question.solution_hi}</div>
                        </div>
                    </div>`;
            }
            
            html += `</div></div>`;
            
            document.getElementById('questions-container').innerHTML = html;
            
            // Apply language settings
            applyLanguage();
            
            // If in mobile view, close the menu
            if (window.innerWidth < 992) {
                toggleNav(false);
            }
            
            // Add review mode class if submitted
            if (submitted) {
                document.getElementById('options-container').classList.add('review-mode');
            }
        }
        
        // Apply current language
        function applyLanguage() {
            document.querySelectorAll(`.${currentLang}`).forEach(el => el.style.display = 'block');
            document.querySelectorAll(`.${currentLang === 'en' ? 'hi' : 'en'}`).forEach(el => el.style.display = 'none');
            
            // Update language button text
            document.getElementById('lang-text').textContent = currentLang === 'en' ? 'Hi' : 'En';
        }
        
        // Select an answer
        function selectAnswer(qId, option) {
            if (submitted) return;
            
            answers[qId] = option;
            updateProgress();
            
            // Mark question as attempted in the navigation
            const index = questions.findIndex(q => q.id === qId);
            if (index >= 0) {
                const box = document.getElementById(`box-${index}`);
                box.classList.add('attempted');
                box.classList.remove('unattempted');
            }
        }
        
        // Navigate to previous/next question
        function prevQuestion() { 
            if (currentQuestion > 0) showQuestion(currentQuestion - 1); 
        }
        
        function nextQuestion() { 
            if (currentQuestion < questions.length - 1) showQuestion(currentQuestion + 1); 
        }
        
        // Switch section
        function switchSection(sectionId) {
            if (sectionId === 'all') {
                showQuestion(0);
                return;
            }
            
            const section = sections[sectionId];
            if (section) showQuestion(section.start);
        }
        
        // Toggle language
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            applyLanguage();
        }
        
        // Toggle navigation sidebar
        function toggleNav(show) {
            const nav = document.getElementById('question-nav');
            const overlay = document.getElementById('nav-overlay');
            
            if (show === undefined) {
                show = !nav.classList.contains('show');
            }
            
            if (show) {
                nav.classList.add('show');
                overlay.classList.add('show');
                document.body.style.overflow = 'hidden';
            } else {
                nav.classList.remove('show');
                overlay.classList.remove('show');
                document.body.style.overflow = '';
            }
        }
        
        // Update progress
        function updateProgress() {
            const attempted = Object.keys(answers).length;
            document.getElementById('attempted-count').textContent = attempted;
        }
        
        // Start timer
        function startTimer() {
            const timerDisplay = document.getElementById('timer-display');
            let timeLeft = totalTime;
            
            const timerInterval = setInterval(() => {
                if (timeLeft <= 0 || submitted) {
                    clearInterval(timerInterval);
                    if (!submitted) submitTest();
                    return;
                }
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                timeLeft--;
            }, 1000);
        }
        
        // Confirm before submitting
        function confirmSubmit() {
            if (submitted) return;
            
            const attempted = Object.keys(answers).length;
            const remaining = questions.length - attempted;
            
            // Create a more modern confirmation dialog
            const confirmHtml = `
                <div style="text-align: center; padding: 20px;">
                    <h4 style="margin-bottom: 16px; color: var(--dark);">Confirm Submission</h4>
                    <p style="margin-bottom: 24px; color: var(--gray);">
                        You have attempted ${attempted} of ${questions.length} questions.<br>
                        ${remaining} questions are unattempted.
                    </p>
                    <div style="display: flex; justify-content: center; gap: 12px;">
                        <button onclick="this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; border: 1px solid var(--light-gray); background: white; border-radius: 8px; cursor: pointer;">
                            Cancel
                        </button>
                        <button onclick="submitTest(); this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer;">
                            Submit Test
                        </button>
                    </div>
                </div>`;
            
            // Create modal element
            const modal = document.createElement('div');
            modal.className = 'results-modal show';
            modal.innerHTML = `
                <div class="results-card" style="max-width: 400px;">
                    <button class="cancel-btn" style="position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--gray);" onclick="this.closest('.results-modal').remove()">
                        ×
                    </button>
                    ${confirmHtml}
                </div>`;
            
            document.body.appendChild(modal);
        }
        
        // Submit test
        function submitTest() {
            if (submitted) return;
            
            submitted = true;
            
            let score = 0;
            let correctCount = 0;
            let incorrectCount = 0;
            let unattemptedCount = 0;
            
            questions.forEach((q, index) => {
                const userAns = answers[q.id];
                const box = document.getElementById(`box-${index}`);
                
                box.classList.remove('attempted');
                
                if (!userAns) {
                    unattemptedCount++;
                    box.classList.add('unattempted');
                } else if (userAns === q.correct) {
                    correctCount++;
                    score += q.pos_marks;
                    box.classList.add('correct');
                } else {
                    incorrectCount++;
                    score -= q.neg_marks;
                    box.classList.add('incorrect');
                }
            });
            
            // Update result values
            document.getElementById('score-value').textContent = score.toFixed(2);
            document.getElementById('correct-value').textContent = correctCount;
            document.getElementById('incorrect-value').textContent = incorrectCount;
            document.getElementById('unattempted-value').textContent = unattemptedCount;
            
            // Show the results modal
            document.getElementById('results-modal').classList.add('show');
            
            // Disable submit button
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-check"></i>';
            submitBtn.style.backgroundColor = 'var(--success)';
            
            // Refresh current question view to show solution
            showQuestion(currentQuestion);
        }
        
        // Review test
        function reviewTest() {
            document.getElementById('results-modal').classList.remove('show');
            showQuestion(0);
        }
        
        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('results-modal')) {
                document.getElementById('results-modal').classList.remove('show');
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === 'ArrowRight') nextQuestion();
        });
    </script>
</body>
</html>
