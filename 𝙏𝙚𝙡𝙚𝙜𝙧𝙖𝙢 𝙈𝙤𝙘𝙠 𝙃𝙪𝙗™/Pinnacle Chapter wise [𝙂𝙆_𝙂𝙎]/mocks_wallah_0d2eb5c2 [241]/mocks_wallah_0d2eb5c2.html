                    id: "10",
                    section: "18",
                    question_en: "<p><span style=\"font-family: Roboto;\">10.</span><span style=\"font-family: Roboto;\"> Who found an empirical relationship between the half-life of alpha decay and the energy of the emitted alpha particles in 1911?</span></p>\n",
                    question_hi: "<p><span style=\"font-family: Roboto;\">10. </span><span style=\"font-family: Palanquin;\">1911 &#2350;&#2375;&#2306;, &#2309;&#2354;&#2381;&#2347;&#2366; &#2325;&#2381;&#2359;&#2351; &#2325;&#2375; &#2309;&#2352;&#2381;&#2342;&#2381;&#2343;- &#2310;&#2351;&#2369;&#2325;&#2366;&#2354; &#2324;&#2352; &#2313;&#2340;&#2381;&#2360;&#2352;&#2381;&#2332;&#2367;&#2340; &#2309;&#2354;&#2381;&#2347;&#2366; &#2325;&#2339;&#2379;&#2306; &#2325;&#2368; &#2314;&#2352;&#2381;&#2332;&#2366; &#2325;&#2375; &#2348;&#2368;&#2330; &#2319;&#2325; &#2346;&#2381;&#2352;&#2351;&#2379;&#2327;&#2360;&#2367;&#2342;&#2381;&#2343; &#2360;&#2306;&#2348;&#2306;&#2343; &#2325;&#2367;&#2360;&#2344;&#2375; &#2326;&#2379;&#2332;&#2366; &#2341;&#2366;?</span></p>\n",
                    options_en: ["<p>Chadwick and Lawrence</p>\n", "<p>Fermi and Meitner</p>\n", 
                                "<p>Geiger and Nuttall</p>\n", "<p>Soddy and Aston</p>\n"],
                    options_hi: ["<p><span style=\"font-weight: 400;\">&#2330;&#2376;&#2337;&#2357;&#2367;&#2325; &#2324;&#2352; &#2354;&#2377;&#2352;&#2375;&#2306;&#2360; (Chadwick and Lawrence)</span></p>\n", "<p><span style=\"font-weight: 400;\">&#2347;&#2352;&#2381;&#2350;&#2368; &#2324;&#2352; &#2350;&#2368;&#2335;&#2344;&#2352; (Fermi and Meitner)</span></p>\n",
                                "<p><span style=\"font-weight: 400;\">&nbsp;&#2327;&#2368;&#2327;&#2352; &#2324;&#2352; &#2344;&#2381;&#2351;&#2370;&#2335;&#2377;&#2354; (Geiger and Nuttall)</span></p>\n", "<p><span style=\"font-weight: 400;\">&#2360;&#2379;&#2337;&#2381;&#2337;&#2368; &#2324;&#2352; &#2319;&#2360;&#2381;&#2335;&#2344; (Soddy and Aston)</span></p>\n"],
                    solution_en: "<p>10.(c)&nbsp;<strong>Geiger and Nuttall.</strong><span style=\"font-weight: 400;\"> It states that short-lived isotopes emit more energetic alpha particles than long-lived ones. </span><strong>Discoveries</strong><span style=\"font-weight: 400;\"> : </span><strong>Chadwick</strong><span style=\"font-weight: 400;\"> - neutron. </span><strong>Lawrence</strong><span style=\"font-weight: 400;\"> - Cyclotron (A device for accelerating nuclear particles to very high velocities without the use of high voltages). </span><strong>Enrico Fermi</strong><span style=\"font-weight: 400;\"> - Demonstrated first self-sustaining nuclear chain reaction.</span><strong> Lise Meitner</strong><span style=\"font-weight: 400;\"> - First to describe and coin the term nuclear fission.</span><strong> Frederick Soddy</strong><span style=\"font-weight: 400;\"> - All radioactive preparations were not unique elements, but rather that some of them were variants of known elements. </span><strong>Francis Aston</strong><span style=\"font-weight: 400;\"> - Isotopes of the light elements.</span></p>\n",
                    solution_hi: "<p><span style=\"font-family: Roboto;\">10.(c)&nbsp;</span><strong>&#2327;&#2368;&#2327;&#2352; &#2324;&#2352; &#2344;&#2381;&#2351;&#2370;&#2335;&#2377;&#2354; </strong><strong>I</strong><span style=\"font-weight: 400;\"> &#2311;&#2360;&#2350;&#2375;&#2306; &#2325;&#2361;&#2366; &#2327;&#2351;&#2366; &#2361;&#2376; &#2325;&#2367; &#2309;&#2354;&#2381;&#2346;&#2325;&#2366;&#2354;&#2367;&#2325; &#2310;&#2311;&#2360;&#2379;&#2335;&#2379;&#2346; &#2342;&#2368;&#2352;&#2381;&#2328;&#2325;&#2366;&#2354;&#2367;&#2325; &#2325;&#2368; &#2340;&#2369;&#2354;&#2344;&#2366; &#2350;&#2375;&#2306; &#2309;&#2343;&#2367;&#2325; &#2314;&#2352;&#2381;&#2332;&#2366;&#2357;&#2366;&#2344; &#2309;&#2354;&#2381;&#2347;&#2366; &#2325;&#2339;&#2379;&#2306; &#2325;&#2366; &#2313;&#2340;&#2381;&#2360;&#2352;&#2381;&#2332;&#2344; &#2325;&#2352;&#2340;&#2375; &#2361;&#2376;&#2306;&#2404; </span><strong>&#2326;&#2379;&#2332; </strong><span style=\"font-weight: 400;\">: </span><strong>&#2330;&#2376;&#2337;&#2357;&#2367;&#2325; - </strong><span style=\"font-weight: 400;\">&#2344;&#2381;&#2351;&#2370;&#2335;&#2381;&#2352;&#2377;&#2344; I </span><strong>&#2354;&#2377;&#2352;&#2375;&#2306;&#2360; - </strong><span style=\"font-weight: 400;\">&#2360;&#2366;&#2311;&#2325;&#2381;&#2354;&#2379;&#2335;&#2381;&#2352;&#2377;&#2344; (&#2313;&#2330;&#2381;&#2330; &#2357;&#2379;&#2354;&#2381;&#2335;&#2375;&#2332; &#2325;&#2375; &#2313;&#2346;&#2351;&#2379;&#2327; &#2325;&#2375; &#2348;&#2367;&#2344;&#2366; &#2346;&#2352;&#2350;&#2366;&#2339;&#2369; &#2325;&#2339;&#2379;&#2306; &#2325;&#2379; &#2348;&#2361;&#2369;&#2340; &#2313;&#2330;&#2381;&#2330; &#2357;&#2375;&#2327; &#2340;&#2325; &#2340;&#2381;&#2357;&#2352;&#2367;&#2340; &#2325;&#2352;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2319;&#2325; &#2313;&#2346;&#2325;&#2352;&#2339;)&#2404; </span><strong>&#2319;&#2344;&#2352;&#2367;&#2325;&#2379; &#2347;&#2352;&#2381;&#2350;&#2368; </strong><span style=\"font-weight: 400;\">- &#2346;&#2361;&#2354;&#2368; &#2310;&#2340;&#2381;&#2350;&#2344;&#2367;&#2352;&#2381;&#2349;&#2352; &#2346;&#2352;&#2350;&#2366;&#2339;&#2369; &#2358;&#2381;&#2352;&#2371;&#2306;&#2326;&#2354;&#2366; &#2346;&#2381;&#2352;&#2340;&#2367;&#2325;&#2381;&#2352;&#2367;&#2351;&#2366; &#2325;&#2366; &#2346;&#2381;&#2352;&#2342;&#2352;&#2381;&#2358;&#2344; &#2325;&#2367;&#2351;&#2366;&#2404; </span><strong>&#2354;&#2367;&#2360;&#2375; &#2350;&#2368;&#2335;&#2344;&#2352; </strong><span style=\"font-weight: 400;\">- &#2346;&#2352;&#2350;&#2366;&#2339;&#2369; &#2357;&#2367;&#2326;&#2306;&#2337;&#2344; &#2358;&#2348;&#2381;&#2342; &#2325;&#2366; &#2357;&#2352;&#2381;&#2339;&#2344; &#2325;&#2352;&#2344;&#2375; &#2324;&#2352; &#2313;&#2360;&#2325;&#2366; &#2346;&#2381;&#2352;&#2351;&#2379;&#2327; &#2325;&#2352;&#2344;&#2375; &#2357;&#2366;&#2354;&#2375; &#2346;&#2361;&#2354;&#2375; &#2357;&#2381;&#2351;&#2325;&#2381;&#2340;&#2367;&#2404; </span><strong>&#2347;&#2381;&#2352;&#2375;&#2337;&#2352;&#2367;&#2325; &#2360;&#2379;&#2337;&#2381;&#2337;&#2368; </strong><span style=\"font-weight: 400;\">- </span><span style=\"font-weight: 400;\">&#2360;&#2349;&#2368; &#2352;&#2375;&#2337;&#2367;&#2351;&#2379;&#2343;&#2352;&#2381;&#2350;&#2368; &#2340;&#2376;&#2351;&#2366;&#2352;&#2368; &#2309;&#2342;&#2381;&#2357;&#2367;&#2340;&#2368;&#2351; &#2340;&#2340;&#2381;&#2357; &#2344;&#2361;&#2368;&#2306; &#2341;&#2375;, &#2348;&#2354;&#2381;&#2325;&#2367; &#2313;&#2344;&#2350;&#2375;&#2306; &#2360;&#2375; &#2325;&#2369;&#2331; &#2332;&#2381;&#2334;&#2366;&#2340; &#2340;&#2340;&#2381;&#2357;&#2379;&#2306; &#2325;&#2375; &#2352;&#2370;&#2346; &#2341;&#2375;&#2404; </span><strong>&#2347;&#2381;&#2352;&#2366;&#2306;&#2360;&#2367;&#2360; &#2319;&#2360;&#2381;&#2335;&#2344; - </strong><span style=\"font-weight: 400;\">&#2346;&#2381;&#2352;&#2325;&#2366;&#2358; &#2340;&#2340;&#2381;&#2357;&#2379;&#2306; &#2325;&#2375; &#2360;&#2350;&#2360;&#2381;&#2341;&#2366;&#2344;&#2367;&#2325;&#2404;</span></p>\n",
                    correct: "c",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "11",
                    section: "18",
                    question_en: "<p><span style=\"font-family: Roboto;\">11. </span><span style=\"font-family: Roboto;\">In the early 1800s, who discovered that each chemical element is made up of a unique type of atom and that atoms differ by their mass?</span></p>\n",
                    question_hi: "<p><span style=\"font-family: Roboto;\">11. </span><span style=\"font-family: Palanquin;\">19&#2357;&#2368;&#2306; &#2358;&#2340;&#2366;&#2348;&#2381;&#2342;&#2368; &#2325;&#2375; &#2346;&#2370;&#2352;&#2381;&#2357;&#2366;&#2352;&#2381;&#2343; &#2350;&#2375;&#2306; &#2325;&#2367;&#2360;&#2344;&#2375; &#2326;&#2379;&#2332; &#2325;&#2368; &#2325;&#2367; &#2346;&#2381;&#2352;&#2340;&#2381;&#2351;&#2375;&#2325; &#2352;&#2366;&#2360;&#2366;&#2351;&#2344;&#2367;&#2325; &#2340;&#2340;&#2381;&#2357; &#2319;&#2325; &#2309;&#2342;&#2381;&#2357;&#2367;&#2340;&#2368;&#2351; &#2346;&#2381;&#2352;&#2325;&#2366;&#2352; &#2325;&#2375; &#2346;&#2352;&#2350;&#2366;&#2339;&#2369; &#2360;&#2375; &#2348;&#2344;&#2366; &#2361;&#2379;&#2340;&#2366; &#2361;&#2376; &#2324;&#2352; &#2357;&#2375; &#2346;&#2352;&#2350;&#2366;&#2339;&#2369; &#2309;&#2346;&#2344;&#2375; &#2342;&#2381;&#2352;&#2357;&#2381;&#2351;&#2350;&#2366;&#2344; &#2325;&#2375; &#2309;&#2344;&#2369;&#2360;&#2366;&#2352; &#2349;&#2367;&#2344;&#2381;&#2344; &#2361;&#2379;&#2340;&#2375; &#2361;&#2376;&#2306;?</span></p>\n",
                    options_en: ["<p>Antoine Lavoisier</p>\n", "<p>John Dalton</p>\n", 
                                "<p>Amedeo Avogadro</p>\n", "<p>Robert Boyle</p>\n"],
                    options_hi: ["<p>&#2319;&#2306;&#2335;&#2379;&#2344;&#2368; &#2354;&#2375;&#2357;&#2379;&#2332;&#2364;&#2367;&#2351;&#2352;</p>\n", "<p>&#2332;&#2377;&#2344; &#2337;&#2366;&#2354;&#2381;&#2335;&#2344;</p>\n",
                                "<p>&#2319;&#2350;&#2375;&#2337;&#2367;&#2351;&#2379; &#2309;&#2357;&#2379;&#2327;&#2366;&#2342;&#2381;&#2352;&#2379;&#2306;</p>\n", "<p>&#2352;&#2377;&#2348;&#2352;&#2381;&#2335; &#2348;&#2377;&#2351;&#2354;</p>\n"],
                    solution_en: "<p>11.<span style=\"font-family: Roboto;\">(b)&nbsp; </span><strong>John Dalton. </strong><span style=\"font-weight: 400;\">Dalton&rsquo;s atomic theory : All matter is made of very tiny particles called atoms, atoms of a given element are identical in mass and chemical properties, Atoms combine in the ratio of small whole numbers to form compounds. An atom consists of a nucleus (positively charged and contains protons and neutrons) that is surrounded by one or more negatively charged electrons. In 1811 </span><strong>Avogadro</strong><span style=\"font-weight: 400;\"> hypothesized that equal volumes of gasses at the same temperature and pressure contain equal numbers of molecules. </span><strong>Robert Boyle</strong><span style=\"font-weight: 400;\"> discovered that the volume of a gas decreases with increasing pressure and vice versa , the famous Boyle\'s law.</span></p>\n",
                    solution_hi: "<p><span style=\"font-family: Roboto;\">11.</span><span style=\"font-family: Palanquin;\">(b)&nbsp; </span><strong>&#2332;&#2377;&#2344; &#2337;&#2366;&#2354;&#2381;&#2335;&#2344;</strong><span style=\"font-weight: 400;\">&#2404;</span><strong> </strong><span style=\"font-weight: 400;\">&#2337;&#2366;&#2354;&#2381;&#2335;&#2344; &#2325;&#2366; &#2346;&#2352;&#2350;&#2366;&#2339;&#2369; &#2360;&#2367;&#2342;&#2381;&#2343;&#2366;&#2306;&#2340;: &#2360;&#2349;&#2368; &#2346;&#2342;&#2366;&#2352;&#2381;&#2341; &#2348;&#2361;&#2369;&#2340; &#2331;&#2379;&#2335;&#2375; &#2325;&#2339;&#2379;&#2306; &#2360;&#2375; &#2348;&#2344;&#2375; &#2361;&#2379;&#2340;&#2375; &#2361;&#2376;&#2306; &#2332;&#2367;&#2344;&#2381;&#2361;&#2375;&#2306; &#2346;&#2352;&#2350;&#2366;&#2339;&#2369; &#2325;&#2361;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;, &#2325;&#2367;&#2360;&#2368; &#2342;&#2367;&#2319; &#2327;&#2319; &#2340;&#2340;&#2381;&#2357; &#2325;&#2375; &#2346;&#2352;&#2350;&#2366;&#2339;&#2369; &#2342;&#2381;&#2352;&#2357;&#2381;&#2351;&#2350;&#2366;&#2344; &#2324;&#2352; &#2352;&#2366;&#2360;&#2366;&#2351;&#2344;&#2367;&#2325; &#2327;&#2369;&#2339; &#2360;&#2350;&#2366;&#2344; &#2361;&#2379;&#2340;&#2375; &#2361;&#2376;&#2306;, &#2346;&#2352;&#2350;&#2366;&#2339;&#2369; &#2331;&#2379;&#2335;&#2368; &#2346;&#2370;&#2352;&#2381;&#2339; &#2360;&#2306;&#2326;&#2381;&#2351;&#2366;&#2323;&#2306; &#2325;&#2375; &#2309;&#2344;&#2369;&#2346;&#2366;&#2340; &#2350;&#2375;&#2306; &#2332;&#2369;&#2337;&#2364;&#2325;&#2352; &#2351;&#2380;&#2327;&#2367;&#2325; &#2348;&#2344;&#2366;&#2340;&#2375; &#2361;&#2376;&#2306;&#2404; &#2346;&#2352;&#2350;&#2366;&#2339;&#2369; &#2350;&#2375;&#2306; &#2344;&#2366;&#2349;&#2367;&#2325; &#2361;&#2379;&#2340;&#2366; &#2361;&#2376; (&#2343;&#2344;&#2366;&#2340;&#2381;&#2350;&#2325; &#2352;&#2370;&#2346; &#2360;&#2375; &#2310;&#2357;&#2375;&#2358;&#2367;&#2340; &#2324;&#2352; &#2311;&#2360;&#2350;&#2375;&#2306; &#2346;&#2381;&#2352;&#2379;&#2335;&#2377;&#2344; &#2324;&#2352; &#2344;&#2381;&#2351;&#2370;&#2335;&#2381;&#2352;&#2377;&#2344; &#2361;&#2379;&#2340;&#2375; &#2361;&#2376;&#2306;) &#2332;&#2379; &#2319;&#2325; &#2351;&#2366; &#2309;&#2343;&#2367;&#2325; &#2315;&#2339;&#2366;&#2340;&#2381;&#2350;&#2325; &#2352;&#2370;&#2346; &#2360;&#2375; &#2310;&#2357;&#2375;&#2358;&#2367;&#2340; &#2311;&#2354;&#2375;&#2325;&#2381;&#2335;&#2381;&#2352;&#2377;&#2344;&#2379;&#2306; &#2360;&#2375; &#2328;&#2367;&#2352;&#2366; &#2361;&#2379;&#2340;&#2366; &#2361;&#2376;&#2404; 1811 &#2350;&#2375;&#2306; </span><strong>&#2309;&#2357;&#2379;&#2327;&#2366;&#2342;&#2381;&#2352;&#2379;</strong><span style=\"font-weight: 400;\"> &#2344;&#2375; &#2346;&#2352;&#2367;&#2325;&#2354;&#2381;&#2346;&#2344;&#2366; &#2325;&#2368; &#2325;&#2367; &#2360;&#2350;&#2366;&#2344; &#2340;&#2366;&#2346;&#2350;&#2366;&#2344; &#2324;&#2352; &#2342;&#2348;&#2366;&#2357; &#2346;&#2352; &#2360;&#2350;&#2366;&#2344; &#2350;&#2366;&#2340;&#2381;&#2352;&#2366; &#2350;&#2375;&#2306; &#2327;&#2376;&#2360;&#2379;&#2306; &#2350;&#2375;&#2306; &#2360;&#2350;&#2366;&#2344; &#2360;&#2306;&#2326;&#2381;&#2351;&#2366; &#2350;&#2375;&#2306; &#2309;&#2339;&#2369; &#2361;&#2379;&#2340;&#2375; &#2361;&#2376;&#2306;&#2404; </span><strong>&#2352;&#2377;&#2348;&#2352;&#2381;&#2335; &#2348;&#2377;&#2351;&#2354;</strong><span style=\"font-weight: 400;\"> &#2344;&#2375; &#2346;&#2366;&#2351;&#2366; &#2325;&#2367; &#2348;&#2338;&#2364;&#2340;&#2375; &#2342;&#2348;&#2366;&#2357; &#2325;&#2375; &#2360;&#2366;&#2341; &#2327;&#2376;&#2360; &#2325;&#2366; &#2310;&#2351;&#2340;&#2344; &#2328;&#2335;&#2340;&#2366; &#2361;&#2376; &#2324;&#2352; &#2311;&#2360;&#2325;&#2375; &#2357;&#2367;&#2346;&#2352;&#2368;&#2340;, &#2346;&#2381;&#2352;&#2360;&#2367;&#2342;&#2381;&#2343; &#2348;&#2377;&#2351;&#2354; &#2325;&#2366; &#2344;&#2367;&#2351;&#2350; &#2361;&#2376;&#2404;</span></p>\n",
                    correct: "b",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "12",
                    section: "18",
                    question_en: "<p><span style=\"font-family: Roboto;\">12.</span><span style=\"font-family: Roboto;\"> Which of the following sedimentary minerals, known to everyone as \'salt\', usually forms in arid climates where sea water evaporates?</span></p>\n",
                    question_hi: "<p><span style=\"font-family: Roboto;\">12.</span><span style=\"font-family: Palanquin;\"> &#2344;&#2367;&#2350;&#2381;&#2344;&#2354;&#2367;&#2326;&#2367;&#2340; &#2350;&#2375;&#2306; &#2360;&#2375; &#2325;&#2380;&#2344;-&#2360;&#2366; &#2309;&#2357;&#2360;&#2366;&#2342;&#2368; &#2326;&#2344;&#2367;&#2332;, &#2332;&#2367;&#2360;&#2375; &#2360;&#2349;&#2368; &#2354;&#2379;&#2327; \'&#2344;&#2350;&#2325;\' &#2325;&#2375; &#2352;&#2370;&#2346; &#2350;&#2375;&#2306; &#2332;&#2366;&#2344;&#2340;&#2375; &#2361;&#2376;&#2306;, &#2310;&#2350;&#2340;&#2380;&#2352; &#2346;&#2352; &#2320;&#2360;&#2368; &#2358;&#2369;&#2359;&#2381;&#2325; &#2332;&#2354;&#2357;&#2366;&#2351;&#2369; &#2350;&#2375;&#2306; &#2348;&#2344;&#2340;&#2366; &#2361;&#2376;, &#2332;&#2361;&#2366;&#2306; &#2360;&#2350;&#2369;&#2342;&#2381;&#2352; &#2325;&#2366; &#2346;&#2366;&#2344;&#2368; &#2357;&#2366;&#2359;&#2381;&#2346;&#2367;&#2340; &#2361;&#2379; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;?</span></p>\n",
                    options_en: ["<p>Zeolite</p>\n", "<p>Halite</p>\n", 
                                "<p>Calcite</p>\n", "<p>Pyrite</p>\n"],
                    options_hi: ["<p>&#2332;&#2367;&#2351;&#2379;&#2354;&#2366;&#2311;&#2335;</p>\n", "<p>&#2361;&#2376;&#2354;&#2366;&#2311;&#2335;</p>\n",
                                "<p>&#2325;&#2376;&#2354;&#2381;&#2360;&#2366;&#2311;&#2335;</p>\n", "<p>&#2346;&#2366;&#2311;&#2352;&#2366;&#2311;&#2335;</p>\n"],
                    solution_en: "<p>12.<span style=\"font-family: Roboto;\">(b) </span><strong>Halite. </strong><span style=\"font-weight: 400;\">It is commonly known as rock salt, a type of salt, the mineral form of sodium chloride. Halite forms isometric crystals. </span><strong>Zeolites</strong><span style=\"font-weight: 400;\"> - hydrated aluminosilicates of the alkaline and alkaline-earth metals.</span><strong> calcite</strong><span style=\"font-weight: 400;\">&nbsp; - A colorless or white mineral (occasionally tinged with impurities), found in sedimentary and metamorphic rocks, in veins, in limestone, and in stalagmites and stalactites.</span><strong> Pyrite</strong><span style=\"font-weight: 400;\"> - A yellow mineral, found in igneous and metamorphic rocks and in veins. It is a source of sulfur and is used in the manufacture of sulphuric acid.</span></p>\n",
                    solution_hi: "<p><span style=\"font-family: Roboto;\">12.</span><span style=\"font-family: Palanquin;\">(b)&nbsp;</span><strong>&#2361;&#2376;&#2354;&#2366;&#2311;&#2335; &#2404;&nbsp; </strong><span style=\"font-weight: 400;\">&#2311;&#2360;&#2375; &#2310;&#2350;&#2340;&#2380;&#2352; &#2346;&#2352; &#2360;&#2375;&#2306;&#2343;&#2366; &#2344;&#2350;&#2325; &#2325;&#2375; &#2352;&#2370;&#2346; &#2350;&#2375;&#2306; &#2332;&#2366;&#2344;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;, &#2351;&#2361; &#2319;&#2325; &#2346;&#2381;&#2352;&#2325;&#2366;&#2352; &#2325;&#2366; &#2344;&#2350;&#2325; &#2361;&#2376;, &#2332;&#2379; &#2360;&#2379;&#2337;&#2367;&#2351;&#2350; &#2325;&#2381;&#2354;&#2379;&#2352;&#2366;&#2311;&#2337; &#2325;&#2366; &#2326;&#2344;&#2367;&#2332; &#2352;&#2370;&#2346; &#2361;&#2376;&#2404; &#2361;&#2375;&#2354;&#2366;&#2311;&#2335; &#2310;&#2311;&#2360;&#2379;&#2350;&#2375;&#2335;&#2381;&#2352;&#2367;&#2325; &#2325;&#2381;&#2352;&#2367;&#2360;&#2381;&#2335;&#2354; (isometric crystals) &#2348;&#2344;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404; </span><strong>&#2332;&#2367;&#2351;&#2379;&#2354;&#2366;&#2311;&#2335;</strong><span style=\"font-weight: 400;\"> - &#2325;&#2381;&#2359;&#2366;&#2352;&#2368;&#2351; &#2324;&#2352; &#2325;&#2381;&#2359;&#2366;&#2352;&#2368;&#2351;- &#2350;&#2371;&#2342;&#2366; &#2343;&#2366;&#2340;&#2369;&#2323;&#2306; &#2325;&#2375; &#2361;&#2366;&#2311;&#2337;&#2381;&#2352;&#2375;&#2335;&#2375;&#2337; &#2319;&#2354;&#2381;&#2351;&#2369;&#2350;&#2367;&#2344;&#2379;&#2360;&#2367;&#2354;&#2367;&#2325;&#2375;&#2335;&#2381;&#2360; (aluminosilicates) &#2361;&#2376;&#2404; </span><strong>&#2325;&#2376;&#2354;&#2381;&#2360;&#2366;&#2311;&#2335;</strong><span style=\"font-weight: 400;\"> - &#2319;&#2325; &#2352;&#2306;&#2327;&#2361;&#2368;&#2344; &#2351;&#2366; &#2360;&#2347;&#2375;&#2342; &#2326;&#2344;&#2367;&#2332; (&#2325;&#2349;&#2368;-&#2325;&#2349;&#2368; &#2309;&#2358;&#2369;&#2342;&#2381;&#2343;&#2367;&#2351;&#2379;&#2306; &#2360;&#2375; &#2351;&#2369;&#2325;&#2381;&#2340;), &#2340;&#2354;&#2331;&#2335;&#2368; &#2324;&#2352; &#2352;&#2370;&#2346;&#2366;&#2306;&#2340;&#2352;&#2367;&#2340; &#2330;&#2335;&#2381;&#2335;&#2366;&#2344;&#2379;&#2306; &#2350;&#2375;&#2306;, &#2358;&#2367;&#2352;&#2366;&#2323;&#2306; &#2350;&#2375;&#2306;, &#2330;&#2370;&#2344;&#2366; &#2346;&#2340;&#2381;&#2341;&#2352; &#2350;&#2375;&#2306; &#2324;&#2352; &#2360;&#2381;&#2335;&#2376;&#2354;&#2375;&#2327;&#2381;&#2350;&#2366;&#2311;&#2335;&#2381;&#2360; &#2324;&#2352; &#2360;&#2381;&#2335;&#2376;&#2354;&#2375;&#2325;&#2381;&#2335;&#2366;&#2311;&#2335;&#2381;&#2360; (stalagmites &amp; stalactites) &#2350;&#2375;&#2306; &#2346;&#2366;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404; </span><strong>&#2346;&#2366;&#2311;&#2352;&#2366;&#2311;&#2335;</strong><span style=\"font-weight: 400;\"> - &#2319;&#2325; &#2346;&#2368;&#2354;&#2366; &#2326;&#2344;&#2367;&#2332;, &#2332;&#2379; &#2310;&#2327;&#2381;&#2344;&#2375;&#2351; &#2324;&#2352; &#2352;&#2370;&#2346;&#2366;&#2306;&#2340;&#2352;&#2367;&#2340; &#2330;&#2335;&#2381;&#2335;&#2366;&#2344;&#2379;&#2306; &#2324;&#2352; &#2358;&#2367;&#2352;&#2366;&#2323;&#2306; &#2350;&#2375;&#2306; &#2346;&#2366;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404; &#2351;&#2361; &#2360;&#2354;&#2381;&#2347;&#2352; &#2325;&#2366; &#2360;&#2381;&#2352;&#2379;&#2340; &#2361;&#2376; &#2324;&#2352; &#2311;&#2360;&#2325;&#2366; &#2313;&#2346;&#2351;&#2379;&#2327; &#2327;&#2344;&#2381;&#2343;&#2325; &#2325;&#2375; &#2309;&#2350;&#2381;&#2354; (&#2360;&#2354;&#2381;&#2347;&#2381;&#2351;&#2370;&#2352;&#2367;&#2325; &#2319;&#2360;&#2367;&#2337;) &#2325;&#2375; &#2344;&#2367;&#2352;&#2381;&#2350;&#2366;&#2339; &#2350;&#2375;&#2306; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\n",

                questions.push({
                    id: "13",
                    section: "18",
                    question_en: "<p><span style=\"font-family: Roboto;\">13. </span><span style=\"font-family: Roboto;\">Who received the Nobel Prize \'for his research in the stereochemistry of organic molecules and reactions\' in 1975?</span></p>\n",

                    options_en: ["<p>Vladimir Prelog</p>\n", "<p>William N Lipscomb</p>\n", 
                                "<p>Geoffrey Wilkinson</p>\n", "<p>Paul J Flory</p>\n"],
                    options_hi: ["<p>&#2357;&#2381;&#2354;&#2366;&#2342;&#2367;&#2350;&#2368;&#2352; &#2346;&#2381;&#2352;&#2368;&#2354;&#2379;&#2327; (Vladimir Prelog)</p>\n", "<p>&#2357;&#2367;&#2354;&#2367;&#2351;&#2350; &#2319;&#2344;. &#2354;&#2367;&#2346;&#2381;&#2360;&#2325;&#2377;&#2350;&#2381;&#2348; (William N Lipscomb)</p>\n",
                                "<p>&#2332;&#2375;&#2347;&#2381;&#2352;&#2368; &#2357;&#2367;&#2354;&#2381;&#2325;&#2367;&#2306;&#2360;&#2344; (Geoffrey Wilkinson)</p>\n", "<p><span style=\"font-weight: 400;\">&nbsp;&#2346;&#2377;&#2354; &#2332;&#2375;. &#2347;&#2381;&#2354;&#2379;&#2352;&#2368; (Paul J Flory)</span></p>\n"],
                    solution_en: "<p>13.(a)&nbsp;<strong>Vladimir Prelog. Stereochemistry:</strong><span style=\"font-weight: 400;\"> The study of the three-dimensional arrangement of atoms in molecules and the effects of this arrangement on chemical properties and reactions. Other Nobel prize winners: 1973 - </span><strong>Geoffrey Wilkinson</strong><span style=\"font-weight: 400;\"> (organometallic chemistry), 1976 - </span><strong>William N. Lipscomb</strong><span style=\"font-weight: 400;\"> (studies of the structure of boranes, illuminating problems of chemical bonding), 1974 - </span><strong>Professor Flory</strong><span style=\"font-weight: 400;\"> (physical chemistry of the macromolecules).&nbsp;</span></p>\n",
                    solution_hi: "<p><span style=\"font-family: Roboto;\">13.(a)&nbsp; </span><strong>&#2357;&#2381;&#2354;&#2366;&#2342;&#2367;&#2350;&#2368;&#2352; &#2346;&#2381;&#2352;&#2368;&#2354;&#2379;&#2327; </strong><strong>I </strong><span style=\"font-weight: 400;\">&#2340;&#2381;&#2352;&#2367;&#2357;&#2367;&#2350; &#2352;&#2360;&#2366;&#2351;&#2344; </span><strong>:</strong><span style=\"font-weight: 400;\"> &#2309;&#2339;&#2369;&#2323;&#2306; &#2350;&#2375;&#2306; &#2346;&#2352;&#2350;&#2366;&#2339;&#2369;&#2323;&#2306; &#2325;&#2368; &#2340;&#2381;&#2352;&#2367;-&#2310;&#2351;&#2366;&#2350;&#2368; &#2357;&#2381;&#2351;&#2357;&#2360;&#2381;&#2341;&#2366; &#2324;&#2352; &#2352;&#2366;&#2360;&#2366;&#2351;&#2344;&#2367;&#2325; &#2327;&#2369;&#2339;&#2379;&#2306; &#2324;&#2352; &#2346;&#2381;&#2352;&#2340;&#2367;&#2325;&#2381;&#2352;&#2367;&#2351;&#2366;&#2323;&#2306; &#2346;&#2352; &#2311;&#2360; &#2357;&#2381;&#2351;&#2357;&#2360;&#2381;&#2341;&#2366; &#2325;&#2375; &#2346;&#2381;&#2352;&#2349;&#2366;&#2357;&#2379;&#2306; &#2325;&#2366; &#2309;&#2343;&#2381;&#2351;&#2351;&#2344; &#2325;&#2352;&#2340;&#2366; &#2361;&#2376;&#2404; &#2309;&#2344;&#2381;&#2351; &#2344;&#2379;&#2348;&#2375;&#2354; &#2346;&#2369;&#2352;&#2360;&#2381;&#2325;&#2366;&#2352; &#2357;&#2367;&#2332;&#2375;&#2340;&#2366;: 1973 - </span><strong>&#2332;&#2375;&#2347;&#2381;&#2352;&#2368; &#2357;&#2367;&#2354;&#2381;&#2325;&#2367;&#2306;&#2360;&#2344; </strong><span style=\"font-weight: 400;\">(&#2321;&#2352;&#2381;&#2327;&#2375;&#2344;&#2379;&#2350;&#2375;&#2335;&#2375;&#2354;&#2367;&#2325; &#2352;&#2360;&#2366;&#2351;&#2344; &#2357;&#2367;&#2332;&#2381;&#2334;&#2366;&#2344;), 1976 - </span><strong>&#2357;&#2367;&#2354;&#2367;&#2351;&#2350; &#2319;&#2344;. &#2354;&#2367;&#2346;&#2381;&#2360;&#2325;&#2377;&#2350;&#2381;&#2348; </strong><span style=\"font-weight: 400;\">(&#2348;&#2379;&#2352;&#2377;&#2344;&nbsp; &#2325;&#2368; &#2360;&#2306;&#2352;&#2330;&#2344;&#2366; &#2325;&#2366; &#2309;&#2343;&#2381;&#2351;&#2351;&#2344;, &#2352;&#2366;&#2360;&#2366;&#2351;&#2344;&#2367;&#2325; &#2348;&#2306;&#2343;&#2344; &#2325;&#2368; &#2360;&#2350;&#2360;&#2381;&#2351;&#2366;&#2323;&#2306; &#2346;&#2352; &#2346;&#2381;&#2352;&#2325;&#2366;&#2358; &#2337;&#2366;&#2354;&#2344;&#2366;), 1974 - </span><strong>&#2346;&#2381;&#2352;&#2379;&#2347;&#2375;&#2360;&#2352; &#2347;&#2381;&#2354;&#2379;&#2352;&#2368; </strong><span style=\"font-weight: 400;\">(&#2350;&#2376;&#2325;&#2381;&#2352;&#2379;&#2350;&#2379;&#2354;&#2375;&#2325;&#2381;&#2351;&#2370;&#2354;&#2381;&#2360; &#2325;&#2366; &#2349;&#2380;&#2340;&#2367;&#2325; &#2352;&#2360;&#2366;&#2351;&#2344;)&#2404;&nbsp;</span></p>\n",
                    correct: "a",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "14",
                    section: "18",
                    question_en: "<p><span style=\"font-family: Roboto;\">14. </span><span style=\"font-family: Roboto;\">Dry ice, ammonium chloride, naphthalene balls and camphor, all these compounds are an example of:</span></p>\n",
                    question_hi: "<p><span style=\"font-family: Roboto;\">14. </span><span style=\"font-family: Palanquin;\">&#2358;&#2369;&#2359;&#2381;&#2325; &#2348;&#2352;&#2381;&#2347;, &#2309;&#2350;&#2379;&#2344;&#2367;&#2351;&#2350; &#2325;&#2381;&#2354;&#2379;&#2352;&#2366;&#2311;&#2337;, &#2344;&#2376;&#2346;&#2381;&#2341;&#2354;&#2368;&#2344; &#2325;&#2368; &#2327;&#2379;&#2354;&#2367;&#2351;&#2366;&#2306; &#2324;&#2352; &#2325;&#2346;&#2370;&#2352;, &#2351;&#2375; &#2360;&#2349;&#2368; &#2351;&#2380;&#2327;&#2367;&#2325; &#2344;&#2367;&#2350;&#2381;&#2344;&#2354;&#2367;&#2326;&#2367;&#2340; &#2350;&#2375;&#2306; &#2360;&#2375; &#2325;&#2367;&#2360;&#2325;&#2375; &#2313;&#2342;&#2366;&#2361;&#2352;&#2339; &#2361;&#2376;&#2306;?</span></p>\n",
                    options_en: ["<p>Sublimable substances</p>\n", "<p>Cooling agents</p>\n", 
                                "<p>Inflammable substances</p>\n", "<p>Solidifying agents</p>\n"],
                    options_hi: ["<p>&#2314;&#2352;&#2381;&#2343;&#2381;&#2357;&#2346;&#2366;&#2340;&#2325; &#2346;&#2342;&#2366;&#2352;&#2381;&#2341;</p>\n", "<p>&#2358;&#2368;&#2340;&#2354;&#2325;</p>\n",
                                "<p>&#2332;&#2381;&#2357;&#2354;&#2344;&#2358;&#2368;&#2354; &#2346;&#2342;&#2366;&#2352;&#2381;&#2341;</p>\n", "<p>&#2328;&#2344;&#2368;&#2349;&#2357;&#2344; &#2325;&#2366;&#2352;&#2325;</p>\n"],
                    solution_en: "<p>14.(a)&nbsp;<strong>Sublimable substances: </strong><span style=\"font-weight: 400;\">Sublimation is the process by which a solid directly transforms into a gas without passing through the liquid state. </span><strong>Cooling agents</strong><span style=\"font-weight: 400;\"> - used to absorb heat and lower temperatures. Examples - Freon. </span><strong>Inflammable substances</strong><span style=\"font-weight: 400;\"> - substances that can easily catch fire and burn. Example - Petroleum. </span><strong>Solidifying agents</strong><span style=\"font-weight: 400;\"> are substances or materials that induce the solidification of a liquid or gas. Example - Gelatin.&nbsp;</span></p>\n",
                    solution_hi: "<p><span style=\"font-family: Roboto;\">14.(a) </span><strong>&#2314;&#2352;&#2381;&#2343;&#2381;&#2357;&#2346;&#2366;&#2340;&#2325; &#2346;&#2342;&#2366;&#2352;&#2381;&#2341;&nbsp; </strong><strong>: </strong><span style=\"font-weight: 400;\">&#2314;&#2352;&#2381;&#2343;&#2381;&#2357;&#2346;&#2366;&#2340;&#2344; &#2357;&#2361; &#2346;&#2381;&#2352;&#2325;&#2381;&#2352;&#2367;&#2351;&#2366; &#2361;&#2376; &#2332;&#2367;&#2360;&#2325;&#2375; &#2342;&#2381;&#2357;&#2366;&#2352;&#2366; &#2325;&#2379;&#2312; &#2336;&#2379;&#2360; &#2348;&#2367;&#2344;&#2366; &#2342;&#2381;&#2352;&#2357; &#2309;&#2357;&#2360;&#2381;&#2341;&#2366; &#2360;&#2375; &#2327;&#2369;&#2332;&#2352;&#2375; &#2360;&#2368;&#2343;&#2375; &#2327;&#2376;&#2360; &#2350;&#2375;&#2306; &#2346;&#2352;&#2367;&#2357;&#2352;&#2381;&#2340;&#2367;&#2340; &#2361;&#2379; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404; </span><strong>&#2358;&#2368;&#2340;&#2354;&#2325; </strong><span style=\"font-weight: 400;\">- &#2327;&#2352;&#2381;&#2350;&#2368; &#2325;&#2379; &#2309;&#2357;&#2358;&#2379;&#2359;&#2367;&#2340; &#2325;&#2352;&#2344;&#2375; &#2324;&#2352; &#2340;&#2366;&#2346;&#2350;&#2366;&#2344; &#2325;&#2379; &#2325;&#2350; &#2325;&#2352;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2313;&#2346;&#2351;&#2379;&#2327; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404; &#2313;&#2342;&#2366;&#2361;&#2352;&#2339; - &#2347;&#2381;&#2352;&#2368;&#2321;&#2344;&#2404; </span><strong>&#2332;&#2381;&#2357;&#2354;&#2344;&#2358;&#2368;&#2354; &#2346;&#2342;&#2366;&#2352;&#2381;&#2341;&nbsp; </strong><span style=\"font-weight: 400;\">- &#2320;&#2360;&#2375; &#2346;&#2342;&#2366;&#2352;&#2381;&#2341; &#2332;&#2379; &#2310;&#2360;&#2366;&#2344;&#2368; &#2360;&#2375; &#2310;&#2327; &#2346;&#2325;&#2337;&#2364; &#2360;&#2325;&#2340;&#2375; &#2361;&#2376;&#2306; &#2324;&#2352; &#2332;&#2354; &#2360;&#2325;&#2340;&#2375; &#2361;&#2376;&#2306;&#2404; &#2313;&#2342;&#2366;&#2361;&#2352;&#2339; - &#2346;&#2375;&#2335;&#2381;&#2352;&#2379;&#2354;&#2367;&#2351;&#2350;&#2404; </span><strong>&#2328;&#2344;&#2368;&#2349;&#2357;&#2344; &#2325;&#2366;&#2352;&#2325; </strong><span style=\"font-weight: 400;\">&#2320;&#2360;&#2375; &#2346;&#2342;&#2366;&#2352;&#2381;&#2341; &#2351;&#2366; &#2346;&#2342;&#2366;&#2352;&#2381;&#2341; &#2361;&#2379;&#2340;&#2375; &#2361;&#2376;&#2306; &#2332;&#2379; &#2325;&#2367;&#2360;&#2368; &#2340;&#2352;&#2354; &#2351;&#2366; &#2327;&#2376;&#2360; &#2325;&#2375; &#2336;&#2379;&#2360; &#2361;&#2379;&#2344;&#2375; &#2325;&#2366; &#2325;&#2366;&#2352;&#2339; &#2348;&#2344;&#2340;&#2375; &#2361;&#2376;&#2306;&#2404; &#2313;&#2342;&#2366;&#2361;&#2352;&#2339; - &#2332;&#2367;&#2354;&#2375;&#2335;&#2367;&#2344;&#2404;</span></p>\n",
                    correct: "a",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "15",
                    section: "misc",
                    question_en: "<p><span style=\"font-family: Roboto;\">15.</span><span style=\"font-family: Roboto;\"> Identify the element that does NOT belong to Period 6 of Modern Periodic Table.</span></p>\n",
                    question_hi: "<p><span style=\"font-family: Roboto;\">15. </span><span style=\"font-family: Palanquin;\">&#2313;&#2360; &#2340;&#2340;&#2381;&#2357; &#2325;&#2368; &#2346;&#2361;&#2330;&#2366;&#2344; &#2325;&#2352;&#2375;&#2306; &#2332;&#2379; &#2310;&#2343;&#2369;&#2344;&#2367;&#2325; &#2310;&#2357;&#2352;&#2381;&#2340; &#2360;&#2366;&#2352;&#2339;&#2368; &#2325;&#2375; &#2310;&#2357;&#2352;&#2381;&#2340; 6 &#2360;&#2375; &#2360;&#2306;&#2348;&#2306;&#2343;&#2367;&#2340; &#2344;&#2361;&#2368;&#2306; &#2361;&#2376;&#2404;</span></p>\n",
                    options_en: ["<p><span style=\"font-family: Roboto;\">Silicon</span><span style=\"font-family: Roboto;\"> </span></p>\n", "<p><span style=\"font-family: Roboto;\">Tungsten</span><span style=\"font-family: Roboto;\"> </span></p>\n", 
                                "<p><span style=\"font-family: Roboto;\">Rhenium</span><span style=\"font-family: Roboto;\"> </span></p>\n", "<p><span style=\"font-family: Roboto;\">Platinum</span></p>\n"],
                    options_hi: ["<p>&#2360;&#2367;&#2354;&#2367;&#2325;&#2377;&#2344;</p>\n", "<p>&#2335;&#2306;&#2327;&#2360;&#2381;&#2335;&#2344;</p>\n",
                                "<p>&#2352;&#2368;&#2344;&#2367;&#2351;&#2350;</p>\n", "<p>&#2346;&#2381;&#2354;&#2376;&#2335;&#2367;&#2344;&#2350;</p>\n"],
                    solution_en: "<p><span style=\"font-family: Roboto;\">15.</span><span style=\"font-family: Roboto;\">(a)&nbsp;</span><strong>&nbsp;</strong><strong>Silicon </strong><strong>(Si):- </strong><span style=\"font-weight: 400;\">Atomic number - 14 , Group - 14, Period - 3. </span><strong>Uses: </strong><span style=\"font-weight: 400;\">To make alloys including aluminium - silicon and ferro - silicon (iron - silicon). </span><strong>Tungsten </strong><strong>(</strong><span style=\"font-weight: 400;\">W) (wolfram):&nbsp; Atomic number - 74,&nbsp; Group - 6. </span><strong>Uses:- </strong><span style=\"font-weight: 400;\">&nbsp;Light bulb, X - ray tubes, arc welding, radiation shielding.</span><strong> Rhenium </strong><span style=\"font-weight: 400;\">(Re): Atomic number - 75, Group - 7. Uses: Electrical contact alloys and filaments, pen nibs. </span><strong>&nbsp;Platinum</strong><span style=\"font-weight: 400;\"> (Pt): Atomic number - 78, Group - 10. Uses: To make optical fibres and LCDs, turbine blades, spark plugs, pacemakers and dental fillings, used to treat cancers.</span></p>\n",
                    solution_hi: "<p>15.<span style=\"font-family: Palanquin;\">(a)&nbsp;</span><strong>&#2360;&#2367;&#2354;&#2367;&#2325;&#2377;&#2344; (Si):- </strong><span style=\"font-weight: 400;\">&#2346;&#2352;&#2350;&#2366;&#2339;&#2369; &#2360;&#2306;&#2326;&#2381;&#2351;&#2366; - 14 , &#2360;&#2350;&#2370;&#2361; - 14, &#2310;&#2357;&#2352;&#2381;&#2340; - 3 I </span><strong>&#2313;&#2346;&#2351;&#2379;&#2327; : </strong><span style=\"font-weight: 400;\">&#2319;&#2354;&#2381;&#2351;&#2370;&#2350;&#2368;&#2344;&#2367;&#2351;&#2350; - &#2360;&#2367;&#2354;&#2367;&#2325;&#2377;&#2344; &#2324;&#2352; &#2347;&#2375;&#2352;&#2379; - &#2360;&#2367;&#2354;&#2367;&#2325;&#2377;&#2344; (&#2354;&#2379;&#2361;&#2366; - &#2360;&#2367;&#2354;&#2367;&#2325;&#2377;&#2344;) &#2360;&#2361;&#2367;&#2340; &#2350;&#2367;&#2358;&#2381;&#2352; &#2343;&#2366;&#2340;&#2369; &#2348;&#2344;&#2366;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319;&#2404; </span><strong>&#2335;&#2306;&#2327;&#2360;&#2381;&#2335;&#2344; (</strong><span style=\"font-weight: 400;\">W) (</span><span style=\"font-weight: 400;\">&#2357;&#2369;&#2354;&#2347;&#2364;&#2381;&#2352;&#2376;&#2350;</span><span style=\"font-weight: 400;\">):&nbsp; &#2346;&#2352;&#2350;&#2366;&#2339;&#2369; &#2360;&#2306;&#2326;&#2381;&#2351;&#2366; - 74,&nbsp; &#2360;&#2350;&#2370;&#2361; - 6 I </span><strong>&#2313;&#2346;&#2351;&#2379;&#2327; :- </strong><span style=\"font-weight: 400;\">&nbsp;&#2346;&#2381;&#2352;&#2325;&#2366;&#2358; &#2348;&#2354;&#2381;&#2348;, &#2319;&#2325;&#2381;&#2360;-&#2352;&#2375; &#2335;&#2381;&#2351;&#2370;&#2348;, &#2310;&#2352;&#2381;&#2325; &#2357;&#2375;&#2354;&#2381;&#2337;&#2367;&#2306;&#2327;, &#2357;&#2367;&#2325;&#2367;&#2352;&#2339; &#2346;&#2352;&#2367;&#2352;&#2325;&#2381;&#2359;&#2339;&#2404; </span><strong>&#2352;&#2368;&#2344;&#2367;&#2351;&#2350; </strong><span style=\"font-weight: 400;\">(Re): &#2346;&#2352;&#2350;&#2366;&#2339;&#2369; &#2360;&#2306;&#2326;&#2381;&#2351;&#2366; - 75, &#2360;&#2350;&#2370;&#2361; - 7 I&nbsp; </span><strong>&#2313;&#2346;&#2351;&#2379;&#2327; </strong><span style=\"font-weight: 400;\">: &#2357;&#2367;&#2342;&#2381;&#2351;&#2369;&#2340; &#2360;&#2306;&#2346;&#2352;&#2381;&#2325; &#2350;&#2367;&#2358;&#2381;&#2352; &#2343;&#2366;&#2340;&#2369; &#2324;&#2352; &#2347;&#2367;&#2354;&#2366;&#2350;&#2375;&#2306;&#2335;&#2381;&#2360;, &#2346;&#2375;&#2344; &#2344;&#2367;&#2348;&#2404; </span><strong>&#2346;&#2381;&#2354;&#2376;&#2335;&#2367;&#2344;&#2350; </strong><span style=\"font-weight: 400;\">(Pt): &#2346;&#2352;&#2350;&#2366;&#2339;&#2369; &#2360;&#2306;&#2326;&#2381;&#2351;&#2366;&nbsp; - 78, &#2360;&#2350;&#2370;&#2361; - 10 I </span><strong>&#2313;&#2346;&#2351;&#2379;&#2327;</strong><span style=\"font-weight: 400;\">: &#2321;&#2346;&#2381;&#2335;&#2367;&#2325;&#2354; &#2347;&#2366;&#2311;&#2348;&#2352; &#2324;&#2352; &#2319;&#2354;&#2360;&#2368;&#2337;&#2368;, &#2335;&#2352;&#2348;&#2366;&#2311;&#2344; &#2348;&#2381;&#2354;&#2375;&#2337;, &#2360;&#2381;&#2346;&#2366;&#2352;&#2381;&#2325; &#2346;&#2381;&#2354;&#2327;, &#2346;&#2375;&#2360;&#2350;&#2375;&#2325;&#2352; &#2324;&#2352; &#2337;&#2375;&#2306;&#2335;&#2354; &#2347;&#2367;&#2354;&#2367;&#2306;&#2327; &#2348;&#2344;&#2366;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319;, &#2332;&#2367;&#2360;&#2325;&#2366; &#2313;&#2346;&#2351;&#2379;&#2327; &#2325;&#2376;&#2306;&#2360;&#2352; &#2325;&#2375; &#2311;&#2354;&#2366;&#2332; &#2325;&#2375; &#2354;&#2367;&#2319; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\n",
                    correct: "a",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
            
            // Generate question boxes
            const boxesContainer = document.getElementById('question-boxes');
            questions.forEach((q, index) => {
                const box = document.createElement('div');
                box.className = 'q-box';
                box.textContent = index + 1;
                box.onclick = () => showQuestion(index);
                box.id = `box-${index}`;
                boxesContainer.appendChild(box);
            });
            
            // Show first question
            showQuestion(0);
            updateProgress();
        }
        
        // Show a specific question
        
        function formatContent(text) {
            if (!text) return '';
            return text.replace(/<img/g, '<img style="max-width:100%;height:auto;"');
        }
        
        function showQuestion(index) {
            if (index < 0 || index >= questions.length) return;
            
            currentQuestion = index;
            const question = questions[index];
            
            // Update question counter
            document.getElementById('question-counter').textContent = `Question ${index + 1} of ${questions.length}`;
            
            // Update question boxes
            document.querySelectorAll('.q-box').forEach(box => box.classList.remove('current'));
            document.getElementById(`box-${index}`).classList.add('current');
            
            // Generate question HTML
            let html = `
                <div class="question-card">
                    <div class="question-text">
                        <div class="en">${formatContent(question.question_en)}</div>
                        <div class="hi" style="display:none">${formatContent(question.question_hi)} </div>
                    </div>
                    <div class="options" id="options-container">`;
            
            // Add options
            ['a', 'b', 'c', 'd'].forEach((opt, i) => {
                let optionClass = '';
                let isCorrectAnswer = opt === question.correct;
                let isUserAnswer = answers[question.id] === opt;
                
                // When reviewing, add appropriate classes
                if (submitted) {
                    if (isCorrectAnswer) {
                        optionClass += ' correct-answer';
                    } else if (isUserAnswer && !isCorrectAnswer) {
                        optionClass += ' incorrect';
                    }
                }
                
                html += `
                    <div class="option-item">
                        <input class="option-input" type="radio" name="q${index}" 
                            id="opt-${index}-${opt}" value="${opt}" 
                            ${isUserAnswer ? 'checked' : ''}
                            onclick="selectAnswer('${question.id}', '${opt}')">
                       <label class="option-label${optionClass}" for="opt-${index}-${opt}">
                            <div class="en">${question.options_en[i]}</div>
                            <div class="hi" style="display:none">${question.options_hi[i]}</div>
                        </label>
                    </div>`;
            });
            
            // Add solution if submitted
            if (submitted) {
                const isCorrect = answers[question.id] === question.correct;
                const resultText = answers[question.id] ? (isCorrect ? 'Correct!' : 'Incorrect!') : 'Not attempted';
                
                html += `
                    <div class="solution-container">
                        <div class="solution-title">${resultText}</div>
                        <div class="solution-text">
                            <div class="en">${question.solution_en}</div>
                            <div class="hi" style="display:none">${question.solution_hi}</div>
                        </div>
                    </div>`;
            }
            
            html += `</div></div>`;
            
            document.getElementById('questions-container').innerHTML = html;
            
            // Apply language settings
            applyLanguage();
            
            // If in mobile view, close the menu
            if (window.innerWidth < 992) {
                toggleNav(false);
            }
            
            // Add review mode class if submitted
            if (submitted) {
                document.getElementById('options-container').classList.add('review-mode');
            }
        }
        
        // Apply current language
        function applyLanguage() {
            document.querySelectorAll(`.${currentLang}`).forEach(el => el.style.display = 'block');
            document.querySelectorAll(`.${currentLang === 'en' ? 'hi' : 'en'}`).forEach(el => el.style.display = 'none');
            
            // Update language button text
            document.getElementById('lang-text').textContent = currentLang === 'en' ? 'Hi' : 'En';
        }
        
        // Select an answer
        function selectAnswer(qId, option) {
            if (submitted) return;
            
            answers[qId] = option;
            updateProgress();
            
            // Mark question as attempted in the navigation
            const index = questions.findIndex(q => q.id === qId);
            if (index >= 0) {
                const box = document.getElementById(`box-${index}`);
                box.classList.add('attempted');
                box.classList.remove('unattempted');
            }
        }
        
        // Navigate to previous/next question
        function prevQuestion() { 
            if (currentQuestion > 0) showQuestion(currentQuestion - 1); 
        }
        
        function nextQuestion() { 
            if (currentQuestion < questions.length - 1) showQuestion(currentQuestion + 1); 
        }
        
        // Switch section
        function switchSection(sectionId) {
            if (sectionId === 'all') {
                showQuestion(0);
                return;
            }
            
            const section = sections[sectionId];
            if (section) showQuestion(section.start);
        }
        
        // Toggle language
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            applyLanguage();
        }
        
        // Toggle navigation sidebar
        function toggleNav(show) {
            const nav = document.getElementById('question-nav');
            const overlay = document.getElementById('nav-overlay');
            
            if (show === undefined) {
                show = !nav.classList.contains('show');
            }
            
            if (show) {
                nav.classList.add('show');
                overlay.classList.add('show');
                document.body.style.overflow = 'hidden';
            } else {
                nav.classList.remove('show');
                overlay.classList.remove('show');
                document.body.style.overflow = '';
            }
        }
        
        // Update progress
        function updateProgress() {
            const attempted = Object.keys(answers).length;
            document.getElementById('attempted-count').textContent = attempted;
        }
        
        // Start timer
        function startTimer() {
            const timerDisplay = document.getElementById('timer-display');
            let timeLeft = totalTime;
            
            const timerInterval = setInterval(() => {
                if (timeLeft <= 0 || submitted) {
                    clearInterval(timerInterval);
                    if (!submitted) submitTest();
                    return;
                }
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                timeLeft--;
            }, 1000);
        }
        
        // Confirm before submitting
        function confirmSubmit() {
            if (submitted) return;
            
            const attempted = Object.keys(answers).length;
            const remaining = questions.length - attempted;
            
            // Create a more modern confirmation dialog
            const confirmHtml = `
                <div style="text-align: center; padding: 20px;">
                    <h4 style="margin-bottom: 16px; color: var(--dark);">Confirm Submission</h4>
                    <p style="margin-bottom: 24px; color: var(--gray);">
                        You have attempted ${attempted} of ${questions.length} questions.<br>
                        ${remaining} questions are unattempted.
                    </p>
                    <div style="display: flex; justify-content: center; gap: 12px;">
                        <button onclick="this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; border: 1px solid var(--light-gray); background: white; border-radius: 8px; cursor: pointer;">
                            Cancel
                        </button>
                        <button onclick="submitTest(); this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer;">
                            Submit Test
                        </button>
                    </div>
                </div>`;
            
            // Create modal element
            const modal = document.createElement('div');
            modal.className = 'results-modal show';
            modal.innerHTML = `
                <div class="results-card" style="max-width: 400px;">
                    <button class="cancel-btn" style="position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--gray);" onclick="this.closest('.results-modal').remove()">
                        ×
                    </button>
                    ${confirmHtml}
                </div>`;
            
            document.body.appendChild(modal);
        }
        
        // Submit test
        function submitTest() {
            if (submitted) return;
            
            submitted = true;
            
            let score = 0;
            let correctCount = 0;
            let incorrectCount = 0;
            let unattemptedCount = 0;
            
            questions.forEach((q, index) => {
                const userAns = answers[q.id];
                const box = document.getElementById(`box-${index}`);
                
                box.classList.remove('attempted');
                
                if (!userAns) {
                    unattemptedCount++;
                    box.classList.add('unattempted');
                } else if (userAns === q.correct) {
                    correctCount++;
                    score += q.pos_marks;
                    box.classList.add('correct');
                } else {
                    incorrectCount++;
                    score -= q.neg_marks;
                    box.classList.add('incorrect');
                }
            });
            
            // Update result values
            document.getElementById('score-value').textContent = score.toFixed(2);
            document.getElementById('correct-value').textContent = correctCount;
            document.getElementById('incorrect-value').textContent = incorrectCount;
            document.getElementById('unattempted-value').textContent = unattemptedCount;
            
            // Show the results modal
            document.getElementById('results-modal').classList.add('show');
            
            // Disable submit button
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-check"></i>';
            submitBtn.style.backgroundColor = 'var(--success)';
            
            // Refresh current question view to show solution
            showQuestion(currentQuestion);
        }
        
        // Review test
        function reviewTest() {
            document.getElementById('results-modal').classList.remove('show');
            showQuestion(0);
        }
        
        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('results-modal')) {
                document.getElementById('results-modal').classList.remove('show');
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === 'ArrowRight') nextQuestion();
        });
    </script>
</body>
</html>
