                questions.push({
                    id: "6",
                    section: "18",
                    question_en: "<p><span style=\"font-family: Roboto;\">6. </span><span style=\"font-family: Roboto;\">What is the atomicity of Chlorine? </span></p>\n",
                    question_hi: "<p><span style=\"font-family: Roboto;\">6. </span><span style=\"font-family: Palanquin;\">&#2325;&#2381;&#2354;&#2379;&#2352;&#2368;&#2344; &#2325;&#2368; &#2346;&#2352;&#2350;&#2366;&#2339;&#2369;&#2325;&#2340;&#2366; &#2325;&#2381;&#2351;&#2366; &#2361;&#2376;?</span></p>\n",
                    options_en: ["<p>Tetra-atomic</p>\n", "<p>Diatomic</p>\n", 
                                "<p>Poly-atomic</p>\n", "<p>Monoatomic</p>\n"],
                    options_hi: ["<p>&#2330;&#2340;&#2369;&#2359;&#2381;&#2346;&#2352;&#2350;&#2366;&#2339;&#2369;&#2325;</p>\n", "<p>&#2342;&#2381;&#2357;&#2367;&#2346;&#2352;&#2350;&#2366;&#2339;&#2369;&#2325;</p>\n",
                                "<p>&#2348;&#2361;&#2369;-&#2346;&#2352;&#2350;&#2366;&#2339;&#2369;&#2325;</p>\n", "<p>&#2319;&#2325;&#2346;&#2352;&#2350;&#2366;&#2339;&#2369;&#2325;</p>\n"],
                    solution_en: "<p><span style=\"font-family: Roboto;\">6.(b) </span><strong>Diatomic</strong><span style=\"font-weight: 400;\">. </span><strong>Atomicity </strong><span style=\"font-weight: 400;\">- Number of atoms present in a molecule of an element. Types of Atomicity: </span><strong>Monoatomic -</strong><span style=\"font-weight: 400;\"> Elements which have only one atom and in which atoms do not join to form a cluster. Example: Noble gases Helium (He), Neon (Ne), Argon (Ar), Krypton (Kr). </span><strong>Diatomic</strong><span style=\"font-weight: 400;\"> - Elements that have two atoms. Example: Hydrogen (</span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub></math><span style=\"font-weight: 400;\">)</span><span style=\"font-weight: 400;\">, Nitrogen (</span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">N</mi><mn>2</mn></msub></math><span style=\"font-weight: 400;\">), Fluorine (</span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">F</mi><mn>2</mn></msub></math><span style=\"font-weight: 400;\">).&nbsp; </span><strong>Triatomic -</strong><span style=\"font-weight: 400;\"> Elements that have 3 atoms. Example: Ozone(</span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub></math><span style=\"font-weight: 400;\">). </span><strong>Polyatomic</strong><span style=\"font-weight: 400;\"> - Elements that have more than 3 atoms. Example: Sulphur (</span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">S</mi><mn>8</mn></msub></math><span style=\"font-weight: 400;\">), buckminsterfullerene (</span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>60</mn></msub></math><span style=\"font-weight: 400;\">).</span></p>\n",
                    solution_hi: "<p>6.(b)&nbsp;<strong>&#2342;&#2381;&#2357;&#2367;&#2346;&#2352;&#2350;&#2366;&#2339;&#2369;&#2325;</strong><span style=\"font-weight: 400;\">&#2404;</span><span style=\"font-weight: 400;\"> </span><strong>&#2346;&#2352;&#2350;&#2366;&#2339;&#2369;&#2340;&#2366;</strong><span style=\"font-weight: 400;\"> - &#2325;&#2367;&#2360;&#2368; &#2340;&#2340;&#2381;&#2357; &#2325;&#2375; &#2309;&#2339;&#2369; &#2350;&#2375;&#2306; &#2350;&#2380;&#2332;&#2370;&#2342; &#2346;&#2352;&#2350;&#2366;&#2339;&#2369;&#2323;&#2306; &#2325;&#2368; &#2360;&#2306;&#2326;&#2381;&#2351;&#2366; &#2361;&#2376;&#2404; &#2346;&#2352;&#2350;&#2366;&#2339;&#2369;&#2340;&#2366; &#2325;&#2375; &#2346;&#2381;&#2352;&#2325;&#2366;&#2352;:</span><strong> &#2319;&#2325;&#2346;&#2352;&#2350;&#2366;&#2339;&#2369;&#2325;</strong><span style=\"font-weight: 400;\"> - &#2320;&#2360;&#2375; &#2340;&#2340;&#2381;&#2357; &#2332;&#2367;&#2344;&#2350;&#2375;&#2306; &#2325;&#2375;&#2357;&#2354; &#2319;&#2325; &#2346;&#2352;&#2350;&#2366;&#2339;&#2369; &#2361;&#2379;&#2340;&#2366; &#2361;&#2376; &#2324;&#2352; &#2332;&#2367;&#2344;&#2350;&#2375;&#2306; &#2346;&#2352;&#2350;&#2366;&#2339;&#2369; &#2332;&#2369;&#2337;&#2364;&#2325;&#2352; &#2360;&#2350;&#2370;&#2361; &#2344;&#2361;&#2368;&#2306; &#2348;&#2344;&#2366;&#2340;&#2375; &#2361;&#2376;&#2306;&#2404; &#2313;&#2342;&#2366;&#2361;&#2352;&#2339;: &#2309;&#2325;&#2381;&#2352;&#2367;&#2351; &#2327;&#2376;&#2360;&#2375;&#2306; &#2361;&#2368;&#2354;&#2367;&#2351;&#2350; (He), &#2344;&#2367;&#2351;&#2377;&#2344; (Ne), &#2310;&#2352;&#2381;&#2327;&#2344; (Ar), &#2325;&#2381;&#2352;&#2367;&#2346;&#2381;&#2335;&#2344; (Kr)&#2404; </span><strong>&#2342;&#2381;&#2357;&#2367;&#2346;&#2352;&#2350;&#2366;&#2339;&#2369;&#2325; </strong><span style=\"font-weight: 400;\">- &#2357;&#2375; &#2340;&#2340;&#2381;&#2357; &#2332;&#2367;&#2344;&#2350;&#2375;&#2306; &#2342;&#2379; &#2346;&#2352;&#2350;&#2366;&#2339;&#2369; &#2361;&#2379;&#2340;&#2375; &#2361;&#2376;&#2306;&#2404; &#2313;&#2342;&#2366;&#2361;&#2352;&#2339;: &#2361;&#2366;&#2311;&#2337;&#2381;&#2352;&#2379;&#2332;&#2344; (</span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">H</mi><mn>2</mn></msub></math><span style=\"font-weight: 400;\">), &#2344;&#2366;&#2311;&#2335;&#2381;&#2352;&#2379;&#2332;&#2344; (</span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">N</mi><mn>2</mn></msub></math><span style=\"font-weight: 400;\">), &#2347;&#2381;&#2354;&#2379;&#2352;&#2368;&#2344; (</span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">F</mi><mn>2</mn></msub></math><span style=\"font-weight: 400;\">)&#2404; </span><strong>&#2340;&#2381;&#2352;&#2367;&#2346;&#2352;&#2350;&#2366;&#2339;&#2381;&#2357;&#2367;&#2325;</strong><span style=\"font-weight: 400;\"> - &#2320;&#2360;&#2375; &#2340;&#2340;&#2381;&#2357; &#2332;&#2367;&#2344;&#2350;&#2375;&#2306; 3 &#2346;&#2352;&#2350;&#2366;&#2339;&#2369; &#2361;&#2379;&#2340;&#2375; &#2361;&#2376;&#2306;&#2404; &#2313;&#2342;&#2366;&#2361;&#2352;&#2339;: &#2323;&#2332;&#2379;&#2344;(</span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">O</mi><mn>3</mn></msub></math><span style=\"font-weight: 400;\">)&#2404; </span><strong>&#2348;&#2361;&#2369;-&#2346;&#2352;&#2350;&#2366;&#2339;&#2369;&#2325;</strong><span style=\"font-weight: 400;\"> - &#2320;&#2360;&#2375; &#2340;&#2340;&#2381;&#2357; &#2332;&#2367;&#2344;&#2350;&#2375;&#2306; 3 &#2360;&#2375; &#2309;&#2343;&#2367;&#2325; &#2346;&#2352;&#2350;&#2366;&#2339;&#2369; &#2361;&#2379;&#2340;&#2375; &#2361;&#2376;&#2306;&#2404; &#2313;&#2342;&#2366;&#2361;&#2352;&#2339;: &#2360;&#2354;&#2381;&#2347;&#2352; (</span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">S</mi><mn>8</mn></msub></math><span style=\"font-weight: 400;\">), &#2348;&#2325;&#2350;&#2367;&#2344;&#2367;&#2360;&#2381;&#2335;&#2352; &#2347;&#2369;&#2354;&#2375;&#2352;&#2375;&#2344;&#2381;&#2351; (</span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>60</mn></msub></math><span style=\"font-weight: 400;\">)&#2404;</span></p>\n",
                    correct: "b",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "7",
                    section: "18",
                    question_en: "<p><span style=\"font-family: Roboto;\">7</span><span style=\"font-family: Roboto;\">. Which of the following elements has variable valency?</span></p>\n",
                    question_hi: "<p><span style=\"font-family: Roboto;\">7</span><span style=\"font-family: Palanquin;\">. &#2344;&#2367;&#2350;&#2381;&#2344;&#2354;&#2367;&#2326;&#2367;&#2340; &#2350;&#2375;&#2306; &#2360;&#2375; &#2325;&#2367;&#2360; &#2340;&#2340;&#2381;&#2340;&#2381;&#2357; &#2325;&#2368; &#2346;&#2352;&#2367;&#2357;&#2352;&#2381;&#2340;&#2368; &#2360;&#2306;&#2351;&#2379;&#2332;&#2325;&#2340;&#2366; &#2361;&#2379;&#2340;&#2368; &#2361;&#2376;?</span></p>\n",
                    options_en: ["<p>Iron</p>\n", "<p>Sodium</p>\n", 
                                "<p>Sulphur</p>\n", "<p>Magnesium</p>\n"],
                    options_hi: ["<p>&#2310;&#2351;&#2352;&#2344;</p>\n", "<p>&#2360;&#2379;&#2337;&#2367;&#2351;&#2350;</p>\n",
                                "<p>&#2360;&#2354;&#2381;&#2347;&#2352;</p>\n", "<p>&#2350;&#2376;&#2327;&#2344;&#2368;&#2358;&#2367;&#2351;&#2350;</p>\n"],
                    solution_en: "<p><span style=\"font-family: Roboto;\">7.(a)&nbsp; </span><strong>Iron. Variable valency</strong><span style=\"font-weight: 400;\"> is the ability of an atom to form different numbers of bonds with other atoms, which is determined by the number of unpaired electrons in the atom\'s outermost energy level.</span><strong> Iron</strong><span style=\"font-weight: 400;\"> (Fe) can exhibit two valencies - </span><strong>Valency of 2 </strong><span style=\"font-weight: 400;\">(Compounds formed are termed as ferrous compounds) and </span><strong>Valency of 3</strong><span style=\"font-weight: 400;\"> (Compounds formed are termed as ferric compounds).&nbsp;</span></p>\n",
                    solution_hi: "<p>7.(a)&nbsp; <strong>&#2310;&#2351;&#2352;&#2344;</strong><span style=\"font-weight: 400;\">&#2404;</span><strong> &#2346;&#2352;&#2367;&#2357;&#2352;&#2381;&#2340;&#2368; &#2360;&#2306;&#2351;&#2379;&#2332;&#2325;&#2340;&#2366;</strong><span style=\"font-weight: 400;\"> &#2319;&#2325; &#2346;&#2352;&#2350;&#2366;&#2339;&#2369; &#2325;&#2368; &#2309;&#2344;&#2381;&#2351; &#2346;&#2352;&#2350;&#2366;&#2339;&#2369;&#2323;&#2306; &#2325;&#2375; &#2360;&#2366;&#2341; &#2357;&#2367;&#2349;&#2367;&#2344;&#2381;&#2344; &#2360;&#2306;&#2326;&#2381;&#2351;&#2366; &#2350;&#2375;&#2306; &#2348;&#2306;&#2343; &#2348;&#2344;&#2366;&#2344;&#2375; &#2325;&#2368; &#2325;&#2381;&#2359;&#2350;&#2340;&#2366; &#2361;&#2376;, &#2332;&#2379; &#2346;&#2352;&#2350;&#2366;&#2339;&#2369; &#2325;&#2375; &#2360;&#2348;&#2360;&#2375; &#2348;&#2366;&#2361;&#2352;&#2368; &#2314;&#2352;&#2381;&#2332;&#2366; &#2360;&#2381;&#2340;&#2352; &#2350;&#2375;&#2306; &#2309;&#2351;&#2369;&#2327;&#2381;&#2350;&#2367;&#2340; &#2311;&#2354;&#2375;&#2325;&#2381;&#2335;&#2381;&#2352;&#2377;&#2344;&#2379;&#2306; &#2325;&#2368; &#2360;&#2306;&#2326;&#2381;&#2351;&#2366; &#2360;&#2375; &#2344;&#2367;&#2352;&#2381;&#2343;&#2366;&#2352;&#2367;&#2340; &#2361;&#2379;&#2340;&#2368; &#2361;&#2376;&#2404; </span><strong>&#2310;&#2351;&#2352;&#2344;</strong><span style=\"font-weight: 400;\"> (Fe) &#2342;&#2379; &#2360;&#2306;&#2351;&#2379;&#2332;&#2325;&#2340;&#2366; &#2346;&#2381;&#2352;&#2342;&#2352;&#2381;&#2358;&#2367;&#2340; &#2325;&#2352; &#2360;&#2325;&#2340;&#2366; &#2361;&#2376; - </span><strong>2 &#2325;&#2368; &#2360;&#2306;&#2351;&#2379;&#2332;&#2325;&#2340;&#2366;</strong><span style=\"font-weight: 400;\"> (&#2348;&#2344;&#2344;&#2375; &#2357;&#2366;&#2354;&#2375; &#2351;&#2380;&#2327;&#2367;&#2325;&#2379;&#2306; &#2325;&#2379; &#2347;&#2375;&#2352;&#2360; &#2351;&#2380;&#2327;&#2367;&#2325; &#2325;&#2361;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;) &#2324;&#2352; </span><strong>3 &#2325;&#2368; &#2360;&#2306;&#2351;&#2379;&#2332;&#2325;&#2340;&#2366; </strong><span style=\"font-weight: 400;\">(&#2348;&#2344;&#2344;&#2375; &#2357;&#2366;&#2354;&#2375; &#2351;&#2380;&#2327;&#2367;&#2325;&#2379;&#2306; &#2325;&#2379; &#2347;&#2375;&#2352;&#2367;&#2325; &#2351;&#2380;&#2327;&#2367;&#2325; &#2325;&#2361;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;)&#2404;</span></p>\n",
                    correct: "a",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "8",
                    section: "18",
                    question_en: "<p><span style=\"font-family: Roboto;\">8.</span><span style=\"font-family: Roboto;\"> In 1808, whose work provided a physical picture of how compounds are formed by the combination of two or more different types of atoms?</span></p>\n",
                    question_hi: "<p><span style=\"font-family: Roboto;\">8.</span><span style=\"font-family: Palanquin;\">1808 &#2350;&#2375;&#2306;, &#2344;&#2367;&#2350;&#2381;&#2344;&#2354;&#2367;&#2326;&#2367;&#2340; &#2350;&#2375;&#2306; &#2360;&#2375; &#2325;&#2367;&#2360;&#2325;&#2375; &#2325;&#2366;&#2352;&#2381;&#2351;&#2379;&#2306; &#2344;&#2375; &#2342;&#2379; &#2351;&#2366; &#2342;&#2379; &#2360;&#2375; &#2309;&#2343;&#2367;&#2325; &#2357;&#2367;&#2349;&#2367;&#2344;&#2381;&#2344; &#2346;&#2381;&#2352;&#2325;&#2366;&#2352; &#2325;&#2375; &#2346;&#2352;&#2350;&#2366;&#2339;&#2369;&#2323;&#2306; &#2325;&#2375; &#2360;&#2306;&#2351;&#2379;&#2332;&#2344; &#2360;&#2375; &#2351;&#2380;&#2327;&#2367;&#2325;&#2379;&#2306; &#2325;&#2375; &#2348;&#2344;&#2344;&#2375; &#2325;&#2368; &#2349;&#2380;&#2340;&#2367;&#2325; &#2340;&#2360;&#2381;&#2357;&#2368;&#2352; &#2346;&#2381;&#2352;&#2360;&#2381;&#2340;&#2369;&#2340; &#2325;&#2368;?</span></p>\n",
                    options_en: ["<p>George Zweig</p>\n", "<p>Joseph J Thomson</p>\n", 
                                "<p>Niels Bohr</p>\n", "<p>John Dalton</p>\n"],
                    options_hi: ["<p>&#2332;&#2377;&#2352;&#2381;&#2332; &#2332;&#2381;&#2357;&#2367;&#2327;</p>\n", "<p>&#2332;&#2379;&#2360;&#2375;&#2347; &#2332;&#2375;. &#2341;&#2377;&#2350;&#2360;&#2344;</p>\n",
                                "<p>&#2344;&#2368;&#2354;&#2381;&#2360; &#2348;&#2379;&#2352;</p>\n", "<p>&#2332;&#2377;&#2344; &#2337;&#2366;&#2354;&#2381;&#2335;&#2344;</p>\n"],
                    solution_en: "<p><span style=\"font-family: Roboto;\">8.(d)&nbsp; </span><strong>John Dalton&rsquo;s</strong><span style=\"font-weight: 400;\"> Atomic Theory : It stated that all matter was made up of small, indivisible particles known as &lsquo;atoms&rsquo;.</span><strong> George Zweig : </strong><span style=\"font-weight: 400;\">Known for the Quark model {a theoretical framework in particle physics that describes protons, neutrons, and other hadrons (a subatomic particle) as composed of constituent quarks}. </span><strong>Joseph J Thomson: </strong><span style=\"font-weight: 400;\">Discovered electrons,&nbsp; got </span><span style=\"font-weight: 400;\"> </span><span style=\"font-weight: 400;\">Noble Prize for&nbsp; estimate its magnitude by performing experiments with charged particles in gases. </span><strong>Niels Bohr</strong><span style=\"font-weight: 400;\">: He gave foundational contributions to understanding of atomic structure and quantum theory, for which he received the Nobel Prize in Physics in 1922.&nbsp;</span></p>\n",
                    solution_hi: "<p><span style=\"font-family: Palanquin;\">8.(d) </span><strong>&#2332;&#2377;&#2344; &#2337;&#2366;&#2354;&#2381;&#2335;&#2344; &#2325;&#2366; &#2346;&#2352;&#2350;&#2366;&#2339;&#2369; &#2360;&#2367;&#2342;&#2381;&#2343;&#2366;&#2306;&#2340;: </strong><span style=\"font-weight: 400;\">&#2311;&#2360;&#2350;&#2375;&#2306; &#2325;&#2361;&#2366; &#2327;&#2351;&#2366; &#2361;&#2376; &#2325;&#2367; &#2360;&#2349;&#2368; &#2346;&#2342;&#2366;&#2352;&#2381;&#2341; &#2331;&#2379;&#2335;&#2375;, &#2309;&#2357;&#2367;&#2349;&#2366;&#2332;&#2381;&#2351; &#2325;&#2339;&#2379;&#2306; &#2360;&#2375; &#2348;&#2344;&#2375; &#2361;&#2379;&#2340;&#2375; &#2361;&#2376;&#2306; &#2332;&#2367;&#2344;&#2381;&#2361;&#2375;&#2306; \'&#2346;&#2352;&#2350;&#2366;&#2339;&#2369;\' &#2325;&#2361;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404;</span><strong> &#2332;&#2377;&#2352;&#2381;&#2332; &#2332;&#2364;&#2381;&#2357;&#2367;&#2327;: </strong><span style=\"font-weight: 400;\">&#2325;&#2381;&#2357;&#2366;&#2352;&#2381;&#2325; &#2350;&#2377;&#2337;&#2354; &#2325;&#2375; &#2354;&#2367;&#2319; &#2332;&#2366;&#2344;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376; {&#2325;&#2339; &#2349;&#2380;&#2340;&#2367;&#2325;&#2368; &#2350;&#2375;&#2306; &#2319;&#2325; &#2360;&#2376;&#2342;&#2381;&#2343;&#2366;&#2306;&#2340;&#2367;&#2325; &#2338;&#2366;&#2306;&#2330;&#2366; &#2332;&#2379; &#2346;&#2381;&#2352;&#2379;&#2335;&#2377;&#2344;, &#2344;&#2381;&#2351;&#2370;&#2335;&#2381;&#2352;&#2377;&#2344; &#2324;&#2352; &#2309;&#2344;&#2381;&#2351; &#2361;&#2376;&#2337;&#2381;&#2352;&#2377;&#2344; (&#2319;&#2325; &#2313;&#2346;&#2346;&#2352;&#2350;&#2366;&#2339;&#2381;&#2357;&#2367;&#2325; &#2325;&#2339;) &#2325;&#2379; &#2328;&#2335;&#2325; &#2325;&#2381;&#2357;&#2366;&#2352;&#2381;&#2325; &#2360;&#2375; &#2348;&#2344;&#2366; &#2348;&#2340;&#2366;&#2340;&#2366; &#2361;&#2376;}&#2404; </span><strong>&#2332;&#2379;&#2360;&#2375;&#2347; &#2332;&#2375; &#2341;&#2377;&#2350;&#2360;&#2344;: </strong><span style=\"font-weight: 400;\">&#2311;&#2354;&#2375;&#2325;&#2381;&#2335;&#2381;&#2352;&#2377;&#2344;&#2379;&#2306; &#2325;&#2368; &#2326;&#2379;&#2332; &#2325;&#2368;, &#2327;&#2376;&#2360;&#2379;&#2306; &#2350;&#2375;&#2306; &#2310;&#2357;&#2375;&#2358;&#2367;&#2340; &#2325;&#2339;&#2379;&#2306; &#2325;&#2375; &#2360;&#2366;&#2341; &#2346;&#2381;&#2352;&#2351;&#2379;&#2327; &#2325;&#2352;&#2325;&#2375; &#2313;&#2360;&#2325;&#2375; &#2346;&#2352;&#2367;&#2350;&#2366;&#2339; &#2325;&#2366; &#2309;&#2344;&#2369;&#2350;&#2366;&#2344; &#2354;&#2327;&#2366;&#2344;&#2375; &#2325;&#2375; &#2354;&#2367;&#2319; &#2344;&#2379;&#2348;&#2354; &#2346;&#2369;&#2352;&#2360;&#2381;&#2325;&#2366;&#2352; &#2350;&#2367;&#2354;&#2366;&#2404;</span><strong> &#2344;&#2368;&#2354;&#2381;&#2360; &#2348;&#2379;&#2352;: </strong><span style=\"font-weight: 400;\">&#2313;&#2344;&#2381;&#2361;&#2379;&#2306;&#2344;&#2375; &#2346;&#2352;&#2350;&#2366;&#2339;&#2369; &#2360;&#2306;&#2352;&#2330;&#2344;&#2366; &#2324;&#2352; &#2325;&#2381;&#2357;&#2366;&#2306;&#2335;&#2350; &#2360;&#2367;&#2342;&#2381;&#2343;&#2366;&#2306;&#2340; &#2325;&#2379; &#2360;&#2350;&#2333;&#2344;&#2375; &#2350;&#2375;&#2306; &#2350;&#2370;&#2354;&#2349;&#2370;&#2340; &#2351;&#2379;&#2327;&#2342;&#2366;&#2344; &#2342;&#2367;&#2351;&#2366;, &#2332;&#2367;&#2360;&#2325;&#2375; &#2354;&#2367;&#2319; &#2313;&#2344;&#2381;&#2361;&#2375;&#2306; 1922 &#2350;&#2375;&#2306; &#2349;&#2380;&#2340;&#2367;&#2325;&#2368; &#2350;&#2375;&#2306; &#2344;&#2379;&#2348;&#2375;&#2354; &#2346;&#2369;&#2352;&#2360;&#2381;&#2325;&#2366;&#2352; &#2350;&#2367;&#2354;&#2366;&#2404;</span></p>\n",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "9",
                    section: "18",
                    question_en: "<p><span style=\"font-family: Roboto;\">9</span><span style=\"font-family: Roboto;\">.In which year did Antoine Lavoisier publish \'Methods of Chemical Nomenclature\', which included the rules for naming chemical compounds that are still in use today?</span></p>\n",
                    question_hi: "<p><span style=\"font-family: Roboto;\">9</span><span style=\"font-family: Palanquin;\">. &#2319;&#2306;&#2335;&#2379;&#2344;&#2368; &#2354;&#2375;&#2357;&#2379;&#2332;&#2364;&#2367;&#2351;&#2352; &#2344;&#2375; &#2325;&#2367;&#2360; &#2357;&#2352;&#2381;&#2359; \'&#2352;&#2366;&#2360;&#2366;&#2351;&#2344;&#2367;&#2325; &#2344;&#2366;&#2350;&#2325;&#2352;&#2339; &#2325;&#2368; &#2357;&#2367;&#2343;&#2367;&#2351;&#2366;&#2305;(Methods of Chemical Nomenclature)\' &#2346;&#2381;&#2352;&#2325;&#2366;&#2358;&#2367;&#2340; &#2325;&#2367;&#2319;, &#2332;&#2367;&#2360;&#2350;&#2375;&#2306; &#2313;&#2344; &#2352;&#2366;&#2360;&#2366;&#2351;&#2344;&#2367;&#2325; &#2351;&#2380;&#2327;&#2367;&#2325;&#2379;&#2306; &#2325;&#2375; &#2344;&#2366;&#2350;&#2325;&#2352;&#2339; &#2325;&#2375; &#2344;&#2367;&#2351;&#2350; &#2358;&#2366;&#2350;&#2367;&#2354; &#2341;&#2375; &#2332;&#2379; &#2310;&#2332; &#2349;&#2368; &#2313;&#2346;&#2351;&#2379;&#2327; &#2350;&#2375;&#2306; &#2361;&#2376;&#2306;?</span></p>\n",
                    options_en: ["<p>1783</p>\n", "<p>1780</p>\n", 
                                "<p>1790</p>\n", "<p>1787</p>\n"],
                    options_hi: ["<p>1783</p>\n", "<p>1780</p>\n",
                                "<p>1790</p>\n", "<p>1787</p>\n"],
                    solution_en: "<p><span style=\"font-family: Roboto;\">9.(d) <strong>1787</strong>. </span><span style=\"font-family: Roboto;\">In 1774, Lavoisier (Father of modern chemistry) did many experiments investigating combustion that would discover oxygen. In 1789, he published the first periodic table, his findings describing the law of conservation of mass. Book - &ldquo;Elementary Treatise of Chemistry&rdquo;, &ldquo;Elements of Chemistry&rdquo;. In chemical nomenclature, another naming method called IUPAC nomenclature is used for naming organic chemical compounds which is recommended by International Union of Pure and Applied Chemistry, also called &lsquo;blue book&rsquo;</span><span style=\"font-family: Roboto;\">.</span></p>\n",
                    solution_hi: "<p>9.(d) <strong>1787</strong><span style=\"font-family: Palanquin;\">&#2404;</span><span style=\"font-family: Roboto;\"> </span><span style=\"font-family: Palanquin;\">1774 &#2350;&#2375;&#2306;,</span><span style=\"font-family: Roboto;\"> </span><span style=\"font-family: Palanquin;\">&#2354;&#2375;&#2357;&#2379;&#2332;&#2364;&#2367;&#2351;&#2352; (&#2310;&#2343;&#2369;&#2344;&#2367;&#2325; &#2352;&#2360;&#2366;&#2351;&#2344; &#2357;&#2367;&#2332;&#2381;&#2334;&#2366;&#2344; &#2325;&#2375; &#2332;&#2344;&#2325;) &#2344;&#2375; &#2342;&#2361;&#2344; &#2325;&#2368; &#2332;&#2366;&#2306;&#2330; &#2325;&#2375; &#2354;&#2367;&#2319; &#2325;&#2312; &#2346;&#2381;&#2352;&#2351;&#2379;&#2327; &#2325;&#2367;&#2319; &#2332;&#2367;&#2360;&#2360;&#2375; &#2321;&#2325;&#2381;&#2360;&#2368;&#2332;&#2344; &#2325;&#2368; &#2326;&#2379;&#2332; &#2361;&#2369;&#2312;&#2404; 1789 &#2350;&#2375;&#2306;, &#2311;&#2344;&#2381;&#2361;&#2379;&#2306;&#2344;&#2375; &#2346;&#2381;&#2352;&#2341;&#2350; &#2310;&#2357;&#2352;&#2381;&#2340; &#2360;&#2366;&#2352;&#2339;&#2368; &#2346;&#2381;&#2352;&#2325;&#2366;&#2358;&#2367;&#2340; &#2325;&#2368;, &#2332;&#2367;&#2360;&#2350;&#2375;&#2306; &#2313;&#2344;&#2325;&#2375; &#2344;&#2367;&#2359;&#2381;&#2325;&#2352;&#2381;&#2359;&#2379;&#2306; &#2350;&#2375;&#2306; &#2342;&#2381;&#2352;&#2357;&#2381;&#2351;&#2350;&#2366;&#2344; &#2325;&#2375; &#2360;&#2306;&#2352;&#2325;&#2381;&#2359;&#2339; &#2325;&#2375; &#2344;&#2367;&#2351;&#2350; &#2325;&#2366; &#2357;&#2352;&#2381;&#2339;&#2344; &#2325;&#2367;&#2351;&#2366; &#2327;&#2351;&#2366; &#2341;&#2366;&#2404; </span><strong><span style=\"font-family: Palanquin;\">&#2346;&#2369;&#2360;&#2381;&#2340;&#2325; </span></strong><span style=\"font-family: Palanquin;\">- \"&#2319;&#2354;&#2368;&#2350;&#2375;&#2306;&#2335;&#2381;&#2352;&#2368; &#2335;&#2381;&#2352;&#2368;&#2335;&#2368;&#2395; &#2321;&#2398; &#2325;&#2375;&#2350;&#2367;&#2360;&#2381;&#2335;&#2381;&#2352;&#2368; \", \"&#2319;&#2354;&#2368;&#2350;&#2375;&#2306;&#2335; &#2321;&#2347; &#2325;&#2375;&#2350;&#2367;&#2360;&#2381;&#2335;&#2381;&#2352;&#2368; \"&#2404; &#2352;&#2366;&#2360;&#2366;&#2351;&#2344;&#2367;&#2325; &#2344;&#2366;&#2350;&#2325;&#2352;&#2339; &#2350;&#2375;&#2306;, IUPAC &#2344;&#2366;&#2350;&#2325;&#2352;&#2339; &#2344;&#2366;&#2350;&#2325; &#2319;&#2325; &#2309;&#2344;&#2381;&#2351; &#2344;&#2366;&#2350;&#2325;&#2352;&#2339; &#2357;&#2367;&#2343;&#2367; &#2325;&#2366; &#2313;&#2346;&#2351;&#2379;&#2327; &#2325;&#2366;&#2352;&#2381;&#2348;&#2344;&#2367;&#2325; &#2352;&#2366;&#2360;&#2366;&#2351;&#2344;&#2367;&#2325; &#2351;&#2380;&#2327;&#2367;&#2325;&#2379;&#2306; &#2325;&#2375; &#2344;&#2366;&#2350;&#2325;&#2352;&#2339; &#2325;&#2375; &#2354;&#2367;&#2319; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;, &#2332;&#2367;&#2360;&#2375; &lsquo;&#2311;&#2306;&#2335;&#2352;&#2344;&#2375;&#2358;&#2344;&#2354; &#2351;&#2370;&#2344;&#2367;&#2351;&#2344; &#2321;&#2347; &#2346;&#2381;&#2351;&#2379;&#2352; &#2319;&#2306;&#2337; &#2319;&#2346;&#2381;&#2354;&#2366;&#2311;&#2337; &#2325;&#2375;&#2350;&#2367;&#2360;&#2381;&#2335;&#2381;&#2352;&#2368;&rsquo; &#2342;&#2381;&#2357;&#2366;&#2352;&#2366; &#2309;&#2344;&#2369;&#2358;&#2306;&#2360;&#2367;&#2340; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;, &#2332;&#2367;&#2360;&#2375; \'&#2348;&#2381;&#2354;&#2370; &#2348;&#2369;&#2325;\' &#2349;&#2368; &#2325;&#2361;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\n",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "10",
                    section: "18",
                    question_en: "<p><span style=\"font-family: Roboto;\">10.</span><span style=\"font-family: Roboto;\"> Butan-2-ol is a:</span></p>\n",
                    question_hi: "<p><span style=\"font-family: Roboto;\">10.</span><span style=\"font-family: Palanquin;\"> &#2348;&#2381;&#2351;&#2370;&#2335;&#2375;&#2344;-2-&#2321;&#2354; &#2325;&#2381;&#2351;&#2366; &#2361;&#2376;?</span></p>\n",
                    options_en: ["<p><span style=\"font-family: Roboto;\">tertiary alcohol</span></p>\n", "<p><span style=\"font-family: Roboto;\">ketone</span></p>\n", 
                                "<p><span style=\"font-family: Roboto;\">primary alcohol</span></p>\n", "<p><span style=\"font-family: Roboto;\">secondary alcohol</span></p>\n"],
                    options_hi: ["<p>&#2340;&#2371;&#2340;&#2368;&#2351;&#2325; &#2309;&#2354;&#2381;&#2325;&#2379;&#2361;&#2377;&#2354;</p>\n", "<p>&#2325;&#2368;&#2335;&#2379;&#2344;</p>\n",
                                "<p>&#2346;&#2381;&#2352;&#2366;&#2341;&#2350;&#2367;&#2325; &#2309;&#2354;&#2381;&#2325;&#2379;&#2361;&#2377;&#2354;</p>\n", "<p>&#2342;&#2381;&#2357;&#2367;&#2340;&#2368;&#2351;&#2325; &#2309;&#2354;&#2381;&#2325;&#2379;&#2361;&#2377;&#2354;</p>\n"],
                    solution_en: "<p><span style=\"font-family: Roboto;\">10.</span><span style=\"font-family: Roboto;\">(d)&nbsp; </span><strong>secondary alcohol : </strong><span style=\"font-weight: 400;\">Where the carbon atom of the hydroxyl group is attached to two alkyl groups on either side. Examples - Propan-2-ol, Butan-2-ol, Pentan-2-ol. </span><strong>Primary alcohols:</strong><span style=\"font-weight: 400;\"> The carbon atom of the hydroxyl group (OH) is bonded to just one alkyl group. Examples - Methanol (</span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CH</mi><mn>3</mn></msub><mi>OH</mi></math><span style=\"font-weight: 400;\">), Propanol (</span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>3</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>7</mn></msub><mi>OH</mi></math><span style=\"font-weight: 400;\">), Ethanol (</span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>5</mn></msub><mi>OH</mi></math><span style=\"font-weight: 400;\">). </span><strong>&nbsp;Tertiary alcohols : </strong><span style=\"font-weight: 400;\">A hydroxyl group attached to the carbon atom which is connected to 3- alkyl groups. Examples: 2-methylpropan-2-ol, 2-Methylbutan-2-ol, etc.</span></p>\n",
                    solution_hi: "<p>10.<span style=\"font-family: Palanquin;\">(d)&nbsp;</span><strong>&nbsp;&#2342;&#2381;&#2357;&#2367;&#2340;&#2368;&#2351;&#2325; &#2309;&#2354;&#2381;&#2325;&#2379;&#2361;&#2377;&#2354; :</strong><span style=\"font-weight: 400;\"> &#2332;&#2361;&#2366;&#2305; &#2361;&#2366;&#2311;&#2337;&#2381;&#2352;&#2377;&#2325;&#2381;&#2360;&#2367;&#2354; &#2360;&#2350;&#2370;&#2361; &#2325;&#2366; &#2325;&#2366;&#2352;&#2381;&#2348;&#2344; &#2346;&#2352;&#2350;&#2366;&#2339;&#2369; &#2342;&#2379;&#2344;&#2379;&#2306; &#2340;&#2352;&#2347; &#2342;&#2379; &#2319;&#2354;&#2381;&#2325;&#2366;&#2311;&#2354; &#2360;&#2350;&#2370;&#2361;&#2379;&#2306; &#2360;&#2375; &#2332;&#2369;&#2337;&#2364;&#2366; &#2361;&#2379;&#2340;&#2366; &#2361;&#2376;&#2404; &#2313;&#2342;&#2366;&#2361;&#2352;&#2339; - &#2346;&#2381;&#2352;&#2379;&#2346;&#2375;&#2344;-2-ol, &#2348;&#2381;&#2351;&#2370;&#2335;&#2375;&#2344;-2-ol, &#2346;&#2375;&#2306;&#2335;&#2375;&#2344;-2-ol &#2404; </span><strong>&#2346;&#2381;&#2352;&#2366;&#2341;&#2350;&#2367;&#2325; &#2309;&#2354;&#2381;&#2325;&#2379;&#2361;&#2354; :</strong><span style=\"font-weight: 400;\"> &#2361;&#2366;&#2311;&#2337;&#2381;&#2352;&#2377;&#2325;&#2381;&#2360;&#2367;&#2354; &#2360;&#2350;&#2370;&#2361; (OH) &#2325;&#2366; &#2325;&#2366;&#2352;&#2381;&#2348;&#2344; &#2346;&#2352;&#2350;&#2366;&#2339;&#2369; &#2325;&#2375;&#2357;&#2354; &#2319;&#2325; &#2319;&#2354;&#2381;&#2325;&#2366;&#2311;&#2354; &#2360;&#2350;&#2370;&#2361; &#2360;&#2375; &#2332;&#2369;&#2337;&#2364;&#2366; &#2361;&#2379;&#2340;&#2366; &#2361;&#2376;&#2404; &#2313;&#2342;&#2366;&#2361;&#2352;&#2339; - &#2350;&#2375;&#2341;&#2344;&#2377;&#2354; (</span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi>CH</mi><mn>3</mn></msub><mi>OH</mi></math><span style=\"font-weight: 400;\">), &#2346;&#2381;&#2352;&#2379;&#2346;&#2375;&#2344;&#2377;&#2354; (</span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>3</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>7</mn></msub><mi>OH</mi></math><span style=\"font-weight: 400;\">), &#2311;&#2341;&#2375;&#2344;&#2377;&#2354; (</span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>2</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>5</mn></msub><mi>OH</mi></math><span style=\"font-weight: 400;\">)&#2404; </span><strong>&#2340;&#2371;&#2340;&#2368;&#2351;&#2325; &#2309;&#2354;&#2381;&#2325;&#2379;&#2361;&#2354; :</strong><span style=\"font-weight: 400;\"> &#2325;&#2366;&#2352;&#2381;&#2348;&#2344; &#2346;&#2352;&#2350;&#2366;&#2339;&#2369; &#2360;&#2375; &#2332;&#2369;&#2337;&#2364;&#2366; &#2319;&#2325; &#2361;&#2366;&#2311;&#2337;&#2381;&#2352;&#2377;&#2325;&#2381;&#2360;&#2367;&#2354; &#2360;&#2350;&#2370;&#2361; &#2332;&#2379; 3- &#2319;&#2354;&#2381;&#2325;&#2366;&#2311;&#2354; &#2360;&#2350;&#2370;&#2361;&#2379;&#2306; &#2360;&#2375; &#2332;&#2369;&#2337;&#2364;&#2366; &#2361;&#2379;&#2340;&#2366; &#2361;&#2376;&#2404; &#2313;&#2342;&#2366;&#2361;&#2352;&#2339; : 2-&#2350;&#2367;&#2341;&#2366;&#2311;&#2354;&#2346;&#2381;&#2352;&#2379;&#2346;&#2375;&#2344;-2-ol, 2-&#2350;&#2367;&#2341;&#2366;&#2311;&#2354;&#2348;&#2381;&#2351;&#2370;&#2335;&#2375;&#2344;-2-ol, &#2310;&#2342;&#2367;&#2404;</span></p>\n",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "11",
                    section: "18",
                    question_en: "<p><span style=\"font-family: Roboto;\">11. </span><span style=\"font-family: Roboto;\">Choose the correct set of the names for the organic compounds in the given figure.</span></p>\r\n<p><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1698039600/word/media/image3.png\" width=\"231\" height=\"56\"></p>\n",
                    question_hi: "<p><span style=\"font-family: Roboto;\">11. </span><span style=\"font-family: Palanquin;\">&#2342;&#2367;&#2319; &#2327;&#2319; &#2330;&#2367;&#2340;&#2381;&#2352; &#2350;&#2375;&#2306; &#2325;&#2366;&#2352;&#2381;&#2348;&#2344;&#2367;&#2325; &#2351;&#2380;&#2327;&#2367;&#2325;&#2379;&#2306; &#2325;&#2375; &#2344;&#2366;&#2350;&#2379;&#2306; &#2325;&#2375; &#2360;&#2361;&#2368; &#2360;&#2375;&#2335; &#2325;&#2366; &#2330;&#2351;&#2344; &#2325;&#2368;&#2332;&#2367;&#2319; &#2404;</span></p>\r\n<p><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1698039600/word/media/image3.png\" width=\"222\" height=\"54\"></p>\n",
                    options_en: ["<p>a: Furan, b: Toluene, c: Pyridine</p>\n", "<p>a: Furan, b: Pyridine, c: Thiophene</p>\n", 
                                "<p>a: Furan, b: Thiophene, c: Aniline</p>\n", "<p>a: Anisole, b: Thiophene, c: Pyridine</p>\n"],
                    options_hi: ["<p>a: &#2347;&#2381;&#2351;&#2370;&#2352;&#2366;&#2344;, b: &#2335;&#2377;&#2354;&#2370;&#2312;&#2344;, c : &#2346;&#2367;&#2352;&#2367;&#2337;&#2368;&#2344;</p>\n", "<p>a: &#2347;&#2381;&#2351;&#2370;&#2352;&#2366;&#2344;, b: &#2346;&#2367;&#2352;&#2367;&#2337;&#2368;&#2344;, c : &#2341;&#2366;&#2351;&#2379;&#2347;&#2368;&#2344;</p>\n",
                                "<p>a: &#2347;&#2381;&#2351;&#2370;&#2352;&#2366;&#2344;, b: &#2341;&#2366;&#2351;&#2379;&#2347;&#2368;&#2344;, c : &#2320;&#2344;&#2367;&#2354;&#2368;&#2344;</p>\n", "<p>a: &#2320;&#2344;&#2367;&#2360;&#2379;&#2354;, b: &#2341;&#2366;&#2351;&#2379;&#2347;&#2368;&#2344;, c : &#2346;&#2367;&#2352;&#2367;&#2337;&#2368;&#2344;</p>\n"],
                    solution_en: "<p><span style=\"font-family: Roboto;\">11.(b)<strong> a: Furan, b: Pyridine, c: Thiophene.</strong></span><span style=\"font-family: Roboto;\"><strong> Furan </strong>(</span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>4</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>4</mn></msub><mi mathvariant=\"normal\">O</mi></math><span style=\"font-family: Roboto;\">) - A heterocyclic organic compound, consisting of a five - membered aromatic ring composed of one oxygen atom and four carbon atoms. Pyridine (</span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>5</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>5</mn></msub><mi mathvariant=\"normal\">N</mi></math><span style=\"font-family: Roboto;\">) - A basic heterocyclic organic compound, six-membered ring structure composed of five carbon atoms and one nitrogen atom. Thiophene (</span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>4</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>4</mn></msub><mi mathvariant=\"normal\">S</mi></math><span style=\"font-family: Roboto;\">) - A simplest sulfur - containing aromatic compound, consisting of a planar five - membered ring, closely resembles benzene in its chemical and physical properties.</span></p>\n",
                    solution_hi: "<p>11.(b) <span style=\"font-family: Palanquin;\">a:</span><strong>&nbsp;&#2347;&#2381;&#2351;&#2370;&#2352;&#2366;&#2344;, b: &#2346;&#2367;&#2352;&#2367;&#2337;&#2368;&#2344;, c : &#2341;&#2366;&#2351;&#2379;&#2347;&#2368;&#2344;</strong><strong>&#2404;</strong><span style=\"font-weight: 400;\"> &#2347;&#2381;&#2351;&#2370;&#2352;&#2366;&#2344; (</span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>4</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>4</mn></msub><mi mathvariant=\"normal\">O</mi></math><span style=\"font-weight: 400;\">) - &#2319;&#2325; &#2357;&#2367;&#2359;&#2350;&#2330;&#2325;&#2381;&#2352;&#2368;&#2351; &#2325;&#2366;&#2352;&#2381;&#2348;&#2344;&#2367;&#2325; &#2351;&#2380;&#2327;&#2367;&#2325;,&nbsp; &#2332;&#2367;&#2360;&#2325;&#2368; &#2360;&#2306;&#2352;&#2330;&#2344;&#2366; 5-&#2360;&#2342;&#2360;&#2381;&#2351;&#2368;&#2351; &#2357;&#2354;&#2351; &#2360;&#2375; &#2348;&#2344;&#2368; &#2361;&#2379;&#2340;&#2368; &#2361;&#2376;, &#2332;&#2367;&#2360;&#2350;&#2375;&#2306; &#2319;&#2325; &#2321;&#2325;&#2381;&#2360;&#2368;&#2332;&#2344; &#2324;&#2352; &#2330;&#2366;&#2352; &#2325;&#2366;&#2352;&#2381;&#2348;&#2344; &#2325;&#2375; &#2309;&#2339;&#2369; &#2361;&#2379;&#2340;&#2375; &#2361;&#2376;&#2404; </span><strong>&#2346;&#2367;&#2352;&#2367;&#2337;&#2368;&#2344; </strong><span style=\"font-weight: 400;\">(</span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msub><mi mathvariant=\"normal\">C</mi><mn>5</mn></msub><msub><mi mathvariant=\"normal\">H</mi><mn>5</mn></msub><mi mathvariant=\"normal\">N</mi></math><span style=\"font-weight: 400;\">) - &#2319;&#2325; &#2325;&#2381;&#2359;&#2366;&#2352;&#2368;&#2351; &#2357;&#2367;&#2359;&#2350;&#2330;&#2325;&#2381;&#2352;&#2368;&#2351; &#2325;&#2366;&#2352;&#2381;&#2348;&#2344;&#2367;&#2325; &#2351;&#2380;&#2327;&#2367;&#2325;, &#2346;&#2366;&#2306;&#2330; &#2325;&#2366;&#2352;&#2381;&#2348;&#2344; &#2346;&#235                     correct: "b",

                questions.push({
                    id: "12",
                    section: "18",
                    question_en: "<p><span style=\"font-family: Roboto;\">12. </span><span style=\"font-family: Roboto;\">Which actinide, discovered by Glenn T Seaborg in 1940, is used as a heat source for sensitive electrical components in satellites as well as a power source for satellites?</span></p>\n",
                    question_hi: "<p><span style=\"font-family: Roboto;\">12. </span><span style=\"font-family: Palanquin;\">&#2327;&#2381;&#2354;&#2375;&#2344; &#2335;&#2368;. &#2360;&#2368;&#2348;&#2352;&#2381;&#2327; &#2342;&#2381;&#2357;&#2366;&#2352;&#2366; 1940 &#2350;&#2375;&#2306; &#2326;&#2379;&#2332;&#2375; &#2327;&#2319; &#2325;&#2380;&#2344; &#2360;&#2375; &#2319;&#2325;&#2381;&#2335;&#2367;&#2344;&#2366;&#2311;&#2337; &#2325;&#2366; &#2313;&#2346;&#2351;&#2379;&#2327; &#2313;&#2346;&#2327;&#2381;&#2352;&#2361;&#2379;&#2306; &#2350;&#2375;&#2306; &#2360;&#2306;&#2357;&#2375;&#2342;&#2344;&#2358;&#2368;&#2354; &#2357;&#2367;&#2342;&#2381;&#2351;&#2369;&#2340; &#2328;&#2335;&#2325;&#2379;&#2306; &#2325;&#2375; &#2354;&#2367;&#2319; &#2314;&#2359;&#2381;&#2350;&#2366; &#2360;&#2381;&#2352;&#2379;&#2340; &#2325;&#2375; &#2360;&#2366;&#2341;-&#2360;&#2366;&#2341; &#2313;&#2346;&#2327;&#2381;&#2352;&#2361;&#2379;&#2306; &#2325;&#2375; &#2354;&#2367;&#2319; &#2314;&#2352;&#2381;&#2332;&#2366; &#2360;&#2381;&#2352;&#2379;&#2340; &#2325;&#2375; &#2352;&#2370;&#2346; &#2350;&#2375;&#2306; &#2325;&#2367;&#2351;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;?</span></p>\n",
                    options_en: ["<p><span style=\"font-family: Roboto;\">Curium</span><span style=\"font-family: Roboto;\"> </span></p>\n", "<p><span style=\"font-family: Roboto;\">Plutonium</span><span style=\"font-family: Roboto;\"> </span></p>\n", 
                                "<p><span style=\"font-family: Roboto;\">Nobelium</span><span style=\"font-family: Roboto;\"> </span></p>\n", "<p><span style=\"font-family: Roboto;\">Americium</span></p>\n"],
                    options_hi: ["<p>&#2325;&#2381;&#2351;&#2370;&#2352;&#2367;&#2351;&#2350;</p>\n", "<p>&#2346;&#2381;&#2354;&#2370;&#2335;&#2379;&#2344;&#2367;&#2351;&#2350;</p>\n",
                                "<p>&#2344;&#2379;&#2348;&#2375;&#2354;&#2367;&#2351;&#2350;</p>\n", "<p>&#2309;&#2350;&#2375;&#2352;&#2367;&#2358;&#2367;&#2351;&#2350;</p>\n"],
                    solution_en: "<p><span style=\"font-family: Roboto;\">12.(b) <strong>Plutonium</strong>.</span><span style=\"font-family: Roboto;\"> Curium (Cm) Atomic number (96) is a transuranic, radioactive chemical element discovered by Glenn Seaborg. Nobelium (No) atomic number (102) is a synthetic chemical that is created in the lab and is named after Alfred Nobel the inventor of dynamite. </span><span style=\"font-family: Roboto;\">Americium</span><span style=\"font-family: Roboto;\"> (Am) atomic number 95 is a synthetic chemical element of the </span><span style=\"font-family: Roboto;\">actinoid</span><span style=\"font-family: Roboto;\"> series of the periodic table. Actinide or Actinoid series - The 15 metallic chemical elements with atomic numbers from 89 to 103.</span></p>\n",
                    solution_hi: "<p>12.(b) <strong>&#2346;&#2381;&#2354;&#2370;&#2335;&#2379;&#2344;&#2367;&#2351;&#2350;</strong>&#2404;<span style=\"font-family: Palanquin;\"> &#2325;&#2381;&#2351;&#2370;&#2352;&#2367;&#2351;&#2350; (Cm) &#2346;&#2352;&#2350;&#2366;&#2339;&#2369; &#2325;&#2381;&#2352;&#2350;&#2366;&#2306;&#2325; (96) &#2327;&#2381;&#2354;&#2375;&#2344; &#2360;&#2368;&#2348;&#2379;&#2352;&#2381;&#2327; &#2342;&#2381;&#2357;&#2366;&#2352;&#2366; &#2326;&#2379;&#2332;&#2366; &#2327;&#2351;&#2366; &#2319;&#2325; &#2335;&#2381;&#2352;&#2366;&#2306;&#2360;&#2351;&#2370;&#2352;&#2366;&#2344;&#2367;&#2325;, &#2352;&#2375;&#2337;&#2367;&#2351;&#2379;&#2343;&#2352;&#2381;&#2350;&#2368; &#2352;&#2366;&#2360;&#2366;&#2351;&#2344;&#2367;&#2325; &#2340;&#2340;&#2381;&#2357; &#2361;&#2376;&#2404; &#2344;&#2379;&#2348;&#2375;&#2354;&#2367;&#2351;&#2350; (No) &#2346;&#2352;&#2350;&#2366;&#2339;&#2369; &#2360;&#2306;&#2326;&#2381;&#2351;&#2366; (102) &#2319;&#2325; &#2360;&#2367;&#2306;&#2341;&#2375;&#2335;&#2367;&#2325; &#2352;&#2360;&#2366;&#2351;&#2344; &#2361;&#2376; &#2332;&#2367;&#2360;&#2375; &#2346;&#2381;&#2352;&#2351;&#2379;&#2327;&#2358;&#2366;&#2354;&#2366; &#2350;&#2375;&#2306; &#2348;&#2344;&#2366;&#2351;&#2366; &#2327;&#2351;&#2366; &#2361;&#2376; &#2324;&#2352; &#2311;&#2360;&#2325;&#2366; &#2344;&#2366;&#2350; &#2337;&#2366;&#2351;&#2344;&#2366;&#2350;&#2366;&#2311;&#2335; &#2325;&#2375; &#2310;&#2357;&#2367;&#2359;&#2381;&#2325;&#2366;&#2352;&#2325; &#2309;&#2354;&#2381;&#2347;&#2381;&#2352;&#2375;&#2337; &#2344;&#2379;&#2348;&#2375;&#2354; &#2325;&#2375; &#2344;&#2366;&#2350; &#2346;&#2352; &#2352;&#2326;&#2366; &#2327;&#2351;&#2366; &#2361;&#2376;&#2404; &#2309;&#2350;&#2375;&#2352;&#2367;&#2325;&#2367;&#2351;&#2350; (Am) &#2346;&#2352;&#2350;&#2366;&#2339;&#2369; &#2360;&#2306;&#2326;&#2381;&#2351;&#2366; 95 &#2310;&#2357;&#2352;&#2381;&#2340; &#2360;&#2366;&#2352;&#2339;&#2368; &#2325;&#2368; &#2319;&#2325;&#2381;&#2335;&#2367;&#2344;&#2379;&#2311;&#2337; &#2358;&#2381;&#2352;&#2371;&#2306;&#2326;&#2354;&#2366; &#2325;&#2366; &#2319;&#2325; &#2360;&#2367;&#2306;&#2341;&#2375;&#2335;&#2367;&#2325; &#2352;&#2366;&#2360;&#2366;&#2351;&#2344;&#2367;&#2325; &#2340;&#2340;&#2381;&#2357; &#2361;&#2376;&#2404; &#2319;&#2325;&#2381;&#2335;&#2367;&#2344;&#2366;&#2311;&#2337; &#2351;&#2366; &#2319;&#2325;&#2381;&#2335;&#2367;&#2344;&#2377;&#2311;&#2337; &#2358;&#2381;&#2352;&#2371;&#2306;&#2326;&#2354;&#2366; - 89 &#2360;&#2375; 103 &#2340;&#2325; &#2346;&#2352;&#2350;&#2366;&#2339;&#2369; &#2325;&#2381;&#2352;&#2350;&#2366;&#2306;&#2325; &#2357;&#2366;&#2354;&#2375; 15 &#2343;&#2366;&#2340;&#2381;&#2357;&#2367;&#2325; &#2352;&#2366;&#2360;&#2366;&#2351;&#2344;&#2367;&#2325; &#2340;&#2340;&#2381;&#2357;&#2404;</span></p>\n",
                    correct: "b",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "13",
                    section: "18",
                    question_en: "<p><span style=\"font-family: Roboto;\">13.</span><span style=\"font-family: Roboto;\"> The compound in which a hydroxy group, -OH, is attached to a saturated carbon atom which has two other carbon atoms attached to it is called ________. </span></p>\n",
                    question_hi: "<p><span style=\"font-family: Roboto;\">13.</span><span style=\"font-family: Roboto;\"> </span><span style=\"font-family: Palanquin;\">&#2357;&#2361; &#2351;&#2380;&#2327;&#2367;&#2325; &#2332;&#2367;&#2360;&#2350;&#2375;&#2306; &#2319;&#2325; &#2361;&#2366;&#2311;&#2337;&#2381;&#2352;&#2377;&#2325;&#2381;&#2360;&#2368; &#2360;&#2350;&#2370;&#2361; \'-OH\' &#2319;&#2325; &#2360;&#2306;&#2340;&#2371;&#2346;&#2381;&#2340; &#2325;&#2366;&#2352;&#2381;&#2348;&#2344; &#2346;&#2352;&#2350;&#2366;&#2339;&#2369; &#2360;&#2375; &#2332;&#2369;&#2337;&#2364;&#2366; &#2361;&#2379;&#2340;&#2366; &#2361;&#2376; &#2332;&#2367;&#2360;&#2325;&#2375; &#2360;&#2366;&#2341; &#2342;&#2379; &#2309;&#2344;&#2381;&#2351; &#2325;&#2366;&#2352;&#2381;&#2348;&#2344; &#2346;&#2352;&#2350;&#2366;&#2339;&#2369; &#2332;&#2369;&#2337;&#2364;&#2375; &#2361;&#2379;&#2340;&#2375; &#2361;&#2376;&#2306;, &#2313;&#2360;&#2375; _________ &#2325;&#2361;&#2366; &#2332;&#2366;&#2340;&#2366; &#2361;&#2376;&#2404;</span></p>\n",
                    options_en: ["<p>aldehyde</p>\n", "<p>tertiary alcohol</p>\n", 
                                "<p>secondary alcohol</p>\n", "<p>primary alcohol</p>\n"],
                    options_hi: ["<p><span style=\"font-family: Palanquin;\">&#2319;&#2354;&#2381;&#2337;&#2367;&#2361;&#2366;&#2311;&#2337;</span><span style=\"font-family: Roboto;\"> </span></p>\n", "<p><span style=\"font-family: Palanquin;\">&#2340;&#2371;&#2340;&#2368;&#2351;&#2325; &#2319;&#2354;&#2381;&#2325;&#2379;&#2361;&#2354;</span></p>\n",
                                "<p><span style=\"font-family: Palanquin;\">&#2342;&#2381;&#2357;&#2367;&#2340;&#2368;&#2351;&#2325; &#2319;&#2354;&#2381;&#2325;&#2379;&#2361;&#2354;</span></p>\n", "<p><span style=\"font-family: Palanquin;\">&#2346;&#2381;&#2352;&#2366;&#2341;&#2350;&#2367;&#2325; &#2319;&#2354;&#2381;&#2325;&#2379;&#2361;&#2354;</span></p>\n"],
                    solution_en: "<p><span style=\"font-family: Roboto;\">13.(c) </span><strong>Secondary alcohol</strong><span style=\"font-weight: 400;\">. Aldehydes - A member of a class of organic chemical compounds represented by the general structural formula R-CHO.</span><strong> Tertiary alcohol -</strong><span style=\"font-weight: 400;\"> A compound in which a hydroxyl group, &#8210;OH, is attached to a saturated carbon atom which has three other carbon atoms attached to it. </span><strong>Primary alcohol </strong><span style=\"font-weight: 400;\">- An alcohol in which the hydroxyl group is bonded to a primary carbon atom.</span></p>\n",

                    solution_en: "<p><span style=\"font-family: Roboto;\">14.(d) <strong>S</strong></span><strong><span style=\"font-family: Roboto;\">ulphur</span></strong><span style=\"font-family: Roboto;\">. </span><span style=\"font-family: Roboto;\">Onions, leeks and chives also contain Sulphur. Seafoods are rich in iodine. When garlic is crushed, chopped, or otherwise damaged, enzymes in the garlic cells react with sulfur-containing compounds called allicin and an enzyme called alliinase. This reaction forms a variety of sulfur-containing compounds, such as allicin, ajoene etc. Allicin, in particular, is responsible for the pungent smell of garlic. </span></p>\n",

                questions.push({
                    id: "15",
                    section: "misc",
                    question_en: "<p>15. <span style=\"font-family: Roboto;\">When did Dmitri Mendeleev invent the periodic table, ordering the symbols of the chemical elements according to their atomic weights?</span></p>\n",
                    question_hi: "<p>15. <span style=\"font-family: Palanquin;\">&#2342;&#2367;&#2350;&#2367;&#2340;&#2381;&#2352;&#2368; &#2350;&#2375;&#2306;&#2337;&#2354;&#2368;&#2357; &#2344;&#2375; &#2310;&#2357;&#2352;&#2381;&#2340; &#2360;&#2366;&#2352;&#2339;&#2368; &#2325;&#2366; &#2310;&#2357;&#2367;&#2359;&#2381;&#2325;&#2366;&#2352; &#2325;&#2348; &#2325;&#2367;&#2351;&#2366; &#2341;&#2366;, &#2332;&#2367;&#2360;&#2350;&#2375;&#2306; &#2352;&#2366;&#2360;&#2366;&#2351;&#2344;&#2367;&#2325; &#2340;&#2340;&#2381;&#2357;&#2379;&#2306; &#2325;&#2375; &#2346;&#2381;&#2352;&#2340;&#2368;&#2325;&#2379;&#2306; &#2325;&#2379; &#2313;&#2344;&#2325;&#2375; &#2346;&#2352;&#2350;&#2366;&#2339;&#2369; &#2349;&#2366;&#2352; &#2325;&#2375; &#2309;&#2344;&#2369;&#2360;&#2366;&#2352; &#2325;&#2381;&#2352;&#2350;&#2348;&#2342;&#2381;&#2343; &#2325;&#2367;&#2351;&#2366; &#2327;&#2351;&#2366; &#2341;&#2366;?</span></p>\n",

                    solution_en: "<p><span style=\"font-family: Roboto;\">15.(b) <strong>1869. Dmitri Mendeleev Periodic Table - Merits </strong>:-</span><span style=\"font-family: Roboto;\"> Some gaps were left for the elements yet to be discovered. Thus, if a certain new element is discovered, it can be placed in a new group without disturbing any existing group. </span><span style=\"font-family: Roboto;\"><strong>Demerits</strong>:- </span><span style=\"font-family: Roboto;\">He was unable to locate hydrogen in the periodic table. Increase in atomic mass was not regular while moving from one element to another. </span></p>\n",
                    solution_hi: "<p>15.(b)<span style=\"font-family: Roboto;\">&nbsp;</span><span style=\"font-weight: 400;\">&nbsp;</span><strong>1869&#2404; </strong><span style=\"font-weight: 400;\">&nbsp;</span><strong>&#2342;&#2367;&#2350;&#2367;&#2340;&#2381;&#2352;&#2368; &#2350;&#2375;&#2306;&#2337;&#2375;&#2354;&#2368;&#2357; &#2310;&#2357;&#2352;&#2381;&#2340; &#2360;&#2366;&#2352;&#2339;&#2368; </strong><span style=\"font-weight: 400;\">- </span><strong>&#2327;&#2369;&#2339;:-</strong><span style=\"font-weight: 400;\"> &#2309;&#2349;&#2368; &#2340;&#2325; &#2326;&#2379;&#2332;&#2375; &#2332;&#2366;&#2344;&#2375; &#2357;&#2366;&#2354;&#2375; &#2340;&#2340;&#2381;&#2357;&#2379;&#2306; &#2325;&#2375; &#2354;&#2367;&#2319; &#2325;&#2369;&#2331; &#2309;&#2306;&#2340;&#2352;&#2366;&#2354; &#2331;&#2379;&#2337;&#2364;&#2375; &#2327;&#2319; &#2341;&#2375;&#2404; &#2311;&#2360; &#2346;&#2381;&#2352;&#2325;&#2366;&#2352;, &#2351;&#2342;&#2367; &#2319;&#2325; &#2344;&#2367;&#2358;&#2381;&#2330;&#2367;&#2340; &#2344;&#2319; &#2340;&#2340;&#2381;&#2357; &#2325;&#2368; &#2326;&#2379;&#2332; &#2325;&#2368; &#2332;&#2366;&#2340;&#2368; &#2361;&#2376;, &#2340;&#2379; &#2313;&#2360;&#2375; &#2325;&#2367;&#2360;&#2368; &#2349;&#2368; &#2313;&#2346;&#2360;&#2381;&#2341;&#2367;&#2340; &#2360;&#2350;&#2370;&#2361; &#2325;&#2379; &#2352;&#2367;&#2325;&#2381;&#2340; &#2360;&#2381;&#2341;&#2366;&#2344; &#2350;&#2375;&#2306; &#2348;&#2367;&#2344;&#2366; &#2319;&#2325; &#2344;&#2319; &#2360;&#2350;&#2370;&#2361; &#2350;&#2375;&#2306; &#2352;&#2326;&#2366; &#2332;&#2366; &#2360;&#2325;&#2340;&#2366; &#2361;&#2376;&#2404; </span><strong>&#2309;&#2357;&#2327;&#2369;&#2339;</strong><span style=\"font-weight: 400;\">:- &#2357;&#2361; &#2310;&#2357;&#2352;&#2381;&#2340; &#2360;&#2366;&#2352;&#2339;&#2368; &#2350;&#2375;&#2306; &#2361;&#2366;&#2311;&#2337;&#2381;&#2352;&#2379;&#2332;&#2344; &#2325;&#2366; &#2346;&#2340;&#2366; &#2354;&#2327;&#2366;&#2344;&#2375; &#2350;&#2375;&#2306; &#2309;&#2360;&#2350;&#2352;&#2381;&#2341; &#2341;&#2366;&#2404; &#2319;&#2325; &#2340;&#2340;&#2381;&#2357; &#2360;&#2375; &#2342;&#2370;&#2360;&#2352;&#2375; &#2340;&#2340;&#2381;&#2357; &#2350;&#2375;&#2306; &#2332;&#2366;&#2344;&#2375; &#2346;&#2352; &#2346;&#2352;&#2350;&#2366;&#2339;&#2369; &#2342;&#2381;&#2352;&#2357;&#2381;&#2351;&#2350;&#2366;&#2344; &#2350;&#2375;&#2306; &#2357;&#2371;&#2342;&#2381;&#2343;&#2367; &#2344;&#2367;&#2351;&#2350;&#2367;&#2340; &#2344;&#2361;&#2368;&#2306; &#2341;&#2368;&#2404;</span></p>\n",
                    correct: "b",

            // Generate question boxes
            const boxesContainer = document.getElementById('question-boxes');
            questions.forEach((q, index) => {
                const box = document.createElement('div');

                box.textContent = index + 1;

                boxesContainer.appendChild(box);

            // Show first question
            showQuestion(0);

        // Show a specific question
        
        function formatContent(text) {
            if (!text) return '';
            return text.replace(/<img/g, '<img style="max-width:100%;height:auto;"');
        }
        
        function showQuestion(index) {
            if (index < 0 || index >= questions.length) return;
            
            currentQuestion = index;
            const question = questions[index];
            
            // Update question counter
            document.getElementById('question-counter').textContent = `Question ${index + 1} of ${questions.length}`;
            
            // Update question boxes
            document.querySelectorAll('.q-box').forEach(box => box.classList.remove('current'));
            document.getElementById(`box-${index}`).classList.add('current');
            
            // Generate question HTML
            let html = `
                <div class="question-card">
                    <div class="question-text">
                        <div class="en">${formatContent(question.question_en)}</div>
                        <div class="hi" style="display:none">${formatContent(question.question_hi)} </div>
                    </div>
                    <div class="options" id="options-container">`;
            
            // Add options
            ['a', 'b', 'c', 'd'].forEach((opt, i) => {
                let optionClass = '';
                let isCorrectAnswer = opt === question.correct;
                let isUserAnswer = answers[question.id] === opt;
                
                // When reviewing, add appropriate classes
                if (submitted) {
                    if (isCorrectAnswer) {
                        optionClass += ' correct-answer';
                    } else if (isUserAnswer && !isCorrectAnswer) {
                        optionClass += ' incorrect';
                    }
                }
                
                html += `
                    <div class="option-item">
                        <input class="option-input" type="radio" name="q${index}" 
                            id="opt-${index}-${opt}" value="${opt}" 
                            ${isUserAnswer ? 'checked' : ''}
                            onclick="selectAnswer('${question.id}', '${opt}')">
                       <label class="option-label${optionClass}" for="opt-${index}-${opt}">
                            <div class="en">${question.options_en[i]}</div>
                            <div class="hi" style="display:none">${question.options_hi[i]}</div>
                        </label>
                    </div>`;
            });
            
            // Add solution if submitted
            if (submitted) {
                const isCorrect = answers[question.id] === question.correct;
                const resultText = answers[question.id] ? (isCorrect ? 'Correct!' : 'Incorrect!') : 'Not attempted';
                
                html += `
                    <div class="solution-container">
                        <div class="solution-title">${resultText}</div>
                        <div class="solution-text">
                            <div class="en">${question.solution_en}</div>
                            <div class="hi" style="display:none">${question.solution_hi}</div>
                        </div>
                    </div>`;
            }
            
            html += `</div></div>`;
            
            document.getElementById('questions-container').innerHTML = html;
            
            // Apply language settings
            applyLanguage();
            
            // If in mobile view, close the menu
            if (window.innerWidth < 992) {
                toggleNav(false);
            }
            
            // Add review mode class if submitted
            if (submitted) {
                document.getElementById('options-container').classList.add('review-mode');
            }
        }
        
        // Apply current language
        function applyLanguage() {
            document.querySelectorAll(`.${currentLang}`).forEach(el => el.style.display = 'block');
            document.querySelectorAll(`.${currentLang === 'en' ? 'hi' : 'en'}`).forEach(el => el.style.display = 'none');
            
            // Update language button text
            document.getElementById('lang-text').textContent = currentLang === 'en' ? 'Hi' : 'En';
        }
        
        // Select an answer
        function selectAnswer(qId, option) {
            if (submitted) return;
            
            answers[qId] = option;
            updateProgress();
            
            // Mark question as attempted in the navigation
            const index = questions.findIndex(q => q.id === qId);
            if (index >= 0) {
                const box = document.getElementById(`box-${index}`);
                box.classList.add('attempted');
                box.classList.remove('unattempted');
            }
        }
        
        // Navigate to previous/next question
        function prevQuestion() { 
            if (currentQuestion > 0) showQuestion(currentQuestion - 1); 
        }
        
        function nextQuestion() { 
            if (currentQuestion < questions.length - 1) showQuestion(currentQuestion + 1); 
        }
        
        // Switch section
        function switchSection(sectionId) {
            if (sectionId === 'all') {
                showQuestion(0);
                return;
            }
            
            const section = sections[sectionId];
            if (section) showQuestion(section.start);
        }
        
        // Toggle language
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            applyLanguage();
        }
        
        // Toggle navigation sidebar
        function toggleNav(show) {
            const nav = document.getElementById('question-nav');
            const overlay = document.getElementById('nav-overlay');
            
            if (show === undefined) {
                show = !nav.classList.contains('show');
            }
            
            if (show) {
                nav.classList.add('show');
                overlay.classList.add('show');
                document.body.style.overflow = 'hidden';
            } else {
                nav.classList.remove('show');
                overlay.classList.remove('show');
                document.body.style.overflow = '';
            }
        }
        
        // Update progress
        function updateProgress() {
            const attempted = Object.keys(answers).length;
            document.getElementById('attempted-count').textContent = attempted;
        }
        
        // Start timer
        function startTimer() {
            const timerDisplay = document.getElementById('timer-display');
            let timeLeft = totalTime;
            
            const timerInterval = setInterval(() => {
                if (timeLeft <= 0 || submitted) {
                    clearInterval(timerInterval);
                    if (!submitted) submitTest();
                    return;
                }
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                timeLeft--;
            }, 1000);
        }
        
        // Confirm before submitting
        function confirmSubmit() {
            if (submitted) return;
            
            const attempted = Object.keys(answers).length;
            const remaining = questions.length - attempted;
            
            // Create a more modern confirmation dialog
            const confirmHtml = `
                <div style="text-align: center; padding: 20px;">
                    <h4 style="margin-bottom: 16px; color: var(--dark);">Confirm Submission</h4>
                    <p style="margin-bottom: 24px; color: var(--gray);">
                        You have attempted ${attempted} of ${questions.length} questions.<br>
                        ${remaining} questions are unattempted.
                    </p>
                    <div style="display: flex; justify-content: center; gap: 12px;">
                        <button onclick="this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; border: 1px solid var(--light-gray); background: white; border-radius: 8px; cursor: pointer;">
                            Cancel
                        </button>
                        <button onclick="submitTest(); this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer;">
                            Submit Test
                        </button>
                    </div>
                </div>`;
            
            // Create modal element
            const modal = document.createElement('div');
            modal.className = 'results-modal show';
            modal.innerHTML = `
                <div class="results-card" style="max-width: 400px;">
                    <button class="cancel-btn" style="position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--gray);" onclick="this.closest('.results-modal').remove()">
                        ×
                    </button>
                    ${confirmHtml}
                </div>`;
            
            document.body.appendChild(modal);
        }
        
        // Submit test
        function submitTest() {
            if (submitted) return;
            
            submitted = true;
            
            let score = 0;
            let correctCount = 0;
            let incorrectCount = 0;
            let unattemptedCount = 0;
            
            questions.forEach((q, index) => {
                const userAns = answers[q.id];
                const box = document.getElementById(`box-${index}`);
                
                box.classList.remove('attempted');
                
                if (!userAns) {
                    unattemptedCount++;
                    box.classList.add('unattempted');
                } else if (userAns === q.correct) {
                    correctCount++;
                    score += q.pos_marks;
                    box.classList.add('correct');
                } else {
                    incorrectCount++;
                    score -= q.neg_marks;
                    box.classList.add('incorrect');
                }
            });
            
            // Update result values
            document.getElementById('score-value').textContent = score.toFixed(2);
            document.getElementById('correct-value').textContent = correctCount;
            document.getElementById('incorrect-value').textContent = incorrectCount;
            document.getElementById('unattempted-value').textContent = unattemptedCount;
            
            // Show the results modal
            document.getElementById('results-modal').classList.add('show');
            
            // Disable submit button
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-check"></i>';
            submitBtn.style.backgroundColor = 'var(--success)';
            
            // Refresh current question view to show solution
            showQuestion(currentQuestion);
        }
        
        // Review test
        function reviewTest() {
            document.getElementById('results-modal').classList.remove('show');
            showQuestion(0);
        }
        
        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('results-modal')) {
                document.getElementById('results-modal').classList.remove('show');
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === 'ArrowRight') nextQuestion();
        });
    </script>
</body>
