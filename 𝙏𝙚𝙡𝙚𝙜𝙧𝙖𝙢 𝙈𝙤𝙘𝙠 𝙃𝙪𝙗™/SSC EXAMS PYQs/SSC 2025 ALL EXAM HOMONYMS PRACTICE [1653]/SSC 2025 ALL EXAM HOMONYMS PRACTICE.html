<head>

<title>SSC 2025 All Exam Homonyms Practice</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Hind:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --primary:#1a1a2e; --accent:#e94560; --gold:#f5a623;
    --teal:#0f7b6c; --light-bg:#f0f4ff; --text:#1a1a2e;
    --muted:#6b7280; --correct:#16a34a; --wrong:#dc2626;
    --shadow:0 4px 24px rgba(26,26,46,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Hind',sans-serif;background:var(--light-bg);color:var(--text);min-height:100vh;}

  /* HEADER */
  .site-header{background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);color:#fff;padding:24px 20px 18px;text-align:center;position:relative;overflow:hidden;}
  .site-header::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(229,69,96,.04) 0,rgba(229,69,96,.04) 1px,transparent 1px,transparent 14px);}
  .site-header h1{font-family:'Baloo 2',cursive;font-size:clamp(1.2rem,4vw,1.9rem);font-weight:800;position:relative;}
  .site-header h1 span{color:var(--gold);}
  .rule-box{margin:12px auto 0;max-width:660px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:10px 16px;font-size:.88rem;line-height:1.55;position:relative;}
  .rule-box strong{color:var(--gold);}
  .pdf-link{display:inline-block;margin-top:11px;background:var(--accent);color:#fff;padding:7px 20px;border-radius:50px;font-weight:700;text-decoration:none;font-size:.85rem;position:relative;transition:transform .15s,box-shadow .15s;}
  .pdf-link:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(233,69,96,.4);}
  .credit{margin-top:7px;font-size:.76rem;opacity:.65;position:relative;}

  /* TABS */
  .tab-bar{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;padding:14px 12px 10px;background:#fff;border-bottom:2px solid #e5e7eb;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.07);}
  .tab-btn{padding:7px 16px;border-radius:50px;border:2px solid transparent;font-family:'Baloo 2',cursive;font-weight:700;font-size:.82rem;cursor:pointer;background:var(--light-bg);color:var(--muted);transition:all .2s;white-space:nowrap;}
  .tab-btn:hover{background:var(--primary);color:#fff;border-color:var(--primary);}
  .tab-btn.active{background:var(--primary);color:#fff;border-color:var(--accent);box-shadow:0 2px 10px rgba(233,69,96,.25);}

  /* PART SECTION */
  .part-section{display:none;padding:18px 12px 50px;max-width:760px;margin:0 auto;}
  .part-section.active{display:block;}

  /* START SCREEN */
  .start-screen{text-align:center;padding:40px 20px;}
  .start-screen .part-title{font-family:'Baloo 2',cursive;font-size:1.4rem;font-weight:800;color:var(--primary);margin-bottom:6px;}
  .start-screen .part-sub{color:var(--muted);font-size:.92rem;margin-bottom:28px;}
  .start-btn{background:linear-gradient(135deg,var(--teal),#0a5a4e);color:#fff;border:none;padding:14px 40px;border-radius:50px;font-family:'Baloo 2',cursive;font-weight:800;font-size:1.1rem;cursor:pointer;box-shadow:0 4px 18px rgba(15,123,108,.35);transition:transform .15s,box-shadow .15s;}
  .start-btn:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(15,123,108,.45);}
  .start-icon{font-size:2.8rem;margin-bottom:14px;}

  /* QUIZ AREA */
  .quiz-area{display:none;}

  /* SCORE BAR */
  .score-bar{background:#fff;border-radius:12px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow);flex-wrap:wrap;gap:8px;}
  .score-label{font-weight:600;font-size:.88rem;color:var(--muted);}
  .score-value{font-family:'Baloo 2',cursive;font-weight:800;font-size:1.25rem;color:var(--teal);}
  .score-pill{background:var(--light-bg);border-radius:50px;padding:4px 13px;font-size:.78rem;font-weight:600;color:var(--primary);}

  /* PROGRESS */
  .progress-wrap{margin-bottom:14px;}
  .progress-top{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-bottom:5px;font-weight:600;}
  .progress-bar-outer{height:7px;background:#e5e7eb;border-radius:99px;overflow:hidden;}
  .progress-bar-inner{height:100%;background:linear-gradient(90deg,var(--teal),#16a34a);border-radius:99px;transition:width .4s ease;}

  /* QUESTION CARD */
  .q-card{background:#fff;border-radius:16px;padding:22px 20px 18px;box-shadow:var(--shadow);border-left:4px solid var(--primary);animation:slideIn .3s ease;}
  @keyframes slideIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  .q-num{font-family:'Baloo 2',cursive;font-size:.72rem;font-weight:700;color:var(--accent);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
  .q-text{font-size:1rem;font-weight:600;line-height:1.58;margin-bottom:16px;color:var(--text);}
  .q-text em{font-style:normal;background:#fff3cd;border-radius:4px;padding:1px 4px;}

  /* TIMER */
  .timer-wrap{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
  .timer-bar-outer{flex:1;height:7px;background:#e5e7eb;border-radius:99px;overflow:hidden;}
  .timer-bar-inner{height:100%;border-radius:99px;transition:width 1s linear,background .4s;}
  .timer-num{min-width:30px;text-align:right;font-weight:800;font-size:.9rem;color:var(--teal);font-family:'Baloo 2',cursive;}
  .timer-num.urgent{color:var(--accent);}

  /* OPTIONS */
  .options{display:flex;flex-direction:column;gap:9px;margin-bottom:14px;}
  .opt-btn{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border-radius:11px;border:2px solid #e5e7eb;background:#fafafa;cursor:pointer;font-family:'Hind',sans-serif;font-size:.93rem;text-align:left;transition:all .17s;color:var(--text);width:100%;}
  .opt-btn:hover:not(:disabled){background:#e8eaf6;border-color:var(--primary);}
  .opt-btn:disabled{cursor:default;}
  .opt-letter{min-width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;font-weight:700;font-size:.78rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s;}
  .opt-btn.correct{background:#f0fdf4;border-color:var(--correct);}
  .opt-btn.correct .opt-letter{background:var(--correct);}
  .opt-btn.wrong{background:#fef2f2;border-color:var(--wrong);}
  .opt-btn.wrong .opt-letter{background:var(--wrong);}
  .opt-btn.selected-pending{background:#e8eaf6;border-color:var(--primary);}
  .opt-btn.selected-pending .opt-letter{background:var(--primary);}

  /* SUBMIT BTN */
  .submit-wrap{text-align:center;margin-top:4px;}
  .submit-btn{background:var(--accent);color:#fff;border:none;padding:11px 36px;border-radius:50px;font-family:'Baloo 2',cursive;font-weight:800;font-size:1rem;cursor:pointer;box-shadow:0 3px 14px rgba(233,69,96,.3);transition:transform .15s,box-shadow .15s;display:none;}
  .submit-btn:hover{transform:translateY(-2px);box-shadow:0 5px 18px rgba(233,69,96,.45);}

  /* SOLUTION */
  .solution-box{background:linear-gradient(135deg,#f0fdf4,#e8f5e9);border:1.5px solid #86efac;border-radius:12px;padding:14px 16px;font-size:.88rem;line-height:1.72;display:none;color:#1a3a2e;margin-top:14px;}
  .solution-box.show{display:block;animation:fadeIn .3s ease;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .sol-word{font-family:'Baloo 2',cursive;font-size:1rem;font-weight:800;color:var(--primary);margin-bottom:4px;}
  .tg-link-inline{display:inline-block;margin-top:10px;background:#0088cc;color:#fff;padding:5px 14px;border-radius:50px;font-weight:600;font-size:.78rem;text-decoration:none;transition:opacity .15s;}
  .tg-link-inline:hover{opacity:.85;}

  /* NEXT BTN */
  .next-wrap{text-align:center;margin-top:14px;display:none;}
  .next-btn{background:var(--primary);color:#fff;border:none;padding:11px 36px;border-radius:50px;font-family:'Baloo 2',cursive;font-weight:800;font-size:1rem;cursor:pointer;box-shadow:0 3px 14px rgba(26,26,46,.25);transition:transform .15s,box-shadow .15s;}
  .next-btn:hover{transform:translateY(-2px);box-shadow:0 5px 18px rgba(26,26,46,.35);}

  /* RESULT SCREEN */
  .result-screen{display:none;text-align:center;padding:32px 20px;}
  .result-screen .trophy{font-size:3.5rem;margin-bottom:10px;}
  .result-screen h2{font-family:'Baloo 2',cursive;font-size:1.6rem;font-weight:800;color:var(--primary);margin-bottom:6px;}
  .result-score{font-family:'Baloo 2',cursive;font-size:3rem;font-weight:800;color:var(--teal);margin:10px 0;}
  .result-sub{color:var(--muted);font-size:.92rem;margin-bottom:24px;}
  .retry-btn{background:var(--accent);color:#fff;border:none;padding:12px 32px;border-radius:50px;font-family:'Baloo 2',cursive;font-weight:800;font-size:.95rem;cursor:pointer;box-shadow:0 3px 14px rgba(233,69,96,.3);transition:transform .15s;}
  .retry-btn:hover{transform:translateY(-2px);}
  .result-badges{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:16px 0;}
  .badge-item{background:#fff;border-radius:10px;padding:8px 14px;font-size:.8rem;font-weight:600;box-shadow:var(--shadow);}
  .badge-item.good{border-left:3px solid var(--correct);color:var(--correct);}
  .badge-item.bad{border-left:3px solid var(--wrong);color:var(--wrong);}

  /* FOOTER */
  .tg-banner{text-align:center;padding:18px 16px 30px;background:#fff;border-top:2px solid #e5e7eb;}
  .tg-banner a{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#0088cc,#005fa3);color:#fff;padding:11px 26px;border-radius:50px;text-decoration:none;font-family:'Baloo 2',cursive;font-weight:700;font-size:.95rem;box-shadow:0 4px 16px rgba(0,136,204,.3);transition:transform .15s,box-shadow .15s;}
  .tg-banner a:hover{transform:translateY(-2px);box-shadow:0 6px 22px rgba(0,136,204,.45);}

  @media(max-width:480px){.q-text{font-size:.93rem;}.opt-btn{font-size:.86rem;}}
</style>
</head>

// ══════════════════ QUESTION DATA ══════════════════
const PARTS = {

1:[
  {q:"Which sentence uses <em>row</em> to mean a fight or noisy argument?",opts:["We had a terrible row last night.","He rowed the boat across the lake.","They sat in the front row.","There were ten chairs in each row."],ans:0,word:"Row",meaning:"A noisy argument | झगड़ा या शोर-शराबा",usage:"Option A में 'a terrible row' = एक बड़े झगड़े से है। बाकी options में row = नाव चलाना या कतार।"},
  {q:"What does <em>bark</em> mean in 'The dog barked loudly at the stranger.'?",opts:["A loud sound made by a dog","The outer covering of a tree","A ship","A harsh command"],ans:0,word:"Bark",meaning:"The cry of a dog | कुत्ते का भौंकना",usage:"Sentence में कुत्ता अजनबी पर चिल्ला रहा है — bark = कुत्ते की आवाज़।"},
  {q:"Which sentence correctly uses <em>borne</em>?",opts:["The cost was borne by the company.","She was borne in 2002.","He borne the pain silently.","The child was borned yesterday."],ans:0,word:"Borne",meaning:"Carried or endured | वहन करना / सहन करना",usage:"Option A सही है — खर्च कंपनी द्वारा उठाया (वहन) गया। जन्म के लिए 'born' शब्द होता है।"},
  {q:"What does <em>bat</em> mean in 'A bat was flying in the dark sky.'?",opts:["A flying mammal","A cricket equipment","A wooden stick","A weapon"],ans:0,word:"Bat",meaning:"A nocturnal flying mammal | चमगादड़",usage:"Sentence में आसमान में उड़ने की बात है — bat = चमगादड़, न कि क्रिकेट का बल्ला।"},
  {q:"What is the meaning of <em>fair</em> in 'He was given a fair chance.'?",opts:["Just and reasonable","Light in colour","Exhibition","Pleasant weather"],ans:0,word:"Fair",meaning:"Just, equitable, unbiased | निष्पक्ष / उचित",usage:"fair chance = उचित मौका। Fair का दूसरा मतलब गोरा या मेला भी होता है।"},
  {q:"What does <em>spring</em> mean in 'Water flowed from a natural spring.'?",opts:["A natural source of water","A season","A jump","A metal coil"],ans:0,word:"Spring",meaning:"A natural water source | झरना / जल-स्रोत",usage:"Sentence में पानी बहने की बात है — spring = पानी का प्राकृतिक स्रोत।"},
  {q:"What does <em>kind</em> mean in 'What kind of book is this?'?",opts:["Type or category","Helpful","Gentle","Generous"],ans:0,word:"Kind",meaning:"Type, class, or category | प्रकार / किस्म",usage:"यहाँ किताब के प्रकार के बारे में पूछा जा रहा है। Kind का दूसरा मतलब दयालु भी होता है।"},
  {q:"What is the meaning of <em>bank</em> in 'He sat on the bank of the river.'?",opts:["The edge of a river","A financial institution","A place to save money","Trust"],ans:0,word:"Bank",meaning:"The sloping land beside a river | नदी का किनारा",usage:"Sentence में नदी का ज़िक्र है — bank = नदी का किनारा, न कि वित्तीय बैंक।"},
  {q:"What does <em>dove</em> mean in 'A white dove flew across the sky.'?",opts:["A bird","Past tense of dive","A peaceful act","A sudden movement"],ans:0,word:"Dove",meaning:"A type of bird | सफेद कबूतर (फाख्ता)",usage:"Sentence में आसमान में उड़ने की बात है — dove = पक्षी। Dove, dive का past tense भी होता है।"},
  {q:"What does <em>will</em> mean in 'He wrote his will before retiring.'?",opts:["A legal document","Desire","Future tense marker","Determination"],ans:0,word:"Will",meaning:"A legal document about property | वसीयतनामा",usage:"Sentence में लिखने और रिटायर होने की बात है — will = वसीयत।"},
  {q:"What does <em>light</em> mean in 'This suitcase is very light.'?",opts:["Not heavy","Bright","Ignition","Knowledge"],ans:0,word:"Light",meaning:"Having little weight | हल्का (वजन में कम)",usage:"यहाँ suitcase की बात है — light = वजन में कम। इसका दूसरा मतलब रोशनी भी है।"},
  {q:"What is the meaning of <em>match</em> in 'The football match was postponed.'?",opts:["A sports contest","A stick for lighting fire","Equality","A suitable pair"],ans:0,word:"Match",meaning:"A sports competition | खेल का मुकाबला",usage:"football match = खेल प्रतियोगिता। Match का दूसरा मतलब माचिस की तीली भी होता है।"},
  {q:"What does <em>fine</em> mean in 'He had to pay a fine.'?",opts:["Monetary penalty","Good","Thin","Excellent"],ans:0,word:"Fine",meaning:"A financial penalty | जुर्माना",usage:"Sentence में pay करने की बात है — fine = जुर्माना।"},
  {q:"What is the meaning of <em>right</em> in 'You are absolutely right.'?",opts:["Correct","Direction","Legal claim","Moral entitlement"],ans:0,word:"Right",meaning:"Correct or true | सही / सत्य",usage:"किसी की बात का समर्थन — right = correct (सही)।"},
  {q:"What is the meaning of <em>date</em> in 'What is the date today?'?",opts:["A particular day of the month","A social meeting","A fruit","A romantic partner"],ans:0,word:"Date",meaning:"A specific calendar day | तारीख / दिनांक",usage:"आज के दिन के बारे में पूछा जा रहा है — date = कैलेंडर की तारीख।"},
  {q:"What does <em>file</em> mean in 'Please submit the file by tomorrow.'?",opts:["A folder or collection of papers","A metal tool","A line of people","A signal"],ans:0,word:"File",meaning:"A folder for documents | दस्तावेज़ों की फ़ाइल",usage:"submit करने की बात — file = कागज़ात का फोल्डर।"},
  {q:"What does <em>mean</em> mean in 'What does this word mean?'?",opts:["To signify or indicate","Cruel","Average","Intended"],ans:0,word:"Mean",meaning:"To convey a message | मतलब / अर्थ होना",usage:"किसी शब्द का अर्थ पूछा जा रहा है — mean = signify करना।"},
  {q:"What is the meaning of <em>second</em> in 'I need a second opinion.'?",opts:["Another or additional","Unit of time","Position in order","Assistant"],ans:0,word:"Second",meaning:"Another or alternative | दूसरा / अतिरिक्त",usage:"second opinion = किसी अन्य एक्सपर्ट की अतिरिक्त सलाह।"},
  {q:"What does <em>charge</em> mean in 'The hotel did not charge extra money.'?",opts:["Ask as a price","Attack suddenly","Electrical energy","Accuse legally"],ans:0,word:"Charge",meaning:"To demand a fee | कीमत / शुल्क वसूलना",usage:"Sentence में पैसे न लेने की बात — charge = पैसे वसूलना।"},
  {q:"What is the meaning of <em>present</em> in 'All members were present at the meeting.'?",opts:["Being in attendance","A gift","Current time","Introduce"],ans:0,word:"Present",meaning:"Being at a specific place | उपस्थित / हाजिर",usage:"मीटिंग में सदस्यों के शामिल होने की बात — present = उपस्थित।"},
  {q:"What is the meaning of <em>yard</em> in 'The house has a large yard.'?",opts:["An open area of land","A unit of measurement","A rope","A tool"],ans:0,word:"Yard",meaning:"An open area around a house | आँगन / अहाता",usage:"घर के बड़े हिस्से की बात — yard = आँगन। Yard लंबाई की इकाई (गज) भी है।"},
],

2:[
  {q:"Which option is <em>NOT</em> a meaning of the homonym <em>content</em>?",opts:["Topics or material in a book/broadcast","A state of satisfaction or happiness","The amount of a substance in something","A container used for storing liquids"],ans:3,word:"Content",meaning:"Satisfaction / Subject matter | संतुष्ट / विषय-वस्तु",usage:"Content = संतुष्टि या किसी book/video की सामग्री। किसी container को content नहीं कहते — D सही answer है।"},

// ── INIT START SCREENS ──
function initStartScreens(){
  for(let p=1;p<=5;p++){
    const info = PART_INFO[p];
    const qs = PARTS[p];
    document.getElementById('start'+p).innerHTML = `
      <div class="start-icon">${info.icon}</div>
      <div class="part-title">${info.name}</div>
      <div class="part-sub">${qs.length} Questions &bull; 15 sec each &bull; Homonyms Practice</div>
      <button class="start-btn" onclick="startQuiz(${p})">&#9654; START QUIZ</button>
    `;
  }
}

function showPart(p, btn){
  document.querySelectorAll('.part-section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('part'+p).classList.add('active');
  btn.classList.add('active');
  for(let i=1;i<=5;i++){
    if(i!==p && S[i].timer){ clearInterval(S[i].timer); S[i].timer=null; }
  }
}

function startQuiz(p){
  S[p].qi=0; S[p].score=0; S[p].started=true;
  S[p].selectedOpt=null; S[p].answered=false;
  document.getElementById('start'+p).style.display='none';
  document.getElementById('quiz'+p).style.display='block';
  renderQuestion(p);
}

function renderQuestion(p){
  const qs = PARTS[p];
  const qi = S[p].qi;
  if(qi >= qs.length){ showResult(p); return; }
  S[p].selectedOpt = null;
  S[p].answered = false;
  const q = qs[qi];
  const total = qs.length;
  const pct = Math.round((qi/total)*100);

  document.getElementById('quiz'+p).innerHTML =
    '<div class="score-bar">' +
      '<span class="score-label">Score</span>' +
      '<span class="score-value">'+S[p].score+'/'+qi+'</span>' +
      '<span class="score-pill">Q '+(qi+1)+' / '+total+'</span>' +
    '</div>' +
    '<div class="progress-wrap">' +
      '<div class="progress-top"><span>Progress</span><span>'+pct+'%</span></div>' +
      '<div class="progress-bar-outer"><div class="progress-bar-inner" id="prog'+p+'" style="width:'+pct+'%"></div></div>' +
    '</div>' +
    '<div class="q-card">' +
      '<div class="q-num">Question '+(qi+1)+'</div>' +
      '<div class="timer-wrap">' +
        '<div class="timer-bar-outer"><div class="timer-bar-inner" id="tbar'+p+'" style="width:100%;background:var(--teal);"></div></div>' +
        '<div class="timer-num" id="tnum'+p+'">'+TIMER_SEC+'</div>' +
      '</div>' +
      '<div class="q-text">'+q.q+'</div>' +
      '<div class="options" id="opts'+p+'">' +
        q.opts.map(function(o,i){
          return '<button class="opt-btn" id="opt'+p+'_'+i+'" onclick="selectOpt('+p+','+i+')">' +
            '<span class="opt-letter">'+LETTERS[i]+'</span>' +
            '<span>'+o+'</span>' +
          '</button>';
        }).join('') +
      '</div>' +
      '<div class="submit-wrap">' +
        '<button class="submit-btn" id="submitBtn'+p+'" onclick="submitAnswer('+p+')" style="display:none;">&#10004; Submit Answer</button>' +
      '</div>' +
      '<div class="solution-box" id="sol'+p+'"></div>' +
    '</div>' +
    '<div class="next-wrap" id="nextWrap'+p+'" style="display:none;">' +
      '<button class="next-btn" onclick="nextQuestion('+p+')">'+(qi+1 < total ? 'Next Question &rarr;' : '&#127937; See Result')+'</button>' +
    '</div>';

  startTimer(p);
}

function selectOpt(p, i){
  if(S[p].answered) return;
  S[p].selectedOpt = i;
  PARTS[p][S[p].qi].opts.forEach(function(_,j){
    var btn = document.getElementById('opt'+p+'_'+j);
    btn.classList.remove('selected-pending');
  });
  document.getElementById('opt'+p+'_'+i).classList.add('selected-pending');
  document.getElementById('submitBtn'+p).style.display='inline-block';
}

function submitAnswer(p){
  if(S[p].answered) return;
  if(S[p].selectedOpt === null) return;
  S[p].answered = true;
  clearInterval(S[p].timer); S[p].timer = null;
  var q = PARTS[p][S[p].qi];
  var chosen = S[p].selectedOpt;
  var correct = q.ans;
  if(chosen === correct) S[p].score++;
  q.opts.forEach(function(_,j){
    var btn = document.getElementById('opt'+p+'_'+j);
    btn.disabled = true;
    btn.classList.remove('selected-pending');
    if(j===correct) btn.classList.add('correct');
    else if(j===chosen && chosen!==correct) btn.classList.add('wrong');
  });
  document.getElementById('submitBtn'+p).style.display='none';
  var icon = chosen===correct ? '&#9989;' : '&#10060;';
  var resultText = chosen===correct
    ? '<strong style="color:var(--correct)">&#10004; Sahi Jawab!</strong>'
    : '<strong style="color:var(--wrong)">&#10060; Galat!</strong> Sahi answer: <strong>'+LETTERS[correct]+'</strong>';
  var solBox = document.getElementById('sol'+p);
  solBox.innerHTML =
    '<div class="sol-word">'+icon+' '+q.word+'</div>' +
    '<div>'+resultText+'</div>' +
    '<div><strong>Meaning:</strong> '+q.meaning+'</div>' +
    '<div><strong>Explanation:</strong> '+q.usage+'</div>' +
    '<a class="tg-link-inline" href="'+TG+'" target="_blank">&#128242; Telegram Join Karen</a>';
  solBox.classList.add('show');
  document.getElementById('nextWrap'+p).style.display='block';
}

function startTimer(p){
  if(S[p].timer) clearInterval(S[p].timer);
  var sec = TIMER_SEC;
  S[p].timer = setInterval(function(){
    sec--;
    var tnum = document.getElementById('tnum'+p);
    var tbar = document.getElementById('tbar'+p);
    if(!tnum || !tbar){ clearInterval(S[p].timer); return; }
    tnum.textContent = sec;
    var pct = (sec/TIMER_SEC)*100;
    tbar.style.width = pct+'%';
    tbar.style.background = sec<=5 ? 'var(--accent)' : sec<=8 ? 'var(--gold)' : 'var(--teal)';
    if(sec<=5) tnum.classList.add('urgent'); else tnum.classList.remove('urgent');
    if(sec<=0){
      clearInterval(S[p].timer); S[p].timer=null;
      if(!S[p].answered){
        S[p].answered = true;
        var q = PARTS[p][S[p].qi];
        var correct = q.ans;
        q.opts.forEach(function(_,j){
          var btn = document.getElementById('opt'+p+'_'+j);
          if(btn){ btn.disabled=true; if(j===correct) btn.classList.add('correct'); }
        });
        document.getElementById('submitBtn'+p).style.display='none';
        var solBox = document.getElementById('sol'+p);
        solBox.innerHTML =
          '<div class="sol-word">&#9200; Time Up! &mdash; '+q.word+'</div>' +
          '<div><strong style="color:var(--accent)">Samay Khatam!</strong> Sahi answer: <strong>'+LETTERS[correct]+'</strong> &mdash; '+q.opts[correct]+'</div>' +
          '<div><strong>Meaning:</strong> '+q.meaning+'</div>' +
          '<div><strong>Explanation:</strong> '+q.usage+'</div>' +
          '<a class="tg-link-inline" href="'+TG+'" target="_blank">&#128242; Telegram Join Karen</a>';
        solBox.classList.add('show');
        document.getElementById('nextWrap'+p).style.display='block';
      }
    }
  },1000);
}

function nextQuestion(p){
  S[p].qi++;
  renderQuestion(p);
}

function showResult(p){
  var total = PARTS[p].length;
  var score = S[p].score;
  var pct = Math.round((score/total)*100);
  var trophy='&#127942;', msg='';
  if(pct>=80){trophy='&#127942;';msg='Excellent! Bahut Badhiya!';}
  else if(pct>=60){trophy='&#129352;';msg='Good Job! Accha Prayas!';}
  else if(pct>=40){trophy='&#129353;';msg='Keep Practicing! Aur Mehnat Karo!';}
  else{trophy='&#128218;';msg='Keep Studying! Padhte Raho!';}
  document.getElementById('quiz'+p).innerHTML =
    '<div class="result-screen" style="display:block">' +
      '<div class="trophy">'+trophy+'</div>' +
      '<h2>'+PART_INFO[p].name+'</h2>' +
      '<div class="result-score">'+score+'/'+total+'</div>' +
      '<div class="result-sub">'+msg+'<br>'+pct+'% Correct</div>' +
      '<div class="result-badges">' +
        '<div class="badge-item good">&#10003; Correct: '+score+'</div>' +
        '<div class="badge-item bad">&#10007; Wrong: '+(total-score)+'</div>' +
        '<div class="badge-item">&#128202; Score: '+pct+'%</div>' +
      '</div>' +
      '<button class="retry-btn" onclick="retryQuiz('+p+')">&#128260; Retry</button>' +
    '</div>';
}

function retryQuiz(p){
  S[p].qi=0; S[p].score=0; S[p].selectedOpt=null; S[p].answered=false;
  renderQuestion(p);
}

initStartScreens();
</script>
</body>
</html>
