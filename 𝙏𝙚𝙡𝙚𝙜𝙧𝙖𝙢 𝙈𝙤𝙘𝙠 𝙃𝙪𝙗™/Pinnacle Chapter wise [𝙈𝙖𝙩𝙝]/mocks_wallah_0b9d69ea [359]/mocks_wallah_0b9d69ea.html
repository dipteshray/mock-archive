                });
                questions.push({
                    id: "19",
                    section: "17",
                    question_en: "<p>19. <span style=\"font-family: Gungsuh;\">AB is a chord of a circle with center O. C is a point on the circle in the minor sector. If &ang;ABO =<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>50</mn><mi>o</mi></msup></math></span><span style=\"font-family: Gungsuh;\">, the what is the degree measure of &ang;ACB?</span></p>",
                    question_hi: "<p>19.<span style=\"font-family: Arial Unicode MS;\"> AB, केंद्र O वाले वृत्त की जीवा है। C लघु त्रिज्यखंड में वृत्त पर एक बिंदु है। यदि &ang;ABO =<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>50</mn><mo>&#176;</mo></math> </span><span style=\"font-family: Arial Unicode MS;\">, तो &ang;ACB का अंश माप क्या है?</span></p>",
                    options_en: ["<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>100</mn><mi>o</mi></msup></math></p>", "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>130</mn><mi>o</mi></msup></math></p>", 
                                "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>110</mn><mi>o</mi></msup></math></p>", "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>140</mn><mi>o</mi></msup></math></p>"],
                    options_hi: ["<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>100</mn><mi>o</mi></msup></math></p>", "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>130</mn><mi>o</mi></msup></math></p>",
                                "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>110</mn><mi>o</mi></msup></math></p>", "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mn>140</mn><mi>o</mi></msup></math></p>"],
                    solution_en: "<p>19.(d) <span style=\"font-family: Times New Roman;\">According to the question,</span><br><span style=\"font-family: Gungsuh;\">Given, &ang; ABO = 50&deg;</span><br><span style=\"font-family: Times New Roman;\">Now in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mo>&#160;</mo><mi>A</mi><mi>B</mi><mi>O</mi></math> </span><span style=\"font-family: Gungsuh;\">&nbsp;, &ang; ABO = &ang; OAB (opposite sides are equal as OA and OB is radius of circle)</span><br><span style=\"font-family: Gungsuh;\">&ang; AOB = 180&deg; - (50&deg; + 50&deg; ) = 80&deg;</span><br><span style=\"font-family: Times New Roman;\">Let D be any point on major arc of AB</span><br><span style=\"font-family: Gungsuh;\">&ang; ADB = 40&deg; (in a circle angle at circumference is half of angle at center if it is drawn from same arc)</span><br><span style=\"font-family: Gungsuh;\">&ang; ACB = 180&deg; - 40&deg; = 140&deg; (sum of opposite angle in a cyclic quadrilateral is 180&deg;)</span><br><br><strong id=\"docs-internal-guid-adf367ad-7fff-fa55-cbe6-296fb1f4fbb2\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXeaLZCK4wB9q40zP-iLHN72wzN2CQfhJtEDD5og9jKPJwhOPsfbiUjSRv6i8o0BeT0c92yaf8d0ByvA5GJ_Yz5X3205iVE9FlgKbmHjt1SGNl2uWISL_2NjSntKO7HPB5nlL8hx6yslx1XwDyTDrSAFOhE?key=M56oAc_EqYkyG7GjoWAH90OC\" width=\"161\" height=\"149\"></strong></p>",
                    solution_hi: "<p>19.(d) <span style=\"font-family: Baloo;\">प्रश्न के अनुसार,</span><br><span style=\"font-family: Arial Unicode MS;\">दिया गया है, &ang; ABO = 50&deg;</span><br><span style=\"font-family: Baloo;\">अब <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mo>&#160;</mo><mi>A</mi><mi>B</mi><mi>O</mi></math></span><span style=\"font-family: Arial Unicode MS;\"> में, &ang; ABO = &ang; OAB (विपरीत भुजाएँ OA के बराबर हैं और OB वृत्त की त्रिज्या है)</span><br><span style=\"font-family: Gungsuh;\">&ang; AOB = 180&deg; - (50&deg; + 50&deg; ) = 80&deg;</span><br><span style=\"font-family: Baloo;\">मान लीजिए कि, AB के दीर्घ चाप पर कोई बिंदु D है</span><br><span style=\"font-family: Arial Unicode MS;\">&ang; ADB = 40&deg; (एक वृत्त में परिधि पर कोण केंद्र पर कोण का आधा होता है यदि इसे एक ही चाप से खींचा जाता है)</span><br><span style=\"font-family: Arial Unicode MS;\">&ang; ACB = 180&deg; - 40&deg; = 140&deg; (चक्रीय चतुर्भुज में सम्मुख कोणों का योग 180 होता है)</span><br><br><strong id=\"docs-internal-guid-adf367ad-7fff-fa55-cbe6-296fb1f4fbb2\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXeaLZCK4wB9q40zP-iLHN72wzN2CQfhJtEDD5og9jKPJwhOPsfbiUjSRv6i8o0BeT0c92yaf8d0ByvA5GJ_Yz5X3205iVE9FlgKbmHjt1SGNl2uWISL_2NjSntKO7HPB5nlL8hx6yslx1XwDyTDrSAFOhE?key=M56oAc_EqYkyG7GjoWAH90OC\" width=\"161\" height=\"149\"></strong></p>",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "20",
                    section: "17",
                    question_en: "<p>20.<span style=\"font-family: Times New Roman;\"> In a triangle ABC, points P and Q are on AB and AC, respectively, such that AP = 4 cm and, PB = 6 cm, AQ = 5 cm and QC = 7.5 cm, If PQ = 6 cm, then find BC (in cm).</span></p>",
                    question_hi: "<p>20.<span style=\"font-family: Baloo;\"> एक त्रिभुज ABC में, बिंदु P और Q क्रमशः AB और AC पर इस प्रकार हैं कि AP = 4 cm और, PB = 6 cm , AQ = 5 cm और QC = 7.5 cm , यदि PQ = 6 cm , तो BC ( cm में) ज्ञात कीजिए।</span></p>",
                    options_en: ["<p>10</p>", "<p>9</p>", 
                                "<p>15</p>", "<p>12</p>"],
                    options_hi: ["<p>10</p>", "<p>9</p>",
                                "<p>15</p>", "<p>12</p>"],
                    solution_en: "<p>20.(c)<br><strong id=\"docs-internal-guid-7cacd512-7fff-f7ce-1a18-c4a6e15cb477\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXcviujZ8wBt83aQpoMntmmzhDgXc-JvnMhtCeLmj-PJ1zw9ZwQkhrSpvUR-DMjtt7Qwmpg95zvWmbJTs-aIq-tzDL5XMkqcwXOAnnaUBGemLVEMByeYtgQd-rjurEMZPrLx3UBSNKQ1sotWXgDI1OEu__s?key=M56oAc_EqYkyG7GjoWAH90OC\" width=\"183\" height=\"178\"></strong><br><span style=\"font-family: Times New Roman;\">In&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mo>&#160;</mo><mi>A</mi><mi>P</mi><mi>Q</mi><mo>&#160;</mo><mi>a</mi><mi>n</mi><mi>d</mi><mo>&#160;</mo><mi>&#916;</mi><mo>&#160;</mo><mi>A</mi><mi>B</mi><mi>C</mi></math></span><br><span style=\"font-family: Times New Roman;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>A</mi><mi>P</mi></mrow><mrow><mi>A</mi><mi>B</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mo>&#160;</mo><mi>A</mi><mi>Q</mi></mrow><mrow><mi>A</mi><mi>C</mi></mrow></mfrac><mo>&#8658;</mo><mfrac><mn>4</mn><mn>10</mn></mfrac><mo>=</mo><mfrac><mn>5</mn><mrow><mn>12</mn><mo>.</mo><mn>5</mn></mrow></mfrac><mo>&#8658;</mo><mfrac><mn>2</mn><mn>5</mn></mfrac><mo>&#160;</mo><mo>&#160;</mo></math></span><br><span style=\"font-family: Times New Roman;\">So, PQ<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>|</mo><mo>|</mo><mo>&#160;</mo></math></span><span style=\"font-family: Times New Roman;\">BC , and&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><mi>&#916;</mi><mo>&#160;</mo><mi>A</mi><mi>P</mi><mi>Q</mi><mo>~</mo><mi>&#916;</mi><mo>&#160;</mo><mi>A</mi><mi>B</mi><mi>C</mi></math></span><br><span style=\"font-family: Times New Roman;\"> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>P</mi><mi>Q</mi></mrow><mrow><mi>B</mi><mi>C</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>2</mn><mo>&#160;</mo></mrow><mn>5</mn></mfrac><mo>&#8658;</mo><mi>B</mi><mi>C</mi><mo>=</mo><mo>&#160;</mo><mfrac><mrow><mn>5</mn><mo>&#215;</mo><mn>6</mn><mo>&#160;</mo></mrow><mn>2</mn></mfrac><mo>=</mo><mn>15</mn><mo>&#160;</mo><mi>c</mi><mi>m</mi></math></span></p>",
                    solution_hi: "<p>20.(c)<br><strong id=\"docs-internal-guid-7cacd512-7fff-f7ce-1a18-c4a6e15cb477\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXcviujZ8wBt83aQpoMntmmzhDgXc-JvnMhtCeLmj-PJ1zw9ZwQkhrSpvUR-DMjtt7Qwmpg95zvWmbJTs-aIq-tzDL5XMkqcwXOAnnaUBGemLVEMByeYtgQd-rjurEMZPrLx3UBSNKQ1sotWXgDI1OEu__s?key=M56oAc_EqYkyG7GjoWAH90OC\" width=\"191\" height=\"186\"></strong><br><span style=\"font-family: Times New Roman;\"> </span><span style=\"font-family: Baloo;\"> <math style=\"font-family:Verdana\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><mi>&#916;</mi><mo>&#160;</mo><mi>A</mi><mi>P</mi><mi>Q</mi><mo>&#160;</mo><mi>&#2324;&#2352;</mi><mo>&#160;</mo><mo>&#160;</mo><mi>&#916;</mi><mo>&#160;</mo><mi>A</mi><mi>B</mi><mi>C</mi><mo>&#160;</mo></math>में,</span><br><span style=\"font-family: Baloo;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>A</mi><mi>P</mi></mrow><mrow><mi>A</mi><mi>B</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mi>A</mi><mi>Q</mi></mrow><mrow><mi>A</mi><mi>C</mi></mrow></mfrac><mo>&#8658;</mo><mfrac><mn>4</mn><mn>10</mn></mfrac><mo>=</mo><mfrac><mn>5</mn><mrow><mn>12</mn><mo>.</mo><mn>5</mn></mrow></mfrac><mo>&#8658;</mo><mfrac><mn>2</mn><mn>5</mn></mfrac><mo>&#160;</mo><mo>&#160;</mo></math></span><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>S</mi><mi>o</mi><mo>,</mo><mo>&#160;</mo><mi>P</mi><mi>Q</mi><mo>&#160;</mo><mo>|</mo><mo>|</mo><mo>&#160;</mo><mi>B</mi><mi>C</mi><mo>&#160;</mo><mo>,</mo><mo>&#160;</mo><mi>&#2324;&#2352;</mi><mo>&#160;</mo><mo>&#160;</mo><mi>&#916;</mi><mo>&#160;</mo><mi>A</mi><mi>P</mi><mi>Q</mi><mo>~</mo><mi>&#916;</mi><mo>&#160;</mo><mi>A</mi><mi>B</mi><mi>C</mi><mo>&#160;</mo><mo>&#160;</mo></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mi>P</mi><mi>Q</mi></mrow><mrow><mi>B</mi><mi>C</mi></mrow></mfrac><mo>=</mo><mfrac><mrow><mo>&#160;</mo><mn>2</mn></mrow><mn>5</mn></mfrac><mo>&#8658;</mo><mi>B</mi><mi>C</mi><mo>=</mo><mfrac><mrow><mo>&#160;</mo><mn>5</mn><mo>&#215;</mo><mn>6</mn><mo>&#160;</mo><mo>&#160;</mo><mo>&#160;</mo></mrow><mn>2</mn></mfrac><mo>=</mo><mn>15</mn><mo>&#160;</mo><mi>c</mi><mi>m</mi></math></p>",
                    correct: "c",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "21",
                    section: "misc",
                    question_en: "<p>21.<span style=\"font-family: Gungsuh;\"> In a circle center O. PQ and QR are two chords such that &ang;PQR =<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>118</mn><mo>&#176;</mo></math> </span><span style=\"font-family: Gungsuh;\">. What is the Measure of &ang;OPR?</span></p>",
                    question_hi: "<p>21. <span style=\"font-family: Arial Unicode MS;\">एक वृत्त केंद्र O में, PQ और QR दो जीवाएँ इस प्रकार हैं कि &ang;PQR =<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>118</mn><mo>&#176;</mo></math> </span><span style=\"font-family: Arial Unicode MS;\">, &ang;OPR का माप क्या है?</span></p>",
                    options_en: ["<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>36</mn><mo>&#176;</mo></math></p>", "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>26</mn><mo>&#176;</mo></math></p>", 
                                "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>31</mn><mo>&#176;</mo></math></p>", "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>28</mn><mo>&#176;</mo></math></p>"],
                    options_hi: ["<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>36</mn><mo>&#176;</mo></math></p>", "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>26</mn><mo>&#176;</mo></math></p>",
                                "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>31</mn><mo>&#176;</mo></math></p>", "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>28</mn><mo>&#176;</mo></math></p>"],
                    solution_en: "<p>21.(d)<br><img src=\"https://ssccglpinnacle.com/images/mceu_78401513011690605157516.png\" width=\"217\" height=\"185\"><br><span style=\"font-family: Gungsuh;\">Given that &ang; PQR = 118&deg;</span><br><span style=\"font-family: Times New Roman;\">Let S be any point on major arc of PQ</span><br><span style=\"font-family: Gungsuh;\">&ang;PSR = 180&deg; - 118&deg; = 62&deg; (PQRS is a cyclic quadrilateral)</span><br><span style=\"font-family: Gungsuh;\">&ang;POR = 62&deg;&times;2 = 124&deg; (angle on center is twice the angle on circumference if arc is same)</span><br><span style=\"font-family: Times New Roman;\">Now in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mo>&#160;</mo><mi>P</mi><mi>O</mi><mi>R</mi></math></span><br><span style=\"font-family: Times New Roman;\">OP = OR (Radius)</span><br><span style=\"font-family: Gungsuh;\">So &ang;OPR = &ang; ORP = (let x)</span><br><span style=\"font-family: Times New Roman;\">x + x + 124&deg; = 180&deg;</span><br><span style=\"font-family: Times New Roman;\">2x = 56&deg;</span><br><span style=\"font-family: Times New Roman;\">x = 28&deg; </span></p>",
                    solution_hi: "<p>21.(d)<br><img src=\"https://ssccglpinnacle.com/images/mceu_44522635611690605179467.png\" width=\"213\" height=\"181\"><br><span style=\"font-family: Arial Unicode MS;\">दिया गया है कि,&ang; PQR = 118&deg;</span><br><span style=\"font-family: Baloo;\">मान लीजिए कि PQ के दीर्घ चाप पर कोई बिंदु S है</span><br><span style=\"font-family: Arial Unicode MS;\">&ang;PSR = 180&deg; - 118&deg; = 62&deg; (PQRS एक चक्रीय चतुर्भुज है)</span><br><span style=\"font-family: Arial Unicode MS;\">&ang;POR = 62&deg;&times;2 = 124&deg; (यदि चाप समान है तो केंद्र पर कोण परिधि पर कोण का दोगुना है)</span><br><span style=\"font-family: Baloo;\">अब <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#916;</mi><mo>&#160;</mo><mi>P</mi><mi>O</mi><mi>R</mi></math></span><span style=\"font-family: Baloo;\"> में,</span><br><span style=\"font-family: Baloo;\">OP = OR (त्रिज्या)</span><br><span style=\"font-family: Arial Unicode MS;\">अतः &ang;OPR = &ang; ORP = (मान लीजिए x)</span><br><span style=\"font-family: Times New Roman;\">x + x + 124&deg; = 180&deg;</span><br><span style=\"font-family: Times New Roman;\">2x = 56&deg;</span><br><span style=\"font-family: Times New Roman;\">x = 28&deg; </span></p>",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
            
            // Generate question boxes
            const boxesContainer = document.getElementById('question-boxes');
            questions.forEach((q, index) => {
                const box = document.createElement('div');
                box.className = 'q-box';
                box.textContent = index + 1;
                box.onclick = () => showQuestion(index);
                box.id = `box-${index}`;
                boxesContainer.appendChild(box);
            });
            
            // Show first question
            showQuestion(0);
            updateProgress();
        }
        
        // Show a specific question
        
        function formatContent(text) {
            if (!text) return '';
            return text.replace(/<img/g, '<img style="max-width:100%;height:auto;"');
        }
        
        function showQuestion(index) {
            if (index < 0 || index >= questions.length) return;
            
            currentQuestion = index;
            const question = questions[index];
            
            // Update question counter
            document.getElementById('question-counter').textContent = `Question ${index + 1} of ${questions.length}`;
            
            // Update question boxes
            document.querySelectorAll('.q-box').forEach(box => box.classList.remove('current'));
            document.getElementById(`box-${index}`).classList.add('current');
            
            // Generate question HTML
            let html = `
                <div class="question-card">
                    <div class="question-text">
                        <div class="en">${formatContent(question.question_en)}</div>
                        <div class="hi" style="display:none">${formatContent(question.question_hi)} </div>
                    </div>
                    <div class="options" id="options-container">`;
            
            // Add options
            ['a', 'b', 'c', 'd'].forEach((opt, i) => {
                let optionClass = '';
                let isCorrectAnswer = opt === question.correct;
                let isUserAnswer = answers[question.id] === opt;
                
                // When reviewing, add appropriate classes
                if (submitted) {
                    if (isCorrectAnswer) {
                        optionClass += ' correct-answer';
                    } else if (isUserAnswer && !isCorrectAnswer) {
                        optionClass += ' incorrect';
                    }
                }
                
                html += `
                    <div class="option-item">
                        <input class="option-input" type="radio" name="q${index}" 
                            id="opt-${index}-${opt}" value="${opt}" 
                            ${isUserAnswer ? 'checked' : ''}
                            onclick="selectAnswer('${question.id}', '${opt}')">
                       <label class="option-label${optionClass}" for="opt-${index}-${opt}">
                            <div class="en">${question.options_en[i]}</div>
                            <div class="hi" style="display:none">${question.options_hi[i]}</div>
                        </label>
                    </div>`;
            });
            
            // Add solution if submitted
            if (submitted) {
                const isCorrect = answers[question.id] === question.correct;
                const resultText = answers[question.id] ? (isCorrect ? 'Correct!' : 'Incorrect!') : 'Not attempted';
                
                html += `
                    <div class="solution-container">
                        <div class="solution-title">${resultText}</div>
                        <div class="solution-text">
                            <div class="en">${question.solution_en}</div>
                            <div class="hi" style="display:none">${question.solution_hi}</div>
                        </div>
                    </div>`;
            }
            
            html += `</div></div>`;
            
            document.getElementById('questions-container').innerHTML = html;
            
            // Apply language settings
            applyLanguage();
            
            // If in mobile view, close the menu
            if (window.innerWidth < 992) {
                toggleNav(false);
            }
            
            // Add review mode class if submitted
            if (submitted) {
                document.getElementById('options-container').classList.add('review-mode');
            }
        }
        
        // Apply current language
        function applyLanguage() {
            document.querySelectorAll(`.${currentLang}`).forEach(el => el.style.display = 'block');
            document.querySelectorAll(`.${currentLang === 'en' ? 'hi' : 'en'}`).forEach(el => el.style.display = 'none');
            
            // Update language button text
            document.getElementById('lang-text').textContent = currentLang === 'en' ? 'Hi' : 'En';
        }
        
        // Select an answer
        function selectAnswer(qId, option) {
            if (submitted) return;
            
            answers[qId] = option;
            updateProgress();
            
            // Mark question as attempted in the navigation
            const index = questions.findIndex(q => q.id === qId);
            if (index >= 0) {
                const box = document.getElementById(`box-${index}`);
                box.classList.add('attempted');
                box.classList.remove('unattempted');
            }
        }
        
        // Navigate to previous/next question
        function prevQuestion() { 
            if (currentQuestion > 0) showQuestion(currentQuestion - 1); 
        }
        
        function nextQuestion() { 
            if (currentQuestion < questions.length - 1) showQuestion(currentQuestion + 1); 
        }
        
        // Switch section
        function switchSection(sectionId) {
            if (sectionId === 'all') {
                showQuestion(0);
                return;
            }
            
            const section = sections[sectionId];
            if (section) showQuestion(section.start);
        }
        
        // Toggle language
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            applyLanguage();
        }
        
        // Toggle navigation sidebar
        function toggleNav(show) {
            const nav = document.getElementById('question-nav');
            const overlay = document.getElementById('nav-overlay');
            
            if (show === undefined) {
                show = !nav.classList.contains('show');
            }
            
            if (show) {
                nav.classList.add('show');
                overlay.classList.add('show');
                document.body.style.overflow = 'hidden';
            } else {
                nav.classList.remove('show');
                overlay.classList.remove('show');
                document.body.style.overflow = '';
            }
        }
        
        // Update progress
        function updateProgress() {
            const attempted = Object.keys(answers).length;
            document.getElementById('attempted-count').textContent = attempted;
        }
        
        // Start timer
        function startTimer() {
            const timerDisplay = document.getElementById('timer-display');
            let timeLeft = totalTime;
            
            const timerInterval = setInterval(() => {
                if (timeLeft <= 0 || submitted) {
                    clearInterval(timerInterval);
                    if (!submitted) submitTest();
                    return;
                }
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                timeLeft--;
            }, 1000);
        }
        
        // Confirm before submitting
        function confirmSubmit() {
            if (submitted) return;
            
            const attempted = Object.keys(answers).length;
            const remaining = questions.length - attempted;
            
            // Create a more modern confirmation dialog
            const confirmHtml = `
                <div style="text-align: center; padding: 20px;">
                    <h4 style="margin-bottom: 16px; color: var(--dark);">Confirm Submission</h4>
                    <p style="margin-bottom: 24px; color: var(--gray);">
                        You have attempted ${attempted} of ${questions.length} questions.<br>
                        ${remaining} questions are unattempted.
                    </p>
                    <div style="display: flex; justify-content: center; gap: 12px;">
                        <button onclick="this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; border: 1px solid var(--light-gray); background: white; border-radius: 8px; cursor: pointer;">
                            Cancel
                        </button>
                        <button onclick="submitTest(); this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer;">
                            Submit Test
                        </button>
                    </div>
                </div>`;
            
            // Create modal element
            const modal = document.createElement('div');
            modal.className = 'results-modal show';
            modal.innerHTML = `
                <div class="results-card" style="max-width: 400px;">
                    <button class="cancel-btn" style="position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--gray);" onclick="this.closest('.results-modal').remove()">
                        ×
                    </button>
                    ${confirmHtml}
                </div>`;
            
            document.body.appendChild(modal);
        }
        
        // Submit test
        function submitTest() {
            if (submitted) return;
            
            submitted = true;
            
            let score = 0;
            let correctCount = 0;
            let incorrectCount = 0;
            let unattemptedCount = 0;
            
            questions.forEach((q, index) => {
                const userAns = answers[q.id];
                const box = document.getElementById(`box-${index}`);
                
                box.classList.remove('attempted');
                
                if (!userAns) {
                    unattemptedCount++;
                    box.classList.add('unattempted');
                } else if (userAns === q.correct) {
                    correctCount++;
                    score += q.pos_marks;
                    box.classList.add('correct');
                } else {
                    incorrectCount++;
                    score -= q.neg_marks;
                    box.classList.add('incorrect');
                }
            });
            
            // Update result values
            document.getElementById('score-value').textContent = score.toFixed(2);
            document.getElementById('correct-value').textContent = correctCount;
            document.getElementById('incorrect-value').textContent = incorrectCount;
            document.getElementById('unattempted-value').textContent = unattemptedCount;
            
            // Show the results modal
            document.getElementById('results-modal').classList.add('show');
            
            // Disable submit button
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-check"></i>';
            submitBtn.style.backgroundColor = 'var(--success)';
            
            // Refresh current question view to show solution
            showQuestion(currentQuestion);
        }
        
        // Review test
        function reviewTest() {
            document.getElementById('results-modal').classList.remove('show');
            showQuestion(0);
        }
        
        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('results-modal')) {
                document.getElementById('results-modal').classList.remove('show');
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === 'ArrowRight') nextQuestion();
        });
    </script>
</body>
</html>
