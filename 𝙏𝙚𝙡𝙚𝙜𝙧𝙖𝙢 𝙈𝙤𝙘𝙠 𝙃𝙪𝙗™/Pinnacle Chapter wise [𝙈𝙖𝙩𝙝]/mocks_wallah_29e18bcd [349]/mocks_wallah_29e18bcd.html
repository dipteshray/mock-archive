                questions.push({
                    id: "19",
                    section: "17",
                    question_en: "<p>19.<span style=\"font-family: Times New Roman;\"> What is the least square number which is exactly divisible by 2,3,10,18 and 20?</span></p>",
                    question_hi: "<p>19.<span style=\"font-family: Baloo;\"> वह छोटी से छोटी वर्ग संख्या कौन सी है जो 2,3,10,18 और 20 से पूर्णतः विभाज्य है?</span></p>",
                    options_en: ["<p>900</p>", "<p>180</p>", 
                                "<p>196</p>", "<p>30</p>"],
                    options_hi: ["<p>900</p>", "<p>180</p>",
                                "<p>196</p>", "<p>30</p>"],
                    solution_en: "<p>19.(a) <span style=\"font-family: Times New Roman;\">Check by options only 900 and 180 are divisible by 2,3,10,18 and 20</span><br><span style=\"font-family: Times New Roman;\">But 180 is not a square number so 900 is our answer.</span></p>",
                    solution_hi: "<p><strong>19.(a) </strong><span style=\"font-weight: 400;\">विकल्पों द्वारा जाँच करके 900 और 180 2,3,10,18 और 20 से विभाज्य हैं।</span><br><span style=\"font-weight: 400;\">लेकिन, 180 एक वर्ग संख्या नहीं है, इसलिए 900 उत्तर है।</span></p>",
                    correct: "a",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "20",
                    section: "17",
                    question_en: "<p>20.<span style=\"font-family: Times New Roman;\"> If the number 48k2048p6 is divisible by 99 then (k &times; p) is equal to&nbsp;</span></p>",
                    question_hi: "<p>20.<span style=\"font-family: Baloo;\"> यदि संख्या 48k2048p6, 99 से विभाज्य है तो (k &times; p) इसके बराबर है:</span></p>",
                    options_en: ["<p>2</p>", "<p>6</p>", 
                                "<p>4</p>", "<p>0</p>"],
                    options_hi: ["<p>2</p>", "<p>6</p>",
                                "<p>4</p>", "<p>0</p>"],
                    solution_en: "<p>20.(d) <span style=\"font-family: Times New Roman;\">If 48k2048p6 is divisible by 99 then number is divisible by 9 and 11</span><br><span style=\"font-family: Times New Roman;\">So for checking divisibility by 11</span><br><span style=\"font-family: Times New Roman;\">4+k+0+8+6 = 8 +2 +4 + p</span><br><span style=\"font-family: Times New Roman;\">18 + k = 14 + p</span><br><span style=\"font-family: Times New Roman;\">p - k = 4 &hellip;&hellip;&hellip;.(1)</span><br><span style=\"font-family: Times New Roman;\">For checking divisibility by 9 sum of digits are divisible by 9</span><br><span style=\"font-family: Times New Roman;\">Sum = 32 + p + k</span><br><span style=\"font-family: Times New Roman;\">So for making it 36(divisible by 9)</span><br><span style=\"font-family: Times New Roman;\">p + k = 4 &hellip;&hellip;&hellip;.(2)</span><br><span style=\"font-family: Times New Roman;\">Solving 1 and 2</span><br><span style=\"font-family: Times New Roman;\">p = 4, k = 0</span><br><span style=\"font-family: Times New Roman;\">p&times;k = 4&times;0 = 0</span></p>",
                    solution_hi: "<p><strong>20.(d) </strong><span style=\"font-weight: 400;\">यदि 48k2048p6, 99 से विभाज्य है, तो संख्या 9 और 11 से विभाज्य है।</span><br><span style=\"font-weight: 400;\">अतः 11 से विभाज्यता की जाँच के लिए।</span><br><span style=\"font-weight: 400;\">4+k+0+8+6 = 8 +2 +4 + p</span><br><span style=\"font-weight: 400;\">18 + k = 14 + p</span><br><span style=\"font-weight: 400;\">p - k = 4 &hellip;&hellip;&hellip;.(1)</span><br><span style=\"font-weight: 400;\">9 से विभाज्यता की जाँच के लिए अंकों का योग 9 से विभाज्य है।</span><br><span style=\"font-weight: 400;\">योग =&nbsp; 32 + p + k&nbsp;</span><br><span style=\"font-weight: 400;\">तो, इसे 36 बनाने के लिए (9 से विभाज्य)</span><br><span style=\"font-weight: 400;\">p + k = 4 &hellip;&hellip;&hellip;.(2)</span><br><span style=\"font-weight: 400;\">1 और 2 को हल करके:</span><br><span style=\"font-weight: 400;\">p = 4, k = 0</span><br><span style=\"font-weight: 400;\">p&times;k = 4&times;0 = 0</span></p>",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "21",
                    section: "17",
                    question_en: "<p>21. <span style=\"font-family: Times New Roman;\">Which of the following is the smallest number that is a perfect square and is divisible by each of the numbers 6, 8, and 15?</span></p>",
                    question_hi: "<p>21. <span style=\"font-family: Baloo;\">निम्नलिखित में से कौन सी सबसे छोटी संख्या है जो एक पूर्ण वर्ग है और प्रत्येक संख्या 6, 8 और 15 से विभाज्य है?</span></p>",
                    options_en: ["<p>225</p>", "<p>121</p>", 
                                "<p>576</p>", "<p>3600</p>"],
                    options_hi: ["<p>225</p>", "<p>121</p>",
                                "<p>576</p>", "<p>3600</p>"],
                    solution_en: "<p>21.(d) <span style=\"font-family: Times New Roman;\">If we do factors of any perfect square then factors comes in pairs like [(a&times;a)&times;(b&times;b)&times;(c&times;c)]</span><br><span style=\"font-family: Times New Roman;\">Now according to the question our number is divisible by 6, 8, 15 so number must be LCM of 6,8,15 is 120</span><br><span style=\"font-family: Times New Roman;\">Now factors of 120 are (2&times;2&times;2&times;3&times;5) making these factors in pair for making it perfect square</span><br><span style=\"font-family: Times New Roman;\">Multiply it with (2&times;3&times;5)</span><br>(2&times;3&times;5) = [(2&times;2)(2&times;2)(3&times;3)(5&times;5)] = 3600<br><strong><span style=\"font-family: Times New Roman;\">Short trick:</span></strong><br><span style=\"font-family: Times New Roman;\">By options</span><br><span style=\"font-family: Times New Roman;\">Only 3600 satisfies given conditions</span></p>",
                    solution_hi: "<p>21.(d) <span style=\"font-family: Baloo;\">यदि हम किसी पूर्ण वर्ग के गुणनखंड करते हैं, तो गुणनखंड जोड़े में आते हैं जैसे [(a&times;a)&times;(b&times;b)&times;(c&times;c)]</span><br><span style=\"font-family: Baloo;\">अब प्रश्न के अनुसार, हमारी संख्या 6, 8, 15 से विभाज्य है इसलिए 6,8,15 का LCM 120 है।</span><br><span style=\"font-family: Baloo;\">अब 120 के गुणनखंड (2&times;2&times;2&times;3&times;5) इन कारकों को पूर्ण वर्ग बनाने के लिए युग्म बना रहे हैं।</span><br><span style=\"font-family: Baloo;\">इसे (2&times;3&times;5) से गुणा करें:</span><br>(2&times;3&times;5) = [(2&times;2)(2&times;2)(3&times;3)(5&times;5)] = 3600<br><span style=\"font-family: Times New Roman;\">Shortcut:</span><br><span style=\"font-family: Baloo;\">विकल्पों के अनुसार</span><br><span style=\"font-family: Baloo;\">केवल 3600 दी गई शर्तों को पूरा करते हैं</span></p>",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "22",
                    section: "17",
                    question_en: "<p>22.<span style=\"font-family: Times New Roman;\"> FInd the sum of the greatest and the smallest number which may replace k in the number 3281k6 to make it divisible by 6.</span></p>",
                    question_hi: "<p>22.<span style=\"font-family: Baloo;\"> सबसे बड़ी और सबसे छोटी संख्या का योग ज्ञात कीजिए जो 3281k6 संख्या में k को 6 से विभाज्य बनाने के लिए प्रतिस्थापित कर सकता है।</span></p>",
                    options_en: ["<p>9</p>", "<p>8</p>",

                    options_hi: ["<p>9</p>", "<p>8</p>",
                                "<p>5</p>", "<p>4</p>"],
                    solution_en: "<p>22.(b) <span style=\"font-family: Times New Roman;\">3281k6 is divisible by 6 , so it must be divisible by prime factors of 6 that is 2 and 3</span><br><span style=\"font-family: Times New Roman;\">It must be an even number so it is divisible by 2, and if the sum of digits of numbers is divisible by 3 then that number is divisible by 3. So</span><br>is divisible by 3 for k = 1,4,7<br><span style=\"font-family: Times New Roman;\">Sum of largest and smallest = (1 + 7 ) = 8</span></p>",
                    solution_hi: "<p>22.(b)&nbsp;<span style=\"font-weight: 400;\">3281k6, 6 से विभाज्य है, इसलिए इसे 6 के अभाज्य गुणनखंड अर्थात 2 और 3 से विभाज्य होना चाहिए।</span><br><span style=\"font-weight: 400;\">यह एक सम संख्या है इसलिए यह 2 से विभाज्य है, और यदि संख्याओं के अंकों का योग 3 से विभाज्य है तो, वह संख्या 3 से विभाज्य है।</span><br><span style=\"font-weight: 400;\">&nbsp;तो, (3+2+8+1+k+6), k = 1,4,7 के लिए 3 से विभाज्य है।</span><br><span style=\"font-weight: 400;\">सबसे बड़े और सबसे छोटे का योग =&nbsp; (1 + 7 ) = 8</span></p>\n<p>&nbsp;</p>",
                    correct: "b",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "23",
                    section: "17",
                    question_en: "<p>23. <span style=\"font-family: Times New Roman;\">What is the sum of the numbers between 400 and 500 such that when they are divided by 6,12 and 16, it leaves no remainder?</span></p>",
                    question_hi: "<p>23. <span style=\"font-family: Baloo;\">400 और 500 के बीच की संख्याओं का योग क्या है कि जब उन्हें 6,12 और 16 से विभाजित किया जाता है, तो कोई शेष नहीं रहता है?</span></p>",
                    options_en: ["<p>480</p>", "<p>1024</p>",

                    options_hi: ["<p>480</p>", "<p>1024</p>",

                    solution_en: "<p>23.(d) <span style=\"font-family: Times New Roman;\">LCM of 6,12,16 is 48</span><br><span style=\"font-family: Times New Roman;\">Multiple of 48 between 400 to 500 is 432 and 480</span><br><span style=\"font-family: Times New Roman;\">Sum = 432 + 480 = 912</span></p>",
                    solution_hi: "<p>23.(d) <span style=\"font-family: Baloo;\">6,12,16 का LCM 48 है।</span><br><span style=\"font-family: Baloo;\">400 से 500 के बीच 48 का गुणज 432 और 480 है।</span><br><span style=\"font-family: Baloo;\">योग = 432 + 480 = 912</span></p>",

                questions.push({
                    id: "24",
                    section: "17",
                    question_en: "<p>24.<span style=\"font-family: Times New Roman;\"> If a nine digit number 485x3678y is divisible by 72, then for the smallest value of x, the value of (2y-3x) is :</span></p>",
                    question_hi: "<p>24.<span style=\"font-family: Baloo;\"> यदि नौ अंकों की संख्या 485x3678y, 72 से विभाज्य है, तो x के सबसे छोटे मान के लिए (2y-3x) का मान है:</span></p>",
                    options_en: ["<p>6</p>", "<p>9</p>", 
                                "<p>11</p>", "<p>8</p>"],
                    options_hi: ["<p>6</p>", "<p>9</p>",
                                "<p>11</p>", "<p>8</p>"],
                    solution_en: "<p>24.(d) <span style=\"font-family: Times New Roman;\">485x3678y is divisible by 72 so it is definitely divisible by 8 and 9</span><br><span style=\"font-family: Times New Roman;\">If any number divisible by 8 then its last 3 digits is divisible by 8</span><br><span style=\"font-family: Times New Roman;\">So possible values of y = 4 (as 784 is divisible by 8)</span><br><span style=\"font-family: Times New Roman;\">If any number is divisible by 9 then sum of its digits is divisible by 9 = 45 + x is divisible by 9 so possible value of x is 0 and 9 as (45 and 54 are divisible by 9) but least value of x is 0</span><br><span style=\"font-family: Times New Roman;\">x= 0 , y = 4</span><br><span style=\"font-family: Times New Roman;\">2y - 3x = 2&times;4 - 3&times;0 = 8 - 0 = 8</span></p>",
                    solution_hi: "<p><span style=\"font-family: Times New Roman;\"><strong>24.(d)&nbsp;</strong></span><span style=\"font-weight: 400;\">485x3678y 72 से विभाज्य है इसलिए यह निश्चित रूप से 8 और 9 से विभाज्य है।</span><br><span style=\"font-weight: 400;\">यदि कोई संख्या 8 से विभाज्य है तो उसके अंतिम 3 अंक 8 से विभाज्य होंगे।</span><br><span style=\"font-weight: 400;\">तो y = 4 के संभावित मान (क्योंकि 784 ,8 से विभाज्य है)</span><br><span style=\"font-weight: 400;\">यदि कोई संख्या 9 से विभाज्य है तो इसके अंकों का योग 9 से विभाज्य है = 45 + x, 9 से विभाज्य है इसलिए x का संभावित मान 0 और 9 है क्योंकि (45 और 54, 9 से विभाज्य हैं) लेकिन x का न्यूनतम मान 0 है।</span><br><span style=\"font-weight: 400;\">x= 0 ,&nbsp; y = 4&nbsp;</span><br><span style=\"font-weight: 400;\">2y - 3x = 2&times;4 - 3&times;0 = 8 - 0 = 8</span><br><span style=\"font-family: Times New Roman;\">x= 0 , y = 4</span><br><span style=\"font-family: Times New Roman;\">2y - 3x = 2&times;4 - 3&times;0 = 8 - 0 = 8</span></p>",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "25",
                    section: "misc",
                    question_en: "<p>25.<span style=\"font-family: Times New Roman;\"> If a 10-digit number 54726x79y6 is divisible by 72, then what is the value of 5x - 3y, for the least value of y?</span></p>",
                    question_hi: "<p>25.<span style=\"font-family: Baloo;\"> यदि 10 अंकों की एक संख्या 54726x79y6 72 से विभाज्य है, तो y के न्यूनतम मान के लिए 5x - 3y का मान क्या होगा?</span></p>",
                    options_en: ["<p>17</p>", "<p>16</p>", 
                                "<p>19</p>", "<p>23</p>"],
                    options_hi: ["<p>17</p>", "<p>16</p>",
                                "<p>19</p>", "<p>23</p>"],
                    solution_en: "<p>25.(b) <span style=\"font-family: Times New Roman;\">54726x79y6 is divisible by 72 so it is definitely divisible by 8 and 9</span><br><span style=\"font-family: Times New Roman;\">If any number divisible by 8 then its last 3 digits is divisible by 8</span><br><span style=\"font-family: Times New Roman;\">So possible values of y = 3 and 7 , we take y = 3( as it is least between 7 and 3)</span><br><span style=\"font-family: Times New Roman;\">If any number is divisible by 9 then sum of its digits is divisible by 9 = 49 + x is divisible by 9 so possible value of x is 5 as 54 is divisible by 9</span><br><span style=\"font-family: Times New Roman;\">x= 5 , y = 3</span><br><span style=\"font-family: Times New Roman;\">5x - 3y = 5&times;5 - 3&times;3 = 25 - 9 = 16</span></p>",
                    solution_hi: "<p><span style=\"font-family: Times New Roman;\"><strong>25.(b)&nbsp;</strong></span><span style=\"font-weight: 400;\">54726x79y6 , 72 से विभाज्य है, इसलिए यह निश्चित रूप से 8 और 9 से विभाज्य है।</span><br><span style=\"font-weight: 400;\">यदि कोई संख्या 8 से विभाज्य है तो उसके अंतिम 3 अंक 8&nbsp; से विभाज्य होंगे</span><br><span style=\"font-weight: 400;\">इसलिए y = 3 और 7 के संभावित मान, हम y = 3 लेते हैं (क्योंकि यह 7 और 3 के बीच कम से कम है।)</span><br><span style=\"font-weight: 400;\">यदि कोई संख्या 9 से विभाज्य है तो इसके अंकों का योग 9 से विभाज्य होगा&nbsp; ( 49 + x)&nbsp; , 9 से विभाज्य है, इसलिए x का संभावित मान 5 है क्योंकि 54, 9 से विभाज्य है।</span><br><span style=\"font-weight: 400;\">x= 5 ,&nbsp; y = 3&nbsp;</span><br><span style=\"font-weight: 400;\">5x - 3y = 5&times;5 - 3&times;3 = 25 - 9 = 16</span></p>",
                    correct: "b",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
            
            // Generate question boxes
            const boxesContainer = document.getElementById('question-boxes');
            questions.forEach((q, index) => {
                const box = document.createElement('div');
                box.className = 'q-box';
                box.textContent = index + 1;
                box.onclick = () => showQuestion(index);
                box.id = `box-${index}`;
                boxesContainer.appendChild(box);
            });
            
            // Show first question
            showQuestion(0);
            updateProgress();
        }
        
        // Show a specific question
        
        function formatContent(text) {
            if (!text) return '';
            return text.replace(/<img/g, '<img style="max-width:100%;height:auto;"');
        }
        
        function showQuestion(index) {
            if (index < 0 || index >= questions.length) return;
            
            currentQuestion = index;
            const question = questions[index];
            
            // Update question counter
            document.getElementById('question-counter').textContent = `Question ${index + 1} of ${questions.length}`;
            
            // Update question boxes
            document.querySelectorAll('.q-box').forEach(box => box.classList.remove('current'));
            document.getElementById(`box-${index}`).classList.add('current');
            
            // Generate question HTML
            let html = `
                <div class="question-card">
                    <div class="question-text">
                        <div class="en">${formatContent(question.question_en)}</div>
                        <div class="hi" style="display:none">${formatContent(question.question_hi)} </div>
                    </div>
                    <div class="options" id="options-container">`;
            
            // Add options
            ['a', 'b', 'c', 'd'].forEach((opt, i) => {
                let optionClass = '';
                let isCorrectAnswer = opt === question.correct;
                let isUserAnswer = answers[question.id] === opt;
                
                // When reviewing, add appropriate classes
                if (submitted) {
                    if (isCorrectAnswer) {
                        optionClass += ' correct-answer';
                    } else if (isUserAnswer && !isCorrectAnswer) {
                        optionClass += ' incorrect';
                    }
                }
                
                html += `
                    <div class="option-item">
                        <input class="option-input" type="radio" name="q${index}" 
                            id="opt-${index}-${opt}" value="${opt}" 
                            ${isUserAnswer ? 'checked' : ''}
                            onclick="selectAnswer('${question.id}', '${opt}')">
                       <label class="option-label${optionClass}" for="opt-${index}-${opt}">
                            <div class="en">${question.options_en[i]}</div>
                            <div class="hi" style="display:none">${question.options_hi[i]}</div>
                        </label>
                    </div>`;
            });
            
            // Add solution if submitted
            if (submitted) {
                const isCorrect = answers[question.id] === question.correct;
                const resultText = answers[question.id] ? (isCorrect ? 'Correct!' : 'Incorrect!') : 'Not attempted';
                
                html += `
                    <div class="solution-container">
                        <div class="solution-title">${resultText}</div>
                        <div class="solution-text">
                            <div class="en">${question.solution_en}</div>
                            <div class="hi" style="display:none">${question.solution_hi}</div>
                        </div>
                    </div>`;
            }
            
            html += `</div></div>`;
            
            document.getElementById('questions-container').innerHTML = html;
            
            // Apply language settings
            applyLanguage();
            
            // If in mobile view, close the menu
            if (window.innerWidth < 992) {
                toggleNav(false);
            }
            
            // Add review mode class if submitted
            if (submitted) {
                document.getElementById('options-container').classList.add('review-mode');
            }
        }
        
        // Apply current language
        function applyLanguage() {
            document.querySelectorAll(`.${currentLang}`).forEach(el => el.style.display = 'block');
            document.querySelectorAll(`.${currentLang === 'en' ? 'hi' : 'en'}`).forEach(el => el.style.display = 'none');
            
            // Update language button text
            document.getElementById('lang-text').textContent = currentLang === 'en' ? 'Hi' : 'En';
        }
        
        // Select an answer
        function selectAnswer(qId, option) {
            if (submitted) return;
            
            answers[qId] = option;
            updateProgress();
            
            // Mark question as attempted in the navigation
            const index = questions.findIndex(q => q.id === qId);
            if (index >= 0) {
                const box = document.getElementById(`box-${index}`);
                box.classList.add('attempted');
                box.classList.remove('unattempted');
            }
        }
        
        // Navigate to previous/next question
        function prevQuestion() { 
            if (currentQuestion > 0) showQuestion(currentQuestion - 1); 
        }
        
        function nextQuestion() { 
            if (currentQuestion < questions.length - 1) showQuestion(currentQuestion + 1); 
        }
        
        // Switch section
        function switchSection(sectionId) {
            if (sectionId === 'all') {
                showQuestion(0);
                return;
            }
            
            const section = sections[sectionId];
            if (section) showQuestion(section.start);
        }
        
        // Toggle language
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            applyLanguage();
        }
        
        // Toggle navigation sidebar
        function toggleNav(show) {
            const nav = document.getElementById('question-nav');
            const overlay = document.getElementById('nav-overlay');
            
            if (show === undefined) {
                show = !nav.classList.contains('show');
            }
            
            if (show) {
                nav.classList.add('show');
                overlay.classList.add('show');
                document.body.style.overflow = 'hidden';
            } else {
                nav.classList.remove('show');
                overlay.classList.remove('show');
                document.body.style.overflow = '';
            }
        }
        
        // Update progress
        function updateProgress() {
            const attempted = Object.keys(answers).length;
            document.getElementById('attempted-count').textContent = attempted;
        }
        
        // Start timer
        function startTimer() {
            const timerDisplay = document.getElementById('timer-display');
            let timeLeft = totalTime;
            
            const timerInterval = setInterval(() => {
                if (timeLeft <= 0 || submitted) {
                    clearInterval(timerInterval);
                    if (!submitted) submitTest();
                    return;
                }
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                timeLeft--;
            }, 1000);
        }
        
        // Confirm before submitting
        function confirmSubmit() {
            if (submitted) return;
            
            const attempted = Object.keys(answers).length;
            const remaining = questions.length - attempted;
            
            // Create a more modern confirmation dialog
            const confirmHtml = `
                <div style="text-align: center; padding: 20px;">
                    <h4 style="margin-bottom: 16px; color: var(--dark);">Confirm Submission</h4>
                    <p style="margin-bottom: 24px; color: var(--gray);">
                        You have attempted ${attempted} of ${questions.length} questions.<br>
                        ${remaining} questions are unattempted.
                    </p>
                    <div style="display: flex; justify-content: center; gap: 12px;">
                        <button onclick="this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; border: 1px solid var(--light-gray); background: white; border-radius: 8px; cursor: pointer;">
                            Cancel
                        </button>
                        <button onclick="submitTest(); this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer;">
                            Submit Test
                        </button>
                    </div>
                </div>`;
            
            // Create modal element
            const modal = document.createElement('div');
            modal.className = 'results-modal show';
            modal.innerHTML = `
                <div class="results-card" style="max-width: 400px;">
                    <button class="cancel-btn" style="position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--gray);" onclick="this.closest('.results-modal').remove()">
                        ×
                    </button>
                    ${confirmHtml}
                </div>`;
            
            document.body.appendChild(modal);
        }
        
        // Submit test
        function submitTest() {
            if (submitted) return;
            
            submitted = true;
            
            let score = 0;
            let correctCount = 0;
            let incorrectCount = 0;
            let unattemptedCount = 0;
            
            questions.forEach((q, index) => {
                const userAns = answers[q.id];
                const box = document.getElementById(`box-${index}`);
                
                box.classList.remove('attempted');
                
                if (!userAns) {
                    unattemptedCount++;
                    box.classList.add('unattempted');
                } else if (userAns === q.correct) {
                    correctCount++;
                    score += q.pos_marks;
                    box.classList.add('correct');
                } else {
                    incorrectCount++;
                    score -= q.neg_marks;
                    box.classList.add('incorrect');
                }
            });
            
            // Update result values
            document.getElementById('score-value').textContent = score.toFixed(2);
            document.getElementById('correct-value').textContent = correctCount;
            document.getElementById('incorrect-value').textContent = incorrectCount;
            document.getElementById('unattempted-value').textContent = unattemptedCount;
            
            // Show the results modal
            document.getElementById('results-modal').classList.add('show');
            
            // Disable submit button
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-check"></i>';
            submitBtn.style.backgroundColor = 'var(--success)';
            
            // Refresh current question view to show solution
            showQuestion(currentQuestion);
        }
        
        // Review test
        function reviewTest() {
            document.getElementById('results-modal').classList.remove('show');
            showQuestion(0);
        }
        
        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('results-modal')) {
                document.getElementById('results-modal').classList.remove('show');
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === 'ArrowRight') nextQuestion();
        });
    </script>
</body>
</html>
