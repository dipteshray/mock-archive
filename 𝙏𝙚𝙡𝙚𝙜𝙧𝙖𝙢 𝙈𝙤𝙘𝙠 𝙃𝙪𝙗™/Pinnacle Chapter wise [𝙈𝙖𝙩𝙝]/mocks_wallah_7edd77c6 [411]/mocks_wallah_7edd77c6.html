                    options_hi: ["<p><span style=\"font-family: Cambria Math;\"> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>550</mn><mn>12</mn></mfrac></math> दिन</span></p>", "<p><span style=\"font-family: Cambria Math;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>85</mn><mn>4</mn></mfrac></math> </span><span style=\"font-family: Cambria Math;\"> दिन</span></p>",
                                "<p><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\"> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>71</mn><mn>2</mn></mfrac></math> </span><span style=\"font-family: Cambria Math;\">दिन</span></p>", "<p><span style=\"font-family: Cambria Math;\"> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>360</mn><mn>17</mn></mfrac></math> </span><span style=\"font-family: Cambria Math;\">दिन</span></p>"],
                    solution_en: "<p>10.(b)<br><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1676007977/word/media/image4.png\" width=\"205\" height=\"95\"><br><span style=\"font-family: Cambria Math;\">Total work is 120 units.</span><br><span style=\"font-family: Cambria Math;\">Ruchi&rsquo;s efficiency is 4 units. On every third day she is assisted by Khushi and Teju .</span><br><span style=\"font-family: Cambria Math;\">Work done in 3 days = 4 + 4 + (4 + 3 + 2) = 17 units</span><br><span style=\"font-family: Cambria Math;\">Work done in 21 days = 17 &times; 7 = 119 units</span><br><span style=\"font-family: Cambria Math;\">Remaining work = 120 units - 119 units = 1 units</span><br><span style=\"font-family: Cambria Math;\">On 22nd days ruchi work alone , time require to complete 1 unit of work by ruchi = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>4</mn></mfrac></math> </span><span style=\"font-family: Cambria Math;\">&nbsp;days.</span><br><span style=\"font-family: Cambria Math;\">Total days </span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>&#160;</mo><mfenced><mrow><mn>21</mn><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mfrac><mn>1</mn><mn>4</mn></mfrac></mrow></mfenced><mo>&#160;</mo><mi>days</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mfrac><mn>85</mn><mn>4</mn></mfrac><mo>&#160;</mo><mi>days</mi></math></p>",
                    solution_hi: "<p>10.(b)<br><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1676007977/word/media/image4.png\" width=\"205\" height=\"95\"><br><span style=\"font-family: Cambria Math;\">कुल कार्य 120 इकाई है।</span><br><span style=\"font-family: Cambria Math;\">रुचि की क्षमता 4 इकाई है। हर तीसरे दिन खुशी और तेजू उसकी मदद करते हैं।</span><br><span style=\"font-family: Cambria Math;\">3 दिन में किया गया कार्य = 4 + 4 + (4 + 3 + 2) = 17 इकाई</span><br><span style=\"font-family: Cambria Math;\">21 दिन में किया गया कार्य = 17 &times; 7 = 119 इकाई</span><br><span style=\"font-family: Cambria Math;\">शेष कार्य = 120 इकाई - 119 इकाई = 1 इकाई</span><br><span style=\"font-family: Cambria Math;\">22वें दिन रूचि अकेले कार्य करती है, रुचि द्वारा कार्य की 1 इकाई को पूरा करने में लगा समय = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>4</mn></mfrac></math></span><span style=\"font-family: Cambria Math;\"> दिन .</span><br><span style=\"font-family: Cambria Math;\">कुल दिन = <math style=\"font-family:Verdana\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfenced><mrow><mn>21</mn><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mfrac><mn>1</mn><mn>4</mn></mfrac></mrow></mfenced><mo>&#160;</mo><mi>&#2342;&#2367;&#2344;</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mfrac><mn>85</mn><mn>4</mn></mfrac><mi>&#2342;&#2367;&#2344;</mi></math></span></p>",
                    correct: "b",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "11",
                    section: "17",
                    question_en: "<p><span style=\"font-family: Cambria Math;\">11. A and B can do a certain work in 6 hours, and A, B and C together take 4 hours to do </span><span style=\"font-family: Cambria Math;\">the same. How long will it take for C alone to accomplish the task?</span></p>",
                    question_hi: "<p><span style=\"font-family: Cambria Math;\">11. A और B एक निश्चित कार्य को 6 घंटे में कर सकते हैं और A, B और C मिलकर उसी कार्य को पूरा करने में 4 घंटे का समय लेते हैं। अकेले C को कार्य पूरा करने में कितना समय लगेगा?</span></p>",
                    options_en: ["<p>12 hours</p>", "<p>4 hours</p>", 
                                "<p>2 hours</p>", "<p>6 hours</p>"],
                    options_hi: ["<p>12 घंटे</p>", "<p>4 घंटे</p>",
                                "<p>2 घंटे</p>", "<p>6 घंटे</p>"],
                    solution_en: "<p>11.(a)<br><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1676007977/word/media/image2.png\" width=\"168\" height=\"74\"><br><span style=\"font-family: Cambria Math;\">Now , efficiency of C = efficiency of (A + B + C) - efficiency of (A + B)</span><br><span style=\"font-family: Cambria Math;\">efficiency of C = 3 - 2 = 1</span><br><span style=\"font-family: Cambria Math;\">Total work = 12 units</span><br><span style=\"font-family: Cambria Math;\">Time taken by C to complete task alone = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>12</mn><mn>1</mn></mfrac></math> </span><span style=\"font-family: Cambria Math;\"> = 12 </span><span style=\"font-family: Cambria Math;\">hours</span><span style=\"font-family: Cambria Math;\"> </span></p>",
                    solution_hi: "<p>11.(a)<br><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1676007977/word/media/image2.png\" width=\"168\" height=\"74\"><br><span style=\"font-family: Cambria Math;\">अब , C की क्षमता = (A + B + C) की क्षमता - (A + B) की क्षमता</span><br><span style=\"font-family: Cambria Math;\">C की क्षमता = 3 - 2 = 1</span><br><span style=\"font-family: Cambria Math;\">कुल कार्य = 12 इकाई</span><br><span style=\"font-family: Cambria Math;\">C द्वारा अकेले कार्य को पूरा करने में लगा समय = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>12</mn><mn>1</mn></mfrac></math></span><span style=\"font-family: Cambria Math;\"> = 12 </span><span style=\"font-family: Cambria Math;\">घंटे</span></p>",
                    correct: "a",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "12",
                    section: "17",
                    question_en: "<p><span style=\"font-family: Cambria Math;\">12.</span><span style=\"font-family: Cambria Math;\"> 5 men and 8 women can complete a work in 12 days working together, while 3 men and 7 women together can complete the same work in 15 days. In how many days will 11 women complete the same work?</span></p>",
                    question_hi: "<p><span style=\"font-family: Cambria Math;\">12. </span><span style=\"font-family: Cambria Math;\">5 पुरुष और 8 महिलाएं एक साथ काम करते हुए एक काम को 12 दिन में पूरा कर सकते हैं, जबकि 3 पुरुष और 7 महिलाएं मिलकर उसी काम को 15 दिन में पूरा कर सकते हैं। 11 महिलाएं उसी काम को कितने दिन में पूरा करेंगी?</span></p>",
                    options_en: ["<p>12</p>", "<p>8</p>", 
                                "<p>6</p>", "<p>16</p>"],
                    options_hi: ["<p>12</p>", "<p>8</p>",
                                "<p>6</p>", "<p>16</p>"],
                    solution_en: "<p>12.(a)<br><span style=\"font-family: Cambria Math;\">Let the efficiency of man be m and efficiency of woman be w .</span><br>According to question,<strong id=\"docs-internal-guid-f14083a1-7fff-3902-ba12-31b07781aa6c\"></strong><br><span style=\"font-weight: 400;\">(5m + 8w) </span><span style=\"font-weight: 400;\">&times; 12</span><span style=\"font-weight: 400;\">&nbsp; = (</span><span style=\"font-weight: 400;\">3m + 7w) </span><span style=\"font-weight: 400;\">&times; 15</span><br><span style=\"font-family: Cambria Math;\">60 m - 45 m = 105w - 96w</span><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><mfrac><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">w</mi></mfrac><mo>=</mo><mo>&#160;</mo><mfrac><mn>3</mn><mn>5</mn></mfrac></math> &hellip;&hellip;(ratio of their efficiency)<strong id=\"docs-internal-guid-3d56ffb8-7fff-8349-9482-44ea9ee0bd78\"></strong><br>Total work = (5m + 8w) &times; 12 = (5 &times; 3 + 8 &times; 5) &times; 12 = 660 units<br>Time required by 11 women to complete the same work = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>660</mn><mo>&#160;</mo></mrow><mrow><mn>11</mn><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mn>5</mn></mrow></mfrac><mo>=</mo><mo>&#160;</mo><mn>12</mn><mo>&#160;</mo><mi>days</mi></math></p>",
                    solution_hi: "<p>12.(a)<br><span style=\"font-family: Cambria Math;\">माना, पुरुष की दक्षता m है और महिला की दक्षता w है।</span><br><span style=\"font-family: Cambria Math;\">प्रश्न के अनुसार,</span><br><span style=\"font-weight: 400;\">(5m + 8w) </span><span style=\"font-weight: 400;\">&times; 12</span><span style=\"font-weight: 400;\">&nbsp; = (</span><span style=\"font-weight: 400;\">3m + 7w) </span><span style=\"font-weight: 400;\">&times; 15</span><br><span style=\"font-family: Cambria Math;\">60 m - 45 m = 105w - 96w</span><br><span style=\"font-family: Cambria Math;\"> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">w</mi></mfrac><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mfrac><mn>3</mn><mn>5</mn></mfrac></math>&nbsp;</span><span style=\"font-family: Cambria Math;\">&hellip;&hellip;(उनकी दक्षता का अनुपात)</span><br><span style=\"font-family: Cambria Math;\">कुल कार्य =(<span style=\"font-weight: 400;\">5m + 8w) </span><span style=\"font-weight: 400;\">&times; 12</span><span style=\"font-weight: 400;\"> = (</span><span style=\"font-weight: 400;\">5 &times; 3 + 8 &times; 5) </span><span style=\"font-weight: 400;\">&times; 12 </span></span><span style=\"font-family: Cambria Math;\">= 660 इकाई</span><br><span style=\"font-family: Cambria Math;\">11 महिलाओं द्वारा उसी कार्य को पूरा करने में लगा समय = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>660</mn><mrow><mn>11</mn><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mn>5</mn></mrow></mfrac></math></span><span style=\"font-family: Cambria Math;\"> = 12 दिन। </span></p>",
                    correct: "a",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "13",
                    section: "17",
                    question_en: "<p><span style=\"font-family: Cambria Math;\">13. A and B working separately can complete a piece of work in 10 and 16 days, respectively. If they work for a day alternately, with A beginning the work, in how many day(s) will the work be completed?</span></p>",
                    question_hi: "<p><span style=\"font-family: Cambria Math;\">13. A और B अलग-अलग कार्य करते हुए एक कार्य को क्रमशः 10 और 16 दिनों में पूरा कर सकते हैं। यदि वे एक दिन के लिए बारी-बारी से कार्य करते हैं, A द्वारा कार्य शुरू करने के साथ, कार्य कितने दिन / दिनों में पूरा होगा?</span></p>",
                    options_en: ["<p>10<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>4</mn></mfrac></math></p>", "<p>12<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>4</mn></mfrac></math></p>", 
                                "<p>1<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>4</mn></mfrac></math></p>", "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>4</mn></mfrac></math></p>"],
                    options_hi: ["<p>10<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>4</mn></mfrac></math></p>", "<p>12<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>4</mn></mfrac></math></p>",
                                "<p>1<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>4</mn></mfrac></math></p>", "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>4</mn></mfrac></math></p>"],
                    solution_en: "<p><span style=\"font-family: Cambria Math;\">13.(b)</span><br><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1676007977/word/media/image6.png\" width=\"168\" height=\"103\"><br><span style=\"font-family: Cambria Math;\">Here , total work = 80 units</span><br><span style=\"font-family: Cambria Math;\">Work done in first 2 days = 8 + 5 = 13 units</span><br><span style=\"font-family: Cambria Math;\">Work done in first twelve days = ( 13 units ) &times; 6 = 78 units</span><br><span style=\"font-family: Cambria Math;\">Remaining work = 80 units - 78 units = 2 units</span><br><span style=\"font-family: Cambria Math;\">Time required to complete 2 units = </span><span style=\"font-family: Cambria Math;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>2</mn><mn>8</mn></mfrac><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mfrac><mn>1</mn><mn>4</mn></mfrac></math> </span><span style=\"font-family: Cambria Math;\">&nbsp;day</span><br><span style=\"font-family: Cambria Math;\">Now, Total time = 12<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>4</mn></mfrac></math></span><span style=\"font-family: Cambria Math;\"> days </span></p>",
                    solution_hi: "<p><span style=\"font-family: Cambria Math;\">13.(b)</span><br><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1676007977/word/media/image5.png\" width=\"178\" height=\"89\"><br><span style=\"font-family: Cambria Math;\">यहां कुल काम = 80 इकाई</span><br><span style=\"font-family: Cambria Math;\">पहले 2 दिनों में किया गया कार्य = 8 + 5 = 13 इकाई</span><br><span style=\"font-family: Cambria Math;\">पहले बारह दिनों में किया गया कार्य = (13 इकाई) &times; 6 = 78 इकाई</span><br><span style=\"font-family: Cambria Math;\">शेष कार्य = 80 इकाई - 78 इकाई = 2 इकाई</span><br><span style=\"font-family: Cambria Math;\">2 इकाइयों को पूरा करने में लगने वाला समय = </span><span style=\"font-family: Cambria Math;\"> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>2</mn><mn>8</mn></mfrac><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mfrac><mn>1</mn><mn>4</mn></mfrac></math> </span><span style=\"font-family: Cambria Math;\">&nbsp;दिन</span><br><span style=\"font-family: Cambria Math;\">अब, कुल समय = 12<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>4</mn></mfrac></math></span><span style=\"font-family: Cambria Math;\"> दिन</span></p>",
                    correct: "b",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "14",
                    section: "17",
                    question_en: "<p><span style=\"font-family: Cambria Math;\">14. Numan does half the work as Gagan in <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4</mn><mn>5</mn></mfrac></math> the time. If together they take 16 days to complete a piece of work, then how long will it take Gagan to complete the work?</span></p>",
                    question_hi: "<p><span style=\"font-family: Cambria Math;\">14.&nbsp; नुमन&nbsp; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4</mn><mn>5</mn></mfrac></math> समय में गगन से आधा काम करता है। यदि वे एक साथ एक कार्य को पूरा करने में 16 दिन </span><span style=\"font-family: Cambria Math;\">लेते हैं, तो गगन को उस कार्य को पूरा करने में कितना समय लगेगा?</span></p>",
                    options_en: ["<p>23 days</p>", "<p>24 days</p>", 
                                "<p>25 days</p>", "<p>26 days</p>"],
                    options_hi: ["<p>23 दिन</p>", "<p>24 दिन</p>",
                                "<p>25 दिन</p>", "<p>26 दिन</p>"],
                    solution_en: "<p>14.(d)<br><span style=\"font-family: Cambria Math;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; Numan&nbsp; &nbsp; :&nbsp; &nbsp; Gagan</span><br><span style=\"font-family: Cambria Math;\">time&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &rArr; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; </span><span style=\"font-family: Cambria Math;\">8&nbsp; &nbsp; :&nbsp; &nbsp; 5</span><br><span style=\"font-family: Cambria Math;\">efficiency &nbsp; &rArr;&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;</span><span style=\"font-family: Cambria Math;\">5&nbsp; &nbsp; :&nbsp; &nbsp; 8</span><br><span style=\"font-family: Cambria Math;\">Together they complete work in 16 days.</span><br><span style=\"font-family: Cambria Math;\">Now, total work = {(5 + 8) &times; 16} units</span><br><span style=\"font-family: Cambria Math;\">Time taken by Gagan to complete the work =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>13</mn><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mn>16</mn></mrow><mn>8</mn></mfrac></math></span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\"> = 26 days</span></p>",
                    solution_hi: "<p>14.(d)<br><span style=\"font-family: Cambria Math;\">&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; नुमन&nbsp; &nbsp; :&nbsp; &nbsp; गगन</span><br><span style=\"font-family: Cambria Math;\">समय &nbsp; &nbsp;&rArr;&nbsp; &nbsp;</span><span style=\"font-family: Cambria Math;\">8&nbsp; &nbsp; :&nbsp; &nbsp; 5</span><br><span style=\"font-family: Cambria Math;\">दक्षता &nbsp; &nbsp;&rArr;&nbsp; 5&nbsp; &nbsp; :&nbsp; &nbsp; 8</span><br><span style=\"font-family: Cambria Math;\">वे दोनों मिलकर 16 दिनों में कार्य पूरा करते हैं।</span><br><span style=\"font-family: Cambria Math;\">अब , कुल कार्य = {(5 + 8) &times; 16} इकाई</span><br><span style=\"font-family: Cambria Math;\">गगन द्वारा कार्य को पूरा करने में लगा समय </span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Cambria Math;\"> =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>13</mn><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mn>16</mn></mrow><mn>8</mn></mfrac></math> = 26 दिन </span></p>",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "15",
                    section: "misc",
                    question_en: "<p><span style=\"font-family: Cambria Math;\">15. A contractor decided to complete a work in 80 days and employed 60 men at the </span><span style=\"font-family: Cambria Math;\">beginning and 20 men additionally after 20 days and got the work completed as per </span><span style=\"font-family: Cambria Math;\">schedule. If he had not employed the additional men, how many extra days would he&nbsp; </span><span style=\"font-family: Cambria Math;\">have needed to complete the work (round off to the nearest integer)?</span></p>",
                    question_hi: "<p><span style=\"font-family: Cambria Math;\">15. एक ठेकेदार ने 80 दिनों में एक काम पूरा करने का फैसला किया और शुरुआत में 60 पुरुषों को और 20 दिनों के बाद अतिरिक्त 20 पुरुषों को नियुक्त किया और काम को समय के अनुसार पूरा किया। यदि उसने अतिरिक्त पुरुषों को नियोजित नहीं किया होता, तो कार्य को पूरा करने के लिए उसे कितने अतिरिक्त दिनों की आवश्यकता होती (निकटतम पूर्णांक तक पूर्णांकित ) ?</span></p>",
                    options_en: ["<p>32 days</p>", "<p>20 days</p>", 
                                "<p>30 days</p>", "<p>26 days</p>"],
                    options_hi: ["<p>32 दिन</p>", "<p>20 दिन</p>",
                                "<p>30 दिन</p>", "<p>26 दिन</p>"],
                    solution_en: "<p>15.(b)<br><span style=\"font-family: Cambria Math;\">Let the efficiency of one man is &lsquo;m&rsquo; then,</span><br><span style=\"font-family: Cambria Math;\">Total work = ( 60 m &times; 20 days ) + ( 80 m &times; 60 days ) = 6000 m units</span><br><span style=\"font-family: Cambria Math;\">If extra men did not employed , then time in which work finish = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>6000</mn><mi mathvariant=\"normal\">m</mi></mrow><mrow><mn>60</mn><mi mathvariant=\"normal\">m</mi></mrow></mfrac></math></span><span style=\"font-family: Cambria Math;\"> = 100 days</span><br><span style=\"font-family: Cambria Math;\">Extra days = 100 days - 80 days = 20 days</span></p>",
                    solution_hi: "<p>15.(b)<br><span style=\"font-family: Cambria Math;\">मान लीजिए कि एक पुरुष की क्षमता \'m\' है, तो</span><br><span style=\"font-family: Cambria Math;\">कुल कार्य = (60 m &times; 20 दिन) + (80 m &times; 60 दिन) = 6000 m इकाइयाँ</span><br><span style=\"font-family: Cambria Math;\">यदि अतिरिक्त पुरुषों को नियोजित नहीं किया जाता है, तो <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>6000</mn><mi mathvariant=\"normal\">m</mi></mrow><mrow><mn>60</mn><mi mathvariant=\"normal\">m</mi></mrow></mfrac></math> </span><span style=\"font-family: Cambria Math;\">= 100 दिन में काम समाप्त होता है</span><br><span style=\"font-family: Cambria Math;\">अतिरिक्त दिन = 100 दिन - 80 दिन = 20 दिन</span></p>",
                    correct: "b",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
            
            // Generate question boxes
            const boxesContainer = document.getElementById('question-boxes');
            questions.forEach((q, index) => {
                const box = document.createElement('div');
                box.className = 'q-box';
                box.textContent = index + 1;
                box.onclick = () => showQuestion(index);
                box.id = `box-${index}`;
                boxesContainer.appendChild(box);
            });
            
            // Show first question
            showQuestion(0);
            updateProgress();
        }
        
        // Show a specific question
        
        function formatContent(text) {
            if (!text) return '';
            return text.replace(/<img/g, '<img style="max-width:100%;height:auto;"');
        }
        
        function showQuestion(index) {
            if (index < 0 || index >= questions.length) return;
            
            currentQuestion = index;
            const question = questions[index];
            
            // Update question counter
            document.getElementById('question-counter').textContent = `Question ${index + 1} of ${questions.length}`;
            
            // Update question boxes
            document.querySelectorAll('.q-box').forEach(box => box.classList.remove('current'));
            document.getElementById(`box-${index}`).classList.add('current');
            
            // Generate question HTML
            let html = `
                <div class="question-card">
                    <div class="question-text">
                        <div class="en">${formatContent(question.question_en)}</div>
                        <div class="hi" style="display:none">${formatContent(question.question_hi)} </div>
                    </div>
                    <div class="options" id="options-container">`;
            
            // Add options
            ['a', 'b', 'c', 'd'].forEach((opt, i) => {
                let optionClass = '';
                let isCorrectAnswer = opt === question.correct;
                let isUserAnswer = answers[question.id] === opt;
                
                // When reviewing, add appropriate classes
                if (submitted) {
                    if (isCorrectAnswer) {
                        optionClass += ' correct-answer';
                    } else if (isUserAnswer && !isCorrectAnswer) {
                        optionClass += ' incorrect';
                    }
                }
                
                html += `
                    <div class="option-item">
                        <input class="option-input" type="radio" name="q${index}" 
                            id="opt-${index}-${opt}" value="${opt}" 
                            ${isUserAnswer ? 'checked' : ''}
                            onclick="selectAnswer('${question.id}', '${opt}')">
                       <label class="option-label${optionClass}" for="opt-${index}-${opt}">
                            <div class="en">${question.options_en[i]}</div>
                            <div class="hi" style="display:none">${question.options_hi[i]}</div>
                        </label>
                    </div>`;
            });
            
            // Add solution if submitted
            if (submitted) {
                const isCorrect = answers[question.id] === question.correct;
                const resultText = answers[question.id] ? (isCorrect ? 'Correct!' : 'Incorrect!') : 'Not attempted';
                
                html += `
                    <div class="solution-container">
                        <div class="solution-title">${resultText}</div>
                        <div class="solution-text">
                            <div class="en">${question.solution_en}</div>
                            <div class="hi" style="display:none">${question.solution_hi}</div>
                        </div>
                    </div>`;
            }
            
            html += `</div></div>`;
            
            document.getElementById('questions-container').innerHTML = html;
            
            // Apply language settings
            applyLanguage();
            
            // If in mobile view, close the menu
            if (window.innerWidth < 992) {
                toggleNav(false);
            }
            
            // Add review mode class if submitted
            if (submitted) {
                document.getElementById('options-container').classList.add('review-mode');
            }
        }
        
        // Apply current language
        function applyLanguage() {
            document.querySelectorAll(`.${currentLang}`).forEach(el => el.style.display = 'block');
            document.querySelectorAll(`.${currentLang === 'en' ? 'hi' : 'en'}`).forEach(el => el.style.display = 'none');
            
            // Update language button text
            document.getElementById('lang-text').textContent = currentLang === 'en' ? 'Hi' : 'En';
        }
        
        // Select an answer
        function selectAnswer(qId, option) {
            if (submitted) return;
            
            answers[qId] = option;
            updateProgress();
            
            // Mark question as attempted in the navigation
            const index = questions.findIndex(q => q.id === qId);
            if (index >= 0) {
                const box = document.getElementById(`box-${index}`);
                box.classList.add('attempted');
                box.classList.remove('unattempted');
            }
        }
        
        // Navigate to previous/next question
        function prevQuestion() { 
            if (currentQuestion > 0) showQuestion(currentQuestion - 1); 
        }
        
        function nextQuestion() { 
            if (currentQuestion < questions.length - 1) showQuestion(currentQuestion + 1); 
        }
        
        // Switch section
        function switchSection(sectionId) {
            if (sectionId === 'all') {
                showQuestion(0);
                return;
            }
            
            const section = sections[sectionId];
            if (section) showQuestion(section.start);
        }
        
        // Toggle language
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            applyLanguage();
        }
        
        // Toggle navigation sidebar
        function toggleNav(show) {
            const nav = document.getElementById('question-nav');
            const overlay = document.getElementById('nav-overlay');
            
            if (show === undefined) {
                show = !nav.classList.contains('show');
            }
            
            if (show) {
                nav.classList.add('show');
                overlay.classList.add('show');
                document.body.style.overflow = 'hidden';
            } else {
                nav.classList.remove('show');
                overlay.classList.remove('show');
                document.body.style.overflow = '';
            }
        }
        
        // Update progress
        function updateProgress() {
            const attempted = Object.keys(answers).length;
            document.getElementById('attempted-count').textContent = attempted;
        }
        
        // Start timer
        function startTimer() {
            const timerDisplay = document.getElementById('timer-display');
            let timeLeft = totalTime;
            
            const timerInterval = setInterval(() => {
                if (timeLeft <= 0 || submitted) {
                    clearInterval(timerInterval);
                    if (!submitted) submitTest();
                    return;
                }
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                timeLeft--;
            }, 1000);
        }
        
        // Confirm before submitting
        function confirmSubmit() {
            if (submitted) return;
            
            const attempted = Object.keys(answers).length;
            const remaining = questions.length - attempted;
            
            // Create a more modern confirmation dialog
            const confirmHtml = `
                <div style="text-align: center; padding: 20px;">
                    <h4 style="margin-bottom: 16px; color: var(--dark);">Confirm Submission</h4>
                    <p style="margin-bottom: 24px; color: var(--gray);">
                        You have attempted ${attempted} of ${questions.length} questions.<br>
                        ${remaining} questions are unattempted.
                    </p>
                    <div style="display: flex; justify-content: center; gap: 12px;">
                        <button onclick="this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; border: 1px solid var(--light-gray); background: white; border-radius: 8px; cursor: pointer;">
                            Cancel
                        </button>
                        <button onclick="submitTest(); this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer;">
                            Submit Test
                        </button>
                    </div>
                </div>`;
            
            // Create modal element
            const modal = document.createElement('div');
            modal.className = 'results-modal show';
            modal.innerHTML = `
                <div class="results-card" style="max-width: 400px;">
                    <button class="cancel-btn" style="position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--gray);" onclick="this.closest('.results-modal').remove()">
                        ×
                    </button>
                    ${confirmHtml}
                </div>`;
            
            document.body.appendChild(modal);
        }
        
        // Submit test
        function submitTest() {
            if (submitted) return;
            
            submitted = true;
            
            let score = 0;
            let correctCount = 0;
            let incorrectCount = 0;
            let unattemptedCount = 0;
            
            questions.forEach((q, index) => {
                const userAns = answers[q.id];
                const box = document.getElementById(`box-${index}`);
                
                box.classList.remove('attempted');
                
                if (!userAns) {
                    unattemptedCount++;
                    box.classList.add('unattempted');
                } else if (userAns === q.correct) {
                    correctCount++;
                    score += q.pos_marks;
                    box.classList.add('correct');
                } else {
                    incorrectCount++;
                    score -= q.neg_marks;
                    box.classList.add('incorrect');
                }
            });
            
            // Update result values
            document.getElementById('score-value').textContent = score.toFixed(2);
            document.getElementById('correct-value').textContent = correctCount;
            document.getElementById('incorrect-value').textContent = incorrectCount;
            document.getElementById('unattempted-value').textContent = unattemptedCount;
            
            // Show the results modal
            document.getElementById('results-modal').classList.add('show');
            
            // Disable submit button
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-check"></i>';
            submitBtn.style.backgroundColor = 'var(--success)';
            
            // Refresh current question view to show solution
            showQuestion(currentQuestion);
        }
        
        // Review test
        function reviewTest() {
            document.getElementById('results-modal').classList.remove('show');
            showQuestion(0);
        }
        
        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('results-modal')) {
                document.getElementById('results-modal').classList.remove('show');
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === 'ArrowRight') nextQuestion();
        });
    </script>
</body>
</html>
