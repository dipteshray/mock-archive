                questions.push({
                    id: "16",
                    section: "17",
                    question_en: "<p>16. <span style=\"font-family: Times New Roman;\">The given pie charts show the number of start-ups in various industries since 2010 and the number of successful start-ups in those industries.<br></span><span style=\"font-family: Times New Roman;\">Study the charts and answer the question that follows.<br></span><span style=\"font-family: Times New Roman;\">Start-ups in various industries started since 2010<br></span><strong id=\"docs-internal-guid-51014c2b-7fff-88b8-0952-9d974c35a355\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXdhawvDy5-UwErYkB3A_6RcEmERSQWdiXmld43WC-NCn4Cxm92A0WgT6C8S53U9ylyPLnmvoyyTO85TIEmwOVXJSvsUIIS4aDrgTF6vaaqsN3DWmcc3WD7JtOFUXCkaMoCDgry1?key=GqzvR84WLuKsY9oZ1QD7ct7p\" width=\"284\" height=\"270\"></strong><strong id=\"docs-internal-guid-99194b10-7fff-98d8-8b2e-208072da27fd\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXelBbHBCcPIqF-3DthKKGfSTkowUcXSB7dFqXZGPUxHzPonov2x2FLSNcKhSPE0-oi_ImI_CC1bAMZvcY13rm6XKyznFYnBtCqPkissX6nAqJJcpmrmk8WXbrbmsb1D8s4j3MFb4A?key=GqzvR84WLuKsY9oZ1QD7ct7p\" width=\"272\" height=\"270\"><br></strong><span style=\"font-family: Times New Roman;\">What should be the increase in the number (to the nearest integer) of successful start-ups in the industry of Health &amp; Sports, so that its success percentage is the same as that of the Education?</span></p>",
                    question_hi: "<p>16.<span style=\"font-family: Baloo;\"> दिए गए पाई चार्ट 2010 से विभिन्न उ&zwnj;द्योगों में स्टार्ट-अप (start-ups) की संख्या और उन उ&zwnj;द्योगों में सफल स्टार्ट-अप की संख्या को दर्शाले हैं।&nbsp;<br>चार्ट का अध्ययन करें और उसके बाद दिए गए प्रश्न का उत्तर दें।&nbsp;<br>2010 से शुरू हुए विभिन्न उद्&zwnj;योगों में स्टार्ट-अप <br></span><strong id=\"docs-internal-guid-98bdfec3-7fff-2d49-4973-b9f57d936aa1\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXdAzcQoayQ3Oa076KwMvyLu5oX_2nbPOWP3ab8WCzrGIR3x1HP5nONC4R2qJgibByTstOwtwYRxwFD_5INaAM2MvIC3aYqJ3IllhSYf77s63XZWB3ECg89XwM84UoAjb8_vWcBPKQ?key=GqzvR84WLuKsY9oZ1QD7ct7p\" width=\"274\" height=\"260\"> &nbsp;</strong><strong id=\"docs-internal-guid-37f0568c-7fff-40b0-72fa-9589ea8971e1\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXeUJwkFUfpszZ_XUfvs-iHtaxclI8av-9-ALZpGyWpStBM3NTz5mpxHI8iyw1fpc9jrOa4jOvzOPCJUFe9K4Nk5mdkp98dsGCx5QI2FOAMHoqdw8JG8HQFKOkuCn4aJazmrSVdJ?key=GqzvR84WLuKsY9oZ1QD7ct7p\" width=\"281\" height=\"263\"><br></strong>स्वास्थ्य एवं खेल (Health &amp; Sports) के उद्&zwnj;द्योग में सफल स्टार्ट-अप की संख्या (निकटतम पूर्णांक तक) में कितनी वृद्धि होनी चाहिए, ताकि इसकी सफलता प्रतिशत शिक्षा (Education) के बराबर हो जाए</p>",
                    options_en: ["<p>220</p>", "<p>155</p>", 
                                "<p>187</p>", "<p>127</p>"],
                    options_hi: ["<p>220</p>", "<p>155</p>",
                                "<p>187</p>", "<p>127</p>"],
                    solution_en: "<p>16.(d) <span style=\"font-family: Times New Roman;\">Number of start-ups in the industry of Health &amp; Sports = 1050<br></span><span style=\"font-family: Times New Roman;\">Number of successful start-ups in the industry of Health &amp; Sports = 300<br></span><span style=\"font-family: Times New Roman;\">Number of start-ups in Education sector = 1280<br></span><span style=\"font-family: Times New Roman;\">Number of successful start-ups in the Education sector = 520<br></span><span style=\"font-family: Times New Roman;\">percentage of successful startups in education sector = </span><span style=\"font-family: Times New Roman;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>520</mn><mn>1280</mn></mfrac><mo>&#215;</mo><mn>100</mn><mo>=</mo><mn>40</mn><mo>.</mo><mn>625</mn><mo>%</mo></math><br></span><span style=\"font-family: Times New Roman;\">According to the question = 40.625% of 1050 = </span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>40</mn><mo>.</mo><mn>625</mn></mrow><mn>100</mn></mfrac><mo>&#215;</mo><mn>1050</mn><mo>&#8776;</mo><mn>427</mn></math><br><span style=\"font-family: Times New Roman;\">Required difference = 427 &ndash; 300 = 127 startups</span></p>",
                    solution_hi: "<p>16.(d) <span style=\"font-family: Baloo;\">स्वास्थ्य और खेल उद्योग में स्टार्ट-अप की संख्या = 1050<br></span><span style=\"font-family: Baloo;\">स्वास्थ्य और खेल उद्योग में सफल स्टार्ट-अप की संख्या = 300<br></span><span style=\"font-family: Baloo;\">शिक्षा क्षेत्र में स्टार्ट-अप की संख्या = 1280<br></span><span style=\"font-family: Baloo;\">शिक्षा क्षेत्र में सफल स्टार्ट-अप की संख्या = 520<br></span><span style=\"font-family: Baloo;\">शिक्षा क्षेत्र में सफल स्टार्टअप का प्रतिशत = <span style=\"font-family: Times New Roman;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>520</mn><mn>1280</mn></mfrac><mo>&#215;</mo><mn>100</mn><mo>=</mo><mn>40</mn><mo>.</mo><mn>625</mn><mo>%</mo></math></span></span><span style=\"font-family: Times New Roman;\"><br></span><span style=\"font-family: Baloo;\">प्रश्नानुसार = 1050 का 40.625% = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>40</mn><mo>.</mo><mn>625</mn></mrow><mn>100</mn></mfrac><mo>&#215;</mo><mn>1050</mn><mo>&#8776;</mo><mn>427</mn></math></span><br><span style=\"font-family: Baloo;\">आवश्यक अंतर = 427 &ndash; 300 = 127 स्टार्टअप</span></p>",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "17",
                    section: "17",
                    question_en: "<p>17. <span style=\"font-family: Times New Roman;\"> The bar graph show the number of people who visited Mall A and Mall B on different days a week<br></span><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXeE9OiH_LBAubXDK8_itfH3eb8OTKQHso93aX1JMWUXDFz7Fo7dxPuFl0MGrmIxPfrHRqOltkpjixAxB94vb-L5T8Q3kt-4Xl3uxOa5mpO1FnaIqEqOR--N3YBjey-ubtdcyeNv-KHi0MxGMDXUQA4SEW0?key=baGsKNI-1z7XkiuL6NDfu-Gw\" width=\"406\" height=\"244\"><br><span style=\"font-family: Times New Roman;\">What is the ratio of the number of people visiting Mall A on Thursday , saturday and sunday together to the number of people visiting Mall B on these days together?</span></p>",
                    question_hi: "<p>17. <span style=\"font-family: Baloo;\">&nbsp;बार ग्राफ एक सप्ताह के अलग-अलग दिनों में मॉल में आने वाले लोगो की संख्या को दर्शाता है <br></span><strong id=\"docs-internal-guid-aeb4dd0b-7fff-39d6-7304-3c5eae0acf39\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXegvWdl335EdE2hVPBhEZO4VzHRs4VJEbfP9rZeWExIWoWB_hJrpTzDXcP1tHNNon84-yoyLmFBWLkX_HpyR0ca7eT-zT7_9FZarjibajR4o1FXq8WvGWw6cDUvGNNyj5FqrY4sHg?key=OneUmi-ytetNVzvfgNyoS4CV\" width=\"345\" height=\"303\"><br></strong><span style=\"font-family: Baloo;\">गुरुवार, शनिवार और रविवार (तीनो दिनों को मिलकर) मॉल A में आने वाले लोगों की संख्या का इन तीन दिनों में मिलकर मॉल B में आने जाने वाले लोगों की संख्या से अनुपात कितना है?</span></p>",
                    options_en: ["<p>27 : 25</p>", "<p>80 : 81</p>", 
                                "<p>81 : 80</p>", "<p>25 : 27</p>"],
                    options_hi: ["<p>27 : 25</p>", "<p>80 : 81</p>",
                                "<p>81 : 80</p>", "<p>25 : 27</p>"],
                    solution_en: "<p>17.(c) <span style=\"font-family: Times New Roman;\">Number of people visiting Mall A on Thursday , saturday and sunday&nbsp;<br></span><span style=\"font-family: Times New Roman;\">= 460 + 1280 + 1500 = 3240<br></span><span style=\"font-family: Times New Roman;\">Number of people visiting Mall B on Thursday , saturday and sunday&nbsp;<br></span><span style=\"font-family: Times New Roman;\">= 750 + 1100 + 1350 = 3200<br></span><span style=\"font-family: Times New Roman;\">Required ratio = 3240 : 3200 = 81 : 80</span></p>",
                    solution_hi: "<p>17.(c) <span style=\"font-family: Baloo;\">गुरुवार, शनिवार और रविवार को मॉल A में आने वाले लोगों की संख्या<br></span><span style=\"font-family: Times New Roman;\">= 460 + 1280 + 1500 = 3240<br></span><span style=\"font-family: Baloo;\">गुरुवार, शनिवार और रविवार को मॉल B में आने वाले लोगों की संख्या<br></span><span style=\"font-family: Times New Roman;\">= 750 + 1100 + 1350 = 3200<br></span><span style=\"font-family: Baloo;\">अभीष्ट अनुपात = 3240 : 3200 = 81 : 80</span></p>",
                    correct: "c",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "18",
                    section: "17",
                    question_en: "<p>18. <span style=\"font-family: Times New Roman;\">The following bar graph shows receipts and expenditure by a business firm over 5 year.&nbsp;<br></span><span style=\"font-family: Times New Roman;\">Gain=Receipts - Expenditure<br></span><span style=\"font-family: Times New Roman;\">In which year did the company gain the maximum amount<br></span><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXdTSKKlfWLk78xjEYRLYi3s9WkWtxqsWfpNhx7gV-3QID3d8zYCn0nlSBMRY20EC02QFvwURtV7kYPoCZbn3V1yNu7fKncjhcoIINsd6mTqyUp1O7OMsHHKGfkHHgaSJ2fbfGEfU3tf923tVsptAvHHKVI?key=baGsKNI-1z7XkiuL6NDfu-Gw\" width=\"423\" height=\"254\"></p>",
                    question_hi: "<p>18.<span style=\"font-family: Baloo;\"> निम्नलिखित बार ग्राफ 5 वर्षों में एक व्यावसायिक फर्म के आय और व्यय को दर्शाता है।<br></span><span style=\"font-family: Baloo;\">लाभ = आय - व्यय<br></span><span style=\"font-family: Baloo;\">किस वर्ष में कंपनी को अधिकतम लाभ प्राप्त हुई<br></span><strong id=\"docs-internal-guid-0306e317-7fff-6f2c-8dc9-8d445ae1f32a\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXc_dTMSOZ4sKpk5dCKC-V5wy_P--txl3XIfrFXp9zBJ9vwRfuXjP5r5OttfKghHwZOKTl5iqNlbmG5Lt0NrpDtLBzY1IiRsngMOkVkdMYwvKsy5DlmZIf7WztFKcaDDx9eOAB9jSg?key=OneUmi-ytetNVzvfgNyoS4CV\" width=\"303\" height=\"240\"></strong></p>\n<p>&nbsp;</p>",
                    options_en: ["<p>2016</p>", "<p>2017</p>", 
                                "<p>2018</p>", "<p>2020</p>"],
                    options_hi: ["<p>2016</p>", "<p>2017</p>",
                                "<p>2018</p>", "<p>2020</p>"],
                    solution_en: "<p>18.(d) <span style=\"font-family: Times New Roman;\">Gain = Receipts &ndash; Expenditure<br></span><span style=\"font-family: Times New Roman;\">Gain in 2016 = 54 &ndash; 51 = 3<br></span><span style=\"font-family: Times New Roman;\">Gain in 2017 = 64 &ndash; 60 = 4<br></span><span style=\"font-family: Times New Roman;\">Gain in 2018 = 80 &ndash; 75 = 5<br></span><span style=\"font-family: Times New Roman;\">Gain in 2019 = 82 &ndash; 80 = 2<br></span><span style=\"font-family: Times New Roman;\">Gain in 2020 = 93 &ndash; 87 = 6<br></span><span style=\"font-family: Times New Roman;\">Maximum gain is 6 lakh which is in year 2020</span></p>",
                    solution_hi: "<p>18.(d) <span style=\"font-family: Baloo;\">लाभ = प्राप्तियां &ndash; व्यय<br></span><span style=\"font-family: Baloo;\">2016 में लाभ = 54 &ndash; 51 = 3<br></span><span style=\"font-family: Baloo;\">2017 में लाभ = 64 &ndash; 60 = 4<br></span><span style=\"font-family: Baloo;\">2018 में लाभ = 80 &ndash; 75 = 5<br></span><span style=\"font-family: Baloo;\">2019 में लाभ = 82 &ndash; 80 = 2<br></span><span style=\"font-family: Baloo;\">2020 में लाभ = 93 &ndash; 87 = 6<br></span><span style=\"font-family: Baloo;\">अधिकतम लाभ 6 लाख है जो कि वर्ष 2020 में है।</span></p>",

                questions.push({

                    section: "17",
                    question_en: "<p>19. <span style=\"font-family: Times New Roman;\">Performance of the 1800 student in grades has been shown in the following pie chart.&nbsp;<br></span><span style=\"font-family: Times New Roman;\">How many student have got either grade D or grade E&nbsp;<br></span><strong id=\"docs-internal-guid-aba8278b-7fff-305a-67a5-f420b454b4fa\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXc1AdacBOSKi1cM9RTYNnREo6Nwxz_DI-bq0_p18P_yPzIJlPpJWTs1NPzJMklTuH1J2v8CHptTDxx8MU-vJeO39y624wG1dOqLgRa4SP6Drm948fB0WjjNMS2ahzPoPv_0c5BDqw?key=OneUmi-ytetNVzvfgNyoS4CV\" width=\"258\" height=\"247\"></strong></p>",
                    question_hi: "<p>19. <span style=\"font-family: Baloo;\">निम्नलिखित पाई चार्ट में 1800 छात्रों का प्रदर्शन ग्रेड में दिखाया गया है।<br></span><span style=\"font-family: Baloo;\">कितने छात्रों को या तो ग्रेड (Grade) D या ग्रेड (Grade) E मिला है?<br></span><strong id=\"docs-internal-guid-f99f1a48-7fff-5d83-ce42-df36b094beb1\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXdvxTfr3OAYnsmJBDYLkyu0GECrtd31AGwg3gOGtw_5WYifoId4Q6OI3AG_of6BKzy_MXL_AxeqDcO9DM8AOo6yc_XrAocShsQ9m1zXHDvEA3GIgnxTVtuhaVGwlFG5E5Lyis8ljg?key=OneUmi-ytetNVzvfgNyoS4CV\" width=\"245\" height=\"234\"></strong></p>\n<p>&nbsp;</p>",

                questions.push({

                    section: "misc",

                    options_hi: ["<p>32.7%</p>", "<p>36.6%</p>",
                                "<p>43.2%</p>", "<p>51.8%</p>"],
                    solution_en: "<p>20.(c) <span style=\"font-family: Times New Roman;\">Number of students whose marks are less than 100 = 10 + 18 + 32 + 45 = 105<br></span><span style=\"font-family: Times New Roman;\">Number of students whose marks are 120 and above = 75 + 55 + 40 + 15 = 185<br></span><span style=\"font-family: Times New Roman;\">Required percentage = </span><span style=\"font-family: Times New Roman;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>185</mn><mo>-</mo><mn>105</mn></mrow><mn>185</mn></mfrac><mo>&#215;</mo><mn>100</mn><mo>=</mo><mn>43</mn><mo>.</mo><mn>24</mn><mo>%</mo></math> </span></p>",
                    solution_hi: "<p>20.(c) <span style=\"font-family: Baloo;\">उन छात्रों की संख्या जिनके अंक 100 से कम हैं = 10 + 18 + 32 + 45 = 105<br></span><span style=\"font-family: Baloo;\">उन छात्रों की संख्या जिनके अंक 120 और उससे अधिक हैं= 75 + 55 + 40 + 15 = 185<br></span><span style=\"font-family: Baloo;\">आवश्यक प्रतिशत = <span style=\"font-family: Times New Roman;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>185</mn><mo>-</mo><mn>105</mn></mrow><mn>185</mn></mfrac><mo>&#215;</mo><mn>100</mn><mo>=</mo><mn>43</mn><mo>.</mo><mn>24</mn><mo>%</mo></math></span></span></p>",
                    correct: "c",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
            
            // Generate question boxes
            const boxesContainer = document.getElementById('question-boxes');
            questions.forEach((q, index) => {
                const box = document.createElement('div');
                box.className = 'q-box';
                box.textContent = index + 1;
                box.onclick = () => showQuestion(index);
                box.id = `box-${index}`;
                boxesContainer.appendChild(box);
            });
            
            // Show first question
            showQuestion(0);
            updateProgress();
        }
        
        // Show a specific question
        
        function formatContent(text) {
            if (!text) return '';
            return text.replace(/<img/g, '<img style="max-width:100%;height:auto;"');
        }
        
        function showQuestion(index) {
            if (index < 0 || index >= questions.length) return;
            
            currentQuestion = index;
            const question = questions[index];
            
            // Update question counter
            document.getElementById('question-counter').textContent = `Question ${index + 1} of ${questions.length}`;
            
            // Update question boxes
            document.querySelectorAll('.q-box').forEach(box => box.classList.remove('current'));
            document.getElementById(`box-${index}`).classList.add('current');
            
            // Generate question HTML
            let html = `
                <div class="question-card">
                    <div class="question-text">
                        <div class="en">${formatContent(question.question_en)}</div>
                        <div class="hi" style="display:none">${formatContent(question.question_hi)} </div>
                    </div>
                    <div class="options" id="options-container">`;
            
            // Add options
            ['a', 'b', 'c', 'd'].forEach((opt, i) => {
                let optionClass = '';
                let isCorrectAnswer = opt === question.correct;
                let isUserAnswer = answers[question.id] === opt;
                
                // When reviewing, add appropriate classes
                if (submitted) {
                    if (isCorrectAnswer) {
                        optionClass += ' correct-answer';
                    } else if (isUserAnswer && !isCorrectAnswer) {
                        optionClass += ' incorrect';
                    }
                }
                
                html += `
                    <div class="option-item">
                        <input class="option-input" type="radio" name="q${index}" 
                            id="opt-${index}-${opt}" value="${opt}" 
                            ${isUserAnswer ? 'checked' : ''}
                            onclick="selectAnswer('${question.id}', '${opt}')">
                       <label class="option-label${optionClass}" for="opt-${index}-${opt}">
                            <div class="en">${question.options_en[i]}</div>
                            <div class="hi" style="display:none">${question.options_hi[i]}</div>
                        </label>
                    </div>`;
            });
            
            // Add solution if submitted
            if (submitted) {
                const isCorrect = answers[question.id] === question.correct;
                const resultText = answers[question.id] ? (isCorrect ? 'Correct!' : 'Incorrect!') : 'Not attempted';
                
                html += `
                    <div class="solution-container">
                        <div class="solution-title">${resultText}</div>
                        <div class="solution-text">
                            <div class="en">${question.solution_en}</div>
                            <div class="hi" style="display:none">${question.solution_hi}</div>
                        </div>
                    </div>`;
            }
            
            html += `</div></div>`;
            
            document.getElementById('questions-container').innerHTML = html;
            
            // Apply language settings
            applyLanguage();
            
            // If in mobile view, close the menu
            if (window.innerWidth < 992) {
                toggleNav(false);
            }
            
            // Add review mode class if submitted
            if (submitted) {
                document.getElementById('options-container').classList.add('review-mode');
            }
        }
        
        // Apply current language
        function applyLanguage() {
            document.querySelectorAll(`.${currentLang}`).forEach(el => el.style.display = 'block');
            document.querySelectorAll(`.${currentLang === 'en' ? 'hi' : 'en'}`).forEach(el => el.style.display = 'none');
            
            // Update language button text
            document.getElementById('lang-text').textContent = currentLang === 'en' ? 'Hi' : 'En';
        }
        
        // Select an answer
        function selectAnswer(qId, option) {
            if (submitted) return;
            
            answers[qId] = option;
            updateProgress();
            
            // Mark question as attempted in the navigation
            const index = questions.findIndex(q => q.id === qId);
            if (index >= 0) {
                const box = document.getElementById(`box-${index}`);
                box.classList.add('attempted');
                box.classList.remove('unattempted');
            }
        }
        
        // Navigate to previous/next question
        function prevQuestion() { 
            if (currentQuestion > 0) showQuestion(currentQuestion - 1); 
        }
        
        function nextQuestion() { 
            if (currentQuestion < questions.length - 1) showQuestion(currentQuestion + 1); 
        }
        
        // Switch section
        function switchSection(sectionId) {
            if (sectionId === 'all') {
                showQuestion(0);
                return;
            }
            
            const section = sections[sectionId];
            if (section) showQuestion(section.start);
        }
        
        // Toggle language
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            applyLanguage();
        }
        
        // Toggle navigation sidebar
        function toggleNav(show) {
            const nav = document.getElementById('question-nav');
            const overlay = document.getElementById('nav-overlay');
            
            if (show === undefined) {
                show = !nav.classList.contains('show');
            }
            
            if (show) {
                nav.classList.add('show');
                overlay.classList.add('show');
                document.body.style.overflow = 'hidden';
            } else {
                nav.classList.remove('show');
                overlay.classList.remove('show');
                document.body.style.overflow = '';
            }
        }
        
        // Update progress
        function updateProgress() {
            const attempted = Object.keys(answers).length;
            document.getElementById('attempted-count').textContent = attempted;
        }
        
        // Start timer
        function startTimer() {
            const timerDisplay = document.getElementById('timer-display');
            let timeLeft = totalTime;
            
            const timerInterval = setInterval(() => {
                if (timeLeft <= 0 || submitted) {
                    clearInterval(timerInterval);
                    if (!submitted) submitTest();
                    return;
                }
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                timeLeft--;
            }, 1000);
        }
        
        // Confirm before submitting
        function confirmSubmit() {
            if (submitted) return;
            
            const attempted = Object.keys(answers).length;
            const remaining = questions.length - attempted;
            
            // Create a more modern confirmation dialog
            const confirmHtml = `
                <div style="text-align: center; padding: 20px;">
                    <h4 style="margin-bottom: 16px; color: var(--dark);">Confirm Submission</h4>
                    <p style="margin-bottom: 24px; color: var(--gray);">
                        You have attempted ${attempted} of ${questions.length} questions.<br>
                        ${remaining} questions are unattempted.
                    </p>
                    <div style="display: flex; justify-content: center; gap: 12px;">
                        <button onclick="this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; border: 1px solid var(--light-gray); background: white; border-radius: 8px; cursor: pointer;">
                            Cancel
                        </button>
                        <button onclick="submitTest(); this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer;">
                            Submit Test
                        </button>
                    </div>
                </div>`;
            
            // Create modal element
            const modal = document.createElement('div');
            modal.className = 'results-modal show';
            modal.innerHTML = `
                <div class="results-card" style="max-width: 400px;">
                    <button class="cancel-btn" style="position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--gray);" onclick="this.closest('.results-modal').remove()">
                        ×
                    </button>
                    ${confirmHtml}
                </div>`;
            
            document.body.appendChild(modal);
        }
        
        // Submit test
        function submitTest() {
            if (submitted) return;
            
            submitted = true;
            
            let score = 0;
            let correctCount = 0;
            let incorrectCount = 0;
            let unattemptedCount = 0;
            
            questions.forEach((q, index) => {
                const userAns = answers[q.id];
                const box = document.getElementById(`box-${index}`);
                
                box.classList.remove('attempted');
                
                if (!userAns) {
                    unattemptedCount++;
                    box.classList.add('unattempted');
                } else if (userAns === q.correct) {
                    correctCount++;
                    score += q.pos_marks;
                    box.classList.add('correct');
                } else {
                    incorrectCount++;
                    score -= q.neg_marks;
                    box.classList.add('incorrect');
                }
            });
            
            // Update result values
            document.getElementById('score-value').textContent = score.toFixed(2);
            document.getElementById('correct-value').textContent = correctCount;
            document.getElementById('incorrect-value').textContent = incorrectCount;
            document.getElementById('unattempted-value').textContent = unattemptedCount;
            
            // Show the results modal
            document.getElementById('results-modal').classList.add('show');
            
            // Disable submit button
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-check"></i>';
            submitBtn.style.backgroundColor = 'var(--success)';
            
            // Refresh current question view to show solution
            showQuestion(currentQuestion);
        }
        
        // Review test
        function reviewTest() {
            document.getElementById('results-modal').classList.remove('show');
            showQuestion(0);
        }
        
        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('results-modal')) {
                document.getElementById('results-modal').classList.remove('show');
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === 'ArrowRight') nextQuestion();
        });
    </script>
</body>
</html>
