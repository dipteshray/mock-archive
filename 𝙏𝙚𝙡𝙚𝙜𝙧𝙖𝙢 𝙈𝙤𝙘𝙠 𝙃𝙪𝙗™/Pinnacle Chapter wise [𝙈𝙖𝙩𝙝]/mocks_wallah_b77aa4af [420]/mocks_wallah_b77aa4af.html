                questions.push({
                    id: "10",
                    section: "17",
                    question_en: "<p><span style=\"font-family: Cambria Math;\">10. A man sells two cows for Rs.15,640 each, gaining 15% on one and losing 15% on the </span><span style=\"font-family: Cambria Math;\">other. Find his total gain or loss.</span></p>",
                    question_hi: "<p><span style=\"font-family: Cambria Math;\">10. </span><span style=\"font-family: Nirmala UI;\">एक</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">आदमी</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">दो</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">गायों</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">को</span><span style=\"font-family: Cambria Math;\"> Rs.15,640 </span><span style=\"font-family: Nirmala UI;\">प्रत्येक</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">में</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">बेचता</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">है</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Nirmala UI;\">पहली</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">पर</span><span style=\"font-family: Cambria Math;\"> 15% </span><span style=\"font-family: Nirmala UI;\">का</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">लाभ</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">और</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">दूसरी</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">पर</span><span style=\"font-family: Cambria Math;\"> 15% </span><span style=\"font-family: Nirmala UI;\">की</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">हानि</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">होती</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">है।</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">उसका</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">कुल</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">लाभ</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">या</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">हानि</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">ज्ञात</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">कीजिए</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">।</span></p>",
                    options_en: ["<p>Rs.720 loss</p>", "<p>Rs.360 loss</p>", 
                                "<p>Rs.720 gain</p>", "<p>Rs.360 gain</p>"],
                    options_hi: ["<p>Rs.720 <span style=\"font-family: Nirmala UI;\">की</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">हानि</span></p>", "<p>Rs.360 <span style=\"font-family: Nirmala UI;\">की</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">हानि</span></p>",
                                "<p>Rs.720 <span style=\"font-family: Nirmala UI;\">का</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">लाभ</span></p>", "<p>Rs.360 <span style=\"font-family: Nirmala UI;\">का</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">लाभ</span></p>"],
                    solution_en: "<p>10.(a) <span style=\"font-family: Cambria Math;\">Balancing the given ratio , we have :</span><br>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;CP &nbsp; &nbsp; :&nbsp; &nbsp; SP<br>Ist cow&nbsp; &nbsp; &nbsp; 20&nbsp; &nbsp; &nbsp; : &nbsp; &nbsp; 23)<sub>&times;17</sub><br>2nd cow&nbsp; &nbsp; 20&nbsp; &nbsp; &nbsp; : &nbsp; &nbsp; 17)<sub>&times;23</sub><br>So, the total CP of cows = 20(17 + 23) = 20 &times; 40 = 800 unit&nbsp;<br>Total loss = 3 &times; 23 - 3 &times; 17 = 69 - 51 = 18 unit&nbsp;<br>Here, 23 &times; 17 = 391 unit corresponds to ₹15640&nbsp;<br>Then, 18 unit corresponds to <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>15640</mn><mn>391</mn></mfrac><mo>&#215;</mo><mo>&#160;</mo><mn>18</mn><mo>&#160;</mo><mo>=</mo><mo>&#8377;</mo><mn>720</mn><mo>&#160;</mo><mi>loss</mi></math><br><strong><span style=\"font-family: Cambria Math;\">Alternative method :</span></strong><br><span style=\"font-family: Cambria Math;\">Let the CP of each cow be 100%</span><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Then</mi><mo>,</mo><mo>&#160;</mo><mi>loss</mi><mo>&#160;</mo><mi>on</mi><mo>&#160;</mo><mi>two</mi><mo>&#160;</mo><mi>cows</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mfrac><msup><mn>15</mn><mn>2</mn></msup><mrow><mn>100</mn><mo>&#160;</mo></mrow></mfrac><mo>&#160;</mo><mo>%</mo><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mfrac><mn>225</mn><mn>100</mn></mfrac><mo>&#160;</mo><mo>%</mo><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mo>-</mo><mo>&#160;</mo><mn>2</mn><mo>.</mo><mn>25</mn><mo>%</mo></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Now</mi><mo>,</mo><mo>&#160;</mo><mn>97</mn><mo>.</mo><mn>75</mn><mo>%</mo><mo>&#160;</mo><mi>corresponds</mi><mo>&#160;</mo><mi>to</mi><mo>&#160;</mo><mn>15640</mn><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mn>2</mn><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mo>&#8377;</mo><mn>31280</mn></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Then</mi><mo>,</mo><mo>&#160;</mo><mn>2</mn><mo>.</mo><mn>25</mn><mo>%</mo><mo>&#160;</mo><mi>corresponds</mi><mo>&#160;</mo><mi>to</mi><mo>&#160;</mo><mfrac><mn>31280</mn><mrow><mn>97</mn><mo>.</mo><mn>75</mn></mrow></mfrac><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mn>2</mn><mo>.</mo><mn>25</mn><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mo>&#8377;</mo><mn>720</mn><mo>&#160;</mo><mi>loss</mi></math></p>",
                    solution_hi: "<p>10.(a) <span style=\"font-family: Nirmala UI;\">दिए</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">गए</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">अनुपात</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">को</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">संतुलित</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">करने</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">पर</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Nirmala UI;\">हमारे</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">पास</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">है</span><span style=\"font-family: Cambria Math;\">:</span><br>&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;CP &nbsp; &nbsp; :&nbsp; &nbsp; SP<br>पहली गाय &nbsp; &nbsp; 20&nbsp; &nbsp; &nbsp; : &nbsp; &nbsp; 23)<sub>&times;17</sub><br>दूसरी गाय &nbsp; &nbsp; 20&nbsp; &nbsp; &nbsp; : &nbsp; &nbsp; 17)<sub>&times;23</sub><br>तब, कुल गायों का क्रय मूल्य = 20(17 + 23) = 20 &times; 40 = 800 इकाई&nbsp;<br>कुल हानि = 3 &times; 23 - 3 &times; 17 = 69 - 51 = 18 इकाई&nbsp;<br>यहाँ, 23 &times; 17 = 391 इकाई = ₹15640&nbsp;<br>अतः, 18 इकाई =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>15640</mn><mn>391</mn></mfrac><mo>&#215;</mo><mo>&#160;</mo><mn>18</mn><mo>&#160;</mo><mo>=</mo><mo>&#8377;</mo><mn>720</mn></math> हानि<br><strong>दूसरा तरीका :</strong><br>माना कि प्रत्येक गाय का क्रय मूल्य = 100%<br><math style=\"font-family:Verdana\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#2340;&#2348;</mi><mo>,</mo><mo>&#160;</mo><mi>&#2342;&#2379;</mi><mo>&#160;</mo><mo>&#160;</mo><mi>&#2327;&#2366;&#2351;&#2379;&#2306;</mi><mo>&#160;</mo><mi>&#2346;&#2352;</mi><mo>&#160;</mo><mi>&#2361;&#2366;&#2344;&#2367;</mi><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mfrac><msup><mn>15</mn><mn>2</mn></msup><mn>100</mn></mfrac><mo>%</mo><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mfrac><mn>225</mn><mn>100</mn></mfrac><mo>%</mo><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mo>-</mo><mn>2</mn><mo>.</mo><mn>25</mn><mo>%</mo></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#2309;&#2348;</mi><mo>,</mo><mo>&#160;</mo><mn>97</mn><mo>.</mo><mn>75</mn><mo>%</mo><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>15640</mn><mo>&#215;</mo><mn>2</mn><mo>&#160;</mo><mo>=</mo><mo>&#8377;</mo><mn>31280</mn></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#2340;&#2348;</mi><mo>,</mo><mo>&#160;</mo><mn>2</mn><mo>.</mo><mn>25</mn><mo>%</mo><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mfrac><mn>31280</mn><mrow><mn>97</mn><mo>.</mo><mn>75</mn></mrow></mfrac><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mn>2</mn><mo>.</mo><mn>25</mn><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mo>&#8377;</mo><mn>720</mn><mo>&#160;</mo><mi>&#2361;&#2366;&#2344;&#2367;</mi><mo>&#160;</mo></math></p>\n<p><span style=\"font-family: Cambria Math;\"> </span></p>",
                    correct: "a",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });

                    question_hi: "<p><span style=\"font-family: Cambria Math;\">11. </span><span style=\"font-family: Nirmala UI;\">एक</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">वस्तु</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">के</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">क्रय</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">मूल्य</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">और</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">विक्रय</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">मूल्य</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">का</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">अनुपात</span><span style=\"font-family: Cambria Math;\"> 10 : 11 </span><span style=\"font-family: Nirmala UI;\">है।</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">लाभ</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">प्रतिशत</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">ज्ञात</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">कीजिए</span><span style=\"font-family: Cambria Math;\"> </span></p>",

                    solution_en: "<p>11.(a)<br>Required profit% =<strong id=\"docs-internal-guid-39038abb-7fff-0218-c312-cebc9684eb47\"> </strong><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>11</mn><mo>-</mo><mn>10</mn></mrow><mn>10</mn></mfrac><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mn>100</mn><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mfrac><mn>1</mn><mn>10</mn></mfrac><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mn>100</mn><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>10</mn><mo>%</mo></math></p>",
                    solution_hi: "<p>1.(a)<br>आवश्यक लाभ % =<strong id=\"docs-internal-guid-39038abb-7fff-0218-c312-cebc9684eb47\"> </strong><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>11</mn><mo>-</mo><mn>10</mn></mrow><mn>10</mn></mfrac><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mn>100</mn><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mfrac><mn>1</mn><mn>10</mn></mfrac><mo>&#160;</mo><mo>&#215;</mo><mo>&#160;</mo><mn>100</mn><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>10</mn><mo>%</mo></math></p>",

                questions.push({
                    id: "12",
                    section: "17",
                    question_en: "<p><span style=\"font-family: Cambria Math;\">12. A Microwave oven is sold in Hyderabad for Rs.M. A retailer, Elahi from Hyderabad went to Madras and bought it for 25% less (when compared to the price in Hyderabad). He spends Rs.1,000 on transport to bring it from Madras to Hyderabad. He sold it in Hyderabad for Rs.M making a profit of 10%. Find the value of M (in Rs.).</span></p>",
                    question_hi: "<p><span style=\"font-family: Cambria Math;\">12. </span><span style=\"font-family: Nirmala UI;\">हैदराबाद</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">में</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">एक</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">माइक्रोवेव</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">ओवन</span><span style=\"font-family: Cambria Math;\"> Rs. M </span><span style=\"font-family: Nirmala UI;\">में</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">बेचा</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">जाता</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">है।</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">एक</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">खुदरा</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">विक्रेता</span><span style=\"font-family: Cambria Math;\">, </span><span style=\"font-family: Nirmala UI;\">इलाही</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">हैदराबाद</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">से</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">मद्रास</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">गया</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">और</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\                     options_en: ["<p><span style=\"font-family: Cambria Math;\">25%</span></p>", "<p><span style=\"font-family: Cambria Math;\">15%</span></p>", 
                                "<p><span style=\"font-family: Cambria Math;\">75%</span></p>", "<p><span style=\"font-family: Cambria Math;\">50%</span></p>"],
                    options_hi: ["<p><span style=\"font-family: Cambria Math;\">25%</span></p>", "<p><span style=\"font-family: Cambria Math;\">15%</span></p>",
                                "<p><span style=\"font-family: Cambria Math;\">75%</span></p>", "<p><span style=\"font-family: Cambria Math;\">50%</span></p>"],
                    solution_en: "<p>14.(a)<br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>profit</mi><mo>&#160;</mo><mo>%</mo><mo>=</mo><mo>&#160;</mo><mfrac><mn>75</mn><mn>1500</mn></mfrac><mo>&#215;</mo><mn>100</mn><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>5</mn><mo>%</mo><mo>&#160;</mo><mo>,</mo><mo>&#160;</mo><mi>markup</mi><mo>%</mo><mo>&#160;</mo><mo>=</mo><mn>40</mn><mo>%</mo></math><br>we have following ratio :<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;5&nbsp; &nbsp; : &nbsp; 7<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;x&nbsp; &nbsp; : &nbsp; y<br>&nbsp;&nbsp;&nbsp;&nbsp;_________________<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;20 &nbsp; : &nbsp; 21<br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mo>&#160;</mo><mi>x</mi><mo>&#160;</mo><mo>:</mo><mo>&#160;</mo><mi>y</mi><mo>=</mo><mo>&#160;</mo><mfrac><mrow><mn>20</mn><mo>&#215;</mo><mn>7</mn></mrow><mrow><mn>21</mn><mo>&#215;</mo><mn>5</mn></mrow></mfrac><mo>=</mo><mfrac><mn>140</mn><mn>105</mn></mfrac><mo>=</mo><mfrac><mn>4</mn><mn>3</mn></mfrac></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>Required</mi><mo>&#160;</mo><mi>discount</mi><mo>%</mo><mo>=</mo><mfrac><mrow><mn>4</mn><mo>-</mo><mn>3</mn></mrow><mn>4</mn></mfrac><mo>&#215;</mo><mn>100</mn><mo>=</mo><mfrac><mn>1</mn><mn>4</mn></mfrac><mo>&#215;</mo><mn>100</mn><mo>&#160;</mo><mo>=</mo><mn>25</mn><mo>%</mo></math></p>",
                    solution_hi: "<p>14.(a)<br><math style=\"font-family:Verdana\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>&#2354;&#2366;&#2349;</mi><mo>%</mo><mo>&#160;</mo><mo>=</mo><mfrac><mn>75</mn><mn>1500</mn></mfrac><mo>&#215;</mo><mn>100</mn><mo>=</mo><mn>5</mn><mo>%</mo><mo>&#160;</mo><mo>,</mo><mo>&#160;</mo><mi>&#2325;&#2368;&#2350;&#2340;</mi><mo>&#160;</mo><mi>&#2350;&#2375;&#2306;</mi><mo>&#160;</mo><mi>&#2357;&#2371;&#2342;&#2381;&#2343;&#2367;</mi><mo>%</mo><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>40</mn><mo>%</mo></math><br>हमारे पास निम्नलिखित अनुपात है:<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;5&nbsp; &nbsp; : &nbsp; 7<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;x&nbsp; &nbsp; : &nbsp; y<br>&nbsp;&nbsp;&nbsp;&nbsp;_________________<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;20 &nbsp; : &nbsp; 21<br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo><mo>&#160;</mo><mo>&#160;</mo><mi>x</mi><mo>&#160;</mo><mo>:</mo><mo>&#160;</mo><mi>y</mi><mo>=</mo><mo>&#160;</mo><mfrac><mrow><mn>20</mn><mo>&#215;</mo><mn>7</mn></mrow><mrow><mn>21</mn><mo>&#215;</mo><mn>5</mn></mrow></mfrac><mo>=</mo><mfrac><mn>140</mn><mn>105</mn></mfrac><mo>=</mo><mfrac><mn>4</mn><mn>3</mn></mfrac></math><br>आवश्यक छूट % = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>4</mn><mo>-</mo><mn>3</mn></mrow><mn>4</mn></mfrac><mo>&#215;</mo><mn>100</mn><mo>=</mo><mfrac><mn>1</mn><mn>4</mn></mfrac><mo>&#215;</mo><mn>100</mn><mo>&#160;</mo><mo>=</mo><mn>25</mn><mo>%</mo></math></p>",
                    correct: "a",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "15",
                    section: "misc",
                    question_en: "<p><span style=\"font-family: Cambria Math;\">15.</span><span style=\"font-family: Cambria Math;\"> A watch is sold at a profit of 25%. Had it been sold for Rs.120 less then, there would </span><span style=\"font-family: Cambria Math;\">have been a loss of 15%. What is the cost price in rupees?</span></p>",
                    question_hi: "<p><span style=\"font-family: Cambria Math;\">15. </span><span style=\"font-family: Nirmala UI;\">एक</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">घड़ी</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">को</span><span style=\"font-family: Cambria Math;\"> 25% </span><span style=\"font-family: Nirmala UI;\">के</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">लाभ</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">पर</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">बेचा</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">गया</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">है।</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">यदि</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">इसे</span><span style=\"font-family: Cambria Math;\"> 120 </span><span style=\"font-family: Nirmala UI;\">रुपये</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">कम</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">में</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">बेचा</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">जाता</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">तो</span><span style=\"font-family: Cambria Math;\"> 15% </span><span style=\"font-family: Nirmala UI;\">हानि</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">होती</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">।</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">रुपये</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">में</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">क्रय</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">मूल्य</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">क्या</span><span style=\"font-family: Cambria Math;\"> </span><span style=\"font-family: Nirmala UI;\">है</span><span style=\"font-family: Cambria Math;\">?</span></p>",
                    options_en: ["<p>Rs.400</p>", "<p>Rs.350</p>", 
                                "<p>Rs.200</p>", "<p>Rs.300</p>"],
                    options_hi: ["<p>Rs.400</p>", "<p>Rs.350</p>",
                                "<p>Rs.200</p>", "<p>Rs.300</p>"],
                    solution_en: "<p>15.(d)<br>Let the CP of&nbsp; a watch be 100%<br>ATQ, 25 + 15 = 40% corresponds to ₹120<br>Then, 100% corresponds to<strong id=\"docs-internal-guid-f5e4a211-7fff-a200-f101-a78c95f9d6c3\"> </strong><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>120</mn><mn>40</mn></mfrac><mo>&#215;</mo><mn>100</mn><mo>&#160;</mo><mo>=</mo><mo>&#8377;</mo><mn>300</mn></math></p>",
                    solution_hi: "<p>15.(d)<br>माना एक घड़ी का CP = 100%&nbsp;<br>प्रश्न के अनुसार ,&nbsp;<br>25 + 15 = 40%<br>40% &rarr;&nbsp; ₹120,<br>तब ,100%&nbsp; &rarr; <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>120</mn><mn>40</mn></mfrac><mo>&#215;</mo><mn>100</mn><mo>&#160;</mo><mo>=</mo><mo>&#8377;</mo><mn>300</mn></math></p>",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
            
            // Generate question boxes
            const boxesContainer = document.getElementById('question-boxes');
            questions.forEach((q, index) => {
                const box = document.createElement('div');
                box.className = 'q-box';
                box.textContent = index + 1;
                box.onclick = () => showQuestion(index);
                box.id = `box-${index}`;
                boxesContainer.appendChild(box);
            });
            
            // Show first question
            showQuestion(0);
            updateProgress();
        }
        
        // Show a specific question
        
        function formatContent(text) {
            if (!text) return '';
            return text.replace(/<img/g, '<img style="max-width:100%;height:auto;"');
        }
        
        function showQuestion(index) {
            if (index < 0 || index >= questions.length) return;
            
            currentQuestion = index;
            const question = questions[index];
            
            // Update question counter
            document.getElementById('question-counter').textContent = `Question ${index + 1} of ${questions.length}`;
            
            // Update question boxes
            document.querySelectorAll('.q-box').forEach(box => box.classList.remove('current'));
            document.getElementById(`box-${index}`).classList.add('current');
            
            // Generate question HTML
            let html = `
                <div class="question-card">
                    <div class="question-text">
                        <div class="en">${formatContent(question.question_en)}</div>
                        <div class="hi" style="display:none">${formatContent(question.question_hi)} </div>
                    </div>
                    <div class="options" id="options-container">`;
            
            // Add options
            ['a', 'b', 'c', 'd'].forEach((opt, i) => {
                let optionClass = '';
                let isCorrectAnswer = opt === question.correct;
                let isUserAnswer = answers[question.id] === opt;
                
                // When reviewing, add appropriate classes
                if (submitted) {
                    if (isCorrectAnswer) {
                        optionClass += ' correct-answer';
                    } else if (isUserAnswer && !isCorrectAnswer) {
                        optionClass += ' incorrect';
                    }
                }
                
                html += `
                    <div class="option-item">
                        <input class="option-input" type="radio" name="q${index}" 
                            id="opt-${index}-${opt}" value="${opt}" 
                            ${isUserAnswer ? 'checked' : ''}
                            onclick="selectAnswer('${question.id}', '${opt}')">
                       <label class="option-label${optionClass}" for="opt-${index}-${opt}">
                            <div class="en">${question.options_en[i]}</div>
                            <div class="hi" style="display:none">${question.options_hi[i]}</div>
                        </label>
                    </div>`;
            });
            
            // Add solution if submitted
            if (submitted) {
                const isCorrect = answers[question.id] === question.correct;
                const resultText = answers[question.id] ? (isCorrect ? 'Correct!' : 'Incorrect!') : 'Not attempted';
                
                html += `
                    <div class="solution-container">
                        <div class="solution-title">${resultText}</div>
                        <div class="solution-text">
                            <div class="en">${question.solution_en}</div>
                            <div class="hi" style="display:none">${question.solution_hi}</div>
                        </div>
                    </div>`;
            }
            
            html += `</div></div>`;
            
            document.getElementById('questions-container').innerHTML = html;
            
            // Apply language settings
            applyLanguage();
            
            // If in mobile view, close the menu
            if (window.innerWidth < 992) {
                toggleNav(false);
            }
            
            // Add review mode class if submitted
            if (submitted) {
                document.getElementById('options-container').classList.add('review-mode');
            }
        }
        
        // Apply current language
        function applyLanguage() {
            document.querySelectorAll(`.${currentLang}`).forEach(el => el.style.display = 'block');
            document.querySelectorAll(`.${currentLang === 'en' ? 'hi' : 'en'}`).forEach(el => el.style.display = 'none');
            
            // Update language button text
            document.getElementById('lang-text').textContent = currentLang === 'en' ? 'Hi' : 'En';
        }
        
        // Select an answer
        function selectAnswer(qId, option) {
            if (submitted) return;
            
            answers[qId] = option;
            updateProgress();
            
            // Mark question as attempted in the navigation
            const index = questions.findIndex(q => q.id === qId);
            if (index >= 0) {
                const box = document.getElementById(`box-${index}`);
                box.classList.add('attempted');
                box.classList.remove('unattempted');
            }
        }
        
        // Navigate to previous/next question
        function prevQuestion() { 
            if (currentQuestion > 0) showQuestion(currentQuestion - 1); 
        }
        
        function nextQuestion() { 
            if (currentQuestion < questions.length - 1) showQuestion(currentQuestion + 1); 
        }
        
        // Switch section
        function switchSection(sectionId) {
            if (sectionId === 'all') {
                showQuestion(0);
                return;
            }
            
            const section = sections[sectionId];
            if (section) showQuestion(section.start);
        }
        
        // Toggle language
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            applyLanguage();
        }
        
        // Toggle navigation sidebar
        function toggleNav(show) {
            const nav = document.getElementById('question-nav');
            const overlay = document.getElementById('nav-overlay');
            
            if (show === undefined) {
                show = !nav.classList.contains('show');
            }
            
            if (show) {
                nav.classList.add('show');
                overlay.classList.add('show');
                document.body.style.overflow = 'hidden';
            } else {
                nav.classList.remove('show');
                overlay.classList.remove('show');
                document.body.style.overflow = '';
            }
        }
        
        // Update progress
        function updateProgress() {
            const attempted = Object.keys(answers).length;
            document.getElementById('attempted-count').textContent = attempted;
        }
        
        // Start timer
        function startTimer() {
            const timerDisplay = document.getElementById('timer-display');
            let timeLeft = totalTime;
            
            const timerInterval = setInterval(() => {
                if (timeLeft <= 0 || submitted) {
                    clearInterval(timerInterval);
                    if (!submitted) submitTest();
                    return;
                }
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                timeLeft--;
            }, 1000);
        }
        
        // Confirm before submitting
        function confirmSubmit() {
            if (submitted) return;
            
            const attempted = Object.keys(answers).length;
            const remaining = questions.length - attempted;
            
            // Create a more modern confirmation dialog
            const confirmHtml = `
                <div style="text-align: center; padding: 20px;">
                    <h4 style="margin-bottom: 16px; color: var(--dark);">Confirm Submission</h4>
                    <p style="margin-bottom: 24px; color: var(--gray);">
                        You have attempted ${attempted} of ${questions.length} questions.<br>
                        ${remaining} questions are unattempted.
                    </p>
                    <div style="display: flex; justify-content: center; gap: 12px;">
                        <button onclick="this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; border: 1px solid var(--light-gray); background: white; border-radius: 8px; cursor: pointer;">
                            Cancel
                        </button>
                        <button onclick="submitTest(); this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer;">
                            Submit Test
                        </button>
                    </div>
                </div>`;
            
            // Create modal element
            const modal = document.createElement('div');
            modal.className = 'results-modal show';
            modal.innerHTML = `
                <div class="results-card" style="max-width: 400px;">
                    <button class="cancel-btn" style="position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--gray);" onclick="this.closest('.results-modal').remove()">
                        ×
                    </button>
                    ${confirmHtml}
                </div>`;
            
            document.body.appendChild(modal);
        }
        
        // Submit test
        function submitTest() {
            if (submitted) return;
            
            submitted = true;
            
            let score = 0;
            let correctCount = 0;
            let incorrectCount = 0;
            let unattemptedCount = 0;
            
            questions.forEach((q, index) => {
                const userAns = answers[q.id];
                const box = document.getElementById(`box-${index}`);
                
                box.classList.remove('attempted');
                
                if (!userAns) {
                    unattemptedCount++;
                    box.classList.add('unattempted');
                } else if (userAns === q.correct) {
                    correctCount++;
                    score += q.pos_marks;
                    box.classList.add('correct');
                } else {
                    incorrectCount++;
                    score -= q.neg_marks;
                    box.classList.add('incorrect');
                }
            });
            
            // Update result values
            document.getElementById('score-value').textContent = score.toFixed(2);
            document.getElementById('correct-value').textContent = correctCount;
            document.getElementById('incorrect-value').textContent = incorrectCount;
            document.getElementById('unattempted-value').textContent = unattemptedCount;
            
            // Show the results modal
            document.getElementById('results-modal').classList.add('show');
            
            // Disable submit button
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-check"></i>';
            submitBtn.style.backgroundColor = 'var(--success)';
            
            // Refresh current question view to show solution
            showQuestion(currentQuestion);
        }
        
        // Review test
        function reviewTest() {
            document.getElementById('results-modal').classList.remove('show');
            showQuestion(0);
        }
        
        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('results-modal')) {
                document.getElementById('results-modal').classList.remove('show');
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === 'ArrowRight') nextQuestion();
        });
    </script>
</body>
</html>
