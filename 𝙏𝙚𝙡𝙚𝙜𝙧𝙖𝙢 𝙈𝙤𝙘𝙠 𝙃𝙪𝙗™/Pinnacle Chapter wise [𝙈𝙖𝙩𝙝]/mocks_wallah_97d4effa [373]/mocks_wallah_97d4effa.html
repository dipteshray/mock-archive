                    neg_marks: 0.5
                });
                questions.push({
                    id: "18",
                    section: "17",
                    question_en: "<p>18. <span style=\"font-family: Times New Roman;\">The following bar chart shows the number of students enrolled in two Summer Camps A and B from 2014 to 2019.&nbsp;<br></span><span style=\"font-family: Times New Roman;\">Study the chart carefully and answer the questions that </span><span style=\"font-family: Times New Roman;\">follows</span><span style=\"font-family: Times New Roman;\">.<br></span><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXeK7dl8lOzFR_IPoQCqGL8xX5e4K1PFMzE4Nc57TELqidks9QkMWocDjq0TDP6TxUKF0m4BlR1LVjMB6fcoum4Iwt4RXfgoKyWCAzeIPXVpgrfx3mSTiJmzXdmaA2Q8dq46U4QAxVa-WDt5IVpnUFgVZzk?key=rLhyzYdOe3_N70s3RCdieiLI\" width=\"336\" height=\"264\"><br><span style=\"font-family: Times New Roman;\">What is the ratio of the students enrolled in Camp A in 2014, 2016 and 2017 to the students enrolled in Camp B in 2015, 2018 and 2019?</span></p>",
                    question_hi: "<p>18. <span style=\"font-family: Baloo;\">निम्नलिखित बार चार्ट 2014 से 2019 तक दो समर कैंप A और B में नामांकित छात्रों की संख्या को दर्शाता है। चार्ट का ध्यानपूर्वक अध्ययन करें और नीचे दिए गए प्रश्नों के उत्तर दें।<br></span><strong id=\"docs-internal-guid-46901d3a-7fff-7f65-bc35-712dedd4cb66\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXciasoUtZ4nB0wYdOIfheav6egQ48McLUhjs4ujeBtn2Kg6OPJxUJueRYlPO5pmWjNu8MCbPsSA8l2qfC1HW6P6J7qxwEEuegm7PvmbzMpRK6fDf69AKSuvGzi-9678jxeKHvfa?key=3CG07PQ74LV66ubMJGDHTg\" width=\"372\" height=\"267\"><br></strong><span style=\"font-family: Baloo;\">2014, 2016 और 2017 में कैंप A में नामांकित छात्रों का 2015, 2018 और 2019 में कैंप B में नामांकित छात्रों से अनुपात कितना है?</span></p>",
                    options_en: ["<p>18 : 13</p>", "<p>22 : 15</p>", 
                                "<p>13 : 18</p>", "<p>15 : 22</p>"],
                    options_hi: ["<p>18 : 13</p>", "<p>22 : 15</p>",
                                "<p>13 : 18</p>", "<p>15 : 22</p>"],
                    solution_en: "<p>18.(c) <span style=\"font-family: Times New Roman;\">Number of students enrolled in Camp A in 2014, 2016 and 2017 = 160 + 140 + 220 = 520&nbsp;<br></span><span style=\"font-family: Times New Roman;\">Number of students enrolled in Camp B in 2015, 2018 and 2019 = 240 + 200 + 280 = 720<br></span><span style=\"font-family: Times New Roman;\">Required ratio = 520 : 720 = 13 : 18</span></p>",
                    solution_hi: "<p>18.(c) <span style=\"font-family: Baloo;\">2014, 2016 और 2017 में कैंप A में नामांकित छात्रों की संख्या = 160 + 140 + 220 = 520<br></span><span style=\"font-family: Baloo;\">2015, 2018 और 2019 में कैंप B में नामांकित छात्रों की संख्या = 240 + 200 + 280 = 720<br></span><span style=\"font-family: Baloo;\">अभीष्ट अनुपात = 520 : 720 = 13 : 18</span></p>",
                    correct: "c",

                questions.push({
                    id: "19",
                    section: "17",
                    question_en: "<p>19.<span style=\"font-family: Times New Roman;\"> Study the given histogram and answer the question that follows.<br></span><strong id=\"docs-internal-guid-bf6067ce-7fff-69e6-ec55-b0dff3290297\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXcmpkVTFgqc_i6m0Qcj5a6dbNzgTYP6gifOwGwO4EZ8RfA19VzPbbz6rt1cW0HR5hdT20MLwvLPKxcdfUz0PT2noqS_qnmBVkMzXlCncIaMPaR6Qlk8ZXbCjINa7_xvIhGYJIGn?key=3CG07PQ74LV66ubMJGDHTg\" width=\"313\" height=\"211\"><br></strong><span style=\"font-family: Times New Roman;\">What is the difference between the total number of workers whose daily wages are less than Rs. 450 and the total number of workers whose daily wages are Rs. 650 and above?</span></p>",
                    question_hi: "<p>19. <span style=\"font-family: Baloo;\">दिए गए हिस्टोग्राम का अध्ययन करें और नीचे दिए गए प्रश्न का उत्तर दें।<br></span><strong id=\"docs-internal-guid-04b0fe7a-7fff-ad24-9cc2-a1b6e004c940\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXecCcW1lr6yYYrOG_C82oBVo_7In7qnHJrw9XTN3go4VlJflvftWiIdUjD-nxQ96IhSyYJPMe4GgOk-E2zyzxuFeK5oB3VycdVzgxLxvw2zdNICniN6DE-gNKaq-xODkkooAwUF?key=3CG07PQ74LV66ubMJGDHTg\" width=\"386\" height=\"266\"><br></strong><span style=\"font-family: Baloo;\">450 रूपये से कम दैनिक मजदूरी वाले श्रमिकों की कुल संख्या तथा 650 रूपये और उससे अधिक दैनिक मजदूरी वाले श्रमिकों की कुल संख्या के बीच का अंतर कितना है ?</span></p>",
                    options_en: ["<p><span style=\"font-family: Times New Roman;\">4</span></p>", "<p>8</p>", 
                                "<p>10</p>", "<p>5</p>"],
                    options_hi: ["<p>4</p>", "<p>8</p>",
                                "<p>10</p>", "<p>5</p>"],
                    solution_en: "<p>19.(d) <span style=\"font-family: Times New Roman;\">Number of workers whose daily wages are less than Rs. 450 = 30<br></span><span style=\"font-family: Times New Roman;\">Number of workers whose daily wages are Rs. 650 and above = 35<br></span><span style=\"font-family: Times New Roman;\">Required difference = 35 &ndash; 30 = 5</span></p>",
                    solution_hi: "<p>19.(d) <span style=\"font-family: Baloo;\">उन श्रमिकों की संख्या जिनकी दैनिक मजदूरी 450 रुपये से कम है = 30<br></span><span style=\"font-family: Baloo;\">उन श्रमिकों की संख्या जिनकी दैनिक मजदूरी 650 रुपये और उससे अधिक है = 35<br></span><span style=\"font-family: Baloo;\">अभीष्ट अंतर = 35 &ndash; 30 = 5</span></p>",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({

                    options_en: ["<p>4 : 3</p>", "<p>1 : 2</p>", 
                                "<p>3 : 4</p>", "<p>2 : 1</p>"],
                    options_hi: ["<p>4 : 3</p>", "<p>1 : 2</p>",
                                "<p>3 : 4</p>", "<p>2 : 1</p>"],
                    solution_en: "<p>20.(c) <span style=\"font-family: Times New Roman;\">Let total number of students in all schools = n<br></span><span style=\"font-family: Times New Roman;\">Required ratio = </span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">n</mi><mo>&#215;</mo><mfrac><mn>24</mn><mn>100</mn></mfrac><mo>&#215;</mo><mfrac><mn>3</mn><mn>8</mn></mfrac><mo>:</mo><mi mathvariant=\"normal\">n</mi><mo>&#215;</mo><mfrac><mn>15</mn><mn>100</mn></mfrac><mo>&#215;</mo><mfrac><mn>4</mn><mn>5</mn></mfrac><mo>=</mo><mn>3</mn><mo>:</mo><mn>4</mn></math></p>",
                    solution_hi: "<p>20.(c) <span style=\"font-family: Baloo;\">माना सभी विद्यालयों में विद्यार्थियों की कुल संख्या = n<br></span><span style=\"font-family: Baloo;\">आवश्यक अनुपात =<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi mathvariant=\"normal\">n</mi><mo>&#215;</mo><mfrac><mn>24</mn><mn>100</mn></mfrac><mo>&#215;</mo><mfrac><mn>3</mn><mn>8</mn></mfrac><mo>:</mo><mi mathvariant=\"normal\">n</mi><mo>&#215;</mo><mfrac><mn>15</mn><mn>100</mn></mfrac><mo>&#215;</mo><mfrac><mn>4</mn><mn>5</mn></mfrac><mo>=</mo><mn>3</mn><mo>:</mo><mn>4</mn></math></span></p>",
                    correct: "c",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
            
            // Generate question boxes
            const boxesContainer = document.getElementById('question-boxes');
            questions.forEach((q, index) => {
                const box = document.createElement('div');
                box.className = 'q-box';
                box.textContent = index + 1;
                box.onclick = () => showQuestion(index);
                box.id = `box-${index}`;
                boxesContainer.appendChild(box);
            });
            
            // Show first question
            showQuestion(0);
            updateProgress();
        }
        
        // Show a specific question
        
        function formatContent(text) {
            if (!text) return '';
            return text.replace(/<img/g, '<img style="max-width:100%;height:auto;"');
        }
        
        function showQuestion(index) {
            if (index < 0 || index >= questions.length) return;
            
            currentQuestion = index;
            const question = questions[index];
            
            // Update question counter
            document.getElementById('question-counter').textContent = `Question ${index + 1} of ${questions.length}`;
            
            // Update question boxes
            document.querySelectorAll('.q-box').forEach(box => box.classList.remove('current'));
            document.getElementById(`box-${index}`).classList.add('current');
            
            // Generate question HTML
            let html = `
                <div class="question-card">
                    <div class="question-text">
                        <div class="en">${formatContent(question.question_en)}</div>
                        <div class="hi" style="display:none">${formatContent(question.question_hi)} </div>
                    </div>
                    <div class="options" id="options-container">`;
            
            // Add options
            ['a', 'b', 'c', 'd'].forEach((opt, i) => {
                let optionClass = '';
                let isCorrectAnswer = opt === question.correct;
                let isUserAnswer = answers[question.id] === opt;
                
                // When reviewing, add appropriate classes
                if (submitted) {
                    if (isCorrectAnswer) {
                        optionClass += ' correct-answer';
                    } else if (isUserAnswer && !isCorrectAnswer) {
                        optionClass += ' incorrect';
                    }
                }
                
                html += `
                    <div class="option-item">
                        <input class="option-input" type="radio" name="q${index}" 
                            id="opt-${index}-${opt}" value="${opt}" 
                            ${isUserAnswer ? 'checked' : ''}
                            onclick="selectAnswer('${question.id}', '${opt}')">
                       <label class="option-label${optionClass}" for="opt-${index}-${opt}">
                            <div class="en">${question.options_en[i]}</div>
                            <div class="hi" style="display:none">${question.options_hi[i]}</div>
                        </label>
                    </div>`;
            });
            
            // Add solution if submitted
            if (submitted) {
                const isCorrect = answers[question.id] === question.correct;
                const resultText = answers[question.id] ? (isCorrect ? 'Correct!' : 'Incorrect!') : 'Not attempted';
                
                html += `
                    <div class="solution-container">
                        <div class="solution-title">${resultText}</div>
                        <div class="solution-text">
                            <div class="en">${question.solution_en}</div>
                            <div class="hi" style="display:none">${question.solution_hi}</div>
                        </div>
                    </div>`;
            }
            
            html += `</div></div>`;
            
            document.getElementById('questions-container').innerHTML = html;
            
            // Apply language settings
            applyLanguage();
            
            // If in mobile view, close the menu
            if (window.innerWidth < 992) {
                toggleNav(false);
            }
            
            // Add review mode class if submitted
            if (submitted) {
                document.getElementById('options-container').classList.add('review-mode');
            }
        }
        
        // Apply current language
        function applyLanguage() {
            document.querySelectorAll(`.${currentLang}`).forEach(el => el.style.display = 'block');
            document.querySelectorAll(`.${currentLang === 'en' ? 'hi' : 'en'}`).forEach(el => el.style.display = 'none');
            
            // Update language button text
            document.getElementById('lang-text').textContent = currentLang === 'en' ? 'Hi' : 'En';
        }
        
        // Select an answer
        function selectAnswer(qId, option) {
            if (submitted) return;
            
            answers[qId] = option;
            updateProgress();
            
            // Mark question as attempted in the navigation
            const index = questions.findIndex(q => q.id === qId);
            if (index >= 0) {
                const box = document.getElementById(`box-${index}`);
                box.classList.add('attempted');
                box.classList.remove('unattempted');
            }
        }
        
        // Navigate to previous/next question
        function prevQuestion() { 
            if (currentQuestion > 0) showQuestion(currentQuestion - 1); 
        }
        
        function nextQuestion() { 
            if (currentQuestion < questions.length - 1) showQuestion(currentQuestion + 1); 
        }
        
        // Switch section
        function switchSection(sectionId) {
            if (sectionId === 'all') {
                showQuestion(0);
                return;
            }
            
            const section = sections[sectionId];
            if (section) showQuestion(section.start);
        }
        
        // Toggle language
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            applyLanguage();
        }
        
        // Toggle navigation sidebar
        function toggleNav(show) {
            const nav = document.getElementById('question-nav');
            const overlay = document.getElementById('nav-overlay');
            
            if (show === undefined) {
                show = !nav.classList.contains('show');
            }
            
            if (show) {
                nav.classList.add('show');
                overlay.classList.add('show');
                document.body.style.overflow = 'hidden';
            } else {
                nav.classList.remove('show');
                overlay.classList.remove('show');
                document.body.style.overflow = '';
            }
        }
        
        // Update progress
        function updateProgress() {
            const attempted = Object.keys(answers).length;
            document.getElementById('attempted-count').textContent = attempted;
        }
        
        // Start timer
        function startTimer() {
            const timerDisplay = document.getElementById('timer-display');
            let timeLeft = totalTime;
            
            const timerInterval = setInterval(() => {
                if (timeLeft <= 0 || submitted) {
                    clearInterval(timerInterval);
                    if (!submitted) submitTest();
                    return;
                }
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                timeLeft--;
            }, 1000);
        }
        
        // Confirm before submitting
        function confirmSubmit() {
            if (submitted) return;
            
            const attempted = Object.keys(answers).length;
            const remaining = questions.length - attempted;
            
            // Create a more modern confirmation dialog
            const confirmHtml = `
                <div style="text-align: center; padding: 20px;">
                    <h4 style="margin-bottom: 16px; color: var(--dark);">Confirm Submission</h4>
                    <p style="margin-bottom: 24px; color: var(--gray);">
                        You have attempted ${attempted} of ${questions.length} questions.<br>
                        ${remaining} questions are unattempted.
                    </p>
                    <div style="display: flex; justify-content: center; gap: 12px;">
                        <button onclick="this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; border: 1px solid var(--light-gray); background: white; border-radius: 8px; cursor: pointer;">
                            Cancel
                        </button>
                        <button onclick="submitTest(); this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer;">
                            Submit Test
                        </button>
                    </div>
                </div>`;
            
            // Create modal element
            const modal = document.createElement('div');
            modal.className = 'results-modal show';
            modal.innerHTML = `
                <div class="results-card" style="max-width: 400px;">
                    <button class="cancel-btn" style="position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--gray);" onclick="this.closest('.results-modal').remove()">
                        ×
                    </button>
                    ${confirmHtml}
                </div>`;
            
            document.body.appendChild(modal);
        }
        
        // Submit test
        function submitTest() {
            if (submitted) return;
            
            submitted = true;
            
            let score = 0;
            let correctCount = 0;
            let incorrectCount = 0;
            let unattemptedCount = 0;
            
            questions.forEach((q, index) => {
                const userAns = answers[q.id];
                const box = document.getElementById(`box-${index}`);
                
                box.classList.remove('attempted');
                
                if (!userAns) {
                    unattemptedCount++;
                    box.classList.add('unattempted');
                } else if (userAns === q.correct) {
                    correctCount++;
                    score += q.pos_marks;
                    box.classList.add('correct');
                } else {
                    incorrectCount++;
                    score -= q.neg_marks;
                    box.classList.add('incorrect');
                }
            });
            
            // Update result values
            document.getElementById('score-value').textContent = score.toFixed(2);
            document.getElementById('correct-value').textContent = correctCount;
            document.getElementById('incorrect-value').textContent = incorrectCount;
            document.getElementById('unattempted-value').textContent = unattemptedCount;
            
            // Show the results modal
            document.getElementById('results-modal').classList.add('show');
            
            // Disable submit button
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-check"></i>';
            submitBtn.style.backgroundColor = 'var(--success)';
            
            // Refresh current question view to show solution
            showQuestion(currentQuestion);
        }
        
        // Review test
        function reviewTest() {
            document.getElementById('results-modal').classList.remove('show');
            showQuestion(0);
        }
        
        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('results-modal')) {
                document.getElementById('results-modal').classList.remove('show');
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === 'ArrowRight') nextQuestion();
        });
    </script>
