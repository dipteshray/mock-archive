                    id: "10",
                    section: "17",
                    question_en: "<p>10. <span style=\"font-family: Baloo;\">The given bar graph shows the income and expenditure ( in crores र) of a company over 5 years , from 2014 to 2018.&nbsp;<br></span><span style=\"font-family: Times New Roman;\">Study the bar graph and answer the question that follows.<br><strong id=\"docs-internal-guid-a5fd8963-7fff-b6c3-aa41-e9e6642a0677\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXfZDTuxIzsjLkQOElEFStLjcTIsvmPBNnCgvOEcULYS0S_boVYSxh_LU4mrFIks9qvgn3LOBCU6lPZLdVV2T9sSEYvKzn-o-lk2aE6gpncnsbfsHyA2pYTzAYvIGNMaMOfg8cIuzS42pkSLGpkGWQwSRrc?key=jtvRBx7GXjxr9j5yH7UqF15R\" width=\"361\" height=\"220\"><br></strong></span><span style=\"font-family: Times New Roman;\">What is the difference ( in crores ₹) between the expenditure for the years 2017 and 2018 taken together and the income for the years 2015 and 2016 taken together?</span></p>",
                    question_hi: "<p>10. <span style=\"font-family: Baloo;\">दिया गया बार ग्राफ 2014 से 2018 तक 5 वर्षों में एक कंपनी की आय और व्यय (करोड़ रुपये में) को दर्शाता है।<br></span><span style=\"font-family: Baloo;\">दंड आलेख का अध्ययन करें और नीचे दिए गए प्रश्न का उत्तर दें।<br><strong id=\"docs-internal-guid-1624bd66-7fff-d833-d1f6-823bc16fd6f4\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXc_-M4znutrQZa8B5NFn8pzqj6uDo7Px9ADpzWpjE1fHNg4qKqXJCgXgWp2f8o9XyQ2u4ORVMq5wRknJLGUQ-6BjLVRKTm_7sD4eZ9n2xBgBzBQYc-pUqvzgG4XK9Nojn8MYaa2wQ?key=jtvRBx7GXjxr9j5yH7UqF15R\" width=\"330\" height=\"231\"><br></strong></span><span style=\"font-family: Baloo;\">वर्ष 2017 और 2018 के लिए एक साथ किए गए व्यय और वर्ष 2015 और 2016 के लिए एक साथ आय के बीच का अंतर (करोड़ रुपये में) कितना है?</span></p>",
                    options_en: ["<p>15</p>", "<p>20</p>", 
                                "<p>18</p>", "<p>16</p>"],
                    options_hi: ["<p>15</p>", "<p>20</p>",
                                "<p>18</p>", "<p>16</p>"],
                    solution_en: "<p>10.(b) <span style=\"font-family: Times New Roman;\">expenditure for the years 2017 and 2018 taken together = 300 + 325 = 625<br></span><span style=\"font-family: Times New Roman;\">income for the years 2015 and 2016 taken together = 280 + 325 = 605<br></span><span style=\"font-family: Times New Roman;\">Required difference = 625 - 605 = 20</span></p>\n<p><span style=\"font-family: Times New Roman;\"> </span></p>",
                    solution_hi: "<p>10.(b) <span style=\"font-family: Baloo;\">वर्ष 2017 और 2018 को मिलाकर व्यय = 300 + 325 = 625<br></span><span style=\"font-family: Baloo;\">वर्ष 2015 और 2016 की कुल आय = 280 + 325 = 605<br></span><span style=\"font-family: Baloo;\">अभीष्ट अंतर = 625 - 605 = 20</span></p>",
                    correct: "b",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "11",
                    section: "17",
                    question_en: "<p>11. <span style=\"font-family: Times New Roman;\">The following bar graph shows the number of youth ( in lakhs) and the number of employed youth (in lakhs) in five state A,B,C,D and E.&nbsp;<br></span><span style=\"font-family: Times New Roman;\">What is the average number of youth in five states ?<br></span><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXe9zsAHAH6N2hy_JJE_TmzrBQN_HouDq9owJ9Ui6Xglus80TT_BP8XpRC9BGypxhhzoEb8UL7TSnWP8cFq7DTPG1KAp9x7SCJDrIiY4a5kf6W-2V3GFmVrP8DdYhkH4-5V9kKg9lk-8J5QJk4FSGwlEzNk?key=U4SuLwP1KOVtlxWs14tJEo6u\" width=\"382\" height=\"228\"></p>",
                    question_hi: "<p>11. <span style=\"font-family: Baloo;\">निम्नलिखित बार ग्राफ पांच राज्यों A, B, C, D और E में युवाओं की संख्या (लाखों में) और नियोजित युवाओं की संख्या (लाखों में) दिखाता है।<br></span><span style=\"font-family: Baloo;\">पांच राज्यों में युवाओं की औसत संख्या क्या है?<br><strong id=\"docs-internal-guid-87dc5bd1-7fff-789b-7c2e-3af8783dc5db\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXeVtj7m2q6Hw9js_1ZavR_0fZL29Cao-4lfPMKiVgGx7Ez4GtpIwOdErq5VHRBQAAUIZnoaCrBe6nbuspJpo_ytMwo9OfeBA4UOFsU7YzA5GHamdf0nMvpjA_0mWhGclhda2fY1Yw?key=jtvRBx7GXjxr9j5yH7UqF15R\" width=\"349\" height=\"243\"></strong><br></span></p>",
                    options_en: ["<p>1200000</p>", "<p>1015000</p>", 
                                "<p>1025000</p>", "<p>1010000</p>"],
                    options_hi: ["<p>1200000</p>", "<p>1015000</p>",
                                "<p>1025000</p>", "<p>1010000</p>"],
                    solution_en: "<p>11.(d) <span style=\"font-family: Times New Roman;\">Average number of youth (in lakhs) in five state A,B,C,D and E&nbsp;<br></span>= <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>12</mn><mo>+</mo><mn>8</mn><mo>+</mo><mn>11</mn><mo>.</mo><mn>5</mn><mo>+</mo><mn>10</mn><mo>+</mo><mn>9</mn></mrow><mn>5</mn></mfrac></math> =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>50</mn><mo>.</mo><mn>5</mn></mrow><mn>5</mn></mfrac></math> = 10.1 lakh = 1010000</p>\n<p><span style=\"font-family: Times New Roman;\"> </span></p>",
                    solution_hi: "<p>11.(d) <span style=\"font-family: Baloo;\">पांच राज्यों A, B, C, D और E में युवाओं की औसत संख्या (लाख में) &nbsp;<br>= <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>12</mn><mo>+</mo><mn>8</mn><mo>+</mo><mn>11</mn><mo>.</mo><mn>5</mn><mo>+</mo><mn>10</mn><mo>+</mo><mn>9</mn></mrow><mn>5</mn></mfrac></math> =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>50</mn><mo>.</mo><mn>5</mn></mrow><mn>5</mn></mfrac></math> = 10.1 लाख = 1010000</span></p>\n<p><span style=\"font-family: Times New Roman;\"> </span></p>",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "12",
                    section: "17",
                    question_en: "<p>12.<span style=\"font-family: Times New Roman;\"> Performance of 1800 students in grades has been shown in the following pie chart.<br></span><span style=\"font-family: Times New Roman;\">How many more students have obtained grade B than those who have obtained grade C?<br><strong id=\"docs-internal-guid-a74daa21-7fff-fb0d-43c6-9f7df357f489\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXfUo11EXzdMnP4PjQ-Pgnrc9k-TNQlI0HrJWphBCocxUtvSfgQK76fRUvZAzw2Q7rMWwKGnuqCgHfzSmM-X_Gm-CtZuVKHA-MYXTzWFmFgsVyEy3pEx9GDSleyxZawe9w?key=jtvRBx7GXjxr9j5yH7UqF15R\" width=\"221\" height=\"215\"></strong><br></span></p>",
                    question_hi: "<p>12.<span style=\"font-family: Baloo;\"> ग्रेड में 1800 छात्रों का प्रदर्शन निम्नलिखित पाई चार्ट में दिखाया गया है।<br></span><span style=\"font-family: Baloo;\">ग्रेड C प्राप्त करने वालों की तुलना में कितने अधिक छात्रों ने ग्रेड B प्राप्त किया है?</span></p>\n<p><strong id=\"docs-internal-guid-724f6e5f-7fff-1023-8818-bac973dff916\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXd-lO5QFy9m_eCuJRk2GDI5O9IKOZW5AA8M8QTOKRJehn3SMotmaJEmSqsq5RxDvtLqzlWll-82v3o8qipLAl8ZvWXhgjgHEfXeLCbf1QOsVYJTioAKq5Pv3adUHjGhnqBIJ32_8A?key=jtvRBx7GXjxr9j5yH7UqF15R\" width=\"214\" height=\"208\"></strong></p>",
                    options_en: ["<p>50</p>", "<p>60</p>", 
                                "<p>54</p>", "<p>3</p>"],
                    options_hi: ["<p>50</p>", "<p>60</p>",
                                "<p>54</p>", "<p>3</p>"],
                    solution_en: "<p>12.(c) <span style=\"font-family: Times New Roman;\">Grade B students = 27%<br></span><span style=\"font-family: Times New Roman;\">Grade C students = 24%<br></span><span style=\"font-family: Times New Roman;\">Required difference = 3%<br></span><span style=\"font-family: Times New Roman;\">No of students (B - C) = </span><span style=\"font-family: Times New Roman;\"> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>100</mn></mfrac><mo>&#215;</mo><mn>1800</mn><mo>=</mo><mn>54</mn></math></span></p>\n<p><span style=\"font-family: Times New Roman;\"> </span></p>",
                    solution_hi: "<p>12.(c) <span style=\"font-family: Baloo;\">ग्रेड B के छात्र = 27%<br></span><span style=\"font-family: Baloo;\">ग्रेड C के छात्र = 24%<br></span><span style=\"font-family: Baloo;\">आवश्यक अंतर = 3%<br></span><span style=\"font-family: Baloo;\">छात्रों की संख्या (B - C) = </span><span style=\"font-family: Times New Roman;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>100</mn></mfrac><mo>&#215;</mo><mn>1800</mn><mo>=</mo><mn>54</mn></math></span></p>",
                    correct: "c",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "13",
                    section: "17",
                    question_en: "<p>13. <span style=\"font-family: Times New Roman;\">The following bar graph shows receipts and expenditure by a business firm over 5 years. Gain = Receipts - Expenditure&nbsp;<br><strong id=\"docs-internal-guid-a6d424ea-7fff-71d1-9ad3-cc7cc6cfb2bf\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXdrxTxwXlgwQAoPBn33u_sQFzwZaK9KdQh91k6nNktfy-UwqcXU_VZ_mBjCr_MGPMer2WymW-0ASMzZnkqD8ie8bxenUBY7vS6Ae2iRqROAJHRoWpVydNNs2d5wCMAR3k48xYH97Q?key=jaX7qvR187IabjuCUoAziNA2\" width=\"315\" height=\"224\"><br></strong></span><span style=\"font-family: Times New Roman;\">In which of the following year does the company gain the minimum?</span></p>",
                    question_hi: "<p>13. <span style=\"font-family: Baloo;\">निम्नलिखित बार ग्राफ 5 वर्षों में एक व्यावसायिक फर्म द्वारा प्राप्तियों और व्यय को दर्शाता है।&nbsp;<br></span><span style=\"font-family: Baloo;\">लाभ = प्राप्ति - व्यय<br><strong id=\"docs-internal-guid-0ca6a7be-7fff-ba02-9ccd-0b6095e45c65\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXf_7DSvndS1y4IBRRFALsJ5gZKcIHi2B-dQbe5mi2pwrZW9dQrCdvqmKFMsge5gT4RYJy8fZq7Tb58mPmJzPTb4VRPcEJqhIn_eWHuuumP-f5wxcbVFb8mY9_aClntu07NwSbbK?key=jaX7qvR187IabjuCUoAziNA2\" width=\"307\" height=\"219\"><br></strong></span><span style=\"font-family: Baloo;\">निम्नलिखित में से किस वर्ष कंपनी को न्यूनतम लाभ होता है?</span></p>",
                    options_en: ["<p>2016</p>", "<p>2017</p>", 
                                "<p>2019</p>", "<p>2018</p>"],
                    options_hi: ["<p>2016</p>", "<p>2017</p>",
                                "<p>2019</p>", "<p>2018</p>"],
                    solution_en: "<p>13.(c) <span style=\"font-family: Times New Roman;\">According to the question Gain = Receipt - expenditure<br></span><span style=\"font-family: Times New Roman;\">Gain in 2016 = 54 - 51 = 3<br></span><span style=\"font-family: Times New Roman;\">Gain in 2017 = 64 - 60 = 4<br></span><span style=\"font-family: Times New Roman;\">Gain in 2018 = 80 - 75 = 5&nbsp;<br></span><span style=\"font-family: Times New Roman;\">Gain in 2019 = 82 - 80 = 2<br></span><span style=\"font-family: Times New Roman;\">Gain in 2020 = 93 - 87 = 6&nbsp;<br></span><span style=\"font-family: Times New Roman;\">Minimum gain is 2 units in 2019</span><span style=\"font-family: Times New Roman;\"> </span></p>",
                    solution_hi: "<p>13.(c) <span style=\"font-family: Baloo;\">प्रश्नानुसार, लाभ = प्राप्ति - व्यय<br></span><span style=\"font-family: Baloo;\">2016 में लाभ = 54 - 51 = 3<br></span><span style=\"font-family: Baloo;\">2017 में लाभ = 64 - 60 = 4<br></span><span style=\"font-family: Baloo;\">2018 में लाभ = 80 - 75 = 5<br></span><span style=\"font-family: Baloo;\">2019 में लाभ = 82 - 80 = 2<br></span><span style=\"font-family: Baloo;\">2020 में लाभ = 93 - 87 = 6<br></span><span style=\"font-family: Baloo;\">2019 में न्यूनतम लाभ 2 इकाई है।</span></p>",
                    correct: "c",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "14",
                    section: "17",
                    question_en: "<p>14. <span style=\"font-family: Times New Roman;\">The breakup of the total number of employees of a company working in different offices (A to E), in degrees, is given in the pie chart below.<br></span><span style=\"font-family: Times New Roman;\">Total number of employees = 2400</span></p>\n<p><strong id=\"docs-internal-guid-1a9a9f25-7fff-29d3-2054-e61c303bae3a\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXf3IsJ342faiXCiTonYtT4DWgZzsdmfZn8LWJN5uWCsXQ0C6LWiRqcmyBhVUoWo5GV_B-vqlOZTMMFPygZyg0UtQsNtIHwDkIoiajAeLlhtuiTNHGKztWeRTb1aJxPDspwPyY9hTw?key=jaX7qvR187IabjuCUoAziNA2\" width=\"255\" height=\"237\"><br></strong><span style=\"font-family: Times New Roman;\">If 40% of the employees in office A are shifted equally to office B and E, then what will be the sum of the number of employees in B and C?</span></p>",
                    question_hi: "<p>14. <span style=\"font-family: Baloo;\">विभिन्न कार्यालयों (A से E) में कार्यरत एक कंपनी के कर्मचारियों की कुल संख्या का विवरण नीचे पाई चार्ट में दिया गया है।<br></span><span style=\"font-family: Baloo;\">कर्मचारियों की कुल संख्या = 2400<br><strong id=\"docs-internal-guid-1a9a9f25-7fff-29d3-2054-e61c303bae3a\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXf3IsJ342faiXCiTonYtT4DWgZzsdmfZn8LWJN5uWCsXQ0C6LWiRqcmyBhVUoWo5GV_B-vqlOZTMMFPygZyg0UtQsNtIHwDkIoiajAeLlhtuiTNHGKztWeRTb1aJxPDspwPyY9hTw?key=jaX7qvR187IabjuCUoAziNA2\" width=\"227\" height=\"211\"><br></strong></span><span style=\"font-family: Baloo;\">यदि कार्यालय A के 40% कर्मचारियों को कार्यालय B और E में समान रूप से स्थानांतरित किया जाता है, तो B और C में कर्मचारियों की संख्या का योग क्या होगा?</span></p>",
                    options_en: ["<p>648</p>", "<p>765</p>", 
                                "<p>545</p>", "<p>72</p>"],
                    options_hi: ["<p>648</p>", "<p>765</p>",
                                "<p>545</p>", "<p>72</p>"],
                    solution_en: "<p>14.(a) <span style=\"font-family: Times New Roman;\">According to the question 40% of the employees of A shifted Equally to B and E<br></span><span style=\"font-family: Times New Roman;\">so 20% of A shifted in B = </span><span style=\"font-family: Times New Roman;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>20</mn><mn>100</mn></mfrac><mo>&#215;</mo><mn>126</mn><mo>&#176;</mo><mo>=</mo><mn>25</mn><mo>.</mo><mn>2</mn><mo>&#176;</mo></math><br></span><span style=\"font-family: Times New Roman;\">Now total employees of B and C is =</span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#160;</mo><mo>(</mo><mn>18</mn><mo>&#176;</mo><mo>+</mo><mn>25</mn><mo>.</mo><mn>2</mn><mo>&#176;</mo><mo>+</mo><mn>54</mn><mo>&#176;</mo><mo>)</mo><mo>=</mo><mfrac><mrow><mo>&#160;</mo><mn>97</mn><mo>.</mo><mn>2</mn><mo>&#176;</mo></mrow><mrow><mn>360</mn><mo>&#176;</mo></mrow></mfrac><mo>&#215;</mo><mn>2400</mn><mo>=</mo><mn>648</mn></math><span style=\"font-family: Times New Roman;\"> </span></p>\n<p><span style=\"font-family: Times New Roman;\"> </span></p>",
                    solution_hi: "<p>14.(a) <span style=\"font-family: Baloo;\">प्रश्न के अनुसार, A के 40% कर्मचारी समान रूप से B और E में स्थानांतरित हो गए।<br></span><span style=\"font-family: Baloo;\">A का 20% B में स्थानान्तरित हुआ = </span><span style=\"font-family: Times New Roman;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>20</mn><mn>100</mn></mfrac><mo>&#215;</mo><mo>&#160;</mo><mn>126</mn><mo>&#176;</mo><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>25</mn><mo>.</mo><mn>2</mn><mo>&#176;</mo></math><br></span><span style=\"font-family: Baloo;\">अब B और C के कुल कर्मचारी = (18&deg; + 25.2&deg; + 54&deg;) = </span><span style=\"font-family: Times New Roman;\"> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>97</mn><mo>.</mo><mn>2</mn><mo>&#176;</mo></mrow><mrow><mn>360</mn><mo>&#176;</mo></mrow></mfrac><mo>&#215;</mo><mn>2400</mn><mo>=</mo><mn>648</mn><mo>&#160;</mo></math> </span></p>",
                    correct: "a",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "15",
                    section: "17",
                    question_en: "<p>15. <span style=\"font-family: Times New Roman;\">The following histogram shows the marks scored by 40 students in a test of 30 marks. A student has to score a minimum of 10 marks to pass the test.<br></span><br><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXfF4EDgLfv-yKMO0fUrlyekCgBDca_ju4D8mx_2oTuWB-Hm5XeBq6ZN1fCdPvqduEutHLpQhD23GKzUvfw8GgZaPI38wnaEvRZtLHTLTG6oMOk1qWki_V9OqIwNSRyddsmt5_DoQWLZ_Y0FrX-K4OcwKR8?key=U4SuLwP1KOVtlxWs14tJEo6u\" width=\"318\" height=\"274\"></p>\n<p><span style=\"font-family: Times New Roman;\">What is the percentage of students who passed the test?</span></p>",
                    question_hi: "<p>15. <span style=\"font-family: Baloo;\">निम्नलिखित हिस्टोग्राम 30 अंकों की एक परीक्षा में 40 छात्रों द्वारा प्राप्त अंकों को दर्शाता है। एक छात्र को परीक्षा पास करने के लिए कम से कम 10 अंक प्राप्त करने होंगे।</span><strong id=\"docs-internal-guid-9812be41-7fff-ef3e-cd06-24eafd267842\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXeScsiN527sZ-MiF0he2YwsqTEhRbiR8imdyjlBjz8_zMsFDxs39s6qbK60lkmD_o2BTriWDyIH33AWvC7EbMW_Jd4OJ46iMQV7tr0LfoboXTOeChi76iUDtzIflpetaEvCQD39?key=jaX7qvR187IabjuCUoAziNA2\" width=\"247\" height=\"223\"><br></strong><span style=\"font-family: Baloo;\">परीक्षा उत्तीर्ण करने वाले छात्रों का प्रतिशत क्या है?</span></p>",
                    options_en: ["<p>75%</p>", "<p>30%</p>", 
                                "<p>72%</p>", "<p>66.66%</p>"],
                    options_hi: ["<p>75%</p>", "<p>30%</p>",
                                "<p>72%</p>", "<p>66.66%</p>"],
                    solution_en: "<p>15.(a) <span style=\"font-family: Times New Roman;\">Number of students above 10 marks are (7 + 8 + 10 + 5 ) = 30<br></span><span style=\"font-family: Times New Roman;\">Total students = 40<br></span><span style=\"font-family: Times New Roman;\">Required percentage of pass students = </span><span style=\"font-family: Times New Roman;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>30</mn><mn>40</mn></mfrac><mo>&#215;</mo><mn>100</mn><mo>=</mo><mn>75</mn><mo>%</mo></math></span></p>\n<p><span style=\"font-family: Times New Roman;\"> </span></p>",
                    solution_hi: "<p>15.(a)<span style=\"font-family: Baloo;\">10 अंक से ऊपर के छात्रों की संख्या = (7 + 8 + 10 + 5 ) = 30<br></span><span style=\"font-family: Baloo;\">कुल छात्र = 40<br></span><span style=\"font-family: Baloo;\">उत्तीर्ण छात्रों का आवश्यक प्रतिशत = <span style=\"font-family: Times New Roman;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>30</mn><mn>40</mn></mfrac><mo>&#215;</mo><mn>100</mn><mo>=</mo><mn>75</mn><mo>%</mo></math></span></span></p>",
                    correct: "a",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "16",
                    section: "17",
                    question_en: "<p>16.<span style=\"font-family: Times New Roman;\"> Performance of 1800 students in grades has been shown in the following pie chart.<br></span><strong id=\"docs-internal-guid-320431b1-7fff-ba28-e0ce-dc4b4cde697a\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXer7sgMqbUR_UNbpo0kDOmTCNalFOBG7-PHk6NThjJ2AOZok9prJsLv0jl62e0DEO55GDUMjCut28pGMTPqqOB8P9ZDLJXzOTeTrIhxiYN2fbA9kMXuScABOAF4VnjDEZCH7CAJqg?key=jaX7qvR187IabjuCUoAziNA2\" width=\"221\" height=\"215\"></strong><br><span style=\"font-family: Times New Roman;\">The number of students getting grade B is what percentage of the number of students getting grade A?</span></p>",
                    question_hi: "<p>16.<span style=\"font-family: Baloo;\"> ग्रेड में 1800 छात्रों का प्रदर्शन निम्नलिखित पाई चार्ट में दिखाया गया है।<br><strong id=\"docs-internal-guid-0e8236aa-7fff-d26c-940d-05396b223cdb\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXesjUk1NJYsYSxYklTYaHK9jcWWK2QqsfmwA5-OPC1GsVDcGstgDJ4UlQ4spUjPnd00HDBmzT38lVcKFYuRvteAlpq_LzNMrUUJhhmWybNOQpgDP8P88WLL-4VynS26qVg4LMQ30A?key=jaX7qvR187IabjuCUoAziNA2\" width=\"214\" height=\"208\"><br></strong></span><span style=\"font-family: Baloo;\">ग्रेड B प्राप्त करने वाले छात्रों की संख्या ग्रेड A प्राप्त करने वाले छात्रों की संख्या का कितना प्रतिशत है?</span></p>",
                    options_en: ["<p>97%</p>", "<p>90%</p>", 
                                "<p>95%</p>", "<p>85%</p>"],
                    options_hi: ["<p>97%</p>", "<p>90%</p>",
                                "<p>95%</p>", "<p>85%</p>"],
                    solution_en: "<p>16.(b) <span style=\"font-family: Times New Roman;\">Grade A students = 30%<br></span><span style=\"font-family: Times New Roman;\">Grade B students = 27%<br></span><span style=\"font-family: Times New Roman;\">Required percentage = </span><span style=\"font-family: Times New Roman;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>27</mn><mn>30</mn></mfrac><mo>&#215;</mo><mn>100</mn><mo>=</mo><mn>90</mn><mo>%</mo></math></span></p>\n<p><span style=\"font-family: Times New Roman;\"> </span></p>",
                    solution_hi: "<p>16.(b) <span style=\"font-family: Baloo;\">ग्रेड A के छात्र = 30%<br></span><span style=\"font-family: Baloo;\">ग्रेड B के छात्र = 27%<br></span><span style=\"font-family: Baloo;\">आवश्यक प्रतिशत = <span style=\"font-family: Times New Roman;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>27</mn><mn>30</mn></mfrac><mo>&#215;</mo><mn>100</mn><mo>=</mo><mn>90</mn><mo>%</mo></math></span></span></p>",
                    correct: "b",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "17",
                    section: "17",
                    question_en: "<p>17.<span style=\"font-family: Times New Roman;\"> The given pie chart shows the percentage of students in five schools and the table shows the ratio of boys and girls in each school<br></span><span style=\"font-family: Times New Roman;\">Study the pie chart and table and answer the following questions<br></span><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1656056580/word/media/image2.png\" width=\"191\" height=\"186\"></p>\n<p><span style=\"font-family: Times New Roman;\">The table shows the ratio of girls and boys in the given five schools.<br></span><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1656056580/word/media/image4.png\" width=\"200\" height=\"214\"></p>\n<p>The numberof girls in school D is what percentage less than the umber of boys in school B ( correct to the nearest integer ) ?</p>",
                    question_hi: "<p>17.<span style=\"font-family: Baloo;\"> दिया गया पाई चार्ट पांच स्कूलों में छात्रों का प्रतिशत दर्शाता है और तालिका प्रत्येक स्कूल में लड़कों और लड़कियों के अनुपात को दर्शाती है<br></span><span style=\"font-family: Baloo;\">पाई चार्ट और तालिका का अध्ययन करें और निम्नलिखित प्रश्नों के उत्तर दें:<br></span><img src=\"https://ssccglpinnacle.com/admin/resources/qdocs/test-1-EN-1/1656056580/word/media/image2.png\" width=\"191\" height=\"186\"></p>\n<p><strong id=\"docs-internal-guid-62c89141-7fff-d17f-920f-a1bdc31645f4\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXfZ_uQMRU-wPYNlCQd1hwrIbDDhdq03tz4KRWTxzavL87rUyGSbnvvvZHIUnMArAPuUWW12rSC-cPIRHGdLJnDPId-sCHkXtstsuKujow_vrQXgmOcXRBtDCiD3SUpkK9_3umrU8Q?key=U4SuLwP1KOVtlxWs14tJEo6u\" width=\"197\" height=\"140\"></strong><br>स्कूल D में लड़कियों की संख्या स्कूल B में लड़कों की संख्या से कितने प्रतिशत कम है (निकटतम पूर्णांक तक सही)?</p>",
                    options_en: ["<p>35%</p>", "<p>19%</p>", 
                                "<p>27%</p>", "<p>33%</p>"],
                    options_hi: ["<p>35%</p>", "<p>19%</p>",
                                "<p>27%</p>", "<p>33%</p>"],
                    solution_en: "<p>17.(d) <span style=\"font-family: Times New Roman;\">No of girls in school D =</span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>3</mn></mfrac><mo>&times;</mo><mn>18</mn><mo>%</mo><mo>=</mo><mn>6</mn><mo>%</mo></math><br><span style=\"font-family: Times New Roman;\">No of boys in school B = </span><span style=\"font-family: Times New Roman;\"> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>5</mn></mfrac><mo>&times;</mo><mn>15</mn><mo>%</mo><mo>=</mo><mn>9</mn><mo>%</mo></math><br></span><span style=\"font-family: Times New Roman;\">Required percentage =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>9</mn><mo>-</mo><mn>6</mn></mrow><mn>9</mn></mfrac></math> &times; 100 =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>9</mn></mfrac></math> &times; 100 = 33.33% &asymp; 33%</span></p>\n<p><span style=\"font-family: Times New Roman;\"> </span></p>",
                    solution_hi: "<p>17.(d) <span style=\"font-family: Baloo;\">स्कूल D में लड़कियों की संख्या = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>3</mn></mfrac><mo>&times;</mo><mn>18</mn><mo>%</mo><mo>=</mo><mn>6</mn><mo>%</mo></math><br></span><span style=\"font-family: Baloo;\">स्कूल B में लड़कों की संख्या = <span style=\"font-family: Times New Roman;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>5</mn></mfrac><mo>&times;</mo><mn>15</mn><mo>%</mo><mo>=</mo><mn>9</mn><mo>%</mo></math><br></span></span><span style=\"font-family: Baloo;\">आवश्यक प्रतिशत = <span style=\"font-family: Times New Roman;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mrow><mn>9</mn><mo>-</mo><mn>6</mn></mrow><mn>9</mn></mfrac></math> &times; 100 =&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>3</mn><mn>9</mn></mfrac></math> &times; 100 = 33.33% &asymp; 33%</span></span></p>",
                    correct: "d",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "18",
                    section: "17",
                    question_en: "<p>18.<span style=\"font-family: Times New Roman;\"> The breakup of the total number of employees of a company working in different offices ( A to E ) , in degrees , is given in the pie charts . the number of employees = 2400<br><strong id=\"docs-internal-guid-7e06d42f-7fff-fdc0-f438-037f8d8efd31\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXcXo0DDERIo8RT4JST0VQifIa4jADwrbDuCwzhFgnyEe_YOOXIR9cGWLmbMpbcuQ1xA_f3216WtuRxeOiFpUf4FIoE5PHzj90qEJrcSjKKxVOyKYI0U2UMCtqM8Twj37JQee3nymQ?key=gaYRg4VpqCqLXvcuhmL-Ig\" width=\"236\" height=\"227\"><br></strong></span><span style=\"font-family: Times New Roman;\">If the percentage of male employees in office C is 20% and that of female employees in E is 40%, then what is the ratio of the number of female employees in E to that of female employees in C?</span></p>",
                    question_hi: "<p>18.<span style=\"font-family: Baloo;\"> विभिन्न कार्यालयों (A से E) में कार्यरत एक कंपनी के कर्मचारियों की कुल संख्या का विवरण पाई चार्ट में दिया गया है। कर्मचारियों की संख्या = 2400<br><strong id=\"docs-internal-guid-7e06d42f-7fff-fdc0-f438-037f8d8efd31\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXcXo0DDERIo8RT4JST0VQifIa4jADwrbDuCwzhFgnyEe_YOOXIR9cGWLmbMpbcuQ1xA_f3216WtuRxeOiFpUf4FIoE5PHzj90qEJrcSjKKxVOyKYI0U2UMCtqM8Twj37JQee3nymQ?key=gaYRg4VpqCqLXvcuhmL-Ig\" width=\"225\" height=\"216\"><br></strong></span><span style=\"font-family: Baloo;\">यदि कार्यालय C में पुरुष कर्मचारियों का प्रतिशत 20% है और E में महिला कर्मचारियों का प्रतिशत 40% है, तो E में महिला कर्मचारियों की संख्या का C में महिला कर्मचारियों की संख्या से अनुपात कितना है?</span></p>",
                    options_en: ["<p>3 : 8</p>", "<p>5 : 4</p>", 
                                "<p>2 : 3</p>", "<p>3 : 2</p>"],
                    options_hi: ["<p>3 : 8</p>", "<p>5 : 4</p>",
                                "<p>2 : 3</p>", "<p>3 : 2</p>"],
                    solution_en: "<p>18.(c) <span style=\"font-family: Times New Roman;\">In office C&nbsp;<br></span><span style=\"font-family: Times New Roman;\">Male&nbsp; :&nbsp; female&nbsp;<br></span><span style=\"font-family: Times New Roman;\">&nbsp; 1&nbsp; &nbsp; &nbsp; :&nbsp; &nbsp; 4 <br></span><span style=\"font-family: Times New Roman;\">No of female employes = </span><span style=\"font-family: Times New Roman;\"> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4</mn><mn>5</mn></mfrac><mo>&#215;</mo><mfrac><mrow><mn>54</mn><mo>&#176;</mo></mrow><mrow><mn>360</mn><mo>&#176;</mo></mrow></mfrac><mo>&#215;</mo><mn>2400</mn><mo>=</mo><mn>288</mn></math><br></span><span style=\"font-family: Times New Roman;\">In office E&nbsp;<br></span><span style=\"font-family: Times New Roman;\">Male&nbsp; :&nbsp; female&nbsp;<br></span><span style=\"font-family: Times New Roman;\">&nbsp; 3&nbsp; &nbsp; &nbsp; :&nbsp; &nbsp;2 <br></span><span style=\"font-family: Times New Roman;\">No of female employes </span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>2</mn><mn>5</mn></mfrac><mo>&#215;</mo><mfrac><mrow><mn>72</mn><mo>&#176;</mo></mrow><mrow><mn>360</mn><mo>&#176;</mo></mrow></mfrac><mo>&#215;</mo><mn>2400</mn><mo>=</mo><mn>192</mn></math><br><span style=\"font-family: Cardo;\">Required ratio 192 : 288 &rArr; 2 : 3</span></p>\n<p><span style=\"font-family: Times New Roman;\"> </span></p>",
                    solution_hi: "<p>18.(c) <span style=\"font-family: Baloo;\">कार्यालय C में,&nbsp;<br></span><span style=\"font-family: Baloo;\">पुरुष&nbsp; &nbsp;:&nbsp; &nbsp;महिला<br></span><span style=\"font-family: Times New Roman;\"> 1&nbsp; &nbsp; &nbsp; &nbsp; :&nbsp; &nbsp; &nbsp;4 <br></span><span style=\"font-family: Baloo;\">महिला कर्मचारियों की संख्या = <span style=\"font-family: Times New Roman;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>4</mn><mn>5</mn></mfrac><mo>&#215;</mo><mfrac><mrow><mn>54</mn><mo>&#176;</mo></mrow><mrow><mn>360</mn><mo>&#176;</mo></mrow></mfrac><mo>&#215;</mo><mn>2400</mn><mo>=</mo><mn>288</mn></math></span></span><span style=\"font-family: Times New Roman;\"><br></span><span style=\"font-family: Baloo;\">कार्यालय E में,&nbsp;<br></span><span style=\"font-family: Baloo;\">पुरुष&nbsp; &nbsp;:&nbsp; &nbsp;महिला<br></span><span style=\"font-family: Times New Roman;\">&nbsp; &nbsp;3&nbsp; &nbsp; &nbsp; :&nbsp; &nbsp; &nbsp;2 <br></span><span style=\"font-family: Baloo;\">महिला कर्मचारियों की संख्या = <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mfrac><mn>2</mn><mn>5</mn></mfrac><mo>&#215;</mo><mfrac><mrow><mn>72</mn><mo>&#176;</mo></mrow><mrow><mn>360</mn><mo>&#176;</mo></mrow></mfrac><mo>&#215;</mo><mn>2400</mn><mo>=</mo><mn>192</mn></math></span><span style=\"font-family: Times New Roman;\"><br></span><span style=\"font-family: Arial Unicode MS;\">आवश्यक अनुपात 192 : 288 &rArr; 2 : 3</span></p>",
                    correct: "c",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "19",
                    section: "17",
                    question_en: "<p>19.<span style=\"font-family: Times New Roman;\"> The following bar graph shows the total number of youth (in lakhs) and the number of employed youth (in lakhs) in 5 states A,B,C,D and E&nbsp;<br></span><span style=\"font-family: Times New Roman;\">How many youth (in lakhs) are unemployed in state B and D taken together ?</span></p>\n<p><span style=\"font-family: Times New Roman;\"> </span></p>\n<p><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXdc55_MQ4dBh0LoFmMRnvJmWDJgGeECHttGmgXR5UmNXR6XbXEocAVsfK6tY3dJrHqEGZKOtofqSynuVyGHjlrSsIJv4l5wV-X_4elDiwDaxofNg9xHyRPgVRUHQYHo4ovQY-t1WV23gxetVpCxx2jlwJ4?key=U4SuLwP1KOVtlxWs14tJEo6u\" width=\"440\" height=\"265\"></p>",
                    question_hi: "<p>19.<span style=\"font-family: Baloo;\"> निम्नलिखित बार ग्राफ 5 राज्यों A, B, C, D और E में युवाओं की कुल संख्या (लाखों में) और नियोजित युवाओं की संख्या (लाखों में) दिखाता है।<br></span><span style=\"font-family: Baloo;\">राज्य B और D को मिलाकर कितने युवा (लाखों में) बेरोजगार हैं?<br><strong id=\"docs-internal-guid-84a146b2-7fff-31b5-ce98-0afd919e3a89\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXd4Ekn8WhfNAznbbEjwdrLSvAjj7HjWkT60T0s8ATyzJIWuXIKZOUHmSgqpClo3U5AqZ6ohesDQqOko87ZrzRnWl_WDgc16Ikr7vMS4cJor9mmegHNSyzdu9AvPOI6tAoaxhU2S?key=gaYRg4VpqCqLXvcuhmL-Ig\" width=\"334\" height=\"233\"></strong><br></span></p>",
                    options_en: ["<p>4.25</p>", "<p>4.5</p>", 
                                "<p>3.5</p>", "<p>3.25</p>"],
                    options_hi: ["<p>4.25</p>", "<p>4.5</p>",
                                "<p>3.5</p>", "<p>3.25</p>"],
                    solution_en: "<p>19.(c) <span style=\"font-family: Times New Roman;\">Number of Unemployed youth = Total youth - employed youth<br></span><span style=\"font-family: Times New Roman;\">Number of Unemployed youth in B = 8 - 7 = 1<br></span><span style=\"font-family: Times New Roman;\">Number of Unemployed youth in D = 10 - 7.5 = 2.5<br></span><span style=\"font-family: Times New Roman;\">Required sum = 1 + 2.5 = 3.5 lakhs</span></p>\n<p><span style=\"font-family: Times New Roman;\"> </span></p>",
                    solution_hi: "<p>19.(c) <span style=\"font-family: Baloo;\">बेरोजगार युवाओं की संख्या = कुल युवा - नियोजित युवा<br></span><span style=\"font-family: Baloo;\">B में बेरोजगार युवाओं की संख्या = 8 - 7 = 1 लाख<br></span><span style=\"font-family: Baloo;\">D में बेरोजगार युवाओं की संख्या = 10 - 7.5 = 2.5 लाख<br></span><span style=\"font-family: Baloo;\">अभीष्ट योग = 1 + 2.5 = 3.5 लाख</span></p>",
                    correct: "c",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "20",
                    section: "17",
                    question_en: "<p>20. <span style=\"font-family: Times New Roman;\">Study the graph and answer the question follows&nbsp;<br><strong id=\"docs-internal-guid-8f6a7b56-7fff-3e6c-e2f2-32c3bdac9493\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXezm64kdHvyXP2MzeF4lqlM3iQmoPNimxlwOCmDcx7Jw3eu7ZAN3lg5NLWplYE2p6kxOm7YfGoPZ9WCB_BQlynadTXRs92Yi3J01W5eJiDxzdFXIWtOD2na1kVmtMprVwseSeQJSA?key=gaYRg4VpqCqLXvcuhmL-Ig\" width=\"330\" height=\"238\"><br></strong></span><span style=\"font-family: Times New Roman;\">What is the ratio of the total number of workers whose daily wages are less than ₹450 to the total number of workers whose daily wages are ₹650 and above ?</span></p>",
                    question_hi: "<p>20. <span style=\"font-family: Baloo;\">ग्राफ का अध्ययन करें और निम्नलिखित प्रश्न का उत्तर दें:<br><strong id=\"docs-internal-guid-1457a011-7fff-a27e-e634-bc146fb986b4\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXepJqBTVCdmhfpiUbaujJB5Lb1ZnEXLX3gf5pw1fANlzgRmou2qRutF-zxqXmnUmfoaGfTM2O-FYMP_GoQTNUv_qvtOXWh-naJhrjsqF4SmBdr0KBkIwjbF4WIaTjq6l4TyO90iQA?key=gaYRg4VpqCqLXvcuhmL-Ig\" width=\"311\" height=\"225\"><br></strong></span><span style=\"font-family: Baloo;\">₹450 से कम दैनिक मजदूरी वाले श्रमिकों की कुल संख्या का उन श्रमिकों की कुल संख्या से अनुपात क्या है जिनकी दैनिक मजदूरी ₹650 और उससे अधिक है?</span></p>",
                    options_en: ["<p>3 : 5</p>", "<p>1 : 4</p>", 
                                "<p>6 : 7</p>", "<p>5 : 7</p>"],
                    options_hi: ["<p>3 : 5</p>", "<p>1 : 4</p>",
                                "<p>6 : 7</p>", "<p>5 : 7</p>"],
                    solution_en: "<p>20.(c) <span style=\"font-family: Times New Roman;\">No of worker less than 450 is 30<br></span><span style=\"font-family: Times New Roman;\">No of worker greater than 650 is 35<br></span><span style=\"font-family: Times New Roman;\">Required ratio = 30 : 35<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8658;</mo></math> </span><span style=\"font-family: Times New Roman;\">6 : 7</span></p>\n<p><span style=\"font-family: Times New Roman;\"> </span></p>",
                    solution_hi: "<p>20.(c) <span style=\"font-family: Baloo;\">450 से कम के कार्यकर्ता की संख्या 30 है।<br></span><span style=\"font-family: Baloo;\">650 से अधिक कर्मचारियों की संख्या 35 है।<br></span><span style=\"font-family: Arial Unicode MS;\">अभीष्ट अनुपात = 30 : 35 &rArr; 6 : 7</span></p>",
                    correct: "c",

        // Show a specific question
        
        function formatContent(text) {
            if (!text) return '';
            return text.replace(/<img/g, '<img style="max-width:100%;height:auto;"');
        }
        
        function showQuestion(index) {
            if (index < 0 || index >= questions.length) return;
            
            currentQuestion = index;
            const question = questions[index];
            
            // Update question counter
            document.getElementById('question-counter').textContent = `Question ${index + 1} of ${questions.length}`;
            
            // Update question boxes
            document.querySelectorAll('.q-box').forEach(box => box.classList.remove('current'));
            document.getElementById(`box-${index}`).classList.add('current');
            
            // Generate question HTML
            let html = `
                <div class="question-card">
                    <div class="question-text">
                        <div class="en">${formatContent(question.question_en)}</div>
                        <div class="hi" style="display:none">${formatContent(question.question_hi)} </div>
                    </div>
                    <div class="options" id="options-container">`;
            
            // Add options
            ['a', 'b', 'c', 'd'].forEach((opt, i) => {
                let optionClass = '';
                let isCorrectAnswer = opt === question.correct;
                let isUserAnswer = answers[question.id] === opt;
                
                // When reviewing, add appropriate classes
                if (submitted) {
                    if (isCorrectAnswer) {
                        optionClass += ' correct-answer';
                    } else if (isUserAnswer && !isCorrectAnswer) {
                        optionClass += ' incorrect';
                    }
                }
                
                html += `
                    <div class="option-item">
                        <input class="option-input" type="radio" name="q${index}" 
                            id="opt-${index}-${opt}" value="${opt}" 
                            ${isUserAnswer ? 'checked' : ''}
                            onclick="selectAnswer('${question.id}', '${opt}')">
                       <label class="option-label${optionClass}" for="opt-${index}-${opt}">
                            <div class="en">${question.options_en[i]}</div>
                            <div class="hi" style="display:none">${question.options_hi[i]}</div>
                        </label>
                    </div>`;
            });
            
            // Add solution if submitted
            if (submitted) {
                const isCorrect = answers[question.id] === question.correct;
                const resultText = answers[question.id] ? (isCorrect ? 'Correct!' : 'Incorrect!') : 'Not attempted';
                
                html += `
                    <div class="solution-container">
                        <div class="solution-title">${resultText}</div>
                        <div class="solution-text">
                            <div class="en">${question.solution_en}</div>
                            <div class="hi" style="display:none">${question.solution_hi}</div>
                        </div>
                    </div>`;
            }
            
            html += `</div></div>`;
            
            document.getElementById('questions-container').innerHTML = html;
            
            // Apply language settings
            applyLanguage();
            
            // If in mobile view, close the menu
            if (window.innerWidth < 992) {
                toggleNav(false);
            }
            
            // Add review mode class if submitted
            if (submitted) {
                document.getElementById('options-container').classList.add('review-mode');
            }
        }
        
        // Apply current language
        function applyLanguage() {
            document.querySelectorAll(`.${currentLang}`).forEach(el => el.style.display = 'block');
            document.querySelectorAll(`.${currentLang === 'en' ? 'hi' : 'en'}`).forEach(el => el.style.display = 'none');
            
            // Update language button text
            document.getElementById('lang-text').textContent = currentLang === 'en' ? 'Hi' : 'En';
        }
        
        // Select an answer
        function selectAnswer(qId, option) {
            if (submitted) return;
            
            answers[qId] = option;
            updateProgress();
            
            // Mark question as attempted in the navigation
            const index = questions.findIndex(q => q.id === qId);
            if (index >= 0) {
                const box = document.getElementById(`box-${index}`);
                box.classList.add('attempted');
                box.classList.remove('unattempted');
            }
        }
        
        // Navigate to previous/next question
        function prevQuestion() { 
            if (currentQuestion > 0) showQuestion(currentQuestion - 1); 
        }
        
        function nextQuestion() { 
            if (currentQuestion < questions.length - 1) showQuestion(currentQuestion + 1); 
        }
        
        // Switch section
        function switchSection(sectionId) {
            if (sectionId === 'all') {
                showQuestion(0);
                return;
            }
            
            const section = sections[sectionId];
            if (section) showQuestion(section.start);
        }
        
        // Toggle language
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            applyLanguage();
        }
        
        // Toggle navigation sidebar
        function toggleNav(show) {
            const nav = document.getElementById('question-nav');
            const overlay = document.getElementById('nav-overlay');
            
            if (show === undefined) {
                show = !nav.classList.contains('show');
            }
            
            if (show) {
                nav.classList.add('show');
                overlay.classList.add('show');
                document.body.style.overflow = 'hidden';
            } else {
                nav.classList.remove('show');
                overlay.classList.remove('show');
                document.body.style.overflow = '';
            }
        }
        
        // Update progress
        function updateProgress() {
            const attempted = Object.keys(answers).length;
            document.getElementById('attempted-count').textContent = attempted;
        }
        
        // Start timer
        function startTimer() {
            const timerDisplay = document.getElementById('timer-display');
            let timeLeft = totalTime;
            
            const timerInterval = setInterval(() => {
                if (timeLeft <= 0 || submitted) {
                    clearInterval(timerInterval);
                    if (!submitted) submitTest();
                    return;
                }
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                timeLeft--;
            }, 1000);
        }
        
        // Confirm before submitting
        function confirmSubmit() {
            if (submitted) return;
            
            const attempted = Object.keys(answers).length;
            const remaining = questions.length - attempted;
            
            // Create a more modern confirmation dialog
            const confirmHtml = `
                <div style="text-align: center; padding: 20px;">
                    <h4 style="margin-bottom: 16px; color: var(--dark);">Confirm Submission</h4>
                    <p style="margin-bottom: 24px; color: var(--gray);">
                        You have attempted ${attempted} of ${questions.length} questions.<br>
                        ${remaining} questions are unattempted.
                    </p>
                    <div style="display: flex; justify-content: center; gap: 12px;">
                        <button onclick="this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; border: 1px solid var(--light-gray); background: white; border-radius: 8px; cursor: pointer;">
                            Cancel
                        </button>
                        <button onclick="submitTest(); this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer;">
                            Submit Test
                        </button>
                    </div>
                </div>`;
            
            // Create modal element
            const modal = document.createElement('div');
            modal.className = 'results-modal show';
            modal.innerHTML = `
                <div class="results-card" style="max-width: 400px;">
                    <button class="cancel-btn" style="position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--gray);" onclick="this.closest('.results-modal').remove()">
                        ×
                    </button>
                    ${confirmHtml}
                </div>`;
            
            document.body.appendChild(modal);
        }
        
        // Submit test
        function submitTest() {
            if (submitted) return;
            
            submitted = true;
            
            let score = 0;
            let correctCount = 0;
            let incorrectCount = 0;
            let unattemptedCount = 0;
            
            questions.forEach((q, index) => {
                const userAns = answers[q.id];
                const box = document.getElementById(`box-${index}`);
                
                box.classList.remove('attempted');
                
                if (!userAns) {
                    unattemptedCount++;
                    box.classList.add('unattempted');
                } else if (userAns === q.correct) {
                    correctCount++;
                    score += q.pos_marks;
                    box.classList.add('correct');
                } else {
                    incorrectCount++;
                    score -= q.neg_marks;
                    box.classList.add('incorrect');
                }
            });
            
            // Update result values
            document.getElementById('score-value').textContent = score.toFixed(2);
            document.getElementById('correct-value').textContent = correctCount;
            document.getElementById('incorrect-value').textContent = incorrectCount;
            document.getElementById('unattempted-value').textContent = unattemptedCount;
            
            // Show the results modal
            document.getElementById('results-modal').classList.add('show');
            
            // Disable submit button
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-check"></i>';
            submitBtn.style.backgroundColor = 'var(--success)';
            
            // Refresh current question view to show solution
            showQuestion(currentQuestion);
        }
        
        // Review test
        function reviewTest() {
            document.getElementById('results-modal').classList.remove('show');
            showQuestion(0);
        }
        
        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('results-modal')) {
                document.getElementById('results-modal').classList.remove('show');
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === 'ArrowRight') nextQuestion();
        });
    </script>
</body>
</html>
