                    options_hi: ["<p>343</p>", "<p>216</p>",
                                "<p>512</p>", "<p>729</p>"],
                    solution_en: "<p>22.(c) <span style=\"font-family: Times New Roman;\">Let side of a cube is a</span><br><span style=\"font-family: Times New Roman;\">Body diagonal of a cube =</span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><msqrt><mn>3</mn></msqrt><mo>=</mo><mn>8</mn><msqrt><mn>3</mn></msqrt><mi>c</mi><mi>m</mi></math><br><span style=\"font-family: Cardo;\">&rArr; a = 8cm</span><br><span style=\"font-family: Times New Roman;\">Volume of a cube </span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><msup><mi>a</mi><mn>3</mn></msup><mo>=</mo><mn>512</mn><mo>&#160;</mo><mi>c</mi><msup><mi>m</mi><mn>3</mn></msup></math></p>",
                    solution_hi: "<p>22.(c) <span style=\"font-family: Baloo;\">माना, घन की भुजा a है।</span><br><span style=\"font-family: Baloo;\">एक घन का पिंड विकर्ण =</span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><msqrt><mn>3</mn></msqrt><mo>=</mo><mn>8</mn><msqrt><mn>3</mn></msqrt><mi>c</mi><mi>m</mi></math><br><span style=\"font-family: Cardo;\">&rArr; a = 8cm</span><br><span style=\"font-family: Baloo;\">घन का आयतन = </span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><msup><mi>a</mi><mn>3</mn></msup><mo>=</mo><mn>512</mn><mo>&#160;</mo><mi>c</mi><msup><mi>m</mi><mn>3</mn></msup></math></p>",
                    correct: "c",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "23",
                    section: "17",
                    question_en: "<p>23. <span style=\"font-family: Times New Roman;\">The sides of a triangular field are 360m, 480m and 600m. Its area is equal to the area of a square field. What is the side (in m) of the square field?</span></p>",
                    question_hi: "<p>23. <span style=\"font-family: Palanquin Dark;\">एक त्रिभुजाकार मैदान की भुजाएँ 360 m , 480 m और 600 m हैं। इसका क्षेत्रफल एक वर्गाकार खेत के क्षेत्रफल के बराबर है। वर्गाकार मैदान की भुजा (मीटर में) क्या है ?</span></p>",
                    options_en: ["<p>120<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>6</mn></msqrt></math></p>", "<p>160<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>6</mn></msqrt></math></p>", 
                                "<p>160<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>3</mn></msqrt></math></p>", "<p>120<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>3</mn></msqrt></math></p>"],
                    options_hi: ["<p>120<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>6</mn></msqrt></math></p>", "<p>160<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>6</mn></msqrt></math></p>",
                                "<p>160<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>3</mn></msqrt></math></p>", "<p>120<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mn>3</mn></msqrt></math></p>"],
                    solution_en: "<p>23.(a) <span style=\"font-family: Times New Roman;\">Sides of a triangle are 360 , 480 and 600 hence it is triplet ratio of 3,4 and 5</span><br><span style=\"font-family: Times New Roman;\">So it is right angle triangle</span><br><span style=\"font-family: Times New Roman;\">Let side of a square is &lsquo;a&rsquo;</span><br><span style=\"font-family: Times New Roman;\">According to the question</span><br><span style=\"font-family: Times New Roman;\">Area of triangle = area of square</span><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mn>360</mn><mo>&#215;</mo><mn>480</mn><mo>=</mo><mi>a</mi><mo>&#178;</mo><mo>&#160;</mo></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>&#178;</mo><mo>=</mo><mn>120</mn><mo>&#215;</mo><mn>120</mn><mo>&#215;</mo><mn>6</mn></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>=</mo><mn>120</mn><msqrt><mn>6</mn></msqrt></math></p>\n<p>&nbsp;</p>",
                    solution_hi: "<p>23.(a) <span style=\"font-family: Baloo;\">त्रिभुज की भुजाएँ 360, 480 और 600 हैं, इसलिए यह 3,4 और 5 का त्रिगुण अनुपात है।</span><br><span style=\"font-family: Baloo;\">तो यह समकोण त्रिभुज है।</span><br><span style=\"font-family: Baloo;\">माना वर्ग की भुजा \'a\' है।</span><br><span style=\"font-family: Baloo;\">प्रश्न के अनुसार,</span><br><span style=\"font-family: Baloo;\">त्रिभुज का क्षेत्रफल = वर्ग का क्षेत्रफल</span><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>2</mn></mfrac><mo>&#215;</mo><mn>360</mn><mo>&#215;</mo><mn>480</mn><mo>=</mo><mi>a</mi><mo>&#178;</mo><mo>&#160;</mo></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>&#178;</mo><mo>=</mo><mn>120</mn><mo>&#215;</mo><mn>120</mn><mo>&#215;</mo><mn>6</mn></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>a</mi><mo>=</mo><mn>120</mn><msqrt><mn>6</mn></msqrt></math></p>\n<p>&nbsp;</p>",
                    correct: "a",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "24",
                    section: "17",
                    question_en: "<p>2<span style=\"font-family: Times New Roman;\">4. </span><span style=\"font-family: Times New Roman;\">A solid cone of radius 7cm and height 7cm was melted along with two solid spheres of radius 7 cm each to form a solid cylinder of radius 7cm . What is the curved surface area (in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>c</mi><msup><mi>m</mi><mn>2</mn></msup></math> </span><span style=\"font-family: Times New Roman;\">) of the cylinders ?<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>u</mi><mi>s</mi><mi>e</mi><mi>&#960;</mi><mo>=</mo><mfrac><mn>22</mn><mn>7</mn></mfrac><mo>&#160;</mo><mo>)</mo></math>&nbsp;</span></p>",
                    question_hi: "<p>2<span style=\"font-family: Times New Roman;\">4. </span><span style=\"font-family: Baloo;\">त्रिज्या 7 cm और ऊंचाई 7 cm वाले एक ठोस शंकु को 7 cm त्रिज्या के दो ठोस गोले के साथ पिघलाकर 7 cm त्रिज्या का एक ठोस बेलन बनाया गया। बेलन का वक्र पृष्ठीय क्षेत्रफल (<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>c</mi><msup><mi>m</mi><mn>2</mn></msup></math></span><span style=\"font-family: Baloo;\"> में) कितना है?<math style=\"font-family:Verdana\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mo>&#160;</mo><mi>&#960;</mi><mo>=</mo><mfrac><mn>22</mn><mn>7</mn></mfrac><mi>&#2346;&#2381;&#2352;&#2351;&#2379;&#2327;</mi><mo>&#160;</mo><mo>&#160;</mo><mi>&#2325;&#2352;&#2375;&#2306;</mi><mo>&#160;</mo><mo>)</mo></math></span></p>",
                    options_en: ["<p>924</p>", "<p>880</p>", 
                                "<p>2196</p>", "<p>482</p>"],
                    options_hi: ["<p>924</p>", "<p>880</p>",
                                "<p>2196</p>", "<p>482</p>"],
                    solution_en: "<p>24.(a) <span style=\"font-family: Times New Roman;\">When any solid is melted and converted into another solid then their volume remains the same</span><br><span style=\"font-family: Times New Roman;\">So according to the question</span><br><span style=\"font-family: Times New Roman;\">Initial volume = final volume</span><br><span style=\"font-family: Times New Roman;\">Volume of (cone + 2&times;sphere) =Volume of (cylinder)</span><br><span style=\"font-family: Times New Roman;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>3</mn></mfrac><mi>&#960;</mi><mi>r</mi><mo>&#178;</mo><mi>h</mi><mo>&#8321;</mo><mo>+</mo><mn>2</mn><mo>&#215;</mo><mfrac><mn>4</mn><mn>3</mn></mfrac><mi>&#960;</mi><mi>r</mi><mo>&#179;</mo><mo>=</mo><mi>&#960;</mi><mo>&#160;</mo><mi>r</mi><mo>&#178;</mo><mi>h</mi><mo>&#8322;</mo><mo>&#160;</mo><mo>&#160;</mo></math></span><br><span style=\"font-family: Times New Roman;\">Here r = 7cm , </span><span style=\"font-family: Times New Roman;\">&nbsp;= 7cm</span><br><span style=\"font-family: Times New Roman;\"> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>3</mn></mfrac><mi>&#960;</mi><mo>&#160;</mo><mn>7</mn><mo>&#178;</mo><mo>&#215;</mo><mn>7</mn><mo>+</mo><mn>2</mn><mo>&#215;</mo><mfrac><mn>4</mn><mn>3</mn></mfrac><mi>&#960;</mi><mn>7</mn><mo>&#179;</mo><mo>=</mo><mi>&#960;</mi><mo>&#160;</mo><mn>7</mn><mo>&#178;</mo><mi>h</mi><mo>&#8322;</mo><mo>&#160;</mo><mo>&#160;</mo></math></span><br><span style=\"font-family: Times New Roman;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>9</mn><mn>3</mn></mfrac><mi>&#960;</mi><mn>7</mn><mo>&#179;</mo><mo>=</mo><mi>&#960;</mi><mo>&#160;</mo><mn>7</mn><mo>&#178;</mo><mi>h</mi><mo>&#8322;</mo><mo>&#160;</mo></math></span><br><span style=\"font-family: Times New Roman;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mi>h</mi><mo>&#8322;</mo><mo>=</mo><mn>21</mn><mi>c</mi><mi>m</mi></math></span><br><span style=\"font-family: Times New Roman;\">Curved surface area of a cylinder= </span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2</mn><mi>&#960;</mi><mi>r</mi><mi>h</mi><mo>&#8322;</mo><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>2</mn><mo>&#215;</mo><mfrac><mn>22</mn><mn>7</mn></mfrac><mo>&#215;</mo><mn>7</mn><mo>&#215;</mo><mn>21</mn><mo>&#160;</mo></math><span style=\"font-family: Times New Roman;\"> = 924cm&sup3; </span></p>",
                    solution_hi: "<p>24.(a) <span style=\"font-family: Baloo;\">जब किसी ठोस को पिघलाकर दूसरे ठोस में बदला जाता है तो उसका आयतन वही रहता है।</span><br><span style=\"font-family: Baloo;\">तो प्रश्न के अनुसार,</span><br><span style=\"font-family: Baloo;\">प्रारंभिक आयतन = अंतिम आयतन</span><br>(शंकु 2 &times; गोले) का आयतन = (बेलन) का आयतन<br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>3</mn></mfrac><mi>&#960;</mi><mi>r</mi><mo>&#178;</mo><mi>h</mi><mo>&#8321;</mo><mo>+</mo><mn>2</mn><mo>&#215;</mo><mfrac><mn>4</mn><mn>3</mn></mfrac><mi>&#960;</mi><mi>r</mi><mo>&#179;</mo><mo>=</mo><mi>&#960;</mi><mo>&#160;</mo><mi>r</mi><mo>&#178;</mo><mi>h</mi><mo>&#8322;</mo><mo>&#160;</mo><mo>&#160;</mo></math><br><span style=\"font-family: Baloo;\">यहाँ, r = 7cm , </span><span style=\"font-family: Times New Roman;\">&nbsp;= 7cm</span><br><span style=\"font-family: Times New Roman;\"> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>1</mn><mn>3</mn></mfrac><mi>&#960;</mi><mo>&#160;</mo><mn>7</mn><mo>&#178;</mo><mo>&#215;</mo><mn>7</mn><mo>+</mo><mn>2</mn><mo>&#215;</mo><mfrac><mn>4</mn><mn>3</mn></mfrac><mo>&#160;</mo><mi>&#960;</mi><mn>7</mn><mo>&#179;</mo><mo>=</mo><mi>&#960;</mi><mo>&#160;</mo><mn>7</mn><mo>&#178;</mo><mi>h</mi><mo>&#8322;</mo><mo>&#160;</mo><mo>&#160;</mo></math></span><br><span style=\"font-family: Times New Roman;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>9</mn><mn>3</mn></mfrac><mi>&#960;</mi><mn>7</mn><mo>&#179;</mo><mo>=</mo><mi>&#960;</mi><mo>&#160;</mo><mn>7</mn><mo>&#178;</mo><mi>h</mi><mo>&#8322;</mo><mo>&#160;</mo><mi>h</mi><mo>&#8322;</mo><mo>&#160;</mo></math></span><br><span style=\"font-family: Times New Roman;\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>&#160;</mo><mn>21</mn><mi>c</mi><mi>m</mi></math></span><br><span style=\"font-family: Baloo;\">बेलन का वक्र पृष्ठीय क्षेत्रफल</span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>2</mn><mi>&#960;</mi><mi>r</mi><mi>h</mi><mo>&#8322;</mo><mo>=</mo><mn>2</mn><mo>&#215;</mo><mfrac><mn>22</mn><mn>7</mn></mfrac><mo>&#215;</mo><mn>7</mn><mo>&#215;</mo><mn>21</mn><mo>=</mo><mn>924</mn><mi>c</mi><mi>m</mi><mo>&#179;</mo><mo>&#160;</mo></math><span style=\"font-family: Times New Roman;\"> </span></p>",
                    correct: "a",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
                questions.push({
                    id: "25",
                    section: "misc",
                    question_en: "<p>2<span style=\"font-family: Times New Roman;\">5. </span><span style=\"font-family: Times New Roman;\"> A 22.5m high tent is the shape of a frustum of a cone surmounted by a hemisphere. If the diameter of the upper and the lower circular end of the frustum are 21m and 39m respectively, then find the areas of the cloth (in&nbsp;<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>m</mi><mn>2</mn></msup></math> </span><span style=\"font-family: Times New Roman;\">) used to make the tent (ignoring the wastage).<math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>U</mi><mi>s</mi><mi>e</mi><mo>&#160;</mo><mi>&#1083;</mi><mo>=</mo><mfrac><mn>22</mn><mn>7</mn></mfrac><mo>)</mo></math></span></p>",
                    question_hi: "<p>25. <span style=\"font-family: Palanquin Dark;\"> एक 22.5 m ऊंचा तंबू एक अर्धगोले से घिरे एक शंकु के छिन्नक के आकार का है। यदि छिन्नक के ऊपरी और निचले वृत्ताकार सिरे का व्यास क्रमशः 21 m और 39 m है, तो तंबू बनाने के लिए इस्तेमाल किए गए कपड़े (</span><span style=\"font-family: Palanquin Dark;\"> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msup><mi>m</mi><mn>2</mn></msup></math>में) का क्षेत्रफल ज्ञात कीजिए (अपव्यय को अनदेखा करते हुए)।<math style=\"font-family:Verdana\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>(</mo><mi>&#1083;</mi><mo>=</mo><mfrac><mn>22</mn><mn>7</mn></mfrac><mo>&#160;</mo><mi>&#2325;&#2366;</mi><mo>&#160;</mo><mo>&#160;</mo><mi>&#2346;&#2381;&#2352;&#2351;&#2379;&#2327;</mi><mo>&#160;</mo><mo>&#160;</mo><mi>&#2325;&#2352;&#2375;&#2306;</mi><mo>)</mo></math></span></p>",
                    options_en: ["<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>787</mn><mfrac><mn>2</mn><mn>7</mn></mfrac></math></p>", "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2107</mn><mfrac><mn>2</mn><mn>7</mn></mfrac></math></p>", 
                                "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1635</mn><mfrac><mn>6</mn><mn>7</mn></mfrac></math></p>", "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2800</mn><mfrac><mn>2</mn><mn>7</mn></mfrac></math></p>"],
                    options_hi: ["<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>787</mn><mfrac><mn>2</mn><mn>7</mn></mfrac></math></p>", "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2107</mn><mfrac><mn>2</mn><mn>7</mn></mfrac></math></p>",
                                "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>1635</mn><mfrac><mn>6</mn><mn>7</mn></mfrac></math></p>", "<p><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mn>2800</mn><mfrac><mn>2</mn><mn>7</mn></mfrac></math></p>"],
                    solution_en: "<p>25.(b) <span style=\"font-family: Palanquin Dark;\">Upper radius = 21/2 = 10.5</span><br><span style=\"font-family: Palanquin Dark;\">Lower radius = 39/2 = 19.5</span><br><span style=\"font-family: Palanquin Dark;\">Height of frustum = 22.5 - radius of hemisphere</span><br><span style=\"font-family: Palanquin Dark;\">Height of frustum = 22.5 - 10.5 = 12</span><br><span style=\"font-family: Palanquin Dark;\">Now by pythagoras theorem</span><br><span style=\"font-family: Palanquin Dark;\">Slant height (l)= </span><span style=\"font-family: Palanquin Dark;\"> <math xmlns=\"http://www.w3.org/1998/Math/MathML\"><msqrt><mo>(</mo><mn>12</mn><mo>&#178;</mo><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>9</mn><mo>&#178;</mo><mo>)</mo></msqrt><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>15</mn></math></span><br><br><strong id=\"docs-internal-guid-790be92e-7fff-d8d8-27df-7daf16f96aa3\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXd4YfoodI7uFMcDSaimlM2Qw-hoEalXItdW1Z6fsuEsBMK2M82ZXCgjprkEnvBqAq3v11OSnAyjJ-sBkMUufj0bUPG8Xj3-6dfwK5nacy0Dt82jkKlMsfLpUNPHDXagQZyodag9pNPK6RB9Exs2rE2AR1c?key=lBSOMVNRHg5x-kcnW8NZhlpS\" width=\"192\" height=\"195\"></strong><br><span style=\"font-family: Palanquin Dark;\">Total surface area = surface area of hemisphere + surface area of frustum</span><br><span style=\"font-family: Palanquin Dark;\">Total surface area</span><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>2</mn><mi>&#960;</mi><mi>r</mi><mo>&#178;</mo><mo>+</mo><mi>&#960;</mi><mo>(</mo><mi>R</mi><mo>+</mo><mi>r</mi><mo>)</mo><mi>l</mi><mo>&#160;</mo></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mn>2</mn><mo>&#215;</mo><mfrac><mn>22</mn><mn>7</mn></mfrac><mo>&#215;</mo><mn>10</mn><mo>.</mo><mn>5</mn><mo>&#215;</mo><mn>10</mn><mo>.</mo><mn>5</mn><mo>&#160;</mo><mo>+</mo><mfrac><mn>22</mn><mn>7</mn></mfrac><mo>(</mo><mn>19</mn><mo>.</mo><mn>5</mn><mo>+</mo><mn>10</mn><mo>.</mo><mn>5</mn><mo>)</mo><mo>&#215;</mo><mn>15</mn><mo>&#160;</mo></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>14751</mn><mn>7</mn></mfrac><mo>=</mo><mo>&#160;</mo><mn>2107</mn><mfrac><mn>2</mn><mn>7</mn></mfrac><mo>&#160;</mo><mi>c</mi><mi>m</mi><mo>&#178;</mo></math></p>",
                    solution_hi: "<p>25.(b) <span style=\"font-family: Palanquin Dark;\">ऊपरी त्रिज्या(r) = 21/2 = 10.5</span><br><span style=\"font-family: Palanquin Dark;\">निचली त्रिज्या (R) = 39/2 = 19.5</span><br><span style=\"font-family: Palanquin Dark;\">छिन्नक की ऊँचाई = 22.5 - अर्धगोले की त्रिज्या</span><br><span style=\"font-family: Palanquin Dark;\">छिन्नक की ऊँचाई = 22.5 - 10.5 = 12</span><br><span style=\"font-family: Palanquin Dark;\">अब पाइथागोरस प्रमेय द्वारा</span><br><span style=\"font-family: Palanquin Dark;\">तिरछी ऊँचाई (l) =</span><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>&#8730;</mo><mo>(</mo><mn>12</mn><mo>&#178;</mo><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>9</mn><mo>&#178;</mo><mo>)</mo><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>15</mn></math><br><br><strong id=\"docs-internal-guid-790be92e-7fff-d8d8-27df-7daf16f96aa3\"><img src=\"https://lh7-rt.googleusercontent.com/docsz/AD_4nXd4YfoodI7uFMcDSaimlM2Qw-hoEalXItdW1Z6fsuEsBMK2M82ZXCgjprkEnvBqAq3v11OSnAyjJ-sBkMUufj0bUPG8Xj3-6dfwK5nacy0Dt82jkKlMsfLpUNPHDXagQZyodag9pNPK6RB9Exs2rE2AR1c?key=lBSOMVNRHg5x-kcnW8NZhlpS\" width=\"175\" height=\"178\"></strong><br><span style=\"font-family: Palanquin Dark;\">कुल पृष्ठीय क्षेत्रफल = अर्धगोले का पृष्ठीय क्षेत्रफल + छिन्नक का पृष्ठीय क्षेत्रफल</span><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>&#160;</mo><mn>2</mn><mi>&#960;</mi><mi>r</mi><mo>&#178;</mo><mo>+</mo><mi>&#960;</mi><mo>(</mo><mi>R</mi><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mi>r</mi><mo>)</mo><mi>l</mi><mo>&#160;</mo></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mo>=</mo><mo>&#160;</mo><mn>2</mn><mo>&#215;</mo><mfrac><mn>22</mn><mn>7</mn></mfrac><mo>&#215;</mo><mn>10</mn><mo>.</mo><mn>5</mn><mo>&#215;</mo><mn>10</mn><mo>.</mo><mn>5</mn><mo>+</mo><mfrac><mn>22</mn><mn>7</mn></mfrac><mo>(</mo><mn>19</mn><mo>.</mo><mn>5</mn><mo>&#160;</mo><mo>+</mo><mo>&#160;</mo><mn>10</mn><mo>.</mo><mn>5</mn><mo>)</mo><mo>&#215;</mo><mn>15</mn><mo>&#160;</mo></math><br><math xmlns=\"http://www.w3.org/1998/Math/MathML\"><mfrac><mn>14751</mn><mn>7</mn></mfrac><mo>&#160;</mo><mo>=</mo><mo>&#160;</mo><mn>2107</mn><mfrac><mn>2</mn><mn>7</mn></mfrac><mo>&#160;</mo><mi>c</mi><mi>m</mi><mo>&#178;</mo></math><br><br></p>",
                    correct: "b",
                    pos_marks: 2.0,
                    neg_marks: 0.5
                });
            
            // Generate question boxes
            const boxesContainer = document.getElementById('question-boxes');
            questions.forEach((q, index) => {
                const box = document.createElement('div');
                box.className = 'q-box';
                box.textContent = index + 1;
                box.onclick = () => showQuestion(index);
                box.id = `box-${index}`;
                boxesContainer.appendChild(box);
            });
            
            // Show first question
            showQuestion(0);
            updateProgress();
        }
        
        // Show a specific question
        
        function formatContent(text) {
            if (!text) return '';
            return text.replace(/<img/g, '<img style="max-width:100%;height:auto;"');
        }
        
        function showQuestion(index) {
            if (index < 0 || index >= questions.length) return;
            
            currentQuestion = index;
            const question = questions[index];
            
            // Update question counter
            document.getElementById('question-counter').textContent = `Question ${index + 1} of ${questions.length}`;
            
            // Update question boxes
            document.querySelectorAll('.q-box').forEach(box => box.classList.remove('current'));
            document.getElementById(`box-${index}`).classList.add('current');
            
            // Generate question HTML
            let html = `
                <div class="question-card">
                    <div class="question-text">
                        <div class="en">${formatContent(question.question_en)}</div>
                        <div class="hi" style="display:none">${formatContent(question.question_hi)} </div>
                    </div>
                    <div class="options" id="options-container">`;
            
            // Add options
            ['a', 'b', 'c', 'd'].forEach((opt, i) => {
                let optionClass = '';
                let isCorrectAnswer = opt === question.correct;
                let isUserAnswer = answers[question.id] === opt;
                
                // When reviewing, add appropriate classes
                if (submitted) {
                    if (isCorrectAnswer) {
                        optionClass += ' correct-answer';
                    } else if (isUserAnswer && !isCorrectAnswer) {
                        optionClass += ' incorrect';
                    }
                }
                
                html += `
                    <div class="option-item">
                        <input class="option-input" type="radio" name="q${index}" 
                            id="opt-${index}-${opt}" value="${opt}" 
                            ${isUserAnswer ? 'checked' : ''}
                            onclick="selectAnswer('${question.id}', '${opt}')">
                       <label class="option-label${optionClass}" for="opt-${index}-${opt}">
                            <div class="en">${question.options_en[i]}</div>
                            <div class="hi" style="display:none">${question.options_hi[i]}</div>
                        </label>
                    </div>`;
            });
            
            // Add solution if submitted
            if (submitted) {
                const isCorrect = answers[question.id] === question.correct;
                const resultText = answers[question.id] ? (isCorrect ? 'Correct!' : 'Incorrect!') : 'Not attempted';
                
                html += `
                    <div class="solution-container">
                        <div class="solution-title">${resultText}</div>
                        <div class="solution-text">
                            <div class="en">${question.solution_en}</div>
                            <div class="hi" style="display:none">${question.solution_hi}</div>
                        </div>
                    </div>`;
            }
            
            html += `</div></div>`;
            
            document.getElementById('questions-container').innerHTML = html;
            
            // Apply language settings
            applyLanguage();
            
            // If in mobile view, close the menu
            if (window.innerWidth < 992) {
                toggleNav(false);
            }
            
            // Add review mode class if submitted
            if (submitted) {
                document.getElementById('options-container').classList.add('review-mode');
            }
        }
        
        // Apply current language
        function applyLanguage() {
            document.querySelectorAll(`.${currentLang}`).forEach(el => el.style.display = 'block');
            document.querySelectorAll(`.${currentLang === 'en' ? 'hi' : 'en'}`).forEach(el => el.style.display = 'none');
            
            // Update language button text
            document.getElementById('lang-text').textContent = currentLang === 'en' ? 'Hi' : 'En';
        }
        
        // Select an answer
        function selectAnswer(qId, option) {
            if (submitted) return;
            
            answers[qId] = option;
            updateProgress();
            
            // Mark question as attempted in the navigation
            const index = questions.findIndex(q => q.id === qId);
            if (index >= 0) {
                const box = document.getElementById(`box-${index}`);
                box.classList.add('attempted');
                box.classList.remove('unattempted');
            }
        }
        
        // Navigate to previous/next question
        function prevQuestion() { 
            if (currentQuestion > 0) showQuestion(currentQuestion - 1); 
        }
        
        function nextQuestion() { 
            if (currentQuestion < questions.length - 1) showQuestion(currentQuestion + 1); 
        }
        
        // Switch section
        function switchSection(sectionId) {
            if (sectionId === 'all') {
                showQuestion(0);
                return;
            }
            
            const section = sections[sectionId];
            if (section) showQuestion(section.start);
        }
        
        // Toggle language
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'hi' : 'en';
            applyLanguage();
        }
        
        // Toggle navigation sidebar
        function toggleNav(show) {
            const nav = document.getElementById('question-nav');
            const overlay = document.getElementById('nav-overlay');
            
            if (show === undefined) {
                show = !nav.classList.contains('show');
            }
            
            if (show) {
                nav.classList.add('show');
                overlay.classList.add('show');
                document.body.style.overflow = 'hidden';
            } else {
                nav.classList.remove('show');
                overlay.classList.remove('show');
                document.body.style.overflow = '';
            }
        }
        
        // Update progress
        function updateProgress() {
            const attempted = Object.keys(answers).length;
            document.getElementById('attempted-count').textContent = attempted;
        }
        
        // Start timer
        function startTimer() {
            const timerDisplay = document.getElementById('timer-display');
            let timeLeft = totalTime;
            
            const timerInterval = setInterval(() => {
                if (timeLeft <= 0 || submitted) {
                    clearInterval(timerInterval);
                    if (!submitted) submitTest();
                    return;
                }
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                timeLeft--;
            }, 1000);
        }
        
        // Confirm before submitting
        function confirmSubmit() {
            if (submitted) return;
            
            const attempted = Object.keys(answers).length;
            const remaining = questions.length - attempted;
            
            // Create a more modern confirmation dialog
            const confirmHtml = `
                <div style="text-align: center; padding: 20px;">
                    <h4 style="margin-bottom: 16px; color: var(--dark);">Confirm Submission</h4>
                    <p style="margin-bottom: 24px; color: var(--gray);">
                        You have attempted ${attempted} of ${questions.length} questions.<br>
                        ${remaining} questions are unattempted.
                    </p>
                    <div style="display: flex; justify-content: center; gap: 12px;">
                        <button onclick="this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; border: 1px solid var(--light-gray); background: white; border-radius: 8px; cursor: pointer;">
                            Cancel
                        </button>
                        <button onclick="submitTest(); this.closest('.modal').querySelector('.cancel-btn').click()" 
                            style="padding: 8px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer;">
                            Submit Test
                        </button>
                    </div>
                </div>`;
            
            // Create modal element
            const modal = document.createElement('div');
            modal.className = 'results-modal show';
            modal.innerHTML = `
                <div class="results-card" style="max-width: 400px;">
                    <button class="cancel-btn" style="position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--gray);" onclick="this.closest('.results-modal').remove()">
                        ×
                    </button>
                    ${confirmHtml}
                </div>`;
            
            document.body.appendChild(modal);
        }
        
        // Submit test
        function submitTest() {
            if (submitted) return;
            
            submitted = true;
            
            let score = 0;
            let correctCount = 0;
            let incorrectCount = 0;
            let unattemptedCount = 0;
            
            questions.forEach((q, index) => {
                const userAns = answers[q.id];
                const box = document.getElementById(`box-${index}`);
                
                box.classList.remove('attempted');
                
                if (!userAns) {
                    unattemptedCount++;
                    box.classList.add('unattempted');
                } else if (userAns === q.correct) {
                    correctCount++;
                    score += q.pos_marks;
                    box.classList.add('correct');
                } else {
                    incorrectCount++;
                    score -= q.neg_marks;
                    box.classList.add('incorrect');
                }
            });
            
            // Update result values
            document.getElementById('score-value').textContent = score.toFixed(2);
            document.getElementById('correct-value').textContent = correctCount;
            document.getElementById('incorrect-value').textContent = incorrectCount;
            document.getElementById('unattempted-value').textContent = unattemptedCount;
            
            // Show the results modal
            document.getElementById('results-modal').classList.add('show');
            
            // Disable submit button
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-check"></i>';
            submitBtn.style.backgroundColor = 'var(--success)';
            
            // Refresh current question view to show solution
            showQuestion(currentQuestion);
        }
        
        // Review test
        function reviewTest() {
            document.getElementById('results-modal').classList.remove('show');
            showQuestion(0);
        }
        
        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target === document.getElementById('results-modal')) {
                document.getElementById('results-modal').classList.remove('show');
            }
        });
        
        // Keyboard navigation
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') prevQuestion();
            if (e.key === 'ArrowRight') nextQuestion();
        });
    </script>
</body>
</html>
