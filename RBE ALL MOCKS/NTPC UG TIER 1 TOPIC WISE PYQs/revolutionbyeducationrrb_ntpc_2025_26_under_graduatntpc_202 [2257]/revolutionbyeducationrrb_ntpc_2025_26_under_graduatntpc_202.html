pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Fought between:</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">British East India Company vs French</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Location: Wandiwash (Tamil Nadu)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Key Facts:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">British commander:</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Sir Eyre Coote</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">French commander:</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Comte de Lally</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Result: Decisive British victory</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Significance: Ended French colonial ambitions in India</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 4 → British and French</span><span> </span></p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which of the following statements is INCORRECT with respect to Indian socio-political movements and their leaders?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">The Self-Respect Movement was launched by E. V. Ramasamy.</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">The Home Rule League was founded by Aurobindo Ghosh.</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">The Abhinav Bharat Society was founded by Vinayak Damodar Savarkar.</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">The Poona Sarvajanik Sabha was associated with Mahadev Govind Ranade.</span><span> </span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Option 1:</span><span> </span><span style=\"font-family:Arial\">Self-Respect Movement (1925) - E. V. Ramasamy (Periyar) ✓</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Option 2:</span><span> </span><span style=\"font-family:Arial\">Home Rule League - Founded by</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Annie Besant (1916)</span><span> </span><span style=\"font-family:Arial\">and</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Bal Gangadhar Tilak (1916)</span><span> </span><span style=\"font-family:Arial\">, NOT Aurobindo Ghosh ✗</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Option 3:</span><span> </span><span style=\"font-family:Arial\">Abhinav Bharat Society (1904) - V. D. Savarkar ✓</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Option 4:</span><span> </span><span style=\"font-family:Arial\">Poona Sarvajanik Sabha (1870) - M. G. Ranade ✓</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 2 → The Home Rule League was founded by Aurobindo Ghosh.</span><span> </span></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">In which year did the Union Cabinet approve the Employment Linked Incentive (ELI) Scheme, named as ‘Pradhan Mantri Viksit Bharat Rozgar Yojana’?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">2018</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">2015</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">2021</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">2025</span><span> </span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Pradhan Mantri Viksit Bharat Rozgar Yojana</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Employment Linked Incentive (ELI) Scheme approved by Union Cabinet in</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">2025</span><span> </span><span style=\"font-family:Arial\">.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Aims to promote employment generation and formalization of jobs.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Part of government's initiative for developed India (Viksit Bharat) vision.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 4 → 2025</span><span> </span></p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which battle is regarded as the turning point that led to British political control in Bengal and opened the path for British expansion in India?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Battle of Buxar</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Battle of Wandiwash</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Battle of Plassey</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Third Carnatic War</span><span> </span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Battle of Plassey (1757)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Fought between: British East India Company (Robert Clive) vs Siraj- ud -Daulah (Nawab of Bengal)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Key Point: Mir Jafar's betrayal led to British victory</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Result: British gained political control over Bengal</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Significance: First major British territorial control in India, opened path for expansion</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 3 → Battle of Plassey</span><span> </span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which of the following social reformers established the ‘ Bahishkrit Hitakarini Sabha’ in 1924?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">B R Ambedkar</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Jyotirao Phule</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Baba Amte</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Jawaharlal Nehru</span><span> </span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Bahishkrit Hitakarini Sabha (1924)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Founded by:</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Dr. B.R. Ambedkar</span><span> </span><span style=\"font-family:Arial\">in Bombay (Mumbai)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Purpose: Welfare organization for uplifting the depressed classes and promoting education among untouchables.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Key Activities: Provided educational facilities, hostels, and employment guidance for marginalized communities.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 1 → B R Ambedkar</span><span> </span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">The book “Poverty and Un-British Rule in India”, which compiled evidence from British official sources to explain India’s economic drain, was authored by whom?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Gopal Krishna Gokhale</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">M. G. Ranade</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Dadabhai Naoroji</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">R. C. Dutt</span><span> </span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">\"Poverty and Un-British Rule in India\" (1901)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Authored by Dadabhai Naoroji, the 'Grand Old Man of India'.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Key F a cts:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">- Compiled evidence from British official records</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">- Explained the</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Drain of Wealth Theory</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">- Showed how British rule impoverished India economically</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 3 → Dadabhai Naoroji</span><span> </span></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which of the following incidents prompted Mahatma Gandhi to withdraw the Non-Cooperation Movement?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Alipore bomb case</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Suspension of the Rowlatt Act</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Chauri- Chaura incident</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Withdrawal of the Khilafat Movement</span><span> </span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Non-Cooperation Movement (1920-1922)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Launched by Gandhi against British rule.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Chauri- Chaura Incident (February 1922)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Location: Chauri- Chaura , Gorakhpur (UP)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Violent mob set fire to police station.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">22 policemen killed in the incident.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Gandhi immediately withdrew the movement as it</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">turned violent, against his principle of non-violence.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 3 → Chauri- Chaura incident</span><span> </span></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which major mass movement did the Indian National Congress agree to withdraw, under the Gandhi–Irwin Pact of March 1931?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Swadeshi Movement</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Civil Disobedience Movement</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Non Cooperation Movement</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Quit India Movement</span><span> </span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Gandhi-Irwin Pact (March 5, 1931)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Key Points:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Signed between Mahatma Gandhi and Lord Irwin (Viceroy)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Congress agreed to withdraw</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Civil Disobedience Movement</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• In return, British agreed to release political prisoners</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Gandhi agreed to attend Second Round Table Conference</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Timeline Context:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Civil Disobedience Movement started in 1930 with Dandi March</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 2 → Civil Disobedience Movement</span><span> </span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which of the following is INCORRECT about the Rampa Rebellion?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">It was against forest laws and moneylenders</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">It was led by Alluri Sitarama Raju</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">It took place in present day Maharashtra</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">It involved the use of guerrilla warfare tactics</span><span> </span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Rampa Rebellion (1922-1924)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Location:</span><span> </span><span style=\"font-family:Arial\">Godavari Agency, present-day Andhra Pradesh (NOT Maharashtra)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Leader:</span><span> </span><span style=\"font-family:Arial\">Alluri Sitarama Raju</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Causes:</span><span> </span><span style=\"font-family:Arial\">Oppressive forest laws, exploitation by moneylenders</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Method:</span><span> </span><span style=\"font-family:Arial\">Guerrilla warfare tactics against British</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Option 3 is INCORRECT - rebellion was in Andhra Pradesh, not Maharashtra</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 3 → It took place in present day Maharashtra</span><span> </span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which of the following social reformers founded the Arya Mahila Samaj to serve the cause of women?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Mehribai Tata</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Pandita Ramabai</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Sarla Devi Chaudhurani</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Tarabai Premchand</span><span> </span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Pandita Ramabai (1858-1922)</span><span> </span><span style=\"font-family:Arial\">was a renowned social reformer and women's rights activist.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">She founded the</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Arya Mahila Samaj</span><span> </span><span style=\"font-family:Arial\">in Pune in 1882 to promote women's education and empowerment.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">She also established Sharada Sadan (1889) and Mukti Mission (1898) for widows and destitute women.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 2 → Pandita Ramabai</span><span> </span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Behramji Merwanji Malabari, a Parsi social reformer, is credited for his efforts with the legislative enactment related to which of the following social evils?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Child marriage</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Untouchability</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Widow burning or sati</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Female infanticide</span><span> </span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Behramji Merwanji Malabari (1853-1912)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">A prominent</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Parsi social reformer</span><span> </span><span style=\"font-family:Arial\">and journalist</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">His relentless campaign against child marriage led to the</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Age of Consent Act, 1891</span><span> </span><span style=\"font-family:Arial\">.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">This Ac an style=\"font-family:Arial;font-weight:bold\">Topic: Mughal Architecture vs Temple Construction</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Trabeate System:</span><span> </span><span style=\"font-family:Arial\">Earlier Hindu temples used post-and-beam construction with flat roofs and corbelled arches.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Mughal Innovation:</span><span> </span><span style=\"font-family:Arial\">Introduced arcuate (arch-based) construction from Islamic architecture.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Key Features:</span><span> </span><span style=\"font-family:Arial\">True arches, domes, and vaults became defining elements of Mughal buildings.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Examples:</span><span> </span><span style=\"font-family:Arial\">Humayun's Tomb, Taj Mahal, Jama Masjid - all feature prominent domes and arched entrances.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 3 → Arches and domes</span><span> </span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Pandit Jawaharlal Nehru described which of the following as the “temple(s) of modern India”?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Parliament</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Dams</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Schools</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Hospitals</span><span> </span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Topic:</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Pandit Jawaharlal Nehru's Vision</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Nehru called</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Dams</span><span> </span><span style=\"font-family:Arial\">the 'temples of modern India'.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">He believed dams were crucial for:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Irrigation and agriculture</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Hydroelectric power generation</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Industrial development</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Famous dams built during his era: Bhakra Nangal, Hirakud.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 2 → Dams</span><span> </span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">In which year did India officially join the Shanghai Cooperation Organization (SCO) as a full member?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">2008</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">2021</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">2012</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">2017</span><span> </span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Shanghai Cooperation Organization (SCO)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">India was granted</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">observer status</span><span> </span><span style=\"font-family:Arial\">in SCO in 2005.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">India and Pakistan both became</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">full members</span><span> </span><span style=\"font-family:Arial\">on</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">9 June 2017</span><span> </span><span style=\"font-family:Arial\">at the Astana Summit in Kazakhstan.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">SCO is a Eurasian political, economic and security alliance founded in 2001.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 4 → 2017</span><span> </span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which European power was the first to establish trading settlements in India during the early modern period?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">French</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Portuguese</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Dutch</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">English</span><span> </span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Topic: European Trading Powers in India</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Portuguese arrival:</span><span> </span><span style=\"font-family:Arial\">Vasco da Gama landed in Calicut (1498)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">First European power to establish trade settlements</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Established factories at Goa (1510), Daman, Diu</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Other powers arrived later: Dutch (1602), English (1608), French (1668)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 2 → Portuguese</span><span> </span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which of the following statements is INCORRECT in the context of the Indian National Congress (INC)?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">George Yule was the first non-Indian President of the INC</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Dadabhai Naoroji was the first Parsi President of the INC</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Badruddin Tyabji was the first Jainist President of the INC</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Womesh Chandra Bonnerjee was the first Hindu President of the INC</span><span> </span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Topic: Indian National Congress Presidents</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Analyzing each statement:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Statement 1:</span><span> </span><span style=\"font-family:Arial\">George Yule (1888) - First non-Indian President ✓</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Statement 2:</span><span> </span><span style=\"font-family:Arial\">Dadabhai Naoroji (1886) - First Parsi President ✓</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Statement 3:</span><span> </span><span style=\"font-family:Arial\">Badruddin Tyabji (1887) - First</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Muslim</span><span> </span><span style=\"font-family:Arial\">President, NOT Jainist ✗</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Statement 4:</span><span> </span><span style=\"font-family:Arial\">W.C. Bonnerjee (1885) - First President and Hindu ✓</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Key Fact:</span><span> </span><span style=\"font-family:Arial\">Badruddin Tyabji was a prominent Muslim leader and lawyer, not a Jainist.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 3 → Badruddin Tyabji was the first Jainist President of the INC</span><span> </span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Who deciphered a Brahmi inscription referring king Ashoka as Devanampiya Piyadasi ?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">R C Majumdar</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Susan Bayly</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Romila Thapar</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">James Princep</span><span> </span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Topic: Decipherment of Brahmi Script</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">James Princep (1837)</span><span> </span><span style=\"font-family:Arial\">- British scholar and numismatist who successfully deciphered the Brahmi script.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">He identified '</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Devanampiya Piyadasi</span><span> </span><span style=\"font-family:Arial\">' (Beloved of Gods, Pleasant to Behold) as the title used by</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">King Ashoka</span><span> </span><span style=\"font-family:Arial\">in his inscriptions.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">This breakthrough opened the study of Mauryan history and Ashoka's edicts across India.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 4 → James Princep</span><span> </span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which of the following theories was propounded in Dadabhai Naoroji’s 1901 book Poverty and Un-British Rule in India?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Two Nation Theory</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Doctrine of Lapse Theory</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Subsidiary Alliance Theory</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Drain of Wealth Theory</span><span> </span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Dadabhai Naoroji's Book (1901)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Title: Poverty and Un-British Rule in India</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Drain of Wealth Theory</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Naoroji argued that British colonial rule systematically drained India's wealth to Britain.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Economic exploitation through taxes, trade policies, and resource extraction impoverished India.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Other theories unrelated to this book:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Two Nation Theory - Jinnah (1940s)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Doctrine of Lapse - Dalhousie (1848-56)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Subsidiary Alliance - Wellesley (1798)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 4 → Drain of Wealth Theory</span><span> </span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which event best signalled the decline of Portuguese power in India and the emergence of British and Dutch influence?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Treaty of Aix-la-Chapelle (1748)</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Establishment of Madras by the English (1639)</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Anglo-Persian capture of Hormuz (1622)</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Battle of Plassey (1757)</span><span> </span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Topic: Decline of Portuguese Power in India</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Anglo-Persian Capture of Hormuz (1622):</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Hormuz was a strategic Portuguese fort controlling trade routes in the Persian Gulf.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">English East India Company allied with Persia to capture it in 1622.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">This marked the</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">beginning of Portuguese decline</span><span> </span><span style=\"font-family:Arial\">in Asian waters.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Opened doors for British and Dutch to expand their influence.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Why other options are incorrect:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Madras (1639) - British expansion, but Portuguese already declining.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Plassey (1757) - British dominance over French, not Portuguese.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Aix-la-Chapelle (1748) - Anglo-French treaty, unrelated to Portuguese.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 3 → Anglo-Persian capture of Hormuz (1622)</span><span> </span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which new weapon led to Mangal Pandey’s agitation as a sepoy of the 34th Bengal Native Infantry?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Brown Bess musket</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Enfield rifle</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Snider rifle</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Matchlock gun</span><span> </span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Topic: Revolt of 1857 - Immediate Cause</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Mangal Pandey was a sepoy in the 34th Bengal Native Infantry.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Key Facts:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">1. The</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Enfield rifle</span><span> </span><span style=\"font-family:Arial\">cartridges were greased with cow and pig fat.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">2. Soldiers had to bite the cartridge before loading, offending both Hindu and Muslim sentiments.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">3. Mangal Pandey's agitation on March 29, 1857 at Barrackpore was triggered by this issue.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">This incident became a major spark for the 1857 Revolt.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 2 → Enfield rifle</span><span> </span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Who among the following is credited with establishing the 'Servants of India Society' to promote education and social reforms during the Indian National Movement?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Lala Lajpat Rai</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Gopal Krishna Gokhale</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Bipin Chandra Pal</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Dadabhai Naoroji</span><span> </span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Topic: Indian National Movement - Social Reform Organizations</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Servants of India Society (1905)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Founded by:</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Gopal Krishna Gokhale</span><span> </span><span style=\"font-family:Arial\">in Pune</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Objective: Train national missionaries for service of India, promote education, social reforms, and constitutional methods</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Gokhale was a moderate leader and mentor to Gandhi</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 2 → Gopal Krishna Gokhale</span><span> </span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which of the following Act first provided for the Indian representation in the legislative process?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Charter Act, 1853</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Pitt's India Act, 1784</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Government of India Act, 1858</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Indian Councils Act, 1861</span><span> </span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Topic:</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Indian Constitutional Development</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Indian Councils Act, 1861</span><span> </span><span style=\"font-family:Arial\">was the first Act to introduce</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Indian representation in the legislative process.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Key Features:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">- Introduced portfolio system in Governor-General's Council</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">- Allowed Governor-General to nominate Indians as non-official</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">members to the Legislative Council</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">- Lord Canning nominated 3 Indians: Raja of Benaras,</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Maharaja of Patiala, and Sir Dinkar Rao</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Other Acts:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">- Charter Act 1853: Separated legislative &amp; executive functions</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 4 → Indian Councils Act, 1861</span><span> </span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which of the following laws stipulated the establishment of Supreme Court in 1774 in Calcutta in India?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Government of India Act, 1858</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Regulating Act of 1773</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Pitt’s India Act, 1784</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Charter Act of 1813</span><span> </span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Topic: Constitutional History of India</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Regulating Act of 1773</span><span> </span><span style=\"font-family:Arial\">was the first step by British Parliament to regulate East India Company's affairs in India.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Key Provisions:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Established Supreme Court at Fort William, Calcutta in 1774</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• First Chief Justice: Sir Elijah Impey</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Court had jurisdiction over British subjects in Bengal, Bihar, Orissa</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Other Acts:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Pitt's India Act 1784 - Dual government system</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Charter Act 1813 - End of Company's trade monopoly</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Government of India Act 1858 - Crown rule began</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 2 → Regulating Act of 1773</span><span> </span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Who led the Khasi resistance against British interference in the 1830s?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Alluri Sitarama Raju</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Tirot Sing</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Sidhu Murmu</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Rani Gaidinliu</span><span> </span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Khasi Resistance (1829-1833)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Leader: Tirot Sing</span><span> </span><span style=\"font-family:Arial\">(Syiem of Nongkhlaw)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Context: British attempted to construct road through Khasi Hills connecting Brahmaputra and Surma valleys.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Tirot Sing led armed resistance against British interference in Khasi territory.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">He was captured in 1833 and died in captivity.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Other leaders: Alluri (Andhra), Sidhu Murmu (Santhal), Rani Gaidinliu (Naga).</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 2 → Tirot Sing</span><span> </span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Who was the leader of the Paika Rebellion of 1817, a significant early armed resistance against British East India Company rule in Odisha?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Chittu Singh</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Bakshi Jagabandhu</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Sidhu Murmu</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Alluri Sitarama Raju</span><span> </span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Paika Rebellion (1817)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Location: Odisha (Khurda region)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Leader:</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Bakshi Jagabandhu Bidyadhar</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">- Military chief of King of Khurda</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">- Led armed peasant militia (Paikas) against British</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Other leaders mentioned:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">- Chittu Singh: Kol Rebellion (1831-32)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">- Sidhu Murmu: Santhal Rebellion (1855-56)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">- Alluri Sitarama Raju: Rampa Rebellion (1922-24)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 2 → Bakshi Jagabandhu</span><span> </span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">The first residential university of the world, Nalanda, was established under the patronage of which of the following rulers?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Samudragupta</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Chandragupta I</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Kumaragupta I</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Skandagupta</span><span> </span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Nalanda University - Historical Facts</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Nalanda was established in the</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">5th century CE</span><span> </span><span style=\"font-family:Arial\">during the Gupta period.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Founded under the patronage of</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Kumaragupta I (415-455 CE)</span><span> </span><span style=\"font-family:Arial\">.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Located in present-day Bihar, it became the world's first residential university.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Later rulers like Harshavardhana and Pala kings also patronized it.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 3 → Kumaragupta I</span><span> </span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">In which year did the Vellore Mutiny take place?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">1806 CE</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">1799 CE</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">1857 CE</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">1817 CE</span><span> </span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Vellore Mutiny - 1806 CE</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">First major uprising against British East India Company.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Occurred on 10 July 1806 at Vellore Fort, Tamil Nadu.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Triggered by new dress code regulations that offended religious sentiments of Indian sepoys.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Predated the 1857 Revolt by 51 years.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 1 → 1806 CE</span><span> </span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which battle in 1741 marked the defeat of the Dutch by an Indian ruler?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Carnatic Wars</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Battle of Buxar</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Battle of Plassey</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Battle of Colachel</span><span> </span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Battle of Colachel (1741)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Fought between:</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Travancore</span><span> </span><span style=\"font-family:Arial\">(under Maharaja Marthanda Varma) vs</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Dutch East India Company</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Location: Colachel , present-day Tamil Nadu</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Outcome: Decisive victory for Travancore; Dutch commander</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Eustachius De Lannoy</span><span> </span><span style=\"font-family:Arial\">captured</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Significance: First major defeat of a European power by an Indian ruler in naval warfare</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Other options: Carnatic Wars (1746-1763), Plassey (1757), Buxar (1764) - all involved British, not Dutch</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 4 → Battle of Colachel</span><span> </span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which leader was a close associate of Mahatma Gandhi and carried out a salt protest in the Madras Presidency during the Civil Disobedience Movement?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Sarojini Naidu</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">K. Kamaraj</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Sardar Vallabhbhai Patel</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">C. Rajagopalachari</span><span> </span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Topic: Civil Disobedience Movement (1930-34)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">C. Rajagopalachari (Rajaji)</span><span> </span><span style=\"font-family:Arial\">was a close associate of Mahatma Gandhi and prominent Congress leader.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">He led the famous</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Vedaranyam Salt March</span><span> </span><span style=\"font-family:Arial\">in April 1930 in Madras Presidency, parallel to Gandhi's Dandi March.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">The march started from Trichinopoly and covered 150 miles to Vedaranyam on the coast to break the salt law.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Rajaji later became the first Indian Governor-General of India (1948-50).</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 4 → C. Rajagopalachari</span><span> </span></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Who among the following was NOT sentenced to death in the Kakori Conspiracy Case (1925)?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Roshan Singh</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Ashfaqulla Khan</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Rajendra Lahiri</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Sachindra Nath Bakshi</span><span> </span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Kakori Conspiracy Case (1925)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">The Kakori train robbery was conducted by HRA revolutionaries on 9 August 1925.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Death Sentences:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">1.</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Ramprasad Bismil</span><span> </span><span style=\"font-family:Arial\">- Hanged on 19 December 1927</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">2.</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Ashfaqulla Khan</span><span> </span><span style=\"font-family:Arial\">- Hanged on 19 December 1927</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">3.</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Roshan Singh</span><span> </span><span style=\"font-family:Arial\">- Hanged on 19 December 1927</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">4.</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Rajendra Lahiri</span><span> </span><span style=\"font-family:Arial\">- Hanged on 17 December 1927</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Sachindra Nath Bakshi</span><span> </span><span style=\"font-family:Arial\">was sentenced to life imprisonment, not death.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 4 → Sachindra Nath Bakshi</span><span> </span></p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Who was popularly known as the ‘Lion of Punjab’ during the Extremist phase?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Rajguru</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Lala Lajpat Rai</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Bal Gangadhar Tilak</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Bhagat Singh</span><span> </span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Topic: Indian Freedom Struggle - Extremist Phase</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Lala Lajpat Rai</span><span> </span><span style=\"font-family:Arial\">was popularly known as</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">'Lion of Punjab'</span><span> </span><span style=\"font-family:Arial\">(Punjab Kesari).</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">He was part of the famous</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Lal-Bal-Pal</span><span> </span><span style=\"font-family:Arial\">trio of extremist leaders.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Led protests against Simon Commission in 1928 and died from injuries sustained during lathi charge.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 2 → Lala Lajpat Rai</span><span> </span></p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which of the following languages is NOT included in the Eighth Schedule of the Indian Constitution?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">English</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Urdu</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Sanskrit</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Nepali</span><span> </span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Topic: Eighth Schedule of Indian Constitution</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">The Eighth Schedule lists</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">22 official languages</span><span> </span><span style=\"font-family:Arial\">recognized by the Constitution.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Languages included: Hindi, Bengali, Telugu, Marathi, Tamil, Urdu, Gujarati, Malayalam, Kannada, Odia, Punjabi, Assamese, Kashmiri, Sindhi, Sanskrit, Konkani, Manipuri, Nepali, Bodo, Santhali, Maithili, Dogri.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">English is NOT in the Eighth Schedule.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">English has special status under</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Article 343</span><span> </span><span style=\"font-family:Arial\">as an associate official language but is not listed in the Eighth Schedule.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 1 → English</span><span> </span></p>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which leader famously declared 'Swaraj is my birth right and I shall have it' during the Extremist Phase of the Indian National Movement?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Bal Gangadhar Tilak</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Aurobindo Ghose</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Lala Lajpat Rai</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Bipin Chandra Pal</span><span> </span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Topic: Indian National Movement - Extremist Phase</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Bal Gangadhar Tilak</span><span> </span><span style=\"font-family:Arial\">famously declared '</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Swaraj is my birthright and I shall have it</span><span> </span><span style=\"font-family:Arial\">' in 1916.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">He was one of the prominent leaders of the Extremist/Assertive Nationalist group.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Known as '</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Lokmanya Tilak</span><span> </span><span style=\"font-family:Arial\">' and '</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Father of Indian Unrest</span><span> </span><span style=\"font-family:Arial\">'.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 1 → Bal Gangadhar Tilak</span><span> </span></p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which of the following Acts was enacted by the British Parliament to regulate the administration of the British East India Company’s territories in India, particularly in Bengal?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Charter Act, 1813</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Regulating Act, 1773</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Government of India Act, 1858</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Pitt’s India Act, 1784</span><span> </span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Topic: British Acts in India</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Regulating Act, 1773</span><span> </span><span style=\"font-family:Arial\">was the first British Parliamentary Act to regulate East In
