<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>7.) Economics Part 1 UG - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;
  }

er: Option 2 → ₹2,000 crore</span><span> </span></p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which tool is most commonly used by the Reserve Bank of India to regulate liquidity in the economy?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Government subsidies</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Tariff imposition</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Repo rate adjustment</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Fiscal stimulus</span><span> </span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Topic: Monetary Policy Tools of RBI</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">RBI uses</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Repo Rate</span><span> </span><span style=\"font-family:Arial\">as primary tool for liquidity control.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Repo Rate = Rate at which RBI lends to commercial banks.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">↑ Repo Rate → Borrowing costly → Less liquidity</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">↓ Repo Rate → Borrowing cheap → More liquidity</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Other options: Subsidies, tariffs, fiscal stimulus are government tools, not RBI's monetary tools.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 3 → Repo rate adjustment</span><span> </span></p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">In India, which of the following institutions conducts Open Market Operations (OMOs) to manage money supply effectively?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Every state-owned govt. bank</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">National Bank For Agriculture And Rural Development (NABARD)</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Securities and Exchange Board of India (SEBI)</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Reserve Bank of India (RBI)</span><span> </span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Open Market Operations (OMOs)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">OMOs are monetary policy tools involving buying/selling of government securities in the open market.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Purpose:</span><span> </span><span style=\"font-family:Arial\">Control money supply and liquidity in the economy.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Conducting Authority:</span><span> </span><span style=\"font-family:Arial\">Reserve Bank of India (RBI) as the central bank has the exclusive authority to conduct OMOs.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Other institutions: NABARD (rural development), SEBI (securities regulation), commercial banks (banking operations).</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 4 → Reserve Bank of India (RBI)</span><span> </span></p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which of the following is no more a stock exchange in the country?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Multi Commodity Exchange of India Ltd.</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">National Commodity &amp; Derivatives Exchange Ltd.</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">National Stock Exchange of India Ltd.</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Delhi Stock Exchange Ltd.</span><span> </span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Topic: Stock Exchanges in India</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Delhi Stock Exchange (DSE)</span><span> </span><span style=\"font-family:Arial\">was one of the oldest stock exchanges in India.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">SEBI withdrew recognition of DSE in 2015 due to non-compliance with regulatory norms.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">DSE ceased operations and is</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">no longer a functional stock exchange</span><span> </span><span style=\"font-family:Arial\">.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Other options (MCX, NCDEX, NSE) are currently operational exchanges.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 4 → Delhi Stock Exchange Ltd.</span><span> </span></p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">How did the Rangarajan Group recommend updating the poverty line in the future?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">By relying on the National Accounts Statistics</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">By using the Fisher Index with data from NSSO</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">By removing the concept of poverty line altogether</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">By using a relative poverty measure compared to an absolute measure</span><span> </span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Topic: Rangarajan Committee on Poverty Estimation (2014)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">The Rangarajan Group was constituted to review poverty estimation methodology in India.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Key Recommendation:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">The committee recommended using the</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Fisher Price Index</span><span> </span><span style=\"font-family:Arial\">for updating the poverty line.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Data source:</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">NSSO (National Sample Survey Office)</span><span> </span><span style=\"font-family:Arial\">consumption expenditure surveys.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Fisher Index = Geometric mean of Laspeyres and Paasche indices, providing better price adjustment.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">This replaced the earlier Tendulkar Committee's approach.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 2 → By using the Fisher Index with data from NSSO</span><span> </span></p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">When was the Rangarajan Committee constituted to review the Methodology for Measurement of Poverty in India?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">2012</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">2010</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">2014</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">2008</span><span> </span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Rangarajan Committee on Poverty Measurement</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">The committee was constituted in</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">June 2012</span><span> </span><span style=\"font-family:Arial\">by the Planning Commission.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Chairman:</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Dr. C. Rangarajan</span><span> </span><span style=\"font-family:Arial\">(former RBI Governor)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Purpose: To review methodology for measuring poverty in India and suggest changes to the Tendulkar Committee approach.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">The committee submitted its report in</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">June 2014</span><span> </span><span style=\"font-family:Arial\">.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 1 → 2012</span><span> </span></p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">In which of the following years was the Technology Mission on Oilseeds launched due to which oilseeds production increased to a record level of 18 million tonnes in 1988-89?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">1984-85</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">1983-84</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">1985-86</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style= nt-weight:bold\">June 1, 2000</span><span> </span><span style=\"font-family:Arial\">.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Key difference: FERA was regulatory, FEMA is management-oriented.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 4 → 1999</span><span> </span></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">The economic crisis of 1991 acted as a trigger for reforms. What was the key reason for India’s 1991 economic crisis?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Oil price drop</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Increase in gold reserves</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">High fiscal and current account deficits</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Agricultural surplus</span><span> </span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">India's 1991 Economic Crisis - Key Reason</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">The crisis was triggered by</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">twin deficits</span><span> </span><span style=\"font-family:Arial\">:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">1. Fiscal Deficit:</span><span> </span><span style=\"font-family:Arial\">Government spending far exceeded revenue</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Heavy borrowing led to mounting public debt</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">2. Current Account Deficit:</span><span> </span><span style=\"font-family:Arial\">Imports exceeded exports significantly</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Gulf War (1990-91) caused oil prices to rise, worsening trade deficit</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Result:</span><span> </span><span style=\"font-family:Arial\">Foreign exchange reserves fell to just 2 weeks of imports</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">India had to pledge gold to IMF for emergency loans</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">This crisis led to</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">LPG reforms</span><span> </span><span style=\"font-family:Arial\">(Liberalization, Privatization, Globalization)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 3 → High fiscal and current account deficits</span><span> </span></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">The balance of payments crisis that India faced in 1991 occurred mainly due to:</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Excess industrial production</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Large fiscal and current account deficits</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Rapid growth in service exports</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Sudden surge in foreign remittances</span><span> </span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">India's 1991 Balance of Payments Crisis</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Main Causes:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Large</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">fiscal deficit</span><span> </span><span style=\"font-family:Arial\">(government overspending)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• High</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">current account deficit</span><span> </span><span style=\"font-family:Arial\">(imports &gt;&gt; exports)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Gulf War (1990-91) → oil prices rose sharply</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Foreign exchange reserves fell to</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">$1 billion</span><span> </span><span style=\"font-family:Arial\">(barely 2 weeks of imports)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Result:</span><span> </span><span style=\"font-family:Arial\">India had to pledge gold to IMF and adopt</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">LPG reforms</span><span> </span><span style=\"font-family:Arial\">(Liberalization, Privatization, Globalization)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Options 1, 3, 4 are incorrect — they would improve, not worsen, the crisis</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 2 → Large fiscal and current account deficits</span><span> </span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">In the Balance of Payments, an increase in foreign exchange reserves appears under which category?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Capital Account – Debit</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Current Account – Credit</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Capital Account – Credit</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Current Account – Debit</span><span> </span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Balance of Payments Structure:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Foreign Exchange Reserves are part of</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Capital Account</span><span> </span><span style=\"font-family:Arial\">.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">When reserves</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">increase</span><span> </span><span style=\"font-family:Arial\">→ Country acquires foreign assets</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">This is an</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">outflow of capital</span><span> </span><span style=\"font-family:Arial\">(use of funds)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">In BoP accounting:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Outflow/Use of funds =</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Debit entry</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Inflow/Source of funds = Credit entry</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Therefore: Increase in forex reserves = Capital Account Debit</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 1 → Capital Account – Debit</span><span> </span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">The Foreign Exchange Management Act (FEMA) was enacted in 1999 to replace the earlier FERA law. In which year did FEMA officially come into force?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">2000</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p>< evelop interest in:</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Arts and cultural activities</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Sports and physical education</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Science and mathematics learning</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Environmental awareness programmes</span><span> </span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Rashtriya Avishkar Abhiyan (RAA)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Launched:</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">July 2015</span><span> </span><span style=\"font-family:Arial\">by Ministry of HRD (now Ministry of Education)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Objective: Foster scientific temper and innovation among students from Class VI to XII</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Focus Areas:</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Science, Mathematics and Technology</span><span> </span><span style=\"font-family:Arial\">learning through hands-on activities, experiments, and innovation</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Key Features: Establishment of innovation clubs, science exhibitions, and practical learning in schools</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 3 → Science and mathematics learning</span><span> </span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which of the following is NOT an objective of the Pradhan Mantri Fasal Bima Yojana (PMFBY)?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Stabilising farmers’ income and ensuring continuation in farming activities</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Providing minimum support price for agricultural produce to farmers</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Providing financial support to farmers facing crop loss due to unforeseen events</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\ erment</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Option 2: Provides skills &amp; education → Enables economic independence</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Option 3: Restricts roles → Limits potential</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Option 4: Urban focus → Ignores rural women</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Impact:</span><span> </span><span style=\"font-family:Arial\">Vocational training leads to self-employment, income generation,</span><span> </span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">The 20-Point Economic Programme was initially launched in 1975 primarily to:</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Reduce government borrowing</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Liberalize trade policies</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Promote foreign direct investment</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margi =\"font-family:Arial\">• Concentrated in urban areas with infrastructure</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">NOT a characteristic:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Processing natural resources is done by</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Primary Sector</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">(agriculture, mining, forestry, fishing)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Tertiary sector supports primary and secondary sectors</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">through services, not direct resource processing.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 3 → Directly processes natural resources</span><span> </span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which type of unemployment is caused by a decline in aggregate demand during economic downturns?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Structural</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Voluntary</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Cyclical</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Seasonal</span><span> </span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Types of Unemployment:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Cyclical Unemployment</span><span> </span><span style=\"font-family:Arial\">- Caused by fluctuations in economic cycle and decline in aggregate demand during recessions/downturns.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Structural</span><span> </span><span style=\"font-family:Arial\">- Mismatch between skills and job requirements.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Seasonal</span><span> </span><span style=\"font-family:Arial\">- Due to seasonal nature of work (agriculture, tourism).</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Voluntary</span><span> </span><span style=\"font-family:Arial\">- When workers choose not to work at prevailing wage.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">During economic downturns, demand falls → businesses reduce production → workers laid off → cyclical unemployment rises.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 3 → Cyclical</span><span> </span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">The primary focus of tertiary activities is:</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Wealth creation through agriculture</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Extraction of natural resources</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Transformation of raw materials</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Production of intangible goods</span><span> </span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Economic Activities Classification:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Primary:</span><span> </span><span style=\"font-family:Arial\">Agriculture, mining, fishing (natural resources)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Secondary:</span><span> </span><span style=\"font-family:Arial\">Manufacturing, construction (raw material transformation)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Tertiary:</span><span> </span><span style=\"font-family:Arial\">Services sector (intangible goods)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Tertiary Activities Include:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Trade, transport, communication, banking, education, healthcare</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">These produce services, not physical products</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Options 1 &amp; 2 → Primary sector</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Option 3 → Secondary sector</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Option 4 → Tertiary sector ✓</span><span> </span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which statement best explains why transport and communication infrastructure are vital for India’s economic growth?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">It primarily serves elite passenger travel without influencing economic output</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">It links production centres with markets, enhancing trade and economic activity</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">It limits industrial expansion by diverting funds from core economic sectors</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">It increases regional isolation by reducing interaction among different areas</span><span> </span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Topic: Transport &amp; Communication Infrastructure</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Role in Economic Growth:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Connects production centers to consumer markets</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Facilitates movement of goods, services, and labor</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Reduces transaction costs and time</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Enables regional specialization and trade</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Attracts investment and industrial development</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Analysis of Options:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Option 1: Incorrect - Infrastructure serves all sectors, not just elite travel</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Option 3: Incorrect - Infrastructure enables industrial expansion</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Option 4: Incorrect - It reduces isolation, not increases it</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 2 → It links production centres with markets, enhancing trade and economic activity</span><span> </span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which of the following best describes ‘disguised unemployment’ in the Indian context?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Workers shift from one job to another frequently.</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Workers are temporarily unemployed during economic slowdown.</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Workers are not willing to work.</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">More people are employed than actually needed, with marginal productivity being zero.</span><span> </span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Topic: Disguised Unemployment</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Definition:</span><span> </span><span style=\"font-family:Arial\">A situation where more people are engaged in work than actually required, and removing some workers does not affect total output.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Key Features:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Marginal productivity of extra workers = zero</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Common in Indian agriculture and family businesses</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Example: 5 people working on a farm that needs only 3</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Indian Context:</span><span> </span><span style=\"font-family:Arial\">Prevalent in rural agricultural sector where family members work on small landholdings even when their contribution to output is negligible.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 4 → More people are employed than actually needed, with marginal productivity being zero.</span><span> </span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which of the following sectors includes activities like trade, transport, and communication in India?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Primary</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Secondary</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Tertiary</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Quinary</span><span> </span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Economic sectors classification:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Primary Sector:</span><span> </span><span style=\"font-family:Arial\">Agriculture, mining, forestry</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Secondary Sector:</span><span> </span><span style=\"font-family:Arial\">Manufacturing, construction</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Tertiary Sector:</span><span> </span><span style=\"font-family:Arial\">Services - trade, transport, communication, banking</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Quinary Sector:</span><span> </span><span style=\"font-family:Arial\">High-level decision making, research</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Trade, transport, and communication are</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">service activities</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">These fall under the</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Tertiary/Service Sector</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 3 → Tertiary</span><span> </span></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></
