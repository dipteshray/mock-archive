an><span> </span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">As per Article ___________ of the Indian Constitution,</span><span style=\"font-family:Arial\">  </span><span style=\"font-family:Arial\">from the date of commencement of the Constitution (Sixty-ninth Amendment) Act, 1991, the Union territory of Delhi shall be called the National Capital Territory of Delhi.</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">239AB</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">239AA</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">239AD</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">239AC</span><span> </span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">The</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Constitution (Sixty-ninth Amendment) Act, 1991</span><span> </span><span style=\"font-family:Arial\">inserted Article 239AA.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 239AA provides special provisions with respect to Delhi.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">It renamed the Union Territory of Delhi as</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">National Capital Territory of Delhi</span><span> </span><span style=\"font-family:Arial\">.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">This article also provides for a Legislative Assembly and Council of Ministers for Delhi.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 2 → 239AA</span><span> </span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which of the following objectives is mentioned in Article 39 of the Indian Constitution?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">To organise agriculture and animal husbandry</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">To organise village panchayats</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">To promote equal pay for equal work for both men and women</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">To ensure equal justice and provide free legal aid</span><span> </span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Article 39: Directive Principles of State Policy</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 39 mentions principles for securing:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Right to adequate livelihood (39a)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Equal distribution of resources (39b)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">•</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Equal pay for equal work for men and women (39d)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Protection of children and youth (39e,f)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Other options belong to different articles:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Option 1 → Article 48 (Agriculture &amp; Animal Husbandry)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Option 2 → Article 40 (Village Panchayats)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Option 4 → Article 39A (Free Legal Aid)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 3 → To promote equal pay for equal work for both men and women</span><span> </span></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which constitutional amendment to the Indian Constitution added the term 'Socialist' to the Preamble?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">42nd Amendment, 1976</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">1st Amendment, 1951</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">26th Amendment, 1971</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">44th Amendment, 1978</span><span> </span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">42nd Amendment Act, 1976</span><span> </span><span style=\"font-family:Arial\">added three words to the Preamble:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">1.</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Socialist</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">2.</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Secular</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">3.</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Integrity</span><span> </span><span style=\"font-family:Arial\">(added to 'unity')</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Enacted during Emergency (1975-77) under Indira Gandhi government.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Called the 'Mini Constitution' due to extensive changes.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 1 → 42nd Amendment, 1976</span><span> </span></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which among the following information is NOT a ground for exemption from disclosure of information under RTI Act, 2005?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Sovereignty and integrity of India</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Public Interest</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Breach of privilege of Parliament</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Cabinet papers including records of deliberation</span><span> </span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">RTI Act 2005 - Section 8: Exemptions from Disclosure</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Section 8 lists grounds where information can be</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">exempted</span><span> </span><span style=\"font-family:Arial\">:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Sovereignty and integrity of India (Section 8(1)(a)) ✓</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Breach of privilege of Parliament (Section 8(1)(c)) ✓</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Cabinet papers including records of deliberation (Section 8(1)(i)) ✓</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Public Interest</span><span> </span><span style=\"font-family:Arial\">is NOT an exemption ground.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">In fact, Section 8(2) allows disclosure even of exempt information if</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">public interest outweighs</span><span> </span><span style=\"font-family:Arial\">the harm.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 2 → Public Interest</span><span> </span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which action attracts disqualification of an independent MP under the Anti-Defection Law introduced by the 52nd Constitutional Amendment Act, 1985?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Joining any political party after their election</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Remaining neutral during debates</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Supporting a coalition government</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Voting differently from party whip</span><span> </span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Added</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">10th Schedule</span><span> </span><span style=\"font-family:Arial\">to Constitution to prevent defection.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">For Independent MPs:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">If an independent member joins any political party after election, they are disqualified.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Options 2 &amp; 3: No disqualification for independent MPs.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Option 4: Applies only to party members, not independents.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 1 → Joining any political party after their election</span><span> </span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">The power to issue writs for the enforcement of Fundamental Rights is vested in_____ .</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Session court and High Courts</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">District Court and High Courts</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Lok Adalat and High Courts</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Supreme Court and High Courts</span><span> </span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Article 32:</span><span> </span><span style=\"font-family:Arial\">Supreme Court can issue writs for enforcement of Fundamental Rights (Part III)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Article 226:</span><span> </span><span style=\"font-family:Arial\">High Courts can issue writs for Fundamental Rights AND other purposes.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Both SC and HCs have power to issue five types of writs: Habeas Corpus, Mandamus, Prohibition, Certiorari, Quo Warranto.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Lower courts (Session, District, Lok Adalat) do NOT have writ jurisdiction.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 4 → Supreme Court and High Courts</span><span> </span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which of the following is NOT correctly matched with respect to the Directive Principles of State Policy?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 41 - Provision for just and humane conditions of work and maternity relief</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 39A - Equal justice and free legal aid</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 43A - Participation of workers in management of industries</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 40 - Organisation of village panchayats</span><span> </span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Article 41</span><span> </span><span style=\"font-family:Arial\">- Right to work, education and public assistance in certain cases</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Article 42</span><span> </span><span style=\"font-family:Arial\">- Provision for just and humane conditions of work and maternity relief</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Option 1 incorrectly matches Article 41 with Article 42's provision</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Other Articles (Correctly Matched):</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 39A - Equal justice and free legal aid ✓</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 43A - Workers' participation in management ✓</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 40 - Organisation of village panchayats ✓</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 1 → Article 41 - Provision for just and humane conditions of work and maternity relief</span><span> </span></p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 25 of the Indian Constitution primarily guarantees which of the following rights?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Cultural and educational rights</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Freedom of religion</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Right to constitutional remedies</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Right to equality before law</span><span> </span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Article 25</span><span> </span><span style=\"font-family:Arial\">falls under Part III of the Constitution.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">It guarantees</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Freedom of Conscience and Free Profession, Practice and Propagation of Religion</span><span> </span><span style=\"font-family:Arial\">.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Key provisions: Right to freely profess, practice and propagate religion subject to public order, morality and health.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 2 → Freedom of religion</span><span> </span></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which Article authorizes the State to make special provisions for the welfare of women and children?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 23(2)</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 15(3)</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 16(2)</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 19(5)</span><span> </span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Article 15(3)</span><span> </span><span style=\"font-family:Arial\">enables the State to make special provisions</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">for women and children despite the general prohibition of</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">discrimination under Article 15(1).</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">This is an exception to the equality clause, allowing</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">affirmative action for vulnerable groups.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Other Articles:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 23(2) - Forced labour exceptions</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 16(2) - Employment discrimination</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 19(5) - Restrictions on freedom of movement</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 2 → Article 15(3)</span><span> </span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">In which year was Tamil given the status of classical language by the Constitution of India?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">2003</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">2004</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">2005</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">2002</span><span> </span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Tamil was the</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">first language</span><span> </span><span style=\"font-family:Arial\">to receive classical language status in India.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">The Government of India declared Tamil as a classical language in</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">2004</span><span> </span><span style=\"font-family:Arial\">.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">This recognition was based on its antiquity, rich literary tradition, and original texts dating back over 2000 years.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 2 → 2004</span><span> </span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">The Preamble primarily serves as which of the following?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">A financial guideline</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">A schedule to the Constitution</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">A guiding principle for interpretation</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">An enforceable part of law</span><span> </span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Key Facts:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">1. Preamble embodies basic philosophy and fundamental values of Constitution.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">2. Supreme Court ( Kesavananda Bharati case): Preamble is part of Constitution but not enforceable in court.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">3. It serves as</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">guiding light for interpretation</span><span> </span><span style=\"font-family:Arial\">of constitutional provisions.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 3 → A guiding principle for interpretation</span><span> </span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which Constitutional provision empowers the Government of India to give directions to a State in certain matters?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 262</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 265</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 248</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 256</span><span> </span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Article 256</span><span> </span><span style=\"font-family:Arial\">- Obligation of States and Union</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">States must exercise executive power to ensure compliance with Parliament laws.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Union can give</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">directions</span><span> </span><span style=\"font-family:Arial\">to States for implementation of Union laws.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">This ensures uniformity in execution of central legislation.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 4 → Article 256</span><span> </span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">According to Article 243Q, the level of municipality for a transitional area will be designated as a _________.</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Municipal Council</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Municipal Corporation</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Nagar Panchayat</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Township</span><span> </span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Article 243Q</span><span> </span><span style=\"font-family:Arial\">defines three types of municipalities:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">1.</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Nagar Panchayat</span><span> </span><span style=\"font-family:Arial\">→ Transitional area (rural to urban)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">2.</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Municipal Council</span><span> </span><span style=\"font-family:Arial\">→ Smaller urban area</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">3.</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Municipal Corporation</span><span> </span><span style=\"font-family:Arial\">→ Larger urban area</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Transitional areas are those in transition from rural to urban.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 3 → Nagar Panchayat</span><span> </span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which Articles in the Constitution of India deal with citizenship at the time of its commencement?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Articles 1 to 4</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Articles 14 to 24</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Articles 12 to 18</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Articles 5 to 11</span><span> </span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Part II (Articles 5-11)</span><span> </span><span style=\"font-family:Arial\">deals with citizenship at commencement.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Key Articles:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 5: Citizenship at commencement for domiciled persons</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 6: Rights of migrants from Pakistan</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 7: Rights of migrants to Pakistan</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 8: Rights of overseas Indians</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 9: Voluntary acquisition of foreign citizenship</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 10: Continuance of citizenship rights</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 11: Parliament's power to regulate citizenship</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 4 → Articles 5 to 11</span><span> </span></p>", "question_heading": ""}, {"sr_no": 37, "question": "  <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Consider the following pairs.</span><span> </span></p><table cellspacing=\"0\" cellpadding=\"0\" style=\"border:0.75pt solid #000000;border-collapse:collapse\"><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Article</span><span> </span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Provision</span><span> </span></p></td></tr><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">1. 63</span><span> </span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">The Vice-President of India</span><span> </span></p></td></tr><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">2. 64</span><span> </span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">The Vice-President to be ex-officio Chairman of the Council of States</span><span> </span></p></td></tr><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">3. 65</span><span> </span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">The Vice-President to act as President during the absence of the President</span><span> </span></p></td></tr><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">4. 66</span><span> </span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Election of Vice-President</span><span> </span></p></td></tr></table><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which of the above pairs is/are correctly matched?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">1 and 2 only</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">1, 2, 3 and 4</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">1, 2 and 3 only</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">2, 3 and 4 only</span><span> </span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Constitutional Articles on Vice-President</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Article 63:</span><span> </span><span style=\"font-family:Arial\">There shall be a Vice-President of India</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Article 64:</span><span> </span><span style=\"font-family:Arial\">VP shall be ex-officio Chairman of Rajya Sabha</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">(Council of States)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Article 65:</span><span> </span><span style=\"font-family:Arial\">VP acts as President or discharges functions</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">during casual vacancy or temporary absence</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Article 66:</span><span> </span><span style=\"font-family:Arial\">Election of Vice-President by Electoral College</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">(MPs of both Houses)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">All four pairs correctly matched</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 2 → 1, 2, 3 and 4</span><span> </span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">If the Government of India revokes the citizenship of an individual for acting against the interests of the country, which constitutional or statutory provision empowers it to do so?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Section 6A of the Citizenship Act, 1955</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Section 10 of the Citizenship Act, 1955</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 5 of the Constitution</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 11 of the Constitution</span><span> </span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Section 10 of Citizenship Act, 1955</span><span> </span><span style=\"font-family:Arial\">deals with termination of citizenship.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Government can revoke citizenship if person:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">- Obtained citizenship by fraud/false representation</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">- Showed disloyalty to Constitution</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">- Unlawfully traded/communicated with enemy during war</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">- Engaged in activities against sovereignty/integrity of India</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Other Options:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Section 6A: Special provisions for Assam migrants</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 5: Citizenship at commencement of Constitution</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 11: Parliament's power to regulate citizenship by law</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 2 → Section 10 of the Citizenship Act, 1955</span><span> </span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Consider the following statements regarding the 74th Amendment Act of 1992.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">1. It has added a new Part IX-A to the Constitution of India.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">2. The Act has also added a new 10th Schedule to the Constitution.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">3. The Act provides for the constitution of three types of municipalities in every state.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">4. It consists of provisions from Articles 243-P to 243-ZG.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which of the abo ve statements are correct?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">2 and 3 only</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">1, 2, and 3 only</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">1, 3, and 4 only</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">2 and 4 only</span><span> </span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">74th Amendment Act, 1992 - Urban Local Bodies</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Statement 1:</span><span> </span><span style=\"font-family:Arial\">Added Part IX-A to Constitution ✓</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Deals with municipalities (Articles 243-P to 243-ZG)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Statement 2:</span><span> </span><span style=\"font-family:Arial\">Added 10th Schedule ✗</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">10th Schedule = Anti-Defection Law (52nd Amendment)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">74th Amendment added</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">12th Schedule</span><span> </span><span style=\"font-family:Arial\">(18 subjects)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Statement 3:</span><span> </span><span style=\"font-family:Arial\">Three types of municipalities ✓</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Nagar Panchayat, Municipal Council, Municipal Corporation</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Statement 4:</span><span> </span><span style=\"font-family:Arial\">Articles 243-P to 243-ZG ✓</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Part IX-A contains these 18 articles</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 3 → 1, 3, and 4 only</span><span> </span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">The first E-Lok Adalat was held in which year in India?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">2014</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">2012</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">2020</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">2016</span><span> </span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">E-Lok Adalat is an online dispute resolution platform.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">The first E-Lok Adalat was conducted in</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">2020</span><span> </span><span style=\"font-family:Arial\">during the COVID-19 pandemic.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">It was launched by the National Legal Services Authority (NALSA) to ensure justice delivery during lockdown.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 3 → 2020</span><span> </span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which provision in Part II of the Constitution defines one basis for citizenship at the commencement, specifically that the person’s either parent was born in India?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 5</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 6</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 8</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 9</span><span> </span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Article 5</span><span> </span><span style=\"font-family:Arial\">defines citizenship at commencement of Constitution.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Key provision: Person domiciled in India AND</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">- Born in India, OR</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">- Either parent born in India, OR</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">- Ordinarily resident for 5+ years</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 6: Migration from Pakistan</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 8: Overseas citizens of Indian origin</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 9: Voluntary acquisition of foreign citizenship</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 1 → Article 5</span><span> </span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">In December 2025, which existing Act does the Viksit Bharat—Guarantee for Rozgar and Ajeevika Mission (Gramin) (VB—G RAM G) Bill, 2025 seek to replace?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Insurance Regulatory and Development Authority Act, 1999</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Mahatma Gandhi National Rural Employment Guarantee Act, 2005</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Life Insurance Corporation Act, 1956</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Insurance Act, 1938</span><span> </span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">VB-GRAMG Bill, 2025</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">The Viksit Bharat—Guarantee for Rozgar and Ajeevika Mission (Gramin) Bill, 2025 is introduced to replace the existing rural employment guarantee scheme.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">It seeks to replace</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">MGNREGA, 2005</span><span> </span><span style=\"font-family:Arial\">(Mahatma Gandhi National Rural Employment Guarantee Act).</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">The new bill aims to modernize rural employment programs under the Viksit Bharat vision.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 2 → Mahatma Gandhi National Rural Employment Guarantee Act, 2005</span><span> </span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">The Citizenship Amendment Act, 2019, provides citizenship to individuals belonging to which communities if they entered India before 31st December 2014 from Pakistan or Afghanistan or Bangladesh ?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Hindu, Muslim, Jain, Parsi</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Muslim, Christian, Parsi, Sikh</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Sikh, Christian, Hindu, Jain only</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Hindu, Sikh, Buddhist, Jain, Parsi, Christian</span><span> </span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Citizenship Amendment Act (CAA), 2019</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Provides citizenship to persecuted minorities from Pakistan, Afghanistan, Bangladesh who entered India before 31st December 2014.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Six communities covered:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Hindu, Sikh, Buddhist, Jain, Parsi, Christian</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Note: Muslim community is NOT included in CAA 2019.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 4 → Hindu, Sikh, Buddhist, Jain, Parsi, Christian</span><span> </span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">What is the main difference between a Cabinet Minister and a Minister of State with independent charge?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">A Minister of State with independent charge may head a ministry without being under a Cabinet Minister.</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">A Ministry of State is included in Cabinet meetings but does not exercise any significant powers.</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">A Minister of State with independen t charge does not exercise any significant powers.</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">A Minister of State with independent charge does not hold any specific responsibilities.</span><span> </span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Cabinet Minister:</span><span> </span><span style=\"font-family:Arial\">Senior minister, member of Cabinet, heads major ministries.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Minister of State (Independent Charge):</span><span> </span><span style=\"font-family:Arial\">Heads a ministry independently without reporting to a Cabinet Minister.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Minister of State (MoS):</span><span> </span><span style=\"font-family:Arial\">Works under a Cabinet Minister, assists in ministry work.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Key Difference:</span><span> </span><span style=\"font-family:Arial\">MoS with independent charge has full ministerial powers and autonomy over their ministry, unlike regular MoS who work under Cabinet Ministers.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 1 → A Minister of State with independent charge may head a ministry without being under a Cabinet Minister.</span><span> </span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Consider the following statements regarding the Central Administrative Tribunal (CAT) and select which is/are correct.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">1. It exercises original jurisdiction in matters related to recruitment and service conditions of public servants.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">2. Members of the def ence forces, Supreme Court officers, and Parliamentary staff are also covered.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">3. Members of CAT are appointed based on the recommendation of a high-powered committee chaired by the Prime Minister.</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">1 only</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">2 and 3 only</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">1 and 2 only</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">4 only</span><span> </span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Statement 1:</span><span> </span><span style=\"font-family:Arial\">Correct ✓</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">CAT has original jurisdiction over recruitment and service matters of civil servants under Article 323A.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Statement 2:</span><span> </span><span style=\"font-family:Arial\">Incorrect ✗</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Defence forces personnel, Supreme Court staff, and Parliament Secretariat employees are</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">excluded</span><span> </span><span style=\"font-family:Arial\">from CAT jurisdiction.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Statement 3:</span><span> </span><span style=\"font-family:Arial\">Incorrect ✗</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">CAT members appointed on recommendation of committee chaired by</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Chief Justice of India</span><span> </span><span style=\"font-family:Arial\">, not Prime Minister.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 1 → 1 only</span><span> </span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which among following fundamental duties is INCORRECT related towards the protection and promotion of scientific and cultural values?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">To value and preserve the rich heritage of our composite culture.</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">To safe guard the public property and to abjure violence</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">To develop the scientific temper, humanism and the spirit of inquiry and reform.</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">To strive towards excell ence in all spheres of individual and collective activity.</span><span> </span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Scientific &amp; Cultural Values Related Duties:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Option 1: Preserve composite culture heritage ✓</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Option 3: Develop scientific temper &amp; inquiry ✓</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Option 4: Strive for excellence ✓</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Option 2: Safeguard public property</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">This duty relates to</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">civic responsibility</span><span> </span><span style=\"font-family:Arial\">, NOT scientific/cultural promotion.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 2 → To safe guard the public property and to abjure violence</span><span> </span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Providing free legal aid under Article 39A indirectly promotes which Preamble objective?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Republic</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Secularism</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Sovereignty</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Justice</span><span> </span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Article 39A: Free Legal Aid</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 39A is a Directive Principle that mandates the State to ensure that the operation of the legal system promotes justice on a basis of equal opportunity.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">It specifically provides for</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">free legal aid</span><span> </span><span style=\"font-family:Arial\">to ensure that opportunities for securing justice are not denied to any citizen by reason of economic or other disabilities.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Connection to Preamble:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">The Preamble promises to secure</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">JUSTICE</span><span> </span><span style=\"font-family:Arial\">— social, economic and political — to all citizens.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Free legal aid ensures equal access to justice regardless of economic status, directly promoting the</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Justice objective</span><span> </span><span style=\"font-family:Arial\">of the Preamble.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 4 → Justice</span><span> </span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">As per Article 243Y of the Indian Constitution,</span><span style=\"font-family:Arial\">  </span><span style=\"font-family:Arial\">to whom does the Finance Commission submit its recommendations regarding Municipalities?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Governor of the State</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">State Finance Minister</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">President of India</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Chief Secretary of the State</span><span> </span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Article 243Y: Finance Commission for Municipalities</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 243Y mandates constitution of Finance Commission</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">by Governor every 5 years to review financial position</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">of Municipalities and Panchayats.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">The Finance Commission submits its recommendations</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">to the</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Governor of the State</span><span> </span><span style=\"font-family:Arial\">, who then places them</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">before the State Legislature.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 1 → Governor of the State</span><span> </span></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which of the following is not contained in Article 51?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Just and honourable relations between nations</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Respect for international law and treaty obligations</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Protection of forests and wildlife of India</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Promotion of international peace and security</span><span> </span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Article 51 - Promotion of International Peace and Security</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 51 is part of</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Directive Principles of State Policy (Part IV)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 51 contains:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Just and honourable relations between nations</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Respect for international law and treaty obligations</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Encouragement of settlement of disputes by arbitration</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Promotion of international peace and security</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Protection of forests and wildlife</span><span> </span><span style=\"font-family:Arial\">is covered under</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Article 48A</span><span> </span><span style=\"font-family:Arial\">, not Article 51</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 3 → Protection of forests and wildlife of India</span><span> </span></p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which Article empowers the President to specify the Scheduled Castes in various states and union territories?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 330</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 344</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 342</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 341</span><span> </span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Article 341</span><span> </span><span style=\"font-family:Arial\">empowers the President to specify which castes, races, or tribes shall be deemed as Scheduled Castes in relation to any State or Union Territory.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">The President may, after consultation with the Governor of the concerned State, notify the list of Scheduled Castes.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Parliament alone can modify this list through law; no executive order can alter it.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Note:</span><span> </span><span style=\"font-family:Arial\">Article 342 deals with Scheduled Tribes specification.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 4 → Article 341</span><span> </span></p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which constitutional amendment reduced the Parliament’s approval period for National Emergency from two months to one month?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">52nd Amendment Act, 1985</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">44th Amendment Act, 1978</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">38th Amendment Act, 1975</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">42nd Amendment Act, 1976</span><span> </span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">44th Amendment Act, 1978</span><span> </span><span style=\"font-family:Arial\">made several changes to Emergency provisions:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">1. Reduced Parliament's approval period from</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">2 months to 1 month</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">2. Changed grounds from 'internal disturbance' to</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">'armed rebellion'</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">3. Made President's satisfaction</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">justiciable in courts</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">4. Required</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">written advice of Cabinet</span><span> </span><span style=\"font-family:Arial\">for Emergency proclamation</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">This amendment was enacted to prevent misuse of Emergency powers after 1975-77 Emergency.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 2 → 44th Amendment Act, 1978</span><span> </span></p>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">The Indian Constitution empowers the Parliament to make laws on matters in the State List under which of the following circumstances?</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">1. When the Rajya Sabha passes a resolution to that effect</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">2. During a National Emergency</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">3. When states make a request</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">4. To implement international agreements</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">5. At the discretion of the Prime Minister</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">2, 3, 4, and 5 only</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">1, 2, 3, and 5 only</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">1, 2, 4, and 5 only</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">1, 2, 3, and 4 only</span><span> </span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Constitutional Provisions (Articles 249, 250, 252, 253):</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">1. Rajya Sabha Resolution (Art. 249):</span><span> </span><span style=\"font-family:Arial\">If Rajya Sabha passes resolution by 2/3 majority that it is necessary in national interest</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">2. National Emergency (Art. 250):</span><span> </span><span style=\"font-family:Arial\">During proclamation of emergency under Art. 352</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">3. State Request (Art. 252):</span><span> </span><span style=\"font-family:Arial\">When two or more states pass resolutions requesting Parliament to legislate</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">4. International Agreements (Art. 253):</span><span> </span><span style=\"font-family:Arial\">To implement treaties, agreements, and conventions with foreign countries</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">5. PM's Discretion:</span><span> </span><span style=\
