<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>31.) Polity Part 3 UG - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;

an Constitution deals with the organization of village panchayats.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">It directs the State to organize village panchayats and endow them with necessary powers and authority to function as units of self-government.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">This provision falls under Part IV (DPSP) of the Constitution.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 2 → Article 40</span><span> </span></p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Elections to Panchayats and Municipalities are managed by which body according to the Constitution?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Lok Sabha Secretariat</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">District Magistrates</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Central Election Commission</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">State Election Commissions</span><span> </span></p>", "answe ident</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">State Assemblies</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Lok Sabha and Rajya Sabha</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Panchayats and Municipalities</span><span> </span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Topic: State Election Commission</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Constitutional Provision:</span><span> </span><span style=\"font-family:Arial\">Article 243K and 243ZA</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">State Election Commission conducts elections to:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Panchayats (rural local bodies)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Municipalities (urban local bodies)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Election Commission of India conducts:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6p /span><span style=\"font-family:Arial\">.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Reason: This ensures independence and prevents arbitrary removal by state government.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Similar to UPSC members who are also removed by President.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 2 → President of India</span><span> </span></p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which Indian state became the first in the country to enact its own Right to Information Act in 1997?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Punjab</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Rajasthan</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Karnataka</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Tamil Nadu</span><span> </span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Topic:</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Right to Information Act - Historical Development</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Tamil Nadu</span><span> </span><span style=\"font-family:Arial\">was the first Indian state to enact its own RTI Act in</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">1997</span><span> </span><span style=\"font-family:Arial\">.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">This was before the national RTI Act 2005 came into force.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Tamil Nadu set a precedent for transparency and accountability in governance.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 4 → Tamil Nadu</span><span> </span></p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Tribunals under Article 323A (Administrative tribunals) of the Constitution of India can be established by:</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Supreme Courts only</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Parliament only</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">High Courts only</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">State legislatures only</span><span> </span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Article 323A - Administrative Tribunals</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Constitutional Provision:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 323A empowers</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Parliament</span><span> </span><span style=\"font-family:Arial\">to establish tribunals for adjudication of disputes related to recruitment and service conditions of public servants.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Key Points:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Parliament can create tribunals by law for Centre and States</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Covers disputes of persons in public service</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Administrative Tribunals Act, 1985 enacted under this provision</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 2 → Parliament only</span><span> </span></p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which Constitutional Article established the office of Special Officer for Linguistic Minorities?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 348-A</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 350-B</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 315-B</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 338-A</span><span> </span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Constitutional Provision for Linguistic Minorities</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Article 350-B</span><span> </span><span style=\"font-family:Arial\">establishes the office of</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Special Officer for Linguistic Minorities</span><span> </span><span style=\"font-family:Arial\">.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Key Facts:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Appointed by the President of India</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Investigates matters relating to safeguards for linguistic minorities</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Reports directly to the President</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Part XVII of Constitution deals with Official Language (Articles 343-351).</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 350-B specifically provides for this Special Officer.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 2 → Article 350-B</span><span> </span></p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 350B of the Indian Constitution provides for the appointment of which of the following?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Special Officer for Other Backward Classes</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Special Officer for Linguistic Minorities</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Special Officer for Women and Children</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Special Officer for Scheduled Castes</span><span> </span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Article 350B - Special Officer for Linguistic Minorities</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Constitutional Provision:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 350B mandates appointment of a Special Officer</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">for linguistic minorities by the President of India.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Key Functions:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Investigate safeguards for linguistic minorities</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Report to President on implementation of safeguards</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Present reports before Parliament</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Note: Article 338 → SC/ST Commissioner</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 340 → Backward Classes Commission</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 2 → Special Officer for Linguistic Minorities</span><span> </span></p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">According to the Constitution of India, which constitutional body advises the President on the principles governing grants-in-aid to States from the Consolidated Fund of India?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Comptroller and Auditor General of India</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Planning Commission</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Finance Commission</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">NITI Aayog</span><span> </span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Constitutional Body for Grants-in-Aid</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Article 280:</span><span> </span><span style=\"font-family:Arial\">Finance Commission is constituted every 5 years.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Key Functions of Finance Commission:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">1. Distribution of tax revenues between Centre and States</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">2.</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Principles for grants-in-aid to States from Consolidated Fund</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">3. Measures to augment State Consolidated Funds</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">CAG audits accounts, Planning Commission (now NITI Aayog) is policy body.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 3 → Finance Commission</span><span> </span></p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">As per Indian Constitution the Election Commission of India is a _____________.</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Non-Constitutional body</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Statutory body</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Constitutional body</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Quasi-judicial body only</span><span> </span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Election Commission of India (ECI)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Established under</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Article 324</span><span> </span><span style=\"font-family:Arial\">of the Indian Constitution.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">It is a</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Constitutional body</span><span> </span><span style=\"font-family:Arial\">, not created by any Act of Parliament.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Functions: Conducts free and fair elections for Parliament, State Legislatures, and offices of President and Vice-President.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Also has</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">quasi-judicial powers</span><span> </span><span style=\"font-family:Arial\">for election disputes.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 3 → Constitutional body</span><span> </span></p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which Article of the Indian Constitution empowers the Parliament to make grants to the States which are in need of financial assistance?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 255</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 265</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 275</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 285</span><span> </span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Topic: Financial Relations between Union and States</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Article 275</span><span> </span><span style=\"font-family:Arial\">deals with grants-in-aid from the Union to States.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Parliament can make grants to states needing financial assistance.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">These grants are charged on the Consolidated Fund of India.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Finance Commission recommends such grants to states in need.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 3 → Article 275</span><span> </span></p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which Constitutional Article provides for establishment of Finance Commission of India every five years Constitutionally?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 280</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 299</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 291</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 270</span><span> </span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Topic:</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Finance Commission of India</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Article 280</span><span> </span><span style=\"font-family:Arial\">of the Indian Constitution provides for the establishment of a Finance Commission.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">The President constitutes the Finance Commission</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">every five years</span><span> </span><span style=\"font-family:Arial\">or earlier if needed.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">It recommends distribution of tax revenues between Centre and States.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 1 → Article 280</span><span> </span></p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">What is a unitary feature of the Constitution of India?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Dual government</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Supremacy of the Constitution</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Bicameral legislature</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Integrated judiciary</span><span> </span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Topic: Unitary vs Federal Features</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Unitary Features</span><span> </span><span style=\"font-family:Arial\">→ Strong central government, single judiciary, single citizenship, All-India Services</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Federal Features</span><span> </span><span style=\"font-family:Arial\">→ Dual government, supremacy of Constitution, bicameral legislature</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Integrated Judiciary</span><span> </span><span style=\"font-family:Arial\">→ Single unified judicial system for Union and States</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Supreme Court at top, High Courts and subordinate courts below</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">This is a</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">unitary feature</span><span> </span><span style=\"font-family:Arial\">(unlike USA which has separate federal and state courts)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 4 → Integrated judiciary</span><span> </span></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which of the following features of the Constitution of India is NOT borrowed from the United Kingdom?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Bicameral Parliament</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Speaker of Lok Sabha</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Single citizenship</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Appointment of state governors by the Centre</span><span> </span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Constitutional Borrowings from UK:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">1.</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Bicameral Parliament</span><span> </span><span style=\"font-family:Arial\">→ Borrowed from UK (Lords + Commons)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">2.</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Speaker of Lok Sabha</span><span> </span><span style=\"font-family:Arial\">→ Borrowed from UK (Speaker of Commons)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">3.</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Single Citizenship</span><span> </span><span style=\"font-family:Arial\">→ Borrowed from UK</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Appointment of State Governors:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Governors appointed by President (Centre) is an</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Indian feature</span><span> </span><span style=\"font-family:Arial\">.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">UK has no such provision as it's a unitary system.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">This reflects India's federal structure with central oversight.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 4 → Appointment of state governors by the Centre</span><span> </span></p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 371A of the Constitution of India states 'privilege of special status was also accorded to the North-Eastern State of Nagaland'. This represents which federalism?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Asymmetric federalism</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Competitive federalism</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Centralised federalism</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Bargaining federalism</span><span> </span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Topic: Types of Federalism in India</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Article 371A</span><span> </span><span style=\"font-family:Arial\">grants special provisions to Nagaland regarding:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">- Religious/social practices</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">- Customary law and procedure</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">- Ownership and transfer of land</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">- Parliament laws require state assembly approval</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Asymmetric Federalism:</span><span> </span><span style=\"font-family:Arial\">Different states have different powers and autonomy levels.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Examples: Art 370 (J&amp;K - now abrogated), Art 371A-371J (NE states)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">This unequal distribution of powers = Asymmetric federalism</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 1 → Asymmetric federalism</span><span> </span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">As of November 2025, Article 1 of the Indian Constitution classifies Indian territory into how many distinct categories under Constitutional provisions?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Four</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Two</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Three</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Five</span><span> </span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Topic: Indian Constitution - Article 1</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Article 1: Name and Territory of the Union</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Article 1 classifies Indian territory into</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">three categories</span><span> </span><span style=\"font-family:Arial\">:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">1.</span><span> </span><span style=\"font-family:Arial\">The States</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">2.</span><span> </span><span style=\"font-family:Arial\">The Union Territories</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">3.</span><span> </span><span style=\"font-family:Arial\">Territories that may be acquired</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">This classification defines the territorial jurisdiction of India.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 3 → Three</span><span> </span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><br><span style=\"font-family:Arial\">Identify the classical language(s) in India (as of December 2022) from among the following.1) Marathi2) Tamil3) Sanskrit4) Odia</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Only 1 and 2</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Only 2</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Only 2, 3 and 4</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Only 1, 2, 3</span><span> </span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Classical Languages in India (as of December 2022):</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Six languages have been granted classical status:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">1.</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Tamil</span><span> </span><span style=\"font-family:Arial\">(2004) - First classical language</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">2.</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Sanskrit</span><span> </span><span style=\"font-family:Arial\">(2005)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">3.</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Telugu</span><span> </span><span style=\"font-family:Arial\">(2008)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">4.</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Kannada</span><span> </span><span style=\"font-family:Arial\">(2008)</span><span> </span></p><p style=\"margin-top:
