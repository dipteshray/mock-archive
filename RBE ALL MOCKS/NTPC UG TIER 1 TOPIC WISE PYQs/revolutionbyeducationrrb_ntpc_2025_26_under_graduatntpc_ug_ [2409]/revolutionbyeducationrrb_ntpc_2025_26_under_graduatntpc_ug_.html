<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>21.) Medieval History UG - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;
  }

 soldiers with physical descriptions to prevent fake enrollments.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Purpose: To eliminate corruption in the army and ensure a strong, efficient military force.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">These reforms made his army one of the most disciplined in medieval India.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 1 → Alauddin Khalji</span><span> </span></p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><br><span style=\"font-family:Arial\">Consider the following statements regarding the provincial administration in the Mughal period and select the correct option. Statement I: The subedar was head of the province and responsible for the maintenance of general law and order. Statement II: The head of the revenue department in the suba was Diwan.</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Both statements I and II are correct.</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Statement I is correct, while statement II is incorrect.</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Both statements I and II are incorrect.</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Statement I is incorrect, while statement II is correct.</span><span> </span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Mughal Provincial Administration</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Statement I Analysis:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Subedar (also called Sipah Salar or Nazim) was the head of the province (suba).</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Responsible for maintaining law and order, military affairs, and general administration.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Statement I is</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">correct</span><span> </span><span style=\"font-family:Arial\">.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Statement II Analysis:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Diwan was the head of the revenue department in the suba.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Responsible for revenue collection, assessment, and financial matters.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Statement II is</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">correct</span><span> </span><span style=\"font-family:Arial\">.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 1 → Both statements I and II are correct.</span><span> </span></p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Akbar’s revenue minister Todar Mal introduced an efficient revenue system based on crop yields, land surveys, and prices called:</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Ryotwari system</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Mansabdari system</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Jagirdari system</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Zabti system</span><span> </span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Todar Mal's Revenue System</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Raja Todar Mal was Akbar's revenue minister (Diwan-i-Ashraf).</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Zabti System (Bandobast System):</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Based on land measurement and classification</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Assessed crop yields over 10 years to fix revenue</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Considered land productivity and market prices</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Revenue paid in cash directly to state</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Other systems:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Ryotwari - British system (direct peasant settlement)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Mansabdari - Mughal military-administrative rank system</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Jagirdari - Land grant system for nobles</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 4 → Zabti system</span><span> </span></p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">The Battle of Chausa, fought on 26 June 1539, was a military engagement between:</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Akbar and Hemu</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Humayun and Sher Shah Suri</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Aurangzeb and Dara Shikoh</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Babur and Ibrahim Lodi</span><span> </span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Battle of Chausa (26 June 1539)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Fought between</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Humayun</span><span> </span><span style=\"font-family:Arial\">(Mughal Emperor) and</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Sher Shah Suri</span><span> </span><span style=\"font-family:Arial\">(Afghan ruler).</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Sher Shah Suri decisively defeated Humayun near Chausa (Bihar).</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">This defeat forced Humayun to flee from India temporarily.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 2 → Humayun and Sher Shah Suri</span><span> </span></p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which Mughal ruler is credited with introducing the Zabti revenue system across major parts of empire?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Akbar</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Humayun</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Babar</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Aurangzeb</span><span> </span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Zabti Revenue System</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Introduced by:</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Akbar (1556-1605)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Key Features:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Land measurement and classification system</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Revenue fixed based on average produce of 10 years</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Implemented by</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Raja Todar Mal</span><span> </span><span style=\"font-family:Arial\">(Revenue Minister)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Also called</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Dahsala System</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Coverage: Major parts of Mughal empire including Delhi, Agra, Allahabad, Awadh, Gujarat, Bihar, Bengal</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 1 → Akbar</span><span> </span></p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which Mughal emperor strengthened imperial authority by introducing the Mansabdari system and a centralized bureaucracy?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Akbar</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Muhammad Shah</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Humayun</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Shah Jahan</span><span> </span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Mansabdari System &amp; Centralized Bureaucracy</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">The</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Mansabdari system</span><span> </span><span style=\"font-family:Arial\">was introduced by</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Akbar</span><span> </span><span style=\"font-family:Arial\">(1556-1605).</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Key Features:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Military-administrative ranking system (Zat &amp; Sawar ranks)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Nobles appointed based on merit, not heredity</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Centralized control over military and civil administration</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">This system strengthened imperial authority and created</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">an efficient bureaucratic structure in the Mughal Empire.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 1 → Akbar</span><span> </span></p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Dharmapala, the Pala ruler, is credited with founding which of the following famous universities near Bhagalpur in Bihar?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Vallabhi University</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Odantapuri University</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Nalanda University</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt pt;font-size:11pt\"><span style=\"font-family:Arial\">Fought between Maratha Empire and Ahmad Shah Abdali (Afghan King).</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Maratha forces led by Sadashivrao Bhau were defeated.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">One of the largest and bloodiest battles of 18th century.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Marked decline of Maratha expansion in North India.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 2 → Third Battle of Panipat</span><span> </span></p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Jnanadeva’s renowned work Bhavarthadipika (Jnaneshwari) serves as an elaborate commentary on which of the following scriptures?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Vishnu Purana</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Bhagavad Gita</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Upanishads</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"marg ></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Garrison towns</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Token currency</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Land revenue reforms</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Prohibition of wine</span><span> </span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Muhammad bin Tughlaq's Economic Reforms</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Problem: Severe shortage of silver in the treasury</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Solution: Introduction of</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Token Currency (1329-30)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">- Issued bronze/copper coins with same value as silver tankas</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">- First attempt at token currency in 4 → 1236–1240</span><span> </span></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which dynasty of the Delhi Sultanate is known for introducing the “Iqta system”?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Sayyid dynasty</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Mamluk dynasty</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Khilji dynasty</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Tughlaq dynasty</span><span> </span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Topic: Delhi Sultanate - Administrative System</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Iqta System:</span><span> </span><span style=\"font-family:Arial\">Land revenue assignment system introduced in India.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Introduced by:</span><span> </span><span style=\"font-family:Arial\">Qutb-ud-din Aibak and systematized by Iltutmish of the</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Mamluk (Slave) Dynasty</span><span> </span><span style=\"font-family:Arial\">(1206-1290).</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">The system assigned land revenues to military officers (Muqtis) in lieu of salary.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Later dynasties continued and modified this system.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 2 → Mamluk dynasty</span><span> </span></p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Who was the great general responsible for executing Alauddin Khilji’s Deccan campaigns successfully?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Ghiyasuddin Tughlaq</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Malik Kafur</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Balban</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Qutbuddin Aibak</span><span> </span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Alauddin Khilji's Deccan Campaigns (1296-1316)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Malik Kafur</span><span> </span><span style=\"font-family:Arial\">was Alauddin Khilji's most trusted general.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">He led successful campaigns in South India:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Conquered Devagiri (1307)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Defeated Warangal (1310)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Captured Dwarasamudra and Madurai (1311)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Brought immense wealth and the famous Kohinoor diamond.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 2 → Malik Kafur</span><span> </span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">In 1309 CE, Malik Kafur invaded which of the following kingdoms in South India?</span><span> </span></p>", "option1": "<p  </span><span style=\"font-family:Arial;font-weight:bold\">Kakatiya Kingdom</span><span> </span><span style=\"font-family:Arial\">(Warangal)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">1310 CE → Invaded</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Hoysala Kingdom</span><span> </span><span style=\"font-family:Arial\">(Dwarasamudra)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">1311 CE → Invaded</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Pandya Kingdom</span><span> </span><span style=\"font-family:Arial\">(Madurai)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">In 1309 CE, he attacked Warangal, capital of Kakatiyas.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Ruler: Prataparudra II surrendered and paid tribute.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 2 → Kakatiya Kingdom</span><span> </span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">A Sultan of Delhi attempted to strengthen control over the Deccan by shifting his capital from Delhi to Deogir (Daulatabad), a decision that later proved controversial due to administrative difficulties. Who took this measure?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Muhammad bin Tughlaq</span><span> </span></p>", "option2": " <p style=\"margin-top: rative chaos, and public hardship.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Forced entire Delhi population to migrate, causing severe difficulties.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Later abandoned and capital returned to Delhi.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 1 → Muhammad bin Tughlaq</span><span> </span></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Khut, Muqaddam and Patwari during the Delhi Sultanate were _________.</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">royal court functionaries</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">provincial functionaries</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">town functionaries</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">village functionaries</span><span> </span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><sp uler) came after Sikandar Lodi in 1517.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 3 → Sikandar Lodi</span><span> </span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which of the following was a major military reason behind the construction of Siri Fort?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">To house Buddhist monasteries</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">To protect Delhi from Mongol attacks</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">To serve as a trading hub for the Songara Rajputs</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">To celebrate Khilji's victory over the Cholas</span><span> </span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Siri Fort - Historical Context</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family: -family:Arial\">The Bahmani kingdom stretched from Mandu in north to which southern boundary?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Tiruchirapalli</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Raichur</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Madurai</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Mysore</span><span> </span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Bahmani Kingdom (1347-1527)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Northern Boundary:</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Mandu</span><span> </span><span style=\"font-family:Arial\">(Malwa region)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Southern Boundary:</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Raichur</span><span> </span><span style=\"font-family:Arial\">(Doab region)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family: adweep</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">His son Rajendra I continued naval expansion to Southeast Asia.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 2 → Rajaraja I</span><span> </span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which among the following kings from the early medieval period assumed the title \"Gangaikonda\"?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Pulakesin II</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Rajendra I</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Rajaraja I</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Vijayalaya</span><span> </span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Topic: Chola Dynasty - Medieval India</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Gangaikonda</span><span> </span><span style=\"font-family:Arial\">means 'conqueror of the Ganga'.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Rajendra I</span><span> </span><span style=\"font-family:Arial\">(1014-1044 CE) was the son of Rajaraja I.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">He led a successful military expedition to North India,</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">reaching the banks of the Ganga river.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">To commemorate this victory, he assumed the title</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">'Gangaikonda Chola'</span><span> </span><span style=\"font-family:Arial\">and built a new capital</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">called</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Gangaikondacholapuram</span><span> </span><span style=\"font-family:Arial\">.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 2 → Rajendra I</span><span> </span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">The Cholas came to power after overthrowing the authority of which of the following dynasties in South India?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Chera</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Satavahana</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Pallavas</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Rashtrakuta</span><span> </span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Topic: Rise of Chola Dynasty</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">The</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Cholas</span><span> </span><span style=\"font-family:Arial\">rose to power in the 9th century CE by overthrowing the</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Pallava dynasty</span><span> </span><span style=\"font-family:Arial\">.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Key Facts:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Vijayalaya Chola (848-871 CE) defeated the Pallavas and established Chola supremacy.</span><span> </span></p><p sty
