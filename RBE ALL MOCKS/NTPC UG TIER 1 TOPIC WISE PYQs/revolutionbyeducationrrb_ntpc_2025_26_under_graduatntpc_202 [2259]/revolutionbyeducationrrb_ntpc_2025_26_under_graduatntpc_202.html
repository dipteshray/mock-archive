<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>7.) Art & Culture - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;
  }

tyle=\"font-family:Arial\">Bodo is spoken in Assam, added to 8th Schedule in 2003.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 4 → Bodo</span><span> </span></p>", "question_heading": ""}, {"sr_no": 2, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Who among the following established the famous Nrityagram institution in Bengaluru?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Surupa Sen</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Bijayini Satpathy</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Pavithra Reddy</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Protima Gauri</span><span> </span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Topic: Nrityagram — Famous Dance Village near Bengaluru</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Founded by: Protima Gauri (also known as Protima Bedi)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Year: 1990</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Location: Near Hesaraghatta , about 30 km from Bengaluru, Karnataka.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Key Facts:</span><span> </span></p><p style e=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">The introductory essay to Sarojini Naidu's 1905 poetry collection</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">'The Golden Threshold' was written by ARTHUR SYMONS (British poet and critic).</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Key Facts:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Arthur Symons championed Symbolist poetry; he recognised Naidu's talent.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Edmund Gosse also mentored Naidu but did NOT write the introduction.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• W.B. Yeats had connections with Indian literature but not this collection.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Rabindranath Tagore — Indian poet; not connected to this introduction.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 2 → Arthur Symons</span><span> </span></p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Who among the following is known for his collaboration with international artists and is/was a renowned tabla maestro?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Zakir Hussain</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Sajjad Hussain</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Hari Prasad Chaurasia</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">EM Subramaniam</span><span> </span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Ustad Zakir Hussain (1951–2024) was the world's most renowned tabla maestro.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">He was celebrated for extensive collaboration with international artists.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Key Facts:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Son of the legendary Ustad Alla Rakha ( tabla maestro).</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Collaborated with Ravi Shankar, John McLaughlin (Shakti band), Mickey Hart.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Founded Moment Records; recipient of Padma Shri, Padma Bhushan, Padma Vibhushan.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Grammy Award winner; known globally as the 'Ambassador of Indian Classical Music'.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Why NOT others:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Hariprasad Chaurasia → legendary bansuri (flute) player.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Sajjad Hussain → different musician.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 1 → Zakir Hussain</span><span> </span></p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which North Indian fair, held every 12 years, is a major Hindu pilgrimage event at Prayagraj?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Pushkar Mela</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Surajkund Mela</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Kumbh Mela</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Hemis Festival</span><span> </span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Kumbh Mela</span><span> </span><span style=\"font-family:Arial\">is held every 12 years at Prayagraj (Allahabad).</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">It is the largest religious gathering in the world.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Held at four locations: Prayagraj, Haridwar, Ujjain, Nashik.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Other options: Pushkar (Rajasthan), Surajkund (crafts fair), Hemis (Ladakh Buddhist festival).</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 3 → Kumbh Mela</span><span> </span></p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Who among the following is famous for composing kritis known for their contemplative nature and emphasis on capturing the essence of the raga through a slow, richly ornamented style?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Kum arswami Kutti</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Ramanuja Srinivasani</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Mutthuswami Dikshitar</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Thyagaraja Iyengar</span><span> </span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Mutthuswami Dikshitar (1775-1835)</span><span> </span><span style=\"font-family:Arial\">was one of the Trinity of Carnatic music.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">His kritis are known for:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Contemplative and meditative nature</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Slow tempo (vilambita kala)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Rich ornamentation and gamakas</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Emphasis on capturing raga essence</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Sanskrit lyrics with devotional depth</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">He composed around 500 kritis in praise of various deities.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 3 → Mutthuswami Dikshitar</span><span> </span></p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Match the following Folk Songs with their Origin States.</span><span> </span><br><span style=\"font-family:Arial\">Folk Song Origin State</span><span> </span><br><span style=\"font-family:Arial\">1. Panihari</span><span style=\"font-family:Arial\">                       </span><span style=\"font-family:Arial\">a. West Bengal</span><span> </span><br><span style=\"font-family:Arial\">2. Khongjom Parba</span><span style=\"font-family:Arial\">         </span><span style=\"font-family:Arial\">b. Rajasthan</span><span> </span><br><span style=\"font-family:Arial\">3. Wanawan</span><span style=\"font-family:Arial\">                    </span><span style=\"font-family:Arial\">c. Jammu and Kashmir</span><span> </span><br><span style=\"font-family:Arial\">4. Baul</span><span style=\"font-family:Arial\">                             </span><span style=\"font-family:Arial\">d. Manipur</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">1-a, 2-d, 3-b, 4-c</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">1-b, 2-d, 3-c, 4-a</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">1-c, 2-d, 3-b, 4-a</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">1-d, 2-a, 3-c, 4-b</span><span> </span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Folk Songs and Their Origin States:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">1. Panihari → Rajasthan (b)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Traditional folk song about women fetching water.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">2. Khongjom Parba → Manipur (d)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Ballad commemorating the 1891 Anglo-Manipur War.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">3. Wanawan → Jammu and Kashmir (c)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Traditional wedding folk song of Kashmir.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">4. Baul → West Bengal (a)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Mystical folk music tradition of Bengal.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 2 → 1-b, 2-d, 3-c, 4-a</span><span> </span></p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which aspect of Hindu religion is reflected through the Raut Nacha dance form in Chhattisgarh ?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Epics of Lord Rama</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Stories of Goddess Parvati</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Memories of Lord Krishna</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Legends of Lord Shiva</span><span> </span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Raut Nacha</span><span> </span><span style=\"font-family:Arial\">is a traditional folk dance performed by the Yadav community in Chhattisgarh.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">It depicts the life and</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">leelas (divine plays) of Lord Krishna</span><span> </span><span style=\"font-family:Arial\">, especially his childhood activities as a cowherd.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Performed during</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Dev Uthani Ekadashi</span><span> </span><span style=\"font-family:Arial\">( Prabodhini Ekadashi) festival.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Dancers dress as cowherds and enact Krishna's playful activities with sticks and colorful costumes.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 3 → Memories of Lord Krishna</span><span> </span></p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which temple's garbhagriha houses a Chaturmukha (four-faced) Vishnu image?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Lakshmana Temple, Khajuraho</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Dashavatara Temple, Deogarh</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Brihadiswara Temple, Thanjavur</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Meenakshi Temple, Madurai</span><span> </span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Lakshmana Temple, Khajuraho</span><span> </span><span style=\"font-family:Arial\">(950 CE, Chandela dynasty)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Built by King Dhanga, dedicated to Lord Vishnu</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Garbhagriha Feature:</span><span> </span><span style=\"font-family:Arial\">Houses a rare</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Chaturmukha</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">(four-faced) Vishnu image - Vaikuntha Vishnu</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">The four faces represent Vishnu's cosmic aspects</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">and his role as preserver of the universe</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 1 → Lakshmana Temple, Khajuraho</span><span> </span></p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which folk music form of Uttar Pradesh is traditionally sung during the monsoon season by women?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Bhatiali</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Maang</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Kajri</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Lavani</span><span> </span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Kajri</span><span> </span><span style=\"font-family:Arial\">is a semi-classical folk music form of Uttar Pradesh.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Traditionally sung by women during</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">monsoon season (Sawan)</span><span> </span><span style=\"font-family:Arial\">.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Celebrates the arrival of rains and expresses joy of the season.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Other options: Bhatiali (Bengal), Maang (Rajasthan), Lavani (Maharashtra).</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 3 → Kajri</span><span> </span></p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">What is the main objective of granting classical language status to certain Indian languages?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">To make them compulsory official languages</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">To reduce the use of regional languages</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">To promote research and preservation of ancient linguistic heritage</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">To replace modern languages in education</span><span> </span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Classical Language Status in India</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">The Government of India grants classical language status to languages with rich ancient heritage and independent literary tradition.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Main Objectives:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Promote research and academic studies in ancient texts</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Preserve and document linguistic heritage</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Establish centers of excellence for classical language studies</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Provide financial support for research and scholarships</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Classical Languages:</span><span> </span><span style=\"font-family:Arial\">Tamil (2004), Sanskrit (2005), Telugu (2008), Kannada (2008), Malayalam (2013), Odia (2014)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 3 → To promote research and preservation of ancient linguistic heritage</span><span> </span></p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which painting form is known for its monochromatic style using white pigment on mud walls?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Madhubani</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Pahari</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Gond</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Warli</span><span> </span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Warli Painting Characteristics:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Originated from Warli tribe of Maharashtra</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Uses</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">white pigment (rice paste)</span><span> </span><span style=\"font-family:Arial\">on mud walls</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">•</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Monochromatic style</span><span> </span><span style=\"font-family:Arial\">(white on brown/red)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Simple geometric patterns depicting daily life</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Other Options:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Madhubani - Colorful, Bihar origin</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Pahari - Miniature paintings, Himalayan region</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Gond - Colorful dots and lines, Madhya Pradesh</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 4 → Warli</span><span> </span></p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which of the following is a similarity between Hindustani and Carnatic music systems?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Rejection of Shruti concept</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Foundation on Raga and Tala</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Exclusive focus on instrumental music</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Use of identical compositions</span><span> </span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Hindustani Music:</span><span> </span><span style=\"font-family:Arial\">North Indian classical tradition</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Carnatic Music:</span><span> </span><span style=\"font-family:Arial\">South Indian classical tradition</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Common Foundation:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Both systems based on</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Raga</span><span> </span><span style=\"font-family:Arial\">(melodic framework)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Both systems based on</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Tala</span><span> </span><span style=\"font-family:Arial\">(rhythmic cycle)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Key Points:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Both accept Shruti concept (22 microtones)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Both include vocal and instrumental forms</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Compositions differ in style and structure</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 2 → Foundation on Raga and Tala</span><span> </span></p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which famous Indian classical singer was awarded the Bharat Ratna in 1998 for her contribution to Carnatic music?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Kishori Amonkar</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Aruna Sairam</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">M. S. Subbulakshmi</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Shubha Mudgal</span><span> </span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Topic: Bharat Ratna Awards - Music</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">M. S. Subbulakshmi</span><span> </span><span style=\"font-family:Arial\">was awarded Bharat Ratna in 1998.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">She was the first musician to receive India's highest civilian award.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Renowned for her exceptional contribution to</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Carnatic music</span><span> </span><span style=\"font-family:Arial\">.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Famous for renditions like Bhaja Govindam and Suprabhatam .</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 3 → M. S. Subbulakshmi</span><span> </span></p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Laman, in which a group of girls sing a stanza and a group of boys reply in the song which continues for hours, is a popular folk music of which state?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Himachal Pradesh</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Rajasthan</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Haryana</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Gujarat</span><span> </span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Topic: Folk Music of India</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Laman</span><span> </span><span style=\"font-family:Arial\">is a traditional folk music form of</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Himachal Pradesh</span><span> </span><span style=\"font-family:Arial\">.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Key Features:</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Group of girls sing a stanza</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• Group of boys reply in response</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">• This call-and-response pattern continues for hours</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">It is a popular form of entertainment in Himachal Pradesh during festivals and social gatherings.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 1 → Himachal Pradesh</span><span> </span></p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which of the following does NOT belong to the Tibeto-Burman language family?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Assamese</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Lepcha</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Bodo</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Garo</span><span> </span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Topic: Indian Language Families</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Tibeto-Burman Family:</span><span> </span><span style=\"font-family:Arial\">Part of Sino-Tibetan language group, spoken in Northeast India.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Lepcha:</span><span> </span><span style=\"font-family:Arial\">Spoken in Sikkim - Tibeto-Burman language.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Bodo:</span><span> </span><span style=\"font-family:Arial\">Spoken in Assam - Tibeto-Burman language.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Garo:</span><span> </span><span style=\"font-family:Arial\">Spoken in Meghalaya - Tibeto-Burman language.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Assamese:</span><span> </span><span style=\"font-family:Arial\">Belongs to</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Indo-Aryan family</span><span> </span><span style=\"font-family:Arial\">, NOT Tibeto-Burman.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">It is derived from Sanskrit and uses Assamese script.</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 1 → Assamese</span><span> </span></p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">In which Indian state is the Cold Desert Biosphere Reserve, added to UNESCO’s World Network in 2025, located?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Uttarakhand adjoining the Nanda Devi Biosphere Zone</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Jammu &amp; Kashmir along the upper Indus valley basin</span><span> </span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Himachal Pradesh in the Western Himalayan region</span><span> </span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Sikkim near the Kangchenjunga Biosphere landscape</span><span> </span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial;font-weight:bold\">Cold Desert Biosphere Reserve</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Location:</span><span> </span><span style=\"font-family:Arial;font-weight:bold\">Himachal Pradesh</span><span> </span><span style=\"font-family:Arial\">( Spiti and Lahaul valleys)</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Region: Western Himalayan cold desert ecosystem</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">UNESCO Recognition: Added to World Network of Biosphere Reserves in 2025</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Features: High-altitude cold desert, unique flora and fauna, snow leopard habitat</span><span> </span></p><p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Answer: Option 3 → Himachal Pradesh in the Western Himalayan region</span><span> </span></p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Which of the following online festivals featured documentaries on Indian classical dance exponents in 2020?</span><span> </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"font-family:Arial\">Nritya Mahotsav</span><span> </span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:6pt;font-size:11pt\"><span style=\"f
