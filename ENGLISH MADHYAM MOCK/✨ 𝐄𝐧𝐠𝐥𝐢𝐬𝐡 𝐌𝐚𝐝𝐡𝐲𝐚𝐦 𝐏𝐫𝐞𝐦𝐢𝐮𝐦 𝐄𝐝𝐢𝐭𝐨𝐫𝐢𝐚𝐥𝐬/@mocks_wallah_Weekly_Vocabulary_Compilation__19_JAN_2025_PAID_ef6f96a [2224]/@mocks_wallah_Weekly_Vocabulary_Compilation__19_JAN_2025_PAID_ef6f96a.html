        </div>
    </div>
    
    <script>
        // Core Variables
        const questions = [{"id": "133387", "question": "<strong>Select the best express synonym of the highlighted word</strong></p> <p>The instructions for assembling the furniture were so <strong>perplexing</strong> that it took several hours to figure them out.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Confusing", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Ridiculous", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Hasty", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Silly"], "correct_answer": 0, "solution": "<strong>A) Perplexing</strong> (adjective) – Confusing, puzzling, baffling, bewildering उलझाने वाला\n\n<strong>Synonym: Confusing</strong> (adjective) – Difficult to understand; causing confusion. भ्रामक\n\n<strong>Ridiculous</strong> (adjective) – Deserving or inviting derision or mockery; absurd, laughable. हास्यास्पद\n\n<strong>Hasty</strong> (adjective) – Done with excessive speed or urgency; hurried, rash, impulsive. जल्दबाज़ी\n\n<strong>Silly</strong> (adjective) – Lacking in good sense or judgment; foolish, ridiculous, absurd. मूर्ख"}, {"id": "133397", "question": "<strong>Select the most appropriate Antonym of the given word.</strong></p> <p>It's always <strong>prudent</strong> to save money for unforeseen emergencies, as financial security often leads to less stress.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Unalike", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Diverse", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Disparate", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Reckless"], "correct_answer": 3, "solution": "<strong>D) Prudent</strong> (adjective) – Wise, judicious, careful, cautious समझदारी भरा\n\n<strong>Antonym: Reckless</strong> (adjective) – Careless, heedless, rash, impulsive. लापरवाह\n\n<strong>Unalike</strong> (adjective) – Different from each other, dissimilar. अलग\n\n<strong>Diverse</strong> (adjective) – Showing a great deal of variety, different, varied. विविध\n\n<strong>Disparate</strong> (adjective) – Essentially different in kind, distinct, contrasting. विपरीत"}, {"id": "133388", "question": "<strong>Select the best express synonym of the highlighted word</strong></p> <p>The training program covers a <strong>gamut</strong> of skills, from communication to problem-solving techniques.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Scope", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Chronic", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Mild", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Usual"], "correct_answer": 0, "solution": "<strong>A) Gamut</strong> (noun) – Range, scope, extent, span व्यापक स्पेक्ट्रम\n\n<strong>Synonym: Scope</strong> (noun) – The range of perception or activity. विस्तार\n\n<strong>Chronic</strong> (adjective) – Long-lasting, persistent, recurring over a long time. दीर्घकालिक\n\n<strong>Mild</strong> (adjective) – Gentle, not severe or serious, moderate in effect. हल्का, असहनीय\n\n<strong>Usual</strong> (adjective) – Normal, habitual, or expected. सामान्य"}, {"id": "133398", "question": "<strong>Select the most appropriate Antonym of the given word.</strong></p> <p>The book <strong>encompasses</strong> a variety of topics, from history to modern-day politics.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Exclude", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Repress", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Accord", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Balk"], "correct_answer": 0, "solution": "<strong>A) Encompass</strong> (verb) – Include, cover, embrace, span सम्मिलित करना\n\n<strong>Antonym:</strong> <strong>Exclude</strong> (verb) – Omit, leave out, reject, prevent inclusion. बहिष्कृत करना\n\n<strong>Repress</strong> (verb) – To restrain, suppress, or hold back. दबाना\n\n<strong>Accord</strong> (verb) – To give or grant something, usually associated with respect or agreement. प्रदान करना\n\n<strong>Balk</strong> (verb) – To hesitate or refuse to proceed with an action. झिझकना"}, {"id": "133389", "question": "<strong>Select the best express synonym of the given underlined word.</strong></p> <p>Dark clouds began to <ins><strong>loom</strong> </ins>over the horizon, signaling the approach of a potential storm.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Eradicate", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Appear", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Demoralise", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Sabotage"], "correct_answer": 1, "solution": "<strong>B) Loom</strong> (verb) – Emerge, appear, threaten, hover, overhang प्रकट होना/मंडराना\n\n<strong>Synonym</strong>: <strong>Appear</strong> (verb) – To come into sight, become visible or noticeable. प्रकट होना\n\n<strong>Eradicate</strong> (verb) – Eliminate, get rid of, remove, exterminate. उन्मूलन करना\n\n<strong>Demoralise</strong> (verb) – Dishearten, discourage, dispirit, deject. निरुत्साहित करना\n\n<strong>Sabotage</strong> (verb) – Deliberately destroy, disrupt, or damage. तोड़-फोड़ करना"}, {"id": "133399", "question": "<strong>Select the most appropriate Antonym of the given underlined word.</strong></p> <p>The company's <ins><strong>inefficiency</strong> </ins>in handling projects led to significant delays and cost overruns, highlighting a need for better management practices.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Proficiency", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Bitter", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Nasty", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Aggressive"], "correct_answer": 0, "solution": "<strong>A) Inefficiency</strong> (noun) – Ineffectiveness, inadequacy, lack of productivity, wastefulness अक्षमता\n\n<strong>Antonym:</strong> <strong>Proficiency</strong> (noun) – Competence, skill, expertise, adeptness. कुशलता\n\n<strong>Bitter</strong> (adjective) – Sharp, acidic, sour, resentful. कड़वा\n\n<strong>Nasty</strong> (adjective) – Unpleasant, foul, disagreeable, mean. घिनौना/बुरा\n\n<strong>Aggressive</strong> (adjective) – Confrontational, assertive, combative, militant. आक्रामक"}, {"id": "133390", "question": "<strong>Select the best express synonym of the given underlined word.</strong></p> <p>There was a mysterious <ins><strong>aura</strong> </ins>around the old mansion that intrigued locals and tourists alike, drawing them to its eerie presence.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Tribulations", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Overt", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Atmosphere", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Braggart"], "correct_answer": 2, "solution": "<strong>C) Aura</strong> (noun) – Atmosphere, vibe, essence, energy, ambience आभा/प्रभाव\n\n<strong>Synonym: Atmosphere</strong> (noun) – The pervading tone or mood of a place, situation, or work of art. वातावरण\n\n<strong>Tribulations</strong> (noun) – Great trouble, hardship, or suffering. कष्ट, कठिनाइयाँ\n\n<strong>Overt</strong> (adjective) – Done or shown openly; not secret. खुला, प्रकट\n\n<strong>Braggart</strong> (noun) – A person who boasts about achievements or possessions. डींग मारने वाला व्यक्ति"}, {"id": "133400", "question": "<strong>Select the most appropriate Antonym of the given underlined word.</strong></p> <p>The <ins><strong>lone</strong> </ins>tree standing in the middle of the barren field became a symbol of resilience against the harsh environment.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Fluctuant", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Erratic", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Crowded", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Capricious"], "correct_answer": 2, "solution": "<strong>C) Lone</strong> (adjective) – Single, solitary, only, unique, isolated अकेला\n\n<strong>Antonym: Crowded</strong> (adjective) – Full of people, bustling, packed. भीड़भाड़ वाला\n\n<strong>Fluctuant</strong> (adjective) – Changing irregularly, unstable.अस्थिर, परिवर्तनशील।\n\n<strong>Erratic</strong> (adjective) – Unpredictable, inconsistent, wandering. अनियमित, अस्थिर।\n\n<strong>Capricious</strong> (adjective) – Given to sudden and unaccountable changes of mood or behavior; mercurial. मनमौजी, चंचल।"}, {"id": "133391", "question": "<strong>Select the best express synonym of the given underlined word.</strong></p> <p>At the sound of the fire alarm, a <ins><strong>stampede</strong> </ins>ensued as everyone rushed towards the exits.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Liability", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Feasibility", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Rush", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Extempore"], "correct_answer": 2, "solution": "<strong>C) Stampede</strong> (noun) – Rush, surge, dash, panic, tumult भगदड़\n\n<strong>Synonym</strong>: <strong>Rush</strong> (noun) – A rapid movement, a quick and sudden action, similar to stampede. तेजी से भागना\n\n<strong>Liability</strong> (noun) – A state of being responsible, obligation, accountability, responsibility. जिम्मेदारी\n\n<strong>Feasibility</strong> (noun) – Practicality, possibility, viability, workability. संभाव्यता\n\n<strong>Extempore</strong> (adjective) – Spoken or done without preparation, impromptu, spontaneous. तत्पर"}, {"id": "133401", "question": "<strong>Select the most appropriate Antonym of the given underlined word.</strong></p> <p>She decided to <ins><strong>embark</strong> </ins>on a new journey of self-discovery this year.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Conclude", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Resumption", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Quandary", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Action"], "correct_answer": 0, "solution": "<strong>A) Embark</strong> (on) (verb) – Start, initiate, begin, launch, set out आरंभ करना\n\n<strong>Antonym: Conclude</strong><strong> (verb)</strong> – Bring (something) to an end, finish, close. समाप्त करना\n\n<strong>Resumption</strong> (noun) – The action of starting something again after a pause; restart, continuation. पुनःआरंभ\n\n<strong>Quandary</strong> (noun) – A state of perplexity or uncertainty over what to do in a difficult situation. Confusion, puzzle, predicament. उलझन\n\n<strong>Action</strong> (noun) – The process of doing something; act, activity, performance. क्रिया/कार"}, {"id": "133392", "question": "<strong>Select the best express synonym of the given underlined word.</strong></p> <p>Recognizing the signs of dehydration is <ins><strong>imperative</strong> </ins>for anyone planning to hike in the desert.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Enslaved", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Essential", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Unintentional", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Peevish"], "correct_answer": 1, "solution": "<strong>B) Imperative</strong> (noun) – Necessity, requirement, priority, obligation, essential आवश्यकता\n\n<strong>Synonym</strong>: <strong>Essential</strong> (noun) – Absolutely necessary; extremely important, similar to imperative. आवश्यक\n\n<strong>Enslaved</strong> (adjective) – Made into or treated as a slave, subjected, subjugated, oppressed. गुलाम बनाना\n\n<strong>Unintentional</strong> (adjective) – Not done on purpose, accidental, unpremeditated. अनजाने में\n\n<strong>Peevish</strong> (adjective) – Easily irritated, especially by unimportant things, fractious, irritable. चिड़चिड़ा"}, {"id": "133402", "question": "<strong>Select the most appropriate Antonym of the given underlined word.</strong></p> <p>Despite his <ins><strong>feeble</strong> </ins>attempts to open the jar, he had to ask someone stronger for help.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Immediate", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Strong", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Current", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Quick"], "correct_answer": 1, "solution": "<strong>B) Feeble</strong> (adjective) – Weak, frail, delicate, powerless कमज़ोर\n\n<strong>Antonym: Strong</strong> (adjective) – Having the power to move heavy weights or perform other physically demanding tasks. मजबूत\n\n<strong>Immediate</strong> (adjective) – Occurring or done at once, instant, prompt, quick. तुरंत\n\n<strong>Current</strong> (adjective) – Belonging to the present time, contemporary, existing, ongoing. वर्तमान\n\n<strong>Quick</strong> (adjective) – Done with promptness or speed, rapid, fast, speedy. तेज"}, {"id": "133393", "question": "<strong>Select the best express synonym of the given underlined word.</strong></p> <p>The doctor warned him that his <ins><strong>sedentary</strong> </ins>lifestyle was detrimental to his health and advised more physical activity.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Inactive", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Implacable", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Furious", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Pungent"], "correct_answer": 0, "solution": "<strong>A) Sedentary</strong> (adjective) – Inactive, desk-bound, stationary, sitting-based गतिहीन\n\n<strong>Synonym: Inactive</strong> (adjective) – Not engaging in or involving much physical activity. निष्क्रिय\n\n<strong>Implacable</strong> (adjective) – Relentless; unstoppable, not able to be placated or appeased. कठोर\n\n<strong>Furious</strong> (adjective) – Extremely angry, raging, wild.उग्र\n\n<strong>Pungent</strong> (adjective) – Having a sharply strong taste or smell, biting, spicy. तीखा"}, {"id": "133403", "question": "<strong>Select the most appropriate Antonym of the given word.</strong></p> <p>The young artist's <strong>vitality</strong> and creativity were evident in the vibrant colors of his paintings.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Candid", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Dishonest", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Exhaustion", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Irrelevant"], "correct_answer": 2, "solution": "<strong>C) Vitality</strong> (noun) – Energy, liveliness, vigor, dynamism जीवंतता\n\n<strong>Antonym:</strong> <strong>Exhaustion (noun)</strong> – A state of extreme physical or mental fatigue. थकावट\n\n<strong>Candid</strong> (adjective) – Truthful, straightforward, frank, honest. ईमानदार\n\n<strong>Dishonest</strong> (adjective) – Not truthful, deceptive, misleading. बेईमान\n\n<strong>Irrelevant</strong> (adjective) – Not connected or related to something, beside the point. असंगत"}, {"id": "133394", "question": "<strong>Select the best express synonym of the highlighted word</strong></p> <p>He loves to <strong>immerse</strong> himself in books, losing track of time while diving into captivating stories.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Annoyance", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Absorb", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Dogmatic", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Serenity"], "correct_answer": 1, "solution": "<strong>B) Immerse</strong> (in) (verb) – Submerge, absorb, engross, involve शामिल होना\n\n<strong>Synonym</strong>: <strong>Absorb</strong> (verb) – To fully take in or involve oneself in something. डूबना\n\n<strong>Annoyance</strong> (noun) – A feeling of irritation or displeasure, being bothered by something. नाराज़गी, झुंझलाहट।\n\n<strong>Dogmatic</strong> (adjective) – Inclined to lay down principles as undeniably true, stubborn, inflexible, rigid. कट्टर\n\n<strong>Serenity</strong> (noun) – The state of being calm, peaceful, and untroubled. शांत, शांति।"}, {"id": "133404", "question": "<strong>Select the most appropriate Antonym of the given word.</strong></p> <p>The history book depicted the <strong>barbarity</strong> of the ancient wars with chilling accuracy.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Hidden", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Evaluate", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Reconcile", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Kindness"], "correct_answer": 3, "solution": "<strong>D) Barbarity</strong> (noun) – Brutality, savagery, inhumanity, cruelty क्रूरता\n\n<strong>Antonym</strong>: <strong>Kindness</strong> (noun) – The quality of being friendly, generous, and considerate. दयालुता\n\n<strong>Hidden</strong> (adjective) – Concealed, not visible, secret. छुपा हुआ\n\n<strong>Evaluate</strong> (verb) – Assess, judge, measure, examine. मूल्यांकन करना\n\n<strong>Reconcile</strong> (verb) – Restore friendly relations, harmonize, settle. सुलह करना"}, {"id": "133395", "question": "<strong>Select the best express synonym of the highlighted word</strong></p> <p>She is very <strong>keen</strong> on learning new languages and cultures.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Enthusiastic", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Cascade", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Grotesque", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Waterfall"], "correct_answer": 0, "solution": "<strong>A) Keen</strong> (on) (adjective) – Enthusiastic about, eager for, interested in, desirous of इच्छुक\n\n<strong>Synonym</strong><strong>: </strong><strong>Enthusiastic</strong><strong> (about)</strong><strong> </strong>(adjective) – Having or showing intense and eager enjoyment, interest, or approval. उत्साही\n\n<strong>Cascade</strong> (noun) – A small waterfall, especially one of several that fall in stages down a steep rocky slope. जलप्रपात\n\n<strong>Grotesque</strong> (adjective) – Odd or unnatural in shape, appearance, or character; bizarre, distorted. विचित्र\n\n<strong>Waterfall</strong> (noun) – A flow of water falling from a height, a cascade. झरना"}, {"id": "133405", "question": "<strong>Select the most appropriate Antonym of the given underlined word.</strong></p> <p>The job market in the region had become <ins><strong>stagnant</strong></ins>, with few opportunities for advancement and innovation.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Dynamic", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Revolutionary", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Mean", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Moderate"], "correct_answer": 0, "solution": "<strong>A) Stagnant</strong> (adjective) – Not growing, static, unchanged, motionless स्थिर/रुका हुआ\n\n<strong>Antonym:</strong> <strong>Dynamic</strong> (adjective) – Active, vibrant, energetic, forceful. गतिशील\n\n<strong>Revolutionary</strong> (adjective) – Relating to or causing a dramatic change, groundbreaking, radical. क्रांतिकारी\n\n<strong>Mean</strong> (adjective) – Lacking in generosity or fairness, petty, small-minded, unkind. तुच्छ\n\n<strong>Moderate</strong> (adjective) – Average in amount, intensity, or quality; not extreme, temperate, reasonable. संयमी"}, {"id": "133396", "question": "<strong>Select the best express synonym of the highlighted word</strong></p> <p>The <strong>pursuit</strong> of knowledge and personal growth is a lifelong journey worth undertaking.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Diplomatic", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Quest", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Conservative", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Concerned"], "correct_answer": 1, "solution": "<strong>B) Pursuit</strong> (noun) – Endeavor, quest, striving, chase लक्ष्य या खोज\n\n<strong>Synonym</strong>: <strong>Quest</strong> (noun) – A long or arduous search for something. खोज\n\n<strong>Diplomatic</strong> (adjective) – Skilled in managing negotiations or people without causing bad feelings, tactful, sensitive. कूटनीतिक\n\n<strong>Conservative</strong> (adjective) – Holding to traditional attitudes and values, cautious about change. रूढ़िवादी\n\n<strong>Concerned</strong> (adjective) – Worried, anxious, troubled. चिंतित"}, {"id": "133406", "question": "<strong>Select the most appropriate Antonym of the given word.</strong></p> <p>The region fought hard to gain <strong>autonomy</strong> and manage its affairs without external interference.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Acceptance", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Patience", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Dependence", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Elegance"], "correct_answer": 2, "solution": "<strong>C) Autonomy</strong> (noun) – Independence, self-governance, freedom, self-determination स्वायत्तता\n\n<strong>Antonym: Dependence</strong> (noun) – The state of relying on or being controlled by someone or something else. निर्भरता\n\n<strong>Acceptance</strong> (noun) – The action of consenting to receive or undertake something offered. स्वीकार्यता\n\n<strong>Patience</strong> (noun) – The capacity to accept or tolerate delay, trouble, or suffering without getting angry or upset. धैर्य\n\n<strong>Elegance</strong> (noun) – The quality of being graceful and stylish in appearance or manner. सुंदरता"}];
        const examConfig = {
            id: '6633',
            duration: 20,
            positiveMarks: 1.0,
            negativeMarks: 0.25
        };
        
        let currentQuestionIndex = 0;
        let userAnswers = {};
        let flaggedQuestions = new Set();
        let timeLeft = examConfig.duration * 60;
        let timerInterval;
        let isTestFinished = false;
        let solutionMode = false;
        let touchStartX = 0;
        let touchStartY = 0;
        
        // Initialize app
        function initializeApp() {
            createParticles();
            generateQuestionsGrid();
            loadQuestion();
            startTimer();
            setupTouchGestures();
            setupAutoSave();
            
            // Prevent accidental page leave
            window.addEventListener('beforeunload', (e) => {
                if (!isTestFinished) {
                    e.preventDefault();
                    e.returnValue = 'Test in progress. Are you sure you want to leave?';
                }
            });
        }
        
        // Create floating particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = window.innerWidth < 768 ? 20 : 40;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 3 + 3) + 's';
                particlesContainer.appendChild(particle);
            }
        }
        
        // Load current question
        function loadQuestion() {
            const question = questions[currentQuestionIndex];
            
            // Update question info
            document.getElementById('questionNumber').textContent = `Q${currentQuestionIndex + 1}`;
            document.getElementById('questionProgress').textContent = 
                `${currentQuestionIndex + 1} of ${questions.length}`;
            document.getElementById('questionText').innerHTML = question.question;
            
            // Load options
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            
            question.options.forEach((option, index) => {
                const optionElement = document.createElement('div');
                optionElement.className = 'option';
                optionElement.innerHTML = option;
                
                const indicator = document.createElement('div');
                indicator.className = 'option-indicator';
                optionElement.appendChild(indicator);
                
                if (solutionMode) {
                    // Show solution mode styling
                    if (index === question.correct_answer) {
                        optionElement.classList.add('correct');
                        indicator.textContent = '✓';
                    } else if (userAnswers[currentQuestionIndex] === index) {
                        optionElement.classList.add('incorrect');
                        indicator.textContent = '✗';
                    } else {
                        optionElement.classList.add('disabled');
                    }
                    optionElement.style.pointerEvents = 'none';
                } else {
                    // Normal mode
                    if (userAnswers[currentQuestionIndex] === index) {
                        optionElement.classList.add('selected');
                        indicator.textContent = '✓';
                    }
                    
                    optionElement.onclick = () => selectOption(index);
                    optionElement.onkeydown = (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            selectOption(index);
                        }
                    };
                    optionElement.tabIndex = 0;
                }
                
                optionsContainer.appendChild(optionElement);
            });
            
            // Handle solution panel
            const solutionPanel = document.getElementById('solutionPanel');
            if (solutionMode && question.solution) {
                document.getElementById('solutionContent').innerHTML = question.solution;
                solutionPanel.classList.add('show');
            } else {
                solutionPanel.classList.remove('show');
            }
            
            // Update navigation
            updateNavigation();
            updateQuestionsGrid();
            updateFlagButton();
            
            // Add entrance animation
            const container = document.getElementById('questionContainer');
            container.style.transform = 'translateY(20px)';
            container.style.opacity = '0';
            setTimeout(() => {
                container.style.transform = 'translateY(0)';
                container.style.opacity = '1';
            }, 100);
        }
        
        // Select an option
        function selectOption(index) {
            if (solutionMode) return;
            
            const currentAnswer = userAnswers[currentQuestionIndex];
            
            if (currentAnswer === index) {
                // Deselect if clicking the same option
                delete userAnswers[currentQuestionIndex];
            } else {
                // Select new option
                userAnswers[currentQuestionIndex] = index;
            }
            
            // Update UI
            const options = document.querySelectorAll('.option');
            options.forEach((option, i) => {
                const indicator = option.querySelector('.option-indicator');
                if (userAnswers[currentQuestionIndex] === i) {
                    option.classList.add('selected');
                    indicator.textContent = '✓';
                } else {
                    option.classList.remove('selected');
                    indicator.textContent = '';
                }
            });
            
            updateQuestionsGrid();
            showAutoSave();
        }
        
        // Generate questions grid
        function generateQuestionsGrid() {
            const grid = document.getElementById('questionsGrid');
            grid.innerHTML = '';
            
            questions.forEach((_, index) => {
                const button = document.createElement('button');
                button.className = 'question-btn';
                button.textContent = index + 1;
                button.onclick = () => goToQuestion(index);
                button.setAttribute('aria-label', `Go to question ${index + 1}`);
                grid.appendChild(button);
            });
        }
        
        // Update questions grid styling
        function updateQuestionsGrid() {
            const buttons = document.querySelectorAll('.question-btn');
            buttons.forEach((button, index) => {
                button.className = 'question-btn';
                
                if (index === currentQuestionIndex) {
                    button.classList.add('current');
                } else if (solutionMode) {
                    if (userAnswers[index] === questions[index].correct_answer) {
                        button.classList.add('correct');
                    } else if (userAnswers[index] !== undefined) {
                        button.classList.add('incorrect');
                    }
                } else if (userAnswers[index] !== undefined) {
                    button.classList.add('answered');
                }
                
                if (flaggedQuestions.has(index)) {
                    button.classList.add('flagged');
                }
            });
        }
        
        // Navigation functions
        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
            }
        }
        
        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else if (!solutionMode) {
                submitTest();
            }
        }
        
        function goToQuestion(index) {
            currentQuestionIndex = index;
            loadQuestion();
            closeSidebar();
        }
        
        function updateNavigation() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            
            prevBtn.disabled = currentQuestionIndex === 0;
            
            if (solutionMode) {
                nextBtn.textContent = currentQuestionIndex === questions.length - 1 ? 
                    'Finish Review' : 'Next →';
                nextBtn.onclick = currentQuestionIndex === questions.length - 1 ? 
                    finishReview : nextQuestion;
            } else {
                nextBtn.textContent = currentQuestionIndex === questions.length - 1 ? 
                    'Submit Test' : 'Next →';
                nextBtn.onclick = currentQuestionIndex === questions.length - 1 ? 
                    submitTest : nextQuestion;
            }
        }
        
        // Timer functions
        function startTimer() {
            const timerElement = document.getElementById('timer');
            const progressCircle = document.getElementById('progressCircle');
            const circumference = 2 * Math.PI * 18;
            const totalTime = examConfig.duration * 60;
            
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    submitTest();
                    return;
                }
                
                timeLeft--;
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerElement.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                
                // Update progress circle
                const progress = (totalTime - timeLeft) / totalTime;
                const offset = circumference * progress;
                progressCircle.style.strokeDashoffset = offset;
                
                // Add warning effects
                if (timeLeft <= 300) { // 5 minutes
                    timerElement.classList.add('warning');
                }
                if (timeLeft <= 60) { // 1 minute
                    timerElement.classList.add('critical');
                }
            }, 1000);
        }
        
        // Toggle question flag
        function toggleFlag() {
            if (flaggedQuestions.has(currentQuestionIndex)) {
                flaggedQuestions.delete(currentQuestionIndex);
            } else {
                flaggedQuestions.add(currentQuestionIndex);
            }
            updateFlagButton();
            updateQuestionsGrid();
        }
        
        function updateFlagButton() {
            const flagBtn = document.getElementById('flagBtn');
            if (flaggedQuestions.has(currentQuestionIndex)) {
                flagBtn.textContent = '🏴 Unflag Question';
                flagBtn.style.background = 'rgba(239, 68, 68, 0.2)';
                flagBtn.style.color = 'var(--error)';
            } else {
                flagBtn.textContent = '🚩 Flag Question';
                flagBtn.style.background = 'rgba(245, 158, 11, 0.2)';
                flagBtn.style.color = 'var(--warning)';
            }
        }
        
        // Theme toggle
        function toggleTheme() {
            const body = document.body;
            const themeBtn = document.getElementById('themeBtn');
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            body.setAttribute('data-theme', newTheme);
            themeBtn.textContent = newTheme === 'light' ? '🌙' : '☀️';
            
            // Save preference
            localStorage.setItem('theme', newTheme);
        }
        
        // Sidebar functions
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            
            sidebar.classList.toggle('open');
            overlay.classList.toggle('show');
        }
        
        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('show');
        }
        
        // Touch gesture support
        function setupTouchGestures() {
            const main = document.querySelector('.main');
            
            main.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            });
            
            main.addEventListener('touchend', (e) => {
                const touchEndX = e.changedTouches[0].clientX;
                const touchEndY = e.changedTouches[0].clientY;
                const deltaX = touchEndX - touchStartX;
                const deltaY = touchEndY - touchStartY;
                
                // Only trigger if horizontal swipe is dominant
                if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 50) {
                    if (deltaX > 0 && currentQuestionIndex > 0) {
                        // Swipe right - previous question
                        previousQuestion();
                    } else if (deltaX < 0 && currentQuestionIndex < questions.length - 1) {
                        // Swipe left - next question
                        nextQuestion();
                    }
                }
            });
        }
        
        // Auto-save functionality
        function setupAutoSave() {
            // Save answers periodically
            setInterval(() => {
                if (!isTestFinished) {
                    saveProgress();
                }
            }, 30000); // Every 30 seconds
        }
        
        function saveProgress() {
            const progress = {
                answers: userAnswers,
                flagged: Array.from(flaggedQuestions),
                currentQuestion: currentQuestionIndex,
                timeLeft: timeLeft
            };
            
            // In a real implementation, this would save to a server
            console.log('Progress saved:', progress);
        }
        
        function showAutoSave() {
            const autoSave = document.getElementById('autoSave');
            autoSave.classList.add('show');
            setTimeout(() => {
                autoSave.classList.remove('show');
            }, 2000);
        }
        
        // Submit test
        function submitTest() {
            if (isTestFinished) return;
            
            isTestFinished = true;
            clearInterval(timerInterval);
            
            // Calculate results
            let correct = 0, wrong = 0, skipped = 0, totalMarks = 0;
            
            questions.forEach((question, index) => {
                if (userAnswers[index] === undefined) {
                    skipped++;
                } else if (userAnswers[index] === question.correct_answer) {
                    correct++;
                    totalMarks += examConfig.positiveMarks;
                } else {
                    wrong++;
                    totalMarks -= examConfig.negativeMarks;
                }
            });
            
            const maxMarks = questions.length * examConfig.positiveMarks;
            const percentage = Math.max(0, Math.round((totalMarks / maxMarks) * 100));
            
            // Show results
            document.getElementById('resultTitle').textContent = 
                `${correct}/${questions.length} Correct`;
            document.getElementById('resultSubtitle').textContent = 
                `You scored ${totalMarks} out of ${maxMarks} marks`;
            document.getElementById('correctCount').textContent = correct;
            document.getElementById('wrongCount').textContent = wrong;
            document.getElementById('skippedCount').textContent = skipped;
            document.getElementById('finalScore').textContent = `${totalMarks} Marks`;
            document.getElementById('finalPercentage').textContent = `${percentage}%`;
            
            document.getElementById('resultModal').classList.add('show');
            closeSidebar();
        }
        
        // View solutions
        function viewSolutions() {
            document.getElementById('resultModal').classList.remove('show');
            solutionMode = true;
            currentQuestionIndex = 0;
            loadQuestion();
        }
        
        // Finish review
        function finishReview() {
            solutionMode = false;
            currentQuestionIndex = 0;
            loadQuestion();
        }
        
        // Retake test
        function retakeTest() {
            if (confirm('Are you sure you want to retake the test? All progress will be lost.')) {
                location.reload();
            }
        }
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (solutionMode) return;
            
            switch(e.key) {
                case 'ArrowLeft':
                    e.preventDefault();
                    previousQuestion();
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    nextQuestion();
                    break;
                case 'f':
                case 'F':
                    if (e.ctrlKey || e.metaKey) {
                        e.preventDefault();
                        toggleFlag();
                    }
                    break;
                case 'm':
                case 'M':
                    if (e.ctrlKey || e.metaKey) {
                        e.preventDefault();
                        toggleSidebar();
                    }
                    break;
                case '1':
                case '2':
                case '3':
                case '4':
                    if (!e.ctrlKey && !e.metaKey) {
                        e.preventDefault();
                        const optionIndex = parseInt(e.key) - 1;
                        if (optionIndex < questions[currentQuestionIndex].options.length) {
                            selectOption(optionIndex);
                        }
                    }
                    break;
            }
        });
        
        // Initialize when DOM is loaded
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeApp);
        } else {
            initializeApp();
        }
        
        // Load saved theme
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            document.body.setAttribute('data-theme', savedTheme);
            document.getElementById('themeBtn').textContent = savedTheme === 'light' ? '🌙' : '☀️';
        }
    </script>
</body>
</html>
