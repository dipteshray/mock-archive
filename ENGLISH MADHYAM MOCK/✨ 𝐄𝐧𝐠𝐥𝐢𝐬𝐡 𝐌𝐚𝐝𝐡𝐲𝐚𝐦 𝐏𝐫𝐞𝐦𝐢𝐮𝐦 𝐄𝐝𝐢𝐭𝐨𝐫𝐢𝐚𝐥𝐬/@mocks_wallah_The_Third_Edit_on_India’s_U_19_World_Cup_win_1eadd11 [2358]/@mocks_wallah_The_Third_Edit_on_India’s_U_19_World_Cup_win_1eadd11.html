men’s cricket in the country</strong>?", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> It proved that India is the best cricketing nation", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> It guarantees a future senior World Cup victory", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> It highlights emerging talent and boosts women’s cricket infrastructure", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> It led to a new league for junior cricketers"], "correct_answer": 2, "solution": "No solution available"}, {"id": "135842", "question": "<strong>Comprehension:</strong><br> India’s U19 World Cup cricket triumph brings a dash of optimism to women’s cricket. By drubbing South Africa in the finals, the Indian team displayed an infectious ambition, dominating the tournament. It augurs well for the future of women’s cricket in India. Though Australia, England and New Zealand barely take juniors cricket seriously, the Indian U19 triumph will ignite hopes of a seniors trophy. It can safely be said that India has unearthed a superstar talent in Gongadi Trisha, an all-rounder and prolific batter from the World Cup.</p> <p>Trisha set the batting charts on fire, scoring the only century of the tournament and notching consistent scores, four of the highest innings from the Top 15. But cricket triumphs are always team efforts and India can be said to have located other stars like batter and compulsive boundary-hitter Kamalini, and bowlers Vaishnavi Sharma and Aayushi Shukla. Trisha, though, remains the story of the tournament. The youngster from Hyderabad was given a plastic bat at age two by her father and raised to become a formidable cricketer, skilling her to hit sixes, score mountains of runs and take crucial wickets.</p> <p>Women’s cricket in India has earned its rightful privileges — equal match fee, a cash-rich franchise league, and a broad-based, even if rudimentary, domestic set-up, where new names are cropping up who could become India’s future post Harmanpreet Kaur and Smriti Mandhana, who have carried the burden for the last few years after Mithali Raj and Jhulan Goswami. The spot belonging to Shafali Verma, part of a project of regeneration of women’s cricket, has many more contenders now like Pratika Rawal, and Trisha will begin pushing for the opening position soon. Women’s cricket is seeing aspiration meet a nurturing system. With franchise facilities and local academies mushrooming for girls, the future can only be bright. Beating Australia to a seniors crown remains the final frontier for Indian women. Trisha &amp; Co showed that that too can be done.</p> <p><strong>What can be inferred about the future of women's cricket in India based on the passage</strong>?", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> It is likely to decline as senior players retire.", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> It is expected to grow with better infrastructure and rising talents.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> It will remain stagnant due to a lack of opportunities.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> It is entirely dependent on a few star players like Smriti Mandhana."], "correct_answer": 1, "solution": "No solution available"}, {"id": "135843", "question": "<strong>Comprehension:</strong><br> India’s U19 World Cup cricket triumph brings a dash of optimism to women’s cricket. By drubbing South Africa in the finals, the Indian team displayed an infectious ambition, dominating the tournament. It augurs well for the future of women’s cricket in India. Though Australia, England and New Zealand barely take juniors cricket seriously, the Indian U19 triumph will ignite hopes of a seniors trophy. It can safely be said that India has unearthed a superstar talent in Gongadi Trisha, an all-rounder and prolific batter from the World Cup.</p> <p>Trisha set the batting charts on fire, scoring the only century of the tournament and notching consistent scores, four of the highest innings from the Top 15. But cricket triumphs are always team efforts and India can be said to have located other stars like batter and compulsive boundary-hitter Kamalini, and bowlers Vaishnavi Sharma and Aayushi Shukla. Trisha, though, remains the story of the tournament. The youngster from Hyderabad was given a plastic bat at age two by her father and raised to become a formidable cricketer, skilling her to hit sixes, score mountains of runs and take crucial wickets.</p> <p>Women’s cricket in India has earned its rightful privileges — equal match fee, a cash-rich franchise league, and a broad-based, even if rudimentary, domestic set-up, where new names are cropping up who could become India’s future post Harmanpreet Kaur and Smriti Mandhana, who have carried the burden for the last few years after Mithali Raj and Jhulan Goswami. The spot belonging to Shafali Verma, part of a project of regeneration of women’s cricket, has many more contenders now like Pratika Rawal, and Trisha will begin pushing for the opening position soon. Women’s cricket is seeing aspiration meet a nurturing system. With franchise facilities and local academies mushrooming for girls, the future can only be bright. Beating Australia to a seniors crown remains the final frontier for Indian women. Trisha &amp; Co showed that that too can be done.</p> <p><strong>Why does the passage suggest that India’s U19 triumph might impact the senior women’s team</strong>?", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Because it guarantees that the senior team will win the next World Cup.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Because the senior team has been underperforming and needs replacements.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Because South Africa will now fear playing against India.", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Because young talents like Trisha and Kamalini can strengthen the senior team in the future."], "correct_answer": 3, "solution": "No solution available"}, {"id": "135845", "question": "<strong>Complete the dialogue for Person B.</strong></p> <p>Person A: How was the book?</p> <p>Person B: I didn’t like it. The story ends ____ for the hero", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> badly", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> worse", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> bad", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Worst"], "correct_answer": 0, "solution": "A) <strong>Badly'</strong> का उपयोग होगा क्योंकि यहाँ जरूरत है एक adverb की जो कि बताए कि किस तरह से कुछ हुआ। 'Badly' सही रूप से व्यक्त करता है कि कैसे कहानी का अंत हीरो के लिए अच्छा नहीं हुआ। 'Worse' और 'Worst' comparative और superlative forms हैं, जो कि इस context में फिट नहीं बैठते क्योंकि वे quality की comparison करते हैं, न कि action का वर्णन। 'Bad' एक adjective है और यहाँ एक adverb की जरूरत है\n\n<strong>Badly'</strong> should be used because an adverb is needed here to describe how something happens. 'Badly' correctly expresses that the story does not end well for the hero. 'Worse' and 'Worst' are comparative and superlative forms, which do not fit in this context as they compare quality rather than describing an action. 'Bad' is an adjective, and an adverb is needed here"}, {"id": "135846", "question": "<strong>Sentences of a paragraph are given below. While the first sentence (1) is in correct order, the sentences that follow are jumbled up. Arrange the sentences in the correct order to form a meaningful and coherent paragraph.</strong></p> <p>1. The couple had been wanting to take some time off from their hectic work schedule.</p> <p>A. The travel agent helped the couple plan their dream vacation, taking care of all the details from flights to accommodations.</p> <p>B. The couple enjoyed their time abroad, exploring new places and trying new foods.</p> <p>C. Upon returning home, the couple looked back on their trip with fond memories and a sense of gratitude for the experience.</p> <p>D. The trip provided a much-needed break from their hectic lives, allowing them to relax and recharge.</p> <p>E. They recognised that it was important to take a break from work time to time to revitalise themselves, and therefore, decided to continue travelling in future.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> ADCBE", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> BADCE", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> CBDEA", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> ABDCE"], "correct_answer": 3, "solution": "D) <strong>ABDCE</strong>\n\nThe couple had been wanting to take some time off from their hectic work schedule The travel agent helped the couple plan their dream vacation, taking care of all the details from flights to accommodations The couple enjoyed their time abroad, exploring new places and trying new foods. The trip provided a much-needed break from their hectic lives, allowing them to relax and recharge. Upon returning home, the couple looked back on their trip with fond memories and a sense of gratitude for the experience. They recognised that it was important to take a break from work time to time to revitalise themselves, and therefore, decided to continue travelling in future"}, {"id": "135847", "question": "<strong>Select the most appropriate option to fill in the blank.</strong></p> <p>The bureaucracy kept the government ________ informed about the riots in the town.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> well", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> very", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> straight", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> So"], "correct_answer": 0, "solution": "A) <strong>'Well'</strong> का use होगा क्योंकि \"well\" एक adverb है जिसका अर्थ होता है अच्छी तरह से या संतोषजनक ढंग से, जो यहाँ पर संदर्भ के अनुसार सही बैठता है। Sentence में कहा गया है कि नौकरशाही ने सरकार को दंगों के बारे में अच्छी तरह से सूचित किया, इसलिए 'well' यहाँ पर उपयुक्त है। जबकि 'Very' का अर्थ है बहुत, 'Straight' का अर्थ है सीधे, और 'So' का अर्थ है इसलिए या तो जो इस context में सही नहीं हैं।\n\n<strong>'Well'</strong> should be used because it is an adverb meaning in a good or satisfactory manner, fitting the context here. The sentence states that the bureaucracy kept the government well informed about the riots, thus 'well' is the appropriate choice here. Whereas, 'Very' means a high degree, 'Straight' means directly, and 'So' indicates therefore or to such an extent, which don't fit in this context"}, {"id": "135848", "question": "<strong>Select the most appropriate option to fill in the blank.</strong></p> <p>The country’s economy is in a ________ serious condition", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> deadly", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> rightly", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> absolutely", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Carefully"], "correct_answer": 0, "solution": "A) <strong>deadly'</strong> का use होगा क्योंकि 'deadly' का अर्थ होता है बहुत खतरनाक या घातक, जो यहाँ दिखाता है कि देश की अर्थव्यवस्था एक बेहद गंभीर और खतरनाक स्थिति में है। Sentence में उल्लेख है कि देश की अर्थव्यवस्था \"गंभीर स्थिति\" में है, इसलिए 'deadly' यहाँ सही है क्योंकि यह गंभीरता की डिग्री को बढ़ाता है। जबकि 'Rightly' का अर्थ होता है उचित रूप से या सही तरीके से, 'Absolutely' का अर्थ है पूर्ण रूप से, और 'Carefully' का अर्थ है सावधानीपूर्वक, जो इस context में सही नहीं है क्योंकि ये शब्द अर्थव्यवस्था की गंभीरता या खतरे की स्थिति को व्यक्त नहीं करते।\n\nA. <strong>deadly'</strong> should be used because it implies something is very dangerous or fatal, suggesting the country's economy is in an extremely serious and dangerous condition. The mention of the economy being in a \"serious condition\" fits 'deadly' as it amplifies the degree of severity. Whereas, 'Rightly' means in a correct or appropriate manner, 'Absolutely' means completely, and 'Carefully' means with care, which don't convey the level of seriousness or danger to the economy as 'deadly' does in this context"}, {"id": "135849", "question": "<strong>Select the most appropriate option to fill in the blank.</strong></p> <p>Surabhi was one of the _____ girls; if not the ________ girl", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> happiest; happy", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> happy; happy", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> happier; happier", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> happy; happiest"], "correct_answer": 0, "solution": "A ) \"<strong>happiest; happy</strong>\" सही है क्योंकि यह संदर्भ को सही ढंग से व्यक्त करता है। सेंटेंस कहता है कि Surabhi खुश लड़कियों में से एक है, अगर सबसे खुश नहीं तो। इसलिए, पहला खाली स्थान \"happiest\" द्वारा भरा जाना चाहिए, जो समूह के भीतर उसकी तुलनात्मक स्थिति को दर्शाता है, और दूसरा \"happy\" होना चाहिए, जो संभावित उत्कृष्टता को दर्शाता है।\n\nOption A \"happiest; happy\" is correct as it accurately reflects the context. The sentence indicates that Surabhi is among the happy girls, if not the happiest. Therefore, the first blank should be filled with \"happiest,\" indicating her comparative position within the group, and the second should be \"happy,\" indicating potential supremacy."}, {"id": "135850", "question": "<strong>Select the most appropriate option to fill in the blank.</strong></p> <p>Since it was a very cold day, my cat ____________ on the terrace all afternoon", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> lying", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> lie", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> laid", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> lay"], "correct_answer": 3, "solution": "'D) ' विकल्प \"<strong>Lay</strong>\" सही है क्योंकि \"lay\" का प्रयोग अतीत काल में होता है जब सब्जेक्ट ने किसी ऑब्जेक्ट को कहीं रखा हो या खुद किसी स्थिति में रहा हो। यहाँ पर सेंटेंस में कहा गया है कि बहुत ठंडा दिन होने की वजह से मेरी बिल्ली पूरे दोपहर टेरेस पर रही, जो कि एक अतीत क्रिया है, इसलिए 'Lay' यहाँ पर उपयुक्त है। 'Lying' वर्तमान काल में लेटे होने की स्थिति को दर्शाता है, 'Lie' वर्तमान काल का रूप है जो खुद लेटने की क्रिया को दर्शाता है, और 'Laid' पिछले काल में किसी ऑब्जेक्ट को रखने की क्रिया है। यहाँ बिल्ली खुद लेटी हुई है, इसलिए 'Lay' सही विकल्प है।\n\nOption 'D' \"<strong>Lay</strong>\" is correct because \"lay\" is used for the past tense when the subject has placed an object somewhere or has been in a position itself. Here, the sentence is about the cat being on the terrace all afternoon on a very cold day, which is a past action, making 'Lay' suitable in this context. 'Lying' represents the state of being in a lying position in the present tense, 'Lie' is the present tense form indicating the act of lying down by oneself, and 'Laid' is the past tense action of placing an object. Since it's the cat that was in a lying position, 'Lay' is the correct choice"}, {"id": "135851", "question": "<strong>Sentences of a paragraph are given below. While the first sentence (1) is in correct order, the sentences that follow are jumbled up. Arrange the sentences in the correct order to form a meaningful and coherent </strong><strong>paragraph.</strong></p> <p>The owner had been in business since decades and understood its requirements</p> <p>A. The owner conducted market research and analysed customer data to identify key trends and preferences.</p> <p>B. The campaign was launched and monitored for effectiveness, with adjustments made as needed to optimize performance.</p> <p>C. He recognised the need for a new marketing strategy, as sales had been stagnant for several months.</p> <p>D. As a result, sales started to pick-up and the company continued to increase its revenue and thereby, profit.</p> <p>E. Based on the research, the owner developed a new marketing campaign focused on reaching the target audience through social media and email marketing audience through social media and email marketing.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> CAEBD", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> CBDEA", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> ACDEB", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> BCADE"], "correct_answer": 0, "solution": "A) <strong>CAEBD</strong>\n\nThe owner had been in business since decades and understood its requirements He recognised the need for a new marketing strategy, as sales had been stagnant for several months. The owner conducted market research and analysed customer data to identify key trends and preferences. Based on the research, the owner developed a new marketing campaign focused on reaching the target audience through social media and email marketing The campaign was launched and monitored for effectiveness, with adjustments made as needed to optimize performance.As a result, sales started to pick-up and the company continued to increase its revenue and thereby, profit"}, {"id": "135852", "question": "<strong>Select the most appropriate option to fill in the blank.</strong></p> <p>Having found no one, the postman slipped the letter _________ the door of the mansion.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> below", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> underneath", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> without", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Above"], "correct_answer": 1, "solution": "B) <strong>underneath'</strong> का use होगा क्योंकि 'underneath' का अर्थ होता है किसी चीज़ के नीचे। sentence में mention किया गया है कि postman ने किसी को न पाकर चिट्ठी को महल के दरवाजे के नीचे डाल दिया, इसलिए 'underneath' यहाँ सही है। जबकि 'Below' भी नीचे को दर्शाता है लेकिन यह थोड़ा अस्पष्ट है, 'Without' का अर्थ है के बिना, और 'Above' का अर्थ है ऊपर, जो इस context में सही नहीं है\n\n<strong>underneath'</strong> should be used because it means directly below something. The sentence mentions that the postman slipped the letter under the door of the mansion after finding no one, making 'underneath' the most appropriate choice. While 'Below' also indicates a position lower than something, it's more ambiguous in this context. 'Without' means in the absence of, and 'Above' means at a higher place, neither of which fits in this context"}, {"id": "135853", "question": "<strong>Select the most appropriate preposition to fill in the blank.</strong></p> <p>Everyone glanced ______ the pretty girl at the pool party", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> to", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> on", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> at", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> for"], "correct_answer": 2, "solution": "C) <strong>at'</strong> का use होगा क्योंकि 'glance at' का अर्थ होता है किसी व्यक्ति या वस्तु की ओर संक्षिप्त और तेज़ नज़र डालना। sentence में mention किया गया है कि हर कोई pool party में उस सुंदर लड़की की ओर देख रहा था, इसलिए 'at' यहाँ सही है। जबकि 'to' का अर्थ होता है किसी दिशा में जाना, 'on' का अर्थ होता है किसी सतह पर होना, और 'For' का उपयोग किसी उद्देश्य या कारण को दर्शाने के लिए होता है, जो इस context में सही नहीं हैं।\n\n<strong>at'</strong> should be used because 'glance at' means to look briefly and quickly at someone or something. The sentence mentions that everyone glanced at the pretty girl at the pool party, making 'at' fitting here. Whereas, 'to' implies direction, 'on' means being in a position atop something, and 'For' is used to indicate purpose or reason, which don't fit in this context"}, {"id": "135854", "question": "<strong>Select the most appropriate option to fill in the blank.</strong></p> <p>The committee was dissolved because the in-charge was ________ troublemaker", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> No article required", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> the", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> a", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> An"], "correct_answer": 2, "solution": "C) ' <strong>A </strong>का use होगा क्योंकि जब हम किसी विशेषण के साथ किसी एक अनिश्चित व्यक्ति या वस्तु का उल्लेख करते हैं, तो 'a' का प्रयोग करते हैं। यहाँ पर \"troublemaker\" एक विशेषण है जो एक अनिश्चित व्यक्ति को दर्शाता है, इसलिए 'a' सही है। 'No article required' का उपयोग तब होता है जब व्यक्ति या वस्तु निश्चित न हों और सामान्य हों, 'the' का उपयोग निश्चित और विशिष्ट व्यक्ति या वस्तुओं के लिए होता है, और 'An' का उपयोग उन शब्दों के पहले होता है जो व्यंजन से नहीं बल्कि स्वर से शुरू होते हैं। इस context में ये तीनों विकल्प गलत हैं।\n\nA should be used because when referring to an indefinite person or thing with an adjective, 'a' is used. Here, \"troublemaker\" is an adjective describing an indefinite person, making 'a' correct. 'No article required' is used when the person or thing is general and not specific, 'the' is used for definite and specific individuals or things, and 'An' is used before words that start with a vowel sound, not a consonant. In this context, the other three options are incorrect."}, {"id": "135855", "question": "<strong>Select the most appropriate option to fill in the blank.</strong></p> <p>Sunil left school in 2014; I have not seen him _____.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Since", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> for", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> then", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Hence"], "correct_answer": 0, "solution": "A) <strong>Since'</strong> का use होगा क्योंकि \"since\" का अर्थ होता है एक निश्चित समय से लेकर अब तक। Sentence में कहा गया है कि Sunil 2014 में स्कूल छोड़ चुका है और उस समय से लेखक ने उसे नहीं देखा, इसलिए 'since' यहाँ सही है। यह दिखाता है कि 2014 के बाद से लेखक की Sunil से मुलाकात नहीं हुई है। 'then' का उपयोग एक विशेष समय के बाद की घटनाओं को बताने के लिए होता है, 'for' का उपयोग समय की लंबाई के लिए होता है, और 'Hence' का अर्थ है इस कारण से, जो इस context में फिट नहीं बैठता\n\n<strong>Since'</strong> should be used because \"since\" refers to the period of time from a specific point in the past until now. The sentence mentions that Sunil left school in 2014 and implies that the speaker hasn't seen him from that time to the present, making 'since' the correct choice. It indicates that the speaker has not encountered Sunil at any point after 2014. 'Then' is used to refer to a time following a particular moment, 'for' is used for the duration of time, and 'Hence' means therefore, which doesn't fit in this context"}, {"id": "135856", "question": "<strong>Select the most appropriate adjective to fill in the blank.</strong></p> <p>The houseowner was a ________ lady who ran a shelter for stray animals", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> true", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> strong", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> brave", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> kind"], "correct_answer": 3, "solution": "D) <strong>Kind'</strong> का use होगा क्योंकि 'kind' का अर्थ होता है दयालु या किसी के प्रति सहानुभूति रखना। Sentence में बताया गया है कि महिला आवारा जानवरों के लिए एक शेल्टर चलाती है, जो उसकी दयालुता को दर्शाता है। जबकि 'True' का अर्थ है सच्चा, 'Strong' का अर्थ है मजबूत, और 'Brave' का अर्थ है बहादुर, जो इस context में सही नहीं है।\n\n<strong>'Kind'</strong> should be used because it means having a friendly, generous, and considerate nature. The sentence mentions a lady who runs a shelter for stray animals, which shows her kindness. Whereas, 'True' means being honest, 'Strong' means having physical power, and 'Brave' implies courage, which don't fit in this context"}, {"id": "135857", "question": "<strong>Select the most appropriate option to fill in the blank.</strong></p> <p>The captain as well as his players _________ anxious about the forthcoming match", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> is", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> are", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> have", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> has"], "correct_answer": 0, "solution": "A') <strong>'is'</strong> will be used instead of <strong>'are'</strong> because the phrase 'as well as' does not affect the main subject ('The captain'), which is singular. Hence, a singular verb should be used; Like— <strong>The teacher as well as the students is excited about the trip.</strong>"}, {"id": "135858", "question": "<strong>Select the most appropriate option to fill in the blank.</strong></p> <p>Instead of ________ books, I borrow them from the library", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> buying", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> stolen", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> bad", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> good"], "correct_answer": 0, "solution": "A) <strong>Buying'</strong> का use होगा क्योंकि 'buying' का अर्थ है कुछ खरीदना। Sentence में बताया गया है कि व्यक्ति पुस्तकें खरीदने के बजाय उन्हें पुस्तकालय से उधार लेता है, इसलिए 'buying' यहाँ सही विकल्प है। जबकि 'Stolen' का अर्थ होता है चुराना, जो कि इस context में समझ में नहीं आता; 'Bad' और 'Good' का प्रयोग गुणवत्ता को दर्शाने के लिए होता है, जो कि इस संदर्भ में विकल्प के रूप में उपयुक्त नहीं हैं\n\n<strong>'Buying'</strong> should be used because it means to purchase something. The sentence indicates that instead of purchasing books, the person borrows them from the library, making 'buying' the correct choice here. Whereas 'Stolen' implies theft, which doesn't make sense in this context; 'Bad' and 'Good' are used to indicate quality, which are not suitable as options in this scenario"}, {"id": "135859", "question": "<strong>Select the most appropriate option to fill in the blank.</strong></p> <p>This is the place ________ Radha lived six years ago", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> What", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> when", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> how", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> where"], "correct_answer": 3, "solution": "'D) <strong>Where'</strong> का use होगा क्योंकि 'where' का अर्थ होता है किसी स्थान या जगह का संदर्भ देना। Sentence में mention किया गया है कि यह वह जगह है जहाँ राधा छह साल पहले रहती थी, इसलिए 'where' यहाँ सही है। 'What' का अर्थ होता है क्या, 'When' का अर्थ होता है कब, और 'How' का अर्थ होता है कैसे, जो इस context में सही नहीं हैं क्योंकि यहाँ एक स्थान की बात की जा रही है, न कि समय, तरीका, या परिस्थिति।\n\n<strong>'Where'</strong> should be used because it refers to a place or location. The sentence mentions this is the place where Radha lived six years ago, making 'where' appropriate here. 'What' means what, 'When' means when, and 'How' means how, which are not correct in this context as the sentence is about a location, not time, manner, or circumstance"}, {"id": "135860", "question": "<strong>Select the most appropriate article to fill in the blank.</strong></p> <p>Two of ________ four awards are meant for engineering students.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> No article required", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> a", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> an", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> The"], "correct_answer": 3, "solution": "D) The का उपयोग होगा क्योंकि जब हम विशेष या पहले से परिचित वस्तुओं, समूहों, या अवधारणाओं का जिक्र करते हैं, तो 'द' का उपयोग करते हैं। वाक्य में चार पुरस्कारों में से दो की बात की गई है, जो एक विशेष समूह को दर्शाता है, इसलिए 'द' सही है। 'No article required' उस समय उपयोग होता है जब सामान्य बात की जाती है, 'a' और 'an' अनिश्चित लेख होते हैं जिनका उपयोग सामान्य संदर्भ में किया जाता है, न कि विशेष समूह के लिए।\n\nThe' should be used because when we refer to specific or previously mentioned items, groups, or concepts, we use 'the'. The sentence refers to two out of four awards, indicating a specific group, hence 'the' is correct. 'No article required' is used when referring to things in general, 'a' and 'an' are indefinite articles used in a general sense, not for a specific group"}, {"id": "135861", "question": "<strong>Select the most appropriate option to fill in the blank.</strong></p> <p>The horse was uncontrollable, so John jumped _________ the horse.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> of", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> off", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> To", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> In"], "correct_answer": 1, "solution": "B) विकल्प <strong>'off'</strong> सही है क्योंकि 'off' का अर्थ होता है किसी चीज़ से दूर होना या उतरना। वाक्य में बताया गया है कि घोड़ा अनियंत्रित था, इसलिए जॉन ने घोड़े से कूदने का निर्णय लिया, जो दर्शाता है कि वह घोड़े से नीचे उतरना चाहता था, इसलिए 'off' यहाँ सही है। 'Of', 'To', और 'In' इस context में सही नहीं हैं क्योंकि 'Of' का प्रयोग संबंध व्यक्त करने के लिए होता है, 'To' का प्रयोग दिशा या स्थान के संदर्भ में होता है, और 'In' का प्रयोग किसी चीज़ के अंदर होने का वर्णन करने के लिए होता है, जो यहाँ प्रासंगिक नहीं हैं।\n\nOption 'B' <strong>'off'</strong> is correct because 'off' implies moving away from or descending from something. The sentence explains that the horse was uncontrollable, so John decided to jump off the horse, indicating his intention to get down from it, making 'off' appropriate here. 'Of', 'To', and 'In' do not fit in this context because 'Of' is used to express relation, 'To' is used in the context of direction or place, and 'In' is used to describe being inside something, none of which are relevant here."}, {"id": "135862", "question": "<strong>Select the most appropriate verb to fill in the blank.</strong></p> <p>We ________ for the taxi to come before saying good bye.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> waited", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> longed", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Threatened", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Strived"], "correct_answer": 0, "solution": "A) <strong>'Waited'</strong> का use होगा क्योंकि \"waited\" का अर्थ होता है किसी चीज़ के लिए रुकना या इंतज़ार करना। Sentence में mention किया गया है कि हम टैक्सी आने का इंतज़ार कर रहे थे उसके बाद विदाई कही जाएगी, इसलिए 'waited' यहाँ सही है। 'Longed' का अर्थ है बहुत चाहना या लालसा होना, 'Threatened' का अर्थ है धमकी देना या खतरा उत्पन्न करना, और 'Strived' का अर्थ है प्रयास करना या संघर्ष करना, जो इस context में सही नहीं है\n\n<strong>Waited'</strong> should be used because it means to stay in place or to anticipate something. The sentence mentions that we waited for the taxi to come before saying goodbye, making 'waited' fitting here. 'Longed' implies a strong desire or craving, 'Threatened' means to express an intention of inflicting pain or damage, and 'Strived' means to make efforts or struggle, which don't fit in this contex"}, {"id": "135863", "question": "<strong>Select the most appropriate option to fill in the blank.</strong></p> <p>Both ____________ painters refused to work for the king.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> an", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> all", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> the", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> A"], "correct_answer": 2, "solution": "C) <strong>'the'</strong> का use होगा क्योंकि जब हम किसी विशेष समूह या पहले से ज्ञात व्यक्तियों की बात करते हैं, तो 'the' का प्रयोग होता है। Sentence में विशेष चित्रकारों का उल्लेख है जो राजा के लिए काम करने से इंकार करते हैं, इसलिए 'the' यहाँ सही है। 'An' का प्रयोग एकवचन संज्ञा के पहले होता है जो व्यंजन ध्वनि से नहीं शुरू होती है, 'all' का प्रयोग समूह की पूर्णता के लिए होता है लेकिन यहाँ संदर्भ स्पष्ट है, और 'A' का प्रयोग एकवचन संज्ञा के पहले होता है जो व्यंजन ध्वनि से शुरू होती है, जो इस context में सही नहीं है।\n\n<strong>'The'</strong> should be used because it refers to a specific group or already known individuals. The sentence mentions specific painters who refused to work for the king, making 'the' correct here. 'An' is used before a singular noun that starts with a vowel sound, 'all' indicates the entirety of a group but the context is specific here, and 'A' is used before a singular noun starting with a consonant sound, which doesn't fit in this context."}, {"id": "135864", "question": "<strong>Select the most appropriate option to fill in the blank.</strong></p> <p>________ Certain Rahim came looking for you.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> An", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> He", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> A"], "correct_answer": 3, "solution": "D) यानी 'A' सही उत्तर है क्योंकि यहाँ \"certain Rahim\" के उपयोग से पता चलता है कि 'Rahim' को एक अनिश्चित लेकिन पहचाने जाने वाले व्यक्ति के रूप में दर्शाया गया है। 'A' का प्रयोग तब होता है जब हम किसी विशेष व्यक्ति या चीज़ की बजाय एक सामान्य या अनिश्चित व्यक्ति या वस्तु की बात करते हैं। 'Certain' के साथ 'A' का प्रयोग उस व्यक्ति की विशिष्टता को दर्शाता है लेकिन फिर भी उसे अनिश्चितता के साथ प्रस्तुत करता है। इस संदर्भ में, 'The', 'An', और 'He' सही नहीं हैं क्योंकि 'The' और 'He' निश्चितता और विशेषता को दर्शाते हैं, जबकि 'An' का प्रयोग 'Rahim' जैसे व्यंजन ध्वनि से शुरू होने वाले शब्द के लिए नहीं होता।\n\nwhich is 'A', is correct because the use of \"certain Rahim\" indicates that 'Rahim' is being referred to as a specific yet indefinite individual. 'A' is used when we are talking about a general or indefinite person or thing, rather than a specific person or thing. The use of 'A' with 'certain' denotes the specificity of the individual but still presents it with a sense of indefiniteness. In this context, 'The', 'An', and 'He' are incorrect because 'The' and 'He' imply definiteness and specificity, while 'An' is not used before words starting with a consonant sound like 'Rahi"}];
        const examConfig = {
            id: '6748',
            duration: 20,
            positiveMarks: 1.0,
            negativeMarks: 0.25
        };
        
        let currentQuestionIndex = 0;
        let userAnswers = {};
        let flaggedQuestions = new Set();
        let timeLeft = examConfig.duration * 60;
        let timerInterval;
        let isTestFinished = false;
        let solutionMode = false;
        let touchStartX = 0;
        let touchStartY = 0;
        
        // Initialize app
        function initializeApp() {
            createParticles();
            generateQuestionsGrid();
            loadQuestion();
            startTimer();
            setupTouchGestures();
            setupAutoSave();
            
            // Prevent accidental page leave
            window.addEventListener('beforeunload', (e) => {
                if (!isTestFinished) {
                    e.preventDefault();
                    e.returnValue = 'Test in progress. Are you sure you want to leave?';
                }
            });
        }
        
        // Create floating particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = window.innerWidth < 768 ? 20 : 40;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 3 + 3) + 's';
                particlesContainer.appendChild(particle);
            }
        }
        
        // Load current question
        function loadQuestion() {
            const question = questions[currentQuestionIndex];
            
            // Update question info
            document.getElementById('questionNumber').textContent = `Q${currentQuestionIndex + 1}`;
            document.getElementById('questionProgress').textContent = 
                `${currentQuestionIndex + 1} of ${questions.length}`;
            document.getElementById('questionText').innerHTML = question.question;
            
            // Load options
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            
            question.options.forEach((option, index) => {
                const optionElement = document.createElement('div');
                optionElement.className = 'option';
                optionElement.innerHTML = option;
                
                const indicator = document.createElement('div');
                indicator.className = 'option-indicator';
                optionElement.appendChild(indicator);
                
                if (solutionMode) {
                    // Show solution mode styling
                    if (index === question.correct_answer) {
                        optionElement.classList.add('correct');
                        indicator.textContent = '✓';
                    } else if (userAnswers[currentQuestionIndex] === index) {
                        optionElement.classList.add('incorrect');
                        indicator.textContent = '✗';
                    } else {
                        optionElement.classList.add('disabled');
                    }
                    optionElement.style.pointerEvents = 'none';
                } else {
                    // Normal mode
                    if (userAnswers[currentQuestionIndex] === index) {
                        optionElement.classList.add('selected');
                        indicator.textContent = '✓';
                    }
                    
                    optionElement.onclick = () => selectOption(index);
                    optionElement.onkeydown = (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            selectOption(index);
                        }
                    };
                    optionElement.tabIndex = 0;
                }
                
                optionsContainer.appendChild(optionElement);
            });
            
            // Handle solution panel
            const solutionPanel = document.getElementById('solutionPanel');
            if (solutionMode && question.solution) {
                document.getElementById('solutionContent').innerHTML = question.solution;
                solutionPanel.classList.add('show');
            } else {
                solutionPanel.classList.remove('show');
            }
            
            // Update navigation
            updateNavigation();
            updateQuestionsGrid();
            updateFlagButton();
            
            // Add entrance animation
            const container = document.getElementById('questionContainer');
            container.style.transform = 'translateY(20px)';
            container.style.opacity = '0';
            setTimeout(() => {
                container.style.transform = 'translateY(0)';
                container.style.opacity = '1';
            }, 100);
        }
        
        // Select an option
        function selectOption(index) {
            if (solutionMode) return;
            
            const currentAnswer = userAnswers[currentQuestionIndex];
            
            if (currentAnswer === index) {
                // Deselect if clicking the same option
                delete userAnswers[currentQuestionIndex];
            } else {
                // Select new option
                userAnswers[currentQuestionIndex] = index;
            }
            
            // Update UI
            const options = document.querySelectorAll('.option');
            options.forEach((option, i) => {
                const indicator = option.querySelector('.option-indicator');
                if (userAnswers[currentQuestionIndex] === i) {
                    option.classList.add('selected');
                    indicator.textContent = '✓';
                } else {
                    option.classList.remove('selected');
                    indicator.textContent = '';
                }
            });
            
            updateQuestionsGrid();
            showAutoSave();
        }
        
        // Generate questions grid
        function generateQuestionsGrid() {
            const grid = document.getElementById('questionsGrid');
            grid.innerHTML = '';
            
            questions.forEach((_, index) => {
                const button = document.createElement('button');
                button.className = 'question-btn';
                button.textContent = index + 1;
                button.onclick = () => goToQuestion(index);
                button.setAttribute('aria-label', `Go to question ${index + 1}`);
                grid.appendChild(button);
            });
        }
        
        // Update questions grid styling
        function updateQuestionsGrid() {
            const buttons = document.querySelectorAll('.question-btn');
            buttons.forEach((button, index) => {
                button.className = 'question-btn';
                
                if (index === currentQuestionIndex) {
                    button.classList.add('current');
                } else if (solutionMode) {
                    if (userAnswers[index] === questions[index].correct_answer) {
                        button.classList.add('correct');
                    } else if (userAnswers[index] !== undefined) {
                        button.classList.add('incorrect');
                    }
                } else if (userAnswers[index] !== undefined) {
                    button.classList.add('answered');
                }
                
                if (flaggedQuestions.has(index)) {
                    button.classList.add('flagged');
                }
            });
        }
        
        // Navigation functions
        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
            }
        }
        
        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else if (!solutionMode) {
                submitTest();
            }
        }
        
        function goToQuestion(index) {
            currentQuestionIndex = index;
            loadQuestion();
            closeSidebar();
        }
        
        function updateNavigation() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            
            prevBtn.disabled = currentQuestionIndex === 0;
            
            if (solutionMode) {
                nextBtn.textContent = currentQuestionIndex === questions.length - 1 ? 
                    'Finish Review' : 'Next →';
                nextBtn.onclick = currentQuestionIndex === questions.length - 1 ? 
                    finishReview : nextQuestion;
            } else {
                nextBtn.textContent = currentQuestionIndex === questions.length - 1 ? 
                    'Submit Test' : 'Next →';
                nextBtn.onclick = currentQuestionIndex === questions.length - 1 ? 
                    submitTest : nextQuestion;
            }
        }
        
        // Timer functions
        function startTimer() {
            const timerElement = document.getElementById('timer');
            const progressCircle = document.getElementById('progressCircle');
            const circumference = 2 * Math.PI * 18;
            const totalTime = examConfig.duration * 60;
            
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    submitTest();
                    return;
                }
                
                timeLeft--;
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerElement.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                
                // Update progress circle
                const progress = (totalTime - timeLeft) / totalTime;
                const offset = circumference * progress;
                progressCircle.style.strokeDashoffset = offset;
                
                // Add warning effects
                if (timeLeft <= 300) { // 5 minutes
                    timerElement.classList.add('warning');
                }
                if (timeLeft <= 60) { // 1 minute
                    timerElement.classList.add('critical');
                }
            }, 1000);
        }
        
        // Toggle question flag
        function toggleFlag() {
            if (flaggedQuestions.has(currentQuestionIndex)) {
                flaggedQuestions.delete(currentQuestionIndex);
            } else {
                flaggedQuestions.add(currentQuestionIndex);
            }
            updateFlagButton();
            updateQuestionsGrid();
        }
        
        function updateFlagButton() {
            const flagBtn = document.getElementById('flagBtn');
            if (flaggedQuestions.has(currentQuestionIndex)) {
                flagBtn.textContent = '🏴 Unflag Question';
                flagBtn.style.background = 'rgba(239, 68, 68, 0.2)';
                flagBtn.style.color = 'var(--error)';
            } else {
                flagBtn.textContent = '🚩 Flag Question';
                flagBtn.style.background = 'rgba(245, 158, 11, 0.2)';
                flagBtn.style.color = 'var(--warning)';
            }
        }
        
        // Theme toggle
        function toggleTheme() {
            const body = document.body;
            const themeBtn = document.getElementById('themeBtn');
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            body.setAttribute('data-theme', newTheme);
            themeBtn.textContent = newTheme === 'light' ? '🌙' : '☀️';
            
            // Save preference
            localStorage.setItem('theme', newTheme);
        }
        
        // Sidebar functions
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            
            sidebar.classList.toggle('open');
            overlay.classList.toggle('show');
        }
        
        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('show');
        }
        
        // Touch gesture support
        function setupTouchGestures() {
            const main = document.querySelector('.main');
            
            main.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            });
            
            main.addEventListener('touchend', (e) => {
                const touchEndX = e.changedTouches[0].clientX;
                const touchEndY = e.changedTouches[0].clientY;
                const deltaX = touchEndX - touchStartX;
                const deltaY = touchEndY - touchStartY;
                
                // Only trigger if horizontal swipe is dominant
                if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 50) {
                    if (deltaX > 0 && currentQuestionIndex > 0) {
                        // Swipe right - previous question
                        previousQuestion();
                    } else if (deltaX < 0 && currentQuestionIndex < questions.length - 1) {
                        // Swipe left - next question
                        nextQuestion();
                    }
                }
            });
        }
        
        // Auto-save functionality
        function setupAutoSave() {
            // Save answers periodically
            setInterval(() => {
                if (!isTestFinished) {
                    saveProgress();
                }
            }, 30000); // Every 30 seconds
        }
        
        function saveProgress() {
            const progress = {
                answers: userAnswers,
                flagged: Array.from(flaggedQuestions),
                currentQuestion: currentQuestionIndex,
                timeLeft: timeLeft
            };
            
            // In a real implementation, this would save to a server
            console.log('Progress saved:', progress);
        }
        
        function showAutoSave() {
            const autoSave = document.getElementById('autoSave');
            autoSave.classList.add('show');
            setTimeout(() => {
                autoSave.classList.remove('show');
            }, 2000);
        }
        
        // Submit test
        function submitTest() {
            if (isTestFinished) return;
            
            isTestFinished = true;
            clearInterval(timerInterval);
            
            // Calculate results
            let correct = 0, wrong = 0, skipped = 0, totalMarks = 0;
            
            questions.forEach((question, index) => {
                if (userAnswers[index] === undefined) {
                    skipped++;
                } else if (userAnswers[index] === question.correct_answer) {
                    correct++;
                    totalMarks += examConfig.positiveMarks;
                } else {
                    wrong++;
                    totalMarks -= examConfig.negativeMarks;
                }
            });
            
            const maxMarks = questions.length * examConfig.positiveMarks;
            const percentage = Math.max(0, Math.round((totalMarks / maxMarks) * 100));
            
            // Show results
            document.getElementById('resultTitle').textContent = 
                `${correct}/${questions.length} Correct`;
            document.getElementById('resultSubtitle').textContent = 
                `You scored ${totalMarks} out of ${maxMarks} marks`;
            document.getElementById('correctCount').textContent = correct;
            document.getElementById('wrongCount').textContent = wrong;
            document.getElementById('skippedCount').textContent = skipped;
            document.getElementById('finalScore').textContent = `${totalMarks} Marks`;
            document.getElementById('finalPercentage').textContent = `${percentage}%`;
            
            document.getElementById('resultModal').classList.add('show');
            closeSidebar();
        }
        
        // View solutions
        function viewSolutions() {
            document.getElementById('resultModal').classList.remove('show');
            solutionMode = true;
            currentQuestionIndex = 0;
            loadQuestion();
        }
        
        // Finish review
        function finishReview() {
            solutionMode = false;
            currentQuestionIndex = 0;
            loadQuestion();
        }
        
        // Retake test
        function retakeTest() {
            if (confirm('Are you sure you want to retake the test? All progress will be lost.')) {
                location.reload();
            }
        }
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (solutionMode) return;
            
            switch(e.key) {
                case 'ArrowLeft':
                    e.preventDefault();
                    previousQuestion();
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    nextQuestion();
                    break;
                case 'f':
                case 'F':
                    if (e.ctrlKey || e.metaKey) {
                        e.preventDefault();
                        toggleFlag();
                    }
                    break;
                case 'm':
                case 'M':
                    if (e.ctrlKey || e.metaKey) {
                        e.preventDefault();
                        toggleSidebar();
                    }
                    break;
                case '1':
                case '2':
                case '3':
                case '4':
                    if (!e.ctrlKey && !e.metaKey) {
                        e.preventDefault();
                        const optionIndex = parseInt(e.key) - 1;
                        if (optionIndex < questions[currentQuestionIndex].options.length) {
                            selectOption(optionIndex);
                        }
                    }
                    break;
            }
        });
        
        // Initialize when DOM is loaded
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeApp);
        } else {
            initializeApp();
        }
        
        // Load saved theme
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            document.body.setAttribute('data-theme', savedTheme);
            document.getElementById('themeBtn').textContent = savedTheme === 'light' ? '🌙' : '☀️';
        }
    </script>
</body>
</html>
