<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6366f1">
    <title>devgagan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #06b6d4;
            
            --glass-bg: rgba(255, 255, 255, 0.95);  /* Changed from 0.25 to 0.95 */
            --glass-border: rgba(255, 255, 255, 0.8);  /* Changed from 0.18 to 0.8 */
            --shadow-light: 0 8px 32px rgba(31, 38, 135, 0.37);
            --shadow-heavy: 0 20px 60px rgba(0, 0, 0, 0.3);
            
            --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --bounce: cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        
[data-theme="light"] {
    --bg: #ffffff;  /* Changed from gradient to solid white */
    --card-bg: #ffffff;  /* Changed from transparent to solid white */
    --text: #1a202c;
    --text-secondary: #4a5568;
    --border: rgba(0, 0, 0, 0.1);  /* Changed to darker border for contrast */
    --nav-bg: #ffffff;  /* Changed from transparent to solid white */
}

[data-theme="dark"] {
    --bg: #1a1a2e;  /* Changed from gradient to solid dark */
    --card-bg: #16213e;  /* Changed from transparent to solid dark */
    --text: #f7fafc;
    --text-secondary: #a0aec0;
    --border: rgba(255, 255, 255, 0.1);
    --nav-bg: #0c0c0c;  /* Changed from transparent to solid dark */
}
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--bg);  /* Now just using the solid color */
    z-index: -1;
}
        
        /* Floating particles animation */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: float 6s infinite ease-in-out;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.7; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 0.3; }
        }
        
        /* Header with glassmorphism */
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 16px 20px;
            z-index: 100;
            transition: var(--transition);
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .menu-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            font-size: 18px;
        }
        
        .menu-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-light);
        }
        
        .menu-btn:active {
            transform: scale(0.95);
        }
        
        .logo {
            font-weight: 800;
            font-size: 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        
        [data-theme="dark"] .logo {
    background: none;
    -webkit-text-fill-color: white; /* White text in dark mode */
    color: white; /* Fallback */
}
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            font-size: 20px;
        }
        
        .theme-toggle:hover {
            transform: rotate(180deg) scale(1.1);
            box-shadow: var(--shadow-light);
        }
        
        /* Advanced Timer */
        .timer-container {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .timer {
            background: linear-gradient(135deg, var(--error), #dc2626);
            color: white;
            padding: 12px 16px;
            border-radius: 16px;
            font-family: 'Inter', monospace;
            font-weight: 600;
            font-size: 14px;
            box-shadow: var(--shadow-light);
            position: relative;
            overflow: hidden;
        }
        
        .timer.warning {
            animation: pulse 1s infinite;
        }
        
        .timer.critical {
            animation: shake 0.5s infinite;
            background: linear-gradient(135deg, #dc2626, #991b1b);
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
        }
        
        .progress-ring {
            width: 40px;
            height: 40px;
            transform: rotate(-90deg);
        }
        
        .progress-circle {
            fill: none;
            stroke: rgba(255, 255, 255, 0.3);
            stroke-width: 3;
        }
        
        .progress-circle.progress {
            stroke: var(--primary);
            stroke-linecap: round;
            transition: stroke-dashoffset 0.3s ease;
        }
        
        /* Main Content */
        .main {
            margin: 80px 0 100px;
            padding: 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .question-container {
    background: var(--card-bg);  /* Now uses solid color */
    /* Remove or reduce blur effect */
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 32px;
    box-shadow: var(--shadow-heavy);
    position: relative;
    overflow: hidden;
    transition: var(--transition);
}
        .question-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--info));
            background-size: 200% 100%;
            animation: gradient-flow 3s linear infinite;
        }
        
        @keyframes gradient-flow {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .question-number {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 12px 20px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: var(--shadow-light);
            position: relative;
        }
        
        .question-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }
        
        .question-progress {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
        }
        
        .question-marks {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 600;
        }
        
        .question-text {
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 32px;
            color: var(--text);
            font-weight: 500;
        }
        
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .option {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 20px 24px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            font-size: 16px;
            font-weight: 500;
            color: var(--text);
            overflow: hidden;
        }
        
        .option::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s;
        }
        
        .option:hover::before {
            left: 100%;
        }
        
        .option:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: var(--shadow-light);
        }
        
        .option:active {
            transform: scale(0.98);
        }

        .menu-btn, .theme-toggle, .nav-btn.prev, .action-btn.flag {
    background: var(--card-bg);  /* Solid background */
    backdrop-filter: none;  /* Remove blur */
}

.sidebar {
    background: var(--card-bg);  /* Solid background */
    backdrop-filter: none;  /* Remove blur */
}
        
        .option.selected {
            background: rgba(99, 102, 241, 0.15);
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-light);
        }
        
        .option.correct {
            background: rgba(16, 185, 129, 0.15);
            border-color: var(--success);
            color: var(--success);
        }
        
        .option.incorrect {
            background: rgba(239, 68, 68, 0.15);
            border-color: var(--error);
            color: var(--error);
        }
        
        .option.disabled {
            background: rgba(160, 174, 192, 0.1);
            border-color: var(--text-secondary);
            color: var(--text-secondary);
            cursor: not-allowed;
        }
        
        .option-indicator {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }
        
        .option.selected .option-indicator {
            background: var(--primary);
            color: white;
        }
        
        .option.correct .option-indicator {
            background: var(--success);
            color: white;
        }
        
        .option.incorrect .option-indicator {
            background: var(--error);
            color: white;
        }
        
        .option:not(.selected):not(.correct):not(.incorrect) .option-indicator {
            border: 2px solid var(--border);
        }
        
        /* Solution Panel */
        .solution-panel {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(245, 158, 11, 0.05));
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 20px;
            padding: 24px;
            margin-top: 24px;
            backdrop-filter: blur(10px);
            transform: translateY(20px);
            opacity: 0;
            transition: var(--transition);
        }
        
        .solution-panel.show {
            transform: translateY(0);
            opacity: 1;
        }
        
        .solution-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            color: var(--warning);
            font-weight: 700;
        }
        
        .solution-content {
            color: var(--text);
            line-height: 1.6;
            font-size: 15px;
        }
        
        /* Navigation */
        .navigation {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            padding: 16px 20px;
            z-index: 90;
        }
        
        .nav-content {
            display: flex;
            gap: 12px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .nav-btn {
            flex: 1;
            padding: 16px 24px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        
        .nav-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.6s;
        }
        
        .nav-btn:hover::before {
            left: 100%;
        }
        
        .nav-btn:active {
            transform: scale(0.95);
        }
        
        .nav-btn.prev {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            backdrop-filter: blur(10px);
        }
        
        .nav-btn.next {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: var(--shadow-light);
        }
        
        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .nav-btn:disabled::before {
            display: none;
        }
        
        /* Question Panel Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid var(--border);
            z-index: 200;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-heavy);
        }
        
        .sidebar.open {
            right: 0;
        }
        
        .sidebar-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .sidebar-title {
            font-weight: 800;
            font-size: 20px;
        }
        
        .close-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        
        .close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(90deg);
        }
        
        .sidebar-body {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }
        
        .questions-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 32px;
        }
        
        .question-btn {
            background: var(--card-bg);
            border: 2px solid var(--border);
            color: var(--text-secondary);
            width: 48px;
            height: 48px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            position: relative;
        }
        
        .question-btn:hover {
            transform: scale(1.1);
            box-shadow: var(--shadow-light);
        }
        
        .question-btn:active {
            transform: scale(0.95);
        }
        
        .question-btn.current {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: var(--shadow-light);
        }
        
        .question-btn.answered {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border-color: var(--success);
        }
        
        .question-btn.correct {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }
        
        .question-btn.incorrect {
            background: var(--error);
            color: white;
            border-color: var(--error);
        }
        
        .question-btn.flagged::after {
            content: '🚩';
            position: absolute;
            top: -4px;
            right: -4px;
            font-size: 10px;
        }
        
        /* Legend */
        .legend {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 32px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .legend-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        
        .legend-dot.current { background: var(--primary); }
        .legend-dot.answered { background: var(--success); }
        .legend-dot.unattempted { background: var(--text-secondary); }
        .legend-dot.flagged { background: var(--warning); }
        
        /* Action Buttons */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .action-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }
        
        .action-btn.flag {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        
        .action-btn.submit {
            background: linear-gradient(135deg, var(--error), #dc2626);
            color: white;
            box-shadow: var(--shadow-light);
        }
        
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-heavy);
        }
        
        .action-btn:active {
            transform: scale(0.98);
        }
        
        /* Overlay */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 150;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }
        
        .overlay.show {
            opacity: 1;
            visibility: visible;
        }
        
        /* Result Modal */
        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 32px;
            max-width: 90vw;
            width: 480px;
            z-index: 300;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
            box-shadow: var(--shadow-heavy);
            overflow: hidden;
        }
        
        .modal.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }
        
        .modal-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 40px 32px;
            text-align: center;
        }
        
        .modal-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        
        .modal-subtitle {
            opacity: 0.9;
            font-size: 16px;
            font-weight: 500;
        }
        
        .modal-body {
            padding: 32px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            text-align: center;
            padding: 20px 16px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }
        
        .stat-label {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        
        .stat-value {
            color: var(--text);
            font-size: 24px;
            font-weight: 800;
        }
        
        .final-score {
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
            border-radius: 20px;
            padding: 32px;
            text-align: center;
            margin-bottom: 24px;
            box-shadow: var(--shadow-light);
        }
        
        .score-text {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        
        .percentage-text {
            opacity: 0.9;
            font-size: 18px;
            font-weight: 600;
        }
        
        .modal-actions {
            display: flex;
            gap: 12px;
        }
        
        .modal-btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }
        
        .modal-btn.primary {
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary);
            border: 1px solid rgba(99, 102, 241, 0.3);
        }
        
        .modal-btn.success {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        
        .modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-light);
        }
        
        /* Auto-save indicator */
        .auto-save {
            position: fixed;
            top: 80px;
            right: 20px;
            background: var(--success);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            transform: translateX(100px);
            opacity: 0;
            transition: var(--transition);
            z-index: 90;
        }
        
        .auto-save.show {
            transform: translateX(0);
            opacity: 1;
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .header-content {
                padding: 0 4px;

cenario most closely parallels the risk described in J&amp;K if the L-G’s nomination powers remain unchecked?</strong>", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> A university’s chancellor appointing members to the governing council without faculty consultation, thereby shifting control over academic policy decisions.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> A company’s HR department fast-tracking employee promotions based on performance metrics approved by the board.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> A sports team’s captain selecting substitute players from a reserve list during a match.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> A local library board adding new members chosen from community volunteers to assist in event management."], "correct_answer": 0, "solution": "No solution available"}, {"id": "160735", "question": "<strong>In each of the following questions, a part of the sentence is printed in bold. Choose the option that best improves the bold part. If no improvement is required, select (D) No improvement.</strong></p> <p>Each of the researchers must ensure that <strong>they submit their final draft with the statistical appendix, the raw data tables, and the signed consent forms</strong> before the ethics committee’s deadline.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> he or she submits his or her final draft with the statistical appendix, the raw data tables, and the signed consent forms", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> he submits his final draft with the statistical appendix, the raw data tables, and the signed consent forms, as per the guidelines provided", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> their final drafts are to be submitted with the statistical appendix, the raw data tables, and the signed consent forms", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> No improvement"], "correct_answer": 0, "solution": "A) ‘Each of the researchers’ व्याकरणिक रूप से singular होता है; अतः pronoun और verb भी singular होंगे: he or she submits his or her.<br> जैसे— Each candidate must bring his or her admit card.\n\n• ‘he or she submits his or her …’ will be used instead of ‘they submit their …’ because with the singular quantifier ‘Each of …’, formal grammar requires singular pronoun + singular verb for agreement.<br> Like— Each participant must send his or her bio before Monday.\n\nCorrect sentence: Each of the researchers must ensure that he or she submits his or her final draft with the statistical appendix, the raw data tables, and the signed consent forms before the ethics committee’s deadline."}, {"id": "160745", "question": "<strong>Rearrange the four sentences (P, Q, R, S) to form a coherent paragraph. Choose the correct order from the options.</strong></p> <p>P. It proposes merging smaller colleges into regional clusters to reduce duplication of courses.<br> Q. The draft White Paper has stirred debate across campuses after the higher education minister released it last week.<br> R. While supporters argue that clusters will improve resource sharing, critics fear the loss of local identity.<br> S. At the heart of the proposal is a five-year roadmap to raise teaching standards and research output.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> P–Q–R–S", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> S–P–Q–R", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Q–P–S–R", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Q–S–P–R"], "correct_answer": 3, "solution": "D) Q–S–P–R\n\nBegin with Q because it <strong>introduces the document</strong> (“the draft White Paper”) and its <strong>context/time marker</strong> “last week,” setting the scene. हिंदी में, Q आरंभिक पंक्ति है क्योंकि यह विषय और समय—<strong>किस कागज़ पर बहस हो रही है और कब जारी हुआ</strong>—स्पष्ट करता है।<br> Next S naturally zooms in: the phrase <strong>“At the heart of the proposal”</strong> signals a shift from context to <strong>core content</strong>—a five-year roadmap. हिंदी में, S प्रस्ताव के <strong>मुख्य बिंदु</strong> पर लाता है—शिक्षण और शोध को बेहतर करने का रोडमैप।<br> Then P uses the pronoun <strong>“It”</strong>, which <strong>anaphorically</strong> refers back to “the proposal,” giving a <strong>specific mechanism</strong> (merging colleges). हिंदी में, P में <strong>It = proposal</strong>; यहाँ <strong>कार्यान्वयन का तरीका</strong> बताया गया है—कॉलेज क्लस्टर।<br> Finally R offers a <strong>balanced evaluation</strong> with the contrastive marker <strong>“While”</strong>—supporters vs critics—so it must conclude the paragraph by presenting <strong>debate/outcome</strong>. हिंदी में, R बहस का <strong>दोनों पक्ष</strong> दिखाकर पैराग्राफ को समापन देता है।"}, {"id": "160740", "question": "<strong>Identify the part of the sentence which has an error:</strong></p> <p>By the time the police arrived at the scene, / the robbers left the bank / taking with them a large sum of cash / and disappearing into the nearby forest.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> By the time the police arrived at the scene", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> the robbers left the bank", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> taking with them a large sum of cash", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> and disappearing into the nearby forest"], "correct_answer": 1, "solution": "B) ‘<strong>the robbers left</strong>’ के बदले <strong>‘the robbers had left’</strong> का प्रयोग होना चाहिए क्योंकि यह action (bank छोड़ना) पुलिस के आने से पहले हो चुका था। जब दो past actions हों, तो पहले वाले में <strong>Past Perfect</strong> और बाद वाले में <strong>Past Indefinite</strong> प्रयोग होता है।<br> उदाहरण — ✔ <strong>By the time we reached the station, the train had left.</strong>\n\n“<strong>The robbers left</strong>” should be <strong>“the robbers had left”</strong> because the act of leaving the bank happened <strong>before</strong> the police arrived. In two past actions, the earlier one takes <strong>Past Perfect</strong>, and the later one takes <strong>Past Indefinite</strong>.<br> Example — ✔ <strong>By the time we reached the station, the train had left.</strong>"}, {"id": "160736", "question": "Identify the part of speech of the bracketed word.</p> <p>I admired the decision <strong>[that]</strong> she took under pressure.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Demonstrative determiner", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Relative pronoun", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Subordinating conjunction (complementizer)", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Degree adverb"], "correct_answer": 1, "solution": "B) “that” introduces a relative clause (“that she took under pressure”) which modifies “decision.” Inside the clause, “that” stands for the noun “decision” as the object of “took” (“she took it”). You can replace it with “which,” or drop it (“the decision she took”)—typical of a relative pronoun.\n\n“that” यहाँ relative clause (“that she took under pressure”) को शुरू करता है जो “decision” का वर्णन करता है। यह clause में object की जगह लेता है, इसलिए यह relative pronoun है। इसे “which” से बदला या कई बार हटाया भी जा सकता है—जो relative pronoun की पहचान है।\n\nWhy others are wrong:\n\n<strong>A Determiner / निर्धारक:</strong> Determiner “that” तभी होता है जब यह सीधे किसी संज्ञा से पहले आए (“that decision”). यहाँ ऐसा नहीं है।\n\n<strong>C Subordinating conjunction / अवनत समुच्चयबोधक:</strong> Complementizer “that” बोलते हैं जैसे “He said that he was ready.” यहाँ “that” किसी संज्ञा-उपवाक्य (noun clause) को जोड़ता है, न कि relative clause।\n\n<strong>D Degree adverb / परिमाण क्रिया-विशेषण:</strong> “that” degree दिखाने पर (“not that hard”) adverb होता है; इस वाक्य में degree नहीं दिख रही।"}, {"id": "160742", "question": "<strong>Select the option that expresses the given sentence in reported speech.</strong></p> <p>The expedition leader said to the trainees, \"Please do not descend into the gorge until the rope anchors have been inspected; secure the helmets tight, keep your radios on channel seven, and report to me as soon as the first rappel is over.\"", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> The expedition leader requested the trainees not to descend into the gorge until the rope anchors had been inspected, to secure the helmets tight, to keep their radios on channel seven, and to report to him as soon as the first rappel was over.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The expedition leader told the trainees that they do not descend into the gorge until the rope anchors have been inspected; that they secure the helmets tight, keep their radios on channel seven, and report to him as soon as the first rappel is over.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The expedition leader forbade the trainees to not descend into the gorge until the rope anchors had been inspected and suggested that they should secure the helmets tight and keep their radios on channel seven, and report to him when the first rappel completes.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The expedition leader advised that the trainees did not descend into the gorge till the rope anchors were inspected, secured the helmets tight, kept their radios on channel seven, and then informed him as soon as the first rappel had been over."], "correct_answer": 0, "solution": "A) The word please marks a request, so requested is the natural reporting verb. A negative imperative is idiomatically rendered with not to + base verb, while the positive directives are most clearly and correctly sequenced with parallel to-infinitives, preserving order and force. Within the time clauses introduced by until and as soon as, backshift follows the past reporting verb, so have been inspected becomes had been inspected and is over becomes was over. Pronouns and deixis adjust normally, with me → him and your → their. Only option A integrates all of these features smoothly; B relies on finite that-clauses with present-tense forms that clash with past reporting, C creates a double-negative feel and leaves an unshifted completes, and D converts the instructions into a completed past narrative, undermining the directive sense.\n\n“Please” का प्रयोग विनम्र अनुरोध को सूचित करता है, अतः reported speech में requested उपयुक्त क्रिया है। नकारात्मक आदेश को मानक रूप में not to + क्रिया मूल से व्यक्त किया जाता है, जबकि शेष सकारात्मक निर्देशों को समानांतर to-infinitives में रखने से क्रम और स्पष्टता बनी रहती है। until तथा as soon as जैसे समय-उपवाक्यों में, भूतकालीन रिपोर्टिंग के बाद क्रियाएँ उपयुक्त रूप से backshift होती हैं; इसलिए have been inspected → had been inspected और is over → was over हो जाता है। सर्वनाम भी बदले जाते हैं—me → him, your → their। केवल विकल्प A इन सभी बातों को स्वाभाविक ढंग से समाहित करता है; B में that-clauses के वर्तमान रूप भूत रिपोर्टिंग से टकराते हैं, C में double-negative जैसी भावना बनती है और completes बिना backshift के रह जाता है, जबकि D आदेशों को पूर्ण हो चुके भूतकालीन कार्यों जैसा बना देता है, जिससे निर्देशात्मक अर्थ कमज़ोर पड़ता है।"}, {"id": "160738", "question": "<strong>Identify the part of the sentence which has an error:</strong></p> <p>The finance minister has announced a series of economic reforms yesterday / aimed at boosting foreign investment / and improving the ease of doing business / in the country.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> The finance minister has announced a series of economic reforms yesterday", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> aimed at boosting foreign investment", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> and improving the ease of doing business", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> in the country"], "correct_answer": 0, "solution": "A) ‘<strong>has announced… yesterday</strong>’ गलत है क्योंकि <strong>Present Perfect Tense</strong> (has/have + V3) का प्रयोग <strong>past time adverbs</strong> जैसे <em>yesterday, in 1990, last year</em> के साथ नहीं होता। ऐसे मामलों में <strong>Past Indefinite</strong> (V2) का प्रयोग होता है।<br> उदाहरण — ✔ <strong>He visited Delhi yesterday.</strong> (✘ has visited Delhi yesterday)\n\n“<strong>Has announced… yesterday</strong>” is incorrect because the <strong>Present Perfect Tense</strong> cannot be used with past time adverbs like <em>yesterday, in 1990, last year</em>. In such cases, we use the <strong>Past Indefinite Tense</strong> (V2).<br> Example — ✔ <strong>He visited Delhi yesterday.</strong> (✘ has visited Delhi yesterday)"}, {"id": "160737", "question": "Identify the part of speech of <strong>past</strong> in the sentence:</p> <p>“We crept <strong>past</strong> the sleeping guards without a sound.”", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Adverb modifying “crept,” with no object", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Preposition introducing a phrase with “the sleeping guards” as its object", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Adjective modifying “guards”", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Noun meaning “history” or “a former time”"], "correct_answer": 1, "solution": "B) <strong>past</strong> takes a noun phrase object (“the sleeping guards”), so it functions as a <strong>preposition</strong>, forming the prepositional phrase “past the sleeping guards.”<br> <strong>past</strong> अपने बाद संज्ञा-समूह “the sleeping guards” को ले रहा है, इसलिए यह <strong>preposition</strong> है और “past the sleeping guards” एक prepositional phrase बनाता है।"}, {"id": "160746", "question": "<strong>Rearrange the four sentences (P, Q, R, S) to form a coherent paragraph. Choose the correct order from the options.</strong></p> <p>P. To address safety concerns, the team limited the dosage in the second cohort and added a 72-hour monitoring window.<br> Q. The preliminary results, published in a peer-reviewed journal, show a 45% reduction in symptom severity compared to placebo.<br> R. After the initial cohort reported mild arrhythmia in two participants, the protocol was amended.<br> S. The Phase II trial of the nasal vaccine enrolled 312 adults across four centers.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> S–R–P–Q", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> R–P–S–Q", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> S–P–R–Q", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> R–S–P–Q"], "correct_answer": 0, "solution": "A) S–R–P–Q\n\nOpen with S: it <strong>sets scope</strong> (Phase II, nasal vaccine), <strong>sample size</strong> (312 adults), and <strong>sites</strong> (four centers). हिंदी में, S ट्रायल की <strong>बुनियादी सूचना</strong> देता है—चरण, प्रतिभागी, केंद्र।<br> R follows because <strong>“After the initial cohort…”</strong> indicates a <strong>chronological pivot</strong>—an event (arrhythmia) that <strong>triggers change</strong>. हिंदी में, R समय संकेतक <strong>“After…”</strong> से आगे की कार्रवाई का कारण बताता है।<br> P then explains <strong>the nature of that change</strong> with the purpose marker <strong>“To address safety concerns,”</strong> giving <strong>specific adjustments</strong> (dosage limit, 72-hour monitoring). हिंदी में, P बताता है कि <strong>सुरक्षा चिंताओं</strong> के कारण क्या-क्या संशोधन हुए।<br> Q concludes with <strong>results publication</strong> and <strong>effect size</strong> (45% reduction), logically <strong>after</strong> design and safety adaptations. हिंदी में, Q अंत में <strong>निष्कर्ष/परिणाम</strong> प्रस्तुत करता है—उचित समापन।"}, {"id": "160734", "question": "In each of the following questions, a part of the sentence is printed in <strong>bold</strong>. Choose the option that best improves the bold part. If no improvement is required, select <strong>(D) No improvement</strong>.</p> <p>The director <strong>made the interns to compile a comprehensive dossier on competitor strategies, including pricing algorithms and distribution networks</strong>, before the review meeting began.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> made the interns compile a comprehensive dossier on competitor strategies, including pricing algorithms and distribution networks", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> made the interns to be compiling a comprehensive dossier on competitor strategies, including pricing algorithms and distribution networks", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> made the interns to compile a comprehensive dossier regarding competitor strategies, including pricing algorithms and distribution networks", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> No improvement"], "correct_answer": 0, "solution": "A) ‘<strong>made</strong>’ (causative verb) के बाद <strong>bare infinitive (V1)</strong> आता है; इसलिए ‘<strong>to compile</strong>’ गलत है, सही रूप <strong>‘compile’</strong> होगा।<br> जैसे— The teacher <strong>made</strong> the students <strong>rewrite</strong> the answer.\n\n• <strong>‘compile …’</strong> will be used instead of <strong>‘to compile …’</strong> because after the causative verb <strong>‘make’</strong>, we use the <strong>bare infinitive</strong> (base form) and not the <strong>to-infinitive</strong>.<br> Like— The manager <strong>made</strong> the team <strong>stay</strong> late to finish the report.\n\nCorrect sentence: The director <strong>made the interns compile a comprehensive dossier on competitor strategies, including pricing algorithms and distribution networks</strong>, before the review meeting began."}, {"id": "160741", "question": "<strong>Select the option that expresses the given sentence in reported speech.</strong></p> <p>The compliance officer said to the senior analyst, \"Did you circulate this draft to external vendors before obtaining legal clearance, why did you omit the confidentiality clause when you sent it on Monday, and which department head approved this deviation?\"", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The compliance officer asked the senior analyst if he circulated this draft to external vendors before obtaining legal clearance, why the confidentiality clause was omitted when he sent it on Monday, and which department head was approving this deviation.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The compliance officer demanded that he should tell whether he circulated those drafts to external vendors before obtaining legal clearance and why had he omitted the confidentiality clause, and who had approved that deviation.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The compliance officer asked the senior analyst did he circulate this draft to external vendors before obtaining legal clearance, why did he omit the confidentiality clause when he sent it on Monday, and which department head approved this deviation.", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> The compliance officer asked the senior analyst whether he had circulated that draft to external vendors before obtaining legal clearance, why he had omitted the confidentiality clause when he sent it on Monday, and which department head had approved that deviation."], "correct_answer": 3, "solution": "D) In reported questions, wh-words such as when/why/which are retained, but the clauses switch to declarative order without auxiliary–subject inversion, and a yes/no question takes whether or if. Because the reporting verb is in the past, past-simple events that are prior in time backshift to the past perfect, so did circulate becomes had circulated, did omit becomes had omitted, and approved becomes had approved. Deictic words also shift appropriately, with this draft becoming that draft and this deviation becoming that deviation, and the second person pronouns change to third person.\n\nअप्रत्यक्ष वाक्य में प्रश्नवाचक वाक्यों के wh-शब्द वैसे ही बने रहते हैं, लेकिन सहायक क्रिया और कर्ता का उलट-फेर हटाकर वाक्य साधारण घोषणात्मक क्रम में रखा जाता है, तथा yes/no प्रकार के प्रश्न के लिए whether/if का प्रयोग किया जाता है। रिपोर्टिंग क्रिया भूत काल में होने के कारण समय में पूर्व घटित घटनाएँ past perfect में स्थानांतरित होती हैं; इसलिए did circulate → had circulated, did omit → had omitted, और approved → had approved हो जाता है। संकेतवाची शब्द भी बदलते हैं—this draft → that draft, this deviation → that deviation—और दूसरे पुरुष के सर्वनाम you/your का रूप third person में बदलता है।"}, {"id": "160743", "question": "<strong>Select the option that expresses the given sentence in reported speech.</strong></p> <p>The curator said, \"What a meticulous restoration this is! If only the grant committee had released the funds earlier, the fresco would not have suffered so much deterioration.\"", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> The curator exclaimed with admiration that the restoration was meticulous and added that if the grant committee had released the funds earlier, the fresco would not have suffered so much deterioration.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The curator said that the restoration had been very meticulous and hoped if the grant committee released the funds earlier, the fresco will not suffer much deterioration.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The curator exclaimed that how meticulous restoration it was and regretted that if the grant committee were to release the funds earlier, the fresco would not be suffering so much deterioration.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The curator exclaimed with joy that the restoration had been meticulous and wished the grant committee had released the funds earlier so that the fresco would not suffer so much deterioration."], "correct_answer": 0, "solution": "A) Exclamations of admiration are reported by converting the exclamatory form into a declarative content clause with an evaluative reporting phrase, so exclaimed with admiration that the restoration was meticulous conveys tone without the exclamation syntax. The second sentence expresses a true past counterfactual, had released … would not have suffered, which remains in the perfect conditional framework even after a past reporting verb because it encodes an unreal past condition and its unreal past result. Option A preserves both tone and meaning precisely; B needlessly backshifts the present evaluation and breaks sequence with will not suffer, C mishandles the exclamation structure and replaces the counterfactual with a speculative present frame, and D misreports tone and weakens the counterfactual result by using would not suffer instead of would not have suffered.\n\nप्रशंसात्मक विस्मयसूचक वाक्य को अप्रत्यक्ष रूप में घोषणात्मक वाक्य बनाकर, उपयुक्त भावसूचक वाक्यांश के साथ प्रस्तुत किया जाता है; अतः “exclaimed with admiration that the restoration was meticulous” बिना विस्मय-रूप के वही सराहना व्यक्त करता है। दूसरी पंक्ति वास्तविक भूतकालीन प्रतिकल्प (counterfactual) है—“had released … would not have suffered”—जो past reporting के बाद भी perfect conditional रूप में बनी रहती है, क्योंकि यह अवास्तविक भूत शर्त और उसके अवास्तविक भूत परिणाम को दर्शाती है। विकल्प A अर्थ और भाव, दोनों को यथावत रखता है; B अनावश्यक backshift कर देता है और “will not suffer” से काल-क्रम तोड़ देता है, C विस्मय संरचना और counterfactual दोनों का गलत रूप देता है, और D भाव को “with joy” कहकर बदल देता है तथा परिणाम को “would not have suffered” की जगह “would not suffer” करके कमज़ोर करता है।"}, {"id": "160739", "question": "<strong>Identify the part of the sentence which has an error:</strong></p> <p>She needs not worry about the final approval / as the project has already been cleared / by the regulatory authorities / after the thorough review process.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> She needs not worry about the final approval", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> as the project has already been cleared", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> by the regulatory authorities", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> after the thorough review process"], "correct_answer": 0, "solution": "A) ‘<strong>needs not</strong>’ गलत है क्योंकि जब <strong>need</strong> या <strong>dare</strong> के बाद <strong>not</strong> आता है, तो यह <strong>modal auxiliary</strong> बन जाता है और इसके बाद <strong>bare infinitive</strong> आता है। इस modal रूप में ‘s’ नहीं लगता — सही होगा <strong>need not</strong>।<br> उदाहरण — ✔ <strong>She need not go there.</strong> (✘ needs not go there)\n\n“<strong>Needs not</strong>” is incorrect because when <strong>need</strong> or <strong>dare</strong> is followed by <strong>not</strong>, it functions as a <strong>modal auxiliary</strong> and is followed by a <strong>bare infinitive</strong>. In this modal form, there is no ‘s’ in the third person singular — the correct form is <strong>need not</strong>.<br> Example — ✔ <strong>She need not go there.</strong> (✘ needs not go there)"}, {"id": "160744", "question": "<strong>Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the correct order to form a meaningful and coherent paragraph.</strong></p> <p><strong>P</strong>. In 2022, the coastal city’s public utility floated a small green-hydrogen pilot to power its fishing-ice plants during monsoon outages.<br> <strong>Q.</strong> The announcement, although tentative, immediately recalibrated vendor negotiations and pushed the finance department to ring-fence a contingency fund.<br> <strong>R.</strong> When field tests began, saline spray accelerated corrosion in the storage valves, forcing the team to redesign the enclosure.<br> <strong>S.</strong> To preserve the launch date, engineers switched to composite casings and added desiccant purgers, which incidentally reduced compressor noise near the docks.<br> <strong>T. </strong>These practical wins reassured the city council, and the pilot was upgraded into a multi-year program with clear milestones.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Q–P–R–S–T", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> P–Q–S–R–T", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> R–S–P–Q–T", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> P–Q–R–S–T"], "correct_answer": 3, "solution": "D) P–Q–R–S–T\n\nOpening needs a context-setting sentence with full nouns, not back-references. P introduces year, place, and project—so P is the natural start. Q begins with <strong>“The announcement”</strong>, a backward pointer that must refer to P; hence Q follows P (P→Q). R starts with <strong>“When field tests began,”</strong> indicating a time-progression after planning/funding; this fits after Q (planning → testing). S uses a purpose marker <strong>“To preserve the launch date”</strong>—a remedial step caused by the problem in R (corrosion → redesign → switch to composites), so R→S is tight cause-effect. Finally, T starts with <strong>“These practical wins”</strong>, a summarizing demonstrative requiring S’s outcomes (noise reduction, composite casings) as antecedents; thus S→T.<br> शुरुआत ऐसी लाइन से होनी चाहिए जो किसी पर निर्भर न हो—P यही करता है (year + city + project). Q का <strong>“The announcement”</strong> सीधे P की ओर इशारा करता है, इसलिए Q तभी आ सकता है जब P पहले हो. R में <strong>“When field tests began”</strong> टाइम-शिफ्ट है—funding/plan के बाद टेस्टिंग, इसलिए Q के बाद. S में <strong>“To preserve the launch date”</strong>—R की समस्या (corrosion) के समाधान के रूप में आता है. T का <strong>“These practical wins”</strong> S की उपलब्धियों को समेटता है; इसलिए अंतिम T."}, {"id": "160733", "question": "<strong>In each of the following questions, a part of the sentence is printed in bold. Choose the option that best improves the bold part. If no improvement is required, select No improvement.</strong></p> <p>Compared with last quarter’s volatile figures, the company’s revenue trajectory is <strong>more better than analysts had anticipated during the earnings preview</strong>, and this has sparked renewed confidence among cautious institutional investors.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> No improvement", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> better than analysts had, by far, anticipated during their earnings preview discussions", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> much more better than the analysts had originally anticipated during the earnings preview", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> better than what analysts had anticipated during the earnings preview"], "correct_answer": 3, "solution": "D) ‘<strong>more better</strong>’ के बदले केवल <strong>‘better’</strong> का प्रयोग होगा, क्योंकि <strong>double comparative</strong> वर्जित है; ‘better’ स्वयं comparative है, इसलिए उसके साथ ‘more’ नहीं लगेगा।<br> जैसे— This route is <strong>better</strong> than the one we took yesterday.\n\n• <strong>‘better than what analysts had anticipated during the earnings preview’</strong> will be used instead of <strong>‘more better than analysts had anticipated during the earnings preview’</strong> because <strong>‘better’</strong> is already a comparative form; adding <strong>‘more’</strong> creates an incorrect double comparative.<br> Like— This plan is <strong>better than</strong> the alternative we considered."}, {"id": "160747", "question": "<strong>Select the best express Synonym of the given highlighted word.</strong></p> <p>GDP growth is often used as a <strong>benchmark</strong> for economic health.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Anomaly", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Yardstick", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Exception", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Irregularity"], "correct_answer": 1, "solution": "<strong>B) Benchmark (noun)</strong> – standard, criterion, yardstick, reference, measure (मानक)\n\n<strong>Synonym:</strong> <strong>Yardstick</strong> – a standard for comparison (मापदंड)\n\n<strong>Anomaly (noun)</strong> – deviation from the norm (विसंगति)\n\n<strong>Exception (noun)</strong> – not conforming to a rule (अपवाद)\n\n<strong>Irregularity (noun)</strong> – lack of uniformity (अनियमितता)"}, {"id": "160703", "question": "<strong>Comprehension:</strong></p> <p><strong>In the following passage, some words have been deleted. Read the passage carefully and select the most appropriate option to fill in each blank.</strong></p> <p>Over the past two decades, China has entrenched _______1_____ as a dominant actor in Africa’s mining sector. But signs are mounting that the ______2______is beginning to turn. A new wave of resistance, driven by increased scrutiny from African governments as well as civil society activism, _______3_____starting to challenge China’s long-standing dominance in Africa’s mining industry. Chinese firms have often failed to deliver promised skills transfer or infrastructure. Consequently, African nations are growingly ______4______their rights to value-added development. The old model of raw resource extraction in exchange for infrastructure or investments is no longer ______5______ in a region demanding agency, accountability, and economic sovereignty.</p> <p><strong>Select the most appropriate option to fill in blank number 1.</strong>", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> himself", "<p style=\"displa
