            <div class="final-score">
                <div class="score-text" id="finalScore">0 Marks</div>
                <div class="percentage-text" id="finalPercentage">0%</div>
            </div>
            <div class="modal-actions">
                <button class="modal-btn primary" onclick="viewSolutions()">
                    View Solutions
                </button>
                <button class="modal-btn success" onclick="retakeTest()">
                    Retake Test
                </button>
            </div>
        </div>
    </div>
    
    <script>
        // Core Variables
        const questions = [{"id": "136409", "question": "<strong>Select the best express synonym of the given underlined word.</strong></p> <p>Excessive regulations could <ins><strong>throttle</strong> </ins>innovation in emerging industries.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Release", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Liberate", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Free", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Suppress"], "correct_answer": 3, "solution": "<strong>D) Throttle</strong> (verb) – Suppress, choke, strangle, restrain, hinder दबाना\n\n<strong>Synonym:</strong> <strong>Suppress</strong> (verb) – Subdue, inhibit, restrain, throttle. दबाना\n\n<strong>Release</strong> (verb) – Free, liberate, let go. रिहा करना\n\n<strong>Liberate</strong> (verb) – Free, release, emancipate. मुक्त करना\n\n<strong>Free</strong> (verb) – Release, liberate, unbind. आज़ाद"}, {"id": "136419", "question": "<strong>Select the best express Antonym of the given underlined word.</strong></p> <p>The announcement of new regulations caused a <ins><strong>heightened</strong> </ins>sense of urgency among investors.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Stabilized", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Decreased", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Intensified", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Amplified"], "correct_answer": 1, "solution": "<strong>B) Heightened</strong> (adjective) – Increased, intensified, amplified, escalated, elevated बढ़ा<strong> </strong>हुआ\n\nAntonym: Decreased</strong> (adjective) – Reduced, diminished, lowered, lessened. घटा हुआ<strong>\n\nStabilized</strong> (adjective) – Made stable, steady, fixed. स्थिर<strong>\n\n<strong>Intensified</strong> (adjective) – Made more intense, strengthened, deepened. तीव्र किया हुआ\n\n<strong>Amplified</strong> (adjective) – Increased, magnified, boosted. बढ़ाया हुआ"}, {"id": "136410", "question": "<strong>Select the best express synonym of the given underlined word.</strong></p> <p>Economic <ins><strong>stagnation</strong> </ins>in the region has led to high unemployment rates and declining living standards.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Solemn", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Redundant", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Dignified", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Slowdown"], "correct_answer": 3, "solution": "<strong>D) Stagnation</strong> (noun) – Lack of growth, inactivity, standstill, slowdown, recession आर्थिक<strong> </strong>सुस्ती\n\n<strong>Synonym</strong>: <strong>Slowdown (noun)</strong> – A decrease in rate or intensity, inactivity, stagnation. मंदी\n\n<strong>Solemn</strong> (adjective) – Formal and dignified, sacred, holy पवित्र\n\n<strong>Redundant</strong> (adjective) – Not or no longer needed or useful; superfluous, unnecessary, not required. अतिरिक्त\n\n<strong>Dignified</strong> (adjective) – Having or showing a composed or serious manner that is worthy of respect, stately, august. सम्मानजनक"}, {"id": "136420", "question": "<strong>Select the best express Antonym of the given underlined word.</strong></p> <p>The engine began <ins><strong>sputtering</strong> </ins>halfway through the journey, indicating a possible malfunction.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Flourishing", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Succulent", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Breach", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Juicy"], "correct_answer": 0, "solution": "<strong>A) Sputtering</strong> (adjective) – Struggling, stalling, slowing down, faltering, weakening धीमा<strong> </strong>पड़ता<strong> </strong>हुआ\n\n<strong>Antonym:</strong> <strong>Flourishing</strong> (adjective) – Thriving, prospering, booming, growing. पनपता हुआ\n\n<strong>Succulent</strong> (adjective) – Tender, juicy, and tasty, especially of food. रसीला\n\n<strong>Breach</strong> (verb) – Break or violate a rule, agreement, or boundary. उल्लंघन करना\n\n<strong>Juicy</strong> (adjective) – Full of juice; moist and tender. रसदार"}, {"id": "136411", "question": "<strong>Select the best express synonym of the given underlined word.</strong></p> <p>The debate seemed to <ins><strong>protract</strong> </ins>unnecessarily due to the participants' reluctance to compromise.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Prolonged", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Secrecy", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Caution", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Mystery"], "correct_answer": 0, "solution": "<strong>A) Protract</strong> (verb) – Prolong, extend, delay, lengthen, drag out विलंब<strong> </strong>करना\n\n<strong>Synonym:</strong> <strong>Prolonged</strong> (verb) – Extend the duration of. लंबा करना\n\n<strong>Secrecy</strong> (noun) – The action of keeping something secret or the state of being kept secret. गुप्तता\n\n<strong>Caution</strong> (noun) – Care taken to avoid danger or risks, prudence, carefulness. सतर्कता\n\n<strong>Mystery</strong> (noun) – Something that is difficult or impossible to understand or explain, enigmatic, puzzle. रहस्य"}, {"id": "136421", "question": "<strong>Select the best express antonym of the given underlined word.</strong></p> <p>The <ins><strong>pesky</strong> </ins>mosquitoes made it impossible to enjoy the evening by the lake, as they swarmed around everyone relentlessly.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Encompass", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Immobile", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Exclude", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Pleasant"], "correct_answer": 3, "solution": "<strong>D) Pesky</strong> (adjective) – Annoying, troublesome, irritating, bothersome, unwelcome परेशान<strong> </strong>करने वाला,\n\n<strong>Antonym: Pleasant</strong> (adjective) – Giving a sense of happy satisfaction or enjoyment. सुखद\n\n<strong>Encompass</strong> (verb) – Include, cover, embrace, span सम्मिलित करना\n\n<strong>Immobile</strong> (adjective) – Not moving, motionless, static. अस्थिर\n\n<strong>Exclude</strong> (verb) – Omit, leave out, reject, prevent inclusion. बहिष्कृत करना"}, {"id": "136412", "question": "<strong>Select the best express synonym of the given underlined word.</strong></p> <p>Industrial waste continued to <ins><strong>contaminate</strong> </ins>the river, endangering the wildlife that depended on it for survival.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Frailty", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Encompass", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Pollute", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Endless"], "correct_answer": 2, "solution": "<strong>C) Contaminate</strong> (verb) – Pollute, infect, taint, spoil, defile प्रदूषित<strong> </strong>करना\n\n<strong>Synonym: Pollute</strong> (verb) – To make (water, air, soil, etc.) dirty or harmful by adding harmful substances. दूषित करना\n\n<strong>Frailty</strong> (noun) – Weakness, delicacy, fragility, feebleness कमज़ोरी\n\n<strong>Encompass</strong> (verb) – To surround, include, or cover something completely, encircle, embrace. घेरना या समाहित करना\n\n<strong>Endless</strong> (adjective) – Without any limit or end, infinite, perpetual, eternal. अंतहीन"}, {"id": "136422", "question": "<strong>Select the best express antonym of the given underlined word.</strong></p> <p><ins><strong>Advocacy</strong> </ins>for environmental protection has increased significantly in recent years, with more people backing sustainable practices.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Rummage", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Opposition", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Proletariat", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Chimera"], "correct_answer": 1, "solution": "<strong>B) Advocacy</strong> (noun) – Support, promotion, defense, backing समर्थन\n\n<strong>Antonym</strong>: <strong>Opposition</strong> (noun) – Resistance or dissent, expressed in action or argument. विरोध\n\n<strong>Rummage</strong> (verb) – To search unsystematically and untidily through something. तलाशना\n\n<strong>Proletariat</strong> (noun) – The working-class people, especially in the context of Marxist theory. सर्वहारा\n\n<strong>Chimera</strong> (noun) – A thing that is hoped for but is illusory or impossible to achieve. कल्पना"}, {"id": "136413", "question": "<strong>Select the best express synonym of the given underlined word.</strong></p> <p>The political <ins><strong>fallout</strong> </ins>from the scandal was severe, leading to several resignations.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Consequence", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Abscond", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Bombastic", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Schematising"], "correct_answer": 0, "solution": "<strong>A) Fallout</strong> (noun) – Consequence, aftermath, impact, repercussion, result प्रभाव\n\n<strong>Synonym:</strong> <strong>Consequence</strong> (noun) – A result or effect of an action or condition. परिणाम\n\n<strong>Abscond</strong> (verb) – Fled away hurriedly and secretly. भाग जाना\n\n<strong>Bombastic</strong> (adjective) – High-flown and pretentious language used to impress people. आडंबरपूर्ण भाषा\n\n<strong>Schematising</strong> (noun) – The act of forming a plan or scheme. योजना बनाना"}, {"id": "136423", "question": "<strong>Select the best express antonym of the given underlined word.</strong></p> <p>After a <ins><strong>stumbling</strong> </ins>start, the speaker finally found his rhythm and delivered an impressive speech.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Sanatorium", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Nursery", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Aviary", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Steady"], "correct_answer": 3, "solution": "<strong>D) Stumbling</strong> (adjective) – Faltering, struggling, unsteady, uncertain, wavering लड़खड़ाता हुआ\n\n<strong>Antonym: Steady</strong> (adjective) – Firmly fixed, supported, or balanced; not shaking or moving. स्थिर\n\n<strong>Sanatorium</strong> (noun) – an establishment for the medical treatment of people who are convalescing or have a chronic illness. आरोग्याश्रम\n\n<strong>Nursery</strong> (noun) – a place where young children and babies are cared for. बालसदन\n\n<strong>Aviary</strong> (noun) – a large cage, building, or enclosure for keeping birds in. पक्षीशाला"}, {"id": "136414", "question": "<strong>Select the best express synonym of the given underlined word.</strong></p> <p>The athlete's <ins><strong>rebound</strong> </ins>from injury was inspiring, showing great determination and strength.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Recovery", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Cordial", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Demented", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Absurd"], "correct_answer": 0, "solution": "<strong>A) Rebound</strong> (noun) – Recovery, resurgence, revival, comeback, improvement पुनरुद्धार\n\n<strong>Synonym: Recovery</strong> (noun) – A return to a normal state of health, mind, or strength. स्वास्थ्य लाभ\n\n<strong>Cordial</strong> (adjective) – friendly, warm, amicable, affable, genial सौहार्दपूर्ण / मैत्रीपूर्ण\n\n<strong>Demented</strong> (adjective) – Driven to behave irrationally due to anger or excitement, mad, insane. विकृत मस्तिष्क वाला(पागल)\n\n<strong>Absurd</strong> (adjective) – Wildly unreasonable, illogical, or inappropriate, ridiculous. बेतुका"}, {"id": "136424", "question": "<strong>Select the best express antonym of the given underlined word.</strong></p> <p>The team had to <ins><strong>stem</strong> </ins>the flow of water to prevent the basement from flooding during the storm.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Promote", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Intensify", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Hire", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Train"], "correct_answer": 1, "solution": "<strong>B) Stem</strong> (verb) – Stop, control, curb, restrain, check रोकना\n\n<strong>Antonym: Intensify</strong> (verb) – To increase in degree, strengthen, amplify. बढ़ाना\n\n<strong>Promote</strong> (verb) – To advance someone to a higher position or rank. पदोन्नति देना\n\n<strong>Hire</strong> (verb) – To employ someone for a job. नौकरी पर रखना\n\n<strong>Train</strong> (verb) – To teach someone the skills needed for a particular job or activity. प्रशिक्षण देना"}, {"id": "136415", "question": "<strong>Select the best express synonym of the given underlined word.</strong></p> <p>The sudden policy change began to <ins><strong>roil</strong> </ins>the calm waters of the corporate sector.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Generous", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Envious", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Jealous", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Disrupt"], "correct_answer": 3, "solution": "<strong>D) Roil</strong> (verb) – Disturb, disrupt, unsettle, shake up, agitate अशांत करना\n\n<strong>Synonym: Disrupt</strong> (verb) – Disturb, unsettle, interrupt, disarrange. व्यवधान डालना\n\n<strong>Generous</strong> (adjective) – Willing to give or share, unselfish. उदार\n\n<strong>Envious</strong> (adjective) – Feeling discontent or longing for someone else's possessions or qualities. ईर्ष्यालु\n\n<strong>Jealous</strong> (adjective) – Feeling envious or protective of what one perceives as theirs. ईर्ष्यालु"}, {"id": "136425", "question": "<strong>Select the best express antonym of the given underlined word.</strong></p> <p>The new regulations were <ins><strong>imposed</strong> </ins>by the government in an attempt to control pollution.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Repealed", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Brash", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Timid", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Confident"], "correct_answer": 0, "solution": "<strong>A) Impose</strong> (verb) – Enforce, implement, apply, levy, mandate थोपना\n\n<strong>Antonym: Repealed</strong> (verb) – To revoke or annul a law or congressional act. निरस्त करना\n\n<strong>Brash</strong> (adjective) – Self-assertive in a rude, noisy, or overbearing way, bold, impudent. अक्खड़/ ढीठ\n\n<strong>Timid</strong> (adjective) – Showing a lack of courage or confidence, easily frightened, shy. डरपोक\n\n<strong>Confident</strong> (adjective) – Feeling or showing certainty about something, self-assured. आत्मविश्वासी"}, {"id": "136416", "question": "<strong>Select the best express synonym of the given underlined word.</strong></p> <p>He is very <ins><strong>keen</strong> </ins>on learning new languages, especially those that are less commonly spoken.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Endanger", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Eager", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Impair", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Compromise"], "correct_answer": 1, "solution": "<strong>B) Keen</strong> (on) (adjective) – Interested in, eager, enthusiastic about, passionate about उत्सुक\n\n<strong>Synonym: Eager (adjective)</strong> – Keen, enthusiastic, excited, anxious. उत्सुक\n\n<strong>Endanger</strong> (verb) – To put someone or something at risk or in danger. संकट में डालना\n\n<strong>Impair</strong> (verb) – To weaken or damage something, especially a faculty or function. नुकसान पहुंचाना\n\n<strong>Compromise</strong> (verb) – To weaken or reduce the quality, value, or effectiveness of something. समझौता करना, कमजोर करना"}, {"id": "136426", "question": "<strong>Select the best express antonym of the given underlined word.</strong></p> <p>Teachers often <ins><strong>encourage</strong> </ins>their students to think critically and creatively to enhance their learning outcomes.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Admirable", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Uncomfortable", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Filthy", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Discourage"], "correct_answer": 3, "solution": "<strong>D) Encourage (verb)</strong> – Motivate, Inspire, Support, Boost, Foster प्रोत्साहित करना\n\n<strong>Antonym</strong>: <strong>Discourage</strong> (verb) – Deter, dissuade, dishearten, demotivate. हतोत्साहित करना\n\n<strong>Admirable</strong> (adjective) – Deserving respect or approval; inspiring approval or affection. प्रशंसनीय\n\n<strong>Uncomfortable</strong> (adjective) – Causing or feeling slight pain or physical discomfort, uneasy, restless, troubled. असुविधाजनक\n\n<strong>Filthy</strong> (adjective) – Very dirty, unclean, sullied, grimy, mucky. गंदा"}, {"id": "136417", "question": "<strong>Select the best express synonym of the given underlined word.</strong></p> <p>She faced an <ins><strong>unenviable</strong> </ins>task of cleaning up after the massive event.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Undesirable", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Lackluster", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Exposure", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Imbecility"], "correct_answer": 0, "solution": "<strong>A) Unenviable</strong> (adjective) – Difficult, undesirable, challenging, tough, unpleasant कठिन\n\n<strong>Synonym: Undesirable</strong> (adjective) – Not wanted or desirable because harmful, objectionable, or unpleasant. अवांछनीय\n\n<strong>Lackluster</strong> (adjective) – Lacking in vitality, force, or conviction; without sparkle or shine, uninspiring, dull. नीरस\n\n<strong>Exposure</strong> (noun) – encounter, experience, contact, introduction, unveiling संपर्क\n\n<strong>Imbecility</strong> (noun) – The quality of being foolish; lack of intelligence or good judgment. मूर्खता"}, {"id": "136427", "question": "<strong>Select the best express antonym of the given underlined word.</strong></p> <p>Driving at high speeds in such foggy conditions is extremely <ins><strong>reckless</strong> </ins>and dangerous.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Sebnator", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Dictator", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Cautious", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Sovereign"], "correct_answer": 2, "solution": "<strong>C) Reckless</strong> (adjective) – Careless, thoughtless, rash, irresponsible लापरवाह\n\n<strong>Antonym</strong>: <strong>Cautious</strong> (adjective) – (Of a person) careful to avoid potential problems or dangers. सावधान\n\n<strong>Sebnator</strong> (noun) – A member of a senate, typically part of a legislative assembly. सीनेटर/सांसद\n\n<strong>Dictator</strong> (noun) – A person who rules with absolute power and authority. तानाशाह\n\n<strong>Sovereign</strong> (noun) – A supreme ruler, especially a monarch, but not necessarily one with unchecked power. सर्वोच्च शासक/सत्ता"}, {"id": "136418", "question": "<strong>Select the best express synonym of the given underlined word.</strong></p> <p>The film challenged the common <ins><strong>stereotype</strong> </ins>that superheroes must always be young and physically imposing.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Fragile", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Strategies", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Generalization", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Innovative"], "correct_answer": 2, "solution": "<strong>C) Stereotype (noun)</strong> – Generalization, Cliché, Preconception, Bias, Label रूढ़िवादिता\n\n<strong>Synonym</strong>: <strong>Generalization</strong> (noun) – Simplification, stereotype, broad statement, abstraction. सामान्यीकरण\n\n<strong>Fragile</strong> (adjective) – Easily broken, delicate, brittle. नाजुक\n\n<strong>Strategies</strong> (noun) – A plan, tactic, or technique designed to achieve a particular goal. रणनीति\n\n<strong>Innovative</strong> (adjective) – Featuring new methods or ideas, inventive, pioneering. अभिनव"}, {"id": "136428", "question": "<strong>Select the best express Antonym of the given underlined word.</strong></p> <p>His <ins><strong>callous</strong> </ins>disregard for the welfare of his employees resulted in a high turnover rate at the company.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Crisis", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Complication", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Compassionate", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Difficulty"], "correct_answer": 2, "solution": "<strong>C) Callous</strong> (adjective) – Heartless, insensitive, unfeeling, indifferent, ruthless निर्दयी\n\n<strong>Antonym: Compassionate</strong> (adjective) – Feeling or showing sympathy and concern for others. दयालु\n\n<strong>Crisis</strong> (noun) – A time of intense difficulty, trouble, or danger; a turning point. संकट\n\n<strong>Complication</strong> (noun) – A situation or condition that complicates or makes something more difficult, challenging, or intricate. जटिलता\n\n<strong>Difficulty</strong> (noun) – The state or condition of being hard to achieve or accomplish; a challenging situation. कठिनाई"}];
        const examConfig = {
            id: '6774',
            duration: 20,
            positiveMarks: 1.0,
            negativeMarks: 0.25
        };
        
        let currentQuestionIndex = 0;
        let userAnswers = {};
        let flaggedQuestions = new Set();
        let timeLeft = examConfig.duration * 60;
        let timerInterval;
        let isTestFinished = false;
        let solutionMode = false;
        let touchStartX = 0;
        let touchStartY = 0;
        
        // Initialize app
        function initializeApp() {
            createParticles();
            generateQuestionsGrid();
            loadQuestion();
            startTimer();
            setupTouchGestures();
            setupAutoSave();
            
            // Prevent accidental page leave
            window.addEventListener('beforeunload', (e) => {
                if (!isTestFinished) {
                    e.preventDefault();
                    e.returnValue = 'Test in progress. Are you sure you want to leave?';
                }
            });
        }
        
        // Create floating particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = window.innerWidth < 768 ? 20 : 40;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 3 + 3) + 's';
                particlesContainer.appendChild(particle);
            }
        }
        
        // Load current question
        function loadQuestion() {
            const question = questions[currentQuestionIndex];
            
            // Update question info
            document.getElementById('questionNumber').textContent = `Q${currentQuestionIndex + 1}`;
            document.getElementById('questionProgress').textContent = 
                `${currentQuestionIndex + 1} of ${questions.length}`;
            document.getElementById('questionText').innerHTML = question.question;
            
            // Load options
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            
            question.options.forEach((option, index) => {
                const optionElement = document.createElement('div');
                optionElement.className = 'option';
                optionElement.innerHTML = option;
                
                const indicator = document.createElement('div');
                indicator.className = 'option-indicator';
                optionElement.appendChild(indicator);
                
                if (solutionMode) {
                    // Show solution mode styling
                    if (index === question.correct_answer) {
                        optionElement.classList.add('correct');
                        indicator.textContent = '✓';
                    } else if (userAnswers[currentQuestionIndex] === index) {
                        optionElement.classList.add('incorrect');
                        indicator.textContent = '✗';
                    } else {
                        optionElement.classList.add('disabled');
                    }
                    optionElement.style.pointerEvents = 'none';
                } else {
                    // Normal mode
                    if (userAnswers[currentQuestionIndex] === index) {
                        optionElement.classList.add('selected');
                        indicator.textContent = '✓';
                    }
                    
                    optionElement.onclick = () => selectOption(index);
                    optionElement.onkeydown = (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            selectOption(index);
                        }
                    };
                    optionElement.tabIndex = 0;
                }
                
                optionsContainer.appendChild(optionElement);
            });
            
            // Handle solution panel
            const solutionPanel = document.getElementById('solutionPanel');
            if (solutionMode && question.solution) {
                document.getElementById('solutionContent').innerHTML = question.solution;
                solutionPanel.classList.add('show');
            } else {
                solutionPanel.classList.remove('show');
            }
            
            // Update navigation
            updateNavigation();
            updateQuestionsGrid();
            updateFlagButton();
            
            // Add entrance animation
            const container = document.getElementById('questionContainer');
            container.style.transform = 'translateY(20px)';
            container.style.opacity = '0';
            setTimeout(() => {
                container.style.transform = 'translateY(0)';
                container.style.opacity = '1';
            }, 100);
        }
        
        // Select an option
        function selectOption(index) {
            if (solutionMode) return;
            
            const currentAnswer = userAnswers[currentQuestionIndex];
            
            if (currentAnswer === index) {
                // Deselect if clicking the same option
                delete userAnswers[currentQuestionIndex];
            } else {
                // Select new option
                userAnswers[currentQuestionIndex] = index;
            }
            
            // Update UI
            const options = document.querySelectorAll('.option');
            options.forEach((option, i) => {
                const indicator = option.querySelector('.option-indicator');
                if (userAnswers[currentQuestionIndex] === i) {
                    option.classList.add('selected');
                    indicator.textContent = '✓';
                } else {
                    option.classList.remove('selected');
                    indicator.textContent = '';
                }
            });
            
            updateQuestionsGrid();
            showAutoSave();
        }
        
        // Generate questions grid
        function generateQuestionsGrid() {
            const grid = document.getElementById('questionsGrid');
            grid.innerHTML = '';
            
            questions.forEach((_, index) => {
                const button = document.createElement('button');
                button.className = 'question-btn';
                button.textContent = index + 1;
                button.onclick = () => goToQuestion(index);
                button.setAttribute('aria-label', `Go to question ${index + 1}`);
                grid.appendChild(button);
            });
        }
        
        // Update questions grid styling
        function updateQuestionsGrid() {
            const buttons = document.querySelectorAll('.question-btn');
            buttons.forEach((button, index) => {
                button.className = 'question-btn';
                
                if (index === currentQuestionIndex) {
                    button.classList.add('current');
                } else if (solutionMode) {
                    if (userAnswers[index] === questions[index].correct_answer) {
                        button.classList.add('correct');
                    } else if (userAnswers[index] !== undefined) {
                        button.classList.add('incorrect');
                    }
                } else if (userAnswers[index] !== undefined) {
                    button.classList.add('answered');
                }
                
                if (flaggedQuestions.has(index)) {
                    button.classList.add('flagged');
                }
            });
        }
        
        // Navigation functions
        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
            }
        }
        
        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else if (!solutionMode) {
                submitTest();
            }
        }
        
        function goToQuestion(index) {
            currentQuestionIndex = index;
            loadQuestion();
            closeSidebar();
        }
        
        function updateNavigation() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            
            prevBtn.disabled = currentQuestionIndex === 0;
            
            if (solutionMode) {
                nextBtn.textContent = currentQuestionIndex === questions.length - 1 ? 
                    'Finish Review' : 'Next →';
                nextBtn.onclick = currentQuestionIndex === questions.length - 1 ? 
                    finishReview : nextQuestion;
            } else {
                nextBtn.textContent = currentQuestionIndex === questions.length - 1 ? 
                    'Submit Test' : 'Next →';
                nextBtn.onclick = currentQuestionIndex === questions.length - 1 ? 
                    submitTest : nextQuestion;
            }
        }
        
        // Timer functions
        function startTimer() {
            const timerElement = document.getElementById('timer');
            const progressCircle = document.getElementById('progressCircle');
            const circumference = 2 * Math.PI * 18;
            const totalTime = examConfig.duration * 60;
            
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    submitTest();
                    return;
                }
                
                timeLeft--;
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerElement.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                
                // Update progress circle
                const progress = (totalTime - timeLeft) / totalTime;
                const offset = circumference * progress;
                progressCircle.style.strokeDashoffset = offset;
                
                // Add warning effects
                if (timeLeft <= 300) { // 5 minutes
                    timerElement.classList.add('warning');
                }
                if (timeLeft <= 60) { // 1 minute
                    timerElement.classList.add('critical');
                }
            }, 1000);
        }
        
        // Toggle question flag
        function toggleFlag() {
            if (flaggedQuestions.has(currentQuestionIndex)) {
                flaggedQuestions.delete(currentQuestionIndex);
            } else {
                flaggedQuestions.add(currentQuestionIndex);
            }
            updateFlagButton();
            updateQuestionsGrid();
        }
        
        function updateFlagButton() {
            const flagBtn = document.getElementById('flagBtn');
            if (flaggedQuestions.has(currentQuestionIndex)) {
                flagBtn.textContent = '🏴 Unflag Question';
                flagBtn.style.background = 'rgba(239, 68, 68, 0.2)';
                flagBtn.style.color = 'var(--error)';
            } else {
                flagBtn.textContent = '🚩 Flag Question';
                flagBtn.style.background = 'rgba(245, 158, 11, 0.2)';
                flagBtn.style.color = 'var(--warning)';
            }
        }
        
        // Theme toggle
        function toggleTheme() {
            const body = document.body;
            const themeBtn = document.getElementById('themeBtn');
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            body.setAttribute('data-theme', newTheme);
            themeBtn.textContent = newTheme === 'light' ? '🌙' : '☀️';
            
            // Save preference
            localStorage.setItem('theme', newTheme);
        }
        
        // Sidebar functions
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            
            sidebar.classList.toggle('open');
            overlay.classList.toggle('show');
        }
        
        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('show');
        }
        
        // Touch gesture support
        function setupTouchGestures() {
            const main = document.querySelector('.main');
            
            main.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            });
            
            main.addEventListener('touchend', (e) => {
                const touchEndX = e.changedTouches[0].clientX;
                const touchEndY = e.changedTouches[0].clientY;
                const deltaX = touchEndX - touchStartX;
                const deltaY = touchEndY - touchStartY;
                
                // Only trigger if horizontal swipe is dominant
                if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 50) {
                    if (deltaX > 0 && currentQuestionIndex > 0) {
                        // Swipe right - previous question
                        previousQuestion();
                    } else if (deltaX < 0 && currentQuestionIndex < questions.length - 1) {
                        // Swipe left - next question
                        nextQuestion();
                    }
                }
            });
        }
        
        // Auto-save functionality
        function setupAutoSave() {
            // Save answers periodically
            setInterval(() => {
                if (!isTestFinished) {
                    saveProgress();
                }
            }, 30000); // Every 30 seconds
        }
        
        function saveProgress() {
            const progress = {
                answers: userAnswers,
                flagged: Array.from(flaggedQuestions),
                currentQuestion: currentQuestionIndex,
                timeLeft: timeLeft
            };
            
            // In a real implementation, this would save to a server
            console.log('Progress saved:', progress);
        }
        
        function showAutoSave() {
            const autoSave = document.getElementById('autoSave');
            autoSave.classList.add('show');
            setTimeout(() => {
                autoSave.classList.remove('show');
            }, 2000);
        }
        
        // Submit test
        function submitTest() {
            if (isTestFinished) return;
            
            isTestFinished = true;
            clearInterval(timerInterval);
            
            // Calculate results
            let correct = 0, wrong = 0, skipped = 0, totalMarks = 0;
            
            questions.forEach((question, index) => {
                if (userAnswers[index] === undefined) {
                    skipped++;
                } else if (userAnswers[index] === question.correct_answer) {
                    correct++;
                    totalMarks += examConfig.positiveMarks;
                } else {
                    wrong++;
                    totalMarks -= examConfig.negativeMarks;
                }
            });
            
            const maxMarks = questions.length * examConfig.positiveMarks;
            const percentage = Math.max(0, Math.round((totalMarks / maxMarks) * 100));
            
            // Show results
            document.getElementById('resultTitle').textContent = 
                `${correct}/${questions.length} Correct`;
            document.getElementById('resultSubtitle').textContent = 
                `You scored ${totalMarks} out of ${maxMarks} marks`;
            document.getElementById('correctCount').textContent = correct;
            document.getElementById('wrongCount').textContent = wrong;
            document.getElementById('skippedCount').textContent = skipped;
            document.getElementById('finalScore').textContent = `${totalMarks} Marks`;
            document.getElementById('finalPercentage').textContent = `${percentage}%`;
            
            document.getElementById('resultModal').classList.add('show');
            closeSidebar();
        }
        
        // View solutions
        function viewSolutions() {
            document.getElementById('resultModal').classList.remove('show');
            solutionMode = true;
            currentQuestionIndex = 0;
            loadQuestion();
        }
        
        // Finish review
        function finishReview() {
            solutionMode = false;
            currentQuestionIndex = 0;
            loadQuestion();
        }
        
        // Retake test
        function retakeTest() {
            if (confirm('Are you sure you want to retake the test? All progress will be lost.')) {
                location.reload();
            }
        }
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (solutionMode) return;
            
            switch(e.key) {
                case 'ArrowLeft':
                    e.preventDefault();
                    previousQuestion();
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    nextQuestion();
                    break;
                case 'f':
                case 'F':
                    if (e.ctrlKey || e.metaKey) {
                        e.preventDefault();
                        toggleFlag();
                    }
                    break;
                case 'm':
                case 'M':
                    if (e.ctrlKey || e.metaKey) {
                        e.preventDefault();
                        toggleSidebar();
                    }
                    break;
                case '1':
                case '2':
                case '3':
                case '4':
                    if (!e.ctrlKey && !e.metaKey) {
                        e.preventDefault();
                        const optionIndex = parseInt(e.key) - 1;
                        if (optionIndex < questions[currentQuestionIndex].options.length) {
                            selectOption(optionIndex);
                        }
                    }
                    break;
            }
        });
        
        // Initialize when DOM is loaded
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeApp);
        } else {
            initializeApp();
        }
        
        // Load saved theme
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            document.body.setAttribute('data-theme', savedTheme);
            document.getElementById('themeBtn').textContent = savedTheme === 'light' ? '🌙' : '☀️';
        }
    </script>
</body>
</html>
