<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6366f1">
    <title>devgagan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #06b6d4;
            
            --glass-bg: rgba(255, 255, 255, 0.95);  /* Changed from 0.25 to 0.95 */
            --glass-border: rgba(255, 255, 255, 0.8);  /* Changed from 0.18 to 0.8 */
            --shadow-light: 0 8px 32px rgba(31, 38, 135, 0.37);
            --shadow-heavy: 0 20px 60px rgba(0, 0, 0, 0.3);
            
            --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --bounce: cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        
[data-theme="light"] {
    --bg: #ffffff;  /* Changed from gradient to solid white */
    --card-bg: #ffffff;  /* Changed from transparent to solid white */
    --text: #1a202c;
    --text-secondary: #4a5568;
    --border: rgba(0, 0, 0, 0.1);  /* Changed to darker border for contrast */
    --nav-bg: #ffffff;  /* Changed from transparent to solid white */
}

[data-theme="dark"] {
    --bg: #1a1a2e;  /* Changed from gradient to solid dark */
    --card-bg: #16213e;  /* Changed from transparent to solid dark */
    --text: #f7fafc;
    --text-secondary: #a0aec0;
    --border: rgba(255, 255, 255, 0.1);
    --nav-bg: #0c0c0c;  /* Changed from transparent to solid dark */
}
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--bg);  /* Now just using the solid color */
    z-index: -1;
}
        
        /* Floating particles animation */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: float 6s infinite ease-in-out;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.7; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 0.3; }
        }
        
        /* Header with glassmorphism */
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 16px 20px;
            z-index: 100;
            transition: var(--transition);
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .menu-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            font-size: 18px;
        }
        
        .menu-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-light);
        }
        
        .menu-btn:active {
            transform: scale(0.95);
        }
        
        .logo {
            font-weight: 800;
            font-size: 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        
        [data-theme="dark"] .logo {
    background: none;
    -webkit-text-fill-color: white; /* White text in dark mode */
    color: white; /* Fallback */
}
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            font-size: 20px;
        }
        
        .theme-toggle:hover {
            transform: rotate(180deg) scale(1.1);
            box-shadow: var(--shadow-light);
        }
        
        /* Advanced Timer */
        .timer-container {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .timer {
            background: linear-gradient(135deg, var(--error), #dc2626);
            color: white;
            padding: 12px 16px;
            border-radius: 16px;
            font-family: 'Inter', monospace;
            font-weight: 600;
            font-size: 14px;
            box-shadow: var(--shadow-light);
            position: relative;
            overflow: hidden;
        }
        
        .timer.warning {
            animation: pulse 1s infinite;
        }
        
        .timer.critical {
            animation: shake 0.5s infinite;
            background: linear-gradient(135deg, #dc2626, #991b1b);
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
        }
        
        .progress-ring {
            width: 40px;
            height: 40px;
            transform: rotate(-90deg);
        }
        
        .progress-circle {
            fill: none;
            stroke: rgba(255, 255, 255, 0.3);
            stroke-width: 3;
        }
        
        .progress-circle.progress {
            stroke: var(--primary);
            stroke-linecap: round;
            transition: stroke-dashoffset 0.3s ease;
        }
        
        /* Main Content */
        .main {
            margin: 80px 0 100px;
            padding: 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .question-container {
    background: var(--card-bg);  /* Now uses solid color */
    /* Remove or reduce blur effect */
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 32px;
    box-shadow: var(--shadow-heavy);
    position: relative;
    overflow: hidden;
    transition: var(--transition);
}
        .question-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--info));
            background-size: 200% 100%;
            animation: gradient-flow 3s linear infinite;
        }
        
        @keyframes gradient-flow {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .question-number {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 12px 20px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: var(--shadow-light);
            position: relative;
        }
        
        .question-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }
        
        .question-progress {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
        }
        
        .question-marks {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 600;
        }
        
        .question-text {
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 32px;
            color: var(--text);
            font-weight: 500;
        }
        
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .option {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 20px 24px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            font-size: 16px;
            font-weight: 500;
            color: var(--text);
            overflow: hidden;
        }
        
        .option::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s;
        }
        
        .option:hover::before {
            left: 100%;
        }
        
        .option:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: var(--shadow-light);
        }
        
        .option:active {
            transform: scale(0.98);
        }

        .menu-btn, .theme-toggle, .nav-btn.prev, .action-btn.flag {
    background: var(--card-bg);  /* Solid background */
    backdrop-filter: none;  /* Remove blur */
}

.sidebar {
    background: var(--card-bg);  /* Solid background */
    backdrop-filter: none;  /* Remove blur */
}
        
        .option.selected {
            background: rgba(99, 102, 241, 0.15);
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-light);
        }
        
        .option.correct {
            background: rgba(16, 185, 129, 0.15);
            border-color: var(--success);
            color: var(--success);
        }
        
        .option.incorrect {
            background: rgba(239, 68, 68, 0.15);
            border-color: var(--error);
            color: var(--error);
        }
        
        .option.disabled {
            background: rgba(160, 174, 192, 0.1);
            border-color: var(--text-secondary);
            color: var(--text-secondary);
            cursor: not-allowed;
        }
        
        .option-indicator {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }
        
        .option.selected .option-indicator {
            background: var(--primary);
            color: white;
        }
        
        .option.correct .option-indicator {
            background: var(--success);
            color: white;
        }
        
        .option.incorrect .option-indicator {
            background: var(--error);
            color: white;
        }
        
        .option:not(.selected):not(.correct):not(.incorrect) .option-indicator {
            border: 2px solid var(--border);
        }
        
        /* Solution Panel */
        .solution-panel {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(245, 158, 11, 0.05));
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 20px;
            padding: 24px;
            margin-top: 24px;
            backdrop-filter: blur(10px);
            transform: translateY(20px);
            opacity: 0;
            transition: var(--transition);
        }
        
        .solution-panel.show {
            transform: translateY(0);
            opacity: 1;
        }
        
        .solution-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            color: var(--warning);
            font-weight: 700;
        }
        
        .solution-content {
            color: var(--text);
            line-height: 1.6;
            font-size: 15px;
        }
        
        /* Navigation */
        .navigation {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            padding: 16px 20px;
            z-index: 90;
        }
        
        .nav-content {
            display: flex;
            gap: 12px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .nav-btn {
            flex: 1;
            padding: 16px 24px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        
        .nav-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.6s;
        }
        
        .nav-btn:hover::before {
            left: 100%;
        }
        
        .nav-btn:active {
            transform: scale(0.95);
        }
        
        .nav-btn.prev {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            backdrop-filter: blur(10px);
        }
        
        .nav-btn.next {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: var(--shadow-light);
        }
        
        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .nav-btn:disabled::before {
            display: none;
        }
        
        /* Question Panel Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid var(--border);
            z-index: 200;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-heavy);
        }
        
        .sidebar.open {
            right: 0;
        }
        
        .sidebar-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .sidebar-title {
            font-weight: 800;
            font-size: 20px;
        }
        
        .close-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        
        .close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(90deg);
        }
        
        .sidebar-body {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }
        
        .questions-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 32px;
        }
        
        .question-btn {
            background: var(--card-bg);
            border: 2px solid var(--border);
            color: var(--text-secondary);
            width: 48px;
            height: 48px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            position: relative;
        }
        
        .question-btn:hover {
            transform: scale(1.1);
            box-shadow: var(--shadow-light);
        }
        
        .question-btn:active {
            transform: scale(0.95);
        }
        
        .question-btn.current {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: var(--shadow-light);
        }
        
        .question-btn.answered {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border-color: var(--success);
        }
        
        .question-btn.correct {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }
        
        .question-btn.incorrect {
            background: var(--error);
            color: white;
            border-color: var(--error);
        }
        
        .question-btn.flagged::after {
            content: '🚩';
            position: absolute;
            top: -4px;
            right: -4px;
            font-size: 10px;
        }
        
        /* Legend */
        .legend {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 32px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .legend-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        
        .legend-dot.current { background: var(--primary); }
        .legend-dot.answered { background: var(--success); }
        .legend-dot.unattempted { background: var(--text-secondary); }
        .legend-dot.flagged { background: var(--warning); }
        
        /* Action Buttons */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .action-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }
        
        .action-btn.flag {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        
        .action-btn.submit {
            background: linear-gradient(135deg, var(--error), #dc2626);
            color: white;
            box-shadow: var(--shadow-light);
        }
        
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-heavy);
        }
        
        .action-btn:active {
            transform: scale(0.98);
        }
        
        /* Overlay */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 150;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }
        
        .overlay.show {
            opacity: 1;
            visibility: visible;
        }
        
        /* Result Modal */
        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 32px;
            max-width: 90vw;
            width: 480px;
            z-index: 300;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
            box-shadow: var(--shadow-heavy);
            overflow: hidden;
        }
        
        .modal.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }
        
        .modal-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 40px 32px;
            text-align: center;
        }
        
        .modal-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        
        .modal-subtitle {
            opacity: 0.9;
            font-size: 16px;
            font-weight: 500;
        }
        
        .modal-body {
            padding: 32px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            text-align: center;
            padding: 20px 16px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }
        
        .stat-label {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        
        .stat-value {
            color: var(--text);
            font-size: 24px;
            font-weight: 800;
        }
        
        .final-score {
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
            border-radius: 20px;
            padding: 32px;
            text-align: center;
            margin-bottom: 24px;
            box-shadow: var(--shadow-light);
        }
        
        .score-text {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        
        .percentage-text {
            opacity: 0.9;
            font-size: 18px;
            font-weight: 600;
        }
        
        .modal-actions {
            display: flex;
            gap: 12px;
        }
        
        .modal-btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }
        
        .modal-btn.primary {
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary);
            border: 1px solid rgba(99, 102, 241, 0.3);
        }
        
        .modal-btn.success {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        
        .modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-light);
        }
        
        /* Auto-save indicator */
        .auto-save {
            position: fixed;
            top: 80px;
            right: 20px;
            background: var(--success);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            transform: translateX(100px);
            opacity: 0;
            transition: var(--transition);
            z-index: 90;
        }
        
        .auto-save.show {
            transform: translateX(0);
            opacity: 1;
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .header-content {
                padding: 0 4px;

    <script>
        // Core Variables
        const questions = [{"id": "144371", "question": "<strong>Comprehension:</strong><br> This is the one piece of news India awaits around this time of year - because the monsoon is the nation's elixir. Earlier this week, Skymet announced that the country is likely to receive a normal southwest monsoon this year. It's exactly what everyone wanted to hear, given that agriculture is still overwhelmingly rain-fed. However, there is a catch: country-level projections do not capture the high degree of spatial and temporal variation in rainfall that has become par for the course with global warming. A normal monsoon outlook can mask both dry and wet extremes, which carry serious implications for farmers, industry and food prices. What the most important users of weather forecasts now require are localised, district- and tehsil-level projections they can work with.<br> Over the past 40 years, India has experienced 29 normal, 8 above-normal, and 3 below-normal monsoon years. But a district-level analysis shows a more fractured picture: around 30% of districts have faced a high number of deficient rainfall years, while 38% have experienced frequent excess rainfall. A deeper dive into recent data reveals that, in the past decade, 11% of tehsils have seen a rainfall decline of more than 10% compared to baseline levels. Many of these tehsils lie in the Indo-Gangetic plains, which account for over half of India's agricultural output.<br> Also worth noting is the dangerous interaction between extreme heat and erratic rainfall - 84% of districts are now heatwave hotspots, with 70% also experiencing unstable monsoons. This potent mix of high temperatures and humidity during the monsoon months affects agricultural and human productivity. As temperatures rise and climate impacts intensify, the need for localised weather data will only grow. IMD must accelerate efforts to make such data accessible and actionable.<br> <strong>What is the tone of the passage?</strong>", "options": [ ar. It's exactly what everyone wanted to hear, given that agriculture is still overwhelmingly rain-fed. However, there is a catch: country-level projections do not capture the high degree of spatial and temporal variation in rainfall that has become par for the course with global warming. A normal monsoon outlook can mask both dry and wet extremes, which carry serious implications for farmers, industry and food prices. What the most important users of weather forecasts now require are localised, district- and tehsil-level projections they can work with.<br> Over the past 40 years, India has experienced 29 normal, 8 above-normal, and 3 below-normal monsoon years. But a district-level analysis shows a more fractured picture: around 30% of districts have faced a high number of deficient rainfall years, while 38% have experienced frequent excess rainfall. A deeper dive into recent data reveals that, in the past decade, 11% of tehsils have seen a rainfall decline of more than 10% compared to baseline levels. Many of these tehsils lie in the Indo-Gangetic plains, which account for over half of India's agricultural output.<br> Also worth noting is the dangerous interaction between extreme heat and erratic rainfall - 84% of districts are now heatwave hotspots, with 70% also experiencing unstable monsoons. This potent mix of high temperatures and humidity during the monsoon months affects agricultural and human productivity. As temperatures rise and climate impacts intensify, the need for localised weather data will only grow. IMD must accelerate efforts to make such data accessible and actionable.<br> What can be <strong>inferred</strong> about national monsoon projections from the passage?", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> They are fully reliable for agricultural planning at the district level", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.in to baseline levels. Many of these tehsils lie in the Indo-Gangetic plains, which account for over half of India's agricultural output.<br> Also worth noting is the dangerous interaction between extreme heat and erratic rainfall - 84% of districts are now heatwave hotspots, with 70% also experiencing unstable monsoons. This potent mix of high temperatures and humidity during the monsoon months affects agricultural and human productivity. As temperatures rise and climate impacts intensify, the need for localised weather data will only grow. IMD must accelerate efforts to make such data accessible and actionable.<br> <strong> Which of the following statements is TRUE according to the passage?</strong>", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> More than 50% of districts have experienced declining rainfall in the past decade", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Every tehsil in the Indo-Gangetic plains has seen a 10% drop in rainfall", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Only a small portion of districts is affected by heatwaves", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Localised weather forecasts are crucial due to regional climate variability", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The monsoon has shown no change over the last 40 years"], "correct_answer": 3, "solution": "No solution available"}, {"id": "144375", "question": "<strong>Comprehension:</strong><br> This is the one piece of news India awaits around this time of year - because the monsoon is the nation's elixir. Earlier this week, Skymet announced that the country is likely to receive a normal southwest monsoon this year. It's exactly what everyone wanted to hear, given that agriculture is still overwhelmingly rain-fed. However, there is a catch: country-level projections do not capture the high degree of spatial and temporal variation in rainfall that has become par for the course with global warming. A normal monsoon outlook can mask both dry and wet extremes, which carry serious implications for farmers, industry and food prices. What the most important users of weather forecasts now require are localised, district- and tehsil-level projections they can work with.<br> Over the past 40 years, India has experienced 29 normal, 8 above-normal, and 3 below-normal monsoon years. But a district-level analysis shows a more fractured picture: around 30% of districts have faced a high number of deficient rainfall years, while 38% have experienced frequent excess rainfall. A deeper dive into recent data reveals that, in the past decade, 11% of tehsils have seen a rainfall decline of more than 10% compared to baseline levels. Many of these tehsils lie in the Indo-Gangetic plains, which account for over half of India's agricultural output.<br> Also worth noting is the dangerous interaction between extreme heat and erratic rainfall - 84% of districts are now heatwave hotspots, with 70% also experiencing unstable monsoons. This potent mix of high temperatures and humidity during the monsoon months affects agricultural and human productivity. As temperatures rise and climate impacts intensify, the need for localised weather data will only grow. IMD must accelerate efforts to make such data accessible and actionable.<br> <strong>Which region</strong> is identified as both agriculturally crucial and experiencing notable rainfall decline?", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Thar Desert", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Indo-Gangetic plains", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Western Ghats", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Deccan Plateau", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Himalayan foothills"], "correct_answer": 1, "solution": "No solution available"}, {"id": "144376", "question": "<strong>Direction (Q6 – Q8): In each of the following questions, a paragraph has been given with a line or sentence omitted or missing. You are required to determine the best possible option from the given choices that fits aptly into the blank. This option should make the paragraph complete and coherent</strong></p> <p><strong>Q6. Though it_______________ in India’s real growth to 4.4 per cent for Q3 FY23 from 6.3 per cent in Q2, the latest quarterly economic data from the statistics office doesn’t come as much of a surprise.</strong></p> <ol>", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> is a sign that producers weren’t able to pass", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> is already doing all it can to provide a stimulus", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> shows a marked loss of momentum", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> is that while the main sectors of the economy", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> None of the above"], "correct_answer": 2, "solution": "C) 'shows a marked loss of momentum' का प्रयोग होगा क्योंकि यह बताता है कि भारत की आर्थिक वृद्धि में गति की कमी आई है। यहाँ 'marked loss of momentum' का अर्थ है कि वृद्धि दर में स्पष्ट रूप से कमी आई है, जो कि सांख्यिकीय कार्यालय से प्राप्त नवीनतम तिमाही आर्थिक डाटा के अनुसार है।\n\nIn this paragraph, \"shows a marked loss of momentum\" should be used because this phrase indicates that there has been a significant slowdown in India's economic growth. 'Marked loss of momentum' means there is a clear reduction in the growth rate, which is consistent with the latest quarterly economic data from the statistics office. The other options do not fit appropriately in this context."}, {"id": "144377", "question": "<strong>Direction (Q6 – Q8): In each of the following questions, a paragraph has been given with a line or sentence omitted or missing. You are required to determine the best possible option from the given choices that fits aptly into the blank. This option should make the paragraph complete and coherent</strong></p> <p><strong>Q7. The 85th plenary session of the Congress that_____________ the 2024 Lok Sabha election, besides reinforcing Mallikarjun Kharge’s authority as elected president of the party.</strong></p> <ol>", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> resolved to pursue a sharp social justice agenda", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> concluded in Raipur in Chhattisgarh outlined a strategy for", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> watched for its adherence to the Raipur", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> worked to the BJP’s advantage in recent years", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> None of the above"], "correct_answer": 1, "solution": "B) concluded in Raipur in Chhattisgarh outlined a strategy for\n\n'Concluded' शब्द का प्रयोग इस बात को बताने के लिए हो रहा है कि सम्मेलन समाप्त हो चुका है, और 'outlined a strategy for' यह दर्शाता है कि इस सम्मेलन में 2024 के लोकसभा चुनाव के लिए एक रणनीति की रूपरेखा तैयार की गई।\n\nThe use of 'concluded' indicates that the session has ended, and 'outlined a strategy for' shows that a strategy for the 2024 Lok Sabha election was formulated in this session. Therefore, this option correctly completes both the meaning and the grammatical structure of the sentence."}, {"id": "144378", "question": "<strong>Direction (Q6 – Q8): In each of the following questions, a paragraph has been given with a line or sentence omitted or missing. You are required to determine the best possible option from the given choices that fits aptly into the blank. This option should make the paragraph complete and coherent</strong></p> <p><strong>Q8. February 2023, the India Meteorological Department (IMD) recently said, _______________since 1901 with the average maximum temperature at nearly 29.54°C.</strong></p> <p> </p> <ol>", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> has been the warmest", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> had been the warmest", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> have been the warmest", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> had the warmest", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> have the warmest"], "correct_answer": 1, "solution": "'B) had been the warmest'\n\nयहां 'had been' का प्रयोग पिछले समय (past perfect tense) की बात करता है, जो एक निश्चित समय बिंदु (1901) से लेकर अभी तक की अवधि को दर्शाता है। 'Had been' इस बात को इंगित करता है कि उच्चतम तापमान होने की घटना पिछले समय में हुई थी और उसका प्रभाव अभी तक बना हुआ है।\n\nThe reason for this is that 'had been' is used in the past perfect tense, which denotes a period extending from a specific point in time (1901) to the present. 'Had been' indicates that the event of having the highest temperature occurred in the past and its effects continue to the present."}, {"id": "144379", "question": "<strong>Directions (Q9 – Q12): Five sentences P, Q, R, S, and T are given below, you need to rearrange the sentences so that the five sentences can together form a meaningful paragraph.</strong><br> <br> <strong>P. </strong> The latter had been directed by the court in March to probe the veracity of the report<br> <strong>Q. </strong> Rightly reposing confidence in the country’s stock market regulator SEBI vis-à-vis US-based short-selling firm Hindenburg Research, which had published a report against the Adani Group in January, a Supreme Court Bench led by CJI DY Chandrachud on Friday remarked that in the absence of any proper material, there was no reason to ‘discredit’ SEBI<br> <strong>R. </strong> That the report was either credible or lacking in credibility’, it could not ‘accept the Hindenburg report as ipso facto factually correct’<br> <strong>S. </strong> The Bench’s observation was made in the context of a batch of petitions seeking a probe into the report that accused the Adani Group of artificially inflating its stock prices by indulging in fraudulent activities<br> <strong>T.</strong> The court told the petitioners that since it could not ‘make the assumption<br> <br> Q9. Which of the following should be the <strong>FIRST </strong>sentence after rearrangement?", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exa that <strong>potential(B)</strong> heat also <strong>led to(C)</strong> a loss of 167.2 billion <strong>excessive(D)</strong> labour hours among Indians in 2021.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> ADCB", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> ACDB", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> DBCA", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> ABDC", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> No arrangement required"], "correct_answer": 0, "solution": "A) ADCB\n\nA Lancet study reported a 55% rise in deaths due to extreme heat and that excessive heat also led to a loss of 167.2 billion potential labour hours among Indians in 2021."}, {"id": "144384", "question": "<strong>Direction (Q14- Q17): Read the passage given below and answer the following questions. </strong></p> <p>THE flagoff of the Namo Bharat RapidX train connecting Sahibabad to Duhai Depot, a section of the _____(a)_____17-km Delhi-Ghaziabad-Meerut Corridor, marks the launch of the Regional Rapid Transit System in India. Designed for a maximum speed of 180 kmph, it is in line with the Modi government’s vision of creating world-class transport infrastructure as well as the Railways’ Mission Raftaar. It is a joint venture between the Centre and the governments of Delhi, Haryana, Rajasthan and Uttar Pradesh. However, _____(b)______ the Railways’ track record, the operational speed potential of Namo Bharat of 160 kmph seems a bit too ambitious. A CAG report _____(c)_______in Parliament in 2022 waved the red flag at the Railways for its trains being neither fast _____(d)_____on time despite an expenditure of a whopping Rs 2.5 lakh crore on building infrastructure in a decade.</p> <p><strong>Fill in the blanks with the most appropriate combinations of words </strong></p> <p>Q14. THE flagoff of the Namo Bharat RapidX train connecting Sahibabad to Duhai Depot, a section of the __________17-km Delhi-Ghaziabad-Meerut Corridor, marks the launch of the Regional Rapid Transit System in India.</p> <p><strong>Fill the most appropriate option in (a)</strong></p> <p>(i) Exposed<br> (ii) Proposed<br> (iii) Imposed<br> (iv) Produced", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Only (i)", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Both (i) and (ii)", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Only (iii)", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Only (ii)", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> None of the above"], "correct_answer": 3, "solution": "D) \"Proposed\" का उपयोग होना चाहिए क्योंकि \"proposed\" का अर्थ होता है किसी योजना या प्रस्ताव को सुझाना। वाक्य में जिक्र है कि Namo Bharat RapidX ट्रेन दिल्ली-गाज़ियाबाद-मेरठ कॉरिडोर के एक खंड को जोड़ती है, जो कि एक प्रस्तावित परियोजना है, इसलिए यहाँ 'proposed' सही है। 'Exposed' का अर्थ होता है उजागर करना, 'Imposed' का अर्थ होता है लागू करना, और 'Produced' का अर्थ होता है बनाना, जो इस संदर्भ में सही नहीं बैठते हैं।\n\n\"Proposed\" should be used because it refers to suggesting a plan or idea. The sentence mentions the Namo Bharat RapidX train connecting a section of the Delhi-Ghaziabad-Meerut Corridor, which is a proposed project, making 'proposed' the correct choice. 'Exposed' means to reveal or uncover, 'Imposed' means to enforce, and 'Produced' means to create, which do not fit in this context."}, {"id": "144385", "question": "<strong>Direction (Q14- Q17): Read the passage given below and answer the following questions. </strong></p> <p>THE flagoff of the Namo Bharat RapidX train connecting Sahibabad to Duhai Depot, a section of the _____(a)_____17-km Delhi-Ghaziabad-Meerut Corridor, marks the launch of the Regional Rapid Transit System in India. Designed for a maximum speed of 180 kmph, it is in line with the Modi government’s vision of creating world-class transport infrastructure as well as the Railways’ Mission Raftaar. It is a joint venture between the Centre and the governments of Delhi, Haryana, Rajasthan and Uttar Pradesh. However, _____(b)______ the Railways’ track record, the operational speed potential of Namo Bharat of 160 kmph seems a bit too ambitious. A CAG report _____(c)_______in Parliament in 2022 waved the red flag at the Railways for its trains being neither fast _____(d)_____on time despite an expenditure of a whopping Rs 2.5 lakh crore on building infrastructure in a decade.</p> <p><strong>Fill in the blanks with the most appropriate combinations of words </strong></p> <p>Q15. However, _____(b)______ the Railways’ track record, the operational speed potential of Namo Bharat of 160 kmph seems a bit too ambitious.</p> <p><strong>Fill the most appropriate option in (b)</strong></p> <p>(i) given<br> (ii) in the context of<br> (iii) outwardly<br> (iv) in the end", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Both (ii) and (iv)", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Only (ii)", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Only (iv)", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Only (i)", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> None of the above"], "correct_answer": 3, "solution": "D) 'Given' का use होगा क्योंकि 'given' का अर्थ होता है किसी बात या स्थिति को ध्यान में रखते हुए। Sentence में रेलवे के पिछले रिकॉर्ड को देखते हुए Namo Bharat की गति क्षमता पर विचार किया गया है, इसलिए 'given' यहाँ सही है। 'In the context of' का अर्थ होता है किसी विशेष परिस्थिति या संदर्भ में, जो इस संदर्भ में सीधा और विशिष्ट नहीं है। 'Outwardly' का अर्थ है ऊपरी तौर पर दिखाई देना और 'in the end' का अर्थ है अंत में, जो इस संदर्भ में सही नहीं हैं।\n\n'Given' should be used because it means considering or taking into account something. In this sentence, it refers to considering the Railways' track record when evaluating the operational speed potential of Namo Bharat. 'Given' is appropriate here as it introduces a premise or condition - the Railways' track record. 'In the context of' means in a particular situation or setting, which is less direct and specific in this context. 'Outwardly' means appearing to be something on the surface and 'in the end' implies a conclusion or final result, neither of which fits this context."}, {"id": "144386", "question": "<strong>Direction (Q14- Q17): Read the passage given below and answer the following questions. </strong></p> <p>THE flagoff of the Namo Bharat RapidX train connecting Sahibabad to Duhai Depot, a section of the _____(a)_____17-km Delhi-Ghaziabad-Meerut Corridor, marks the launch of the Regional Rapid Transit System in India. Designed for a maximum speed of 180 kmph, it is in line with the Modi government’s vision of creating world-class transport infrastructure as well as the Railways’ Mission Raftaar. It is a joint venture between the Centre and the governments of Delhi, Haryana, Rajasthan and Uttar Pradesh. However, _____(b)______ the Railways’ track record, the operational speed potential of Namo Bharat ed' means to include or attach, 'Purported' means allegedly, and 'Stapled' means fastened with a staple, which do not fit in this context."}, {"id": "144387", "question": "<strong>Direction (Q14- Q17): Read the passage given below and answer the following questions. </strong></p> <p>THE flagoff of the Namo Bharat RapidX train connecting Sahibabad to Duhai Depot, a section of the _____(a)_____17-km Delhi-Ghaziabad-Meerut Corridor, marks the launch of the Regional Rapid Transit System in India. Designed for a maximum speed of 180 kmph, it is in line with the Modi government’s vision of creating world-class transport infrastructure as well as the Railways’ Mission Raftaar. It is a joint venture between the Centre and the governments of Delhi, Haryana, Rajasthan and Uttar Pradesh. However, _____(b)______ the Railways’ track record, the operational speed potential of Namo Bharat of 160 kmph seems a bit too ambitious. A CAG report _____(c)_______in Parliament in 2022 waved the red flag at the Railways for its trains being neither fast _____(d)_____on time despite an expenditure of a whopping Rs 2.5 lakh crore on building infrastructure in a decade.</p> <p><strong>Fill in the blanks with the most appropriate combinations of words </strong></p> <p>Q17. Its trains being neither fast _____(d)_____on time despite an expenditure of a whopping Rs 2.5 lakh crore on building infrastructure in a decade.</p> <p><strong>Fill the most appropriate option in (d)</strong></p> <p>(i) Not<br> (ii) And<br> (iii) Or<br> (iv) Nor", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Only (i)", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Only (iv)", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Only (iii)", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Both (iii) and (ii)", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> None of the above"], "correct_answer": 1, "solution": "B) वाक्य में \"neither... nor...\" का pattern है जिसका अर्थ होता है \"न ये और न वो\"। वाक्य में कहा गया है कि ट्रेनें न तेज होती हैं और न समय पर, जिससे 'nor' यहां उपयुक्त है। जबकि 'Not' का इस्तेमाल नकारात्मक वाक्यों में होता है, 'And' दो सकारात्मक या नकारात्मक बातों को जोड़ता है, और 'Or' विकल्पों को दर्शाता है, जो इस संदर्भ में सही नहीं है।\n\nThis is because the sentence follows the \"neither... nor...\" pattern, which means \"not this and not that\". The sentence states that the trains are neither fast nor on time, making 'nor' appropriate here. In contrast, 'Not' is used in negative sentences, 'And' connects two positive or negative statements, and 'Or' indicates alternatives, none of which are correct in this context."}, {"id": "144388", "question": "<strong>Q18. Given below is a word, followed by three sentence that consist of that word. Identify the sentence (S) that best express (es) the meaning of the word. </strong></p> <p><strong>Repugnant</strong></p> <p>(i) I find your attitude towards these women quite <strong>repugnant</strong>.<br> (ii) The idea of cheating in an exam is morally <strong>repugnant </strong>to me.<br> (iii) If you accept general hedonism, you must either embrace the <strong>repugnant </strong>conclusion or alternatively deny utilitarianism.</p> <ol>", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Only (i)", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Only (ii)", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Only (iii)", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> (i), (ii)", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> (i), (ii), (iii)"], "correct_answer": 4, "solution": "E) (i), (ii), (iii)\n\nAll are contextually correct"}, {"id": "144389", "question": "<strong>Q19. A sentence is given with four words marked as (J), (K), (L), and (M). These words may or may not be placed in the correct order. Four options with different arrangements of these have been provided. Mark the option with the correct arrangement as the answer. If no rearrangement is required, mark option (5) as your answer.</strong></p> <p>The <strong>proposed(J)</strong> all-India judicial service (AIJS) is in the <strong>spotlight(K)</strong> again, with President Droupadi Murmu suggesting that it should be created to ‘select brilliant youngsters and <strong>judiciary(L)</strong> their talent from lower to higher levels in the <strong>nurture(M)’</strong>.</p> <ol>", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> JK, ML", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> JM, LK", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> JL, KM", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> MJ, KL", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> None of the above"], "correct_answer": 0, "solution": "A) JK, ML\n\nTHE proposed all-India judicial service (AIJS) is in the spotlight again, with President Droupadi Murmu suggesting that it should be created to ‘select brilliant youngsters and nurture their talent from lower to higher levels in the judiciary’."}, {"id": "144390", "question": "<strong>Q20. In each question below, a sentence is given with a part of it printed in bold type. That part contains a phrase that may be correct or erroneous. Find out which is the correct phrase that should replace the error in bold, if there is any, and which makes the sentence grammatically meaningful and correct. If the sentence is correct as it is and ‘No improvement required’, mark option E ‘No improvement required’ as the answer</strong></p> <p>Union minister Hardeep Singh Puri has said that by 2025, when the Namo Bharat project <strong>are expected to be completed</strong>, India would have the world’s second-largest urban transport metro system (after China).</p> <ol>", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> are expected to be completed", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> was expected to be completed", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> is expected to be completed", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> are expected to be complete", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> No improvement required"], "correct_answer": 2, "solution": "C) is expected to be completed\n\n\"are expected to be completed\" का इस्तेमाल गलत है क्योंकि यहाँ बात 'Namo Bharat project' की हो रही है, जो singular है। इसलिए, verb भी singular form में होना चाहिए।\n\n\"was expected to be completed\" भी गलत है क्योंकि 'was' past tense में है, जबकि sentence future expectation की बात कर रहा है।\n\n\"is expected to be completed\" सही है क्योंकि 'Namo Bharat project' singular है और 'is' इसके अनुरूप singular verb है। यह future expectation को भी दर्शाता है।\n\n\"are expected to be complete\" में भी 'are' का प्रयोग गलत है क्योंकि subject singular है।\n\n\"are expected to be completed\" is incorrect as it refers to the 'Namo Bharat project', which is singular. Therefore, the verb should also be in the singular form. \"was expected to be completed\" is incorrect because 'was' is in the past tense, while the sentence is discussing a future expectation. \"is expected to be completed\" is correct as 'Namo Bharat project' is singular and 'is' aligns as a singular verb, appropriately indicating a future expectation. \"are expected to be complete\" is also incorrect due to the use of 'are' with a singular subject."}];
        const examConfig = {
            id: '7211',
            duration: 20,
            positiveMarks: 1.0,
            negativeMarks: 0.25
        };
        
        let currentQuestionIndex = 0;
        let userAnswers = {};
        let flaggedQuestions = new Set();
        let timeLeft = examConfig.duration * 60;
        let timerInterval;
        let isTestFinished = false;
        let solutionMode = false;
        let touchStartX = 0;
        let touchStartY = 0;
        
        // Initialize app
        function initializeApp() {
            createParticles();
            generateQuestionsGrid();
            loadQuestion();
            startTimer();
            setupTouchGestures();
            setupAutoSave();
            
            // Prevent accidental page leave
            window.addEventListener('beforeunload', (e) => {
                if (!isTestFinished) {
                    e.preventDefault();
                    e.returnValue = 'Test in progress. Are you sure you want to leave?';
                }
            });
        }
        
        // Create floating particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = window.innerWidth < 768 ? 20 : 40;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 3 + 3) + 's';
                particlesContainer.appendChild(particle);
            }
        }
        
        // Load current question
        function loadQuestion() {
            const question = questions[currentQuestionIndex];
            
            // Update question info
            document.getElementById('questionNumber').textContent = `Q${currentQuestionIndex + 1}`;
            document.getElementById('questionProgress').textContent = 
                `${currentQuestionIndex + 1} of ${questions.length}`;
            document.getElementById('questionText').innerHTML = question.question;
            
            // Load options
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            
            question.options.forEach((option, index) => {
                const optionElement = document.createElement('div');
                optionElement.className = 'option';
                optionElement.innerHTML = option;
                
                const indicator = document.createElement('div');
                indicator.className = 'option-indicator';
                optionElement.appendChild(indicator);
                
                if (solutionMode) {
                    // Show solution mode styling
                    if (index === question.correct_answer) {
                        optionElement.classList.add('correct');
                        indicator.textContent = '✓';
                    } else if (userAnswers[currentQuestionIndex] === index) {
                        optionElement.classList.add('incorrect');
                        indicator.textContent = '✗';
                    } else {
                        optionElement.classList.add('disabled');
                    }
                    optionElement.style.pointerEvents = 'none';
                } else {
                    // Normal mode
                    if (userAnswers[currentQuestionIndex] === index) {
                        optionElement.classList.add('selected');
                        indicator.textContent = '✓';
                    }
                    
                    optionElement.onclick = () => selectOption(index);
                    optionElement.onkeydown = (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            selectOption(index);
                        }
                    };
                    optionElement.tabIndex = 0;
                }
                
                optionsContainer.appendChild(optionElement);
            });
            
            // Handle solution panel
            const solutionPanel = document.getElementById('solutionPanel');
            if (solutionMode && question.solution) {
                document.getElementById('solutionContent').innerHTML = question.solution;
                solutionPanel.classList.add('show');
            } else {
                solutionPanel.classList.remove('show');
            }
            
            // Update navigation
            updateNavigation();
            updateQuestionsGrid();
            updateFlagButton();
            
            // Add entrance animation
            const container = document.getElementById('questionContainer');
            container.style.transform = 'translateY(20px)';
            container.style.opacity = '0';
            setTimeout(() => {
                container.style.transform = 'translateY(0)';
                container.style.opacity = '1';
            }, 100);
        }
        
        // Select an option
        function selectOption(index) {
            if (solutionMode) return;
            
            const currentAnswer = userAnswers[currentQuestionIndex];
            
            if (currentAnswer === index) {
                // Deselect if clicking the same option
                delete userAnswers[currentQuestionIndex];
            } else {
                // Select new option
                userAnswers[currentQuestionIndex] = index;
            }
            
            // Update UI
            const options = document.querySelectorAll('.option');
            options.forEach((option, i) => {
                const indicator = option.querySelector('.option-indicator');
                if (userAnswers[currentQuestionIndex] === i) {
                    option.classList.add('selected');
                    indicator.textContent = '✓';
                } else {
                    option.classList.remove('selected');
                    indicator.textContent = '';
                }
            });
            
            updateQuestionsGrid();
            showAutoSave();
        }
        
        // Generate questions grid
        function generateQuestionsGrid() {
            const grid = document.getElementById('questionsGrid');
            grid.innerHTML = '';
            
            questions.forEach((_, index) => {
                const button = document.createElement('button');
                button.className = 'question-btn';
                button.textContent = index + 1;
                button.onclick = () => goToQuestion(index);
                button.setAttribute('aria-label', `Go to question ${index + 1}`);
                grid.appendChild(button);
            });
        }
        
        // Update questions grid styling
        function updateQuestionsGrid() {
            const buttons = document.querySelectorAll('.question-btn');
            buttons.forEach((button, index) => {
                button.className = 'question-btn';
                
                if (index === currentQuestionIndex) {
                    button.classList.add('current');
                } else if (solutionMode) {
                    if (userAnswers[index] === questions[index].correct_answer) {
                        button.classList.add('correct');
                    } else if (userAnswers[index] !== undefined) {
                        button.classList.add('incorrect');
                    }
                } else if (userAnswers[index] !== undefined) {
                    button.classList.add('answered');
                }
                
                if (flaggedQuestions.has(index)) {
                    button.classList.add('flagged');
                }
            });
        }
        
        // Navigation functions
        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
            }
        }
        
        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else if (!solutionMode) {
                submitTest();
            }
        }
        
        function goToQuestion(index) {
            currentQuestionIndex = index;
            loadQuestion();
            closeSidebar();
        }
        
        function updateNavigation() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            
            prevBtn.disabled = currentQuestionIndex === 0;
            
            if (solutionMode) {
                nextBtn.textContent = currentQuestionIndex === questions.length - 1 ? 
                    'Finish Review' : 'Next →';
                nextBtn.onclick = currentQuestionIndex === questions.length - 1 ? 
                    finishReview : nextQuestion;
            } else {
                nextBtn.textContent = currentQuestionIndex === questions.length - 1 ? 
                    'Submit Test' : 'Next →';
                nextBtn.onclick = currentQuestionIndex === questions.length - 1 ? 
                    submitTest : nextQuestion;
            }
        }
        
        // Timer functions
        function startTimer() {
            const timerElement = document.getElementById('timer');
            const progressCircle = document.getElementById('progressCircle');
            const circumference = 2 * Math.PI * 18;
            const totalTime = examConfig.duration * 60;
            
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    submitTest();
                    return;
                }
                
                timeLeft--;
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerElement.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                
                // Update progress circle
                const progress = (totalTime - timeLeft) / totalTime;
                const offset = circumference * progress;
                progressCircle.style.strokeDashoffset = offset;
                
                // Add warning effects
                if (timeLeft <= 300) { // 5 minutes
                    timerElement.classList.add('warning');
                }
                if (timeLeft <= 60) { // 1 minute
                    timerElement.classList.add('critical');
                }
            }, 1000);
        }
        
        // Toggle question flag
        function toggleFlag() {
            if (flaggedQuestions.has(currentQuestionIndex)) {
                flaggedQuestions.delete(currentQuestionIndex);
            } else {
                flaggedQuestions.add(currentQuestionIndex);
            }
            updateFlagButton();
            updateQuestionsGrid();
        }
        
        function updateFlagButton() {
            const flagBtn = document.getElementById('flagBtn');
            if (flaggedQuestions.has(currentQuestionIndex)) {
                flagBtn.textContent = '🏴 Unflag Question';
                flagBtn.style.background = 'rgba(239, 68, 68, 0.2)';
                flagBtn.style.color = 'var(--error)';
            } else {
                flagBtn.textContent = '🚩 Flag Question';
                flagBtn.style.background = 'rgba(245, 158, 11, 0.2)';
                flagBtn.style.color = 'var(--warning)';
            }
        }
        
        // Theme toggle
        function toggleTheme() {
            const body = document.body;
            const themeBtn = document.getElementById('themeBtn');
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            body.setAttribute('data-theme', newTheme);
            themeBtn.textContent = newTheme === 'light' ? '🌙' : '☀️';
            
            // Save preference
            localStorage.setItem('theme', newTheme);
        }
        
        // Sidebar functions
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            
            sidebar.classList.toggle('open');
            overlay.classList.toggle('show');
        }
        
        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('show');
        }
        
        // Touch gesture support
        function setupTouchGestures() {
            const main = document.querySelector('.main');
            
            main.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            });
            
            main.addEventListener('touchend', (e) => {
                const touchEndX = e.changedTouches[0].clientX;
                const touchEndY = e.changedTouches[0].clientY;
                const deltaX = touchEndX - touchStartX;
                const deltaY = touchEndY - touchStartY;
                
                // Only trigger if horizontal swipe is dominant
                if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 50) {
                    if (deltaX > 0 && currentQuestionIndex > 0) {
                        // Swipe right - previous question
                        previousQuestion();
                    } else if (deltaX < 0 && currentQuestionIndex < questions.length - 1) {
                        // Swipe left - next question
                        nextQuestion();
                    }
                }
            });
        }
        
        // Auto-save functionality
        function setupAutoSave() {
            // Save answers periodically
            setInterval(() => {
                if (!isTestFinished) {
                    saveProgress();
                }
            }, 30000); // Every 30 seconds
        }
        
        function saveProgress() {
            const progress = {
                answers: userAnswers,
                flagged: Array.from(flaggedQuestions),
                currentQuestion: currentQuestionIndex,
                timeLeft: timeLeft
            };
            
            // In a real implementation, this would save to a server
            console.log('Progress saved:', progress);
        }
        
        function showAutoSave() {
            const autoSave = document.getElementById('autoSave');
            autoSave.classList.add('show');
            setTimeout(() => {
                autoSave.classList.remove('show');
            }, 2000);
        }
        
        // Submit test
        function submitTest() {
            if (isTestFinished) return;
            
            isTestFinished = true;
            clearInterval(timerInterval);
            
            // Calculate results
            let correct = 0, wrong = 0, skipped = 0, totalMarks = 0;
            
            questions.forEach((question, index) => {
                if (userAnswers[index] === undefined) {
                    skipped++;
                } else if (userAnswers[index] === question.correct_answer) {
                    correct++;
                    totalMarks += examConfig.positiveMarks;
                } else {
                    wrong++;
                    totalMarks -= examConfig.negativeMarks;
                }
            });
            
            const maxMarks = questions.length * examConfig.positiveMarks;
            const percentage = Math.max(0, Math.round((totalMarks / maxMarks) * 100));
            
            // Show results
            document.getElementById('resultTitle').textContent = 
                `${correct}/${questions.length} Correct`;
            document.getElementById('resultSubtitle').textContent = 
                `You scored ${totalMarks} out of ${maxMarks} marks`;
            document.getElementById('correctCount').textContent = correct;
            document.getElementById('wrongCount').textContent = wrong;
            document.getElementById('skippedCount').textContent = skipped;
            document.getElementById('finalScore').textContent = `${totalMarks} Marks`;
            document.getElementById('finalPercentage').textContent = `${percentage}%`;
            
            document.getElementById('resultModal').classList.add('show');
            closeSidebar();
        }
        
        // View solutions
        function viewSolutions() {
            document.getElementById('resultModal').classList.remove('show');
            solutionMode = true;
            currentQuestionIndex = 0;
            loadQuestion();
        }
        
        // Finish review
        function finishReview() {
            solutionMode = false;
            currentQuestionIndex = 0;
            loadQuestion();
        }
        
        // Retake test
        function retakeTest() {
            if (confirm('Are you sure you want to retake the test? All progress will be lost.')) {
                location.reload();
            }
        }
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (solutionMode) return;
            
            switch(e.key) {
                case 'ArrowLeft':
                    e.preventDefault();
                    previousQuestion();
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    nextQuestion();
                    break;
                case 'f':
                case 'F':
                    if (e.ctrlKey || e.metaKey) {
                        e.preventDefault();
                        toggleFlag();
                    }
                    break;
                case 'm':
                case 'M':
                    if (e.ctrlKey || e.metaKey) {
                        e.preventDefault();
                        toggleSidebar();
                    }
                    break;
                case '1':
                case '2':
                case '3':
                case '4':
                    if (!e.ctrlKey && !e.metaKey) {
                        e.preventDefault();
                        const optionIndex = parseInt(e.key) - 1;
                        if (optionIndex < questions[currentQuestionIndex].options.length) {
                            selectOption(optionIndex);
                        }
                    }
                    break;
            }
        });
        
        // Initialize when DOM is loaded
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeApp);
        } else {
            initializeApp();
        }
        
        // Load saved theme
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            document.body.setAttribute('data-theme', savedTheme);
            document.getElementById('themeBtn').textContent = savedTheme === 'light' ? '🌙' : '☀️';
        }
    </script>
</body>
</html>
