 until now.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Because restaurants have reduced plate sizes to save costs rather than improve health.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Because portion sizes have historically been too small in restaurants."], "correct_answer": 1, "solution": "No solution available"}, {"id": "160226", "question": "<strong>Comprehension</strong>:<br> If gluttony is the foundation on which the edifice of the modern restaurant industry was built, could the GLP-1 class of drugs be the wrecking ball that brings it all crashing down? From London to Dubai to New York City, eateries are faced with the newly shrunk appetites of customers, thanks to the “miracle” wrought by drugs like Ozempic and Wegovy. This has led to a scramble to design special “mini meal” menus, of smaller servings with appropriate pricing; after all, customers who push food around on their plates after just a few bites cannot be expected to stomach the prices for regular portion sizes.</p> <p>That these so-called “mini” portions are closer to the actual recommended servings is, of course, what lends a tinge of irony to the restaurant industry’s predicament. The finding of a 2016 study, published in the Journal of the American Academy of Nutrition and Dietetics, that most restaurants’ individual main courses alone exceed the recommended calories for a single meal, underscored the extent to which the culture of eating out has contributed to obesity and related illnesses. Other studies have highlighted the phenomenon of “portion distortion”, showing how even restaurant plates have grown in size over the decades, contributing to the problem of overeating.</p> <p>It appears that the hunger-curbing power of GLP-1 drugs may succeed where mere will-power has repeatedly failed (the cephalic phase of digestion in humans kicks in at the very sight and smell of food). Yet, even as restaurants recalibrate their business models for a future where burgers and fries are no longer “super-sized” and fewer and fewer customers order enough food for there to be a doggy bag, weight-watchers themselves might consider revisiting a hoary piece of advice: Eat more at home. It is both healthier and cheaper.</p> <p><strong>Which of the following statements is most accurate according to the passage?</strong>", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> GLP-1 drugs like Ozempic have led to the creation of “mini meal” menus that ironically align more closely with recommended portion sizes.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Restaurant portions have always been aligned with the calorie recommendations outlined in dietary guidelines.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The cephalic phase of digestion begins only after consuming food, not when merely seeing or smelling it.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> GLP-1 drugs are ineffective in curbing appetite compared to willpower."], "correct_answer": 0, "solution": "No solution available"}, {"id": "160227", "question": "<strong>Comprehension</strong>:<br> If gluttony is the foundation on which the edifice of the modern restaurant industry was built, could the GLP-1 class of drugs be the wrecking ball that brings it all crashing down? From London to Dubai to New York City, eateries are faced with the newly shrunk appetites of customers, thanks to the “miracle” wrought by drugs like Ozempic and Wegovy. This has led to a scramble to design special “mini meal” menus, of smaller servings with appropriate pricing; after all, customers who push food around on their plates after just a few bites cannot be expected to stomach the prices for regular portion sizes.</p> <p>That these so-called “mini” portions are closer to the actual recommended servings is, of course, what lends a tinge of irony to the restaurant industry’s predicament. The finding of a 2016 study, published in the Journal of the American Academy of Nutrition and Dietetics, that most restaurants’ individual main courses alone exceed the recommended calories for a single meal, underscored the extent to which the culture of eating out has contributed to obesity and related illnesses. Other studies have highlighted the phenomenon of “portion distortion”, showing how even restaurant plates have grown in size over the decades, contributing to the problem of overeating.</p> <p>It appears that the hunger-curbing power of GLP-1 drugs may succeed where mere will-power has repeatedly failed (the cephalic phase of digestion in humans kicks in at the very sight and smell of food). Yet, even as restaurants recalibrate their business models for a future where burgers and fries are no longer “super-sized” and fewer and fewer customers order enough food for there to be a doggy bag, weight-watchers themselves might consider revisiting a hoary piece of advice: Eat more at home. It is both healthier and cheaper.</p> <p><strong>Based on the 2016 study cited in the passage, which inference is most valid?</strong>", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Most restaurant main courses exceed recommended single-meal calories, suggesting a systemic role of dining-out culture in promoting obesity.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Restaurants have been steadily decreasing portion sizes to match recommended calorie intake since 2016.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Plate size in restaurants has remained constant over the decades, showing no correlation to overeating trends.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The 2016 study directly proved that all forms of overeating are caused by large portion sizes in restaurants."], "correct_answer": 0, "solution": "No solution available"}, {"id": "160259", "question": "<strong>For the four-sentence (S1 to S4) paragraph below, sentences S1 and S4 are given. From the options P, Q, R and S select the appropriate sentences for S2 and S3, respectively.</strong></p> <p>S1: There is a certain romance in names. Not the names of people, but of places. </p> <p>P: Places I have never seen and may never visit, yet their names sound exotic, mysterious, and sometimes just beautiful.</p> <p>Q: Adding a vowel sound to the name towards the end increases its sensuous factor.</p> <p>R: But it is the sound, their pronunciation styles, and their origins make them attractive and sizzling.</p> <p>S: In the early days of my career, I was enchanted by names such as Brundamal, Panki, Nayani, and Buda Phank — the way they rolled off the tongue was musical and rhythmic.</p> <p>S4: They stayed with me long after the workday ended. Eventually, they became characters in the bedtime stories I told my toddler.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> P and Q", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> P and R", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> P and S", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Q and S"], "correct_answer": 2, "solution": "C) P and S\n\nS1 introduces the subject \"romance in names\" and specifies it is about \"places,\" setting the context for place names\n\nP starts with the noun \"Places,\" which directly refers back to \"places\" in S1, creating a clear link. The pronoun \"their\" (referring to the places) connects to the subject of place names, and the use of \"I\" introduces the first-person perspective, which is consistent with S4's personal tone.\n\nS follows P because it begins with a time phrase \"In the early days of my career,\" which adds depth to the personal narrative introduced by \"I\" in P. The subject \"I\" is repeated, maintaining the first-person perspective, and the verb \"was enchanted\" connects to P's description of names sounding \"exotic, mysterious, and beautiful.\"\n\nS4 starts with the pronoun \"They,\" which refers directly to the specific names (Brundamal, Panki, etc.) introduced in S.\n\nS1 में subject \"romance in names\" introduce होता है, specifically \"places\" के names के लिए, जो paragraph का main topic set करता है।\n\nP (S2) S1 के बाद आता है क्योंकि यह \"Places\" से शुरू होता है, जो S1 के \"places\" को directly refer करता है। Pronoun \"their\" (names) और subject \"I\" का use S1 के idea को आगे बढ़ाता है, यह बताता है कि names कैसे exotic और beautiful sound करते हैं।\n\nS (S3) P के बाद आता है क्योंकि यह time phrase \"In the early days of my career\" से start होता है, जो P के personal perspective को continue करता है। Verb \"was enchanted\" P के description (exotic, beautiful names) से connect होती है, और specific names (Brundamal, Panki, etc.) introduce करती है। Noun phrase \"the way they rolled off the tongue\" P में implied sound concept को elaborate करता है, जिससे subject-verb-object flow smooth बनता है।\n\nS4 S के बाद आता है क्योंकि pronoun \"They\" S में mentioned specific names को refer करता है, और \"stayed with me\" S के \"enchanted\" से logically जुड़ता है, यह show करता है कि names का lasting impact कैसे हुआ।\n\nR (\"But it is the sound...\") starts with \"But,\" implying a contrast that isn't present after P.\n\nQ (\"Adding a vowel sound...\") is a general linguistic observation that doesn't connect grammatically to P or S1."}, {"id": "160239", "question": "<strong>Read the following description carefully and choose the correct one-word substitution of 'Something' that best describes the condition being portrayed.</strong></p> <p>Something is a quality or style so unique and matchless that it is impossible to copy or imitate. It stands apart because of its originality and excellence.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Inevitable", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Inimitable", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Incorrigible", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Invincible"], "correct_answer": 1, "solution": "B) Inimitable (adjective)</strong> – So good or unusual as to be impossible to copy; unique. <strong>अद्वितीय / अनुपम\n\nInevitable (adjective)</strong> – Certain to happen; unavoidable. <strong>अनिवार्य\n\nIncorrigible (adjective)</strong> – Not able to be corrected, improved, or reformed. <strong>असुधारनीय\n\nInvincible (adjective)</strong> – Too powerful to be defeated or overcome. <strong>अजेय"}, {"id": "160235", "question": "Select the idiom which should be the correct explanation of the given line:<br> When accused of corruption, the minister told the press a long <strong>cock and bull story</strong> about being framed by rivals. His supporters hoped he would <strong>win laurels</strong> through his social work. However, critics said he only <strong>harped on the same string</strong> in every speech, blaming others. Soon, he found himself <strong>at odds</strong> with senior party leaders.</p> <p><strong>Meaning to identify:</strong> in conflict or at variance.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> To win laurels", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> To harp on the same string", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> At odds", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Cock and bull story"], "correct_answer": 2, "solution": "<strong>C) At odds</strong> (idiom) – in conflict or at variance.. असहमति या विरोध में होना।\n\n<strong>Cock and bull story</strong> (idiom) – An unbelievable and absurd story. बेतुकी और अविश्वसनीय कहानी।\n\n<strong>To win laurels</strong> (idiom) – To achieve distinction or honor. सम्मान या प्रतिष्ठा अर्जित करना।\n\n<strong>To harp on the same string</strong> (idiom) – To keep repeating the same thing. एक ही बात बार-बार दोहराना।"}, {"id": "160232", "question": "<strong>Select the most appropriate idiom to fill in the blank:</strong><br> Despite being warned about the risks of confronting the influential businessman, the young journalist decided to go ahead, knowing he was stirring up a __________.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> hornet’s nest", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> kith and kin", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> fishy", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> to worship the rising sun"], "correct_answer": 0, "solution": "A) hornet’s nest\n\n<strong>Hornet’s nest</strong> – A situation that is full of trouble and likely to provoke anger or conflict. मुसीबत या झगड़े की स्थिति\n\n<strong>Kith and kin</strong> – Friends and relatives. मित्र और रिश्तेदार\n\n<strong>Fishy</strong> – Suspicious or not quite right. संदिग्ध\n\n<strong>To worship the rising sun</strong> – To support or show favour to a person who is becoming successful. बढ़ते हुए व्यक्ति की पूजा करना"}, {"id": "160265", "question": "<strong>In the following sentence, a word is given in brackets. Select the appropriate word from the options to fill in the blank so that it is the closest synonym of the word given in brackets.</strong></p> <p>His alibi for the night of the crime seemed ____________________ (QUESTIONABLE) and made the police suspicious.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Dubious", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Gelid", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Mellifluous", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Verdant"], "correct_answer": 0, "solution": "A) <strong>Dubious</strong> (adjective) – Suspect, doubtful, possibly dishonest. संदिग्ध / शक़ी\n\n<strong>Synonym: Questionable </strong>(adjective) – Likely to be doubted; not clearly true or trustworthy. संदिग्ध / शंकास्पद\n\n<strong>Gelid </strong>– Extremely cold. बहुत ठंडा\n\n<strong>Mellifluous </strong>– Sweet-sounding. मधुर\n\n<strong>Verdant </strong>– Green with vegetation. हरा-भरा"}, {"id": "160229", "question": "<strong>In the following question, List I contains idioms/phrases, and List II contains sentences with blanks where these idioms/phrases should be filled. Match the idioms in List I with their correct usage in List II and select the correct answer using the code given below the Lists.</strong></p> <p><strong>LIST I</strong></p> <p>1. The last nail in the coffin</p> <p>2. To go to the dogs</p> <p>3. To bell the cat</p> <p>4. Time and tide</p> <p><strong>LIST II</strong><br> A. Everyone agreed that someone should confront the corrupt manager, but no one dared ....................... .<br> B. The closure of the main branch was ....................... for the struggling company.<br> C. The once-flourishing town has ....................... after the factory shutdown.<br> D. We must act quickly, for ....................... wait for none.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> 1-B, 2-C, 3-A, 4-D", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> 1-D, 2-B, 3-C, 4-A", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> 1-B, 2-A, 3-D, 4-C", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> 1-A, 2-D, 3-B, 4-C"], "correct_answer": 0, "solution": "A) 1-B, 2-C, 3-A, 4-D\n\n<strong>The last nail in the coffin</strong> – The final event that leads to failure. अंतिम चोट जो बर्बादी का कारण बने\n\nCorrect usage: The branch closure was the last nail in the coffin for the company.\n\n<strong>To go to the dogs</strong> – To deteriorate or decline in quality. पतन होना\n\nCorrect usage: The town has gone to the dogs after the shutdown.\n\n<strong>To bell the cat</strong> – To undertake a risky or dangerous task. खतरनाक कार्य को हाथ में लेना\n\nCorrect usage: No one dared to bell the cat and confront the corrupt manager.\n\n<strong>Time and tide</strong> – Opportunities that must be seized quickly; they do not wait. समय और अवसर किसी के लिए नहीं रुकते\n\nCorrect usage: Time and tide wait for none, so act fast."}, {"id": "160240", "question": "<strong>Read the following description carefully and choose the correct one-word substitution of 'Something' that best describes the condition being portrayed.</strong></p> <p>Something means to deliberately exclude, avoid, or banish a person from a group, society, or community as a form of punishment or social rejection.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Excommunicate", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Expel", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Ostracize", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Boycott"], "correct_answer": 2, "solution": "C) Ostracize (verb)</strong> – To exclude or banish someone from a society, group, or community. <strong>बहिष्कार करना / निकाल देना\n\nExcommunicate (verb)</strong> – Officially exclude someone from participation in the sacraments and services of the Christian Church. <strong>धार्मिक बहिष्कार\n\nExpel (verb)</strong> – To force someone to leave a place, especially a school or country. <strong>निकाल देना\n\nBoycott (verb)</strong> – To refuse to buy, use, or participate as a protest. <strong>बहिष्कार करना"}, {"id": "160270", "question": "<strong>Choose the most appropriate option to change the voice (active/passive) form of the given sentence:</strong><br> The international space research consortium might have been conducting a series of classified experiments aboard the orbital station for over a year before the public became aware of them.<br>", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> A series of classified experiments aboard the orbital station might be conducted by the international space research consortium for over a year before the public became aware of them.", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> A series of classified experiments aboard the orbital station might have been being conducted by the international space research consortium for over a year before the public became aware of them.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> A series of classified experiments aboard the orbital station might have been conducted by the international space research consortium for over a year before the public became aware of them.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> A series of classified experiments aboard the orbital station were being conducted by the international space research consortium for over a year before the public became aware of them."], "correct_answer": 1, "solution": "B) A series of classified experiments aboard the orbital station might have been being conducted by the international space research consortium for over a year before the public became aware of them\n\nTense Identification: “might have been conducting” → Modal + Perfect Continuous Tense.<br> Passive Rule: Modal + have + been + being + V3.<br> In Passive, “might have been conducting” becomes “might have been being conducted.”<br> Object: “a series of classified experiments aboard the orbital station” moves to the start.<br> Time phrase “for over a year” and result clause “before the public became aware” remain unchanged.<br> यह Modal + Perfect Continuous का Passive है। Active रूप “might have been conducting” को Passive में “might have been being conducted” बनाया गया।"}, {"id": "160248", "question": "<strong>Comprehension:</strong></p> <p><strong>In the following passage, some words have been deleted. Read the passage carefully and select the most appropriate option to fill in each blank.</strong></p> <p>China, Pakistan and Bangladesh held their first trilateral meeting in Kunming, China. The discussions focused on _______1_______cooperation and exploring the possibilities of deeper engagement. This meeting closely follows another trilateral meeting between China, Pakistan, and Afghanistan, held in May, with the aim of extending the China-Pakistan Economic Corridor and increasing cooperation. These trilaterals, ______2______ by China, come at a time of Pakistan’s ______3______relevance to the region, India’s increasing relations with Afghanistan, and New Delhi’s deteriorating ties with Bangladesh. The use of trilaterals ________4_______ China’s fresh attempts at making Pakistan a stakeholder in the region and keeping New Delhi preoccupied ________5________immediate concerns.</p> <p><strong>Select the most appropriate option to fill in blank number 1.</strong>", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> acquiescing", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> furthering", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> stymieing", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> thwarting"], "correct_answer": 1, "solution": "No solution available"}, {"id": "160249", "question": "<strong>Comprehension:</strong></p> <p><strong>In the following passage, some words have been deleted. Read the passage carefully and select the most appropriate option to fill in each blank.</strong></p> <p>China, Pakistan and Bangladesh held their first trilateral meeting in Kunming, China. The discussions focused on _______1_______cooperation and exploring the possibilities of deeper engagement. This meeting closely follows another trilateral meeting between China, Pakistan, and Afghanistan, held in May, with the aim of extending the China-Pakistan Economic Corridor and increasing cooperation. These trilaterals, ______2______ by China, come at a time of Pakistan’s ______3______relevance to the region, India’s increasing relations with Afghanistan, and New Delhi’s deteriorating ties with Bangladesh. The use of trilaterals ________4_______ China’s fresh attempts at making Pakistan a stakeholder in the region and keeping New Delhi preoccupied ________5________immediate concerns.</p> <p><strong>Select the most appropriate option to fill in blank number 2.</strong>", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> lead", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> leading", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> leads", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> led"], "correct_answer": 3, "solution": "No solution available"}, {"id": "160250", "question": "<strong>Comprehension:</strong></p> <p><strong>In the following passage, some words have been deleted. Read the passage carefully and select the most appropriate option to fill in each blank.</strong></p> <p>China, Pakistan and Bangladesh held their first trilateral meeting in Kunming, China. The discussions focused on _______1_______cooperation and exploring the possibilities of deeper engagement. This meeting closely follows another trilateral meeting between China, Pakistan, and Afghanistan, held in May, with the aim of extending the China-Pakistan Economic Corridor and increasing cooperation. These trilaterals, ______2______ by China, come at a time of Pakistan’s ______3______relevance to the region, India’s increasing relations with Afghanistan, and New Delhi’s deteriorating ties with Bangladesh. The use of trilaterals ________4_______ China’s fresh attempts at making Pakistan a stakeholder in the region and keeping New Delhi preoccupied ________5________immediate concerns.</p> <p><strong>Select the most appropriate option to fill in blank number 3.</strong>", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> little", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> few", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> least", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> much"], "correct_answer": 0, "solution": "No solution available"}, {"id": "160251", "question": "<strong>Comprehension:</strong></p> <p><strong>In the following passage, some words have been deleted. Read the passage carefully and select the most appropriate option to fill in each blank.</strong></p> <p>China, Pakistan and Bangladesh held their first trilateral meeting in Kunming, China. The discussions focused on _______1_______cooperation and exploring the possibilities of deeper engagement. This meeting closely follows another trilateral meeting between China, Pakistan, and Afghanistan, held in May, with the aim of extending the China-Pakistan Economic Corridor and increasing cooperation. These trilaterals, ______2______ by China, come at a time of Pakistan’s ______3______relevance to the region, India’s increasing relations with Afghanistan, and New Delhi’s deteriorating ties with Bangladesh. The use of trilaterals ________4_______ China’s fresh attempts at making Pakistan a stakeholder in the region and keeping New Delhi preoccupied ________5________immediate concerns.</p> <p><strong>Select the most appropriate option to fill in blank number 4.</strong>", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> belittles", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> downplays", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> marginalises", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> underscores"], "correct_answer": 3, "solution": "No solution available"}, {"id": "160252", "question": "<strong>Comprehension:</strong></p> <p><strong>In the following passage, some words have been deleted. Read the passage carefully and select the most appropriate option to fill in each blank.</strong></p> <p>China, Pakistan and Bangladesh held their first trilateral meeting in Kunming, China. The discussions focused on _______1_______cooperation and exploring the possibilities of deeper engagement. This meeting closely follows another trilateral meeting between China, Pakistan, and Afghanistan, held in May, with the aim of extending the China-Pakistan Economic Corridor and increasing cooperation. These trilaterals, ______2______ by China, come at a time of Pakistan’s ______3______relevance to the region, India’s increasing relations with Afghanistan, and New Delhi’s deteriorating ties with Bangladesh. The use of trilaterals ________4_______ China’s fresh attempts at making Pakistan a stakeholder in the region and keeping New Delhi preoccupied ________5________immediate concerns.</p> <p><strong>Select the most appropriate option to fill in blank number 5. </strong>", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> within", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> without", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> with", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> despite"], "correct_answer": 2, "solution": "No solution available"}, {"id": "160258", "question": "<strong>Sentences of a paragraph are given below in jumbled order. Select the option that arranges the sentences in the correct order to form a meaningful and coherent paragraph.</strong></p> <p>(P) Well, that was an exhausting day.</p> <p>(Q) When about to alight at my destination, my legs stumbled and even before the train entered the station, I landed on the ground.</p> <p>(R) I had left from work early to cling on to my bed. As it was the peak hour, I had no option but to board an overcrowded train.</p> <p>(S) It was a “pause and play” game for about half an hour as I was switching between regaining consciousness and blanking out.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> P, R, Q, S", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Q, P, S, R", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> S, R, Q, P", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> R, P, S, Q"], "correct_answer": 0, "solution": "A) P, R, Q, S\n\nP: Starts with the interjection \"Well\" and subject \"that\" (referring to the day), setting the paragraph's tone as a reflective conclusion.\n\nR: Introduces the pronoun \"I\" (linking to P's context of \"exhausting day\") and past-perfect verbs (\"had left\", \"had\") to explain the background.<br> Q: Uses temporal clause \"When about to alight\" (directly linking to R's train journey) and pronoun \"I\" to describe the incident.<br> S: Begins with pronoun \"It\" (referring to Q's fall) and verb \"was\" to describe the aftermath, completing the sequence logically.\n\nIn Hindi:\n\nP:यह interjection \"Well\" और subject \"that\" के साथ शुरू होता है, जो paragraph के tone को एक reflective conclusion के रूप में set करता है।\n\nR: Pronoun \"I\", P के context (\"exhausting day\") से जुड़ता है, और past-perfect verbs (\"had left\", \"had\") background explain करते हैं।\n\nQ: Temporal clause \"When about to alight\", R की train journey से directly connect होता है, और pronoun \"I\" incident को describe करता है।\n\nS: Pronoun \"It\", Q के fall को refer करता है, और verb \"was\" aftermath describe करता है, जो sequence को logically complete करता है।\n\nB (Q, P, S, R): Starts abruptly with the incident (Q), then jumps to conclusion (P) without context.\n\nC (S, R, Q, P): Begins with aftermath (S) before introducing the incident, confusing the reader.\n\nD (R, P, S, Q): Places conclusion (P) too early, disrupting the cause-effect flow (S before Q is illogical)."}, {"id": "160268", "question": "<strong>In the following sentence, four words are underlined out of which one word is misspelt. Identify the INCORRECTLY spelt word.</strong></p> <p>It is <ins><strong>important </strong></ins>to (A) pinpoint the source of <ins><strong>infection</strong></ins>. Doctors need to (B) locate and <ins><strong>determin </strong></ins>the cause (C) . The <ins><strong>situation </strong></ins>needs urgent attention (D).", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> B", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> C", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> A", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> D"], "correct_answer": 1, "solution": "B) The incorrectly spelt word is <strong>‘determin’</strong>, which should be <strong>‘determine’</strong>, meaning <strong>“to find out or establish exactly”</strong> (किसी चीज़ का सटीक <strong>पता लगाना</strong> या निर्णय लेना)."}, {"id": "160264", "question": "<strong>In the following sentence, a word is given in brackets. Select the appropriate word from the options to fill in the blank so that it is the closest synonym of the word given in brackets.</strong></p> <p>While traveling through the countryside, they came across a ____________________ (PICTURESQUE) little village that looked like it belonged in a painting.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Scenic", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Corpulent", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Pungent", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Tenebrous"], "correct_answer": 0, "solution": "A) <strong>Scenic</strong> (adjective) – Beautiful, charming, and visually attractive, often like a picture. सुंदर / मनोहर ✅\n\n<strong>Synonym: Picturesque </strong>(adjective) – Attractively unusual or visually charming, like a picture. सुंदर व अनोखा / चित्रवत\n\n<strong>Corpulent </strong>– Excessively fat. मोटा\n\n<strong>Pungent </strong>– Having a strong, sharp smell or taste. तीखा\n\n<strong>Tenebrous </strong>– Dark, shadowy. अंधकारमय"}, {"id": "160271", "question": "<strong>Choose the most appropriate option to change the voice (active/passive) form of the given sentence:</strong><br> The archaeological team will have been analyzing the rare artifacts recovered from the submerged city for several months before they are displayed in the national museum.<br>", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The rare artifacts recovered from the submerged city will be analyzed by the archaeological team for several months before they are displayed in the national museum.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The rare artifacts recovered from the submerged city will have been analyzed by the archaeological team for several months before they are displayed in the national museum.", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> The rare artifacts recovered from the submerged city will have been being analyzed by the archaeological team for several months before they are displayed in the national museum.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The rare artifacts recovered from the submerged city were analyzed by the archaeological team for several months before they are displayed in the national museum."], "correct_answer": 2, "solution": "C)The rare artifacts recovered from the submerged city will have been being analyzed by the archaeological team for several months before they are displayed in the national museum.\n\nTense Identification: “will have been analyzing” → Future Perfect Continuous Tense.<br> Passive Rule: Future Perfect Continuous का Passive = will have been being + V3.<br> Here, “will have been analyzing” becomes “will have been being analyzed.”<br> Object: “the rare artifacts recovered from the submerged city” goes to the start in passive.<br> The time phrase “for several months” and purpose clause remain unchanged.<br> यह Future Perfect Continuous Tense है। Passive में “will have been being analyzed” का प्रयोग किया जाता है। Object को शुरुआत में लाकर Subject “by the archaeological team” को अंत में रखा गया।"}, {"id": "160269", "question": "<strong>In the following sentence, four words are underlined out of which one word is misspelt. Identify the INCORRECTLY spelt word.</strong><br> Sleep is an <ins><strong>intregral </strong></ins>(A) part of <strong><ins>maintaining </ins></strong>good health. (B) Without <strong><ins>proper </ins></strong>rest, the body suffers. (C) Mental <strong><ins>clarity </ins></strong>also reduces. (D)", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> C", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> D", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> A", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> B"], "correct_answer": 2, "solution": "<strong>C)</strong> The incorrectly spelt word is <strong>‘intregral’</strong> which should be corrected to <strong>‘integral’</strong>, meaning <em>“essential and necessary part of something”</em> (जरूरी और अविभाज्य हिस्सा)।"}, {"id": "160272", "question": "<strong>Choose the most appropriate option to change the voice (active/passive) form of the given sentence:</strong><br> The government’s disaster management unit had been implementing multiple contingency plans in coastal areas for nearly a year before the cyclone struck.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Multiple contingency plans in coastal areas had been implemented by the government’s disaster management unit for nearly a year before the cyclone struck.", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Multiple contingency plans in coastal areas had been being implemented by the government’s disaster management unit for nearly a year before the cyclone struck.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Multiple contingency plans in coastal areas were being implemented by the government’s disaster management unit for nearly a year before the cyclone struck.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Multiple contingency plans in coastal areas had been implementing by the government’s disaster management unit for nearly a year before the cyclone struck."], "correct_answer": 1, "solution": "B)Multiple contingency plans in coastal areas had been being implemented by the government’s disaster management unit for nearly a year before the cyclone struck.<br> Tense Identification: “had been implementing” → Past Perfect Continuous Tense.<br> Passive Rule: Past Perfect Continuous का Passive = had been being + V3. Here, “had been implementing” changes to “had been being implemented.”<br> Object: “multiple contingency plans in coastal areas” is placed at the beginning in passive.<br> The time phrase “for nearly a year” and the result clause remain as they are.<br> यह Past Perfect Continuous है और Passive में इसका रूप “had been being implemented” होता है। Object को Passive वाक्य के शुरू में लाकर Subject “by the government’s disaster management unit” को End में रखा गया।"}, {"id": "160260", "question": "<strong>Sentences of a paragraph are given below in jumbled order. Select the option that arranges the sentences in the correct order to form a meaningful and coherent paragraph.</strong></p> <p>A. I don’t cry on occasions when most people do — at cremations, farewells, or after watching a gut-wrenching movie. Does that make me less human?</p> <p>B. There was sorrow and overwhelming grief, but the tears just never came. I didn’t cry when I was publicly humiliated, or deeply hurt, or had a serious setback.</p> <p>C. I don’t tear up easily.</p> <p>D. I didn’t cry when my parents died", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> C, D, B, A", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> C, B, A, D", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> B, D, C, A", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> B, C, D, A"], "correct_answer": 0, "solution": "A) C, D, B, A\n\nC: Starts the paragraph by introducing the subject \"I\" and a general state (not tearing up easily).<br> D: Follows C logically by using the same subject \"I\" and intensifying the claim with the strongest possible example (parents' death). The verb \"didn't cry\" directly supports \"don’t tear up easily.\"<br> B: Follows D by continuing with the same subject \"I\" (implied in the second sentence). It elaborates on the theme from D using the conjunction \"but\" to contrast internal feeling (\"sorrow\") with lack of tears. It then lists other specific examples (\"publicly humiliated,\" \"deeply hurt,\" \"serious setback\") using \"or\" for parallel structure, expanding on the idea introduced in D.<br> A: Follows B and concludes the paragraph. It starts by summarizing the main point using the same subject \"I\" and verb phrase \"don’t cry,\" connecting directly back to B and D. It provides general occasions (\"cremations,\" etc.) using \"or,\" mirroring the structure in B. The rhetorical question (\"Does that make me less human?\") naturally concludes the reflection started in C, D, and B\n\nयह paragraph की शुरुआत करता है, subject \"I\" और एक general state (आसानी से आँसू नहीं आना) introduce करता है।\n\nयह C के बाद आता है क्योंकि यह same subject \"I\" का use करता है और अपनी बात को सबसे मजबूत उदाहरण (parents की मौत) से support करता है। Verb \"didn't cry\", \"don’t tear up easily\" को directly support करती है।<br> यह D के बाद आता है क्योंकि यह same subject \"I\" को जारी रखता है (second sentence में implied)। यह D के theme को \"but\" conjunction से elaborate करता है, जो internal feeling (\"sorrow\") और lack of tears के बीच contrast दिखाता है। फिर यह \"or\" का use करते हुए अन्य specific उदाहरण (\"publicly humiliated,\" आदि) देता है, जो D में introduce idea को expand करते हैं।\n\nयह B के बाद आकर paragraph को समाप्त करता है। यह same subject \"I\" और verb phrase \"don’t cry\" से शुरू होता है, जो सीधे B और D से connect करता है। यह \"or\" का use करके general occasions (\"cremations,\" आदि) देता है, जो B की structure से match करता है। Rhetorical question (\"Does that make...?\") C, D और B में शुरू हुई reflection को naturally conclude करती है।"}];
        const examConfig = {
            id: '8136',
            duration: 20,
            positiveMarks: 1.0,
            negativeMarks: 0.25
        };
        
        let currentQuestionIndex = 0;
        let userAnswers = {};
        let flaggedQuestions = new Set();
        let timeLeft = examConfig.duration * 60;
        let timerInterval;
        let isTestFinished = false;
        let solutionMode = false;
        let touchStartX = 0;
        let touchStartY = 0;
        
        // Initialize app
        function initializeApp() {
            createParticles();
            generateQuestionsGrid();
            loadQuestion();
            startTimer();
            setupTouchGestures();
            setupAutoSave();
            
            // Prevent accidental page leave
            window.addEventListener('beforeunload', (e) => {
                if (!isTestFinished) {
                    e.preventDefault();
                    e.returnValue = 'Test in progress. Are you sure you want to leave?';
                }
            });
        }
        
        // Create floating particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = window.innerWidth < 768 ? 20 : 40;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 3 + 3) + 's';
                particlesContainer.appendChild(particle);
            }
        }
        
        // Load current question
        function loadQuestion() {
            const question = questions[currentQuestionIndex];
            
            // Update question info
            document.getElementById('questionNumber').textContent = `Q${currentQuestionIndex + 1}`;
            document.getElementById('questionProgress').textContent = 
                `${currentQuestionIndex + 1} of ${questions.length}`;
            document.getElementById('questionText').innerHTML = question.question;
            
            // Load options
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            
            question.options.forEach((option, index) => {
                const optionElement = document.createElement('div');
                optionElement.className = 'option';
                optionElement.innerHTML = option;
                
                const indicator = document.createElement('div');
                indicator.className = 'option-indicator';
                optionElement.appendChild(indicator);
                
                if (solutionMode) {
                    // Show solution mode styling
                    if (index === question.correct_answer) {
                        optionElement.classList.add('correct');
                        indicator.textContent = '✓';
                    } else if (userAnswers[currentQuestionIndex] === index) {
                        optionElement.classList.add('incorrect');
                        indicator.textContent = '✗';
                    } else {
                        optionElement.classList.add('disabled');
                    }
                    optionElement.style.pointerEvents = 'none';
                } else {
                    // Normal mode
                    if (userAnswers[currentQuestionIndex] === index) {
                        optionElement.classList.add('selected');
                        indicator.textContent = '✓';
                    }
                    
                    optionElement.onclick = () => selectOption(index);
                    optionElement.onkeydown = (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            selectOption(index);
                        }
                    };
                    optionElement.tabIndex = 0;
                }
                
                optionsContainer.appendChild(optionElement);
            });
            
            // Handle solution panel
            const solutionPanel = document.getElementById('solutionPanel');
            if (solutionMode && question.solution) {
                document.getElementById('solutionContent').innerHTML = question.solution;
                solutionPanel.classList.add('show');
            } else {
                solutionPanel.classList.remove('show');
            }
            
            // Update navigation
            updateNavigation();
            updateQuestionsGrid();
            updateFlagButton();
            
            // Add entrance animation
            const container = document.getElementById('questionContainer');
            container.style.transform = 'translateY(20px)';
            container.style.opacity = '0';
            setTimeout(() => {
                container.style.transform = 'translateY(0)';
                container.style.opacity = '1';
            }, 100);
        }
        
        // Select an option
        function selectOption(index) {
            if (solutionMode) return;
            
            const currentAnswer = userAnswers[currentQuestionIndex];
            
            if (currentAnswer === index) {
                // Deselect if clicking the same option
                delete userAnswers[currentQuestionIndex];
            } else {
                // Select new option
                userAnswers[currentQuestionIndex] = index;
            }
            
            // Update UI
            const options = document.querySelectorAll('.option');
            options.forEach((option, i) => {
                const indicator = option.querySelector('.option-indicator');
                if (userAnswers[currentQuestionIndex] === i) {
                    option.classList.add('selected');
                    indicator.textContent = '✓';
                } else {
                    option.classList.remove('selected');
                    indicator.textContent = '';
                }
            });
            
            updateQuestionsGrid();
            showAutoSave();
        }
        
        // Generate questions grid
        function generateQuestionsGrid() {
            const grid = document.getElementById('questionsGrid');
            grid.innerHTML = '';
            
            questions.forEach((_, index) => {
                const button = document.createElement('button');
                button.className = 'question-btn';
                button.textContent = index + 1;
                button.onclick = () => goToQuestion(index);
                button.setAttribute('aria-label', `Go to question ${index + 1}`);
                grid.appendChild(button);
            });
        }
        
        // Update questions grid styling
        function updateQuestionsGrid() {
            const buttons = document.querySelectorAll('.question-btn');
            buttons.forEach((button, index) => {
                button.className = 'question-btn';
                
                if (index === currentQuestionIndex) {
                    button.classList.add('current');
                } else if (solutionMode) {
                    if (userAnswers[index] === questions[index].correct_answer) {
                        button.classList.add('correct');
                    } else if (userAnswers[index] !== undefined) {
                        button.classList.add('incorrect');
                    }
                } else if (userAnswers[index] !== undefined) {
                    button.classList.add('answered');
                }
                
                if (flaggedQuestions.has(index)) {
                    button.classList.add('flagged');
                }
            });
        }
        
        // Navigation functions
        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
            }
        }
        
        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else if (!solutionMode) {
                submitTest();
            }
        }
        
        function goToQuestion(index) {
            currentQuestionIndex = index;
            loadQuestion();
            closeSidebar();
        }
        
        function updateNavigation() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            
            prevBtn.disabled = currentQuestionIndex === 0;
            
            if (solutionMode) {
                nextBtn.textContent = currentQuestionIndex === questions.length - 1 ? 
                    'Finish Review' : 'Next →';
                nextBtn.onclick = currentQuestionIndex === questions.length - 1 ? 
                    finishReview : nextQuestion;
            } else {
                nextBtn.textContent = currentQuestionIndex === questions.length - 1 ? 
                    'Submit Test' : 'Next →';
                nextBtn.onclick = currentQuestionIndex === questions.length - 1 ? 
                    submitTest : nextQuestion;
            }
        }
        
        // Timer functions
        function startTimer() {
            const timerElement = document.getElementById('timer');
            const progressCircle = document.getElementById('progressCircle');
            const circumference = 2 * Math.PI * 18;
            const totalTime = examConfig.duration * 60;
            
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    submitTest();
                    return;
                }
                
                timeLeft--;
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerElement.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                
                // Update progress circle
                const progress = (totalTime - timeLeft) / totalTime;
                const offset = circumference * progress;
                progressCircle.style.strokeDashoffset = offset;
                
                // Add warning effects
                if (timeLeft <= 300) { // 5 minutes
                    timerElement.classList.add('warning');
                }
                if (timeLeft <= 60) { // 1 minute
                    timerElement.classList.add('critical');
                }
            }, 1000);
        }
        
        // Toggle question flag
        function toggleFlag() {
            if (flaggedQuestions.has(currentQuestionIndex)) {
                flaggedQuestions.delete(currentQuestionIndex);
            } else {
                flaggedQuestions.add(currentQuestionIndex);
            }
            updateFlagButton();
            updateQuestionsGrid();
        }
        
        function updateFlagButton() {
            const flagBtn = document.getElementById('flagBtn');
            if (flaggedQuestions.has(currentQuestionIndex)) {
                flagBtn.textContent = '🏴 Unflag Question';
                flagBtn.style.background = 'rgba(239, 68, 68, 0.2)';
                flagBtn.style.color = 'var(--error)';
            } else {
                flagBtn.textContent = '🚩 Flag Question';
                flagBtn.style.background = 'rgba(245, 158, 11, 0.2)';
                flagBtn.style.color = 'var(--warning)';
            }
        }
        
        // Theme toggle
        function toggleTheme() {
            const body = document.body;
            const themeBtn = document.getElementById('themeBtn');
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            body.setAttribute('data-theme', newTheme);
            themeBtn.textContent = newTheme === 'light' ? '🌙' : '☀️';
            
            // Save preference
            localStorage.setItem('theme', newTheme);
        }
        
        // Sidebar functions
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            
            sidebar.classList.toggle('open');
            overlay.classList.toggle('show');
        }
        
        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('show');
        }
        
        // Touch gesture support
        function setupTouchGestures() {
            const main = document.querySelector('.main');
            
            main.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            });
            
            main.addEventListener('touchend', (e) => {
                const touchEndX = e.changedTouches[0].clientX;
                const touchEndY = e.changedTouches[0].clientY;
                const deltaX = touchEndX - touchStartX;
                const deltaY = touchEndY - touchStartY;
                
                // Only trigger if horizontal swipe is dominant
                if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 50) {
                    if (deltaX > 0 && currentQuestionIndex > 0) {
                        // Swipe right - previous question
                        previousQuestion();
                    } else if (deltaX < 0 && currentQuestionIndex < questions.length - 1) {
                        // Swipe left - next question
                        nextQuestion();
                    }
                }
            });
        }
        
        // Auto-save functionality
        function setupAutoSave() {
            // Save answers periodically
            setInterval(() => {
                if (!isTestFinished) {
                    saveProgress();
                }
            }, 30000); // Every 30 seconds
        }
        
        function saveProgress() {
            const progress = {
                answers: userAnswers,
                flagged: Array.from(flaggedQuestions),
                currentQuestion: currentQuestionIndex,
                timeLeft: timeLeft
            };
            
            // In a real implementation, this would save to a server
            console.log('Progress saved:', progress);
        }
        
        function showAutoSave() {
            const autoSave = document.getElementById('autoSave');
            autoSave.classList.add('show');
            setTimeout(() => {
                autoSave.classList.remove('show');
            }, 2000);
        }
        
        // Submit test
        function submitTest() {
            if (isTestFinished) return;
            
            isTestFinished = true;
            clearInterval(timerInterval);
            
            // Calculate results
            let correct = 0, wrong = 0, skipped = 0, totalMarks = 0;
            
            questions.forEach((question, index) => {
                if (userAnswers[index] === undefined) {
                    skipped++;
                } else if (userAnswers[index] === question.correct_answer) {
                    correct++;
                    totalMarks += examConfig.positiveMarks;
                } else {
                    wrong++;
                    totalMarks -= examConfig.negativeMarks;
                }
            });
            
            const maxMarks = questions.length * examConfig.positiveMarks;
            const percentage = Math.max(0, Math.round((totalMarks / maxMarks) * 100));
            
            // Show results
            document.getElementById('resultTitle').textContent = 
                `${correct}/${questions.length} Correct`;
            document.getElementById('resultSubtitle').textContent = 
                `You scored ${totalMarks} out of ${maxMarks} marks`;
            document.getElementById('correctCount').textContent = correct;
            document.getElementById('wrongCount').textContent = wrong;
            document.getElementById('skippedCount').textContent = skipped;
            document.getElementById('finalScore').textContent = `${totalMarks} Marks`;
            document.getElementById('finalPercentage').textContent = `${percentage}%`;
            
            document.getElementById('resultModal').classList.add('show');
            closeSidebar();
        }
        
        // View solutions
        function viewSolutions() {
            document.getElementById('resultModal').classList.remove('show');
            solutionMode = true;
            currentQuestionIndex = 0;
            loadQuestion();
        }
        
        // Finish review
        function finishReview() {
            solutionMode = false;
            currentQuestionIndex = 0;
            loadQuestion();
        }
        
        // Retake test
        function retakeTest() {
            if (confirm('Are you sure you want to retake the test? All progress will be lost.')) {
                location.reload();
            }
        }
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (solutionMode) return;
            
            switch(e.key) {
                case 'ArrowLeft':
                    e.preventDefault();
                    previousQuestion();
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    nextQuestion();
                    break;
                case 'f':
                case 'F':
                    if (e.ctrlKey || e.metaKey) {
                        e.preventDefault();
                        toggleFlag();
                    }
                    break;
                case 'm':
                case 'M':
                    if (e.ctrlKey || e.metaKey) {
                        e.preventDefault();
                        toggleSidebar();
                    }
                    break;
                case '1':
                case '2':
                case '3':
                case '4':
                    if (!e.ctrlKey && !e.metaKey) {
                        e.preventDefault();
                        const optionIndex = parseInt(e.key) - 1;
                        if (optionIndex < questions[currentQuestionIndex].options.length) {
                            selectOption(optionIndex);
                        }
                    }
                    break;
            }
        });
        
        // Initialize when DOM is loaded
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeApp);
        } else {
            initializeApp();
        }
        
        // Load saved theme
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            document.body.setAttribute('data-theme', savedTheme);
            document.getElementById('themeBtn').textContent = savedTheme === 'light' ? '🌙' : '☀️';
        }
    </script>
</body>
</html>
