            </div>
            <div class="final-score">
                <div class="score-text" id="finalScore">0 Marks</div>
                <div class="percentage-text" id="finalPercentage">0%</div>
            </div>
            <div class="modal-actions">
                <button class="modal-btn primary" onclick="viewSolutions()">
                    View Solutions
                </button>
                <button class="modal-btn success" onclick="retakeTest()">
                    Retake Test
                </button>
            </div>
        </div>
    </div>
    
    <script>
        // Core Variables
        const questions = [{"id": "137485", "question": "<strong>Select the best express synonym of the given underlined word.</strong></p> <p>The diplomat was praised for his <ins><strong>discreet</strong> </ins>handling of the sensitive negotiations, which kept unnecessary speculations at bay.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Tactful", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Splinter", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Assurance", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Embolden"], "correct_answer": 0, "solution": "<strong>A) Discreet</strong> (adjective) – Cautious, Tactful, Prudent, Careful, Judicious सतर्क\n\n<strong>Synonym:</strong> <strong>Tactful</strong> (adjective) – Diplomatic, discreet, considerate, prudent. सतर्क\n\n<strong>Splinter</strong> (noun) – Fragment, shard, sliver, chip, piece टुकड़ा\n\n<strong>Assurance</strong> (noun) – guarantee, promise, pledge, vow, affirmation आश्वासन\n\n<strong>Embolden</strong> (verb) – encourage, hearten, enhearten, inspire साहस देना"}, {"id": "137475", "question": "<strong>Select the best express Antonym of the given underlined word.</strong></p> <p>The project's success is <ins><strong>contingent </strong></ins>on the timely arrival of the new software, making coordination crucial.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Disruptive", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Transparency", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Intermittently", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Independent"], "correct_answer": 3, "solution": "<strong>D) Contingent</strong> (on) (adjective) – Dependent, Conditional, Subject, Reliant, Based निर्भर\n\n<strong>Antonym: Independent</strong> (adjective) – Free, autonomous, self-reliant, uncontrolled. स्वतंत्र\n\n<strong>Disruptive</strong> (adjective) – Destabilizing, disturbing, disorderly, chaotic, tumultuous विघटनकारी\n\n<strong>Transparency</strong> (noun) – Clarity, openness, lucidity, pellucidity, clearness पारदर्शिता\n\n<strong>Intermittently</strong> (adverb) – Periodically, sporadically, irregularly, occasionally, at intervals रुक-रुक कर"}, {"id": "137486", "question": "<strong>Select the best express synonym of the given underlined word.</strong></p> <p>Due to budget cuts, the resources allocated to the department were <ins><strong>meagre</strong></ins>, barely covering the basic necessities.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Abundant", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Plentiful", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Bountiful", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Insufficient"], "correct_answer": 3, "solution": "<strong>D) Meagre</strong> (adjective) – Scanty, Insufficient, Paltry, Negligible, Minimal अल्प\n\n<strong>Synonym: Insufficient</strong> (adjective) – Inadequate, lacking, meagre, deficient. अपर्याप्त<br> <strong>Abundant</strong> (adjective) – Plentiful, ample, copious. प्रचुर<br> <strong>Plentiful</strong> (adjective) – Abundant, ample, sufficient. बहुत<br> <strong>Bountiful</strong> (adjective) – Generous, abundant, ample. प्रचुर"}, {"id": "137476", "question": "<strong>Select the best express Antonym of the given underlined word.</strong></p> <p>The student's artwork <ins><strong>mirrored</strong> </ins>the style of the famous painter, capturing his unique use of color and form.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Disguise", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Apathetic", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Rude", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Modest"], "correct_answer": 0, "solution": "<strong>A) Mirror</strong> (verb) – Reflect, Imitate, Copy, Echo, Reproduce प्रतिबिंबित करना\n\n<strong>Antonym: Disguise</strong> (verb) – Give (someone or oneself) a different appearance in order to conceal one's identity. छिपाना\n\n<strong>Apathetic</strong> (adjective) – Indifferent, showing no emotion or interest. उदासीन, निस्पृह\n\n<strong>Rude</strong> (adjective) – Impolite, disrespectful, offensive. असभ्य, अभद्र\n\n<strong>Modest</strong> (adjective) – Humble, unassuming, not boastful. विनम्र, साधारण"}, {"id": "137487", "question": "<strong>Select the best express synonym of the given underlined word.</strong></p> <p>She was <ins><strong>instrumental</strong> </ins>in the success of the community project, leading efforts that brought significant improvements to the area.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Unhelpful", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Crucial", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Detrimental", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Optional"], "correct_answer": 1, "solution": "<strong>B) Instrumental</strong> (adjective) – Crucial, Key, Vital, Essential, Pivotal महत्वपूर्ण\n\n<strong>Synonym: Crucial</strong> (adjective) – Critical, essential, decisive, pivotal. महत्वपूर्ण\n\n<strong>Unhelpful</strong> (adjective) – Useless, ineffective, futile, obstructive. अनुपयोगी\n\n<strong>Detrimental</strong> (adjective) – Harmful, damaging, adverse, deleterious. हानिकारक\n\n<strong>Optional</strong> (adjective) – Voluntary, discretionary, elective, non-compulsory. वैकल्पिक"}, {"id": "137477", "question": "<strong>Select the best express Antonym of the given underlined word.</strong></p> <p>The film portrayed the <ins><strong>dismal</strong> </ins>realities of war, leaving the audience in a reflective silence.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Promising", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Gloomy", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Bleak", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Grim"], "correct_answer": 0, "solution": "<strong>A) Dismal</strong> (adjective) – Gloomy, Depressing, Bleak, Grim, Dire निराशाजनक\n\n<strong>Antonym: Promising</strong> (adjective) – Likely to succeed or show good results, hopeful, encouraging. आशाजनक\n\n<strong>Gloomy</strong> (adjective) – Dark, dim, dreary, depressing. उदास\n\n<strong>Bleak</strong> (adjective) – Cold and miserable, offering little hope, harsh. सुनसान\n\n<strong>Grim</strong> (adjective) – Forbidding or uninviting, stern, harsh. कठोर/ निर्मम"}, {"id": "137488", "question": "<strong>Select the best express synonym of the given underlined word.</strong></p> <p>Adding too many features at once could <ins><strong>complicate</strong> </ins>the development process of the new software.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Simplify", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Clarify", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Entangle", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Illuminate"], "correct_answer": 2, "solution": "<strong>C) Complicate</strong> (verb) – Confuse, Entangle, Aggravate, Obstruct, Muddle जटिल<strong> </strong>बनाना\n\n<strong>Synonym: Entangle</strong> (verb) – Complicate, tangle, involve, intertwine. उलझाना\n\n<strong>Simplify</strong> (verb) – Make simple, ease, clarify, streamline. सरल बनाना\n\n<strong>Clarify</strong> (verb) – Make clear, elucidate, explain. स्पष्ट करना\n\n<strong>Illuminate</strong> (verb) – Light up, clarify, enlighten. रोशन करना"}, {"id": "137478", "question": "<strong>Select the best express Antonym of the given underlined word.</strong></p> <p>Over the years, they developed a strong <ins><strong>rapport</strong> </ins>that helped them overcome many challenging situations together.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Encounter", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Alacrity", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Expulsion", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Discord"], "correct_answer": 3, "solution": "<strong>D) Rapport</strong> (noun) – Connection, Bond, Harmony, Understanding, Relationship तालमेल\n\n<strong>Antonym: Discord</strong> (noun) – Disagreement, strife, conflict, disharmony. असहमति\n\n<strong>Encounter</strong> (noun) – Meeting, confrontation, clash, experience, interaction सामना\n\n<strong>Alacrity</strong> (noun) – Eagerness, readiness, willingness, enthusiasm, promptness तत्परता\n\n<strong>Expulsion</strong> (noun) – Ejection, removal, eviction, dismissal, exclusion निष्कासन"}, {"id": "137489", "question": "<strong>Select the best express synonym of the given underlined word.</strong></p> <p>Small businesses have been <ins><strong>exempt</strong> </ins>from the new tax regulation, which has been a relief for many.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Free", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Adjacent", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Nearby", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Immediate"], "correct_answer": 0, "solution": "<strong>A) Exempt</strong> (verb) – Exclude, Excuse, Free, Release, Spare छूट देना\n\n<strong>Synonym:</strong> <strong>Free</strong> (verb) – Release from captivity, confinement, or slavery. मुक्त करना\n\n<strong>Adjacent</strong> (adjective) – Next to or adjoining something else. सटा हुआ\n\n<strong>Nearby</strong> (adjective) – Not far away; close. नजदीक\n\n<strong>Immediate</strong> (adjective) – Occurring or done at once; instant. तत्काल"}, {"id": "137479", "question": "<strong>Select the best express Antonym of the given underlined word.</strong></p> <p>After hours of discussion, they were finally able to <ins><strong>disentangle</strong> </ins>the complex issues that had been hindering the project.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Obstinate", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Complicate", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Adamant", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Competent"], "correct_answer": 1, "solution": "<strong>B) Disentangle</strong> (verb) – Unravel, Separate, Untangle, Resolve, Clarify सुलझाना\n\n<strong>Antonym: Complicate</strong> (verb) – Make (something) more difficult or confusing by causing it to be more complex. उलझाना\n\n<strong>Obstinate</strong> (adjective) – Stubbornly refusing to change one’s opinion or chosen course of action, despite attempts to persuade one to do so. जिद्दी, हठी\n\n<strong>Adamant</strong> (adjective): Refusing to be persuaded or to change one’s mind; unyielding, inflexible. अडिग, दृढ़\n\n<strong>Competent</strong> (adjective): Having the necessary ability, knowledge, or skill to do something successfully. सक्षम"}, {"id": "137490", "question": "<strong>Select the best express synonym of the given underlined word.</strong></p> <p>The ranger was on high alert for any signs of <ins><strong>poaching</strong></ins> in the wildlife reserve.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Gardening", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Farming", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Illegal hunting", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Birdwatching"], "correct_answer": 2, "solution": "<strong>C) Poaching</strong> (noun) – Illegal hunting, Trespassing, Stealing, Unlawful fishing, Theft अवैध<strong> </strong>शिकार\n\n<strong>Synonym: Illegal hunting</strong> (noun) – Unlawful game-taking, poaching, illicit hunting. अवैध शिकार\n\n<strong>Gardening</strong> (noun) – Cultivating plants, landscaping, gardening activities. बागवानी\n\n<strong>Farming</strong> (noun) – Agriculture, cultivating land, raising crops. कृषि\n\n<strong>Birdwatching</strong> (noun) – Observing birds as a hobby. पक्षी निरीक्षण"}, {"id": "137480", "question": "<strong>Select the best express Antonym of the given underlined word.</strong></p> <p><ins><strong>Trailblazing</strong></ins> technologies like quantum computing and artificial intelligence are setting the stage for a future filled with unimaginable possibilities.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Obsolete", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Conservative", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Routine", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Modern"], "correct_answer": 0, "solution": "<strong>A) Trailblazing</strong> (adjective) – Pioneering, Innovative, Groundbreaking, Revolutionary, Pathbreaking अग्रणी\n\n<strong>Antonym: Obsolete</strong> (adjective) – Outdated, outmoded, no longer in use, antiquated. पुराना\n\n<strong>Conservative</strong> (adjective) – Traditional, conventional, guarded, unadventurous. रूढ़िवादी\n\n<strong>Routine</strong> (adjective) – Regular, standard, normal, customary. नियमित\n\n<strong>Modern</strong> (adjective) – Contemporary, current, state-of-the-art, new. आधुनिक"}, {"id": "137491", "question": "<strong>Select the best express synonym of the given underlined word.</strong></p> <p>The benefits of the new health policy were <ins><strong>tangible</strong></ins>, as citizens experienced improved medical services.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Concrete", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Abstract", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Theoretical", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Speculative"], "correct_answer": 0, "solution": "<strong>A) Tangible</strong> (adjective) – Concrete, Real, Substantial, Visible, Palpable वास्तविक\n\n<strong>Synonym: Concrete</strong> (adjective) – Real, tangible, actual, solid. ठोस<br> <strong>Abstract</strong> (adjective) – Theoretical, conceptual, non-physical. अमूर्त<br> <strong>Theoretical</strong> (adjective) – Hypothetical, abstract, speculative. सैद्धांतिक<br> <strong>Speculative</strong> (adjective) – Theoretical, conjectural, hypothetical. कयासी"}, {"id": "137481", "question": "<strong>Select the best express Antonym of the given underlined word.</strong></p> <p>The two countries reached a <ins><strong>truce</strong> </ins>after months of conflict, bringing much-needed peace to the region.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Conflict", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Unsuitable", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Deep", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Superficial"], "correct_answer": 0, "solution": "<strong>A) Truce</strong> (noun) – Ceasefire, Armistice, Agreement, Peace, Settlement युद्धविराम\n\n<strong>Antonym: Conflict</strong> (noun) – A serious disagreement or argument, typically a protracted one. संघर्ष\n\n<strong>Unsuitable</strong> (adjective) – Not appropriate or fitting for a particular purpose, improper. अनुपयुक्त\n\n<strong>Deep</strong> (adjective) – Having a great depth, profound, intense. गहरा\n\n<strong>Superficial</strong> (adjective) – Shallow, lacking depth or thoroughness, surface-level. सतही"}, {"id": "137492", "question": "<strong>Select the best express synonym of the given underlined word.</strong></p> <p>Over the years, he continued to <ins><strong>hone</strong> </ins>his culinary skills, eventually becoming a master chef.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Prohibit", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Robust", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Improve", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Striking"], "correct_answer": 2, "solution": "<strong>C) Hone</strong> (verb) – Sharpen, refine, improve, polish, cultivate निखारना\n\n<strong>Synonym: Improve</strong> (verb) – Make or become better. सुधारना\n\n<strong>Prohibit</strong> (verb) – Ban, forbid, disallow, prevent, bar निषेध करना\n\n<strong>Robust</strong> (adjective) – Strong, sturdy, resilient, durable, tough मजबूत\n\n<strong>Striking</strong> (adjective) – Remarkable, notable, extraordinary, outstanding, impressive प्रभावशाली"}, {"id": "137482", "question": "<strong>Select the best express Antonym of the given underlined word.</strong></p> <p>The new policy introduced <ins><strong>sweeping</strong> </ins>changes across the healthcare system, impacting millions of people.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Procrastination", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Flexible", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Adamant", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Limited"], "correct_answer": 3, "solution": "<strong>D) Sweeping</strong> (adjective) – Extensive, Comprehensive, Wide-ranging, Broad, All-encompassing व्यापक\n\n<strong>Antonym: Limited</strong> (adjective) – Restricted in size, amount, or extent; few, small, or short. सीमित\n\n<strong>Procrastination</strong> (noun) – The action of delaying or postponing something, putting off tasks intentionally or habitually. आलस्य, टालमटोल\n\n<strong>Flexible</strong> (adjective) – Willing to change or adapt; open-minded and accommodating. लचीला, परिवर्तनशील\n\n<strong>Adamant</strong> (adjective): Refusing to be persuaded or to change one’s mind; unyielding, inflexible. अडिग, दृढ़"}, {"id": "137493", "question": "<strong>Select the best express synonym of the given underlined word.</strong></p> <p>The documentary highlighted the severe <ins><strong>deprivation</strong> </ins>faced by communities lacking access to clean water.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Wealth", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Overflow", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Abundance", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Scarcity"], "correct_answer": 3, "solution": "<strong>D) Deprivation</strong> (noun) – Hardship, scarcity, lack, want, deficit अभाव\n\n<strong>Synonym: Scarcity</strong> (noun) – Insufficiency or shortness of supply. कमी\n\n<strong>Wealth</strong> (noun) – An abundance of valuable possessions or money. धन\n\n<strong>Overflow</strong> (noun) – An excess, something that exceeds what can be contained. बहाव\n\n<strong>Abundance</strong> (noun) – A large quantity of something. प्रचुरता"}, {"id": "137483", "question": "<strong>Select the best express Antonym of the given underlined word.</strong></p> <p>Our community program aims to <ins><strong>foster</strong> </ins>a sense of responsibility and leadership among young adults.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Hinder", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Accommodate", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Departure", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Reinforce"], "correct_answer": 0, "solution": "<strong>A) Foster</strong> (verb) – Encourage, Promote, Nurture, Cultivate, Support प्रोत्साहित करना\n\n<strong>Antonym: Hinder</strong> (verb) – Obstruct, inhibit, impede, hamper. बाधा डालना\n\n<strong>Accommodate</strong> (verb) – Adjust to, fit in with, adapt to, meet, cater to समायोजित करना\n\n<strong>Departure</strong> (noun) – Deviation, divergence, difference, shift, change विचलन\n\n<strong>Reinforce</strong> (verb) – Strengthen, fortify, bolster, intensify, augment मजबूत करना"}, {"id": "137494", "question": "<strong>Select the best express synonym of the given underlined word.</strong></p> <p>Please <ins><strong>spare</strong> </ins>me some time tomorrow so we can go over the details of the report together.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Mean", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Roil", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Preserve", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Sympathetic"], "correct_answer": 2, "solution": "<strong>C) Spare</strong> (verb) – Save, Protect, Preserve, Avoid, Exempt बचाना\n\n<strong>Synonym:</strong> <strong>Preserve</strong> (verb) – To keep safe from harm or injury; to keep in perfect or unaltered condition. संरक्षित करना\n\n<strong>Mean</strong> (adjective) – Unkind, cruel, ungenerous, unpleasant. क्रूर, अनुदार, मतलबी\n\n<strong>Roil</strong> (verb) – Disturb, disrupt, unsettle, shake up, agitate अशांत करना\n\n<strong>Sympathetic</strong> (adjective) – Showing understanding and care, compassionate, kind-hearted. सहानुभूतिशील, दयालु"}, {"id": "137484", "question": "<strong>Select the best express Antonym of the given underlined word.</strong></p> <p>The news of the celebrity's engagement began to <ins><strong>ripple</strong> </ins>through social media, reaching fans worldwide.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Ambiguous", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Timidness", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Contain", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Hawing"], "correct_answer": 2, "solution": "<strong>C) Ripple</strong> (verb) – Spread, Extend, Radiate, Diffuse, Propagate प्रभाव फैलाना\n\n<strong>Antonym: Contain</strong> (verb) – Have or hold (someone or something) within. रोकना\n\n<strong>Ambiguous</strong> (adjective) – Unclear, open to more than one interpretation, vague, confusing, uncertain. अस्पष्ट\n\n<strong>Timidness</strong> (noun) means lack of courage or confidence, shyness. डरपोकपन, झिझक\n\n<strong>Hawing</strong> (noun) refers to hesitating or being indecisive in speech or actions. हिचकिचाहट, झिझक"}];
        const examConfig = {
            id: '6824',
            duration: 20,
            positiveMarks: 1.0,
            negativeMarks: 0.25
        };
        
        let currentQuestionIndex = 0;
        let userAnswers = {};
        let flaggedQuestions = new Set();
        let timeLeft = examConfig.duration * 60;
        let timerInterval;
        let isTestFinished = false;
        let solutionMode = false;
        let touchStartX = 0;
        let touchStartY = 0;
        
        // Initialize app
        function initializeApp() {
            createParticles();
            generateQuestionsGrid();
            loadQuestion();
            startTimer();
            setupTouchGestures();
            setupAutoSave();
            
            // Prevent accidental page leave
            window.addEventListener('beforeunload', (e) => {
                if (!isTestFinished) {
                    e.preventDefault();
                    e.returnValue = 'Test in progress. Are you sure you want to leave?';
                }
            });
        }
        
        // Create floating particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = window.innerWidth < 768 ? 20 : 40;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 3 + 3) + 's';
                particlesContainer.appendChild(particle);
            }
        }
        
        // Load current question
        function loadQuestion() {
            const question = questions[currentQuestionIndex];
            
            // Update question info
            document.getElementById('questionNumber').textContent = `Q${currentQuestionIndex + 1}`;
            document.getElementById('questionProgress').textContent = 
                `${currentQuestionIndex + 1} of ${questions.length}`;
            document.getElementById('questionText').innerHTML = question.question;
            
            // Load options
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            
            question.options.forEach((option, index) => {
                const optionElement = document.createElement('div');
                optionElement.className = 'option';
                optionElement.innerHTML = option;
                
                const indicator = document.createElement('div');
                indicator.className = 'option-indicator';
                optionElement.appendChild(indicator);
                
                if (solutionMode) {
                    // Show solution mode styling
                    if (index === question.correct_answer) {
                        optionElement.classList.add('correct');
                        indicator.textContent = '✓';
                    } else if (userAnswers[currentQuestionIndex] === index) {
                        optionElement.classList.add('incorrect');
                        indicator.textContent = '✗';
                    } else {
                        optionElement.classList.add('disabled');
                    }
                    optionElement.style.pointerEvents = 'none';
                } else {
                    // Normal mode
                    if (userAnswers[currentQuestionIndex] === index) {
                        optionElement.classList.add('selected');
                        indicator.textContent = '✓';
                    }
                    
                    optionElement.onclick = () => selectOption(index);
                    optionElement.onkeydown = (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            selectOption(index);
                        }
                    };
                    optionElement.tabIndex = 0;
                }
                
                optionsContainer.appendChild(optionElement);
            });
            
            // Handle solution panel
            const solutionPanel = document.getElementById('solutionPanel');
            if (solutionMode && question.solution) {
                document.getElementById('solutionContent').innerHTML = question.solution;
                solutionPanel.classList.add('show');
            } else {
                solutionPanel.classList.remove('show');
            }
            
            // Update navigation
            updateNavigation();
            updateQuestionsGrid();
            updateFlagButton();
            
            // Add entrance animation
            const container = document.getElementById('questionContainer');
            container.style.transform = 'translateY(20px)';
            container.style.opacity = '0';
            setTimeout(() => {
                container.style.transform = 'translateY(0)';
                container.style.opacity = '1';
            }, 100);
        }
        
        // Select an option
        function selectOption(index) {
            if (solutionMode) return;
            
            const currentAnswer = userAnswers[currentQuestionIndex];
            
            if (currentAnswer === index) {
                // Deselect if clicking the same option
                delete userAnswers[currentQuestionIndex];
            } else {
                // Select new option
                userAnswers[currentQuestionIndex] = index;
            }
            
            // Update UI
            const options = document.querySelectorAll('.option');
            options.forEach((option, i) => {
                const indicator = option.querySelector('.option-indicator');
                if (userAnswers[currentQuestionIndex] === i) {
                    option.classList.add('selected');
                    indicator.textContent = '✓';
                } else {
                    option.classList.remove('selected');
                    indicator.textContent = '';
                }
            });
            
            updateQuestionsGrid();
            showAutoSave();
        }
        
        // Generate questions grid
        function generateQuestionsGrid() {
            const grid = document.getElementById('questionsGrid');
            grid.innerHTML = '';
            
            questions.forEach((_, index) => {
                const button = document.createElement('button');
                button.className = 'question-btn';
                button.textContent = index + 1;
                button.onclick = () => goToQuestion(index);
                button.setAttribute('aria-label', `Go to question ${index + 1}`);
                grid.appendChild(button);
            });
        }
        
        // Update questions grid styling
        function updateQuestionsGrid() {
            const buttons = document.querySelectorAll('.question-btn');
            buttons.forEach((button, index) => {
                button.className = 'question-btn';
                
                if (index === currentQuestionIndex) {
                    button.classList.add('current');
                } else if (solutionMode) {
                    if (userAnswers[index] === questions[index].correct_answer) {
                        button.classList.add('correct');
                    } else if (userAnswers[index] !== undefined) {
                        button.classList.add('incorrect');
                    }
                } else if (userAnswers[index] !== undefined) {
                    button.classList.add('answered');
                }
                
                if (flaggedQuestions.has(index)) {
                    button.classList.add('flagged');
                }
            });
        }
        
        // Navigation functions
        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
            }
        }
        
        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else if (!solutionMode) {
                submitTest();
            }
        }
        
        function goToQuestion(index) {
            currentQuestionIndex = index;
            loadQuestion();
            closeSidebar();
        }
        
        function updateNavigation() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            
            prevBtn.disabled = currentQuestionIndex === 0;
            
            if (solutionMode) {
                nextBtn.textContent = currentQuestionIndex === questions.length - 1 ? 
                    'Finish Review' : 'Next →';
                nextBtn.onclick = currentQuestionIndex === questions.length - 1 ? 
                    finishReview : nextQuestion;
            } else {
                nextBtn.textContent = currentQuestionIndex === questions.length - 1 ? 
                    'Submit Test' : 'Next →';
                nextBtn.onclick = currentQuestionIndex === questions.length - 1 ? 
                    submitTest : nextQuestion;
            }
        }
        
        // Timer functions
        function startTimer() {
            const timerElement = document.getElementById('timer');
            const progressCircle = document.getElementById('progressCircle');
            const circumference = 2 * Math.PI * 18;
            const totalTime = examConfig.duration * 60;
            
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    submitTest();
                    return;
                }
                
                timeLeft--;
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerElement.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                
                // Update progress circle
                const progress = (totalTime - timeLeft) / totalTime;
                const offset = circumference * progress;
                progressCircle.style.strokeDashoffset = offset;
                
                // Add warning effects
                if (timeLeft <= 300) { // 5 minutes
                    timerElement.classList.add('warning');
                }
                if (timeLeft <= 60) { // 1 minute
                    timerElement.classList.add('critical');
                }
            }, 1000);
        }
        
        // Toggle question flag
        function toggleFlag() {
            if (flaggedQuestions.has(currentQuestionIndex)) {
                flaggedQuestions.delete(currentQuestionIndex);
            } else {
                flaggedQuestions.add(currentQuestionIndex);
            }
            updateFlagButton();
            updateQuestionsGrid();
        }
        
        function updateFlagButton() {
            const flagBtn = document.getElementById('flagBtn');
            if (flaggedQuestions.has(currentQuestionIndex)) {
                flagBtn.textContent = '🏴 Unflag Question';
                flagBtn.style.background = 'rgba(239, 68, 68, 0.2)';
                flagBtn.style.color = 'var(--error)';
            } else {
                flagBtn.textContent = '🚩 Flag Question';
                flagBtn.style.background = 'rgba(245, 158, 11, 0.2)';
                flagBtn.style.color = 'var(--warning)';
            }
        }
        
        // Theme toggle
        function toggleTheme() {
            const body = document.body;
            const themeBtn = document.getElementById('themeBtn');
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            body.setAttribute('data-theme', newTheme);
            themeBtn.textContent = newTheme === 'light' ? '🌙' : '☀️';
            
            // Save preference
            localStorage.setItem('theme', newTheme);
        }
        
        // Sidebar functions
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            
            sidebar.classList.toggle('open');
            overlay.classList.toggle('show');
        }
        
        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('show');
        }
        
        // Touch gesture support
        function setupTouchGestures() {
            const main = document.querySelector('.main');
            
            main.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            });
            
            main.addEventListener('touchend', (e) => {
                const touchEndX = e.changedTouches[0].clientX;
                const touchEndY = e.changedTouches[0].clientY;
                const deltaX = touchEndX - touchStartX;
                const deltaY = touchEndY - touchStartY;
                
                // Only trigger if horizontal swipe is dominant
                if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 50) {
                    if (deltaX > 0 && currentQuestionIndex > 0) {
                        // Swipe right - previous question
                        previousQuestion();
                    } else if (deltaX < 0 && currentQuestionIndex < questions.length - 1) {
                        // Swipe left - next question
                        nextQuestion();
                    }
                }
            });
        }
        
        // Auto-save functionality
        function setupAutoSave() {
            // Save answers periodically
            setInterval(() => {
                if (!isTestFinished) {
                    saveProgress();
                }
            }, 30000); // Every 30 seconds
        }
        
        function saveProgress() {
            const progress = {
                answers: userAnswers,
                flagged: Array.from(flaggedQuestions),
                currentQuestion: currentQuestionIndex,
                timeLeft: timeLeft
            };
            
            // In a real implementation, this would save to a server
            console.log('Progress saved:', progress);
        }
        
        function showAutoSave() {
            const autoSave = document.getElementById('autoSave');
            autoSave.classList.add('show');
            setTimeout(() => {
                autoSave.classList.remove('show');
            }, 2000);
        }
        
        // Submit test
        function submitTest() {
            if (isTestFinished) return;
            
            isTestFinished = true;
            clearInterval(timerInterval);
            
            // Calculate results
            let correct = 0, wrong = 0, skipped = 0, totalMarks = 0;
            
            questions.forEach((question, index) => {
                if (userAnswers[index] === undefined) {
                    skipped++;
                } else if (userAnswers[index] === question.correct_answer) {
                    correct++;
                    totalMarks += examConfig.positiveMarks;
                } else {
                    wrong++;
                    totalMarks -= examConfig.negativeMarks;
                }
            });
            
            const maxMarks = questions.length * examConfig.positiveMarks;
            const percentage = Math.max(0, Math.round((totalMarks / maxMarks) * 100));
            
            // Show results
            document.getElementById('resultTitle').textContent = 
                `${correct}/${questions.length} Correct`;
            document.getElementById('resultSubtitle').textContent = 
                `You scored ${totalMarks} out of ${maxMarks} marks`;
            document.getElementById('correctCount').textContent = correct;
            document.getElementById('wrongCount').textContent = wrong;
            document.getElementById('skippedCount').textContent = skipped;
            document.getElementById('finalScore').textContent = `${totalMarks} Marks`;
            document.getElementById('finalPercentage').textContent = `${percentage}%`;
            
            document.getElementById('resultModal').classList.add('show');
            closeSidebar();
        }
        
        // View solutions
        function viewSolutions() {
            document.getElementById('resultModal').classList.remove('show');
            solutionMode = true;
            currentQuestionIndex = 0;
            loadQuestion();
        }
        
        // Finish review
        function finishReview() {
            solutionMode = false;
            currentQuestionIndex = 0;
            loadQuestion();
        }
        
        // Retake test
        function retakeTest() {
            if (confirm('Are you sure you want to retake the test? All progress will be lost.')) {
                location.reload();
            }
        }
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (solutionMode) return;
            
            switch(e.key) {
                case 'ArrowLeft':
                    e.preventDefault();
                    previousQuestion();
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    nextQuestion();
                    break;
                case 'f':
                case 'F':
                    if (e.ctrlKey || e.metaKey) {
                        e.preventDefault();
                        toggleFlag();
                    }
                    break;
                case 'm':
                case 'M':
                    if (e.ctrlKey || e.metaKey) {
                        e.preventDefault();
                        toggleSidebar();
                    }
                    break;
                case '1':
                case '2':
                case '3':
                case '4':
                    if (!e.ctrlKey && !e.metaKey) {
                        e.preventDefault();
                        const optionIndex = parseInt(e.key) - 1;
                        if (optionIndex < questions[currentQuestionIndex].options.length) {
                            selectOption(optionIndex);
                        }
                    }
                    break;
            }
        });
        
        // Initialize when DOM is loaded
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeApp);
        } else {
            initializeApp();
        }
        
        // Load saved theme
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            document.body.setAttribute('data-theme', savedTheme);
            document.getElementById('themeBtn').textContent = savedTheme === 'light' ? '🌙' : '☀️';
        }
    </script>
</body>
</html>
