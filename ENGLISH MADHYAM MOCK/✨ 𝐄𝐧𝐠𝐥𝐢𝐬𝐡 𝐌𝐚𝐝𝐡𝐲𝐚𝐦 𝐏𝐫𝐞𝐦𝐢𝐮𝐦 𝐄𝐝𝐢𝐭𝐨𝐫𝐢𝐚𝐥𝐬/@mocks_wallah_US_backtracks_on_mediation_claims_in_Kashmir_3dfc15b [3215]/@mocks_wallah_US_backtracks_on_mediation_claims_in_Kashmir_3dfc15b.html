<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6366f1">
    <title>devgagan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #06b6d4;
            
            --glass-bg: rgba(255, 255, 255, 0.95);  /* Changed from 0.25 to 0.95 */
            --glass-border: rgba(255, 255, 255, 0.8);  /* Changed from 0.18 to 0.8 */
            --shadow-light: 0 8px 32px rgba(31, 38, 135, 0.37);
            --shadow-heavy: 0 20px 60px rgba(0, 0, 0, 0.3);
            
            --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --bounce: cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        
[data-theme="light"] {
    --bg: #ffffff;  /* Changed from gradient to solid white */
    --card-bg: #ffffff;  /* Changed from transparent to solid white */
    --text: #1a202c;
    --text-secondary: #4a5568;
    --border: rgba(0, 0, 0, 0.1);  /* Changed to darker border for contrast */
    --nav-bg: #ffffff;  /* Changed from transparent to solid white */
}

[data-theme="dark"] {
    --bg: #1a1a2e;  /* Changed from gradient to solid dark */
    --card-bg: #16213e;  /* Changed from transparent to solid dark */
    --text: #f7fafc;
    --text-secondary: #a0aec0;
    --border: rgba(255, 255, 255, 0.1);
    --nav-bg: #0c0c0c;  /* Changed from transparent to solid dark */
}
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--bg);  /* Now just using the solid color */
    z-index: -1;
}
        
        /* Floating particles animation */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: float 6s infinite ease-in-out;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.7; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 0.3; }
        }
        
        /* Header with glassmorphism */
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 16px 20px;
            z-index: 100;
            transition: var(--transition);
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .menu-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            font-size: 18px;
        }
        
        .menu-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-light);
        }
        
        .menu-btn:active {
            transform: scale(0.95);
        }
        
        .logo {
            font-weight: 800;
            font-size: 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        
        [data-theme="dark"] .logo {
    background: none;
    -webkit-text-fill-color: white; /* White text in dark mode */
    color: white; /* Fallback */
}
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            font-size: 20px;
        }
        
        .theme-toggle:hover {
            transform: rotate(180deg) scale(1.1);
            box-shadow: var(--shadow-light);
        }
        
        /* Advanced Timer */
        .timer-container {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .timer {
            background: linear-gradient(135deg, var(--error), #dc2626);
            color: white;
            padding: 12px 16px;
            border-radius: 16px;
            font-family: 'Inter', monospace;
            font-weight: 600;
            font-size: 14px;
            box-shadow: var(--shadow-light);
            position: relative;
            overflow: hidden;
        }
        
        .timer.warning {
            animation: pulse 1s infinite;
        }
        
        .timer.critical {
            animation: shake 0.5s infinite;
            background: linear-gradient(135deg, #dc2626, #991b1b);
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
        }
        
        .progress-ring {
            width: 40px;
            height: 40px;
            transform: rotate(-90deg);
        }
        
        .progress-circle {
            fill: none;
            stroke: rgba(255, 255, 255, 0.3);
            stroke-width: 3;
        }
        
        .progress-circle.progress {
            stroke: var(--primary);
            stroke-linecap: round;
            transition: stroke-dashoffset 0.3s ease;
        }
        
        /* Main Content */
        .main {
            margin: 80px 0 100px;
            padding: 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .question-container {
    background: var(--card-bg);  /* Now uses solid color */
    /* Remove or reduce blur effect */
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 32px;
    box-shadow: var(--shadow-heavy);
    position: relative;
    overflow: hidden;
    transition: var(--transition);
}
        .question-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--info));
            background-size: 200% 100%;
            animation: gradient-flow 3s linear infinite;
        }
        
        @keyframes gradient-flow {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .question-number {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 12px 20px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: var(--shadow-light);
            position: relative;
        }
        
        .question-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }
        
        .question-progress {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
        }
        
        .question-marks {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 600;
        }
        
        .question-text {
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 32px;
            color: var(--text);
            font-weight: 500;
        }
        
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .option {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 20px 24px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            font-size: 16px;
            font-weight: 500;
            color: var(--text);
            overflow: hidden;
        }
        
        .option::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s;
        }
        
        .option:hover::before {
            left: 100%;
        }
        
        .option:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: var(--shadow-light);
        }
        
        .option:active {
            transform: scale(0.98);
        }

        .menu-btn, .theme-toggle, .nav-btn.prev, .action-btn.flag {
    background: var(--card-bg);  /* Solid background */
    backdrop-filter: none;  /* Remove blur */
}

.sidebar {
    background: var(--card-bg);  /* Solid background */
    backdrop-filter: none;  /* Remove blur */
}
        
        .option.selected {
            background: rgba(99, 102, 241, 0.15);
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-light);
        }
        
        .option.correct {
            background: rgba(16, 185, 129, 0.15);
            border-color: var(--success);
            color: var(--success);
        }
        
        .option.incorrect {
            background: rgba(239, 68, 68, 0.15);
            border-color: var(--error);
            color: var(--error);
        }
        
        .option.disabled {
            background: rgba(160, 174, 192, 0.1);
            border-color: var(--text-secondary);
            color: var(--text-secondary);
            cursor: not-allowed;
        }
        
        .option-indicator {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }
        
        .option.selected .option-indicator {
            background: var(--primary);
            color: white;
        }
        
        .option.correct .option-indicator {
            background: var(--success);
            color: white;
        }
        
        .option.incorrect .option-indicator {
            background: var(--error);
            color: white;
        }
        
        .option:not(.selected):not(.correct):not(.incorrect) .option-indicator {
            border: 2px solid var(--border);
        }
        
        /* Solution Panel */
        .solution-panel {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(245, 158, 11, 0.05));
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 20px;
            padding: 24px;
            margin-top: 24px;
            backdrop-filter: blur(10px);
            transform: translateY(20px);
            opacity: 0;
            transition: var(--transition);
        }
        
        .solution-panel.show {
            transform: translateY(0);
            opacity: 1;
        }
        
        .solution-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            color: var(--warning);
            font-weight: 700;
        }
        
        .solution-content {
            color: var(--text);
            line-height: 1.6;
            font-size: 15px;
        }
        
        /* Navigation */
        .navigation {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            padding: 16px 20px;
            z-index: 90;
        }
        
        .nav-content {
            display: flex;
            gap: 12px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .nav-btn {
            flex: 1;
            padding: 16px 24px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        
        .nav-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.6s;
        }
        
        .nav-btn:hover::before {
            left: 100%;
        }
        
        .nav-btn:active {
            transform: scale(0.95);
        }
        
        .nav-btn.prev {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            backdrop-filter: blur(10px);
        }
        
        .nav-btn.next {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: var(--shadow-light);
        }
        
        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .nav-btn:disabled::before {
            display: none;
        }
        
        /* Question Panel Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid var(--border);
            z-index: 200;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-heavy);
        }
        
        .sidebar.open {
            right: 0;
        }
        
        .sidebar-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .sidebar-title {
            font-weight: 800;
            font-size: 20px;
        }
        
        .close-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        
        .close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(90deg);
        }
        
        .sidebar-body {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }
        
        .questions-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 32px;
        }
        
        .question-btn {
            background: var(--card-bg);
            border: 2px solid var(--border);
            color: var(--text-secondary);
            width: 48px;
            height: 48px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            position: relative;
        }
        
        .question-btn:hover {
            transform: scale(1.1);
            box-shadow: var(--shadow-light);
        }
        
        .question-btn:active {
            transform: scale(0.95);
        }
        
        .question-btn.current {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: var(--shadow-light);
        }
        
        .question-btn.answered {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border-color: var(--success);
        }
        
        .question-btn.correct {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }
        
        .question-btn.incorrect {
            background: var(--error);
            color: white;
            border-color: var(--error);
        }
        
        .question-btn.flagged::after {
            content: '🚩';
            position: absolute;
            top: -4px;
            right: -4px;
            font-size: 10px;
        }
        
        /* Legend */
        .legend {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 32px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .legend-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        
        .legend-dot.current { background: var(--primary); }
        .legend-dot.answered { background: var(--success); }
        .legend-dot.unattempted { background: var(--text-secondary); }
        .legend-dot.flagged { background: var(--warning); }
        
        /* Action Buttons */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .action-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }
        
        .action-btn.flag {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        
        .action-btn.submit {
            background: linear-gradient(135deg, var(--error), #dc2626);
            color: white;
            box-shadow: var(--shadow-light);
        }
        
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-heavy);
        }
        
        .action-btn:active {
            transform: scale(0.98);
        }
        
        /* Overlay */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 150;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }
        
        .overlay.show {
            opacity: 1;
            visibility: visible;
        }
        
        /* Result Modal */
        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 32px;
            max-width: 90vw;
            width: 480px;
            z-index: 300;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
            box-shadow: var(--shadow-heavy);
            overflow: hidden;
        }
        
        .modal.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }
        
        .modal-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 40px 32px;
            text-align: center;
        }
        
        .modal-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        
        .modal-subtitle {
            opacity: 0.9;
            font-size: 16px;
            font-weight: 500;
        }
        
        .modal-body {
            padding: 32px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            text-align: center;
            padding: 20px 16px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }
        
        .stat-label {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        
        .stat-value {
            color: var(--text);
            font-size: 24px;
            font-weight: 800;
        }
        
        .final-score {
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
            border-radius: 20px;
            padding: 32px;
            text-align: center;
            margin-bottom: 24px;
            box-shadow: var(--shadow-light);
        }
        
        .score-text {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        
        .percentage-text {
            opacity: 0.9;
            font-size: 18px;
            font-weight: 600;
        }
        
        .modal-actions {
            display: flex;
            gap: 12px;
        }
        
        .modal-btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }
        
        .modal-btn.primary {
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary);
            border: 1px solid rgba(99, 102, 241, 0.3);
        }
        
        .modal-btn.success {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        
        .modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-light);
        }
        
        /* Auto-save indicator */
        .auto-save {
            position: fixed;
            top: 80px;
            right: 20px;
            background: var(--success);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            transform: translateX(100px);
            opacity: 0;
            transition: var(--transition);
            z-index: 90;
        }
        
        .auto-save.show {
            transform: translateX(0);
            opacity: 1;
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .header-content {
                padding: 0 4px;

<body data-theme="light">
    <!-- Floating particles background -->
    <div class="particles" id="particles"></div>
    
    <!-- Auto-save indicator -->
    <div class="auto-save" id="autoSave">
        ✓ Auto-saved
    </div>
    
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="header-left">
                <button class="menu-btn" onclick="toggleSidebar()">
                    ☰
                </button>
                <div class="logo">Mocks Wallah</div>
            </div>
            <div class="header-right">
                <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn" aria-label="Toggle theme">
                    🌙
                </button>
                <div class="timer-container">
                    <svg class="progress-ring" width="40" height="40">
                        <circle class="progress-circle" cx="20" cy="20" r="18"></circle>
                        <circle class="progress-circle progress" cx="20" cy="20" r="18" 
                                stroke-dasharray="113.1" stroke-dashoffset="0" id="progressCircle"></circle>
                    </svg>
                    <div class="timer" id="timer">20:00</div>
                </div>
            </div>
        </div>
    </header>
    
    <!-- Main Content -->
    <main class="main">
        <div class="question-container" id="questionContainer">
            <div class="question-header">
                <div class="question-number" id="questionNumber">Q1</div>
                <div class="question-info">
                    <div class="question-progress" id="questionProgress">1 of 25</div>
                    <div class="question-marks">+1.0 / -0.25</div>
                </div>
            </div>
            <div class="question-text" id="questionText"></div>
            <div class="options-container" id="optionsContainer"></div>
            <div class="solution-panel" id="solutionPanel">
                <div class="solution-header">
                    <span>💡</span>
                    <span>Solution</span>
                </div>
                <div class="solution-content" id="solutionContent"></div>
            </div>
        </div>
    </main>
    
    <!-- Navigation -->
    <nav class="navigation">
        <div class="nav-content">
            <button class="nav-btn prev" id="prevBtn" onclick="previousQuestion()" disabled>
                ← Previous
            </button>
            <button class="nav-btn next" id="nextBtn" onclick="nextQuestion()">
                Next →
            </button>
        </div>
    </nav>
    
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">Question Panel</div>
            <button class="close-btn" onclick="closeSidebar()" aria-label="Close panel">×</button>
        </div>
        <div class="sidebar-body">
            <div class="questions-grid" id="questionsGrid"></div>
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-dot current"></div>
                    <span>Current</span>
                </div>
                <div class="legend-item">
                    <div class="legend-dot answered"></div>
                    <span>Answered</span>
                </div>
                <div class="legend-item">
                    <div class="legend-dot unattempted"></div>
                    <span>Unattempted</span>
                </div>
                <div class="legend-item">
                    <div class="legend-dot flagged"></div>
                    <span>Flagged</span>
                </div>
            </div>
            <div class="action-buttons">
                <button class="action-btn flag" onclick="toggleFlag()" id="flagBtn">
                    🚩 Flag Question
                </button>
                <button class="action-btn submit" onclick="submitTest()">
                    Submit Test
                </button>
            </div>
        </div>
    </aside>
    
    <!-- Overlay -->
    <div class="overlay" id="overlay" onclick="closeSidebar()"></div>
    
    <!-- Result Modal -->
    <div class="modal" id="resultModal">
        <div class="modal-header">
            <div class="modal-title" id="resultTitle">Test Completed!</div>

                </div>
                <div class="stat-card">

erated that it would not give in to “nuclear blackmail” and the only issues to be discussed bilaterally were cross-border terror and the illegal occupation in PoK. That said, it is also important to understand that “internationalising” the Kashmir issue is easier said than done. For the better part of 75 years — especially in the last three decades, as India outpaced Pakistan economically and de-hyphenated itself diplomatically — Delhi has thwarted Islamabad’s attempts to make Kashmir a global talking point. Today, India’s national power is far greater, as it carefully navigates the Trump era.</p> <p>Less than five months into his second term, Trump has thrown the global order into flux. He has reversed the US position on the Ukraine conflict, imposed and reduced tariffs, lifted sanctions on Syria and even claimed that the US and Iran are close to a nuclear deal. India has done better than most in negotiating the challenges thrown up by this uncertainty, ensuring that its relationship with the US continues to deepen and widen. As the hostilities with Pakistan ebb, Delhi must continue to wait and watch. It need not overreact to Trump’s claims but it must keep underlining its message to him.</p> <p>In the sentence <em>“Delhi had already </em><strong><em>put paid to</em></strong><em> any suggestion that the Kashmir issue was being internationalised,”</em> the idiom <strong>“put paid to”</strong> is closest in meaning to _____.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> postponed indefinitely", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> initiated discussion of", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> decisively ended", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> financially underwrote"], "correct_answer": 2, "solution": "No solution available"}, {"id": "148660", "question": "<strong>Comprehension</strong>:<br> US President Donald Trump is not known to be circumspect. In 2019, during his first term, he claimed that Prime Minister Narendra Modi had asked him to mediate between India and Pakistan on Kashmir. Then, Washington backtracked and said the US would step in only if asked to do so by both countries. A similar script played out after the agreement between India and Pakistan to stop military action last week. First, Trump announced the ceasefire on his social media handles even before Indian and Pakistani authorities could do so. Second, he had used “trade”, he suggested, as a way to pressure Delhi and Islamabad. Third, the claim that the US “mediated” an end to the conflict. On Wednesday morning, the US State Department all but walked back on the theory that Washington was looking to play a part in the Kashmir issue. “We also welcome the ceasefire between India and Pakistan… We urge both sides to maintain direct communication to preserve regional stability,” its spokesperson said.</p> <p>Earlier, Delhi had already put paid to any suggestion that the Kashmir issue was being internationalised. It provided a detailed timeline that showed it was Pakistan that first approached it to end the cycle of escalation. India reiterated that it would not give in to “nuclear blackmail” and the only issues to be discussed bilaterally were cross-border terror and the illegal occupation in PoK. That said, it is also important to understand that “internationalising” the Kashmir issue is easier said than done. For the better part of 75 years — especially in the last three decades, as India outpaced Pakistan economically and de-hyphenated itself diplomatically — Delhi has thwarted Islamabad’s attempts to make Kashmir a global talking point. Today, India’s national power is far greater, as it carefully navigates the Trump era.</p> <p>Less than five months into his second term, Trump has thrown the global order into flux. He has reversed the US position on the Ukraine conflict, imposed and reduced tariffs, lifted sanctions on Syria and even claimed that the US and Iran are close to a nuclear deal. India has done better than most in negotiating the challenges thrown up by this uncertainty, ensuring that its relationship with the US continues to deepen and widen. As the hostilities with Pakistan ebb, Delhi must continue to wait and watch. It need not overreact to Trump’s claims but it must keep underlining its message to him.</p> <p><strong>What is the central theme of the passage?</strong>", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> India’s economic growth relative to Pakistan", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The unpredictability of US foreign policy under Trump", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The ceasefire agreement between India and Pakistan", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> India’s consistent stance on Kashmir and international mediation"], "correct_answer": 3, "solution": "D) India’s consistent stance on Kashmir and international mediation\n\nThe core focus of the passage is India’s diplomatic response to repeated US claims of mediation in Kashmir, emphasizing its firm policy that the issue is bilateral and rejecting international involvement.\n\nA: This is a supporting point used to show India's rising power but not the main theme.\n\nB: Though discussed, it serves as context for India’s strategy rather than the passage's main idea.\n\nC: It is mentioned, but the focus is more on the narrative around mediation and diplomacy than on the agreement itself."}, {"id": "148655", "question": "<strong>Parts of a sentence are given below in jumbled order. Arrange the parts in the correct order to form a meaningful sentence.</strong></p> <p>A: by the doctor to drink</p> <p>B: the lady was compelled</p> <p>C: such a vile medicine that</p> <p>D: but killed by him</p> <p>E: she was all", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> BACED", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> CBDAE", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> DACBE", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> ACDEB"], "correct_answer": 0, "solution": "A) <strong>BACED</strong>\n\nB (\"the lady was compelled\") introduces the subject \"the lady\" and the verb \"was compelled,\" making it a suitable starting point.\n\nA (\"by the doctor to drink\") follows naturally, explaining who compelled her (the doctor) and what she was compelled to do (to drink)\n\nPart C (\"such a vile medicine that\") introduces the object \"medicine\" with a description (\"vile\") and connects to the consequence.\n\nPart E (\"she was all\") begins the consequence clause, leading to the final outcome.<br> Part D (\"but killed by him\") completes the sentence, explaining the result (she was almost killed by him).\n\nIn Hindi:<br> B वाक्य की शुरुआत करता है, क्योंकि यह subject \"the lady\" और verb \"was compelled\" को introduce करता है।\n\nA, B के बाद आता है क्योंकि यह बताता है कि किसने compel किया (\"by the doctor\") और क्या करने के लिए (\"to drink\")।\n\nC, A के बाद आता है, क्योंकि यह object \"medicine\" और उसकी quality (\"vile\") को describe करता है।\n\nE, C के बाद आता है, क्योंकि यह consequence clause (\"she was all\") शुरू करता है।\n\nD वाक्य को पूरा करता है, क्योंकि यह final outcome (\"but killed by him\") बताता है।"}, {"id": "148657", "question": "<strong>Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the correct order to form a meaningful and coherent paragraph.</strong></p> <p>(A) Ask your employer for information on the child care scheme.</p> <p>(B) If the employer does not contribute to the costs, the government will do so.</p> <p>(C) The employers of both parents are expected to contribute to child care.</p> <p>(D) The Government policy on child care was designed as a welfare scheme forcitizens", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> BACD", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> DCAB", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> BDAC", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> CDBA"], "correct_answer": 1, "solution": "B) <strong>DCAB</strong>\n\n(D) introduces the subject, \"The Government policy on child care,\" establishing the main theme of the paragraph.\n\n(C) follows (D) logically because it introduces the action: the expectation that employers contribute to child care. This action supports the welfare scheme mentioned in (D).\n\n(A) comes next as it suggests an action or step for citizens, logically following the policy explanation in (C).\n\n(B) concludes the paragraph by addressing a potential scenario (if the employer doesn't contribute) and explains how the government supports the scheme, completing the idea introduced in (D)."}, {"id": "148658", "question": "<strong>Parts of a sentence are given below in jumbled order. Arrange the parts in the correct order to form a meaningful sentence.</strong></p> <p>P. some experienced teachers say that</p> <p>Q. teaching about English is easy and</p> <p>R. teaching English is difficult as</p> <p>S. the latter needs dedication, resources and many more", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> PQRS", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> PSRQ", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> PRSQ", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> PSQR"], "correct_answer": 0, "solution": "A) <strong>PQRS</strong>\n\nP starts the sentence as it introduces the subject: “Some experienced teachers say that,” setting the context for the sentence.\n\nQ follows P because it gives additional information about teaching English: “teaching about English is easy and,” presenting the first part of the comparison.\n\nR logically comes next, explaining the contrasting point: “teaching English is difficult as,” which contrasts the ease of teaching about English.\n\nS concludes the sentence by elaborating on why teaching English is challenging: “the latter needs dedication, resources, and many more.”"}, {"id": "148661", "question": "<strong>Select the most appropriate option to substitute the underlined segment in the given sentence. If there is no need to substitute it, select No improvement.</strong></p> <p><ins><strong>Lot of peoples</strong></ins> visit this restaurant as its biryani is famous.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> No improvement", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> A lot peoples", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> A lot of people", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Much of people"], "correct_answer": 2, "solution": "<strong>C) </strong>(<strong>Lot of peoples)’</strong> के बदले ‘A lot of people’ का प्रयोग होगा क्योंकि ‘people’ एक ऐसा शब्द है जिसे हम बहुवचन में ही प्रयोग करते हैं और ‘a lot of’ का प्रयोग इसके साथ होता है। जैसे — A lot of people came to see the match."}, {"id": "148664", "question": "<strong>Identify the segment which contains the grammatical error.</strong></p> <p>The picture of the king's is exactly like the king himself.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> the king himself", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The picture", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> is exactly like", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> of the king's"], "correct_answer": 3, "solution": "<strong>D) of the king's'</strong> के बदले 'of the king' का प्रयोग होगा क्योंकि 'king's' का मतलब है 'king is' या 'king has', जो इस संदर्भ में सही नहीं है। सही वाक्य इस प्रकार होगा - The picture of the king is exactly like the king himself."}, {"id": "148666", "question": "<strong>Select the most appropriate meaning of the given idiom.</strong></p> <p>Pay off old scores", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> To have one's revenge", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> To be successful", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> To score good marks", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> To clear one's debt"], "correct_answer": 0, "solution": "A) <strong>Pay off old scores</strong> (idiom) – To have one's revenge (बदला लेना)"}, {"id": "148668", "question": "<strong>Select the best express Synonym of the given underlined word.</strong></p> <p>Farmers must adapt to the <ins><strong>vagaries</strong> </ins>of the monsoon to protect their crops.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Stability", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Predictability", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Consistency", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Unpredictability"], "correct_answer": 3, "solution": "<strong>D) Vagaries</strong> (noun) – fluctuations, unpredictability, variations, whims, anomalies अनिश्चितताएँ\n\n<strong>Synonym: Unpredictability</strong> (noun) – Vagaries, uncertainty (अनियमितता)\n\n<strong>Stability</strong> (noun) – Firmness, steadiness (स्थिरता)\n\n<strong>Predictability</strong> (noun) – Certainty, reliability (पूर्वानुमेयता)\n\n<strong>Consistency</strong> (noun) – Uniformity, regularity (संगति)"}, {"id": "148665", "question": "<strong>Select the best express Synonym of the given italicize phrasal verb.</strong><br> We decided to <strong><em>put up</em></strong> new shelves in the living room to organize our books.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Remove", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Break", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Install", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Destroy"], "correct_answer": 2, "solution": "<strong>C) Put up</strong> (phrasal verb) – install, erect, display, mount, set up लगाना\n\n<strong>Synonym: Install</strong> (verb) – Fix or place something in position. (स्थापित करना)\n\n<strong>Remove</strong> (verb) – Take away. (हटाना)\n\n<strong>Break</strong> (verb) – Damage or separate into pieces. (तोड़ना)\n\n<strong>Destroy</strong> (verb) – Ruin completely. (नष्ट करना)"}, {"id": "148663", "question": "<strong>Select the most appropriate option to substitute the underlined segment in the given sentence. If there is no need to substitute it, select No improvement.</strong></p> <p>After going through their brochure <strong><ins>I has decided to make a donation to help</ins> </strong>their campaign", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> I decided to make a donation to help", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> No improvement", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> I decide to make a donation for helping", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> I decided for making a donation to help"], "correct_answer": 0, "solution": "<strong>A) 'has decided' </strong><strong>के</strong> बदले 'decided' का प्रयोग होगा क्योंकि 'After going through their brochure' एक Past Time Expression है, जिससे संकेत मिलता है कि क्रिया पिछले समय में हुई थी। इसलिए, यहाँ पर Past Simple Tense का प्रयोग होगा; जैसे— After reading the book, I went to bed."}, {"id": "148669", "question": "<strong>Select the best express Antonym of the given underlined word.</strong></p> <p>The government plans to <ins><strong>unleash</strong> </ins>a series of reforms to boost the economy.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Trigger", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Release", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Initiate", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Restrain"], "correct_answer": 3, "solution": "<strong>D) Unleash</strong> (verb) – release, trigger, initiate, set off, let loose शुरू करना / जारी करना\n\n<strong>Antonym: Restrain</strong> (verb) – Control, suppress, hold back. रोकना\n\n<strong>Trigger</strong> (verb) – Activate, provoke. सक्रिय करना\n\n<strong>Release</strong> (verb) – Free, let go. मुक्त करना\n\n<strong>Initiate</strong> (verb) – Begin, start. प्रारंभ करना"}, {"id": "148673", "question": "<strong>There is a spelling error in the given sentence. Select the option that contains the INCORRECTLY spelt word</strong></p> <p>The professor's <strong>tyranny</strong> over his students led to a heated <strong>controversy</strong> when he accused one of them of attempting to <strong>plagerise</strong> an article, which he claimed was written under the influence of <strong>drunkenness</strong>.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Plagerise", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Tyranny", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Drunkenness", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Controversy"], "correct_answer": 0, "solution": "<strong>A)</strong> The word \"plagiarise\" means \"to copy another person's work or ideas and present them as one's own without proper acknowledgment\" (चोरी करना/ नकल करना). The incorrect spelling \"plagerise\" should be corrected to \"<strong>plagiarise</strong>\"."}, {"id": "148674", "question": "<strong>Select the most appropriate option that expresses the given sentence in passive voice.</strong></p> <p>Seema will have told you the truth.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Seema had told you the truth.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> You are told the truth by Seema.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> You would have told the truth to Seema.", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> You will have been told the truth by Seema"], "correct_answer": 3, "solution": "D) <strong>You will have been told the truth by Seema</strong>\n\nActive से Passive Voice में बदलने के लिए, Active वाक्य का Object Passive वाक्य का Subject बन जाता है। Verb को Active से Passive में बदलते समय सही Tense का प्रयोग किया जाता है। Active वाक्य में \"Seema\" Subject है, \"will have told\" Verb (Future Perfect) है, और \"you\" Object है। Passive में बदलने पर Object \"you\" Subject बन गया है। Verb \"will have told\" को Future Perfect Passive में बदलने के लिए \"will have been told\" का प्रयोग किया गया है और \"by Seema\" के रूप में Subject का उल्लेख किया गया है। इस प्रकार, सही वाक्य होगा: \"You will have been told the truth by Seema.\"\n\nTo change a sentence from Active to Passive Voice, the object of the active sentence becomes the subject of the passive sentence. The verb is transformed from the active form to the passive form, ensuring correct tense usage. In the active sentence, \"Seema\" is the Subject, \"will have told\" is the Verb (Future Perfect), and \"you\" is the Object. In the passive sentence, the Object \"you\" becomes the Subject. The verb \"will have told\" is changed to its Future Perfect Passive form \"will have been told,\" and \"by Seema\" is added to indicate the original Subject.\n\nThus, the correct sentence is: \"You will have been told the truth by Seema.\""}, {"id": "148676", "question": "<strong>Select the most appropriate option to fill in the blank.</strong></p> <p>Please _____ with me for a while", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> bare", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> bar", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> bear", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> bairn"], "correct_answer": 2, "solution": "C) <strong>'Bear'</strong> का use होगा क्योंकि इसका अर्थ होता है \"सहन करना\" या \"साथ देना।\" sentence का context यह है कि वक्ता चाहता है कि दूसरा व्यक्ति थोड़ी देर तक उनके साथ रहे या उन्हें सहन करे। इसलिए 'bear' यहाँ सही उत्तर है। 'Bare' का अर्थ है \"नंगा\" या \"खाली,\" जो वाक्य के संदर्भ में गलत है। 'Bar' का अर्थ है \"अवरोध\" या \"रोकना,\" जो इस वाक्य के संदर्भ में उपयुक्त नहीं है। 'Bairn' का अर्थ है \"बच्चा\" (Scottish dialect), जो इस संदर्भ में बिल्कुल फिट नहीं होता।\n\n<strong>Bear'</strong> is correct because it means \"to endure\" or \"to tolerate.\" The sentence implies that the speaker is asking someone to bear with them or tolerate their situation for a while, making 'bear' the appropriate choice. 'Bare' means \"naked\" or \"uncovered,\" which doesn't fit the context. 'Bar' means \"to block\" or \"to prevent,\" which is irrelevant here. 'Bairn' is a Scottish term for \"child,\" which is entirely out of context in this sentence."}, {"id": "148671", "question": "<strong>Select the best express Antonym of the given underlined word.</strong></p> <p>The report <ins><strong>grossly</strong> </ins>exaggerated the impact of the new policy.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Extremely", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Excessively", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Slightly", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Enormously"], "correct_answer": 2, "solution": "<strong>C) Grossly</strong> (adverb) – excessively, extremely, hugely, blatantly, enormously अत्यधिक\n\n<strong>Antonym: Slightly</strong> (adverb) – Moderately, a little, minimally (थोड़ा)\n\n<strong>Extremely</strong> (adverb) – Very, highly, immensely (अत्यंत)\n\n<strong>Excessively</strong> (adverb) – Unduly, unnecessarily, overly (अत्यधिक)\n\n<strong>Enormously</strong> (adverb) – Tremendously, hugely, vastly (बहुत अधिक)"}, {"id": "148682", "question": "<strong>Select the most appropriate synonym of the word in brackets to fill in the blank.</strong></p> <p>Her million-dollar wedding was a ________ display of wealth. (pompous)", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> prestigious", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> pretentious", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> outrageous", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> mock"], "correct_answer": 1, "solution": "<strong>B)</strong> 'Pretentious' का use होगा क्योंकि \"pretentious\" का अर्थ होता है दिखावा करने वाला, या ऐसा कुछ जो वास्तविकता में उतना महत्वपूर्ण नहीं है जितना वह दिखाने की कोशिश करता है। Sentence में बताया गया है कि शादी एक दिखावटी प्रदर्शन थी, इसलिए 'pretentious' यहाँ सही है। जबकि 'Prestigious' का अर्थ होता है प्रतिष्ठित, 'Outrageous' का अर्थ होता है अत्यधिक या चौंकाने वाला, और 'Mock' का अर्थ होता है मजाक उड़ाना, जो इस context में सही नहीं हैं।\n\n'Pretentious' will be used because it means trying to appear more important or valuable than it really is. The sentence indicates that the wedding was a showy display, making 'pretentious' the correct choice here. Whereas, 'Prestigious' means respected or esteemed, 'Outrageous' means excessive or shocking, and 'Mock' means to ridicule, which don't fit in this context."}, {"id": "148677", "question": "<strong>Comprehension</strong>:</p> <p><strong>In the following passage, some words have been deleted. Read the passage carefully and select the most appropriate option to fill in each blank.</strong></p> <p>Discrimination refers to the inequitable or (1)________ treatment of individuals or collectives on the basis of attributes such as ethnicity, sex, age and sexual orientation. Studies have indicated that the perception of discrimination can (2)________ a series of stress-induced alterations in an individual's mental, physiological and behavioural responses. The experience of stress is known to elicit unfavourable emotional reactions, including but not limited to (3)________, despair and resentment
