<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6366f1">
    <title>devgagan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #06b6d4;
            
            --glass-bg: rgba(255, 255, 255, 0.95);  /* Changed from 0.25 to 0.95 */
            --glass-border: rgba(255, 255, 255, 0.8);  /* Changed from 0.18 to 0.8 */
            --shadow-light: 0 8px 32px rgba(31, 38, 135, 0.37);
            --shadow-heavy: 0 20px 60px rgba(0, 0, 0, 0.3);
            
            --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --bounce: cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        
[data-theme="light"] {
    --bg: #ffffff;  /* Changed from gradient to solid white */
    --card-bg: #ffffff;  /* Changed from transparent to solid white */
    --text: #1a202c;
    --text-secondary: #4a5568;
    --border: rgba(0, 0, 0, 0.1);  /* Changed to darker border for contrast */
    --nav-bg: #ffffff;  /* Changed from transparent to solid white */
}

[data-theme="dark"] {
    --bg: #1a1a2e;  /* Changed from gradient to solid dark */
    --card-bg: #16213e;  /* Changed from transparent to solid dark */
    --text: #f7fafc;
    --text-secondary: #a0aec0;
    --border: rgba(255, 255, 255, 0.1);
    --nav-bg: #0c0c0c;  /* Changed from transparent to solid dark */
}
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--bg);  /* Now just using the solid color */
    z-index: -1;
}
        
        /* Floating particles animation */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: float 6s infinite ease-in-out;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.7; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 0.3; }
        }
        
        /* Header with glassmorphism */
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 16px 20px;
            z-index: 100;
            transition: var(--transition);
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .menu-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            font-size: 18px;
        }
        
        .menu-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-light);
        }
        
        .menu-btn:active {
            transform: scale(0.95);
        }
        
        .logo {
            font-weight: 800;
            font-size: 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        
        [data-theme="dark"] .logo {
    background: none;
    -webkit-text-fill-color: white; /* White text in dark mode */
    color: white; /* Fallback */
}
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            font-size: 20px;
        }
        
        .theme-toggle:hover {
            transform: rotate(180deg) scale(1.1);
            box-shadow: var(--shadow-light);
        }
        
        /* Advanced Timer */
        .timer-container {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .timer {
            background: linear-gradient(135deg, var(--error), #dc2626);
            color: white;
            padding: 12px 16px;
            border-radius: 16px;
            font-family: 'Inter', monospace;
            font-weight: 600;
            font-size: 14px;
            box-shadow: var(--shadow-light);
            position: relative;
            overflow: hidden;
        }
        
        .timer.warning {
            animation: pulse 1s infinite;
        }
        
        .timer.critical {
            animation: shake 0.5s infinite;
            background: linear-gradient(135deg, #dc2626, #991b1b);
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
        }
        
        .progress-ring {
            width: 40px;
            height: 40px;
            transform: rotate(-90deg);
        }
        
        .progress-circle {
            fill: none;
            stroke: rgba(255, 255, 255, 0.3);
            stroke-width: 3;
        }
        
        .progress-circle.progress {
            stroke: var(--primary);
            stroke-linecap: round;
            transition: stroke-dashoffset 0.3s ease;
        }
        
        /* Main Content */
        .main {
            margin: 80px 0 100px;
            padding: 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .question-container {
    background: var(--card-bg);  /* Now uses solid color */
    /* Remove or reduce blur effect */
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 32px;
    box-shadow: var(--shadow-heavy);
    position: relative;
    overflow: hidden;
    transition: var(--transition);
}
        .question-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--info));
            background-size: 200% 100%;
            animation: gradient-flow 3s linear infinite;
        }
        
        @keyframes gradient-flow {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .question-number {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 12px 20px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: var(--shadow-light);
            position: relative;
        }
        
        .question-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }
        
        .question-progress {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
        }
        
        .question-marks {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 600;
        }
        
        .question-text {
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 32px;
            color: var(--text);
            font-weight: 500;
        }
        
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .option {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 20px 24px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            font-size: 16px;
            font-weight: 500;
            color: var(--text);
            overflow: hidden;
        }
        
        .option::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s;
        }
        
        .option:hover::before {
            left: 100%;
        }
        
        .option:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: var(--shadow-light);
        }
        
        .option:active {
            transform: scale(0.98);
        }

        .menu-btn, .theme-toggle, .nav-btn.prev, .action-btn.flag {
    background: var(--card-bg);  /* Solid background */
    backdrop-filter: none;  /* Remove blur */
}

.sidebar {
    background: var(--card-bg);  /* Solid background */
    backdrop-filter: none;  /* Remove blur */
}
        
        .option.selected {
            background: rgba(99, 102, 241, 0.15);
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-light);
        }
        
        .option.correct {
            background: rgba(16, 185, 129, 0.15);
            border-color: var(--success);
            color: var(--success);
        }
        
        .option.incorrect {
            background: rgba(239, 68, 68, 0.15);
            border-color: var(--error);
            color: var(--error);
        }
        
        .option.disabled {
            background: rgba(160, 174, 192, 0.1);
            border-color: var(--text-secondary);
            color: var(--text-secondary);
            cursor: not-allowed;
        }
        
        .option-indicator {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }
        
        .option.selected .option-indicator {
            background: var(--primary);
            color: white;
        }
        
        .option.correct .option-indicator {
            background: var(--success);
            color: white;
        }
        
        .option.incorrect .option-indicator {
            background: var(--error);
            color: white;
        }
        
        .option:not(.selected):not(.correct):not(.incorrect) .option-indicator {
            border: 2px solid var(--border);
        }
        
        /* Solution Panel */
        .solution-panel {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(245, 158, 11, 0.05));
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 20px;
            padding: 24px;
            margin-top: 24px;
            backdrop-filter: blur(10px);
            transform: translateY(20px);
            opacity: 0;
            transition: var(--transition);
        }
        
        .solution-panel.show {
            transform: translateY(0);
            opacity: 1;
        }
        
        .solution-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            color: var(--warning);
            font-weight: 700;
        }
        
        .solution-content {
            color: var(--text);
            line-height: 1.6;
            font-size: 15px;
        }
        
        /* Navigation */
        .navigation {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            padding: 16px 20px;
            z-index: 90;
        }
        
        .nav-content {
            display: flex;
            gap: 12px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .nav-btn {
            flex: 1;
            padding: 16px 24px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        
        .nav-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.6s;
        }
        
        .nav-btn:hover::before {
            left: 100%;
        }
        
        .nav-btn:active {
            transform: scale(0.95);
        }
        
        .nav-btn.prev {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            backdrop-filter: blur(10px);
        }
        
        .nav-btn.next {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: var(--shadow-light);
        }
        
        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .nav-btn:disabled::before {
            display: none;
        }
        
        /* Question Panel Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid var(--border);
            z-index: 200;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-heavy);
        }
        
        .sidebar.open {
            right: 0;
        }
        
        .sidebar-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .sidebar-title {
            font-weight: 800;
            font-size: 20px;
        }
        
        .close-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        
        .close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(90deg);
        }
        
        .sidebar-body {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }
        
        .questions-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 32px;
        }
        
        .question-btn {
            background: var(--card-bg);
            border: 2px solid var(--border);
            color: var(--text-secondary);
            width: 48px;
            height: 48px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            position: relative;
        }
        
        .question-btn:hover {
            transform: scale(1.1);
            box-shadow: var(--shadow-light);
        }
        
        .question-btn:active {
            transform: scale(0.95);
        }
        
        .question-btn.current {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: var(--shadow-light);
        }
        
        .question-btn.answered {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border-color: var(--success);
        }
        
        .question-btn.correct {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }
        
        .question-btn.incorrect {
            background: var(--error);
            color: white;
            border-color: var(--error);
        }
        
        .question-btn.flagged::after {
            content: '🚩';
            position: absolute;
            top: -4px;
            right: -4px;
            font-size: 10px;
        }
        
        /* Legend */
        .legend {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 32px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .legend-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        
        .legend-dot.current { background: var(--primary); }
        .legend-dot.answered { background: var(--success); }
        .legend-dot.unattempted { background: var(--text-secondary); }
        .legend-dot.flagged { background: var(--warning); }
        
        /* Action Buttons */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .action-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }
        
        .action-btn.flag {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        
        .action-btn.submit {
            background: linear-gradient(135deg, var(--error), #dc2626);
            color: white;
            box-shadow: var(--shadow-light);
        }
        
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-heavy);
        }
        
        .action-btn:active {
            transform: scale(0.98);
        }
        
        /* Overlay */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 150;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }
        
        .overlay.show {
            opacity: 1;
            visibility: visible;
        }
        
        /* Result Modal */
        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 32px;
            max-width: 90vw;
            width: 480px;
            z-index: 300;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
            box-shadow: var(--shadow-heavy);
            overflow: hidden;
        }
        
        .modal.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }
        
        .modal-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 40px 32px;
            text-align: center;
        }
        
        .modal-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        
        .modal-subtitle {
            opacity: 0.9;
            font-size: 16px;
            font-weight: 500;
        }
        
        .modal-body {
            padding: 32px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            text-align: center;
            padding: 20px 16px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }
        
        .stat-label {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        
        .stat-value {
            color: var(--text);
            font-size: 24px;
            font-weight: 800;
        }
        
        .final-score {
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
            border-radius: 20px;
            padding: 32px;
            text-align: center;
            margin-bottom: 24px;
            box-shadow: var(--shadow-light);
        }
        
        .score-text {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        
        .percentage-text {
            opacity: 0.9;
            font-size: 18px;
            font-weight: 600;
        }
        
        .modal-actions {
            display: flex;
            gap: 12px;
        }
        
        .modal-btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }
        
        .modal-btn.primary {
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary);
            border: 1px solid rgba(99, 102, 241, 0.3);
        }
        
        .modal-btn.success {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        
        .modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-light);
        }
        
        /* Auto-save indicator */
        .auto-save {
            position: fixed;
            top: 80px;
            right: 20px;
            background: var(--success);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            transform: translateX(100px);
            opacity: 0;
            transition: var(--transition);
            z-index: 90;
        }
        
        .auto-save.show {
            transform: translateX(0);
            opacity: 1;
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .header-content {
                padding: 0 4px;

    <script>
        // Core Variables
        const questions = [{"id": "145118", "question": "<strong>Comprehension</strong>:<br> It is a story of perseverance, guided not by maps but by instinct, and of a long arduous journey spanning 4,500 km. The quiet odyssey of an Olive Ridley turtle — from Odisha’s Gahirmatha beach on the eastern rim of the Indian Subcontinent to the sands of Guhagar in Maharashtra — offers a moment of pause, and a message: That in the end, what endures is intent. Turtle 03233, as its tracking tags revealed, crossed coastlines and currents, possibly looped around Sri Lanka, navigated the wild geometry of the Indian Ocean, before finally anchoring itself with quiet purpose on the Konkan coast. From that solitary arrival came 125 eggs, and 107 hatchlings, fragile continuities born of a voyage that has left ecologists astonished. In the absence of satellite precision — the flipper tags on 03233 are made of cost-effective titanium and inconel — certainty drifts like a shadow through saltwater. But researchers believe this could be the first such migratory feat recorded among Olive Ridleys.</p> <p>Why this turtle strayed from the mass nesting shores of Odisha where thousands arrive in synchrony for the great arribada — a convergence of female Olive Ridleys along the Odisha coast to lay eggs — remains a mystery. But its voyage has led to a widening of conservation maps, a shift in the way ecology is traced across coastlines.</p> <p>In a world obsessed with destination and definition, 03233’s long trek is also a parable for patience. It leaves one with lessons that cannot be tagged or tracked, only realised: That the measure of a journey lies not always in its recognition, but in quiet defiance. That the path one takes — long, looping, uncertain — may defy comprehension, yet still hold purpose. That solitude, too, can be generative. And that endurance, measured not in urgency but in faith, is its own kind of grace.</p> <p><strong>What is the tone of the passage?</strong>", "options": [" itary arrival came 125 eggs, and 107 hatchlings, fragile continuities born of a voyage that has left ecologists astonished. In the absence of satellite precision — the flipper tags on 03233 are made of cost-effective titanium and inconel — certainty drifts like a shadow through saltwater. But researchers believe this could be the first such migratory feat recorded among Olive Ridleys.</p> <p>Why this turtle strayed from the mass nesting shores of Odisha where thousands arrive in synchrony for the great arribada — a convergence of female Olive Ridleys along the Odisha coast to lay eggs — remains a mystery. But its voyage has led to a widening of conservation maps, a shift in the way ecology is traced across coastlines.</p> <p>In a world obsessed with destination and definition, 03233’s long trek is also a parable for patience. It leaves one with lessons that cannot be tagged or tracked, only realised: That the measure of a journey lies not always in its recognition, but in quiet defiance. That the path one takes — long, looping, uncertain — may defy comprehension, yet still hold purpose. That solitude, too, can be generative. And that endurance, measured not in urgency but in faith, is its own kind of grace.</p> <p><strong>Fill in the blank with the most appropriate set of statements that logically extend the underlying philosophical message of the turtle's journey as described in the passage:</strong></p> <p>“In a world preoccupied with milestones and metrics, the story of Turtle 03233 suggests that ___.”</p> <p>i. recognition is less important than the intention that fuels the journey</p> <p>ii. definitive paths are often more valuable than erratic routes</p> <p>iii. unseen acts of persistence can be as meaningful as celebrated achievements", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Only i", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Only ii", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Both i and iii", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> i, ii and iii"], "correct_answer": 2, "solution": "No solution available"}, {"id": "145121", "question": "<strong>Comprehension</strong>:<br> It is a story of perseverance, guided not by maps but by instinct, and of a long arduous journey spanning 4,500 km. The quiet odyssey of an Olive Ridley turtle — from Odisha’s Gahirmatha beach on the eastern rim of the Indian Subcontinent to the sands of Guhagar in Maharashtra — offers a moment of pause, and a message: That in the end, what endures is intent. Turtle 03233, as its tracking tags revealed, crossed coastlines and currents, possibly looped around Sri Lanka, navigated the wild geometry of the Indian Ocean, before finally anchoring itself with quiet purpose on the Konkan coast. From that solitary arrival came 125 eggs, and 107 hatchlings, fragile continuities born of a voyage that has left ecologists astonished. In the absence of satellite precision — the flipper tags on 03233 are made of cost-effective titanium and inconel — certainty drifts like a shadow through saltwater. But researchers believe this could be the first such migratory feat recorded among Olive Ridleys.</p> <p>Why this turtle strayed from the mass nesting shores of Odisha where thousands arrive in synchrony for the great arribada — a convergence of female Olive Ridleys along the Odisha coast to lay eggs — remains a mystery. But its voyage has led to a widening of conservation maps, a shift in the way ecology is traced across coastlines.</p> <p>In a world obsessed with destination and definition, 03233’s long trek is also a parable for patience. It leaves one with lessons that cannot be tagged or tracked, only realised: That the measure of a journey lies not always in its recognition, but in quiet defiance. That the path one takes — long, looping, uncertain — may defy comprehension, yet still hold purpose. That solitude, too, can be generative. And that endurance, measured not in urgency but in faith, is its own kind of grace.</p> <p><strong>Based on the numerical details in the passage, which of the following inferences can be logically and accurately drawn?</strong></p> <p>i. The hatching success rate of Turtle 03233’s eggs was over 85%</p> <p>ii. The turtle’s journey included both east and west coasts of India</p> <p>iii. The tagging of turtles is highly accurate due to satellite precision", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Only i and ii", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Only ii and iii", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Only i and iii", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> i, ii and iii"], "correct_answer": 0, "solution": "No solution available"}, {"id": "145122", "question": "<strong>Comprehension</strong>:<br> It is a story of perseverance, guided not by maps but by instinct, and of a long arduous journey spanning 4,500 km. The quiet odyssey of an Olive Ridley turtle — from Odisha’s Gahirmatha beach on the eastern rim of the Indian Subcontinent to the sands of Guhagar in Maharashtra — offers a moment of pause, and a message: That in the end, what endures is intent. Turtle 03233, as its tracking tags revealed, crossed coastlines and currents, possibly looped around Sri Lanka, navigated the wild geometry of the Indian Ocean, before finally anchoring itself with quiet purpose on the Konkan coast. From that solitary arrival came 125 eggs, and 107 hatchlings, fragile continuities born of a voyage that has left ecologists astonished. In the absence of satellite precision — the flipper tags on 03233 are made of cost-effective titanium and inconel — certainty drifts like a shadow through saltwater. But researchers believe this could be the first such migratory feat recorded among Olive Ridleys.</p> <p>Why this turtle strayed from the mass nesting shores of Odisha where thousands arrive in synchrony for the great arribada — a convergence of female Olive Ridleys along the Odisha coast to lay eggs — remains a mystery. But its voyage has led to a widening of conservation maps, a shift in the way ecology is traced across coastlines.</p> <p>In a world obsessed with destination and definition, 03233’s long trek is also a parable for patience. It leaves one with lessons that cannot be tagged or tracked, only realised: That the measure of a journey lies not always in its recognition, but in quiet defiance. That the path one takes — long, looping, uncertain — may defy comprehension, yet still hold purpose. That solitude, too, can be generative. And that endurance, measured not in urgency but in faith, is its own kind of grace.</p> <p>Which of the following statements is <strong>TRUE</strong> according to the passage?", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The journey of Turtle 03233 has narrowed the scope of conservation efforts.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The tracking of Turtle 03233 was made possible by high-end satellite technology.", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Turtle 03233’s voyage challenges the traditional understanding of turtle nesting sites.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Most Olive Ridley turtles avoid nesting during the arribada in Odisha."], "correct_answer": 2, "solution": "No solution available"}, {"id": "145133", "question": "<strong>Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the correct order to form a meaningful and coherent paragraph.</strong><br> <strong>P) </strong>That are part of the Lakshadweep archipelago, with my wife on a holiday in 2018<br> <strong>Q) </strong>Though the capital of Lakshadweep is Kavaratti, the only airport in the archipelago is on Agatti<br> <strong>R) </strong> A trip to Agatti island in Lakshadweep is etched indelibly in my memory<br> <strong>S) </strong>I visited Agatti, one of many islands", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> SPRQ", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> RPQS", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> SPQR", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> RSPQ"], "correct_answer": 3, "solution": "D) <strong>RSPQ</strong>\n\n<strong>R:</strong> This sentence introduces the main topic: a trip to Agatti island. This is the opening sentence, providing context for the rest of the sentences.\n\n<strong>S:</strong> The use of \"I visited Agatti\" connects back to the \"trip to Agatti island\" mentioned in sentence R. Therefore, S logically follows R.\n\n<strong>P:</strong> Additionally, the phrase \"one of many islands\" sets up for a more detailed explanation about these islands, leading us to sentence P. \"That\" is a relative pronoun referring back to \"one of many islands\" in sentence S. Thus, P should follow S to provide more details about the islands.\n\n<strong>Q:</strong> This sentence offers additional information about the Lakshadweep islands, making it a fitting conclusion after the detailed setup provided by sentences R, S, and P."}, {"id": "145134", "question": "<strong>Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the correct order to form a meaningful and coherent paragraph.</strong><br> <strong>P) </strong> The Government of National Capital Territory of Delhi (NCTD) Act, 1991 that effectively nullified the Supreme Court judgment of May 11 on the powers over bureaucratic appointments in Delhi<br> <strong>Q)</strong> On May 19 this year, the Union government promulgated an ordinance to amend<br> <strong>R)</strong> After an eight-year long protracted legal battle, a five-judge Constitution Bench led by the Chief Justice of India<br> <strong>S) </strong> D.Y. Chandrachud had unanimously held that the elected government of Delhi had legislative and administrative powers over “services”.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> RSPQ", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> QPRS", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> QRPS", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> RQPS"], "correct_answer": 1, "solution": "B) <strong>QPRS</strong>\n\n<strong>Q - P:</strong> Sentence Q references an action (\"promulgated an ordinance to amend\") taken on May 19. Sentence P clarifies what was being amended, that is, the \"NCTD Act, 1991\", and it also mentions the judgment of May 11. So, P logically follows Q because it provides details on the amendment mentioned in Q and the previous judgment which took place on May 11.<br> <strong>R - S:</strong> Sentence R introduces a \"five-judge Constitution Bench led by the Chief Justice of India\", and Sentence S begins with \"D.Y. Chandrachud\". D.Y. Chandrachud is the Chief Justice referred to in R. Thus, S elaborates on the decision or holding made by the Constitution Bench led by D.Y. Chandrachud, making it the logical continuation of R.\n\n<strong>P - R:</strong> The logical sequence indicates that after introducing the judgment being nullified in P, R provides a context to how that judgment came about (after an eight-year long battle)"}, {"id": "145135", "question": "<strong>Sentences of a paragraph are given below in jumbled order. Select the option that gives their correct logical sequence.</strong><br> <strong>A)</strong> Two cases of sexual harassment were reportedly registered on April 28, 2023 by the Delhi police against the president of the Wrestling Federation of India (WFI), after the intervention of the Supreme Court of India, based on a petition filed by a few wrestlers.<br> <strong>B) </strong> The cases were under the Protection of Children from Sexual Offences (POCSO) Act and the relevant sections of the Indian Penal Code (IPC) concerning the outraging of the modesty of a woman and sexual harassment, while the other was with respect to outraging the modesty of a woman under the IPC.<br> <strong>C) </strong>The protest by India’s medal winning wrestlers has been in the news for long.<br> <strong>D)</strong> They too offered to undergo a narco-analysis test when the accused offered to undergo any such test to prove his innocence.<br> <strong>E) </strong> While the investigation of these two cases is under way by the Delhi police, the complainant wrestlers are still consistent in their demand— the arrest of the accused.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> DECAB", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> CBDEA", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> CABED", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> CBEDA"], "correct_answer": 2, "solution": "C) <strong>CABED</strong>\n\n<strong>C</strong>: This sentence seems to be an introduction, setting the context of the protest. We know that wrestlers have been protesting something.\n\n<strong>A</strong>: This sentence provides details of the cases and mentions the involvement of wrestlers, linking it with Sentence C. It also provides a time sequence (April 28, 2023).\n\n<strong>B</strong>: The use of \"The cases\" refers to the cases mentioned in Sentence A, providing details about under which acts and sections they were registered.\n\n<strong>E</strong>: \"These two cases\" refers to the ones mentioned in Sentence A and detailed in Sentence B. This sentence provides an update about the investigation and the demands of the wrestlers.\n\n<strong>D</strong>: \"They\" here refers to the wrestlers (complainants) mentioned in the previous sentences. This offers an additional detail related to the case."}, {"id": "145136", "question": "<strong>Identify the ODD word from the given options</strong>", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Golf", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Billiards", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Carom", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Table tennis"], "correct_answer": 0, "solution": "A) <strong>Golf</strong> (noun) – A sport in which players hit a small ball into a series of holes on a course using clubs. गोल्फ<br> <strong>Note</strong>: Golf is played outdoors on a large course. The other three games—Billiards, Carom, and Table Tennis—are indoor games played on a table.\n\n<strong>Billiards</strong> (noun) – A game played on a rectangular table with balls and a cue stick. बिलियर्ड्स\n\n<strong>Carom</strong> (noun) – A game played on a flat board with small discs that players flick into pockets. कैरम\n\n<strong>Table</strong> <strong>tennis</strong> (noun) – A game played on a table divided by a net, where players hit a lightweight ball back and forth using small rackets. टेबल टेनिस"}, {"id": "145137", "question": "<strong>Select the most appropriate meaning of the given idiom.</strong></p> <p>Run errands", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> To participate in a race through unfair means", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> To do something incorrectly or erroneous in haste", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> To go out to buy or do something", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> To finish running before the end point"], "correct_answer": 2, "solution": "C) <strong>Run errands </strong>(idiom) – To go out to buy or do something (किसी काम को करने के लिए बाहर जाना)"}, {"id": "145138", "question": "<strong>Select the option that rectifies the spelling of the underlined word in the given sentence.</strong></p> <p>The concert was <ins><strong>canceeled</strong> </ins>due to rain.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Cancaeled", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Cancelled", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Cencelled", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Cancealed"], "correct_answer": 1, "solution": "B) The correct spelling of ‘<strong>Canceeled’</strong> is ‘<strong>Cancelled’</strong>, which means “to decide or announce that an event will not take place or that an agreement will no longer be valid” (रद्द करना, समाप्त करना)."}, {"id": "145139", "question": "<strong>Select the most appropriate degree of comparison to fill in the blank.</strong></p> <p>Many ornithologists believe that the northern mocking birds are __________ wild birds in the jungle.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> the noisiest", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> noisy", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> noisier", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> the noisy"], "correct_answer": 0, "solution": "A) <strong>'The noisiest'</strong> का use होगा क्योंकि यह \"noisy\" का superlative degree है, और sentence में सभी जंगली पक्षियों के बीच तुलना की जा रही है। sentence में mention है कि उत्तरी मॉकिंग बर्ड्स सभी जंगली पक्षियों में सबसे ज्यादा शोर मचाने वाले हैं, इसलिए 'the noisiest' यहां सही है। जबकि: 'Noisy' केवल एक सामान्य गुण को दर्शाता है और तुलना की भावना व्यक्त नहीं करता। 'Noisier' comparative degree है, जो केवल दो पक्षियों के बीच तुलना के लिए उपयोग होता है, लेकिन यहां सभी पक्षियों की तुलना हो रही है। 'The noisy' का उपयोग superlative के रूप में नहीं किया जा सकता।\n\nThe noisiest' will be used because it is the superlative degree of \"noisy,\" and the sentence compares northern mockingbirds with all other wild birds in the jungle. This makes 'the noisiest' contextually and grammatically correct. Whereas: 'Noisy' simply describes a characteristic and does not imply comparison.'Noisier' is the comparative degree used for comparison between two entities, but here the comparison involves all birds. 'The noisy' cannot serve as a superlative in this context."}, {"id": "145140", "question": "<strong>Select the most appropriate ANTONYM of the given word.</strong></p> <p>Entice", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Tangle", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Allure", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Invite", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Repulse"], "correct_answer": 3, "solution": "D) <strong>Entice</strong> (verb) – To attract, tempt, or lure someone, usually by offering something appealing or desirable. लुभाना\n\nAntonym: <strong>Repulse</strong> (verb) – To repel, drive away, or cause someone to feel intense aversion. घृणा उत्पन्न करना, दूर करना\n\n<strong>Tangle</strong> (verb/noun) – To twist together in a confused or complicated way. उलझना/उलझाना\n\n<strong>Allure</strong> (verb/noun) – The power to attract or charm, similar to entice. मोहित करना\n\n<strong>Invite</strong> (verb) – To request someone's presence or participation. आमंत्रित करना"}, {"id": "145141", "question": "<strong>Select the most appropriate option to fill in the blank.</strong></p> <p>Leisure activities can improve an individual's physical and mental health by ________ stress, and offering a pleasurable experience.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> relieving", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> irritating", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> upsetting", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> reconstructing"], "correct_answer": 0, "solution": "A) <strong>relieving</strong> का use होगा ‘stress’ को कम करने और खुशी प्रदान करने के संदर्भ में उपयुक्त हो। ‘relieving’ का अर्थ है ‘किसी अप्रिय चीज़ को कम करना या उसे दूर करना’, जो इस वाक्य के लिए सही है। irritating' का मतलब है 'चिड़चिड़ा बनाना', जो वाक्य के सकारात्मक संदर्भ से मेल नहीं खाता। upsetting' का अर्थ है 'परेशान करना', जो वाक्य में फिट नहीं होता। 'reconstructing' का अर्थ है 'फिर से बनाना', लेकिन यह वाक्य के लिए उपयुक्त नहीं है\n\nCorrect answer is <strong>relieving</strong>, because the context of reducing stress and providing a pleasurable experience. The word “relieving” means “to reduce or alleviate something unpleasant, like stress,” which is appropriate for this sentence. Irritating” means “causing annoyance or discomfort,” which does not match the positive context of the sentence. Upsetting” means “causing distress or trouble,” which does not align with the beneficial effects described in the sentence. Reconstructing” means “building again,” which is not relevant to the idea of relieving stress in this context."}, {"id": "145142", "question": "<strong>Select the most appropriate ANTONYM of the given word.</strong></p> <p>Conscious", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Secure", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Unaware", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Sentimental", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Sensible"], "correct_answer": 1, "solution": "B) <strong>Conscious</strong> (adjective) – Aware of and responding to one’s surroundings; awake; aware, alert, mindful. होश में रहना, सचेत, जागरूक\n\nAntonym: <strong>Unaware</strong> (adjective) – Not knowing or realizing something; oblivious, ignorant, unconscious. अज्ञानता, अचेत\n\n<strong>Secure</strong> (adjective) – Safe, protected, free from danger or harm. सुरक्षित\n\n<strong>Sentimental</strong> (adjective) – Emotional, nostalgic, tender-hearted. भावुक, भावनात्मक\n\n<strong>Sensible</strong> (adjective) – Showing good sense or judgment; practical, reasonable. समझदार, व्यावहारिक"}, {"id": "145143", "question": "<strong>Select the most appropriate synonym of the word given in brackets to fill in the blank.</strong></p> <p>The rivals in the institution _____ (fabricated) evidence and manipulated the whole dataset.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> fluctuated", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> forged", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> destroyed", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> wrecked"], "correct_answer": 1, "solution": "B) <strong>Fabricated</strong> (verb) – To invent, concoct, or falsify something, typically with deceitful intent. गढ़ा हुआ, झूठा बनाया हुआ\n\nSynonym: <strong>Forged </strong>(verb) – To falsify, counterfeit, or create something with dishonest intent. जाली बनाना\n\n<strong>Fluctuated</strong> (verb) – To rise and fall irregularly; to vary or change continuously. अस्थिर रहना\n\n<strong>Destroyed</strong> (verb) – To damage or ruin something completely. नष्ट करना\n\n<strong>Wrecked</strong> (verb) – To destroy, ruin, or damage something. विनाश करना"}, {"id": "145144", "question": "<strong>The following sentence has been divided into four segments. Identify the segment in which the article has been used INCORRECTLY.</strong></p> <p>UNESCO works to / strengthen an intellectual / and moral solidarity / of humankind", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> UNESCO works to", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> of humankind.", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> strengthen an intellectual", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> and moral solidarity"], "correct_answer": 2, "solution": "C) 'an intellectual' के बदले 'the intellectual' का प्रयोग होगा क्योंकि यहाँ 'intellectual' और 'moral solidarity' को एकसाथ पेश किया गया है, और जब दो adjectives से एक ही वस्तु या विचार का वर्णन होता है, तो 'the' का प्रयोग होता है। जैसे— The intellectual and moral solidarity of humankind.\n\n'the intellectual' will be used instead of 'an intellectual' because 'intellectual' and 'moral solidarity' are being presented together, and when two adjectives describe the same thing or idea, 'the' is used. Example— The intellectual and moral solidarity of humankind."}, {"id": "145145", "question": "<strong>Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the correct order to form a meaningful and coherent paragraph. Note: This is an advertisement of an ice-cream brand.</strong></p> <p>(A) That’s why Silky is deliciously different and exceptionally versatile, natural, thick and durable ice cream.</p> <p>(B) Beautifully firm, nice, silky rather than thin and watery, it stays in shape and stands on top of fruits or pastries without soaking in.</p> <p>(C) Silky thick double ice cream has a unique, fresh taste and texture.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> CBA", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> ABC", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> BCA", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> BAC"], "correct_answer": 0, "solution": "A) <strong>CBA</strong>\n\nC starts the paragraph by introducing the product: “Silky thick double ice cream has a unique, fresh taste and texture.” This sentence provides the main subject of the advertisement and sets the stage for describing the features of the product.\n\nB logically follows C because it elaborates on the texture of the ice cream mentioned in C: This adds specific details about why the texture is important, highlighting the strength of the product.\n\nA comes next after B to summarize the qualities of the ice cream: The “That’s why” phrase ties back to the qualities described in B and C, wrapping up the paragraph by emphasizing why Silky stands out."}, {"id": "145146", "question": "<strong>Select the INCORRECTLY spelt word</strong>", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Contribution", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Mediation", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Miscalculation", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Eficient"], "correct_answer": 3, "solution": "D) The correct spelling of ‘Eficient’ is ‘<strong>Efficient</strong>,’ which means “achieving maximum productivity with minimum wasted effort or expense” कुशल, दक्ष."}, {"id": "145147", "question": "<strong>Select the option that expresses the given sentence in active voice.</strong></p> <p>His finger had been cut by the sharp knife.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The sharp knife has cut his finger.", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> The sharp knife had cut his finger.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The sharp knife cuts his finger.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The sharp knife had been cutting his finger."], "correct_answer": 1, "solution": "B) <strong>The sharp knife had cut his finger</strong>\n\nActive से Passive Voice में बदलने के लिए: Passive वाक्य को Active में बदलते समय Passive वाक्य का Subject Active वाक्य का Object बन जाता है और Verb को Passive से Active में सही Tense के साथ बदला जाता है। Passive वाक्य में \"His finger\" Subject है, \"had been cut\" Verb (Past Perfect Passive) है, और \"by the sharp knife\" Agent है। Active वाक्य में \"The sharp knife\" Subject है, \"had cut\" Verb (Past Perfect Active) है, और \"his finger\" Object है।\n\nTo change a sentence from Passive to Active Voice: When transforming a sentence from passive to active voice, the subject of the passive sentence becomes the object of the active sentence, and the verb is changed to the correct activ
