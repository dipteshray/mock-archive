<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6366f1">
    <title>devgagan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #06b6d4;
            
            --glass-bg: rgba(255, 255, 255, 0.95);  /* Changed from 0.25 to 0.95 */
            --glass-border: rgba(255, 255, 255, 0.8);  /* Changed from 0.18 to 0.8 */
            --shadow-light: 0 8px 32px rgba(31, 38, 135, 0.37);
            --shadow-heavy: 0 20px 60px rgba(0, 0, 0, 0.3);
            
            --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --bounce: cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        
[data-theme="light"] {
    --bg: #ffffff;  /* Changed from gradient to solid white */
    --card-bg: #ffffff;  /* Changed from transparent to solid white */
    --text: #1a202c;
    --text-secondary: #4a5568;
    --border: rgba(0, 0, 0, 0.1);  /* Changed to darker border for contrast */
    --nav-bg: #ffffff;  /* Changed from transparent to solid white */
}

[data-theme="dark"] {
    --bg: #1a1a2e;  /* Changed from gradient to solid dark */
    --card-bg: #16213e;  /* Changed from transparent to solid dark */
    --text: #f7fafc;
    --text-secondary: #a0aec0;
    --border: rgba(255, 255, 255, 0.1);
    --nav-bg: #0c0c0c;  /* Changed from transparent to solid dark */
}
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--bg);  /* Now just using the solid color */
    z-index: -1;
}
        
        /* Floating particles animation */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: float 6s infinite ease-in-out;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.7; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 0.3; }
        }
        
        /* Header with glassmorphism */
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 16px 20px;
            z-index: 100;
            transition: var(--transition);
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .menu-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            font-size: 18px;
        }
        
        .menu-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-light);
        }
        
        .menu-btn:active {
            transform: scale(0.95);
        }
        
        .logo {
            font-weight: 800;
            font-size: 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        
        [data-theme="dark"] .logo {
    background: none;
    -webkit-text-fill-color: white; /* White text in dark mode */
    color: white; /* Fallback */
}
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            font-size: 20px;
        }
        
        .theme-toggle:hover {
            transform: rotate(180deg) scale(1.1);
            box-shadow: var(--shadow-light);
        }
        
        /* Advanced Timer */
        .timer-container {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .timer {
            background: linear-gradient(135deg, var(--error), #dc2626);
            color: white;
            padding: 12px 16px;
            border-radius: 16px;
            font-family: 'Inter', monospace;
            font-weight: 600;
            font-size: 14px;
            box-shadow: var(--shadow-light);
            position: relative;
            overflow: hidden;
        }
        
        .timer.warning {
            animation: pulse 1s infinite;
        }
        
        .timer.critical {
            animation: shake 0.5s infinite;
            background: linear-gradient(135deg, #dc2626, #991b1b);
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
        }
        
        .progress-ring {
            width: 40px;
            height: 40px;
            transform: rotate(-90deg);
        }
        
        .progress-circle {
            fill: none;
            stroke: rgba(255, 255, 255, 0.3);
            stroke-width: 3;
        }
        
        .progress-circle.progress {
            stroke: var(--primary);
            stroke-linecap: round;
            transition: stroke-dashoffset 0.3s ease;
        }
        
        /* Main Content */
        .main {
            margin: 80px 0 100px;
            padding: 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .question-container {
    background: var(--card-bg);  /* Now uses solid color */
    /* Remove or reduce blur effect */
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 32px;
    box-shadow: var(--shadow-heavy);
    position: relative;
    overflow: hidden;
    transition: var(--transition);
}
        .question-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--info));
            background-size: 200% 100%;
            animation: gradient-flow 3s linear infinite;
        }
        
        @keyframes gradient-flow {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .question-number {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 12px 20px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: var(--shadow-light);
            position: relative;
        }
        
        .question-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }
        
        .question-progress {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
        }
        
        .question-marks {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 600;
        }
        
        .question-text {
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 32px;
            color: var(--text);
            font-weight: 500;
        }
        
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .option {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 20px 24px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            font-size: 16px;
            font-weight: 500;
            color: var(--text);
            overflow: hidden;
        }
        
        .option::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s;
        }
        
        .option:hover::before {
            left: 100%;
        }
        
        .option:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: var(--shadow-light);
        }
        
        .option:active {
            transform: scale(0.98);
        }

        .menu-btn, .theme-toggle, .nav-btn.prev, .action-btn.flag {
    background: var(--card-bg);  /* Solid background */
    backdrop-filter: none;  /* Remove blur */
}

.sidebar {
    background: var(--card-bg);  /* Solid background */
    backdrop-filter: none;  /* Remove blur */
}
        
        .option.selected {
            background: rgba(99, 102, 241, 0.15);
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-light);
        }
        
        .option.correct {
            background: rgba(16, 185, 129, 0.15);
            border-color: var(--success);
            color: var(--success);
        }
        
        .option.incorrect {
            background: rgba(239, 68, 68, 0.15);
            border-color: var(--error);
            color: var(--error);
        }
        
        .option.disabled {
            background: rgba(160, 174, 192, 0.1);
            border-color: var(--text-secondary);
            color: var(--text-secondary);
            cursor: not-allowed;
        }
        
        .option-indicator {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }
        
        .option.selected .option-indicator {
            background: var(--primary);
            color: white;
        }
        
        .option.correct .option-indicator {
            background: var(--success);
            color: white;
        }
        
        .option.incorrect .option-indicator {
            background: var(--error);
            color: white;
        }
        
        .option:not(.selected):not(.correct):not(.incorrect) .option-indicator {
            border: 2px solid var(--border);
        }
        
        /* Solution Panel */
        .solution-panel {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(245, 158, 11, 0.05));
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 20px;
            padding: 24px;
            margin-top: 24px;
            backdrop-filter: blur(10px);
            transform: translateY(20px);
            opacity: 0;
            transition: var(--transition);
        }
        
        .solution-panel.show {
            transform: translateY(0);
            opacity: 1;
        }
        
        .solution-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            color: var(--warning);
            font-weight: 700;
        }
        
        .solution-content {
            color: var(--text);
            line-height: 1.6;
            font-size: 15px;
        }
        
        /* Navigation */
        .navigation {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            padding: 16px 20px;
            z-index: 90;
        }
        
        .nav-content {
            display: flex;
            gap: 12px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .nav-btn {
            flex: 1;
            padding: 16px 24px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        
        .nav-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.6s;
        }
        
        .nav-btn:hover::before {
            left: 100%;
        }
        
        .nav-btn:active {
            transform: scale(0.95);
        }
        
        .nav-btn.prev {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            backdrop-filter: blur(10px);
        }
        
        .nav-btn.next {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: var(--shadow-light);
        }
        
        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .nav-btn:disabled::before {
            display: none;
        }
        
        /* Question Panel Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid var(--border);
            z-index: 200;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-heavy);
        }
        
        .sidebar.open {
            right: 0;
        }
        
        .sidebar-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .sidebar-title {
            font-weight: 800;
            font-size: 20px;
        }
        
        .close-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        
        .close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(90deg);
        }
        
        .sidebar-body {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }
        
        .questions-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 32px;
        }
        
        .question-btn {
            background: var(--card-bg);
            border: 2px solid var(--border);
            color: var(--text-secondary);
            width: 48px;
            height: 48px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            position: relative;
        }
        
        .question-btn:hover {
            transform: scale(1.1);
            box-shadow: var(--shadow-light);
        }
        
        .question-btn:active {
            transform: scale(0.95);
        }
        
        .question-btn.current {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: var(--shadow-light);
        }
        
        .question-btn.answered {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border-color: var(--success);
        }
        
        .question-btn.correct {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }
        
        .question-btn.incorrect {
            background: var(--error);
            color: white;
            border-color: var(--error);
        }
        
        .question-btn.flagged::after {
            content: '🚩';
            position: absolute;
            top: -4px;
            right: -4px;
            font-size: 10px;
        }
        
        /* Legend */
        .legend {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 32px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .legend-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        
        .legend-dot.current { background: var(--primary); }
        .legend-dot.answered { background: var(--success); }
        .legend-dot.unattempted { background: var(--text-secondary); }
        .legend-dot.flagged { background: var(--warning); }
        
        /* Action Buttons */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .action-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }
        
        .action-btn.flag {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        
        .action-btn.submit {
            background: linear-gradient(135deg, var(--error), #dc2626);
            color: white;
            box-shadow: var(--shadow-light);
        }
        
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-heavy);
        }
        
        .action-btn:active {
            transform: scale(0.98);
        }
        
        /* Overlay */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 150;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }
        
        .overlay.show {
            opacity: 1;
            visibility: visible;
        }
        
        /* Result Modal */
        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 32px;
            max-width: 90vw;
            width: 480px;
            z-index: 300;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
            box-shadow: var(--shadow-heavy);
            overflow: hidden;
        }
        
        .modal.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }
        
        .modal-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 40px 32px;
            text-align: center;
        }
        
        .modal-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        
        .modal-subtitle {
            opacity: 0.9;
            font-size: 16px;
            font-weight: 500;
        }
        
        .modal-body {
            padding: 32px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            text-align: center;
            padding: 20px 16px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }
        
        .stat-label {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        
        .stat-value {
            color: var(--text);
            font-size: 24px;
            font-weight: 800;
        }
        
        .final-score {
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
            border-radius: 20px;
            padding: 32px;
            text-align: center;
            margin-bottom: 24px;
            box-shadow: var(--shadow-light);
        }
        
        .score-text {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        
        .percentage-text {
            opacity: 0.9;
            font-size: 18px;
            font-weight: 600;
        }
        
        .modal-actions {
            display: flex;
            gap: 12px;
        }
        
        .modal-btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }
        
        .modal-btn.primary {
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary);
            border: 1px solid rgba(99, 102, 241, 0.3);
        }
        
        .modal-btn.success {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        
        .modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-light);
        }
        
        /* Auto-save indicator */
        .auto-save {
            position: fixed;
            top: 80px;
            right: 20px;
            background: var(--success);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            transform: translateX(100px);
            opacity: 0;
            transition: var(--transition);
            z-index: 90;
        }
        
        .auto-save.show {
            transform: translateX(0);
            opacity: 1;
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .header-content {
                padding: 0 4px;

llows us to walk that same path in our lives. Forgiveness frees us, but love unites us. It lets the heart become a channel of peace for the world.</p> <p><strong>How does Paryushan operationalise the psychological benefit suggested by the Journal of Health Psychology study?</strong>", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> By prescribing eight days of restraint, reflection, and prayer that cultivate forgiveness, weakening the stress–illness link", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> By requiring public confession rituals that instantly erase misunderstandings and stress", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> By advising avoidance of stressful situations so illness cannot develop", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> By encouraging measured retaliation to deter future harm and thus reduce stress"], "correct_answer": 0, "solution": "No solution available"}, {"id": "162669", "question": "<strong>Comprehension</strong>:<br> A Journal of Health Psychology study of 148 people found that in those with a forgiving nature, the link between stress and illness nearly disappeared. This is what the Jain festival of Paryushan has emphasised for centuries. It is observed for eight days, reminding us that forgiveness is a way to release the burdens that weigh on the heart. We come closer to our true nature through restraint, reflection and prayer.</p> <p>Unless we forgive, hurt lingers, and impressions carry forward. Most of the hurt we feel begins with misunderstandings. But when emotional residue is cleared, even if the mind recalls, we have risen above it. A forgiving heart is free, a grateful heart is content, whereas a vengeful heart is restless.</p> <p>Meditation, cleaning and prayer support this inner change. With regular practice, the heart becomes simple and pure, filled with humility and sincerity. A heart soaked in gratitude towards God no longer needs to forgive, for it holds no grudges. In such a heart, there is no pride to be wounded.</p> <p>Mahavir taught that forgiveness is the highest virtue and the path to liberation. Paryushan allows us to walk that same path in our lives. Forgiveness frees us, but love unites us. It lets the heart become a channel of peace for the world.</p> <p><strong>What tone does the author adopt in the passage?</strong>", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Cynical and dismissive", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Reflective and reverent", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Satirical and ironic", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Clinical and detached"], "correct_answer": 1, "solution": "No solution available"}, {"id": "162670", "question": "<strong>Comprehension</strong>:<br> A Journal of Health Psychology study of 148 people found that in those with a forgiving nature, the link between stress and illness nearly disappeared. This is what the Jain festival of Paryushan has emphasised for centuries. It is observed for eight days, reminding us that forgiveness is a way to release the burdens that weigh on the heart. We come closer to our true nature through restraint, reflection and prayer.</p> <p>Unless we forgive, hurt lingers, and impressions carry forward. Most of the hurt we feel begins with misunderstandings. But when emotional residue is cleared, even if the mind recalls, we have risen above it. A forgiving heart is free, a grateful heart is content, whereas a vengeful heart is restless.</p> <p>Meditation, cleaning and prayer support this inner change. With regular practice, the heart becomes simple and pure, filled with humility and sincerity. A heart soaked in gratitude towards God no longer needs to forgive, for it holds no grudges. In such a heart, there is no pride to be wounded.</p> <p>Mahavir taught that forgiveness is the highest virtue and the path to liberation. Paryushan allows us to walk that same path in our lives. Forgiveness frees us, but love unites us. It lets the heart become a channel of peace for the world.</p> <p>From the closing lines, what is the <strong>best inference</strong> about how the author distinguishes <strong>forgiveness</strong> and <strong>love</strong> in achieving inner and outer harmony?", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Forgiveness is inferior to love because it cannot lead to liberation.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Forgiveness and love are synonymous in effect; both solely reduce illness.", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Forgiveness removes inner bondage, while love creates connection; together they enable peace.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Love must precede forgiveness as a necessary precondition."], "correct_answer": 2, "solution": "No solution available"}, {"id": "162696", "question": "<strong>Select the correct spelling of the highlighted word in the following sentence.</strong><br> His <strong>inginuity </strong>impressed everyone.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> ingunity", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> ingenuity", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> ingenewity", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> injenuty"], "correct_answer": 1, "solution": "<strong>B)</strong> The correct spelling of ‘<strong>inginuity</strong>’ is <strong>‘ingenuity’</strong>, which means “cleverness, resourcefulness, or inventiveness सूझ-बूझ, रचनात्मकता।"}, {"id": "162690", "question": "<strong>Select the most appropriate ANTONYM of the given word</strong>.</p> <p>There was much to <strong>boast</strong> about the quality of his work.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> bluster", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> brag", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> deprecate", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> flaunt"], "correct_answer": 2, "solution": "C) <strong>Boast</strong> (verb) – brag, flaunt, swagger, gloat, show off. डींग मारना / शेखी बघारना\n\n<strong>Antonym: Deprecate</strong> (verb) – disapprove, belittle, condemn, disparage, criticize.निंदा करना / तुच्छ दिखाना\n\n<strong>Bluster</strong> (verb) – Talk in a loud, aggressive, boastful way. धमकाना / अकड़कर बोलना\n\n<strong>Brag</strong> (verb) – Say something in a boastful manner. डींग मारना\n\n<strong>Flaunt</strong> (verb) – Display ostentatiously, show off. दिखावा करना / प्रदर्शन करना"}, {"id": "162686", "question": "<strong>Select the most appropriate meaning of the given idiom</strong>.</p> <p>Everyone and his brother", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> An individual and all his relatives", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> To think about universal brotherhood", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> A large number of people", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> To treat people as relatives"], "correct_answer": 2, "solution": "<strong>C) Everyone and his brother</strong> (idiom) – A large number of people बहुत सारे लोग / सभी व्यक्ति"}, {"id": "162692", "question": "<strong>Identify the number of sentence/s is/are grammatically incorrect and select the option which shows how many sentences are grammatically incorrect. If all the sentences are correct, then select option (D), all are correct.</strong></p> <p>(i) I hate it when I break in hives.</p> <p>(ii) Either Vikas or his friends is going to cook dinner.</p> <p>(iii) The accusation of abatement to the crime that had been levelled at him was eventually not proven in court.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> 3", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> 2", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> 1", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> All are correct"], "correct_answer": 0, "solution": "A) 3\n\n(i) Error\n\n‘break in hives’ की जगह phrasal verb ‘break out in hives’ होगा; ‘break out in’ का प्रयोग rash/hives के साथ होता है। जैसे— I hate it when I break out in hives.\n\nUse the phrasal verb break out in (hives/rash), not “break in hives.” Correct: I hate it when I break out in hives.\n\n(ii) Error\n\n“Either … or” में verb निकटतम subject से agree करता है; यहाँ निकटतम friends (plural) है, इसलिए are होगा: Either Vikas or his friends are going to cook dinner.\n\nWith either … or, the verb agrees with the nearer subject; here friends → plural → are.\n\n(iii) Error\n\n‘abatement’ (घटाव) नहीं, कानूनी संदर्भ में ‘abetment’ (उकसाना/सहायता) सही है; साथ ही preposition of और idiomatically levelled against him होगा।\n\nCorrect: The accusation of abetment of the crime that had been levelled against him was eventually not proved in court.\n\nUse legal term abetment (of a crime), not “abatement,” and prefer level an accusation against someone; “not proved/proven” is acceptable—“not proved” is standard."}, {"id": "162688", "question": "<strong>Select the most appropriate synonym of the given word</strong>.</p> <p>They <strong>smothered</strong> the fire in the building.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> lighted", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> surrounded", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> doused", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> saw"], "correct_answer": 2, "solution": "C) <strong>Smother</strong> (verb) – Extinguish, suppress, stifle, suffocate, quell. बुझाना / दबाना\n\n<strong>Synonym</strong>: <strong>Doused</strong> (verb) – Quenched, extinguished, put out, soaked, immersed. बुझाना / डुबाना\n\n<strong>Lighted</strong> (verb) – To set on fire, ignite, illuminate, kindle, spark. जलाना / रोशन करना\n\n<strong>Surrounded</strong> (verb) – To encircle, enclose, encompass, beset, hem in. घेरना / चारों ओर होना\n\n<strong>Saw</strong> (verb) – To perceive, view, observe, witness, notice. देखना"}, {"id": "162687", "question": "<strong>Select the most appropriate synonym of the given word</strong>.</p> <p>He studied <strong>mensuration</strong> carefully.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> measurement", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> questions", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> conclusions", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> lessons"], "correct_answer": 0, "solution": "A) <strong>Mensuration</strong> (noun) – Measurement of geometric figures such as length, area, and volume.\n\n<strong>Synonym</strong>: <strong>Measurement</strong> (noun) – The act of determining size, length, or amount using standard units. माप\n\n• <strong>Questions</strong> (noun) – Inquiries, problems asked for answers. प्रश्न\n\n• <strong>Conclusions</strong> (noun) – Final decisions, judgments after reasoning. निष्कर्ष\n\n• <strong>Lessons</strong> (noun) – Units of teaching or instructions. पाठ"}, {"id": "162697", "question": "<strong>Select the correct spelling of the highlighted word in the following sentence.</strong><br> There is a <strong>profilation </strong>of new mobile apps.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> prolifration", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> proliferration", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> proliferation", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> prolifiration"], "correct_answer": 2, "solution": "<strong>C)</strong> The correct spelling of ‘profilation’ is <strong>‘proliferation’</strong>, which means “rapid increase or spread.” विस्तार, तेज़ी से फैलना।"}, {"id": "162684", "question": "<strong>Sentences of a paragraph are given below in jumbled order. Select the option that arranges the sentences in the correct order to form a meaningful and coherent paragraph.<br> A. </strong> The country has experienced unprecedented economic development since the adoption of the New Economic Policy in the year 1999. Faced with a critical foreign exchange crisis, the country adopted the policy in the Union Budget presented in the year 1999<br> <strong>B. </strong> In the immediate aftermath of the newly announced policy, there was apprehension in the minds of the people<br> <strong>C. </strong> The middle classes have been the greatest beneficiary of the policy, who today enjoy far greater levels of income than their previous generations.<br> <strong>D. </strong> If the country dreams of a much larger economy today, much of the optimism is due to the policy changes that took place in the year 1999.<br> <strong>E. </strong>Within a few years, however, the beneficial impact of the newly announced policy became manifest through higher GDP and a thriving economy.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> C, D, A, B, E", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> E, D, A, B, C", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> B, D, E, C, A", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> A, B, E, C, D"], "correct_answer": 3, "solution": "D) A, B, E, C, D\n\nA starts the paragraph by introducing the New Economic Policy (1999) and the reason for its adoption (foreign exchange crisis). This sets the context.\n\nB follows A with \"the newly announced policy\" referring directly to the policy introduced in A. It describes the immediate public reaction (apprehension).\n\nE follows B with \"Within a few years, however,\" contrasting the initial apprehension (B) with the later positive impact. \"The newly announced policy\" again refers back to the same policy.\n\nC follows E by providing specific details about who benefited the most (middle classes) from the thriving economy mentioned in E.\n\nD concludes by linking today's optimism to the 1999 policy, summarizing the overall significance.\n\nIn Hindi\n\nA paragraph की शुरुआत करता है क्योंकि यह New Economic Policy (1999) और उसे adopt करने का reason (foreign exchange crisis) introduce करता है। यह context set करता है।\n\nB, A के बाद आता है क्योंकि इसमें \"the newly announced policy\" A में introduced policy को refer करता है। यह immediate public reaction (apprehension) describe करता है।\n\nE, B के बाद आता है क्योंकि \"Within a few years, however,\" B में mentioned apprehension के contrast में positive impact बताता है। \"The newly announced policy\" फिर से same policy को refer करता है।\n\nC, E के बाद आता है क्योंकि यह specific group (middle classes) के बारे में बताता है जो E में mentioned thriving economy से benefit हुआ।\n\nD conclusion के रूप में आता है, जो आज की optimism को 1999 की policy changes से link करता है।"}, {"id": "162691", "question": "<strong>Identify the part of speech of the underlined word.</strong></p> <p>Sit down and rest a <ins><strong>while</strong></ins>.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Adverb", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Adjective", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Intensifier", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Noun"], "correct_answer": 3, "solution": "D) यहाँ ‘while’ एक Noun के रूप में प्रयुक्त हुआ है। यहाँ यह समय की अवधि (a short period of time) को दर्शाता है। वाक्य में ‘rest a while’ का अर्थ है “थोड़ी देर आराम करो”।\n\n'while' functions as a Noun, denoting a short duration of time (period). In the sentence, it is the object of the article \"a\", which always precedes a noun."}, {"id": "162694", "question": "<strong>Select the option that expresses the given sentence in reported speech.</strong></p> <p>“Read the text thoroughly and try to express your ideas in simple correct English”, said the teacher.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> The teacher advised him to read the text thoroughly and to try to express his ideas in simple correct English.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The teacher told that he should read the text thoroughly and tried to express his ideas in simple correct English.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The teacher asked him to read the text thoroughly and to try to express his ideas in simple correct English.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The teacher said to read the text thoroughly and try to express your ideas in simple correct English."], "correct_answer": 0, "solution": "A. The teacher advised him to read the text thoroughly and to try to express his ideas in simple correct English.\n\nImperative → use <strong>to-infinitive</strong>: “to read… and to try…”. आदेश/सलाह वाले वाक्य को <strong>to-infinitive</strong> में बदला जाता है: “to read… and to try…”.\n\nReporting verb <strong>advised</strong> fits a teacher’s guidance. शिक्षक की <strong>सलाह</strong> दर्शाने के लिए <strong>advised</strong> सबसे उपयुक्त है।\n\nAdd the listener as an object (<strong>him</strong>) and shift <strong>your → his</strong>. श्रोता (him) जोड़ना और सर्वनाम बदलना ज़रूरी है: <strong>your → his</strong>.\n\nParallel structure maintained: “to read… and to try…”. समानांतर संरचना बनी रहती है: “to read… and to try…”.\n\nWhy not B, C, D (short):\n\n<strong>B:</strong> “told that” needs an object (<strong>told him that</strong>). Also wrong form <strong>tried</strong>; should be <strong>to try</strong>. Object नहीं, और <strong>tried</strong> की जगह <strong>to try</strong> चाहिए।\n\n<strong>C:</strong> Grammatically okay, but <strong>asked</strong> shows a request; here the tone is <strong>advice/instruction</strong>, so <strong>advised</strong> is better and expected. व्याकरण सही पर भाव <strong>अनुरोध</strong> का है; शिक्षक की <strong>सलाह</strong> के लिए <strong>advised</strong> उपयुक्त।\n\n<strong>D:</strong> Missing object after <strong>said</strong>; pronoun not shifted (<strong>your → his</strong>); and “said to” isn’t the right reporting for an imperative here. Object नहीं, सर्वनाम बदलाव नहीं, और <strong>said to</strong> का प्रयोग अनुपयुक्त।"}, {"id": "162689", "question": "<strong>Select the most appropriate ANTONYM of the given word</strong>.</p> <p>He was <strong>accused</strong> by the entire community after he failed in the mission.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> vindicated", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> incriminated", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> indicted", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> arraigned"], "correct_answer": 0, "solution": "A) <strong>Accused</strong> (verb) – Charged with a crime, blamed, alleged, prosecuted, arraigned. अभियुक्त / आरोप लगाना\n\n<strong>Antonym: Vindicated</strong> (verb) – Cleared of blame, justified, absolved, exonerated, acquitted.निर्दोष साबित करना / दोषमुक्त करना\n\n<strong>Incriminated</strong> (verb) – To make someone appear guilty, implicate, charge, frame, denounce. दोषी ठहराना / आरोप लगाना\n\n<strong>Indicted</strong> (verb) – Formally accused or charged with a serious crime, prosecute, arraign, summon, denounce. औपचारिक रूप से आरोप लगाना\n\n<strong>Arraigned</strong> (verb) – To call someone before a court to answer a criminal charge, prosecute, indict, summon, impeach. अदालत में आरोपित करना"}, {"id": "162695", "question": "<strong>Select the option that expresses the given sentence in reported speech.</strong></p> <p>“I’ve just bought a car,” said Peter, “but it is not insured yet so I can’t take you for a ride.”", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Peter said that he has just bought a car but it is not insured yet so he can’t take me for a ride.", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Peter said that he had just bought a car but it was not insured till then so he could not take him for a ride.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Peter told that he had just bought a car but it had not been insured yet so he wouldn’t take you for a ride.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Peter said that he just bought a car but it was not insured yet so he cannot take me for a ride."], "correct_answer": 1, "solution": "B. Peter said that he had just bought a car but it was not insured till then so he could not take him for a ride.\n\n<strong>Backshift of tenses:</strong> “I’ve just bought” (present perfect) → <strong>he had just bought</strong> (past perfect). “it is not insured yet” → <strong>it was not insured yet</strong>. “I can’t” → <strong>he could not</strong>. रिपोर्टिंग क्रिया <strong>said</strong> past में है, इसलिए काल पीछे जाएगा: <strong>have bought → had bought</strong>, <strong>is → was</strong>, <strong>can’t → could not</strong>.\n\n<strong>Time word:</strong> “yet” in past reporting can be rendered as <strong>“till then”</strong> (i.e., up to that time). “yet” को अप्रत्यक्ष कथन में <strong>“till then”</strong> कहना स्वीकृत है।\n\n<strong>Pronoun change:</strong> Direct “you” becomes third-person <strong>him</strong> when the reporter is talking to a third person. सर्वनाम बदलाव: “you” → <strong>him</strong> (यदि रिपोर्ट किसी तीसरे व्यक्ति को की जा रही हो).\n\nWhy not A/C/D (short):\n\n<strong>A:</strong> No proper backshift — uses <strong>has / is / can’t</strong> after <strong>said</strong> (past). काल नहीं बदला गया, इसलिए गलत।\n\n<strong>C:</strong> <strong>told that</strong> needs an object (<strong>told me/him that</strong>). Also wrong modal/pronoun: <strong>wouldn’t take you</strong> (should be <strong>could not</strong> + pronoun shift).\n\n<strong>D:</strong> Missing backshift (<strong>just bought</strong>, <strong>cannot</strong> remain present); also awkward reporting (“said that he just bought…”)."}, {"id": "162683", "question": "<strong>The question consists of six sentences of a passage. The first and sixth sentences are given as S1 and S6. The middle four sentences in each have been jumbled up and labelled as P, Q, R and S. You are required to find the proper sequence of the four sentences</strong></p> <p>S1: Historians have often explained religious and social reform in India in the nineteenth century às a result of the Western impact upon the minds of men.</p> <p>P: With that purpose, we seek to analyze the thoughts and activities of individuals who were both religious reformers and vernacular publicists.</p> <p>Q: The equation of westernization and modernization has given way to a search for the indigenous sources of social changes.</p> <p>R: Recognizing the modernity of tradition is one thing however, whereas understanding the intellectual processes that produced indigenously generated change is another.</p> <p>S: Others have recognized that this was entirely too simple an explanation for the intellectual and social changes that took place in India and other places that fell under the foreign colonial rule.</p> <p>S6: Each of these vernacular-using reformers derived his arguments from within his own tradition", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> QRSP", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> RQPS", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> SQRP", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> SPRQ"], "correct_answer": 2, "solution": "C) SQRP\n\n<strong>S</strong> follows S1 because it starts with \"Others have recognized\", which directly contradicts and expands on S1's claim about historians. The pronoun \"this\" in S refers to the explanation given in S1.\n\n<strong>Q</strong> follows S because it begins with \"The equation of westernization and modernization\", which is what S critiques (as \"too simple\"). Q explains the shift to searching for indigenous sources.\n\n<strong>R</strong> follows Q because it starts with \"Recognizing the modernity of tradition\", which relates to the \"indigenous sources\" mentioned in Q. It then introduces a contrast (\"however, whereas\") emphasizing the need to understand intellectual processes.\n\n<strong>P</strong> follows R because it begins with \"With that purpose\", where \"that purpose\" refers directly to \"understanding the intellectual processes\" from R. P then specifies the analysis of individuals (reformers and vernacular publicists), which leads to S6.\n\nIn Hindi:\n\n<strong>S</strong>, S1 के बाद आता है क्योंकि यह \"Others have recognized\" से start होता है, जो S1 के historians के view को challenge करता है। Pronoun \"this\" S1 में दिए गए explanation (Western impact) को refer करता है।\n\n<strong>Q</strong>, S के बाद आता है क्योंकि यह \"The equation of westernization and modernization\" से start होता है, जो S में mentioned \"too simple explanation\" का ही part है। Q बताता है कि अब indigenous sources की search हो रहीहै।\n\n<strong>R</strong>, Q के बाद आता है क्योंकि यह \"Recognizing the modernity of tradition\" से start होता है, जो Q में \"indigenous sources\" से related है। R एक contrast introduce करता है: tradition की modernity recognize करना एक बात है,लेकिन intellectual processes को understand करना another thing है।\n\n<strong>P</strong>, R के बाद आता है क्योंकि यह \"With that purpose\" से start होता है, जहाँ \"that purpose\" R में mentioned \"understanding the intellectual processes\" को refer करता है। P बताता है कि हम individuals के thoughts और activities analyze करते हैं, जो S6 से directly connect होता है (\"these vernacular-using reformers\")।"}, {"id": "162685", "question": "<strong>Direction: The question consists of a sentence, parts of which have been jumbled. These parts have been labelled as P, Q, R and S. Given below each sentence are four sequences, namely (a), (b), (c) and (d). You are required to re-arrange the jumbled parts of the sentence and mark your response accordingly.</strong></p> <p>or the opposite (P)/ where you say one thing (Q)/ irony is a figure of speech (R)/ while you mean another (S)", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> RSQP", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> SPQR", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> RQSP", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> PSQR"], "correct_answer": 2, "solution": "C) RQSP\n\n<strong>R</strong> starts the sentence as it introduces the subject \"irony\" and defines it as \"a figure of speech\".\n\n<strong>Q</strong> follows R with \"where you say one thing\", which is a relative clause describing the nature of irony. It connects directly to R.\n\n<strong>S</strong> follows Q with \"while you mean another\", which contrasts with \"say one thing\". The conjunction \"while\" sets up the contrast.\n\n<strong>P</strong> concludes with \"or the opposite\", which clarifies and emphasizes that \"another\" means \"the opposite\". It adds precision to the definition.\n\nIn Hindi:\n\n<strong>R</strong> sentence की शुरुआत करता है क्योंकि यह subject \"irony\" को introduce करता है और उसे \"a figure of speech\" define करता है।\n\n<strong>Q</strong>, R के बाद आता है क्योंकि यह relative clause \"where you say one thing\" से start होता है, जो irony की nature को describe करता है। यह directly R से connect होता है।\n\n<strong>S</strong>, Q के बाद आता है क्योंकि यह conjunction \"while\" से start होता है, जो contrast show करता है: \"say one thing\" के opposite \"mean another\"।\n\n<strong>P</strong>, S के बाद आता है क्योंकि \"or the opposite\" phrase S में \"another\" को clarify करता है, यह बताता है कि \"another\" का मतलब \"the opposite\" ही है"}, {"id": "162677", "question": "< nt Donald Trump would<strong> </strong>______(2)______his plan to slap a 25% tariff for the second time, it is disappointing that he has gone ahead with his decision. It only shows that Mr. Trump is obdurate and is _____ (3) _____by arrogance. He does not seem to take _____ (4) ______decisions. United States-dependent Indian exporters will face a serious financial crisis. The situation is _____ (5)______as it would take them years to neutralise their financial losses.</p> <p><strong>What should come in the place of 5. </strong>", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> reassuring", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> disparaging", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> disconcerting", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> acquiescing"], "correct_answer": 2, "solution": "No solution available"}];
        const examConfig = {
            id: '8286',
            duration: 20,
            positiveMarks: 1.0,
            negativeMarks: 0.25
        };
        
        let currentQuestionIndex = 0;
        let userAnswers = {};
        let flaggedQuestions = new Set();
        let timeLeft = examConfig.duration * 60;
        let timerInterval;
        let isTestFinished = false;
        let solutionMode = false;
        let touchStartX = 0;
        let touchStartY = 0;
        
        // Initialize app
        function initializeApp() {
            createParticles();
            generateQuestionsGrid();
            loadQuestion();
            startTimer();
            setupTouchGestures();
            setupAutoSave();
            
            // Prevent accidental page leave
            window.addEventListener('beforeunload', (e) => {
                if (!isTestFinished) {
                    e.preventDefault();
                    e.returnValue = 'Test in progress. Are you sure you want to leave?';
                }
            });
        }
        
        // Create floating particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = window.innerWidth < 768 ? 20 : 40;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 3 + 3) + 's';
                particlesContainer.appendChild(particle);
            }
        }
        
        // Load current question
        function loadQuestion() {
            const question = questions[currentQuestionIndex];
            
            // Update question info
            document.getElementById('questionNumber').textContent = `Q${currentQuestionIndex + 1}`;
            document.getElementById('questionProgress').textContent = 
                `${currentQuestionIndex + 1} of ${questions.length}`;
            document.getElementById('questionText').innerHTML = question.question;
            
            // Load options
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            
            question.options.forEach((option, index) => {
                const optionElement = document.createElement('div');
                optionElement.className = 'option';
                optionElement.innerHTML = option;
                
                const indicator = document.createElement('div');
                indicator.className = 'option-indicator';
                optionElement.appendChild(indicator);
                
                if (solutionMode) {
                    // Show solution mode styling
                    if (index === question.correct_answer) {
                        optionElement.classList.add('correct');
                        indicator.textContent = '✓';
                    } else if (userAnswers[currentQuestionIndex] === index) {
                        optionElement.classList.add('incorrect');
                        indicator.textContent = '✗';
                    } else {
                        optionElement.classList.add('disabled');
                    }
                    optionElement.style.pointerEvents = 'none';
                } else {
                    // Normal mode
                    if (userAnswers[currentQuestionIndex] === index) {
                        optionElement.classList.add('selected');
                        indicator.textContent = '✓';
                    }
                    
                    optionElement.onclick = () => selectOption(index);
                    optionElement.onkeydown = (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            selectOption(index);
                        }
                    };
                    optionElement.tabIndex = 0;
                }
                
                optionsContainer.appendChild(optionElement);
            });
            
            // Handle solution panel
            const solutionPanel = document.getElementById('solutionPanel');
            if (solutionMode && question.solution) {
                document.getElementById('solutionContent').innerHTML = question.solution;
                solutionPanel.classList.add('show');
            } else {
                solutionPanel.classList.remove('show');
            }
            
            // Update navigation
            updateNavigation();
            updateQuestionsGrid();
            updateFlagButton();
            
            // Add entrance animation
            const container = document.getElementById('questionContainer');
            container.style.transform = 'translateY(20px)';
            container.style.opacity = '0';
            setTimeout(() => {
                container.style.transform = 'translateY(0)';
                container.style.opacity = '1';
            }, 100);
        }
        
        // Select an option
        function selectOption(index) {
            if (solutionMode) return;
            
            const currentAnswer = userAnswers[currentQuestionIndex];
            
            if (currentAnswer === index) {
                // Deselect if clicking the same option
                delete userAnswers[currentQuestionIndex];
            } else {
                // Select new option
                userAnswers[currentQuestionIndex] = index;
            }
            
            // Update UI
            const options = document.querySelectorAll('.option');
            options.forEach((option, i) => {
                const indicator = option.querySelector('.option-indicator');
                if (userAnswers[currentQuestionIndex] === i) {
                    option.classList.add('selected');
                    indicator.textContent = '✓';
                } else {
                    option.classList.remove('selected');
                    indicator.textContent = '';
                }
            });
            
            updateQuestionsGrid();
            showAutoSave();
        }
        
        // Generate questions grid
        function generateQuestionsGrid() {
            const grid = document.getElementById('questionsGrid');
            grid.innerHTML = '';
            
            questions.forEach((_, index) => {
                const button = document.createElement('button');
                button.className = 'question-btn';
                button.textContent = index + 1;
                button.onclick = () => goToQuestion(index);
                button.setAttribute('aria-label', `Go to question ${index + 1}`);
                grid.appendChild(button);
            });
        }
        
        // Update questions grid styling
        function updateQuestionsGrid() {
            const buttons = document.querySelectorAll('.question-btn');
            buttons.forEach((button, index) => {
                button.className = 'question-btn';
                
                if (index === currentQuestionIndex) {
                    button.classList.add('current');
                } else if (solutionMode) {
                    if (userAnswers[index] === questions[index].correct_answer) {
                        button.classList.add('correct');
                    } else if (userAnswers[index] !== undefined) {
                        button.classList.add('incorrect');
                    }
                } else if (userAnswers[index] !== undefined) {
                    button.classList.add('answered');
                }
                
                if (flaggedQuestions.has(index)) {
                    button.classList.add('flagged');
                }
            });
        }
        
        // Navigation functions
        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
            }
        }
        
        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else if (!solutionMode) {
                submitTest();
            }
        }
        
        function goToQuestion(index) {
            currentQuestionIndex = index;
            loadQuestion();
            closeSidebar();
        }
        
        function updateNavigation() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            
            prevBtn.disabled = currentQuestionIndex === 0;
            
            if (solutionMode) {
                nextBtn.textContent = currentQuestionIndex === questions.length - 1 ? 
                    'Finish Review' : 'Next →';
                nextBtn.onclick = currentQuestionIndex === questions.length - 1 ? 
                    finishReview : nextQuestion;
            } else {
                nextBtn.textContent = currentQuestionIndex === questions.length - 1 ? 
                    'Submit Test' : 'Next →';
                nextBtn.onclick = currentQuestionIndex === questions.length - 1 ? 
                    submitTest : nextQuestion;
            }
        }
        
        // Timer functions
        function startTimer() {
            const timerElement = document.getElementById('timer');
            const progressCircle = document.getElementById('progressCircle');
            const circumference = 2 * Math.PI * 18;
            const totalTime = examConfig.duration * 60;
            
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    submitTest();
                    return;
                }
                
                timeLeft--;
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerElement.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                
                // Update progress circle
                const progress = (totalTime - timeLeft) / totalTime;
                const offset = circumference * progress;
                progressCircle.style.strokeDashoffset = offset;
                
                // Add warning effects
                if (timeLeft <= 300) { // 5 minutes
                    timerElement.classList.add('warning');
                }
                if (timeLeft <= 60) { // 1 minute
                    timerElement.classList.add('critical');
                }
            }, 1000);
        }
        
        // Toggle question flag
        function toggleFlag() {
            if (flaggedQuestions.has(currentQuestionIndex)) {
                flaggedQuestions.delete(currentQuestionIndex);
            } else {
                flaggedQuestions.add(currentQuestionIndex);
            }
            updateFlagButton();
            updateQuestionsGrid();
        }
        
        function updateFlagButton() {
            const flagBtn = document.getElementById('flagBtn');
            if (flaggedQuestions.has(currentQuestionIndex)) {
                flagBtn.textContent = '🏴 Unflag Question';
                flagBtn.style.background = 'rgba(239, 68, 68, 0.2)';
                flagBtn.style.color = 'var(--error)';
            } else {
                flagBtn.textContent = '🚩 Flag Question';
                flagBtn.style.background = 'rgba(245, 158, 11, 0.2)';
                flagBtn.style.color = 'var(--warning)';
            }
        }
        
        // Theme toggle
        function toggleTheme() {
            const body = document.body;
            const themeBtn = document.getElementById('themeBtn');
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            body.setAttribute('data-theme', newTheme);
            themeBtn.textContent = newTheme === 'light' ? '🌙' : '☀️';
            
            // Save preference
            localStorage.setItem('theme', newTheme);
        }
        
        // Sidebar functions
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            
            sidebar.classList.toggle('open');
            overlay.classList.toggle('show');
        }
        
        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('show');
        }
        
        // Touch gesture support
        function setupTouchGestures() {
            const main = document.querySelector('.main');
            
            main.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            });
            
            main.addEventListener('touchend', (e) => {
                const touchEndX = e.changedTouches[0].clientX;
                const touchEndY = e.changedTouches[0].clientY;
                const deltaX = touchEndX - touchStartX;
                const deltaY = touchEndY - touchStartY;
                
                // Only trigger if horizontal swipe is dominant
                if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 50) {
                    if (deltaX > 0 && currentQuestionIndex > 0) {
                        // Swipe right - previous question
                        previousQuestion();
                    } else if (deltaX < 0 && currentQuestionIndex < questions.length - 1) {
                        // Swipe left - next question
                        nextQuestion();
                    }
                }
            });
        }
        
        // Auto-save functionality
        function setupAutoSave() {
            // Save answers periodically
            setInterval(() => {
                if (!isTestFinished) {
                    saveProgress();
                }
            }, 30000); // Every 30 seconds
        }
        
        function saveProgress() {
            const progress = {
                answers: userAnswers,
                flagged: Array.from(flaggedQuestions),
                currentQuestion: currentQuestionIndex,
                timeLeft: timeLeft
            };
            
            // In a real implementation, this would save to a server
            console.log('Progress saved:', progress);
        }
        
        function showAutoSave() {
            const autoSave = document.getElementById('autoSave');
            autoSave.classList.add('show');
            setTimeout(() => {
                autoSave.classList.remove('show');
            }, 2000);
        }
        
        // Submit test
        function submitTest() {
            if (isTestFinished) return;
            
            isTestFinished = true;
            clearInterval(timerInterval);
            
            // Calculate results
            let correct = 0, wrong = 0, skipped = 0, totalMarks = 0;
            
            questions.forEach((question, index) => {
                if (userAnswers[index] === undefined) {
                    skipped++;
                } else if (userAnswers[index] === question.correct_answer) {
                    correct++;
                    totalMarks += examConfig.positiveMarks;
                } else {
                    wrong++;
                    totalMarks -= examConfig.negativeMarks;
                }
            });
            
            const maxMarks = questions.length * examConfig.positiveMarks;
            const percentage = Math.max(0, Math.round((totalMarks / maxMarks) * 100));
            
            // Show results
            document.getElementById('resultTitle').textContent = 
                `${correct}/${questions.length} Correct`;
            document.getElementById('resultSubtitle').textContent = 
                `You scored ${totalMarks} out of ${maxMarks} marks`;
            document.getElementById('correctCount').textContent = correct;
            document.getElementById('wrongCount').textContent = wrong;
            document.getElementById('skippedCount').textContent = skipped;
            document.getElementById('finalScore').textContent = `${totalMarks} Marks`;
            document.getElementById('finalPercentage').textContent = `${percentage}%`;
            
            document.getElementById('resultModal').classList.add('show');
            closeSidebar();
        }
        
        // View solutions
        function viewSolutions() {
            document.getElementById('resultModal').classList.remove('show');
            solutionMode = true;
            currentQuestionIndex = 0;
            loadQuestion();
        }
        
        // Finish review
        function finishReview() {
            solutionMode = false;
            currentQuestionIndex = 0;
            loadQuestion();
        }
        
        // Retake test
        function retakeTest() {
            if (confirm('Are you sure you want to retake the test? All progress will be lost.')) {
                location.reload();
            }
        }
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (solutionMode) return;
            
            switch(e.key) {
                case 'ArrowLeft':
                    e.preventDefault();
                    previousQuestion();
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    nextQuestion();
                    break;
                case 'f':
                case 'F':
                    if (e.ctrlKey || e.metaKey) {
                        e.preventDefault();
                        toggleFlag();
                    }
                    break;
                case 'm':
                case 'M':
                    if (e.ctrlKey || e.metaKey) {
                        e.preventDefault();
                        toggleSidebar();
                    }
                    break;
                case '1':
                case '2':
                case '3':
                case '4':
                    if (!e.ctrlKey && !e.metaKey) {
                        e.preventDefault();
                        const optionIndex = parseInt(e.key) - 1;
                        if (optionIndex < questions[currentQuestionIndex].options.length) {
                            selectOption(optionIndex);
                        }
                    }
                    break;
            }
        });
        
        // Initialize when DOM is loaded
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeApp);
        } else {
            initializeApp();
        }
        
        // Load saved theme
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            document.body.setAttribute('data-theme', savedTheme);
            document.getElementById('themeBtn').textContent = savedTheme === 'light' ? '🌙' : '☀️';
        }
    </script>
</body>
