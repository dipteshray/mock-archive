<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6366f1">
    <title>devgagan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #06b6d4;
            
            --glass-bg: rgba(255, 255, 255, 0.95);  /* Changed from 0.25 to 0.95 */
            --glass-border: rgba(255, 255, 255, 0.8);  /* Changed from 0.18 to 0.8 */
            --shadow-light: 0 8px 32px rgba(31, 38, 135, 0.37);
            --shadow-heavy: 0 20px 60px rgba(0, 0, 0, 0.3);
            
            --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --bounce: cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        
[data-theme="light"] {
    --bg: #ffffff;  /* Changed from gradient to solid white */
    --card-bg: #ffffff;  /* Changed from transparent to solid white */
    --text: #1a202c;
    --text-secondary: #4a5568;
    --border: rgba(0, 0, 0, 0.1);  /* Changed to darker border for contrast */
    --nav-bg: #ffffff;  /* Changed from transparent to solid white */
}

[data-theme="dark"] {
    --bg: #1a1a2e;  /* Changed from gradient to solid dark */
    --card-bg: #16213e;  /* Changed from transparent to solid dark */
    --text: #f7fafc;
    --text-secondary: #a0aec0;
    --border: rgba(255, 255, 255, 0.1);
    --nav-bg: #0c0c0c;  /* Changed from transparent to solid dark */
}
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--bg);  /* Now just using the solid color */
    z-index: -1;
}
        
        /* Floating particles animation */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: float 6s infinite ease-in-out;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.7; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 0.3; }
        }
        
        /* Header with glassmorphism */
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 16px 20px;
            z-index: 100;
            transition: var(--transition);
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .menu-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            font-size: 18px;
        }
        
        .menu-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-light);
        }
        
        .menu-btn:active {
            transform: scale(0.95);
        }
        
        .logo {
            font-weight: 800;
            font-size: 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        
        [data-theme="dark"] .logo {
    background: none;
    -webkit-text-fill-color: white; /* White text in dark mode */
    color: white; /* Fallback */
}
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            font-size: 20px;
        }
        
        .theme-toggle:hover {
            transform: rotate(180deg) scale(1.1);
            box-shadow: var(--shadow-light);
        }
        
        /* Advanced Timer */
        .timer-container {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .timer {
            background: linear-gradient(135deg, var(--error), #dc2626);
            color: white;
            padding: 12px 16px;
            border-radius: 16px;
            font-family: 'Inter', monospace;
            font-weight: 600;
            font-size: 14px;
            box-shadow: var(--shadow-light);
            position: relative;
            overflow: hidden;
        }
        
        .timer.warning {
            animation: pulse 1s infinite;
        }
        
        .timer.critical {
            animation: shake 0.5s infinite;
            background: linear-gradient(135deg, #dc2626, #991b1b);
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
        }
        
        .progress-ring {
            width: 40px;
            height: 40px;
            transform: rotate(-90deg);
        }
        
        .progress-circle {
            fill: none;
            stroke: rgba(255, 255, 255, 0.3);
            stroke-width: 3;
        }
        
        .progress-circle.progress {
            stroke: var(--primary);
            stroke-linecap: round;
            transition: stroke-dashoffset 0.3s ease;
        }
        
        /* Main Content */
        .main {
            margin: 80px 0 100px;
            padding: 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .question-container {
    background: var(--card-bg);  /* Now uses solid color */
    /* Remove or reduce blur effect */
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 32px;
    box-shadow: var(--shadow-heavy);
    position: relative;
    overflow: hidden;
    transition: var(--transition);
}
        .question-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--info));
            background-size: 200% 100%;
            animation: gradient-flow 3s linear infinite;
        }
        
        @keyframes gradient-flow {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .question-number {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 12px 20px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: var(--shadow-light);
            position: relative;
        }
        
        .question-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }
        
        .question-progress {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
        }
        
        .question-marks {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 600;
        }
        
        .question-text {
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 32px;
            color: var(--text);
            font-weight: 500;
        }
        
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .option {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 20px 24px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            font-size: 16px;
            font-weight: 500;
            color: var(--text);
            overflow: hidden;
        }
        
        .option::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s;
        }
        
        .option:hover::before {
            left: 100%;
        }
        
        .option:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: var(--shadow-light);
        }
        
        .option:active {
            transform: scale(0.98);
        }

        .menu-btn, .theme-toggle, .nav-btn.prev, .action-btn.flag {
    background: var(--card-bg);  /* Solid background */
    backdrop-filter: none;  /* Remove blur */
}

.sidebar {
    background: var(--card-bg);  /* Solid background */
    backdrop-filter: none;  /* Remove blur */
}
        
        .option.selected {
            background: rgba(99, 102, 241, 0.15);
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-light);
        }
        
        .option.correct {
            background: rgba(16, 185, 129, 0.15);
            border-color: var(--success);
            color: var(--success);
        }
        
        .option.incorrect {
            background: rgba(239, 68, 68, 0.15);
            border-color: var(--error);
            color: var(--error);
        }
        
        .option.disabled {
            background: rgba(160, 174, 192, 0.1);
            border-color: var(--text-secondary);
            color: var(--text-secondary);
            cursor: not-allowed;
        }
        
        .option-indicator {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }
        
        .option.selected .option-indicator {
            background: var(--primary);
            color: white;
        }
        
        .option.correct .option-indicator {
            background: var(--success);
            color: white;
        }
        
        .option.incorrect .option-indicator {
            background: var(--error);
            color: white;
        }
        
        .option:not(.selected):not(.correct):not(.incorrect) .option-indicator {
            border: 2px solid var(--border);
        }
        
        /* Solution Panel */
        .solution-panel {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(245, 158, 11, 0.05));
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 20px;
            padding: 24px;
            margin-top: 24px;
            backdrop-filter: blur(10px);
            transform: translateY(20px);
            opacity: 0;
            transition: var(--transition);
        }
        
        .solution-panel.show {
            transform: translateY(0);
            opacity: 1;
        }
        
        .solution-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            color: var(--warning);
            font-weight: 700;
        }
        
        .solution-content {
            color: var(--text);
            line-height: 1.6;
            font-size: 15px;
        }
        
        /* Navigation */
        .navigation {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            padding: 16px 20px;
            z-index: 90;
        }
        
        .nav-content {
            display: flex;
            gap: 12px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .nav-btn {
            flex: 1;
            padding: 16px 24px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        
        .nav-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.6s;
        }
        
        .nav-btn:hover::before {
            left: 100%;
        }
        
        .nav-btn:active {
            transform: scale(0.95);
        }
        
        .nav-btn.prev {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            backdrop-filter: blur(10px);
        }
        
        .nav-btn.next {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: var(--shadow-light);
        }
        
        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .nav-btn:disabled::before {
            display: none;
        }
        
        /* Question Panel Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid var(--border);
            z-index: 200;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-heavy);
        }
        
        .sidebar.open {
            right: 0;
        }
        
        .sidebar-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .sidebar-title {
            font-weight: 800;
            font-size: 20px;
        }
        
        .close-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        
        .close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(90deg);
        }
        
        .sidebar-body {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }
        
        .questions-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 32px;
        }
        
        .question-btn {
            background: var(--card-bg);
            border: 2px solid var(--border);
            color: var(--text-secondary);
            width: 48px;
            height: 48px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            position: relative;
        }
        
        .question-btn:hover {
            transform: scale(1.1);
            box-shadow: var(--shadow-light);
        }
        
        .question-btn:active {
            transform: scale(0.95);
        }
        
        .question-btn.current {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: var(--shadow-light);
        }
        
        .question-btn.answered {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border-color: var(--success);
        }
        
        .question-btn.correct {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }
        
        .question-btn.incorrect {
            background: var(--error);
            color: white;
            border-color: var(--error);
        }
        
        .question-btn.flagged::after {
            content: '🚩';
            position: absolute;
            top: -4px;
            right: -4px;
            font-size: 10px;
        }
        
        /* Legend */
        .legend {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 32px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .legend-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        
        .legend-dot.current { background: var(--primary); }
        .legend-dot.answered { background: var(--success); }
        .legend-dot.unattempted { background: var(--text-secondary); }
        .legend-dot.flagged { background: var(--warning); }
        
        /* Action Buttons */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .action-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }
        
        .action-btn.flag {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        
        .action-btn.submit {
            background: linear-gradient(135deg, var(--error), #dc2626);
            color: white;
            box-shadow: var(--shadow-light);
        }
        
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-heavy);
        }
        
        .action-btn:active {
            transform: scale(0.98);
        }
        
        /* Overlay */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 150;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }
        
        .overlay.show {
            opacity: 1;
            visibility: visible;
        }
        
        /* Result Modal */
        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 32px;
            max-width: 90vw;
            width: 480px;
            z-index: 300;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
            box-shadow: var(--shadow-heavy);
            overflow: hidden;
        }
        
        .modal.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }
        
        .modal-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 40px 32px;
            text-align: center;
        }
        
        .modal-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        
        .modal-subtitle {
            opacity: 0.9;
            font-size: 16px;
            font-weight: 500;
        }
        
        .modal-body {
            padding: 32px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            text-align: center;
            padding: 20px 16px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }
        
        .stat-label {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        
        .stat-value {
            color: var(--text);
            font-size: 24px;
            font-weight: 800;
        }
        
        .final-score {
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
            border-radius: 20px;
            padding: 32px;
            text-align: center;
            margin-bottom: 24px;
            box-shadow: var(--shadow-light);
        }
        
        .score-text {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        
        .percentage-text {
            opacity: 0.9;
            font-size: 18px;
            font-weight: 600;
        }
        
        .modal-actions {
            display: flex;
            gap: 12px;
        }
        
        .modal-btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }
        
        .modal-btn.primary {
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary);
            border: 1px solid rgba(99, 102, 241, 0.3);
        }
        
        .modal-btn.success {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        
        .modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-light);
        }
        
        /* Auto-save indicator */
        .auto-save {
            position: fixed;
            top: 80px;
            right: 20px;
            background: var(--success);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            transform: translateX(100px);
            opacity: 0;
            transition: var(--transition);
            z-index: 90;
        }
        
        .auto-save.show {
            transform: translateX(0);
            opacity: 1;
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .header-content {
                padding: 0 4px;

<body data-theme="light">

    <!-- Auto-save indicator -->
    <div class="auto-save" id="autoSave">

    </div>
    
    <!-- Header -->
    <header class="header">

            <div class="header-left">

                    <div class="question-progress" id="questionProgress">1 of 25</div>

                </div>
            </div>
            <div class="question-text" id="questionText"></div>
            <div class="options-container" id="optionsContainer"></div>
            <div class="solution-panel" id="solutionPanel">

                    <span>💡</span>
                    <span>Solution</span>
                </div>
                <div class="solution-content" id="solutionContent"></div>
            </div>
        </div>
    </main>
    
    <!-- Navigation -->
    <nav class="navigation">
        <div class="nav-content">
            <button class="nav-btn prev" id="prevBtn" onclick="previousQuestion()" disabled>

            </button>
            <button class="nav-btn next" id="nextBtn" onclick="nextQuestion()">
                Next →
            </button>
        </div>
    </nav>
    
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">

                </div>

    <script>
        // Core Variables
        const questions = [{"id": "141254", "question": "<strong>Comprehension</strong>:</p> <p>India’s Public Distribution System (PDS) is one of the largest food security programmes in the world, yet it continues to leave millions behind. The recent admission by the food ministry to a parliamentary panel that 7.9 million eligible beneficiaries remain outside the PDS due to outdated population data is deeply concerning. The government’s argument that no additional beneficiaries can be added until the next Census — delayed indefinitely since 2021 — rings hollow in the face of persistent hunger and malnutrition. Food security is a fundamental right under the National Food Security Act, 2013, which mandates coverage of 75 per cent of rural and 50 per cent of urban populations. This was calculated using the 2011 Census figures, covering 813 million people. Since then, India’s population has grown significantly. The government’s refusal to update its beneficiary count, despite a Supreme Court directive, suggests a failure of both policy and intent.</p> <p>The situation is worse for poorer households, which struggle to afford diverse, nutrient-rich diets, often relying on cheap, calorie-dense but nutrient-poor foods. The PDS primarily provides staple grains like rice and wheat, but lacks essential nutrients needed to combat malnutrition. The Covid-19 pandemic exposed the inadequacies of the food safety net, forcing the government to expand PDS benefits temporarily. If such a move was possible during a crisis, why is it not being considered now? Several states, including poorer ones like Chhattisgarh and Odisha, have extended food security benefits using their own resources. The Central Government must follow suit.</p> <p>The country’s economic growth cannot be celebrated while millions struggle for their basic right to food. The government must use available population estimates and ensure that every eligible citizen is included in the PDS immediately. Delaying action un vides staple grains like rice and wheat, but lacks essential nutrients needed to combat malnutrition. The Covid-19 pandemic exposed the inadequacies of the food safety net, forcing the government to expand PDS benefits temporarily. If such a move was possible during a crisis, why is it not being considered now? Several states, including poorer ones like Chhattisgarh and Odisha, have extended food security benefits using their own resources. The Central Government must follow suit.</p> <p>The country’s economic growth cannot be celebrated while millions struggle for their basic right to food. The government must use available population estimates and ensure that every eligible citizen is included in the PDS immediately. Delaying action until the next Census is not just bureaucratic inertia — it is a moral failure.</p> <p><strong>According to the passage, which of the following is a fact about coverage under the National Food Security Act, 2013?</strong>", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> It mandates PDS coverage for exactly 50% of rural households and 75% of urban households.", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> It mandates PDS coverage for 75% of the rural population and 50% of the urban population.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> It requires an annual review to expand coverage to 90% of the population when needed.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> It ensures the addition of new beneficiaries automatically every five years."], "correct_answer": 1, "solution": "No solution available"}, {"id": "141258", "question": "<strong>Comprehension</strong>:</p> <p>India’s Public Distribution System (PDS) is one of the largest food security programmes in the world, yet it continues to leave millions behind. The recent admission by the food ministry to a parliamentary panel that 7.9 million eligible beneficiaries remain outside the PDS due to outdated population data is deeply concerning. The government’s argument that no additional beneficiaries can be added until the next Census — delayed indefinitely since 2021 — rings hollow in the face of persistent hunger and malnutrition. Food security is a fundamental right under the National Food Security Act, 2013, which mandates coverage of 75 per cent of rural and 50 per cent of urban populations. This was calculated using the 2011 Census figures, covering 813 million people. Since then, India’s population has grown significantly. The government’s refusal to update its beneficiary count, despite a Supreme Court directive, suggests a failure of both policy and intent.</p> <p>The situation is worse for poorer households, which struggle to afford diverse, nutrient-rich diets, often relying on cheap, calorie-dense but nutrient-poor foods. The PDS primarily provides staple grains like rice and wheat, but lacks essential nutrients needed to combat malnutrition. The Covid-19 pandemic exposed the inadequacies of the food safety net, forcing the government to expand PDS benefits temporarily. If such a move was possible during a crisis, why is it not being considered now? Several states, including poorer ones like Chhattisgarh and Odisha, have extended food security benefits using their own resources. The Central Government must follow suit.</p> <p>The country’s economic growth cannot be celebrated while millions struggle for their basic right to food. The government must use available population estimates and ensure that every eligible citizen is included in the PDS immediately. Delaying action until the next Census is not just bureaucratic inertia — it is a moral failure.</p> <p><strong>Which inference can be drawn about the government’s approach to expanding PDS coverage, based on the passage?</strong>", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The government has fully complied with the Supreme Court directive to update its beneficiary count.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The government has included additional beneficiaries in response to the population increase post-2011.", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> The government is hesitant to update PDS coverage until the next Census, despite population growth.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The government has stopped the PDS program in most states due to funding issues."], "correct_answer": 2, "solution": "No solution available"}, {"id": "141299", "question": "<strong>Identify the option that arranges the given parts in the correct order to form a meaningful paragraph.</strong><br> <strong>A) </strong>Even as the school principal, management and van driver have been rightly put in the dock, the gross neglect of the state authorities accountable for regular inspection and evaluation of vehicles regarding their fitness as per the norms also needs to be brought under the lens<br> <strong>B) </strong>Sangrur district a couple of days ago must serve as a wake-up call to the state authorities to implement their safety protocols<br> <strong>C)</strong> Despite the crackdown on school vehicles in the light of tragic crashes happening with alarming regularity, it is indeed criminal that an allegedly condemned, old van was being allowed to ferry such precious cargo<br> <strong>D) </strong>The heartrending death of four children consumed by flames as their school van caught fire in", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> DBCA", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> CBDA", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> CBAD", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> ABCD"], "correct_answer": 0, "solution": "A) DBCA\n\n<strong>D:</strong> This sentence introduces the main incident - the tragic accident involving a school van. This sets up the context for the remaining sentences.\n\n<strong>B:</strong> This sentence is a follow-up to sentence D, as it gives the location of the incident (Sangrur district) and provides a time reference (\"a couple of days ago\"). It also sets the tone for the criticism of the state authorities that is to follow.<br> <strong>C:</strong> After explaining the incident and its implications for state authorities in sentences D and B, sentence C delves into the broader issue of repeated crashes and the use of unfit vehicles.<br> <strong>A:</strong> Sentence A wraps up the paragraph by returning to the issue of accountability for the tragedy, implicating both the school staff and the state authorities."}, {"id": "141300", "question": "<strong>Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the correct order to form a meaningful and coherent paragraph.</strong><br> <strong>P) </strong>As expected, the Information and Broadcasting Ministry’s telecast ban on two Malayalam news channels, including the most popular one in Kerala, for coverage of the Delhi riots has led to a furore.<br> <strong>Q) </strong>The order cited ‘inflammatory’ coverage, but media and political circles attributed it to the channels being critical of the government’s handling of events. The challenge posed to the freedom of the press remains an overarching concern.<br> <strong>R)</strong> Labelled as biased and high-handed, the punishment was ordered without establishing the offence committed by the two channels.<br> <strong>S) </strong>The order to suspend transmission may have been withdrawn much before its 48-hour-long punishment, but the Centre has a lot of answering to do for what necessitated the action.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> QSPR", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> PSRQ", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> QSRP", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> PQSR"], "correct_answer": 1, "solution": "B) PSRQ\n\n<strong>P:</strong> We start with 'P' because it introduces the topic of the telecast ban on two Malayalam news channels\n\n<strong>S:</strong> 'S' follows 'P' because it refers to the event of the order of suspension of transmission. \"The order\" refers back to the telecast ban mentioned in 'P'. It also establishes a time sequence by suggesting that the ban was withdrawn much before the designated 48 hours.\n\n<strong>R:</strong> Next, we can use 'R' which refers back to the 'punishment' mentioned in 'S', continuing the discussion about the ban. The phrase \"Labelled as biased and high-handed\" could be seen as describing the public or media perception following the suspension and subsequent withdrawal of the ban.\n\n<strong>Q:</strong> Finally, 'Q' refers to the \"order\" mentioned in 'S' and 'R', explaining why the order was considered 'inflammatory'. This sentence expands the discussion and ends the paragraph on a broad note, looking at the potential implications for freedom of the press, hence giving the paragraph a proper conclusion."}, {"id": "141301", "question": "<strong>Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the correct order to form a meaningful and coherent paragraph.</strong><br> <strong>P) </strong> We have been planning to renovate an old apartment of ours and shift there.<br> <strong>Q) </strong>We are moving house yet again.<br> <strong>R) </strong>Myriad plans and designs have been taking shape in our minds.<br> <strong>S) </strong>In the last two years this will be the fourth time and the last, hopefully.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> QSPR", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> PSRQ", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> SRPQ", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> PQSR"], "correct_answer": 0, "solution": "A) QSPR\n\n<strong>Q:</strong> This sentence sets the context. It is an opening statement that needs no prior information, and also introduces the subject - 'we' - that is moving houses.<br> <strong>S:</strong> This sentence further elaborates on the context set by 'Q'. It makes sense to follow 'Q', as it talks about the frequency of the moves in a specified timeline, \"in the last two years\", and expresses hope that it's the last time.<br> <strong>P:</strong> After setting the context of moving houses and the frequency of it, this sentence provides more detail about the move. It's the next logical step after the general context has been established.<br> <strong>R:</strong> This sentence is obviously the conclusion of the paragraph. It continues the idea presented in 'P' by further detailing the planning phase."}, {"id": "141302", "question": "<strong>Some sentences are given below. While the first and the last sentences (1 and 2) are in the correct order, the sentences in between are jumbled up. Arrange the sentences in the correct order to form a meaningful and coherent paragraph.</strong><br> <strong>1)</strong> The conflict in Ukraine and the recourse to nuclear rhetoric have revived concerns about nuclear escalation management between the major nuclear powers<br> <strong>A)</strong> Instead, North Korea, Iran and India-Pakistan got attention,<br> <strong>B)</strong> With many analysts getting nostalgic about ‘nuclear stability’ during the Cold War<br> <strong>C)</strong> Since the end of the Cold War, <br> <strong>D)</strong> the United States-Russia nuclear rivalry had taken a back seat<br> <strong>2)</strong> But, as it is becoming clear now, in today’s changed political environment the escalation management lessons of the Cold War no longer seem to work for the U.S. and Russia", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> CDAB", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> CBAD", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> ABCD", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> ACDB"], "correct_answer": 0, "solution": "A) <strong>CDAB</strong>\n\n<strong>1:</strong> Sentence 1 introduces the idea of nuclear escalation management between major powers, setting the stage for the rest of the paragraph\n\n<strong>C:</strong> Sentence C introduces the time sequence with \"Since the end of the Cold War,\" providing a chronological connection to the theme. This will logically follow sentence 1.\n\n<strong>D:</strong> Following sentence C, sentence D makes sense as it continues the theme and talks about the U.S.-Russia rivalry taking a back seat after the end of the Cold War.\n\n<strong>A:</strong> Sentence A provides a contrast by mentioning other countries and situations that got attention, instead of the U.S.-Russia rivalry. It's a logical continuation as it helps to build upon the previously mentioned decline in focus on the U.S.-Russia nuclear rivalry.\n\n<strong>B:</strong> Sentence B talks about the nostalgia for ‘nuclear stability’ during the Cold War, adding more context to the overall theme of nuclear rivalry.\n\n<strong>2:</strong> Sentence 2 concludes the paragraph by highlighting that in today's changed environment, the old lessons from the Cold War don't seem applicable."}, {"id": "141303", "question": "<strong>Identify the errors in the given sentence and choose the sentence that rectifies these errors.</strong></p> <p>Doctor she spoke to at a exhibition was very knowledgeable. The medicines prescribed by him have proved excellent for my father.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The doctor she spoke to at the exhibition was very knowledgeable. A medicines prescribed by him have proved excellent for my father.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Doctor she spoke to at the exhibition was very knowledgeable. The medicines prescribed by him have proved excellent for my father.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The doctor she spoke to at exhibition was very knowledgeable. The medicines prescribed by him have proved excellent for my father.", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> The doctor she spoke to at the exhibition was very knowledgeable. The medicines prescribed by him have proved excellent for my father."], "correct_answer": 3, "solution": "D) Doctor' के पहले <strong>'The'</strong> का use होगा क्योंकि यहां 'doctor' specific है जिसे subject पहले ही refer कर रहा है। 'a exhibition' के बदले 'the exhibition' का प्रयोग होगा क्योंकि यहां exhibition specific है। अतः sentence को grammatically सही बनाने के लिए इन सुधारों की आवश्यकता है। 'a exhibition' incorrect है क्योंकि exhibition specific context में है। 'The exhibition' का प्रयोग होगा। Articles का प्रयोग noun की specificity को व्यक्त करता है। अन्य options grammatical errors रखते हैं। Correct sentence structure के लिए यह ensure करना है कि articles और noun agreement सही हो।\n\nThe article 'The' must be used before 'Doctor' because it refers to a specific doctor already mentioned in the context. Similarly, 'a exhibition' should be replaced with 'the exhibition' because it refers to a particular exhibition. These corrections are necessary to make the sentence grammatically accurate. The noun 'Doctor' requires the definite article 'The' because it refers to a specific person mentioned in the context. Definite articles are used for specific references. 'A exhibition' is incorrect because 'exhibition' is a specific event in this context, requiring the definite article 'The.'"}, {"id": "141304", "question": "<strong>Select the most appropriate option to substitute the underlined word segment in the given sentence.</strong></p> <p>Take a lot of care in writing official letters because they leave <ins><strong>a trail behind.</strong></ins>", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> a longing desire", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> a temporary exposure", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> a lasting impression", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> a sound effect"], "correct_answer": 2, "solution": "<strong>C)</strong> 'a trail behind' के बदले<strong> 'a lasting impression' </strong>का use होगा क्योंकि यहां बात official letters के प्रभाव की हो रही है, जो स्थायी (lasting) और प्रभावशाली (impression) होता है। 'trail behind' का यहां उपयुक्त नहीं है। जैसे— Take a lot of care in writing official letters because they leave a lasting impression.\n\n'a lasting impression' will replace 'a trail behind' because the context refers to the impact of official letters, which is lasting and significant. 'Trail behind' is not suitable here. Like— Take a lot of care in writing official letters because they leave a lasting impression."}, {"id": "141305", "question": "<strong>Select the most appropriate meaning of the underlined idiom.</strong></p> <p>It was just an action <ins><strong>in the nick of time</strong> </ins>that prepared all of us for further arrangements.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Forceful labour", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Just in time", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Delayed as expected", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Unnatural happenings"], "correct_answer": 1, "solution": "B) \"<strong>In the nick of time</strong>\" (Idiom) – Just in time (बिल्कुल समय पर)"}, {"id": "141306", "question": "<strong>Select the option that expresses the given sentence in active voice.</strong></p> <p>The questions were framed by the content creators just to assess the skills of the test takers.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The content creators were framing the questions just to assess the skills of the test takers.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The content creators could frame the questions just to assess the skills of the test takers.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The content creators had framed the questions just to assess the skills of the test takers.", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> The content creators framed the questions just to assess the skills of the test takers."], "correct_answer": 3, "solution": "D) <strong>The content creators framed the questions just to assess the skills of the test takers.</strong>\n\nActive से Passive Voice में बदलने के लिए: Passive वाक्य में \"The questions\" Subject है, \"were framed\" Verb (Past Simple Passive) है, और \"by the content creators\" Agent है। Active में बदलने के लिए, Passive वाक्य का Subject \"The questions\" Object बन जाता है। Verb को Passive से Active में बदलते समय सही Tense का प्रयोग किया जाता है। Passive वाक्य का Verb \"were framed\" (Past Simple Passive) है, जो Active में \"framed\" (Past Simple Active) बन जाता है। \"The content creators\" Passive वाक्य के Agent को Active वाक्य का Subject बनाया गया है।\n\nTo change from Passive to Active Voice: In the passive sentence, \"The questions\" is the subject, \"were framed\" is the verb (Past Simple Passive), and \"by the content creators\" is the agent. In the active voice, the subject becomes the agent, and the object of the passive sentence (\"The questions\") becomes the object of the active sentence. The verb \"were framed\" (Past Simple Passive) is transformed into \"framed\" (Past Simple Active). Hence, \"The content creators\" is the subject in the active voice, and the sentence becomes:"}, {"id": "141307", "question": "<strong>The following sentence has been split into four segments. Identify the segment that contains a grammatical error.</strong></p> <p>Though the / global financial crisis, / China's economy continues / to grow at an impressive rate.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Though the", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> global financial crisis,", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> china's economy continues", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> to grow at an impressive rate."], "correct_answer": 0, "solution": "A) ‘Though the' के बदले <strong>'Despite the'</strong> का use होगा क्योंकि ‘though’ का प्रयोग मुख्यतः एक Clause को जोड़ने के लिए होता है, जबकि यहां ‘global financial crisis’ एक Phrase है। सही answer होगा— Despite the global financial crisis, China’s economy continues to grow at an impressive rate। जैसे— Despite the heavy rain, the match continued.\n\n'Though the' will be replaced by 'Despite the' because 'though' is mainly used to connect clauses, whereas 'global financial crisis' is a phrase here. Hence, the correct answer is— Despite the global financial crisis, China’s economy continues to grow at an impressive rate. For example— Despite the heavy rain, the match continued."}, {"id": "141308", "question": "<strong>Select the most appropriate ANTONYM of the underlined word in the given sentence.</strong></p> <p>She looked tired and <ins><strong>sallow</strong> </ins>after the long day she’d had.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Paled", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Flushed", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Pallid", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Livid"], "correct_answer": 1, "solution": "B) <strong>Sallow</strong> (adjective) – Having an unhealthy yellow or pale color, particularly of the skin. पीला, फीका रोगी जैसा\n\n<strong>Antonym</strong>: <strong>Flushed</strong> (adjective) – Having a healthy red color or glow, especially due to physical activity or excitement. लाल, स्वस्थ रंग\n\n<strong>Paled</strong> (adjective) – To become or appear less bright or less intense in color. फीका, उज्जवलता खोना\n\n<strong>Pallid</strong> (adjective) – Pale, typically due to poor health or lack of vitality. म्लान, फीका\n\n<strong>Livid</strong> (adjective) – A bluish or dark discoloration of the skin, often due to bruising or extreme emotion like anger. गहरा नीला, क्रोध से भरा"}, {"id": "141309", "question": "<strong>Select the option that expresses the given sentence in direct speech.</strong></p> <p>She told her friend that she had been studying for her examination.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> She told her friend, “I am studying for my examination.”", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> She told her friend, “I had studied for my examination.”", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> She tells her friend, “I have been studying for my examination.”", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> She told her friend, “I was studying for my examination.”"], "correct_answer": 3, "solution": "D) <strong>She told her friend, “I was studying for my examination.”</strong>\n\nIndirect से Direct Speech में बदलते समय Tense और Pronouns का सही रूप में प्रयोग किया जाता है। दिए गए Indirect वाक्य में \"She told her friend\" Reporting Verb है, जो Past Tense में है। इसलिए Reported Speech का Tense भी Past Form में रहेगा। Reported Speech में \"she had been studying\" (Past Perfect Continuous) को Direct Speech में बदलते समय \"was studying\" (Past Continuous) में बदला जाएगा, क्योंकि Past Perfect Continuous Tense को Direct Speech में Past Continuous Tense में बदला जाता है। सही वाक्य है: \"She told her friend, ‘I was studying for my examination.’\"\n\nWhen converting from Indirect to Direct Speech, the tense and pronouns must be appropriately transformed. In the given Indirect sentence, \"She told her friend\" is the reporting verb in the past tense, so the tense of the reported speech must also remain in a past form. The phrase \"she had been studying\" (Past Perfect Continuous) in the Indirect Speech is converted to \"was studying\" (Past Continuous) in the Direct Speech. This is because Past Perfect Continuous Tense in Indirect Speech becomes Past Continuous Tense in Direct Speech.\n\nThe correct sentence is: \"She told her friend, ‘I was studying for my examination.’\""}, {"id": "141310", "question": "<strong>Select the most appropriate ANTONYM to replace the italicised word in the given sentence.</strong></p> <p>I am astonished to see her <strong><em>mercurial </em></strong>demeanour in making any task a success.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> fluctuant", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> erratic", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> invariable", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> capricious"], "correct_answer": 2, "solution": "C) <strong>Mercurial</strong> (adjective) – Subject to sudden or unpredictable changes of mood or mind; capricious, erratic, fickle. परिवर्तनशील, अस्थिर, चंचल।\n\n<strong>Antonym</strong>: <strong>Invariable</strong> (adjective) – Unchanging, consistent, fixed. अपरिवर्तनीय, स्थिर।\n\n<strong>Fluctuant</strong> (adjective) – Changing irregularly, unstable.अस्थिर, परिवर्तनशील।\n\n<strong>Erratic</strong> (adjective) – Unpredictable, inconsistent, wandering. अनियमित, अस्थिर।\n\n<strong>Capricious</strong> (adjective) – Given to sudden and unaccountable changes of mood or behavior; mercurial. मनमौजी, चंचल।"}, {"id": "141311", "question": "<strong>The following sentence has been split into four segments. Identify the segment that contains a grammatical error.</strong></p> <p>So Mahesh is much sensitive, / we are very careful / when communicating with him /about his failures.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> when communicating with him", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> So Mahesh is much sensitive,", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> about his failures", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> we are very careful"], "correct_answer": 1, "solution": "B) ‘So Mahesh is much sensitive,’ के स्थान पर ‘So Mahesh is very sensitive,’ होगा 'sensitive' एक gradable adjective है और gradable adjectives को modify करने के लिए 'very' का प्रयोग किया जाता है, जबकि 'much' का उपयोग आमतौर पर comparatives या ungradable adjectives के साथ किया जाता है। उदाहरण: Mahesh is very sensitive\n\nError in part B: So Mahesh is much sensitive, because the use of 'much sensitive' is incorrect. The correct expression should be 'very sensitive'. The adjective 'sensitive' is a gradable adjective, and 'very' is used to modify gradable adjectives, while 'much' is generally used with comparatives or ungradable adjectives. For example: Mahesh is very sensitive"}, {"id": "141312", "question": "<strong>The following sentence has been divided into parts. One of them may contain an error Select the part that contains the error from the given options. If you don’t find anyerror, mark ‘No error’ as your answer.</strong></p> <p>Raghu did not get the job / because he did not have / experience enough for the post.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> because he did not have", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> No error", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Raghu did not get the job", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> experience enough for the post"], "correct_answer": 3, "solution": "D) ‘experience enough’ के बदले <strong>‘enough experience’</strong> का use होगा क्योंकि English में 'enough' हमेशा Adjective के पहले आता है। अत: सही होगा: Raghu did not get the job because he did not have enough experience for the post. जैसे—He does not have enough money to buy a car.\n\n‘experience enough’ should be replaced with ‘enough experience’ because in English, ‘enough’ always precedes an adjective or noun it qualifies. Therefore, the correct sentence will be: Raghu did not get the job because he did not have enough experience for the post.\n\nExample: He does not have enough money to buy a car."}, {"id": "141313", "question": "<strong>The following sentence has been split into four segments. Identify the segment that contains an error.</strong></p> <p>A Himalayas stretch across / the north-east part / of India and pass / through manycountries.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> the north-east part", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> A Himalayas stretch across", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> of India and pass", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> through many countries"], "correct_answer": 1, "solution": "<strong>B) 'A Himalayas stretch across'</strong> में 'A' का use गलत है क्योंकि 'Himalayas' एक Proper Noun है और इसके साथ Definite Article Himalayas' एक विशिष्ट पर्वत श्रेणी का नाम है, और Proper Noun के पहले हमेशा Definite Article 'The' का प्रयोग किया जाता है। अत: 'A Himalayas stretch across' के बदले 'The Himalayas stretch across' होना चाहिए\n\n'Himalayas' is a Proper Noun referring to a specific mountain range, and Proper Nouns are always preceded by the Definite Article 'The.' Hence, 'A Himalayas stretch across' should be replaced with 'The Himalayas stretch across.'\n\nThe Himalayas stretch across the north-east part of India and pass through many countries."}, {"id": "141314", "question": "<strong>Comprehension:</strong></p> <p><strong>In the following passage, some words have been deleted. Read the passage carefully andselect the most appropriate option to fill in each blank.</strong></p> <p>A savanna is a kind of rolling grassland dotted with isolated trees and shrubs. The grasslands of Australia are known as the bush. The grassland plains of North America are referred to asthe prairie. A v
