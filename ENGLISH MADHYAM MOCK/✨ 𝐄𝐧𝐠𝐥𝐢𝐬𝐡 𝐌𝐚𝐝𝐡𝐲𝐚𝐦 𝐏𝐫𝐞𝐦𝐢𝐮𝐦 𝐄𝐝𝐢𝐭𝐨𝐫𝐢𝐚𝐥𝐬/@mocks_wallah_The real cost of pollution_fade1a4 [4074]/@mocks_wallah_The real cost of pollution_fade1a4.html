<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6366f1">
    <title>devgagan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #06b6d4;
            
            --glass-bg: rgba(255, 255, 255, 0.95);  /* Changed from 0.25 to 0.95 */
            --glass-border: rgba(255, 255, 255, 0.8);  /* Changed from 0.18 to 0.8 */
            --shadow-light: 0 8px 32px rgba(31, 38, 135, 0.37);
            --shadow-heavy: 0 20px 60px rgba(0, 0, 0, 0.3);
            
            --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --bounce: cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        
[data-theme="light"] {
    --bg: #ffffff;  /* Changed from gradient to solid white */
    --card-bg: #ffffff;  /* Changed from transparent to solid white */
    --text: #1a202c;
    --text-secondary: #4a5568;
    --border: rgba(0, 0, 0, 0.1);  /* Changed to darker border for contrast */
    --nav-bg: #ffffff;  /* Changed from transparent to solid white */
}

[data-theme="dark"] {
    --bg: #1a1a2e;  /* Changed from gradient to solid dark */
    --card-bg: #16213e;  /* Changed from transparent to solid dark */
    --text: #f7fafc;
    --text-secondary: #a0aec0;
    --border: rgba(255, 255, 255, 0.1);
    --nav-bg: #0c0c0c;  /* Changed from transparent to solid dark */
}
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--bg);  /* Now just using the solid color */
    z-index: -1;
}
        
        /* Floating particles animation */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: float 6s infinite ease-in-out;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.7; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 0.3; }
        }
        
        /* Header with glassmorphism */
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 16px 20px;
            z-index: 100;
            transition: var(--transition);
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .menu-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            font-size: 18px;
        }
        
        .menu-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-light);
        }
        
        .menu-btn:active {
            transform: scale(0.95);
        }
        
        .logo {
            font-weight: 800;
            font-size: 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        
        [data-theme="dark"] .logo {
    background: none;
    -webkit-text-fill-color: white; /* White text in dark mode */
    color: white; /* Fallback */
}
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            font-size: 20px;
        }
        
        .theme-toggle:hover {
            transform: rotate(180deg) scale(1.1);
            box-shadow: var(--shadow-light);
        }
        
        /* Advanced Timer */
        .timer-container {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .timer {
            background: linear-gradient(135deg, var(--error), #dc2626);
            color: white;
            padding: 12px 16px;
            border-radius: 16px;
            font-family: 'Inter', monospace;
            font-weight: 600;
            font-size: 14px;
            box-shadow: var(--shadow-light);
            position: relative;
            overflow: hidden;
        }
        
        .timer.warning {
            animation: pulse 1s infinite;
        }
        
        .timer.critical {
            animation: shake 0.5s infinite;
            background: linear-gradient(135deg, #dc2626, #991b1b);
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
        }
        
        .progress-ring {
            width: 40px;
            height: 40px;
            transform: rotate(-90deg);
        }
        
        .progress-circle {
            fill: none;
            stroke: rgba(255, 255, 255, 0.3);
            stroke-width: 3;
        }
        
        .progress-circle.progress {
            stroke: var(--primary);
            stroke-linecap: round;
            transition: stroke-dashoffset 0.3s ease;
        }
        
        /* Main Content */
        .main {
            margin: 80px 0 100px;
            padding: 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .question-container {
    background: var(--card-bg);  /* Now uses solid color */
    /* Remove or reduce blur effect */
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 32px;
    box-shadow: var(--shadow-heavy);
    position: relative;
    overflow: hidden;
    transition: var(--transition);
}
        .question-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--info));
            background-size: 200% 100%;
            animation: gradient-flow 3s linear infinite;
        }
        
        @keyframes gradient-flow {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .question-number {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 12px 20px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: var(--shadow-light);
            position: relative;
        }
        
        .question-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }
        
        .question-progress {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
        }
        
        .question-marks {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 600;
        }
        
        .question-text {
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 32px;
            color: var(--text);
            font-weight: 500;
        }
        
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .option {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 20px 24px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            font-size: 16px;
            font-weight: 500;
            color: var(--text);
            overflow: hidden;
        }
        
        .option::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s;
        }
        
        .option:hover::before {
            left: 100%;
        }
        
        .option:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: var(--shadow-light);
        }
        
        .option:active {
            transform: scale(0.98);
        }

        .menu-btn, .theme-toggle, .nav-btn.prev, .action-btn.flag {
    background: var(--card-bg);  /* Solid background */
    backdrop-filter: none;  /* Remove blur */
}

.sidebar {
    background: var(--card-bg);  /* Solid background */
    backdrop-filter: none;  /* Remove blur */
}
        
        .option.selected {
            background: rgba(99, 102, 241, 0.15);
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-light);
        }
        
        .option.correct {
            background: rgba(16, 185, 129, 0.15);
            border-color: var(--success);
            color: var(--success);
        }
        
        .option.incorrect {
            background: rgba(239, 68, 68, 0.15);
            border-color: var(--error);
            color: var(--error);
        }
        
        .option.disabled {
            background: rgba(160, 174, 192, 0.1);
            border-color: var(--text-secondary);
            color: var(--text-secondary);
            cursor: not-allowed;
        }
        
        .option-indicator {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }
        
        .option.selected .option-indicator {
            background: var(--primary);
            color: white;
        }
        
        .option.correct .option-indicator {
            background: var(--success);
            color: white;
        }
        
        .option.incorrect .option-indicator {
            background: var(--error);
            color: white;
        }
        
        .option:not(.selected):not(.correct):not(.incorrect) .option-indicator {
            border: 2px solid var(--border);
        }
        
        /* Solution Panel */
        .solution-panel {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(245, 158, 11, 0.05));
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 20px;
            padding: 24px;
            margin-top: 24px;
            backdrop-filter: blur(10px);
            transform: translateY(20px);
            opacity: 0;
            transition: var(--transition);
        }
        
        .solution-panel.show {
            transform: translateY(0);
            opacity: 1;
        }
        
        .solution-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            color: var(--warning);
            font-weight: 700;
        }
        
        .solution-content {
            color: var(--text);
            line-height: 1.6;
            font-size: 15px;
        }
        
        /* Navigation */
        .navigation {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            padding: 16px 20px;
            z-index: 90;
        }
        
        .nav-content {
            display: flex;
            gap: 12px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .nav-btn {
            flex: 1;
            padding: 16px 24px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        
        .nav-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.6s;
        }
        
        .nav-btn:hover::before {
            left: 100%;
        }
        
        .nav-btn:active {
            transform: scale(0.95);
        }
        
        .nav-btn.prev {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            backdrop-filter: blur(10px);
        }
        
        .nav-btn.next {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: var(--shadow-light);
        }
        
        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .nav-btn:disabled::before {
            display: none;
        }
        
        /* Question Panel Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid var(--border);
            z-index: 200;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-heavy);
        }
        
        .sidebar.open {
            right: 0;
        }
        
        .sidebar-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .sidebar-title {
            font-weight: 800;
            font-size: 20px;
        }
        
        .close-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        
        .close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(90deg);
        }
        
        .sidebar-body {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }
        
        .questions-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 32px;
        }
        
        .question-btn {
            background: var(--card-bg);
            border: 2px solid var(--border);
            color: var(--text-secondary);
            width: 48px;
            height: 48px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            position: relative;
        }
        
        .question-btn:hover {
            transform: scale(1.1);
            box-shadow: var(--shadow-light);
        }
        
        .question-btn:active {
            transform: scale(0.95);
        }
        
        .question-btn.current {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: var(--shadow-light);
        }
        
        .question-btn.answered {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border-color: var(--success);
        }
        
        .question-btn.correct {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }
        
        .question-btn.incorrect {
            background: var(--error);
            color: white;
            border-color: var(--error);
        }
        
        .question-btn.flagged::after {
            content: '🚩';
            position: absolute;
            top: -4px;
            right: -4px;
            font-size: 10px;
        }
        
        /* Legend */
        .legend {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 32px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .legend-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        
        .legend-dot.current { background: var(--primary); }
        .legend-dot.answered { background: var(--success); }
        .legend-dot.unattempted { background: var(--text-secondary); }
        .legend-dot.flagged { background: var(--warning); }
        
        /* Action Buttons */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .action-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }
        
        .action-btn.flag {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        
        .action-btn.submit {
            background: linear-gradient(135deg, var(--error), #dc2626);
            color: white;
            box-shadow: var(--shadow-light);
        }
        
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-heavy);
        }
        
        .action-btn:active {
            transform: scale(0.98);
        }
        
        /* Overlay */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 150;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }
        
        .overlay.show {
            opacity: 1;
            visibility: visible;
        }
        
        /* Result Modal */
        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 32px;
            max-width: 90vw;
            width: 480px;
            z-index: 300;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
            box-shadow: var(--shadow-heavy);
            overflow: hidden;
        }
        
        .modal.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }
        
        .modal-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 40px 32px;
            text-align: center;
        }
        
        .modal-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        
        .modal-subtitle {
            opacity: 0.9;
            font-size: 16px;
            font-weight: 500;
        }
        
        .modal-body {
            padding: 32px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            text-align: center;
            padding: 20px 16px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }
        
        .stat-label {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        
        .stat-value {
            color: var(--text);
            font-size: 24px;
            font-weight: 800;
        }
        
        .final-score {
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
            border-radius: 20px;
            padding: 32px;
            text-align: center;
            margin-bottom: 24px;
            box-shadow: var(--shadow-light);
        }
        
        .score-text {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        
        .percentage-text {
            opacity: 0.9;
            font-size: 18px;
            font-weight: 600;
        }
        
        .modal-actions {
            display: flex;
            gap: 12px;
        }
        
        .modal-btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }
        
        .modal-btn.primary {
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary);
            border: 1px solid rgba(99, 102, 241, 0.3);
        }
        
        .modal-btn.success {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        
        .modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-light);
        }
        
        /* Auto-save indicator */
        .auto-save {
            position: fixed;
            top: 80px;
            right: 20px;
            background: var(--success);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            transform: translateX(100px);
            opacity: 0;
            transition: var(--transition);
            z-index: 90;
        }
        
        .auto-save.show {
            transform: translateX(0);
            opacity: 1;
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .header-content {
                padding: 0 4px;

<body data-theme="light">

    <div class="auto-save" id="autoSave">

    </main>
    
    <!-- Navigation -->

                Next →
            </button>
        </div>
    </nav>
    
    <!-- Sidebar -->

        </div>

    <!-- Overlay -->

    <script>
        // Core Variables
        const questions = [{"id": "161238", "question": "<strong>Comprehension</strong>:<br> Earlier this month, the Supreme Court reaffirmed the polluter pays principle, restoring to central and state pollution control boards the authority to levy compensatory and restitutive charges on entities responsible for environmental damage. In doing so, it overturned a 2012 Delhi High Court ruling that had curtailed these powers.<br> Crucially, the ruling draws a clear line between fines for violating norms and the damages polluters must pay - both for restoring the environment and compensating those who have suffered losses.</p> <p>Sections 33A and 31A of the water and air Acts provide regulators with legal space to impose such levies. Yet, for years, lack of clarity and conflicting judgments hamstrung them, leaving the question of who pays, and how much, to be settled by courts on a case-by-case basis.</p> <p>The recent apex court ruling also empowers regulators to demand bank guarantees from entities against potential environmental damage, signalling that the cost of harming the environment has gone up.</p> <p>The next challenge is to ensure penalties are imposed in a fair, transparent and non-arbitrary manner, backed by procedural certainty and free of bureaucratic delays. For this to succeed, regulators must build both institutional and technical capacity while also strengthening enforcement on the ground and coordinating across jurisdictions.</p> <p>Additionally, GoI must notify rules and regulations, outline robust methods to assess environmental damage and establish a transparent system for determining the quantum of compensation. Only then can the principle that polluters must pay move beyond lofty judicial reaffirmation to effective implementation, ensuring accountability, deterrence and genuine environmental restoration for the long term.</p> <p>Which of the following is the <strong>best</strong> inference about <em>why</em> the Supreme Court explicitly separated “fines for violating norms” from “damages to restore and compensate”?", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> To decouple punishment from restoration so that regulators can both deter misconduct and fund remediation/compensation effectively", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> To increase non-tax revenue for governments through higher collections", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> To reduce bureaucratic delays by eliminating judicial oversight entirely", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> To centralise all environmental decision-making under the Union government"], "correct_answer": 0, "solution": "No solution available"}, {"id": "161239", "question": "<strong>Comprehension</strong>:<br> Earlier this month, the Supreme Court reaffirmed the polluter pays principle, restoring to central and state pollution control boards the authority to levy compensatory and restitutive charges on entities responsible for environmental damage. In doing so, it overturned a 2012 Delhi High Court ruling that had curtailed these powers.<br> Crucially, the ruling draws a clear line between fines for violating norms and the damages polluters must pay - both for restoring the environment and compensating those who have suffered losses.</p> <p>Sections 33A and 31A of the water and air Acts provide regulators with legal space to impose such levies. Yet, for years, lack of clarity and conflicting judgments hamstrung them, leaving the question of who pays, and how much, to be settled by courts on a case-by-case basis.</p> <p>The recent apex court ruling also empowers regulators to demand bank guarantees from entities against potential environmental damage, signalling that the cost of harming the environment has gone up.</p> <p>The next challenge is to ensure penalties are imposed in a fair, transparent and non-arbitrary manner, backed by procedural certainty and free of bureaucratic delays. For this to succeed, regulators must build both institutional and technical capacity while also strengthening enforcement on the ground and coordinating across jurisdictions.</p> <p>Additionally, GoI must notify rules and regulations, outline robust methods to assess environmental damage and establish a transparent system for determining the quantum of compensation. Only then can the principle that polluters must pay move beyond lofty judicial reaffirmation to effective implementation, ensuring accountability, deterrence and genuine environmental restoration for the long term.</p> <p><strong>Fill the blank to maintain correct parallel structure with “must build … capacity” in the sentence:</strong></p> <p>“For this to succeed, regulators must build both institutional and technical capacity while also ______ enforcement on the ground and coordinating across jurisdictions.”", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> strengthen", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> strengthening", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> to strengthen", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> having strengthened"], "correct_answer": 1, "solution": "No solution available"}, {"id": "161240", "question": "<strong>Comprehension</strong>:<br> Earlier this month, the Supreme Court reaffirmed the polluter pays principle, restoring to central and state pollution control boards the authority to levy compensatory and restitutive charges on entities responsible for environmental damage. In doing so, it overturned a 2012 Delhi High Court ruling that had curtailed these powers.<br> Crucially, the ruling draws a clear line between fines for violating norms and the damages polluters must pay - both for restoring the environment and compensating those who have suffered losses.</p> <p>Sections 33A and 31A of the water and air Acts provide regulators with legal space to impose such levies. Yet, for years, lack of clarity and conflicting judgments hamstrung them, leaving the question of who pays, and how much, to be settled by courts on a case-by-case basis.</p> <p>The recent apex court ruling also empowers regulators to demand bank guarantees from entities against potential environmental damage, signalling that the cost of harming the environment has gone up.</p> <p>The next challenge is to ensure penalties are imposed in a fair, transparent and non-arbitrary manner, backed by procedural certainty and free of bureaucratic delays. For this to succeed, regulators must build both institutional and technical capacity while also strengthening enforcement on the ground and coordinating across jurisdictions.</p> <p>Additionally, GoI must notify rules and regulations, outline robust methods to assess environmental damage and establish a transparent system for determining the quantum of compensation. Only then can the principle that polluters must pay move beyond lofty judicial reaffirmation to effective implementation, ensuring accountability, deterrence and genuine environmental restoration for the long term.</p> <p><strong>According to the passage, which statutory provisions empower regulators to impose such levies?</strong>", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Section 33A of the Water (Prevention and Control of Pollution) Act and Section 31A of the Air (Prevention and Control of Pollution) Act", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Section 31 of the Air Act and Section 33 of the Water Act", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Section 5 of the Environment (Protection) Act and Section 21 of the Air Act", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Section 33B of the Water Act and Section 31B of the Air Act"], "correct_answer": 0, "solution": "No solution available"}, {"id": "161241", "question": "<strong>Comprehension</strong>:<br> Earlier this month, the Supreme Court reaffirmed the polluter pays principle, restoring to central and state pollution control boards the authority to levy compensatory and restitutive charges on entities responsible for environmental damage. In doing so, it overturned a 2012 Delhi High Court ruling that had curtailed these powers.<br> Crucially, the ruling draws a clear line between fines for violating norms and the damages polluters must pay - both for restoring the environment and compensating those who have suffered losses.</p> <p>Sections 33A and 31A of the water and air Acts provide regulators with legal space to impose such levies. Yet, for years, lack of clarity and conflicting judgments hamstrung them, leaving the question of who pays, and how much, to be settled by courts on a case-by-case basis.</p> <p>The recent apex court ruling also empowers regulators to demand bank guarantees from entities against potential environmental damage, signalling that the cost of harming the environment has gone up.</p> <p>The next challenge is to ensure penalties are imposed in a fair, transparent and non-arbitrary manner, backed by procedural certainty and free of bureaucratic delays. For this to succeed, regulators must build both institutional and technical capacity while also strengthening enforcement on the ground and coordinating across jurisdictions.</p> <p>Additionally, GoI must notify rules and regulations, outline robust methods to assess environmental damage and establish a transparent system for determining the quantum of compensation. Only then can the principle that polluters must pay move beyond lofty judicial reaffirmation to effective implementation, ensuring accountability, deterrence and genuine environmental restoration for the long term.</p> <p><strong>Which option best captures both (i) the specific regulatory power that the Supreme Court ruling restores to pollution control boards and (ii) the conceptual d istinction the ruling draws regarding monetary liabilities for environmental harm?</strong>", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> It reaffirms the boards’ authority to levy compensatory and restitutive charges under Sections 33A (Water Act) and 31A (Air Act), and distinguishes fines for mere norm violations from damages payable both for environmental restoration and for compensating affected persons.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> It reaffirms only the power to impose criminal penalties under general penal statutes, and treats fines and damages as a single category of deterrent payments without doctrinal separation.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> It creates a new power to increase routine license fees and inspection charges, while holding that only Parliament—not courts—may distinguish penalties from damages.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> It centralizes decision-making in the Union government by withdrawing state boards’ powers, and requires damages to be recovered only after criminal guilt is proven beyond reasonable doubt."], "correct_answer": 0, "solution": "No solution available"}, {"id": "161242", "question": "<strong>Comprehension</strong>:<br> Earlier this month, the Supreme Court reaffirmed the polluter pays principle, restoring to central and state pollution control boards the authority to levy compensatory and restitutive charges on entities responsible for environmental damage. In doing so, it overturned a 2012 Delhi High Court ruling that had curtailed these powers.<br> Crucially, the ruling draws a clear line between fines for violating norms and the damages polluters must pay - both for restoring the environment and compensating those who have suffered losses.</p> <p>Sections 33A and 31A of the water and air Acts provide regulators with legal space to impose such levies. Yet, for years, lack of clarity and conflicting judgments hamstrung them, leaving the question of who pays, and how much, to be settled by courts on a case-by-case basis.</p> <p>The recent apex court ruling also empowers regulators to demand bank guarantees from entities against potential environmental damage, signalling that the cost of harming the environment has gone up.</p> <p>The next challenge is to ensure penalties are imposed in a fair, transparent and non-arbitrary manner, backed by procedural certainty and free of bureaucratic delays. For this to succeed, regulators must build both institutional and technical capacity while also strengthening enforcement on the ground and coordinating across jurisdictions.</p> <p>Additionally, GoI must notify rules and regulations, outline robust methods to assess environmental damage and establish a transparent system for determining the quantum of compensation. Only then can the principle that polluters must pay move beyond lofty judicial reaffirmation to effective implementation, ensuring accountability, deterrence and genuine environmental restoration for the long term.</p> <p><strong>Directions: Read the statement and choose the best option.</strong></p> <p><strong>Statement:</strong> The apex court’s decision primarily emphasizes punitive fines and explicitly rejects the use of bank guarantees as preventive instruments against potential environmental damage.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> True — because the ruling narrows regulators to ex post fines and forbids any ex ante financial assurance like bank guarantees.", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> False — because the ruling not only reinstates compensatory/restitutive levies but also empowers regulators to demand bank guarantees against prospective harm, expanding—not shrinking—the toolkit.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> True — because bank guarantees are mentioned, if at all, merely as non-binding dicta that regulators cannot rely upon.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Cannot be determined — because the passage is silent on preventive financial instruments such as bank guarantees."], "correct_answer": 1, "solution": "No solution available"}, {"id": "161251", "question": "<strong>Select the most appropriate meaning of the given idiom</strong>.</p> <p>Straight and narrow", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Be excessively careful", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Honest and morally acceptable way of being", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Follow the straight path defined by society", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> To not deviate from one's goal"], "correct_answer": 1, "solution": "<strong>B) Straight and narrow</strong> (idiom) – Honest, morally upright conduct ईमानदार और नैतिक आचरण"}, {"id": "161268", "question": "<strong>Improve the underlined/bold part of the sentence. Choose ‘No improvement’ as an answer if the sentence is grammatically correct.</strong></p> <p>You must <strong>wait unless the manager arrives</strong> before making any announcements regarding the merger.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> wait unless the manager will arrive", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> wait until the manager arrives", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> wait until the manager will arrive", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> No improvement"], "correct_answer": 1, "solution": "B) ‘unless’ के बदले ‘until’ का प्रयोग होगा क्योंकि यहाँ समय (up to a point in time) की बात है।\n\nuntil = up to the time → Wait until he arrives.\n\nunless = if not → I won’t go unless you come.\n\n• ‘wait until the manager arrives’ will be used instead of ‘unless the manager arrives’ because the meaning is “wait up to the time the manager comes,” not “if the manager doesn’t come.”"}, {"id": "161257", "question": "<strong>Select the most appropriate ANTONYM of the given word</strong>.</p> <p>VAGUE", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Nebulous", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Explicit", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Evasive", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Tenuous"], "correct_answer": 1, "solution": "B) <strong>Vague</strong> (adjective) – Not clearly expressed; indistinct, nebulous, indefinite. अस्पष्ट/अनिश्चित\n\n<strong>Antonym</strong>: <strong>Explicit</strong> (noun/verb) – Fully and clearly expressed; definite, unequivocal. स्पष्ट/प्रत्यक्ष\n\n<strong>Nebulous</strong> – Hazy; indistinct. धुंधला/अस्पष्ट\n\n<strong>Evasive</strong> – Tending to avoid commitment or clarity; equivocal. टालमटोल/कतराने वाला\n\n<strong>Tenuous</strong> – Very weak or insubstantial. अत्यंत क्षीण/कमज़ोर"}, {"id": "161252", "question": "<strong>Select the most appropriate meaning of the given idiom</strong>.</p> <p>Someone's ears are burning", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> The feeling when someone thinks others are talking about them", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Being excessively jealous of others", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Being angry due to unfair criticism", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Itching to enter into an argument"], "correct_answer": 0, "solution": "<strong>A) Someone's ears are burning </strong>(idiom) – Feeling that others are talking about you ऐसा लगना कि लोग आपके बारे में बात कर रहे हैं"}, {"id": "161262", "question": "<strong>The following sentence has been split into four segments. Identify the segment that contains a grammatical error.</strong></p> <p>The police was investigating the matter / when fresh evidence came to light / that suggested a wider conspiracy / involving several local officials.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> The police was investigating the matter", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> when fresh evidence came to light", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> that suggested a wider conspiracy", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> involving several local officials"], "correct_answer": 0, "solution": "A) ‘police was’ के बदले ‘police were’ होना चाहिए क्योंकि police हमेशा plural मानी जाती है।\n\nRule: Police/people/cattle → plural verb; Family/Team → can be singular (as a unit) or plural (as individuals).\n\n✔ The police were present at the rally.\n\nCorrect sentence:\n\nThe police were investigating the matter…"}, {"id": "161255", "question": "<strong>Select the most appropriate synonym of the given word</strong>.</p> <p>VERACITY", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Mendacity", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Rapacity", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Verity", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Voracity"], "correct_answer": 2, "solution": "C) <strong>Veracity</strong> (noun) – Truthfulness; accuracy; adherence to fact. सत्यता/सच्चाई; शुद्धता।\n\n<strong>Synonym</strong>: <strong>Verity</strong> (noun) – Truth; a true statement or principle. सत्य/सत् तथ्य।\n\n<strong>Mendacity</strong> (noun) – Lying; deceit. झूठ/कपट।\n\n<strong>Rapacity</strong> (noun) – Greed; predatory extortion. लोलुपता/लूटखसोट।\n\n<strong>Voracity</strong> (noun) – Great eagerness or appetite; gluttony. पेटूपन/अत्यधिक भूख।"}, {"id": "161253", "question": "<strong>In the following Question, two lists are given with the keywords mentioned. You are required to match List-I with List-II and Select the option that can be used as a correct one-word substitute for the word given in List I.</strong></p> <p><strong>List</strong>-I</p> <p>A) Wrangle<br> B) Wacky<br> C) Codex<br> D) Postscript<br> </p> <p><strong>List-II (Meaning)</strong></p> <p>1. Additional piece of information added to the main text<br> 2. Amusing and strange<br> 3. Complicated and prolonged argument<br> 4. Ancient manuscript/text", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> A-3, B-2, C-4, D-1", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> A-1, B-3, C-4, D-2", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> A-3, B-4, C-2, D-1", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> A-4, B-2, C-1, D-3"], "correct_answer": 0, "solution": "A) A–3, B–2, C–4, D–1\n\n<strong>Wrangle</strong> → Complicated, prolonged argument. लंबा/उलझा हुआ विवाद।\n\n<strong>Wacky</strong> → Amusing and strange. अटपटा पर मज़ेदार।\n\n<strong>Codex</strong> → Ancient manuscript/text. प्राचीन पाण्डुलिपि/ग्रंथ।\n\n<strong>Postscript</strong> → Additional info added to the main text (P.S.). परिशिष्ट/अंत टिप्पणी।"}, {"id": "161269", "question": "<strong>Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the correct order to form a meaningful and coherent paragraph.</strong></p> <p>a. This results in 32% of global food production being discarded.</p> <p>b. In a world where more than 700 million people suffer from hunger, this scale of waste is unacceptable.</p> <p>c. Food loss and waste represent one of the most pressing challenges to sustainable global food systems.</p> <p>d. According to the estimates of the Food and Agriculture Organization of the United Nations (FAO) and United Nations Environment Programme (UNEP), 13% of food produced globally is lost before it reaches the retail stage, while an additional 19% is wasted at the retail, food service, and household levels.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> d, b, a, c", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> c, a, b, d", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> a, b, c, d", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> c, d, a, b"], "correct_answer": 3, "solution": "D) c, d, a, b\n\nc: Paragraph की शुरुआत sentence c से होती है, क्योंकि यह विषय को प्रस्तुत करता है और बताता है कि food loss और waste वैश्विक खाद्य प्रणालियों (global food systems) के लिए एक महत्वपूर्ण चुनौती है। यह पूरी discussion के लिए context सेट करता है।\n\nd: इसके बाद sentence d आता है, जो FAO और UNEP के estimates को प्रस्तुत करता है, जिसमें यह बताया गया है कि वैश्विक स्तर पर 13% भोजन उस stage तक पहुँचने से पहले ही खो जाता है, जबकि 19% भोजन retail, food service, और household levels पर बर्बाद हो जाता है। इस sentence में detailed information दी गई है, जो c में दिए गए issue को support करती है।\n\na: Sentence a इसके बाद आता है, जो d में बताए गए आंकड़ों (figures) को summarise करते हुए बताता है कि इस food loss और waste का परिणाम यह होता है कि 32% वैश्विक भोजन उत्पादन (global food production) discard कर दिया जाता है। यह d के figures को जोड़कर एक निष्कर्ष की ओर ले जाता है।\n\nb: अंत में, sentence b paragraph को conclude करते हुए, इस waste के नैतिक और व्यावहारिक प्रभावों (moral and practical implications) को बताता है, खासकर उस दुनिया में जहाँ 700 million से अधिक लोग भूख (hunger) से पीड़ित हैं। यह statement पूरे paragraph में प्रस्तुत statistics के संदर्भ में एक मजबूत निष्कर्ष (strong conclusion) देता है, जिससे issue की गंभीरता का पता चलता है।<br> <strong>Explanation in English</strong><br> c: The paragraph begins with c, which introduces the topic by highlighting that food loss and waste are significant challenges to sustainable global food systems, setting the context for the discussion. The sentence starts with a general noun phrase, \"Food loss and waste,\" followed by the verb \"represent,\" which introduces the topic clearly\n\nd: d follows c as it provides data and estimates from the FAO and UNEP, quantifying the extent of food loss (13%) and waste (19%) at different stages. This detailed information supports the issue presented in c.\n\na: a comes next, building on d by summarizing the total impact—stating that 32% of global food production is discarded as a result of the losses and waste described earlier.\n\nb: b concludes the paragraph by emphasizing the moral and practical implications of food waste, particularly in a world where hunger affects over 700 million people. This statement provides a critical reflection on the statistics, adding depth to the discussion."}, {"id": "161250", "question": "<strong>Select the most appropriate option to fill in the blank</strong>.</p> <p>She suffered ______ pain because of the leg injury.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> hurting", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> excruciating", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> consuming", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> protracting"], "correct_answer": 1, "solution": "B) 'excruciating'\n\n'excruciating' उपयुक्त है क्योंकि यह प्रबल/अत्यधिक पीड़ा के लिए स्थापित कोलोकेशन है: “excruciating pain.” ‘Hurting’ participle है, ‘consuming/protracting’ का ऐसा प्रयोग ‘pain’ के साथ मान्य/प्रचलित नहीं है।\n\n‘Excruciating pain’ is the standard collocation. ‘Hurting’ is a participle, and ‘consuming/protracting’ don’t collocate naturally with ‘pain’ here."}, {"id": "161259", "question": "<strong>Identify the part of speech of the underlined word. </strong></p> <p><ins><strong>To swim</strong></ins> every day is good for health.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Participle", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Infinitive verb", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Gerund", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Adjective"], "correct_answer": 1, "solution": "B) Infinitive verb\n\n“to + V1” = infinitive functioning as a noun (subject of the sentence). यहाँ “to swim” वाक्य का कर्ता है—infinitive (verbal noun)."}, {"id": "161263", "question": "<strong>The following sentence has been split into four segments. Identify the segment that contains a grammatical error.</strong></p> <p>There is many reports / indicating that climate change has already started affecting crop yields / across several states in the northern region, / leading to rising concerns among farmers.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> There is many reports", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> indicating that climate change has already started affecting crop yields", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> across several states in the northern region", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> leading to rising concerns among farmers"], "correct_answer": 0, "solution": "A) ‘There is many reports’ के बदले ‘There are many reports’ होना चाहिए क्योंकि real subject reports plural है।\n\nRule: In “Here/There + be” sentences, the verb agrees with the real subject that comes after it.\n\n✔ There are many books on the table.\n\nCorrect sentence:\n\nThere are many reports indicating that climate change…"}, {"id": "161256", "question": "<strong>Select the most appropriate synonym of the given word</strong>.</p> <p>VIA MEDIA", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Middle course", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Hard line", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Zero-sum", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Extremity"], "correct_answer": 0, "solution": "A) <strong>Via media</strong> (noun/phrase) – A middle way between extremes; compromise path. मध्यम मार्ग/समन्वयी रास्ता।\n\n<strong>Synonym</strong>: <strong>Middle course </strong>(noun) – A moderate or compromise approach. मध्यम/समन्वयात्मक राह।\n\n<strong>Hard line</strong> (noun) – Rigid, uncompromising policy. कठोर/असमन्वयी नीति।\n\n<strong>Zero-sum</strong> (adj.) – One party’s gain equals another’s loss. शून्य-योग/एक का लाभ, दूसरे का हानि।\n\n<strong>Extremity</strong> (noun) – The farthest point/most severe stage. चरम स्थिति/अंतिम सीमा।"}, {"id": "161266", "question": "<strong>Improve the underlined/bold part of the sentence. Choose ‘No improvement’ as an answer if the sentence is grammatically correct.</strong></p> <p>When he heard the alarm, the worker immediately <strong>stopped to operate the machine and rushed outside</strong>.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> stopped to operating the machine and rushed outside", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> stopped operating of the machine and rushed outside", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> No improvement", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> stopped operating the machine and rushed outside"], "correct_answer": 3, "solution": "D) यहाँ sense है कि उसने machine operate करना quit किया और बाहर चला गया। इसलिए सही usage = stop doing = quit the activity।\n\n‘Stopped to operate’ का अर्थ होता pause किसी activity को ताकि machine चलाए, जो अर्थ के विपरीत है। जैसे— He stopped driving when he felt dizzy."}, {"id": "161249", "question": "<strong>Select the most appropriate option to fill in the blank</strong>.</p> <p>______ intake of sugar can cause health problems.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Access", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Excess of", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Excessive", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Excessively"], "correct_answer": 2, "solution": "C) 'Excessive'\n\n'Excessive' (adjective) सही है क्योंकि यह ‘intake’ (noun) को विशेषित करता है। ‘Excess of’ अलग संरचना मांगता है: “An excess of sugar…”. ‘Excessively’ adverb है और ‘Access’ का अर्थ प्रवेश/पहुंच है, जो संदर्भ से असंगत है।\n\n‘Excessive’ modifies the noun ‘intake’. ‘Excess of’ would require a different structure (“An excess of sugar…”). ‘Excessively’ is an adverb; ‘Access’ means entry/availability."}, {"id": "161270", "question": "<strong>Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the correct order to form a meaningful and coherent paragraph.</strong></p> <p>A. Besides, it is also an occasion to commemorate the signing of the Ramsar Convention on wetlands in 1971.</p> <p>B. World Wetland Day is celebrated on 2 February to raise awareness about the critical importance of wetlands.</p> <p>C. Unfortunately, these valuable wetlands are disappearing three times faster than the forest areas.</p> <p>D. The Convention upholds the wetlands as the world's most economically valuable ecosystems", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> BADC", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> DABC", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> BCDA", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> DCAB"], "correct_answer": 0, "solution": "A) BADC\n\nB starts the sentence with the subject \"World Wetland Day,\" introducing the main topic of the paragraph.\n\nA follows B as it adds additional information using the transition word \"Besides,\" explaining another purpose of the celebration (commemorating the Ramsar Convention).\n\nD comes next as it logically connects to A by elaborating on \"the Convention\" mentioned earlier, stating its significance in valuing wetlands.\n\nC concludes the paragraph by introducing a contrasting idea (\"Unfortunately\") and highlights the current threat to wetlands, making it a suitable closing statement.\n\n<strong>In Hindi:</strong><br> B sentence की शुरुआत करता है, क्योंकि यह subject \"World Wetland Day\" को introduce करता है, जो paragraph के main topic को बताता है।\n\nA, B के बाद आता है क्योंकि यह transition word \"Besides\" का उपयोग करके एक और purpose (Ramsar Convention को याद करना) बताता है।\n\nD, A के बाद logically fit होता है क्योंकि यह \"the Convention\" के बारे में विस्तार से बताता है, जिसका उल्लेख पहले किया गया था।\n\nC paragraph को conclude करता है, क्योंकि यह एक contrasting idea (\"Unfortunately\") लाता है और wetlands के खतरे को बताता है, जिससे यह एक suitable closing statement बनता है।"}, {"id": "161271", "question": "<strong>Comprehension:</strong></p> <p><strong>In the following passage, some words have been deleted. Read the passage carefully and select the most appropriate option to fill in each blank.</strong></p> <p>The stray dog population is _____1_______ in the country. If this is not acted upon with concrete plans, the number of dogs may ______2______ the human population as there is no reliable head count as yet of stray dogs. The argument that animal welfare activists _____3_______, that ______4______ the stray dog population will ______5______ an increase in the rat population, is illogical. Cats are the major predators of rats. As birth control methods on dogs have not made much of an impact on the canine population, it is our bounden duty to protect human lives.</p> <p><strong>Select the most appropriate option to fill in blank number 1.</strong>", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> atrophying", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> eviscerating", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> evolving", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> enervating"], "correct_answer": 2, "solution": "No solution available"}, {"id": "161272", "question": "<strong>Comprehension:</strong></p> <p><strong>In the following passage, some words have been deleted. Read the passage carefully and select the most appropriate option to fill in each blank.</strong></p> <p>The stray dog population is _____1_______ in the country. If this is not acted upon with concrete plans, the number of dogs may ______2______ the human population as there is no reliable head count as yet of stray dogs. The argument that animal welfare activists _____3_______, that ______4______ the stray dog population will ______5______ an increase in the rat population, is illogical. Cats are the major predators of rats. As birth control methods on dogs have not made much of an impact on the canine population, it is our bounden duty to protect human lives.</p> <p><strong>Select the most appropriate option to fill in blank number 2.</strong>", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> overwhelms", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> overwhelm", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> overwhelming", "<p style=\"display
