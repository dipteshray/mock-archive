<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6366f1">
    <title>devgagan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #06b6d4;
            
            --glass-bg: rgba(255, 255, 255, 0.95);  /* Changed from 0.25 to 0.95 */
            --glass-border: rgba(255, 255, 255, 0.8);  /* Changed from 0.18 to 0.8 */
            --shadow-light: 0 8px 32px rgba(31, 38, 135, 0.37);
            --shadow-heavy: 0 20px 60px rgba(0, 0, 0, 0.3);
            
            --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --bounce: cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        
[data-theme="light"] {
    --bg: #ffffff;  /* Changed from gradient to solid white */
    --card-bg: #ffffff;  /* Changed from transparent to solid white */
    --text: #1a202c;
    --text-secondary: #4a5568;
    --border: rgba(0, 0, 0, 0.1);  /* Changed to darker border for contrast */
    --nav-bg: #ffffff;  /* Changed from transparent to solid white */
}

[data-theme="dark"] {
    --bg: #1a1a2e;  /* Changed from gradient to solid dark */
    --card-bg: #16213e;  /* Changed from transparent to solid dark */
    --text: #f7fafc;
    --text-secondary: #a0aec0;
    --border: rgba(255, 255, 255, 0.1);
    --nav-bg: #0c0c0c;  /* Changed from transparent to solid dark */
}
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--bg);  /* Now just using the solid color */
    z-index: -1;
}
        
        /* Floating particles animation */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: float 6s infinite ease-in-out;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.7; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 0.3; }
        }
        
        /* Header with glassmorphism */
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 16px 20px;
            z-index: 100;
            transition: var(--transition);
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .menu-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            font-size: 18px;
        }
        
        .menu-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-light);
        }
        
        .menu-btn:active {
            transform: scale(0.95);
        }
        
        .logo {
            font-weight: 800;
            font-size: 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        
        [data-theme="dark"] .logo {
    background: none;
    -webkit-text-fill-color: white; /* White text in dark mode */
    color: white; /* Fallback */
}
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            font-size: 20px;
        }
        
        .theme-toggle:hover {
            transform: rotate(180deg) scale(1.1);
            box-shadow: var(--shadow-light);
        }
        
        /* Advanced Timer */
        .timer-container {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .timer {
            background: linear-gradient(135deg, var(--error), #dc2626);
            color: white;
            padding: 12px 16px;
            border-radius: 16px;
            font-family: 'Inter', monospace;
            font-weight: 600;
            font-size: 14px;
            box-shadow: var(--shadow-light);
            position: relative;
            overflow: hidden;
        }
        
        .timer.warning {
            animation: pulse 1s infinite;
        }
        
        .timer.critical {
            animation: shake 0.5s infinite;
            background: linear-gradient(135deg, #dc2626, #991b1b);
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
        }
        
        .progress-ring {
            width: 40px;
            height: 40px;
            transform: rotate(-90deg);
        }
        
        .progress-circle {
            fill: none;
            stroke: rgba(255, 255, 255, 0.3);
            stroke-width: 3;
        }
        
        .progress-circle.progress {
            stroke: var(--primary);
            stroke-linecap: round;
            transition: stroke-dashoffset 0.3s ease;
        }
        
        /* Main Content */
        .main {
            margin: 80px 0 100px;
            padding: 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .question-container {
    background: var(--card-bg);  /* Now uses solid color */
    /* Remove or reduce blur effect */
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 32px;
    box-shadow: var(--shadow-heavy);
    position: relative;
    overflow: hidden;
    transition: var(--transition);
}
        .question-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--info));
            background-size: 200% 100%;
            animation: gradient-flow 3s linear infinite;
        }
        
        @keyframes gradient-flow {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .question-number {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 12px 20px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: var(--shadow-light);
            position: relative;
        }
        
        .question-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }
        
        .question-progress {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
        }
        
        .question-marks {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 600;
        }
        
        .question-text {
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 32px;
            color: var(--text);
            font-weight: 500;
        }
        
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .option {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 20px 24px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            font-size: 16px;
            font-weight: 500;
            color: var(--text);
            overflow: hidden;
        }
        
        .option::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s;
        }
        
        .option:hover::before {
            left: 100%;
        }
        
        .option:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: var(--shadow-light);
        }
        
        .option:active {
            transform: scale(0.98);
        }

        .menu-btn, .theme-toggle, .nav-btn.prev, .action-btn.flag {
    background: var(--card-bg);  /* Solid background */
    backdrop-filter: none;  /* Remove blur */
}

.sidebar {
    background: var(--card-bg);  /* Solid background */
    backdrop-filter: none;  /* Remove blur */
}
        
        .option.selected {
            background: rgba(99, 102, 241, 0.15);
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-light);
        }
        
        .option.correct {
            background: rgba(16, 185, 129, 0.15);
            border-color: var(--success);
            color: var(--success);
        }
        
        .option.incorrect {
            background: rgba(239, 68, 68, 0.15);
            border-color: var(--error);
            color: var(--error);
        }
        
        .option.disabled {
            background: rgba(160, 174, 192, 0.1);
            border-color: var(--text-secondary);
            color: var(--text-secondary);
            cursor: not-allowed;
        }
        
        .option-indicator {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }
        
        .option.selected .option-indicator {
            background: var(--primary);
            color: white;
        }
        
        .option.correct .option-indicator {
            background: var(--success);
            color: white;
        }
        
        .option.incorrect .option-indicator {
            background: var(--error);
            color: white;
        }
        
        .option:not(.selected):not(.correct):not(.incorrect) .option-indicator {
            border: 2px solid var(--border);
        }
        
        /* Solution Panel */
        .solution-panel {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(245, 158, 11, 0.05));
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 20px;
            padding: 24px;
            margin-top: 24px;
            backdrop-filter: blur(10px);
            transform: translateY(20px);
            opacity: 0;
            transition: var(--transition);
        }
        
        .solution-panel.show {
            transform: translateY(0);
            opacity: 1;
        }
        
        .solution-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            color: var(--warning);
            font-weight: 700;
        }
        
        .solution-content {
            color: var(--text);
            line-height: 1.6;
            font-size: 15px;
        }
        
        /* Navigation */
        .navigation {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            padding: 16px 20px;
            z-index: 90;
        }
        
        .nav-content {
            display: flex;
            gap: 12px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .nav-btn {
            flex: 1;
            padding: 16px 24px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        
        .nav-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.6s;
        }
        
        .nav-btn:hover::before {
            left: 100%;
        }
        
        .nav-btn:active {
            transform: scale(0.95);
        }
        
        .nav-btn.prev {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            backdrop-filter: blur(10px);
        }
        
        .nav-btn.next {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: var(--shadow-light);
        }
        
        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .nav-btn:disabled::before {
            display: none;
        }
        
        /* Question Panel Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid var(--border);
            z-index: 200;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-heavy);
        }
        
        .sidebar.open {
            right: 0;
        }
        
        .sidebar-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .sidebar-title {
            font-weight: 800;
            font-size: 20px;
        }
        
        .close-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        
        .close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(90deg);
        }
        
        .sidebar-body {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }
        
        .questions-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 32px;
        }
        
        .question-btn {
            background: var(--card-bg);
            border: 2px solid var(--border);
            color: var(--text-secondary);
            width: 48px;
            height: 48px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            position: relative;
        }
        
        .question-btn:hover {
            transform: scale(1.1);
            box-shadow: var(--shadow-light);
        }
        
        .question-btn:active {
            transform: scale(0.95);
        }
        
        .question-btn.current {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: var(--shadow-light);
        }
        
        .question-btn.answered {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border-color: var(--success);
        }
        
        .question-btn.correct {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }
        
        .question-btn.incorrect {
            background: var(--error);
            color: white;
            border-color: var(--error);
        }
        
        .question-btn.flagged::after {
            content: '🚩';
            position: absolute;
            top: -4px;
            right: -4px;
            font-size: 10px;
        }
        
        /* Legend */
        .legend {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 32px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .legend-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        
        .legend-dot.current { background: var(--primary); }
        .legend-dot.answered { background: var(--success); }
        .legend-dot.unattempted { background: var(--text-secondary); }
        .legend-dot.flagged { background: var(--warning); }
        
        /* Action Buttons */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .action-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }
        
        .action-btn.flag {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        
        .action-btn.submit {
            background: linear-gradient(135deg, var(--error), #dc2626);
            color: white;
            box-shadow: var(--shadow-light);
        }
        
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-heavy);
        }
        
        .action-btn:active {
            transform: scale(0.98);
        }
        
        /* Overlay */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 150;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }
        
        .overlay.show {
            opacity: 1;
            visibility: visible;
        }
        
        /* Result Modal */
        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 32px;
            max-width: 90vw;
            width: 480px;
            z-index: 300;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
            box-shadow: var(--shadow-heavy);
            overflow: hidden;
        }
        
        .modal.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }
        
        .modal-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 40px 32px;
            text-align: center;
        }
        
        .modal-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        
        .modal-subtitle {
            opacity: 0.9;
            font-size: 16px;
            font-weight: 500;
        }
        
        .modal-body {
            padding: 32px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            text-align: center;
            padding: 20px 16px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }
        
        .stat-label {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        
        .stat-value {
            color: var(--text);
            font-size: 24px;
            font-weight: 800;
        }
        
        .final-score {
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
            border-radius: 20px;
            padding: 32px;
            text-align: center;
            margin-bottom: 24px;
            box-shadow: var(--shadow-light);
        }
        
        .score-text {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        
        .percentage-text {
            opacity: 0.9;
            font-size: 18px;
            font-weight: 600;
        }
        
        .modal-actions {
            display: flex;
            gap: 12px;
        }
        
        .modal-btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }
        
        .modal-btn.primary {
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary);
            border: 1px solid rgba(99, 102, 241, 0.3);
        }
        
        .modal-btn.success {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        
        .modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-light);
        }
        
        /* Auto-save indicator */
        .auto-save {
            position: fixed;
            top: 80px;
            right: 20px;
            background: var(--success);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            transform: translateX(100px);
            opacity: 0;
            transition: var(--transition);
            z-index: 90;
        }
        
        .auto-save.show {
            transform: translateX(0);
            opacity: 1;
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .header-content {
                padding: 0 4px;

        // Core Variables
        const questions = [{"id": "161001", "question": "<strong>Comprehension</strong>:<br> In 2005, when the internet was young — accessed mostly through dial-up connections and featuring user-created websites — the birth of YouTube heralded a new era of digital content creation, and creativity. In grainy footage, shot in low-light conditions and against make-shift backdrops, ordinary people offered a glimpse into their lives, their nerdy obsessions and passions. Would-be musicians, artists and filmmakers showcased their craft, with many, like singers Justin Bieber, Shawn Mendes and Troye Sivan, finding stardom. This was the promise of YouTube, when the “you” in its name meant something. Twenty years on, however, with AI entering the chat, that promise is becoming increasingly fragile.</p> <p>“AI slop” — purely AI-generated content, usually nonsensical, with no substance and storyline or any purpose other than grabbing clicks and views — is taking over YouTube. A recent data analysis by The Guardian found that “nearly one in 10 of the fastest growing YouTube channels globally are showing AI-generated content only”, with many of the channels posting “repetitive and ‘inauthentic’ content”. A platform once celebrated as a launch pad for everyman is now being crowded with content that is disconnected from anyone’s lived experience and which lacks the textures and tones of human creativity, the telling flaws and endearing glitches that speak of people, not algorithms.</p> <p>The proliferation of blindly-automated, prompt-driven creations means that creators will now have to compete for views and — increasingly, ad revenue — with content-generation farms that can upload multiple, polished videos in a single day. It is also bad news for consumers. AI may have much to offer when used right, but no prompt, however precisely worded, can generate the many shades of human ingenuity and whimsy that YouTube is home to.</p> <p><strong>What is the tone of the passage?</strong>", ks the textures and tones of human creativity, the telling flaws and endearing glitches that speak of people, not algorithms.</p> <p>The proliferation of blindly-automated, prompt-driven creations means that creators will now have to compete for views and — increasingly, ad revenue — with content-generation farms that can upload multiple, polished videos in a single day. It is also bad news for consumers. AI may have much to offer when used right, but no prompt, however precisely worded, can generate the many shades of human ingenuity and whimsy that YouTube is home to.</p> <p><strong>From the passage, it can be inferred that all of the following are true about the impact of AI on YouTube EXCEPT that</strong>", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> According to a recent analysis cited by the author, a significant subset of the fastest-growing channels—nearly one in ten—now publish only AI-generated videos, much of which is described as repetitive and “inauthentic,” indicating a measurable platform-level shift.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The surge of “AI slop” makes life harder for human creators because large content-generation farms can upload multiple polished videos per day, intensifying competition for views and ad revenue that once flowed more directly to individual makers.", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Well-crafted prompts can fully reproduce the “textures and tones” of human creativity—its telling flaws, endearing glitches, and many shades of ingenuity—so the overall viewer experience remains essentially unchanged.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> For audiences, the spread of blindly automated, prompt-driven uploads is “bad news,” because much of that content is disconnected from lived experience and lacks substance, diminishing what made YouTube’s “you” meaningful."], "correct_answer": 2, "solution": "No solution available"}, {"id": "161003", "question": "<strong>Comprehension</strong>:<br> In 2005, when the internet was young — accessed mostly through dial-up connections and featuring user-created websites — the birth of YouTube heralded a new era of digital content creation, and creativity. In grainy footage, shot in low-light conditions and against make-shift backdrops, ordinary people offered a glimpse into their lives, their nerdy obsessions and passions. Would-be musicians, artists and filmmakers showcased their craft, with many, like singers Justin Bieber, Shawn Mendes and Troye Sivan, finding stardom. This was the promise of YouTube, when the “you” in its name meant something. Twenty years on, however, with AI entering the chat, that promise is becoming increasingly fragile.</p> <p>“AI slop” — purely AI-generated content, usually nonsensical, with no substance and storyline or any purpose other than grabbing clicks and views — is taking over YouTube. A recent data analysis by The Guardian found that “nearly one in 10 of the fastest growing YouTube channels globally are showing AI-generated content only”, with many of the channels posting “repetitive and ‘inauthentic’ content”. A platform once celebrated as a launch pad for everyman is now being crowded with content that is disconnected from anyone’s lived experience and which lacks the textures and tones of human creativity, the telling flaws and endearing glitches that speak of people, not algorithms.</p> <p>The proliferation of blindly-automated, prompt-driven creations means that creators will now have to compete for views and — increasingly, ad revenue — with content-generation farms that can upload multiple, polished videos in a single day. It is also bad news for consumers. AI may have one\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> AI-generated, repetitive, “inauthentic” content is crowding the platform and displacing human, lived-experience creativity", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Creators now use high-end production gear instead of grainy footage", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The platform has banned user-generated uploads"], "correct_answer": 1, "solution": "No solution available"}, {"id": "161005", "question": "<strong>Comprehension</strong>:<br> In 2005, when the internet was young — accessed mostly through dial-up connections and featuring user-created websites — the birth of YouTube heralded a new era of digital content creation, and creativity. In grainy footage, shot in low-light conditions and against make-shift backdrops, ordinary people offered a glimpse into their lives, their nerdy obsessions and passions. Would-be musicians, artists and filmmakers showcased their craft, with many, like singers Justin Bieber, Shawn Mendes and Troye Sivan, finding stardom. This was the promise of YouTube, when the “you” in its name meant something. Twenty years on, however, with AI entering the chat, that promise is becoming increasingly fragile.</p> <p>“AI slop” — purely AI-generated content, usually nonsensical, with no substance and storyline or any purpose other than grabbing clicks and views — is taking over YouTube. A recent data analysis by The Guardian found that “nearly one in 10 of the fastest growing YouTube channels globally are showing AI-generated content only”, with many of the channels posting “repetitive and ‘inauthentic’ content”. A platform once celebrated as a launch pad for everyman is now being crowded with content that is disconnected from anyone’s lived experience and which lacks the textures and tones of human creativity, the telling flaws and endearing glitches that speak of people, not algorithms.</p> <p>The proliferation of blindly-automated, prompt-driven creations means that creators will now have to compete for views and — increasingly, ad revenue — with content-generation farms that can upload multiple, polished videos in a single day. It is also bad news for consumers. AI may have much to offer when used right, but no prompt, however precisely worded, can generate the many shades of human ingenuity and whimsy that YouTube is home to.</p> <p>Select the most appropriate synonym of “<strong>proliferation</strong>” as used in “The proliferation of blindly-automated, prompt-driven creations…”", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> propagation", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> abatement", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> ossification", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> moratorium"], "correct_answer": 0, "solution": "No solution available"}, {"id": "161198", "question": "<strong>Select the most appropriate meaning of the given idiom</strong>.</p> <p>Dyed in the wool", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Changing notions because of a fluffy mind", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Assuming a different colour", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Adapting to conditions", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Unchanging and firm in belief and conviction"], "correct_answer": 3, "solution": "<strong>D) Dyed in the wool</strong> (idiom) – Unchanging and firm in belief and conviction दृढ़ और अडिग विश्वास वाला"}, {"id": "161208", "question": "<strong>The following sentence has been split into four segments. Identify the segment that contains a grammatical error.</strong></p> <p>Neither of the two proposals for restructuring / were found suitable by the board, / as both lacked clarity in financial projections / and failed to address long-term sustainability.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Neither of the two proposals for restructuring", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> were found suitable by the board", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> as both lacked clarity in financial projections", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> and failed to address long-term sustainability"], "correct_answer": 1, "solution": "B) ‘Neither of … were’ गलत है क्योंकि Neither of + plural noun परंपरागत रूप से singular verb लेता है। सही होगा — Neither of the two proposals was found suitable.\n\n“Neither of … were” is incorrect because Neither of + plural noun traditionally takes a singular verb in formal grammar. Correct: Neither of the two proposals was found suitable."}, {"id": "161203", "question": "<strong>In the following Question, two lists are given with the keywords mentioned. You are required to match List-I with List-II and Select the option that can be used as a correct one-word substitute for the word given in List I.</strong></p> <p>List-I</p> <p>A) Internecine<br> B) Revoke<br> C) Exonerate<br> D) Venerable<br> </p> <p>List-II (Meaning)</p> <p>1. Officially cancel an agreement/power<br> 2. Officially clear from blame/accusation<br> 3. Between members of the same group/community<br> 4. Valued and respected", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> A-1, B-3, C-2, D-4", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> A-3, B-1, C-2, D-4", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> . A-3, B-2, C-1, D-4", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> A-4, B-1, C-3, D-2"], "correct_answer": 1, "solution": "B) A–3, B–1, C–2, D–4\n\n<strong>Internecine</strong> → Between members of the same group/community. एक ही समुदाय/दल के बीच।\n\n<strong>Revoke</strong> → Officially cancel. औपचारिक रूप से निरस्त करना।\n\n<strong>Exonerate</strong> → Officially clear from blame. आरोप से आधिकारिक मुक्ति देना।\n\n<strong>Venerable</strong> → Valued and respected. सम्माननीय/श्रद्धेय।"}, {"id": "161199", "question": "<strong>Select the most appropriate meaning of the given idiom</strong>.</p> <p>Let sleeping dogs lie", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Let things remain as they are because of laziness", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Not interfere in situations where interference may exacerbate matters", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Not stoke a dangerous situation", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Lie about the past"], "correct_answer": 1, "solution": "<strong>B) Let sleeping dogs lie</strong> (idiom) – Do not interfere where interference may worsen matters ऐसी स्थिति में हस्तक्षेप न करना जहाँ दखल देने से स्थिति बिगड़ सकती है"}, {"id": "161205", "question": "<strong>Improve the underlined/bold part of the sentence. Choose ‘No improvement’ as an answer if the sentence is grammatically correct.</strong></p> <p>The chairman strongly <strong>insisted</strong> <strong>for implementing the new policy immediately</strong>, despite opposition from several board members.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> insisted on implementing the new policy immediately", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> insisted for to implement the new policy immediately", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> insisted to implementing the new policy immediately", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> No improvement"], "correct_answer": 0, "solution": "A) ‘insisted for implementing’ के बदले ‘insisted on implementing’ का प्रयोग होगा क्योंकि verb insist के बाद हमेशा preposition on आता है।\n\nजैसे— He insisted on going there.\n\n‘insisted on implementing’ will be used instead of ‘insisted for implementing’ because with the verb ‘insist,’ the correct fixed preposition is on, not ‘for.’\n\nLike— She insisted on paying the bill."}, {"id": "161201", "question": "<strong>Select the most appropriate synonym of the given word</strong>.</p> <p>OFFICIOUS", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Official", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Efficacious", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Meddlesome", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Omniscient"], "correct_answer": 2, "solution": "C) <strong>Officious</strong> (adjective) – Excessively eager to offer unwanted help or interfere; meddlesome and overbearing in petty matters. बेवजह दखल देने वाला; अनचाही सहायता थोपने वाला।\n\n<strong>Synonym</strong>: <strong>Meddlesome</strong> (adjective) – Inclined to interfere in others’ affairs. दखल देने वाला/हस्तक्षेपकारी।\n\n<strong>Official</strong> (adjective) – Relating to authority or public office; not about intrusive behavior. आधिकारिक/सरकारी।\n\n<strong>Efficacious</strong> (adjective) – Effective, capable of producing the desired result. प्रभावकारी/सफल परिणाम देने वाला।\n\n<strong>Omniscient</strong> (adjective) – All-knowing. सर्वज्ञ/सब कुछ जानने वाला।"}, {"id": "161200", "question": "<strong>Select the most appropriate synonym of the given word</strong>.</p> <p>INSOLVENT", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Bankrupt", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Pecunious", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Profligate", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Indebted"], "correct_answer": 0, "solution": "A) <strong>Insolvent</strong> (adjective) – Unable to pay debts as they fall due; lacking sufficient assets to cover liabilities. जो कर्ज़ चुकाने में असमर्थ हो; दिवालिया-स्थिति।\n\n<strong>Synonym</strong>: <strong>Bankrupt </strong>(adjective) – Financially ruined; unable to meet debts. दिवालिया/कंगाल।\n\n<strong>Pecunious</strong> (adjective) – Wealthy; having plenty of money. धनवान/सम्पन्न।\n\n<strong>Profligate</strong> (adjective) – Wastefully extravagant or licentious; not specifically about inability to pay debts. अपव्ययी/चरित्रहीन; देनदारी अदा न कर पाने से सीधा सम्बन्ध नहीं।\n\n<strong>Indebted</strong> (adjective) – Owing money or gratitude; one can be indebted yet solvent. ऋणी; ऋण होने पर भी भुगतान-सक्षम हो सकता है।"}, {"id": "161209", "question": "<strong>Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the correct order to form a meaningful and coherent paragraph.</strong></p> <p>A. This is an important move that strengthens the public transport sector’s shift to EVs.</p> <p>B. In a major push toward achieving India’s climate targets, the Union Cabinet recently approved the PM Electric Drive Revolution in Innovative Vehicle Enhancement (PM E-DRIVE) scheme, which allocates funding for electric vehicles (EVs) across many segments.</p> <p>C. But private bus operators are left out of the subsidy framework, which raises concerns about the potential to scale electric mobility beyond State-run buses.</p> <p>D. This includes ₹4,391 crore for subsidies/demand incentives that support procurement of 14,028 electric buses in nine cities.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> BDAC", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> CABD", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> BCAD", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> ABCD"], "correct_answer": 0, "solution": "A) BDAC\n\n<strong>B begins</strong> the paragraph by introducing the main topic: \"In a major push toward achieving India’s climate targets, the Union Cabinet recently approved the PM Electric Drive Revolution in Innovative Vehicle Enhancement (PM E-DRIVE) scheme.\" This sets up the paragraph with a clear subject and context, detailing the significance of the scheme.\n\n<strong>D follows B</strong> and connects grammatically by using the pronoun “This,” referring back to the PM E-DRIVE scheme mentioned in B. It adds specifics about the funding and allocation, providing additional information that directly builds on the introduction.\n\n<strong>A comes next</strong>, using “This” again to refer to the details mentioned in D. It highlights the significance of the funding for the public transport sector’s transition to electric vehicles, ensuring a logical continuation of the discussion.\n\n<strong>C concludes the paragraph</strong> and introduces a contrasting point with “But,” linking back to the previous details while introducing a new concern. It explains the limitation of the subsidy framework by mentioning the exclusion of private bus operators, thus completing the discussion with a critical perspective."}, {"id": "161197", "question": "<strong>Select the most appropriate option to fill in the blank</strong>.</p> <p>Working in dim light ______ eye issues such as glaucoma.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> contributes", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> precipitates", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> eradicates", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> eliminates"], "correct_answer": 1, "solution": "<strong>B) 'precipitates' </strong> का use किया जाएगा क्योंकि यह क्रिया सीधे कारण बनने (bring about/cause) का अर्थ देती है। ‘Contributes’ के साथ ‘to’ चाहिए (contributes to), और ‘eradicates/ eliminates’ विपरीत अर्थ देते हैं—समस्या को खत्म करना।\n\n‘Precipitates’ fits because it means “causes/brings about” directly. ‘Contributes’ needs the preposition ‘to’, and ‘eradicates/eliminates’ mean to remove the issue, which is opposite in sense here."}, {"id": "161204", "question": "<strong>Identify the part of speech of the underlined word. </strong></p> <p>His <ins><strong>only</strong> </ins>answer was a grunt.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Noun", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Adjective", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Pronoun", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Determiner"], "correct_answer": 1, "solution": "B) Adjective\n\nonly is limiting the noun “answer,” so it functions as an attributive adjective (a limiter). यह “answer” को सीमित करता है, इसलिए विशेषण।"}, {"id": "161206", "question": "<strong>Improve the underlined/bold part of the sentence. Choose ‘No improvement’ as an answer if the sentence is grammatically correct.</strong></p> <p>The doctor suggested <strong>that the patient takes complete rest for two weeks to recover fully</strong>.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> that the patient should take complete rest for two weeks to recover fully", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> the patient taking complete rest for two weeks to recover fully", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> that the patient take complete rest for two weeks to recover fully", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> No improvement"], "correct_answer": 2, "solution": "C) ‘suggested that the patient takes’ के बदले ‘suggested that the patient take’ का प्रयोग होगा क्योंकि Suggest/Recommend/Advise + that-clause में subjunctive mood प्रयोग होता है: Subject + base verb (should optional होता है)।\n\nजैसे— I suggest that he go there.\n\n‘that the patient take’ will be used instead of ‘takes’ because after verbs like ‘suggest,’ the subjunctive mood requires the base form of the verb.\n\nLike— They recommended that she apply early."}, {"id": "161202", "question": "<strong>Select the most appropriate ANTONYM of the given word</strong>.</p> <p>AMATEUR", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Neophyte", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Adept", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Dilettante", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Lay"], "correct_answer": 1, "solution": "B) <strong>Amateur</strong> (noun/adjective) – Nonprofessional; lacking advanced skill; novice. शौकिया/गैर-पेशेवर\n\n<strong>Antonym</strong>: <strong>Adept</strong> (noun/verb) – Very skilled or proficient; adroit, expert. निपुण/कुशल\n\n<strong>Neophyte</strong> – Beginner or novice; tyro. नवसीखिया\n\n<strong>Dilettante</strong> – One with superficial interest; trifler. ऊपरी शौक रखने वाला\n\n<strong>Lay</strong> – Nonprofessional; not expert. गैर-पेशेवर/सामान्य"}, {"id": "161207", "question": "<strong>The following sentence has been split into four segments. Identify the segment that contains a grammatical error.</strong></p> <p>Each of the employees in the organization / have been asked to submit a self-assessment form / so that the HR department can evaluate his strengths / and recommend personalized training sessions.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Each of the employees in the organization", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> have been asked to submit a self-assessment form", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> so that the HR department can evaluate their strengths", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> and recommend personalized training sessions"], "correct_answer": 1, "solution": ": B) ‘Each of the employees … have’ गलत है क्योंकि Each of हमेशा singular verb लेता है। सही होगा — Each of the employees has been asked.\n\n“Each of the employees … have” is wrong because Each of must always be followed by a singular verb. Correct: Each of the employees has been asked."}, {"id": "161196", "question": "<strong>Select the most appropriate option to fill in the blank</strong>.</p> <p>Ranikhet is a place of remarkably ______ beauty.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> scenery", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> scenic", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> scene", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> scenically"], "correct_answer": 1, "solution": "B)'scenic' सही है क्योंकि “scenic beauty” fixed collocation है। ‘scenery/scene/scenically’ व्याकरण/कोलोकेशन के लिहाज़ से सही नहीं।\n\n‘scenic beauty’ is a fixed collocation; the others don’t fit grammatically or collocationally."}, {"id": "161210", "question": "<strong>Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the correct order to form a meaningful and coherent paragraph.</strong></p> <p>P. The latest addition to this is the Aparajita Woman and Child (West Bengal Criminal Laws Amendment) Bill, 2024, adopted by the West Bengal government, the reason being the brutal rape and murder of a doctor at Kolkata’s R.G. Kar Medical College and Hospital.</p> <p>Q. Among other things, it introduces the death penalty for the offence of rape.</p> <p>R. The life of the death sentence in India has been unending, and like a phoenix revives itself in different forms every now and then.</p> <p>S. It seeks to amend the Bharatiya Nyaya Sanhita, 2023 (BNS), the Bharatiya Nagarik Suraksha Sanhita, 2023 and the Protection of Children from Sexual Offences Act, 2012, in their application to the State of West Bengal.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> RSPQ", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> QPRS", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> RPSQ", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> RQPS"], "correct_answer": 2, "solution": "C) <strong>RPSQ</strong>\n\nR: This sentence introduces the general theme of the death sentence in India.\n\nP: The phrase \"The latest addition to this\" uses demonstrative pronoun 'this' to refer back to the theme introduced in Sentence R (the unending nature of the death sentence).<br> S: The pronoun 'It' refers to the \"Aparajita Woman and Child Bill\" mentioned in Sentence P. This sentence explains the legal objective of the bill, which is to amend various acts.<br> Q: The phrase \"Among other things\" serves as an additive phrase, providing more details about what the bill (introduced in P) aims to achieve. The pronoun 'it' again refers back to the bill, and the specific mention of the death penalty connects directly to the theme introduced in Sentence R."}, {"id": "160986", "question": "<strong>Comprehension:</strong></p> <p><strong>In the following passage, some words have been deleted. Read the passage carefully and select the most appropriate option to fill in each blank.</strong></p> <p>It is refreshing to learn from time to time that civic bodies across cities are taking steps to _____ (1) ______urban parks by renovating existing spaces, especially those _____ (2) _____by metro and other projects, and developing new ones. Parks, which are compact green spaces, have been consistently playing a _____ (3) ____-role in societies from time immemorial. During the different periods of Indian history, groves and gardens were ____ (4) ____by rulers for public enjoyment. Mark Antony successfully _____ (5)______up the emotions of the Roman mob soon after the assassination of Julius Caesar when he announced dramatically that Caesar had “left you all his walks, his private arbours and new-planted orchards on this side of Tiber”.</p> <p><strong>Select the most appropriate option to fill in blank number 1.</strong>", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> stifle", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> smother", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> nurture", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> forsake"], "correct_answer": 2, "solution": "No solution available"}, {"id": "160987", "question": "<strong>Comprehension:</strong></p> <p><strong>In the following passage, some words have been deleted. Read the passage carefully and select the most appropriate option to fill in each blank.</strong></p> <p>It is refreshing to learn from time to time that civic bodies across cities are taking steps to _____ (1) ______urban parks by renovating existing spaces, especially those _____ (2) _____by metro and other projects, and developing new ones. Parks, which are compact green spaces, have been consistently playing a _____ (3) ____-role in societies from time immemorial. During the different periods of Indian history, groves and gardens were ____ (4) ____by rulers for public enjoyment. Mark Antony successfully _____ (5)______up the emotions of the Roman mob soon after the assassination of Julius Caesar when he announced dramatically that Caesar had “left you all his walks, his private arbours and new-planted orchards on this side of Tiber”.</p> <p><strong>Select the most appropriate option to fill in blank number 2.</strong>", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> affected", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> genuine", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> eager", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> disinclined"], "correct_answer": 0, "solution": "No solution available"}, {"id": "160988", "question": "<strong>Comprehension:</strong></p> <p><strong>In the following passag
