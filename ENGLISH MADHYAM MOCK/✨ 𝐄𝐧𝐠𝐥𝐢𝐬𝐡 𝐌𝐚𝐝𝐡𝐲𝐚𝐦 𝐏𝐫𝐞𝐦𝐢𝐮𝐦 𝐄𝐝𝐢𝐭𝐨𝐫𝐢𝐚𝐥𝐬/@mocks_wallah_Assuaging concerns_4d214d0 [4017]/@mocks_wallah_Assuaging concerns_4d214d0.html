<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6366f1">
    <title>devgagan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #06b6d4;
            
            --glass-bg: rgba(255, 255, 255, 0.95);  /* Changed from 0.25 to 0.95 */
            --glass-border: rgba(255, 255, 255, 0.8);  /* Changed from 0.18 to 0.8 */
            --shadow-light: 0 8px 32px rgba(31, 38, 135, 0.37);
            --shadow-heavy: 0 20px 60px rgba(0, 0, 0, 0.3);
            
            --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --bounce: cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        
[data-theme="light"] {
    --bg: #ffffff;  /* Changed from gradient to solid white */
    --card-bg: #ffffff;  /* Changed from transparent to solid white */
    --text: #1a202c;
    --text-secondary: #4a5568;
    --border: rgba(0, 0, 0, 0.1);  /* Changed to darker border for contrast */
    --nav-bg: #ffffff;  /* Changed from transparent to solid white */
}

[data-theme="dark"] {
    --bg: #1a1a2e;  /* Changed from gradient to solid dark */
    --card-bg: #16213e;  /* Changed from transparent to solid dark */
    --text: #f7fafc;
    --text-secondary: #a0aec0;
    --border: rgba(255, 255, 255, 0.1);
    --nav-bg: #0c0c0c;  /* Changed from transparent to solid dark */
}
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--bg);  /* Now just using the solid color */
    z-index: -1;
}
        
        /* Floating particles animation */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: float 6s infinite ease-in-out;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.7; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 0.3; }
        }
        
        /* Header with glassmorphism */
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 16px 20px;
            z-index: 100;
            transition: var(--transition);
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .menu-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            font-size: 18px;
        }
        
        .menu-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-light);
        }
        
        .menu-btn:active {
            transform: scale(0.95);
        }
        
        .logo {
            font-weight: 800;
            font-size: 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        
        [data-theme="dark"] .logo {
    background: none;
    -webkit-text-fill-color: white; /* White text in dark mode */
    color: white; /* Fallback */
}
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            font-size: 20px;
        }
        
        .theme-toggle:hover {
            transform: rotate(180deg) scale(1.1);
            box-shadow: var(--shadow-light);
        }
        
        /* Advanced Timer */
        .timer-container {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .timer {
            background: linear-gradient(135deg, var(--error), #dc2626);
            color: white;
            padding: 12px 16px;
            border-radius: 16px;
            font-family: 'Inter', monospace;
            font-weight: 600;
            font-size: 14px;
            box-shadow: var(--shadow-light);
            position: relative;
            overflow: hidden;
        }
        
        .timer.warning {
            animation: pulse 1s infinite;
        }
        
        .timer.critical {
            animation: shake 0.5s infinite;
            background: linear-gradient(135deg, #dc2626, #991b1b);
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
        }
        
        .progress-ring {
            width: 40px;
            height: 40px;
            transform: rotate(-90deg);
        }
        
        .progress-circle {
            fill: none;
            stroke: rgba(255, 255, 255, 0.3);
            stroke-width: 3;
        }
        
        .progress-circle.progress {
            stroke: var(--primary);
            stroke-linecap: round;
            transition: stroke-dashoffset 0.3s ease;
        }
        
        /* Main Content */
        .main {
            margin: 80px 0 100px;
            padding: 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .question-container {
    background: var(--card-bg);  /* Now uses solid color */
    /* Remove or reduce blur effect */
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 32px;
    box-shadow: var(--shadow-heavy);
    position: relative;
    overflow: hidden;
    transition: var(--transition);
}
        .question-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--info));
            background-size: 200% 100%;
            animation: gradient-flow 3s linear infinite;
        }
        
        @keyframes gradient-flow {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .question-number {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 12px 20px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: var(--shadow-light);
            position: relative;
        }
        
        .question-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }
        
        .question-progress {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
        }
        
        .question-marks {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 600;
        }
        
        .question-text {
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 32px;
            color: var(--text);
            font-weight: 500;
        }
        
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .option {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 20px 24px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            font-size: 16px;
            font-weight: 500;
            color: var(--text);
            overflow: hidden;
        }
        
        .option::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s;
        }
        
        .option:hover::before {
            left: 100%;
        }
        
        .option:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: var(--shadow-light);
        }
        
        .option:active {
            transform: scale(0.98);
        }

        .menu-btn, .theme-toggle, .nav-btn.prev, .action-btn.flag {
    background: var(--card-bg);  /* Solid background */
    backdrop-filter: none;  /* Remove blur */
}

.sidebar {
    background: var(--card-bg);  /* Solid background */
    backdrop-filter: none;  /* Remove blur */
}
        
        .option.selected {
            background: rgba(99, 102, 241, 0.15);
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-light);
        }
        
        .option.correct {
            background: rgba(16, 185, 129, 0.15);
            border-color: var(--success);
            color: var(--success);
        }
        
        .option.incorrect {
            background: rgba(239, 68, 68, 0.15);
            border-color: var(--error);
            color: var(--error);
        }
        
        .option.disabled {
            background: rgba(160, 174, 192, 0.1);
            border-color: var(--text-secondary);
            color: var(--text-secondary);
            cursor: not-allowed;
        }
        
        .option-indicator {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }
        
        .option.selected .option-indicator {
            background: var(--primary);
            color: white;
        }
        
        .option.correct .option-indicator {
            background: var(--success);
            color: white;
        }
        
        .option.incorrect .option-indicator {
            background: var(--error);
            color: white;
        }
        
        .option:not(.selected):not(.correct):not(.incorrect) .option-indicator {
            border: 2px solid var(--border);
        }
        
        /* Solution Panel */
        .solution-panel {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(245, 158, 11, 0.05));
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 20px;
            padding: 24px;
            margin-top: 24px;
            backdrop-filter: blur(10px);
            transform: translateY(20px);
            opacity: 0;
            transition: var(--transition);
        }
        
        .solution-panel.show {
            transform: translateY(0);
            opacity: 1;
        }
        
        .solution-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            color: var(--warning);
            font-weight: 700;
        }
        
        .solution-content {
            color: var(--text);
            line-height: 1.6;
            font-size: 15px;
        }
        
        /* Navigation */
        .navigation {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            padding: 16px 20px;
            z-index: 90;
        }
        
        .nav-content {
            display: flex;
            gap: 12px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .nav-btn {
            flex: 1;
            padding: 16px 24px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        
        .nav-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.6s;
        }
        
        .nav-btn:hover::before {
            left: 100%;
        }
        
        .nav-btn:active {
            transform: scale(0.95);
        }
        
        .nav-btn.prev {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            backdrop-filter: blur(10px);
        }
        
        .nav-btn.next {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: var(--shadow-light);
        }
        
        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .nav-btn:disabled::before {
            display: none;
        }
        
        /* Question Panel Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid var(--border);
            z-index: 200;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-heavy);
        }
        
        .sidebar.open {
            right: 0;
        }
        
        .sidebar-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .sidebar-title {
            font-weight: 800;
            font-size: 20px;
        }
        
        .close-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        
        .close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(90deg);
        }
        
        .sidebar-body {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }
        
        .questions-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 32px;
        }
        
        .question-btn {
            background: var(--card-bg);
            border: 2px solid var(--border);
            color: var(--text-secondary);
            width: 48px;
            height: 48px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            position: relative;
        }
        
        .question-btn:hover {
            transform: scale(1.1);
            box-shadow: var(--shadow-light);
        }
        
        .question-btn:active {
            transform: scale(0.95);
        }
        
        .question-btn.current {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: var(--shadow-light);
        }
        
        .question-btn.answered {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border-color: var(--success);
        }
        
        .question-btn.correct {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }
        
        .question-btn.incorrect {
            background: var(--error);
            color: white;
            border-color: var(--error);
        }
        
        .question-btn.flagged::after {
            content: '🚩';
            position: absolute;
            top: -4px;
            right: -4px;
            font-size: 10px;
        }
        
        /* Legend */
        .legend {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 32px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .legend-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        
        .legend-dot.current { background: var(--primary); }
        .legend-dot.answered { background: var(--success); }
        .legend-dot.unattempted { background: var(--text-secondary); }
        .legend-dot.flagged { background: var(--warning); }
        
        /* Action Buttons */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .action-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }
        
        .action-btn.flag {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        
        .action-btn.submit {
            background: linear-gradient(135deg, var(--error), #dc2626);
            color: white;
            box-shadow: var(--shadow-light);
        }
        
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-heavy);
        }
        
        .action-btn:active {
            transform: scale(0.98);
        }
        
        /* Overlay */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 150;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }
        
        .overlay.show {
            opacity: 1;
            visibility: visible;
        }
        
        /* Result Modal */
        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 32px;
            max-width: 90vw;
            width: 480px;
            z-index: 300;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
            box-shadow: var(--shadow-heavy);
            overflow: hidden;
        }
        
        .modal.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }
        
        .modal-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 40px 32px;
            text-align: center;
        }
        
        .modal-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        
        .modal-subtitle {
            opacity: 0.9;
            font-size: 16px;
            font-weight: 500;
        }
        
        .modal-body {
            padding: 32px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            text-align: center;
            padding: 20px 16px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }
        
        .stat-label {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        
        .stat-value {
            color: var(--text);
            font-size: 24px;
            font-weight: 800;
        }
        
        .final-score {
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
            border-radius: 20px;
            padding: 32px;
            text-align: center;
            margin-bottom: 24px;
            box-shadow: var(--shadow-light);
        }
        
        .score-text {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        
        .percentage-text {
            opacity: 0.9;
            font-size: 18px;
            font-weight: 600;
        }
        
        .modal-actions {
            display: flex;
            gap: 12px;
        }
        
        .modal-btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }
        
        .modal-btn.primary {
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary);
            border: 1px solid rgba(99, 102, 241, 0.3);
        }
        
        .modal-btn.success {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        
        .modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-light);
        }
        
        /* Auto-save indicator */
        .auto-save {
            position: fixed;
            top: 80px;
            right: 20px;
            background: var(--success);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            transform: translateX(100px);
            opacity: 0;
            transition: var(--transition);
            z-index: 90;
        }
        
        .auto-save.show {
            transform: translateX(0);
            opacity: 1;
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .header-content {
                padding: 0 4px;

://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The manager said that they had been monitoring the performance of each team member very closely over the last few months, and they would be conducting a review next week."], "correct_answer": 0, "solution": "A) The manager said that they had been monitoring the performance of each team member very closely over the last few months, and they would be conducting a review the following week.\n\n<strong>Rule 1:</strong> Present perfect continuous (<em>have been monitoring</em>) in past reporting changes to <strong>past perfect continuous</strong> (<em>had been monitoring</em>).\n\n<strong>Rule 2:</strong> Future (<em>will</em>) in past reporting becomes <strong>would</strong>.\n\n<strong>Rule 3:</strong> Time reference “next week” changes to “the following week”.\n\nElimination:\n\nA) Correct — all changes applied.\n\nB) Wrong — “have been” not changed to “had been”.\n\nC) Wrong — “will” not changed to “would”.\n\nD) Wrong — “next week” not changed to “the following week”."}, {"id": "160509", "question": "<strong>Sentences of a paragraph are given below in jumbled order. Select the option that arranges the sentences in the correct order to form a meaningful and coherent paragraph.</strong></p> <p><strong>A</strong>. The ubiquity of push notifications, autoplay features, and infinite-scroll interfaces has remodeled the very architecture of attention, turning deliberate focus into a scarce resource.<br> <strong>B.</strong> As platforms compete for eyeballs, designers optimize features that maximize short-term engagement metrics rather than long-term well-being.<br> <strong>C</strong>. This shift has consequences far beyond individual distraction: it reshapes civic discourse, learning habits, and even how we form memories.<br> <strong>D</strong>. If societies are to preserve meaningful concentration, there must be deliberate choices at regulatory, corporate, and personal levels to redesign digital environments.<br> <strong>E.</strong> Historically, technological innovations have altered daily routines and social norms, but the current transformation affects internal cognitive economy itself.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> B A E C D", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> A B E C D", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> E B A C D", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> E A B C D"], "correct_answer": 3, "solution": "<strong>D) E A B C D</strong><br> E starts because it introduces the subject \"technological innovations,\" telling us what has altered social norms. It sets the historical context for the paragraph.<br> A follows E because it provides a specific, current example (\"The ubiquity of push notifications...\") of the \"current transformation\" mentioned in E. It builds directly on E's idea by showing how this transformation manifests.<br> B follows A because it explains the cause (\"As platforms compete for eyeballs...\") behind the phenomenon described in A (\"ubiquity... remodeled the very architecture of attention\"). The subject \"platforms\" and \"designers\" are the agents responsible for creating A's situation.<br> C follows B because it starts with \"This shift,\" which directly refers back to the combined effect described in A (remodeling attention architecture) and its cause in B (platform competition/designer optimization). It then introduces the consequences (\"reshapes civic discourse...\") of this shift.<br> <strong>In Hindi</strong><br> B, A के बाद logically fit होता है क्योंकि यह बताता है कि A में described situation (\"ubiquity... remodeled attention\") क्यों हुई - \"platforms compete\" और \"designers optimize\" के कारण। यह A के effect का cause बताता है।<br> E sentence की शुरुआत करता है क्योंकि यह subject \"technological innovations\" को introduce करता है, जो बताता है कि किसने (what has) social norms को altered किया। यह paragraph का historical context set करता है।<br> A, E के बाद आता है क्योंकि यह E में mentioned \"current transformation\" का specific modern example देता है (\"push notifications, autoplay...\")। यह E के general statement को specific details से expand करता है। <br> B, A के बाद logically fit होता है क्योंकि यह बताता है कि A में described situation (\"ubiquity... remodeled attention\") क्यों हुई - \"platforms compete\" और \"designers optimize\" के कारण। यह A के effect का cause बताता है।<br> C, B के बाद आता है क्योंकि pronoun \"This shift\" A और B में describe किए गए digital attention के परिवर्तन को clearly refer करता है। फिर यह इस shift के broader \"consequences\" को introduce करता है। <br> D sentence को complete करता है क्योंकि यह C में outlined problems के response के रूप में solution (\"deliberate choices... redesign\") को introduce करता है। यह E, A, B, C द्वारा develop किए गए problem का logical conclusion प्रस्तुत करता है।"}, {"id": "160499", "question": "<strong>Direction:</strong> Select the option out of four in which there is a grammatical error.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The committee, after holding several rounds of intense deliberations over the past three weeks and consulting with experts from different universities, has finally decided to postpone the release of the revised syllabus until further notice.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The group of environmental activists, who have been campaigning tirelessly against illegal deforestation in the region for more than five years now, were honoured with a national award for their relentless dedication last month.", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> The chief guest, along with his entire delegation of international diplomats and trade representatives, were invited to participate in the roundtable discussions on global economic policies scheduled for next Tuesday.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The research team, having completed all stages of fieldwork and data collection in the most challenging terrains of the Himalayan region, is now in the process of compiling and analysing the final report for publication."], "correct_answer": 2, "solution": "'were invited' के बदले 'was invited' का प्रयोग होगा क्योंकि 'The chief guest, along with his entire delegation...' में मुख्य subject <strong>'The chief guest'</strong> singular है। 'Along with' phrase subject को plural नहीं बनाता। इसलिए verb को singular होना चाहिए। सही वाक्य— <em>The chief guest, along with his entire delegation of international diplomats and trade representatives, was invited to participate…</em>\n\n• 'was invited' will be used instead of 'were invited' because in the sentence \"The chief guest, along with his entire delegation...\" the main subject <strong>'The chief guest'</strong> is singular. The phrase 'along with' does not make the subject plural. Therefore, the verb should be singular. Correct sentence— <em>The chief guest, along with his entire delegation of international diplomats and trade representatives, was invited to participate…</em>"}, {"id": "160495", "question": "<strong>In each of the following questions, a part of the sentence is printed in bold. Below the sentence are given alternatives to the bold part, at (A), (B), (C), and (D). Choose the alternative which improves the bold part in the context of the sentence. If no improvement is required, your answer is (D).</strong></p> <p>Despite the fact that the committee <strong>has decided to postponed</strong> the implementation of the new policy until the following financial year, several departments have already begun restructuring their operational frameworks in anticipation.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> has decided to postpone", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> decided to postponed", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> has decided to be postponed", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> No improvement"], "correct_answer": 0, "solution": "A) 'has decided to postponed' के बदले 'has decided to postpone' का प्रयोग होगा क्योंकि 'to' के बाद हमेशा Verb का base form (V1) आता है, न कि past form (V2)। यहाँ 'to postponed' गलत है, सही रूप 'to postpone' है।<br> • Instead of 'has decided to postponed', we use 'has decided to postpone' because after 'to', the verb must be in its base form (V1), not in past form (V2). So 'to postponed' is incorrect; correct is 'to postpone'."}, {"id": "160506", "question": "<strong>Direction:</strong> In the following question, each sentence has a blank space. Match the sentences in <strong>Column A</strong> with the most appropriate words in <strong>Column B</strong> so that the overall meaning remains logical and grammatically correct. Each word from Column B can be used only once.</p> <p><strong>Column A (Sentences):</strong></p> <p>1. The scientist’s new theory managed to ___ long-standing beliefs about the origin of the universe.</p> <p>2. The manager had to ___ several employees for their consistent tardiness.</p> <p>3. The charity event was organized to ___ funds for disaster relief.</p> <p>4. The teacher tried to ___ the importance of critical thinking among students.</p> <p><strong>Column B (Words):</strong><br> a. reprimand<br> b. challenge<br> c. instill<br> d. raise", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> 1-a, 2-d, 3-c, 4-b", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> 1-c, 2-b, 3-a, 4-d", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> 1-d, 2-c, 3-b, 4-a", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> 1-b, 2-a, 3-d, 4-c"], "correct_answer": 3, "solution": "D) In sentence 1, the phrase “managed to ___ long-standing beliefs” logically fits with <em>challenge</em> (चुनौती देना), as the new theory questions old ideas.\n\nIn sentence 2, “___ several employees for their consistent tardiness” is correctly completed by <em>reprimand</em> (डांटना / फटकारना), meaning to scold or criticize officially.\n\nIn sentence 3, “organized to ___ funds” fits with <em>raise</em> (पैसा इकट्ठा करना), which means to collect money for a cause.\n\nIn sentence 4, “tried to ___ the importance” aligns with <em>instill</em> (रोपित करना), meaning to gradually introduce an idea or value in someone’s mind. Other combinations would create illogical or grammatically incorrect sentences."}, {"id": "160497", "question": "<strong>The following sentence has been split into four segments. Identify the segment that contains a grammatical error</strong>.</p> <p>Unless you will submit all the required documents along with the duly filled application form before the closing date, your candidature for the scholarship will not be considered by the selection committee.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Unless you will submit all the required documents", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> along with the duly filled application form", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> before the closing date", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> your candidature for the scholarship will not be considered by the selection committee"], "correct_answer": 0, "solution": "Conditional adverbial clause ('Unless…') में <strong>future tense</strong> का प्रयोग नहीं होता, भले ही मुख्य वाक्य में future हो। यहां 'will submit' गलत है; इसके स्थान पर <strong>present simple</strong> 'submit' का प्रयोग होगा।<br> ✅ Correct: Unless you submit all the required documents along with the duly filled application form before the closing date, your candidature for the scholarship will not be considered by the selection committee.\n\n• In conditional adverbial clauses introduced by 'Unless', 'If', 'When', 'Before', 'After', the simple present tense is used to refer to future time, not 'will + verb'."}, {"id": "160496", "question": "<strong>In each of the following questions, a part of the sentence is printed in bold. Below the sentence are given alternatives to the bold part, at (A), (B), (C), and (D). Choose the alternative which improves the bold part in the context of the sentence. If no improvement is required, your answer is (D).</strong></p> <p>By the time the rescue team reached the stranded mountaineers, they <strong>were suffering from extreme dehydration for over thirty hours</strong>, making their condition critical.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> had suffered from extreme dehydration for over thirty hours", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> have been suffering from extreme dehydration for over thirty hours", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> had been suffering from extreme dehydration for over thirty hours", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> No improvement"], "correct_answer": 2, "solution": "C) 'were suffering from extreme dehydration for over thirty hours' के बदले 'had been suffering from extreme dehydration for over thirty hours' का प्रयोग होगा क्योंकि यहाँ 'by the time' + Past Indefinite ('reached') दिया है और इसके पहले की continuous action को व्यक्त करने के लिए Past Perfect Continuous का प्रयोग होता है।<br> • Instead of 'were suffering...', we use 'had been suffering...' because with 'by the time' + Past Indefinite ('reached'), a continuing action that began earlier and was still ongoing up to that point should be expressed in Past Perfect Continuous tense."}, {"id": "160510", "question": "<strong>Arrange into a coherent paragraph:</strong></p> <p><strong>A.</strong> The rapid expansion of megacities often outpaces municipal capacity, creating sprawling informal settlements that supply essential labor and services.<br> <strong>B.</strong> These economies, although precarious and under-regulated, are flexible engines of survival and innovation for millions who migrate in search of opportunity.<br> <strong>C.</strong> Yet, mainstream planning approaches frequently stigmatize or ignore informal workers, which deepens social exclusion and reduces resilience to shocks.<br> <strong>D</strong>. Recognizing the productive role of informal systems can allow policymakers to design inclusive infrastructure, microfinance, and legal frameworks that protect livelihoods.<br> <strong>E</strong>. As cities continue to grow, the tension between formal urban development and informal survival strategies becomes a defining challenge for equitable governance.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> A B E C D", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> B A C E D", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> A E B C D", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> E A B C D"], "correct_answer": 2, "solution": "<strong>C) A E B C D</strong><br> It introduces the subject \"The rapid expansion of megacities\", establishing the main topic of the paragraph - megacity expansion and its effects<br> It directly connects to the subject \"The rapid expansion of megacities\" and its consequence \"sprawling informal settlements\" introduced in A. It uses the connector \"As\" to establish time/context<br> It elaborates on the key concept \"informal survival strategies\" introduced in E. It uses the pronoun \"These\" which clearly refers back to \"informal survival strategies\" in E<br> It presents a contrasting perspective (\"Yet\") on the \"informal workers\" and their situation described in B. The connector \"Yet\" introduces a problem in contrast to the positive aspect \"flexible engines\" in B<br> It presents the solution to the problem described in C (\"stigmatize or ignore\", \"deepens social exclusion\"). The connector \"Recognizing\" introduces a positive action contrasting the neglect in C, and the verb \"can allow\" indicates the possibility of the solution<br> <strong>In Hindi:</strong><br> A: यह subject \"The rapid expansion of megacities\" को introduce करता है, जो paragraph के main topic (मेगासिटीज़ के विस्तार और उसके प्रभाव) को स्थापित करता है। <br> यह A में introduce हुए subject \"The rapid expansion of megacities\" और उसके परिणाम (\"sprawling informal settlements\") से directly जुड़ता है। Connector \"As\" का प्रयोग करता है जो time/context establish करता है<br> यह E में introduce हुए key concept \"informal survival strategies\" को आगे बढ़ाता है और उसकी विस्तृत व्याख्या करता है। Pronoun \"These\" का प्रयोग करता है जो E के \"informal survival strategies\" को clearly refer करता है। <br> यह B में describe किए गए \"informal workers\" और उनकी स्थिति (\"precarious and under-regulated\") पर एक contrasting perspective (\"Yet\") प्रस्तुत करता है। Connector \"Yet\" B के positive aspect (\"flexible engines\") के विपरीत एक problem introduce करता है। <br> यह C में बताई गई problem (\"stigmatize or ignore\", \"deepens social exclusion\") का solution प्रस्तुत करता है। Connector \"Recognizing\" C में बताई गई neglect के विपरीत एक सकारात्मक action को introduce करता है और verb \"can allow\" solution की possibility बताता है।"}, {"id": "160493", "question": "<strong>Choose the most appropriate reported speech form of the following sentence:</strong></p> <p>Rita asked her friend, 'Did you manage to submit the assignment before the deadline yesterday?'", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Rita asked her friend whether she had managed to submit the assignment before the deadline the previous day.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Rita asked her friend whether she had managed to submit the assignment before the deadline yesterday.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Rita asked her friend whether she managed to submit the assignment before the deadline the previous day.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Rita asked her friend whether she managed to submit the assignment before the deadline yesterday."], "correct_answer": 0, "solution": "A) Rita asked her friend whether she had managed to submit the assignment before the deadline the previous day.\n\n<strong>Rule 1:</strong> In reported speech with a past simple question (<em>Did you manage</em>), the tense changes to <strong>past perfect</strong> → <em>had managed</em>.\n\n<strong>Rule 2:</strong> “Yesterday” changes to “the previous day” in indirect speech.\n\n<strong>Rule 3:</strong> Yes/No questions change to <strong>if/whether</strong> format, and question order becomes statement order (subject before verb).\n\nElimination:\n\nA) Correct — <em>Did → had managed</em>, <em>yesterday → the previous day</em>.\n\nB) Wrong — “yesterday” not changed.\n\nC) Wrong — tense not changed to past perfect.\n\nD) Wrong — tense and time not changed."}, {"id": "160505", "question": "<strong>Direction:</strong> In the following paragraph, there are three blanks that must be filled with <strong>verbs</strong> in the same grammatical form. Select the option that arranges the correct words in the correct order.</p> <p>In the wake of the financial crisis, the government sought to ___ economic growth by introducing new policies, to ___ investor confidence through transparent reforms, and to ___ innovation in key industries by offering research grants and tax incentives. The combined effort was aimed at creating a stable environment where businesses could flourish, capital could circulate freely, and technology could advance without unnecessary barriers.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> accelerate – restore – foster", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> foster – accelerate – restore", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> restore – foster – accelerate", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> accelerate – foster – restore"], "correct_answer": 0, "solution": "A) accelerate – restore – foster\n\nThe verbs must be in their base form to match the infinitive structure \"to + verb\" in all three blanks. <em>Accelerate</em> (तेज़ करना) fits with “economic growth” as the government wants to speed it up; <em>restore</em> (पुनःस्थापित करना) is correct with “investor confidence” as it implies regaining trust; <em>foster</em> (प्रोत्साहित करना) is appropriate for “innovation” because it means to encourage development. Other options misplace the verbs, creating illogical or awkward meaning in context."}, {"id": "160507", "question": "<strong>In the following sentence, a word is given in brackets. Select the appropriate word from the options to fill in the blank so that it is the closest synonym of the word given in brackets</strong></p> <p>She maintained a ____________________ (TEMPERATE) tone throughout the debate, never raising her voice or losing her composure.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Brittle", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Moderate", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Mottled", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Zealous"], "correct_answer": 1, "solution": "<strong>B) Temperate (adjective) - </strong>showing moderation or self-restraint. संयमी\n\n<strong>Synonym; Moderate</strong> (adjective) – Balanced, avoiding extremes. संतुलित / मध्यम\n\n<strong>Brittle </strong>– Easily broken. भंगुर\n\n<strong>Mottled</strong> – Marked with spots or smears of color. चितकबरा\n\n<strong>Zealous</strong> – Intensely passionate. उत्साही"}, {"id": "160498", "question": "<strong>The following sentence has been split into four segments. Identify the segment that contains a grammatical error</strong>.</p> <p>He has been working tirelessly on the project since the past six months, ensuring that every aspect meets the quality standards set by the client.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> He has been working tirelessly on the project", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> since the past six months", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> ensuring that every aspect meets the quality standards", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> set by the client"], "correct_answer": 1, "solution": "B) 'Since' समय की शुरुआत (point of time) बताता है, जबकि 'past six months' अवधि (period of time) है। यहां <strong>for the past six months</strong> सही होगा। 'Since' + duration गलत है; 'Since' के बाद exact starting point (जैसे since January, since 2020) आता है।<br> ✅ Correct: He has been working tirelessly on the project for the past six months, ensuring that every aspect meets the quality standards set by the client.\n\n• 'Since' is used with a specific point in time, whereas 'for' is used with a duration."}, {"id": "160508", "question": "<strong>Read the following description carefully and choose the correct one-word substitution of 'Something' that best describes the condition being portrayed</strong></p> <p>Someone who engages in the practice of lending money to individuals or businesses at excessively and unreasonably high rates of interest—often in an illegal, unethical, and exploitative manner, typically targeting those in urgent need of funds—is known as what?", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Banker", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Creditor", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Usurer", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Investor"], "correct_answer": 2, "solution": "C) <strong>Usurer</strong> (noun) – A person who lends money at unreasonably high rates of interest. सूदखोर / अत्यधिक ब्याज पर धन देने वाला व्यक्ति\n\n<strong>Banker</strong> (noun) – A person who manages or owns a bank. बैंकर\n\n<strong>Creditor</strong> (noun) – A person to whom money is owed. लेनदार\n\n<strong>Investor </strong>(noun) – A person who puts money into a business to earn profit. निवेशक"}, {"id": "160492", "question": "<strong>Choose the most appropriate reported speech form of the following sentence:</strong></p> <p>The chief said to the workers, 'You must complete this project within the next three weeks, or the company will have to impose penalties.'", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The chief told the workers that they had to complete that project within the next three weeks, or the company would have to impose penalties.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The chief told the workers that they must complete that project within the following three weeks, or the company would have to impose penalties.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The chief told the workers that they must complete that project within the next three weeks, or the company would have to impose penalties.", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> The chief told the workers that they had to complete that project within the following three weeks, or the company would have to impose penalties."], "correct_answer": 3, "solution": "D) The chief told the workers that they had to complete that project within the following three weeks, or the company would have to impose penalties.\n\n<strong>Rule 1:</strong> In <strong>indirect speech</strong>, when the reporting verb (\"said\") is in the past tense, modal verbs like <strong>must</strong> change to <strong>had to</strong>, unless the meaning is about universal truth or necessity without time reference. Here, it is an instruction tied to a specific time → so <strong>must → had to</strong>.\n\n<strong>Rule 2:</strong> Time expressions change — <strong>next</strong> becomes <strong>following</strong> (or “coming”) in reported speech.\n\n<strong>Rule 3:</strong> The comma after <em>or</em> separates two clauses; the second clause “the company will have to impose penalties” becomes <strong>would have to impose penalties</strong> (future-in-past).\n\nElimination:\n\nA) Wrong — “next” not changed to “following”.\n\nB) Wrong — “must” not changed to “had to” (time-specific instruction).\n\nC) Wrong — keeps “must” and “next” incorrectly.\n\n<strong>D) Correct</strong> — All changes applied: <em>must → had to</em>, <em>next → following</em>, <em>will → would</em>."}, {"id": "160511", "question": "<strong>Arrange into a coherent paragraph:<br> A. </strong>When complex scientific findings are reduced to simplistic headlines or misinterpreted through partisan lenses, public trust can erode quickly.<br> <strong>B.</strong> Effective science communication therefore requires not only accurate information but also transparency about uncertainty, methodology, and value judgments.<br> <strong>C</strong>. The spreading of partial or sensationalized reports — amplified by social media — creates fertile ground for skepticism and polarized responses.<br> <strong>D. </strong>Rebuilding confidence involves sustained engagement, two-way dialogue with communities, and institutional practices that privilege openness over rhetorical persuasion.<br> <strong>E.</strong> Scientists and communicators must acknowledge that facts alone rarely change minds; context, narrative, and listening are equally important.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> A C E B D", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> C A E B D", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> C E A B D", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> E A C B D"], "correct_answer": 1, "solution": "<strong>B) C A E B D</strong><br> C starts the paragraph by introducing the subject \"The spreading of partial or sensationalized reports\", which establishes the core problem (amplified by social media).\n\nA follows C because it begins with the subordinating conjunction \"When\", linking directly to C’s subject. It expands the consequence: \"When findings are reduced... trust erodes\" (A) is the direct result of \"spreading reports\" (C).\n\nE comes after A as it introduces the new subject \"Scientists and communicators\", who must respond to A’s consequence (eroded trust). The verb \"must acknowledge\" (E) addresses the problem defined in A.\n\nB follows E through the transitional adverb \"therefore\", showing B’s requirements are the logical outcome of E’s acknowledgment. E’s focus on \"context, narrative, listening\" (E) leads to B’s \"transparency\" (B).\n\nD concludes with the gerund \"Rebuilding confidence\", which is the next step after B’s requirements. The verb \"involves\" (D) details actionable solutions to B’s call for transparency.<br> <strong>In Hindi:</strong>\n\nC पहले आता है क्योंकि यह subject \"The spreading of reports\" introduce करता है, जो paragraph का central issue (मुख्य समस्या) सेट करता है।\n\nA, C के बाद आता है क्योंकि यह conjunction \"When\" से शुरू होता है, जो C की situation को expand करता है और उसका result (नतीजा) बताता है: \"जब जटिल निष्कर्षों को सरल बनाया जाता है, तो public trust कम हो जाती है\"।\n\nE, A के बाद fit होता है क्योंकि यह new subject \"Scientists and communicators\" लाता है, जो A की problem को address करते हैं। Verb \"must acknowledge\" E को A से जोड़ता है, क्योंकि eroded trust (A) के बाद experts की जिम्मेदारी (E) आती है।\n\nB, E के बाद आता है adverb \"therefore\" की वजह से, जो E की बात (facts + context की जरूरत) का solution (समाधान) देता है: \"इसलिए effective communication में transparency जरूरी है\"।\n\nD अंत में आता है क्योंकि यह gerund \"Rebuilding confidence\" से शुरू होता है, जो B की requirements के बाद का action (कार्य) दिखाता है। Verb \"involves\" D को B के साथ grammatically complete करता है।"}, {"id": "160500", "question": "<strong>Comprehension:</strong></p> <p><strong>In the following passage, some words have been deleted. Read the passage carefully and select the most appropriate option to fill in each blank.</strong></p> <p>Amidst widespread expectation and hope, the ______ (1) _____Tamil Nadu State Education Policy 2025 has been _____ (2)_______ by the government, only for school education, and in a ______(3)_____manner. Being the first of its kind in terms of ____ (4)____ inferior content and structure, the policy document lacks the body of knowledge that constitutes a public policy, as well as the universally accepted conventions, customs, and norms that are historically followed in policy formulation.<br> The irony is that, in a transparent digital world, the policymakers boldly claim that this policy does not reflect NEP 2020, even though the themes and ideas on which its recommendations are based are truly the essence of NEP 2020. Both are similar in their _____ (5)_____on the centralisation of curriculum, teaching, and learning, and end-to-end control of educational functions, right from curriculum design through instruction to examination.</p> <p><strong>Select the most appropriate option to fill in blank number 1.</strong>", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> short-sighted", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> much-hyped", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> deep-rooted", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> high-handed"], "correct_answer": 1, "solution": "No solution available"}, {"id": "160501", "question": "<strong>Comprehension:</strong></p> <p><strong>In the following passage, some words have been deleted. Read the passage carefully and select the most appropriate option to fill in each blank.</strong></p> <p>Amidst widespread expectation and hope, the ______ (1) _____Tamil Nadu State Education Policy 2025 has been _____ (2)_______ by the government, only for school education, and in a ______(3)_____manner. Being the first of its kind in terms of ____ (4)____ inferior content and structure, the policy document lacks the body of knowledge that constitutes a public policy, as well as the universally accepted conventions, customs, and norms that are historically followed in policy formulation.<br> The irony is that, in a transparent digital world, the policymakers boldly claim that this policy does not reflect NEP 2020, even though the themes and ideas on which its recommendations are based are truly the essence of NEP 2020. Both are similar in their _____ (5)_____on the centralisation of curriculum, teaching, and learning, and end-to-end control of educational functions, right from curriculum design through instruction to examination.</p> <p><strong>Select the most appropriate option to fill in blank number 2.</strong>", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> unveiled", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> concealed", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> veiled", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> shrouded"], "correct_answer": 0, "solution": "No solution available"}, {"id": "160502", "question": "<strong>Comprehension:</strong></p> <p><strong>In the following passage, some words have been deleted. Read the passage carefully and select the most appropriate option to fill in each blank.</strong></p> <p>Amidst widespread expectation and hope, the ______ (1) _____Tamil Nadu State Education Policy 2025 has been _____ (2)_______ by the government, only for school education, and in a ______(3)_____manner. Being the first of its kind in terms of ____ (4)____ inferior content and structure, the policy document lacks the body of knowledge that constitutes a public policy, as well as the universally accepted conventions, customs, and norms that are historically followed in policy formulation.<br> The irony is that, in a transparent digital world, the policymakers boldly claim that this policy does not reflect NEP 2020, even though the themes and ideas on which its recommendations are based are truly the essence of NEP 2020. Both are similar in their ____
