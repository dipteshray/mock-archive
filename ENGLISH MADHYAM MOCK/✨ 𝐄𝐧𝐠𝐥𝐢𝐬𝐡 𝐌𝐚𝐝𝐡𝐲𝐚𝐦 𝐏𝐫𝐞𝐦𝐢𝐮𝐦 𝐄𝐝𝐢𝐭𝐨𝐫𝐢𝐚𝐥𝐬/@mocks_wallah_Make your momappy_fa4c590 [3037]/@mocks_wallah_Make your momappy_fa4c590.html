<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6366f1">
    <title>devgagan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #06b6d4;
            
            --glass-bg: rgba(255, 255, 255, 0.95);  /* Changed from 0.25 to 0.95 */
            --glass-border: rgba(255, 255, 255, 0.8);  /* Changed from 0.18 to 0.8 */
            --shadow-light: 0 8px 32px rgba(31, 38, 135, 0.37);
            --shadow-heavy: 0 20px 60px rgba(0, 0, 0, 0.3);
            
            --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --bounce: cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        
[data-theme="light"] {
    --bg: #ffffff;  /* Changed from gradient to solid white */
    --card-bg: #ffffff;  /* Changed from transparent to solid white */
    --text: #1a202c;
    --text-secondary: #4a5568;
    --border: rgba(0, 0, 0, 0.1);  /* Changed to darker border for contrast */
    --nav-bg: #ffffff;  /* Changed from transparent to solid white */
}

[data-theme="dark"] {
    --bg: #1a1a2e;  /* Changed from gradient to solid dark */
    --card-bg: #16213e;  /* Changed from transparent to solid dark */
    --text: #f7fafc;
    --text-secondary: #a0aec0;
    --border: rgba(255, 255, 255, 0.1);
    --nav-bg: #0c0c0c;  /* Changed from transparent to solid dark */
}
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--bg);  /* Now just using the solid color */
    z-index: -1;
}
        
        /* Floating particles animation */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: float 6s infinite ease-in-out;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.7; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 0.3; }
        }
        
        /* Header with glassmorphism */
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 16px 20px;
            z-index: 100;
            transition: var(--transition);
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .menu-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            font-size: 18px;
        }
        
        .menu-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-light);
        }
        
        .menu-btn:active {
            transform: scale(0.95);
        }
        
        .logo {
            font-weight: 800;
            font-size: 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        
        [data-theme="dark"] .logo {
    background: none;
    -webkit-text-fill-color: white; /* White text in dark mode */
    color: white; /* Fallback */
}
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            font-size: 20px;
        }
        
        .theme-toggle:hover {
            transform: rotate(180deg) scale(1.1);
            box-shadow: var(--shadow-light);
        }
        
        /* Advanced Timer */
        .timer-container {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .timer {
            background: linear-gradient(135deg, var(--error), #dc2626);
            color: white;
            padding: 12px 16px;
            border-radius: 16px;
            font-family: 'Inter', monospace;
            font-weight: 600;
            font-size: 14px;
            box-shadow: var(--shadow-light);
            position: relative;
            overflow: hidden;
        }
        
        .timer.warning {
            animation: pulse 1s infinite;
        }
        
        .timer.critical {
            animation: shake 0.5s infinite;
            background: linear-gradient(135deg, #dc2626, #991b1b);
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
        }
        
        .progress-ring {
            width: 40px;
            height: 40px;
            transform: rotate(-90deg);
        }
        
        .progress-circle {
            fill: none;
            stroke: rgba(255, 255, 255, 0.3);
            stroke-width: 3;
        }
        
        .progress-circle.progress {
            stroke: var(--primary);
            stroke-linecap: round;
            transition: stroke-dashoffset 0.3s ease;
        }
        
        /* Main Content */
        .main {
            margin: 80px 0 100px;
            padding: 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .question-container {
    background: var(--card-bg);  /* Now uses solid color */
    /* Remove or reduce blur effect */
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 32px;
    box-shadow: var(--shadow-heavy);
    position: relative;
    overflow: hidden;
    transition: var(--transition);
}
        .question-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--info));
            background-size: 200% 100%;
            animation: gradient-flow 3s linear infinite;
        }
        
        @keyframes gradient-flow {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .question-number {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 12px 20px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: var(--shadow-light);
            position: relative;
        }
        
        .question-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }
        
        .question-progress {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
        }
        
        .question-marks {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 600;
        }
        
        .question-text {
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 32px;
            color: var(--text);
            font-weight: 500;
        }
        
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .option {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 20px 24px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            font-size: 16px;
            font-weight: 500;
            color: var(--text);
            overflow: hidden;
        }
        
        .option::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s;
        }
        
        .option:hover::before {
            left: 100%;
        }
        
        .option:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: var(--shadow-light);
        }
        
        .option:active {
            transform: scale(0.98);
        }

        .menu-btn, .theme-toggle, .nav-btn.prev, .action-btn.flag {
    background: var(--card-bg);  /* Solid background */
    backdrop-filter: none;  /* Remove blur */
}

.sidebar {
    background: var(--card-bg);  /* Solid background */
    backdrop-filter: none;  /* Remove blur */
}
        
        .option.selected {
            background: rgba(99, 102, 241, 0.15);
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-light);
        }
        
        .option.correct {
            background: rgba(16, 185, 129, 0.15);
            border-color: var(--success);
            color: var(--success);
        }
        
        .option.incorrect {
            background: rgba(239, 68, 68, 0.15);
            border-color: var(--error);
            color: var(--error);
        }
        
        .option.disabled {
            background: rgba(160, 174, 192, 0.1);
            border-color: var(--text-secondary);
            color: var(--text-secondary);
            cursor: not-allowed;
        }
        
        .option-indicator {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }
        
        .option.selected .option-indicator {
            background: var(--primary);
            color: white;
        }
        
        .option.correct .option-indicator {
            background: var(--success);
            color: white;
        }
        
        .option.incorrect .option-indicator {
            background: var(--error);
            color: white;
        }
        
        .option:not(.selected):not(.correct):not(.incorrect) .option-indicator {
            border: 2px solid var(--border);
        }
        
        /* Solution Panel */
        .solution-panel {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(245, 158, 11, 0.05));
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 20px;
            padding: 24px;
            margin-top: 24px;
            backdrop-filter: blur(10px);
            transform: translateY(20px);
            opacity: 0;
            transition: var(--transition);
        }
        
        .solution-panel.show {
            transform: translateY(0);
            opacity: 1;
        }
        
        .solution-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            color: var(--warning);
            font-weight: 700;
        }
        
        .solution-content {
            color: var(--text);
            line-height: 1.6;
            font-size: 15px;
        }
        
        /* Navigation */
        .navigation {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            padding: 16px 20px;
            z-index: 90;
        }
        
        .nav-content {
            display: flex;
            gap: 12px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .nav-btn {
            flex: 1;
            padding: 16px 24px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        
        .nav-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.6s;
        }
        
        .nav-btn:hover::before {
            left: 100%;
        }
        
        .nav-btn:active {
            transform: scale(0.95);
        }
        
        .nav-btn.prev {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            backdrop-filter: blur(10px);
        }
        
        .nav-btn.next {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: var(--shadow-light);
        }
        
        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .nav-btn:disabled::before {
            display: none;
        }
        
        /* Question Panel Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid var(--border);
            z-index: 200;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-heavy);
        }
        
        .sidebar.open {
            right: 0;
        }
        
        .sidebar-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .sidebar-title {
            font-weight: 800;
            font-size: 20px;
        }
        
        .close-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        
        .close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(90deg);
        }
        
        .sidebar-body {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }
        
        .questions-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 32px;
        }
        
        .question-btn {
            background: var(--card-bg);
            border: 2px solid var(--border);
            color: var(--text-secondary);
            width: 48px;
            height: 48px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            position: relative;
        }
        
        .question-btn:hover {
            transform: scale(1.1);
            box-shadow: var(--shadow-light);
        }
        
        .question-btn:active {
            transform: scale(0.95);
        }
        
        .question-btn.current {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: var(--shadow-light);
        }
        
        .question-btn.answered {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border-color: var(--success);
        }
        
        .question-btn.correct {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }
        
        .question-btn.incorrect {
            background: var(--error);
            color: white;
            border-color: var(--error);
        }
        
        .question-btn.flagged::after {
            content: '🚩';
            position: absolute;
            top: -4px;
            right: -4px;
            font-size: 10px;
        }
        
        /* Legend */
        .legend {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 32px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .legend-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        
        .legend-dot.current { background: var(--primary); }
        .legend-dot.answered { background: var(--success); }
        .legend-dot.unattempted { background: var(--text-secondary); }
        .legend-dot.flagged { background: var(--warning); }
        
        /* Action Buttons */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .action-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }
        
        .action-btn.flag {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        
        .action-btn.submit {
            background: linear-gradient(135deg, var(--error), #dc2626);
            color: white;
            box-shadow: var(--shadow-light);
        }
        
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-heavy);
        }
        
        .action-btn:active {
            transform: scale(0.98);
        }
        
        /* Overlay */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 150;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }
        
        .overlay.show {
            opacity: 1;
            visibility: visible;
        }
        
        /* Result Modal */
        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 32px;
            max-width: 90vw;
            width: 480px;
            z-index: 300;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
            box-shadow: var(--shadow-heavy);
            overflow: hidden;
        }
        
        .modal.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }
        
        .modal-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 40px 32px;
            text-align: center;
        }
        
        .modal-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        
        .modal-subtitle {
            opacity: 0.9;
            font-size: 16px;
            font-weight: 500;
        }
        
        .modal-body {
            padding: 32px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            text-align: center;
            padding: 20px 16px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }
        
        .stat-label {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        
        .stat-value {
            color: var(--text);
            font-size: 24px;
            font-weight: 800;
        }
        
        .final-score {
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
            border-radius: 20px;
            padding: 32px;
            text-align: center;
            margin-bottom: 24px;
            box-shadow: var(--shadow-light);
        }
        
        .score-text {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        
        .percentage-text {
            opacity: 0.9;
            font-size: 18px;
            font-weight: 600;
        }
        
        .modal-actions {
            display: flex;
            gap: 12px;
        }
        
        .modal-btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }
        
        .modal-btn.primary {
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary);
            border: 1px solid rgba(99, 102, 241, 0.3);
        }
        
        .modal-btn.success {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        
        .modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-light);
        }
        
        /* Auto-save indicator */
        .auto-save {
            position: fixed;
            top: 80px;
            right: 20px;
            background: var(--success);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            transform: translateX(100px);
            opacity: 0;
            transition: var(--transition);
            z-index: 90;
        }
        
        .auto-save.show {
            transform: translateX(0);
            opacity: 1;
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .header-content {
                padding: 0 4px;

<body data-theme="light">
    <!-- Floating particles background -->
    <div class="particles" id="particles"></div>
    
    <!-- Auto-save indicator -->
    <div class="auto-save" id="autoSave">
        ✓ Auto-saved
    </div>
    
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="header-left">
                <button class="menu-btn" onclick="toggleSidebar()">
                    ☰
                </button>
                <div class="logo">Mocks Wallah</div>
            </div>
            <div class="header-right">
                <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn" aria-label="Toggle theme">
                    🌙
                </button>
                <div class="timer-container">
                    <svg class="progress-ring" width="40" height="40">
                        <circle class="progress-circle" cx="20" cy="20" r="18"></circle>
                        <circle class="progress-circle progress" cx="20" cy="20" r="18" 
                                stroke-dasharray="113.1" stroke-dashoffset="0" id="progressCircle"></circle>
                    </svg>
                    <div class="timer" id="timer">20:00</div>
                </div>
            </div>
        </div>
    </header>
    
    <!-- Main Content -->
    <main class="main">
        <div class="question-container" id="questionContainer">
            <div class="question-header">
                <div class="question-number" id="questionNumber">Q1</div>
                <div class="question-info">
                    <div class="question-progress" id="questionProgress">1 of 25</div>
                    <div class="question-marks">+1.0 / -0.25</div>
                </div>
            </div>
            <div class="question-text" id="questionText"></div>
            <div class="options-container" id="optionsContainer"></div>
            <div class="solution-panel" id="solutionPanel">
                <div class="solution-header">
                    <span>💡</span>
                    <span>Solution</span>
                </div>
                <div class="solution-content" id="solutionContent"></div>
            </div>
        </div>
    </main>
    
    <!-- Navigation -->
    <nav class="navigation">
        <div class="nav-content">
            <button class="nav-btn prev" id="prevBtn" onclick="previousQuestion()" disabled>
                ← Previous
            </button>
            <button class="nav-btn next" id="nextBtn" onclick="nextQuestion()">
                Next →
            </button>
        </div>
    </nav>
    
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-title">Question Panel</div>
            <button class="close-btn" onclick="closeSidebar()" aria-label="Close panel">×</button>
        </div>

            <div class="questions-grid" id="questionsGrid"></div>
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-dot current"></div>

                </div>
                <div class="legend-item">
                    <div class="legend-dot answered"></div>
                    <span>Answered</span>
                </div>
                <div class="legend-item">
                    <div class="legend-dot unattempted"></div>
                    <span>Unattempted</span>
                </div>
                <div class="legend-item">
                    <div class="legend-dot flagged"></div>
                    <span>Flagged</span>
                </div>
            </div>
            <div class="action-buttons">
                <button class="action-btn flag" onclick="toggleFlag()" id="flagBtn">
                    🚩 Flag Question
                </button>
                <button class="action-btn submit" onclick="submitTest()">
                    Submit Test
                </button>
            </div>
        </div>
    </aside>
    
    <!-- Overlay -->
    <div class="overlay" id="overlay" onclick="closeSidebar()"></div>
    
    <!-- Result Modal -->

    <script>
        // Core Variables
        const questions = [{"id": "148009", "question": "<strong>Comprehension</strong>:</p> <p>Our mothers helped create a strong foundation for our lives through our early years. Our mothers raise us with affection, protecting us from all trials and tribulations of life. We try to make our mothers happy on Mother's Day through small acts. But what truly makes our mothers happy is when their children lead peaceful and calm lives, when they are so glad, when their relationships are well, when they are prosperous, and are focused in the right direction. Yet, instead of being grateful to the Almighty, we have become enamoured with gifts of the Giver. In the process, we forget the Divine.</p> <p>Our soul, which gravitated away from God aeons ago, has been trapped in the wheel of transmigration, cycling through creation and yearning to return to the Source.</p> <p>On Mother's Day, we should remember, recognise and be grateful to our spiritual master. Just as a mother gives her child gains in the physical world, a spiritual master helps the disciple attain gains in the spiritual world. When we come to a spiritual master, they help us awaken to oneness of the Almighty's creation, exhorting us to live and serve selflessly. When we do so, we find that life becomes harmonious, calm and peaceful.</p> <p><strong>What is the tone of the passage?</strong>", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Reflective", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Sarcastic", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Indifferent", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Humorous"], "correct_answer": 0, "solution": "No solution available"}, {"id": "148010", "question": "<strong>Comprehension</strong>:</p> <p>Our mothers helped create a strong foundation for our lives through our early years. Our mothers raise us with affection, protecting us from all trials and tribulations of life. We try to make our mothers happy on Mother's Day through small acts. But what truly makes our mothers happy is when their children lead peaceful and calm lives, when they are so glad, when their relationships are well, when they are prosperous, and are focused in the right direction. Yet, instead of being grateful to the Almighty, we have become enamoured with gifts of the Giver. In the process, we forget the Divine.</p> <p>Our soul, which gravitated away from God aeons ago, has been trapped in the wheel of transmigration, cycling through creation and yearning to return to the Source.</p> <p>On Mother's Day, we should remember, recognise and be grateful to our spiritual master. Just as a mother gives her child gains in the physical world, a spiritual master helps the disciple attain gains in the spiritual world. When we come to a spiritual master, they help us awaken to oneness of the Almighty's creation, exhorting us to live and serve selflessly. When we do so, we find that life becomes harmonious, calm and peaceful.</p> <p><strong>What can be inferred as the author’s perspective on modern Mother's Day celebrations?</strong>", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> They are sufficient to express our gratitude to mothers", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> They distract us from expressing true spiritual gratitude", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> They are commercialized and outdated", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> They should replace spiritual practices"], "correct_answer": 1, "solution": "No solution available"}, {"id": "148011", "question": "<strong>Comprehension</strong>:</p> <p>Our mothers helped create a strong foundation for our lives through our early years. Our mothers raise us with affection, protecting us from all trials and tribulations of life. We try to make our mothers happy on Mother's Day through small acts. But what truly makes our mothers happy is when their children lead peaceful and calm lives, when they are so glad, when their relationships are well, when they are prosperous, and are focused in the right direction. Yet, instead of being grateful to the Almighty, we have become enamoured with gifts of the Giver. In the process, we forget the Divine.</p> <p>Our soul, which gravitated away from God aeons ago, has been trapped in the wheel of transmigration, cycling through creation and yearning to return to the Source.</p> <p>On Mother's Day, we should remember, recognise and be grateful to our spiritual master. Just as a mother gives her child gains in the physical world, a spiritual master helps the disciple attain gains in the spiritual world. When we come to a spiritual master, they help us awaken to oneness of the Almighty's creation, exhorting us to live and serve selflessly. When we do so, we find that life becomes harmonious, calm and peaceful.</p> <p><strong>What role does the spiritual master play according to the passage?</strong>", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> They help people become materially successful", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> They teach rituals and religious customs", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> They awaken the disciple to divine oneness and selfless living", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> They celebrate Mother's Day through divine ceremonies"], "correct_answer": 2, "solution": "No solution available"}, {"id": "148012", "question": "<strong>Comprehension</strong>:</p> <p>Our mothers helped create a strong foundation for our lives through our early years. Our mothers raise us with affection, protecting us from all trials and tribulations of life. We try to make our mothers happy on Mother's Day through small acts. But what truly makes our mothers happy is when their children lead peaceful and calm lives, when they are so glad, when their relationships are well, when they are prosperous, and are focused in the right direction. Yet, instead of being grateful to the Almighty, we have become enamoured with gifts of the Giver. In the process, we forget the Divine.</p> <p>Our soul, which gravitated away from God aeons ago, has been trapped in the wheel of transmigration, cycling through creation and yearning to return to the Source.</p> <p>On Mother's Day, we should remember, recognise and be grateful to our spiritual master. Just as a mother gives her child gains in the physical world, a spiritual master helps the disciple attain gains in the spiritual world. When we come to a spiritual master, they help us awaken to oneness of the Almighty's creation, exhorting us to live and serve selflessly. When we do so, we find that life becomes harmonious, calm and peaceful.</p> <p><strong>Which of the following statements is true according to the passage?</strong>", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Children should only show love through expensive gifts on Mother’s Day", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The soul is forever content in the material world", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> A mother and a spiritual master both guide us in different realms", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Celebrating Mother's Day spiritually is unnecessary"], "correct_answer": 2, "solution": "No solution available"}, {"id": "148013", "question": "<strong>Comprehension</strong>:</p> <p>Our mothers helped create a strong foundation for our lives through our early years. Our mothers raise us with affection, protecting us from all trials and tribulations of life. We try to make our mothers happy on Mother's Day through small acts. But what truly makes our mothers happy is when their children lead peaceful and calm lives, when they are so glad, when their relationships are well, when they are prosperous, and are focused in the right direction. Yet, instead of being grateful to the Almighty, we have become enamoured with gifts of the Giver. In the process, we forget the Divine.</p> <p>Our soul, which gravitated away from God aeons ago, has been trapped in the wheel of transmigration, cycling through creation and yearning to return to the Source.</p> <p>On Mother's Day, we should remember, recognise and be grateful to our spiritual master. Just as a mother gives her child gains in the physical world, a spiritual master helps the disciple attain gains in the spiritual world. When we come to a spiritual master, they help us awaken to oneness of the Almighty's creation, exhorting us to live and serve selflessly. When we do so, we find that life becomes harmonious, calm and peaceful.</p> <p><strong>What is the main theme of the passage?</strong>", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Celebrating Mother’s Day with lavish gifts", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Importance of material wealth for happiness", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Role of mothers and spiritual masters in guiding life towards peace and gratitude", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Children should live independently without relying on others"], "correct_answer": 2, "solution": "No solution available"}, {"id": "148014", "question": "<strong>Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the correct order to form a meaningful and coherent paragraph.</strong><br> <strong>A) </strong>Ben was eating an apple, and seemed to be in high spirits.<br> <strong>B) </strong>Ben Rogers came into view presently, the very boy whose ridicule he had been reading.<br> <strong>C) </strong>Tom went on dipping the brush into the paint and whitewashing the fence, and paid no attention to Ben.<br> <strong>D)</strong> Tom took up his brush and calmly resumed his work.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> DCBA", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> CDBA", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> CBAD", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> DBAC"], "correct_answer": 3, "solution": "D) DBAC\n\nD. Tom took up his brush and calmly resumed his work.\n\nThis sentence sets the scene, showing Tom starting or resuming his work of whitewashing the fence. It's the most logical starting point for the paragraph.\n\nB. Ben Rogers came into view presently, the very boy whose ridicule he had been reading.\n\nIn this sentence, Ben Rogers appears on the scene, introducing a new character and setting up the interaction between Tom and Ben.\n\nA. Ben was eating an apple, and seemed to be in high spirits.\n\nThis sentence provides more details about Ben, including his appearance and mood, which is essential to establish before the conversation between the two characters begins.\n\nC. Tom went on dipping the brush into the paint and whitewashing the fence, and paid no attention to Ben.\n\nThis final sentence shows Tom's reaction to Ben's presence, which is to continue working and ignore him."}, {"id": "148015", "question": "<strong>Select the most appropriate ANTONYM of the underlined word in the given sentence.</strong></p> <p>Coffee was too <ins><strong>hot</strong></ins>; it burnt my tongue.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Balmy", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Scorching", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Frigid", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Subtle"], "correct_answer": 2, "solution": "C) <strong>Hot</strong> (adjective) – Having a high temperature, warm, heated. गरम\n\nAntonym: <strong>Frigid</strong> (adjective) – Very cold, icy, freezing. कठोर ठंडा\n\n<strong>Balmy</strong> (adjective) – Pleasantly warm, mild, temperate. सुहावना गर्म\n\n<strong>Scorching</strong> (adjective) – Extremely hot, burning, blazing. झुलसा देने वाला गर्म\n\n<strong>Subtle</strong> (adjective) – Delicate, not obvious, understated. सूक्ष्म"}, {"id": "148016", "question": "<strong>Select the option that can be used as a one-word substitute for the given group of words.</strong></p> <p>Much more than usual or expected", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Subordinate", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Mordancy", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Exceeding", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Ordinate"], "correct_answer": 2, "solution": "C) <strong>Exceeding</strong> (adjective) – Much more than usual or expected. अत्यधिक\n\n<strong>Subordinate</strong> (noun) – A person under the authority or control of another within an organization. अधीनस्थ\n\n<strong>Mordancy</strong> (noun) – A sharply critical or bitter quality. कटुता\n\n<strong>Ordinate</strong> (noun) – The y-coordinate in a system of coordinates, especially in geometry. निर्देशांक"}, {"id": "148017", "question": "<strong>Select the most appropriate synonym of the underlined word in the given sentence.</strong></p> <p>A period of free outdoor play can provide a very necessary <ins><strong>respite</strong> </ins>from the hustle and bustle of the day.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Commencement", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Continuation", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Progression", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Break"], "correct_answer": 3, "solution": "D) <strong>Respite</strong> (noun) – A short period of rest or relief from something difficult or unpleasant. विश्राम\n\nSynonym: <strong>Break</strong> (noun) – An interruption or pause in an activity, rest. अंतराल\n\n<strong>Commencement</strong> (noun) – The beginning or start of something. आरंभ\n\n<strong>Continuation</strong> (noun) – The action of carrying something on over a period of time. निरंतरता\n\n<strong>Progression</strong> (noun) – The process of developing or moving gradually towards a more advanced state. प्रगति"}, {"id": "148018", "question": "<strong>Select the most appropriate option to substitute the underlined segment in the given sentence.</strong></p> <p>Do you know<ins> <strong>where does she reside ?</strong></ins>", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> where do she reside?", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> where she resides?", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> where she reside?", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> where does she resides?"], "correct_answer": 1, "solution": "B) where does she reside?' के बदले <strong>'where she resides?</strong>' का use होगा क्योंकि इस वाक्य में एक embedded question है। इसमें main clause 'Do you know' पहले से ही interrogative है, इसलिए dependent clause 'where she resides' statement के रूप में होगी और इसमें auxiliary verb ‘does’ का प्रयोग नहीं होगा। जैसे— Do you know where she resides?\n\n'where she resides?' will be used instead of 'where does she reside?' because this sentence contains an embedded question. The main clause 'Do you know' is already interrogative, so the dependent clause 'where she resides' will be in the statement form, and the auxiliary verb 'does' will not be used. Like— Do you know where she resides?"}, {"id": "148019", "question": "<strong>Select the most appropriate ANTONYM of the word in the brackets to fill in the blank.</strong></p> <p>Dhara _______ the way to Mumbai. [lost]", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> found", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> slept", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> helped", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> paved"], "correct_answer": 0, "solution": "A) <strong>Lost</strong> (verb) – To be unable to find one's way or something, fail to retain. खो जाना\n\nAntonym: <strong>Found</strong> (verb) – To discover or recognize something or someone, to locate after searching. खोज लेना\n\n<strong>Slept</strong> (verb) – To rest by sleeping, to be in a state of sleep. सोना\n\n<strong>Helped</strong> (verb) – To assist or aid someone in doing something. मदद करना\n\n<strong>Paved</strong> (verb) – To cover a surface with concrete, bricks, or stones; to make a path. मार्ग बनाना"}, {"id": "148020", "question": "<strong>Select the most appropriate ANTONYM of the given word.</strong></p> <p>Triumphant", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Unsuccessful", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Jubilant", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Flourishing", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Tender"], "correct_answer": 0, "solution": "A) <strong>Triumphant</strong> (adjective) – Victorious, successful, having achieved victory. विजयी\n\n<strong>Antonym: Unsuccessful</strong> (adjective) – Not achieving the desired aim or result, failed. असफल\n\n<strong>Jubilant</strong> (adjective) – Feeling or expressing great happiness, elated, joyful. उल्लासित\n\n<strong>Flourishing</strong> (adjective) – Developing rapidly and successfully, thriving, prospering. समृद्धि, कामयाब होनेवाला\n\n<strong>Tender</strong> (adjective) – Gentle, soft, sensitive, or easily hurt. कोमल"}, {"id": "148021", "question": "<strong>Select the most appropriate verb / verb phrase to fill in the blank.</strong></p> <p>They ________________ their house for the past two months, and it’s finally starting to look fantastic.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> have been renovating", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> were renovating", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> will renovate", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> has renovated"], "correct_answer": 0, "solution": "A) <strong>'Have been renovating'</strong> का use होगा क्योंकि present perfect continuous tense का use ऐसी क्रियाओं के लिए किया जाता है जो past में शुरू हुई थीं और अब तक जारी हैं। sentence में यह बताया गया है कि घर की मरम्मत पिछले दो महीनों से की जा रही है और परिणामस्वरूप यह अब शानदार दिखने लगा है। इसलिए 'have been renovating' यहाँ सही option है।\n\n'Have been renovating' is used because the present perfect continuous tense describes actions that started in the past and continue to the present. The sentence mentions that they’ve been working on their house for two months and it’s now starting to look fantastic. Hence, 'have been renovating' is correct here."}, {"id": "148022", "question": "<strong>Select the option that can be used as a one-word substitute for the given group of words.</strong></p> <p>A short stay that you make while on a longer journey", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Stopover", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Saga", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Tent", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Refugee"], "correct_answer": 0, "solution": "A) <strong>Stopover</strong> (noun) – A short stay that you make while on a longer journey. अल्प ठहराव\n\n<strong>Saga</strong> (noun) – A long and complicated story or series of events. गाथा\n\n<strong>Tent</strong> (noun) – A portable shelter used for camping. तम्बू\n\n<strong>Refugee</strong> (noun) – A person who has been forced to leave their country to escape war, persecution, or natural disaster. शरणार्थी"}, {"id": "148023", "question": "<strong>Parts of a sentence are given below in jumbled order. Arrange the parts in the correct order to form a meaningful sentence.</strong></p> <p>A: new facts and advanced</p> <p>B: but my opinion is</p> <p>C: he has discovered</p> <p>D: unchanged</p> <p>E: new arguments", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> BDAEC", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> EBDCA", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> DACBE", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> CAEBD"], "correct_answer": 3, "solution": "D) <strong>CAEBD</strong>\n\nhe has discovered new facts and advanced new arguments but my opinion is unchanged\n\n<strong>Why C comes first:</strong> C introduces the subject (he) and the main action (has discovered), setting up the sentence's focus on the discoveries made.\n\n<strong>Why A follows C:</strong> A provides what the subject discovered — new facts and advanced knowledge. It directly complements the action introduced in C.\n\n<strong>Why E follows A:</strong> E completes the list of things discovered, adding \"new arguments\" to \"new facts and advanced.\" This gives a fuller picture of what has been discovered.\n\n<strong>Why B follows E:</strong> B introduces a contrasting idea with \"but,\" indicating a shift in the sentence to the speaker's opinion.\n\n<strong>Why D follows B:</strong> D completes the thought by stating that the speaker’s opinion remains \"unchanged.\" This finalizes the contrast mentioned in B."}, {"id": "148024", "question": "<strong>Select the most appropriate synonym of the given word.</strong></p> <p>Mellifluous", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Loud", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Distinct", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Cacophonous", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Musical"], "correct_answer": 3, "solution": "D) <strong>Mellifluous</strong> (adjective) – Sweet-sounding, pleasant to hear, harmonious, melodious. मधुर\n\nSynonym: <strong>Musical</strong> (adjective) – Having a pleasant sound, harmonious, melodious. सुरम्य\n\n<strong>Loud</strong> (adjective) – Producing a lot of noise, high in volume. ऊँचा\n\n<strong>Distinct</strong> (adjective) – Clearly different, noticeable, well-defined. स्पष्ट\n\n<strong>Cacophonous</strong> (adjective) – Harsh-sounding, unpleasant, discordant. कर्कश"}, {"id": "148025", "question": "<strong>Select the most appropriate option to substitute the underlined segment in the given sentence.</strong></p> <p>A computer can’t function without <ins><strong>it’s</strong> </ins>mother board.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> their", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> it is", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> his", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Its"], "correct_answer": 3, "solution": "'D) it’s' के बदले <strong>'Its'</strong> का use होगा क्योंकि यहां mother board के लिए Possessive Adjective का use किया जाना चाहिए\n\n'Their' का use plural nouns के लिए होता है, लेकिन यहाँ 'computer' singular है। इसलिए, 'their' का use grammatically incorrect होगा।\n\n'It is' एक contraction है, न कि possessive form। यहाँ हमें एक possessive adjective की आवश्यकता है जो दिखाए कि motherboard कंप्यूटर का है, न कि 'it is' का संक्षेपण\n\n'His' एक possessive adjective है, लेकिन इसका use आमतौर पर masculine nouns के लिए होता है, जैसे मनुष्यों के लिए। चूंकि 'computer' एक निर्जीव वस्तु है और इसका कोई gender नहीं है,\n\n'Its' will be used instead of 'it’s' because here, a Possessive Adjective is needed for the mother board.\n\n'Their' is a possessive pronoun used for plural nouns, but here 'computer' is singular. Therefore, using 'their' would be grammatically incorrect in this context.\n\n'It is' (shortened as \"it's\") is a contraction, not a possessive form. Here, we need a possessive adjective to indicate that the motherboard belongs to the computer, not the contraction for \"it is.\"\n\n'His' is a possessive adjective, but it’s used for masculine nouns, usually human. Since 'computer' is an inanimate object and doesn't have gender, 'his' is not appropriate."}, {"id": "148026", "question": "<strong>Select the most appropriate meaning of the given idiom.</strong></p> <p>Hit the roof", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> To jump high", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> To play joyfully", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> To become very angry", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> To destruct a building"], "correct_answer": 2, "solution": "C) <strong>Hit the roof</strong> (idiom) – To become very angry (बहुत गुस्सा होना)"}, {"id": "148027", "question": "<strong>The following sentence has been split into four segments. Identify the segment that contains a grammatical error.</strong></p> <p>He never talks / for anybody. / He is alone / all day", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> for anybody", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> He is alone", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> He never talks", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> all day"], "correct_answer": 0, "solution": "A) ‘for anybody' के बदले <strong>'to anybody'</strong> का प्रयोग होगा क्योंकि verb 'talk' के साथ preposition 'to' का प्रयोग होता है। उदाहरण के लिए— He never talks to anybody.\n\n'to anybody' will be used instead of 'for anybody' because the verb 'talk' is followed by the preposition 'to'. For example— He never talks to anybody."}, {"id": "148028", "question": "<strong>Identify the correct antonym for the given word.</strong></p> <p>Envious", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Untrustworthy", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Malicious", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Suspicious", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Generous"], "correct_answer": 3, "solution": "D) <strong>Envious</strong> (adjective) – Feeling or showing jealousy towards someone else's advantages, possessions, or traits. ईर्ष्यालु\n\nAntonym: <strong>Generous</strong> (adjective) – Willing to give more of something, especially money or time, than is strictly necessary or expected, benevolent, kind-hearted. उदार\n\n<strong>Untrustworthy</strong> (adjective) – Not reliable, unable to be trusted, dishonest. अविश्वसनीय\n\n<strong>Malicious</strong> (adjective) – Intending or intended to do harm, spiteful, cruel. दुर्भावनापूर्ण\n\n<strong>Suspicious</strong> (adjective) – Inclined to suspect or distrust, doubtful. संदेहास्पद"}, {"id": "148029", "question": "<strong>Comprehension:</strong></p> <p><strong>In the following passage, some words have been deleted. Read the passage carefully and select the most appropriate option to fill in each blank.</strong></p> <p>According to a poll conducted in 2018–19 by an online internship and training platform,</p> <p>(1)__________ number of businesses actively (2)__________ intern profiles has increased over the previous fiv         // Initialize app

            createParticles();

            loadQuestion();
            startTimer();
            setupTouchGestures();
            setupAutoSave();
            
            // Prevent accidental page leave
            window.addEventListener('beforeunload', (e) => {
                if (!isTestFinished) {
                    e.preventDefault();
                    e.returnValue = 'Test in progress. Are you sure you want to leave?';
                }
            });
        }
        
        // Create floating particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = window.innerWidth < 768 ? 20 : 40;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 3 + 3) + 's';
                particlesContainer.appendChild(particle);
            }
        }
        
        // Load current question
        function loadQuestion() {

            // Update question info

            // Load options
