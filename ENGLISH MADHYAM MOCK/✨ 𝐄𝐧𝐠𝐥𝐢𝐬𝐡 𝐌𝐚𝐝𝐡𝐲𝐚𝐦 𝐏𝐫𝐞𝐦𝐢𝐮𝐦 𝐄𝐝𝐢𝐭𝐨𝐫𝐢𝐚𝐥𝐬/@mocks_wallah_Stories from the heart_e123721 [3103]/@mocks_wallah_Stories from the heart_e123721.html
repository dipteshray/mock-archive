<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6366f1">
    <title>devgagan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #06b6d4;
            
            --glass-bg: rgba(255, 255, 255, 0.95);  /* Changed from 0.25 to 0.95 */
            --glass-border: rgba(255, 255, 255, 0.8);  /* Changed from 0.18 to 0.8 */
            --shadow-light: 0 8px 32px rgba(31, 38, 135, 0.37);
            --shadow-heavy: 0 20px 60px rgba(0, 0, 0, 0.3);
            
            --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --bounce: cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        
[data-theme="light"] {
    --bg: #ffffff;  /* Changed from gradient to solid white */
    --card-bg: #ffffff;  /* Changed from transparent to solid white */
    --text: #1a202c;
    --text-secondary: #4a5568;
    --border: rgba(0, 0, 0, 0.1);  /* Changed to darker border for contrast */
    --nav-bg: #ffffff;  /* Changed from transparent to solid white */
}

[data-theme="dark"] {
    --bg: #1a1a2e;  /* Changed from gradient to solid dark */
    --card-bg: #16213e;  /* Changed from transparent to solid dark */
    --text: #f7fafc;
    --text-secondary: #a0aec0;
    --border: rgba(255, 255, 255, 0.1);
    --nav-bg: #0c0c0c;  /* Changed from transparent to solid dark */
}
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--bg);  /* Now just using the solid color */
    z-index: -1;
}
        
        /* Floating particles animation */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: float 6s infinite ease-in-out;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.7; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 0.3; }
        }
        
        /* Header with glassmorphism */
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 16px 20px;
            z-index: 100;
            transition: var(--transition);
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .menu-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            font-size: 18px;
        }
        
        .menu-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-light);
        }
        
        .menu-btn:active {
            transform: scale(0.95);
        }
        
        .logo {
            font-weight: 800;
            font-size: 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        
        [data-theme="dark"] .logo {
    background: none;
    -webkit-text-fill-color: white; /* White text in dark mode */
    color: white; /* Fallback */
}
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            font-size: 20px;
        }
        
        .theme-toggle:hover {
            transform: rotate(180deg) scale(1.1);
            box-shadow: var(--shadow-light);
        }
        
        /* Advanced Timer */
        .timer-container {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .timer {
            background: linear-gradient(135deg, var(--error), #dc2626);
            color: white;
            padding: 12px 16px;
            border-radius: 16px;
            font-family: 'Inter', monospace;
            font-weight: 600;
            font-size: 14px;
            box-shadow: var(--shadow-light);
            position: relative;
            overflow: hidden;
        }
        
        .timer.warning {
            animation: pulse 1s infinite;
        }
        
        .timer.critical {
            animation: shake 0.5s infinite;
            background: linear-gradient(135deg, #dc2626, #991b1b);
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
        }
        
        .progress-ring {
            width: 40px;
            height: 40px;
            transform: rotate(-90deg);
        }
        
        .progress-circle {
            fill: none;
            stroke: rgba(255, 255, 255, 0.3);
            stroke-width: 3;
        }
        
        .progress-circle.progress {
            stroke: var(--primary);
            stroke-linecap: round;
            transition: stroke-dashoffset 0.3s ease;
        }
        
        /* Main Content */
        .main {
            margin: 80px 0 100px;
            padding: 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .question-container {
    background: var(--card-bg);  /* Now uses solid color */
    /* Remove or reduce blur effect */
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 32px;
    box-shadow: var(--shadow-heavy);
    position: relative;
    overflow: hidden;
    transition: var(--transition);
}
        .question-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--info));
            background-size: 200% 100%;
            animation: gradient-flow 3s linear infinite;
        }
        
        @keyframes gradient-flow {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .question-number {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 12px 20px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: var(--shadow-light);
            position: relative;
        }
        
        .question-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }
        
        .question-progress {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
        }
        
        .question-marks {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 600;
        }
        
        .question-text {
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 32px;
            color: var(--text);
            font-weight: 500;
        }
        
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .option {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 20px 24px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            font-size: 16px;
            font-weight: 500;
            color: var(--text);
            overflow: hidden;
        }
        
        .option::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s;
        }
        
        .option:hover::before {
            left: 100%;
        }
        
        .option:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: var(--shadow-light);
        }
        
        .option:active {
            transform: scale(0.98);
        }

        .menu-btn, .theme-toggle, .nav-btn.prev, .action-btn.flag {
    background: var(--card-bg);  /* Solid background */
    backdrop-filter: none;  /* Remove blur */
}

.sidebar {
    background: var(--card-bg);  /* Solid background */
    backdrop-filter: none;  /* Remove blur */
}
        
        .option.selected {
            background: rgba(99, 102, 241, 0.15);
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-light);
        }
        
        .option.correct {
            background: rgba(16, 185, 129, 0.15);
            border-color: var(--success);
            color: var(--success);
        }
        
        .option.incorrect {
            background: rgba(239, 68, 68, 0.15);
            border-color: var(--error);
            color: var(--error);
        }
        
        .option.disabled {
            background: rgba(160, 174, 192, 0.1);
            border-color: var(--text-secondary);
            color: var(--text-secondary);
            cursor: not-allowed;
        }
        
        .option-indicator {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }
        
        .option.selected .option-indicator {
            background: var(--primary);
            color: white;
        }
        
        .option.correct .option-indicator {
            background: var(--success);
            color: white;
        }
        
        .option.incorrect .option-indicator {
            background: var(--error);
            color: white;
        }
        
        .option:not(.selected):not(.correct):not(.incorrect) .option-indicator {
            border: 2px solid var(--border);
        }
        
        /* Solution Panel */
        .solution-panel {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(245, 158, 11, 0.05));
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 20px;
            padding: 24px;
            margin-top: 24px;
            backdrop-filter: blur(10px);
            transform: translateY(20px);
            opacity: 0;
            transition: var(--transition);
        }
        
        .solution-panel.show {
            transform: translateY(0);
            opacity: 1;
        }
        
        .solution-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            color: var(--warning);
            font-weight: 700;
        }
        
        .solution-content {
            color: var(--text);
            line-height: 1.6;
            font-size: 15px;
        }
        
        /* Navigation */
        .navigation {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            padding: 16px 20px;
            z-index: 90;
        }
        
        .nav-content {
            display: flex;
            gap: 12px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .nav-btn {
            flex: 1;
            padding: 16px 24px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        
        .nav-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.6s;
        }
        
        .nav-btn:hover::before {
            left: 100%;
        }
        
        .nav-btn:active {
            transform: scale(0.95);
        }
        
        .nav-btn.prev {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            backdrop-filter: blur(10px);
        }
        
        .nav-btn.next {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: var(--shadow-light);
        }
        
        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .nav-btn:disabled::before {
            display: none;
        }
        
        /* Question Panel Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid var(--border);
            z-index: 200;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-heavy);
        }
        
        .sidebar.open {
            right: 0;
        }
        
        .sidebar-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .sidebar-title {
            font-weight: 800;
            font-size: 20px;
        }
        
        .close-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        
        .close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(90deg);
        }
        
        .sidebar-body {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }
        
        .questions-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 32px;
        }
        
        .question-btn {
            background: var(--card-bg);
            border: 2px solid var(--border);
            color: var(--text-secondary);
            width: 48px;
            height: 48px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            position: relative;
        }
        
        .question-btn:hover {
            transform: scale(1.1);
            box-shadow: var(--shadow-light);
        }
        
        .question-btn:active {
            transform: scale(0.95);
        }
        
        .question-btn.current {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: var(--shadow-light);
        }
        
        .question-btn.answered {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border-color: var(--success);
        }
        
        .question-btn.correct {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }
        
        .question-btn.incorrect {
            background: var(--error);
            color: white;
            border-color: var(--error);
        }
        
        .question-btn.flagged::after {
            content: '🚩';
            position: absolute;
            top: -4px;
            right: -4px;
            font-size: 10px;
        }
        
        /* Legend */
        .legend {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 32px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .legend-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        
        .legend-dot.current { background: var(--primary); }
        .legend-dot.answered { background: var(--success); }
        .legend-dot.unattempted { background: var(--text-secondary); }
        .legend-dot.flagged { background: var(--warning); }
        
        /* Action Buttons */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .action-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }
        
        .action-btn.flag {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        
        .action-btn.submit {
            background: linear-gradient(135deg, var(--error), #dc2626);
            color: white;
            box-shadow: var(--shadow-light);
        }
        
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-heavy);
        }
        
        .action-btn:active {
            transform: scale(0.98);
        }
        
        /* Overlay */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 150;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }
        
        .overlay.show {
            opacity: 1;
            visibility: visible;
        }
        
        /* Result Modal */
        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 32px;
            max-width: 90vw;
            width: 480px;
            z-index: 300;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
            box-shadow: var(--shadow-heavy);
            overflow: hidden;
        }
        
        .modal.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }
        
        .modal-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 40px 32px;
            text-align: center;
        }
        
        .modal-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        
        .modal-subtitle {
            opacity: 0.9;
            font-size: 16px;
            font-weight: 500;
        }
        
        .modal-body {
            padding: 32px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            text-align: center;
            padding: 20px 16px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }
        
        .stat-label {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        
        .stat-value {
            color: var(--text);
            font-size: 24px;
            font-weight: 800;
        }
        
        .final-score {
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
            border-radius: 20px;
            padding: 32px;
            text-align: center;
            margin-bottom: 24px;
            box-shadow: var(--shadow-light);
        }
        
        .score-text {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        
        .percentage-text {
            opacity: 0.9;
            font-size: 18px;
            font-weight: 600;
        }
        
        .modal-actions {
            display: flex;
            gap: 12px;
        }
        
        .modal-btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }
        
        .modal-btn.primary {
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary);
            border: 1px solid rgba(99, 102, 241, 0.3);
        }
        
        .modal-btn.success {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        
        .modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-light);
        }
        
        /* Auto-save indicator */
        .auto-save {
            position: fixed;
            top: 80px;
            right: 20px;
            background: var(--success);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            transform: translateX(100px);
            opacity: 0;
            transition: var(--transition);
            z-index: 90;
        }
        
        .auto-save.show {
            transform: translateX(0);
            opacity: 1;
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .header-content {
                padding: 0 4px;

    <script>
        // Core Variables
        const questions = [{"id": "149453", "question": "<strong>Comprehension</strong>:</p> <p>The marginalised have come to the fore with Banu Mushtaq winning the International Booker Prize for 2025. In a first for Kannada, Mushtaq and her translator Deepa Bhasthi walked away with the top honours on Tuesday night (May 21, 2025) in London for Heart Lamp. This is also the first time in the history of the prize that a collection of short stories has won. Breaching walls, breaking ceilings, and enduring angry outbursts, Mushtaq chronicles the lives of Muslim women and their anxieties. Her stories are also peopled by clueless husbands, children who are like “monkeys without tails”, loving and, sometimes overbearing, grandmothers, muscular brothers and maulvis. But as Mushtaq has said in interviews, the narratives are primarily about women and how “religion, society, and politics demand unquestioning obedience from them, and in doing so, inflict inhumane cruelty upon them”. She writes with candour and wry humour, even as the women are often struggling to stay afloat with their backs against the wall. In her moving acceptance speech, Mushtaq harped on the power of words to “create a world where every voice is heard, every story matters, and every person belongs”.</p> <p>Showering praise on Kannada, she said that it is a language that sings of resilience and nuance — “to write in Kannada is to inherit a legacy of cosmic wonder and earthly wisdom”. The 77-year-old Mushtaq hails from Hassan in Karnataka, like another illustrious writer, Raja Rao, who wrote in Kannada, English and French. Mushtaq, a lawyer and activist, was inspired to write after hearing of the “pain, suffering, and helpless lives” of the women she interacted with. The “radical translation” by Bhasthi was praised by the Jury chair Max Porter who said it “ruffles language to create new textures in a plurality of Englishes”. Heart Lamp’s Booker, just three years after Geetanjali Shree won for Tomb of Sand, sh ords to “create a world where every voice is heard, every story matters, and every person belongs”.</p> <p>Showering praise on Kannada, she said that it is a language that sings of resilience and nuance — “to write in Kannada is to inherit a legacy of cosmic wonder and earthly wisdom”. The 77-year-old Mushtaq hails from Hassan in Karnataka, like another illustrious writer, Raja Rao, who wrote in Kannada, English and French. Mushtaq, a lawyer and activist, was inspired to write after hearing of the “pain, suffering, and helpless lives” of the women she interacted with. The “radical translation” by Bhasthi was praised by the Jury chair Max Porter who said it “ruffles language to create new textures in a plurality of Englishes”. Heart Lamp’s Booker, just three years after Geetanjali Shree won for Tomb of Sand, should open doors for India’s rich regional languages to gain a wider readership. Mushtaq follows a trail of writers such as Perumal Murugan, Vivek Shanbhag, Bama, Jayant Kaikini, M. Mukundan and S. Hareesh who observe the human condition in a socio-political context with their translators ensuring the rhythms of the original language are not lost. In a world that often tries to divide people, Mushtaq said that literature remains one of the “last sacred spaces where we can live inside each other’s minds if only for a few pages”. It is the only place that can embrace stories from unheard corners and translations that defy borders.</p> <p><strong>Based on the passage, which broader impact is most likely to follow Mushtaq’s win?</strong>", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Decline in translations from Indian regional languages", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Increased global interest in Kannada and other regional Indian literatures", "<p style=\"display:none\"><img alt=\"reload\" ctivist, was inspired to write after hearing of the “pain, suffering, and helpless lives” of the women she interacted with. The “radical translation” by Bhasthi was praised by the Jury chair Max Porter who said it “ruffles language to create new textures in a plurality of Englishes”. Heart Lamp’s Booker, just three years after Geetanjali Shree won for Tomb of Sand, should open doors for India’s rich regional languages to gain a wider readership. Mushtaq follows a trail of writers such as Perumal Murugan, Vivek Shanbhag, Bama, Jayant Kaikini, M. Mukundan and S. Hareesh who observe the human condition in a socio-political context with their translators ensuring the rhythms of the original language are not lost. In a world that often tries to divide people, Mushtaq said that literature remains one of the “last sacred spaces where we can live inside each other’s minds if only for a few pages”. It is the only place that can embrace stories from unheard corners and translations that defy borders.</p> <p><strong>Where did Banu Mushtaq receive the International Booker Prize on May 21 2025?</strong>", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Bengaluru", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Paris", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> London", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> New York"], "correct_answer": 2, "solution": "No solution available"}, {"id": "149457", "question": "<strong>Comprehension</strong>:</p> <p>The marginalised have come to the fore with Banu Mushtaq winning the International Booker Prize for 2025. In a first for Kannada, Mushtaq and her translator Deepa Bhasthi walked away with the top honours on Tuesday night (May 21, 2025) in London for Heart Lamp. This is also the first time in the history of the prize that a collection of short stories has won. Breaching walls, breaking ceilings, and enduring angry outbursts, Mushtaq chronicles the lives of Muslim women and their anxieties. Her stories are also peopled by clueless husbands, children who are like “monkeys without tails”, loving and, sometimes overbearing, grandmothers, muscular brothers and maulvis. But as Mushtaq has said in interviews, the narratives are primarily about women and how “religion, society, and politics demand unquestioning obedience from them, and in doing so, inflict inhumane cruelty upon them”. She writes with candour and wry humour, even as the women are often struggling to stay afloat with their backs against the wall. In her moving acceptance speech, Mushtaq harped on the power of words to “create a world where every voice is heard, every story matters, and every person belongs”.</p> <p>Showering praise on Kannada, she said that it is a language that sings of resilience and nuance — “to write in Kannada is to inherit a legacy of cosmic wonder and earthly wisdom”. The 77-year-old Mushtaq hails from Hassan in Karnataka, like another illustrious writer, Raja Rao, who wrote in Kannada, English and French. Mushtaq, a lawyer and activist, was inspired to write after hearing of the “pain, suffering, and helpless lives” of the women she interacted with. The “radical translation” by Bhasthi was praised by the Jury chair Max Porter who said it “ruffles language to create new textures in a plurality of Englishes”. Heart Lamp’s Booker, just three years after Geetanjali Shree won for Tomb of Sand, should open doors for India’s rich regional languages to gain a wider readership. Mushtaq follows a trail of writers such as Perumal Murugan, Vivek Shanbhag, Bama, Jayant Kaikini, M. Mukundan and S. Hareesh who observe the human condition in a socio-political context with their translators ensuring the rhythms of the original language are not lost. In a world that often tries to divide people, Mushtaq said that literature remains one of the “last sacred spaces where we can live inside each other’s minds if only for a few pages”. It is the only place that can embrace stories from unheard corners and translations that defy borders.</p> <p>In the phrase “struggling to stay afloat with their backs against the wall,” what does the idiom “<strong>back against the wall</strong>” most nearly mean in context?", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Enjoying a position of comfort", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Facing severe pressure with few options left", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Being literally trapped in a narrow space", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Relaxing after overcoming hardship"], "correct_answer": 1, "solution": "No solution available"}, {"id": "149429", "question": "<strong>For the four-sentence (S1 to S4) paragraph below, sentences S1 and S4 are given. From the options P, Q, R and S select the appropriate sentences for S2 and S3, respectively.</strong><br> <strong>S1) </strong>The news about China’s economic slowdown has caused mixed reactions.<br> <strong>P) </strong>China's sovereignty and maritime claims based on the nine-dotted line on the map are \"invalid,\" said the statement, which cited Pham Thu Hang, the spokesperson for Vietnam's foreign affairs ministry<br> <strong>Q)</strong> China released the map so publishers, companies and others have an official version to reference.<br> <strong>R)</strong> China, for long, had been worried about fears of a slowdown and a middle-income trap.<br> <strong>S) </strong>Now, there are fears of deflation which may bring bad news for China and the rest of the world.</p> <p><strong>S4) </strong>Thus, understanding the causes and the magnitude of China’s present-day economic challenges is essential.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> P and Q", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> P and R", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> R and S", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Q and S"], "correct_answer": 2, "solution": "C) <strong>R and S</strong>\n\nBased on the theme set by S1 and S4, sentences R and S (Option C) seem to be the most appropriate choices for S2 and S3 respectively. They provide context about China's longstanding concerns and the potential implications, fitting in with the theme of the economic slowdown.\n\nP: This sentence speaks about maritime claims, which does not fit the theme of economic slowdown.\n\nQ: This sentence also discusses a map release but does not directly relate to China's economic conditions.\n\nR: This sentence is about China's fears of an economic slowdown, which directly relates to the theme.\n\nS: This sentence discusses the potential economic consequences (deflation) for China and globally, which again fits the theme."}, {"id": "149433", "question": "<strong>Identify the errors in the given sentence and choose the sentence that rectifies these errors.</strong></p> <p>My idea can be key idea for cracking difficult conflicts of extremely high level.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> My idea can be an key idea for cracking difficult conflicts of an extremely high level.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> My idea can be key idea for cracking difficult conflicts of an extremely high level.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> My idea can be a key idea for cracking difficult conflicts of a extremely high level.", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> My idea can be a key idea for cracking difficult conflicts of an extremely high level"], "correct_answer": 3, "solution": "D) <strong>My idea can be a key idea for cracking difficult conflicts of an extremely high level</strong>\n\n‘a' के बदले 'an' का प्रयोग किया गया है, जो गलत है, क्योंकि 'key' का उच्चारण vowel sound से शुरू नहीं होता। सही वाक्य में 'a key idea' का प्रयोग होना चाहिए। इसके अतिरिक्त, 'an extremely high level' सही है क्योंकि 'extremely' का उच्चारण vowel sound से शुरू होता है। अतः सही उत्तर D है।\n\n‘an' is incorrectly used instead of 'a' because 'key' does not begin with a vowel sound. The correct sentence must use 'a key idea.' Additionally, 'an extremely high level' is correct as 'extremely' begins with a vowel sound. Thus, the correct answer is D."}, {"id": "149430", "question": "<strong>Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the correct order to form a meaningful and coherent paragraph</strong><br> <strong>A) </strong> The exodus of a large chunk of Gurugram’s industrial workforce following the recent communal clashes is a huge setback to this commercial hub of North India.<br> <strong>B) </strong> The communal tension has not only exposed the religious fault-lines but also put the booming industry in a precarious position.<br> <strong>C) </strong>As businesses and companies come to grips with an atmosphere of distrust, both the Haryana and the Central governments have a challenging task at hand to restore public confidence.<br> <strong>D) </strong> At a time when New Delhi is going all out to seek more investment, the violence sends out all the wrong signals.<br> <strong>E) </strong> Safety concerns need to be addressed on priority. Any delay on this count or allowing activities that could be detrimental to peace and security will adversely affect the business sentiment and the hard-won economic gains.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> CABDE", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> ABDCE", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> ABCED", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> CBEDA"], "correct_answer": 1, "solution": "B) <strong>ABDCE</strong>\n\n\"A\" appears to introduce the problem (the exodus) and its cause (communal clashes). It sets the tone for the paragraph. Hence, \"A\" is a suitable starting sentence.\n\n\"B\" elaborates on the communal tension and its impact on the industry which is a direct consequence of the communal clashes mentioned in \"A\". Hence, \"B\" follows \"A\".\n\nFrom the options, only B and C have the sequence \"AB\". We can eliminate options A and D.\n\nAfter discussing the communal tension in \"B\", \"D\" speaks about the larger implication it has at a time when New Delhi is seeking investments, thus the violence being a negative factor. Hence, \"D\" follows \"B\".\n\nOption C has \"C\" following \"B\" which doesn't connect well, so it's eliminated.\n\nHence, the sequence should be \"ABDCE\", which matches option B."}, {"id": "149431", "question": "<strong>Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the correct order to form a meaningful and coherent paragraph.</strong></p> <p><strong>P) </strong>The air was still warm.</p> <p><strong>Q) </strong> The breeze touched my face, drying out the sweat on my forehead.</p> <p><strong>R) </strong> Before I could feel the hotness in the air, dark clouds gathered. Soon the warm air turned into a cold wind.</p> <p><strong>S) </strong>One day in the month of June, I stood on the balcony, enjoying the small breeze of the evening.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> SPQR", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> PQRS", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> QRPS", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> RQPS"], "correct_answer": 0, "solution": "A) <strong>SPQR</strong>\n\n<strong>Options Elimination:</strong><br> <strong>Sentence S</strong> talks about a specific day and a specific action - standing on the balcony. This seems like a good opening statement, setting the scene. So, we can start with S. Based on starting with S, only option A. SPQR\n\n<strong>Next, P</strong> talks about the air being warm which could potentially come after S as it continues the description of the environment.\n\n<strong>Q </strong>mentions a breeze touching the face and drying sweat. It is likely that after feeling the warm air, the breeze is what the narrator felt next.\n\n<strong>R </strong>then introduces a change in the atmosphere. The sentence describes a transition from hot to cold, which would come after the initial descriptions of warmth and breeze"}, {"id": "149434", "question": "<strong>The following sentence has been split into four segments. Identify the segment that contains a grammatical error.</strong></p> <p>You have said that, / as he took money from you many times, / he owes you / five thousand rupees all together", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> as he took money from you many times,", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> he owes you", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> you have said that,", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> five thousand rupees all together"], "correct_answer": 3, "solution": "D) Segment 'D' में \"all together\" के स्थान पर \"<strong>altogether\"</strong> का प्रयोग होगा। \"Altogether\" का अर्थ है \"पूरी तरह से\" या \"संपूर्ण रूप से,\" जबकि \"all together\" का अर्थ है \"सभी एक साथ।\" यहाँ वाक्य कुल धनराशि (पाँच हजार रुपये) का जिक्र कर रहा है, इसलिए सही शब्द \"altogether\" है। उदाहरण— five thousand rupees <strong>altogether</strong>\n\nIn segment 'D', \"all together\" should be replaced with \"altogether.\" \"Altogether\" means \"completely\" or \"in total,\" while \"all together\" refers to \"everyone or everything together.\" Since the sentence is about the total amount (five thousand rupees), the correct word is \"altogether.\" Example— five thousand rupees <strong>altogether</strong>"}, {"id": "149437", "question": "<strong>Select the best express Antonym of the given underlined word.</strong></p> <p>The economic sanctions threatened to <ins><strong>cripple</strong> </ins>the country's financial system.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Boisterous", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Strengthen", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Quiet", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Gentle"], "correct_answer": 1, "solution": "<strong>B) Cripple</strong> (verb) – Weaken, Disable, Paralyze, Debilitate, Hinder कमजोर करना\n\n<strong>Antonym: Strengthen </strong>(verb) – Fortify, Empower, Boost, Enhance, Reinforce मजबूत करना\n\n<strong>Boisterous</strong> (adjective) – Noisy, energetic, and cheerful; rowdy. हंगामेदार\n\n<strong>Quiet</strong> (adjective) – Making little or no noise. शांत\n\n<strong>Gentle</strong> (adjective) – Mild in temperament or behavior; kind or tender.<strong> </strong>सौम्य"}, {"id": "149435", "question": "<strong>The following sentence has been divided into parts. One of them may contain an error Select the part that contains the error from the given options. If you don’t find anyerror, mark ‘No error’ as your answer.</strong></p> <p>Mr. Arun had / written the letter / before the manager arrived", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Mr. Arun had", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> before the manager arrived", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> written the letter", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> No error"], "correct_answer": 3, "solution": "D) <strong>No error</strong>\n\nThe sentence is error-free. It correctly follows the sequence of tenses. \"Mr. Arun had written the letter\" is in Past Perfect Tense, which indicates that the action of writing the letter was completed before another past event. \"Before the manager arrived\" is in Past Simple Tense, indicating the subsequent action. Therefore, the sentence is grammatically correct."}, {"id": "149436", "question": "<strong>Select the best express Antonym of the given underlined word.</strong></p> <p>The long-awaited project will <ins><strong>culminate</strong> </ins>with a grand opening ceremony next month.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Conclude", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Finish", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Commence", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Peak"], "correct_answer": 2, "solution": "<strong>C) Culminate</strong> (verb) – Conclude, end, finish, peak, climax समाप्त होना\n\n<strong>Antonym: Commence</strong> (verb) – Begin, start. शुरू करना\n\n<strong>Conclude</strong> (verb) – Bring (something) to an end. समाप्त करना\n\n<strong>Finish</strong> (verb) – Bring a task or activity to an end; complete. समाप्त करना\n\n<strong>Peak</strong> (verb) – Reach a highest point, either of a specified value or at a specified time. चरम पर पहुंचना"}, {"id": "149440", "question": "<strong>Select the most appropriate word for the given group of words.</strong></p> <p>Rub out writing", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Erase", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Abolish", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Break", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Demolish"], "correct_answer": 0, "solution": "<strong>A) Erase:</strong> To remove written or drawn marks by rubbing or scraping. मिटाना"}, {"id": "149438", "question": "<strong>Select the best express Synonym of the given underlined word.</strong></p> <p>The country's economic <ins><strong>hegemony</strong> </ins>influenced trade policies across the region.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Weakness", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Dominance", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Equality", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Partnership"], "correct_answer": 1, "solution": "<strong>B) Hegemony</strong> (noun) – Dominance, Supremacy, Authority, Control, Leadership प्रभुत्व\n\n<strong>Synonym: Dominance</strong> (noun) – Control, supremacy, hegemony. प्रभुत्व\n\n<strong>Weakness</strong> (noun) – Frailty, vulnerability, flaw. कमज़ोरी\n\n<strong>Equality</strong> (noun) – Fairness, parity, balance. समानता\n\n<strong>Partnership</strong> (noun) – Collaboration, alliance, cooperation. साझेदारी"}, {"id": "149442", "question": "<strong>Select the option that expresses the given sentence in passive voice.</strong></p> <p>Somebody paid the workers 2000 rupees.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> 2000 rupees is paid to the workers.", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> The workers were paid 2000 rupees.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> 2000 rupees has been paid to the workers.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The workers were being paid 2000 rupees"], "correct_answer": 1, "solution": "B) <strong>The workers were paid 2000 rupees</strong>\n\nActive से Passive Voice में बदलने के लिए, Active वाक्य का Object Passive वाक्य का Subject बन जाता है। Active वाक्य में \"Somebody\" Subject है, \"paid\" Verb (Past Simple Tense) है और \"the workers\" तथा \"2000 rupees\" Object हैं। Passive में बदलने पर \"The workers\" और \"2000 rupees\" में से किसी को भी Subject बनाया जा सकता है। यहाँ \"The workers\" को Subject बनाया गया है। Verb को \"paid\" से Passive के लिए \"were paid\" (Past Simple Passive) में बदला गया है।\n\nTo change a sentence from Active to Passive Voice, the object of the active sentence becomes the subject of the passive sentence. In the active sentence, \"Somebody\" is the subject, \"paid\" is the verb (Past Simple Tense), and \"the workers\" and \"2000 rupees\" are the objects. In the passive voice, either \"The workers\" or \"2000 rupees\" can be the subject. Here, \"The workers\" is made the subject. The verb \"paid\" is transformed into \"were paid\" (Passive form in Past Simple)"}, {"id": "149441", "question": "<strong>Select the best express synonym of the given underlined phrase.</strong></p> <p><ins><strong>In the long run</strong></ins>, making healthy choices will significantly improve your quality of life.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Superstitious", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Salvo", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Dreary", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Eventually"], "correct_answer": 3, "solution": "<strong>D) In the long run</strong> (phrase) – Definition: Over a long period of time; eventually. लंबे<strong> </strong>समय<strong> </strong>में\n\n<strong>Synonym: Eventually</strong> (adverb) – In the end, finally, over time, in the long run. अंततः\n\n<strong>Superstitious</strong> (adjective) – Irrational, gullible, illogical, credulous अंधविश्वासी\n\n<strong>Salvo</strong> (noun) – Attack, barrage, assault, strike, onslaught हमला\n\n<strong>Dreary</strong> (adjective) – Dull, boring, monotonous, tedious, lifeless, Lacklustre सुनसान"}, {"id": "149447", "question": "<strong>Select the word segment that can substitute the bracketed word segment correctly and complete the sentence meaningfully.</strong></p> <p>We will have to (put the meeting away) as the Director is not well.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> put the meeting on", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> put the meeting again", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> put the meeting off", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> put the meeting up"], "correct_answer": 2, "solution": "C) ' put the meeting away' के बदले ' <strong>put the meeting</strong> <strong>off</strong> का प्रयोग नहीं होगा क्योंकि 'put off' का अर्थ 'स्थगित करना' है, और यहां Director की तबियत खराब होने के कारण बैठक को स्थगित किया जा रहा है। अतः सही उत्तर 'put the meeting off' होगा; जैसे — We will have to put the meeting off as the Director is not well.\n\n<strong>'put the meeting</strong> off' will be used instead of 'put the meeting away' because \"put off\" means \"to postpone\" or \"to delay.\" Here, due to the Director's illness, the meeting needs to be postponed. So, \"put the meeting off\" is the correct and meaningful phrase for this sentence."}, {"id": "149443", "question": "<strong>Select the option that expresses the given sentence in indirect speech.</strong></p> <p>My friend said to me, “Do you want to accompany us on this tour?”", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> My friend asked me if I wanted to accompany them on that tour.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> My friend asked me if I wanted to accompany us on that tour.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> My friend asked me if he wanted to accompany them on that tour.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> My friend asked me if I wanted to accompany them on that tour?"], "correct_answer": 0, "solution": "A) <strong>My friend asked me if I wanted to accompany them on that tour</strong>\n\nReported Speech में बदलते समय, Direct Speech का वाक्य Indirect Speech में बदलता है। इसमें Reporting Verb (\"said to\") को Reporting Verb (\"asked\") में बदल दिया गया है क्योंकि यह एक प्रश्न है। Direct Speech में वाक्य एक प्रश्न था, और Indirect Speech में इसे एक कथन के रूप में बदल दिया गया है। \"Do you want\" (Present Simple) को Indirect Speech में \"wanted\" (Past Simple) में बदल दिया गया है क्योंकि Reporting Verb Past में है। \"us\" (Direct Speech में) को \"them\" (Indirect Speech में) में बदल दिया गया है क्योंकि यह दूसरे समूह को इंगित करता है। \"this tour\" (Direct Speech में) को \"that tour\" (Indirect Speech में) में बदल दिया गया है क्योंकि यह समय और स्थान बदलने का संकेत देता है। विकल्प A सही है क्योंकि यह सभी आवश्यक परिवर्तन सही ढंग से दिखाता है।\n\nWhen converting Direct Speech to Indirect Speech, the sentence is transformed from a direct question to a reported statement. The Reporting Verb \"said to\" is changed to \"asked\" because it is a question. The verb \"Do you want\" (Present Simple) in Direct Speech changes to \"wanted\" (Past Simple) in Indirect Speech as the Reporting Verb is in the past tense. \"us\" in Direct Speech changes to \"them\" in Indirect Speech to refer to the other group. \"this tour\" in Direct Speech changes to \"that tour\" in Indirect Speech, indicating a shift in time and place. Option A is correct as it accurately reflects all these changes."}, {"id": "149445", "question": "<strong>Select the most appropriate option to fill in the blank.</strong></p> <p>___________ the teacher entered the classroom, all the students stood up to greethim.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Rather", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> As soon as", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Yet", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Whereas"], "correct_answer": 1, "solution": "B) <strong>As soon as'</strong> का use किया जाएगा क्योंकि इसका अर्थ है \"जैसे ही।\" वाक्य में यह बताया गया है कि शिक्षक के कक्षा में प्रवेश करते ही सभी छात्र खड़े हो गए। यह समय की तात्कालिकता को दर्शाने के लिए उपयुक्त है। जबकि: 'Rather' का अर्थ है \"बल्कि,\" जो इस संदर्भ में उपयुक्त नहीं है। 'Yet' का अर्थ है \"फिर भी,\" जो विरोधाभास दिखाने के लिए प्रयोग होता है और यहां फिट नहीं बैठता। 'Whereas' का अर्थ है \"जबकि,\" जो दो विरोधाभासी विचारों की तुलना करने के लिए use किया जाता है, जो इस वाक्य के लिए सही नहीं है।\n\n'As soon as' will be used because it means \"immediately after.\" The sentence conveys that the students stood up right after the teacher entered the classroom, making 'As soon as' the most appropriate choice. Whereas: 'Rather' means \"instead,\" which is not suitable in this context.\n\n'Yet' means \"however,\" which implies contradiction and doesn't fit here. 'Whereas' means \"while,\" used for comparing two contrasting ideas, which is irrelevant to this sentence."}, {"id": "149448", "question": "<strong>Comprehension:</strong></p> <p><strong>In the following passage, some words have been deleted. Read the passage carefully and select the most appropriate option to fill in each blank.</strong><br> On Nicolás Maduro’s watch, Venezuela’s economy contracted 80% in less than a decade. Some 7.8 million Venezuelans fled from the economic hardships. If extreme poverty was at 11% in 2013, the year Hugo Chávez died and Mr. Maduro ____1____ to presidency, it now stands at 53%, while household poverty is much higher, at 82%, as per the UN. The oil-rich country had witnessed anti-government protests in recent years which were met with _____2_____. Before the July 28 presidential election, opinion polls showed that Edmundo González, the main opposition candidate, _____3______ a 20-point lead over the President. But none of these seemed to have _____4_____in the election, according to official results. Mr. Maduro won 51% of the vote, while Mr. Gonzalez secured 44%, said Venezuela’s election authority. Mr. Maduro can now extend his rule for six more years. But the opposition has reported widespread irregularities in the counting, and accused the President and his allies in state institutions _____5_____stealing the vote.</p> <p><strong>Select the most appropriate option to fill in blank number 1.</strong>", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Extended", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/
