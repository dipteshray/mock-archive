ecycling, all types of trash are dumped.<br> <strong>T.</strong> Landfill sites are the last resort for waste which cannot be recycled.</p> <p>Q10. Which of the following should be the <strong>SECOND</strong> sentence after rearrangement?", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> P", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Q", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> R", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> S", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> T"], "correct_answer": 3, "solution": "D. (S) TSRPQ is correct order.\n\nFollowing the introduction of the concept of landfill sites, this sentence elaborates on the idea by mentioning that in India, these sites are seen as the ultimate waste management solution. However, it introduces a problem - the lack of sorting and recycling systems leading to all types of trash being dumped."}, {"id": "132928", "question": "<strong>Directions (Q9 – Q12): Five sentences P, Q, R, S, and T are given below, you need to rearrange the sentences so that the five sentences can together form a meaningful paragraph.</strong><br> <br> <strong>P. </strong> The three sites, according to a study submitted to the National Green Tribunal last year, have cost more than Rs 450 crore in environmental degradation, with no noticeable progress to reduce the waste. The landfills have become major sources of pollution, contaminating both air as well as water, as attempts to treat, decongest and recycle fall way short.<br> <strong>Q</strong>. At least 2,500 metric tonnes of solid waste are dumped daily at the fire-hit Bhalswa landfill, which led to a fine of Rs 50 lakh being slapped on the North Delhi Municipal Corporation for negligence.<br> <strong>R. </strong> Amid the heatwave, Delhi’s three humongous landfill sites at Bhalswa, Okhla and Ghazipur are particularly prone to fires owing to the heavy build-up of methane inside the layers of millions of tonnes of decomposing garbage.<br> <strong>S. </strong> In India, these are considered the ultimate waste management solution, but in the absence of a system of sorting and recycling, all types of trash are dumped.<br> <strong>T.</strong> Landfill sites are the last resort for waste which cannot be recycled.</p> <p>Q11. Which of the following should be the <strong>THIRD</strong> sentence after rearrangement?", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> P", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Q", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> R", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> S", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> T"], "correct_answer": 2, "solution": "C. (R) TSRPQ is correct order.\n\nAfter establishing the general scenario of landfill sites in India, this sentence introduces specific examples - Delhi’s three major landfill sites."}, {"id": "132929", "question": "<strong>Directions (Q9 – Q12): Five sentences P, Q, R, S, and T are given below, you need to rearrange the sentences so that the five sentences can together form a meaningful paragraph.</strong><br> <br> <strong>P. </strong> The three sites, according to a study submitted to the National Green Tribunal last year, have cost more than Rs 450 crore in environmental degradation, with no noticeable progress to reduce the waste. The landfills have become major sources of pollution, contaminating both air as well as water, as attempts to treat, decongest and recycle fall way short.<br> <strong>Q</strong>. At least 2,500 metric tonnes of solid waste are dumped daily at the fire-hit Bhalswa landfill, which led to a fine of Rs 50 lakh being slapped on the North Delhi Municipal Corporation for negligence.<br> <strong>R. </strong> Amid the heatwave, Delhi’s three humongous landfill sites at Bhalswa, Okhla and Ghazipur are particularly prone to fires owing to the heavy build-up of methane inside the layers of millions of tonnes of decomposing garbage.<br> <strong>S. </strong> In India, these are considered the ultimate waste management solution, but in the absence of a system of sorting and recycling, all types of trash are dumped.<br> <strong>T.</strong> Landfill sites are the last resort for waste which cannot be recycled.</p> <p>Q12. Which of the following should be the <strong>FOURTH</strong> sentence after rearrangement?", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> P", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Q", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> R", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> S", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> T"], "correct_answer": 0, "solution": "A. (P)\n\nContinuing with the specific example of Delhi's landfill sites, this sentence details the environmental and financial costs of the degradation caused by these sites. It provides more information on the consequences of the problem introduced in sentence S and elaborated in R.\n\nQ: The final sentence gives a specific instance (the Bhalswa landfill) which reinforces the points made in the previous sentences. TSRPQ is correct order."}, {"id": "132930", "question": "<strong>Q13. Direction: In the following questions, a sentence is given with four words marked as (A),(B), (C), (D). These words may or may not be placed in their places. Four options with different arrangements of these words are given. Mark the option with the correct arrangements the answer. If no change is required, mark 'No arrangement required’ as your answer.</strong></p> <p>The scale of the <strong>precedent(A)</strong>, it was expected, would <strong>spur(B)</strong> fast-track investigation and trial, setting a <strong>tragedy(C)</strong> of zero tolerance for any <strong>negligence(D)</strong> or misdoing by the pharmaceutical industry.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> ADCB", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> CBAD", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> DBCA", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> ABDC", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> No arrangement required"], "correct_answer": 1, "solution": "B) CBAD\n\nThe scale of the tragedy, it was expected, would spur fast-track investigation and trial, setting a precedent of zero tolerance for any negligence or misdoing by the pharmaceutical industry."}, {"id": "132931", "question": "<strong>Direction (Q14- Q17): Read the passage given below and answer the following questions. </strong></p> <p>The title of the United Nations’ latest report, Broken Record, is a clever ____(a)____. Not only does it suggest that previous warnings of the consequences of rising greenhouse gas emissions (GHG) are being ignored but also that new ceilings are being ______(b)______. The annual emissions report, usually timed close to the beginning of the climate talks, reiterates in sharper language that progress, since the Paris Agreement (PA) of 2015, has been tardy. The stated goal was to keep temperatures from rising over 2°C, and ‘as far as possible’ below 1.5°C, of pre-industrial levels. In the last few years, much of the consensus has been that we should be directing all our efforts towards keeping it below 1.5°C. The Broken Record report, however, suggests that _______(c)_______ all commitments made by countries, as per the PA, to minimise their economies’ reliance on fossil fuel, temperatures would still result in an overshoot of 2.5°C-2.9°C by the end of the century. To keep temperature below 2°C, emissions by 2030 must be cut 28% and for 1.5°C, they need to be shaved by 42%. _____(d)_______many countries having promised to be ‘net zero,’ meaning no net carbon emissions, the report does not think these promises are ‘credible’ and even in the most optimistic scenarios, the likelihood of keeping emissions below 1.5°C are 14%.</p> <p><strong>Fill in the blanks with the most appropriate combinations of words </strong></p> <p>Q14. The title of the United Nations’ latest report, Broken Record, is a clever ____(a)____.</p> <p><strong>Fill the most appropriate option in (a)</strong></p> <p>(i) Consul<br> (ii) Infliction<br> (iii) Community<br> (iv) pun", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Only (iv)", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Both (i) and (ii)", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Only (iii)", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Only (ii)", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> None of the above"], "correct_answer": 0, "solution": "A) 'Pun' का use होगा क्योंकि 'pun' एक प्रकार का खेल होता है जिसमें शब्दों का चालाकी से इस्तेमाल किया जाता है ताकि वे दोहरे अर्थ दें। यहाँ, 'Broken Record' का इस्तेमाल एक पुरानी समस्या की बार-बार दोहराई जाने वाली चेतावनी के रूप में किया गया है, जो कि एक प्रकार का व्यंग्य है। अन्य विकल्प जैसे 'Consul', 'Infliction', और 'Community' इस संदर्भ में सही नहीं बैठते क्योंकि वे इस प्रकार के व्यंग्यात्मक या द्विअर्थी उपयोग से मेल नहीं खाते।\n\n'Pun' will be used because it refers to a form of wordplay that cleverly utilizes words to convey dual meanings. Here, 'Broken Record' is used as a metaphor for repeated warnings about a long-standing issue, which is a type of pun. The other options such as 'Consul', 'Infliction', and 'Community' do not fit in this context as they do not align with this kind of satirical or double-meaning usage"}, {"id": "132932", "question": "<strong>Direction (Q14- Q17): Read the passage given below and answer the following questions. </strong></p> <p>The title of the United Nations’ latest report, Broken Record, is a clever ____(a)____. Not only does it suggest that previous warnings of the consequences of rising greenhouse gas emissions (GHG) are being ignored but also that new ceilings are being ______(b)______. The annual emissions report, usually timed close to the beginning of the climate talks, reiterates in sharper language that progress, since the Paris Agreement (PA) of 2015, has been tardy. The stated goal was to keep temperatures from rising over 2°C, and ‘as far as possible’ below 1.5°C, of pre-industrial levels. In the last few years, much of the consensus has been that we should be directing all our efforts towards keeping it below 1.5°C. The Broken Record report, however, suggests that _______(c)_______ all commitments made by countries, as per the PA, to minimise their economies’ reliance on fossil fuel, temperatures would still result in an overshoot of 2.5°C-2.9°C by the end of the century. To keep temperature below 2°C, emissions by 2030 must be cut 28% and for 1.5°C, they need to be shaved by 42%. _____(d)_______many countries having promised to be ‘net zero,’ meaning no net carbon emissions, the report does not think these promises are ‘credible’ and even in the most optimistic scenarios, the likelihood of keeping emissions below 1.5°C are 14%.</p> <p><strong>Fill in the blanks with the most appropriate combinations of words </strong></p> <p>Q15. Not only does it suggest that previous warnings of the consequences of rising greenhouse gas emissions (GHG) are being ignored but also that new ceilings are being ______(b)______.</p> <p><strong>Fill the most appropriate option in (b)</strong></p> <p>(i) Improved<br> (ii) Ingrained<br> (iii) Enriched<br> (iv) Breached", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Both (ii) and (iv)", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Only (ii)", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Only (iv)", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Only (i)", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> None of the above"], "correct_answer": 2, "solution": "C) 'Breached' होगा क्योंकि 'breached' का अर्थ होता है किसी सीमा या नियम को तोड़ना या उल्लंघन करना। पैसेज में उल्लेख है कि ग्रीनहाउस गैस उत्सर्जन के परिणामों की पूर्व चेतावनियां अनदेखी की जा रही हैं और नई सीमाएँ भी पार की जा रही हैं, इसलिए 'breached' यहां सही शब्द है। वहीं, 'Improved' का अर्थ सुधारना होता है, 'Ingrained' का अर्थ गहराई से स्थापित होना होता है, और 'Enriched' का अर्थ समृद्ध करना होता है, जो इस संदर्भ में उपयुक्त नहीं हैं।\n\n'Breached' will be used because 'breached' means to break through or violate a limit or rule. The passage mentions that previous warnings about the consequences of GHG emissions are being ignored and new limits are being surpassed, making 'breached' the appropriate word here. On the other hand, 'Improved' means to make better, 'Ingrained' means deeply rooted, and 'Enriched' means to enhance, which are not suitable in this context."}, {"id": "132933", "question": "<strong>Direction (Q14- Q17): Read the passage given below and answer the following questions. </strong></p> <p>The title of the United Nations’ latest report, Broken Record, is a clever ____(a)____. Not only does it suggest that previous warnings of the consequences of rising greenhouse gas emissions (GHG) are being ignored but also that new ceilings are being ______(b)______. The annual emissions report, usually timed close to the beginning of the climate talks, reiterates in sharper language that progress, since the Paris Agreement (PA) of 2015, has been tardy. The stated goal was to keep temperatures from rising over 2°C, and ‘as far as possible’ below 1.5°C, of pre-industrial levels. In the last few years, much of the consensus has been that we should be directing all our efforts towards keeping it below 1.5°C. The Broken Record report, however, suggests that _______(c)_______ all commitments made by countries, as per the PA, to minimise their economies’ reliance on fossil fuel, temperatures would still result in an overshoot of 2.5°C-2.9°C by the end of the century. To keep temperature below 2°C, emissions by 2030 must be cut 28% and for 1.5°C, they need to be shaved by 42%. _____(d)_______many countries having promised to be ‘net zero,’ meaning no net carbon emissions, the report does not think these promises are ‘credible’ and even in the most optimistic scenarios, the likelihood of keeping emissions below 1.5°C are 14%.</p> <p><strong>Fill in the blanks with the most appropriate combinations of words </strong></p> <p>Q16. The Broken Record report, however, suggests that _______(c)_______ all commitments made by countries, as per the PA, to minimise their economies’ reliance on fossil fuel, temperatures would still result in an overshoot of 2.5°C-2.9°C by the end of the century.</p> <p><strong>Fill the most appropriate option in (c)</strong></p> <p>(i) Accounting for<br> (ii) Call for<br> (iii) Search for<br> (iv) Reward for", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Only (i)", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Only (ii)", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Only (iii)", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Both (i) and (ii)", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> None of the above"], "correct_answer": 0, "solution": "A) 'Accounting for' का use होगा क्योंकि \"accounting for\" का अर्थ होता है किसी चीज को ध्यान में रखना या उसे विचार में लेना। Sentence में यह कहा गया है कि देशों द्वारा किए गए सभी प्रतिबद्धताओं को ध्यान में रखते हुए, भी तापमान में वृद्धि 2.5°C-2.9°C तक हो सकती है, इसलिए 'accounting for' यहाँ सही है। जबकि, 'Call for' का अर्थ होता है जरूरत होना या मांग करना, 'Search for' का अर्थ है खोज करना, और 'Reward for' का अर्थ है पुरस्कृत करना, जो इस संदर्भ में फिट नहीं बैठते।\n\n'Accounting for' should be used because it means to take into consideration or to keep in mind. The sentence implies that even considering all commitments made by countries to minimize fossil fuel reliance, temperature rise could still reach 2.5°C-2.9°C, making 'accounting for' appropriate here. Whereas, 'Call for' means to require or demand, 'Search for' means to look for, and 'Reward for' means to give a prize for, which do not fit in this context."}, {"id": "132934", "question": "<strong>Direction (Q14- Q17): Read the passage given below and answer the following questions. </strong></p> <p>The title of the United Nations’ latest report, Broken Record, is a clever ____(a)____. Not only does it suggest that previous warnings of the consequences of rising greenhouse gas emissions (GHG) are being ignored but also that new ceilings are being ______(b)______. The annual emissions report, usually timed close to the beginning of the climate talks, reiterates in sharper language that progress, since the Paris Agreement (PA) of 2015, has been tardy. The stated goal was to keep temperatures from rising over 2°C, and ‘as far as possible’ below 1.5°C, of pre-industrial levels. In the last few years, much of the consensus has been that we should be directing all our efforts towards keeping it below 1.5°C. The Broken Record report, however, suggests that _______(c)_______ all commitments made by countries, as per the PA, to minimise their economies’ reliance on fossil fuel, temperatures would still result in an overshoot of 2.5°C-2.9°C by the end of the century. To keep temperature below 2°C, emissions by 2030 must be cut 28% and for 1.5°C, they need to be shaved by 42%. _____(d)_______many countries having promised to be ‘net zero,’ meaning no net carbon emissions, the report does not think these promises are ‘credible’ and even in the most optimistic scenarios, the likelihood of keeping emissions below 1.5°C are 14%.</p> <p><strong>Fill in the blanks with the most appropriate combinations of words </strong></p> <p>Q17. _____(d)_______many countries having promised to be ‘net zero,’ meaning no net carbon emissions, the report does not think these promises are ‘credible’ and even in the most optimistic scenarios, the likelihood of keeping emissions below 1.5°C are 14%.</p> <p><strong>Fill the most appropriate option in (d)</strong></p> <p>(i) Practically<br> (ii) Despite<br> (iii) Meanwhile<br> (iv) In spite of", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Only (i)", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Only (iv)", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Only (ii)", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Both (iv) and (ii)", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> None of the above"], "correct_answer": 3, "solution": "D) (ii) 'Despite' और (iv) 'In spite of' क्योंकि ये दोनों शब्द एक स्थिति के बावजूद कुछ होने का संकेत देते हैं। वाक्य में कहा गया है कि कई देशों ने 'नेट जीरो' होने का वादा किया है, लेकिन रिपोर्ट इन वादों को 'विश्वसनीय' नहीं मानती। यहाँ 'Despite' और 'In spite of' का उपयोग दर्शाता है कि भले ही वादे किए गए हों, फिर भी रिपोर्ट की राय नकारात्मक है। जबकि, (i) 'Practically' का अर्थ होता है व्यावहारिक रूप से, और (iii) 'Meanwhile' का अर्थ होता है इस बीच, जो इस संदर्भ में फिट नहीं बैठते।\n\nThe correct options for this sentence are (ii) 'Despite' and (iv) 'In spite of' because both these words indicate that something is happening notwithstanding a particular situation. The sentence states that many countries have promised to be 'net zero', but the report does not find these promises 'credible'. Here, 'Despite' and 'In spite of' are used to convey that even though the promises have been made, the report's opinion is still negative. On the other hand, (i) 'Practically' means in a practical manner, and (iii) 'Meanwhile' means in the meantime, which do not fit in this context."}, {"id": "132935", "question": "<strong>Q18. Given below is a word, followed by three sentence that consist of that word. Identify the sentence (S) that best express (es) the meaning of the word.</strong><br> <br> <strong>Flimsy</strong><br> (i) You won't be warm enough in that flimsy dress.<br> (ii) They convicted the defendant on very flimsy evidence<br> (iii) We spent the night in a flimsy wooden hut.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Only (i)", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Only (ii)", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Only (iii)", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> (i), (ii)", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> (i), (ii), (iii)"], "correct_answer": 4, "solution": "E) (i), (ii), (iii)\n\nAccording to the given options all are contextually correct."}, {"id": "132936", "question": "<strong>Q19. A sentence is given with four words marked as (J), (K), (L), and (M). These words may or may not be placed in the correct order. Four options with different arrangements of these have been provided. Mark the option with the correct arrangement as the answer. If no rearrangement is required, mark option (5) as your answer.</strong></p> <p>It is <strong>confounding(J)</strong> how something that is <strong>ethical(K)</strong> ‘good’ in <strong>stridently(L)</strong> and legal terms can run into a wall of opposition built on <strong>narrow(M)</strong> professional and commercial interests.</p> <p>", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> JK, ML", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> JM, LK", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> JL, KM", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> MJ, KL", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> None of the above"], "correct_answer": 2, "solution": "C) JL, KM\n\nIt is <strong>confounding</strong> how something that is <strong>stridently</strong> ‘good’ in <strong>ethical</strong> and legal terms can run into a wall of opposition built on <strong>narrow</strong> professional and commercial interests."}, {"id": "132937", "question": "<strong>Q20. In each question below, a sentence is given with a part of it printed in bold type. That part contains a phrase that may be correct or erroneous. Find out which is the correct phrase that should replace the error in bold, if there is any, and which makes the sentence grammatically meaningful and correct. If the sentence is correct as it is and ‘No improvement required’, mark option E ‘No improvement required’ as the answer</strong></p> <p>He <strong>is accused with committing</strong> the murder.</p> <ol> </ol> <p>", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> is accused for committing", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> are accused with committing", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> is accused by committing", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> is accused of committing", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> No improvement required"], "correct_answer": 3, "solution": "D) 'with' के बदले 'of' का प्रयोग होगा क्योकि 'accused of’ का प्रयोग होता है जबकि 'charged with' का; जैसे-<br> (i) He was accused of murder.<br> (ii) She was charged with murder.<br> • 'of' will be used instead of 'with' because 'accused of' is used while 'charged with';<br> (i) He was accused of murder.<br> (ii) She was charged with murder."}];
        const examConfig = {
            id: '6614',
            duration: 20,
            positiveMarks: 1.0,
            negativeMarks: 0.25
        };
        
        let currentQuestionIndex = 0;
        let userAnswers = {};
        let flaggedQuestions = new Set();
        let timeLeft = examConfig.duration * 60;
        let timerInterval;
        let isTestFinished = false;
        let solutionMode = false;
        let touchStartX = 0;
        let touchStartY = 0;
        
        // Initialize app
        function initializeApp() {
            createParticles();
            generateQuestionsGrid();
            loadQuestion();
            startTimer();
            setupTouchGestures();
            setupAutoSave();
            
            // Prevent accidental page leave
            window.addEventListener('beforeunload', (e) => {
                if (!isTestFinished) {
                    e.preventDefault();
                    e.returnValue = 'Test in progress. Are you sure you want to leave?';
                }
            });
        }
        
        // Create floating particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = window.innerWidth < 768 ? 20 : 40;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 6 + 's';
                particle.style.animationDuration = (Math.random() * 3 + 3) + 's';
                particlesContainer.appendChild(particle);
            }
        }
        
        // Load current question
        function loadQuestion() {
            const question = questions[currentQuestionIndex];
            
            // Update question info
            document.getElementById('questionNumber').textContent = `Q${currentQuestionIndex + 1}`;
            document.getElementById('questionProgress').textContent = 
                `${currentQuestionIndex + 1} of ${questions.length}`;
            document.getElementById('questionText').innerHTML = question.question;
            
            // Load options
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';
            
            question.options.forEach((option, index) => {
                const optionElement = document.createElement('div');
                optionElement.className = 'option';
                optionElement.innerHTML = option;
                
                const indicator = document.createElement('div');
                indicator.className = 'option-indicator';
                optionElement.appendChild(indicator);
                
                if (solutionMode) {
                    // Show solution mode styling
                    if (index === question.correct_answer) {
                        optionElement.classList.add('correct');
                        indicator.textContent = '✓';
                    } else if (userAnswers[currentQuestionIndex] === index) {
                        optionElement.classList.add('incorrect');
                        indicator.textContent = '✗';
                    } else {
                        optionElement.classList.add('disabled');
                    }
                    optionElement.style.pointerEvents = 'none';
                } else {
                    // Normal mode
                    if (userAnswers[currentQuestionIndex] === index) {
                        optionElement.classList.add('selected');
                        indicator.textContent = '✓';
                    }
                    
                    optionElement.onclick = () => selectOption(index);
                    optionElement.onkeydown = (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            selectOption(index);
                        }
                    };
                    optionElement.tabIndex = 0;
                }
                
                optionsContainer.appendChild(optionElement);
            });
            
            // Handle solution panel
            const solutionPanel = document.getElementById('solutionPanel');
            if (solutionMode && question.solution) {
                document.getElementById('solutionContent').innerHTML = question.solution;
                solutionPanel.classList.add('show');
            } else {
                solutionPanel.classList.remove('show');
            }
            
            // Update navigation
            updateNavigation();
            updateQuestionsGrid();
            updateFlagButton();
            
            // Add entrance animation
            const container = document.getElementById('questionContainer');
            container.style.transform = 'translateY(20px)';
            container.style.opacity = '0';
            setTimeout(() => {
                container.style.transform = 'translateY(0)';
                container.style.opacity = '1';
            }, 100);
        }
        
        // Select an option
        function selectOption(index) {
            if (solutionMode) return;
            
            const currentAnswer = userAnswers[currentQuestionIndex];
            
            if (currentAnswer === index) {
                // Deselect if clicking the same option
                delete userAnswers[currentQuestionIndex];
            } else {
                // Select new option
                userAnswers[currentQuestionIndex] = index;
            }
            
            // Update UI
            const options = document.querySelectorAll('.option');
            options.forEach((option, i) => {
                const indicator = option.querySelector('.option-indicator');
                if (userAnswers[currentQuestionIndex] === i) {
                    option.classList.add('selected');
                    indicator.textContent = '✓';
                } else {
                    option.classList.remove('selected');
                    indicator.textContent = '';
                }
            });
            
            updateQuestionsGrid();
            showAutoSave();
        }
        
        // Generate questions grid
        function generateQuestionsGrid() {
            const grid = document.getElementById('questionsGrid');
            grid.innerHTML = '';
            
            questions.forEach((_, index) => {
                const button = document.createElement('button');
                button.className = 'question-btn';
                button.textContent = index + 1;
                button.onclick = () => goToQuestion(index);
                button.setAttribute('aria-label', `Go to question ${index + 1}`);
                grid.appendChild(button);
            });
        }
        
        // Update questions grid styling
        function updateQuestionsGrid() {
            const buttons = document.querySelectorAll('.question-btn');
            buttons.forEach((button, index) => {
                button.className = 'question-btn';
                
                if (index === currentQuestionIndex) {
                    button.classList.add('current');
                } else if (solutionMode) {
                    if (userAnswers[index] === questions[index].correct_answer) {
                        button.classList.add('correct');
                    } else if (userAnswers[index] !== undefined) {
                        button.classList.add('incorrect');
                    }
                } else if (userAnswers[index] !== undefined) {
                    button.classList.add('answered');
                }
                
                if (flaggedQuestions.has(index)) {
                    button.classList.add('flagged');
                }
            });
        }
        
        // Navigation functions
        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                loadQuestion();
            }
        }
        
        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else if (!solutionMode) {
                submitTest();
            }
        }
        
        function goToQuestion(index) {
            currentQuestionIndex = index;
            loadQuestion();
            closeSidebar();
        }
        
        function updateNavigation() {
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            
            prevBtn.disabled = currentQuestionIndex === 0;
            
            if (solutionMode) {
                nextBtn.textContent = currentQuestionIndex === questions.length - 1 ? 
                    'Finish Review' : 'Next →';
                nextBtn.onclick = currentQuestionIndex === questions.length - 1 ? 
                    finishReview : nextQuestion;
            } else {
                nextBtn.textContent = currentQuestionIndex === questions.length - 1 ? 
                    'Submit Test' : 'Next →';
                nextBtn.onclick = currentQuestionIndex === questions.length - 1 ? 
                    submitTest : nextQuestion;
            }
        }
        
        // Timer functions
        function startTimer() {
            const timerElement = document.getElementById('timer');
            const progressCircle = document.getElementById('progressCircle');
            const circumference = 2 * Math.PI * 18;
            const totalTime = examConfig.duration * 60;
            
            timerInterval = setInterval(() => {
                if (timeLeft <= 0) {
                    submitTest();
                    return;
                }
                
                timeLeft--;
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerElement.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
                
                // Update progress circle
                const progress = (totalTime - timeLeft) / totalTime;
                const offset = circumference * progress;
                progressCircle.style.strokeDashoffset = offset;
                
                // Add warning effects
                if (timeLeft <= 300) { // 5 minutes
                    timerElement.classList.add('warning');
                }
                if (timeLeft <= 60) { // 1 minute
                    timerElement.classList.add('critical');
                }
            }, 1000);
        }
        
        // Toggle question flag
        function toggleFlag() {
            if (flaggedQuestions.has(currentQuestionIndex)) {
                flaggedQuestions.delete(currentQuestionIndex);
            } else {
                flaggedQuestions.add(currentQuestionIndex);
            }
            updateFlagButton();
            updateQuestionsGrid();
        }
        
        function updateFlagButton() {
            const flagBtn = document.getElementById('flagBtn');
            if (flaggedQuestions.has(currentQuestionIndex)) {
                flagBtn.textContent = '🏴 Unflag Question';
                flagBtn.style.background = 'rgba(239, 68, 68, 0.2)';
                flagBtn.style.color = 'var(--error)';
            } else {
                flagBtn.textContent = '🚩 Flag Question';
                flagBtn.style.background = 'rgba(245, 158, 11, 0.2)';
                flagBtn.style.color = 'var(--warning)';
            }
        }
        
        // Theme toggle
        function toggleTheme() {
            const body = document.body;
            const themeBtn = document.getElementById('themeBtn');
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            body.setAttribute('data-theme', newTheme);
            themeBtn.textContent = newTheme === 'light' ? '🌙' : '☀️';
            
            // Save preference
            localStorage.setItem('theme', newTheme);
        }
        
        // Sidebar functions
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            
            sidebar.classList.toggle('open');
            overlay.classList.toggle('show');
        }
        
        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('show');
        }
        
        // Touch gesture support
        function setupTouchGestures() {
            const main = document.querySelector('.main');
            
            main.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            });
            
            main.addEventListener('touchend', (e) => {
                const touchEndX = e.changedTouches[0].clientX;
                const touchEndY = e.changedTouches[0].clientY;
                const deltaX = touchEndX - touchStartX;
                const deltaY = touchEndY - touchStartY;
                
                // Only trigger if horizontal swipe is dominant
                if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 50) {
                    if (deltaX > 0 && currentQuestionIndex > 0) {
                        // Swipe right - previous question
                        previousQuestion();
                    } else if (deltaX < 0 && currentQuestionIndex < questions.length - 1) {
                        // Swipe left - next question
                        nextQuestion();
                    }
                }
            });
        }
        
        // Auto-save functionality
        function setupAutoSave() {
            // Save answers periodically
            setInterval(() => {
                if (!isTestFinished) {
                    saveProgress();
                }
            }, 30000); // Every 30 seconds
        }
        
        function saveProgress() {
            const progress = {
                answers: userAnswers,
                flagged: Array.from(flaggedQuestions),
                currentQuestion: currentQuestionIndex,
                timeLeft: timeLeft
            };
            
            // In a real implementation, this would save to a server
            console.log('Progress saved:', progress);
        }
        
        function showAutoSave() {
            const autoSave = document.getElementById('autoSave');
            autoSave.classList.add('show');
            setTimeout(() => {
                autoSave.classList.remove('show');
            }, 2000);
        }
        
        // Submit test
        function submitTest() {
            if (isTestFinished) return;
            
            isTestFinished = true;
            clearInterval(timerInterval);
            
            // Calculate results
            let correct = 0, wrong = 0, skipped = 0, totalMarks = 0;
            
            questions.forEach((question, index) => {
                if (userAnswers[index] === undefined) {
                    skipped++;
                } else if (userAnswers[index] === question.correct_answer) {
                    correct++;
                    totalMarks += examConfig.positiveMarks;
                } else {
                    wrong++;
                    totalMarks -= examConfig.negativeMarks;
                }
            });
            
            const maxMarks = questions.length * examConfig.positiveMarks;
            const percentage = Math.max(0, Math.round((totalMarks / maxMarks) * 100));
            
            // Show results
            document.getElementById('resultTitle').textContent = 
                `${correct}/${questions.length} Correct`;
            document.getElementById('resultSubtitle').textContent = 
                `You scored ${totalMarks} out of ${maxMarks} marks`;
            document.getElementById('correctCount').textContent = correct;
            document.getElementById('wrongCount').textContent = wrong;
            document.getElementById('skippedCount').textContent = skipped;
            document.getElementById('finalScore').textContent = `${totalMarks} Marks`;
            document.getElementById('finalPercentage').textContent = `${percentage}%`;
            
            document.getElementById('resultModal').classList.add('show');
            closeSidebar();
        }
        
        // View solutions
        function viewSolutions() {
            document.getElementById('resultModal').classList.remove('show');
            solutionMode = true;
            currentQuestionIndex = 0;
            loadQuestion();
        }
        
        // Finish review
        function finishReview() {
            solutionMode = false;
            currentQuestionIndex = 0;
            loadQuestion();
        }
        
        // Retake test
        function retakeTest() {
            if (confirm('Are you sure you want to retake the test? All progress will be lost.')) {
                location.reload();
            }
        }
        
        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (solutionMode) return;
            
            switch(e.key) {
                case 'ArrowLeft':
                    e.preventDefault();
                    previousQuestion();
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    nextQuestion();
                    break;
                case 'f':
                case 'F':
                    if (e.ctrlKey || e.metaKey) {
                        e.preventDefault();
                        toggleFlag();
                    }
                    break;
                case 'm':
                case 'M':
                    if (e.ctrlKey || e.metaKey) {
                        e.preventDefault();
                        toggleSidebar();
                    }
                    break;
                case '1':
                case '2':
                case '3':
                case '4':
                    if (!e.ctrlKey && !e.metaKey) {
                        e.preventDefault();
                        const optionIndex = parseInt(e.key) - 1;
                        if (optionIndex < questions[currentQuestionIndex].options.length) {
                            selectOption(optionIndex);
                        }
                    }
                    break;
            }
        });
        
        // Initialize when DOM is loaded
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeApp);
        } else {
            initializeApp();
        }
        
        // Load saved theme
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            document.body.setAttribute('data-theme', savedTheme);
            document.getElementById('themeBtn').textContent = savedTheme === 'light' ? '🌙' : '☀️';
        }
    </script>
</body>
</html>
