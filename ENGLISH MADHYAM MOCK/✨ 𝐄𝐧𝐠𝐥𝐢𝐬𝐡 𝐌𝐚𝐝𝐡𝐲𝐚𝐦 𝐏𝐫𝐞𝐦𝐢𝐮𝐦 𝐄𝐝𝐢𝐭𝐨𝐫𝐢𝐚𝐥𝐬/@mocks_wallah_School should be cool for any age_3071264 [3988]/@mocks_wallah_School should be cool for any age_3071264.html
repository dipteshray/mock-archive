<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6366f1">
    <title>devgagan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #06b6d4;
            
            --glass-bg: rgba(255, 255, 255, 0.95);  /* Changed from 0.25 to 0.95 */
            --glass-border: rgba(255, 255, 255, 0.8);  /* Changed from 0.18 to 0.8 */
            --shadow-light: 0 8px 32px rgba(31, 38, 135, 0.37);
            --shadow-heavy: 0 20px 60px rgba(0, 0, 0, 0.3);
            
            --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --bounce: cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        
[data-theme="light"] {
    --bg: #ffffff;  /* Changed from gradient to solid white */
    --card-bg: #ffffff;  /* Changed from transparent to solid white */
    --text: #1a202c;
    --text-secondary: #4a5568;
    --border: rgba(0, 0, 0, 0.1);  /* Changed to darker border for contrast */
    --nav-bg: #ffffff;  /* Changed from transparent to solid white */
}

[data-theme="dark"] {
    --bg: #1a1a2e;  /* Changed from gradient to solid dark */
    --card-bg: #16213e;  /* Changed from transparent to solid dark */
    --text: #f7fafc;
    --text-secondary: #a0aec0;
    --border: rgba(255, 255, 255, 0.1);
    --nav-bg: #0c0c0c;  /* Changed from transparent to solid dark */
}
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--bg);  /* Now just using the solid color */
    z-index: -1;
}
        
        /* Floating particles animation */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: float 6s infinite ease-in-out;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.7; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 0.3; }
        }
        
        /* Header with glassmorphism */
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 16px 20px;
            z-index: 100;
            transition: var(--transition);
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .menu-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            font-size: 18px;
        }
        
        .menu-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-light);
        }
        
        .menu-btn:active {
            transform: scale(0.95);
        }
        
        .logo {
            font-weight: 800;
            font-size: 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        
        [data-theme="dark"] .logo {
    background: none;
    -webkit-text-fill-color: white; /* White text in dark mode */
    color: white; /* Fallback */
}
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            font-size: 20px;
        }
        
        .theme-toggle:hover {
            transform: rotate(180deg) scale(1.1);
            box-shadow: var(--shadow-light);
        }
        
        /* Advanced Timer */
        .timer-container {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .timer {
            background: linear-gradient(135deg, var(--error), #dc2626);
            color: white;
            padding: 12px 16px;
            border-radius: 16px;
            font-family: 'Inter', monospace;
            font-weight: 600;
            font-size: 14px;
            box-shadow: var(--shadow-light);
            position: relative;
            overflow: hidden;
        }
        
        .timer.warning {
            animation: pulse 1s infinite;
        }
        
        .timer.critical {
            animation: shake 0.5s infinite;
            background: linear-gradient(135deg, #dc2626, #991b1b);
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
        }
        
        .progress-ring {
            width: 40px;
            height: 40px;
            transform: rotate(-90deg);
        }
        
        .progress-circle {
            fill: none;
            stroke: rgba(255, 255, 255, 0.3);
            stroke-width: 3;
        }
        
        .progress-circle.progress {
            stroke: var(--primary);
            stroke-linecap: round;
            transition: stroke-dashoffset 0.3s ease;
        }
        
        /* Main Content */
        .main {
            margin: 80px 0 100px;
            padding: 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .question-container {
    background: var(--card-bg);  /* Now uses solid color */
    /* Remove or reduce blur effect */
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 32px;
    box-shadow: var(--shadow-heavy);
    position: relative;
    overflow: hidden;
    transition: var(--transition);
}
        .question-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--info));
            background-size: 200% 100%;
            animation: gradient-flow 3s linear infinite;
        }
        
        @keyframes gradient-flow {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .question-number {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 12px 20px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: var(--shadow-light);
            position: relative;
        }
        
        .question-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }
        
        .question-progress {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
        }
        
        .question-marks {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 600;
        }
        
        .question-text {
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 32px;
            color: var(--text);
            font-weight: 500;
        }
        
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .option {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 20px 24px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            font-size: 16px;
            font-weight: 500;
            color: var(--text);
            overflow: hidden;
        }
        
        .option::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s;
        }
        
        .option:hover::before {
            left: 100%;
        }
        
        .option:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: var(--shadow-light);
        }
        
        .option:active {
            transform: scale(0.98);
        }

        .menu-btn, .theme-toggle, .nav-btn.prev, .action-btn.flag {
    background: var(--card-bg);  /* Solid background */
    backdrop-filter: none;  /* Remove blur */
}

.sidebar {
    background: var(--card-bg);  /* Solid background */
    backdrop-filter: none;  /* Remove blur */
}
        
        .option.selected {
            background: rgba(99, 102, 241, 0.15);
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-light);
        }
        
        .option.correct {
            background: rgba(16, 185, 129, 0.15);
            border-color: var(--success);
            color: var(--success);
        }
        
        .option.incorrect {
            background: rgba(239, 68, 68, 0.15);
            border-color: var(--error);
            color: var(--error);
        }
        
        .option.disabled {
            background: rgba(160, 174, 192, 0.1);
            border-color: var(--text-secondary);
            color: var(--text-secondary);
            cursor: not-allowed;
        }
        
        .option-indicator {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }
        
        .option.selected .option-indicator {
            background: var(--primary);
            color: white;
        }
        
        .option.correct .option-indicator {
            background: var(--success);
            color: white;
        }
        
        .option.incorrect .option-indicator {
            background: var(--error);
            color: white;
        }
        
        .option:not(.selected):not(.correct):not(.incorrect) .option-indicator {
            border: 2px solid var(--border);
        }
        
        /* Solution Panel */
        .solution-panel {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(245, 158, 11, 0.05));
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 20px;
            padding: 24px;
            margin-top: 24px;
            backdrop-filter: blur(10px);
            transform: translateY(20px);
            opacity: 0;
            transition: var(--transition);
        }
        
        .solution-panel.show {
            transform: translateY(0);
            opacity: 1;
        }
        
        .solution-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            color: var(--warning);
            font-weight: 700;
        }
        
        .solution-content {
            color: var(--text);
            line-height: 1.6;
            font-size: 15px;
        }
        
        /* Navigation */
        .navigation {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            padding: 16px 20px;
            z-index: 90;
        }
        
        .nav-content {
            display: flex;
            gap: 12px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .nav-btn {
            flex: 1;
            padding: 16px 24px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        
        .nav-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.6s;
        }
        
        .nav-btn:hover::before {
            left: 100%;
        }
        
        .nav-btn:active {
            transform: scale(0.95);
        }
        
        .nav-btn.prev {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            backdrop-filter: blur(10px);
        }
        
        .nav-btn.next {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: var(--shadow-light);
        }
        
        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .nav-btn:disabled::before {
            display: none;
        }
        
        /* Question Panel Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid var(--border);
            z-index: 200;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-heavy);
        }
        
        .sidebar.open {
            right: 0;
        }
        
        .sidebar-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .sidebar-title {
            font-weight: 800;
            font-size: 20px;
        }
        
        .close-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        
        .close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(90deg);
        }
        
        .sidebar-body {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }
        
        .questions-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 32px;
        }
        
        .question-btn {
            background: var(--card-bg);
            border: 2px solid var(--border);
            color: var(--text-secondary);
            width: 48px;
            height: 48px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            position: relative;
        }
        
        .question-btn:hover {
            transform: scale(1.1);
            box-shadow: var(--shadow-light);
        }
        
        .question-btn:active {
            transform: scale(0.95);
        }
        
        .question-btn.current {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: var(--shadow-light);
        }
        
        .question-btn.answered {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border-color: var(--success);
        }
        
        .question-btn.correct {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }
        
        .question-btn.incorrect {
            background: var(--error);
            color: white;
            border-color: var(--error);
        }
        
        .question-btn.flagged::after {
            content: '🚩';
            position: absolute;
            top: -4px;
            right: -4px;
            font-size: 10px;
        }
        
        /* Legend */
        .legend {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 32px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .legend-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        
        .legend-dot.current { background: var(--primary); }
        .legend-dot.answered { background: var(--success); }
        .legend-dot.unattempted { background: var(--text-secondary); }
        .legend-dot.flagged { background: var(--warning); }
        
        /* Action Buttons */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .action-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }
        
        .action-btn.flag {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        
        .action-btn.submit {
            background: linear-gradient(135deg, var(--error), #dc2626);
            color: white;
            box-shadow: var(--shadow-light);
        }
        
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-heavy);
        }
        
        .action-btn:active {
            transform: scale(0.98);
        }
        
        /* Overlay */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 150;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }
        
        .overlay.show {
            opacity: 1;
            visibility: visible;
        }
        
        /* Result Modal */
        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 32px;
            max-width: 90vw;
            width: 480px;
            z-index: 300;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
            box-shadow: var(--shadow-heavy);
            overflow: hidden;
        }
        
        .modal.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }
        
        .modal-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 40px 32px;
            text-align: center;
        }
        
        .modal-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        
        .modal-subtitle {
            opacity: 0.9;
            font-size: 16px;
            font-weight: 500;
        }
        
        .modal-body {
            padding: 32px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            text-align: center;
            padding: 20px 16px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }
        
        .stat-label {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        
        .stat-value {
            color: var(--text);
            font-size: 24px;
            font-weight: 800;
        }
        
        .final-score {
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
            border-radius: 20px;
            padding: 32px;
            text-align: center;
            margin-bottom: 24px;
            box-shadow: var(--shadow-light);
        }
        
        .score-text {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        
        .percentage-text {
            opacity: 0.9;
            font-size: 18px;
            font-weight: 600;
        }
        
        .modal-actions {
            display: flex;
            gap: 12px;
        }
        
        .modal-btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }
        
        .modal-btn.primary {
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary);
            border: 1px solid rgba(99, 102, 241, 0.3);
        }
        
        .modal-btn.success {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        
        .modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-light);
        }
        
        /* Auto-save indicator */
        .auto-save {
            position: fixed;
            top: 80px;
            right: 20px;
            background: var(--success);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            transform: translateX(100px);
            opacity: 0;
            transition: var(--transition);
            z-index: 90;
        }
        
        .auto-save.show {
            transform: translateX(0);
            opacity: 1;
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .header-content {
                padding: 0 4px;

<body data-theme="light">
    <!-- Floating particles background -->
    <div class="particles" id="particles"></div>
    
    <!-- Auto-save indicator -->
    <div class="auto-save" id="autoSave">

    </div>
    
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="header-left">
                <button class="menu-btn" onclick="toggleSidebar()">
                    ☰
                </button>
                <div class="logo">Mocks Wallah</div>
            </div>

                <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn" aria-label="Toggle theme">
                    🌙
                </button>
                <div class="timer-container">

                                stroke-dasharray="113.1" stroke-dashoffset="0" id="progressCircle"></circle>

    <!-- Main Content -->

                </div>
            </div>
            <div class="question-text" id="questionText"></div>
            <div class="options-container" id="optionsContainer"></div>
            <div class="solution-panel" id="solutionPanel">
                <div class="solution-header">
                    <span>💡</span>
                    <span>Solution</span>
                </div>
                <div class="solution-content" id="solutionContent"></div>
            </div>
        </div>
    </main>
    
    <!-- Navigation -->
    <nav class="navigation">
        <div class="nav-content">
            <button class="nav-btn prev" id="prevBtn" onclick="previousQuestion()" disabled>
                ← Previous
            </button>
            <button class="nav-btn next" id="nextBtn" onclick="nextQuestion()">
                Next →
            </button>
        </div>
    </nav>
    
    <!-- Sidebar -->

            <div class="sidebar-title">Question Panel</div>
            <button class="close-btn" onclick="closeSidebar()" aria-label="Close panel">×</button>

        <div class="sidebar-body">
            <div class="questions-grid" id="questionsGrid"></div>
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-dot current"></div>

                <div class="legend-item">

                </div>

                </div>
                <div class="legend-item">

                </div>
            </div>
            <div class="action-buttons">

                    🚩 Flag Question
                </button>
                <button class="action-btn submit" onclick="submitTest()">
                    Submit Test

        </div>

    <!-- Overlay -->

    <script>
        // Core Variables
        const questions = [{"id": "160279", "question": "<strong>Comprehension</strong>:<br> In a world where technology and (de)globalisation are swiftly upending even the best-laid life plans for young people, lifelong learning could well be the only dependable life jacket. In a welcome move, Delhi University introduced the Competence Enhancement Scheme (CES) that allows individuals of any age to enrol in regular university courses and earn a certificate. Envisioned under National Education Policy (NEP) 2020, the scheme started small in 2023, but is steadily gaining traction. Up to 10% of seats in each course are now open to CES learners.</p> <p>Globally, of course, this is a well-established practice. The US offers a wide range of entry points for adults returning to education, with community colleges playing a central role. In Britain, the Access to Higher Education Diplomas programme is designed for adults returning to study without traditional qualifications. Sweden has long embraced education at all stages of life. Its Komvux system enables adults to re-enter secondary or higher education regardless of age, or how long they've been out of school. Brazil offers similar flexibility. Its Educacao de Jovens e Adultos (EJA) programme helps adults re-engage with literacy, primary and secondary education, often as a pathway to higher studies.</p> <p>These countries are at different points on the spectrum of providing lifelong learning to their citizens. But they share one growing recognition: education shouldn't be a one-shot deal. For India, this mindset is especially important now. As the silver economy grows, and tech and globalisation constantly change job requirements, people need to reskill and upskill continuously. That means education systems must be flexible not just in what they teach, but also when they allow people to learn.</p> <p><strong>What is the main theme of the passage?</strong>", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The decline of traditional education systems in the world", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The importance of integrating technology into schools", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Lifelong learning as a necessity in a changing world", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> How globalisation harms education for older learners"], "correct_answer": 2, "solution": "No solution available"}, {"id": "160280", "question": "<strong>Comprehension</strong>:<br> In a world where technology and (de)globalisation are swiftly upending even the best-laid life plans for young people, lifelong learning could well be the only dependable life jacket. In a welcome move, Delhi University introduced the Competence Enhancement Scheme (CES) that allows individuals of any age to enrol in regular university courses and earn a certificate. Envisioned under National Education Policy (NEP) 2020, the scheme started small in 2023, but is steadily gaining traction. Up to 10% of seats in each course are now open to CES learners.</p> <p>Globally, of course, this is a well-established practice. The US offers a wide range of entry points for adults returning to education, with community colleges playing a central role. In Britain, the Access to Higher Education Diplomas programme is designed for adults returning to study without traditional qualifications. Sweden has long embraced education at all stages of life. Its Komvux system enables adults to re-enter secondary or higher education regardless of age, or how long they've been out of school. Brazil offers similar flexibility. Its Educacao de Jovens e Adultos (EJA) programme helps adults re-engage with literacy, primary and secondary education, often as a pathway to higher studies.</p> <p>These countries are at different points on the spectrum of providing lifelong learning to their citizens. But they share one growing recognition: education shouldn't be a one-shot deal. For India, this mindset is especially important now. As the silver economy grows, and tech and globalisation constantly change job requirements, people need to reskill and upskill continuously. That means education systems must be flexible not just in what they teach, but also when they allow people to learn.</p> <p><strong>From the passage, which of the following can be most reasonably inferred about the Competence Enhancement Scheme (CES) in India?</strong>", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> CES is primarily aimed at providing remedial education to students who failed to complete their schooling in the traditional system.", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> CES reflects a policy shift towards recognising learning as a continuous process that is not limited by age or stage of life.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> CES is modelled exactly on Sweden’s Komvux system and functions identically in structure and scope.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> CES was introduced as a temporary pilot project without any long-term integration into the national education framework."], "correct_answer": 1, "solution": "No solution available"}, {"id": "160281", "question": "<strong>Comprehension</strong>:<br> In a world where technology and (de)globalisation are swiftly upending even the best-laid life plans for young people, lifelong learning could well be the only dependable life jacket. In a welcome move, Delhi University introduced the Competence Enhancement Scheme (CES) that allows individuals of any age to enrol in regular university courses and earn a certificate. Envisioned under National Education Policy (NEP) 2020, the scheme started small in 2023, but is steadily gaining traction. Up to 10% of seats in each course are now open to CES learners.</p> <p>Globally, of course, this is a well-established practice. The US offers a wide range of entry points for adults returning to education, with community colleges playing a central role. In Britain, the Access to Higher Education Diplomas programme is designed for adults returning to study without traditional qualifications. Sweden has long embraced education at all stages of life. Its Komvux system enables adults to re-enter secondary or higher education regardless of age, or how long they've been out of school. Brazil offers similar flexibility. Its Educacao de Jovens e Adultos (EJA) programme helps adults re-engage with literacy, primary and secondary education, often as a pathway to higher studies.</p> <p>These countries are at different points on the spectrum of providing lifelong learning to their citizens. But they share one growing recognition: education shouldn't be a one-shot deal. For India, this mindset is especially important now. As the silver economy grows, and tech and globalisation constantly change job requirements, people need to reskill and upskill continuously. That means education systems must be flexible not just in what they teach, but also when they allow people to learn.</p> <p><strong>According to the passage, why is lifelong learning particularly important for India at this moment in time?</strong>", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Because the growing silver economy and rapid changes in technology and globalisation demand constant reskilling and upskilling.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Because traditional university degrees are losing their recognition in global job markets.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Because India needs to replicate the exact education models of the US, Britain, Sweden, and Brazil.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Because NEP 2020 requires that at least 10% of all university seats be reserved for adult learners."], "correct_answer": 0, "solution": "No solution available"}, {"id": "160282", "question": "<strong>Comprehension</strong>:<br> In a world where technology and (de)globalisation are swiftly upending even the best-laid life plans for young people, lifelong learning could well be the only dependable life jacket. In a welcome move, Delhi University introduced the Competence Enhancement Scheme (CES) that allows individuals of any age to enrol in regular university courses and earn a certificate. Envisioned under National Education Policy (NEP) 2020, the scheme started small in 2023, but is steadily gaining traction. Up to 10% of seats in each course are now open to CES learners.</p> <p>Globally, of course, this is a well-established practice. The US offers a wide range of entry points for adults returning to education, with community colleges playing a central role. In Britain, the Access to Higher Education Diplomas programme is designed for adults returning to study without traditional qualifications. Sweden has long embraced education at all stages of life. Its Komvux system enables adults to re-enter secondary or higher education regardless of age, or how long they've been out of school. Brazil offers similar flexibility. Its Educacao de Jovens e Adultos (EJA) programme helps adults re-engage with literacy, primary and secondary education, often as a pathway to higher studies.</p> <p>These countries are at different points on the spectrum of providing lifelong learning to their citizens. But they share one growing recognition: education shouldn't be a one-shot deal. For India, this mindset is especially important now. As the silver economy grows, and tech and globalisation constantly change job requirements, people need to reskill and upskill continuously. That means education systems must be flexible not just in what they teach, but also when they allow people to learn.</p> <p><strong>Direction: Choose the option that best fills the blank from the passage in a way that preserves the original meaning and tone.</strong></p> <p>In a world where technology and ______ are swiftly upending even the best-laid life plans for young people, lifelong learning could well be the only dependable life jacket.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> hyper-connectivity", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> deglobalisation", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> socio-political unrest", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> economic liberalisation"], "correct_answer": 1, "solution": "No solution available"}, {"id": "160283", "question": "<strong>Comprehension</strong>:<br> In a world where technology and (de)globalisation are swiftly upending even the best-laid life plans for young people, lifelong learning could well be the only dependable life jacket. In a welcome move, Delhi University introduced the Competence Enhancement Scheme (CES) that allows individuals of any age to enrol in regular university courses and earn a certificate. Envisioned under National Education Policy (NEP) 2020, the scheme started small in 2023, but is steadily gaining traction. Up to 10% of seats in each course are now open to CES learners.</p> <p>Globally, of course, this is a well-established practice. The US offers a wide range of entry points for adults returning to education, with community colleges playing a central role. In Britain, the Access to Higher Education Diplomas programme is designed for adults returning to study without traditional qualifications. Sweden has long embraced education at all stages of life. Its Komvux system enables adults to re-enter secondary or higher education regardless of age, or how long they've been out of school. Brazil offers similar flexibility. Its Educacao de Jovens e Adultos (EJA) programme helps adults re-engage with literacy, primary and secondary education, often as a pathway to higher studies.</p> <p>These countries are at different points on the spectrum of providing lifelong learning to their citizens. But they share one growing recognition: education shouldn't be a one-shot deal. For India, this mindset is especially important now. As the silver economy grows, and tech and globalisation constantly change job requirements, people need to reskill and upskill continuously. That means education systems must be flexible not just in what they teach, but also when they allow people to learn.</p> <p><strong>Direction: Identify whether the statement is True or False based on the passage</strong></p> <p><strong>Statement</strong>: The Competence Enhancement Scheme (CES) at Delhi University allows individuals only under the age of 40 to enrol in regular courses, in line with the National Education Policy 2020.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> True — The CES has an upper age limit of 40 years.", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> False — The CES allows individuals of any age to enrol.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> True — The CES restricts enrolment for senior citizens.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> False — The CES only offers short-term vocational programs."], "correct_answer": 1, "solution": "No solution available"}, {"id": "160263", "question": "<strong>Sentences of a paragraph are given below in jumbled order. Select the option that arranges the sentences in the correct order to form a meaningful and coherent paragraph.</strong></p> <p>A. I still recall the joy of running to our local library with my friends the moment the last school bell rang.</p> <p>B. Reading is one of the most fulfilling ways to spend leisure time.</p> <p>C. We were in eighth standard then, full of curiosity and energy. The librarian knew us well — we would stay until he gently reminded us it was time to close.</p> <p>D. For me, reading has never been just a habit — it has been a way of life, especially during my school days.</p> <p>E. Saturdays and Sundays were sacred reading days. We never missed a weekend at the library.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> C, D, A, B, E", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> E, D, A, C, B", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> B, D, A, C, E", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> A, B, E, C, D"], "correct_answer": 2, "solution": "C) B, D, A, C, E\n\nB: Starts with the subject \"Reading\" and verb \"is\", introducing the paragraph’s central topic.<br> D: Uses the pronoun \"For me\" to link back to B’s subject (\"Reading\"), and adds the verb \"has been\" to personalize the topic.<br> A: Continues with the pronoun \"I\" (referring to D’s speaker) and verb \"recall\", shifting to a specific past action tied to D’s \"school days\".<br> C: Replaces A’s \"I\" with the pronoun \"We\" (referring to A’s \"friends\") and uses the verb \"were\" to add details about the timeframe.<br> E: Uses the same pronoun \"We\" (from C) and verb \"were\" to extend the timeline, while \"reading days\" loops back to B’s core topic.\n\nIn Hindi:\n\nयह subject \"Reading\" को introduce करता है, जो paragraph के main topic को establish करता है।\n\nPronoun \"For me\" और verb \"has been\" B के general subject \"Reading\" को personal experience से जोड़ता है। यह B के topic को expand करता है।\n\nSubject \"I\" और verb \"recall\" D के \"my school days\" से directly connect होता है। \"Still recall\" D के present-perfect tense (\"has been\") को past action में transition करता है।\n\nPronoun \"We\" A के \"my friends\" को refer करता है। \"Eighth standard\" A के \"school days\" को specify करता है, और librarian का description A के \"library\" से जुड़ता है।\n\n\"Saturdays and Sundays\" C के time reference (\"until closing\") को extend करता है। \"Sacred reading days\" और \"weekend at the library\" B के \"fulfilling ways\" और A/C के library visits को grammatically complete करता है।"}, {"id": "160266", "question": "<strong>In the following sentence, a word is given in brackets. Select the appropriate word from the options to fill in the blank so that it is the closest synonym of the word given in brackets.</strong></p> <p>Even after years of friendship, he remained ____________________ (LOYAL) and stood by her in every crisis.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Turbid", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Nebulous", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Ephemeral", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Steadfast"], "correct_answer": 3, "solution": "D) <strong>Steadfast</strong> (adjective) – Firm, unwavering, and loyal. दृढ़ / अडिग / वफ़ादार\n\n<strong>Synonym: Loyal </strong>(adjective) – Giving or showing constant support and allegiance. वफ़ादार / निष्ठावान\n\n<strong>Ephemeral </strong>– Lasting a very short time. क्षणभंगुर\n\n<strong>Nebulous </strong>– Vague, unclear. अस्पष्ट\n\n<strong>Turbid </strong>– Cloudy or confused. मटमैला"}, {"id": "160231", "question": "<strong>Select the most appropriate idiom to fill in the blank:</strong><br> When the CEO discovered the company’s internal corruption, he realized he had managed __________ and would have to deal with serious consequences.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> to catch a tartar", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> to give currency", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> to hush money", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> to come off with flying colours"], "correct_answer": 0, "solution": "A) to catch a tartar\n\n<strong>To catch a tartar</strong> – To encounter someone or something powerful, dangerous, or difficult to handle. कठिन या खतरनाक व्यक्ति/स्थिति से सामना करना\n\n<strong>To give currency</strong> – To make something well known or spread it. प्रचार करना\n\n<strong>Hush money</strong> – Money given to keep someone silent about wrongdoing. चुप कराने के लिए दी जाने वाली रिश्वत\n\n<strong>To come off with flying colours</strong> – To succeed brilliantly. शानदार सफलता पाना"}, {"id": "160234", "question": "<strong>Select the idiom which should be the correct explanation of the given line:</strong><br> Rakesh knew he had <strong>got into hot water</strong> after missing three deadlines in a row. To meet the next one, his team worked <strong>with whips and spur</strong>, trying to speed up the project. The CEO wanted <strong>rhyme or reason</strong> for the repeated delays, but Rakesh didn’t want to show the <strong>seamy side of life</strong> in the office politics that had caused the problem.</p> <p><strong>Meaning to identify:</strong> To get into trouble or a difficult situation.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Rhyme or reason", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Seamy side of life", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> To get into hot water", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Whips and spur"], "correct_answer": 2, "solution": "<strong>C) To get into hot</strong> <strong>water</strong> (idiom) – To get into trouble or a difficult situation. मुसीबत में पड़ना।\n\n<strong>Whips and spur</strong> (idiom) – With great speed and urgency. पूरी तेजी और उत्साह के साथ।\n\n<strong>Rhyme or reason</strong> (idiom) – Logical explanation or justification. तार्किक कारण या स्पष्टीकरण।\n\n<strong>Seamy side of life</strong> (idiom) – The unpleasant or sordid aspects of life. जीवन का गंदा या नकारात्मक पहलू।"}, {"id": "160237", "question": "<strong>Read the following description carefully and choose the correct one-word substitution of 'Something' that best describes the condition being portrayed.</strong></p> <p>Something is the act of taking someone else’s ideas, writings, or work and presenting them as one’s own without proper acknowledgment. It is considered unethical and is often a serious offense in academic, creative, and professional fields.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Forgery", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Plagiarism", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Piracy", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Fabrication"], "correct_answer": 1, "solution": "B) Plagiarism (noun)</strong> – The act of presenting someone else’s work or ideas as one’s own without proper acknowledgment. <strong>साहित्यिक चोरी\n\nForgery (noun)</strong> – The crime of making a copy of something, especially a document, money, or artwork, in order to cheat people. <strong>जालसाज़ी\n\nPiracy (noun)</strong> – The practice of attacking and robbing ships at sea or illegally copying and distributing creative works. <strong>समुद्री डकैती / साहित्यिक चोरी\n\nFabrication (noun)</strong> – The action of inventing or manufacturing something, often with deceitful intent. <strong>गढ़ना / मनगढ़ंत बनाना"}, {"id": "160267", "question": "<strong>In the following sentence, a word is given in brackets. Select the appropriate word from the options to fill in the blank so that it is the closest synonym of the word given in brackets.</strong></p> <p>Even the best of us are ____________________ (FALLIBLE) and can make mistakes under pressure.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Errant", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Sere", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Noctilucent", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Livid"], "correct_answer": 0, "solution": "A) <strong>Errant</strong> (adjective) – Capable of error; straying from the right course. त्रुटिपूर्ण / भटकने वाला\n\n<strong>Synonym: Fallible </strong>(adjective) – Capable of making mistakes or being wrong. त्रुटिपूर्ण / भूल करने योग्य\n\n<strong>Sere </strong>– Dry or withered. मुरझाया\n\n<strong>Noctilucent </strong>– Shining at night. रात में चमकने वाला\n\n<strong>Livid </strong>– Extremely angry or bruised-blue. क्रोधित / नीला पड़ा"}, {"id": "160228", "question": "<strong>In the following question, List I contains idioms/phrases, and List II contains sentences with blanks where these idioms/phrases should be filled. Match the idioms in List I with their correct usage in List II and select the correct answer using the code given below the Lists.</strong></p> <p><strong>LIST I</strong></p> <p>1.Flesh and blood</p> <p>2.To stem the tide of</p> <p>3.To be under a cloud</p> <p>4. Not born yesterday</p> <p><strong>LIST II</strong><br> A. The company’s CEO has been ....................... ever since the financial scandal broke out.<br> B. As a teacher, she works hard to ....................... the spread of misinformation among students.<br> C. He may look naïve, but he is ....................... and will not be easily fooled.<br> D. It was impossible for her ....................... to tolerate such injustice.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> 1-D, 2-B, 3-A, 4-C", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> 1-A, 2-C, 3-B, 4-D", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> 1-B, 2-D, 3-A, 4-C", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> 1-D, 2-A, 3-C, 4-B"], "correct_answer": 0, "solution": "1) 1-D, 2-B, 3-A, 4-C\n\n<strong>Flesh and blood</strong> – A human being with emotions and weaknesses. इंसान होने के नाते भावनाएँ होना\n\nCorrect usage: It was impossible for her flesh and blood to tolerate such injustice.\n\n<strong>To stem the tide of</strong> – To stop the spread of something harmful. किसी बुरी चीज़ के फैलाव को रोकना\n\nCorrect usage: She worked hard to stem the tide of misinformation.\n\n<strong>To be under a cloud</strong> – To be suspected or discredited. शक के घेरे में होना\n\nCorrect usage: The CEO has been under a cloud since the scandal.\n\n<strong>Not born yesterday</strong> – Not easily deceived; experienced. आसानी से धोखा न खाने वाला\n\nCorrect usage: He is not born yesterday; he knows what’s going on."}, {"id": "160274", "question": "<strong>Choose the most appropriate option to change the voice (active / passive) form of the given sentence.</strong></p> <p>By the time the committee announces the final results, the students will have been waiting anxiously outside the hall for more than three hours.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> By the time the final results will be announced by the committee, more than three hours of anxious waiting will have been endured by the students outside the hall.", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> By the time the final results are announced by the committee, the students will have been waiting anxiously outside the hall for more than three hours.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The students will have been waiting anxiously outside the hall for more than three hours by the time the committee will announce the final results.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The students will have been waiting anxiously outside the hall for more than three hours by the time the final results will be announced by the committee."], "correct_answer": 1, "solution": "B) By the time the final results are announced by the committee, the students will have been waiting anxiously outside the hall for more than three hours.\n\nTense in active: Future Perfect Continuous (\"will have been waiting\").\n\nIn passive voice, the tense must remain Future Perfect Continuous if the waiting action is retained, but since the main clause already expresses a state (waiting), the verb \"announce\" in the time clause is converted to passive (are announced).\n\nOption A is grammatically flawed — “will be announced” with “by the time” doesn’t match the habitual/definite future sense.\n\nOption C is not a passive transformation — it keeps the active structure.\n\nOption D incorrectly uses “will be announced” instead of present form after “by the time.”\n\nRule: After “by the time,” we generally use present simple in time clauses for future reference."}, {"id": "160277", "question": "<strong>Select the best express Antonym of the given underlined word.</strong></p> <p>The company decided to <ins><strong>incentivise</strong> </ins>employees with bonuses to boost productivity.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Discourage", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Motivate", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Inspire", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Support"], "correct_answer": 0, "solution": "<strong>A) Incentivise</strong> (verb) – encourage, motivate, stimulate, reward, promote प्रोत्साहित करना\n\n<strong>Antonym: Discourage</strong> (verb) – To dissuade or demotivate. (हतोत्साहित करना)\n\n<strong>Motivate</strong> (verb) – To provide a reason to act. (प्रेरित करना)\n\n<strong>Inspire</strong> (verb) – To fill with enthusiasm. (प्रोत्साहित करना)\n\n<strong>Support</strong> (verb) – To help or back up. (समर्थन करना)"}, {"id": "160275", "question": "<strong>Choose the most appropriate option to change the voice (active/passive) form of the given sentence:</strong></p> <p>Had the emergency team not reached the accident site on time, the injured passengers would have been waiting for hours without any medical assistance.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Had the accident site not been reached on time by the emergency team, the injured passengers would have been left waiting for hours without any medical assistance.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> If the accident site had not been reached on time by the emergency team, the injured passengers would wait for hours without any medical assistance.", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> The injured passengers would have been waiting for hours without any medical assistance had the accident site not been reached on time by the emergency team.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> If the accident site would not have been reached on time by the emergency team, the injured passengers had been waiting for hours without any medical assistance."], "correct_answer": 2, "solution": "C) The injured passengers would have been waiting for hours without any medical assistance had the accident site not been reached on time by the emergency team.\n\nTense in active: Mixed Conditional — \"Had… not reached\" (Past Perfect) in if-clause + \"would have been waiting\" (Perfect Continuous Conditional) in main clause.\n\nIn passive, subject \"emergency team\" becomes agent, \"accident site\" becomes subject of the if-clause → \"had the accident site not been reached…\".\n\nOption A changes the meaning slightly by inserting “left waiting” (changes original structure).\n\nOption B wrongly changes conditional type by shifting tense to simple present in main clause (“would wait”).\n\nOption D is grammatically incorrect — “would not have been reached” in if-clause is non-standard for past unreal conditionals.\n\nOption C is correct because it preserves meaning, tense, and passive structure fully."}, {"id": "160278", "question": "<strong>Select the most appropriate option to substitute the underlined segment in the given sentence. If there is no need to substitute it, select 'No substitution required'.</strong></p> <p>Passengers were asked to identify their suitcases before <ins><strong>they were loaded</strong></ins> on the plane.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> they loaded on", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> it was loaded on", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> they were loaded over", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> No substitution required"], "correct_answer": 3, "solution": "'D) No substitution required"}, {"id": "160262", "question": "<strong>Parts of a sentence are given below in jumbled order. Select the option that gives their correct logical sequence and forms a meaningful sentence.</strong></p> <p>The cessation of Israel-Iran hostilities,/ sets the stage for the denouement of the horror drama (P)/ announced by United States President Donald Trump, (Q)/ with Hamas launching its Operation Toofan al-Aqsa (R)/ that began on October 7, 2023, (S).", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> P, S, R, Q", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> P, R, S, Q", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> R, Q, P, S", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Q, P, S, R"], "correct_answer": 3, "solution": "D) Q, P, S, R\n\nQ starts the sentence because it begins with the past participle \"announced,\" which grammatically attaches to the unlabeled subject \"The cessation of Israel-Iran hostilities.\" This creates a complete subject phrase: \"The cessation of Israel-Iran hostilities, announced by United States President Donald Trump.\"\n\nP follows Q as it introduces the main verb phrase \"sets the stage,\" which acts on the subject established in Q. This forms the core action: \"[The cessation] sets the stage for the denouement of the horror drama.\"\n\nS follows P as the relative clause \"that began on October 7, 2023\" directly modifies the noun \"horror drama\" from P. It adds essential temporal context to the drama.\n\nR concludes the sentence with the prepositional phrase \"with Hamas launching its Operation Toofan al-Aqsa,\" which grammatically connects to S as an adverbial modifier explaining how the horror drama began.\n\nQ पहले आता है क्योंकि यह past participle \"announced\" के साथ शुरू होता है, जो unlabeled subject \"The cessation...\" से grammatically जुड़ता है। यह एक complete subject phrase बनाता है: \"The cessation... announced by Trump.\"\n\nP, Q के बाद आता है क्योंकि यह main verb phrase \"sets the stage\" introduce करता है, जो Q में बने subject पर action दिखाता है।\n\nS, P के बाद आता है क्योंकि relative clause \"that began...\" सीधे P के noun \"horror drama\" को modify करता है। यह drama को temporal context देता है।\n\nR अंत में आता है prepositional phrase \"with Hamas launching...\" के साथ, जो S से adverbial modifier की तरह जुड़ता है और बताता है कि horror drama कैसे शुरू हुई।"}, {"id": "160238", "question": "<strong>Read the following description carefully and choose the correct one-word substitution of 'Someone' that best describes the condition being portrayed.</strong></p> <p>Someone who shows extreme and often unreasonable zeal or devotion toward a religious, political, or other cause, to the extent of ignoring rational arguments or opposing viewpoints, is called what?", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Fanatic", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Idealist", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Visionary", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Activist"], "correct_answer": 0, "solution": "A) Fanatic (noun)</strong> – A person filled with excessive and single-minded zeal, especially for an extreme religious or political cause. <strong>कट्टरपंथी / उन्मादी\n\nIdealist (noun)</strong> – A person guided more by ideals than by practical considerations. <strong>आदर्शवादी\n\nVisionary (noun)</strong> – A person with original ideas about what the future will or could be like. <strong>दूरदर्शी\n\nActivist (noun)</strong> – A person who campaigns to bring about political or social change. <strong>सक्रिय कार्यकर्ता"}, {"id": "160261", "question": "<strong>Parts of sentences are given below in jumbled order. Arrange the parts in the correct order to form a meaningful paragraph. The first part 'R.' is fixed.</strong></p> <p>R. Sigmund Freud had remarked that humans were convinced of their immortality.</p> <p>A. In keeping with the Supreme Court’s opinion that the right to die with dignity is a fundamental right, attention to quality of death is critical.</p> <p>B. Ever since technology has made the process of dying protracted and complicated, I have been espousing the cause of good death.</p> <p>C. In good death, the patient’s desires are taken into account for treatment preferences, quality of life and death, and maintenance of dignity.</p> <p>D. Discussing death, therefore, could be considered macabre, ghoulish, grim, and morbid.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> CADB", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> CDBA", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> DBAC", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> DABC"], "correct_answer": 2, "solution": "C) DBAC\n\nR: Fixed starting point introducing Freud's idea about humans avoiding thoughts of mortality.\n\nD: \"D\" follows \"R\" because the adverb \"therefore\" directly links Freud's observation (humans believe they are immortal) to the consequence (discussing death is seen as taboo/grim).<br> B: \"B\" follows \"D\" because it introduces a contrasting action (\"espousing\") in response to the grim reality mentioned in D. \"Ever since technology...\" sets a new temporal context explaining why the action (\"espousing\") began.<br> A: \"A\" follows \"B\" because it provides justification using the phrase \"In keeping with...\", linking the advocacy in B (good death) to an external authority (Supreme Court). The noun phrase \"attention to quality of death\" in A refers back to \"good death\" in B, reinforcing its importance.<br> C: \"C\" follows \"A\" because it defines and elaborates on the concept introduced in B and referenced in A (\"good death\" and \"dignity\").\n\nIn Hindi:\n\nR paragraph की fixed शुरुआत है, जो subject \"Sigmund Freud\" और verb \"had remarked\" को introduce करता है, यह बताते हुए कि humans को अपनी immortality पर विश्वास है।\n\nR के बाद D आता है क्योंकि adverb \"therefore\" R के विचार (immortality belief) का सीधा परिणाम (discussing death is macabre) show करता है। यह एक logical consequence है, जो grammatical connection बनाता है।\n\nD के बाद B आता है क्योंकि temporal phrase \"Ever since technology...\" D की समस्या (death discussion is grim) के संदर्भ में speaker के action (\"I have been espousing\") को introduce करता है।\n\nB के बाद A आता है क्योंकि phrase \"In keeping with...\" B के \"good death\" को Supreme Court के fundamental right (right to die with dignity) से जोड़ता है, और बताता है कि attention to quality of death critical है। यह एक सपोर्टिंग argument है जो B को justify करता है।\n\nA के बाद C आता है क्योंकि यह term \"good death\" को define करता है (जो B में introduce हुआ था) और \"dignity\" (जो A में mention हुई थी) के concept को विस्तार से explain करता है। यह paragraph को पूरा करता है।\n\nA (CADB): Starts with C (definition without context) after R, breaking logical flow.\n\nB (CDBA): Begins with C after R, but \"good death\" has no prior introduction.\n\nD (BCAD): Starts with B after R, missing the consequence \"therefore\" from D."}, {"id": "160276", "question": "<strong>Choose the most appropriate option to change the voice (active/passive) form of the given sentence:</strong></p> <p>The government will have implemented the new environmental regulations before the industrial sector realizes their far-reaching economic implications.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Before the industrial sector realizes their far-reaching economic implications, the new environmental regulations will have been implemented by the government.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The new environmental regulations would have been implemented by the government before the industrial sector realizes their far-reaching economic implications.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Before the industrial sector will realize their far-reaching economic implications, the new environmental regulations will be implemented by the government.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The new environmental regulations will be implemented by the government before the industrial sector will realize their far-reaching economic implications."], "correct_answer": 0, "solution": "A) Before the industrial sector realizes their far-reaching economic implications, the new environmental regulations will have been implemented by the government.\n\nTense in active: Main clause — Future Perfect (\"will have implemented\"), Time clause — Present Simple (\"realizes\").\n\nIn passive, \"the new environmental regulations\" becomes the subject, and \"government\" becomes the agent.\n\nOption A keeps the future perfect passive — “will have been implemented” — and the correct time clause tense (“realizes”).\n\nOption B wrongly uses \"would have been\" (conditional, not
