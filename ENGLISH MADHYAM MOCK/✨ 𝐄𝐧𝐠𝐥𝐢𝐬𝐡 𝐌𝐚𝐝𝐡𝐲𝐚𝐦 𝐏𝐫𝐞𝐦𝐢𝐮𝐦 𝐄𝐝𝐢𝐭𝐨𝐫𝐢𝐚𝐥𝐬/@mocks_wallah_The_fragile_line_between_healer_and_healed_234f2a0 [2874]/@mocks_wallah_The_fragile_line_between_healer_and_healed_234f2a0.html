<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6366f1">
    <title>devgagan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #06b6d4;
            
            --glass-bg: rgba(255, 255, 255, 0.95);  /* Changed from 0.25 to 0.95 */
            --glass-border: rgba(255, 255, 255, 0.8);  /* Changed from 0.18 to 0.8 */
            --shadow-light: 0 8px 32px rgba(31, 38, 135, 0.37);
            --shadow-heavy: 0 20px 60px rgba(0, 0, 0, 0.3);
            
            --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --bounce: cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        
[data-theme="light"] {
    --bg: #ffffff;  /* Changed from gradient to solid white */
    --card-bg: #ffffff;  /* Changed from transparent to solid white */
    --text: #1a202c;
    --text-secondary: #4a5568;
    --border: rgba(0, 0, 0, 0.1);  /* Changed to darker border for contrast */
    --nav-bg: #ffffff;  /* Changed from transparent to solid white */
}

[data-theme="dark"] {
    --bg: #1a1a2e;  /* Changed from gradient to solid dark */
    --card-bg: #16213e;  /* Changed from transparent to solid dark */
    --text: #f7fafc;
    --text-secondary: #a0aec0;
    --border: rgba(255, 255, 255, 0.1);
    --nav-bg: #0c0c0c;  /* Changed from transparent to solid dark */
}
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--bg);  /* Now just using the solid color */
    z-index: -1;
}
        
        /* Floating particles animation */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: float 6s infinite ease-in-out;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.7; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 0.3; }
        }
        
        /* Header with glassmorphism */
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 16px 20px;
            z-index: 100;
            transition: var(--transition);
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .menu-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            font-size: 18px;
        }
        
        .menu-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-light);
        }
        
        .menu-btn:active {
            transform: scale(0.95);
        }
        
        .logo {
            font-weight: 800;
            font-size: 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        
        [data-theme="dark"] .logo {
    background: none;
    -webkit-text-fill-color: white; /* White text in dark mode */
    color: white; /* Fallback */
}
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            font-size: 20px;
        }
        
        .theme-toggle:hover {
            transform: rotate(180deg) scale(1.1);
            box-shadow: var(--shadow-light);
        }
        
        /* Advanced Timer */
        .timer-container {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .timer {
            background: linear-gradient(135deg, var(--error), #dc2626);
            color: white;
            padding: 12px 16px;
            border-radius: 16px;
            font-family: 'Inter', monospace;
            font-weight: 600;
            font-size: 14px;
            box-shadow: var(--shadow-light);
            position: relative;
            overflow: hidden;
        }
        
        .timer.warning {
            animation: pulse 1s infinite;
        }
        
        .timer.critical {
            animation: shake 0.5s infinite;
            background: linear-gradient(135deg, #dc2626, #991b1b);
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
        }
        
        .progress-ring {
            width: 40px;
            height: 40px;
            transform: rotate(-90deg);
        }
        
        .progress-circle {
            fill: none;
            stroke: rgba(255, 255, 255, 0.3);
            stroke-width: 3;
        }
        
        .progress-circle.progress {
            stroke: var(--primary);
            stroke-linecap: round;
            transition: stroke-dashoffset 0.3s ease;
        }
        
        /* Main Content */
        .main {
            margin: 80px 0 100px;
            padding: 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .question-container {
    background: var(--card-bg);  /* Now uses solid color */
    /* Remove or reduce blur effect */
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 32px;
    box-shadow: var(--shadow-heavy);
    position: relative;
    overflow: hidden;
    transition: var(--transition);
}
        .question-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--info));
            background-size: 200% 100%;
            animation: gradient-flow 3s linear infinite;
        }
        
        @keyframes gradient-flow {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .question-number {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 12px 20px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: var(--shadow-light);
            position: relative;
        }
        
        .question-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }
        
        .question-progress {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
        }
        
        .question-marks {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 600;
        }
        
        .question-text {
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 32px;
            color: var(--text);
            font-weight: 500;
        }
        
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .option {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 20px 24px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            font-size: 16px;
            font-weight: 500;
            color: var(--text);
            overflow: hidden;
        }
        
        .option::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s;
        }
        
        .option:hover::before {
            left: 100%;
        }
        
        .option:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: var(--shadow-light);
        }
        
        .option:active {
            transform: scale(0.98);
        }

        .menu-btn, .theme-toggle, .nav-btn.prev, .action-btn.flag {
    background: var(--card-bg);  /* Solid background */
    backdrop-filter: none;  /* Remove blur */
}

.sidebar {
    background: var(--card-bg);  /* Solid background */
    backdrop-filter: none;  /* Remove blur */
}
        
        .option.selected {
            background: rgba(99, 102, 241, 0.15);
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-light);
        }
        
        .option.correct {
            background: rgba(16, 185, 129, 0.15);
            border-color: var(--success);
            color: var(--success);
        }
        
        .option.incorrect {
            background: rgba(239, 68, 68, 0.15);
            border-color: var(--error);
            color: var(--error);
        }
        
        .option.disabled {
            background: rgba(160, 174, 192, 0.1);
            border-color: var(--text-secondary);
            color: var(--text-secondary);
            cursor: not-allowed;
        }
        
        .option-indicator {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }
        
        .option.selected .option-indicator {
            background: var(--primary);
            color: white;
        }
        
        .option.correct .option-indicator {
            background: var(--success);
            color: white;
        }
        
        .option.incorrect .option-indicator {
            background: var(--error);
            color: white;
        }
        
        .option:not(.selected):not(.correct):not(.incorrect) .option-indicator {
            border: 2px solid var(--border);
        }
        
        /* Solution Panel */
        .solution-panel {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(245, 158, 11, 0.05));
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 20px;
            padding: 24px;
            margin-top: 24px;
            backdrop-filter: blur(10px);
            transform: translateY(20px);
            opacity: 0;
            transition: var(--transition);
        }
        
        .solution-panel.show {
            transform: translateY(0);
            opacity: 1;
        }
        
        .solution-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            color: var(--warning);
            font-weight: 700;
        }
        
        .solution-content {
            color: var(--text);
            line-height: 1.6;
            font-size: 15px;
        }
        
        /* Navigation */
        .navigation {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            padding: 16px 20px;
            z-index: 90;
        }
        
        .nav-content {
            display: flex;
            gap: 12px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .nav-btn {
            flex: 1;
            padding: 16px 24px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        
        .nav-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.6s;
        }
        
        .nav-btn:hover::before {
            left: 100%;
        }
        
        .nav-btn:active {
            transform: scale(0.95);
        }
        
        .nav-btn.prev {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            backdrop-filter: blur(10px);
        }
        
        .nav-btn.next {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: var(--shadow-light);
        }
        
        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .nav-btn:disabled::before {
            display: none;
        }
        
        /* Question Panel Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid var(--border);
            z-index: 200;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-heavy);
        }
        
        .sidebar.open {
            right: 0;
        }
        
        .sidebar-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .sidebar-title {
            font-weight: 800;
            font-size: 20px;
        }
        
        .close-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        
        .close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(90deg);
        }
        
        .sidebar-body {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }
        
        .questions-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 32px;
        }
        
        .question-btn {
            background: var(--card-bg);
            border: 2px solid var(--border);
            color: var(--text-secondary);
            width: 48px;
            height: 48px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            position: relative;
        }
        
        .question-btn:hover {
            transform: scale(1.1);
            box-shadow: var(--shadow-light);
        }
        
        .question-btn:active {
            transform: scale(0.95);
        }
        
        .question-btn.current {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: var(--shadow-light);
        }
        
        .question-btn.answered {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border-color: var(--success);
        }
        
        .question-btn.correct {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }
        
        .question-btn.incorrect {
            background: var(--error);
            color: white;
            border-color: var(--error);
        }
        
        .question-btn.flagged::after {
            content: '🚩';
            position: absolute;
            top: -4px;
            right: -4px;
            font-size: 10px;
        }
        
        /* Legend */
        .legend {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 32px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .legend-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        
        .legend-dot.current { background: var(--primary); }
        .legend-dot.answered { background: var(--success); }
        .legend-dot.unattempted { background: var(--text-secondary); }
        .legend-dot.flagged { background: var(--warning); }
        
        /* Action Buttons */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .action-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }
        
        .action-btn.flag {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        
        .action-btn.submit {
            background: linear-gradient(135deg, var(--error), #dc2626);
            color: white;
            box-shadow: var(--shadow-light);
        }
        
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-heavy);
        }
        
        .action-btn:active {
            transform: scale(0.98);
        }
        
        /* Overlay */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 150;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }
        
        .overlay.show {
            opacity: 1;
            visibility: visible;
        }
        
        /* Result Modal */
        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 32px;
            max-width: 90vw;
            width: 480px;
            z-index: 300;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
            box-shadow: var(--shadow-heavy);
            overflow: hidden;
        }
        
        .modal.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }
        
        .modal-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 40px 32px;
            text-align: center;
        }
        
        .modal-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        
        .modal-subtitle {
            opacity: 0.9;
            font-size: 16px;
            font-weight: 500;
        }
        
        .modal-body {
            padding: 32px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            text-align: center;
            padding: 20px 16px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }
        
        .stat-label {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        
        .stat-value {
            color: var(--text);
            font-size: 24px;
            font-weight: 800;
        }
        
        .final-score {
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
            border-radius: 20px;
            padding: 32px;
            text-align: center;
            margin-bottom: 24px;
            box-shadow: var(--shadow-light);
        }
        
        .score-text {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        
        .percentage-text {
            opacity: 0.9;
            font-size: 18px;
            font-weight: 600;
        }
        
        .modal-actions {
            display: flex;
            gap: 12px;
        }
        
        .modal-btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }
        
        .modal-btn.primary {
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary);
            border: 1px solid rgba(99, 102, 241, 0.3);
        }
        
        .modal-btn.success {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        
        .modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-light);
        }
        
        /* Auto-save indicator */
        .auto-save {
            position: fixed;
            top: 80px;
            right: 20px;
            background: var(--success);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            transform: translateX(100px);
            opacity: 0;
            transition: var(--transition);
            z-index: 90;
        }
        
        .auto-save.show {
            transform: translateX(0);
            opacity: 1;
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .header-content {
                padding: 0 4px;

    <script>
        // Core Variables
        const questions = [{"id": "144149", "question": "<strong>Comprehension:</strong><br> Some voices stay with us for a lifetime. For me, one of them is the voice of a doctor saying, “We couldn’t save him” referring to my father. It came without fanfare, without softness, without ceremony. Just four words-and the world changed for me.</p> <p>At that moment, I wanted to hold someone accountable for the unbearable loss I had just suffered. My father was in the doctor’s care, and I had trusted him to guard my father’s life. And yet, death had slipped through the cracks. I remember standing there, wordless, caught in a strange pause between fury and resignation. I didn’t lash out. What would be the point now? The man was gone. To behave like a savage towards a doctor like many patients do in the face of a tragedy wasn’t in my character.</p> <p>And yet, somewhere deep within, the question lingered: had someone failed? Could the doctor have saved my father? Or had he tried enough and this was simply the limit of human effort?</p> <p>Years later, I would hear echoes of that question in an entirely different setting-this time, from the doctor’s side. A casual conversation with a dear friend-herself a seasoned physician-turned unexpectedly poignant. “We can’t retire because this is what are ordained to do in our lives,” she said, “and we can’t continue like this either because age is catching up and we are unable to balance work and life. Patients’ expectations these days are too high to meet satisfactorily.” She was referring not just to the long hours or the relentless pressure of life-and-death decisions, but to something more insidious: the growing distrust, the unrealistic expectations, and the Google-fed entitlement of patients who arrive armed with half-truths and full confidence.</p> <p>Another doctor friend chimed in at this point, only half in jest: “These days, people come to consult us not for answers, but to argue. And if things go wrong, we’re the first to be crucified.”</p> <p>In their voices, I heard a quiet exhaustion. A fatigue that wasn’t just physical, but existential. Medicine, once seen as a noble calling, is now burdened by demands that no human can fulfil. Patients seek quick cures, perfect answers, and unconditional availability. And when outcomes don’t match expectations, it’s not uncommon for doctors to face blame, abuse, and even violence as witnessed many times in our country.</p> <p>This is not to excuse negligence. Nor to overlook the occasional callousness that does exist. But in our collective haste to demand accountability, have we begun to forget that doctors, too, are human?</p> <p>That behind every prescription is a person who probably hasn’t slept a full night in weeks. That beneath every white coat is a beating heart, anxious to save, terrified to fail.</p> <p>My friend spoke of missing family gatherings. Of being unable to remember the last time she read a book for pleasure. Of watching the profession she once idolised become a crucible of stress and fear. “Sometimes,” she said, “I feel like I’m drowning in expectations I can’t meet.”</p> <p>It made me think-how did a role rooted in healing and service become one of the most unforgiving? When did the caregiver become the scapegoat?</p> <p>Perhaps we, as a society, have elevated doctors to a pedestal so high that we have forgotten the toll it takes to stay up there. We forget that not all battles can be won. That despite the best of efforts, some outcomes lie beyond control.</p> <p>We demand empathy from doctors, and rightly so. But empathy, like every virtue, must flow both ways. Maybe it’s time we paused to ask: what are we giving back to those we expect so much from? In an age where algorithms offer diagnoses and chatbots provide remedies, the human connection in medicine remains irreplaceable. A doctor’s touch, their voice, their presence-these are things no machine can replicate. But even these need nourishment, need rest, need understanding.</p> <p>Maybe the next time we visit a doctor, we could remember they too have burdens. That their mistakes are not always malice. That their fatigue is not indifference. That their silence might just be sorrow. And perhaps, with that awareness, we might begin to heal not just our own ailments, but the fractured bond between the healer and the healed. Because ultimately, both stand on the same side of a fragile line-one fighting to preserve life, the other desperate to hold on to it. And in that shared fragility lies our common humanity.</p> <p><strong>What is the tone of the passage?</strong>", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Angry and accusatory", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Indifferent and detached", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Sarcastic and critical", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Reflective and empathetic"], "correct_answer": 3, "solution": "No solution available"}, {"id": "144150", "question": "<strong>Comprehension:</strong><br> Some voices stay with us for a lifetime. For me, one of them is the voice of a doctor saying, “We couldn’t save him” referring to my father. It came without fanfare, without softness, without ceremony. Just four words-and the world changed for me.</p> <p>At that moment, I wanted to hold someone accountable for the unbearable loss I had just suffered. My father was in the doctor’s care, and I had trusted him to guard my father’s life. And yet, death had slipped through the cracks. I remember standing there, wordless, caught in a strange pause between fury and resignation. I didn’t lash out. What would be the point now? The man was gone. To behave like a savag ngs no machine can replicate. But even these need nourishment, need rest, need understanding.</p> <p>Maybe the next time we visit a doctor, we could remember they too have burdens. That their mistakes are not always malice. That their fatigue is not indifference. That their silence might just be sorrow. And perhaps, with that awareness, we might begin to heal not just our own ailments, but the fractured bond between the healer and the healed. Because ultimately, both stand on the same side of a fragile line-one fighting to preserve life, the other desperate to hold on to it. And in that shared fragility lies our common humanity.</p> <p><strong>Which exact four</strong><strong>‑word sentence does the narrator recall the doctor saying about the father?</strong>", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> “He did not survive.”", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> “We couldn’t save him.”", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> “Your father is gone.”", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> “There was nothing possible.”"], "correct_answer": 1, "solution": "No solution available"}, {"id": "144259", "question": "Comprehension:<br> Some voices stay with us for a lifetime. For me, one of them is the voice of a doctor saying, “We couldn’t save him” referring to my father. It came without fanfare, without softness, without ceremony. Just four words-and the world changed for me.</p> <p>At that moment, I wanted to hold someone accountable for the unbearable loss I had just suffered. My father was in the doctor’s care, and I had trusted him to guard my father’s life. And yet, death had slipped through the cracks. I remember standing there, wordless, caught in a strange pause between fury and resignation. I didn’t lash out. What would be the point now? The man was gone. To behave like a savage towards a doctor like many patients do in the face of a tragedy wasn’t in my character.</p> <p>And yet, somewhere deep within, the question lingered: had someone failed? Could the doctor have saved my father? Or had he tried enough and this was simply the limit of human effort?</p> <p>Years later, I would hear echoes of that question in an entirely different setting-this time, from the doctor’s side. A casual conversation with a dear friend-herself a seasoned physician-turned unexpectedly poignant. “We can’t retire because this is what are ordained to do in our lives,” she said, “and we can’t continue like this either because age is catching up and we are unable to balance work and life. Patients’ expectations these days are too high to meet satisfactorily.” She was referring not just to the long hours or the relentless pressure of life-and-death decisions, but to something more insidious: the growing distrust, the unrealistic expectations, and the Google-fed entitlement of patients who arrive armed with half-truths and full confidence.</p> <p>Another doctor friend chimed in at this point, only half in jest: “These days, people come to consult us not for answers, but to argue. And if things go wrong, we’re the first to be crucified.”</p> <p>In their voices, I heard a quiet exhaustion. A fatigue that wasn’t just physical, but existential. Medicine, once seen as a noble calling, is now burdened by demands that no human can fulfil. Patients seek quick cures, perfect answers, and unconditional availability. And when outcomes don’t match expectations, it’s not uncommon for doctors to face blame, abuse, and even violence as witnessed many times in our country.</p> <p>This is not to excuse negligence. Nor to overlook the occasional callousness that does exist. But in our collective haste to demand accountability, have we begun to forget that doctors, too, are human?</p> <p>That behind every prescription is a person who probably hasn’t slept a full night in weeks. That beneath every white coat is a beating heart, anxious to save, terrified to fail.</p> <p>My friend spoke of missing family gatherings. Of being unable to remember the last time she read a book for pleasure. Of watching the profession she once idolised become a crucible of stress and fear. “Sometimes,” she said, “I feel like I’m drowning in expectations I can’t meet.”</p> <p>It made me think-how did a role rooted in healing and service become one of the most unforgiving? When did the caregiver become the scapegoat?</p> <p>Perhaps we, as a society, have elevated doctors to a pedestal so high that we have forgotten the toll it takes to stay up there. We forget that not all battles can be won. That despite the best of efforts, some outcomes lie beyond control.</p> <p>We demand empathy from doctors, and rightly so. But empathy, like every virtue, must flow both ways. Maybe it’s time we paused to ask: what are we giving back to those we expect so much from? In an age where algorithms offer diagnoses and chatbots provide remedies, the human connection in medicine remains irreplaceable. A doctor’s touch, their voice, their presence-these are things no machine can replicate. But even these need nourishment, need rest, need understanding.</p> <p>Maybe the next time we visit a doctor, we could remember they too have burdens. That their mistakes are not always malice. That their fatigue is not indifference. That their silence might just be sorrow. And perhaps, with that awareness, we might begin to heal not just our own ailments, but the fractured bond between the healer and the healed. Because ultimately, both stand on the same side of a fragile line-one fighting to preserve life, the other desperate to hold on to it. And in that shared fragility lies our common humanity.<br> Q. In the context of the passage, which word is the closest synonym for “<strong>callousness</strong>”?", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Apathy", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Precision", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Compassion", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Fragility"], "correct_answer": 0, "solution": "No solution available"}, {"id": "144260", "question": "<strong>Select the most appropriate ANTONYM of the underlined word.</strong></p> <p>We should plan our actions <ins><strong>judiciously</strong> </ins>before going to war.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Irrational", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Irreverent", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Irrelevant", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Irritatingly"], "correct_answer": 0, "solution": "A) <strong>Judciously</strong> (adverb) – With good judgment or sense; wisely. विवेकपूर्ण – समझदारी से, बुद्धिमानी से\n\nAntonym: <strong>Irrational</strong> (adjective) – Not logical or reasonable, lacking sound judgment, illogical.अविवेकी – जो तर्कसंगत न हो, असंगत\n\n<strong>Irreverent</strong> (adjective) – Showing a lack of respect for people or things that are generally taken seriously.अनादरपूर्ण – आदरहीन\n\n<strong>Irrelevant</strong> (adjective) – Not connected with or relevant to something.असंगत – जो विषय से सम्बंधित न हो\n\n<strong>Irritatingly</strong> (adverb) – In a way that causes annoyance or frustration. चिड़चिड़ाहटपूर्ण – चिढ़ाने वाला"}, {"id": "144261", "question": "<strong>Select the option that can be used as a one-word substitute for the underlined group of words in the following sentence</strong>.</p> <p>Almost immediately, they heard the <strong><ins>high shrill piercing cr</ins>y</strong> of tires on the side road.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> bleach", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> beseech", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> creche", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Screech"], "correct_answer": 3, "solution": "D) <strong>Screech</strong> – high shrill piercing cry तीव्र और तीखी आवाज़"}, {"id": "144262", "question": "<strong>Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the correct order to form a meaningful and coherent paragraph.</strong></p> <p>A. It was as simple as announcing what you have in your store or the services you offer in your premises.</p> <p>B. Over the years, advertising has evolved into a major industry that goes beyond informing to persuading and influencing.</p> <p>C. Advertising was initially meant to make people aware of the goods available in the market.</p> <p>D. It is a form of brainwashing consumers.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> BADC", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> CABD", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> DABC", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> ADBC"], "correct_answer": 1, "solution": "B) <strong>CABD</strong>\n\n<strong>C starts</strong> the paragraph by introducing the topic: \"Advertising\" (subject) and its original purpose, i.e., making people aware of goods available (main idea). This sets the foundation of the paragraph, explaining the initial purpose of advertising\n\n<strong>A follows C :</strong> \"It\" refers to the subject \"advertising\" in C, making this the next logical connection. The verb \"was\" and the noun phrase \"as simple as announcing\" clearly describe what advertising used to involve.\n\n<strong>B follows A</strong> as it introduces the next stage of advertising, explaining how it evolved over time into a persuasive industry. \"Over the years\" signals a transition in time, and the subject \"advertising\" continues with a new action, \"has evolved,\" which matches the logical flow after discussing its initial simplicity.\n\n<strong>D concludes</strong> the paragraph by providing a more critical view of modern advertising, labeling it as a form of brainwashing. The subject \"It\" refers back to \"advertising\" in B, maintaining consistency, and the verb \"is\" directly connects the subject to the final evaluation of advertising as \"a form of brainwashing.\""}, {"id": "144263", "question": "<strong>Select the most appropriate option to substitute the underlined segment in the given sentence</strong>.</p> <p>Experts acknowledged that some <ins><strong>counterfeiting of document</strong></ins> techniques are virtually impossible to detect.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> fiasco", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> frenzy", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> forgery", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Impromptu"], "correct_answer": 2, "solution": "C) counterfeiting of document' के बदले <strong>'forgery'</strong> का प्रयोग होगा क्योंकि 'forgery' का अर्थ है \"जाली दस्तावेज़ बनाना\" 'fiasco' का अर्थ है \"विफलता या असफलता\", जो संदर्भ में उपयुक्त नहीं है। 'frenzy' का अर्थ है \"अत्यधिक उत्तेजना या पागलपन\", जो यहाँ सही नहीं बैठता। 'Impromptu' का अर्थ है \"बिना तैयारी के किया गया\", जो इस वाक्य में अप्रासंगिक है।\n\n<strong>'forgery'</strong> will be used instead of 'counterfeiting of document' because 'forgery' means \"the act of making a false document,\" which is appropriate and correct in the context. The other options are incorrect: 'fiasco' means \"a complete failure,\" which does not fit the context. 'frenzy' means \"a state of uncontrolled excitement or wild behavior,\" which is not relevant here. 'Impromptu' means \"done without preparation,\" which is not suitable in this context."}, {"id": "144264", "question": "<strong>Select the most appropriate option to substitute the underlined part of the given sentence. If there is no need to substitute it, select ‘No substitution’</strong>.</p> <p>As the rulers of the planet, humans like to think that<ins> <strong>it is the largest creatures</strong></ins> that will emerge victorious from the struggle for survival.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> they are the largest creatures", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> No substitution", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> they are a largest creature", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> it is the most large creatures"], "correct_answer": 0, "solution": "A) 'it is the largest creatures' के बदले <strong>'they are the largest creatures'</strong> का प्रयोग होगा क्योंकि 'humans' एक plural noun है और sentence में subject के साथ 'they' का प्रयोग करना सही है। साथ ही, 'are' को Verb की रूप में इस्तेमाल किया जाएगा। उदाहरण— Humans like to think that they are the smartest species on Earth.\n\n<strong>'they are the largest creatures'</strong> will be used instead of 'it is the largest creatures' because 'humans' is a plural noun and the subject should agree with 'they'. Also, 'are' is the appropriate verb form. Like— Humans like to think that they are the smartest species on Earth."}, {"id": "144265", "question": "<strong>Select the most appropriate homophone to fill in the blank.</strong></p> <p>The ointment will help to _____ the wound.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> heel", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> kneel", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> heal", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> he’ll"], "correct_answer": 2, "solution": "C) <strong>'Heal'</strong> का use होगा क्योंकि \"heal\" का अर्थ है घाव या चोट को ठीक करना। sentence में बताया गया है कि मरहम घाव को ठीक करने में मदद करेगा, इसलिए 'heal' यहाँ सही है। जबकि 'Heel' का अर्थ है एड़ी, जो इस संदर्भ में सही नहीं है, 'Kneel' का अर्थ है घुटनों के बल झुकना, जो इस संदर्भ में अनुपयुक्त है, और 'He’ll' एक संक्षिप्त रूप है \"he will\" का, जो sentence में सही नहीं है।\n\n<strong>'Heal'</strong> will be used because it means to cure or make an injury better. The sentence suggests that the ointment will help improve the wound, making 'heal' the correct choice.\n\nWhereas, 'Heel' means the back part of the foot, which doesn’t fit the context, 'Kneel' means to bend down on knees, which is inappropriate here, and 'He’ll' is a contraction of \"he will,\" which doesn't suit the sentence grammatically."}, {"id": "144266", "question": "<strong>Parts of a sentence are given below in jumbled order. Arrange the parts in the correct order to form a meaningful sentence</strong>.</p> <p>(a) false news websites</p> <p>(b) spreading propaganda about politics</p> <p>(c) thrive because the advertisements and politicians</p> <p>(d) and social networking sites</p> <p>(e) make a lot of money", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> aedcb", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> aecbd", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> adecb", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> adcbe"], "correct_answer": 3, "solution": "D) <strong>adcbe</strong>\n\nfalse news websites and social networking sites thrive because the advertisements and politicians spreading propaganda about politics make a lot of money\n\n(a) false news websites is the subject of the sentence. This tells us who or what the sentence is about, so it should start the sentence.\n\n(d) and social networking sites further adds to the subject and logically follows after part (a), continuing the idea that both false news websites and social networking sites are involved.\n\n(c) thrive because the advertisements and politicians introduces the verb \"thrive\" and provides a reason for why these websites and sites thrive, forming the subject-verb relationship: \"False news websites and social networking sites thrive.\"\n\n(b) spreading propaganda about politics adds detail by explaining how these entities thrive—by spreading propaganda, clarifying the purpose.\n\n(e) make a lot of money gives the outcome of this process, showing that they benefit financially, thus concluding the sentence."}, {"id": "144267", "question": "<strong>Select the option that expresses the given sentence in passive voice</strong>.</p> <p>They are building a new hospital in the city.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> A new hospital will be built in the city by them.", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> A new hospital is being built in the city by them.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> A new hospital was built in the city by them.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> A new hospital has been built in the city by them"], "correct_answer": 1, "solution": "B) A new hospital is being built in the city by them.\n\nActive Voice को Passive Voice में बदलने के लिए (Object + Auxiliary Verb + Being + Past Participle + by + Subject) का use किया जाता है, जब sentence Continuous Tense में हो। वाक्य ‘They are building a new hospital in the city’ को Passive Voice में बदलते समय Object ‘a new hospital’ को वाक्य की शुरुआत में रखा जाता है। Verb ‘are building’ को Passive Voice में बदलकर ‘is being built’ किया जाता है, और Subject ‘they’ को अंत में ‘by them’ के रूप में रखा गया है।\n\nTo convert Active Voice into Passive Voice for a Continuous Tense, the structure (Object + Auxiliary Verb + Being + Past Participle + by + Subject) is used. In the sentence ‘They are building a new hospital in the city’, the object ‘a new hospital’ is placed at the beginning, and the verb ‘are building’ is changed to ‘is being built’. The subject ‘they’ is placed at the end as ‘by them’. Therefore, the correct answer is (A new hospital is being built in the city by them)."}, {"id": "144268", "question": "<strong>Select the most appropriate ANTONYM of the given word</strong>.</p> <p>Attack", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Ambush", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Engagement", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Defence", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Production"], "correct_answer": 2, "solution": "C) <strong>Attack</strong> (noun) – An aggressive and violent action against a person or place. हमला\n\nAntonym: <strong>Defence</strong> (noun) – The action of resisting an attack or protecting from harm. रक्षा\n\n<strong>Ambush</strong> (noun) – A surprise attack by people lying in wait in a concealed position. घात\n\n<strong>Engagement</strong> (noun) – A fight or battle between armed forces. भिड़ंत\n\n<strong>Production</strong> (noun) – The action of making or manufacturing from components or raw materials. उत्पादन"}, {"id": "144269", "question": "S<strong>elect the most appropriate meaning of the following idiom.</strong></p> <p>To bring to light", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> To disclose", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> To disengage", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> To engage in conversation", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> To lighten"], "correct_answer": 0, "solution": "A) <strong>To bring to light</strong> (idiom) – To disclose (प्रकट करना<span dir=\"RTL\">(</span>"}, {"id": "144270", "question": "<strong>Parts of a sentence are given below in jumbled order. Arrange the parts in the correct order to form a meaningful sentence</strong>.</p> <p>P) willing to go</p> <p>Q) is not</p> <p>R) my son</p> <p>S) camping", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> PQRS", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> RQPS", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> QRSP", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> SPRQ"], "correct_answer": 1, "solution": "B) <strong>RQPS</strong>\n\nmy son is not willing to go camping\n\n(R) starts with \"my son\" as the subject.\n\n(Q) follows with \"is not,\" which establishes the verb.\n\n(P) comes next with \"willing to go,\" explaining the action.\n\n(S) concludes with \"camping,\" specifying where or for what"}, {"id": "144271", "question": "<strong>Select the correct spelling to fill in the blank</strong>.</p> <p>The thought of eating half-cooked food under compulsion fills me with _____.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> ripugnance", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> repugnence", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> repegnance", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> repugnance"], "correct_answer": 3, "solution": "D) The correct spelling of the word is ‘<strong>Repugnance’</strong> (option D), which means “intense disgust” or \"strong feeling of dislike or opposition\" (घृणा, विरोध)."}, {"id": "144272", "question": "<strong>Select the most appropriate ANTONYM of the word in the brackets to fill in the blank.</strong></p> <p>The chef requires ______ vegetables for the salad. [stale]", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> leafy", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> green", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> fresh", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Cut"], "correct_answer": 2, "solution": "C) <strong>Stale</strong> (adjective) – Not fresh, old, or spoiled. बासी\n\nAntonym: <strong>Fresh</strong> (adjective) – Recently made, obtained, or picked; not stale. ताज़ा\n\n<strong>Leafy</strong> (adjective) – Having a lot of leaves or relating to leaves. पत्तेदार\n\n<strong>Green</strong> (adjective) – Of the color between blue and yellow, or relating to unripe or young vegetables. हरा\n\n<strong>Cut</strong> (adjective) – Separated into parts by a cutting process. कटा हुआ"}, {"id": "144273", "question": "<strong>Select the correct meaning of the underlined idiom in the following sentence.</strong></p> <p>Rina <ins><strong>pulled a long face</strong></ins> since her husband had not bought her a diamond necklace on their anniversary.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> To be electrified", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> To look saddened", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> To be ecstatic", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> To be euphoric"], "correct_answer": 1, "solution": "<strong>B) Pulled a long face (idiom)</strong> – To look saddened उदास दिखना"}, {"id": "144274", "question": "<strong>Select the sentence that has a grammatical error</strong>", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> It is impossible to wake Christine up in the morning.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> It is said that Joseph was not ready to go to war.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Karl Marx was a renowned social scientist.", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Indian force are known for their loyalty and integrity"], "correct_answer": 3, "solution": "D) Indian force are known for their loyalty and integrity\n\nare' के बदले <strong>'is'</strong> का use होगा क्योंकि 'Indian force' को एक इकाई (singular) के रूप में देखा जाता है, इसलिए verb भी singular होगी; जैसे— The police is responsible for maintaining order.\n\n<strong>'is'</strong> will be used instead of 'are' because 'Indian force' is considered a singular entity, so the verb should also be singular; Like— The police is responsible for maintaining order."}, {"id": "144275", "question": "<strong>Comprehension</strong>:</p> <p><strong>In the following passage, some words have been del
