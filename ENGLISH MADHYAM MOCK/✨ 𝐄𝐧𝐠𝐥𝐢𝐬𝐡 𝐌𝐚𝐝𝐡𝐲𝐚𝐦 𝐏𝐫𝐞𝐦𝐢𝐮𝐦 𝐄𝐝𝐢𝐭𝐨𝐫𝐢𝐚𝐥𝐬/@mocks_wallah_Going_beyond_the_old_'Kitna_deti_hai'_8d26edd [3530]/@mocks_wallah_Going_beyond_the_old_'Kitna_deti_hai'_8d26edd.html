<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6366f1">
    <title>devgagan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #06b6d4;
            
            --glass-bg: rgba(255, 255, 255, 0.95);  /* Changed from 0.25 to 0.95 */
            --glass-border: rgba(255, 255, 255, 0.8);  /* Changed from 0.18 to 0.8 */
            --shadow-light: 0 8px 32px rgba(31, 38, 135, 0.37);
            --shadow-heavy: 0 20px 60px rgba(0, 0, 0, 0.3);
            
            --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --bounce: cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        
[data-theme="light"] {
    --bg: #ffffff;  /* Changed from gradient to solid white */
    --card-bg: #ffffff;  /* Changed from transparent to solid white */
    --text: #1a202c;
    --text-secondary: #4a5568;
    --border: rgba(0, 0, 0, 0.1);  /* Changed to darker border for contrast */
    --nav-bg: #ffffff;  /* Changed from transparent to solid white */
}

[data-theme="dark"] {
    --bg: #1a1a2e;  /* Changed from gradient to solid dark */
    --card-bg: #16213e;  /* Changed from transparent to solid dark */
    --text: #f7fafc;
    --text-secondary: #a0aec0;
    --border: rgba(255, 255, 255, 0.1);
    --nav-bg: #0c0c0c;  /* Changed from transparent to solid dark */
}
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--bg);  /* Now just using the solid color */
    z-index: -1;
}
        
        /* Floating particles animation */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: float 6s infinite ease-in-out;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.7; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 0.3; }
        }
        
        /* Header with glassmorphism */
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 16px 20px;
            z-index: 100;
            transition: var(--transition);
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .menu-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            font-size: 18px;
        }
        
        .menu-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-light);
        }
        
        .menu-btn:active {
            transform: scale(0.95);
        }
        
        .logo {
            font-weight: 800;
            font-size: 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        
        [data-theme="dark"] .logo {
    background: none;
    -webkit-text-fill-color: white; /* White text in dark mode */
    color: white; /* Fallback */
}
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            backdrop-filter: blur(10px);
            font-size: 20px;
        }
        
        .theme-toggle:hover {
            transform: rotate(180deg) scale(1.1);
            box-shadow: var(--shadow-light);
        }
        
        /* Advanced Timer */
        .timer-container {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .timer {
            background: linear-gradient(135deg, var(--error), #dc2626);
            color: white;
            padding: 12px 16px;
            border-radius: 16px;
            font-family: 'Inter', monospace;
            font-weight: 600;
            font-size: 14px;
            box-shadow: var(--shadow-light);
            position: relative;
            overflow: hidden;
        }
        
        .timer.warning {
            animation: pulse 1s infinite;
        }
        
        .timer.critical {
            animation: shake 0.5s infinite;
            background: linear-gradient(135deg, #dc2626, #991b1b);
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
        }
        
        .progress-ring {
            width: 40px;
            height: 40px;
            transform: rotate(-90deg);
        }
        
        .progress-circle {
            fill: none;
            stroke: rgba(255, 255, 255, 0.3);
            stroke-width: 3;
        }
        
        .progress-circle.progress {
            stroke: var(--primary);
            stroke-linecap: round;
            transition: stroke-dashoffset 0.3s ease;
        }
        
        /* Main Content */
        .main {
            margin: 80px 0 100px;
            padding: 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .question-container {
    background: var(--card-bg);  /* Now uses solid color */
    /* Remove or reduce blur effect */
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 32px;
    box-shadow: var(--shadow-heavy);
    position: relative;
    overflow: hidden;
    transition: var(--transition);
}
        .question-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--info));
            background-size: 200% 100%;
            animation: gradient-flow 3s linear infinite;
        }
        
        @keyframes gradient-flow {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }
        
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        
        .question-number {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 12px 20px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 14px;
            box-shadow: var(--shadow-light);
            position: relative;
        }
        
        .question-info {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }
        
        .question-progress {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
        }
        
        .question-marks {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 600;
        }
        
        .question-text {
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 32px;
            color: var(--text);
            font-weight: 500;
        }
        
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .option {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 2px solid var(--border);
            border-radius: 20px;
            padding: 20px 24px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            font-size: 16px;
            font-weight: 500;
            color: var(--text);
            overflow: hidden;
        }
        
        .option::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s;
        }
        
        .option:hover::before {
            left: 100%;
        }
        
        .option:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: var(--shadow-light);
        }
        
        .option:active {
            transform: scale(0.98);
        }

        .menu-btn, .theme-toggle, .nav-btn.prev, .action-btn.flag {
    background: var(--card-bg);  /* Solid background */
    backdrop-filter: none;  /* Remove blur */
}

.sidebar {
    background: var(--card-bg);  /* Solid background */
    backdrop-filter: none;  /* Remove blur */
}
        
        .option.selected {
            background: rgba(99, 102, 241, 0.15);
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-light);
        }
        
        .option.correct {
            background: rgba(16, 185, 129, 0.15);
            border-color: var(--success);
            color: var(--success);
        }
        
        .option.incorrect {
            background: rgba(239, 68, 68, 0.15);
            border-color: var(--error);
            color: var(--error);
        }
        
        .option.disabled {
            background: rgba(160, 174, 192, 0.1);
            border-color: var(--text-secondary);
            color: var(--text-secondary);
            cursor: not-allowed;
        }
        
        .option-indicator {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }
        
        .option.selected .option-indicator {
            background: var(--primary);
            color: white;
        }
        
        .option.correct .option-indicator {
            background: var(--success);
            color: white;
        }
        
        .option.incorrect .option-indicator {
            background: var(--error);
            color: white;
        }
        
        .option:not(.selected):not(.correct):not(.incorrect) .option-indicator {
            border: 2px solid var(--border);
        }
        
        /* Solution Panel */
        .solution-panel {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.1), rgba(245, 158, 11, 0.05));
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 20px;
            padding: 24px;
            margin-top: 24px;
            backdrop-filter: blur(10px);
            transform: translateY(20px);
            opacity: 0;
            transition: var(--transition);
        }
        
        .solution-panel.show {
            transform: translateY(0);
            opacity: 1;
        }
        
        .solution-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            color: var(--warning);
            font-weight: 700;
        }
        
        .solution-content {
            color: var(--text);
            line-height: 1.6;
            font-size: 15px;
        }
        
        /* Navigation */
        .navigation {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            padding: 16px 20px;
            z-index: 90;
        }
        
        .nav-content {
            display: flex;
            gap: 12px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .nav-btn {
            flex: 1;
            padding: 16px 24px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        
        .nav-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.6s;
        }
        
        .nav-btn:hover::before {
            left: 100%;
        }
        
        .nav-btn:active {
            transform: scale(0.95);
        }
        
        .nav-btn.prev {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text);
            backdrop-filter: blur(10px);
        }
        
        .nav-btn.next {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: var(--shadow-light);
        }
        
        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .nav-btn:disabled::before {
            display: none;
        }
        
        /* Question Panel Sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid var(--border);
            z-index: 200;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-heavy);
        }
        
        .sidebar.open {
            right: 0;
        }
        
        .sidebar-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .sidebar-title {
            font-weight: 800;
            font-size: 20px;
        }
        
        .close-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        
        .close-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(90deg);
        }
        
        .sidebar-body {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
        }
        
        .questions-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 32px;
        }
        
        .question-btn {
            background: var(--card-bg);
            border: 2px solid var(--border);
            color: var(--text-secondary);
            width: 48px;
            height: 48px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            position: relative;
        }
        
        .question-btn:hover {
            transform: scale(1.1);
            box-shadow: var(--shadow-light);
        }
        
        .question-btn:active {
            transform: scale(0.95);
        }
        
        .question-btn.current {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: var(--shadow-light);
        }
        
        .question-btn.answered {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border-color: var(--success);
        }
        
        .question-btn.correct {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }
        
        .question-btn.incorrect {
            background: var(--error);
            color: white;
            border-color: var(--error);
        }
        
        .question-btn.flagged::after {
            content: '🚩';
            position: absolute;
            top: -4px;
            right: -4px;
            font-size: 10px;
        }
        
        /* Legend */
        .legend {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 32px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .legend-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        
        .legend-dot.current { background: var(--primary); }
        .legend-dot.answered { background: var(--success); }
        .legend-dot.unattempted { background: var(--text-secondary); }
        .legend-dot.flagged { background: var(--warning); }
        
        /* Action Buttons */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .action-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }
        
        .action-btn.flag {
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        
        .action-btn.submit {
            background: linear-gradient(135deg, var(--error), #dc2626);
            color: white;
            box-shadow: var(--shadow-light);
        }
        
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-heavy);
        }
        
        .action-btn:active {
            transform: scale(0.98);
        }
        
        /* Overlay */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 150;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }
        
        .overlay.show {
            opacity: 1;
            visibility: visible;
        }
        
        /* Result Modal */
        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 32px;
            max-width: 90vw;
            width: 480px;
            z-index: 300;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
            box-shadow: var(--shadow-heavy);
            overflow: hidden;
        }
        
        .modal.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }
        
        .modal-header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 40px 32px;
            text-align: center;
        }
        
        .modal-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        
        .modal-subtitle {
            opacity: 0.9;
            font-size: 16px;
            font-weight: 500;
        }
        
        .modal-body {
            padding: 32px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            text-align: center;
            padding: 20px 16px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }
        
        .stat-label {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        
        .stat-value {
            color: var(--text);
            font-size: 24px;
            font-weight: 800;
        }
        
        .final-score {
            background: linear-gradient(135deg, var(--success), #059669);
            color: white;
            border-radius: 20px;
            padding: 32px;
            text-align: center;
            margin-bottom: 24px;
            box-shadow: var(--shadow-light);
        }
        
        .score-text {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        
        .percentage-text {
            opacity: 0.9;
            font-size: 18px;
            font-weight: 600;
        }
        
        .modal-actions {
            display: flex;
            gap: 12px;
        }
        
        .modal-btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(10px);
        }
        
        .modal-btn.primary {
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary);
            border: 1px solid rgba(99, 102, 241, 0.3);
        }
        
        .modal-btn.success {
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        
        .modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-light);
        }
        
        /* Auto-save indicator */
        .auto-save {
            position: fixed;
            top: 80px;
            right: 20px;
            background: var(--success);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            transform: translateX(100px);
            opacity: 0;
            transition: var(--transition);
            z-index: 90;
        }
        
        .auto-save.show {
            transform: translateX(0);
            opacity: 1;
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .header-content {
                padding: 0 4px;

        // Core Variables
        const questions = [{"id": "153961", "question": "<strong>Comprehension</strong>:<br> India's roads go the distance - 6.6 mn km to be precise, second only to the US. But scale has come at a cost. Poor design, crumbling surfaces and erratic signages have turned stretches into death traps. And while infrastructure plays a role, 'the biggest cause of road accidents', as Nitin Gadkari said in 2023, 'is human behaviour'. Every year, 1,78,000 lives are lost in road crashes, with 80% of fatalities linked to speeding or unsafe vehicles. But, out of this grim record, a welcome shift is taking shape. In a market long ruled by affordability, safety is emerging as a key, well, driver. 5-star Bharat NCAP (New Car Assessment Programme)-rated vehicles made up 15% of all passenger vehicle sales in Q1 2025 - up from 10% a year earlier. Sales of top-rated models rose 12% in 2024, even as overall car sales grew 4.3%.</p> <p>Features once seen as luxuries - 6 airbags, electronic stability control (ESC), anti-lock braking system (ABS), electronic brakeforce distribution (EBD), Isofix mounts (for child safety), etc - are fast becoming standard. With Global NCAP and Bharat NCAP crash-testing Indian cars, buyers now have clearer insight into structural safety. Poor safety ratings have also pushed manufacturers to use high-tensile steel more widely and offer extras like 360° pivot cameras, remote surveillance and driving alerts.</p> <p>This expanding view of safety is reshaping India's $137 bn auto industry, set to grow to $203 bn by 2030. Carmakers are doubling down on R&amp;D, especially around crash protection and vehicle integrity. The goal to halve road fatalities by 2030 is ambitious, but achievable. Tech and regulation can take us far. But the final stretch depends on us. Because half the battle is engineering. The other half is in the driver's seat.</p> <p><strong>What is the tone of the passage?</strong>", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"http y affordability, safety is emerging as a key, well, driver. 5-star Bharat NCAP (New Car Assessment Programme)-rated vehicles made up 15% of all passenger vehicle sales in Q1 2025 - up from 10% a year earlier. Sales of top-rated models rose 12% in 2024, even as overall car sales grew 4.3%.</p> <p>Features once seen as luxuries - 6 airbags, electronic stability control (ESC), anti-lock braking system (ABS), electronic brakeforce distribution (EBD), Isofix mounts (for child safety), etc - are fast becoming standard. With Global NCAP and Bharat NCAP crash-testing Indian cars, buyers now have clearer insight into structural safety. Poor safety ratings have also pushed manufacturers to use high-tensile steel more widely and offer extras like 360° pivot cameras, remote surveillance and driving alerts.</p> <p>This expanding view of safety is reshaping India's $137 bn auto industry, set to grow to $203 bn by 2030. Carmakers are doubling down on R&amp;D, especially around crash protection and vehicle integrity. The goal to halve road fatalities by 2030 is ambitious, but achievable. Tech and regulation can take us far. But the final stretch depends on us. Because half the battle is engineering. The other half is in the driver's seat.</p> <p><strong>Why is the shift towards safety-rated vehicles in India considered significant, according to the passage?</strong>", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> It directly correlates with rising fuel prices and vehicle maintenance costs.", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> It represents a move away from affordability-focused buying to life-saving priorities.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> It is driven by international mandates on automobile safety standards.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> It reflects the Indian government’s success in reducing road construction costs."], "correct_answer": 1, "solution": "No solution available"}, {"id": "153964", "question": "<strong>Comprehension</strong>:<br> India's roads go the distance - 6.6 mn km to be precise, second only to the US. But scale has come at a cost. Poor design, crumbling surfaces and erratic signages have turned stretches into death traps. And while infrastructure plays a role, 'the biggest cause of road accidents', as Nitin Gadkari said in 2023, 'is human behaviour'. Every year, 1,78,000 lives are lost in road crashes, with 80% of fatalities linked to speeding or unsafe vehicles. But, out of this grim record, a welcome shift is taking shape. In a market long ruled by affordability, safety is emerging as a key, well, driver. 5-star Bharat NCAP (New Car Assessment Programme)-rated vehicles made up 15% of all passenger vehicle sales in Q1 2025 - up from 10% a year earlier. Sales of top-rated models rose 12% in 2024, even as overall car sales grew 4.3%.</p> <p>Features once seen as luxuries - 6 airbags, electronic stability control (ESC), anti-lock braking system (ABS), electronic brakeforce distribution (EBD), Isofix mounts (for child safety), etc - are fast becoming standard. With Global NCAP and Bharat NCAP crash-testing Indian cars, buyers now have clearer insight into structural safety. Poor safety ratings have also pushed manufacturers to use high-tensile steel more widely and offer extras like 360° pivot cameras, remote surveillance and driving alerts.</p> <p>This expanding view of safety is reshaping India's $137 bn auto industry, set to grow to $203 bn by 2030. Carmakers are doubling down on R&amp;D, especially around crash protection and vehicle integrity. The goal to halve road fatalities by 2030 is ambitious, but achievable. Tech and regulation can take us far. But the final stretch depends on us. Because half the battle is engineering. The other half is in the driver's seat.</p> <p>In the line “half the battle is engineering. The other half is in the driver's seat,” what is the closest meaning of the idiom \"<strong>half the battle</strong>\" as used in the context?", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Engineering solutions are more important than human behavior", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The hardest part is completed once the car is designed", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Solving part of the problem makes success likely but not certain", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Accidents can be prevented solely by improving road infrastructure"], "correct_answer": 2, "solution": "No solution available"}, {"id": "153965", "question": "<strong>Comprehension</strong>:<br> India's roads go the distance - 6.6 mn km to be precise, second only to the US. But scale has come at a cost. Poor design, crumbling surfaces and erratic signages have turned stretches into death traps. And while infrastructure plays a role, 'the biggest cause of road accidents', as Nitin Gadkari said in 2023, 'is human behaviour'. Every year, 1,78,000 lives are lost in road crashes, with 80% of fatalities linked to speeding or unsafe vehicles. But, out of this grim record, a welcome shift is taking shape. In a market long ruled by affordability, safety is emerging as a key, well, driver. 5-star Bharat NCAP (New Car Assessment Programme)-rated vehicles made up 15% of all passenger vehicle sales in Q1 2025 - up from 10% a year earlier. Sales of top-rated models rose 12% in 2024, even as overall car sales grew 4.3%.</p> <p>Features once seen as luxuries - 6 airbags, electronic stability control (ESC), anti-lock braking system (ABS), electronic brakeforce distribution (EBD), Isofix mounts (for child safety), etc - are fast becoming standard. With Global NCAP and Bharat NCAP crash-testing Indian cars, buyers now have clearer insight into structural safety. Poor safety ratings have also pushed manufacturers to use high-tensile steel more widely and offer extras like 360° pivot cameras, remote surveillance and driving alerts.</p> <p>This expanding view of safety is reshaping India's $137 bn auto industry, set to grow to $203 bn by 2030. Carmakers are doubling down on R&amp;D, especially around crash protection and vehicle integrity. The goal to halve road fatalities by 2030 is ambitious, but achievable. Tech and regulation can take us far. But the final stretch depends on us. Because half the battle is engineering. The other half is in the driver's seat.</p> <p><strong>From the passage, which conclusion can be drawn about the trend in safety-rated vehicles versus total vehicle sales between 2024 and Q1 2025?</strong>", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Sales of top-rated vehicles are growing faster than the overall car market", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Overall car sales growth is outpacing the growth in safety-rated vehicles", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Market preference has stagnated despite safety awareness initiatives", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> The demand for safety features has no impact on manufacturing trends"], "correct_answer": 0, "solution": "No solution available"}, {"id": "153966", "question": "<strong>Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the right order to form a meaningful and coherent paragraph.</strong></p> <p><strong>A.</strong> There lived a foolish king in a large kingdom.</p> <p><strong>B.</strong> He thought that it will be a good joke.</p> <p><strong>C</strong>. He did not realise that what he thought of as a joke would cost him heavily.</p> <p><strong>D.</strong> The king once decided to throw all his ministers in prison for a day.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> ADBC", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> DABC", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> ABCD", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> ACBD"], "correct_answer": 0, "solution": "A) ADBC\n\nA starts the paragraph by introducing the subject (\"a foolish king\") and the setting (\"in a large kingdom\").<br> D follows A because it introduces the action taken by the king (\"decided to throw all his ministers in prison for a day\"). This logically follows the introduction of the king.\n\nB comes after D as it explains the king's thought process behind his action (\"He thought that it will be a good joke\"). This connects to the action described in D.\n\nC concludes the paragraph by revealing the consequence of the king's foolishness (\"He did not realise that what he thought of as a joke would cost him heavily\"). This provides a logical ending to the sequence.<br> <strong>In Hindi</strong>\n\nA paragraph की शुरुआत करता है, क्योंकि यह subject (\"a foolish king\") और setting (\"in a large kingdom\") को introduce करता है।\n\nD, A के बाद आता है क्योंकि यह king के action (\"decided to throw ministers in prison\") को बताता है, जो subject से जुड़ता है।\n\nB, D के बाद आता है क्योंकि यह king की thought process (\"He thought it was a joke\") को explain करता है, जो action से जुड़ता है।\n\nC paragraph को conclude करता है, क्योंकि यह consequence (\"it cost him heavily\") बताता है, जो king की foolishness को दिखाता है।"}, {"id": "153967", "question": "<strong>Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the right order to form a meaningful and coherent paragraph.</strong></p> <p><strong>A.</strong> Sculpture and painting form an integral part of temple architecture.</p> <p><strong>B.</strong> The city is visited by thousands curious to see the temple in the form of a chariot.</p> <p><strong>C.</strong> The finest example of this is Konark Temple in Puri.</p> <p><strong>D</strong>. The chariot with immense wheels and horses is carved from stone", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> ACBD", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> ABCD", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> BCDA", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> BCAD"], "correct_answer": 0, "solution": "A) ACBD\n\nA starts the sentence with the subject \"Sculpture and painting,\" which tells us what forms an integral part of temple architecture.\n\nC follows A as it introduces the phrase \"The finest example of this,\" referring back to the temple architecture mentioned in A. This establishes a clear connection: Sculpture and painting are part of temple architecture, and Konark Temple is the best example.\n\nB comes next as it introduces \"The city,\" referring to Puri (mentioned in C), and explains that thousands visit it to see the chariot-shaped temple. This connects logically by specifying the location and its significance.\n\nD concludes the sentence by describing \"The chariot,\" which was mentioned in B, and provides details about its stone carvings, wheels, and horses. This completes the description of the temple’s unique architecture.<br> <strong>In Hindi</strong>\n\nA sentence की शुरुआत करता है, क्योंकि यह subject \"Sculpture and painting\" को introduce करता है, जो बताता है कि मंदिर वास्तुकला का कौन-सा हिस्सा है।\n\nC, A के बाद आता है, क्योंकि यह phrase \"The finest example of this\" को introduce करता है, जो A में बताए गए temple architecture से जुड़ता है। इससे एक स्पष्ट connection बनता है: मूर्तिकला और चित्रकला मंदिर वास्तुकला का हिस्सा हैं, और कोणार्क मंदिर इसका सबसे अच्छा उदाहरण है।\n\nB, C के बाद logically fit होता है, क्योंकि यह \"The city\" (Puri, जिसका C में जिक्र हुआ) को introduce करता है और बताता है कि हज़ारों लोग रथ के आकार वाले मंदिर को देखने आते हैं।\n\nD sentence को complete करता है, क्योंकि यह \"The chariot\" (जिसका B में जिक्र हुआ) के बारे में विस्तार से बताता है, जैसे कि यह पत्थर से बना है, इसके पहिए और घोड़े हैं। इससे मंदिर की वास्तुकला का पूरा विवरण समाप्त होता है।"}, {"id": "153968", "question": "<strong>Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the right order to form a meaningful and coherent paragraph.</strong></p> <p><strong>A.</strong> According to his hypothesis, now known as the neuron theory, each nerve cell communicates with others through contiguity rather than continuity.</p> <p><strong>B.</strong> The watershed of all studies of the nervous system was an observation made in 1889 by Spanish scientist Santiago Ramón y Cajal.</p> <p><strong>C</strong>. It has since been proved that Cajal’s theory is not universally true, but his central idea has remained an accurate guiding principle for all further study.</p> <p><strong>D.</strong> That is, communication between adjacent but separate cells must take place across the space and barriers separating them", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> CDAB", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> BADC", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> BCDA", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> ADCB"], "correct_answer": 1, "solution": "B) BADC\n\nB starts the paragraph by introducing the subject \"Spanish scientist Santiago Ramón y Cajal\" and his observation, which sets the context for the discussion.\n\nA follows B because it explains Cajal's hypothesis (the neuron theory), which is directly related to his observation mentioned in B. The phrase \"his hypothesis\" refers back to Cajal, maintaining grammatical continuity.\n\nD comes after A as it provides further clarification on the concept introduced in A (\"contiguity rather than continuity\"). The phrase \"That is\" signals an explanation, linking it logically to the previous sentence.\n\nC concludes the paragraph by discussing the validity of Cajal's theory in modern times, contrasting it with the initial hypothesis while affirming its importance. The phrase \"It has since been proved\" refers back to the theory mentioned in A, ensuring coherence.<br> <strong>In Hindi</strong><br> B paragraph की शुरुआत करता है क्योंकि यह subject \"Spanish scientist Santiago Ramón y Cajal\" और उनके observation को introduce करता है, जो discussion के लिए context set करता है।\n\nA, B के बाद आता है क्योंकि यह Cajal के hypothesis (neuron theory) को explain करता है, जो B में उल्लिखित observation से directly related है। \"His hypothesis\" वाक्यांश Cajal को refer करता है, जिससे grammatical continuity बनी रहती है।\n\nD, A के बाद आता है क्योंकि यह A में introduce किए गए concept (\"contiguity rather than continuity\") को और स्पष्ट करता है। \"That is\" वाक्यांश एक explanation का संकेत देता है, जो इसे पिछले वाक्य से logically जोड़ता है।\n\nC paragraph को conclude करता है क्योंकि यह Cajal के theory की modern times में validity पर चर्चा करता है, जो initial hypothesis के साथ contrast करते हुए भी उसके महत्व को reaffirm करता है। \"It has since been proved\" वाक्यांश A में उल्लिखित theory को refer करता है, जिससे coherence बनी रहती है।"}, {"id": "153969", "question": "<strong>Sentences of a paragraph are given below in jumbled order. Arrange the sentences in the right order to form a meaningful and coherent paragraph.</strong></p> <p><strong>A.</strong> Dad: “Yes, tell me.”</p> <p><strong>B</strong>. Laxmi: “Dad, I need to speak to you.”</p> <p><strong>C</strong>. Dad: “I think you are still too young for it.”</p> <p><strong>D</strong>. Laxmi: “Please buy me a scooter.”", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> BADC", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> BCDA", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> ABDC", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> DCBA"], "correct_answer": 0, "solution": "A) BADC\n\nB starts the paragraph because it introduces the subject \"Laxmi\" and her intention to speak to her dad. This sets up the context for the conversation.\n\nA follows B because it is Dad’s response, acknowledging Laxmi’s request to speak. The word \"Yes\" directly connects to Laxmi’s statement in B, forming a natural question-answer flow.\n\nD comes next as it is Laxmi’s reply to her dad, making a request (\"Please buy me a scooter\"). This logically follows Dad’s permission to speak (A).\n\nC concludes the paragraph as it is Dad’s reaction to Laxmi’s request. The pronoun \"it\" refers back to the scooter mentioned in D, creating a grammatical link.<br> <strong>In Hindi</strong>\n\nB paragraph की शुरुआत करता है क्योंकि यह subject \"Laxmi\" को introduce करता है और उसके पिता से बात करने के इरादे को बताता है।\n\nA, B के बाद आता है क्योंकि यह पिता का जवाब है, जो Laxmi के बोलने के अनुरोध को स्वीकार करता है। \"Yes\" शब्द B से सीधे जुड़ता है।\n\nD, A के बाद आता है क्योंकि यह Laxmi का पिता से स्कूटर खरीदने का अनुरोध है, जो पिता के बोलने की अनुमति देने (A) के बाद आता है।\n\nC paragraph को समाप्त करता है क्योंकि यह पिता की प्रतिक्रिया है। \"it\" शब्द D में उल्लिखित स्कूटर को refer करता है, जिससे grammatical connection बनता है।"}, {"id": "153970", "question": "Select the <strong>INCORRECTLY</strong> spelt word.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Annivarsary", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Anguish", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Anonymous", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Announcement"], "correct_answer": 0, "solution": "A) </strong>The incorrect spelling in the given options is 'Annivarsary'. The correct spelling is <strong>'Anniversary'</strong>. <strong>सालगिरह'"}, {"id": "153971", "question": "<strong>Identify the idiom that best expresses the meaning of the underlined group of words.</strong></p> <p>\"If you <ins><strong>work or study hard</strong></ins>, you will achieve your goals.\"", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Burn the midnight oil", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Between Scylla and Charybdis", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> To go at each other hammer and tongs", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> To bell the cat"], "correct_answer": 0, "solution": "<strong>A) Burn the midnight oil (idiom)</strong> – to stay up late working on a project or task अधिक समय तक काम करना"}, {"id": "153972", "question": "<strong>Select the best express synonym of the given underlined word.</strong></p> <p>The plan to build a bridge on the unstable cliff was deemed <ins><strong>unviable</strong> </ins>due to the excessive risks and costs involved.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Mesmerisingly", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Prudently", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Serenely", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Impractical"], "correct_answer": 3, "solution": "<strong>D) Unviable</strong> (adjective) – Impractical, infeasible, unworkable, non-viable, impossible अमल में न लाने योग्य\n\n<strong>Synonym</strong>: <strong>Impractical</strong> (adjective) – Not practical or realistic. अव्यावहारिक\n\n<strong>Mesmerisingly</strong> (adverb) – In a manner that captures one's complete attention as if by magic. मंत्रमुग्ध कर देने वाला\n\n<strong>Prudently</strong> (adverb) – Acting with or showing care and thought for the future. बुद्धिमानी से\n\n<strong>Serenely</strong> (adverb) – In a calm, peaceful, and untroubled manner. शांति से"}, {"id": "153973", "question": "<strong>Select the best express synonym of the given underlined word.</strong></p> <p>The agreement was finally <ins><strong>ratified</strong> </ins>after months of negotiations, confirming all terms and conditions.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Approved", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Ludicrous", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Infrequent", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Routine"], "correct_answer": 0, "solution": "<strong>A) Ratify</strong> (verb) – Approve formally, sanction, confirm, validate पुष्टि करना\n\n<strong>Synonym: Approved</strong> (verb) – Accepted, agreed upon, sanctioned, ratified. मंजूर किया गया\n\n<strong>Ludicrous</strong> (adjective) – Absurd, ridiculous, foolish, laughable, comical. हास्यास्पद\n\n<strong>Infrequent</strong> (adjective) – Not occurring often, rare, scarce, sparse. दुर्लभ\n\n<strong>Routine</strong> (adjective) – Regular, customary, usual, ordinary. सामान्य"}, {"id": "153974", "question": "<strong>In the sentence identify the segment which contains the grammatical error.</strong></p> <p>Participating in the Republic Day Parade are considered an honour by many people", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> by many people", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> are considered an honour", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> the Republic Day Parade", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> participating in"], "correct_answer": 1, "solution": "<strong>B) are considered' </strong>के बदले 'is considered' का प्रयोग होगा क्योंकि 'Participating in the Republic Day Parade' एक Singular Subject है और Singular Subject के साथ Singular Verb 'is' का प्रयोग होता है; जैसे— Reading books is my hobby.\n\nis considered' will be used instead of 'are considered' because 'Participating in the Republic Day Parade' is a Singular Subject and with Singular Subject, Singular Verb 'is' is used; Like— Reading books is my hobby."}, {"id": "153975", "question": "<strong>In the given sentence, identify the segment which contains the grammatical error.</strong></p> <p>Despite warnings the driver continued to speed and have been caught by the traffic police.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> and have been caught", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Despite warnings", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> the driver continued to speed", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> by the traffi c police"], "correct_answer": 0, "solution": "<strong>A) have been caught'</strong> के बदले 'was caught' का प्रयोग होगा क्योंकि पूरे वाक्य में घटनाओं का वर्णन Past Tense में हो रहा है। इसलिए, घटना के परिणाम भी Past Tense में होने चाहिए; जैसे— He was warned but still continued to speed and was caught by the traffic police\n\n'was caught' will be used instead of 'have been caught' because the events in the sentence are described in Past Tense. Therefore, the outcome of the event should also be in Past Tense; Like— He was warned but still continued to speed and was caught by the traffic police"}, {"id": "153976", "question": "<strong>Identify the segment in the given sentence which contains the grammatical error.</strong></p> <p>Einstein’s school teachers thought he would never success in life.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> thought he would", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> never success", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> in life", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Einstein’s school teachers"], "correct_answer": 1, "solution": "<strong>B) 'never success'</strong> के स्थान पर 'never succeed' होगा क्योंकि 'success' एक Noun है जबकि यहाँ Verb की आवश्यकता है। 'Succeed' यहाँ सही रूप है क्योंकि यह एक Verb है जिसका अर्थ है 'सफल होना'। जैसे— He worked hard and finally succeeded.\n\nnever succeed' will be used instead of 'never success' because 'success' is a Noun, whereas a Verb is needed here. 'Succeed' is the correct form here as it is a Verb meaning 'to achieve success'. Like— He worked hard and finally succeeded."}, {"id": "153977", "question": "<strong>Choose the sentence with no spelling error.</strong>", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Motivatinal quotes will not help you.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Motivational quotes will not helpp you.", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Motivational quotes will not help you.", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Motivational qoutes will not help you."], "correct_answer": 2, "solution": "<strong>C) </strong>Motivational quotes will not help you"}, {"id": "153978", "question": "<strong>Select the most appropriate option to fill in the blank.</strong></p> <p>My friend, who is a photographer, is ________ a writer", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> also", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> too", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> again", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> and"], "correct_answer": 0, "solution": "<strong>A) Also'</strong> का use होगा क्योंकि 'also' का अर्थ होता है इसके अतिरिक्त या भी। Sentence में कहा गया है कि मेरा दोस्त, जो एक फोटोग्राफर है, एक लेखक भी है, इसलिए 'also' यहाँ सही है। 'Too' का उपयोग अक्सर सेंटेंस के अंत में किया जाता है और समान अर्थ प्रकट करता है, परन्तु इसका स्थान संरचना में 'also' से भिन्न होता है। 'Again' का अर्थ होता है एक बार फिर से, और 'And' एक संयोजक होता है, जो इस context में उपयुक्त नहीं हैं।\n\n<strong>'Also'</strong> should be used because it means in addition or as well. The sentence states that my friend, who is a photographer, is also a writer, making 'also' the correct choice here. 'Too' is often used at the end of a sentence and conveys a similar meaning but is positioned differently in sentence structure. 'Again' means once more, and 'And' is a conjunction, which aren't appropriate in this context"}, {"id": "153979", "question": "<strong>Select the most appropriate option to fill in the blank.</strong></p> <p>The age of the participants ______ an important factor in this competition.", "options": ["<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> is", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> do", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> has", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> are"], "correct_answer": 0, "solution": "<strong>A) Is'</strong> का use होगा क्योंकि subject \"The age of the participants\" singular है, जो कि सामूहिक उम्र को एक अकेले कारक के रूप में संदर्भित करता है। इसलिए, क्रिया भी singular होनी चाहिए ताकि वह subject से मेल खा सके। 'Do' and 'Are' का उपयोग plural subjects के साथ होता है, और 'Has' का उपयोग भी अक्सर singular subjects के लिए होता है लेकिन possessive संदर्भ में। यहाँ पर \"The age of the participants\" एक collective noun के रूप में कार्य कर रहा है जो singular है, इसलिए 'is' सही विकल्प है।\n\n<strong>Is'</strong> should be used because it matches the singular subject \"The age of the participants.\" 'Do' and 'Are' are used with plural subjects, and 'Has' is also used with singular subjects but in a possessive context. Here, \"The age of the participants\" acts as a collective noun which is singular, making 'is' the correct choice."}, {"id": "153980", "question": "<strong>Select the best express Antonym of the given underlined word.</strong></p> <p>The new policy changes <ins><strong>pertain</strong> </ins>to all employees, regardless of their department.", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Relate", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Concern", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> Apply to", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> Exclude"], "correct_answer": 3, "solution": "<strong>D) Pertain</strong> (to) (verb) – relate to, concern, apply to, connect with, be relevant to संबंधित होना\n\n<strong>Antonym: Exclude</strong> (verb) – Omit, leave out, disregard (अलग करना)\n\n<strong>Relate</strong> <strong>to</strong> (verb) – Concern, connect (संबंध रखना)\n\n<strong>Concern</strong> (verb) – Involve, affect (चिंतित करना)\n\n<strong>Apply</strong> <strong>to</strong> (verb) – Be relevant, concern (लागू होना)"}, {"id": "153981", "question": "<strong>Comprehension</strong>:</p> <p><strong>In the following passage, some words have been deleted. Fill in the blanks with the help of the alternatives given. Select the most appropriate option for each blank.</strong></p> <p>The Games were held every four years from 1924 until 1936, after which they were 1.___________ by World War II. The Olympics 2.__________ in 1948 and was 3.________ held every four years. Until 1992, the Winter and Summer Olympic Games were held in the same years, but in accordance with a 1986 4.__________ by the International Olympic Committee (IOC) to place the Summer and Winter Games on 5.__________ four-year cycles in alternating even-numbered years, the next Winter Olympics after 1992 was in 1994.</p> <p><strong>Q21. Select the most appropriate option to fill in the blank No.1.</strong>", "options": ["<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> complicated", "<p style=\"display:none\"><img alt=\"check\" src=\"https://englishmadhyam.info/public/exam-panel/img/check.png\"/></p> interrupted", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> corrupted", "<p style=\"display:none\"><img alt=\"reload\" src=\"https://englishmadhyam.info/public/exam-panel/img/reload.png\"/></p> solicited"], "correct_answer": 1, "solut
